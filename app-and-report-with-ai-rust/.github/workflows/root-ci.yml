# The root — its own CI.
#
# This repository holds the modelling language both products read, the published
# guide and viewers, the example models, and the build, seed and docker pieces
# that run the two together. The products themselves are separate repositories:
#
#   businessappwithai/app-with-ai-rust           the generator: a Loco (Rust)
#                                                backend + TanStack Start front end
#   businessappwithai/enterprise_reporting_rust  the reporting platform, whose
#                                                server side is its Loco backend
#
# `deps.json` names the commit of each that this repository is known to work
# with, and it is the only place those refs appear. The `resolve` job reads it
# and every other job checks out against its outputs, so moving a pin is one
# edit. `./deps.sh` reads the same file to place the same commits locally — a
# developer's tree and a runner check out identically.
#
# ── Why the checkouts are needed at all ─────────────────────────────────────
#
# Two modules under `common/language/cli` reach into app-with-ai-rust on
# purpose — the shipped JDM converter and the generation pipeline — so that
# the CLI and the modelling tool cannot disagree about what a rule flow compiles
# to. `jdm.ts` imports the converter unconditionally and sits on every
# generation path, so *every* --stack target needs that checkout, not only the
# heavy one, and `tsc` needs it to resolve the import at all: with the folder
# absent, tsc reports the two imports unresolvable and then two implicit-any
# parameters downstream of them — four errors that look like a broken file and
# are really a missing directory. That is why the `language` job checks it out
# even though it only type-checks and lints.
#
# `tanstack-astryx-loco` additionally drives the pipeline, which needs that
# repository's own dependencies installed: with a node_modules under common/ and
# none there, resolution stops here and the generate fails on
# `Cannot find package 'zod'`.
#
# Those files live in another repository, so `paths:` cannot watch them: a
# change to app-with-ai-rust does not trigger a run here. `build-and-run.yml`
# is what notices instead — it builds both repositories nightly, so a move that
# breaks generation surfaces within the day rather than on whichever pull
# request next happens to touch common/.
#
# ── The five checks ─────────────────────────────────────────────────────────
#
#   models   Every model checks clean, and the two copies of the shared examples
#            — language/examples and html/models — are still byte-identical. One
#            set is what the CLI reads, the other is what the published guide
#            serves.
#   types    `common/{language,build,scripts}/**` under the strict config.
#            Without @types/node and @types/bun installed, tsc reports thousands
#            of phantom errors instead — every `node:` builtin and every
#            `process` unresolvable. The manifest carries both, which is most of
#            why it exists.
#   lint     Biome over `common/language/` and `common/scripts/`, at
#            --diagnostic-level=error. The config is `language/biome.json`
#            rather than one at the repository root: a root config makes each
#            product's own config a "nested root" and Biome then refuses to run
#            at all. That is also why `bun run lint` is two commands — pointing
#            Biome at `language` and `scripts` in one invocation makes it find
#            that same file twice and fail the same way.
#   stacks   Every `--stack` the CLI offers actually generates, and so does the
#            shipped `appwithai` binary — a different entry point.
#   rust-cli The shipped `appwithai-gen` binary — the generator's Rust rewrite —
#            built with cargo and run over the same model. It needs a Rust
#            toolchain and nothing else here does, so it is its own job.
#
# A path-filtered run that is skipped reports no status at all, so if these jobs
# are ever made required checks they need a skip-path fallback too.

name: Root CI

# The two `paths:` lists below are identical and must stay so. GitHub Actions
# does not support YAML anchors, so there is no way to state them once.
#
# `deps.json` is in both: moving a pin changes what this workflow builds
# against, which is exactly when it should run.
on:
  push:
    branches: [main]
    paths:
      - "common/**"
      - "deps.json"
      - "deps.sh"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  pull_request:
    paths:
      - "common/**"
      - "deps.json"
      - "deps.sh"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# One bun pin. BUN_VERSION is what `check:language-tools` compares bundles
# under — `Bun.build` output depends on it — and the version the
# `--frozen-lockfile` install of app-with-ai-rust was verified against
# (that repository's own CI runs 1.4.2; its lockfile installs frozen on both).
#
# Moving it forward is a deliberate step, taken by running the checks.
env:
  BUN_VERSION: "1.4.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # deps.json is the single source of truth for what this repository builds
  # against. Reading it once here and passing the result down means a pin is
  # never restated in a `with:` block, where it would drift silently.
  resolve:
    name: Resolve pinned dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_repository: ${{ steps.read.outputs.app_repository }}
      app_ref: ${{ steps.read.outputs.app_ref }}
      report_repository: ${{ steps.read.outputs.report_repository }}
      report_ref: ${{ steps.read.outputs.report_ref }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read deps.json
        run: |
          set -euo pipefail
          read_dep() {
            jq -er --arg name "$1" --arg key "$2" \
              '.dependencies[] | select(.name == $name) | .[$key]' deps.json
          }
          {
            echo "app_repository=$(read_dep app-with-ai-rust repository)"
            echo "app_ref=$(read_dep app-with-ai-rust ref)"
            echo "report_repository=$(read_dep enterprise_reporting_rust repository)"
            echo "report_ref=$(read_dep enterprise_reporting_rust ref)"
          } | tee -a "$GITHUB_OUTPUT"

      # Both product repositories are private, and the workflow's own
      # GITHUB_TOKEN can read only this repository — actions/checkout then
      # fails with a bare "Repository not found", which reads like a wrong pin.
      # DEPS_TOKEN is a token with read access to both (a fine-grained PAT
      # with Contents: read on app-with-ai-rust and enterprise_reporting_rust,
      # or a GitHub App installation token). Say so here, once, instead.
      - name: Check the dependency token is configured
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -z "$DEPS_TOKEN" ]; then
            echo "::error title=DEPS_TOKEN is not set::app-with-ai-rust and enterprise_reporting_rust are private. Add a repository secret DEPS_TOKEN with read access (Contents: read) to both, then re-run."
            exit 1
          fi

  language:
    name: Models, types and lint
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 10
    defaults:
      run:
        working-directory: common

    steps:
      - uses: actions/checkout@v4

      # Source only — nothing is installed in it. `tsc` needs these files on
      # disk to resolve the two cross-repository imports in jdm.ts; without the
      # checkout the type-check fails with TS2307 rather than anything useful.
      #
      # It lands on an ignored path, so the "No uncommitted changes" step at the
      # end of this job does not see it.
      - name: Check out app-with-ai-rust
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-rust
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile, so a dependency added or dropped in package.json
      # without regenerating bun.lock fails here rather than resolving to
      # something different on every machine.
      - name: Install root tooling
        run: bun install --frozen-lockfile

      # The checkout's own dependencies, which this job needs as much as the
      # three below it do.
      #
      # `tsc` follows an import across the repository boundary and type-checks
      # what it finds, so anything the checkout imports has to resolve. That
      # used to cost nothing here — `language/cli/src/generate/jdm.ts` reaches
      # for two self-contained modules — and it stopped being free when
      # `build/reporting-pack.ts` started importing the generator's
      # `reporting/pack.ts`: through `@appwithai/core/types` that wants `zod`
      # and `better-auth/types`, and `tsc` reported TS2307 on each. The errors
      # name files this repository never meant to read, which is exactly how
      # long it takes to work out that the install is what is missing.
      #
      # The `stacks`, `rust-cli` and `reporting-pack` jobs have had this step
      # all along. This job was getting away without it.
      - name: Install app-with-ai-rust
        working-directory: app-with-ai-rust
        run: bun install --frozen-lockfile

      # Runs the checker over language/examples and examples, then compares
      # html/models against its counterpart for each shared model. The checker
      # writes a .error file beside every model it reads — that is its interface
      # — and the script removes any it created that git does not already track,
      # so a passing run leaves the tree as it found it.
      - name: Check every model
        run: bun run check:models

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      # html/model-yaml.js and the appwithai-model.js bundles are built from
      # language/browser/*.entry.ts, and each inlines this repository's own
      # appwithai-language.json — the canonical copy. Editing the definition or
      # the checker stales them and nothing else notices, so this fails rather
      # than serving a validator that disagrees with the language it ships
      # beside.
      #
      # It belongs here as its own step rather than inside `bun run check`,
      # because this job never runs that script: it runs check:models,
      # type-check and lint as separate steps, so anything added to `check`
      # alone would be local-only and CI would never see it.
      #
      # `Bun.build` output depends on the bun version and the platform, so this
      # is only meaningful on the runtime the job pins — which is why the
      # notice it prints on a mismatch names BUN_VERSION read out of this file.
      - name: Validators match the language they ship beside
        run: bun run check:language-tools

      # A model that checks clean can still leave the tree dirty, and a
      # generated file committed stale looks identical to one committed fresh
      # until someone regenerates it. Fail on either.
      #
      # The dependency checkout is gitignored, so it cannot show up here.
      - name: No uncommitted changes
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi

  stacks:
    name: Generate with every stack and the appwithai CLI
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 20
    defaults:
      run:
        working-directory: common

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-with-ai-rust
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-rust
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # node-rest and enterprise-reporting are self-contained once the checkout
      # is present — they write files and need nothing installed there.
      # tanstack-astryx-loco drives the shipped pipeline, which needs that
      # workspace's dependencies present: with a node_modules at the repository
      # root and none there, resolution stops at the root and the generate fails
      # on `Cannot find package 'zod'`.
      - name: Install app-with-ai-rust
        working-directory: app-with-ai-rust
        run: bun install --frozen-lockfile

      - name: Generate with every stack
        run: bun run check:stacks

      # The shipped `appwithai` binary, which check:stacks does not touch — that
      # one drives this repository's own CLI, which loads the generator as a
      # library. Different entry point, different argument parsing, different
      # defaults.
      - name: Generate with the appwithai CLI
        run: bun run check:cli

  # The Rust generator's own CLI, `appwithai-gen`. It is a cargo binary in
  # app-with-ai-rust (crates/appwithai-gen) that emits the backend crate
  # byte for byte like the TypeScript pipeline does — that repository's parity
  # gate holds the two together — and this proves the binary the pins name
  # still builds and generates from this repository's models.
  rust-cli:
    name: Generate with the appwithai-gen CLI
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 30
    # Every `run` here belongs in common/, the same as the other jobs: there is
    # no manifest, lockfile or node_modules at the repository root. A step that
    # names its own `working-directory` is relative to the workspace, not to
    # this default.
    defaults:
      run:
        working-directory: common

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-with-ai-rust
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-rust
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-with-ai-rust

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: Generate with the appwithai-gen CLI
        run: bun run check:cli:rust

  # The only check that runs the derived reporting SQL against the schema the
  # generator actually emits. The pack is built from a parsed model while the
  # tables come from a separate compiler in another repository, and nothing
  # type-checks one against the other — so a column the generator renames leaves
  # the pack building cleanly and every report failing at run time. It caught
  # exactly that on its first run.
  reporting-pack:
    name: Reporting pack against a real schema
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 25
    defaults:
      run:
        working-directory: common

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-with-ai-rust
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-rust
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # The tanstack-astryx-loco generate this check drives needs that
      # workspace, for the same reason the stacks job does. The bus_ tables it
      # replays come out of the generated crate's m0002 migration as SQL, so no
      # Rust toolchain is needed here.
      - name: Install app-with-ai-rust
        working-directory: app-with-ai-rust
        run: bun install --frozen-lockfile

      - name: Install psql
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # --require-server, so a service that never came up fails here instead of
      # skipping quietly. A check that passes without running is worse than no
      # check: it took a stopwatch to tell the two apart the first time this
      # job went green.
      - name: Run every derived query
        run: bun run check:pack:ci
