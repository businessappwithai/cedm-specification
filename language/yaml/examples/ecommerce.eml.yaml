eml: "1.0"
name: Store Core
version: 1.0.0
enums:
  - name: OrderStatus
    values: [cart, placed, paid, packed, shipped, delivered, cancelled, refunded]
  - name: FulfilmentEvent
    values: [place, pay, pack, ship, deliver, cancel, refund]
  - name: PaymentStatus
    values: [pending, authorized, captured, failed, refunded]
  - name: PaymentMethod
    values: [card, paypal, bank_transfer, gift_card]
entities:
  - name: Customer
    help: A shopper with an account on the store. The account is what carries an order history, a saved address book and a verified contact address, so a customer exists before an order does and outlives every order they place.
    attributes:
      - name: id
        type: string
        pk: true
      - name: email
        type: string
        unique: true
        help: The address the customer signs in with and where order confirmations, dispatch notices and refunds are sent. Unique across the store — a second account on the same address splits one shopper's history in two.
      - name: password_hash
        type: string
        help: The stored hash of the customer's password, never the password. Written only by the sign-up and password-reset flows; nothing else reads or displays it.
      - name: first_name
        type: string
        help: How the customer is greeted in email and on the account page. Kept apart from the surname because most correspondence uses only this half.
      - name: last_name
        type: string
        help: The family name, used together with the first name on invoices and delivery labels where a full name is required.
      - name: phone
        type: string
        optional: true
        help: A number the courier can call on the day of delivery. Optional at sign-up, but an order without one is the usual reason a failed delivery cannot be rescued.
      - name: is_verified
        type: boolean
        help: Whether the customer has confirmed their email address by following the link sent at sign-up. An unverified account can browse but should not be trusted with order notifications, because the address may belong to somebody else.
  - name: Product
    help: Something the store sells, priced and counted. A product carries the list price an order line copies at the moment of sale and the stock figure fulfilment works from, which is why it is never deleted once it has been ordered — deactivating it takes it off the storefront and leaves the order history intact.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The product as it appears on the storefront, in search results and on the invoice line. Write it the way a shopper would recognise it, not the way the warehouse labels it.
      - name: sku
        type: string
        unique: true
        help: "The stock-keeping unit — the warehouse's own code for this item, and the identifier the store shares with suppliers and couriers. Unique, and it does not change: a reused SKU makes two products indistinguishable in every stock report ever run."
      - name: description
        type: text
        optional: true
        help: What the shopper needs to know before buying — what it is, what is in the box, what it does not include. Optional, though a product without one converts noticeably worse.
      - name: unit_price
        type: decimal
        help: The current list price, before any discount. An order line copies this figure when the line is created rather than referring to it, so a later price change never rewrites what somebody already agreed to pay.
      - name: stock_qty
        type: integer
        help: Units physically available to promise. Fulfilment decrements it when an order is packed, so a figure that drifts from the shelf is what causes an order to be accepted and then cancelled.
      - name: is_active
        type: boolean
        help: Whether the product is offered for sale. Cleared instead of deleting a discontinued line, which would break every historical order that contains it.
    indexes:
      - columns: [sku]
        unique: true
  - name: Category
    help: A branch of the storefront's navigation. Categories nest — a category may name another as its parent — so the tree is what a shopper walks down and what the merchandising team reorganises without touching a single product.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: "The heading shoppers see in navigation and breadcrumbs. Keep it short: it is read in a menu, not in a sentence."
      - name: parent_id
        type: string
        fk: true
        optional: true
        help: The category this one sits under, empty for a top-level branch. This is what makes the navigation a tree rather than a flat list; a category pointing at its own descendant would make it a loop, so it is checked before it is saved.
  - name: Order
    help: One purchase, from the basket a shopper is still filling to a delivered or refunded transaction. The order carries the money — subtotal, discount, shipping and total — and its status is the single answer to "where is this". It is audited, because the question after any billing dispute is who changed what and when.
    audited: true
    attributes:
      - name: id
        type: string
        pk: true
      - name: customer_id
        type: string
        fk: true
        help: The shopper this order belongs to. It decides where confirmations are sent and which account the order appears under, and it is fixed once the order is placed.
      - name: order_number
        type: string
        unique: true
        help: "The human-readable reference quoted in email, on the invoice and by anyone phoning about the order. Unique, and deliberately not the record's key: it is a number people read out."
      - name: status
        type: string
        enum: OrderStatus
        help: cart — still being filled and freely editable; placed — submitted and awaiting payment; paid, packed, shipped, delivered — the fulfilment path; cancelled and refunded — the two ways it ends early. Only the moves the fulfilment diagram draws are allowed, so an order cannot ship before it is paid.
      - name: subtotal
        type: decimal
        help: The order's lines added up at the prices agreed when each was added, before discount and shipping. Recalculated by the pricing rule whenever a line changes.
      - name: discount_amount
        type: decimal
        help: What has been taken off the subtotal — a promotion, a voucher or an agreed goodwill reduction. Held separately from the line prices so a discount is always visible as a decision rather than hidden in the arithmetic.
      - name: shipping_amount
        type: decimal
        help: What the shopper is charged to have the order delivered, from the shipping band the basket qualifies for. Added after the discount, so a discount never reduces the carriage charge.
      - name: total_amount
        type: decimal
        help: "What the customer actually owes: subtotal less discount, plus shipping. This is the figure payment is taken against, so a payment that does not match it is the first thing reconciliation looks for."
      - name: placed_at
        type: datetime
        optional: true
        help: When the shopper submitted the order. Empty while it is still a cart, and it is the clock every delivery promise is measured from.
    indexes:
      - columns: [customer_id, status]
  - name: OrderItem
    help: One product on one order, at the quantity and price agreed. A line has no meaning away from its order — line 2 of order 4417, not line 2 — which is why it is a line item of the order rather than a screen of its own.
    parent: Order
    attributes:
      - name: id
        type: string
        pk: true
      - name: order_id
        type: string
        fk: true
        help: The order this line belongs to. It is what the order's own screen lists the lines by, and the reason a line is never opened on its own.
      - name: product_id
        type: string
        fk: true
        help: What was bought. It is the reference the warehouse picks against, and the only link back from a sale to the product's stock and description.
      - name: quantity
        type: integer
        help: How many units of the product this line covers. Multiplied by the unit price to give the line total, and the figure stock is decremented by when the order is packed.
      - name: unit_price
        type: decimal
        help: The price per unit **as agreed when the line was added**, copied from the product rather than referenced. This is what makes an old order still show the price the customer actually paid after the product's list price has moved.
      - name: line_total
        type: decimal
        help: Quantity multiplied by unit price, stored rather than recomputed so the order's arithmetic can be audited line by line without re-deriving prices that have since changed.
  - name: Payment
    help: One attempt to collect money against an order. An order can carry several — a failed card followed by a successful one, a gift card topped up by a card, a refund — so payments are a list rather than a field, and the order is settled only when the captured amounts cover its total.
    attributes:
      - name: id
        type: string
        pk: true
      - name: order_id
        type: string
        fk: true
        help: "The order this money is for. Everything about reconciliation starts here: a payment whose order is missing or already refunded is the exception a finance team chases."
      - name: method
        type: string
        enum: PaymentMethod
        help: card, paypal, bank_transfer or gift_card. It decides how a refund has to be returned — money goes back the way it came — and how long settlement takes.
      - name: status
        type: string
        enum: PaymentStatus
        help: pending — submitted, no answer yet; authorized — funds reserved, not taken; captured — money actually collected; failed — declined, and the order stays unpaid; refunded — returned to the customer. Only a captured payment counts towards the order's total.
      - name: amount
        type: decimal
        help: "The sum this payment moves. It need not equal the order total: part payments, gift-card balances and partial refunds are all normal, which is why settlement is the sum of captured payments rather than a single figure."
      - name: captured_at
        type: datetime
        optional: true
        help: When the money was actually taken, as opposed to reserved. Empty until capture, and it is the date that appears on the customer's statement and in the day's takings.
relationships:
  - from: Customer
    fromCardinality: exactly-one
    to: Order
    toCardinality: zero-or-more
    label: places
  - from: Order
    fromCardinality: exactly-one
    to: OrderItem
    toCardinality: zero-or-more
    label: contains
  - from: Product
    fromCardinality: exactly-one
    to: OrderItem
    toCardinality: zero-or-more
    label: ordered_in
  - from: Order
    fromCardinality: exactly-one
    to: Payment
    toCardinality: zero-or-more
    label: paid_by
  - from: Category
    fromCardinality: exactly-one
    to: Product
    toCardinality: zero-or-more
    label: categorizes
  - from: Category
    fromCardinality: exactly-one
    to: Category
    toCardinality: zero-or-more
    label: has_subcategory
hooks:
  - entity: Order
    event: customValidate
    handler: ensureStockAvailable
  - entity: Order
    event: beforeUpdate
    handler: recomputeTotals
  - entity: Order
    event: afterUpdate
    handler: decrementInventory
  - entity: Order
    event: afterUpdate
    handler: sendOrderConfirmation
rbac:
  - entity: Order
    action: place
    roles: [customer]
  - entity: Order
    action: pack
    roles: [warehouse, admin]
  - entity: Order
    action: refund
    roles: [admin]
triggers:
  - entity: Order
    source: webhook:payment
    handler: markPaid
  - entity: Order
    source: webhook:carrier
    handler: markShipped
rules:
  - name: pricing
    title: Order Pricing
    entity: Order
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Order Repriced"
        shape: stadium
      - id: B
        label: Subtotal > 1000?
        shape: diamond
      - id: C
        label: Apply Premium Discount 15%
        shape: rect
      - id: D
        label: Customer is_verified?
        shape: diamond
      - id: E
        label: Apply Loyalty Discount 5%
        shape: rect
      - id: F
        label: No Discount
        shape: rect
      - id: G
        label: Calculate Total
        shape: round
      - id: H
        label: "End: Priced"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: G
      - from: E
        to: G
      - from: F
        to: G
      - from: G
        to: H
  - name: freeShipping
    title: Free Shipping
    entity: Order
    event: beforeUpdate
    priority: 20
    nodes:
      - id: S
        label: Start
        shape: stadium
      - id: Q1
        label: Total >= 50?
        shape: diamond
      - id: P1
        label: Charge Standard Shipping
        shape: rect
      - id: Q2
        label: Item count >= 3?
        shape: diamond
      - id: P2
        label: Free Express Shipping
        shape: rect
      - id: P3
        label: Free Standard Shipping
        shape: rect
      - id: R
        label: Set Shipping Amount
        shape: circle
      - id: E
        label: End
        shape: stadium
    edges:
      - from: S
        to: Q1
      - from: Q1
        to: P1
        label: No
      - from: Q1
        to: Q2
        label: Yes
      - from: Q2
        to: P2
        label: Yes
      - from: Q2
        to: P3
        label: No
      - from: P1
        to: R
      - from: P2
        to: R
      - from: P3
        to: R
      - from: R
        to: E
stateMachines:
  - name: OrderFulfilment
    title: Order Fulfilment
    entity: Order
    states: [cart, placed, paid, cancelled, packed, shipped, delivered, refunded]
    initial: cart
    final: [delivered, cancelled, refunded]
    transitions:
      - from: cart
        to: placed
        trigger: place
      - from: placed
        to: paid
        trigger: pay
      - from: placed
        to: cancelled
        trigger: cancel
      - from: paid
        to: packed
        trigger: pack
      - from: packed
        to: shipped
        trigger: ship
      - from: shipped
        to: delivered
        trigger: deliver
      - from: paid
        to: refunded
        trigger: refund
hookDiagrams:
  - name: CheckoutHooks
    title: Checkout Hooks
    entity: Order
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Cart]
          B --> C[customValidate: ensureStockAvailable]
          C --> D[beforeUpdate: recomputeTotals]
          D --> E[Process Order]
          E --> F[afterUpdate: decrementInventory]
          F --> G[afterUpdate: sendOrderConfirmation]
          G --> H[Response]
