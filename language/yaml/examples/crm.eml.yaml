stateMachines:
  - name: LeadLifecycle
    title: Lead Lifecycle
    entity: Lead
    states: [new, working, nurturing, qualified, converted, disqualified]
    initial: new
    final: [converted, disqualified]
    transitions:
      - from: new
        to: working
        trigger: engage
      - from: working
        to: nurturing
        trigger: nurture
      - from: nurturing
        to: working
        trigger: re_engage
      - from: working
        to: qualified
        trigger: qualify
      - from: qualified
        to: working
        trigger: return_to_working
      - from: qualified
        to: converted
        trigger: convert
      - from: working
        to: disqualified
        trigger: disqualify
      - from: nurturing
        to: disqualified
        trigger: disqualify
      - from: new
        to: disqualified
        trigger: reject
  - name: OpportunityPipeline
    title: Opportunity Pipeline
    entity: Opportunity
    states: [prospecting, qualification, needs_analysis, closed_lost, proposal, negotiation, closed_won]
    initial: prospecting
    final: [closed_won, closed_lost]
    transitions:
      - from: prospecting
        to: qualification
        trigger: qualify
      - from: qualification
        to: needs_analysis
        trigger: discover
      - from: qualification
        to: closed_lost
        trigger: disqualify
      - from: needs_analysis
        to: proposal
        trigger: send_proposal
      - from: needs_analysis
        to: closed_lost
        trigger: no_fit
      - from: proposal
        to: negotiation
        trigger: negotiate
      - from: proposal
        to: closed_lost
        trigger: lose
      - from: negotiation
        to: closed_won
        trigger: close_won
      - from: negotiation
        to: closed_lost
        trigger: close_lost
      - from: negotiation
        to: proposal
        trigger: reprice
  - name: QuoteApproval
    title: Quote Approval
    entity: Quote
    states: [draft, in_review, approved, rejected, presented, expired, accepted]
    initial: draft
    final: [accepted, expired]
    transitions:
      - from: draft
        to: in_review
        trigger: submit_for_approval
      - from: in_review
        to: approved
        trigger: approve
      - from: in_review
        to: rejected
        trigger: reject
      - from: rejected
        to: draft
        trigger: revise
      - from: approved
        to: presented
        trigger: present
      - from: approved
        to: expired
        trigger: lapse
      - from: presented
        to: accepted
        trigger: accept
      - from: presented
        to: draft
        trigger: renegotiate
      - from: presented
        to: expired
        trigger: lapse
  - name: SupportCaseLifecycle
    title: Support Case Lifecycle
    entity: SupportCase
    states: [new, assigned, in_progress, waiting_on_customer, escalated, resolved, closed]
    initial: new
    final: [closed]
    transitions:
      - from: new
        to: assigned
        trigger: assign
      - from: assigned
        to: in_progress
        trigger: start_work
      - from: in_progress
        to: waiting_on_customer
        trigger: request_information
      - from: waiting_on_customer
        to: in_progress
        trigger: customer_responded
      - from: in_progress
        to: escalated
        trigger: escalate
      - from: escalated
        to: in_progress
        trigger: de_escalate
      - from: in_progress
        to: resolved
        trigger: resolve
      - from: resolved
        to: in_progress
        trigger: reopen
      - from: resolved
        to: closed
        trigger: close
  - name: ContractLifecycle
    title: Contract Lifecycle
    entity: Contract
    states: [draft, in_approval, active, expiring, terminated, renewed, expired]
    initial: draft
    final: [expired, terminated]
    transitions:
      - from: draft
        to: in_approval
        trigger: submit_for_signature
      - from: in_approval
        to: draft
        trigger: return_for_edit
      - from: in_approval
        to: active
        trigger: counter_signed
      - from: active
        to: expiring
        trigger: enter_renewal_window
      - from: active
        to: terminated
        trigger: terminate
      - from: expiring
        to: renewed
        trigger: renew
      - from: expiring
        to: expired
        trigger: lapse
      - from: expiring
        to: terminated
        trigger: terminate
      - from: renewed
        to: active
        trigger: activate_renewal
sagas:
  - name: LeadConversion
    title: Lead Conversion
    entity: Lead
    trigger: rule
    steps:
      - id: B
        type: Decision
        label: Size the account
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Score\",\"field\":\"score\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Tier\",\"field\":\"accountTier\"},{\"id\":\"o2\",\"name\":\"OpeningAmount\",\"field\":\"openingAmount\"},{\"id\":\"o3\",\"name\":\"AccountType\",\"field\":\"openingAccountType\"}],\"rules\":[{\"_id\":\"strategic\",\"i1\":\">= 85\",\"o1\":\"'strategic'\",\"o2\":\"250000\",\"o3\":\"'prospect'\"},{\"_id\":\"enterprise\",\"i1\":\">= 70\",\"o1\":\"'enterprise'\",\"o2\":\"120000\",\"o3\":\"'prospect'\"},{\"_id\":\"midmarket\",\"i1\":\">= 40\",\"o1\":\"'mid_market'\",\"o2\":\"45000\",\"o3\":\"'prospect'\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'smb'\",\"o2\":\"12000\",\"o3\":\"'prospect'\"}]}"
      - id: C
        type: CreateEntity
        label: Open the account
        properties:
          entity: Account
          as: newAccountId
          fields: '{"name":"company_name","account_type":"openingAccountType","tier":"accountTier","industry":"industry","employee_count":"employee_count","annual_revenue":"annual_revenue","status":"active","owner_id":"owner_id"}'
      - id: D
        type: CreateEntity
        label: Create the primary contact
        properties:
          entity: Contact
          as: newContactId
          fields: '{"account_id":"newAccountId","first_name":"first_name","last_name":"last_name","email":"email","phone":"phone","job_title":"job_title","lead_source":"lead_source","is_primary":true,"email_opt_out":false,"do_not_call":false,"status":"active","owner_id":"owner_id"}'
      - id: E
        type: CreateEntity
        label: Open the first opportunity
        properties:
          entity: Opportunity
          as: newOpportunityId
          fields: '{"account_id":"newAccountId","contact_id":"newContactId","campaign_id":"campaign_id","name":"company_name","amount":"openingAmount","currency_code":"USD","stage":"prospecting","forecast_category":"pipeline","lead_source":"lead_source","owner_id":"owner_id"}'
      - id: F
        type: UpdateEntity
        label: Mark the lead converted
        properties:
          field: status
          value: converted
      - id: G
        type: UpdateEntity
        label: Stamp the account tier
        properties:
          entity: Account
          targetSource: newAccountId
          field: tier
          source: accountTier
  - name: QuoteApprovalEscalation
    title: Quote Approval Escalation
    entity: Quote
    trigger: rule
    steps:
      - id: B
        type: Decision
        label: Set the approval level
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Discount\",\"field\":\"discount_percent\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Level\",\"field\":\"approvalLevel\"},{\"id\":\"o2\",\"name\":\"ReviewHours\",\"field\":\"reviewHours\"}],\"rules\":[{\"_id\":\"vp\",\"i1\":\"> 25\",\"o1\":\"'vp_sales'\",\"o2\":\"48\"},{\"_id\":\"manager\",\"i1\":\"> 15\",\"o1\":\"'sales_manager'\",\"o2\":\"24\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'rep_authority'\",\"o2\":\"8\"}]}"
      - id: C
        type: Formula
        label: Compute the review window
        properties:
          target: reviewWindowDays
          source: reviewHours
          operation: divide
          operand: "24"
      - id: D
        type: CreateEntity
        label: Raise the approval task
        properties:
          entity: Activity
          as: approvalTaskId
          fields: '{"activity_type":"task","subject":"Approve quote discount","status":"planned","priority":"high","account_id":"account_id","opportunity_id":"opportunity_id","owner_id":"owner_id"}'
      - id: E
        type: UpdateEntity
        label: Hold the quote for review
        properties:
          field: status
          value: in_review
      - id: F
        type: UpdateEntity
        label: Name the approval level on the task
        properties:
          entity: Activity
          targetSource: approvalTaskId
          field: description
          source: approvalLevel
  - name: CriticalCaseEscalation
    title: Critical Case Escalation
    entity: SupportCase
    trigger: rule
    steps:
      - id: B
        type: Decision
        label: Set the escalation tier
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Priority\",\"field\":\"priority\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Tier\",\"field\":\"escalationTier\"},{\"id\":\"o2\",\"name\":\"ResponseMinutes\",\"field\":\"responseMinutes\"}],\"rules\":[{\"_id\":\"critical\",\"i1\":\"\\\"critical\\\"\",\"o1\":\"'executive_bridge'\",\"o2\":\"15\"},{\"_id\":\"high\",\"i1\":\"\\\"high\\\"\",\"o1\":\"'support_manager'\",\"o2\":\"60\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'queue'\",\"o2\":\"240\"}]}"
      - id: C
        type: Formula
        label: Compute the response deadline
        properties:
          target: responseHours
          source: responseMinutes
          operation: divide
          operand: "60"
      - id: D
        type: CreateEntity
        label: Raise the escalation task
        properties:
          entity: Activity
          as: escalationTaskId
          fields: '{"activity_type":"task","subject":"Escalated support case","status":"planned","priority":"urgent","account_id":"account_id","contact_id":"contact_id","support_case_id":"id","owner_id":"owner_id"}'
      - id: E
        type: UpdateEntity
        label: Escalate the case
        properties:
          field: status
          value: escalated
      - id: F
        type: UpdateEntity
        label: Name the tier on the task
        properties:
          entity: Activity
          targetSource: escalationTaskId
          field: description
          source: escalationTier
      - id: G
        type: REST
        label: Notify the on-call channel
        properties:
          url: https://hooks.example.com/crm/case-escalation
          method: POST
          bodyTemplate: '{"case":"{{case_number}}","tier":"{{escalationTier}}","respondWithinHours":"{{responseHours}}"}'
  - name: ClosedWonHandoff
    title: Closed Won Handoff
    entity: Opportunity
    operation: UPDATE
    steps:
      - id: B
        type: Decision
        label: Size the engagement
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Amount\",\"field\":\"amount\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"TermMonths\",\"field\":\"termMonths\"},{\"id\":\"o2\",\"name\":\"OnboardingTier\",\"field\":\"onboardingTier\"},{\"id\":\"o3\",\"name\":\"NoticeDays\",\"field\":\"renewalNoticeDays\"}],\"rules\":[{\"_id\":\"strategic\",\"i1\":\">= 250000\",\"o1\":\"36\",\"o2\":\"'white_glove'\",\"o3\":\"120\"},{\"_id\":\"enterprise\",\"i1\":\">= 100000\",\"o1\":\"24\",\"o2\":\"'guided'\",\"o3\":\"90\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"12\",\"o2\":\"'self_serve'\",\"o3\":\"60\"}]}"
      - id: C
        type: Formula
        label: Compute the monthly run rate
        properties:
          target: monthlyRunRate
          source: amount
          operation: divide
          operand: "12"
      - id: D
        type: CreateEntity
        label: Draft the contract
        properties:
          entity: Contract
          as: newContractId
          fields: '{"account_id":"account_id","status":"draft","term_months":"termMonths","annual_value":"amount","renewal_notice_days":"renewalNoticeDays","auto_renew":false,"owner_id":"owner_id"}'
      - id: E
        type: CreateEntity
        label: Book the onboarding kickoff
        properties:
          entity: Activity
          as: kickoffActivityId
          fields: '{"activity_type":"meeting","subject":"Customer onboarding kickoff","status":"planned","priority":"high","account_id":"account_id","contact_id":"contact_id","opportunity_id":"id","owner_id":"owner_id"}'
      - id: F
        type: UpdateEntity
        label: Stamp the forecast category
        properties:
          field: forecast_category
          value: closed
      - id: G
        type: UpdateEntity
        label: Name the onboarding tier on the kickoff
        properties:
          entity: Activity
          targetSource: kickoffActivityId
          field: description
          source: onboardingTier
  - name: RenewalPlaybook
    title: Renewal Playbook
    entity: Contract
    operation: UPDATE
    steps:
      - id: B
        type: Decision
        label: Grade the renewal
        properties:
          rule: renewalRisk
          publish: renewalGrade
      - id: C
        type: DeleteEntity
        label: Clear the stale renewal tasks
        properties:
          entity: Activity
          targetField: contract_id
      - id: D
        type: CreateEntity
        label: Open the renewal opportunity
        properties:
          entity: Opportunity
          as: renewalOpportunityId
          fields: '{"account_id":"account_id","name":"Renewal","amount":"annual_value","currency_code":"USD","stage":"qualification","forecast_category":"pipeline","expected_close_date":"end_date","owner_id":"owner_id"}'
      - id: E
        type: CreateEntity
        label: Schedule the renewal review
        properties:
          entity: Activity
          as: renewalReviewId
          fields: '{"activity_type":"meeting","subject":"Renewal review","status":"planned","priority":"high","account_id":"account_id","contract_id":"id","opportunity_id":"renewalOpportunityId","owner_id":"owner_id"}'
      - id: F
        type: UpdateEntity
        label: Flag the contract as expiring
        properties:
          field: status
          value: expiring
      - id: G
        type: UpdateEntity
        label: Name the grade on the renewal opportunity
        properties:
          entity: Opportunity
          targetSource: renewalOpportunityId
          field: next_step
          source: renewalGrade
hookDiagrams:
  - name: AccountGovernance
    title: Account Governance
    entity: Account
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: normalizeAccountName]
          C --> D[beforeCreate: assignAccountNumber]
          D --> E[customValidate: ensureAccountNumberUnique]
          E --> F[Process Account]
          F --> G[afterCreate: seedAccountTeam]
          G --> H[beforeList: scopeToTerritory]
          H --> I[afterList: attachHealthScore]
          I --> J[beforeDelete: blockDeleteWithOpenBusiness]
          J --> K[Response]

          %% account_number is unique and minted here rather than supplied by the
          %% caller. That is why it is OPTIONAL in the ERD: the conversion saga in
          %% Section 22 inserts an account without one, and a NOT NULL column would
          %% fail that insert before the hook ever ran. Postgres allows repeated NULLs
          %% under a unique index, so nothing collides in the window before the hook
          %% stamps a value. quote_number, contract_number and case_number are the
          %% same shape for the same reason.

      %% ---- Section 16: Workflow — contact hygiene hooks --------------------------
      %% Deliverability and consent are the two things a CRM quietly destroys if
      %% nobody guards them, so both are enforced at the write rather than in the UI.
  - name: ContactHygiene
    title: Contact Hygiene
    entity: Contact
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: normalizeEmail]
          C --> D[customValidate: ensureUniqueEmail]
          D --> E[Process Contact]
          E --> F[afterCreate: enqueueWelcomeSequence]
          F --> G[afterUpdate: syncToMarketingPlatform]
          G --> H[beforeRead: enforceFieldLevelSecurity]
          H --> I[afterRead: maskPersonalData]
          I --> J[afterDelete: purgeMarketingConsent]
          J --> K[Response]

      %% ---- Section 17: Workflow — lead intake hooks ------------------------------
  - name: LeadIntake
    title: Lead Intake
    entity: Lead
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: stampLeadSource]
          C --> D[customValidate: requireContactChannel]
          D --> E[Process Lead]
          E --> F[afterCreate: notifyOwnerOfNewLead]
          F --> G[beforeQuery: scopeToOwnedLeads]
          G --> H[afterQuery: annotateDuplicateLeads]
          H --> I[Response]

      %% ---- Section 18: Workflow — opportunity integrity hooks --------------------
  - name: OpportunityIntegrity
    title: Opportunity Integrity
    entity: Opportunity
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeUpdate: snapshotStageChange]
          C --> D[customValidate: requireLossReasonOnLoss]
          D --> E[Process Opportunity]
          E --> F[afterCreate: notifySellingTeam]
          F --> G[afterUpdate: recalculateAccountPipeline]
          G --> H[Response]

      %% ---- Section 19: Workflow — quote calculation hooks ------------------------
  - name: QuoteCalculation
    title: Quote Calculation
    entity: Quote
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: generateQuoteNumber]
          C --> D[beforeUpdate: recalculateQuoteTotals]
          D --> E[customValidate: enforceDiscountCeiling]
          E --> F[Process Quote]
          F --> G[afterUpdate: regenerateQuoteDocument]
          G --> H[Response]

      %% ---- Section 20: Workflow — case SLA tracking hooks ------------------------
  - name: CaseSlaTracking
    title: Case SLA Tracking
    entity: SupportCase
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: assignCaseNumber]
          C --> D[beforeCreate: stampSlaTargets]
          D --> E[beforeUpdate: captureFirstResponse]
          E --> F[Process Case]
          F --> G[afterCreate: acknowledgeCustomer]
          G --> H[afterUpdate: recomputeSlaBreach]
          H --> I[beforeDelete: blockDeleteOfOpenCase]
          I --> J[afterDelete: archiveCaseTranscript]
          J --> K[Response]

      %% ---- Section 21: Workflow — contract governance hooks ----------------------
      %% A contract is drafted by the handoff saga in Section 25 before anyone has
      %% agreed dates, so the number is minted here and the date/term agreement is
      %% validated on the way out of draft rather than on the way in.
  - name: ContractGovernance
    title: Contract Governance
    entity: Contract
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: generateContractNumber]
          C --> D[customValidate: ensureTermMatchesDates]
          D --> E[Process Contract]
          E --> F[afterCreate: notifyFinanceOfNewContract]
          F --> G[afterUpdate: scheduleRenewalReminders]
          G --> H[Response]

      %% ---- Section 22: Workflow — lead conversion (saga) -------------------------
      %% The one process every CRM is judged on. A qualified lead becomes an account,
      %% a primary contact and an opening opportunity in one transaction, and the
      %% lead is stamped converted so it stops appearing in prospecting lists.
      %%
      %% `trigger: rule` is load-bearing: the qualification rule in Section 4 decides
      %% whether this runs at all. Step B's table is the sizing policy — grade in,
      %% tier and opening amount out — and the steps after it read what it published.
      %% Step G reaches back into the account step C created, using the id step C
      %% bound, which is the only way a later step can touch a row created earlier in
      %% the same run.
