version: "1.0"
metadata:
  name: minimal-example
  description: Minimal CEDL model demonstrating core concepts
  author: AppWithAI

domain:
  entities:
    - id: customer
      name: Customer
      attributes:
        - id: customer_id
          name: customer_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: name
          name: name
          type: string
          isRequired: true
          isIdentifier: true
          length: 255

        - id: email
          name: email
          type: string
          isRequired: true
          isUnique: true
          length: 255

    - id: order
      name: Order
      attributes:
        - id: order_id
          name: order_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: customer_id
          name: customer_id
          type: reference
          isForeignKey: true
          referenceEntity: customer
          isRequired: true

        - id: order_date
          name: order_date
          type: datetime
          isRequired: true

        - id: total_amount
          name: total_amount
          type: decimal
          precision: 12
          scale: 2

relationships:
  - source: customer
    target: order
    cardinality: one-to-many
    foreignKey: customer_id
