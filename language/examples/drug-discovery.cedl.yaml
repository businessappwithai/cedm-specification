version: "1.0"
metadata:
  name: drug-discovery
  description: Pharmaceutical drug discovery and development platform
  version: 1.0.0
  author: AppWithAI
  timestamp: 2026-09-26T00:00:00Z
  tags:
    - pharmaceutical
    - research
    - complex-model

domain:
  categories:
    - id: research
      name: Research
      icon: microscope
      help: Core research entities
      order: 1

    - id: compounds
      name: Compounds
      icon: flask-conical
      help: Chemical compound management
      order: 2

    - id: testing
      name: Testing
      icon: beaker
      help: Experimental testing and results
      order: 3

    - id: regulatory
      name: Regulatory
      icon: clipboard-check
      help: Compliance and regulatory tracking
      order: 4

    - id: team
      name: Team
      icon: users
      help: People and organizations
      order: 5

  entities:
    # Research Domain
    - id: project
      name: Project
      displayName: "Research Project"
      category: research
      help: Top-level research project definition
      attributes:
        - id: project_id
          name: project_id
          type: uuid
          isIdentifier: true
          isRequired: true
          help: Unique project identifier

        - id: name
          name: name
          type: string
          isIdentifier: true
          isRequired: true
          length: 255
          help: Project name

        - id: description
          name: description
          type: string
          length: 2000
          help: Detailed project description

        - id: status
          name: status
          type: enum
          enumRef: project_status
          isRequired: true
          defaultValue: initiated
          help: Current project lifecycle status

        - id: principal_investigator_id
          name: principal_investigator_id
          type: reference
          isForeignKey: true
          referenceEntity: researcher
          help: Lead researcher for this project

    - id: experiment
      name: Experiment
      displayName: "Research Experiment"
      category: research
      help: Individual experiment within a project
      attributes:
        - id: experiment_id
          name: experiment_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: code
          name: code
          type: string
          isIdentifier: true
          isRequired: true
          isIndexed: true
          length: 50
          help: Experiment reference code

        - id: project_id
          name: project_id
          type: reference
          isForeignKey: true
          referenceEntity: project
          isRequired: true
          help: Parent project

        - id: title
          name: title
          type: string
          isRequired: true
          length: 255

        - id: description
          name: description
          type: string
          length: 2000

        - id: start_date
          name: start_date
          type: date
          help: Experiment start date

        - id: target_completion_date
          name: target_completion_date
          type: date
          help: Planned completion date

        - id: actual_completion_date
          name: actual_completion_date
          type: date
          help: Actual completion date (when finished)

    # Compounds Domain
    - id: compound
      name: Compound
      displayName: "Chemical Compound"
      category: compounds
      help: Chemical compound being studied
      attributes:
        - id: compound_id
          name: compound_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: name
          name: name
          type: string
          isIdentifier: true
          isRequired: true
          length: 255

        - id: smiles
          name: smiles
          type: string
          isIdentifier: true
          length: 500
          help: SMILES notation for chemical structure

        - id: inchi_key
          name: inchi_key
          type: string
          isUnique: true
          length: 27
          help: InChI Key identifier

        - id: molecular_weight
          name: molecular_weight
          type: decimal
          precision: 10
          scale: 4
          help: Molecular weight in g/mol

        - id: potency
          name: potency
          type: decimal
          precision: 10
          scale: 6
          help: IC50 or equivalent measure of activity

    - id: compound_alias
      name: Compound Alias
      displayName: "Compound Reference Name"
      category: compounds
      help: Alternative names for compounds
      attributes:
        - id: alias_id
          name: alias_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: compound_id
          name: compound_id
          type: reference
          isForeignKey: true
          referenceEntity: compound
          isRequired: true

        - id: alias_name
          name: alias_name
          type: string
          isRequired: true
          length: 255

    # Testing Domain
    - id: test_protocol
      name: Test Protocol
      displayName: "Testing Protocol"
      category: testing
      help: Defined testing methodology
      attributes:
        - id: protocol_id
          name: protocol_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: name
          name: name
          type: string
          isIdentifier: true
          isRequired: true
          length: 255

        - id: description
          name: description
          type: string
          length: 2000

        - id: protocol_type
          name: protocol_type
          type: enum
          enumRef: protocol_type_enum
          isRequired: true

    - id: assay_result
      name: Assay Result
      displayName: "Test Result"
      category: testing
      help: Individual assay test result
      attributes:
        - id: result_id
          name: result_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: experiment_id
          name: experiment_id
          type: reference
          isForeignKey: true
          referenceEntity: experiment
          isRequired: true

        - id: compound_id
          name: compound_id
          type: reference
          isForeignKey: true
          referenceEntity: compound
          isRequired: true

        - id: protocol_id
          name: protocol_id
          type: reference
          isForeignKey: true
          referenceEntity: test_protocol
          isRequired: true

        - id: test_date
          name: test_date
          type: datetime
          isRequired: true

        - id: raw_value
          name: raw_value
          type: decimal
          precision: 12
          scale: 6

        - id: calculated_potency
          name: calculated_potency
          type: decimal
          precision: 10
          scale: 6

        - id: validity_status
          name: validity_status
          type: enum
          enumRef: assay_validity
          defaultValue: pending

    - id: deviation_report
      name: Deviation Report
      displayName: "Test Deviation"
      category: testing
      help: Report of deviations from protocol
      attributes:
        - id: deviation_id
          name: deviation_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: experiment_id
          name: experiment_id
          type: reference
          isForeignKey: true
          referenceEntity: experiment
          isRequired: true

        - id: assigned_to_id
          name: assigned_to_id
          type: reference
          isForeignKey: true
          referenceEntity: researcher
          help: Researcher assigned to investigate

        - id: description
          name: description
          type: string
          length: 2000
          isRequired: true

        - id: severity
          name: severity
          type: enum
          enumRef: deviation_severity
          isRequired: true

        - id: status
          name: status
          type: enum
          enumRef: deviation_status
          defaultValue: open

    # Regulatory Domain
    - id: regulatory_document
      name: Regulatory Document
      displayName: "Regulatory Filing"
      category: regulatory
      help: Regulatory submission and compliance documentation
      attributes:
        - id: doc_id
          name: doc_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: project_id
          name: project_id
          type: reference
          isForeignKey: true
          referenceEntity: project
          isRequired: true

        - id: document_type
          name: document_type
          type: enum
          enumRef: regulatory_doc_type
          isRequired: true

        - id: submission_date
          name: submission_date
          type: date

        - id: approval_date
          name: approval_date
          type: date

    # Team Domain
    - id: researcher
      name: Researcher
      displayName: "Team Member"
      category: team
      help: Research team member
      attributes:
        - id: researcher_id
          name: researcher_id
          type: uuid
          isIdentifier: true
          isRequired: true

        - id: first_name
          name: first_name
          type: string
          isIdentifier: true
          isRequired: true
          length: 100

        - id: last_name
          name: last_name
          type: string
          isIdentifier: true
          isRequired: true
          length: 100

        - id: email
          name: email
          type: string
          isRequired: true
          isUnique: true
          isIndexed: true
          length: 255

        - id: role
          name: role
          type: enum
          enumRef: researcher_role
          isRequired: true

        - id: expertise_area
          name: expertise_area
          type: string
          length: 255
          help: Area of specialization

  enums:
    - id: project_status
      name: Project Status
      values:
        - value: initiated
          label: Initiated
          order: 1
        - value: active
          label: Active
          order: 2
        - value: on_hold
          label: On Hold
          order: 3
        - value: completed
          label: Completed
          order: 4
        - value: cancelled
          label: Cancelled
          order: 5

    - id: protocol_type_enum
      name: Protocol Type
      values:
        - value: in_vitro
          label: In Vitro
        - value: in_vivo
          label: In Vivo
        - value: cellular
          label: Cellular
        - value: molecular
          label: Molecular
        - value: computational
          label: Computational

    - id: assay_validity
      name: Assay Validity Status
      values:
        - value: pending
          label: Pending
          order: 1
        - value: valid
          label: Valid
          order: 2
        - value: invalid
          label: Invalid
          order: 3
        - value: review_required
          label: Review Required
          order: 4

    - id: deviation_severity
      name: Deviation Severity
      values:
        - value: critical
          label: Critical
        - value: major
          label: Major
        - value: minor
          label: Minor

    - id: deviation_status
      name: Deviation Status
      values:
        - value: open
          label: Open
        - value: under_investigation
          label: Under Investigation
        - value: resolved
          label: Resolved
        - value: closed
          label: Closed

    - id: regulatory_doc_type
      name: Regulatory Document Type
      values:
        - value: ind_application
          label: IND Application
        - value: nda_submission
          label: NDA Submission
        - value: anda_submission
          label: ANDA Submission
        - value: sop_document
          label: SOP Document

    - id: researcher_role
      name: Researcher Role
      values:
        - value: principal_investigator
          label: Principal Investigator
        - value: senior_scientist
          label: Senior Scientist
        - value: scientist
          label: Scientist
        - value: research_assistant
          label: Research Assistant
        - value: technician
          label: Technician

relationships:
  - id: project_has_experiments
    source: project
    target: experiment
    cardinality: one-to-many
    foreignKey: project_id
    help: Project contains multiple experiments

  - id: experiment_has_results
    source: experiment
    target: assay_result
    cardinality: one-to-many
    foreignKey: experiment_id
    help: Experiment contains multiple assay results

  - id: compound_has_aliases
    source: compound
    target: compound_alias
    cardinality: one-to-many
    foreignKey: compound_id
    help: Compound can have multiple aliases

  - id: result_compound_reference
    source: assay_result
    target: compound
    cardinality: many-to-one
    foreignKey: compound_id
    help: Result references tested compound

  - id: result_protocol_reference
    source: assay_result
    target: test_protocol
    cardinality: many-to-one
    foreignKey: protocol_id
    help: Result uses defined protocol

  - id: deviation_experiment_reference
    source: deviation_report
    target: experiment
    cardinality: many-to-one
    foreignKey: experiment_id

  - id: project_documents
    source: project
    target: regulatory_document
    cardinality: one-to-many
    foreignKey: project_id

workflows:
  - id: assay_validation_workflow
    name: Assay Result Validation
    entity: assay_result
    description: Workflow for validating assay results
    startEvent: result_created
    endEvents:
      - validation_complete
      - validation_failed

    states:
      - id: pending_review
        name: Pending Review
        type: initial
        help: Awaiting initial quality review

      - id: under_review
        name: Under Review
        help: Being reviewed by QA team

      - id: data_quality_check
        name: Data Quality Check
        help: Checking for anomalies

      - id: approved
        name: Approved
        type: final
        help: Result approved and valid

      - id: rejected
        name: Rejected
        type: final
        help: Result rejected or flagged

    transitions:
      - from: pending_review
        to: under_review
        name: Start Review

      - from: under_review
        to: data_quality_check
        name: Begin QC Check

      - from: data_quality_check
        to: approved
        name: Approve Result

      - from: data_quality_check
        to: rejected
        name: Reject Result

      - from: rejected
        to: approved
        name: Retest and Approve
        condition: new_assay_valid

rbac:
  roles:
    - id: admin
      name: Administrator
      description: System administrator with full access
      isMasterRole: true

    - id: principal_investigator
      name: Principal Investigator
      description: Research project lead

    - id: senior_scientist
      name: Senior Scientist
      description: Senior research scientist

    - id: scientist
      name: Scientist
      description: Scientist

    - id: qa_specialist
      name: QA Specialist
      description: Quality assurance specialist

    - id: regulatory_officer
      name: Regulatory Officer
      description: Regulatory compliance officer

  permissions:
    - role: scientist
      entity: assay_result
      operations: [create, read, update]

    - role: qa_specialist
      entity: assay_result
      operations: [read, update]

    - role: principal_investigator
      entity: project
      operations: [read, create, update]

    - role: regulatory_officer
      entity: regulatory_document
      operations: [read, create, update]

rules:
  - id: low_potency_alert
    name: Low Potency Alert
    entity: assay_result
    trigger: on-update
    conditions:
      - field: calculated_potency
        operator: greater-than
        value: 100
    actions:
      - type: notify
        target: principal_investigator
        parameters:
          message: "Compound showed lower than expected potency"

hooks:
  - entity: assay_result
    event: beforeCreate
    handler: validate_assay_data
    phase: validation
    description: Validate assay result data before creation

  - entity: assay_result
    event: afterCreate
    handler: notify_result_created
    phase: integration
    async: true
    description: Send notifications about new result

  - entity: deviation_report
    event: beforeCreate
    handler: assign_deviation_owner
    phase: business_logic
    description: Auto-assign deviation to responsible party

system:
  database:
    type: postgresql
    migrations:
      auto: true

  api:
    documentation:
      enabled: true
      tools:
        - redoc
        - scalar

  features:
    auditLog: true
    encryption: false
    softDelete: true
