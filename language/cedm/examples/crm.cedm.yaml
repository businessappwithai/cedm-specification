# Converted from crm.eml.yaml.

cedm: "1.0"
application:
  name: Enterprise CRM
  version: 1.0.0
enums:
  - name: LeadSource
    values: [web, inbound_call, referral, event, partner, outbound, advertisement]
  - name: Industry
    values: [technology, financial_services, healthcare, manufacturing, retail, public_sector, energy, education, other]
entities:
  - name: User
    help: Someone who signs in and does the work — a rep, a manager, an agent. Every business record names one as its owner.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: email
        type: email
        unique: true
        help: The address this user signs in with. It must be unique across the application.
      - name: firstName
        type: string
        help: Given name, as it should appear on screen and in email.
      - name: lastName
        type: string
        help: Family name, as it should appear on screen and in email.
      - name: role
        type: enum
        values: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager, support_agent, support_manager, administrator]
        help: What this user is allowed to do. The role decides which records they can see at all.
      - name: jobTitle
        type: string
        required: false
        help: The title shown on this user's profile. Presentation only — it grants nothing.
      - name: phone
        type: phone
        required: false
        help: A direct number for this user, for colleagues rather than customers.
      - name: teamId
        type: reference
        target: Team
        required: false
        help: The team this user belongs to, and whose quota their numbers roll up into.
      - name: quotaAnnual
        type: decimal
        required: false
        help: This user's own annual target, in the reporting currency.
      - name: isActive
        type: boolean
        help: Clear this instead of deleting a user who has left — their records keep their owner.
      - name: lastLogin
        type: datetime
        required: false
        help: When this account last signed in. Set by the application, not by hand.
    relationships:
      - name: manages
        target: Territory
        cardinality: 0..*
      - name: owns
        target: Account
        cardinality: 0..*
      - name: owns
        target: Contact
        cardinality: 0..*
      - name: owns
        target: Lead
        cardinality: 0..*
      - name: owns
        target: Campaign
        cardinality: 0..*
      - name: owns
        target: Opportunity
        cardinality: 0..*
      - name: owns
        target: Quote
        cardinality: 0..*
      - name: owns
        target: Contract
        cardinality: 0..*
      - name: owns
        target: SupportCase
        cardinality: 0..*
      - name: owns
        target: Activity
        cardinality: 0..*
    persistence:
      indexes:
        - columns: [email]
          unique: true
  - name: Team
    help: A group of users under one manager, carrying a shared quota. Teams are how sales targets roll up.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: name
        type: string
        help: What this team is called on reports and in the team picker.
      - name: managerId
        type: reference
        target: User
        required: false
        help: The user who runs this team and reviews its pipeline.
      - name: region
        type: string
        required: false
        help: The part of the world this team sells into.
      - name: quotaAnnual
        type: decimal
        required: false
        help: The team's combined annual target. Its members' quotas should add up to about this.
      - name: isActive
        type: boolean
        help: Clear this to retire a team without losing the history of who was in it.
    relationships:
      - name: hasMembers
        target: User
        cardinality: 0..*
        label: has members
      - name: covers
        target: Territory
        cardinality: 0..*
        foreignKey: false
  - name: Territory
    help: A slice of the market — a region, a country, a company-size band — that accounts are assigned to.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: name
        type: string
        help: What this territory is called when an account is assigned to it.
      - name: region
        type: string
        help: The geography this territory covers.
      - name: countryCode
        type: string
        required: false
        help: The ISO country code, when the territory is a single country.
      - name: managerId
        type: reference
        target: User
        required: false
        help: The user accountable for everything in this territory.
      - name: employeeCountFloor
        type: integer
        required: false
        help: The smallest company that belongs in this territory, by headcount. Leave empty for no lower bound.
      - name: employeeCountCeiling
        type: integer
        required: false
        help: The largest company that belongs in this territory, by headcount. Leave empty for no upper bound.
      - name: isActive
        type: boolean
        help: Clear this to stop new accounts being assigned here without disturbing the ones already in it.
    relationships:
      - name: covers
        target: Account
        cardinality: 0..*
  - name: Account
    help: A company you sell to or support. Almost everything else in this application hangs off an account.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: name
        type: string
        help: The company's name as it should appear on a contract or an invoice.
      - name: accountNumber
        type: string
        required: false
        unique: true
        help: Your own reference for this customer. Unique, and usually the key that matches your finance system.
      - name: accountType
        type: enum
        values: [prospect, customer, partner, reseller, former_customer]
        enumName: AccountType
        help: What this company is to you — a customer, a prospect, a partner.
      - name: tier
        type: enum
        required: false
        values: [strategic, enterprise, mid_market, smb]
        help: The service level this account is entitled to. It decides which SLA its cases are measured against.
      - name: industry
        type: enum
        required: false
        enum: Industry
        help: The sector this company trades in, used for segmentation and reporting.
      - name: website
        type: url
        required: false
        help: The company's public website.
      - name: phone
        type: phone
        required: false
        help: The main switchboard number.
      - name: billingStreet
        type: string
        required: false
        help: Street address for invoicing.
      - name: billingCity
        type: string
        required: false
        help: City for invoicing.
      - name: billingPostalCode
        type: string
        required: false
        help: Postal or ZIP code for invoicing.
      - name: billingCountry
        type: string
        required: false
        help: Country for invoicing, which may decide tax treatment.
      - name: employeeCount
        type: integer
        required: false
        help: Roughly how many people work here. Used to size the account and to pick a territory.
      - name: annualRevenue
        type: decimal
        required: false
        help: The company's own annual turnover, not what they spend with you.
      - name: healthScore
        type: integer
        required: false
        help: A 0-100 read on how well this relationship is going. Maintained by the account team.
        minimum: 0
        maximum: 100
      - name: territoryId
        type: reference
        target: Territory
        required: false
        help: The territory this account is covered by, and so which team works it.
      - name: slaPolicyId
        type: reference
        target: SlaPolicy
        required: false
        help: The response and resolution times this account's support cases are held to.
      - name: status
        type: enum
        values: [active, on_hold, churned]
        help: Whether this account is live, on hold, or closed.
      - name: ownerId
        type: reference
        target: User
        help: The user accountable for this relationship.
    relationships:
      - name: employs
        target: Contact
        cardinality: 0..*
      - name: hasPipeline
        target: Opportunity
        cardinality: 0..*
        label: has pipeline
      - name: receives
        target: Quote
        cardinality: 0..*
      - name: signs
        target: Contract
        cardinality: 0..*
      - name: raises
        target: SupportCase
        cardinality: 0..*
      - name: hasHistory
        target: Activity
        cardinality: 0..*
        label: has history
    persistence:
      prefix: bus
      audited: true
      indexes:
        - columns: [account_number]
          unique: true
        - columns: [territory_id, status]
  - name: Contact
    help: A person at an account. Contacts are who you talk to; accounts are who you invoice.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: accountId
        type: reference
        target: Account
        required: false
        help: The company this person works for. Leave empty only for a contact you have not placed yet.
      - name: firstName
        type: string
        help: Given name, as you would address them.
      - name: lastName
        type: string
        help: Family name, as it appears on correspondence.
      - name: email
        type: email
        unique: true
        help: Their work address. It must be unique — two records for one person is how a relationship gets lost.
      - name: phone
        type: phone
        required: false
        help: Desk or switchboard number.
      - name: mobile
        type: phone
        required: false
        help: Mobile number, where they have given you one.
      - name: jobTitle
        type: string
        required: false
        help: Their role at the company, which is how you judge whether they can sign.
      - name: department
        type: string
        required: false
        help: The part of the business they sit in.
      - name: leadSource
        type: enum
        required: false
        enum: LeadSource
        help: Where this person first came from.
      - name: isPrimary
        type: boolean
        help: Set on the one contact who is your main relationship at this account.
      - name: emailOptOut
        type: boolean
        help: Set when they have asked not to receive marketing email. Campaigns must respect it.
      - name: doNotCall
        type: boolean
        help: Set when they have asked not to be telephoned. Respect it the same way.
      - name: status
        type: enum
        values: [active, inactive, bounced, do_not_contact]
        help: Whether this is a live contact, or someone who has moved on.
      - name: ownerId
        type: reference
        target: User
        help: The user who looks after this person.
    relationships:
      - name: champions
        target: Opportunity
        cardinality: 0..*
      - name: reports
        target: SupportCase
        cardinality: 0..*
      - name: isTargetedAs
        target: CampaignMember
        cardinality: 0..*
        label: is targeted as
      - name: involves
        target: Activity
        cardinality: 0..*
    persistence:
      indexes:
        - columns: [email]
          unique: true
        - columns: [account_id, status]
  - name: Lead
    help: An unqualified enquiry that has not been connected to an account yet. A lead is either converted into an account, a contact and an opportunity, or disqualified.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: firstName
        type: string
        help: Given name, as supplied on the enquiry.
      - name: lastName
        type: string
        help: Family name, as supplied on the enquiry.
      - name: companyName
        type: string
        help: The company they said they were from. It becomes the account name on conversion.
      - name: email
        type: email
        help: The address the enquiry came from, and the one you will reply to.
      - name: phone
        type: phone
        required: false
        help: A number to call them back on.
      - name: jobTitle
        type: string
        required: false
        help: Their stated role, which is most of what decides whether this lead is worth working.
      - name: industry
        type: enum
        required: false
        enum: Industry
        help: The sector their company trades in.
      - name: employeeCount
        type: integer
        required: false
        help: Roughly how big their company is. Feeds the score.
      - name: annualRevenue
        type: decimal
        required: false
        help: Their company's turnover, where you know it. Feeds the score.
      - name: leadSource
        type: enum
        enum: LeadSource
        help: How this lead reached you — a campaign, a referral, the website.
      - name: rating
        type: enum
        required: false
        values: [hot, warm, cold]
        help: A quick judgement of quality. The scoring rule sets it; you may override it.
      - name: score
        type: integer
        required: false
        help: A 0-100 fit score the scoring rule calculates from title, size and source. Do not type into it.
        minimum: 0
        maximum: 100
      - name: campaignId
        type: reference
        target: Campaign
        required: false
        help: The campaign that produced this lead, so its cost can be measured against what it generated.
      - name: status
        type: enum
        values: [new, working, nurturing, qualified, converted, disqualified]
        help: Where this lead has got to, from new through to converted or disqualified.
      - name: ownerId
        type: reference
        target: User
        help: The user working this lead.
      - name: convertedAt
        type: datetime
        required: false
        help: When this lead became an account. Set by the conversion process, not by hand.
      - name: disqualificationReason
        type: string
        required: false
        help: Why this lead was dropped. Required when you disqualify one, and it is what makes the report worth reading.
    relationships:
      - name: isTargetedAs
        target: CampaignMember
        cardinality: 0..*
        label: is targeted as
      - name: involves
        target: Activity
        cardinality: 0..*
    lifecycle:
      title: Lead Lifecycle
      states: [new, working, nurturing, qualified, converted, disqualified]
      initial: new
      terminal: [converted, disqualified]
      transitions:
        - from: new
          to: working
          action: engage
        - from: working
          to: nurturing
          action: nurture
        - from: nurturing
          to: working
          action: re_engage
        - from: working
          to: qualified
          action: qualify
        - from: qualified
          to: working
          action: return_to_working
        - from: qualified
          to: converted
          action: convert
        - from: working
          to: disqualified
          action: disqualify
        - from: nurturing
          to: disqualified
          action: disqualify
        - from: new
          to: disqualified
          action: reject
    persistence:
      audited: true
      indexes:
        - columns: [status, score]
        - columns: [owner_id, status]
  - name: Campaign
    help: A marketing programme with a budget and a window, run to generate leads.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: name
        type: string
        help: What this programme is called in reporting.
      - name: campaignType
        type: enum
        values: [email, webinar, conference, paid_search, content, field_event, partner]
        enumName: CampaignType
        help: The kind of programme — an event, a mailing, a webinar.
      - name: status
        type: enum
        values: [planning, active, completed, cancelled]
        help: Whether this campaign is planned, running, or finished.
      - name: startDate
        type: date
        help: The day the campaign goes live.
      - name: endDate
        type: date
        required: false
        help: The day it stops. Leave empty for an open-ended programme.
      - name: budgetedCost
        type: decimal
        required: false
        help: What you agreed to spend.
      - name: actualCost
        type: decimal
        required: false
        help: What it actually cost, which is the half that decides whether to run it again.
      - name: expectedRevenue
        type: decimal
        required: false
        help: The pipeline this campaign is expected to generate.
      - name: expectedResponseCount
        type: integer
        required: false
        help: How many responses you planned for, to compare against what arrived.
      - name: targetAudience
        type: string
        required: false
        help: Who this campaign was aimed at, in a sentence.
      - name: ownerId
        type: reference
        target: User
        help: The user accountable for this programme.
    relationships:
      - name: targets
        target: CampaignMember
        cardinality: 0..*
        ownership: aggregate
      - name: generates
        target: Lead
        cardinality: 0..*
      - name: influences
        target: Opportunity
        cardinality: 0..*
  - name: CampaignMember
    help: One person on one campaign's target list, and whether they responded.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: campaignId
        type: reference
        target: Campaign
        help: The campaign this person was targeted by.
      - name: leadId
        type: reference
        target: Lead
        required: false
        help: The lead who was targeted, when the target was not yet a known contact.
      - name: contactId
        type: reference
        target: Contact
        required: false
        help: The contact who was targeted, when they were already known to you.
      - name: memberStatus
        type: enum
        values: [targeted, invited, registered, attended, responded, converted, unsubscribed]
        enumName: CampaignMemberStatus
        help: Where this person got to in the campaign — sent, opened, responded.
      - name: respondedAt
        type: datetime
        required: false
        help: When they responded. Empty until they do.
      - name: hasResponded
        type: boolean
        help: Set once any response arrives, so response rates can be counted without reading dates.
    persistence:
      indexes:
        - columns: [campaign_id, member_status]
  - name: Opportunity
    help: A deal in progress against an account, with an amount, a stage and a close date. The pipeline is the sum of these.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: accountId
        type: reference
        target: Account
        help: The company this deal is with.
      - name: contactId
        type: reference
        target: Contact
        required: false
        help: The person championing this deal inside the account.
      - name: campaignId
        type: reference
        target: Campaign
        required: false
        help: The campaign this deal can be attributed to, where there is one.
      - name: name
        type: string
        help: A short description of what is being bought, as it reads in the pipeline list.
      - name: description
        type: text
        required: false
        help: The detail — what they need, what you proposed, what is still open.
        ui: textarea
      - name: amount
        type: decimal
        required: false
        help: The value of this deal. It should agree with its line items.
      - name: currencyCode
        type: string
        help: The currency the amount is in.
      - name: stage
        type: enum
        values: [prospecting, qualification, needs_analysis, proposal, negotiation, closed_won, closed_lost]
        help: How far along this deal is. The stage is what the forecast is built from.
      - name: probability
        type: integer
        required: false
        help: The 0-100 chance of winning. The forecasting rule derives it from the stage.
        minimum: 0
        maximum: 100
      - name: forecastCategory
        type: enum
        required: false
        values: [pipeline, best_case, commit, closed, omitted]
        enumName: ForecastCategory
        help: Which forecast bucket this deal falls in — pipeline, best case, commit.
      - name: expectedCloseDate
        type: date
        required: false
        help: When you expect to win it. Moving this date is the single most watched change on a deal.
      - name: actualCloseDate
        type: date
        required: false
        help: When it actually closed, won or lost. Set when the stage becomes final.
      - name: leadSource
        type: enum
        required: false
        enum: LeadSource
        help: Where the deal originally came from.
      - name: nextStep
        type: string
        required: false
        help: The one thing that has to happen next, and by when.
      - name: lossReason
        type: enum
        required: false
        values: [price, product_fit, competitor, no_decision, timing, budget]
        enumName: LossReason
        help: Why the deal was lost. Required on a closed-lost deal, and the reason loss reports mean anything.
      - name: ownerId
        type: reference
        target: User
        help: The user selling this deal.
    relationships:
      - name: contains
        target: OpportunityLineItem
        cardinality: 0..*
        ownership: aggregate
      - name: isPricedBy
        target: Quote
        cardinality: 0..*
        label: is priced by
      - name: isWorkedThrough
        target: Activity
        cardinality: 0..*
        label: is worked through
    lifecycle:
      name: OpportunityPipeline
      title: Opportunity Pipeline
      states: [prospecting, qualification, needs_analysis, closed_lost, proposal, negotiation, closed_won]
      initial: prospecting
      terminal: [closed_won, closed_lost]
      transitions:
        - from: prospecting
          to: qualification
          action: qualify
        - from: qualification
          to: needs_analysis
          action: discover
        - from: qualification
          to: closed_lost
          action: disqualify
        - from: needs_analysis
          to: proposal
          action: send_proposal
        - from: needs_analysis
          to: closed_lost
          action: no_fit
        - from: proposal
          to: negotiation
          action: negotiate
        - from: proposal
          to: closed_lost
          action: lose
        - from: negotiation
          to: closed_won
          action: close_won
        - from: negotiation
          to: closed_lost
          action: close_lost
        - from: negotiation
          to: proposal
          action: reprice
    persistence:
      audited: true
      indexes:
        - columns: [account_id, stage]
        - columns: [owner_id, expected_close_date]
  - name: OpportunityLineItem
    help: One product on one opportunity, priced. The opportunity's amount is what these add up to.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: opportunityId
        type: reference
        target: Opportunity
        help: The deal this line belongs to.
      - name: productId
        type: reference
        target: Product
        help: What is being sold on this line.
      - name: quantity
        type: decimal
        help: How many.
      - name: unitPrice
        type: decimal
        help: The price for one, before any discount on this line.
      - name: discountPercent
        type: decimal
        required: false
        help: The discount applied to this line, as a percentage.
      - name: lineTotal
        type: decimal
        help: Quantity times unit price, less the discount. Calculated — do not type into it.
      - name: lineDescription
        type: string
        required: false
        help: Anything about this line the product name does not say.
  - name: Product
    help: Something you sell, with a list price. Products are what line items point at.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: productCode
        type: string
        unique: true
        help: Your own catalogue code for this product. Unique, and what an order refers to.
      - name: name
        type: string
        help: The product's name as it appears on a quote.
      - name: description
        type: text
        required: false
        help: What it is and what it includes, in the words a customer would read.
      - name: family
        type: enum
        values: [platform, add_on, professional_services, support_plan, training]
        help: The group this product belongs to, for reporting and for the product picker.
      - name: listPrice
        type: decimal
        help: The published price before any discount.
        minimum: 0
      - name: unitCost
        type: decimal
        required: false
        help: What it costs you, which is what makes margin calculable.
      - name: billingFrequency
        type: string
        required: false
        help: How often this is charged — once, monthly, annually.
      - name: isActive
        type: boolean
        help: Clear this to stop the product being added to new quotes without disturbing the ones it is already on.
    relationships:
      - name: isSoldAs
        target: OpportunityLineItem
        cardinality: 0..*
        label: is sold as
      - name: isQuotedAs
        target: QuoteLineItem
        cardinality: 0..*
        label: is quoted as
    ui:
      label: Product Catalogue
    persistence:
      indexes:
        - columns: [product_code]
          unique: true
  - name: Quote
    help: A priced, versioned offer to an account for one opportunity. A quote is what gets approved and sent.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: quoteNumber
        type: string
        required: false
        unique: true
        help: The reference the customer will quote back at you. Unique.
      - name: opportunityId
        type: reference
        target: Opportunity
        help: The deal this quote prices.
      - name: accountId
        type: reference
        target: Account
        help: The company the quote is addressed to.
      - name: name
        type: string
        help: A short title for this quote, so several versions can be told apart.
      - name: status
        type: enum
        values: [draft, in_review, approved, rejected, presented, accepted, expired]
        help: Where this quote is — draft, waiting for approval, sent, accepted, rejected.
      - name: versionNumber
        type: integer
        help: Which revision this is. A new version is raised rather than an old one edited.
      - name: validUntil
        type: date
        required: false
        help: The day this offer expires.
      - name: subtotal
        type: decimal
        help: The line items added up, before discount and tax.
      - name: discountPercent
        type: decimal
        required: false
        help: A discount across the whole quote. Past the approval threshold it needs a manager.
        minimum: 0
        maximum: 100
      - name: discountAmount
        type: decimal
        required: false
        help: The discount in money, where it was agreed as an amount rather than a percentage.
      - name: taxAmount
        type: decimal
        required: false
        help: Tax on the discounted subtotal.
      - name: grandTotal
        type: decimal
        help: What the customer will actually pay. Calculated — do not type into it.
      - name: approvedById
        type: reference
        target: User
        required: false
        help: The manager who approved this quote's discount. Empty until one does.
      - name: approvedAt
        type: datetime
        required: false
        help: When approval was given.
      - name: approvalNotes
        type: text
        required: false
        help: What the approver said — the conditions, or why they refused.
      - name: ownerId
        type: reference
        target: User
        help: The user who raised this quote.
    relationships:
      - name: contains
        target: QuoteLineItem
        cardinality: 0..*
        ownership: aggregate
      - name: becomes
        target: Contract
        cardinality: 0..*
    lifecycle:
      name: QuoteApproval
      title: Quote Approval
      states: [draft, in_review, approved, rejected, presented, expired, accepted]
      initial: draft
      terminal: [accepted, expired]
      transitions:
        - from: draft
          to: in_review
          action: submit_for_approval
        - from: in_review
          to: approved
          action: approve
        - from: in_review
          to: rejected
          action: reject
        - from: rejected
          to: draft
          action: revise
        - from: approved
          to: presented
          action: present
        - from: approved
          to: expired
          action: lapse
        - from: presented
          to: accepted
          action: accept
        - from: presented
          to: draft
          action: renegotiate
        - from: presented
          to: expired
          action: lapse
    persistence:
      audited: true
      indexes:
        - columns: [quote_number]
          unique: true
        - columns: [opportunity_id, status]
  - name: QuoteLineItem
    help: One product on one quote, priced, in the order it appears on the document.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: quoteId
        type: reference
        target: Quote
        help: The quote this line appears on.
      - name: productId
        type: reference
        target: Product
        help: What is being quoted on this line.
      - name: quantity
        type: decimal
        help: How many.
      - name: unitPrice
        type: decimal
        help: The price for one, before any discount on this line.
      - name: discountPercent
        type: decimal
        required: false
        help: The discount applied to this line, as a percentage.
      - name: lineTotal
        type: decimal
        help: Quantity times unit price, less the discount. Calculated — do not type into it.
      - name: sortOrder
        type: integer
        required: false
        help: Where this line sits on the printed quote.
  - name: Contract
    help: The signed commitment that follows an accepted quote — a term, an annual value and a renewal date.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: contractNumber
        type: string
        required: false
        unique: true
        help: The reference this agreement is known by. Unique.
      - name: accountId
        type: reference
        target: Account
        help: The company that signed.
      - name: quoteId
        type: reference
        target: Quote
        required: false
        help: The accepted quote this contract was written from.
      - name: status
        type: enum
        values: [draft, in_approval, active, expiring, renewed, expired, terminated]
        help: Where the agreement is — drafted, out for signature, active, expired.
      - name: startDate
        type: date
        required: false
        help: The day the term begins.
      - name: endDate
        type: date
        required: false
        help: The day the term ends, and so the day the renewal conversation is already late.
      - name: termMonths
        type: integer
        help: How long the term runs, in months.
      - name: annualValue
        type: decimal
        help: What this agreement is worth per year. The renewal book is the sum of these.
      - name: autoRenew
        type: boolean
        help: Set when the term rolls over unless someone cancels it.
        default: "false"
      - name: renewalNoticeDays
        type: integer
        required: false
        help: How many days' notice either side must give. It decides when the renewal work has to start.
      - name: signedById
        type: reference
        target: User
        required: false
        help: The user who countersigned on your side.
      - name: signedAt
        type: datetime
        required: false
        help: When it was signed.
      - name: ownerId
        type: reference
        target: User
        help: The user accountable for this agreement and its renewal.
    relationships:
      - name: isServicedBy
        target: Activity
        cardinality: 0..*
        label: is serviced by
    lifecycle:
      title: Contract Lifecycle
      states: [draft, in_approval, active, expiring, terminated, renewed, expired]
      initial: draft
      terminal: [expired, terminated]
      transitions:
        - from: draft
          to: in_approval
          action: submit_for_signature
        - from: in_approval
          to: draft
          action: return_for_edit
        - from: in_approval
          to: active
          action: counter_signed
        - from: active
          to: expiring
          action: enter_renewal_window
        - from: active
          to: terminated
          action: terminate
        - from: expiring
          to: renewed
          action: renew
        - from: expiring
          to: expired
          action: lapse
        - from: expiring
          to: terminated
          action: terminate
        - from: renewed
          to: active
          action: activate_renewal
    persistence:
      audited: true
      indexes:
        - columns: [contract_number]
          unique: true
        - columns: [account_id, end_date]
  - name: SupportCase
    help: A customer problem, from the moment it arrives to the moment it is resolved, measured against an SLA.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: caseNumber
        type: string
        required: false
        unique: true
        help: The reference the customer quotes when they chase. Unique.
      - name: accountId
        type: reference
        target: Account
        help: The company reporting the problem. It decides which SLA applies.
      - name: contactId
        type: reference
        target: Contact
        required: false
        help: The person who reported it, and who you will reply to.
      - name: slaPolicyId
        type: reference
        target: SlaPolicy
        required: false
        help: The response and resolution times this case is measured against.
      - name: subject
        type: string
        help: The problem in one line, as it reads in the queue.
      - name: description
        type: text
        required: false
        help: What happened, what they expected, and what they have already tried.
        ui: textarea
      - name: caseType
        type: enum
        values: [question, incident, defect, feature_request, billing]
        enumName: CaseType
        help: What kind of case this is — a question, an incident, a defect, a request.
      - name: priority
        type: enum
        values: [low, medium, high, critical]
        enumName: CasePriority
        help: How urgent it is. The triage rule sets it from type and account tier.
      - name: origin
        type: enum
        values: [email, phone, web, chat, partner_portal]
        enumName: CaseOrigin
        help: How the case reached you — email, phone, the web, the partner portal.
      - name: status
        type: enum
        values: [new, assigned, in_progress, waiting_on_customer, escalated, resolved, closed]
        enumName: CaseStatus
        help: Where the case is, from new through to closed.
      - name: firstResponseDueAt
        type: datetime
        required: false
        help: When the customer must have heard from a person. Calculated from the SLA on arrival.
      - name: firstResponseAt
        type: datetime
        required: false
        help: When they actually did. Empty until someone replies.
      - name: resolutionDueAt
        type: datetime
        required: false
        help: When the case must be resolved by, under the SLA.
      - name: resolvedAt
        type: datetime
        required: false
        help: When it actually was resolved.
      - name: isSlaBreached
        type: boolean
        help: Set when a due time passed unmet. It is what breach reporting counts.
      - name: resolutionNotes
        type: text
        required: false
        help: What fixed it, in enough detail that the next person with this problem is helped.
      - name: satisfactionScore
        type: integer
        required: false
        help: What the customer scored the handling, 1 to 5, after it closed.
        minimum: 1
        maximum: 5
      - name: escalatedById
        type: reference
        target: User
        required: false
        help: The user who escalated this case, when one did.
      - name: ownerId
        type: reference
        target: User
        help: The agent handling it.
    relationships:
      - name: isHandledThrough
        target: Activity
        cardinality: 0..*
        label: is handled through
    lifecycle:
      title: Support Case Lifecycle
      states: [new, assigned, in_progress, waiting_on_customer, escalated, resolved, closed]
      initial: new
      terminal: [closed]
      transitions:
        - from: new
          to: assigned
          action: assign
        - from: assigned
          to: in_progress
          action: start_work
        - from: in_progress
          to: waiting_on_customer
          action: request_information
        - from: waiting_on_customer
          to: in_progress
          action: customer_responded
        - from: in_progress
          to: escalated
          action: escalate
        - from: escalated
          to: in_progress
          action: de_escalate
        - from: in_progress
          to: resolved
          action: resolve
        - from: resolved
          to: in_progress
          action: reopen
        - from: resolved
          to: closed
          action: close
    persistence:
      audited: true
      indexes:
        - columns: [case_number]
          unique: true
        - columns: [account_id, status]
        - columns: [owner_id, priority]
  - name: SlaPolicy
    help: How quickly cases must be answered and resolved for a given tier of customer.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: name
        type: string
        help: What this policy is called when an account or a case is assigned to it.
      - name: tier
        type: enum
        values: [standard, premium, enterprise, platinum]
        enumName: SlaTier
        help: The customer tier this policy is written for.
      - name: firstResponseMinutes
        type: integer
        help: How long a customer may wait to hear from a person, in minutes.
      - name: resolutionHours
        type: integer
        help: How long they may wait for the problem to be fixed, in hours.
      - name: businessHoursOnly
        type: boolean
        help: Set when the clock stops overnight and at weekends.
      - name: isActive
        type: boolean
        help: Clear this to retire a policy without disturbing the cases already measured against it.
    relationships:
      - name: governs
        target: Account
        cardinality: 0..*
      - name: appliesTo
        target: SupportCase
        cardinality: 0..*
        label: applies to
  - name: Activity
    help: A call, a meeting, an email or a task, attached to whatever it was about. The history of a relationship is its activities.
    identity:
      key: id
    attributes:
      - name: id
        type: string
      - name: activityType
        type: enum
        values: [call, email, meeting, task, note, demo]
        enumName: ActivityType
        help: What happened — a call, a meeting, an email, a task.
      - name: subject
        type: string
        help: The activity in one line, as it reads on a timeline.
      - name: description
        type: text
        required: false
        help: What was said, agreed or found out.
      - name: status
        type: enum
        values: [planned, in_progress, completed, cancelled]
        help: Whether this is still to do, in hand, or done.
      - name: priority
        type: enum
        values: [low, medium, high, urgent]
        help: How urgent it is, for the person whose list it is on.
      - name: dueAt
        type: datetime
        required: false
        help: When it has to happen by.
      - name: completedAt
        type: datetime
        required: false
        help: When it actually did.
      - name: durationMinutes
        type: integer
        required: false
        help: How long it took, for calls and meetings.
      - name: accountId
        type: reference
        target: Account
        required: false
        help: The company this activity was about.
      - name: contactId
        type: reference
        target: Contact
        required: false
        help: The person it involved.
      - name: leadId
        type: reference
        target: Lead
        required: false
        help: The lead it was about, before there is an account.
      - name: opportunityId
        type: reference
        target: Opportunity
        required: false
        help: The deal it moved forward.
      - name: supportCaseId
        type: reference
        target: SupportCase
        required: false
        help: The case it was part of handling.
      - name: contractId
        type: reference
        target: Contract
        required: false
        help: The agreement it concerned.
      - name: ownerId
        type: reference
        target: User
        help: The user who did it, or has to.
    persistence:
      softDelete: true
      indexes:
        - columns: [owner_id, due_at]
        - columns: [account_id, activity_type]
