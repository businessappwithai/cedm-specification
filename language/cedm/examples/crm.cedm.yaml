    handler: nudgeStalledOpportunities
  - entity: Quote
    source: cron:0 6 * * *
    handler: expireStaleQuotes
  - entity: SupportCase
    source: cron:*/15 * * * *
    handler: checkSlaBreaches
  - entity: SupportCase
    source: webhook:helpdesk
    handler: ingestInboundCase
  - entity: Contract
    source: cron:0 8 * * *
    handler: openRenewalWindows
  - entity: Contract
    source: message:billing.invoice.paid
    handler: markContractActive
reports:
  - name: rep-stalled-deals
    title: Deals with no activity in 14 days
    entity: Opportunity
    chart: bar
    x: owner
    y: deals
    help: The rep's own pipeline hygiene and the manager's Monday question. A deal nobody has touched in a fortnight is not a forecast, it is a hope.
    sql: SELECT u.first_name || ' ' || u.last_name AS owner, COUNT(*) AS deals FROM bus_opportunity o JOIN bus_user u ON u.id = o.owner_id WHERE o.deleted_at IS NULL AND o.stage NOT IN ('closed_won', 'closed_lost') AND o.updated_at < now() - interval '14 days' GROUP BY 1 ORDER BY deals DESC
  - name: rep-overdue-activities
    title: Overdue calls, tasks and meetings
    entity: Activity
    help: The first screen of the day. An activity past its due date is a promise made to a customer and not kept, and it is the cheapest thing in this application to fix.
    sql: SELECT u.first_name || ' ' || u.last_name AS owner, a.activity_type, a.subject, a.priority, a.due_at FROM bus_activity a JOIN bus_user u ON u.id = a.owner_id WHERE a.deleted_at IS NULL AND a.status IN ('planned', 'in_progress') AND a.due_at < now() ORDER BY a.due_at
  - name: rep-unworked-leads
    title: New leads nobody has worked
    entity: Lead
    help: A lead still sitting in new after 48 hours has gone cold, and whoever it was routed to has not noticed. The age column is the argument.
    sql: SELECT l.first_name || ' ' || l.last_name AS lead, l.company_name, l.lead_source, l.rating, EXTRACT(hour FROM now() - l.created_at)::int AS hours_old FROM bus_lead l WHERE l.deleted_at IS NULL AND l.status = 'new' AND l.created_at < now() - interval '48 hours' ORDER BY hours_old DESC
  - name: rep-pipeline-by-stage
    title: Open pipeline value by stage
    entity: Opportunity
    chart: bar
    x: stage
    y: value
    help: What the rep is carrying, in money rather than deal count. Stage order is the sales process, so a fat prospecting column and a thin negotiation one is a rep who is prospecting instead of closing.
    sql: SELECT o.stage, SUM(o.amount) AS value, COUNT(*) AS deals FROM bus_opportunity o WHERE o.deleted_at IS NULL AND o.stage NOT IN ('closed_won', 'closed_lost') GROUP BY 1 ORDER BY value DESC
  - name: ae-closing-this-month
    title: Deals closing this month
    entity: Opportunity
    help: The commit list. Sorted by close date rather than value, because the question is what has to be done this week, not what is worth most.
    sql: SELECT o.name AS opportunity, a.name AS account, o.stage, o.amount, o.expected_close_date FROM bus_opportunity o JOIN bus_account a ON a.id = o.account_id WHERE o.deleted_at IS NULL AND o.stage NOT IN ('closed_won', 'closed_lost') AND o.expected_close_date >= date_trunc('month', now())::date AND o.expected_close_date < (date_trunc('month', now()) + interval '1 month')::date ORDER BY o.expected_close_date
  - name: ae-accounts-at-risk
    title: Accounts at risk
    entity: Account
    chart: bar
    x: account
    y: health
    help: Customers whose health score has fallen or who are on hold. An account executive who learns about churn from the renewal date learns too late.
    sql: SELECT a.name AS account, a.tier, COALESCE(a.health_score, 0) AS health, a.status FROM bus_account a WHERE a.deleted_at IS NULL AND a.account_type = 'customer' AND (a.status = 'on_hold' OR a.health_score < 50) ORDER BY health
  - name: ae-quotes-with-customer
    title: Quotes presented and not answered
    entity: Quote
    help: A quote sitting with the customer past its validity date is a deal that has quietly expired. Nobody is told; the date simply passes.
    sql: SELECT q.quote_number, a.name AS account, q.grand_total, q.valid_until, EXTRACT(day FROM now() - q.valid_until)::int AS days_past_validity FROM bus_quote q JOIN bus_account a ON a.id = q.account_id WHERE q.deleted_at IS NULL AND q.status = 'presented' AND q.valid_until < now()::date ORDER BY days_past_validity DESC
  - name: ae-renewals-next-quarter
    title: Renewals due next quarter
    entity: Contract
    help: The renewal conversation has to start a quarter early to be a conversation rather than an invoice. Auto-renew is shown because those need a different one.
    sql: SELECT c.contract_number, a.name AS account, c.end_date, c.annual_value, c.auto_renew, c.renewal_notice_days FROM bus_contract c JOIN bus_account a ON a.id = c.account_id WHERE c.deleted_at IS NULL AND c.status IN ('active', 'expiring') AND c.end_date BETWEEN (now() + interval '90 days')::date AND (now() + interval '180 days')::date ORDER BY c.end_date
  - name: manager-quota-attainment
    title: Quota attainment by rep
    entity: User
    chart: bar
    x: rep
    y: won
    help: What goes into the forecast call. Closed-won against the annual quota the model already records on each user, so the two numbers cannot disagree.
    sql: SELECT u.first_name || ' ' || u.last_name AS rep, COALESCE(SUM(o.amount) FILTER (WHERE o.stage = 'closed_won'), 0) AS won, MAX(u.quota_annual) AS quota FROM bus_user u LEFT JOIN bus_opportunity o ON o.owner_id = u.id AND o.deleted_at IS NULL WHERE u.deleted_at IS NULL AND u.is_active AND u.quota_annual IS NOT NULL GROUP BY u.id, u.first_name, u.last_name ORDER BY won DESC
  - name: manager-loss-reasons
    title: Why deals were lost
    entity: Opportunity
    chart: pie
    x: reason
    y: deals
    help: The only report here that changes what the team does next quarter rather than what it does this week. A blank loss reason is itself the finding.
    sql: SELECT COALESCE(NULLIF(o.loss_reason, ''), '(not recorded)') AS reason, COUNT(*) AS deals, SUM(o.amount) AS value FROM bus_opportunity o WHERE o.deleted_at IS NULL AND o.stage = 'closed_lost' GROUP BY 1 ORDER BY deals DESC
  - name: manager-team-coverage
    title: Pipeline coverage by team
    entity: Team
    chart: bar
    x: team
    y: pipeline
    help: Open pipeline against the team quota. Coverage under about three times quota means the quarter is already lost and nobody has said so.
    sql: SELECT t.name AS team, COALESCE(SUM(o.amount) FILTER (WHERE o.stage NOT IN ('closed_won','closed_lost')), 0) AS pipeline, MAX(t.quota_annual) AS quota FROM bus_team t LEFT JOIN bus_user u ON u.team_id = t.id AND u.deleted_at IS NULL LEFT JOIN bus_opportunity o ON o.owner_id = u.id AND o.deleted_at IS NULL WHERE t.deleted_at IS NULL AND t.is_active GROUP BY t.id, t.name ORDER BY pipeline DESC
  - name: manager-slipping-deals
    title: Deals that have slipped their close date
    entity: Opportunity
    help: An open deal whose expected close date is in the past has slipped and nobody re-forecast it. These are the ones that make a forecast wrong twice.
    sql: SELECT o.name AS opportunity, a.name AS account, u.first_name || ' ' || u.last_name AS owner, o.stage, o.amount, o.expected_close_date FROM bus_opportunity o JOIN bus_account a ON a.id = o.account_id LEFT JOIN bus_user u ON u.id = o.owner_id WHERE o.deleted_at IS NULL AND o.stage NOT IN ('closed_won','closed_lost') AND o.expected_close_date < now()::date ORDER BY o.expected_close_date
  - name: ops-quotes-awaiting-approval
    title: Quotes waiting on an approver
    entity: Quote
    help: Sales ops owns the approval queue. A quote sitting in review is a deal that cannot be signed, and the age column is what turns that into a phone call.
    sql: SELECT q.quote_number, a.name AS account, q.grand_total, q.discount_percent, EXTRACT(day FROM now() - q.created_at)::int AS days_waiting FROM bus_quote q JOIN bus_account a ON a.id = q.account_id WHERE q.deleted_at IS NULL AND q.status = 'in_review' ORDER BY days_waiting DESC
  - name: ops-accounts-without-contacts
    title: Accounts with nobody to call
    entity: Account
    help: An account with no contact cannot be sold to or supported. Usually a migration that half-finished, and invisible until somebody tries to use it.
    sql: SELECT a.name AS account, a.account_type, a.tier FROM bus_account a LEFT JOIN bus_contact c ON c.account_id = a.id AND c.deleted_at IS NULL WHERE a.deleted_at IS NULL GROUP BY a.id, a.name, a.account_type, a.tier HAVING COUNT(c.id) = 0 ORDER BY a.name
  - name: ops-empty-opportunities
    title: Opportunities with no products
    entity: Opportunity
    help: A deal with an amount and no line items is a number somebody typed. It cannot be quoted from, and it is the most common reason a quote total does not match its opportunity.
    sql: SELECT o.name AS opportunity, a.name AS account, o.stage, o.amount FROM bus_opportunity o JOIN bus_account a ON a.id = o.account_id LEFT JOIN bus_opportunity_line_item li ON li.opportunity_id = o.id AND li.deleted_at IS NULL WHERE o.deleted_at IS NULL AND o.stage NOT IN ('closed_lost') GROUP BY o.id, o.name, a.name, o.stage, o.amount HAVING COUNT(li.id) = 0 ORDER BY o.amount DESC
  - name: ops-discount-exposure
    title: Discount exposure by tier
    entity: Quote
    chart: bar
    x: tier
    y: discounted_value
    help: What the discount policy is actually costing, grouped by the account tier that is supposed to justify it. Deep discounts concentrated outside the strategic tier mean the policy is being worked around.
    sql: SELECT COALESCE(a.tier, '(unset)') AS tier, ROUND(SUM(q.discount_amount)::numeric, 2) AS discounted_value, ROUND(AVG(q.discount_percent)::numeric, 1) AS avg_discount_pct FROM bus_quote q JOIN bus_account a ON a.id = q.account_id WHERE q.deleted_at IS NULL AND q.status IN ('approved','presented','accepted') GROUP BY 1 ORDER BY discounted_value DESC
  - name: ops-territory-coverage
    title: Accounts per territory
    entity: Territory
    chart: bar
    x: territory
    y: accounts
    help: A territory with no accounts is a routing rule that never fires; one with far too many is a rep who cannot cover it. Both are invisible from inside a single account.
    sql: SELECT t.name AS territory, t.region, COUNT(a.id) AS accounts FROM bus_territory t LEFT JOIN bus_account a ON a.territory_id = t.id AND a.deleted_at IS NULL WHERE t.deleted_at IS NULL AND t.is_active GROUP BY t.id, t.name, t.region ORDER BY accounts DESC
  - name: marketing-campaign-response
    title: Campaign response rate
    entity: Campaign
    chart: bar
    x: campaign
    y: responded
    help: The one number. Members who responded against members targeted, so a campaign that reached nobody is visibly different from one that reached everybody and convinced none of them.
    sql: SELECT c.name AS campaign, COUNT(m.id) FILTER (WHERE m.has_responded) AS responded, COUNT(m.id) AS members FROM bus_campaign c LEFT JOIN bus_campaign_member m ON m.campaign_id = c.id AND m.deleted_at IS NULL WHERE c.deleted_at IS NULL GROUP BY c.id, c.name ORDER BY responded DESC
  - name: marketing-campaign-return
    title: Cost against influenced revenue
    entity: Campaign
    chart: bar
    x: campaign
    y: won_value
    help: Actual cost against closed-won revenue on the opportunities the campaign is attached to. The only report that decides next year's budget.
    sql: SELECT c.name AS campaign, c.actual_cost, COALESCE(SUM(o.amount) FILTER (WHERE o.stage = 'closed_won'), 0) AS won_value FROM bus_campaign c LEFT JOIN bus_opportunity o ON o.campaign_id = c.id AND o.deleted_at IS NULL WHERE c.deleted_at IS NULL AND c.status = 'completed' GROUP BY c.id, c.name, c.actual_cost ORDER BY won_value DESC
  - name: marketing-lead-source
    title: Lead quality by source
    entity: Lead
    chart: bar
    x: source
    y: qualified
    help: Volume flatters the cheap sources. Qualified and converted counts alongside it are what separate a source worth paying for from one worth switching off.
    sql: SELECT COALESCE(l.lead_source, '(unset)') AS source, COUNT(*) AS leads, COUNT(*) FILTER (WHERE l.status IN ('qualified','converted')) AS qualified, COUNT(*) FILTER (WHERE l.status = 'converted') AS converted FROM bus_lead l WHERE l.deleted_at IS NULL GROUP BY 1 ORDER BY qualified DESC
  - name: marketing-spent-no-response
    title: Campaigns that spent and got nothing
    entity: Campaign
    help: Money out, no responses in. Nobody runs this report voluntarily, which is exactly why it belongs on the dashboard.
    sql: SELECT c.name AS campaign, c.campaign_type, c.actual_cost, COUNT(m.id) AS members FROM bus_campaign c LEFT JOIN bus_campaign_member m ON m.campaign_id = c.id AND m.has_responded AND m.deleted_at IS NULL WHERE c.deleted_at IS NULL AND c.status = 'completed' AND COALESCE(c.actual_cost, 0) > 0 GROUP BY c.id, c.name, c.campaign_type, c.actual_cost HAVING COUNT(m.id) = 0 ORDER BY c.actual_cost DESC
  - name: agent-cases-past-first-response
    title: Cases past their first-response target
    entity: SupportCase
    help: What gets checked before standup. A case past its first-response time is an SLA breach that is already happening, not one that might.
    sql: SELECT sc.case_number, sc.subject, sc.priority, sc.created_at, sc.first_response_due_at FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.first_response_at IS NULL AND sc.first_response_due_at < now() AND sc.status NOT IN ('closed', 'resolved') ORDER BY sc.first_response_due_at
  - name: agent-open-by-priority
    title: Open cases by priority
    entity: SupportCase
    chart: bar
    x: priority
    y: cases
    help: The shape of the queue. An agent with four critical cases works differently from one with forty low ones, and the register alone does not show which they have.
    sql: SELECT sc.priority, COUNT(*) AS cases FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.status NOT IN ('resolved','closed') GROUP BY 1 ORDER BY cases DESC
  - name: agent-waiting-on-customer
    title: Cases waiting on a customer for over a week
    entity: SupportCase
    help: Waiting on customer is where cases go to be forgotten. After a week it is not the customer who has stopped replying, it is the case that has stopped being chased.
    sql: SELECT sc.case_number, sc.subject, sc.priority, sc.updated_at, EXTRACT(day FROM now() - sc.updated_at)::int AS days_waiting FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.status = 'waiting_on_customer' AND sc.updated_at < now() - interval '7 days' ORDER BY days_waiting DESC
  - name: agent-resolution-due
    title: Cases approaching their resolution deadline
    entity: SupportCase
    help: Answered on time and then left unresolved is the second SLA, and the one nobody watches. These are still savable.
    sql: SELECT sc.case_number, sc.subject, sc.priority, sc.resolution_due_at FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.resolved_at IS NULL AND sc.resolution_due_at IS NOT NULL AND sc.resolution_due_at BETWEEN now() AND now() + interval '24 hours' ORDER BY sc.resolution_due_at
  - name: support-breaches-by-priority
    title: SLA breaches by priority
    entity: SupportCase
    chart: bar
    x: priority
    y: breached
    help: The weekly review. Breaches concentrated in one priority band mean the SLA policy is wrong, not that the team is slow.
    sql: SELECT sc.priority, COUNT(*) AS breached FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.is_sla_breached GROUP BY 1 ORDER BY breached DESC
  - name: support-resolution-time
    title: Median resolution hours by agent
    entity: User
    chart: bar
    x: agent
    y: median_hours
    help: Median rather than average, because one case that sat open over a holiday makes an average meaningless. Case count alongside it, so a fast agent with three cases is not mistaken for a fast team.
    sql: SELECT u.first_name || ' ' || u.last_name AS agent, COUNT(*) AS resolved, ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY EXTRACT(epoch FROM sc.resolved_at - sc.created_at) / 3600.0)::numeric, 1) AS median_hours FROM bus_support_case sc JOIN bus_user u ON u.id = sc.owner_id WHERE sc.deleted_at IS NULL AND sc.resolved_at IS NOT NULL GROUP BY u.id, u.first_name, u.last_name ORDER BY median_hours
  - name: support-satisfaction
    title: Satisfaction by case type
    entity: SupportCase
    chart: bar
    x: case_type
    y: avg_score
    help: Where the team is disliked rather than merely slow. A low score on defects is a product problem; a low score on questions is a documentation problem.
    sql: SELECT sc.case_type, ROUND(AVG(sc.satisfaction_score)::numeric, 2) AS avg_score, COUNT(*) FILTER (WHERE sc.satisfaction_score IS NOT NULL) AS responses FROM bus_support_case sc WHERE sc.deleted_at IS NULL AND sc.satisfaction_score IS NOT NULL GROUP BY 1 ORDER BY avg_score
  - name: support-escalated-open
    title: Escalated cases still open
    entity: SupportCase
    help: An escalation that is still open is one the manager already agreed to own. Sorted oldest first, because the escalation itself is the promise.
    sql: SELECT sc.case_number, a.name AS account, sc.subject, sc.priority, sc.created_at FROM bus_support_case sc LEFT JOIN bus_account a ON a.id = sc.account_id WHERE sc.deleted_at IS NULL AND sc.status = 'escalated' ORDER BY sc.created_at
  - name: admin-contracts-expiring
    title: Contracts expiring in 90 days
    entity: Contract
    help: The renewal list, and the only report here nobody asks for until it is too late. Auto-renew is shown because a contract that renews itself needs a different conversation from one that lapses.
    sql: SELECT c.contract_number, a.name AS account, c.end_date, c.annual_value, c.auto_renew FROM bus_contract c JOIN bus_account a ON a.id = c.account_id WHERE c.deleted_at IS NULL AND c.status = 'active' AND c.end_date BETWEEN now()::date AND (now() + interval '90 days')::date ORDER BY c.end_date
  - name: admin-inactive-owners
    title: Open work owned by deactivated users
    entity: User
    help: When somebody leaves, their pipeline and their cases stay pointed at them. Nothing in the application complains; the work simply stops moving.
    sql: SELECT u.first_name || ' ' || u.last_name AS former_user, u.email, COUNT(DISTINCT o.id) AS open_deals, COUNT(DISTINCT sc.id) AS open_cases FROM bus_user u LEFT JOIN bus_opportunity o ON o.owner_id = u.id AND o.deleted_at IS NULL AND o.stage NOT IN ('closed_won','closed_lost') LEFT JOIN bus_support_case sc ON sc.owner_id = u.id AND sc.deleted_at IS NULL AND sc.status NOT IN ('resolved','closed') WHERE u.deleted_at IS NULL AND NOT u.is_active GROUP BY u.id, u.first_name, u.last_name, u.email HAVING COUNT(DISTINCT o.id) + COUNT(DISTINCT sc.id) > 0 ORDER BY open_deals DESC
  - name: admin-stale-logins
    title: Licensed users who have stopped signing in
    entity: User
    chart: bar
    x: user
    y: days_since_login
    help: Every one is a seat being paid for and a set of records nobody is watching. Ninety days is the point at which it is a decision rather than a holiday.
    sql: SELECT u.first_name || ' ' || u.last_name AS "user", u.role, COALESCE(EXTRACT(day FROM now() - u.last_login), 999)::int AS days_since_login FROM bus_user u WHERE u.deleted_at IS NULL AND u.is_active AND (u.last_login IS NULL OR u.last_login < now() - interval '90 days') ORDER BY days_since_login DESC
  - name: admin-orphaned-records
    title: Records with no owner
    entity: Account
    help: An unowned record answers to nobody and appears on no rep's list. It is not visible from inside any single screen, which is why only an administrator ever finds it.
    sql: SELECT 'Account' AS record_type, COUNT(*) AS records FROM bus_account WHERE deleted_at IS NULL AND owner_id IS NULL UNION ALL SELECT 'Opportunity', COUNT(*) FROM bus_opportunity WHERE deleted_at IS NULL AND owner_id IS NULL UNION ALL SELECT 'SupportCase', COUNT(*) FROM bus_support_case WHERE deleted_at IS NULL AND owner_id IS NULL UNION ALL SELECT 'Lead', COUNT(*) FROM bus_lead WHERE deleted_at IS NULL AND owner_id IS NULL ORDER BY records DESC
