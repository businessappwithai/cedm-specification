        to: Z
  - name: leadRouting
    title: Lead Routing
    entity: Lead
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Lead Scored"
        type: start
      - id: B
        label: lead_source == partner?
        type: decision
      - id: C
        label: Route to Partner Desk
        type: expression
      - id: D
        label: annual_revenue > 50000000?
        type: decision
      - id: E
        label: Route to Strategic Accounts Team
