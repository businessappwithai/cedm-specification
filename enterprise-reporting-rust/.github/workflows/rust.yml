# The Loco.rs backend port under rust/ (see rust/MIGRATION_PLAN.md).
#
# fmt, clippy with warnings as errors, and the unit tests. The unit tests
# include fixtures produced by the Node code itself — a Node ciphertext the
# Rust decryptor must open and a cron corpus generated by running the Node
# matcher — so a drift in either implementation fails here.
#
# The HTTP/worker parity suite (rust/parity/*.ts) needs both servers, a
# PostgreSQL config database and a seeded fixture; like the Playwright suite in
# ci.yml, it is run by hand for now (rust/README.md).
#
# No `paths:` filter, for the reason ci.yml gives: a skipped run reports no
# status, which makes the job awkward to require later.

name: Rust backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For the tests that need a real database (ERS_TEST_PG_URL); the rest
    # run without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ers
          POSTGRES_PASSWORD: ers
          POSTGRES_DB: ers_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ers" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
        env:
          ERS_TEST_PG_URL: postgres://ers:ers@localhost:5432/ers_test
