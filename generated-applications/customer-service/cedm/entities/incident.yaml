entity:
  name: Incident
  namespace: cedm.domain
  kind: risk_incident
  description: A governed record of an adverse, disruptive, security, operational, safety, compliance, or other risk event requiring response and analysis.
  ui:
    icon: table
  identity: {key: incidentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: incidentId, type: uuid, required: true, immutable: true, help: {summary: The identity of the incident., usage: Generated when raised; analyses and actions refer to it.}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the incident occurred., usage: Entered by the reporter; used for response timing and trend analysis.}}
    - name: incidentNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The reference by which the incident is tracked, reported and discussed during the response.
        usage: Unique; assigned automatically when the incident is reported and quoted in all communications.
        relationshipContext: Unique.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: A one-line statement of what happened, readable at a glance in lists.
        usage: Written by the reporter and shown in incident lists, dashboards and reports; it should name the system or place affected.
        relationshipContext: Identifies the incident for people, with the number.
    - name: description
      type: text
      required: false
      help:
        summary: A factual account of what happened, as reported and later completed by investigators.
        usage: Written by the reporter and extended during investigation; keep it to facts, because causes belong in the root cause.
        relationshipContext: Facts only; causes go in the root cause.
    - name: category
      type: enum
      required: true
      default: OPERATIONAL
      values:
        - OPERATIONAL
        - IT_OUTAGE
        - SECURITY
        - SAFETY
        - ENVIRONMENTAL
        - COMPLIANCE
        - QUALITY
      help:
        summary: What kind of incident it is.
        usage: Chosen at triage; it decides which team responds and which reports it appears in.
        relationshipContext: Some categories carry legal duties to notify an authority.
        valueSemantics:
          OPERATIONAL: A failure of a process or of equipment that disrupted operations.
          IT_OUTAGE: A system or network was unavailable or degraded.
          SECURITY: A breach or attempted breach of information or physical security.
          SAFETY: An accident, injury or dangerous occurrence.
          ENVIRONMENTAL: A spill, emission or other harm to the environment.
          COMPLIANCE: A breach of a law, regulation or internal policy.
          QUALITY: A product or service failed to meet its requirements in a way that reached a customer.
    - name: severity
      type: enum
      required: true
      default: MEDIUM
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        summary: How serious the incident is.
        usage: Set at triage; it decides the response time and who must be told.
        relationshipContext: May be raised or lowered as the investigation learns more.
        valueSemantics:
          LOW: Little impact; handled within the normal working day.
          MEDIUM: Noticeable impact on a team, a site or some customers.
          HIGH: Serious impact; management is informed at once.
          CRITICAL: Threatens the business, people's safety or legal standing; the crisis process starts.
    - name: reportedAt
      type: datetime
      required: true
      help:
        summary: When the incident was reported.
        usage: Set when the report is recorded; response times are measured from it.
        relationshipContext: Notification deadlines usually count from detection, which is close to this.
    - name: containedAt
      type: datetime
      required: false
      help:
        summary: The time the incident stopped getting worse or spreading.
        usage: Recorded by the responders when containment is confirmed; it is used to measure response performance and stays empty until then.
        relationshipContext: Present once contained.
    - name: resolvedAt
      type: datetime
      required: false
      help:
        summary: The time normal operation was restored after the incident.
        usage: Recorded by the responders when service or safety is back to normal; it ends the duration used in incident statistics.
        relationshipContext: Present once resolved.
    - name: impactDescription
      type: text
      required: false
      help:
        summary: Who and what the incident affected, and how much.
        usage: Completed during the investigation; used to decide on notification.
        relationshipContext: The financial cost, if any, is recorded as a loss event.
    - name: rootCause
      type: text
      required: false
      help:
        summary: Why the incident happened, established after investigation.
        usage: Written after investigation and required to close the incident. Recurring causes are taken up by problem management.
        relationshipContext: Recurring root causes are taken up by problem management.
    - name: regulatorNotified
      type: boolean
      required: true
      default: false
      help:
        summary: Whether an authority was notified of the incident.
        usage: Set when a reportable incident is notified, such as a data breach to the data-protection authority.
        relationshipContext: The notification itself is a filing.
    - name: status
      type: enum
      required: true
      default: REPORTED
      values:
        - REPORTED
        - INVESTIGATING
        - CONTAINED
        - RESOLVED
        - CLOSED
        - INVALID
      help:
        summary: Shows how far the response has progressed, from being reported through containment to closure.
        usage: Moved on by the coordinator and responders as the incident is triaged, contained and resolved.
        relationshipContext: A closed incident must have a root cause.
        valueSemantics:
          REPORTED: Reported and waiting for triage.
          INVESTIGATING: Triaged, and responders are working on it.
          CONTAINED: The effect has been stopped from spreading.
          RESOLVED: Normal operation is restored.
          CLOSED: Root cause and lessons are recorded and nothing more is to be done.
          INVALID: Turned out not to be an incident after all.
  relationships:
    - name: reportedBy
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who reported the incident.
        usage: Recorded with the report; contacted for details.
        cardinalityMeaning: One reporter per incident.
        context: Reporters are told when their incident is closed.
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who coordinates the response and answers for it.
        usage: Assigned at triage.
        cardinalityMeaning: One owner per incident.
        context: Closes the incident once its root cause is recorded.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the incident happened.
        usage: Given by the reporter.
        cardinalityMeaning: One location per incident.
        context: Site safety statistics are counted by location.
    - name: risk
      target: Risk
      cardinality: 0..1
      ownership: reference
      help:
        summary: The known risk the incident is an occurrence of.
        usage: Linked at investigation when the incident materialises a risk in the register.
        cardinalityMeaning: At most one risk per incident.
        context: Incidents linked to a risk show whether its controls are working.
  invariants:
    - {id: INCIDENT-001, rule: "Finalized evidence and effective history must be preserved; correction, reassessment, settlement or supersession must be explicit."}
  help:
    summary: A record of an adverse, disruptive, security, operational, safety, compliance or other risk event that requires response and analysis.
    businessMeaning: Incidents are how the organisation learns. A record that states what happened, when and how it was handled lets teams respond now and prevent repeats later, and shows regulators that it was managed.
    usage: Raised by whoever notices; investigated and closed by the responsible team; analysed for trends.
    relationshipContext: Incidents relate to the risks, controls, findings and cases that explain or follow from them.
    lifecycle: Finalised evidence and effective history are preserved. Reclassification, reassessment or settlement is recorded explicitly.
    example: A warehouse fire alarm triggered by a faulty charger, recorded with the response times and corrective actions.
    whenUsed: Used in enterprise risk, legal, compliance, audit, contract, incident, and remediation processes where applicable.
    commonProcesses: Risk assessment, incident management, legal matter management, compliance, remediation, filing and audit.
  lifecycle:
    title: Incident Lifecycle
    attribute: status
    states:
      - REPORTED
      - INVESTIGATING
      - CONTAINED
      - RESOLVED
      - CLOSED
      - INVALID
    initial: REPORTED
    terminal:
      - CLOSED
      - INVALID
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        action: triage
      - from: INVESTIGATING
        to: CONTAINED
        action: contain
      - from: CONTAINED
        to: RESOLVED
        action: resolve
      - from: INVESTIGATING
        to: RESOLVED
        action: resolve
      - from: RESOLVED
        to: CLOSED
        action: close
      - from: RESOLVED
        to: INVESTIGATING
        action: reopen
      - from: REPORTED
        to: INVALID
        action: reject
      - from: INVESTIGATING
        to: INVALID
        action: reject
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INCIDENT}
