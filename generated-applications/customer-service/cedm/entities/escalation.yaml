entity:
  name: Escalation
  namespace: cedm.domain
  kind: workflow_control_event
  description: A governed workflow event raising overdue, breached, exceptional, or unresolved work to another responsibility or control level.
  ui:
    icon: activity
  identity: {key: escalationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: escalationId, type: uuid, required: true, immutable: true, help: {summary: The identity of the escalation., usage: Generated when raised; notes and resolution refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the escalation is waiting to be picked up, being handled, resolved or withdrawn.
        usage: Moved by the escalation process and the person receiving it; unresolved ones are watched by supervisors.
        valueSemantics:
          PENDING: Raised and waiting for the receiving person or team to pick it up.
          ACTIVE: Being handled by the person or level it was escalated to.
          COMPLETED: Resolved, with the outcome recorded. A final state.
          CANCELLED: Withdrawn because it was no longer needed. A final state.
  relationships: []
  invariants:
    - {id: ESCALATION-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Escalation Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a escalation is ended"
      description: "When a escalation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ESCALATION-FOLLOW-UP-{{id}}"
              name: "Follow up on escalation {{id}}"
              description: "Escalation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A workflow event that raises overdue, breached, exceptional or unresolved work to a higher level of responsibility or control.
    businessMeaning: Work that is late or stuck needs someone with more authority to notice. An escalation records that this happened, to whom, and what came of it.
    usage: Raised automatically or manually when a deadline passes or an exception occurs; resolved by the person it is escalated to.
    relationshipContext: An escalation attaches to the task or case that triggered it and to the new owner of the problem.
    lifecycle: An escalation is pending when raised, active while being handled, completed when resolved and cancelled if it turns out to be unnecessary. State changes keep an auditable history and do not trigger duplicate effects.
    example: A support case unanswered for 48 hours is escalated to the team lead.
    commonProcesses: Workflow orchestration, approval, assignment, escalation, access governance, and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ESCALATION}
