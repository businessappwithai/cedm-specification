entity:
  name: Calendar
  namespace: cedm.domain
  kind: reference_data
  description: A governed calendar defining business dates, working days, holidays, and time-control semantics for planning and operational processes.
  ui:
    icon: calendar
  identity: {key: calendarId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: calendarId, type: uuid, required: true, immutable: true, help: {summary: The identity of the calendar., usage: Generated on creation; schedules and rules refer to the calendar through it.}}
    - {name: code, type: string, required: true, maxLength: 100, help: {summary: 'The short reference for the calendar, such as DE-NAT.', usage: Assigned by the administrator; used in configuration and reports; kept stable.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: 'The descriptive name of the calendar, such as UK Working Days or Group Fiscal Calendar.', usage: 'Entered by the administrator who maintains it; shown wherever a schedule, service level or plan asks which calendar applies.'}}
    - name: workingDays
      type: string
      required: true
      maxLength: 50
      default: MON-FRI
      help:
        summary: The days of the normal working week, such as MON-FRI or MON-SAT.
        usage: Days outside it are non-working unless an exception says otherwise.
        relationshipContext: Exceptions override it for particular dates.
    - name: timeZone
      type: timezone
      required: false
      help:
        summary: The time zone of the calendar, such as Europe/Paris.
        usage: Decides when a day starts and ends for deadlines.
        relationshipContext: An IANA time-zone name.
    - name: validFrom
      type: date
      required: false
      help:
        summary: The first day on which the calendar's working days and holidays apply.
        usage: Set when the calendar is created.
        relationshipContext: Not later than the valid-to date.
    - name: validTo
      type: date
      required: false
      help:
        summary: The last day on which the calendar's working days and holidays apply.
        usage: Filled in when a newer calendar replaces this one.
        relationshipContext: Left empty while the calendar is still in use.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
      help:
        summary: Whether planners may use this calendar.
        usage: Made inactive by an administrator once a newer calendar replaces it.
        relationshipContext: Inactive calendars are not offered when choosing one.
        valueSemantics:
          ACTIVE: In use and available to planners.
          INACTIVE: Retired and no longer offered.
  relationships:
    - name: country
      target: Country
      cardinality: 0..1
      ownership: reference
      help:
        summary: The country whose public holidays the calendar holds.
        usage: Set for country calendars.
        cardinalityMeaning: At most one.
        context: Site calendars usually take their country's calendar as base.
    - name: baseCalendar
      target: Calendar
      cardinality: 0..1
      ownership: reference
      help:
        summary: The calendar whose exceptions this one also follows.
        usage: Set so a site calendar inherits the country's holidays.
        cardinalityMeaning: At most one base.
        context: Cannot be itself.
    - name: exceptions
      target: CalendarException
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The holidays, closures and extra working days of the calendar.
        usage: Added each year.
        cardinalityMeaning: Any number of exceptions.
        context: Each exception belongs to one calendar.
  invariants:
    - {id: CALENDAR-001, rule: Code and identity semantics must remain stable within the governing context and historical references must not be silently repointed.}
    - id: CALENDAR-002
      rule: A Calendar must not be its own ancestor through baseCalendar; the baseCalendar chain is acyclic.
    - {id: CALENDAR-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  help:
    summary: A calendar that defines business dates, working days, holidays and time-control rules used for planning and operations.
    businessMeaning: 'Whether a date counts as a working day is not obvious: it depends on region, industry and company. A calendar states that explicitly, so due dates, delivery promises and schedules all agree.'
    usage: Maintained by administrators; referenced by schedulers, service-level calculations and planning when they need to know which days count.
    relationshipContext: Locations, teams, contracts and schedules point to the calendar that governs their working days.
    lifecycle: A calendar's code and identity stay stable. Changes to holidays apply from their effective date and do not rewrite history.
    example: The German national business calendar, with weekends and public holidays marked non-working.
  lifecycle:
    title: Calendar Lifecycle
    attribute: status
    states:
      - ACTIVE
      - INACTIVE
    initial: ACTIVE
    terminal: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        action: deactivate
      - from: INACTIVE
        to: ACTIVE
        action: reactivate
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CALENDAR}
