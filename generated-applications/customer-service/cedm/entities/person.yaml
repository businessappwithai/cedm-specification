entity:
  name: Person
  namespace: cedm.domain
  kind: party_specialization
  extends: Party
  description: A natural person participating in business activities as a specialization of Party. Person supplies intrinsic individual identity; business participation is represented through PartyRole and specialized roles.
  ui:
    icon: user
  identity: {key: personId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: personId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The stable identifier of the individual-person record, which never changes even if the person's name does.
        usage: Generated on creation; individual identity processes and person-specific records refer to the person through this value.
        relationshipContext: Party.partyId remains canonical
        workflowRole: identifies person-specific record
    - name: partyId
      type: reference
      target: Party
      required: true
      unique: true
      immutable: true
      help:
        summary: Canonical Party identity represented by this Person specialization.
        usage: Connects person-specific data to common Party identity and all PartyRoles.
        relationshipContext: Exactly one Person specialization may represent a Party classified as PERSON.
        workflowRole: Ensures transactions and roles use one stable person identity.
    - name: title
      type: string
      required: false
      maxLength: 50
      help:
        summary: The honorific or personal title used before the person's name, such as Dr, Prof or Ms.
        usage: Entered when known and optional; printed in letters, documents and formal presentation of the name.
        relationshipContext: presentation attribute
        workflowRole: supports person display
    - name: givenName
      type: string
      required: true
      maxLength: 150
      help:
        summary: The person's first or given name, as it appears on their identity documents.
        usage: Required; entered at registration and used with the family name for identity matching, documents and correspondence.
        relationshipContext: intrinsic person identity
        workflowRole: identification
    - name: middleName
      type: string
      required: false
      maxLength: 150
      help:
        summary: Any middle or additional given names the person carries, when they are used officially.
        usage: Optional; entered only when needed to tell people apart or to match identity documents and legal records.
        relationshipContext: intrinsic person identity
        workflowRole: identification
    - name: familyName
      type: string
      required: true
      maxLength: 150
      help:
        summary: The person's family name or surname, as it appears on their identity documents.
        usage: Required; entered at registration and used with the given name for identity matching, documents and correspondence.
        relationshipContext: intrinsic person identity
        workflowRole: identification
    - name: preferredName
      type: string
      required: false
      maxLength: 150
      help:
        summary: The name the person likes to be called, which may differ from their legal given name.
        usage: Optional; chosen by the person and used for greetings, display in screens and informal communication, never for legal documents.
        relationshipContext: presentation not canonical identity
        workflowRole: human interaction
    - name: dateOfBirth
      type: date
      required: false
      help:
        summary: The person's date of birth, recorded where age or verified identity matters to a process.
        usage: Optional and sensitive; collected only where needed, for example for age checks, payroll or identity verification.
        relationshipContext: sensitive person attribute subject to access policy
        workflowRole: eligibility/verification where applicable
    - name: gender
      type: enum
      required: false
      values:
        - FEMALE
        - MALE
        - NON_BINARY
        - OTHER
        - UNSPECIFIED
      help:
        summary: The person's gender as recorded for the organisation's lawful purposes.
        usage: Entered only where there is a need and a lawful basis, normally by the person; never used to decide eligibility.
        valueSemantics:
          FEMALE: The person identifies and is recorded as female.
          MALE: The person identifies and is recorded as male.
          NON_BINARY: The person identifies as neither exclusively male nor exclusively female.
          OTHER: The person identifies in a way not covered by the other values.
          UNSPECIFIED: The gender is not recorded, because it was not needed or the person chose not to say.
        relationshipContext: person attribute and not role
        workflowRole: process-specific
    - name: nationalityId
      type: reference
      target: Country
      required: false
      help: {summary: "The country whose nationality the person holds.", usage: "Chosen from the list of countries; used by identity and compliance processes.", relationshipContext: "Not Party identity; process-specific."}
  relationships:
    - name: party
      target: Party
      cardinality: '1'
      ownership: reference
      inverse: person
      help:
        cardinalityMeaning: 'Exactly one party: a person is the individual form of a party, so each person has one party record.'
        summary: Canonical Party represented by this Person specialization.
        usage: Navigates to common party identity and PartyRoles.
        workflowRole: Connects intrinsic person identity to business participation.
    - name: employerOrganizations
      target: Organization
      cardinality: 0..*
      ownership: reference
      help:
        summary: Organizations associated with the person as employers or organizational contexts.
        usage: Supports employment and organizational relationships.
        cardinalityMeaning: Zero or many.
        workflowRole: Provides context for employment/worker workflows; it does not itself establish an Employee role.
  invariants:
    - {id: PERSON-001, rule: partyType must equal PERSON for the referenced Party.}
    - {id: PERSON-002, rule: givenName and familyName must be present.}
    - {id: PERSON-003, rule: One Party cannot have multiple Person specializations.}
    - {id: PERSON-004, rule: Person status/attributes must not be used as a substitute for PartyRole eligibility.}
    - {id: PERSON-005, rule: Changes to Person identity attributes must preserve historical transaction snapshots or references according to the transaction's audit policy.}
  audit: {enabled: true}
  tags: [person, party, specialization, identity]
  help:
    summary: Person is the individual specialization of Party, not a business role.
    businessMeaning: Party identifies the individual; Person supplies intrinsic individual details; PartyRole determines how the person participates.
    usage: Used for customers, employees, agents, owners, contractors, and other roles without duplicating individual identity.
    relationshipContext: Party → Person establishes intrinsic identity; Party → PartyRole establishes business participation; Organization links provide employment or other organizational context.
    workflowContext: Create/maintain Party → create Person specialization → establish PartyRole → apply role-specific qualification/authorization → execute transactions. Ending one role does not end the person or other roles.
    lifecycle: Person specialization follows Party identity while role eligibility remains independently controlled by PartyRole.
    example: One individual may be both an Employee and Customer. The same Party and Person specialization is reused while separate PartyRoles govern employment and customer processes.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PERSON}
