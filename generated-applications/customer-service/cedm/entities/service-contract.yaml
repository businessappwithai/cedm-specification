entity:
  name: ServiceContract
  namespace: cedm.domain
  kind: service_contract_specialization
  description: A governed operational specialization of a Contract that defines service coverage, effective period, customer scope, service levels and entitlement basis without duplicating the legal agreement.
  ui: {icon: file-badge}
  identity: {key: serviceContractId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: serviceContractId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identifier of the service coverage attached to a contract., usage: 'Generated on creation; service cases, orders and entitlement checks refer to the coverage through it.', businessMeaning: Identifies operational service coverage independently of the generic Contract identity., relationshipContext: Required Contract relationship supplies the legal/commercial agreement.}}
    - {name: serviceContractNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: 'The number of the service contract, such as SC-2026-044.', businessMeaning: Operational identifier for service coverage administration., usage: "Customer service, renewals, entitlement and reporting.", relationshipContext: May differ from generic Contract number.}}
    - {name: effectiveFrom, type: date, required: true, help: {summary: The first date on which the service coverage applies., usage: Set when the coverage is agreed; entitlement is checked against it and renewals are planned from it., businessMeaning: Starts entitlement and service-policy applicability., relationshipContext: Must be compatible with the governing Contract.}}
    - {name: effectiveTo, type: date, required: false, help: {summary: The last date on which the service coverage applies., usage: Set by the contract owner; entitlement checks stop honouring the coverage after it. Empty means open-ended., businessMeaning: Ends ordinary service entitlement under this specialization., relationshipContext: Must not precede effectiveFrom and normally cannot exceed governing Contract scope.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED]
      help:
        summary: Where the service coverage stands, from draft through active use to its end.
        usage: Starts as DRAFT and is moved by contract administration; only ACTIVE coverage authorises new service work.
        valueSemantics:
          DRAFT: Coverage is being prepared and gives no entitlement yet.
          ACTIVE: Coverage is in force and may support new eligible service.
          SUSPENDED: Coverage is temporarily unavailable for new service authorisation.
          EXPIRED: The effective period has ended and nothing was renewed. A final state.
          TERMINATED: Coverage was ended early through the governed process. A final state.
        businessMeaning: Controls eligibility for new service work while preserving historical coverage decisions.
        relationshipContext: Generic Contract lifecycle remains separately authoritative for legal agreement status.
  relationships:
    - {name: contract, target: Contract, cardinality: "1", ownership: reference, help: {cardinalityMeaning: 'A service contract specialises exactly one contract, which holds the legal terms.', summary: Generic legal or commercial Contract underlying this service specialization., businessMeaning: "Prevents duplicate modeling of parties, clauses and legal obligations.", usage: "Legal traceability, renewals and compliance.", workflowRole: Service coverage cannot outlive or contradict governing Contract terms without explicit amendment.}}
    - {name: customer, target: Customer, cardinality: "1", ownership: reference, help: {summary: Customer receiving contracted service coverage., businessMeaning: Establishes the commercial beneficiary of service rights., usage: "Entitlement, case management and billing.", cardinalityMeaning: Exactly one Customer in this baseline specialization., workflowRole: Customer must be consistent with governing Contract parties.}}
    - {name: serviceLevelAgreements, target: ServiceLevelAgreement, cardinality: "0..*", ownership: reference, help: {summary: SLAs applicable under this service contract., businessMeaning: Converts contractual service commitments into measurable operational targets., usage: "Case, ticket and order deadline management.", cardinalityMeaning: Zero or many SLAs., workflowRole: Applied SLA/version must be retained for historical service evidence.}}
    - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: 'Any number of entitlements, one for each service or product covered.', summary: Specific service rights granted under this contract., businessMeaning: "Expresses covered products, assets, limits or service types without bloating the contract header.", usage: Service authorization and consumption., workflowRole: Entitlement effective periods and scope must remain within the contract.}}
    - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of service orders may be performed under the contract., summary: Service execution orders governed by this contract., businessMeaning: Preserves contract-to-execution traceability., usage: "Coverage, billing, compliance and audit.", workflowRole: Each covered order must have been eligible at authorization time.}}
  invariants:
    - {id: SERVICE-CONTRACT-001, rule: effectiveTo must not precede effectiveFrom.}
    - {id: SERVICE-CONTRACT-002, rule: ACTIVE service coverage requires an eligible governing Contract and consistent Customer party.}
    - {id: SERVICE-CONTRACT-003, rule: "Historical service decisions retain the ServiceContract, Entitlement and SLA terms applied at authorization time."}
    - {id: SERVICE-CONTRACT-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Service Contract Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: DRAFT, to: TERMINATED, action: terminate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
  help:
    summary: Adds service-specific operational coverage to a generic Contract.
    businessMeaning: Contract remains the legal agreement; ServiceContract defines service administration, SLA applicability and entitlement scope.
    usage: Customer service, field service, renewals, entitlement, billing, compliance and audit.
    relationshipContext: Contract is mandatory, Customer is the service beneficiary, SLAs provide measurable commitments and Entitlements define concrete rights.
    lifecycle: Draft coverage becomes active, may suspend, and eventually expires or terminates while historical service authorization remains reproducible.
    example: A three-year equipment-support Contract has a ServiceContract with a four-hour SLA and separate Entitlements for each covered Asset.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERVICE-CONTRACT}
