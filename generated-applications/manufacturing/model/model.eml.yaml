        default: "false"
      - name: status
        type: string
        enum: AddressStatus
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        optional: true
        help: Party that maintains or uses this reusable address. Provides party master-data context for address selection.
      - name: person_id
        type: string
        fk: true
        optional: true
        help: The Person this Address belongs to.
      - name: organization_id
        type: string
        fk: true
        optional: true
