        type: uuid
        pk: true
        help: Stable identity of the routing version. Identifies one governed production method. Planning, order release, costing, and audit. Connects Product to ordered Operation definitions. Required.
      - name: code
        type: string(100)
        help: Business routing code. Human-recognizable process identifier. Engineering and production planning. Combined with version identifies controlled process definition. Required.
      - name: status
        type: string
        enum: RoutingStatus
        help: Governance state of routing. Controls eligibility for new production release. Engineering change and manufacturing control. Historical orders retain prior routing evidence. Being prepared. Eligible for production. Temporarily blocked. Superseded for new use. Required.
        default: DRAFT
      - name: product_id
        type: string
        fk: true
        help: Output Product this routing produces. Associates process definition with manufactured item. Planning and production release. Exactly one output Product. Must match work-order output.
  - name: Operation
    help: Standard process step within a manufacturing routing. Defines work to perform, while ManufacturingWorkOrder records production authorization/execution. Routing, scheduling, costing, shop-floor instructions, and in-process quality. Routing sequences operations; WorkCenter provides capacity; QualityPlan governs inspection. Governed by parent routing version; historical released work retains its definition snapshot/reference. Definition/resource/quality changes affect future or unreleased work and trigger impact analysis for active work.
    parent: Routing
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the operation definition. Identifies one governed process step. Routing, scheduling, execution, and costing. Belongs to one Routing and normally uses a WorkCenter. Required.
      - name: sequence
        type: integer
        help: Execution order within routing. Defines process precedence. Scheduling and shop-floor control. Unique within Routing. Required.
        min: 1
      - name: name
        type: string(300)
        help: Name of work performed. Communicates operation purpose. Instructions, planning, and reporting. Interpreted within Routing. Required.
      - name: standard_minutes
        type: decimal
        optional: true
        help: Standard processing duration. Planning/costing expectation rather than actual elapsed time. Capacity scheduling and costing. Actual execution may differ. Optional when time standard is unavailable.
      - name: routing_id
        type: string
        fk: true
        help: Parent manufacturing process definition. Supplies product/process context. Sequencing and version control. Exactly one Routing. Routing lifecycle controls eligibility.
      - name: work_center_id
        type: string
        fk: true
        optional: true
        help: Default capacity resource for the step. Defines where/by whom work is normally executed. Scheduling and costing. Optional for non-capacity-controlled steps. Resource availability constrains execution.
  - name: WorkCenter
    help: Manufacturing capacity resource used by routing and execution. WorkCenter represents where or by which resource an Operation is performed. Manufacturing planning, scheduling, dispatch, costing, maintenance coordination, and analytics. Operation defines work; Routing sequences work; ManufacturingWorkOrder executes it. Active → temporarily unavailable/maintenance → active or retired. Capacity/status changes revalidate affected schedules and unreleased work without rewriting completed execution.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the manufacturing resource. Identifies the capacity resource independently of location or routing. Scheduling, costing, execution, and reporting. Referenced by routing and production operations. Required.
      - name: code
        type: string(100)
        unique: true
        help: Human-facing work-center code. Operational identifier used in manufacturing plans and execution. Scheduling, dispatching, reporting, and integration. Unique within its manufacturing context. Required.
      - name: name
        type: string(300)
        help: Descriptive work-center name. Communicates the resource function to planners and operators. Planning and execution UI/reporting. Complements the stable code. Required.
      - name: capacity_per_hour
        type: decimal
        optional: true
        help: Nominal output or processing capacity per hour. Planning assumption for finite or rough-cut scheduling. Capacity planning and schedule feasibility. Actual execution is captured separately. Optional when capacity is not quantity-based.
      - name: status
        type: string
        enum: WorkCenterStatus
        help: Operational eligibility of the work center. Controls whether new work may be scheduled or executed. Scheduling and maintenance coordination. Existing historical operations remain valid. Available subject to capacity. Temporarily unavailable. Unavailable due to maintenance. Permanently unavailable for new work. Required.
        default: ACTIVE
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Physical or organizational location of the resource. Places manufacturing capacity within the operating network. Scheduling, material staging, and reporting. Optional for virtual or pooled resources. Location eligibility constrains execution.
  - name: ManufacturingWorkOrder
    help: Canonical CEDM production-order transaction. ManufacturingWorkOrder authorizes production; BOM defines material expectations; Routing defines process expectations; execution transactions preserve actual material, output and scrap evidence. MRP, scheduling, shop-floor execution, inventory, costing, quality, genealogy and project manufacturing. Product is output; BOM and Routing are controlled definitions; MaterialIssue consumes inputs; ProductionReceipt accepts outputs; Scrap explains governed losses. Planned → released → in progress → completed → closed, with controlled cancellation. Release freezes effective definitions; execution updates inventory and genealogy; corrections use compensating evidence rather than rewriting posted history.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the production order. Identifies one authorized manufacturing execution independently of its business number. Planning, execution, inventory, costing, quality, genealogy, and audit. Root identity for material issues, output receipts and scrap. Required.
      - name: order_number
        type: string(100)
        unique: true
        help: Human-facing production-order reference. Operational identifier used across planning and shop-floor execution. Scheduling, material staging, production, quality, costing, and audit. Distinct from inventory transaction references. Required.
      - name: quantity
        type: decimal
        help: Authorized target output quantity. Defines planned production magnitude. Material planning, capacity, completion and variance. Interpreted with output Product and UOM policy. Required.
      - name: planned_start
        type: datetime
        optional: true
        help: Planned production start. Scheduling expectation rather than execution evidence. Capacity and material planning. Actual events are recorded separately. Optional until scheduled.
      - name: planned_end
        type: datetime
        optional: true
        help: Planned production completion. Scheduling target for output availability. Capacity, promise and planning. Must not precede plannedStart. Optional until scheduled.
      - name: status
        type: string
        enum: ManufacturingWorkOrderStatus
        help: Manufacturing order lifecycle state. Controls authorization and execution eligibility. Planning, shop-floor control, inventory and costing. Posted execution evidence is not reversed by changing header status. Being planned and not executable. Authorized for governed execution. Execution has begun. Production execution is materially complete pending closure where applicable. Reconciled and administratively closed. Terminated before remaining execution. Required.
        default: PLANNED
      - name: product_id
        type: string
        fk: true
        help: Product authorized as manufacturing output. Defines what the work order produces. Planning, output receipt and genealogy. Exactly one output Product. ProductionReceipt Product must reconcile.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Primary production location. Places execution within the operating network. Scheduling, staging and reporting. Optional for distributed/virtual production. Constrains material and resource execution where applicable.
      - name: bill_of_material_id
        type: string
        fk: true
        optional: true
        help: Effective material structure governing planned component demand. Defines expected inputs. Material planning, issue validation, variance and genealogy. Optional for processes without formal BOM. RELEASED work preserves the effective BOM version.
      - name: routing_id
        type: string
        fk: true
        optional: true
        help: Effective process definition governing production execution. Defines ordered operations and resource expectations. Scheduling, execution, costing and audit. Optional for simple production without formal routing. RELEASED work preserves the effective routing version.
  - name: MaterialIssue
    help: Production material-consumption transaction with full inventory and genealogy provenance. MaterialIssue explains why material was consumed; InventoryMovement records the physical stock consequence. Shop-floor staging/consumption, inventory, costing, genealogy, recall, and variance analysis. ManufacturingWorkOrder authorizes demand, BOMComponent supplies standard requirement, Lot/SerialNumber preserve provenance. Prepared → validated → issued/posted → immutable history; corrections compensate. Issue posting updates inventory projections and manufacturing material reconciliation and contributes input genealogy for produced output.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of material issue. Identifies one governed production-consumption transaction. Inventory, manufacturing genealogy, costing, and audit. Links work order/BOM demand to stock movement. Required.
      - name: issue_number
        type: string(100)
        unique: true
        help: Human-facing issue reference. Operational traceability identifier. Shop floor, warehouse, and audit. Distinct from inventory movement number. Required.
      - name: quantity
        type: decimal
        help: Component quantity issued. Amount authorized for production consumption. Material reconciliation, variance, and costing. Interpreted with component Product/UOM/lot/serial. Required.
      - name: issued_at
        type: datetime
        help: Effective material issue time. Establishes production consumption chronology. Inventory, genealogy, costing, and audit. Must align with attributable movement. Required.
      - name: work_order_id
        type: string
        fk: true
        references: ManufacturingWorkOrder
        help: Production order consuming material. Identifies authorized manufacturing demand. Material reconciliation and genealogy. Exactly one work order. Must be released/in progress according to policy.
      - name: bom_component_id
        type: string
        fk: true
        optional: true
        help: Planned BOM requirement being consumed. Connects actual issue to standard material demand. Variance and genealogy. Optional for authorized unplanned material. Quantity/product normally reconcile with effective BOM.
      - name: product_id
        type: string
        fk: true
        help: Component material issued. Identifies consumed item. Inventory and costing. Exactly one Product. Must match BOM component or approved substitution.
      - name: lot_id
        type: string
        fk: true
        optional: true
        help: Consumed component lot. Preserves input batch genealogy. Traceability and recall. Required when product is lot-controlled. Lot must be eligible and available.
      - name: inventory_movement_id
        type: string
        fk: true
        help: Posted stock event implementing physical issue. InventoryMovement remains authoritative stock ledger. Reconciliation and audit. Exactly one attributable posting for executed issue. Posting must be idempotent and reconcile quantity/product/lot/serial.
  - name: ProductionReceipt
    help: Accepted manufacturing output transaction with inventory and genealogy evidence. ProductionReceipt explains why finished/semi-finished stock increased; InventoryMovement records the stock consequence. Production completion, inventory receipt, costing, quality release, genealogy, and recall. Work order supplies production authorization; Lot/SerialNumber identify output; quality governs release; movement updates stock. Prepared → quality/quantity validated → received/posted → immutable history. Receipt updates inventory and production completion and connects consumed material genealogy to output identities.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of production receipt. Identifies one governed output posting. Manufacturing, inventory, costing, quality, and audit. Connects work-order output to stock event. Required.
      - name: receipt_number
        type: string(100)
        unique: true
        help: Human-facing production receipt reference. Operational identifier for output posting. Shop floor, warehouse, quality, and audit. Distinct from inventory movement number. Required.
      - name: quantity
        type: decimal
        help: Accepted output quantity received into inventory. Quantity recognized as produced/receivable. Production completion, inventory, and costing. Rejected/scrap quantity is modeled separately. Required.
      - name: received_at
        type: datetime
        help: Effective output receipt time. Establishes production and inventory chronology. Inventory, costing, genealogy, and reporting. Distinct from work-order completion time. Required.
      - name: work_order_id
        type: string
        fk: true
        references: ManufacturingWorkOrder
        help: Production order creating output. Supplies authorization, product, BOM/routing context. Completion and variance reconciliation. Exactly one work order. Output cannot exceed governed production quantity without authorized overproduction.
      - name: product_id
        type: string
        fk: true
        help: Produced item received. Identifies output inventory item. Inventory and genealogy. Exactly one Product. Must reconcile with work-order output.
      - name: lot_id
        type: string
        fk: true
        optional: true
        help: Output production lot. Groups produced quantity for genealogy/quality/recall. Traceability and quality release. Required according to lot-control policy. May remain quarantined pending required quality evidence.
      - name: quality_inspection_id
        type: string
        fk: true
        optional: true
        help: Inspection evidence governing output acceptance/release. Separates production from quality disposition. Release and compliance. Optional unless quality plan requires it. Required quality gates constrain availability.
      - name: inventory_movement_id
        type: string
        fk: true
        help: Posted stock event implementing output receipt. InventoryMovement remains authoritative inventory ledger. Balance reconciliation and audit. Exactly one attributable posting per executed receipt. Must reconcile product/quantity/lot/serial and be idempotent.
  - name: Lot
    help: Batch-level inventory identity for end-to-end genealogy and recall. Product identifies what an item is; Lot identifies which production or receipt batch a quantity belongs to. Inventory, WMS, manufacturing, quality, procurement, sales fulfillment, expiry management, recall, and regulatory traceability. Lot follows Product quantities through InventoryMovement and InventoryBalance and may later connect to receipt, production, shipment, inspection, and certificate evidence. Created/received → active or quarantined → released/held → consumed/expired/rejected → closed. Status, expiry, or quality changes immediately revalidate availability, reservations, picking, shipment, production consumption, and disposition without altering historical movements.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable system identity of the lot. Identifies the traceability group independently of printed lot number. Inventory, quality, recall, manufacturing, receiving, shipping, and audit. Groups quantities of one Product across locations and movements. Required.
      - name: lot_number
        type: string(150)
        help: Business-facing lot or batch identifier. Traceability code used operationally and externally. Receiving, labels, picking, quality, recall, and certificates. Uniqueness is governed with Product and organizational policy. Required.
      - name: manufactured_at
        type: datetime
        optional: true
        help: Time the lot was manufactured or produced. Anchors production age and provenance. Shelf-life, quality, genealogy, and recall. Distinct from receipt date. Optional when unknown or not applicable.
      - name: expires_at
        type: datetime
        optional: true
        help: Expiry or use-by time for the lot. Controls eligibility where shelf life applies. FEFO allocation, quarantine, disposal, and compliance. Does not itself post inventory movement. Optional for non-expiring products.
      - name: status
        type: string
        enum: LotStatus
        help: Governed usability state of the lot. Controls allocation and operational eligibility while preserving stock history. Quality release, warehouse allocation, production, recall, and disposition. Status restrictions affect availability but do not rewrite movement history. Operationally recognized. Temporarily restricted. Segregated pending decision. Approved for governed use. Past governed shelf life. Not approved for intended use. Quantity fully consumed under tracked processes. Traceability lifecycle closed. Required.
        default: ACTIVE
      - name: product_id
        type: string
        fk: true
        help: Product represented by this lot. Defines item identity for all lot quantities. Inventory and quality validation. Exactly one Product. Movements and balances must use the same product.
  - name: SerialNumber
    help: Unit-level identity and custody traceability for serialized products. Product identifies the type, Lot identifies a batch, and SerialNumber identifies one physical unit. Inventory, warehouse, logistics, manufacturing, service, maintenance, warranty, returns, recall, and asset management. SerialNumber travels through InventoryMovement and may be associated with a Lot while preserving unique unit identity. Expected → available/reserved → in transit/installed/consumed/returned/quarantined → scrapped/retired as applicable. Status and custody changes revalidate inventory, reservation, shipment, service, return, and asset workflows; historical custody is never rewritten.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable system identity of the serialized unit. Identifies the unit independently of its printed serial code. Inventory, service, warranty, asset, recall, and audit. One serialized identity represents one governed physical unit. Required.
      - name: serial_code
        type: string(200)
        help: Business/manufacturer serial identifier. Operational code used to recognize the individual unit. Scanning, receiving, picking, shipment, service, returns, and warranty. Uniqueness is governed for the Product or global namespace. Required.
      - name: status
        type: string
        enum: SerialNumberStatus
        help: Operational lifecycle state of the serialized unit. Controls eligibility and custody transitions for the individual unit. Allocation, shipment, service, returns, and disposal. Status is reconciled from authoritative business and inventory events rather than freely edited. Known before receipt. Eligible inventory. Committed to demand. Under logistics movement. Deployed or installed. Used in a process. Entered governed return flow. Restricted pending decision. Physically disposed as scrap. Lifecycle closed. Required.
        default: AVAILABLE
      - name: product_id
        type: string
        fk: true
        help: Product model represented by the serial. Defines the standardized item type. Validation and master-data context. Exactly one Product. Every serial movement must use the same Product.
      - name: material_issue_id
        type: string
        fk: true
        optional: true
        help: The MaterialIssue this SerialNumber belongs to.
      - name: production_receipt_id
        type: string
        fk: true
        optional: true
        help: The ProductionReceipt this SerialNumber belongs to.
      - name: lot_id
        type: string
        fk: true
        optional: true
        help: Lot or batch from which this serialized unit originates when applicable. Connects unit identity to batch genealogy. Recall, quality, manufacturing, and provenance. Optional for products not lot-controlled. Serial and lot provenance must remain consistent.
      - name: scrap_id
        type: string
        fk: true
        optional: true
        help: The Scrap this SerialNumber belongs to.
  - name: InventoryMovement
    help: Represents one auditable change to inventory state, including stock reductions caused by supplier returns. InventoryMovement is the event ledger from which InventoryBalance is maintained. SupplierReturnLine is the operational authorization for supplier-return quantity; InventoryMovement is the physical stock consequence. Receiving, warehouse execution, procurement, order fulfillment, maintenance, customer and supplier returns, stock counting, reconciliation and analytics. Product identifies what is stocked. InventoryLocation identifies where. InventoryBalance is current state. InventoryMovement is historical event evidence. GoodsReceiptLine explains original accepted receipt. SupplierReturnLine explains later return quantity. SupplierCreditNote explains financial consequence separately. GoodsReceiptLine accepted → RECEIPT movement → InventoryBalance increase. Later SupplierReturn authorization → SupplierReturnLine execution → attributable ISSUE/RETURN movement reducing internal stock → SupplierCreditNote financial adjustment → payable application. Customer returns remain separately attributable through their own return workflow. Prepared → validated → posted → immutable history. Errors use compensating events. SupplierReturn quantity or disposition changes require movement eligibility/reconciliation before posting. Posted movement changes require reversal or compensating movement, never destructive editing. Ten accepted units are returned to a supplier from RACK-A. A movement records the exact quantity and source location and references SupplierReturnLine. A retry of the workflow does not create a second reduction. The supplier credit is accounted for separately.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the inventory event. Used for stock-ledger traceability, audit, reconciliation, integration and investigation. Identifies the event independently of Product, location, quantity and originating transaction. Every receipt, issue, transfer, return, adjustment, reservation and release uses this identity for audit and balance reconciliation. Required.
      - name: movement_number
        type: string(100)
        unique: true
        help: Human-facing inventory movement reference. Used by warehouse operators, inventory controllers, auditors and integrations. Distinct from Product and source transaction numbers. Traces stock change from execution through reconciliation. Required.
      - name: movement_type
        type: string
        enum: InventoryMovementMovementType
        help: Identifies inventory operation and state transition. Determines how on-hand, reserved, available and location balances change. Movement type describes inventory effect; relatedTransaction and supplierReturnLine explain business reason where applicable. Maps business workflow outcomes to inventory ledger. Accepted inbound quantity becomes inventory at a target location. Quantity leaves available inventory for shipment, consumption, maintenance, production or authorized outbound use. Quantity moves between inventory locations. Quantity is corrected through approved reconciliation. Previously controlled quantity is returned or otherwise processed under return semantics. Quantity is committed to demand without physical movement. Previous reservation is removed. Required.
      - name: quantity
        type: decimal
        help: Quantity affected by the inventory event. Drives balance changes and allocation calculations. Interpreted with Product, UOM, movementType and source/target locations. Changes physical quantity for receipt/issue/transfer/return and commitment state for reservation/release. Required.
      - name: movement_date
        type: datetime
        help: Timestamp at which inventory event is recognized. Stock history, period-end balances, reporting, audit and reconciliation. Distinct from source order date and record creation timestamp. Establishes effective chronology. Required.
      - name: reason
        type: string(500)
        optional: true
        help: Business explanation for movement. Audit, investigation, approval and reporting. Supplements movementType and source relationships. Especially important for adjustments, returns and exceptions. Optional when source context fully explains event.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The UnitOfMeasure this InventoryMovement belongs to.
      - name: product_id
        type: string
        fk: true
        help: Product whose inventory state is affected. Connects event to product master, units and policies. Exactly one product is affected. Identifies stock item.
      - name: lot_id
        type: string
        fk: true
        optional: true
        help: Lot identity carried by this movement when the Product is lot-controlled. Preserves batch genealogy through every stock event. Traceability, expiry, quality, recall, and reconciliation. Optional for products not requiring lot control. Lot Product and movement Product must agree.
      - name: party_id
        type: string
        fk: true
        optional: true
        help: Party associated with inventory event when ownership or custody matters. Supplier receipts, customer returns, consignment and audit. Optional for internal movements. Connects event to external party.
      - name: scrap_id
        type: string
        fk: true
        optional: true
        help: Manufacturing scrap transaction causing this stock reduction when applicable. Explains the governed production-loss reason for stock decrease. Yield, costing, quality and inventory reconciliation. Optional outside manufacturing scrap or when process loss never entered inventory. Product, quantity, lot and serial evidence must reconcile and posting must be idempotent.
  - name: QualityInspection
    help: Represents a quality inspection and its controlled sampling, measurements, result and disposition across inbound receiving and supplier-return workflows. QualityInspection provides the execution context and overall decision; InspectionSample records the actual selected sample; QualityMeasurement records individual factual observations. The inspection does not itself perform inventory or financial changes. Receiving quality, supplier quality, acceptance sampling, returns, quarantine, nonconformance, corrective action, compliance and audit. QualityPlan/QualityPlanCharacteristic define controls; SamplingPlan/SamplingRule define selection; InspectionSample records execution; QualityMeasurement provides test evidence; InventoryMovement records physical stock consequence; SupplierCreditNote records financial consequence; Nonconformance records deviations. QualityPlan → QualityPlanCharacteristic → SamplingPlan/SamplingRule → QualityInspection → InspectionSample selection → sample measurement → aggregate result → Nonconformance/disposition. For unsampled characteristics, measurement may be captured directly under the inspection. For supplier returns, SupplierReturn → inspection → sample/measurement/disposition → attributable InventoryMovement → SupplierCreditNote/exception completion. Open → in progress → sampling/evidence captured → passed/failed/conditional → dispositioned, with cancellation or controlled reinspection. Changes to receipt, supplier return, product, quality plan, characteristic configuration, sampling policy, unit definitions or measurement evidence affecting an open inspection trigger revalidation. Completed inspection and sample history is not silently rewritten; reinspection or correction creates explicit evidence. A received lot of 500 units is governed by a 20-unit SamplingRule. InspectionSample records the selected sample, QualityMeasurement records weight and purity observations, and the inspection aggregates those results before deciding release or quarantine.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the inspection record. Identifies one inspection event independently of the item, receipt, return, result or corrective action. Quality traceability, audit, reporting and integrations. Root of the inspection execution graph including sampling and measurement evidence. Stable reference through planning, sampling, execution, result and disposition. Required.
      - name: inspection_number
        type: string(100)
        unique: true
        help: Business-facing inspection reference. Identifies the inspection in quality operations and audit. Quality records, supplier disputes and reporting. Distinct from GoodsReceipt.receiptNumber and SupplierReturn.returnNumber. Provides human-recognizable traceability. Required.
      - name: inspection_date
        type: datetime
        help: Date and time inspection was performed or initiated. Establishes quality chronology. Audit, release, supplier performance and compliance. May occur after receipt or return authorization and before final disposition. Anchors inspection evidence. Required.
      - name: status
        type: string
        enum: QualityInspectionStatus
        help: Lifecycle state of inspection. Indicates whether inspection is pending, executing, completed with a result, or cancelled. Controls release and disposition workflows. Inspection status is independent of sample status, receipt/return status, and inventory state. PASSED/FAILED/CONDITIONAL controls eligible disposition. Required.
        default: OPEN
      - name: result
        type: string
        optional: true
        enum: QualityInspectionResult
        help: Overall outcome of inspection or test. Records whether the inspected scope satisfies applicable requirements after evaluating relevant samples, measurements and other evidence. Drives acceptance, rejection, quarantine, return, repair or release decisions. May be derived from QualityMeasurement and InspectionSample evidence; it does not replace that evidence. Supplies aggregate evidence for controlled disposition. Optional until testing is complete.
      - name: disposition
        type: string
        optional: true
        enum: QualityInspectionDisposition
        help: Controlled operational disposition resulting from inspection. Defines what happens to inspected material after quality evaluation. Controls inventory availability, supplier return, repair, scrap and release processes. RETURN_TO_SUPPLIER may initiate or support SupplierReturn; it does not itself reduce inventory until an attributable InventoryMovement is posted. Converts quality result into an authorized physical disposition. Optional until a disposition decision is made.
      - name: notes
        type: string(4000)
        optional: true
        help: Inspection observations and supporting context. Records qualitative evidence not represented by structured measurements. Quality review, supplier disputes and audit. Complements QualityMeasurement, InspectionSample and Nonconformance; does not replace structured evidence. Supports disposition decisions. Optional.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Product being inspected. Identifies material subject to quality evaluation. Quality history, supplier performance and disposition. Supplies item context.
      - name: inspector_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party performing or accountable for inspection. Identifies inspector or quality authority. Accountability, audit and compliance. Provides execution responsibility.
  - name: ProductionRecord
    help: Represents a industrial transaction called ProductionRecord within the CEDM business model. ProductionRecord is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface. Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate ProductionRecord records. The entity participates in a wider business graph through relationships with Product, Location, MiningSite, ManufacturingWorkOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns. The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships. A typical ProductionRecord record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Identifies the production record record associated with this ProductionRecord. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object. Used when creating, reviewing, searching, validating, reporting on, or integrating ProductionRecord records, where applicable. Its meaning is specific to ProductionRecord; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: production_date
        type: datetime
        help: Records the business date associated with the production. It is used in chronology, eligibility, scheduling, reporting, and related business rules. Used when creating, reviewing, searching, validating, reporting on, or integrating ProductionRecord records, where applicable. Its meaning is specific to ProductionRecord; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: quantity
        type: decimal
        help: The amount of the referenced item expressed in the applicable unit of measure. It is used by calculations, inventory, planning, fulfillment, or other quantity-based processes. Used when creating, reviewing, searching, validating, reporting on, or integrating ProductionRecord records, where applicable. Its meaning is specific to ProductionRecord; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: status
        type: string
        enum: ProductionRecordStatus
        help: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes. Used when creating, reviewing, searching, validating, reporting on, or integrating ProductionRecord records, where applicable. Its meaning is specific to ProductionRecord; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the planned state or classification in the context of ProductionRecord. Represents the recorded state or classification in the context of ProductionRecord. Represents the verified state or classification in the context of ProductionRecord. Represents the rejected state or classification in the context of ProductionRecord. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
        default: RECORDED
      - name: product_id
        type: string
        fk: true
        help: Connects ProductionRecord to Product so related business context can be navigated and enforced. Used when processes need to find or reason about Product records associated with a ProductionRecord. The declared cardinality 1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Connects ProductionRecord to Location so related business context can be navigated and enforced. Used when processes need to find or reason about Location records associated with a ProductionRecord. The declared cardinality 0..1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
      - name: work_order_id
        type: string
        fk: true
        references: ManufacturingWorkOrder
        optional: true
        help: Connects ProductionRecord to ManufacturingWorkOrder so related business context can be navigated and enforced. Used when processes need to find or reason about ManufacturingWorkOrder records associated with a ProductionRecord. The declared cardinality 0..1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: Scrap
    help: Governed manufacturing loss/disposition evidence. Scrap explains rejected or lost quantity; it is distinct from accepted ProductionReceipt and from InventoryMovement, which remains the stock ledger. Yield, manufacturing variance, quality, costing, genealogy, inventory and continuous improvement. ManufacturingWorkOrder supplies context; Nonconformance may explain quality cause; Lot/Serial preserve genealogy; InventoryMovement records stock consequence when applicable. Recorded → validated/authorized → inventory/quality reconciled → immutable historical evidence. Scrap updates yield/cost/quality analysis and inventory only through governed attributable transactions.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of scrap event. Identifies one governed production loss/disposition. Manufacturing, inventory, costing, quality, and audit. Links work order/product quantity to cause and inventory effect. Required.
      - name: scrap_number
        type: string(100)
        unique: true
        help: Human-facing scrap reference. Operational identifier for production loss. Shop-floor reporting, quality, costing and audit. Distinct from inventory movement reference. Required.
      - name: quantity
        type: decimal
        help: Quantity classified as scrap. Quantifies governed production loss or rejected material. Yield, variance, costing and inventory. Interpreted with Product/UOM/lot/serial context. Required.
      - name: reason_code
        type: string(100)
        help: Governed reason for scrap. Classifies why material/output was lost or rejected. Quality analysis, costing and continuous improvement. Should align with controlled reason taxonomy. Required.
      - name: scrapped_at
        type: datetime
        help: Effective scrap time. Establishes production-loss chronology. Cost period, genealogy and audit. Must align with related execution evidence. Required.
      - name: work_order_id
        type: string
        fk: true
        references: ManufacturingWorkOrder
        help: Production order under which scrap occurred. Supplies production authorization and planned context. Yield and variance reconciliation. Exactly one work order. Scrap contributes to completion reconciliation.
      - name: product_id
        type: string
        fk: true
        help: Material or output being scrapped. Identifies the item affected. Inventory, costing, quality and analysis. Exactly one Product. Must reconcile with work-order input/output context or approved exception.
      - name: lot_id
        type: string
        fk: true
        optional: true
        help: Lot affected by scrap. Preserves batch genealogy and disposition. Recall, quality and inventory. Required under lot-control policy. Lot quantity/state must reconcile.
  - name: ProductLifecycle
    help: Effective-dated audit trail of product eligibility changes. Product.status is current state; ProductLifecycle preserves governed transition history and reason. PIM governance, product introduction, blocking, discontinuation and retirement. Changes propagate to open dependent workflows while historical evidence remains immutable. Append-only governed transition history for Product.
    parent: Product
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable lifecycle-event identity. Identifies one governed product state transition. PIM governance and audit. Supplements current Product.status with historical evidence. Required.
      - name: effective_at
        type: datetime
        help: Time lifecycle transition becomes effective. Establishes point-in-time product eligibility. Catalog, transaction validation and audit. Historical transactions use status effective at relevant time. Required.
      - name: lifecycle_status
        type: string
        enum: ProductLifecycleLifecycleStatus
        help: Product lifecycle state established by event. Governs future product eligibility. Master-data workflow. Reconciles to current Product.status. Not yet generally usable. Eligible. No new ordinary demand. Temporarily restricted. Lifecycle closed. Required.
      - name: reason
        type: string(1000)
        help: Business reason for transition. Provides governance/audit justification. Approval and downstream exception handling. Does not itself reverse existing obligations. Required.
      - name: product_id
        type: string
        fk: true
        help: Product whose lifecycle changes. Supplies governed master context. Eligibility and audit. Exactly one Product. Transition triggers dependency validation.
