entity:
  name: ProductLifecycle
  namespace: cedm.domain
  kind: product_governance_transaction
  description: A governed effective-dated record of Product lifecycle transitions used to preserve why, when, and under whose authority product eligibility changed.
  ui:
    icon: package
  identity: {key: productLifecycleId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: productLifecycleId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent, system-generated identity of this lifecycle change record for a product.', usage: Generated on creation and never changed; the audit trail of a product's status changes is made of these records., businessMeaning: Identifies one governed product state transition., relationshipContext: Supplements current Product.status with historical evidence.}}
    - {name: effectiveAt, type: datetime, required: true, help: {summary: When the new status took effect., usage: Set by the user making the change; the status on any date is the latest record effective by then., businessMeaning: Establishes point-in-time product eligibility., relationshipContext: Historical transactions use status effective at relevant time.}}
    - name: lifecycleStatus
      type: enum
      required: true
      values: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
      help:
        summary: The lifecycle status the product moved to at the effective time of this record.
        usage: Chosen when the change is made; restrictive moves need checks of open orders and stock, and earlier records are never rewritten.
        valueSemantics:
          DRAFT: The product is still being set up and is not yet available for trading.
          ACTIVE: The product is available for ordinary buying and selling.
          DISCONTINUED: The product is being phased out and no new trading should begin.
          BLOCKED: The product is temporarily barred from trading until the issue is resolved.
          RETIRED: The product is permanently removed from the catalogue.
        businessMeaning: Governs future product eligibility.
        relationshipContext: Reconciles to current Product.status.
    - {name: reason, type: string, required: true, maxLength: 1000, help: {summary: Why the status changed., usage: Written by the user making the change; read in audits and when the product is questioned., businessMeaning: Provides governance/audit justification., relationshipContext: Does not itself reverse existing obligations.}}
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The product whose status changed., usage: Set when the record is created., cardinalityMeaning: "Exactly one product: each record is part of one product's history.", workflowRole: Builds the product's status history., businessMeaning: Supplies governed master context.}}
  invariants:
    - {id: PRODUCT-LIFECYCLE-001, rule: Lifecycle events for a Product must form a non-contradictory effective chronology.}
    - {id: PRODUCT-LIFECYCLE-002, rule: "Restrictive transitions require validation of open sales, procurement, inventory, manufacturing, service and fulfillment obligations."}
    - {id: PRODUCT-LIFECYCLE-003, rule: Lifecycle transition never rewrites completed historical transaction evidence.}
  help:
    summary: A dated record of a change in a product's lifecycle status, with the reason, so it is clear why and when a product became eligible or ineligible for trade.
    businessMeaning: A product's status changes, such as from active to discontinued, and the reasons matter. Keeping each change as an effective-dated record allows the status on any past date to be reproduced.
    usage: Created whenever a product's lifecycle status changes; read by product management, compliance and audit.
    relationshipContext: Each record belongs to one Product.
    lifecycle: Records are history and are not edited; a further change is a new record.
    example: On 1 March the product was changed from ACTIVE to DISCONTINUED because the supplier ended production.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCT-LIFECYCLE}
