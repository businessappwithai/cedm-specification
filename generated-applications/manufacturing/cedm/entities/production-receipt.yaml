entity:
  name: ProductionReceipt
  namespace: cedm.domain
  kind: manufacturing_output_transaction
  description: An auditable manufacturing output receipt recording accepted quantity produced by a ManufacturingWorkOrder, with inventory increase represented by attributable InventoryMovement and output genealogy preserved by Lot/SerialNumber.
  ui:
    icon: package
  identity: {key: productionReceiptId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: productionReceiptId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the receipt, constant for its life.', usage: Generated on creation; the inventory movement and costing refer to it., relationshipContext: Referred to by the inventory movement and by any output costing that reads the receipt., businessMeaning: Identifies one governed output posting.}}
    - {name: receiptNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: 'The business number printed on the receipt, such as PR-2041.', relationshipContext: Quoted on the work order and on stock documents., businessMeaning: Operational identifier for output posting., usage: "Shop floor, warehouse, quality, and audit."}}
    - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {businessMeaning: The accepted quantity added to stock. Rejected output is not counted here., usage: Entered when output is reported; must be positive; drives the inventory increase and unit cost., relationshipContext: Compared with the quantity planned on the work order to show how much of it is done., summary: Accepted output quantity received into inventory.}}
    - {name: receivedAt, type: datetime, required: true, help: {businessMeaning: 'When the output entered stock, which decides the period it is costed and reported in.', usage: Defaults to the time of entry; reports and costing group by it., relationshipContext: Matches the movement date on the linked inventory movement., summary: Effective output receipt time.}}
  relationships:
    - {name: workOrder, target: ManufacturingWorkOrder, cardinality: "1", ownership: reference, help: {summary: The manufacturing work order that produced this output., usage: Chosen when the receipt is entered; the work order's completed quantity follows from its receipts., cardinalityMeaning: Exactly one work order; a receipt cannot exist without its source., workflowRole: 'Links output back to the job that made it, for completion and cost.', businessMeaning: "Supplies authorization, product, BOM/routing context."}}
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The product that was produced and received., usage: Normally taken from the work order; read by stock and costing., cardinalityMeaning: Exactly one product per receipt., workflowRole: Identifies what stock increases., businessMeaning: Identifies output inventory item.}}
    - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one lot; empty for products that are not lot tracked., summary: Output production lot., businessMeaning: Groups produced quantity for genealogy/quality/recall., usage: Traceability and quality release., workflowRole: May remain quarantined pending required quality evidence.}}
    - {name: serialNumbers, target: SerialNumber, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: 'Any number of serial numbers, one for each serialised unit received; none for untracked products.', summary: Serialized output units created/received., businessMeaning: Establishes unit-level output identity., usage: "Inventory, service, warranty, and recall.", workflowRole: Serial count must reconcile to quantity under product policy.}}
    - {name: qualityInspection, target: QualityInspection, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one inspection; empty when the product needs none., summary: Inspection evidence governing output acceptance/release., businessMeaning: Separates production from quality disposition., usage: Release and compliance., workflowRole: Required quality gates constrain availability.}}
    - {name: inventoryMovement, target: InventoryMovement, cardinality: '1', ownership: reference, help: {usage: Created with the receipt; read to trace the stock effect., cardinalityMeaning: 'Exactly one movement, which carries the stock increase.', summary: Posted stock event implementing output receipt., businessMeaning: InventoryMovement remains authoritative inventory ledger., workflowRole: Must reconcile product/quantity/lot/serial and be idempotent.}}
  invariants:
    - {id: PRODUCTION-RECEIPT-001, rule: quantity must be greater than zero.}
    - {id: PRODUCTION-RECEIPT-002, rule: Accepted cumulative output must not exceed authorized work-order quantity except by explicit overproduction policy.}
    - {id: PRODUCTION-RECEIPT-003, rule: Required quality inspection must be complete before unrestricted release.}
    - {id: PRODUCTION-RECEIPT-004, rule: Executed receipt must post inventory exactly once; correction uses compensating events.}
    - {id: PRODUCTION-RECEIPT-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: An auditable record that a quantity of accepted product came out of a manufacturing work order and into stock.
    businessMeaning: A receipt is the moment production becomes inventory. It ties the quantity made to the work order, the product, any lot or serial numbers and the quality inspection that accepted it, and it is backed by an inventory movement so stock rises by exactly what was received.
    usage: Created by the shop floor or production control when finished goods are reported; read by inventory, costing and quality.
    relationshipContext: A receipt belongs to one work order and one product, may name a lot, serial numbers and an inspection, and always points to the inventory movement that added the stock.
    lifecycle: A receipt is posted once and then stands. A correction is a further movement, never an edit.
    example: Receipt PR-2041 books 120 units of a finished pump from work order MWO-889 into lot L-2210 after inspection.
    changePropagation: Receipt updates inventory and production completion and connects consumed material genealogy to output identities.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCTION-RECEIPT}
