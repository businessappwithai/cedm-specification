entity:
  name: Routing
  namespace: cedm.domain
  kind: manufacturing_process_master
  description: A versioned manufacturing process definition sequencing the operations required to produce or transform a Product.
  ui:
    icon: database
  identity: {key: routingId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: routingId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identifier of one version of a manufacturing routing., usage: 'Generated on creation; production orders, costing and planning refer to the exact version through it.', businessMeaning: Identifies one governed production method., relationshipContext: Connects Product to ordered Operation definitions.}}
    - {name: code, type: string, required: true, maxLength: 100, help: {summary: 'The business code engineers use to recognise the manufacturing routing, shared by all its versions.', usage: 'Assigned by process engineering; read in planning and shop floor documents, and paired with the version to pick a definition.', businessMeaning: Human-recognizable process identifier., relationshipContext: Combined with version identifies controlled process definition.}}
    - {name: routingVersion, type: string, required: true, maxLength: 50, help: {summary: 'The revision of the routing, so a changed process becomes a new version and not an overwrite.', usage: 'Set by engineering change control; production orders keep the version they were released with, so past builds can be reproduced.', valueSemantics: {ACTIVE: Approved for production and eligible for new orders to be released against.}, businessMeaning: Preserves which process definition governed production., relationshipContext: Released work snapshots or references an effective version.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, OBSOLETE]
      help:
        valueSemantics:
          DRAFT: Being defined by engineering; not yet usable for production.
          ACTIVE: Approved for production and eligible for new orders to be released against.
          SUSPENDED: Temporarily withdrawn from use, for example pending a process investigation.
          OBSOLETE: Superseded by a newer version or no longer used. A final state.
        summary: Whether the process definition may be used for production.
        businessMeaning: Controls eligibility for new production release.
        usage: Engineering change and manufacturing control.
        relationshipContext: Historical orders retain prior routing evidence.
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Output Product this routing produces., businessMeaning: Associates process definition with manufactured item., usage: Planning and production release., cardinalityMeaning: Exactly one output Product., workflowRole: Must match work-order output.}}
    - {name: operations, target: Operation, cardinality: "1..*", ownership: aggregate, help: {summary: Ordered standard process steps., businessMeaning: Defines how production is performed., usage: "Scheduling, costing, execution, and quality gates.", cardinalityMeaning: Active routing requires at least one operation., workflowRole: Operations are instantiated/executed under ManufacturingWorkOrder.}}
  invariants:
    - {id: ROUTING-001, rule: code and routingVersion must be unique within the applicable manufacturing context.}
    - {id: ROUTING-002, rule: ACTIVE routing must contain at least one valid ordered Operation.}
    - {id: ROUTING-003, rule: Released production must preserve the effective routing routingVersion and must not be silently changed by later master-data revisions.}
  lifecycle:
    title: Routing Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, OBSOLETE]
    initial: DRAFT
    terminal: [OBSOLETE]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: OBSOLETE, action: mark_obsolete}
      - {from: ACTIVE, to: OBSOLETE, action: mark_obsolete}
      - {from: SUSPENDED, to: OBSOLETE, action: mark_obsolete}
  help:
    summary: Versioned definition of manufacturing process sequence.
    businessMeaning: BillOfMaterial defines what materials are required; Routing defines how the output is produced.
    usage: MRP, scheduling, costing, shop-floor execution, quality, and traceability.
    relationshipContext: Product is the output; Operations define steps; WorkCenters provide capacity; ManufacturingWorkOrder executes a selected version.
    lifecycle: Draft → active → suspended/obsolete with versioned replacement.
    changePropagation: Routing changes revalidate planned/unreleased work; released/completed work retains historical version.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ROUTING}
