entity:
  name: Lot
  namespace: cedm.domain
  kind: inventory_traceability_master
  description: A governed batch or lot identity grouping a quantity of one Product with common production, receipt, quality, expiry, or provenance characteristics for inventory traceability.
  ui:
    icon: database
  identity: {key: lotId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: lotId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the lot, which stays the same if its number is reissued.', usage: 'Generated on creation; balances, movements and inspections refer to it.', businessMeaning: Identifies the traceability group independently of printed lot number., relationshipContext: Groups quantities of one Product across locations and movements.}}
    - {name: lotNumber, type: string, required: true, maxLength: 150, help: {summary: 'The batch or lot number by which the quantity is traced, as printed on the label.', usage: Assigned at production or receipt; unique per product; used for recalls and first-expired-first-out picking., businessMeaning: Traceability code used operationally and externally., relationshipContext: Uniqueness is governed with Product and organizational policy.}}
    - {name: manufacturedAt, type: datetime, required: false, help: {summary: When the lot was produced., usage: Entered at production or from the supplier's documents; the start of shelf life., businessMeaning: Anchors production age and provenance., relationshipContext: Distinct from receipt date.}}
    - {name: expiresAt, type: datetime, required: false, help: {summary: When the lot must no longer be used or sold., usage: 'Calculated from manufacture date and shelf life, or taken from the supplier; stock past it is blocked.', businessMeaning: Controls eligibility where shelf life applies., relationshipContext: Does not itself post inventory movement.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, HOLD, QUARANTINED, RELEASED, EXPIRED, REJECTED, CONSUMED, CLOSED]
      help:
        summary: Whether the lot may be used.
        usage: Set by quality and inventory control; only usable statuses allow picking and shipping.
        valueSemantics:
          ACTIVE: In stock and usable under normal rules.
          HOLD: Temporarily blocked, for example during an enquiry; it can be released again.
          QUARANTINED: Held apart pending a quality decision.
          RELEASED: Approved by quality for use.
          EXPIRED: Past its expiry date. A final state.
          REJECTED: Failed quality checks and not to be used. A final state.
          CONSUMED: Fully used up. A final state.
          CLOSED: Closed administratively with nothing left to track. A final state.
        businessMeaning: Controls allocation and operational eligibility while preserving stock history.
        relationshipContext: Status restrictions affect availability but do not rewrite movement history.
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The product that the lot is a batch of., usage: Set when the lot is created., cardinalityMeaning: 'Exactly one product: a lot groups units of a single item.', workflowRole: Gives the lot its specification and shelf life., businessMeaning: Defines item identity for all lot quantities.}}
    - {name: inventoryBalances, target: InventoryBalance, cardinality: "0..*", ownership: reference, help: {summary: The stock balances held in this lot., usage: Read to see where the lot's quantity is stored., cardinalityMeaning: 'Any number of balances, one for each location holding some of the lot.', workflowRole: Show how a lot is spread across locations., businessMeaning: Shows where lot quantity is currently held.}}
    - {name: inventoryMovements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {summary: The stock movements that involve the lot., usage: Read to trace the lot forwards to customers and backwards to its source., cardinalityMeaning: Any number of movements over the lot's life., workflowRole: Provide the traceability needed for recalls., businessMeaning: Historical ledger for lot quantity movement.}}
  invariants:
    - {id: LOT-001, rule: lotNumber must be unique for Product within the applicable traceability namespace.}
    - {id: LOT-002, rule: expiresAt must not precede manufacturedAt when both are known.}
    - {id: LOT-003, rule: "HOLD, QUARANTINED, EXPIRED, or REJECTED lots must not enter unrestricted allocation without an authorized release or exception."}
    - {id: LOT-004, rule: Lot identity and provenance referenced by posted inventory or quality evidence are immutable; correction uses controlled genealogy or compensating records.}
    - {id: LOT-005, rule: Lot quantity across balances must reconcile to posted lot-attributed InventoryMovement events.}
  lifecycle:
    title: Lot Lifecycle
    attribute: status
    states: [ACTIVE, HOLD, QUARANTINED, RELEASED, EXPIRED, REJECTED, CONSUMED, CLOSED]
    initial: ACTIVE
    terminal:
      - CONSUMED
      - EXPIRED
      - REJECTED
      - CLOSED
    transitions:
      - {from: ACTIVE, to: HOLD, action: hold}
      - {from: ACTIVE, to: QUARANTINED, action: quarantine}
      - {from: ACTIVE, to: CONSUMED, action: consume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: HOLD, to: ACTIVE, action: release_hold}
      - {from: HOLD, to: QUARANTINED, action: quarantine}
      - {from: QUARANTINED, to: RELEASED, action: release}
      - {from: QUARANTINED, to: REJECTED, action: reject}
      - {from: QUARANTINED, to: HOLD, action: hold}
      - {from: RELEASED, to: HOLD, action: hold}
      - {from: RELEASED, to: QUARANTINED, action: quarantine}
      - {from: RELEASED, to: CONSUMED, action: consume}
      - {from: RELEASED, to: EXPIRED, action: expire}
      - {from: RELEASED, to: CLOSED, action: close}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a lot is stopped"
      description: "When a lot is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "LOT-EXCEPTION-{{id}}"
              name: "Resolve lot {{lot_number}}"
              description: "Lot {{lot_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a lot is ended"
      description: "When a lot is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "LOT-FOLLOW-UP-{{id}}"
              name: "Follow up on lot {{lot_number}}"
              description: "Lot {{lot_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Batch-level inventory identity for end-to-end genealogy and recall.
    businessMeaning: Product identifies what an item is; Lot identifies which production or receipt batch a quantity belongs to.
    usage: Inventory, WMS, manufacturing, quality, procurement, sales fulfillment, expiry management, recall, and regulatory traceability.
    relationshipContext: Lot follows Product quantities through InventoryMovement and InventoryBalance and may later connect to receipt, production, shipment, inspection, and certificate evidence.
    lifecycle: Created/received → active or quarantined → released/held → consumed/expired/rejected → closed.
    changePropagation: Status, expiry, or quality changes immediately revalidate availability, reservations, picking, shipment, production consumption, and disposition without altering historical movements.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-LOT}
