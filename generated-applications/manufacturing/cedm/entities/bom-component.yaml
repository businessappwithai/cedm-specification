entity:
  name: BOMComponent
  namespace: cedm.domain
  kind: manufacturing_detail_entity
  description: A component line within a bill of material defining a required product or material quantity.
  ui:
    icon: table
  identity:
    key: bomComponentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: bomComponentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of this component line.
        usage: Generated when the line is added; revisions and cost roll-ups refer to it.
    - name: sequence
      type: integer
      required: true
      help:
        summary: The position of the line in the bill of material.
        usage: Set by the engineer to give lines a stable order; also used to name a line in discussion, for example line 20.
    - name: quantity
      type: decimal
      required: true
      precision: 18
      scale: 6
      help:
        summary: How much of the component is needed to make one unit of the parent product.
        usage: Entered by the engineer in the component's unit of measure; must be greater than zero. Planning multiplies it by the order quantity.
    - name: scrapPercent
      type: decimal
      required: false
      precision: 8
      scale: 4
      minimum: 0
      help:
        summary: The extra percentage of the component expected to be lost or spoiled during production.
        usage: Entered from experience; planning adds it to the net requirement so enough material is ordered. Zero or more, at most 100.
    - name: operationSequence
      type: integer
      required: false
      help:
        summary: The routing operation at which this component is consumed.
        usage: Optional; lets the shop floor issue material at the step where it is used instead of all at the start.
  relationships:
    - name: billOfMaterial
      target: BillOfMaterial
      cardinality: '1'
      ownership: reference
      help:
        summary: The bill of material this line belongs to.
        usage: Set when the line is created and not changed.
        cardinalityMeaning: Exactly one bill; a bill has many lines.
        workflowRole: Lines are released and retired together with their bill.
    - name: componentProduct
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product or material that is consumed.
        usage: Chosen from the product catalogue when the line is added.
        cardinalityMeaning: Exactly one product per line; the same product can appear on many bills.
        workflowRole: Gives planning and costing the item to buy or make.
  invariants:
    - id: BOM-COMPONENT-001
      rule: quantity must be greater than zero.
    - id: BOM-COMPONENT-002
      rule: scrapPercent must be zero or greater.
    - {id: BOM-COMPONENT-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: BOM-COMPONENT-EXE-002, rule: "Scrap Percent is a percentage between 0 and 100.", violatedWhen: "scrap_percent != null and (scrap_percent < 0 or scrap_percent > 100)", message: "Scrap Percent must be between 0 and 100."}
  help:
    summary: 'One line of a bill of material: a product or material that is needed, in what quantity, at what stage of the build.'
    businessMeaning: A bill of material is only as useful as its lines. Each component line says what goes into the finished product, how much, and how much extra to allow for waste, which is what material planning and costing run on.
    usage: Added when a bill of material is designed or revised; read by planning to calculate material requirements and by costing to price the product.
    relationshipContext: Each component belongs to one BillOfMaterial and names the Product or material it consumes.
    lifecycle: 'Component lines follow the lifecycle of their bill: they are edited while it is in draft and fixed once it is released.'
    example: 'Line 20 of the bike BOM: 2 wheels, scrap allowance 1%, consumed at assembly operation 30.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BOM-COMPONENT
