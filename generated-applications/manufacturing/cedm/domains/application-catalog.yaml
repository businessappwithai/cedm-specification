        - FiscalPeriod
        - InvoiceLine
        - PaymentAllocation
        - PaymentInstruction
        - CreditNote
        - CreditNoteLine
        - CreditNoteApplication
        - TaxCode
        - TaxJurisdiction
        - TaxRate
        - TaxRegistration
        - TaxRule
        - TaxTransaction
        - BillingCycle
        - Charge
        - Subscription
        - SubscriptionPlan
        - UsageRecord
        - AssetClass
        - AssetAcquisition
        - AssetDepreciation
        - AssetDisposal
        - AssetTransfer
        - ForeignExchangeTransaction
        - CashPosition
        - Interest
    - domain: banking
      icon: piggy-bank
      entities: [BankAccount, BankTransaction, BankReconciliation, BankLoan, Deposit, Credit, Collateral]
    - domain: procurement
      icon: shopping-bag
      capabilities: [procurement]
      entities:
