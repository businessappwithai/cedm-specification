# CEDM Application Catalog
# Which applications are built from CEDM, and what each is made of.
#
# Each catalog domain (domains/catalog.yaml) that the entity library covers is
# its own application. Every application imports one common foundation — the
# parties, places, units and reference data every domain shares — and its own
# domain entities, named here by capability (domains/capability-catalog.yaml)
# and by entity. An imported entity also brings what it cannot exist without
# (its required references), so an application is complete without listing
# its dependencies.
#
# applications/*.cedm.yaml are generated from this file by
# scripts/build-domain-applications.ts; edit this file, not those.
catalog:
  version: 1.0.0
  common:
    name: CEDM Common Foundation
    description: The parties, organisations, places, units and reference data every domain application shares.
    entities:
      - Party
      - Person
      - Organization
      - PartyRole
      - PartyRelationship
      - LegalEntity
      - BusinessUnit
      - Department
      - Address
      - ContactPoint
      - Location
      - Country
      - Language
      - Currency
      - ExchangeRate
      - UnitOfMeasure
      - Calendar
      - Attachment

  applications:
    - domain: enterprise
      icon: building-2
      entities: [ERP, Team, OrganizationMembership, Classification, Approval, Assignment, Activity, BusinessEvent, BusinessTransaction]
    - domain: finance
      icon: landmark
      capabilities: [financial-accounting, accounts-payable, accounts-receivable, budgeting-planning]
      entities:
