        - GoodsReceiptLine
        - SupplierClaim
        - SupplierClaimResolution
        - SupplierCreditNote
        - SupplierCreditNoteLine
        - SupplierCreditNoteApplication
        - SupplierDebitNote
        - SupplierDebitNoteLine
        - SupplierDebitNoteApplication
        - SupplierPerformanceAssessment
        - SupplierReturn
        - SupplierReturnLine
    - domain: sales
      icon: badge-dollar-sign
      capabilities: [sales, order-management, pricing, product-management]
      entities: [QuotationLine, DiscountRule, Pricing, Promotion, Campaign, Prospect, Contact, CustomerReturn, CustomerReturnLine, Brand]
    - domain: customer-service
      icon: headphones
