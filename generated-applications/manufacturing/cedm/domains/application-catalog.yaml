  notCovered:
    description: >-
      Catalog domains the entity library has no entities for yet. Each becomes
      an application the day the library gains its entities and they are
      listed above.
    domains: [aerospace, chemicals, pharmaceuticals, apparel, field-service, facilities, security-operations, environment]
