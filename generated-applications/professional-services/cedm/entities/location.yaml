entity:
  name: Location
  namespace: cedm.domain
  kind: core_master_entity
  description: A physical or logical place at which business resources, activities, inventory, services, or organizational operations are situated.
  ui:
    icon: map-pin
  identity: {key: locationId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: locationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the location, which stays the same when its name or code changes.
        usage: Generated on creation; assets, stock and documents refer to the location through it.
    - name: code
      type: string
      required: true
      maxLength: 100
      unique: true
      help:
        summary: The code of the place in the organisation's site list, such as NL-RTM-DC1.
        usage: Unique; assigned by the administrator and used in integrations and labels.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name by which people refer to the place, such as Rotterdam Depot.
        usage: Entered by the administrator when the location is created; shown in lists, maps and documents, and may be changed without breaking references.
    - name: locationType
      type: enum
      required: true
      values: [SITE, WAREHOUSE, STORE, OFFICE, FACTORY, YARD, PORT, DEPOT, VIRTUAL, OTHER]
      help:
        valueSemantics:
          SITE: A geographic site that may contain several buildings.
          WAREHOUSE: A building or area for storing goods.
          STORE: A retail outlet where goods are sold to customers.
          OFFICE: A place where office work is done.
          FACTORY: A place where goods are made.
          YARD: An open area for storing or staging equipment or containers.
          PORT: A harbour or terminal.
          DEPOT: A base for vehicles and equipment.
          VIRTUAL: A logical place with no physical presence, such as an online store.
          OTHER: Any other kind of place.
        summary: What kind of place it is.
        usage: Chosen at creation; decides which processes can use the location.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
      help:
        valueSemantics:
          PLANNED: Expected but not yet in use.
          ACTIVE: In use and offered for new assignments.
          INACTIVE: Temporarily not used but expected to return to service.
          CLOSED: Closed down, with no new assignments but history kept.
          RETIRED: Removed from use altogether. A final state.
        summary: Whether the place is in use.
        usage: Set by the administrator; only ACTIVE locations are offered for new assignments.
    - name: addressId
      type: reference
      target: Address
      required: false
      help:
        summary: The postal address of the location.
        usage: Chosen from the address list; used for deliveries, mapping and tax.
    - name: parentLocationId
      type: reference
      target: Location
      required: false
      help:
        summary: The place that contains this one, such as the site that holds a warehouse.
        usage: Set to build the hierarchy; a top-level place has none.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: The date and time at which the location record was first created.
        usage: Set automatically by the system and never edited; it supports audit and ordering of newly added places.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: The date and time at which the location record was last changed.
        usage: Set automatically on each change; synchronisation jobs and reviewers use it to find recently altered locations.
  relationships:
    - name: parentLocation
      target: Location
      cardinality: 0..1
      ownership: reference
      inverse: childLocations
      help:
        summary: The place that contains this one.
        usage: Chosen to place the location in the hierarchy.
        cardinalityMeaning: At most one parent; a top-level site has none.
        workflowRole: Lets reports and stock roll up from the smaller place to the larger.
    - name: childLocations
      target: Location
      cardinality: 0..*
      ownership: reference
      inverse: parentLocation
      help:
        summary: The places directly within this one.
        usage: Read to expand a site into its buildings and areas.
        cardinalityMeaning: Any number of children, including none.
        workflowRole: Reflects the hierarchy from the other side.
    - name: address
      target: Address
      cardinality: 0..1
      ownership: reference
      help:
        summary: The address of the location.
        usage: Chosen when the place has a postal address.
        cardinalityMeaning: At most one address; virtual places have none.
        workflowRole: Provides delivery and map position.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that operates the place.
        usage: Set where operation is clear.
        cardinalityMeaning: At most one operating organisation.
        workflowRole: Determines responsibility and reporting.
  invariants:
    - id: LOCATION-001
      rule: A Location cannot be its own parent.
    - id: LOCATION-002
      rule: The Location hierarchy must not contain cycles.
    - id: LOCATION-003
      rule: A Location in CLOSED or RETIRED status must not be selected for new operational transactions that require an active physical location unless an explicit exception workflow permits it.
    - id: LOCATION-004
      rule: Changing or retiring a Location must trigger validation of dependent operational entities and workflows that reference it before future use is disabled.
    - id: LOCATION-005
      rule: Historical transactions must retain the Location context effective when the transaction occurred and must not be rewritten merely because the Location master changes.
    - id: LOCATION-006
      rule: Changing parentLocation must preserve hierarchy integrity and must not create a cycle.
    - id: LOCATION-007
      rule: If an operational Location references an Address, the referenced Address must be active and usable when the Location becomes effective unless an explicitly supported historical/legacy exception applies.
  lifecycle:
    title: Location Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A physical or logical place where resources, activities, stock, services or organisational operations are situated.
    businessMeaning: 'Almost everything in a business happens somewhere. The location is the shared reference for that: sites, warehouses, stores, offices, ports and even virtual places, arranged in a hierarchy so addresses, stock and assets can all point to the same place.'
    usage: Created when a place becomes relevant; arranged under parent locations; referenced by assets, stock, facilities and addresses; read by logistics, facilities and reporting.
    relationshipContext: A location may sit within a parent Location with children beneath it, has an Address and may belong to an Organization.
    lifecycle: A location is planned, becomes active when in use, may be inactive for a time, and is closed or retired when no longer used. History and references remain valid.
    example: The Rotterdam distribution centre, a warehouse location within the Netherlands site, with its own address.
    workflowContext: Location create → validate hierarchy/address/organization → activate → use in operational transactions → status change/closure → validate dependent resources and prevent incompatible future use → preserve historical transaction context.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-LOCATION}
