entity:
  name: NonprofitCampaign
  namespace: cedm.domain
  kind: nonprofit_entity
  description: A fundraising or public-interest campaign organized to achieve a defined funding or participation objective.
  ui:
    icon: megaphone
  identity:
    key: campaignId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: campaignId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the campaign.
        usage: Generated on creation; donations refer to it.
    - name: campaignCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the campaign, such as WINTER26.
        usage: Unique; used in appeal tracking.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the campaign.
        usage: Shown in reports and donor communications.
    - name: objective
      type: string
      required: false
      maxLength: 2000
      help:
        summary: What the campaign aims to achieve.
        usage: Written at planning; read when judging results.
    - name: targetAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The amount the campaign aims to raise.
        usage: Set at planning; not negative; progress is measured against it.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - COMPLETED
        - CANCELLED
      help:
        valueSemantics:
          PLANNED: Being prepared and not yet launched.
          ACTIVE: Running and accepting gifts.
          COMPLETED: Finished. A final state.
          CANCELLED: Called off. A final state.
        summary: Where the campaign is.
        usage: Updated by the fundraising team.
  relationships:
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation running the campaign.
        usage: Set at planning.
        cardinalityMeaning: 'Exactly one organisation: a campaign is run in the name of a single body.'
        workflowRole: Determines whose cause and accounts the campaign serves.
    - name: donors
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The people and organisations who gave to the campaign.
        usage: Added as gifts are received.
        cardinalityMeaning: Any number of donors.
        workflowRole: Build the campaign's donor list.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents of the campaign, such as appeal letters and reports.
        usage: Attached during the campaign.
        cardinalityMeaning: Any number of documents.
        workflowRole: Form the campaign's record.
  invariants:
    - {id: NONPROFIT-CAMPAIGN-EXE-001, rule: "Target Amount cannot be negative.", violatedWhen: "target_amount != null and target_amount < 0", message: "Target Amount cannot be negative."}
  lifecycle:
    title: Nonprofit Campaign Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a nonprofit campaign is ended"
      description: "When a nonprofit campaign is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "NONPROFIT-CAMPAIGN-FOLLOW-UP-{{id}}"
              name: "Follow up on nonprofit campaign {{name}}"
              description: "Nonprofit campaign {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A fundraising or public-interest campaign run to reach a defined funding or participation objective.
    businessMeaning: Nonprofits raise money and support in campaigns. Recording the objective and target lets the organisation see what a campaign raised, from whom, and whether it succeeded.
    usage: Planned by the fundraising team; launched; tracked; completed; read by management and donors.
    relationshipContext: A campaign is run by an Organization, draws on donor Parties and is supported by Documents.
    lifecycle: A campaign is planned, active while running, and ends completed or cancelled.
    example: The winter appeal to raise 250,000 for the emergency shelter programme.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-NONPROFIT-CAMPAIGN
