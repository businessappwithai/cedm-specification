# The front door for food: the application at /, the chat at /chat.
#
# One origin is the point. The chat opens the application's screens in a frame
# and both answer only to their own origin (`frame-ancestors 'self'`), and the
# application's session cookie is first-party to the chat that relays it.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 25m;

  # The chat gateway trusts exactly one forwarded address (CHAT_TRUST_PROXY),
  # so it is set here, never appended: a client-supplied X-Forwarded-For would
  # otherwise choose whose sign-in rate limit an attempt counts against.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /chat {
    return 301 /chat/;
  }

  # The conversation is a WebSocket that lives as long as the page does.
  location /chat/ {
    proxy_pass http://chat:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
