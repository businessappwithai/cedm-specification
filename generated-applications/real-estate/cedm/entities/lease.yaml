entity:
  name: Lease
  namespace: cedm.domain
  kind: real_estate_commercial_entity
  description: A contractual arrangement granting a party rights to use a property or asset for a defined period and consideration.
  ui:
    icon: key-round
  identity:
    key: leaseId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: leaseId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the lease.
        usage: Generated on creation; payment schedules and notices refer to it.
    - name: leaseNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number of the lease.
        usage: Allocated by the lessor; unique; quoted on invoices and notices.
    - name: leaseType
      type: enum
      required: true
      values:
        - OPERATING
        - FINANCE
        - COMMERCIAL
        - RESIDENTIAL
        - EQUIPMENT
        - OTHER
      help:
        summary: The kind of lease, which decides its accounting and legal treatment.
        usage: Chosen when the lease is created and not expected to change; finance uses it to decide how payments and the asset are recorded.
        valueSemantics:
          OPERATING: A lease where the lessor keeps the risks and rewards of ownership.
          FINANCE: A lease that transfers substantially all the risks and rewards of ownership to the lessee.
          COMMERCIAL: A lease of business premises such as offices, shops or industrial units.
          RESIDENTIAL: A lease of a home to a tenant for living in.
          EQUIPMENT: A lease of machinery, vehicles or other movable equipment.
          OTHER: Any lease that fits none of the other types, described in its terms.
    - name: startDate
      type: date
      required: true
      help:
        summary: The date the lease starts.
        usage: Taken from the agreement; payments and obligations run from it.
    - name: endDate
      type: date
      required: false
      help:
        summary: The date the lease ends.
        usage: Taken from the agreement; must not be before the start date. Empty for an open-ended lease.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - EXPIRED
        - TERMINATED
        - CANCELLED
      help:
        summary: Where the lease stands, from negotiation through occupation to its end.
        usage: Moved by the lessor or property manager; rent is charged only while the lease is ACTIVE, and ended leases stay on record.
        valueSemantics:
          DRAFT: Being negotiated or prepared and not yet binding.
          ACTIVE: In force, with the lessee entitled to use the property or asset and rent falling due.
          SUSPENDED: Paused, for example during a dispute or an agreed rent holiday.
          EXPIRED: Ran to its agreed end date. A final state.
          TERMINATED: Ended early by agreement or breach. A final state.
          CANCELLED: Withdrawn before it ever started. A final state.
    - name: periodicAmount
      type: money
      required: false
      help:
        summary: The rent or payment due each period.
        usage: Taken from the agreement; not negative. The billing schedule applies it.
  relationships:
    - name: property
      target: Property
      cardinality: 0..1
      ownership: reference
      help:
        summary: The property that is leased.
        usage: Chosen when the lease is created.
        cardinalityMeaning: At most one property; an equipment lease has none.
        workflowRole: Ties the right of use to the premises.
    - name: lessor
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party that grants the lease.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one lessor: the grantor is the other party to the agreement.'
        workflowRole: Identifies who is paid.
    - name: lessee
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: 'Exactly one lessee: the lease binds a single party to pay for and use the property or asset.'
        summary: The party that holds the right of use.
        usage: Set at creation.
        workflowRole: Identifies who pays and is bound by the lease.
    - name: contract
      target: Contract
      cardinality: 0..1
      ownership: reference
      help:
        summary: The contract the lease is based on.
        usage: Linked where a formal agreement exists.
        cardinalityMeaning: At most one contract.
        workflowRole: Brings the contract's terms into force.
  invariants:
    - id: LEASE-001
      rule: endDate must not precede startDate.
    - {id: LEASE-EXE-001, rule: "Periodic Amount cannot be negative.", violatedWhen: "periodic_amount != null and periodic_amount < 0", message: "Periodic Amount cannot be negative."}
    - {id: LEASE-EXE-002, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Lease Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a lease is ended"
      description: "When a lease is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "LEASE-FOLLOW-UP-{{id}}"
              name: "Follow up on lease {{lease_number}}"
              description: "Lease {{lease_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A contractual arrangement that gives one party the right to use a property or asset for a defined period in return for payment.
    businessMeaning: Leasing separates use from ownership. The lease record fixes who may use what, for how long and at what price, which drives rent collection, accounting for the right of use and the obligations at the end.
    usage: Created when a lease is agreed; activated at commencement; read by property managers, finance and legal as payments fall due and the end date approaches.
    relationshipContext: A lease is between a lessor and a lessee (both Parties), usually concerns a Property, and may rest on a Contract.
    lifecycle: A lease is drafted, becomes active at commencement, may be suspended, and ends expired, terminated early or cancelled if never started.
    example: A five-year commercial lease of a warehouse unit, at 4,800 per month, starting 1 April.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-LEASE
