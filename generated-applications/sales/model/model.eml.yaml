      - name: person_id
        type: string
        fk: true
        help: Person represented by contact. Preserves canonical human identity. CRM communication and relationship management. Exactly one Person. Contact context must not duplicate Person master.
  - name: CustomerReturn
    help: Coordinates the controlled reversal of a customer fulfillment while preserving original commercial, inventory and financial history. A return is a new business event caused by a prior sale; it is not deletion or mutation of the original sale. A CreditNote is the separate financial consequence. Customer service, reverse logistics, warehouse receiving, quality, inventory, credit processing, accounts receivable and audit. SalesOrder/SalesOrderLine identify original demand, Shipment identifies prior logistics, Invoice identifies financial claims, CustomerReturnLine identifies returned quantities, disposition determines inventory consequences, and CreditNote records approved financial adjustment. Return request → authorization → return shipment → receipt → inspection → disposition → inventory movement if applicable → credit eligibility → CreditNote approval/posting if applicable → completion. Original sale and invoice remain unchanged. Draft → authorized → in transit → received → inspection → dispositioned → completed, with cancellation and exception paths. Authorization validates prior fulfillment; receipt creates no unrestricted inventory by itself; disposition drives inventory; approved financial adjustment creates CreditNote and accounting/application effects without mutating original documents. A customer returns 5 of 20 shipped units. Three are restocked, one quarantined and one scrapped. Inventory receives only the three restock units; an approved CreditNote handles the financial adjustment for the eligible credited amount.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the customer return. Identifies the reverse-fulfillment event independently of its number, lines, shipment, invoice or credit note. Used for reverse logistics, inventory, financial adjustment, audit and integration. Stable root identity for CustomerReturnLine and downstream CreditNote evidence. Carries the return identity through authorization, receipt, disposition and financial settlement. Required for return traceability.
      - name: return_number
        type: string(100)
        unique: true
        help: Business-facing customer return reference. Identifies the return for customer service, warehouse and finance operations. Used in return authorization, transport, receiving, inspection, credit and audit. Distinct from customerReturnId, Shipment and CreditNote numbers. Provides operational reference throughout the return lifecycle. Required for operational traceability.
      - name: status
        type: string
        enum: CustomerReturnStatus
        help: Lifecycle state of the authorized customer return. Controls progression through transport, receipt, inspection, disposition, inventory and financial adjustment. Controls return processing and completion decisions. Return status does not itself change inventory or invoice balances. Coordinates dependent return workflows; CreditNote posting is a separate financial state.
        default: DRAFT
      - name: return_date
        type: datetime
        help: Date and time the return event was initiated or recognized. Anchors return chronology independently from receipt and credit-note dates. Used for service metrics, logistics, audit and policy evaluation. Distinct from shipment, receipt, disposition and CreditNote dates. Provides temporal context for return authorization and processing. Required for return chronology.
      - name: reason_code
        type: string(100)
        optional: true
        help: Business reason supplied for the customer return. Explains why goods or services are being returned. Used for approval, quality, analytics, warranty and customer service. May differ from the financial CreditNote.reasonCode. Supports eligibility and policy determination. Optional when the reason is represented through another controlled return classification.
      - name: notes
        type: string(2000)
        optional: true
        help: Additional operational context for the return. Captures information not represented by structured return fields. Supports warehouse, customer service and audit review. Notes supplement but do not replace structured evidence. Provides contextual information during exception handling. Optional free-form context.
      - name: customer_id
        type: string
        fk: true
        help: Customer requesting or receiving the return process. Identifies the party associated with the reverse transaction. Supports authorization, logistics, credit and customer service. Supplies party eligibility and financial context.
      - name: sales_order_id
        type: string
        fk: true
        optional: true
        help: Original sales commitment associated with the returned goods or services. Connects reverse fulfillment to the original customer demand. Supports eligibility and fulfillment reconciliation. Provides original commitment context for return validation.
  - name: CustomerReturnLine
    help: "Quantity-level return evidence connecting returned goods to original fulfillment, disposition, inventory and financial adjustment. CustomerReturnLine explains exactly what quantity came back and what happened to it. It does not itself move inventory or issue a credit. Reverse logistics, quality, inventory, customer service, credit processing and audit. SalesOrderLine identifies the original commitment; InvoiceLine identifies the financial claim; InventoryMovement records physical consequences; CreditNoteLine records the financial consequence. Return authorization → returned quantity → receipt → inspection → disposition → restock/quarantine/repair/scrap → credit eligibility → CreditNoteLine → CreditNote posting. Each consequence is posted through its authoritative workflow. Pending → inspected → dispositioned → posted/completed, with controlled correction if necessary. Changes to source fulfillment, invoice, product, UOM or policy revalidate open return lines. Posted physical or financial effects are corrected through compensating events. Five units returned: three restocked, one quarantined and one scrapped. Only three generate unrestricted positive inventory movement. An approved USD 590 credit becomes a CreditNoteLine and is posted through CreditNote without changing the original InvoiceLine."
    parent: CustomerReturn
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the customer return line. Identifies one returned-item detail independently of the parent return, source order line, inventory movement or credit note. Used for quantity reconciliation, inventory posting, credit calculation and audit. Stable bridge identity across reverse-fulfillment and financial workflows. Carries source quantity through receipt, disposition and downstream credit processing. Required for traceability.
      - name: line_number
        type: integer
        help: Sequence number of the line within the CustomerReturn. Identifies the line for operational documents and reconciliation. Used in return documents, receiving and audit. Unique within the parent return and independent of SalesOrderLine or InvoiceLine numbering. Supports deterministic return reconstruction. Required for line identification.
        min: 1
      - name: quantity_returned
        type: decimal
        help: Quantity physically or contractually returned for this line. Establishes the quantity subject to inspection and disposition. Used for return validation, inventory and financial eligibility. Must be supported by prior fulfillment evidence and cannot automatically become inventory or credit. Feeds disposition quantities and potential credit calculation. Required because a return line must represent a quantity or equivalent source value.
      - name: quantity_restocked
        type: decimal
        help: Quantity accepted for unrestricted restocking. Represents returned goods approved to re-enter unrestricted inventory. Drives positive InventoryMovement posting. Must be a component of quantityReturned and is the only disposition component eligible for unrestricted stock. Creates the inventory consequence after disposition approval. Required as zero when none is restocked.
        default: "0"
      - name: quantity_quarantined
        type: decimal
        help: Quantity placed into restricted or quarantine inventory. Represents returned goods requiring further inspection or controlled handling. Supports quality and restricted inventory workflows. Does not increase unrestricted available inventory. Drives restricted disposition workflow. Required as zero when none is quarantined.
        default: "0"
      - name: quantity_to_repair
        type: decimal
        help: Quantity routed to repair or refurbishment. Represents goods that require a repair process before any future stock disposition. Supports maintenance/repair work orders and inventory control. Does not directly create unrestricted stock. Drives repair workflow and later disposition. Required as zero when none is routed to repair.
        default: "0"
      - name: quantity_scrapped
        type: decimal
        help: Quantity approved for scrap or disposal. Represents returned goods that will not return to saleable inventory. Supports disposal, environmental controls and inventory adjustment. Does not increase unrestricted available inventory. Drives authorized disposal and inventory adjustment. Required as zero when none is scrapped.
        default: "0"
      - name: disposition
        type: string
        enum: CustomerReturnLineDisposition
        help: Physical disposition assigned after inspection of returned goods. Determines what operational path the returned quantity follows. Drives inventory, quality, repair and disposal processing. Distinct from return reason and financial credit reason. Determines authoritative InventoryMovement or downstream workflow. Required to prevent ambiguous physical treatment.
      - name: approved_credit_amount
        type: Money
        optional: true
        help: Maximum financial credit approved for this return line under applicable policy. Provides the financial eligibility basis consumed by CreditNoteLine; it is not itself a posted credit. Supports customer credit calculation, approval and audit. Must reconcile with original InvoiceLine pricing/tax evidence and must not mutate the invoice. Limits return-based CreditNoteLine credit unless a separate authorized adjustment applies. Optional when the return has no financial credit consequence.
      - name: customer_return_id
        type: string
        fk: true
        help: Parent return containing this returned quantity detail. Establishes the authorization and lifecycle context. Supports return processing and completion. Parent lifecycle coordinates this line's processing.
      - name: sales_order_line_id
        type: string
        fk: true
        help: Original sales commitment line against which the return is validated. Identifies the demand and fulfillment quantity being reversed. Supports eligibility and fulfillment reconciliation. Supplies original ordered and fulfilled context.
  - name: Brand
    help: Governed product brand reference master. Brand describes commercial/manufacturer identity; it is distinct from ProductCategory taxonomy and Product identity. PIM, catalog, sourcing, sales, e-commerce, service and analytics. Products and variants reference Brand; category remains independent classification. Active → inactive → active or retired. Lifecycle/name changes update future catalog/master usage while preserving historical references.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable brand identity. Identifies the brand independently of display-name changes. PIM, catalog, commerce and reporting. Referenced by Products/Variants. Required.
      - name: code
        type: string(100)
        unique: true
        help: Governed brand code. Stable business/integration identifier. Catalog and integration. Unique in brand master. Required.
      - name: name
        type: string(300)
        help: Brand display name. Customer/supplier-facing market identity. Catalog, documents, search and reporting. Presentation can change without changing brand identity. Required.
      - name: status
        type: string
        enum: BrandStatus
        help: Brand lifecycle state. Controls future assignment/use. Master-data governance. Historical product/transaction references remain valid. Eligible for new assignment. Temporarily unavailable for new assignment. Permanently unavailable for new assignment. Required.
        default: ACTIVE
