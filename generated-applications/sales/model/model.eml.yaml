      - name: party_id
        type: string
        fk: true
        help: Party represented by prospect. Supplies canonical person/organization identity. CRM qualification and deduplication. Exactly one Party. Qualification may create Lead without duplicating Party.
  - name: Contact
    help: A governed business contact representing a Person in a customer, prospect, supplier, partner, or account relationship context. Provide canonical implementation-neutral semantics for Contact across enterprise applications. A governed business contact representing a Person in a customer, prospect, supplier, partner, or account relationship context. Used in CRM, sales, fulfillment, logistics, reporting, integration, or audit processes where this concept applies. Connects to canonical parties, commercial transactions, logistics execution, and downstream evidence without replacing their authoritative records. Created and progressed through governed business workflow; completed history is retained and corrections are explicit. Commercial management, fulfillment, logistics execution, reconciliation, reporting, and audit. Enterprise sales and supply-chain operations.
