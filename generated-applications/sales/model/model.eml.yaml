  - name: SalesOrder
    help: Represents the commercial customer commitment from which fulfillment and financial processes derive work. SalesOrder establishes accepted demand; it does not itself move inventory, prove shipment, or prove payment. Order management, allocation, inventory, warehouse execution, transportation, invoicing, customer service and revenue processes. Customer supplies commercial context, SalesOrderLine supplies demand detail, InventoryReservation supplies committed stock, InventoryMovement supplies stock execution, Shipment supplies transport evidence, and Invoice supplies financial claim evidence. Confirmed order → validation → availability check → reservation/allocation → pick/issue → Shipment → delivery/acceptance evidence → SalesOrderLine fulfillment → order status. Invoice is generated according to billing policy and remains independent evidence. Cancellation releases remaining reservations and stops new work while preserving historical downstream effects. Draft → confirmed → allocated → partially fulfilled → fulfilled, with cancellation of remaining demand and controlled exception/recovery paths. Entity changes must propagate through affected dependent workflows rather than directly mutating derived states. Line fulfillment changes recalculate order status; reservation changes affect allocation state; shipment events contribute fulfillment evidence; billing changes do not independently determine fulfillment. Allocation, fulfillment, cancellation and status transitions require concurrency control and idempotency to prevent double reservation, double fulfillment or contradictory terminal states. An order for 20 units reserves 20, ships 12, and becomes PARTIALLY_FULFILLED from accepted fulfillment evidence. The remaining 8 stay executable. A cancellation then releases the remaining reservation and terminates the open demand without reversing the already accepted 12-unit fulfillment.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: order_number
        type: string(100)
        unique: true
      - name: order_date
        type: datetime
      - name: status
        type: string
        enum: SalesOrderStatus
        help: Order-level lifecycle state controlling commercial and fulfillment permissions. Drives confirmation, allocation, fulfillment, shipment readiness and cancellation. Summarizes downstream evidence; it is not an independent source of fulfillment quantity. Status transitions are validated against line, reservation, shipment and fulfillment evidence.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
      - name: requested_delivery_date
        type: date
        optional: true
      - name: total_amount
        type: decimal
        optional: true
      - name: customer_id
        type: string
        fk: true
        help: The Customer this SalesOrder refers to.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The Organization this SalesOrder refers to.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: The Location this SalesOrder refers to.
      - name: payment_term_id
        type: string
        fk: true
        optional: true
        help: The PaymentTerm this SalesOrder belongs to.
  - name: SalesOrderLine
    help: Authoritative commercial commitment at product/quantity level, reconciling transaction pricing with allocation, fulfillment and billing evidence. The line states what the customer agreed to buy and how it is priced. Reservations state committed stock, shipment/fulfillment events state what was delivered, and InvoiceLines state what was billed. Order management, allocation, warehouse fulfillment, shipment, invoicing, credit, margin, customer service and audit. SalesOrder supplies customer/currency context; Product/UOM define item and quantity semantics; InventoryReservation supplies allocation evidence; Shipment supplies transport/fulfillment evidence; InvoiceLine supplies financial claim evidence. Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation. Draft → confirmed → allocated → partially fulfilled → fulfilled/cancelled. Historical pricing and fulfillment evidence remain reproducible. quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only. Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing. A line requests 20 units. Twenty are reserved, 12 are shipped and accepted, leaving 8 executable. quantityAllocated and quantityFulfilled are updated from their respective workflows. Cancelling the remaining 8 releases the reservation and cancels open work without reversing the accepted 12.
    parent: SalesOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: quantity_fulfilled
        type: decimal
        default: "0"
      - name: quantity_allocated
        type: decimal
        default: "0"
      - name: unit_price
        type: Money
        help: Agreed transaction-time price per unit including currency. Order valuation, invoicing, margin, credit and reconciliation. Must align with SalesOrder currency and UnitOfMeasure pricing basis. Authoritative commercial price for downstream billing unless controlled repricing occurs.
      - name: discount_amount
        type: Money
        optional: true
        help: Approved transaction-time discount amount. Reconciles net commercial value and invoice calculations. Currency must match order pricing currency. Preserves the concession actually granted rather than relying on current DiscountRule.
      - name: tax_amount
        type: Money
        optional: true
        help: Tax determined for the order line when tax is calculated at order stage. Supports order and invoice reconciliation. Determination may depend on Product, Customer, address, location, date and TaxRule. Preserves tax evidence when the order commits to a tax amount.
      - name: line_amount
        type: Money
        help: Calculated commercial value of the line. Supports order totals, invoicing, credit and reporting. Must reconcile with pricing, discount, tax and rounding policy. Financial baseline for downstream billing and reconciliation.
      - name: price_source
        type: string
        optional: true
        enum: SalesOrderLinePriceSource
      - name: price_determined_at
        type: datetime
        optional: true
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The UnitOfMeasure this SalesOrderLine refers to.
      - name: sales_order_id
        type: string
        fk: true
        help: The SalesOrder this SalesOrderLine refers to.
      - name: product_id
        type: string
        fk: true
        help: The Product this SalesOrderLine refers to.
  - name: PurchaseOrder
    help: Represents the formal commercial procurement commitment between a buying organization and a Supplier. PurchaseOrder establishes what the Supplier is expected to provide; it is not proof that goods arrived or that later returns occurred. Purchasing, supplier management, receiving, warehouse operations, accounts payable, budgeting, inventory planning and analytics. PurchaseRequisition represents internal demand. PurchaseOrder converts approved demand into an external commitment. PurchaseOrderLine specifies the commitment. GoodsReceipt records actual receipt and acceptance. InventoryMovement records stock effects. SupplierReturn reverses eligible fulfillment. Invoice records the supplier claim. SupplierCreditNote records authorized financial reduction. Payment settles claims. Draft, approval, issuance, receipt, return, cancellation and closure are distinct stages. Financial settlement can continue after physical fulfillment or return. PurchaseOrder → GoodsReceipt → acceptance → InventoryMovement; when goods must be returned, eligible receipt → SupplierReturn → InventoryMovement reversal → SupplierCreditNote → payable reconciliation. A depot orders 100 parts, receives 96 and accepts 94. Later, three accepted parts are returned as defective. The original order and receipt remain unchanged; SupplierReturn and its inventory/credit workflows record the reversal.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the purchase order. Used for procurement, receiving, invoice matching, supplier returns, audit and integrations. Identifies the order independently of orderNumber, Supplier, lines, GoodsReceipt and SupplierReturn. Stable root reference across commitment, fulfillment, reversal and closure. Required for procurement traceability.
      - name: order_number
        type: string(100)
        unique: true
        help: Human-facing procurement reference. Used by buyers, suppliers, receiving, accounts payable and integrations. Business reference distinct from technical purchaseOrderId. Correlates procurement activity across systems. Required for operational traceability.
      - name: order_date
        type: datetime
        help: Date and time the procurement commitment is created or issued. Supports chronology, approval, reporting and reconciliation. Distinct from requested delivery, receipt, return, invoice and payment dates. Anchors the commitment lifecycle. Required for chronology.
      - name: status
        type: string
        enum: PurchaseOrderStatus
        help: Lifecycle state of the procurement commitment. Controls authorization, issuance, fulfillment, cancellation and closure. PurchaseOrder status does not prove physical receipt, supplier return or invoice settlement; those are separate facts. Being prepared. Internally authorized. Communicated to Supplier. Some committed quantity accepted while outstanding fulfillment remains. Required fulfillment accepted under policy. Remaining commitment terminated. Required operational and financial processing complete.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Currency qualifying order monetary values. Used for pricing, totals, invoice matching, supplier credit calculation and financial reporting. Qualifies amounts and does not identify Supplier or Product.
      - name: requested_delivery_date
        type: date
        optional: true
        help: Buyer's requested delivery or completion date. Used for supplier communication and fulfillment planning. A request, not proof of actual receipt or return. Supports delivery planning.
      - name: total_amount
        type: decimal
        optional: true
        help: Order-level value derived from committed lines and commercial adjustments. Used for approval, budget, supplier commitment and invoice reconciliation. Must reconcile with PurchaseOrderLine values and currencyId.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier receiving the procurement commitment. Drives sourcing, delivery, receiving, supplier performance, returns and accounts payable. GoodsReceipt and SupplierReturn supplier should normally match this supplier.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Buying organization responsible for the commitment. Supports authorization, legal entity, budget, tax and reporting.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Intended operational destination for ordered goods or services. Used for receiving and logistics planning.
      - name: payment_term_id
        type: string
        fk: true
        optional: true
        help: The PaymentTerm this PurchaseOrder belongs to.
  - name: PurchaseOrderLine
    help: Represents one measurable procurement commitment and its accumulated fulfillment, billing and reverse-fulfillment state. PurchaseOrderLine states what the buyer committed to purchase. GoodsReceiptLine records receipt. SupplierReturnLine records subsequent reversal. InvoiceLine records supplier claim. Purchasing, supplier communication, receiving, inventory, supplier returns, accounts payable, budgeting and three-way matching. PurchaseOrder supplies supplier and commercial context; GoodsReceiptLine supplies accepted fulfillment; SupplierReturnLine supplies reverse quantity; SupplierCreditNoteLine supplies financial adjustment. Pricing → commitment → receipt → acceptance → InventoryMovement; if goods are returned, eligible accepted quantity → SupplierReturnLine → InventoryMovement reversal → SupplierCreditNoteLine. Historical commitment remains unchanged. Created → approved/issued → partially/fully received → optionally partially/fully returned → billed/closed according to policy. Historical commercial evidence remains reproducible. A line commits to 100 units, 94 are accepted, and three are later returned. receivedQuantity remains the receipt projection, acceptedQuantity remains accepted fulfillment evidence, returnedQuantity becomes three from posted return events, and the original quantity/price remain unchanged.
    parent: PurchaseOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: unit_price
        type: Money
      - name: line_amount
        type: Money
      - name: received_quantity
        type: decimal
        default: "0"
      - name: accepted_quantity
        type: decimal
        default: "0"
      - name: returned_quantity
        type: decimal
        default: "0"
      - name: outstanding_quantity
        type: decimal
        default: "0"
      - name: price_source
        type: string
        optional: true
        enum: PurchaseOrderLinePriceSource
        help: Source used to determine procurement price. Supports audit, spend analysis and supplier negotiations. Does not replace transaction-time unitPrice. Explains price determination.
      - name: price_determined_at
        type: datetime
        optional: true
        help: Time at which effective purchase price was determined. Supports effective-dated pricing and audit. Distinct from PurchaseOrder creation time. Anchors commercial pricing evidence.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit used to quantify the commitment. Defines how quantity is interpreted. Must reconcile with receiving and return conversions.
      - name: purchase_order_id
        type: string
        fk: true
        help: Parent procurement commitment. Supplies supplier, organization, currency and lifecycle context. Controls commitment and closure.
      - name: product_id
        type: string
        fk: true
        help: Product or item being procured. Identifies what was committed. Must reconcile across receipt, return and invoice evidence.
  - name: Product
    help: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules. Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts. Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics. Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration. If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(300)
      - name: description
        type: string(4000)
        optional: true
      - name: product_type
        type: string
        enum: ProductProductType
      - name: status
        type: string
        enum: ProductStatus
        default: ACTIVE
      - name: sku
        type: string(100)
        optional: true
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
      - name: standard_price
        type: money
        optional: true
      - name: tax_category
        type: string(100)
        optional: true
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
      - name: category_id
        type: string
        fk: true
        references: ProductCategory
        optional: true
        help: The ProductCategory this Product refers to.
      - name: brand_id
        type: string
        fk: true
        optional: true
        help: Commercial/manufacturer brand of Product. Supplies market identity independently of category. PIM, catalog, sales, sourcing and reporting. Optional for unbranded products. Brand lifecycle affects future catalog/master eligibility without rewriting historical transactions.
  - name: Supplier
    help: Represents the procurement-facing role of a Party that supplies business inputs and participates in reverse procurement, supplier claims, financial recovery and performance governance. Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific qualification, terms and transaction history. SupplierClaim captures the case; SupplierClaimResolution captures the remedy; downstream transactions execute it; SupplierPerformanceAssessment interprets accumulated evidence for governance. Central to source-to-pay, sourcing, procurement, receiving, supplier returns, quality claims, accounts payable, supplier qualification, recovery and performance management. Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, SupplierReturn, SupplierCreditNote, SupplierDebitNote, SupplierClaim, SupplierClaimResolution, SupplierPerformanceAssessment, Product and PaymentTerm. Supplier qualification/status → PurchaseOrder → GoodsReceipt → Invoice matching → Payment; issue detection → SupplierClaim → SupplierClaimResolution → SupplierReturn and/or SupplierCreditNote/SupplierDebitNote/Payment → reconciliation; periodic evidence aggregation → SupplierPerformanceAssessment → governance/improvement decision. Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence. A supplier's quarterly assessment combines delivery receipts, inspection failures, claims and returns into an approved scorecard. The result informs qualification and improvement decisions while the underlying transactions remain unchanged.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable Supplier role identity. Connects procurement purchase orders receipts invoices payments returns credits claims resolutions and supplier performance. Supplier identifies the role while PartyRole and Party identify the underlying party. Preserves supplier traceability across procure-to-pay reverse procurement claim recovery and performance management. Required for stable supplier history.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: PartyRole backing the Supplier specialization. Navigates to common party identity and role information. Supplier must not duplicate Party identity. Supplies shared party context to procurement and financial workflows. Required for role specialization.
      - name: supplier_code
        type: string(100)
        unique: true
        help: Enterprise supplier business reference. Used on purchase orders receipts invoices returns credits payments claims portals reports and integrations. Distinct from legal name and external registration identifiers. Identifies the supplier across procurement settlement recovery and performance. Required for operational recognition.
      - name: supplier_type
        type: string
        optional: true
        enum: SupplierSupplierType
        help: Classification of supplier relationship. Supports onboarding compliance tax contracting and reporting. Does not replace Party identity classification. Supplies supplier classification to procurement policy. Optional.
      - name: qualification_status
        type: string
        optional: true
        enum: SupplierQualificationStatus
        help: Procurement qualification state. Controls sourcing eligibility and supplier governance. Qualification is distinct from master lifecycle status and may consume SupplierPerformanceAssessment evidence. Gates new procurement commitments while historical transactions remain valid. Optional where supplier qualification is not used.
      - name: payment_terms
        type: string
        fk: true
        references: PaymentTerm
        optional: true
        help: Default supplier settlement policy. Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting. Transaction or contract terms may override the default. Supplies default payable timing. Optional.
      - name: status
        type: string
        enum: SupplierStatus
        help: Supplier relationship lifecycle state. Controls procurement eligibility. Historical transactions remain valid after state changes. New procurement return claim-resolution and performance workflows must evaluate status. Required for eligibility.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: Identifies the underlying person or organization performing this role. Provides common identity without duplicating Party data. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity. Required because a role cannot exist without a participant.
      - name: role_type
        type: string
        enum: SupplierRoleType
        help: Defines the business capacity in which the Party participates. Determines specialized capabilities, policies, workflows, and validations. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process. Required for contextual participation.
      - name: code
        type: string(100)
        optional: true
        help: Optional business-context identifier for this role instance. Supports operational search, integrations, reports, and legacy references. Identifies the role instance and must not replace Party or specialized role identifiers. Optional when partyRoleId is sufficient.
      - name: valid_from
        type: date
        optional: true
        help: Date from which this role is eligible for ordinary business processing. Used by eligibility and transaction validation. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role. Optional for immediately effective roles.
      - name: valid_to
        type: date
        optional: true
        help: Date after which the role is no longer normally eligible for new business processing. Used by eligibility, renewal, reporting, and expiry workflows. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution. Optional for open-ended roles.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
      - name: customer_role_id
        type: string
        fk: true
        references: Customer
        optional: true
        help: Optional role specialization corresponding to the roleType. Connects generic PartyRole identity to role-specific business controls such as customer credit or supplier qualification. At most one specialization is represented by this relationship in the current core model. Allows specialized workflows to extend the role without duplicating Party identity.
      - name: supplier_role_id
        type: string
        fk: true
        references: Supplier
        optional: true
        help: Links the generic PartyRole to the specialized Supplier role record when applicable. Provides direct navigation from role assignment to specialized supplier commercial data. Optional because not every PartyRole represents a supplier. Connects supplier-role eligibility to governed procurement and supplier-management workflows.
  - name: PaymentTerm
    help: Defines reusable commercial rules for when financial obligations become due and when early-settlement benefits or operational grace periods apply. PaymentTerm is a policy definition; an actual Invoice due date is a transaction-level result calculated from that policy and the applicable business event. Central to customer credit, supplier procurement, SalesOrder, PurchaseOrder, Invoice, receivables, payables, collections, cash forecasting, and payment scheduling. Customer and Supplier provide default role-level terms. SalesOrder and PurchaseOrder provide transaction context. Invoice derives an actual due date. Payment settles the obligation; PaymentTerm does not itself represent a Payment. Customer/Supplier default → SalesOrder/PurchaseOrder selection → Invoice creation → due-date calculation → receivable/payable aging → Payment scheduling → settlement. A term may be overridden by an authorized contract or transaction-level agreement, but the effective term used for an issued financial document must remain auditable. Payment terms can be created, activated, made inactive, and retired. Master-data changes affect future selection; issued transaction terms and calculated due dates remain historically stable unless formally amended. NET30 with INVOICE_DATE and dueDays 30 means an invoice issued on 10 August has a nominal due date of 9 September. If the term also specifies 2% within 10 days, the early-payment window is separately evaluated; the PaymentTerm does not itself create or allocate a payment.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the payment-term policy. Referenced by Customer, Supplier, SalesOrder, PurchaseOrder, Invoice, and applicable contracts. Identifies the policy definition, not a particular invoice due date or payment event. Provides reusable settlement timing rules that are copied or resolved into transaction-level due-date calculations. Required for traceable commercial terms.
      - name: code
        type: string(50)
        unique: true
        help: Business code for the payment-term policy, such as NET30 or DUE_ON_RECEIPT. Used in customer/supplier master data, order entry, procurement, invoices, reports, and integrations. Code identifies the reusable policy; it is not itself a due date. Provides a selectable default during commercial transaction creation. Required for operational identification.
      - name: name
        type: string(150)
        help: Human-readable name of the settlement-timing policy. Used in configuration, forms, documents, reporting, and user selection. Describes the policy represented by code and paymentTermId. Makes commercial settlement conditions understandable during order, procurement, and billing processes. Required for usable master data.
      - name: due_days
        type: integer
        help: Number of calendar days normally added to the applicable due-date base event to calculate contractual payment due date. Used by Invoice and receivables/payables processes to calculate expected settlement dates. Must be interpreted with dueDateBasis; it is not necessarily calculated from order date. Converts a transaction's defined due-date basis into a scheduled due date. Required for terms based on a day offset, including zero days.
        min: 0
      - name: due_date_basis
        type: string
        enum: PaymentTermDueDateBasis
        help: Defines the business event from which dueDays is calculated. Used by invoicing, accounts receivable, accounts payable, collections, and cash-flow forecasting. The basis event comes from the applicable transaction workflow and may differ between sales and procurement contexts. Determines how the Invoice due date or payable obligation date is derived. Due date is calculated from the invoice issue/accounting date according to policy. Due date is calculated from the applicable delivery event. Due date is calculated from accepted receipt evidence, typically in procurement. Due date is calculated according to month-end terms and the configured day-offset interpretation. A transaction or agreement-specific rule supplies the due-date basis and calculation. Required because dueDays has no complete business meaning without a basis.
        default: INVOICE_DATE
      - name: discount_days
        type: integer
        optional: true
        help: Number of days during which an early-payment discount may be available. Used by receivables, payables, payment scheduling, cash forecasting, and discount calculation. Applies only when an early-payment discount rate or amount is also defined. Establishes the time window for discounted settlement. Optional when no early-payment discount is offered.
        min: 0
      - name: discount_percent
        type: decimal
        optional: true
        help: Percentage reduction available when the applicable obligation is settled within the discount window. Used for payment planning, invoice presentation, cash forecasting, and settlement calculation. Must be interpreted together with discountDays and the applicable transaction amount. Allows Payment scheduling and Invoice terms to determine whether early settlement qualifies for discount. Optional when no percentage discount applies.
        min: 0
        max: 100
      - name: grace_days
        type: integer
        optional: true
        help: Additional days allowed after the nominal due date before a policy considers the obligation overdue for a defined process. Used by collections, credit control, late-payment reporting, and supplier payment management. Grace period does not necessarily change the contractual due date; it changes the operational escalation threshold. Separates contractual due date from collection or escalation timing. Optional when no grace period applies.
        min: 0
      - name: description
        type: string(1000)
        optional: true
        help: Human-readable explanation of the payment policy and its operational interpretation. Used in configuration, audit, transaction review, and user guidance. Supplements structured rules and must not be the sole source for due-date calculation. Optional where structured attributes fully describe the policy.
      - name: status
        type: string
        enum: PaymentTermStatus
        help: Controls whether the payment-term policy can be selected for new transactions. Used by customer/supplier maintenance, order capture, procurement, invoicing, and contracts. Retiring a term must not change historical transaction due dates that were calculated from it. New transactions normally select ACTIVE terms; historical transactions preserve their effective terms and derived dates. Available for normal new transaction use. Temporarily unavailable for new selection. No longer available for new selection while historical references remain valid. Required for master-data eligibility.
        default: ACTIVE
  - name: ProductCategory
    help: Represents one governed node in the Product classification hierarchy. ProductCategory provides taxonomy rather than operational state. It groups Products so people and systems can navigate, report, analyze, and govern the portfolio consistently. Product master-data management, catalogs, sales, procurement, inventory, reporting, analytics, search, tax, pricing, and eligibility rules where explicitly configured. Product references a category to establish classification. Parent and child categories form the taxonomy. Category hierarchy is distinct from Product composition, BillOfMaterial structure, or organizational hierarchy. Category create/update/retire → validate hierarchy → identify affected Products → identify dependent tax/pricing/sourcing/inventory/reporting rules → validate open workflows → activate change → preserve historical transaction classification. Code/name/description changes primarily affect presentation and integration; parent/status/semantic changes can affect Product eligibility and downstream rules and therefore require dependency analysis. Categories can be introduced, activated, made inactive, and retired. Lifecycle changes govern future classification without deleting historical product relationships or transaction evidence. If "Dry Containers" moves from "Shipping Containers" to another parent, the Product master classification can change for future reporting, but an already issued invoice or historical sales report that requires point-in-time classification must retain the classification effective when the transaction occurred.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(200)
      - name: description
        type: string(2000)
        optional: true
      - name: status
        type: string
        enum: ProductCategoryStatus
        help: Lifecycle state controlling whether the category can be used for new classification. Status changes trigger validation of dependent Products and any rules that consume category classification.
        default: ACTIVE
      - name: parent_category_id
        type: string
        fk: true
        references: ProductCategory
        optional: true
        help: The ProductCategory this ProductCategory refers to.
  - name: QuotationLine
    help: Preserves the commercial terms offered to a customer and the evidence needed when those terms become an order. QuotationLine is a transaction-time commercial snapshot, not merely a pointer to current pricing master data. Quotation, negotiation, approval, sales conversion, margin analysis, audit, and customer communication. Product and UnitOfMeasure provide master context; the Quotation supplies customer and currency context; pricing sources explain determination but do not replace the stored effective price. Product/customer/pricing inputs → price determination → QuotationLine snapshot → quotation approval → optional conversion to SalesOrderLine. Master-data changes affect future quotations unless an explicit repricing workflow is invoked. Draft → priced → approved/issued → accepted/rejected/expired. Once accepted, commercial evidence is preserved. A customer quotation is priced at USD 125 per unit using a customer agreement. The agreement later changes to USD 130. An accepted quotation remains at USD 125 unless the customer explicitly accepts a controlled repricing/revision.
    parent: Quotation
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: unit_price
        type: Money
        help: Transaction-time quoted price per unit, including its currency. Used for quotation valuation and, when accepted, as source evidence for downstream SalesOrder pricing. Must be interpreted with the quotation currency and UnitOfMeasure. Price determination may source a current price rule, but the accepted quotation retains this effective price. Required for a financially valued quotation line.
      - name: amount
        type: Money
        help: Calculated gross commercial value of the quotation line before any separately represented adjustments. Supports quotation totals and conversion validation. Currency must match unitPrice and the quotation currency under the quotation's pricing policy. Provides a reproducible quoted amount. Required for a financially valued quotation line.
      - name: discount_amount
        type: Money
        optional: true
        help: Transaction-time discount amount granted on the quoted line. Preserves the commercial concession used to derive the net amount. Must use the quotation currency. Prevents later DiscountRule changes from rewriting an accepted quotation. Optional when no discount applies.
      - name: price_source
        type: string
        optional: true
        enum: QuotationLinePriceSource
        help: Records the business source used to determine the quoted price. Supports audit, margin analysis, pricing explanation, and downstream conversion. Source metadata does not replace the transaction-time unitPrice. Explains why the quoted price was selected. Optional when the quotation does not require source attribution.
      - name: price_determined_at
        type: datetime
        optional: true
        help: Timestamp at which the quoted price was determined. Supports effective-dated pricing audit and reproducibility. Distinct from quotation creation time when pricing is recalculated or manually overridden. Provides temporal evidence for price determination. Optional only where the quotation process does not capture determination timing.
      - name: description
        type: string(1000)
        optional: true
      - name: quotation_id
        type: string
        fk: true
        help: The Quotation this QuotationLine refers to.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: The Product this QuotationLine refers to.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The UnitOfMeasure this QuotationLine refers to.
  - name: DiscountRule
    help: Defines reusable discount policy while leaving the actual applied discount as transaction evidence. A DiscountRule is a pricing policy; it is not the discount amount recorded on an order or invoice. Supports customer pricing, promotions, contracts, sales orders, purchase agreements, and invoicing. Product and pricing context determine the eligible base. DiscountRule determines the reduction. Tax rules then operate on the applicable taxable base according to jurisdiction and policy. Product/price → eligible discount rule → calculate discount → gross amount minus discount → taxable base → tax → net amount → invoice total. The applied transaction result must be retained independently of later rule changes. Rules are drafted, activated, deactivated, and retired. Lifecycle changes affect future calculations and do not rewrite historical transaction prices. A 10% discount rule applied to a USD 1,000 eligible base produces a USD 100 transaction discount and USD 900 post-discount base before subsequent tax calculation.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the discount policy. Referenced by pricing, order, invoice, promotion, and contract workflows. Identifies the rule rather than a discount amount applied to a specific transaction. Provides auditable policy context for a transaction-level discount.
      - name: code
        type: string(100)
        unique: true
        help: Business identifier for the discount rule. Used in configuration, pricing, order entry, promotions, contracts, and integrations. Identifies the reusable rule, not its eventual transaction result. Allows a qualifying transaction to resolve the intended discount policy.
      - name: name
        type: string(200)
        help: Human-readable name of the discount rule. Used by business users when configuring or reviewing pricing. Describes the policy represented by the rule. Makes discount selection understandable during price determination.
      - name: method
        type: string
        enum: DiscountRuleMethod
        help: Defines how the discount is calculated. Determines whether the rule reduces an amount by a percentage or fixed monetary value. FIXED_AMOUNT requires a currency context; PERCENTAGE is applied to an eligible monetary base. Supplies the calculation method used before tax determination and final transaction totals.
      - name: value
        type: decimal
        help: Numeric discount value interpreted according to method. Used to calculate a transaction discount. For PERCENTAGE this is a percentage; for FIXED_AMOUNT this is a monetary value whose currency must be explicitly defined. Produces the transaction-level discount amount from the eligible base.
      - name: currency
        type: string
        fk: true
        references: Currency
        optional: true
        help: Currency applicable when the discount method is FIXED_AMOUNT. Defines the denomination of a fixed discount. Not required for percentage discounts. Enables fixed discounts to be compared with the transaction's monetary base under valid currency rules.
      - name: priority
        type: integer
        optional: true
        help: Ordering value used when multiple discount rules qualify. Supports deterministic discount selection or stacking policy. Priority does not itself authorize stacking; the applicable pricing policy must define whether rules can combine. Helps resolve competing discount rules consistently.
        default: "100"
      - name: status
        type: string
        enum: DiscountRuleStatus
        help: Controls whether the rule can be selected for new price calculations. Used by pricing and transaction validation. Retiring a rule must not change discounts already recorded on historical transactions. Controls future applicability while preserving historical pricing evidence.
        default: ACTIVE
  - name: Pricing
    help: A governed pricing definition or decision context establishing base prices and applicability conditions before discounts, promotions, quotations, or orders. Provide canonical implementation-neutral semantics for Pricing across enterprise applications. A governed pricing definition or decision context establishing base prices and applicability conditions before discounts, promotions, quotations, or orders. Used in CRM, sales, fulfillment, logistics, reporting, integration, or audit processes where this concept applies. Connects to canonical parties, commercial transactions, logistics execution, and downstream evidence without replacing their authoritative records. Created and progressed through governed business workflow; completed history is retained and corrections are explicit. Commercial management, fulfillment, logistics execution, reconciliation, reporting, and audit. Enterprise sales and supply-chain operations.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Pricing. Identifies one governed Pricing record. Transactions, integration, reporting and audit. Referenced by compatible cross-domain workflows. Required.
      - name: code
        type: string(120)
        optional: true
        help: Business reference for Pricing. Human or integration-friendly reference where applicable. Search, exchange and reporting. Does not replace immutable identity. Optional when another transaction reference supplies business identity.
  - name: Promotion
    help: A governed time- and eligibility-bounded commercial offer that may alter price, benefit, bundle, or fulfillment terms without rewriting base pricing. Provide canonical implementation-neutral semantics for Promotion across enterprise applications. A governed time- and eligibility-bounded commercial offer that may alter price, benefit, bundle, or fulfillment terms without rewriting base pricing. Used in CRM, sales, fulfillment, logistics, reporting, integration, or audit processes where this concept applies. Connects to canonical parties, commercial transactions, logistics execution, and downstream evidence without replacing their authoritative records. Created and progressed through governed business workflow; completed history is retained and corrections are explicit. Commercial management, fulfillment, logistics execution, reconciliation, reporting, and audit. Enterprise sales and supply-chain operations.
