      - name: code
        type: string(120)
        optional: true
        help: Business reference for Promotion. Human or integration-friendly reference where applicable. Search, exchange and reporting. Does not replace immutable identity. Optional when another transaction reference supplies business identity.
  - name: Campaign
    help: A governed commercial marketing or outreach initiative targeting an audience over a defined period and measuring responses and outcomes. Provide canonical implementation-neutral semantics for Campaign across enterprise applications. A governed commercial marketing or outreach initiative targeting an audience over a defined period and measuring responses and outcomes. Used in CRM, sales, fulfillment, logistics, reporting, integration, or audit processes where this concept applies. Connects to canonical parties, commercial transactions, logistics execution, and downstream evidence without replacing their authoritative records. Created and progressed through governed business workflow; completed history is retained and corrections are explicit. Commercial management, fulfillment, logistics execution, reconciliation, reporting, and audit. Enterprise sales and supply-chain operations.
