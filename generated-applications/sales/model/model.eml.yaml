  - name: Prospect
    help: A potential customer or account that has been identified but is not yet qualified as a Lead or established as a Customer. Provide canonical implementation-neutral semantics for Prospect across enterprise applications. A potential customer or account that has been identified but is not yet qualified as a Lead or established as a Customer. Used in CRM, sales, fulfillment, logistics, reporting, integration, or audit processes where this concept applies. Connects to canonical parties, commercial transactions, logistics execution, and downstream evidence without replacing their authoritative records. Created and progressed through governed business workflow; completed history is retained and corrections are explicit. Commercial management, fulfillment, logistics execution, reconciliation, reporting, and audit. Enterprise sales and supply-chain operations.
