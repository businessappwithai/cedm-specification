entity:
  name: Location
  namespace: cedm.domain
  kind: core_master_entity
  description: A physical or logical place at which business resources, activities, inventory, services, or organizational operations are situated.
  ui:
    icon: map-pin
  identity: {key: locationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: locationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: "The location id of the location: an identifier the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its location id."
  - name: code
    type: string
    required: true
    maxLength: 100
    unique: true
    help:
      summary: "The code of the location: a value the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its code."
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: "The name of the location: a value the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its name."
  - name: locationType
    type: enum
    required: true
    values: [SITE, WAREHOUSE, STORE, OFFICE, FACTORY, YARD, PORT, DEPOT, VIRTUAL, OTHER]
    help:
      summary: "The location type of the location: a value the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its location type."
      valueSemantics:
        SITE: The location type of the location is site; set it when that is what the business means for this record.
        WAREHOUSE: The location type of the location is warehouse; set it when that is what the business means for this record.
        STORE: The location type of the location is store; set it when that is what the business means for this record.
        OFFICE: The location type of the location is office; set it when that is what the business means for this record.
        FACTORY: The location type of the location is factory; set it when that is what the business means for this record.
        YARD: The location type of the location is yard; set it when that is what the business means for this record.
        PORT: The location type of the location is port; set it when that is what the business means for this record.
        DEPOT: The location type of the location is depot; set it when that is what the business means for this record.
        VIRTUAL: The location type of the location is virtual; set it when that is what the business means for this record.
        OTHER: The location type of the location is other; set it when that is what the business means for this record.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
    help:
      summary: "The status of the location: a value the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its status."
      valueSemantics:
        PLANNED: The status of the location is planned; set it when that is what the business means for this record.
        ACTIVE: The status of the location is active; set it when that is what the business means for this record.
        INACTIVE: The status of the location is inactive; set it when that is what the business means for this record.
        CLOSED: The status of the location is closed; set it when that is what the business means for this record.
        RETIRED: The status of the location is retired; set it when that is what the business means for this record.
  - name: addressId
    type: reference
    target: Address
    required: false
    help:
      summary: "The address id of the location: a link to another record the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
  - name: parentLocationId
    type: reference
    target: Location
    required: false
    help:
      summary: "The parent location id of the location: a link to another record the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: "The created at of the location: a point in time the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its created at."
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: "The updated at of the location: a point in time the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its updated at."
  relationships:
  - name: parentLocation
    target: Location
    cardinality: 0..1
    ownership: reference
    inverse: childLocations
    help:
      summary: Links a location to location, the parent location it relates to.
      usage: Chosen from the existing location records when the location is created or edited.
      cardinalityMeaning: A location has at most one location in this role.
      context: Lets the location be found from, and reported with, its location.
  - name: childLocations
    target: Location
    cardinality: 0..*
    ownership: reference
    inverse: parentLocation
    help:
      summary: Links a location to location, the child locations it relates to.
      usage: Chosen from the existing location records when the location is created or edited.
      cardinalityMeaning: A location has any number of location in this role.
      context: Lets the location be found from, and reported with, its location.
  - name: address
    target: Address
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a location to address, the address it relates to.
      usage: Chosen from the existing address records when the location is created or edited.
      cardinalityMeaning: A location has at most one address in this role.
      context: Lets the location be found from, and reported with, its address.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a location to organization, the organization it relates to.
      usage: Chosen from the existing organization records when the location is created or edited.
      cardinalityMeaning: A location has at most one organization in this role.
      context: Lets the location be found from, and reported with, its organization.
  invariants:
  - id: LOCATION-001
    rule: A Location cannot be its own parent.
  - id: LOCATION-002
    rule: The Location hierarchy must not contain cycles.
  - id: LOCATION-003
    rule: A Location in CLOSED or RETIRED status must not be selected for new operational transactions that require an active physical location unless an explicit exception workflow permits it.
  - id: LOCATION-004
    rule: Changing or retiring a Location must trigger validation of dependent operational entities and workflows that reference it before future use is disabled.
  - id: LOCATION-005
    rule: Historical transactions must retain the Location context effective when the transaction occurred and must not be rewritten merely because the Location master changes.
  - id: LOCATION-006
    rule: Changing parentLocation must preserve hierarchy integrity and must not create a cycle.
  - id: LOCATION-007
    rule: If an operational Location references an Address, the referenced Address must be active and usable when the Location becomes effective unless an explicitly supported historical/legacy exception applies.
  help:
    summary: Core location master with hierarchical, geographic, organizational, and lifecycle context.
    businessMeaning: "Location identifies where business activity or resources occur. It is distinct from Address: Location is the business place; Address describes its geographic/contact representation."
    usage: Supports inventory, warehousing, yard/port operations, shipping, purchasing, sales, tax jurisdiction, service, logistics, and organizational processes.
    relationshipContext: Organization provides operating ownership/context. Address provides geographic representation. Parent/child locations provide operational hierarchy. Dependent entities must react when location status or hierarchy changes.
    workflowContext: Location create → validate hierarchy/address/organization → activate → use in operational transactions → status change/closure → validate dependent resources and prevent incompatible future use → preserve historical transaction context.
    lifecycle: Planned → active → inactive/closed → retired. Closure affects future operational selection; it does not delete historical movements, orders, receipts, shipments, or invoices.
    example: A warehouse is closed. New GoodsReceipts cannot target it, dependent inventory workflows must resolve or block future operations, but historical receipts and stock movements remain associated with the warehouse where they occurred.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-LOCATION}
