entity:
  name: SalesOrderLine
  namespace: cedm.domain
  kind: transaction_line
  description: An individual commercial commitment within a SalesOrder identifying the product or service, quantity, unit, effective price, discounts, tax and fulfillment state. Transaction-time pricing is preserved as evidence and downstream quantities are reconciled from authoritative reservation and fulfillment events.
  ui:
    icon: shopping-cart
  identity: {key: salesOrderLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: salesOrderLineId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the line, constant for its life.
        usage: Generated on creation; shipments and invoices refer to it.
        relationshipContext: Referenced when delivery and billing are matched.
    - name: lineNumber
      type: integer
      required: true
      minimum: 1
      help:
        summary: The position of the line on the order.
        usage: Assigned in sequence; used to refer to the line.
        relationshipContext: Read with the order number to name a line.
    - name: quantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The number of units of the product or service the customer ordered on this line.
        usage: Entered by sales; stock allocation, shipment and invoicing are all measured against it, and it drives the line amount.
        relationshipContext: Compared with allocated and fulfilled quantity.
    - name: quantityFulfilled
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help:
        summary: How many units of the ordered quantity have been shipped or delivered so far.
        usage: Increased by each shipment and never above the ordered quantity; the line is fulfilled when it equals the quantity.
        relationshipContext: Reaching the ordered quantity completes the line.
    - name: quantityAllocated
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help:
        summary: The quantity of stock reserved for the line.
        usage: Increased by reservations; read by the warehouse.
        relationshipContext: Compared with the quantity still to ship.
    - name: unitPrice
      type: Money
      required: true
      help: {summary: Agreed transaction-time price per unit including currency., usage: "Order valuation, invoicing, margin, credit and reconciliation.", relationshipContext: Must align with SalesOrder currency and UnitOfMeasure pricing basis., workflowRole: Authoritative commercial price for downstream billing unless controlled repricing occurs.}
    - name: discountAmount
      type: Money
      required: false
      help:
        summary: The money taken off this line by the discount agreed when the order was taken.
        usage: Set when the price is determined and approved under discount policy; subtracted in the line amount and shown on invoices.
        relationshipContext: Currency must match order pricing currency.
        workflowRole: Preserves the concession actually granted rather than relying on current DiscountRule.
    - name: taxAmount
      type: Money
      required: false
      help: {summary: Tax determined for the order line when tax is calculated at order stage., usage: Supports order and invoice reconciliation., relationshipContext: "Determination may depend on Product, Customer, address, location, date and TaxRule.", workflowRole: Preserves tax evidence when the order commits to a tax amount.}
    - name: lineAmount
      type: Money
      required: true
      help:
        summary: The net value of the line after quantity, price, discount and tax have been worked out.
        usage: Calculated by the system rather than typed; summed into order totals, invoiced, and used for credit checks and reporting.
        relationshipContext: "Must reconcile with pricing, discount, tax and rounding policy."
        workflowRole: Financial baseline for downstream billing and reconciliation.
    - name: priceSource
      type: enum
      required: false
      values:
        - PRICE_LIST
        - CONTRACT
        - CUSTOMER_AGREEMENT
        - QUOTATION
        - MANUAL
        - PROMOTION
        - OTHER
      help:
        summary: Where the price on the line came from.
        usage: Set when the price is determined.
        relationshipContext: Lets a disputed price be traced.
        valueSemantics:
          PRICE_LIST: Taken from the price list.
          CONTRACT: Taken from a contract with the customer.
          CUSTOMER_AGREEMENT: Taken from a standing customer agreement.
          QUOTATION: Taken from an accepted quotation.
          MANUAL: Entered by the salesperson.
          PROMOTION: Set by a promotion.
          OTHER: Determined some other way.
    - name: priceDeterminedAt
      type: datetime
      required: false
      help:
        summary: The date and time the unit price for this line was fixed.
        usage: Stamped when pricing runs and kept, so a later price list change does not alter what the customer was quoted.
        relationshipContext: Used to explain which price list was in force.
  relationships:
    - name: salesOrder
      target: SalesOrder
      cardinality: '1'
      ownership: reference
      help:
        summary: Links a sales order line to sales order, the sales order it relates to.
        usage: Chosen from the existing sales order records when the sales order line is created or edited.
        cardinalityMeaning: A sales order line has exactly one sales order in this role.
        context: Lets the sales order line be found from, and reported with, its sales order.
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product ordered.
        usage: Chosen when the line is entered.
        cardinalityMeaning: Exactly one product per line.
        context: Decides what stock is allocated and shipped.
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: 0..1
      ownership: reference
      help:
        summary: The unit the quantity is expressed in.
        usage: Defaults to the product's selling unit.
        cardinalityMeaning: At most one unit; empty uses the default.
        context: Makes the quantity unambiguous.
    - name: shipments
      target: Shipment
      cardinality: 0..*
      ownership: reference
      help:
        summary: The shipments carrying this line.
        usage: Read to follow delivery.
        cardinalityMeaning: Any number, since a line may ship in parts.
        context: Show how much has gone.
    - name: reservations
      target: InventoryReservation
      cardinality: 0..*
      ownership: reference
      help:
        summary: The stock reservations held for the line.
        usage: Read to see what is set aside.
        cardinalityMeaning: Any number of reservations.
        context: Show how the line is covered by stock.
    - name: invoiceLines
      target: InvoiceLine
      cardinality: 0..*
      ownership: reference
      help:
        summary: The invoice lines billing this line.
        usage: Read to follow billing.
        cardinalityMeaning: Any number, as billing may be in parts.
        context: Show how much has been billed.
  invariants:
    - {id: SALES-ORDER-LINE-001, rule: quantity must be greater than zero.}
    - {id: SALES-ORDER-LINE-002, rule: quantityAllocated must be between zero and quantity unless an authorized over-allocation policy applies.}
    - {id: SALES-ORDER-LINE-003, rule: quantityFulfilled must be between zero and quantity unless an authorized over-fulfillment policy applies.}
    - {id: SALES-ORDER-LINE-004, rule: lineNumber must be unique within its SalesOrder.}
    - {id: SALES-ORDER-LINE-005, rule: "lineAmount must reconcile with quantity, unitPrice, discounts, tax and configured rounding policy."}
    - {id: SALES-ORDER-LINE-006, rule: "unitPrice, discountAmount, taxAmount and lineAmount must use compatible currency semantics with SalesOrder."}
    - {id: SALES-ORDER-LINE-007, rule: "Changes to Product, PriceList, DiscountRule, TaxRule, Currency or UnitOfMeasure must not silently rewrite an executable line; affected open lines require controlled revalidation or repricing."}
    - {id: SALES-ORDER-LINE-008, rule: "If the line originated from a QuotationLine, accepted quotation pricing evidence must be retained unless authorized repricing occurs."}
    - {id: SALES-ORDER-LINE-009, rule: "Invoice generation must use effective transaction price and billing policy, not current Product or PriceList price."}
    - {id: SALES-ORDER-LINE-010, rule: quantityAllocated must be reconciled from active InventoryReservation evidence and must not be independently increased without the reservation workflow.}
    - {id: SALES-ORDER-LINE-011, rule: quantityFulfilled must be reconciled from accepted fulfillment/shipment evidence and must not be independently increased by changing Shipment status.}
    - {id: SALES-ORDER-LINE-012, rule: "A reservation consuming this line must reduce remaining reservation quantity and, when fulfillment posts, increase quantityFulfilled through one idempotent workflow."}
    - {id: SALES-ORDER-LINE-013, rule: "Shipment quantities attributed to this line must not exceed executable quantity minus already fulfilled quantity, except under an authorized over-fulfillment policy."}
    - {id: SALES-ORDER-LINE-014, rule: InvoiceLine quantities billed against this line must obey billing policy and must not silently exceed billable/fulfilled quantity where fulfillment-based billing is required.}
    - {id: SALES-ORDER-LINE-015, rule: "Cancelling or reducing the line with active reservations or open shipments requires controlled release, cancellation, reallocation or reconciliation of those dependencies before remaining quantity is changed."}
    - {id: SALES-ORDER-LINE-016, rule: "A fulfilled or financially posted line cannot be destructively reduced or deleted; corrections require explicit return, credit, debit or adjustment workflows."}
    - {id: SALES-ORDER-LINE-017, rule: "Every material quantity change must be attributable to an authoritative reservation, release, fulfillment, return, reversal or approved correction event."}
    - {id: SALES-ORDER-LINE-018, rule: Line-derived status and SalesOrder status must be recalculated atomically or through an idempotent recoverable workflow after dependent quantity events.}
    - {id: SALES-ORDER-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: SALES-ORDER-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
    - {id: SALES-ORDER-LINE-EXE-003, rule: "Discount Amount cannot be negative.", violatedWhen: "discount_amount != null and discount_amount < 0", message: "Discount Amount cannot be negative."}
    - {id: SALES-ORDER-LINE-EXE-004, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
    - {id: SALES-ORDER-LINE-EXE-005, rule: "Line Amount cannot be negative.", violatedWhen: "line_amount != null and line_amount < 0", message: "Line Amount cannot be negative."}
  help:
    summary: One product or service on a sales order, with its quantity, price, discount, tax and fulfilment progress.
    businessMeaning: 'The line is the precise commitment: what, how many, at what price from which source. It tracks how much has been reserved, shipped and billed, so each line can be followed to completion and the price the customer agreed is preserved.'
    usage: Created with the order; updated as stock is allocated and shipped; read by warehouse and billing.
    relationshipContext: A line belongs to one order and product, and is matched by shipments, reservations and invoice lines.
    lifecycle: A line follows its order. Its allocated and fulfilled quantities grow as stock is reserved and shipped.
    example: Line 2 of SO-10482 orders 40 units at 18.50; 25 are allocated and 15 shipped.
    workflowContext: Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation.
    propagation: quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only.
    concurrency: Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SALES-ORDER-LINE}
