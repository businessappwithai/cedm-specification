entity:
  name: City
  namespace: cedm.domain
  kind: reference_data
  description: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province."
  ui:
    icon: building-2
  referenceData: reference-data/city.yaml
  identity: {key: cityId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: cityId, type: uuid, required: true, immutable: true, help: {summary: The identity of the city record., usage: Generated when the city is loaded; addresses refer to the city through it.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 80, help: {summary: "The city's code: its country code and its name in capitals, such as FR-PARIS.", usage: "Quoted beside the name in lists; integration with other systems.", relationshipContext: "Unique; the country prefix keeps cities of one name in different countries apart."}}
    - {name: name, type: string, required: true, maxLength: 200, help: {summary: "The city's name in English, as it is written on addresses and in place lists.", usage: 'Loaded with the reference data; shown in lists, pickers and address lines, and narrowed by the country and state chosen.', relationshipContext: "Not unique: two countries can have a city of one name."}}
    - {name: population, type: integer, required: false, help: {summary: The population figure recorded in the GeoNames registry when the data was loaded., usage: 'Used to rank and size cities in lists and pickers; it is an approximate registry value, not a current census count.', relationshipContext: "Describes the city only."}}
    - {name: latitude, type: decimal, required: false, help: {summary: "The city's north-south position in decimal degrees, with north positive and south negative.", usage: Loaded with the reference data; paired with longitude to place the city on maps and measure distances., relationshipContext: "Describes the city only."}}
    - {name: longitude, type: decimal, required: false, help: {summary: "The city's east-west position in decimal degrees, with east positive and west negative.", usage: Loaded with the reference data; paired with latitude to place the city on maps and measure distances., relationshipContext: "Describes the city only."}}
    - {name: timezone, type: string, maxLength: 64, required: false, help: {summary: "The IANA time zone the city keeps, such as Europe/Paris.", usage: "Showing local times for the city.", relationshipContext: "Describes the city only."}}
    - {name: isCapital, type: boolean, required: false, help: {summary: Marks the city as the capital of its country in the reference data., usage: Loaded with the reference data; lists use it to highlight or sort capitals first when people choose a city., relationshipContext: "At most one capital per country in this list."}}
  relationships:
    - {name: country, target: Country, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Exactly one country; a city belongs to a single country., summary: "The country the city is in.", usage: "Chosen first; the cities offered are those of that country.", context: "A city is narrowed by its country, and by its state where it has one."}}
    - {name: stateProvince, target: StateProvince, cardinality: "0..1", ownership: reference, narrowedBy: [country], help: {summary: "The state or province the city is in, where the registry says which.", usage: "Chosen after the country; narrows the cities offered.", cardinalityMeaning: "A city has at most one state or province; outside the United States and Canada the list leaves it empty.", context: "The state of a city must be a division of the city's own country."}}
  invariants:
    - {id: CITY-001, rule: "A city belongs to one country, and its state or province, where stated, is a division of that country."}
  help:
    usage: Loaded from the GeoNames reference data rather than typed by users; chosen on addresses, locations and offices, and read to sort, filter and map records by place.
    summary: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province."
    businessMeaning: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province."
    whenUsed: "Chosen from the list wherever a record needs a place, code or currency; maintained by an administrator when a registry changes."
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-CITY}
