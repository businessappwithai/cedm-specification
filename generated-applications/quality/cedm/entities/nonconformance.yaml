entity:
  name: Nonconformance
  namespace: cedm.domain
  kind: quality_issue
  description: A recorded deviation from a requirement, specification, procedure, or expected result, including supplier defects discovered during receipt inspection or supplier-return processing and requiring containment, disposition, corrective action, claim, or other controlled response.
  ui:
    icon: table
  identity: {key: nonconformanceId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: nonconformanceId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the nonconformance.
        usage: Generated on recording; corrective actions and verifications refer to it.
        businessMeaning: "Identifies one quality deviation independently of its inspection, product, receipt, return or corrective action."
        workflowRole: Root identity for issue lifecycle.
    - name: number
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique reference by which the deviation is cited in reports and corrective actions.
        businessMeaning: Identifies the issue for quality and supplier operations.
        usage: "Audit, reporting, CAPA and dispute handling."
        workflowRole: Human-recognizable issue reference.
    - name: severity
      type: enum
      required: true
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        summary: How serious the deviation is.
        usage: Set by quality at review; drives containment and escalation.
        valueSemantics:
          LOW: Minor deviation with little effect.
          MEDIUM: Notable deviation needing correction.
          HIGH: Serious deviation affecting product or customers.
          CRITICAL: Dangerous or legally significant deviation needing immediate containment.
        businessMeaning: Indicates impact and urgency.
        workflowRole: Determines response urgency.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - UNDER_REVIEW
        - CONTAINED
        - CORRECTIVE_ACTION
        - CLOSED
        - REJECTED
      help:
        summary: Shows how far the quality deviation has progressed through review, containment, corrective action and closure.
        usage: Moved by quality staff as the investigation advances; closing requires corrective action, and rejection ends a report that was not valid.
        valueSemantics:
          OPEN: The deviation has been recorded and nobody has yet started to investigate it.
          UNDER_REVIEW: Quality staff are assessing the deviation to confirm what happened, how serious it is and who owns it.
          CONTAINED: Affected material has been isolated or held so that it cannot reach customers or production while the cause is addressed.
          CORRECTIVE_ACTION: Actions to remove the cause and prevent recurrence are being carried out and checked.
          CLOSED: The deviation was resolved and its corrective actions were verified as effective. A final state.
          REJECTED: Review found no real deviation, or a duplicate report, so no further action is taken. A final state.
        businessMeaning: Indicates investigation, containment, corrective action and closure.
        workflowRole: Controls allowed responses and closure.
    - name: description
      type: string
      required: true
      maxLength: 4000
      help:
        summary: A full account of what went wrong, naming the requirement or expected result that was not met.
        usage: Written by whoever raises the issue and refined during review; read in investigation, supplier communication and audit.
        businessMeaning: States what requirement or expected result was not met.
        workflowRole: Provides issue evidence.
    - name: detectedAt
      type: datetime
      required: true
      help:
        summary: The date and time when the deviation was first noticed, which may precede the time it was entered.
        usage: Entered when the issue is raised; containment and corrective action deadlines are measured from it in quality analytics.
        businessMeaning: Establishes chronology for containment and corrective action.
        workflowRole: Anchors issue occurrence.
    - name: closedAt
      type: datetime
      required: false
      help:
        summary: The date and time when the deviation was formally closed or rejected by quality.
        usage: Set when the status becomes closed or rejected; left empty while the issue is open, and used to measure time to resolve.
        businessMeaning: Establishes completion chronology.
        workflowRole: Required for closure.
  relationships:
    - name: inspection
      target: QualityInspection
      cardinality: 0..1
      ownership: reference
      help: {summary: Inspection that detected or evidenced the deviation., businessMeaning: Connects issue to objective quality evaluation., usage: Investigation and audit., workflowRole: Provides detection evidence.}
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help: {summary: Product affected by the deviation., businessMeaning: Identifies material or service subject to quality issue., usage: Trend analysis and supplier quality., workflowRole: Supplies product context.}
    - name: goodsReceipt
      target: GoodsReceipt
      cardinality: 0..1
      ownership: reference
      help: {summary: Inbound receipt associated with the quality issue., businessMeaning: Connects supplier defect to receiving evidence., usage: Receiving containment and supplier performance., workflowRole: Provides original fulfillment context.}
    - name: goodsReceiptLines
      target: GoodsReceiptLine
      cardinality: 0..*
      ownership: reference
      help: {summary: Receipt lines affected by the deviation., businessMeaning: Identifies exact received quantities under issue., usage: Containment and disposition., workflowRole: Provides quantity-level evidence.}
    - name: supplierReturn
      target: SupplierReturn
      cardinality: 0..1
      ownership: reference
      help: {summary: Supplier return associated with the deviation., businessMeaning: Connects a quality issue to reverse-procurement response., usage: "Return disputes, supplier claims, inspection and corrective action.", workflowRole: Explains why returned material was initiated or why a return remains exceptional.}
    - name: supplierReturnLines
      target: SupplierReturnLine
      cardinality: 0..*
      ownership: reference
      help: {summary: Returned quantities affected by the quality issue., businessMeaning: Identifies exact return lines associated with the deviation., usage: Return validation and supplier accountability., workflowRole: Provides line-level response context.}
    - name: returnDispositions
      target: ReturnDisposition
      cardinality: 0..*
      ownership: reference
      help: {summary: Controlled disposition decisions addressing affected returned material., businessMeaning: "Records operational outcomes such as quarantine, restock, repair, scrap or return-to-supplier without treating the decision itself as inventory movement.", usage: "Containment, inventory control, return processing and audit.", workflowRole: Supplies disposition evidence required for issue closure when applicable.}
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help: {summary: Party accountable for issue management., businessMeaning: Identifies responsible quality owner or organizational party., usage: "Escalation, CAPA and audit.", workflowRole: Owns investigation and closure.}
    - name: correctiveActions
      target: CorrectiveAction
      cardinality: 0..*
      ownership: reference
      help: {summary: Corrective actions addressing the deviation., businessMeaning: Defines actions intended to remove causes or prevent recurrence., usage: CAPA and supplier improvement., workflowRole: Supports transition toward closure.}
    - name: verifications
      target: CorrectiveActionVerification
      cardinality: 0..*
      ownership: reference
      help: {summary: Effectiveness verification evidence associated with actions addressing this issue., businessMeaning: Records whether corrective or preventive measures achieved the intended result., usage: "CAPA closure, audit and recurrence analysis.", workflowRole: Supports final issue closure when required by severity and quality policy.}
  invariants:
    - {id: NONCONFORMANCE-001, rule: closedAt must be present when status is CLOSED.}
    - {id: NONCONFORMANCE-002, rule: A supplier-quality nonconformance should reference the inspection or receipt/return evidence that establishes the deviation unless an authorized external complaint or observation is the source.}
    - {id: NONCONFORMANCE-003, rule: "A nonconformance associated with a SupplierReturn must not by itself change return quantity, inventory, payable exposure, or credit amount. Those effects require their respective controlled workflows."}
    - {id: NONCONFORMANCE-004, rule: Containment or disposition actions affecting inventory require attributable InventoryMovement evidence.}
    - {id: NONCONFORMANCE-005, rule: A return disposition affecting the issue must remain within the eligible return-line quantity and must not be treated as an inventory transaction itself.}
    - {id: NONCONFORMANCE-006, rule: "Closure requires required corrective-action, disposition and verification evidence according to severity and quality policy."}
    - {id: NONCONFORMANCE-007, rule: An ineffective or not-verifiable CorrectiveActionVerification must prevent silent closure and require additional action or an authorized exception.}
    - {id: NONCONFORMANCE-008, rule: "Historical issue evidence is immutable after closure except through explicit re-opening, reinspection, additional disposition or corrective records."}
    - {id: NONCONFORMANCE-EXE-001, rule: "A nonconformance that is closed states when (closed at).", violatedWhen: "status == \"CLOSED\" and closed_at == null", message: "Record closed at when the nonconformance is closed."}
  lifecycle:
    title: Nonconformance Lifecycle
    attribute: status
    states: [OPEN, UNDER_REVIEW, CONTAINED, CORRECTIVE_ACTION, CLOSED, REJECTED]
    initial: OPEN
    terminal: [CLOSED, REJECTED]
    transitions:
      - {from: OPEN, to: UNDER_REVIEW, action: review}
      - {from: UNDER_REVIEW, to: CORRECTIVE_ACTION, action: mark_corrective_action}
      - {from: CORRECTIVE_ACTION, to: CLOSED, action: close}
      - {from: UNDER_REVIEW, to: CONTAINED, action: mark_contained}
      - {from: CONTAINED, to: UNDER_REVIEW, action: resume}
      - {from: CORRECTIVE_ACTION, to: CONTAINED, action: mark_contained}
      - {from: CONTAINED, to: CORRECTIVE_ACTION, action: resume}
      - {from: OPEN, to: REJECTED, action: reject}
      - {from: UNDER_REVIEW, to: REJECTED, action: reject}
      - {from: CORRECTIVE_ACTION, to: REJECTED, action: reject}
      - {from: CONTAINED, to: REJECTED, action: reject}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a nonconformance is put forward"
      description: "When a nonconformance is under review, a task asks someone to decide on it."
      when: "status == \"UNDER_REVIEW\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "NONCONFORMANCE-APPROVAL-{{id}}"
              name: "Decide on nonconformance {{number}}"
              description: "Nonconformance {{number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a nonconformance is ended"
      description: "When a nonconformance is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "NONCONFORMANCE-FOLLOW-UP-{{id}}"
              name: "Follow up on nonconformance {{number}}"
              description: "Nonconformance {{number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a controlled quality deviation and its investigation, containment, disposition and corrective-action lifecycle.
    businessMeaning: Nonconformance captures the quality problem; QualityInspection provides test evidence; ReturnDisposition records controlled operational outcomes; SupplierReturn provides physical response; CorrectiveAction addresses recurrence; CorrectiveActionVerification proves effectiveness.
    usage: Supplier quality, incoming inspection, returns, CAPA, compliance, audit, supplier performance and risk management.
    relationshipContext: A quality issue may begin at receiving, inspection, customer/supplier return or external complaint. Operational, inventory and financial consequences remain separate business facts linked through traceable relationships.
    workflowContext: Inspection/receipt/return evidence → Nonconformance → containment → ReturnDisposition where applicable → SupplierReturn/InventoryMovement → CorrectiveAction → effectiveness verification → closure. Financial consequences remain separate through authorized credit/debit workflows.
    lifecycle: Open → under review → contained → corrective action → closed, with rejection where the issue is invalid.
    changePropagation: Changes to inspection, receipt, return, disposition, product, corrective action or verification evidence affecting an open issue trigger revalidation. Financial and inventory consequences are never inferred solely from Nonconformance status.
    example: Incoming inspection detects defective units. Nonconformance records the defect, affected receipt lines are contained, a return disposition sends the units to quarantine, a supplier return and inventory movement execute the physical response, CorrectiveAction addresses the root cause, and an effective verification supplies closure evidence.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-NONCONFORMANCE}
