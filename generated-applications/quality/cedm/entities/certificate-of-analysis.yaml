entity:
  name: CertificateOfAnalysis
  namespace: cedm.domain
  kind: quality_certificate
  description: A governed certificate summarizing quality results for a product, lot, batch, receipt, shipment, or other controlled material context without replacing underlying inspection and measurement evidence.
  ui:
    icon: table
  identity: {key: certificateOfAnalysisId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: certificateOfAnalysisId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of one certificate of analysis., usage: 'Generated on creation; shipments, receipts and customer exchanges refer to the certificate through it, whatever its printed number.', businessMeaning: Identifies one issued quality certificate independently of its document number., relationshipContext: Links certificate representation to source quality evidence.}}
    - {name: certificateNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: 'The unique number printed on the certificate, which customers and auditors quote when asking for it.', usage: 'Assigned by quality when the certificate is drafted; used for search, document exchange and audit, and never reused.', businessMeaning: Controlled number used to identify the issued certificate., relationshipContext: Distinct from inspection and shipment numbers.}}
    - {name: issuedAt, type: datetime, required: false, help: {summary: 'The date and time the certificate was released to its recipient, such as a customer or receiving site.', usage: Recorded when the status becomes issued and required by then; customers and auditors rely on it as the release date., businessMeaning: Establishes when the quality statement became externally or operationally effective., relationshipContext: Required once status is ISSUED.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
      help:
        summary: Where the certificate stands in controlled release, from drafting to issue and eventual replacement or withdrawal.
        usage: Moved by quality staff; only issued certificates are sent to customers, and corrections create a replacement rather than an edit.
        valueSemantics:
          DRAFT: Being prepared from the inspection results; not yet approved.
          APPROVED: Approved by quality but not yet released to the customer.
          ISSUED: Released to the recipient; it now stands as evidence.
          SUPERSEDED: Replaced by a corrected certificate; kept for history. A final state.
          VOID: Withdrawn because it was wrong or issued in error; kept for history. A final state.
        businessMeaning: "Controls whether the certificate is preparatory, approved, issued, replaced, or invalidated."
        relationshipContext: Status does not alter underlying measurements.
  relationships:
    - {name: product, target: Product, cardinality: 0..1, ownership: reference, help: {summary: Product represented by the certificate., businessMeaning: Identifies the material whose quality is certified., usage: Product release and customer documentation., cardinalityMeaning: Optional when context is supplied by other source records., context: Must reconcile with inspections and measurements.}}
    - {name: qualityInspections, target: QualityInspection, cardinality: "1..*", ownership: reference, help: {summary: Inspections supporting the certificate., businessMeaning: Supplies authoritative execution evidence for the certified conclusions., usage: "Certificate generation, audit, and traceability.", cardinalityMeaning: An issued certificate requires at least one governed inspection., context: Certificate summarizes but does not replace inspections.}}
    - {name: measurements, target: QualityMeasurement, cardinality: "0..*", ownership: reference, help: {summary: Measurements explicitly represented on the certificate., businessMeaning: Provides source observations behind reported values., usage: "Certificate rendering, verification, and audit.", cardinalityMeaning: Zero or many depending on certificate design., context: Must belong to the supporting inspection context.}}
    - {name: goodsReceipt, target: GoodsReceipt, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one receipt; set when the certificate documents incoming material., summary: Incoming receipt represented by the certificate when applicable., businessMeaning: Connects supplier quality evidence to received material., usage: Incoming quality and supplier documentation., context: Must reconcile with inspection receipt context.}}
    - {name: shipment, target: Shipment, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one shipment; set when the certificate accompanies outgoing goods., summary: Outbound shipment accompanied by the certificate when applicable., businessMeaning: Connects certified quality evidence to delivered material., usage: Customer fulfillment and compliance documentation., context: Must reconcile with certified product/material context.}}
  invariants:
    - {id: COA-001, rule: ISSUED requires issuedAt and at least one completed supporting QualityInspection.}
    - {id: COA-002, rule: Certificate values and conclusions must be reproducible from referenced immutable quality evidence and authorized derived calculations.}
    - {id: COA-003, rule: "Issuance does not itself change inventory, inspection, receipt, shipment, or financial state."}
    - {id: COA-004, rule: "Corrections after issuance create a controlled replacement, supersession, or void history rather than destructive rewriting."}
    - {id: COA-005, rule: "Product, receipt, shipment, inspection, and measurement contexts must reconcile before issuance."}
  lifecycle:
    title: Certificate Of Analysis Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
    initial: DRAFT
    terminal: [SUPERSEDED, VOID]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: ISSUED, action: issue}
      - {from: DRAFT, to: SUPERSEDED, action: mark_superseded}
      - {from: APPROVED, to: SUPERSEDED, action: mark_superseded}
      - {from: ISSUED, to: SUPERSEDED, action: mark_superseded}
      - {from: DRAFT, to: VOID, action: void}
      - {from: APPROVED, to: VOID, action: void}
      - {from: ISSUED, to: VOID, action: void}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a certificate of analysis is ended"
      description: "When a certificate of analysis is void, a task asks someone to settle what depended on it."
      when: "status == \"VOID\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CERTIFICATE-OF-ANALYSIS-FOLLOW-UP-{{id}}"
              name: "Follow up on certificate of analysis {{certificate_number}}"
              description: "Certificate of analysis {{certificate_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Controlled certificate presenting quality evidence for governed material.
    businessMeaning: CertificateOfAnalysis is a released representation of underlying evidence, not a substitute for QualityInspection or QualityMeasurement.
    usage: Supplier quality, customer documentation, regulated release, shipments, receipts, compliance, audit, and integrations.
    relationshipContext: Inspections and measurements supply evidence; Product and receipt/shipment provide material context.
    lifecycle: Draft → approved → issued → superseded/void under controlled document history.
    changePropagation: Changes to open source evidence invalidate draft/approved certificates for revalidation; issued certificates retain historical source references and are corrected by supersession.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CERTIFICATE-OF-ANALYSIS}
