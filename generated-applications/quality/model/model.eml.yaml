        help: Human-readable name of Calendar. Communicates the concept to business users. UI, documents and reports. Does not replace immutable identity. Required.
  - name: Attachment
    help: A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Provide durable, implementation-neutral governance semantics for Attachment. A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable. Connects authoritative business records to controlled lifecycle, evidence, findings, and downstream remediation without replacing source transactions. Created under governance, reviewed or finalized where applicable, and retained or superseded with history preserved. Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation. Enterprise agreements, controlled records, audit evidence, compliance findings, and lifecycle changes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Attachment. Identifies one governed record independently of mutable labels or state. Governance, workflow, integration and audit. Referenced by related enterprise records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Time at which this record becomes effective or evidentially applicable. Establishes temporal business meaning. Lifecycle, audit and reporting. Does not rewrite earlier effective evidence. Optional when lifecycle does not require a separate effective timestamp.
  - name: QualityCharacteristic
    help: Reusable definition of one quality property that can be configured by quality plans and observed through quality measurements. QualityCharacteristic answers what property is being evaluated. It intentionally does not own plan-specific limits because the same property can have different acceptance criteria for different products, suppliers, processes, or inspection plans. Quality master data, inspection design, supplier quality, incoming inspection, process control, laboratory testing, compliance, analytics, and audit. QualityCharacteristic is the reusable semantic definition; QualityPlanCharacteristic configures it for a QualityPlan; QualityPlan selects the governed controls; QualityInspection executes them; QualityMeasurement records observations; Nonconformance may consume failed evidence. Draft → active → retired. Retirement preserves historical references and evidence. Changes to meaning, type, or lifecycle require impact analysis across QualityPlanCharacteristic, QualityPlan, open QualityInspection, QualityMeasurement, Nonconformance, and reporting workflows. Historical completed evidence must retain the definition applicable when it was captured. A WEIGHT characteristic has dataType DECIMAL. One QualityPlanCharacteristic may require 9.8–10.2 kg while another plan may require 9.5–10.5 kg; both use the same reusable QualityCharacteristic.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the reusable quality characteristic definition. Identifies what property is being measured or observed independently of any one QualityPlan or QualityInspection. Used to reference, reuse, version, search, audit, and integrate a quality characteristic across quality plans and measurements. QualityCharacteristic defines the semantic property; QualityPlanCharacteristic supplies plan-specific acceptance configuration; QualityMeasurement records an observation of it. Required because the characteristic cannot be reliably referenced without a stable identity.
      - name: code
        type: string(100)
        unique: true
        help: Business code identifying the quality characteristic. Provides a stable human-readable identifier such as WEIGHT, TEMPERATURE, LENGTH, or APPEARANCE. Used in quality plans, measurements, reports, integrations, and validation rules. The code identifies the characteristic, while QualityPlanCharacteristic determines how that characteristic is controlled in a particular plan. Required for reliable reuse and integration.
      - name: name
        type: string(300)
        help: Human-readable name of the quality characteristic. States what property the characteristic represents in language understandable to quality personnel and other users. Used in quality-plan authoring, inspection screens, reports, analytics, and training. Complements code and provides the business-facing meaning of measurements referencing this characteristic. Required so the reusable definition remains understandable.
      - name: description
        type: string(2000)
        optional: true
        help: Detailed explanation of the characteristic and its intended interpretation. Clarifies exactly what is observed and prevents different processes from interpreting the same code differently. Quality-plan design, inspection execution, audit, integration, and governance. Explains the semantic property independently of plan-specific limits. Optional when the name and governed definition are already sufficient.
      - name: data_type
        type: string
        enum: QualityCharacteristicDataType
        help: Data representation expected for observations of this characteristic. Determines whether measurements are numeric or categorical and therefore which evaluation rules are valid. Controls QualityMeasurement value selection, validation, user-interface behavior, and downstream analytics. QualityMeasurement must supply an observation compatible with this data type; QualityPlanCharacteristic supplies applicable criteria. A numeric observation that may contain fractional values. A whole-number observation. A textual or categorical observation represented as text. A true/false observation. An observation selected from a governed set of allowed values. Required because evaluation depends on the characteristic data type.
      - name: status
        type: string
        enum: QualityCharacteristicStatus
        help: Lifecycle state of the reusable characteristic definition. Controls whether the characteristic may be newly assigned to quality plans and used for new measurements. Governance, authoring, validation, and retirement control. Retiring a characteristic does not erase historical QualityMeasurement evidence or historical plan configurations. Definition is being prepared and is not normally available for new governed use. Definition is approved for use in applicable QualityPlanCharacteristic records. Definition is no longer normally assigned to new configurations but remains available for historical traceability. Required to govern lifecycle behavior.
        default: ACTIVE
      - name: evaluation_method
        type: string(500)
        optional: true
        help: General method or interpretation approach for observing this characteristic. Describes the expected measurement or observation approach when a reusable default is appropriate. Provides guidance for quality-plan authoring and inspection execution. Plan-specific method overrides or requirements belong to QualityPlanCharacteristic when they differ by plan. Optional because some characteristics are self-evident or fully governed by plan-specific configuration.
  - name: QualityPlanCharacteristic
    help: Plan-specific configuration of a reusable quality characteristic, including acceptance criteria, execution guidance, and optional sampling policy. QualityPlanCharacteristic answers how a QualityCharacteristic is controlled in one particular QualityPlan and, when required, how its observations are sampled. This separation allows reusable characteristics and sampling policies to be combined without duplicating definitions. Quality-plan authoring, incoming inspection, supplier quality, process inspection, laboratory testing, compliance, sampling, audit, and analytics. QualityPlan provides the governing plan; QualityCharacteristic provides reusable meaning; SamplingPlan and SamplingRule govern sample selection; QualityMeasurement records observations; QualityInspection executes the plan; Nonconformance may consume failed results. Define QualityCharacteristic → configure QualityPlanCharacteristic → assign SamplingPlan when sampling is required → activate QualityPlan → create QualityInspection → select required sample → capture QualityMeasurements → evaluate against criteria → finalize inspection → create Nonconformance or disposition when criteria fail. Draft through governed plan configuration to active use; changes after execution require controlled versioning or replacement rather than silent mutation. Changes affect QualityPlan authoring, SamplingPlan/SamplingRule selection, open QualityInspections, QualityMeasurements, nonconformance evaluation, reporting, and downstream supplier or corrective-action workflows. Historical inspection evidence must retain the configuration applicable at capture time. QualityCharacteristic WEIGHT is configured as required and sampled under a receiving plan. The associated SamplingPlan selects 20 units from the lot; each selected unit receives a QualityMeasurement evaluated against the configured weight limits.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of one characteristic configuration within a QualityPlan. Identifies the specific plan-level requirement that governs how one QualityCharacteristic is inspected. Traceability, configuration, inspection execution, audit, and integration. Links one QualityPlan to one reusable QualityCharacteristic and its plan-specific criteria. Required because plan-level requirements need an unambiguous identity.
      - name: sequence_number
        type: integer
        help: Execution or presentation order of this quality characteristic within the plan. Determines where the characteristic appears in inspection instructions and can support ordered sampling or testing. Inspection forms, operator guidance, reports, and workflow orchestration. Sequence is scoped to the QualityPlan and does not change the reusable characteristic's identity. Required where plan execution requires deterministic ordering.
      - name: required
        type: boolean
        help: Indicates whether evidence for this characteristic is mandatory for the governing plan. Determines whether the absence of a measurement can prevent inspection completion. Inspection validation, completion gating, audit, and exception handling. QualityInspection uses this setting when determining whether all required measurements have been evaluated. Required because optional and mandatory characteristics have different workflow consequences.
        default: "true"
      - name: lower_limit
        type: decimal
        optional: true
        help: Plan-specific lower acceptance boundary for a numeric characteristic. Defines the minimum acceptable value under this particular QualityPlan. Automated evaluation and inspection review. Applies only to the linked QualityCharacteristic in this plan and must use a compatible unit. Optional when the criterion has no lower numeric boundary.
      - name: upper_limit
        type: decimal
        optional: true
        help: Plan-specific upper acceptance boundary for a numeric characteristic. Defines the maximum acceptable value under this particular QualityPlan. Automated evaluation and inspection review. Applies only to the linked QualityCharacteristic in this plan and must use a compatible unit. Optional when the criterion has no upper numeric boundary.
      - name: target_value
        type: decimal
        optional: true
        help: Preferred numeric target for the characteristic under this plan. Represents the desired value rather than the minimum or maximum acceptance boundary. Process optimization, inspection guidance, analytics, and trend analysis. Must be compatible with the characteristic data type and acceptance limits. Optional where only pass/fail boundaries are relevant.
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
        help: Unit used for numeric limits and target values in this plan configuration. Gives dimensional meaning to the configured numeric criteria. Measurement evaluation, conversion, reporting, and audit. Must be dimensionally compatible with the QualityCharacteristic and QualityMeasurement unit. Optional for unitless or non-numeric characteristics.
      - name: method
        type: string(500)
        optional: true
        help: Plan-specific procedure or method required to evaluate the characteristic. Defines how the characteristic must be observed when this plan is executed. Inspection instructions, reproducibility, compliance, and audit. May refine or override the reusable QualityCharacteristic evaluationMethod. Optional when the reusable characteristic method is sufficient.
      - name: sampling_required
        type: boolean
        help: Indicates whether this characteristic participates in explicit sampling controls under the plan. Distinguishes characteristics that require sampled observations from those evaluated on every applicable inspection item. Sampling workflow design and inspection execution. When true, the samplingPlan relationship identifies the governed selection policy used for this characteristic. Required to make sampling participation explicit.
        default: "false"
      - name: quality_characteristic_id
        type: string
        fk: true
        help: Reusable quality property being controlled by this plan configuration. Identifies what is observed while this entity supplies the context-specific acceptance rules. Reuse, semantic interpretation, measurement linkage, and governance. Every configuration references exactly one reusable QualityCharacteristic. Separating reusable meaning from plan-specific criteria prevents conflicting definitions when the same property is used by multiple plans.
      - name: quality_plan_id
        type: string
        fk: true
        help: QualityPlan in which this characteristic requirement is configured. Provides the governing inspection context for the requirement. Plan authoring, inspection execution, traceability, and lifecycle control. Every configuration belongs to exactly one QualityPlan. The plan determines when and why the configured characteristic is evaluated.
      - name: test_method_id
        type: string
        fk: true
        optional: true
        help: Governed reusable procedure required to evaluate this characteristic in the plan. Replaces ambiguous free-text method interpretation with an authoritative method definition while allowing method text to remain a historical or integration snapshot. Inspection execution, laboratory testing, reproducibility, training, compliance, and audit. A plan characteristic uses zero or one governed TestMethod when a reusable controlled method applies. TestMethod defines how evidence is produced; this entity defines what criteria that evidence must satisfy.
      - name: sampling_plan_id
        type: string
        fk: true
        optional: true
        help: SamplingPlan governing how observations of this characteristic are selected when samplingRequired is true. Connects a plan-specific characteristic requirement to the deterministic sample-selection policy used during inspection. Sample-size calculation, inspection execution, completion gating, audit, and reproducibility. A characteristic requirement uses zero or one sampling plan; zero is appropriate when every applicable unit is evaluated or sampling is governed elsewhere. SamplingPlan defines selection policy; SamplingRule supplies conditional sample quantities and acceptance thresholds.
  - name: QualityPlan
    help: Governed definition of how a product or process is inspected. QualityPlan is the parent definition for plan-specific QualityPlanCharacteristic requirements, reusable SamplingPlan policies, and QualityInspection execution. Reusable quality meaning belongs to QualityCharacteristic and reusable sample selection belongs to SamplingPlan rather than being duplicated in every inspection. Quality master data, inspection processes, supplier quality, incoming inspection, process control, laboratory testing, compliance, forms, reports, integrations, and analytics. Product provides applicability; QualityPlanCharacteristic supplies detailed requirements; SamplingPlan and SamplingRule supply sample-selection controls; QualityInspection executes them; InspectionSample records actual selection; QualityMeasurement records observations; Nonconformance and disposition consume failed outcomes. Draft → active → suspended/retired under governed change control. Historical inspections retain the plan, characteristic, sampling plan, and sampling rule configuration applicable when executed. Material plan changes propagate to open inspections and measurements, sample-selection execution, requirement evaluation, nonconformance and disposition workflows, supplier performance evidence, reporting, and audit history. Completed evidence must not be rewritten. An incoming-receipt plan contains required WEIGHT and TEMPERATURE configurations and assigns an acceptance-sampling SamplingPlan. A QualityInspection selects the governed sample through its SamplingRule, captures measurements, and determines the overall result.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the quality plan. Identifies one governed collection of inspection and acceptance requirements. Referencing, authoring, inspection execution, audit, reporting, and integration. Connects the plan to Product, QualityPlanCharacteristic configurations, SamplingPlan configurations, and QualityInspection executions. Required for stable plan identity.
      - name: code
        type: string(100)
        unique: true
        help: Business code identifying the quality plan. Provides a stable human-readable reference for the governed inspection definition. Plan selection, search, reports, integrations, and operational instructions. Distinguishes the plan from its characteristic requirements, sampling policies, and inspection transactions. Required for operational identification.
      - name: name
        type: string(300)
        help: Human-readable name of the quality plan. Explains the purpose of the inspection definition. Authoring, selection, inspection execution, reporting, and audit. Names the overall plan whose detailed controls are represented by QualityPlanCharacteristic and SamplingPlan. Required for understandable plan governance.
      - name: status
        type: string
        enum: QualityPlanStatus
        help: Lifecycle state of the quality plan. Controls whether the plan may normally govern new inspections. Plan selection, workflow gating, governance, and retirement. Status affects characteristic and sampling configurations and creation of new QualityInspection records; historical inspections remain evidence. Plan is being prepared and is not normally used for production inspection execution. Plan is approved for governed inspection use. Plan is temporarily unavailable for new governed use while retained for traceability. Plan is no longer normally selected for new inspections but remains historical evidence. Required to govern lifecycle behavior.
        default: ACTIVE
  - name: TestMethod
    help: Reusable governed procedure for producing quality evidence. TestMethod separates how an observation is produced from what QualityCharacteristic is observed and what QualityPlanCharacteristic criteria apply. Quality planning, laboratory testing, incoming inspection, compliance, training, audit, and analytics. QualityPlanCharacteristic selects the method; QualityMeasurement records evidence produced under it. Draft → active → suspended/retired under controlled change. Method lifecycle or semantic changes revalidate affected open configurations and inspections while completed evidence remains historically stable.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the governed test method. Identifies one reusable procedure independently of plans and measurements. Quality planning, laboratory execution, audit, and integration. Referenced by quality configurations and test evidence. Required.
      - name: code
        type: string(100)
        unique: true
        help: Business code of the test method. Human-readable controlled identifier for the procedure. Authoring, execution, reporting, and integration. Remains stable within its governed version. Required.
      - name: name
        type: string(300)
        help: Human-readable test-method name. States the procedure understood by quality and laboratory personnel. Instructions, forms, reports, and training. Complements the controlled code. Required.
      - name: instructions
        type: string(10000)
        optional: true
        help: Governed execution instructions. Describes how evidence must be produced. Laboratory and inspection execution, reproducibility, and audit. May be supplemented by controlled external procedures. Optional when instructions are maintained in a linked governed document.
      - name: status
        type: string
        enum: TestMethodStatus
        help: Lifecycle state of the method. Controls whether the procedure may be selected for new governed work. Method governance and execution gating. Historical evidence retains the method/version used. Being authored and not normally executable. Approved for governed use. Temporarily unavailable for new use. No longer selected for new work but retained historically. Required.
        default: DRAFT
  - name: SamplingPlan
    help: Reusable governed definition for selecting inspection samples. SamplingPlan separates the statistical or operational selection policy from the QualityInspection transaction that executes it. Incoming inspection, supplier quality, process control, laboratory testing, compliance, acceptance sampling, and audit. QualityPlan determines the broader quality controls; SamplingPlan defines how populations are sampled; SamplingRule defines conditional sample quantities and acceptance criteria; inspection execution records the actual selection. Draft → active → suspended/retired. Historical executions retain their governing configuration. Changes propagate to QualityPlans, open inspections, sample-selection transactions, measurement coverage, and inspection completion gating. Completed sample evidence is never silently reinterpreted. A receiving quality plan uses an acceptance-sampling SamplingPlan with different sample sizes for small, medium, and large lot-size ranges.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the sampling plan. Identifies one governed sampling definition independently of any inspection execution. Sampling configuration, inspection planning, audit, reporting, and integration. SamplingPlan may be assigned to a QualityPlan and contains SamplingRule records that determine how samples are selected. Required.
      - name: code
        type: string(100)
        unique: true
        help: Business code identifying the sampling plan. Provides a stable operational reference for a governed sampling definition. Plan selection, inspection authoring, reports, and integrations. Identifies the sampling definition rather than an individual sample or inspection. Required.
      - name: name
        type: string(300)
        help: Human-readable name of the sampling plan. Explains the purpose of the sampling strategy. Quality authoring, inspection execution, training, reporting, and audit. Describes the overall sampling definition whose detailed rules are represented by SamplingRule. Required.
      - name: method
        type: string
        enum: SamplingPlanMethod
        help: General method used to select inspection samples. Defines the governed selection approach rather than leaving sampling to operator discretion. Sampling execution, compliance, reproducibility, and audit. SamplingRule refines the method with lot and quantity parameters. Every applicable unit is inspected. Units are selected randomly from the eligible population. Units are selected using a defined interval or systematic pattern. Population is divided into defined strata and samples are selected within them. A fixed number of units is selected. A defined proportion of the population is selected. Sample size and acceptance/rejection criteria are governed by an acceptance-sampling scheme. Required.
      - name: status
        type: string
        enum: SamplingPlanStatus
        help: Lifecycle state of the sampling plan. Controls whether the sampling definition may be assigned to new governed inspections. Governance, authoring, inspection planning, and retirement. Retirement preserves historical inspection evidence and does not invalidate completed samples. Being defined and not normally available for production use. Approved for governed sampling. Temporarily unavailable for new use. No longer normally assigned to new inspections but retained for history. Required.
        default: DRAFT
  - name: SamplingRule
    help: Conditional sampling configuration that translates a SamplingPlan into a deterministic sample size and acceptance threshold. SamplingRule answers how many units to inspect for a qualifying population and, where applicable, how many failures are permitted before rejection. Acceptance sampling, incoming inspection, supplier quality, process control, laboratory sampling, compliance, and audit. SamplingPlan defines the sampling method; QualityPlan may consume the sampling definition; QualityPlanCharacteristic identifies characteristics that participate; QualityInspection executes the sample; QualityMeasurement records observations from selected samples. Draft → active → retired. Historical executions preserve the applicable rule. Changes affect open QualityInspections, sample selection, required measurement coverage, and final inspection evaluation. Completed inspection evidence remains governed by the rule in effect at execution. For lots of 101–500 units, an active rule may require 20 sampled units and accept the lot with no more than one failing sampled unit, with a rejection threshold of two failures.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the sampling rule. Identifies one conditional sampling configuration within a SamplingPlan. Sampling execution, audit, traceability, and integration. The rule belongs to a SamplingPlan and determines how a qualifying inspection population is sampled. Required.
      - name: rule_number
        type: string(100)
        help: Business reference for the sampling rule. Identifies the rule within its sampling plan for authoring, review, and audit. Configuration, inspection execution, reporting, and integration. Rule identity is scoped to the SamplingPlan and is distinct from actual sample records. Required.
      - name: population_min
        type: integer
        optional: true
        help: Minimum population quantity for which this rule applies. Defines the lower boundary of the eligible lot or population range. Rule selection and deterministic sampling execution. Interpreted with populationMax and sampleSize. Optional when the rule has no lower population boundary.
      - name: population_max
        type: integer
        optional: true
        help: Maximum population quantity for which this rule applies. Defines the upper boundary of the eligible lot or population range. Rule selection and deterministic sampling execution. Interpreted with populationMin and sampleSize. Optional when the rule has no upper population boundary.
      - name: sample_size
        type: integer
        help: Number of units or observations to select when this rule applies. Defines the required sample quantity before the inspection can satisfy the sampling requirement. Sample selection, inspection execution, and completion gating. Must not exceed the eligible population except where the governing method explicitly permits census behavior. Required.
      - name: acceptance_number
        type: integer
        optional: true
        help: Maximum number of failing sampled units permitted for acceptance under this rule. Defines the failure threshold for acceptance-sampling plans. Automated sample evaluation and inspection decision support. Used with rejectionNumber and sample results when method is acceptance sampling. Optional when the plan uses another acceptance mechanism.
      - name: rejection_number
        type: integer
        optional: true
        help: Number of failing sampled units at which the sampled population is rejected. Defines the rejection threshold for acceptance-sampling plans. Automated evaluation and inspection decision support. Must be greater than acceptanceNumber when both are configured. Optional when the plan uses another acceptance mechanism.
      - name: status
        type: string
        enum: SamplingRuleStatus
        help: Lifecycle state of the sampling rule. Controls whether the rule can be selected for new sample executions. Governance, authoring, and inspection execution. Retired rules remain available for historical sample traceability. Rule is being prepared and is not normally selectable. Rule is approved for sampling execution. Rule is no longer selected for new sampling but remains historical evidence. Required.
        default: ACTIVE
      - name: sampling_plan_id
        type: string
        fk: true
        help: SamplingPlan that owns this conditional sampling rule. Provides the overall sampling method and governance context. Rule selection, execution, traceability, and audit. Every rule belongs to exactly one SamplingPlan. The plan supplies the method; the rule supplies conditional quantity and acceptance parameters.
      - name: quality_plan_id
        type: string
        fk: true
        optional: true
        help: QualityPlan in which this rule is specifically used when a direct plan association is needed. Provides explicit traceability from a sampling rule to the quality plan it supports. Plan impact analysis, reporting, governance, and integration. A rule may be reusable or directly associated with one QualityPlan. When populated, the associated QualityPlan must agree with the SamplingPlan assignment.
  - name: QualityInspection
    help: Represents a quality inspection and its controlled sampling, measurements, result and disposition across inbound receiving and supplier-return workflows. QualityInspection provides the execution context and overall decision; InspectionSample records the actual selected sample; QualityMeasurement records individual factual observations. The inspection does not itself perform inventory or financial changes. Receiving quality, supplier quality, acceptance sampling, returns, quarantine, nonconformance, corrective action, compliance and audit. QualityPlan/QualityPlanCharacteristic define controls; SamplingPlan/SamplingRule define selection; InspectionSample records execution; QualityMeasurement provides test evidence; InventoryMovement records physical stock consequence; SupplierCreditNote records financial consequence; Nonconformance records deviations. QualityPlan → QualityPlanCharacteristic → SamplingPlan/SamplingRule → QualityInspection → InspectionSample selection → sample measurement → aggregate result → Nonconformance/disposition. For unsampled characteristics, measurement may be captured directly under the inspection. For supplier returns, SupplierReturn → inspection → sample/measurement/disposition → attributable InventoryMovement → SupplierCreditNote/exception completion. Open → in progress → sampling/evidence captured → passed/failed/conditional → dispositioned, with cancellation or controlled reinspection. Changes to receipt, supplier return, product, quality plan, characteristic configuration, sampling policy, unit definitions or measurement evidence affecting an open inspection trigger revalidation. Completed inspection and sample history is not silently rewritten; reinspection or correction creates explicit evidence. A received lot of 500 units is governed by a 20-unit SamplingRule. InspectionSample records the selected sample, QualityMeasurement records weight and purity observations, and the inspection aggregates those results before deciding release or quarantine.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the inspection record. Identifies one inspection event independently of the item, receipt, return, result or corrective action. Quality traceability, audit, reporting and integrations. Root of the inspection execution graph including sampling and measurement evidence. Stable reference through planning, sampling, execution, result and disposition. Required.
      - name: inspection_number
        type: string(100)
        unique: true
        help: Business-facing inspection reference. Identifies the inspection in quality operations and audit. Quality records, supplier disputes and reporting. Distinct from GoodsReceipt.receiptNumber and SupplierReturn.returnNumber. Provides human-recognizable traceability. Required.
      - name: inspection_date
        type: datetime
        help: Date and time inspection was performed or initiated. Establishes quality chronology. Audit, release, supplier performance and compliance. May occur after receipt or return authorization and before final disposition. Anchors inspection evidence. Required.
      - name: status
        type: string
        enum: QualityInspectionStatus
        help: Lifecycle state of inspection. Indicates whether inspection is pending, executing, completed with a result, or cancelled. Controls release and disposition workflows. Inspection status is independent of sample status, receipt/return status, and inventory state. PASSED/FAILED/CONDITIONAL controls eligible disposition. Required.
        default: OPEN
      - name: result
        type: string
        optional: true
        enum: QualityInspectionResult
        help: Overall outcome of inspection or test. Records whether the inspected scope satisfies applicable requirements after evaluating relevant samples, measurements and other evidence. Drives acceptance, rejection, quarantine, return, repair or release decisions. May be derived from QualityMeasurement and InspectionSample evidence; it does not replace that evidence. Supplies aggregate evidence for controlled disposition. Optional until testing is complete.
      - name: disposition
        type: string
        optional: true
        enum: QualityInspectionDisposition
        help: Controlled operational disposition resulting from inspection. Defines what happens to inspected material after quality evaluation. Controls inventory availability, supplier return, repair, scrap and release processes. RETURN_TO_SUPPLIER may initiate or support SupplierReturn; it does not itself reduce inventory until an attributable InventoryMovement is posted. Converts quality result into an authorized physical disposition. Optional until a disposition decision is made.
      - name: notes
        type: string(4000)
        optional: true
        help: Inspection observations and supporting context. Records qualitative evidence not represented by structured measurements. Quality review, supplier disputes and audit. Complements QualityMeasurement, InspectionSample and Nonconformance; does not replace structured evidence. Supports disposition decisions. Optional.
      - name: quality_plan_id
        type: string
        fk: true
        optional: true
        help: Quality plan governing this inspection. Identifies requirements, characteristics, sampling policies and test procedures. Determines inspection scope and acceptance criteria. Provides expected quality controls.
      - name: inspector_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party performing or accountable for inspection. Identifies inspector or quality authority. Accountability, audit and compliance. Provides execution responsibility.
  - name: InspectionSample
    help: Execution record of the actual sample selected for a governed quality inspection. InspectionSample separates sampling policy from the physical or logical sample actually selected. SamplingPlan and SamplingRule define how selection should occur; InspectionSample records what was actually selected; QualityMeasurement records observations from it. Incoming inspection, supplier quality, acceptance sampling, laboratory testing, process quality, chain of custody, compliance, and audit. QualityInspection is the parent execution; SamplingPlan and SamplingRule define selection policy; Product and UnitOfMeasure identify population semantics; QualityMeasurement records test evidence; Nonconformance and disposition consume resulting quality decisions. QualityPlan → QualityPlanCharacteristic → SamplingPlan/SamplingRule → QualityInspection → InspectionSample selection → sample testing → QualityMeasurement capture/evaluation → aggregate inspection result → Nonconformance/disposition where required. Selected → in testing → tested → disposed/rejected/cancelled as applicable. Historical selection evidence is retained. Sampling policy changes affect open inspections that have not selected samples. Once a sample is selected, later policy changes do not silently change its historical basis. A 500-unit receipt is governed by a rule requiring 20 sampled units. InspectionSample records the selected 20 units and their quantity, preserves the governing rule, and links subsequent weight and purity QualityMeasurements to the sample.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the inspection sample record. Identifies one executed sample selection independently of the inspection and measurements performed on it. Traceability, audit, sample reconciliation, quality analytics, and integration. Connects the actual selected sample to QualityInspection and the SamplingRule that governed its selection. Required.
      - name: sample_number
        type: string(100)
        unique: true
        help: Human-facing identifier for the selected inspection sample. Provides an operational reference for labeling, handling, testing, and audit. Inspection execution, laboratory handling, reports, and traceability. Identifies the executed sample rather than the sampling policy or parent inspection. Required.
      - name: selected_at
        type: datetime
        help: Time at which the sample was selected from the eligible population. Establishes when the actual sampling event occurred. Chain of custody, audit, reproducibility, and inspection chronology. Distinct from QualityInspection.inspectionDate and measuredAt on QualityMeasurement. Required.
      - name: quantity
        type: decimal
        help: Quantity represented by the selected sample. States how much material or how many units the sample represents under its unit of measure. Sample reconciliation, measurement scope, inventory traceability, and audit. Must reconcile with the eligible inspection population and sample-selection rule. Required.
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        help: Unit in which the sample quantity is expressed. Gives semantic meaning to the selected sample quantity. Reconciliation, reporting, conversion, and audit. Must be compatible with the source population and governing sampling configuration. Required.
      - name: status
        type: string
        enum: InspectionSampleStatus
        help: Lifecycle state of the selected sample. Shows whether the sample is awaiting testing, being tested, has completed testing, or has been otherwise dispositioned. Sample handling, measurement gating, chain of custody, and audit. Sample status is distinct from overall QualityInspection status and does not independently determine product disposition. Sample has been selected and is awaiting testing or handling. Sample is actively undergoing governed testing. Required testing for the sample has completed. Sample itself was rejected or invalidated for the governed purpose. Sample has been physically disposed of under an authorized process. Sample selection was cancelled under controlled workflow. Required.
        default: SELECTED
      - name: selection_basis
        type: string(1000)
        optional: true
        help: Evidence or description of how this particular sample was selected. Preserves the operational selection basis needed to reproduce or audit the sampling event. Compliance, audit, supplier disputes, and statistical review. Complements the authoritative SamplingRule and does not replace it. Optional when selection is fully reproducible from the governed rule and execution metadata.
      - name: quality_inspection_id
        type: string
        fk: true
        help: QualityInspection for which this sample was selected. Provides the execution context and population being inspected. Sample traceability, inspection completion, measurement linkage, and audit. Every InspectionSample belongs to exactly one QualityInspection. Inspection status and result remain independent; the sample supplies evidence to the inspection.
      - name: sampling_plan_id
        type: string
        fk: true
        optional: true
        help: SamplingPlan governing the sample-selection event. Preserves the reusable sampling policy applied at execution time. Audit, reproducibility, analytics, and change-impact analysis. A sample may reference zero or one sampling plan when sampling is not governed by an explicit reusable plan. When populated, the plan must agree with the governing SamplingRule.
      - name: sampling_rule_id
        type: string
        fk: true
        optional: true
        help: SamplingRule used to determine this sample selection. Identifies the exact conditional rule that determined sample quantity and acceptance logic. Audit, reproducibility, sample reconciliation, and inspection completion. A sample may have zero or one rule only when an explicit rule is not applicable. When populated, the rule and SamplingPlan must be mutually consistent.
  - name: QualityMeasurement
    help: Structured auditable evidence for one quality characteristic observed during a QualityInspection. QualityMeasurement separates the factual observation from the inspection-level conclusion while retaining the exact plan configuration used for evaluation. Incoming inspection, supplier quality, laboratory testing, dimensional checks, sampling, process quality, compliance, nonconformance and corrective-action verification. QualityInspection is the execution context; InspectionSample supplies exact sample provenance when sampling applies; QualityPlanCharacteristic supplies authoritative plan-specific requirements; QualityCharacteristic supplies reusable meaning; QualityPlan supplies the parent definition; Product identifies material; UnitOfMeasure supplies dimensional semantics; Nonconformance may consume failed evidence. QualityPlan → QualityPlanCharacteristic → SamplingPlan/SamplingRule where required → QualityInspection → InspectionSample where required → measurement capture → validate characteristic/unit/method → evaluate against configured criteria → measurement result → aggregate inspection result → Nonconformance/disposition where required. Captured → evaluated → retained as completed inspection evidence; corrections use explicit amendment or remeasurement. Changes to governing plan characteristics, reusable characteristics, product or unit definitions affect open measurements and trigger revalidation. Completed measurements retain the configuration snapshots applicable when captured. A receiving plan configures WEIGHT at 9.8–10.2 KG. A QualityMeasurement records 10.35 KG, links to the governing QualityPlanCharacteristic and QualityCharacteristic, snapshots the applicable limits, and evaluates to FAIL.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of one quality measurement. Identifies one observation independently of its inspection and characteristic. Traceability, audit, analytics and integrations. Distinct from QualityInspection and the measured Product. Stable reference from capture through review. Required.
      - name: measurement_number
        type: string(100)
        unique: true
        help: Human-facing measurement reference. Provides an operational identifier for one observation. Inspection review, audit and integration. Distinct from the parent inspection number. Supports individual observation traceability. Required.
      - name: characteristic_code
        type: string(100)
        help: Snapshot of the quality characteristic business code evaluated by this observation. Preserves the human-readable characteristic identifier applicable when evidence was captured. Audit, reporting, exports and legacy integration. Must correspond to the linked QualityCharacteristic through QualityPlanCharacteristic and must not be treated as the authoritative configuration key. Provides readable historical context while the relationship graph supplies authoritative semantics. Required for operational readability and historical evidence.
      - name: measured_value
        type: decimal
        optional: true
        help: Numeric value observed during inspection. Records the factual quantitative observation before evaluation. Acceptance evaluation, trend analysis and audit. Requires a compatible unit for dimensional characteristics. Supplies evidence used against configured acceptance criteria. Optional for categorical characteristics.
      - name: measured_text
        type: string(1000)
        optional: true
        help: Categorical or textual observation. Records observations such as color, grade, appearance or classification. Quality evaluation where numeric measurement is inappropriate. Used instead of measuredValue for categorical characteristics. Supplies structured qualitative evidence. Optional for numeric characteristics.
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
        help: Unit in which a numeric measurement is expressed. Defines the dimensional interpretation of measuredValue. Comparison, conversion, reporting and audit. Must be compatible with the linked QualityPlanCharacteristic and QualityCharacteristic. Makes numeric observations semantically comparable. Optional for unitless or categorical characteristics.
      - name: lower_limit
        type: decimal
        optional: true
        help: Snapshot of the lower acceptance boundary applicable when the measurement was evaluated. Preserves the criterion used to evaluate the historical observation. Audit, reproducibility and review. Normally copied from QualityPlanCharacteristic rather than independently defining a new requirement. Makes the evaluation auditable even if the plan later changes. Optional when no lower boundary applies.
      - name: upper_limit
        type: decimal
        optional: true
        help: Snapshot of the upper acceptance boundary applicable when the measurement was evaluated. Preserves the criterion used to evaluate the historical observation. Audit, reproducibility and review. Normally copied from QualityPlanCharacteristic rather than independently defining a new requirement. Makes the evaluation auditable even if the plan later changes. Optional when no upper boundary applies.
      - name: result
        type: string
        enum: QualityMeasurementResult
        help: Evaluation of this measurement against its governing criterion. States whether the individual observation satisfies the applicable requirement. Inspection completion, nonconformance and analytics. Contributes evidence to QualityInspection.result but does not replace it. Supplies structured evidence for the overall inspection decision. Required.
      - name: measured_at
        type: datetime
        help: Time when the observation was captured. Establishes chronology of the measured fact. Traceability, sampling, compliance and audit. Distinct from QualityInspection.inspectionDate. Preserves temporal measurement evidence. Required.
      - name: method
        type: string(500)
        optional: true
        help: Method or procedure used to obtain the observation. Identifies how the measurement or test was performed. Reproducibility, laboratory audit and compliance. Should align with the linked QualityPlanCharacteristic method where applicable. Establishes how evidence was produced. Optional when inherited unambiguously from the governing plan.
      - name: notes
        type: string(2000)
        optional: true
        help: Supporting context for the observation. Captures anomalies or conditions not represented structurally. Review and audit. Complements measured values and result without replacing them. Provides supporting evidence. Optional.
      - name: quality_characteristic_id
        type: string
        fk: true
        optional: true
        help: Reusable quality property observed by this measurement. Identifies the semantic property independently of a particular plan. Traceability, analytics, reuse, and audit. Should agree with the QualityCharacteristic reached through qualityPlanCharacteristic when both are populated. Provides reusable semantic context.
      - name: quality_plan_characteristic_id
        type: string
        fk: true
        optional: true
        help: Plan-specific requirement used to interpret and evaluate this measurement. Identifies the exact configured characteristic, limits, method, unit, and requiredness governing the observation. Requirement traceability, acceptance evaluation, audit, and completion gating. Supplies authoritative evaluation context for the measurement.
      - name: test_method_id
        type: string
        fk: true
        optional: true
        help: Governed test procedure used to produce this observation. Identifies the authoritative reusable method applied during measurement. Reproducibility, compliance, laboratory audit, and analytics. Optional when no reusable controlled method applies. Must agree with the governing QualityPlanCharacteristic method configuration when that configuration requires a TestMethod.
      - name: quality_inspection_id
        type: string
        fk: true
        help: Inspection during which the measurement was captured. Provides the governing inspection context. Quality traceability and aggregate evaluation. Parent inspection controls measurement lifecycle.
      - name: inspection_sample_id
        type: string
        fk: true
        optional: true
        help: Exact governed inspection sample from which this observation was produced when sample-specific testing applies. Preserves provenance from SamplingPlan and SamplingRule execution through selected material to the resulting observation. Sample-level traceability, laboratory chain of custody, acceptance sampling, audit, and reproducibility. A measurement references zero or one InspectionSample because non-sampled or population-level observations may not have a sample record. When populated, the sample must belong to the same QualityInspection and the measurement must satisfy the characteristic controls applicable to that sample.
      - name: quality_plan_id
        type: string
        fk: true
        optional: true
        help: Quality plan under which the measurement was evaluated. Preserves the plan context for the observation. Audit, reporting, requirement traceability, and historical reconstruction. Identifies the governing plan when a direct plan relationship is needed for integration or historical evidence.
      - name: certificate_of_analysis_id
        type: string
        fk: true
        optional: true
        help: The CertificateOfAnalysis this QualityMeasurement belongs to.
  - name: Nonconformance
    help: Represents a controlled quality deviation and its investigation, containment, disposition and corrective-action lifecycle. Nonconformance captures the quality problem; QualityInspection provides test evidence; ReturnDisposition records controlled operational outcomes; SupplierReturn provides physical response; CorrectiveAction addresses recurrence; CorrectiveActionVerification proves effectiveness. Supplier quality, incoming inspection, returns, CAPA, compliance, audit, supplier performance and risk management. A quality issue may begin at receiving, inspection, customer/supplier return or external complaint. Operational, inventory and financial consequences remain separate business facts linked through traceable relationships. Inspection/receipt/return evidence → Nonconformance → containment → ReturnDisposition where applicable → SupplierReturn/InventoryMovement → CorrectiveAction → effectiveness verification → closure. Financial consequences remain separate through authorized credit/debit workflows. Open → under review → contained → corrective action → closed, with rejection where the issue is invalid. Changes to inspection, receipt, return, disposition, product, corrective action or verification evidence affecting an open issue trigger revalidation. Financial and inventory consequences are never inferred solely from Nonconformance status. Incoming inspection detects defective units. Nonconformance records the defect, affected receipt lines are contained, a return disposition sends the units to quarantine, a supplier return and inventory movement execute the physical response, CorrectiveAction addresses the root cause, and an effective verification supplies closure evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the nonconformance. Identifies one quality deviation independently of its inspection, product, receipt, return or corrective action. Quality history, supplier performance, audit and CAPA. Root identity for issue lifecycle. Required.
      - name: number
        type: string(100)
        unique: true
        help: Business-facing nonconformance reference. Identifies the issue for quality and supplier operations. Audit, reporting, CAPA and dispute handling. Human-recognizable issue reference. Required.
      - name: severity
        type: string
        enum: NonconformanceSeverity
        help: Business severity of the deviation. Indicates impact and urgency. Prioritization, containment and escalation. Determines response urgency. Required.
      - name: status
        type: string
        enum: NonconformanceStatus
        help: Lifecycle state of the quality issue. Indicates investigation, containment, corrective action and closure. Quality management and audit. Controls allowed responses and closure. Required.
        default: OPEN
      - name: description
        type: string(4000)
        help: Detailed explanation of the deviation. States what requirement or expected result was not met. Investigation, supplier communication, CAPA and audit. Provides issue evidence. Required.
      - name: detected_at
        type: datetime
        help: Time the deviation was detected. Establishes chronology for containment and corrective action. Audit and quality analytics. Anchors issue occurrence. Required.
      - name: closed_at
        type: datetime
        optional: true
        help: Time the issue was formally closed. Establishes completion chronology. Quality performance and audit. Required for closure. Optional until closure.
      - name: inspection_id
        type: string
        fk: true
        references: QualityInspection
        optional: true
        help: Inspection that detected or evidenced the deviation. Connects issue to objective quality evaluation. Investigation and audit. Provides detection evidence.
      - name: owner_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party accountable for issue management. Identifies responsible quality owner or organizational party. Escalation, CAPA and audit. Owns investigation and closure.
  - name: CorrectiveAction
    help: Represents a controlled quality action from assignment through implementation and independent effectiveness verification. Nonconformance records the problem; CorrectiveAction records what is done to contain, correct or prevent it; CorrectiveActionVerification records whether the action worked. CAPA, supplier quality, compliance, audit, recurrence prevention and quality improvement. The action connects Nonconformance with responsible Party and one or more CorrectiveActionVerification records. Physical and financial consequences remain represented by their own transactions. Open → assigned → in progress → verification → completed, with cancellation and reopening paths. Nonconformance → action definition → assignment → implementation → verification → effective completion → Nonconformance closure when all required evidence is satisfied. Ineffective verification returns the action to controlled follow-up. Changes to the originating Nonconformance or quality evidence affecting the action trigger revalidation of scope and verification criteria. Verification results may reopen or create additional action work; historical records remain immutable. A supplier defect causes a corrective action to change packaging controls. The action is implemented, a verification evaluates subsequent lots, and only an EFFECTIVE verification permits completion when policy requires effectiveness evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the corrective action. Identifies one controlled quality action independently of its issue, owner, implementation evidence or verification. CAPA, quality audit, supplier improvement and compliance. Distinct from Nonconformance and CorrectiveActionVerification identities. Stable reference through assignment, execution, verification and closure. Required.
      - name: action_number
        type: string(100)
        unique: true
        help: Human-facing corrective-action reference. Identifies the action for quality teams, responsible parties and auditors. Communication, reporting, CAPA tracking and integration. Distinct from the originating nonconformance number and verification number. Correlates action work across its lifecycle. Required.
      - name: action_type
        type: string
        enum: CorrectiveActionActionType
        help: Classification of the quality action. Distinguishes immediate containment, correction of an existing condition, root-cause corrective action, and preventive action. Determines evidence expectations, routing and effectiveness criteria. Containment/disposition can control immediate risk while corrective/preventive actions address causes and recurrence. Determines the intended outcome that verification must assess. Required.
      - name: description
        type: string(4000)
        help: Detailed statement of what the action will accomplish. Defines scope, intended outcome and work required to address the quality issue. Assignment, execution, audit and effectiveness assessment. Must remain traceable to the associated Nonconformance or approved quality objective. Defines the implementation target for verification. Required.
      - name: status
        type: string
        enum: CorrectiveActionStatus
        help: Lifecycle state of the action. Indicates whether work is pending, assigned, underway, awaiting effectiveness evidence, completed or cancelled. Controls execution and closure. COMPLETED does not itself prove effectiveness; CorrectiveActionVerification supplies that evidence. VERIFICATION gates final completion when effectiveness verification is required. Required.
        default: OPEN
      - name: due_date
        type: date
        optional: true
        help: Target date for action implementation. Defines when the responsible party is expected to complete implementation. Work planning, escalation, SLA reporting and quality governance. Distinct from completedDate and verificationDate. Supports overdue detection and escalation. Optional when policy does not require a target date.
      - name: completed_date
        type: date
        optional: true
        help: Date implementation was formally completed. Records when the action work was declared complete, subject to any required effectiveness verification. CAPA metrics, audit and chronology. Does not replace verification evidence where effectiveness is required. Required when status is COMPLETED. Optional until completion.
      - name: nonconformance_id
        type: string
        fk: true
        optional: true
        help: Quality issue that caused or requires this action. Connects the action to the deviation and its containment, disposition and closure requirements. CAPA traceability, root-cause analysis and audit. Supplies the problem context the action is intended to address.
      - name: owner_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party accountable for implementing the action. Identifies the responsible person or organization for execution. Assignment, escalation and accountability. Owns implementation evidence and completion proposal.
  - name: CorrectiveActionVerification
    help: Provides independent auditable evidence that a corrective or preventive action achieved its intended result. CorrectiveAction records what was done; CorrectiveActionVerification records whether it worked; Nonconformance records the original quality problem. CAPA supplier quality compliance audit recurrence prevention and issue closure. Verification closes the evidence loop between Nonconformance and CorrectiveAction without conflating implementation with effectiveness. Nonconformance → CorrectiveAction → implementation → effectiveness verification → effective closure or ineffective/reopened action → Nonconformance closure when all required evidence is satisfied. Open → in progress → completed, with reopened or cancelled paths. Ineffective verification reopens or creates additional CorrectiveAction work according to policy; it must not silently close the underlying Nonconformance. A supplier defect causes a corrective action requiring a packaging-process change. After implementation, verification evaluates subsequent lots, records EFFECTIVE, and provides evidence needed to complete the action and eventually close the nonconformance.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the verification record. Identifies one independent verification event assessing an implemented corrective or preventive action. Quality assurance CAPA audit supplier performance and closure evidence. Distinct from CorrectiveAction and Nonconformance identities. Provides traceable evidence for a completion decision. Required.
      - name: verification_number
        type: string(100)
        unique: true
        help: Human-facing verification reference. Identifies the verification event for quality operations and audit. Reporting approval audit and supplier communication. Distinct from actionNumber and nonconformance number. Correlates verification evidence throughout closure. Required.
      - name: verification_date
        type: datetime
        help: Date and time effectiveness verification was performed. Establishes when evidence was evaluated against the intended outcome. Audit SLA quality reporting and closure chronology. Anchors the verification event. Required.
      - name: result
        type: string
        enum: CorrectiveActionVerificationResult
        help: Outcome of effectiveness verification. States whether the action achieved its intended quality outcome. Controls corrective-action completion recurrence handling and escalation. Does not rewrite original Nonconformance or CorrectiveAction evidence. Determines whether action may be completed or must be reopened. Required.
      - name: status
        type: string
        enum: CorrectiveActionVerificationStatus
        help: Lifecycle state of verification. Separates preparation evaluation completion and follow-up. Quality governance and audit. COMPLETED records final verification evidence; REOPENED signals additional action is required. Required.
        default: OPEN
      - name: findings
        type: string(4000)
        help: Evidence and observations supporting the verification result. Explains what was checked and why the result was reached. Audit quality review supplier improvement and recurrence analysis. Supports effectiveness decision. Required.
      - name: verified_by
        type: string
        fk: true
        references: Party
        help: Party accountable for performing or approving effectiveness verification. Establishes accountability for the verification decision. Audit trail quality governance and segregation of duties. Provides verification authority. Required.
      - name: nonconformance_id
        type: string
        fk: true
        optional: true
        help: Nonconformance for which the action was established. Connects effectiveness evidence to the original quality deviation. Issue closure and recurrence analysis. Provides context for determining whether the underlying issue is controlled.
      - name: corrective_action_id
        type: string
        fk: true
        help: Corrective action being evaluated. Connects verification evidence to the action whose implementation is assessed. CAPA closure audit and quality reporting. Verification result controls whether action can be completed.
  - name: ReturnDisposition
    help: Provides the controlled bridge between a returned quantity, its operational outcome, quality evidence and the physical inventory execution. ReturnDisposition decides what happens to returned material. InventoryMovement records what physically happened. CreditNote or SupplierCreditNote records any separate financial consequence. Reverse logistics, warehouse operations, quality, customer returns, supplier returns, inventory control, claims, audit and reconciliation. CustomerReturn/SupplierReturn establish reverse transactions; their lines establish quantities; QualityInspection supplies quality evidence; InventoryMovement records physical effects; CreditNote and SupplierCreditNote record financial adjustments. Return received → inspection where required → disposition authorized → execute attributable InventoryMovement where applicable → update return completion projection → create or release separate financial adjustment when eligible. No financial or inventory effect is inferred merely from authorization. Draft → authorized → executed, with cancellation and exception paths. Historical executed decisions are retained. Changes to return-line eligibility or inspection evidence affecting an unexecuted disposition trigger revalidation. Executed history is corrected through compensating evidence. Five customer-returned units are inspected and dispositioned as three RESTOCK and two QUARANTINE. One disposition records each outcome; InventoryMovement increases unrestricted inventory only for the three restocked units, while the two quarantined units remain unavailable.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the return disposition decision. Identifies one controlled disposition event independently of the return, inspection and resulting inventory or financial effects. Used for reverse logistics, inventory, quality, audit and reconciliation. CustomerReturn or SupplierReturn supplies the returned-material context; QualityInspection may supply quality evidence; InventoryMovement records physical consequence. Carries the disposition decision into execution and completion. Required.
      - name: disposition_code
        type: string
        enum: ReturnDispositionDispositionCode
        help: Controlled operational outcome selected for returned material. Defines what should happen to the returned quantity. Drives warehouse execution, quality containment and eligibility for inventory availability. The code is a decision, not the inventory transaction itself and not a CreditNote or SupplierCreditNote. Determines which downstream physical workflow is permitted. Required.
      - name: disposition_date
        type: datetime
        help: Timestamp when the disposition became effective. Establishes chronology for the physical return decision. Supports audit, warehouse processing, SLA measurement and reconciliation. Distinct from returnDate, receiptDate and financial adjustment dates. Anchors execution of the disposition. Required.
      - name: quantity
        type: decimal
        help: Quantity covered by this disposition. States how much returned material receives this outcome. Supports partial dispositions and inventory execution. Must reconcile with the related return line quantity and its UnitOfMeasure. Controls the quantity eligible for the resulting InventoryMovement. Required and must be positive.
      - name: status
        type: string
        enum: ReturnDispositionStatus
        help: Lifecycle state of the disposition decision. Indicates whether the decision is proposed, authorized, physically executed, cancelled or exception-managed. Controls whether downstream inventory execution is permitted. Does not replace CustomerReturn, SupplierReturn or QualityInspection status. EXECUTED requires attributable physical evidence where the disposition changes inventory. Required.
        default: AUTHORIZED
      - name: reason_code
        type: string(100)
        optional: true
        help: Business reason supporting the selected disposition. Explains why the returned quantity received the selected operational outcome. Used for quality analysis, supplier/customer disputes and reporting. May derive from return reason or inspection evidence but remains disposition-specific. Supports authorization and exception handling. Optional when another controlled reason source is sufficient.
      - name: nonconformance_id
        type: string
        fk: true
        optional: true
        help: The Nonconformance this ReturnDisposition belongs to.
      - name: quality_inspection_id
        type: string
        fk: true
        optional: true
        help: Quality inspection supporting the disposition decision. Links the operational outcome to quality evidence where inspection is required. Supports release, quarantine, rejection, repair, scrap and return decisions. Provides controlled evidence for disposition authorization.
  - name: CertificateOfAnalysis
    help: Controlled certificate presenting quality evidence for governed material. CertificateOfAnalysis is a released representation of underlying evidence, not a substitute for QualityInspection or QualityMeasurement. Supplier quality, customer documentation, regulated release, shipments, receipts, compliance, audit, and integrations. Inspections and measurements supply evidence; Product and receipt/shipment provide material context. Draft → approved → issued → superseded/void under controlled document history. Changes to open source evidence invalidate draft/approved certificates for revalidation; issued certificates retain historical source references and are corrected by supersession.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the certificate. Identifies one issued quality certificate independently of its document number. Compliance, customer/supplier exchange, audit, and integration. Links certificate representation to source quality evidence. Required.
      - name: certificate_number
        type: string(120)
        unique: true
        help: Business-facing certificate reference. Controlled number used to identify the issued certificate. Documents, search, exchange, and audit. Distinct from inspection and shipment numbers. Required.
      - name: issued_at
        type: datetime
        optional: true
        help: Time the certificate was formally issued. Establishes when the quality statement became externally or operationally effective. Compliance, customer documentation, and audit. Required once status is ISSUED. Optional before issuance.
      - name: status
        type: string
        enum: CertificateOfAnalysisStatus
        help: Lifecycle state of the certificate. Controls whether the certificate is preparatory, approved, issued, replaced, or invalidated. Release and document governance. Status does not alter underlying measurements. Being prepared. Reviewed and approved for issuance. Formally issued. Replaced by a later controlled certificate. Invalidated while retained as history. Required.
        default: DRAFT
