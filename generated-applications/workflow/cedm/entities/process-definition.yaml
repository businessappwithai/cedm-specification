entity:
  name: ProcessDefinition
  namespace: cedm.domain
  kind: workflow_definition
  description: A versioned executable-neutral definition of a business process, its activities, transitions, assignments, controls, and completion semantics.
  ui:
    icon: settings
  identity: {key: processDefinitionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: processDefinitionId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent, system-generated identity of this versioned business process definition.', usage: Generated on creation and never changed; running process instances and activities refer to the definition they were started from through it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the definition is available to start new instances.
        usage: Moved by the process owner; only ACTIVE definitions can be started.
        valueSemantics:
          PENDING: Being designed or awaiting release.
          ACTIVE: Released; new instances can be started from it.
          COMPLETED: Retired from new use after its instances have run their course. A final state.
          CANCELLED: Abandoned before release. A final state.
    - name: code
      type: string
      required: true
      maxLength: 40
      help:
        summary: The code of the process, the same for all its versions, such as SUP-ONB.
        usage: Instances and reports refer to the process by it.
        relationshipContext: Unique together with the version.
    - name: definitionVersion
      type: integer
      required: true
      default: 1
      help:
        summary: The version number of this process definition, rising with each published change.
        usage: Increased by the process designer when a revised definition is published.
        relationshipContext: Running instances keep the version they started on.
    - name: name
      type: string
      required: true
      maxLength: 150
      help:
        summary: The name of the process, such as "Supplier onboarding".
        usage: Shown when starting an instance.
        relationshipContext: The same across versions.
    - name: description
      type: text
      required: false
      help:
        summary: What the process does and when it is used.
        usage: Read by the people who start and work in the process.
        relationshipContext: Free text.
    - name: definitionFormat
      type: enum
      required: true
      default: BPMN
      values:
        - BPMN
        - STATE_MACHINE
        - CHECKLIST
      help:
        summary: The notation in which the process steps are written, which tells the engine how to run them.
        usage: Chosen when the definition is created and read together with the definition content.
        relationshipContext: Changing it means rewriting the content.
        valueSemantics:
          BPMN: Business Process Model and Notation, a flow diagram with branches and parallel paths.
          STATE_MACHINE: A set of states and the allowed moves between them.
          CHECKLIST: An ordered list of steps without any branching.
    - name: definitionContent
      type: text
      required: false
      help:
        summary: The process itself, in the chosen notation.
        usage: Edited by the process owner; read by the engine.
        relationshipContext: Not changed after publication.
    - name: targetDurationHours
      type: integer
      required: false
      help:
        summary: How long an instance should take, in working hours.
        usage: Instances taking longer are flagged.
        relationshipContext: Measured from start to completion.
    - name: publishedAt
      type: datetime
      required: false
      help:
        summary: The date and time this version was released for use by new process instances.
        usage: Stamped when the designer publishes the version; drafts have no value.
        relationshipContext: Present only once published.
  relationships:
    - name: businessProcess
      target: BusinessProcess
      cardinality: 0..1
      ownership: reference
      help:
        summary: The business process this definition implements.
        usage: Linked so the process landscape shows which processes are automated.
        cardinalityMeaning: One per definition.
        context: A business process may have several definitions over time.
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for the process design.
        usage: Approves changes and publishes versions.
        cardinalityMeaning: One per definition.
        context: Receives reports on instance durations.
  invariants:
    - {id: PROCESS-DEFINITION-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Process Definition Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a process definition is ended"
      description: "When a process definition is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-DEFINITION-FOLLOW-UP-{{id}}"
              name: "Follow up on process definition {{id}}"
              description: "Process definition {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: 'A versioned definition of a business process, independent of the engine that runs it: its activities, transitions, assignments, controls and what counts as complete.'
    businessMeaning: Before a process can be run, it has to be described. The definition states the steps and rules once, so every run behaves the same way and a change to the process is a new version rather than an edit of the old one.
    usage: Designed by process owners; activated for use; read by the workflow engine when it starts new instances.
    relationshipContext: Each ProcessInstance is an execution of a process definition at a particular version.
    lifecycle: A definition is pending while being designed, active when released, completed when no longer used for new instances, or cancelled if abandoned. State changes keep an auditable history and cannot duplicate effects.
    example: The "Purchase approval" process, version 4, with steps for request, manager approval, budget check and order.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-DEFINITION}
