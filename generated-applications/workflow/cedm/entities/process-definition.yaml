entity:
  name: ProcessDefinition
  namespace: cedm.domain
  kind: workflow_definition
  description: A versioned executable-neutral definition of a business process, its activities, transitions, assignments, controls, and completion semantics.
  ui:
    icon: settings
  identity: {key: processDefinitionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: processDefinitionId, type: uuid, required: true, immutable: true, help: {summary: The identity of the process definition., usage: Generated on creation; instances refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the definition is available to start new instances.
        usage: Moved by the process owner; only ACTIVE definitions can be started.
        valueSemantics:
          PENDING: Being designed or awaiting release.
          ACTIVE: Released; new instances can be started from it.
          COMPLETED: Retired from new use after its instances have run their course. A final state.
          CANCELLED: Abandoned before release. A final state.
  relationships: []
  invariants:
    - {id: PROCESS-DEFINITION-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Process Definition Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a process definition is ended"
      description: "When a process definition is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-DEFINITION-FOLLOW-UP-{{id}}"
              name: "Follow up on process definition {{id}}"
              description: "Process definition {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: 'A versioned definition of a business process, independent of the engine that runs it: its activities, transitions, assignments, controls and what counts as complete.'
    businessMeaning: Before a process can be run, it has to be described. The definition states the steps and rules once, so every run behaves the same way and a change to the process is a new version rather than an edit of the old one.
    usage: Designed by process owners; activated for use; read by the workflow engine when it starts new instances.
    relationshipContext: Each ProcessInstance is an execution of a process definition at a particular version.
    lifecycle: A definition is pending while being designed, active when released, completed when no longer used for new instances, or cancelled if abandoned. State changes keep an auditable history and cannot duplicate effects.
    example: The "Purchase approval" process, version 4, with steps for request, manager approval, budget check and order.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-DEFINITION}
