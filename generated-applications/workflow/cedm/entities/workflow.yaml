entity:
  name: Workflow
  namespace: cedm.domain
  kind: process_definition_entity
  description: A machine-executable or human-executable orchestration definition for coordinating business activities and decisions.
  ui:
    icon: settings
  identity:
    key: workflowId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: workflowId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the workflow, constant for its life.
        usage: Generated on creation; runs and tasks refer to it.
        relationshipContext: Referenced by the tasks it creates.
    - name: code
      type: string
      required: true
      maxLength: 100
      unique: true
      help:
        summary: The code of the workflow, such as WF-PO-APPROVAL.
        usage: Unique; used when a workflow is started.
        relationshipContext: Read with the version.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the workflow.
        usage: Shown in lists and on tasks.
        relationshipContext: Read by process owners.
    - name: workflowVersion
      type: string
      required: true
      default: '1.0'
      maxLength: 30
      help:
        usage: Increased when the workflow is changed; started runs keep their version.
        relationshipContext: Read with the code.
        summary: Captures the business meaning of version for the Workflow. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
    - name: executionType
      type: enum
      required: true
      values:
        - HUMAN
        - AUTOMATED
        - HYBRID
      help:
        summary: Who carries out the steps.
        usage: Chosen when designed.
        relationshipContext: Decides whether tasks go to people or run by themselves.
        valueSemantics:
          HUMAN: Steps are done by people.
          AUTOMATED: Steps run without a person.
          HYBRID: A mix of both.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        valueSemantics:
          DRAFT: Being designed; it cannot be started and may be changed freely.
          ACTIVE: Published; new runs may be started and its version is fixed.
          SUSPENDED: Paused; no new runs start, and runs already under way continue.
          RETIRED: Replaced or withdrawn; kept so earlier runs can still be explained. A final state.
        summary: Whether the workflow can be started.
        usage: Starts as DRAFT; set by process owners.
        relationshipContext: Only active workflows start new runs.
    - name: definitionFormat
      type: enum
      required: false
      values:
        - CEDM
        - BPMN
        - STATE_MACHINE
        - OTHER
      help:
        summary: The notation the definition is written in, which decides how the system reads and checks it.
        valueSemantics:
          CEDM: Written in the CEDM notation used across the library.
          BPMN: Written as a business process diagram that analysts can read.
          STATE_MACHINE: Written as states and the transitions between them.
          OTHER: Written in a notation not listed here.
        usage: Chosen when designed.
        relationshipContext: Decides how the definition is read.
    - name: definition
      type: object
      required: false
      description: Structured workflow definition interpreted by a workflow engine.
      help:
        summary: 'The definition itself: its steps, rules and routing.'
        usage: Edited while a draft; fixed once active.
        relationshipContext: Must suit the declared format.
  relationships:
    - name: businessProcess
      target: BusinessProcess
      cardinality: 0..1
      ownership: reference
      help:
        summary: The business process the workflow carries out.
        usage: Chosen when it implements a described process.
        cardinalityMeaning: At most one process.
        context: Links the executable design to the described process.
    - name: tasks
      target: Task
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The tasks that make up the workflow.
        usage: Read to see the steps.
        cardinalityMeaning: Any number of tasks.
        context: Tasks belong to the workflow.
  invariants:
    - id: WORKFLOW-001
      rule: A workflow cannot be ACTIVE unless its definition is valid for the declared definitionFormat.
    - id: WORKFLOW-002
      rule: A workflow version is immutable once activated; a new version requires a new workflow definition or version.
  lifecycle:
    title: Workflow Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A definition of how business activities and decisions are coordinated, run by people, by the system or by both.
    businessMeaning: A workflow is the agreed route a piece of work takes, such as an approval chain. Defining it once makes the process repeatable and lets each run be tracked, and a new version replaces it without disturbing runs already under way.
    usage: Designed by process owners; started by events or people; read by managers to track work.
    relationshipContext: A workflow may implement a business process and is made of tasks.
    lifecycle: A workflow is drafted, active while it can be started, may be suspended, and is retired when replaced. Retired is final. A version is fixed once active.
    example: The "Purchase approval" workflow routes orders over a threshold to the finance manager.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-WORKFLOW
