entity:
  name: ProcessInstance
  namespace: cedm.domain
  kind: workflow_transaction
  description: A governed execution instance of a ProcessDefinition preserving the effective process version, business context, state, and audit history.
  ui:
    icon: file-text
  identity: {key: processInstanceId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: processInstanceId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of ProcessInstance., businessMeaning: Identifies one governed ProcessInstance record independently of mutable status., usage: "Workflow, authorization, integration and audit.", relationshipContext: Referenced by related enterprise processes., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: Governed lifecycle state of ProcessInstance., businessMeaning: Indicates current workflow/control usability., usage: Execution and audit., relationshipContext: Terminal history is retained., valueSemantics: {PENDING: Awaiting activation or decision., ACTIVE: Currently effective or executing., COMPLETED: Successfully concluded., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships: []
  invariants:
  - {id: PROCESS-INSTANCE-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Process Instance Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a process instance is ended"
      description: "When a process instance is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-FOLLOW-UP-{{id}}"
              name: "Follow up on process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a process instance is done"
      description: "When a process instance is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-COMPLETED-{{id}}"
              name: "Confirm process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A governed execution instance of a ProcessDefinition preserving the effective process version, business context, state, and audit history.
    purpose: Provide implementation-neutral workflow or authorization semantics reusable across CEDM domains.
    businessMeaning: A governed execution instance of a ProcessDefinition preserving the effective process version, business context, state, and audit history.
    whenUsed: Used when enterprise work requires explicit responsibility, state, authorization, or control evidence.
    howItRelates: Connects to business objects and workflow participants without replacing their domain transaction history.
    lifecycleUsage: Progresses through governed states with immutable audit evidence for completed or cancelled work.
    commonProcesses: Workflow orchestration, approval, assignment, escalation, access governance, and audit.
    commonExamples: Cross-domain enterprise process control.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-INSTANCE}
