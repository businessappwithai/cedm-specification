entity:
  name: ProcessInstance
  namespace: cedm.domain
  kind: workflow_transaction
  description: A governed execution instance of a ProcessDefinition preserving the effective process version, business context, state, and audit history.
  ui:
    icon: file-text
  identity: {key: processInstanceId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: processInstanceId, type: uuid, required: true, immutable: true, help: {summary: The identity of the process instance., usage: Generated when the process starts; tasks and audit entries refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where this one run of a business process stands, from created through running to finished or stopped.
        usage: Moved by the workflow engine and by users who start or cancel the run; completed and cancelled runs are final and keep their history.
        valueSemantics:
          PENDING: Created but not yet running.
          ACTIVE: Running; steps are being executed.
          COMPLETED: Finished. A final state.
          CANCELLED: Stopped before it finished. A final state.
    - name: instanceNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The unique reference for one run of a process, quoted when tracking or investigating it.
        usage: Assigned by the engine when the instance starts and used in monitoring screens and audit trails.
        relationshipContext: No two instances share a number.
    - name: definitionVersion
      type: integer
      required: true
      help:
        summary: The version of the process definition that this instance is following.
        usage: Fixed by the engine when the instance starts, so the run is audited against the rules it began with.
        relationshipContext: Publishing a later version does not change a running instance.
    - name: recordType
      type: string
      required: false
      maxLength: 100
      help:
        summary: The kind of record the instance is for, such as "Supplier".
        usage: Set when the instance starts.
        relationshipContext: Read with the record reference.
    - name: recordReference
      type: string
      required: false
      maxLength: 100
      help:
        summary: The reference of the record the instance is for.
        usage: Lets users open the case's record.
        relationshipContext: One record may have several instances of different processes.
    - name: currentStep
      type: string
      required: false
      maxLength: 150
      help:
        summary: The step the instance is at now.
        usage: Updated by the engine; shown in monitoring.
        relationshipContext: Empty once finished.
    - name: startedAt
      type: datetime
      required: true
      help:
        summary: The date and time the process run began.
        usage: Set automatically by the engine when the instance starts; durations and overdue checks measure from it.
        relationshipContext: Durations are measured from this time.
    - name: completedAt
      type: datetime
      required: false
      help:
        summary: The date and time the process run finished, whether it succeeded or was cancelled.
        usage: Set by the engine when the last step ends or the run is stopped; empty while still running.
        relationshipContext: Present only once finished.
    - name: dueAt
      type: datetime
      required: false
      help:
        summary: The deadline by which the process run should be completed.
        usage: Calculated at start from the definition's target duration so owners can see which runs are late.
        relationshipContext: Running instances past this time are overdue.
    - name: failureReason
      type: text
      required: false
      help:
        summary: What stopped the instance.
        usage: Recorded when it fails; read by the administrator who restarts it.
        relationshipContext: Present only on failed instances.
  relationships:
    - name: processDefinition
      target: ProcessDefinition
      cardinality: "1"
      ownership: reference
      help:
        summary: The process the instance runs.
        usage: Chosen when starting it.
        cardinalityMeaning: Every instance runs exactly one definition.
        context: The definition's version at start is copied to the instance.
    - name: startedBy
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: Who started the instance; empty when an event started it.
        usage: Recorded at start.
        cardinalityMeaning: One per instance.
        context: Told when the instance finishes.
  invariants:
    - {id: PROCESS-INSTANCE-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
    - {id: PROCESS-INSTANCE-EXE-001, rule: "A process instance that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the process instance is completed."}
  lifecycle:
    title: Process Instance Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a process instance is ended"
      description: "When a process instance is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-FOLLOW-UP-{{id}}"
              name: "Follow up on process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a process instance is done"
      description: "When a process instance is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-COMPLETED-{{id}}"
              name: "Confirm process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: One execution of a process definition, keeping the process version that applied, the business context, the state and the audit history.
    businessMeaning: Each time a business process runs, such as one purchase approval, the instance records how far it has got and what happened, so work can be tracked, resumed and audited.
    usage: Created when a process starts; updated as steps complete; read by workers, managers and auditors.
    relationshipContext: An instance runs a ProcessDefinition, and works on the records it was started for.
    lifecycle: An instance is pending when created, active while running, and ends completed or cancelled. State changes keep auditable history and cannot duplicate effects.
    example: The approval of purchase request PR-4417, started on Monday and completed after two approvals on Wednesday.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-INSTANCE}
