entity:
  name: MediaContent
  namespace: cedm.domain
  kind: media_entity
  description: A digital or physical media work managed for creation, licensing, publication, or distribution.
  ui:
    icon: image
  identity:
    key: mediaContentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: mediaContentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the work.
        usage: Generated on creation; rights and publications refer to it.
    - name: contentCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The catalogue code of the work.
        usage: Unique; assigned by the content team and used by distributors and royalty systems.
    - name: title
      type: string
      required: true
      maxLength: 500
      help:
        summary: The title of the work.
        usage: Shown on publications and in catalogues; can be changed without losing the work's identity.
    - name: contentType
      type: enum
      required: true
      values:
        - VIDEO
        - AUDIO
        - IMAGE
        - ARTICLE
        - BOOK
        - PODCAST
        - GAME
        - OTHER
      help:
        summary: The form of the work.
        usage: Chosen when the work is registered; decides workflows, formats and royalty rules.
        valueSemantics:
          VIDEO: A film, series or clip.
          AUDIO: Music or spoken-word audio.
          IMAGE: A photograph or illustration.
          ARTICLE: A written article.
          BOOK: A book or e-book.
          PODCAST: A podcast episode or series.
          GAME: A game.
          OTHER: Any other kind of work.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - PRODUCED
        - PUBLISHED
        - ARCHIVED
        - RETIRED
      help:
        summary: Where the work is in its life.
        usage: Moved by the content team; only PUBLISHED works are shown to audiences.
        valueSemantics:
          DRAFT: Being created.
          PRODUCED: Finished but not yet released.
          PUBLISHED: Released to its audience.
          ARCHIVED: Kept but no longer promoted.
          RETIRED: Withdrawn from distribution. A final state.
  relationships:
    - name: owner
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that owns the work.
        usage: Set at registration.
        cardinalityMeaning: At most one owner; works with shared or unclear ownership may have none recorded.
        workflowRole: Determines who may license and who is paid.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents that support the work, such as scripts and contracts.
        usage: Attached during production and licensing.
        cardinalityMeaning: Any number of documents.
        workflowRole: Provide the paper trail for rights and approvals.
    - name: rights
      target: MediaRight
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The rights and licences that apply to the work.
        usage: Checked before publication or licensing.
        cardinalityMeaning: Any number of rights, such as one for each territory and medium.
        workflowRole: Publication is allowed only within these rights.
  lifecycle:
    title: Media Content Lifecycle
    attribute: status
    states: [DRAFT, PRODUCED, PUBLISHED, ARCHIVED, RETIRED]
    initial: DRAFT
    terminal: [ARCHIVED, RETIRED]
    transitions:
      - {from: DRAFT, to: PRODUCED, action: mark_produced}
      - {from: PRODUCED, to: PUBLISHED, action: publish}
      - {from: PUBLISHED, to: ARCHIVED, action: archive}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: PRODUCED, to: RETIRED, action: retire}
      - {from: PUBLISHED, to: RETIRED, action: retire}
  help:
    summary: A digital or physical media work that is managed for creation, licensing, publication or distribution.
    businessMeaning: Media businesses live on content and the rights to it. This record identifies each work, its type and its stage, and ties it to the rights that allow it to be used.
    usage: Created when a work is commissioned or acquired; moved through production and publication; read by publishing, licensing and finance.
    relationshipContext: A work is owned by an Organization, supported by Documents and licensed through MediaRights.
    lifecycle: A work is drafted, produced, published, and then archived or retired. Rights and history remain after publication ends.
    example: A documentary film, produced in 2025 and published on the streaming platform in 2026.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-CONTENT
