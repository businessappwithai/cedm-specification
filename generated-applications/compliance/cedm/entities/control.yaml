entity:
  name: Control
  namespace: cedm.domain
  kind: governance_entity
  description: A policy, procedure, mechanism, or activity designed to prevent, detect, or reduce a business risk.
  ui:
    icon: sliders-horizontal
  identity:
    key: controlId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: controlId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the control.
        usage: Generated on creation; tests, findings and risk links refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference by which the control is cited in risk registers and audits.
        usage: Unique; assigned when the control is defined.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The short name of the control.
        usage: Shown in registers and test plans.
    - name: description
      type: string
      required: true
      maxLength: 4000
      help:
        summary: A full description of what the control does and how it operates.
        usage: Written by the control owner; read by those who test or rely on the control.
    - name: controlType
      type: enum
      required: true
      values:
        - PREVENTIVE
        - DETECTIVE
        - CORRECTIVE
        - DIRECTIVE
      help:
        summary: How the control acts on a risk.
        usage: Chosen when the control is defined; auditors use it to judge whether coverage is balanced.
        valueSemantics:
          PREVENTIVE: Stops a risk event from happening.
          DETECTIVE: Finds a risk event after it has happened.
          CORRECTIVE: Limits damage and restores normal operation after an event.
          DIRECTIVE: Tells people what they must or must not do, such as a policy or procedure.
    - name: frequency
      type: enum
      required: true
      values:
        - CONTINUOUS
        - DAILY
        - WEEKLY
        - MONTHLY
        - QUARTERLY
        - ANNUAL
        - EVENT_DRIVEN
        - AD_HOC
      help:
        summary: How often the control operates.
        usage: Set by the control owner; testers use it to decide how many occurrences to sample.
        valueSemantics:
          CONTINUOUS: Operates all the time, for example an automated system check.
          DAILY: Performed every day.
          WEEKLY: Performed every week.
          MONTHLY: Performed every month.
          QUARTERLY: Performed every quarter.
          ANNUAL: Performed once a year.
          EVENT_DRIVEN: Performed when a particular event occurs.
          AD_HOC: Performed as needed, with no fixed schedule.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the control is being designed, in operation or ended.
        usage: Set by the control owner; only ACTIVE controls are tested and relied on.
        valueSemantics:
          DRAFT: Being designed; not yet operating.
          ACTIVE: Operating and relied upon.
          INACTIVE: Not currently operating, but may be reinstated.
          RETIRED: Permanently ended; kept for history.
  relationships:
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person or party accountable for the control operating.
        usage: Set when the control is defined; receives test findings.
        cardinalityMeaning: At most one owner; a control without an owner is an assurance gap.
        workflowRole: Identifies who answers for the control.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation in which the control operates.
        usage: Set so controls can be scoped and tested per legal entity.
        cardinalityMeaning: At most one organisation.
        workflowRole: Scopes assurance work.
    - name: risks
      target: Risk
      cardinality: 0..*
      ownership: reference
      help:
        summary: The risks the control mitigates.
        usage: Linked when the control is designed against a risk; read to see how well each risk is covered.
        cardinalityMeaning: Any number of risks; a control may address several.
        workflowRole: Shows risk coverage.
    - name: policies
      target: Policy
      cardinality: 0..*
      ownership: reference
      help:
        summary: The policies the control implements.
        usage: Linked to show how a policy is put into practice.
        cardinalityMeaning: Any number of policies.
        workflowRole: Traces policy to operating control.
  lifecycle:
    title: Control Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A policy, procedure, mechanism or activity designed to prevent, detect or reduce a business risk.
    businessMeaning: Controls are what the organisation actually does about its risks. Naming each control, saying how often it runs and who owns it makes assurance possible, because an auditor can test the control rather than rely on assurances.
    usage: Defined by risk and compliance teams; assigned an owner; tested periodically; read by auditors and management.
    relationshipContext: A control is owned by a Party, belongs to an Organization, mitigates Risks and implements Policies.
    lifecycle: A control is drafted, becomes active when put into operation, can be made inactive, and is retired when no longer needed.
    example: Monthly bank reconciliation review by the financial controller, a detective control against misstatement of cash.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTROL
