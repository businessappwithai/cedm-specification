entity:
  name: LossEvent
  namespace: cedm.domain
  kind: risk_loss_event
  description: A governed record of realized financial, operational, physical, legal, or other loss attributable to a risk or incident.
  ui:
    icon: activity
  identity: {key: lossEventId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: lossEventId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of the recorded loss, constant through reassessment and recovery.', usage: 'Generated when the loss is recorded; recoveries, incident links and risk analyses refer to it.'}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the loss was suffered., usage: Set from the incident; used to place the loss in a reporting period.}}
  relationships: []
  invariants:
    - {id: LOSS-EVENT-001, rule: "Finalized evidence and effective history must be preserved; correction, reassessment, settlement or supersession must be explicit."}
  help:
    summary: A record of realised financial, operational, physical, legal or other loss that can be attributed to a risk or incident.
    businessMeaning: Risk management is judged by outcomes. A loss event records what was actually lost, so risk estimates can be tested against reality and insurance and recovery claims can be supported.
    usage: Recorded after an incident when the loss is known; read by risk managers, finance and insurers.
    relationshipContext: A loss event is linked to the risk it materialised and to the incident that caused it.
    lifecycle: Finalised evidence and effective history are preserved; reassessments and recoveries are separate, explicit records.
    example: A 120,000 loss from a warehouse fire, linked to the fire incident and the property damage risk.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-LOSS-EVENT}
