entity:
  name: Policy
  namespace: cedm.domain
  kind: governance_entity
  description: A formally defined rule, principle, or requirement governing business behavior or decision-making.
  ui:
    icon: shield
  identity:
    key: policyId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: policyId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the policy.
        usage: Generated on creation; controls and documents refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference of the policy, such as POL-SEC-001.
        usage: Unique; used in audits and training.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The title of the policy.
        usage: Shown in policy libraries.
    - name: description
      type: string
      required: false
      maxLength: 5000
      help:
        summary: A summary of the policy's purpose and scope.
        usage: Written by the owner; read by staff.
    - name: policyType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The area the policy covers, such as security, procurement or conduct.
        usage: Chosen at creation; groups policies for review.
    - name: policyVersion
      type: string
      required: true
      default: '1.0'
      maxLength: 30
      help:
        summary: The revision of the policy text.
        usage: Incremented at each revision.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - APPROVED
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: Where the policy stands.
        usage: Moved by the owner and approvers.
        valueSemantics:
          DRAFT: Being written.
          APPROVED: Approved but not yet in force.
          ACTIVE: In force.
          SUSPENDED: Temporarily not applied.
          RETIRED: Withdrawn. A final state.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The first date the policy applies.
        usage: Set at approval.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The last date the policy applies.
        usage: Set when superseded; not before the start date.
  relationships:
    - name: owner
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation accountable for the policy.
        usage: Set at creation.
        cardinalityMeaning: At most one owner.
        workflowRole: Gives accountability for review.
    - name: controls
      target: Control
      cardinality: 0..*
      ownership: reference
      help:
        summary: The controls that implement the policy.
        usage: Linked as controls are designed.
        cardinalityMeaning: Any number of controls.
        workflowRole: Show how the policy is put into practice.
    - name: document
      target: Document
      cardinality: 0..1
      ownership: reference
      help:
        summary: The document containing the policy text.
        usage: Attached on approval.
        cardinalityMeaning: At most one document.
        workflowRole: Provides the authoritative text.
  invariants:
    - id: POLICY-001
      rule: effectiveTo must not precede effectiveFrom.
    - id: POLICY-002
      rule: only an APPROVED policy version may become ACTIVE.
    - {id: POLICY-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Policy Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: ACTIVE, action: activate}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A formally defined rule, principle or requirement that governs business behaviour or decision-making.
    businessMeaning: Policies state what the organisation has decided to do. Holding them as versioned records shows which version applied when, who owns it and which controls put it into practice.
    usage: Written by the policy owner; approved; made active; reviewed periodically; read by staff and auditors.
    relationshipContext: A policy is owned by an Organization, implemented by Controls and evidenced by a Document.
    lifecycle: A policy is drafted, approved, then made active. It can be suspended and resumed, and is retired when superseded. Only an approved version may become active.
    example: The Information Security Policy version 3.0, approved by the board and active from 1 January.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-POLICY
