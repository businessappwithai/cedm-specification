entity:
  name: AuditCase
  namespace: cedm.domain
  kind: audit_case
  description: A governed audit investigation or review grouping scope, evidence, findings, actions, and conclusions.
  ui:
    icon: scroll-text
  identity: {key: auditCaseId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: auditCaseId, type: uuid, required: true, immutable: true, help: {summary: The identity of the audit case., usage: 'Generated on opening; findings, evidence and actions refer to the case through it.'}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the case took effect as the governing record of the review., usage: Set when the case is opened or a revision takes effect; used to order cases and show which version applied at a given time.}}
  relationships: []
  invariants:
    - {id: AUDIT-CASE-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An audit investigation or review that groups its scope, evidence, findings, actions and conclusions in one place.
    businessMeaning: An audit case is the container for one piece of assurance work. It keeps everything an auditor gathered and concluded together, so the outcome can be defended later and follow-up actions can be traced to their source.
    usage: Opened when an audit, review or investigation starts; updated as evidence and findings are added; read by auditors, management and regulators when the case is reviewed.
    relationshipContext: Evidence, findings and corrective actions attach to the case; the audit events that prove the underlying activity are referenced as evidence.
    lifecycle: Finalised evidence and conclusions are preserved. Reassessment or correction is recorded explicitly, never by silently rewriting the case.
    example: An internal audit of supplier payment controls for the third quarter, with sampled payments as evidence and three findings raised.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-AUDIT-CASE}
