entity:
  name: AuditEvent
  namespace: cedm.domain
  kind: audit_event
  description: An immutable evidence record describing a significant governed action, state change, access, decision, or control event.
  ui:
    icon: activity
  identity: {key: auditEventId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: auditEventId, type: uuid, required: true, immutable: true, help: {summary: The identity of the audit event., usage: Generated when the event is written; cases and investigations cite events by it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the audited action took place., usage: 'Set from the time of the action, not the time of writing; events are ordered by it when reconstructing a sequence.'}}
    - name: eventType
      type: string
      required: true
      maxLength: 100
      help:
        summary: What kind of action happened, such as "Record updated", "Sign-in failed" or "Approval granted".
        usage: Set by the application; investigators filter the trail by it.
        relationshipContext: Each kind of action is recorded under one consistent name.
    - name: category
      type: enum
      required: true
      default: DATA_CHANGE
      values:
        - AUTHENTICATION
        - AUTHORIZATION
        - DATA_CHANGE
        - DATA_ACCESS
        - APPROVAL
        - CONFIGURATION
        - SYSTEM
      help:
        summary: The broad class of the action.
        usage: Used to route events to the people who review them and to set retention periods.
        relationshipContext: Security events are kept longer and reviewed more often.
        valueSemantics:
          AUTHENTICATION: Signing in or out, or a failed attempt.
          AUTHORIZATION: Access given, refused or changed.
          DATA_CHANGE: A business record created, changed or deleted.
          DATA_ACCESS: A sensitive record read or exported.
          APPROVAL: A decision recorded in an approval.
          CONFIGURATION: A change to settings, rules or the application dictionary.
          SYSTEM: An action taken by the system itself, such as a scheduled job.
    - name: action
      type: string
      required: true
      maxLength: 100
      help:
        summary: The specific action, such as create, update, delete, approve or export.
        usage: Set by the application.
        relationshipContext: Read with the event type and the record touched.
    - name: occurredAt
      type: datetime
      required: true
      help:
        summary: When the action happened, to the second, in UTC.
        usage: Set by the application at the moment of the action; the trail is read in this order.
        relationshipContext: Never edited.
    - name: recordType
      type: string
      required: false
      maxLength: 100
      help:
        summary: The kind of record acted on, such as "Purchase order".
        usage: Set by the application; empty for actions that touch no record, such as signing in.
        relationshipContext: Read with the record identifier.
    - name: recordId
      type: string
      required: false
      maxLength: 64
      help:
        summary: The identifier of the record acted on.
        usage: Lets an investigator list every action ever taken on one record.
        relationshipContext: Together with the record type it identifies the record.
    - name: outcome
      type: enum
      required: true
      default: SUCCESS
      values:
        - SUCCESS
        - FAILURE
        - DENIED
      help:
        summary: Whether the action succeeded.
        usage: Failed actions matter as much as successful ones, for example repeated failed sign-ins.
        relationshipContext: A denied action records the attempt even though nothing changed.
        valueSemantics:
          SUCCESS: The action was carried out.
          FAILURE: The action was attempted and failed for a technical or validation reason.
          DENIED: The action was refused because the actor lacked the right to do it.
    - name: details
      type: text
      required: false
      help:
        summary: What changed — for a change, the fields with their old and new values.
        usage: Written by the application; read by investigators to see exactly what was done.
        relationshipContext: Sensitive values are masked rather than recorded in clear.
    - name: sourceAddress
      type: string
      required: false
      maxLength: 64
      help:
        summary: The network address the action came from.
        usage: Recorded by the application; used in security investigations.
        relationshipContext: Treated as personal data in some jurisdictions.
    - name: actorName
      type: string
      required: false
      maxLength: 200
      help:
        summary: The name of the actor as it was at the time of the action.
        usage: Kept so that the trail still reads correctly after the user is renamed or removed.
        relationshipContext: For system actions it names the job or integration.
  relationships:
    - name: actor
      target: User
      cardinality: 0..1
      ownership: reference
      help:
        summary: The user who carried out the action.
        usage: Set by the application from the signed-in user; empty for actions by the system itself.
        cardinalityMeaning: One actor per event.
        context: The actor's name is also copied onto the event so the trail survives changes to the user.
    - name: auditCase
      target: AuditCase
      cardinality: 0..1
      ownership: reference
      help:
        summary: The audit case that cites this event as evidence.
        usage: Linked by an auditor gathering evidence; most events belong to no case.
        cardinalityMeaning: At most one case per event.
        context: Linking an event to a case does not change the event itself.
  invariants:
    - {id: AUDIT-EVENT-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An immutable record of a significant action, state change, access, decision or control event.
    businessMeaning: 'Audit events are the evidence that something happened: who did what, to what, and when. They cannot be edited, which is exactly what makes them usable as proof.'
    usage: Written automatically whenever a governed action occurs; read by auditors, security teams and investigations to reconstruct what took place.
    relationshipContext: Events point to the record or action they describe and the actor responsible; audit cases cite them as evidence.
    lifecycle: An event is final the moment it is written. A mistake is explained by a later event, never by changing the original.
    example: Event recorded when a finance manager approved a payment run, showing the approver, the time and the run approved.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-AUDIT-EVENT}
