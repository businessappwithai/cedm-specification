entity:
  name: Filing
  namespace: cedm.domain
  kind: legal_filing
  description: A governed submission or filing made to a court, regulator, registry, authority, or other external body with immutable submission evidence.
  ui:
    icon: table
  identity: {key: filingId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: filingId, type: uuid, required: true, immutable: true, help: {summary: The identity of the filing., usage: Generated on creation.}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the filing was submitted., usage: Taken from the receipt; deadlines are checked against it.}}
  relationships: []
  invariants:
    - {id: FILING-001, rule: "Finalized evidence and effective history must be preserved; correction, reassessment, settlement or supersession must be explicit."}
  help:
    summary: A submission made to a court, regulator, registry or authority, with immutable evidence of what was submitted.
    businessMeaning: Legal and regulatory duties are met by filing. The record shows what was filed, with whom and when, which is the proof that a duty was met on time.
    usage: Created when a document is submitted; read when proving compliance or responding to the authority.
    relationshipContext: A filing is directed to an external body and supported by documents.
    lifecycle: Finalised evidence is preserved; corrections or supersession are explicit filings.
    example: Annual accounts filed with the company registry on 28 June.
    commonProcesses: Risk assessment, incident management, legal matter management, compliance, remediation, filing and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FILING}
