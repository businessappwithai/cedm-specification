entity:
  name: RiskTreatment
  namespace: cedm.domain
  kind: risk_management_entity
  description: A governed treatment or response planned and executed to modify, accept, transfer, avoid, or monitor a Risk.
  ui:
    icon: alert-triangle
  identity:
    key: riskTreatmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: riskTreatmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the treatment, constant for its life.
        usage: Generated on creation; reviews refer to it.
        relationshipContext: Connects this record to its governing Risk context and downstream evidence.
    - name: riskTreatmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The code of the treatment, such as RT-021-1.
        usage: Unique; quoted in risk reviews and audit.
        relationshipContext: Read with the risk code.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the treatment is.
        usage: Starts as DRAFT; moved by the owner.
        valueSemantics:
          DRAFT: Proposed and not yet approved.
          ACTIVE: Approved and being carried out.
          COMPLETED: The action is done. A final state.
          CANCELLED: No longer needed. A final state.
        relationshipContext: Status changes can affect related Risk workflows but never erase historical evidence.
  relationships:
    - name: context
      target: Risk
      cardinality: '1'
      ownership: reference
      help:
        summary: The risk the treatment responds to.
        usage: Chosen when the treatment is created.
        cardinalityMeaning: Exactly one risk; a treatment for two risks is recorded twice.
        context: Keeps the response attached to the risk it addresses.
  invariants:
    - id: RISK-TREATMENT-001
      rule: The governing Risk relationship is required and must reference a valid record.
    - id: RISK-TREATMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: RISK-TREATMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Risk Treatment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a risk treatment is ended"
      description: "When a risk treatment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RISK-TREATMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on risk treatment {{id}}"
              description: "Risk treatment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An action planned and carried out to reduce, accept, transfer, avoid or monitor a risk.
    businessMeaning: A treatment is how the organisation responds to a risk it has assessed. Recording it with an owner and a status shows that each risk has an answer, what that answer is and whether it has been done.
    usage: Raised by the risk owner; carried out by the named people; read by governance and audit.
    relationshipContext: A treatment belongs to exactly one risk and goes with it.
    lifecycle: A treatment is drafted, active while the work is done and completed when finished. It may be cancelled if no longer needed. Completed and cancelled are final.
    example: To treat the supplier concentration risk, qualify a second source by 30 June.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RISK-TREATMENT
