entity:
  name: Trip
  namespace: cedm.domain
  kind: travel_entity
  description: A planned or completed journey involving one or more travelers, locations, bookings, or transport segments.
  ui:
    icon: table
  identity:
    key: tripId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: tripId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the trip, constant for its life.
        usage: Generated on creation; segments and bookings refer to it.
        relationshipContext: Referenced by every segment of the trip.
    - name: tripNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number of the trip, such as TR-2026-077.
        usage: Unique; quoted on expense claims and approvals.
        relationshipContext: Read with the name.
    - name: name
      type: string
      required: false
      maxLength: 300
      help:
        summary: A short descriptive title for the journey, such as the purpose or destination.
        usage: Entered by the traveller or arranger when planning; shown in lists and read by approvers deciding whether to authorise the trip.
        relationshipContext: Read by approvers.
    - name: startDate
      type: date
      required: true
      help:
        summary: The calendar date on which the trip begins, usually the first departure.
        usage: Entered when the trip is planned and required; it must not be later than the end date and drives approval timing and reminders.
        relationshipContext: Not later than the end date.
    - name: endDate
      type: date
      required: false
      help:
        summary: The calendar date on which the trip finishes, usually the day of return.
        usage: Optional while planning; once set it must not be before the start date and it fixes the length of the trip for allowances.
        relationshipContext: Gives the length of the trip.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - BOOKED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the trip is.
        usage: Starts as PLANNED; moved as it is booked and travelled.
        valueSemantics:
          PLANNED: Intended; nothing is booked.
          BOOKED: Travel and accommodation are booked.
          IN_PROGRESS: The traveller is on the journey.
          COMPLETED: The trip is finished. A final state.
          CANCELLED: Called off. A final state.
  relationships:
    - name: traveler
      target: Party
      cardinality: 1..*
      ownership: reference
      help:
        summary: The people travelling.
        usage: Chosen when the trip is planned.
        cardinalityMeaning: At least one traveller.
        context: Decides who needs documents and approvals.
    - name: segments
      target: TripSegment
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The legs of the journey.
        usage: Added as the route is planned.
        cardinalityMeaning: Any number of segments.
        context: Segments belong to the trip and go with it.
    - name: bookings
      target: BusinessTransaction
      cardinality: 0..*
      ownership: reference
      help:
        summary: The bookings made for the trip.
        usage: Linked as tickets and rooms are bought.
        cardinalityMeaning: Any number of bookings.
        context: Link the trip to what was spent.
  invariants:
    - id: TRIP-001
      rule: endDate must not precede startDate.
    - {id: TRIP-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Trip Lifecycle
    attribute: status
    states: [PLANNED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: BOOKED, action: book}
      - {from: BOOKED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: BOOKED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a trip is ended"
      description: "When a trip is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRIP-FOLLOW-UP-{{id}}"
              name: "Follow up on trip {{name}}"
              description: "Trip {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A planned or completed journey made by one or more travellers, made up of transport segments and bookings.
    businessMeaning: A trip groups the legs, travellers and bookings of one journey so the whole can be planned, booked, followed and paid for together, and so expenses and approvals attach to the journey rather than to loose tickets.
    usage: Created by the traveller or a travel arranger; read by approvers, finance and travel support.
    relationshipContext: A trip has one or more travellers, is made of segments and is paid for through bookings.
    lifecycle: A trip is planned, booked, in progress while travelling and completed on return. It may be cancelled before completion. Completed and cancelled are final.
    example: Trip TR-2026-077 takes two engineers from Leeds to Frankfurt by air on 9 March and back on 12 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRIP
