entity:
  name: Carrier
  namespace: cedm.domain
  kind: logistics_party
  description: A governed logistics service provider responsible for transporting shipments, consignments, or loads.
  ui:
    icon: truck
  identity: {key: carrierId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: carrierId, type: uuid, required: true, immutable: true, help: {summary: The identity of the carrier role., usage: Generated on creation; shipments and rates refer to the carrier through it.}}
    - {name: code, type: string, required: false, maxLength: 120, help: {summary: "The carrier's short code, such as the SCAC code used in North American freight.", usage: Entered when the carrier is set up; used on shipping documents and in EDI messages.}}
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name the carrier trades under, as dispatchers and planners know it.
        usage: Shown wherever a carrier is chosen for a booking or consignment.
        relationshipContext: The legal name is held on its party record.
    - name: carrierType
      type: enum
      required: true
      default: ROAD
      values:
        - ROAD
        - PARCEL
        - RAIL
        - OCEAN
        - AIR
        - FORWARDER
      help:
        summary: What kind of transport service the carrier mainly provides, such as road, rail or air.
        usage: Planners filter the carriers they can book by it when choosing for a consignment.
        relationshipContext: A carrier offering several modes is recorded with its main one.
        valueSemantics:
          ROAD: Road haulage, full or part loads.
          PARCEL: Parcel and courier networks.
          RAIL: Rail freight operators moving wagons or containers by train.
          OCEAN: Shipping lines carrying containers or bulk cargo by sea.
          AIR: Airlines and air cargo carriers.
          FORWARDER: A freight forwarder arranging transport with other carriers.
    - name: scac
      type: string
      required: false
      maxLength: 4
      help:
        summary: The Standard Carrier Alpha Code, used in North American and ocean documents.
        usage: Printed on bills of lading and used in EDI.
        relationshipContext: Four letters.
    - name: iataCode
      type: string
      required: false
      maxLength: 3
      help:
        summary: The carrier's two or three character IATA airline code, for air carriers only.
        usage: Printed on air waybills and used to match the carrier in airline schedules.
        relationshipContext: Left empty for carriers that are not airlines.
    - name: insuranceExpiryDate
      type: date
      required: false
      help:
        summary: When the carrier's liability insurance certificate expires.
        usage: Watched so that bookings stop with uninsured carriers.
        relationshipContext: A new certificate must be received before it.
    - name: onTimePercent
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The share of the carrier's deliveries that arrived on time, over the last review period.
        usage: Updated by the carrier scorecard; read when choosing carriers.
        relationshipContext: Between 0 and 100.
    - name: trackingUrlTemplate
      type: string
      required: false
      maxLength: 500
      help:
        summary: The web address for tracking a consignment, with a placeholder for the tracking number.
        usage: Used to link customers and staff straight to the carrier's tracking page.
        relationshipContext: Such as https://track.example.com/?id={tracking}.
    - name: status
      type: enum
      required: true
      default: PROSPECTIVE
      values:
        - PROSPECTIVE
        - APPROVED
        - SUSPENDED
        - INACTIVE
      help:
        summary: Whether the carrier may currently be booked for shipments.
        usage: Moved on by logistics procurement as the carrier is onboarded, approved, suspended or retired.
        relationshipContext: Only approved carriers are offered when booking.
        valueSemantics:
          PROSPECTIVE: Being onboarded and not yet bookable.
          APPROVED: Cleared by procurement and bookable for shipments.
          SUSPENDED: Temporarily not bookable after service or compliance problems.
          INACTIVE: No longer used and kept only for history.
  relationships:
    - {name: party, target: Party, cardinality: '1', ownership: reference, help: {cardinalityMeaning: 'Exactly one party: the carrier role is played by a single legal or natural person.', summary: Canonical party providing carrier service., businessMeaning: Separates logistics role from Party identity., usage: Shipment tendering and performance., workflowRole: Carrier eligibility derives from governed party role/status.}}
  invariants:
    - {id: CARRIER-001, rule: "Lifecycle changes, corrections and retries must preserve historical evidence and must not duplicate downstream commercial, physical or financial effects."}
    - {id: CARRIER-EXE-001, rule: "On Time Percent is a percentage between 0 and 100.", violatedWhen: "on_time_percent != null and (on_time_percent < 0 or on_time_percent > 100)", message: "On Time Percent must be between 0 and 100."}
  help:
    summary: A logistics provider that transports shipments, consignments or loads.
    businessMeaning: Goods usually move on someone else's trucks, ships or planes. A carrier record identifies that provider and gives bookings, tracking and freight invoices a single party to refer to.
    usage: Created when a transport provider is approved for use; selected when shipments are booked; read for service performance and freight costs.
    relationshipContext: A carrier is a Party acting in the transport role; shipments and consignments are assigned to it.
    lifecycle: Changes and retries preserve history, and a carrier's past shipments remain linked to it after it stops being used.
    example: A regional haulage firm engaged for pallet deliveries within the country.
  lifecycle:
    title: Carrier Lifecycle
    attribute: status
    states:
      - PROSPECTIVE
      - APPROVED
      - SUSPENDED
      - INACTIVE
    initial: PROSPECTIVE
    terminal:
      - INACTIVE
    transitions:
      - from: PROSPECTIVE
        to: APPROVED
        action: approve
      - from: APPROVED
        to: SUSPENDED
        action: suspend
      - from: SUSPENDED
        to: APPROVED
        action: reinstate
      - from: APPROVED
        to: INACTIVE
        action: deactivate
      - from: SUSPENDED
        to: INACTIVE
        action: deactivate
      - from: PROSPECTIVE
        to: INACTIVE
        action: reject
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CARRIER}
