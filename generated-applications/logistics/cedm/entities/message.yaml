entity:
  name: Message
  namespace: cedm.domain
  kind: integration_message
  description: A governed integration message envelope preserving payload identity, direction, correlation, processing state, and delivery evidence.
  ui:
    icon: table
  identity: {key: messageId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: messageId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the message, used to detect duplicates.', usage: Generated or taken from the sender; processing uses it to be idempotent.}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the message was created or received., usage: Set by the integration layer; used to order messages and to measure latency.}}
    - name: messageType
      type: string
      required: true
      maxLength: 100
      help:
        summary: What kind of message it is, such as "Sales order", "Despatch advice" or "pain.001 payment batch".
        usage: Set by the integration layer; monitoring groups messages by it.
        relationshipContext: Each type has its own mapping and format.
    - name: direction
      type: enum
      required: true
      default: OUTBOUND
      values:
        - INBOUND
        - OUTBOUND
      help:
        summary: Says whether the business received this message from another system or sent it out.
        usage: Set by the integration layer when the message is created; support staff filter on it when tracing a problem.
        relationshipContext: Received messages are turned into business records, and sent ones come from them.
        valueSemantics:
          INBOUND: Received from an external system and waiting to be turned into business records.
          OUTBOUND: Created by this application and sent to an external system.
    - name: correlationReference
      type: string
      required: false
      maxLength: 100
      help:
        summary: The reference shared by all messages of one business transaction, such as an order number.
        usage: Lets an operator follow an order or a payment run across every message about it.
        relationshipContext: Set from the business record the message concerns.
    - name: externalReference
      type: string
      required: false
      maxLength: 100
      help:
        summary: The identifier the other system gave the message.
        usage: Quoted when asking the partner about a message.
        relationshipContext: Known once the other side has accepted or sent it.
    - name: payload
      type: text
      required: false
      help:
        summary: The content of the message as sent or received.
        usage: Opened by operators investigating a failure.
        relationshipContext: Sensitive content is masked or held encrypted according to policy.
    - name: payloadFormat
      type: string
      required: false
      maxLength: 50
      help:
        summary: The format of the content, such as JSON, XML, EDIFACT or CSV.
        usage: Recorded so that the content can be displayed correctly.
        relationshipContext: Matches the endpoint's data format.
    - name: sentAt
      type: datetime
      required: false
      help:
        summary: The time the message left the application, or arrived if it was received from outside.
        usage: Stamped by the integration layer on transmission; support staff compare it with the acknowledgement time.
        relationshipContext: Message lists are sorted by this time.
    - name: acknowledgedAt
      type: datetime
      required: false
      help:
        summary: When the other side confirmed it had the message.
        usage: Recorded when an acknowledgement arrives.
        relationshipContext: Not every protocol gives one.
    - name: attemptCount
      type: integer
      required: true
      default: 0
      help:
        summary: The number of times the system has tried to deliver or process this message.
        usage: Raised by one on every try, including failed ones; operators watch it to spot messages that keep failing.
        relationshipContext: Once it reaches the configured maximum the message is moved to the dead-letter queue.
    - name: errorDetail
      type: text
      required: false
      help:
        summary: What went wrong on the last failed attempt.
        usage: Read by the operator deciding whether to resend, correct or discard.
        relationshipContext: Present while the message is failing.
    - name: status
      type: enum
      required: true
      default: QUEUED
      values:
        - QUEUED
        - SENT
        - ACKNOWLEDGED
        - FAILED
        - DEAD_LETTERED
        - DISCARDED
      help:
        summary: Where the message is in its delivery.
        usage: Moved on by the integration layer and, for dead letters, by an operator.
        relationshipContext: Failed and dead-lettered messages appear in the monitoring screen.
        valueSemantics:
          QUEUED: Waiting to be sent or processed.
          SENT: Sent, or received and handed over for processing.
          ACKNOWLEDGED: Confirmed by the other side, or processed successfully.
          FAILED: The last attempt failed; it will be retried.
          DEAD_LETTERED: Given up after repeated failures; a person must act.
          DISCARDED: Deliberately not delivered by an operator.
  relationships:
    - name: endpoint
      target: IntegrationEndpoint
      cardinality: 0..1
      ownership: reference
      help:
        summary: The endpoint the message went through.
        usage: Set by the integration layer.
        cardinalityMeaning: One per message.
        context: Endpoint error rates are counted from its messages.
    - name: businessEvent
      target: BusinessEvent
      cardinality: 0..1
      ownership: reference
      help:
        summary: The business event the message carries.
        usage: Linked when an event is published through the endpoint.
        cardinalityMeaning: At most one event per message.
        context: The event may go to several endpoints, each with its own message.
    - name: inReplyTo
      target: Message
      cardinality: 0..1
      ownership: reference
      help:
        summary: The message this one answers, such as an acknowledgement for an order.
        usage: Set by the integration layer when it matches a reply.
        cardinalityMeaning: At most one.
        context: Lets the exchange be followed as a conversation.
  invariants:
    - {id: MESSAGE-001, rule: Delivery retries and corrections must preserve auditable evidence and must not duplicate downstream business effects.}
    - id: MESSAGE-002
      rule: A Message must not be its own ancestor through inReplyTo; the inReplyTo chain is acyclic.
    - {id: MESSAGE-EXE-001, rule: "Attempt Count cannot be negative.", violatedWhen: "attempt_count != null and attempt_count < 0", message: "Attempt Count cannot be negative."}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a message is stopped"
      description: "When a message is failed, a high-priority task asks someone to resolve it."
      when: "status == \"FAILED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MESSAGE-EXCEPTION-{{id}}"
              name: "Resolve message {{id}}"
              description: "Message {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: An integration message envelope that keeps the payload identity, direction, correlation, processing state and delivery evidence of a message exchanged with another system.
    businessMeaning: Systems exchange messages, and things go wrong. Keeping each message as a record lets operators see what was sent or received, whether it was processed and what happened on delivery, and replay it safely.
    usage: Written when a message is sent or received; updated as it is processed; read by integration operators and in incident reviews.
    relationshipContext: A message is delivered to IntegrationEndpoints through DeliveryAttempts.
    lifecycle: Delivery retries and corrections keep auditable evidence and never duplicate downstream business effects.
    example: An order-confirmation message received from a partner's system and processed once.
    whenUsed: Used for event publication, message exchange, delivery, retry, reconciliation, integration operations, and audit.
  lifecycle:
    title: Message Lifecycle
    attribute: status
    states:
      - QUEUED
      - SENT
      - ACKNOWLEDGED
      - FAILED
      - DEAD_LETTERED
      - DISCARDED
    initial: QUEUED
    terminal:
      - ACKNOWLEDGED
      - DISCARDED
    transitions:
      - from: QUEUED
        to: SENT
        action: send
      - from: SENT
        to: ACKNOWLEDGED
        action: acknowledge
      - from: QUEUED
        to: FAILED
        action: fail
      - from: SENT
        to: FAILED
        action: fail
      - from: FAILED
        to: SENT
        action: retry
      - from: FAILED
        to: DEAD_LETTERED
        action: dead_letter
      - from: DEAD_LETTERED
        to: QUEUED
        action: requeue
      - from: DEAD_LETTERED
        to: DISCARDED
        action: discard
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-MESSAGE}
