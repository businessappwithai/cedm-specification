entity:
  name: Route
  namespace: cedm.domain
  kind: logistics_master
  description: A governed planned path or sequence of transport stops/legs used for shipment, fleet, or logistics execution.
  ui:
    icon: route
  identity: {key: routeId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: routeId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the route, constant for its life.', usage: Generated on creation; trips and shipments refer to it.}}
    - {name: code, type: string, required: false, maxLength: 120, help: {summary: 'The short code of the route, such as R-NORTH.', usage: Used by dispatch and drivers.}}
    - name: name
      type: string
      required: true
      maxLength: 150
      help:
        summary: The name of the route, such as "Lyon – Milan via Turin".
        usage: Shown in planning screens.
        relationshipContext: Identifies the route for people, with the code.
    - name: transportMode
      type: enum
      required: true
      default: ROAD
      values:
        - ROAD
        - RAIL
        - SEA
        - AIR
      help:
        summary: The means by which vehicles on the route travel between its stops.
        usage: Set when the route is defined and used to choose suitable vehicles and carriers.
        relationshipContext: Multimodal journeys are split into one route per mode.
        valueSemantics:
          ROAD: Travelled by truck or van on public roads.
          RAIL: Travelled by train on a rail network.
          SEA: Travelled by ship between ports.
          AIR: Travelled by aircraft between airports.
    - name: stopSequence
      type: text
      required: false
      help:
        summary: The stops in the order they are served, between origin and destination.
        usage: Lists intermediate stops, such as "Turin depot; Novara cross-dock".
        relationshipContext: Origin and destination are linked separately.
    - name: distanceKm
      type: decimal
      required: false
      precision: 10
      scale: 1
      help:
        summary: The total length of the route in kilometres, measured along its stops in order.
        usage: Used by planners for cost and emission estimates and for comparing alternative routes.
        relationshipContext: Measured along the stops in order.
    - name: durationMinutes
      type: integer
      required: false
      help:
        summary: How long the route takes from first departure to last arrival.
        usage: Used for delivery-date promising and driver planning.
        relationshipContext: Includes planned stop times.
    - name: operatingDays
      type: string
      required: false
      maxLength: 50
      help:
        summary: The days the route runs, such as "Mon–Fri".
        usage: Trips are created on these days.
        relationshipContext: Holidays follow the calendar of the origin.
    - name: departureTime
      type: string
      required: false
      maxLength: 5
      help:
        summary: The usual departure time, as HH:MM local time.
        usage: Shown to warehouses so goods are ready.
        relationshipContext: Local time of the origin.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: Tells planners whether the route is being set up, in service, paused or withdrawn.
        usage: Moved on by the transport planner as the route is launched, paused or discontinued.
        relationshipContext: Only active routes generate trips.
        valueSemantics:
          PLANNED: Still being designed and not yet in service.
          ACTIVE: Operating on its schedule.
          SUSPENDED: Paused, for example out of season.
          RETIRED: Permanently withdrawn and no longer operated.
  relationships:
    - {name: stops, target: Stop, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: 'Any number of stops, in visiting order; a route with none is not yet planned.', summary: Ordered operational points belonging to this Route., businessMeaning: Decomposes a journey into location-specific activities and schedule points., usage: "Routing, dispatch, ETA and reporting.", workflowRole: Stop sequence must remain unique and ordered within Route.}}
    - name: origin
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The location from which every trip on this route departs.
        usage: Chosen when the route is defined, usually a warehouse, hub or port.
        cardinalityMeaning: Exactly one starting location, because a route has a single point of departure.
        workflowRole: Gives trip planning its starting point and the first stop of the sequence.
        context: Usually a warehouse or hub.
    - name: destination
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The location at which every trip on this route finishes.
        usage: Chosen when the route is defined, usually a customer site, hub or port.
        cardinalityMeaning: Exactly one final location, because a route ends in a single place.
        workflowRole: Gives trip planning its end point and lets arrival times be compared with the plan.
        context: Round trips end where they start.
    - name: carrier
      target: Carrier
      cardinality: 0..1
      ownership: reference
      help:
        summary: The carrier that usually operates the route.
        usage: Set when the route is contracted.
        cardinalityMeaning: At most one regular carrier.
        context: A trip may still be given to another carrier.

  invariants:
    - {id: ROUTE-001, rule: "Lifecycle changes, corrections and retries must preserve historical evidence and must not duplicate downstream commercial, physical or financial effects."}
  help:
    summary: A planned path of transport stops used to move shipments or run a fleet.
    businessMeaning: A route fixes the order in which stops are visited so deliveries and collections can be planned, driven and compared with what actually happened.
    usage: Planned by logistics; used by dispatch and drivers.
    relationshipContext: A route is made of ordered stops.
    lifecycle: A route is planned, used, and withdrawn when no longer run. Past trips keep their route.
    example: Route R-NORTH visits five depots in order from the warehouse each morning.
  lifecycle:
    title: Route Lifecycle
    attribute: status
    states:
      - PLANNED
      - ACTIVE
      - SUSPENDED
      - RETIRED
    initial: PLANNED
    terminal:
      - RETIRED
    transitions:
      - from: PLANNED
        to: ACTIVE
        action: activate
      - from: ACTIVE
        to: SUSPENDED
        action: suspend
      - from: SUSPENDED
        to: ACTIVE
        action: resume
      - from: ACTIVE
        to: RETIRED
        action: retire
      - from: SUSPENDED
        to: RETIRED
        action: retire
      - from: PLANNED
        to: RETIRED
        action: retire
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ROUTE}
