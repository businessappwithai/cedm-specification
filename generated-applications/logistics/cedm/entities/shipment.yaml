entity:
  name: Shipment
  namespace: cedm.domain
  kind: logistics_transaction
  description: A planned or executed logistics movement coordinating transportation of goods, assets, or containers from an origin to a destination under a defined fulfillment context. Shipment execution is distinct from inventory ledger posting, commercial fulfillment and financial settlement.
  ui:
    icon: truck
  identity: {key: shipmentId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: shipmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: 'The shipment id of the shipment: an identifier the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
      requiredMeaning: 'Required: a shipment cannot be understood without its shipment id.'
  - name: shipmentNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: 'The shipment number of the shipment: a value the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
      requiredMeaning: 'Required: a shipment cannot be understood without its shipment number.'
  - name: shipmentType
    type: enum
    required: true
    values:
    - INBOUND
    - OUTBOUND
    - TRANSFER
    - RETURN
    help:
      summary: 'The shipment type of the shipment: a value the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
      requiredMeaning: 'Required: a shipment cannot be understood without its shipment type.'
      valueSemantics:
        INBOUND: The shipment type of the shipment is inbound; set it when that is what the business means for this record.
        OUTBOUND: The shipment type of the shipment is outbound; set it when that is what the business means for this record.
        TRANSFER: The shipment type of the shipment is transfer; set it when that is what the business means for this record.
        RETURN: The shipment type of the shipment is return; set it when that is what the business means for this record.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, BOOKED, IN_TRANSIT, DELIVERED, CANCELLED, EXCEPTION]
    help:
      summary: Operational execution state of the shipment.
      usage: Controls booking, dispatch, tracking, delivery, exception and cancellation actions.
      relationshipContext: Status is not inventory status and does not itself prove customer acceptance or invoice payment.
      workflowRole: Drives permitted logistics transitions and downstream fulfillment/movement workflows.
      valueSemantics:
        PLANNED: The status of the shipment is planned; set it when that is what the business means for this record.
        BOOKED: The status of the shipment is booked; set it when that is what the business means for this record.
        IN_TRANSIT: The status of the shipment is in transit; set it when that is what the business means for this record.
        DELIVERED: The status of the shipment is delivered; set it when that is what the business means for this record.
        CANCELLED: The status of the shipment is cancelled; set it when that is what the business means for this record.
        EXCEPTION: The status of the shipment is exception; set it when that is what the business means for this record.
  - name: plannedDate
    type: date
    required: false
    help:
      summary: 'The planned date of the shipment: a calendar date the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
  - name: actualDate
    type: date
    required: false
    help:
      summary: 'The actual date of the shipment: a calendar date the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
  - name: trackingReference
    type: string
    required: false
    maxLength: 200
    help:
      summary: 'The tracking reference of the shipment: a value the business records on it.'
      usage: Entered or maintained when a shipment is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the shipment's other fields and its relationships; it is not meaningful on its
        own.
  relationships:
  - name: lines
    target: ShipmentLine
    cardinality: 1..*
    ownership: aggregate
    help: {summary: Product-level quantities executed by the shipment., businessMeaning: Provides line-level logistics traceability to orders and inventory events., usage: "Packing, dispatch, delivery, fulfillment, receiving, and audit.", cardinalityMeaning: An executable shipment contains at least one line., workflowRole: Line quantities reconcile transport execution with source demand and attributable InventoryMovement.}
  - name: origin
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a shipment to location, the origin it relates to.
      usage: Chosen from the existing location records when the shipment is created or edited.
      cardinalityMeaning: A shipment has at most one location in this role.
      context: Lets the shipment be found from, and reported with, its location.
  - name: destination
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a shipment to location, the destination it relates to.
      usage: Chosen from the existing location records when the shipment is created or edited.
      cardinalityMeaning: A shipment has at most one location in this role.
      context: Lets the shipment be found from, and reported with, its location.
  - name: carrier
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a shipment to party, the carrier it relates to.
      usage: Chosen from the existing party records when the shipment is created or edited.
      cardinalityMeaning: A shipment has at most one party in this role.
      context: Lets the shipment be found from, and reported with, its party.
  - name: containers
    target: Container
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links a shipment to container, the containers it relates to.
      usage: Chosen from the existing container records when the shipment is created or edited.
      cardinalityMeaning: A shipment has any number of container in this role.
      context: Lets the shipment be found from, and reported with, its container.
  - name: salesOrder
    target: SalesOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a shipment to sales order, the sales order it relates to.
      usage: Chosen from the existing sales order records when the shipment is created or edited.
      cardinalityMeaning: A shipment has at most one sales order in this role.
      context: Lets the shipment be found from, and reported with, its sales order.
  - name: purchaseOrder
    target: PurchaseOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a shipment to purchase order, the purchase order it relates to.
      usage: Chosen from the existing purchase order records when the shipment is created or edited.
      cardinalityMeaning: A shipment has at most one purchase order in this role.
      context: Lets the shipment be found from, and reported with, its purchase order.
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links a shipment to inventory movement, the inventory movements it relates to.
      usage: Chosen from the existing inventory movement records when the shipment is created or edited.
      cardinalityMeaning: A shipment has any number of inventory movement in this role.
      context: Lets the shipment be found from, and reported with, its inventory movement.
  - {name: handlingUnits, target: HandlingUnit, cardinality: "0..*", ownership: reference, help: {summary: Physical logistics units assigned to shipment., businessMeaning: Identifies pallets/cartons/totes/packages transported., usage: "Packing, loading, tracking and delivery.", cardinalityMeaning: Zero or many handling units., workflowRole: Assignment does not itself dispatch or alter stock.}}
  - {name: packingTasks, target: Packing, cardinality: 0..*, ownership: reference, help: {summary: Warehouse packing evidence preparing goods for shipment., businessMeaning: Connects picked goods and packages to transport readiness., usage: Fulfillment and loading., cardinalityMeaning: Zero or many packing tasks., workflowRole: PACKED is not dispatch/delivery evidence.}}
  - {name: dock, target: Dock, cardinality: 0..1, ownership: reference, help: {summary: Warehouse dock used for shipment loading/unloading., businessMeaning: Provides physical execution resource., usage: Dock scheduling and carrier handoff., cardinalityMeaning: Optional for shipments not executed at managed dock., workflowRole: Dock type/direction must be compatible.}}
  invariants:
  - {id: SHIPMENT-001, rule: DELIVERED shipments must have actualDate.}
  - {id: SHIPMENT-002, rule: IN_TRANSIT shipments must have an origin or externally managed origin reference.}
  - {id: SHIPMENT-003, rule: CANCELLED shipments must not become IN_TRANSIT or DELIVERED without authorized reinstatement.}
  - {id: SHIPMENT-004, rule: Shipment completion must not directly mutate inventory state without corresponding authorized InventoryMovement evidence.}
  - {id: SHIPMENT-005, rule: An OUTBOUND shipment linked to a SalesOrder must have validated allocation/fulfillment eligibility before dispatch; shipment status alone cannot create customer fulfillment quantities.}
  - {id: SHIPMENT-006, rule: An INBOUND shipment arrival does not create accepted inventory; accepted stock requires GoodsReceiptLine disposition and InventoryMovement posting.}
  - {id: SHIPMENT-007, rule: A TRANSFER shipment must have validated source and destination locations and corresponding transfer inventory movements according to inventory policy.}
  - {id: SHIPMENT-008, rule: A RETURN shipment must reference an authorized return/receiving workflow before returned goods increase available inventory.}
  - {id: SHIPMENT-009, rule: Dispatch or delivery events that affect inventory or SalesOrderLine fulfillment must be idempotent and traceable to the originating shipment execution event.}
  - {id: SHIPMENT-010, rule: Cancelling or reversing a shipment with posted inventory or fulfillment effects requires compensating InventoryMovement and fulfillment reversal/reconciliation workflows; status change alone is insufficient.}
  - {id: SHIPMENT-011, rule: "Changes to SalesOrder, PurchaseOrder, Product, UnitOfMeasure, InventoryLocation, Carrier or container eligibility that affect an open shipment must trigger controlled revalidation before dispatch or delivery progression."}
  - {id: SHIPMENT-012, rule: DELIVERED is transport evidence and must not directly set Invoice status to paid or settled.}
  lifecycle:
    title: Shipment Lifecycle
    attribute: status
    states: [PLANNED, BOOKED, IN_TRANSIT, DELIVERED, CANCELLED, EXCEPTION]
    initial: PLANNED
    terminal: [DELIVERED, CANCELLED]
    transitions:
      - {from: PLANNED, to: BOOKED, action: book}
      - {from: BOOKED, to: IN_TRANSIT, action: mark_in_transit}
      - {from: IN_TRANSIT, to: DELIVERED, action: deliver}
      - {from: BOOKED, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: BOOKED, action: resolve_exception}
      - {from: IN_TRANSIT, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: IN_TRANSIT, action: resolve_exception}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: BOOKED, to: CANCELLED, action: cancel}
      - {from: IN_TRANSIT, to: CANCELLED, action: cancel}
      - {from: EXCEPTION, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a shipment is stopped"
      description: "When a shipment is exception, a high-priority task asks someone to resolve it."
      when: "status == \"EXCEPTION\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SHIPMENT-EXCEPTION-{{id}}"
              name: "Resolve shipment {{shipment_number}}"
              description: "Shipment {{shipment_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a shipment is ended"
      description: "When a shipment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SHIPMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on shipment {{shipment_number}}"
              description: "Shipment {{shipment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a shipment is done"
      description: "When a shipment is delivered, a task asks someone to confirm the outcome."
      when: "status == \"DELIVERED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SHIPMENT-COMPLETED-{{id}}"
              name: "Confirm shipment {{shipment_number}}"
              description: "Shipment {{shipment_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Represents physical logistics execution bridging commercial fulfillment and transport while keeping inventory and financial state under their authoritative workflows.
    businessMeaning: Shipment answers how goods are physically moved. It is not itself the inventory ledger, SalesOrder fulfillment ledger, GoodsReceipt acceptance, or financial settlement.
    usage: Transportation, warehouse operations, procurement, order fulfillment, carrier management, customs, customer service and container logistics.
    relationshipContext: SalesOrder supplies outbound demand, PurchaseOrder supplies inbound procurement context, Container supplies equipment, Location supplies endpoints, InventoryMovement supplies stock consequences, GoodsReceipt supplies inbound acceptance, and Invoice supplies financial claim.
    workflowContext: "Outbound: confirmed SalesOrder → allocation/reservation → pick/issue → Shipment booked → dispatch → transport → delivery evidence → SalesOrder fulfillment update. Inbound: PurchaseOrder → expected shipment → arrival → GoodsReceipt → acceptance → InventoryMovement. Transfer: source allocation → dispatch issue → transit → destination receipt. Return: authorized return → transport → receipt/inspection → disposition → inventory movement."
    lifecycle: Planned → booked → in transit → delivered, with cancellation and exception paths. Delivery evidence contributes to fulfillment but never bypasses authoritative inventory or financial workflows.
    propagation: Shipment status changes invoke dependent workflow transitions; master-data changes affecting an open shipment require revalidation; posted downstream effects require compensating events for reversal.
    concurrency: Dispatch, delivery and inventory posting require idempotency keys and concurrency control to prevent duplicate issue/receipt/fulfillment effects.
    example: Twelve units are reserved for an outbound SalesOrder. Dispatch creates one authoritative inventory issue event for the shipped quantity and updates fulfillment through the controlled workflow. A retry cannot issue the same quantity twice. Delivery confirms transport completion but does not itself settle the invoice.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SHIPMENT}
