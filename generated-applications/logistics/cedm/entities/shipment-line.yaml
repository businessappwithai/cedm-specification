entity:
  name: ShipmentLine
  namespace: cedm.domain
  kind: logistics_transaction_line
  description: A product-level quantity planned, dispatched, transported, delivered, or received within a Shipment, preserving commercial and inventory traceability without replacing InventoryMovement.
  ui:
    icon: truck
  identity: {key: shipmentLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: shipmentLineId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of one shipment quantity line., businessMeaning: Identifies a logistics quantity independently of order and inventory events., usage: "Fulfillment, transport, tracking, claims, and audit.", relationshipContext: Bridges order lines and inventory movements., requiredMeaning: Required.}}
  - {name: lineNumber, type: integer, required: true, minimum: 1, help: {summary: Sequence within the shipment., businessMeaning: Human-facing reference for shipped material., usage: "Packing, carrier documents, delivery, and audit.", relationshipContext: Unique within Shipment., requiredMeaning: Required.}}
  - {name: plannedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Quantity planned for logistics execution., businessMeaning: Defines intended transport quantity before dispatch., usage: "Allocation, packing, capacity, and fulfillment.", relationshipContext: Must be compatible with product/UOM and eligible source demand., requiredMeaning: Required.}}
  - {name: dispatchedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6, help: {summary: Quantity physically dispatched., businessMeaning: Records logistics execution quantity., usage: Fulfillment and inventory reconciliation., relationshipContext: Must reconcile with attributable issue/transfer movements., requiredMeaning: Required.}}
  - {name: deliveredQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6, help: {summary: Quantity evidenced as delivered., businessMeaning: Records transport completion at line level., usage: "Delivery confirmation, fulfillment, claims, and service.", relationshipContext: Delivery evidence does not itself post inventory or settle invoices., requiredMeaning: Required.}}
  relationships:
  - {name: shipment, target: Shipment, cardinality: "1", ownership: reference, inverse: lines, help: {summary: Parent logistics movement., businessMeaning: "Supplies route, carrier, type, and lifecycle.", usage: Transport execution., cardinalityMeaning: Exactly one shipment., workflowRole: Controls dispatch and delivery progression.}}
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product being transported., businessMeaning: Identifies material represented by quantities., usage: Fulfillment and inventory traceability., cardinalityMeaning: Exactly one product., workflowRole: Must reconcile with source order and inventory events.}}
  - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: "0..1", ownership: reference, help: {summary: Unit qualifying shipment quantities., businessMeaning: Gives quantity semantics., usage: "Conversion, fulfillment, and audit.", cardinalityMeaning: Optional when inherited unambiguously., workflowRole: Must be compatible with product and source transaction.}}
  - {name: salesOrderLine, target: SalesOrderLine, cardinality: 0..1, ownership: reference, help: {summary: Outbound demand fulfilled by this line., businessMeaning: Preserves exact sales fulfillment provenance., usage: Order fulfillment and customer service., cardinalityMeaning: Optional for non-sales shipments., workflowRole: Delivered/dispatched quantities contribute only through governed fulfillment.}}
  - {name: purchaseOrderLine, target: PurchaseOrderLine, cardinality: 0..1, ownership: reference, help: {summary: Inbound procurement commitment represented by this line., businessMeaning: Preserves expected inbound provenance., usage: Receiving and supplier performance., cardinalityMeaning: Optional for non-procurement shipments., workflowRole: Arrival remains distinct from GoodsReceipt acceptance.}}
  - {name: inventoryMovements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {summary: Inventory ledger effects attributable to this logistics line., businessMeaning: Separates transport evidence from authoritative stock changes., usage: Reconciliation and audit., cardinalityMeaning: "Multiple movements may support dispatch, transfer, receipt, or reversal.", workflowRole: Posted movements remain inventory truth.}}
  invariants:
  - {id: SHIPMENT-LINE-001, rule: plannedQuantity must be greater than zero and dispatchedQuantity and deliveredQuantity must not be negative.}
  - {id: SHIPMENT-LINE-002, rule: deliveredQuantity must not exceed dispatchedQuantity except under an explicitly modeled inbound or correction workflow.}
  - {id: SHIPMENT-LINE-003, rule: Outbound quantities must not exceed eligible order/allocation quantities without authorized over-fulfillment policy.}
  - {id: SHIPMENT-LINE-004, rule: Shipment execution must reconcile to attributable InventoryMovement where inventory is affected; shipment quantities are not the stock ledger.}
  - {id: SHIPMENT-LINE-005, rule: Posted dispatch or delivery evidence is corrected through compensating events and must be idempotent.}
  - {id: SHIPMENT-LINE-EXE-001, rule: "Planned Quantity cannot be negative.", violatedWhen: "planned_quantity != null and planned_quantity < 0", message: "Planned Quantity cannot be negative."}
  - {id: SHIPMENT-LINE-EXE-002, rule: "Dispatched Quantity cannot be negative.", violatedWhen: "dispatched_quantity != null and dispatched_quantity < 0", message: "Dispatched Quantity cannot be negative."}
  - {id: SHIPMENT-LINE-EXE-003, rule: "Delivered Quantity cannot be negative.", violatedWhen: "delivered_quantity != null and delivered_quantity < 0", message: "Delivered Quantity cannot be negative."}
  help:
    summary: Line-level logistics execution connecting commercial demand to physical transport and inventory evidence.
    businessMeaning: ShipmentLine says what quantity moved in logistics; InventoryMovement says what happened to stock.
    usage: Outbound fulfillment, inbound transport, transfers, returns, carrier operations, claims, and audit.
    relationshipContext: Shipment supplies logistics context; order lines supply demand/commitment; InventoryMovement supplies stock effects.
    lifecycle: Planned → dispatched → delivered or exception/cancellation according to parent shipment.
    changePropagation: Quantity or source-line changes revalidate allocation, inventory, receiving, fulfillment, and delivery workflows.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SHIPMENT-LINE}
