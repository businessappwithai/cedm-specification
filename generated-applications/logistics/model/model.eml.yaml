        fk: true
        optional: true
        help: The Shipment this InventoryMovement belongs to.
      - name: shipment_line_id
        type: string
        fk: true
        optional: true
        help: Shipment line associated with this inventory event when logistics execution applies. Preserves line-level transport-to-stock provenance. Dispatch, transfer, receipt reconciliation, claims, and audit. Optional for inventory events unrelated to shipment execution. Product, quantity, UOM and direction must reconcile with shipment execution and source transaction.
