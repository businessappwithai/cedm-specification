  - name: Shipment
    help: "Represents physical logistics execution bridging commercial fulfillment and transport while keeping inventory and financial state under their authoritative workflows. Shipment answers how goods are physically moved. It is not itself the inventory ledger, SalesOrder fulfillment ledger, GoodsReceipt acceptance, or financial settlement. Transportation, warehouse operations, procurement, order fulfillment, carrier management, customs, customer service and container logistics. SalesOrder supplies outbound demand, PurchaseOrder supplies inbound procurement context, Container supplies equipment, Location supplies endpoints, InventoryMovement supplies stock consequences, GoodsReceipt supplies inbound acceptance, and Invoice supplies financial claim. Outbound: confirmed SalesOrder → allocation/reservation → pick/issue → Shipment booked → dispatch → transport → delivery evidence → SalesOrder fulfillment update. Inbound: PurchaseOrder → expected shipment → arrival → GoodsReceipt → acceptance → InventoryMovement. Transfer: source allocation → dispatch issue → transit → destination receipt. Return: authorized return → transport → receipt/inspection → disposition → inventory movement. Planned → booked → in transit → delivered, with cancellation and exception paths. Delivery evidence contributes to fulfillment but never bypasses authoritative inventory or financial workflows. Shipment status changes invoke dependent workflow transitions; master-data changes affecting an open shipment require revalidation; posted downstream effects require compensating events for reversal. Dispatch, delivery and inventory posting require idempotency keys and concurrency control to prevent duplicate issue/receipt/fulfillment effects. Twelve units are reserved for an outbound SalesOrder. Dispatch creates one authoritative inventory issue event for the shipped quantity and updates fulfillment through the controlled workflow. A retry cannot issue the same quantity twice. Delivery confirms transport completion but does not itself settle the invoice."
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: shipment_number
        type: string(100)
        unique: true
      - name: shipment_type
        type: string
        enum: ShipmentShipmentType
      - name: status
        type: string
        enum: ShipmentStatus
        help: Operational execution state of the shipment. Controls booking, dispatch, tracking, delivery, exception and cancellation actions. Status is not inventory status and does not itself prove customer acceptance or invoice payment. Drives permitted logistics transitions and downstream fulfillment/movement workflows.
        default: PLANNED
      - name: planned_date
        type: date
        optional: true
      - name: actual_date
        type: date
        optional: true
      - name: tracking_reference
        type: string(200)
        optional: true
      - name: origin_id
        type: string
        fk: true
        references: Location
        optional: true
        help: The Location this Shipment refers to.
      - name: carrier_id
        type: string
        fk: true
        references: Party
        optional: true
        help: The Party this Shipment refers to.
      - name: sales_order_id
        type: string
        fk: true
        optional: true
        help: The SalesOrder this Shipment refers to.
      - name: sales_order_line_id
        type: string
        fk: true
        optional: true
        help: The SalesOrderLine this Shipment belongs to.
  - name: Vehicle
    help: Represents a logistics asset called Vehicle within the CEDM business model. Vehicle is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface. Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Vehicle records. The entity participates in a wider business graph through relationships with Party, Location, ContainerMovement. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns. The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships. A typical Vehicle record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Identifies the vehicle record associated with this Vehicle. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object. Used when creating, reviewing, searching, validating, reporting on, or integrating Vehicle records, where applicable. Its meaning is specific to Vehicle; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: registration_number
        type: string(100)
        unique: true
        help: Captures the business meaning of registration number for the Vehicle. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating Vehicle records, where applicable. Its meaning is specific to Vehicle; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: vehicle_type
        type: string
        enum: VehicleVehicleType
        help: Captures the business meaning of vehicle type for the Vehicle. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating Vehicle records, where applicable. Its meaning is specific to Vehicle; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the truck state or classification in the context of Vehicle. Represents the tractor state or classification in the context of Vehicle. Represents the trailer state or classification in the context of Vehicle. Represents the forklift state or classification in the context of Vehicle. Represents the crane state or classification in the context of Vehicle. Represents the other state or classification in the context of Vehicle. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: capacity
        type: decimal
        optional: true
        help: Captures the business meaning of capacity for the Vehicle. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating Vehicle records, where applicable. Its meaning is specific to Vehicle; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      - name: status
        type: string
        enum: VehicleStatus
        help: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes. Used when creating, reviewing, searching, validating, reporting on, or integrating Vehicle records, where applicable. Its meaning is specific to Vehicle; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the active state or classification in the context of Vehicle. Represents the maintenance state or classification in the context of Vehicle. Represents the out of service state or classification in the context of Vehicle. Represents the retired state or classification in the context of Vehicle. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
