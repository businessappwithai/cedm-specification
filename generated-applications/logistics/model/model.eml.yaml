  - name: Customer
    help: Represents the commercial customer role of a Party. Party identifies who the party is; PartyRole establishes a role; Customer governs buyer-specific commercial behavior and controls. Central to sales order-to-cash, pricing, billing, receivables, collections, service, and customer analytics. Customer connects to SalesOrder, Invoice, Payment, PaymentAllocation through those transaction entities while retaining the underlying Party identity. Customer onboarding → eligibility/credit → SalesOrder → fulfillment → Invoice → Payment → PaymentAllocation → receivables settlement. Customer status constrains new activity but does not replace transaction evidence or rewrite history. Onboard → active → inactive/blocked → retired. Future eligibility changes do not invalidate historical relationships. A Party may simultaneously act as Customer and Supplier. Both roles reference the same Party identity while maintaining separate commercial controls and histories.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identifier for the Customer business relationship. Used by orders invoices receivables service pricing credit contracts and analytics. Party identifies the underlying party while customerId identifies the customer relationship. Provides the stable customer reference carried into SalesOrder Invoice Payment shipment service and receivables workflows. Required for unambiguous customer transaction traceability.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: Links Customer to its underlying PartyRole. Resolves common party identity and role information. Customer is a role specialization and must not duplicate Party identity. Supplies common party context to customer-facing workflows. Required because Customer depends on PartyRole.
      - name: customer_code
        type: string(100)
        unique: true
        help: Human-facing customer business code. Used in orders invoices statements integrations and communication. Distinct from customerId and external legal identifiers. Supports customer selection and transaction recognition. Required for operational identification.
      - name: customer_type
        type: string
        optional: true
        enum: CustomerCustomerType
        help: Commercial classification of the customer relationship. Supports pricing credit tax service and reporting. Does not replace Party partyType. Supplies customer classification to transaction policy. Optional when not needed.
      - name: credit_status
        type: string
        optional: true
        enum: CustomerCreditStatus
        help: Current credit-control disposition. Used by order authorization receivables collections and credit review. Credit control affects exposure and does not alter party identity. SalesOrder confirmation must evaluate current credit policy when applicable. Optional where credit controls are not used.
      - name: credit_limit
        type: Money
        optional: true
        help: Authorized monetary credit exposure limit. Used in credit checks exposure monitoring and risk reporting. Must be interpreted with currency outstanding exposure payment terms and credit status. Provides one input to credit authorization before additional exposure. Optional for cash-only customers.
      - name: payment_terms
        type: string
        optional: true
        help: Default settlement policy for customer invoices. Used by SalesOrder Invoice receivables collections and cash forecasting. May be overridden by authorized contract or transaction-level terms. Supplies default due-date expectations to order and invoice creation. Optional when determined elsewhere.
      - name: status
        type: string
        enum: CustomerStatus
        help: Lifecycle state of the customer relationship. Controls eligibility for new commercial activity. Historical transactions remain attributable after status changes. New workflows must evaluate status; historical records remain valid. Required for eligibility decisions.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: Identifies the underlying person or organization performing this role. Provides common identity without duplicating Party data. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity. Required because a role cannot exist without a participant.
      - name: role_type
        type: string
        enum: CustomerRoleType
        help: Defines the business capacity in which the Party participates. Determines specialized capabilities, policies, workflows, and validations. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process. Required for contextual participation.
      - name: code
        type: string(100)
        optional: true
        help: Optional business-context identifier for this role instance. Supports operational search, integrations, reports, and legacy references. Identifies the role instance and must not replace Party or specialized role identifiers. Optional when partyRoleId is sufficient.
      - name: valid_from
        type: date
        optional: true
        help: Date from which this role is eligible for ordinary business processing. Used by eligibility and transaction validation. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role. Optional for immediately effective roles.
      - name: valid_to
        type: date
        optional: true
        help: Date after which the role is no longer normally eligible for new business processing. Used by eligibility, renewal, reporting, and expiry workflows. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution. Optional for open-ended roles.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
  - name: SalesOrderLine
    help: Authoritative commercial commitment at product/quantity level, reconciling transaction pricing with allocation, fulfillment and billing evidence. The line states what the customer agreed to buy and how it is priced. Reservations state committed stock, shipment/fulfillment events state what was delivered, and InvoiceLines state what was billed. Order management, allocation, warehouse fulfillment, shipment, invoicing, credit, margin, customer service and audit. SalesOrder supplies customer/currency context; Product/UOM define item and quantity semantics; InventoryReservation supplies allocation evidence; Shipment supplies transport/fulfillment evidence; InvoiceLine supplies financial claim evidence. Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation. Draft → confirmed → allocated → partially fulfilled → fulfilled/cancelled. Historical pricing and fulfillment evidence remain reproducible. quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only. Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing. A line requests 20 units. Twenty are reserved, 12 are shipped and accepted, leaving 8 executable. quantityAllocated and quantityFulfilled are updated from their respective workflows. Cancelling the remaining 8 releases the reservation and cancels open work without reversing the accepted 12.
    parent: SalesOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: quantity_fulfilled
        type: decimal
        default: "0"
      - name: quantity_allocated
        type: decimal
        default: "0"
      - name: unit_price
        type: Money
        help: Agreed transaction-time price per unit including currency. Order valuation, invoicing, margin, credit and reconciliation. Must align with SalesOrder currency and UnitOfMeasure pricing basis. Authoritative commercial price for downstream billing unless controlled repricing occurs.
      - name: discount_amount
        type: Money
        optional: true
        help: Approved transaction-time discount amount. Reconciles net commercial value and invoice calculations. Currency must match order pricing currency. Preserves the concession actually granted rather than relying on current DiscountRule.
      - name: tax_amount
        type: Money
        optional: true
        help: Tax determined for the order line when tax is calculated at order stage. Supports order and invoice reconciliation. Determination may depend on Product, Customer, address, location, date and TaxRule. Preserves tax evidence when the order commits to a tax amount.
      - name: line_amount
        type: Money
        help: Calculated commercial value of the line. Supports order totals, invoicing, credit and reporting. Must reconcile with pricing, discount, tax and rounding policy. Financial baseline for downstream billing and reconciliation.
      - name: price_source
        type: string
        optional: true
        enum: SalesOrderLinePriceSource
      - name: price_determined_at
        type: datetime
        optional: true
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The UnitOfMeasure this SalesOrderLine refers to.
      - name: sales_order_id
        type: string
        fk: true
        help: The SalesOrder this SalesOrderLine refers to.
      - name: product_id
        type: string
        fk: true
        help: The Product this SalesOrderLine refers to.
  - name: Product
    help: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules. Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts. Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics. Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration. If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(300)
      - name: description
        type: string(4000)
        optional: true
      - name: product_type
        type: string
        enum: ProductProductType
      - name: status
        type: string
        enum: ProductStatus
        default: ACTIVE
      - name: sku
        type: string(100)
        optional: true
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
      - name: standard_price
        type: money
        optional: true
      - name: tax_category
        type: string(100)
        optional: true
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
  - name: Message
    help: A governed integration message envelope preserving payload identity, direction, correlation, processing state, and delivery evidence. Provide canonical implementation-neutral integration semantics for Message. A governed integration message envelope preserving payload identity, direction, correlation, processing state, and delivery evidence. Used for event publication, message exchange, delivery, retry, reconciliation, integration operations, and audit. Carries or routes evidence derived from authoritative domain transactions without replacing those source records. Created and processed through governed integration states; attempts and finalized evidence are retained. Event publication, messaging, endpoint delivery, retry, dead-letter handling, reconciliation, and audit. Enterprise application integration and event-driven workflows.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Message. Identifies one governed integration record. Integration, event processing, reporting and audit. Referenced by compatible integration workflows. Required.
      - name: occurred_at
        type: datetime
        optional: true
        help: Effective or occurrence time where applicable. Anchors integration evidence in chronology. Processing and audit. Does not replace source transaction timestamps. Optional for endpoint/master definitions.
  - name: IntegrationEndpoint
    help: A governed logical endpoint through which enterprise messages or business events are exchanged with an internal or external system. Provide canonical implementation-neutral integration semantics for IntegrationEndpoint. A governed logical endpoint through which enterprise messages or business events are exchanged with an internal or external system. Used for event publication, message exchange, delivery, retry, reconciliation, integration operations, and audit. Carries or routes evidence derived from authoritative domain transactions without replacing those source records. Created and processed through governed integration states; attempts and finalized evidence are retained. Event publication, messaging, endpoint delivery, retry, dead-letter handling, reconciliation, and audit. Enterprise application integration and event-driven workflows.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of IntegrationEndpoint. Identifies one governed integration record. Integration, event processing, reporting and audit. Referenced by compatible integration workflows. Required.
      - name: occurred_at
        type: datetime
        optional: true
        help: Effective or occurrence time where applicable. Anchors integration evidence in chronology. Processing and audit. Does not replace source transaction timestamps. Optional for endpoint/master definitions.
