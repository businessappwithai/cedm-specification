entity:
  name: DocumentClassification
  namespace: cedm.domain
  kind: document_governance
  description: A governed classification assigned to Documents for retention, sensitivity, access, regulatory, or business-purpose controls.
  ui:
    icon: file-text
  identity: {key: documentClassificationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: documentClassificationId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of one classification, such as Confidential or Contract Record.', usage: Generated when the classification is created; documents point to it so retention and access controls follow the label.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the classification and its controls take effect., usage: Set when it is defined or revised.}}
  relationships: []
  invariants:
    - {id: DOCUMENT-CLASSIFICATION-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: A classification assigned to documents for retention, sensitivity, access, regulatory or business-purpose controls.
    businessMeaning: What a document may be done with depends on what it is. A classification such as Confidential or Contract Record decides who can see it and how long it must be kept.
    usage: Defined by records and security managers; applied to documents; used by access and retention rules.
    relationshipContext: Documents carry a classification, and the classification drives their controls.
    lifecycle: Changes are recorded explicitly so that the control that applied on a given date can be shown.
    example: Classification "Financial record – 7 years", which sets the retention period of invoices.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-DOCUMENT-CLASSIFICATION}
