# human-resources — local container stack.
#
# Generated. The previous version of this file described a different
# application: it set NODE_ENV on a Rust backend, required a BETTER_AUTH_SECRET
# the backend never reads, health-checked `/api/health` (the route is
# `/api/me/health`), and built `./backend/Dockerfile`, which did not exist.
# It also never reached disk — its generation sat after an early return.
# Shell expansions go through the `shellDefault` / `shellRequired` helpers.
# Written inline, a `${VAR:-...}` closing right after a Handlebars expression
# leaves three consecutive braces and Handlebars fails on the third — the same
# two-braces trap as an inline style object in a .tsx template. The helpers emit
# the whole expansion, so the brace never meets the delimiter.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Loco's own convention, and what config/*.yaml expects. Naming it after
      # the project instead left `db migrate` pointing at a database nothing
      # created.
      POSTGRES_DB: human_resources_development
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d human_resources_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: human-resources-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      # Loco reads LOCO_ENV, not NODE_ENV.
      LOCO_ENV: ${LOCO_ENV:-production}
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD}@postgres:5432/human_resources_development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/me/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: human-resources-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
