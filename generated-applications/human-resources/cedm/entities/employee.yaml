entity:
  name: Employee
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A person engaged by an organization as an employee.
  ui:
    icon: user-check
  identity:
    key: employeeId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: employeeId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the employee role.
        usage: Generated on hiring; leave, payroll and attendance refer to it.
    - name: partyRoleId
      type: reference
      target: PartyRole
      required: true
      unique: true
      immutable: true
      help:
        summary: The party role that this employee record specialises.
        usage: Set at hiring so the role is linked to the person's general identity.
    - name: employeeNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number the employer gives the employee, printed on badges and payslips.
        usage: Allocated at hiring; unique.
    - name: hireDate
      type: date
      required: false
      help:
        summary: The date the person started as an employee.
        usage: Entered by HR; the start of service for benefits.
    - name: terminationDate
      type: date
      required: false
      help:
        summary: The date the employment ended.
        usage: Entered when it ends; must not be before the hire date.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - ON_LEAVE
        - TERMINATED
        - RETIRED
      help:
        summary: Whether the person is currently working, away on leave, or has left the organisation.
        usage: Set by HR when employment changes; payroll and access rules read it, and the two leaver states close the record.
        valueSemantics:
          ACTIVE: Employed and currently working for the organisation.
          ON_LEAVE: Employed but away on approved leave, so not currently working.
          TERMINATED: Employment ended by dismissal, resignation or end of contract. A final state.
          RETIRED: Left the organisation on retirement. A final state.
  relationships:
    - name: person
      target: Person
      cardinality: '1'
      ownership: reference
      help:
        usage: Chosen when the employee is hired; personal details are read from that person and are not copied onto the employee.
        summary: The person who is the employee.
        cardinalityMeaning: 'Exactly one person: an employee role is held by a specific individual.'
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that employs the person in this employee role.
        usage: Set by HR at hiring; payroll, reporting lines and headcount are read through it, and it stays empty for an unattached record.
        cardinalityMeaning: At most one organisation, because an employee record belongs to a single employer at a time.
    - name: leaveRequests
      target: LeaveRequest
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of leave requests over the employment.
        summary: Leave requests submitted for this Employee.
        businessMeaning: Preserves absence authorization history independently of actual attendance evidence.
        usage: Employee self-service, HR, scheduling, payroll and audit.
        workflowRole: Requests are evaluated under applicable Employment and leave policy.
    - name: attendanceRecords
      target: Attendance
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of attendance records, one for each working day recorded.
        summary: Attendance evidence recorded for this Employee.
        businessMeaning: Captures actual work or absence separately from authorization and payroll calculation.
        usage: Timekeeping, workforce analytics, scheduling, payroll and audit.
        workflowRole: Approved attendance can become payroll input while corrections remain explicit evidence.
  invariants:
    - id: EMPLOYEE-001
      rule: partyRole.roleType must equal EMPLOYEE.
    - id: EMPLOYEE-002
      rule: terminationDate must not precede hireDate.
  lifecycle:
    title: Employee Lifecycle
    attribute: status
    states: [ACTIVE, ON_LEAVE, TERMINATED, RETIRED]
    initial: ACTIVE
    terminal: [TERMINATED, RETIRED]
    transitions:
      - {from: ACTIVE, to: ON_LEAVE, action: mark_on_leave}
      - {from: ON_LEAVE, to: ACTIVE, action: return_from_leave}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: ON_LEAVE, to: TERMINATED, action: terminate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: ON_LEAVE, to: RETIRED, action: retire}
  help:
    summary: A person engaged by an organisation as an employee.
    businessMeaning: 'Employment law, payroll and HR all apply to the employee role rather than to the person in general. This record carries that role: the employee number and the hiring and leaving dates.'
    usage: Created when a person is hired; updated as they take leave or leave the organisation; read by HR, payroll and managers.
    relationshipContext: An employee is a Person, may belong to an Organization, requests leave and has attendance records.
    lifecycle: An employee is active, may be on leave, and ends terminated or retired.
    example: Employee 10482, hired on 1 March, currently active in the finance team.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMPLOYEE
