entity:
  name: Position
  namespace: cedm.domain
  kind: workforce_master_entity
  description: A defined organizational role with responsibilities, reporting structure, and staffing requirements.
  ui:
    icon: briefcase
  identity:
    key: positionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: positionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the position.
        usage: Generated on creation; employment records refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The position number.
        usage: Unique; used in headcount plans.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: The title of the position.
        usage: Shown on charts and advertisements.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - FILLED
        - FROZEN
        - CLOSED
        - RETIRED
      help:
        summary: Whether the position can be filled.
        usage: Set by HR.
        valueSemantics:
          OPEN: Approved and vacant, or available to be filled.
          FILLED: Occupied by an employee.
          FROZEN: Held back temporarily and not to be filled.
          CLOSED: No longer needed but not yet retired.
          RETIRED: Removed from the structure. A final state.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The first date the position exists.
        usage: Set when approved.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The last date the position exists.
        usage: Set when it is closed; not before the start date.
  relationships:
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation the position belongs to.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one organisation: a position is a seat in one organisation.'
        workflowRole: Places it in the structure.
    - name: parentPosition
      target: Position
      cardinality: 0..1
      ownership: reference
      help:
        summary: The position this one reports to.
        usage: Set to build the reporting line.
        cardinalityMeaning: At most one parent; the top position has none.
        workflowRole: Defines the reporting chain.
    - name: employees
      target: Employee
      cardinality: 0..*
      ownership: reference
      help:
        summary: The employees who hold the position.
        usage: Read to see who fills it.
        cardinalityMeaning: Any number, since a position can be shared.
        workflowRole: Link people to the seat.
    - {name: job, target: Job, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: 'At most one job, the standard description the position is based on.', summary: Reusable work definition underlying Position., businessMeaning: Separates job classification from organizational seat., usage: Workforce planning and HCM., workflowRole: Job retirement prevents incompatible new assignment while preserving history.}}
  invariants:
    - id: POSITION-001
      rule: effectiveTo must not precede effectiveFrom.
    - {id: POSITION-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Position Lifecycle
    attribute: status
    states: [OPEN, FILLED, FROZEN, CLOSED, RETIRED]
    initial: OPEN
    terminal:
      - RETIRED
    transitions:
      - {from: OPEN, to: FILLED, action: fill}
      - {from: FILLED, to: OPEN, action: vacate}
      - {from: OPEN, to: FROZEN, action: freeze}
      - {from: FROZEN, to: OPEN, action: unfreeze}
      - {from: OPEN, to: CLOSED, action: close}
      - {from: CLOSED, to: OPEN, action: reopen}
      - {from: OPEN, to: RETIRED, action: retire}
      - {from: FROZEN, to: RETIRED, action: retire}
      - {from: CLOSED, to: RETIRED, action: retire}
      - {from: FILLED, to: RETIRED, action: retire}
  help:
    summary: A defined role in an organisation, with its responsibilities, place in the reporting structure and staffing needs.
    businessMeaning: A position is a seat in the organisation chart. It exists whether or not someone sits in it, which lets headcount, budgets and succession be planned separately from the people.
    usage: Created by HR and management when a role is approved; filled by hiring; read by managers and recruiters.
    relationshipContext: A position belongs to an Organization, reports to a parent Position, may be based on a Job and is occupied by Employees.
    lifecycle: A position is open until filled; it can become vacant again, be frozen while recruitment is held, closed, and finally retired.
    example: Senior Accountant, Finance Department, reporting to the Financial Controller, filled in March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-POSITION
