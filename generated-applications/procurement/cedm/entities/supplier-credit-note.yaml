entity:
  name: SupplierCreditNote
  namespace: cedm.domain
  kind: financial_adjustment_transaction
  description: A formal supplier-issued or buyer-recognized financial credit that reduces a payable claim arising from returned goods, pricing corrections, service disputes, tax corrections, or other authorized adjustments without rewriting the original Invoice.
  ui:
    icon: factory
  identity: {key: supplierCreditNoteId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: supplierCreditNoteId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the credit note, constant for its life.', businessMeaning: Identifies the financial adjustment independently of its number source return claim invoice application and accounting entries., usage: Used for accounts payable reconciliation audit tax and integration., workflowRole: Stable identity across drafting approval posting application and reversal.}}
    - {name: creditNoteNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: 'The reference printed on the credit document, used by the supplier and by payables staff.', usage: Entered from the supplier's document or assigned on recognition; unique; used to match the credit to statements and integrations., businessMeaning: Identifies the credit document for supplier communication and financial reconciliation., workflowRole: Correlates internal adjustment with external supplier documentation.}}
    - {name: creditNoteDate, type: date, required: true, help: {summary: 'The effective date of the credit, which decides the accounting and tax period it falls in.', usage: 'Entered when the credit is recorded; payable aging and tax reporting use it, and it can differ from the application date.', businessMeaning: Establishes financial chronology and applicable accounting/tax period., workflowRole: Anchors recognition of adjustment.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - APPROVED
        - POSTED
        - PARTIALLY_APPLIED
        - FULLY_APPLIED
        - CANCELLED
        - REVERSED
      help:
        summary: The stage of the credit from preparation and approval through posting, application against invoices, or cancellation.
        usage: Starts as DRAFT; payables staff approve and post it, and the applied states follow the invoice applications made against it.
        valueSemantics:
          DRAFT: The credit is being prepared and has no accounting effect.
          APPROVED: The credit is authorized but not yet posted to the ledger.
          POSTED: The credit is recognized in accounts payable and is available to apply.
          PARTIALLY_APPLIED: Part of the credit has been applied to invoices and some remains available.
          FULLY_APPLIED: The whole credit has been used against invoices.
          CANCELLED: The credit was withdrawn before posting and has no effect.
          REVERSED: The posted credit was undone by a reversing entry.
        businessMeaning: Separates preparation authorization accounting recognition and application against supplier claims.
        relationshipContext: Status does not change original Invoice GoodsReceipt SupplierClaim or SupplierClaimResolution history.
        workflowRole: POSTED establishes adjustment; application states reflect controlled consumption.
    - {name: currencyId, type: reference, target: Currency, required: true, immutableAfterPosting: true, help: {summary: The currency in which every amount on the credit note is expressed., usage: 'Chosen when the credit is created, normally the original invoice currency; applying it to an invoice in another currency needs an exchange rate.', businessMeaning: Defines monetary denomination of adjustment., workflowRole: Qualifies all credit monetary values.}}
    - {name: subtotal, type: Money, required: true, help: {summary: 'The credit value before tax, summed from the credit lines.', usage: Calculated from the lines; tax is computed on it and it is reconciled with the lines before posting., businessMeaning: Pre-tax reduction derived from credit lines., workflowRole: Feeds total credit calculation.}}
    - {name: taxAmount, type: Money, required: true, default: {amount: 0}, help: {summary: 'The tax reversed or adjusted by this credit, summed from the lines.', usage: Calculated from the credit lines; defaults to zero and is used in tax reporting and accounting., businessMeaning: Tax correction associated with credited value., workflowRole: Contributes to total credit.}}
    - {name: totalAmount, type: Money, required: true, help: {summary: 'The total payable reduction the credit note represents, including tax.', usage: Calculated as subtotal plus tax; it is the most credit that can be applied to invoices and is shown on supplier statements., businessMeaning: Financial value recognized as credit against supplier exposure., workflowRole: Determines maximum adjustment available for application.}}
    - {name: amountApplied, type: Money, required: true, default: {amount: 0}, help: {summary: Portion of supplier credit already applied to payable claims., businessMeaning: Separates credit created from portion consumed against invoices., usage: Drives open credit and payable reconciliation., relationshipContext: Must reconcile with active SupplierCreditNoteApplication records., workflowRole: Changes only through explicit application/reversal events.}}
    - {name: amountUnapplied, type: Money, required: true, default: {amount: 0}, help: {summary: 'The credit still available, being the total less what active applications have consumed.', usage: Maintained as applications and reversals are recorded; payables staff use it to find credit to offset or request as a refund., businessMeaning: Available credit exposure under policy., workflowRole: Reconciles totalAmount less active applications.}}
  relationships:
    - {name: supplier, target: Supplier, cardinality: '1', ownership: reference, help: {summary: Supplier associated with the credit., businessMeaning: Identifies supplier whose payable exposure is reduced., usage: Payables and supplier statements., workflowRole: Reconciles source Invoice SupplierClaim and SupplierReturn context.}}
    - {name: sourceReturn, target: SupplierReturn, cardinality: 0..1, ownership: reference, help: {summary: Supplier return that caused the credit., businessMeaning: Connects financial adjustment to physical reverse-procurement event., usage: Return-to-credit traceability and approval., workflowRole: Provides return eligibility evidence.}}
    - {name: supplierClaim, target: SupplierClaim, cardinality: 0..1, ownership: reference, help: {summary: Supplier claim supporting the credit., businessMeaning: Connects the financial adjustment to the business case and evidence for recovery., usage: Claim resolution audit and reconciliation., workflowRole: Provides case context for credit authorization.}}
    - {name: supplierClaimResolution, target: SupplierClaimResolution, cardinality: 0..1, ownership: reference, help: {summary: Authorized claim resolution that approved this credit remedy., businessMeaning: Connects the credit to the controlled decision authorizing the financial recovery., usage: Governance approval execution tracking and claim closure., workflowRole: Supplies execution mandate for CREDIT resolution.}}
    - {name: lines, target: SupplierCreditNoteLine, cardinality: 1..*, ownership: aggregate, help: {summary: Detailed credit components and original financial evidence., businessMeaning: Explain which supplier invoice values are reduced., usage: Calculation tax audit and reconciliation., workflowRole: Feed subtotal tax and total.}}
    - {name: invoices, target: Invoice, cardinality: 1..*, ownership: reference, help: {summary: Supplier invoices whose payable claims are reduced., businessMeaning: Identifies original claims without modifying them., usage: Application and payable reconciliation., workflowRole: Controls eligible application.}}
    - {name: applications, target: SupplierCreditNoteApplication, cardinality: 0..*, ownership: reference, help: {summary: Explicit applications of this supplier credit against eligible purchase invoices., businessMeaning: Records exactly how the posted credit is consumed without rewriting original invoice history., usage: Supports accounts payable supplier statements reconciliation audit reversal and remaining-credit calculation., cardinalityMeaning: A supplier credit may be unapplied partially applied or consumed through multiple controlled applications., workflowRole: Active applications drive amountApplied and amountUnapplied and application status.}}
    - {name: journalEntries, target: JournalEntry, cardinality: 0..*, ownership: reference, help: {summary: Accounting entries recognizing supplier credit., businessMeaning: Separates accounting recognition from credit document., usage: Payable expense/inventory tax and audit accounting., workflowRole: Posted credit requires balanced accounting recognition.}}
  invariants:
    - {id: SUPPLIER-CREDIT-001, rule: A POSTED supplier credit must contain at least one line.}
    - {id: SUPPLIER-CREDIT-002, rule: totalAmount must reconcile with line values tax and rounding evidence.}
    - {id: SUPPLIER-CREDIT-003, rule: amountApplied must not exceed totalAmount except under explicitly governed correction policy.}
    - {id: SUPPLIER-CREDIT-004, rule: amountUnapplied must equal totalAmount less active SupplierCreditNoteApplication source-side amounts under configured rounding policy.}
    - {id: SUPPLIER-CREDIT-005, rule: Return-originated credit must reference eligible SupplierReturn evidence and cannot exceed approved credit value.}
    - {id: SUPPLIER-CREDIT-006, rule: Original Invoice and InvoiceLine records remain immutable; crediting them occurs through explicit adjustment/application evidence.}
    - {id: SUPPLIER-CREDIT-007, rule: POSTED credit notes are immutable except through explicit reversal or compensating adjustment workflows.}
    - {id: SUPPLIER-CREDIT-008, rule: Posting must be idempotent and must not create duplicate accounting adjustments on retry.}
    - {id: SUPPLIER-CREDIT-009, rule: amountApplied must reconcile with active SupplierCreditNoteApplication records and application status must reflect the resulting remaining amount.}
    - {id: SUPPLIER-CREDIT-010, rule: "When SupplierClaimResolution is linked, its resolutionType must authorize CREDIT and the credit amount must not exceed the approved recovery amount."}
    - {id: SUPPLIER-CREDIT-NOTE-EXE-001, rule: "Subtotal cannot be negative.", violatedWhen: "subtotal != null and subtotal < 0", message: "Subtotal cannot be negative."}
    - {id: SUPPLIER-CREDIT-NOTE-EXE-002, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
    - {id: SUPPLIER-CREDIT-NOTE-EXE-003, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Supplier Credit Note Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, POSTED, PARTIALLY_APPLIED, FULLY_APPLIED, CANCELLED, REVERSED]
    initial: DRAFT
    terminal:
      - FULLY_APPLIED
      - CANCELLED
      - REVERSED
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: POSTED, action: post}
      - {from: POSTED, to: PARTIALLY_APPLIED, action: apply}
      - {from: POSTED, to: FULLY_APPLIED, action: apply}
      - {from: PARTIALLY_APPLIED, to: FULLY_APPLIED, action: apply}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: POSTED, to: REVERSED, action: reverse}
      - {from: PARTIALLY_APPLIED, to: REVERSED, action: reverse}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a supplier credit note is ended"
      description: "When a supplier credit note is cancelled or reversed, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUPPLIER-CREDIT-NOTE-FOLLOW-UP-{{id}}"
              name: "Follow up on supplier credit note {{credit_note_number}}"
              description: "Supplier credit note {{credit_note_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a supplier credit note is done"
      description: "When a supplier credit note is posted, a task asks someone to confirm the outcome."
      when: "status == \"POSTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUPPLIER-CREDIT-NOTE-COMPLETED-{{id}}"
              name: "Confirm supplier credit note {{credit_note_number}}"
              description: "Supplier credit note {{credit_note_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Represents an explicit financial reduction of supplier payable exposure while preserving original procurement invoice claim resolution and return history.
    businessMeaning: SupplierClaim explains the issue; SupplierClaimResolution authorizes the remedy; SupplierReturn is the physical event; SupplierCreditNote records the financial consequence; SupplierCreditNoteApplication records consumption against invoices; JournalEntry records accounting recognition.
    usage: Accounts payable procurement supplier reconciliation claims tax accounting and audit.
    relationshipContext: SupplierReturn records physical reversal, SupplierClaim records the case, SupplierClaimResolution records the authorized outcome, Invoice records the original payable claim, SupplierCreditNoteLine records financial detail, SupplierCreditNoteApplication records payable application, and JournalEntry records accounting.
    workflowContext: Claim/return/adjustment approval → SupplierClaimResolution → credit calculation from original transaction evidence → supplier credit approval → posting → JournalEntry → SupplierCreditNoteApplication against eligible Invoice → payable balance reconciliation. Supplier settlement or refund is a separate financial workflow.
    lifecycle: Draft → approved → posted → partially applied/fully applied, with cancellation before posting and reversal after posting.
    changePropagation: Changes to claim resolution return or invoice evidence trigger revalidation before posting. Posted credit changes require reversal/replacement. Applications are corrected by reversal/reallocation rather than mutation.
    example: Three defective units are returned. SupplierClaimResolution authorizes CREDIT for EUR 300, SupplierCreditNote records the approved credit, accounting recognizes it, and SupplierCreditNoteApplication applies it against the supplier invoice without changing historical invoice lines.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-CREDIT-NOTE}
