entity:
  name: SupplierDebitNoteLine
  namespace: cedm.domain
  kind: supplier_financial_adjustment_transaction_line
  description: A line-level component of a SupplierDebitNote identifying the quantity, value, tax, reason, or other measurable basis for a buyer-issued supplier debit.
  ui:
    icon: factory
  identity: {key: supplierDebitNoteLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: supplierDebitNoteLineId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of one line of a supplier debit, constant for its life.', usage: 'Generated on creation; accounting, reconciliation and integrations refer to it even if line numbers change.', businessMeaning: Identifies one adjustment component independently of its parent debit note and source transactions., relationshipContext: Distinct from InvoiceLine SupplierClaim and SupplierReturnLine identities., workflowRole: Stable attribution for calculation and accounting.}}
    - {name: lineNumber, type: integer, required: true, minimum: 1, help: {summary: The position of the line within its debit note., usage: Assigned in sequence when the line is added; unique within the note and used in review and reconciliation., businessMeaning: Provides deterministic ordering and human-readable identification., relationshipContext: Unique within the parent debit note., workflowRole: Identifies the line during approval and posting.}}
    - {name: quantity, type: decimal, required: false, precision: 20, scale: 6, help: {summary: Quantity to which the debit calculation applies when the adjustment is quantity-based., businessMeaning: Measures affected goods or services for shortage overcharge damage or other quantity-driven recovery., usage: Calculation reconciliation and audit., relationshipContext: Must reconcile with relevant InvoiceLine GoodsReceiptLine or claim evidence when applicable., workflowRole: Supplies quantity basis for adjustment valuation.}}
    - {name: unitPrice, type: Money, required: false, help: {summary: The price per unit used to calculate a quantity-based debit., usage: 'Taken from the original commercial evidence such as the invoice line, not the current price list; blank for non-quantity debits.', businessMeaning: Captures the transaction-time valuation relevant to the recovery., relationshipContext: Should derive from original commercial evidence rather than current master pricing., workflowRole: Supports reproducible line valuation.}}
    - {name: grossAmount, type: Money, required: true, help: {summary: Pre-tax financial amount of the debit line before applicable deductions or tax., businessMeaning: Represents the base recovery attributable to this line., usage: Total calculation accounting and reconciliation., workflowRole: Feeds taxableAmount and totalAmount.}}
    - {name: taxAmount, type: Money, required: true, default: {amount: 0}, help: {summary: 'The tax associated with this debit line, zero where none applies.', usage: Calculated from the gross amount using the original tax treatment; it feeds tax reporting and the net line amount., businessMeaning: Represents applicable tax added to the adjustment., workflowRole: Contributes to line and header total.}}
    - {name: netAmount, type: Money, required: true, help: {summary: 'The final amount of this debit line, being gross amount adjusted for tax.', usage: 'Calculated; the debit note total is the sum of these amounts, and payables and supplier reconciliation read it.', businessMeaning: Represents the line's gross adjustment plus applicable tax under governing calculation policy., workflowRole: Contributes to SupplierDebitNote.totalAmount.}}
    - {name: reasonCode, type: string, required: true, maxLength: 100, help: {summary: Reason explaining why this particular debit amount is being raised., businessMeaning: Provides line-level cause such as shortage overcharge damage or penalty., usage: Supplier dispute reporting and recovery analytics., relationshipContext: Complements SupplierClaim.claimType and source transaction evidence., workflowRole: Supports validation and approval.}}
  relationships:
    - {name: supplierDebitNote, target: SupplierDebitNote, cardinality: '1', ownership: reference, help: {usage: 'Set when the line is created; the note supplies the supplier, currency and lifecycle that decide whether the line can be posted.', summary: Parent supplier debit note containing this line., businessMeaning: Supplies supplier currency lifecycle and posting context., workflowRole: Controls whether the line can be posted.}}
    - {name: supplierClaim, target: SupplierClaim, cardinality: 0..1, ownership: reference, help: {summary: Claim evidence supporting the debit line., businessMeaning: Connects the monetary adjustment to the supplier issue being recovered., usage: Investigation approval and audit., workflowRole: Supplies justification for the debit.}}
    - {name: supplierClaimResolution, target: SupplierClaimResolution, cardinality: 0..1, ownership: reference, help: {summary: Authorized claim resolution supporting this debit line., businessMeaning: Links the line to the approved recovery decision and its financial limit., usage: Approval audit and claim closure., workflowRole: Supplies remedy authorization for DEBIT_ADJUSTMENT.}}
    - {name: invoiceLines, target: InvoiceLine, cardinality: 0..*, ownership: reference, help: {summary: Original supplier invoice lines affected by this debit., businessMeaning: Identifies historical payable evidence relevant to the adjustment., usage: AP reconciliation and audit., workflowRole: Supplies transaction-time quantity price and tax evidence.}}
  invariants:
    - {id: SUPPLIER-DEBIT-LINE-001, rule: lineNumber must be unique within SupplierDebitNote.}
    - {id: SUPPLIER-DEBIT-LINE-002, rule: Monetary values must use SupplierDebitNote.currencyId.}
    - {id: SUPPLIER-DEBIT-LINE-003, rule: "quantity, when present, must be greater than zero."}
    - {id: SUPPLIER-DEBIT-LINE-004, rule: grossAmount and taxAmount must reconcile to netAmount under the governing tax and rounding policy.}
    - {id: SUPPLIER-DEBIT-LINE-005, rule: Quantity-based valuation must preserve sufficient original InvoiceLine or other source evidence for reproducibility.}
    - {id: SUPPLIER-DEBIT-LINE-006, rule: Posted line values are immutable except through explicit reversal or compensating adjustment workflows.}
    - {id: SUPPLIER-DEBIT-LINE-007, rule: "When SupplierClaimResolution is linked, its resolutionType must authorize DEBIT_ADJUSTMENT and the line must remain within the approved recovery amount."}
    - {id: SUPPLIER-DEBIT-NOTE-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: SUPPLIER-DEBIT-NOTE-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
    - {id: SUPPLIER-DEBIT-NOTE-LINE-EXE-003, rule: "Gross Amount cannot be negative.", violatedWhen: "gross_amount != null and gross_amount < 0", message: "Gross Amount cannot be negative."}
    - {id: SUPPLIER-DEBIT-NOTE-LINE-EXE-004, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
  help:
    summary: Provides the auditable financial detail supporting one component of a SupplierDebitNote.
    businessMeaning: The line explains exactly how a supplier recovery amount was calculated; it does not replace the original invoice supplier claim or claim resolution.
    usage: Accounts payable supplier disputes accounting tax and audit.
    relationshipContext: SupplierClaim supplies the business case, SupplierClaimResolution supplies authorization, InvoiceLine supplies original financial evidence, and SupplierDebitNote aggregates approved recovery lines.
    workflowContext: Gather source evidence → determine line basis → calculate amount and tax → validate against claim resolution → approve → post with parent SupplierDebitNote → reconcile payable.
    example: A supplier billed 100 units but 5 were not received. The SupplierClaimResolution authorizes a shortage recovery; a debit line records quantity 5 and the applicable transaction-time unit value with supporting InvoiceLine evidence.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-DEBIT-NOTE-LINE}
