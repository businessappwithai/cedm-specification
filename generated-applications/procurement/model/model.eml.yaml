  - name: Attachment
    help: A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Provide durable, implementation-neutral governance semantics for Attachment. A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable. Connects authoritative business records to controlled lifecycle, evidence, findings, and downstream remediation without replacing source transactions. Created under governance, reviewed or finalized where applicable, and retained or superseded with history preserved. Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation. Enterprise agreements, controlled records, audit evidence, compliance findings, and lifecycle changes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Attachment. Identifies one governed record independently of mutable labels or state. Governance, workflow, integration and audit. Referenced by related enterprise records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Time at which this record becomes effective or evidentially applicable. Establishes temporal business meaning. Lifecycle, audit and reporting. Does not rewrite earlier effective evidence. Optional when lifecycle does not require a separate effective timestamp.
  - name: Supplier
    help: Represents the procurement-facing role of a Party that supplies business inputs and participates in reverse procurement, supplier claims, financial recovery and performance governance. Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific qualification, terms and transaction history. SupplierClaim captures the case; SupplierClaimResolution captures the remedy; downstream transactions execute it; SupplierPerformanceAssessment interprets accumulated evidence for governance. Central to source-to-pay, sourcing, procurement, receiving, supplier returns, quality claims, accounts payable, supplier qualification, recovery and performance management. Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, SupplierReturn, SupplierCreditNote, SupplierDebitNote, SupplierClaim, SupplierClaimResolution, SupplierPerformanceAssessment, Product and PaymentTerm. Supplier qualification/status → PurchaseOrder → GoodsReceipt → Invoice matching → Payment; issue detection → SupplierClaim → SupplierClaimResolution → SupplierReturn and/or SupplierCreditNote/SupplierDebitNote/Payment → reconciliation; periodic evidence aggregation → SupplierPerformanceAssessment → governance/improvement decision. Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence. A supplier's quarterly assessment combines delivery receipts, inspection failures, claims and returns into an approved scorecard. The result informs qualification and improvement decisions while the underlying transactions remain unchanged.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable Supplier role identity. Connects procurement purchase orders receipts invoices payments returns credits claims resolutions and supplier performance. Supplier identifies the role while PartyRole and Party identify the underlying party. Preserves supplier traceability across procure-to-pay reverse procurement claim recovery and performance management. Required for stable supplier history.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: PartyRole backing the Supplier specialization. Navigates to common party identity and role information. Supplier must not duplicate Party identity. Supplies shared party context to procurement and financial workflows. Required for role specialization.
      - name: supplier_code
        type: string(100)
        unique: true
        help: Enterprise supplier business reference. Used on purchase orders receipts invoices returns credits payments claims portals reports and integrations. Distinct from legal name and external registration identifiers. Identifies the supplier across procurement settlement recovery and performance. Required for operational recognition.
      - name: supplier_type
        type: string
        optional: true
        enum: SupplierSupplierType
        help: Classification of supplier relationship. Supports onboarding compliance tax contracting and reporting. Does not replace Party identity classification. Supplies supplier classification to procurement policy. Optional.
      - name: qualification_status
        type: string
        optional: true
        enum: SupplierQualificationStatus
        help: Procurement qualification state. Controls sourcing eligibility and supplier governance. Qualification is distinct from master lifecycle status and may consume SupplierPerformanceAssessment evidence. Gates new procurement commitments while historical transactions remain valid. Optional where supplier qualification is not used.
      - name: payment_terms
        type: string
        optional: true
        help: Default supplier settlement policy. Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting. Transaction or contract terms may override the default. Supplies default payable timing. Optional.
      - name: status
        type: string
        enum: SupplierStatus
        help: Supplier relationship lifecycle state. Controls procurement eligibility. Historical transactions remain valid after state changes. New procurement return claim-resolution and performance workflows must evaluate status. Required for eligibility.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: Identifies the underlying person or organization performing this role. Provides common identity without duplicating Party data. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity. Required because a role cannot exist without a participant.
      - name: role_type
        type: string
        enum: SupplierRoleType
        help: Defines the business capacity in which the Party participates. Determines specialized capabilities, policies, workflows, and validations. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process. Required for contextual participation.
      - name: code
        type: string(100)
        optional: true
        help: Optional business-context identifier for this role instance. Supports operational search, integrations, reports, and legacy references. Identifies the role instance and must not replace Party or specialized role identifiers. Optional when partyRoleId is sufficient.
      - name: valid_from
        type: date
        optional: true
        help: Date from which this role is eligible for ordinary business processing. Used by eligibility and transaction validation. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role. Optional for immediately effective roles.
      - name: valid_to
        type: date
        optional: true
        help: Date after which the role is no longer normally eligible for new business processing. Used by eligibility, renewal, reporting, and expiry workflows. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution. Optional for open-ended roles.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
      - name: supplier_role_id
        type: string
        fk: true
        references: Supplier
        optional: true
        help: Links the generic PartyRole to the specialized Supplier role record when applicable. Provides direct navigation from role assignment to specialized supplier commercial data. Optional because not every PartyRole represents a supplier. Connects supplier-role eligibility to governed procurement and supplier-management workflows.
  - name: PurchaseRequisition
    help: Represents internal demand for goods or services before that demand becomes an external procurement commitment. PurchaseRequisition is the demand and authorization layer of procurement. It answers what the organization needs, why it is needed, who requested it, and whether the organization authorized procurement. PurchaseOrder answers what was actually committed to a Supplier. Used by employees, managers, budget owners, procurement teams, sourcing functions, inventory planners, maintenance organizations, and approval workflows. PurchaseRequisition connects requester, organization, requested lines, and optional preferred supplier. Once approved, procurement may source the demand and create a PurchaseOrder. The resulting order establishes supplier commitments; receipts and InventoryMovement record physical fulfillment; invoices and payments handle financial settlement. Demand starts as DRAFT, is SUBMITTED for review, may be APPROVED or REJECTED, and becomes ORDERED when an authorized procurement commitment satisfies it. CLOSED indicates completion of the requisition process; CANCELLED terminates the demand without creating further obligations. A depot maintenance team discovers that 200 replacement components are required for upcoming repairs. A technician creates a PurchaseRequisition with the required Product lines and quantities, provides a justification, and submits it. After approval, procurement sources the items and creates a PurchaseOrder for the selected Supplier. The requisition remains the evidence of internal demand while the purchase order becomes the external commercial commitment.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the procurement demand request. Used to trace approvals, requisition lines, sourcing decisions, resulting purchase orders, and audit history. Identifies the requisition itself; it is different from the business requisitionNumber and from any PurchaseOrder created later. Required because procurement demand must remain traceable independently of downstream purchasing documents.
      - name: requisition_number
        type: string(100)
        unique: true
        help: The business-facing reference used by employees, procurement teams, approvers, and reports to identify the request. Used in approval forms, sourcing communication, procurement reports, and links between internal demand and downstream purchase orders. It identifies the internal request, not the supplier's response or the eventual PurchaseOrder number. Required for operational and approval traceability.
      - name: requisition_date
        type: date
        help: The date on which the internal procurement demand was formally created. Used for demand aging, approval turnaround, budgeting, sourcing analysis, and procurement planning. It represents internal demand creation and is distinct from PurchaseOrder.orderDate, supplier confirmation, and actual receipt. Required so procurement demand has a defined point in time.
      - name: status
        type: string
        enum: PurchaseRequisitionStatus
        help: Controls the lifecycle of the internal procurement request and whether it may progress toward sourcing or ordering. Drives approval workflow, buyer action, sourcing eligibility, conversion to PurchaseOrder, reporting, and cancellation rules. Requisition status describes internal demand authorization; PurchaseOrder status describes an external procurement commitment. Approval of a requisition does not itself mean a supplier has been ordered. The requester is preparing the demand and may still change it. The request has been submitted for review and approval. The organization has authorized the requested procurement demand, subject to sourcing and purchasing policy. The requested procurement demand was not approved. The approved demand has been converted into or otherwise satisfied by a PurchaseOrder or equivalent procurement commitment. The requisition lifecycle is complete and no further procurement action is required. The request has been intentionally withdrawn before completion. Required because procurement workflows need an authoritative demand state.
        default: DRAFT
      - name: justification
        type: string(2000)
        optional: true
        help: The business reason explaining why the requested goods or services are needed. Used by approvers to evaluate necessity, budget owners to validate spend, and procurement teams to understand sourcing context. Justification explains the reason for demand; it does not replace line-level product, quantity, delivery, or commercial information. Optional when organizational policy does not require a written justification for the particular request.
      - name: requester_id
        type: string
        fk: true
        references: Party
        help: Identifies the person or party that originated the procurement demand. Used for approval routing, clarification, accountability, notifications, and audit. Exactly one requester is responsible for originating the requisition. Requester is the demand originator and is not necessarily the buyer, approver, supplier, or eventual receiver.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Identifies the organizational context responsible for the procurement demand. Used for budget ownership, approval routing, purchasing policy, cost attribution, and reporting. Zero or one organization may be explicit when inherited from the requester or surrounding procurement context. The organization is the internal demand context and is distinct from the Supplier that may eventually fulfill the request.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: Identifies a preferred or known Supplier when the requester or procurement process already has a supplier in mind. Used for preferred-supplier sourcing, direct procurement, catalog requests, and buyer guidance. Optional because supplier selection may occur only after the requisition is approved and sourced competitively. A supplier on a requisition is a sourcing preference or known fulfillment candidate; it does not establish a PurchaseOrder commitment.
  - name: PurchaseRequisitionLine
    help: Represents one measurable internal procurement demand before it becomes an external supplier commitment. PurchaseRequisitionLine is where a business need becomes specific enough for procurement to source, approve, compare, and eventually order. It is demand, not yet a purchase obligation. Used by requesters, approvers, buyers, sourcing teams, inventory planners, and procurement workflows. PurchaseRequisition provides internal authorization context. Product and UnitOfMeasure provide meaning to the requested quantity. If approved and sourced, this demand may be transformed into one or more PurchaseOrderLines; the resulting order line is a separate commercial commitment and must retain traceability to the originating demand. A line begins as requested demand, participates in requisition review and approval, may be sourced or rejected, and may result in a purchase-order commitment. A requisition line can be partially ordered when demand is fulfilled through multiple suppliers, deliveries, or purchase orders. A depot technician requests 20 replacement door seals needed by a specified date. The line references the standardized seal Product and its unit, while the description records the equipment/application requirement. Procurement may source the demand from an approved Supplier and create a PurchaseOrderLine for the quantity actually committed.
    parent: PurchaseRequisition
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the requisition line. Used to trace the exact internal demand through approval, sourcing, purchase-order creation, fulfillment, and reporting. Identifies this demand line independently of the parent requisition, Product, or any later PurchaseOrderLine created from it. Required because each procurement demand must remain individually traceable.
      - name: line_number
        type: integer
        help: The business sequence number identifying the demand line within its PurchaseRequisition. Used by requesters, approvers, buyers, documents, and integrations to refer to a specific requested item or service. Meaningful only within the containing requisition; it is not a global identifier. Required for human-readable requisition processing.
        min: 1
      - name: quantity
        type: decimal
        help: The quantity of goods, materials, assets, or service units requested by the requester. Used for approval, sourcing, supplier quotation, planning, and eventual conversion into a purchase commitment. Quantity requires Product and UnitOfMeasure context to be meaningful and may differ from the quantity eventually ordered. Required because procurement demand must state the requested magnitude.
      - name: requested_date
        type: date
        optional: true
        help: The date by which the requester needs the requested goods or service to be available or completed. Used for prioritization, sourcing, purchasing lead-time analysis, supplier selection, and delivery planning. This is an internal need date and is distinct from the PurchaseOrder requestedDeliveryDate, Supplier promise date, and actual receipt date. Optional when the requester has no fixed need-by date.
      - name: description
        type: string(1000)
        help: The human-readable description of the requested item or service, including requirements that may not be represented by the Product reference alone. Used by approvers and buyers to understand the demand, obtain quotations, clarify specifications, and communicate requirements to suppliers. Description supplements Product; it must not silently replace a known Product identity when standardized master data exists. Required because procurement demand must remain understandable even when product master data is incomplete.
      - name: requisition_id
        type: string
        fk: true
        references: PurchaseRequisition
        help: Identifies the PurchaseRequisition that owns this internal procurement demand. Supplies requester, organization, approval, supplier preference, and requisition lifecycle context. Every requisition line belongs to exactly one PurchaseRequisition. The parent requisition controls the internal authorization context; the line provides the measurable demand.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized Product being requested when the demand can be expressed using product master data. Enables sourcing, catalog selection, inventory checks, specification validation, and conversion to a PurchaseOrderLine. Zero or one Product may be referenced because some requisitions begin as free-text or service requirements. A missing Product does not invalidate the demand; it indicates that purchasing may need to identify or create the appropriate product definition.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Defines the unit in which the requested quantity is expressed. Used to interpret quantities during approval, sourcing, quotation comparison, ordering, receipt, and conversion. Zero or one unit may be specified; the product's default unit may be inherited where applicable. UnitOfMeasure gives semantic meaning to quantity and supports conversion when the ordered unit differs from the requested unit.
  - name: RequestForQuotation
    help: Governs solicitation of supplier offers for approved procurement demand. PurchaseRequisition authorizes internal demand; RequestForQuotation solicits offers; SupplierQuotation records offers; PurchaseOrder creates the external commitment. Strategic sourcing, competitive procurement, supplier selection, negotiation, compliance, and audit. Bridges requisitions and suppliers to comparable responses and resulting purchase orders. Draft → issued → closed/awarded, with cancellation. Demand or supplier eligibility changes revalidate open sourcing; awarded history remains auditable and downstream orders require controlled amendment.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the sourcing request. Identifies one RFQ independently of requisitions, suppliers, responses, and purchase orders. Sourcing, comparison, audit, and integration. Root identity for quotation solicitation. Carries sourcing context from approved demand through award. Required.
      - name: rfq_number
        type: string(100)
        unique: true
        help: Business-facing RFQ reference. Identifies the solicitation to buyers and suppliers. Supplier communication, comparison, reports, and audit. Distinct from requisition and purchase-order numbers. Correlates supplier responses. Required.
      - name: issued_at
        type: datetime
        optional: true
        help: Time the RFQ was formally issued. Establishes when suppliers were invited to respond. Sourcing chronology and response-window control. Distinct from demand approval and award time. Optional while draft.
      - name: response_due_at
        type: datetime
        optional: true
        help: Deadline for supplier responses. Defines the normal competitive response window. Supplier communication, late-response policy, and sourcing SLA. Does not itself award business. Optional when sourcing policy has no fixed deadline.
      - name: status
        type: string
        enum: RequestForQuotationStatus
        help: Lifecycle state of the RFQ. Controls solicitation, response, closure, and award behavior. Sourcing workflow and governance. Award does not itself create a supplier commitment; PurchaseOrder does. Being prepared. Open to invited supplier responses. Response collection ended without final award state. One or more responses were selected for downstream commitment. Sourcing request terminated. Required.
        default: DRAFT
  - name: RequestForQuotationLine
    help: Line-level bridge from approved procurement demand to comparable supplier offers. The RFQ header controls the sourcing event; this line defines exactly what is being sourced. Strategic sourcing, competitive bids, services procurement, award allocation, and audit. PurchaseRequisitionLine supplies demand; SupplierQuotationLine supplies responses; PurchaseOrderLine executes awarded commitment. Prepared with RFQ, issued for response, closed/awarded with sourcing event, retained historically. Issued-line changes revalidate supplier responses and downstream awards without rewriting historical submissions.
    parent: RequestForQuotation
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of one RFQ requirement line. Identifies the sourced requirement independently of demand and supplier responses. Sourcing comparison, award, conversion, and audit. Bridges requisition demand to supplier quotation lines. Required.
      - name: line_number
        type: integer
        help: Business sequence within the RFQ. Human-facing reference for the requirement. Supplier communication, response matching, and audit. Unique within the parent RFQ. Required.
        min: 1
      - name: requested_quantity
        type: decimal
        help: Quantity suppliers are requested to quote. Defines the sourcing magnitude for this requirement. Bid comparison and award allocation. Must reconcile with originating requisition demand and UOM. Required.
      - name: description
        type: string(2000)
        help: Sourcing description and requirement detail. Communicates what suppliers must price or propose. Solicitation and comparison. Supplements Product and originating demand. Required.
      - name: requisition_line_id
        type: string
        fk: true
        references: PurchaseRequisitionLine
        optional: true
        help: Approved internal demand being sourced. Preserves exact demand provenance. Demand reconciliation and audit. Optional only for authorized sourcing not originating from a requisition line. Supplies requested product, quantity, and need context.
      - name: request_for_quotation_id
        type: string
        fk: true
        help: Parent sourcing solicitation. Supplies invited suppliers, deadlines, and sourcing lifecycle. RFQ execution and audit. Exactly one parent RFQ. Controls solicitation lifecycle.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Standardized product being sourced. Identifies the requested item when master data exists. Supplier comparison and order conversion. Optional for free-text services. Must reconcile with originating demand.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit qualifying requestedQuantity. Makes sourcing quantity comparable. Quote normalization and conversion. Optional only when quantity semantics are otherwise unambiguous. Supports compatible quotation and order units.
  - name: SupplierQuotation
    help: Preserves a supplier's commercial response to governed sourcing. SupplierQuotation is evidence of an offer; RequestForQuotation is the solicitation; PurchaseOrder is the later commitment. Sourcing, bid comparison, negotiation, supplier selection, procurement compliance, and audit. Connects Supplier and RFQ to resulting PurchaseOrders without conflating offer and commitment. Received → under review → accepted/rejected/expired/withdrawn. Supplier qualification, RFQ changes, and validity changes revalidate open evaluation; accepted historical offers remain immutable evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the supplier response. Identifies one offer independently of supplier document number and RFQ. Comparison, negotiation, award, and audit. Root identity for the offer. Preserves supplier response evidence. Required.
      - name: quotation_number
        type: string(120)
        help: Supplier or sourcing reference for the offer. Human-facing identifier of the commercial response. Communication, comparison, order conversion, and audit. Scoped with supplier where supplier numbering is not globally unique. Required.
      - name: submitted_at
        type: datetime
        help: Time the supplier response was received or submitted. Establishes offer chronology and deadline compliance. Sourcing governance and audit. Distinct from RFQ issue and purchase-order dates. Required.
      - name: valid_until
        type: date
        optional: true
        help: Last date on which the commercial offer remains valid. Defines the supplier's price/terms validity window. Award eligibility and purchase-order conversion. Expiry does not rewrite historical offer evidence. Optional if no explicit expiry applies.
      - name: total_amount
        type: Money
        optional: true
        help: Total offered commercial amount. Summarizes the supplier offer for comparison. Sourcing analysis, approvals, and order conversion. Must reconcile with detailed offer basis when line detail is modeled. Optional while offer pricing is incomplete.
      - name: status
        type: string
        enum: SupplierQuotationStatus
        help: Evaluation state of the supplier offer. Controls whether the response is pending, selected, rejected, expired, or withdrawn. Comparison and award workflow. ACCEPTED authorizes downstream conversion but PurchaseOrder remains the commitment. Offer captured. Being evaluated. Selected through governed award. Not selected. Validity elapsed. Supplier withdrew the offer. Required.
        default: RECEIVED
      - name: supplier_id
        type: string
        fk: true
        help: Supplier making the offer. Identifies the commercial counterparty candidate. Qualification, comparison, award, and performance analysis. Exactly one supplier owns the response. Must be eligible under sourcing policy.
      - name: request_for_quotation_id
        type: string
        fk: true
        help: RFQ answered by this offer. Supplies the governed solicitation and demand context. Comparison and audit. Every sourcing response belongs to exactly one RFQ. Defines requirements and eligible sourcing context.
  - name: SupplierQuotationLine
    help: Line-level supplier offer used for sourcing comparison and controlled conversion to purchase commitment. SupplierQuotationLine is commercial evidence, while PurchaseOrderLine is the binding procurement commitment. Bid comparison, negotiation, split award, purchase-order generation, compliance, and audit. Answers RequestForQuotationLine and may produce one or more PurchaseOrderLines. Received → evaluated → accepted/partially accepted/rejected → retained as sourcing evidence. Offer or award changes revalidate downstream unissued commitments; issued commitments require controlled amendments.
    parent: SupplierQuotation
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of one supplier offer line. Identifies one commercial response independently of header and order conversion. Comparison, negotiation, award, and audit. Connects an RFQ requirement to resulting order lines. Required.
      - name: line_number
        type: integer
        help: Sequence within the supplier quotation. Human-facing offer-line reference. Comparison and supplier communication. Unique within SupplierQuotation. Required.
        min: 1
      - name: offered_quantity
        type: decimal
        help: Quantity the supplier offers to provide. States supply coverage for the RFQ requirement. Award allocation and order conversion. Interpreted using UnitOfMeasure. Required.
      - name: unit_price
        type: Money
        help: Transaction-time offered unit price. Preserves the supplier's commercial offer for comparison and later verification. Bid analysis, negotiation, award, and purchase-order pricing. Historical offer evidence rather than mutable supplier master pricing. Required.
      - name: promised_date
        type: date
        optional: true
        help: Supplier's offered delivery or completion date. Records the delivery promise used during award evaluation. Lead-time comparison and order conversion. Distinct from actual receipt date. Optional when no date is offered.
      - name: award_status
        type: string
        enum: SupplierQuotationLineAwardStatus
        help: Award state of this offer line. Records whether and to what extent this response was selected. Award workflow and split sourcing. Selection authorizes conversion but does not itself create a PurchaseOrderLine. Not yet decided. Selected for the governed quantity. Selected for part of offered quantity. Not selected. Required.
        default: PENDING
      - name: request_for_quotation_line_id
        type: string
        fk: true
        help: Exact sourcing requirement answered. Enables like-for-like line comparison. Award analysis and traceability. Exactly one RFQ line is answered. Supplies requested product and quantity context.
      - name: supplier_quotation_id
        type: string
        fk: true
        help: Parent supplier offer. Supplies supplier, validity, and response lifecycle. Sourcing governance and audit. Exactly one parent quotation. Controls offer eligibility.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Product offered. Confirms or proposes the item satisfying the requirement. Technical/commercial comparison. Optional for service/free-text requirements. Must satisfy approved substitution policy.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit qualifying offered quantity and price. Makes offer quantities commercially comparable. Normalization and order conversion. Optional only where unambiguous. Conversion must use governed UOM rules.
  - name: PurchaseOrder
    help: Represents the formal commercial procurement commitment between a buying organization and a Supplier. PurchaseOrder establishes what the Supplier is expected to provide; it is not proof that goods arrived or that later returns occurred. Purchasing, supplier management, receiving, warehouse operations, accounts payable, budgeting, inventory planning and analytics. PurchaseRequisition represents internal demand. PurchaseOrder converts approved demand into an external commitment. PurchaseOrderLine specifies the commitment. GoodsReceipt records actual receipt and acceptance. InventoryMovement records stock effects. SupplierReturn reverses eligible fulfillment. Invoice records the supplier claim. SupplierCreditNote records authorized financial reduction. Payment settles claims. Draft, approval, issuance, receipt, return, cancellation and closure are distinct stages. Financial settlement can continue after physical fulfillment or return. PurchaseOrder → GoodsReceipt → acceptance → InventoryMovement; when goods must be returned, eligible receipt → SupplierReturn → InventoryMovement reversal → SupplierCreditNote → payable reconciliation. A depot orders 100 parts, receives 96 and accepts 94. Later, three accepted parts are returned as defective. The original order and receipt remain unchanged; SupplierReturn and its inventory/credit workflows record the reversal.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the purchase order. Used for procurement, receiving, invoice matching, supplier returns, audit and integrations. Identifies the order independently of orderNumber, Supplier, lines, GoodsReceipt and SupplierReturn. Stable root reference across commitment, fulfillment, reversal and closure. Required for procurement traceability.
      - name: order_number
        type: string(100)
        unique: true
        help: Human-facing procurement reference. Used by buyers, suppliers, receiving, accounts payable and integrations. Business reference distinct from technical purchaseOrderId. Correlates procurement activity across systems. Required for operational traceability.
      - name: order_date
        type: datetime
        help: Date and time the procurement commitment is created or issued. Supports chronology, approval, reporting and reconciliation. Distinct from requested delivery, receipt, return, invoice and payment dates. Anchors the commitment lifecycle. Required for chronology.
      - name: status
        type: string
        enum: PurchaseOrderStatus
        help: Lifecycle state of the procurement commitment. Controls authorization, issuance, fulfillment, cancellation and closure. PurchaseOrder status does not prove physical receipt, supplier return or invoice settlement; those are separate facts. Being prepared. Internally authorized. Communicated to Supplier. Some committed quantity accepted while outstanding fulfillment remains. Required fulfillment accepted under policy. Remaining commitment terminated. Required operational and financial processing complete.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Currency qualifying order monetary values. Used for pricing, totals, invoice matching, supplier credit calculation and financial reporting. Qualifies amounts and does not identify Supplier or Product.
      - name: requested_delivery_date
        type: date
        optional: true
        help: Buyer's requested delivery or completion date. Used for supplier communication and fulfillment planning. A request, not proof of actual receipt or return. Supports delivery planning.
      - name: total_amount
        type: decimal
        optional: true
        help: Order-level value derived from committed lines and commercial adjustments. Used for approval, budget, supplier commitment and invoice reconciliation. Must reconcile with PurchaseOrderLine values and currencyId.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier receiving the procurement commitment. Drives sourcing, delivery, receiving, supplier performance, returns and accounts payable. GoodsReceipt and SupplierReturn supplier should normally match this supplier.
      - name: request_for_quotation_id
        type: string
        fk: true
        optional: true
        help: Sourcing solicitation from which this order was awarded when applicable. Preserves demand-to-source-to-order traceability. Procurement compliance, price validation, and audit. Optional for direct or non-RFQ procurement. Supplies sourcing context without replacing order approval.
      - name: supplier_quotation_id
        type: string
        fk: true
        optional: true
        help: Accepted supplier offer forming the commercial basis of this order when applicable. Preserves awarded price and term provenance. Order verification, three-way sourcing audit, and supplier analysis. Optional where procurement does not use supplier quotations. Provides offer evidence while PurchaseOrder remains the external commitment.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Buying organization responsible for the commitment. Supports authorization, legal entity, budget, tax and reporting.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Intended operational destination for ordered goods or services. Used for receiving and logistics planning.
      - name: supplier_performance_assessment_id
        type: string
        fk: true
        optional: true
        help: The SupplierPerformanceAssessment this PurchaseOrder belongs to.
  - name: PurchaseOrderLine
    help: Represents one measurable procurement commitment and its accumulated fulfillment, billing and reverse-fulfillment state. PurchaseOrderLine states what the buyer committed to purchase. GoodsReceiptLine records receipt. SupplierReturnLine records subsequent reversal. InvoiceLine records supplier claim. Purchasing, supplier communication, receiving, inventory, supplier returns, accounts payable, budgeting and three-way matching. PurchaseOrder supplies supplier and commercial context; GoodsReceiptLine supplies accepted fulfillment; SupplierReturnLine supplies reverse quantity; SupplierCreditNoteLine supplies financial adjustment. Pricing → commitment → receipt → acceptance → InventoryMovement; if goods are returned, eligible accepted quantity → SupplierReturnLine → InventoryMovement reversal → SupplierCreditNoteLine. Historical commitment remains unchanged. Created → approved/issued → partially/fully received → optionally partially/fully returned → billed/closed according to policy. Historical commercial evidence remains reproducible. A line commits to 100 units, 94 are accepted, and three are later returned. receivedQuantity remains the receipt projection, acceptedQuantity remains accepted fulfillment evidence, returnedQuantity becomes three from posted return events, and the original quantity/price remain unchanged.
    parent: PurchaseOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: unit_price
        type: Money
      - name: line_amount
        type: Money
      - name: received_quantity
        type: decimal
        default: "0"
      - name: accepted_quantity
        type: decimal
        default: "0"
      - name: returned_quantity
        type: decimal
        default: "0"
      - name: outstanding_quantity
        type: decimal
        default: "0"
      - name: price_source
        type: string
        optional: true
        enum: PurchaseOrderLinePriceSource
        help: Source used to determine procurement price. Supports audit, spend analysis and supplier negotiations. Does not replace transaction-time unitPrice. Explains price determination.
      - name: price_determined_at
        type: datetime
        optional: true
        help: Time at which effective purchase price was determined. Supports effective-dated pricing and audit. Distinct from PurchaseOrder creation time. Anchors commercial pricing evidence.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit used to quantify the commitment. Defines how quantity is interpreted. Must reconcile with receiving and return conversions.
      - name: supplier_quotation_line_id
        type: string
        fk: true
        optional: true
        help: Awarded supplier offer line providing commercial provenance for this commitment. Links committed quantity and price to evaluated sourcing evidence. Sourcing compliance, price verification, split-award reconciliation, and audit. Optional for direct procurement or other authorized sourcing methods. Must reconcile with awarded quantity, product, UOM, price, and authorized negotiated amendments.
      - name: purchase_order_id
        type: string
        fk: true
        help: Parent procurement commitment. Supplies supplier, organization, currency and lifecycle context. Controls commitment and closure.
      - name: product_id
        type: string
        fk: true
        help: Product or item being procured. Identifies what was committed. Must reconcile across receipt, return and invoice evidence.
      - name: purchase_requisition_line_id
        type: string
        fk: true
        optional: true
        help: Internal demand line satisfied by this procurement commitment. Preserves exact demand-to-order traceability. Demand fulfillment, budget control, sourcing audit, and planning. Optional for procurement not originating from requisition. Ordered quantities contribute to fulfillment of approved internal demand.
  - name: GoodsReceipt
    help: "Controlled receiving document whose line evidence establishes original fulfillment and eligible basis for later supplier returns. GoodsReceipt is the fulfillment bridge between PurchaseOrder commitment and accepted inventory/service. SupplierReturn is a later reverse-procurement event that consumes eligible accepted receipt evidence without rewriting it. Receiving, warehouse operations, procurement, quality, supplier management, accounts payable, inventory control, three-way matching and supplier returns. PurchaseOrder is the commitment. GoodsReceiptLine is actual receipt/disposition evidence. InventoryMovement is physical stock consequence. InvoiceLine is financial claim. SupplierReturnLine records later quantity returned. SupplierCreditNoteLine records financial reduction. Draft → line validation → received → inspection/disposition → accepted/partially accepted/rejected → accepted inventory posting and PO fulfillment → invoice matching. Later, eligible accepted receipt quantity → SupplierReturn → attributable inventory issue/return-to-supplier movement → SupplierCreditNote → payable reconciliation. Historical receipt quantities remain immutable. Draft → Received → Inspection Pending → Accepted/Partially Accepted/Rejected → controlled correction if required. Posted evidence remains historical. Header status changes drive allowed downstream workflow; line changes recalculate header totals/state. Supplier returns consume eligible accepted quantities and create separate inventory/financial consequences rather than modifying receipt history. All downstream posting is idempotent and traceable to receipt lines. A receipt records 96 units: 94 accepted and 2 rejected. Later, 10 of the 94 accepted units are returned to the supplier. The receipt remains 96 received and 94 accepted; SupplierReturnLine references the receipt evidence, an attributable InventoryMovement reduces stock by 10, and SupplierCreditNote records the payable reduction."
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the receipt. Identifies the historical receiving event independently of later supplier returns or corrections. Receiving, inventory, procurement, audit and reconciliation. SupplierReturn references eligible receipt evidence without rewriting this identity. Stable root reference for receipt lifecycle and downstream traceability. Required.
      - name: receipt_number
        type: string(100)
        unique: true
        help: Human-facing receiving reference. Identifies the receipt in warehouse and supplier operations. Documents, audit, matching and return processing. Distinct from SupplierReturn.returnNumber and PurchaseOrder number. Provides operational reference across receipt and later return workflows. Required.
      - name: receipt_date
        type: datetime
        help: Date and time the receipt was recorded. Establishes receiving chronology. Inventory history, procurement, matching and audit. Distinct from later SupplierReturn.returnDate. Anchors original receipt evidence. Required.
      - name: status
        type: string
        enum: GoodsReceiptStatus
        help: Controlled receiving-document lifecycle state. Indicates whether receipt evidence can affect fulfillment and inventory. Controls receiving progression and authorized corrections. SupplierReturn is a later reverse-procurement event and does not rewrite receipt status. Controls receiving progression and authorized corrections.
        default: DRAFT
      - name: received_quantity
        type: decimal
        help: Total quantity physically recorded as received. Sum of line received quantities. Receiving and audit. SupplierReturn eligibility is derived from accepted receipt evidence, not received quantity alone. Provides original physical receipt basis. Required.
        default: "0"
      - name: accepted_quantity
        type: decimal
        help: Quantity accepted after receiving controls. Sum of line accepted quantities that may become inventory. Inventory posting, PO fulfillment and invoice matching. SupplierReturnLine eligibility is normally based on accepted quantity and subsequent prior returns. Provides authoritative accepted receipt basis for later supplier returns. Required.
        default: "0"
      - name: notes
        type: string(2000)
        optional: true
        help: Receiving notes and operational context. Human-readable context for receipt exceptions or inspection. Operations and audit. Does not replace structured disposition or return evidence. Supports review. Optional.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier that delivered the receipt. Identifies the commercial party responsible for the delivery. Receiving, procurement, audit and supplier return processing. Supplies supplier context for subsequent returns.
      - name: purchase_order_id
        type: string
        fk: true
        help: Procurement commitment fulfilled by this receipt. Connects received goods to what was ordered. Receiving, fulfillment, matching and supplier return eligibility. Supplies original procurement context.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: The SupplierClaim this GoodsReceipt belongs to.
      - name: supplier_performance_assessment_id
        type: string
        fk: true
        optional: true
        help: The SupplierPerformanceAssessment this GoodsReceipt belongs to.
  - name: GoodsReceiptLine
    help: Provides the line-level bridge between ordered quantity, received quantity, accepted inventory, supplier invoice matching and later supplier returns. GoodsReceiptLine is the actual receipt result. PurchaseOrderLine is commitment. InventoryMovement is stock consequence. InvoiceLine is financial claim. SupplierReturnLine records a later reversal of eligible accepted quantity. Receiving, quality, procurement, inventory, supplier management, accounts payable, invoice matching, supplier returns and audit. PurchaseOrderLine defines ordered product/quantity/price. Accepted receipt creates inventory and fulfillment consequences. Invoice matching relies on accepted evidence. SupplierReturnLine consumes remaining eligible accepted quantity and SupplierCreditNoteLine may record financial reduction. PurchaseOrderLine → GoodsReceiptLine → inspection/disposition → accepted → InventoryMovement/InventoryBalance and PO fulfillment. Later eligible accepted quantity → SupplierReturnLine → attributable inventory reduction → SupplierCreditNoteLine → payable application. Original receipt evidence remains immutable. Draft → recorded → inspected/dispositioned → accepted/rejected/partially accepted → inventory posted → historical evidence. Corrections use compensating events. Receipt posting and supplier-return consumption must use stable line/disposition identities so retries cannot duplicate inventory or returned quantity. A PO orders 100 units. Receipt accepts 94 and rejects 2. Later 10 accepted units are returned. SupplierReturnLine references this receipt line for 10; inventory is reduced by an attributable movement and the original acceptedQuantity remains 94.
    parent: GoodsReceipt
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the receipt line. Identifies original receipt evidence independently of later supplier returns. Receiving, inventory, matching, returns and audit. SupplierReturnLine references this evidence without modifying it. Stable line-level traceability. Required.
      - name: line_number
        type: integer
        help: Sequence number within the receipt. Identifies the receiving line. Documents and audit. Distinct from PurchaseOrderLine and SupplierReturnLine numbering. Supports deterministic receipt reconstruction. Required.
        min: 1
      - name: received_quantity
        type: decimal
        help: Quantity physically recorded as received. Preserves original receipt quantity. Receiving and audit. SupplierReturn eligibility is based on accepted quantity, not rejected or pending quantity. Provides physical receipt evidence. Required.
      - name: accepted_quantity
        type: decimal
        help: Quantity accepted after receiving controls. Represents quantity eligible for normal inventory posting and normally later supplier return. Inventory, PO fulfillment, matching and supplier returns. SupplierReturnLine quantity cannot normally exceed accepted quantity remaining after prior returns. Provides authoritative eligibility basis. Required.
        default: "0"
      - name: rejected_quantity
        type: decimal
        help: Quantity rejected at receipt. Records quantity not accepted into normal inventory. Quality and supplier dispute processing. Rejected quantity is not normally eligible for a supplier return because it was not accepted inventory; explicit exception workflows may differ. Provides disposition evidence. Required.
        default: "0"
      - name: pending_inspection_quantity
        type: decimal
        help: Quantity awaiting inspection or disposition. Records unresolved receipt quantity. Quality, receiving and inventory controls. Pending quantity cannot normally be returned as accepted stock until controlled disposition establishes eligibility. Blocks premature supplier-return eligibility. Required.
        default: "0"
      - name: unit_price
        type: Money
        optional: true
        help: Procurement price basis applicable at receipt time. Supports receipt valuation, accruals and invoice matching. Normally inherited from PurchaseOrderLine but may reflect authorized receipt-specific adjustment. Provides financial context without replacing PO commitment.
      - name: notes
        type: string(2000)
        optional: true
        help: Receiving notes and line-specific context. Explains exceptions or inspection findings. Operations and audit. Does not replace structured disposition or return evidence. Supports review. Optional.
      - name: unit_of_measure_id
        type: string
        fk: true
        help: Unit used for receipt quantities. Defines measurement semantics. Receiving, inventory and return quantity conversion. Supplies conversion context.
      - name: purchase_order_line_id
        type: string
        fk: true
        help: Procurement commitment fulfilled by this receipt line. Connects actual receipt to ordered product and quantity. Fulfillment, matching and return eligibility. Supplies source commitment context.
      - name: goods_receipt_id
        type: string
        fk: true
        help: Parent receipt containing this line. Provides document context for original receipt evidence. Receiving, inventory and audit. Parent receipt controls header lifecycle.
      - name: product_id
        type: string
        fk: true
        help: Product received on this line. Identifies stock item. Receiving, inventory, quality and returns. Determines item identity for movements and returns.
  - name: SupplierClaim
    help: Provides a formal auditable case for supplier-related quality or commercial recovery while keeping the decision and physical/financial consequences as separate controlled records. SupplierClaim explains what went wrong and what recovery was requested or agreed. SupplierClaimResolution records the authorized remedy. SupplierReturn handles physical reversal; SupplierCreditNote or SupplierDebitNote handles financial adjustment; Payment handles cash movement. Supplier quality procurement warranty dispute management recovery supplier scorecards accounts payable and audit. PurchaseOrder GoodsReceipt and Invoice provide source evidence; QualityInspection provides technical evidence; SupplierClaimResolution governs the remedy; downstream transactions execute it. Issue detected → claim opened → evidence collected → supplier review → accepted/rejected → SupplierClaimResolution approved → create required SupplierReturn/SupplierCreditNote/SupplierDebitNote/Payment → reconcile outcome → close claim. No downstream effect is inferred merely from claim acceptance. Draft → open → under review → accepted/partially accepted/rejected → resolved → closed, with cancellation and escalation paths. Changes to source receipt inspection invoice return resolution or financial evidence trigger claim revalidation or reconciliation; completed source transactions remain immutable. An invoice contains an overcharge of EUR 500. A SupplierClaim records the issue, a SupplierClaimResolution authorizes DEBIT_ADJUSTMENT, and a SupplierDebitNote records the recovery while the original Invoice remains unchanged.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the supplier claim. Identifies one claim independently of its supplier source transaction return inspection resolution or financial settlement. Used for supplier performance dispute management quality warranty recovery and audit. SupplierClaim is a case/evidence record; SupplierReturn handles physical reversal and SupplierCreditNote or SupplierDebitNote handles explicit financial adjustment. Root reference through claim investigation resolution and closure. Required.
      - name: claim_number
        type: string(100)
        unique: true
        help: Business-facing supplier claim reference. Identifies the claim for procurement quality and supplier communication. Used in correspondence investigations reporting and reconciliation. Distinct from PurchaseOrder GoodsReceipt Invoice SupplierReturn and financial adjustment numbers. Provides the operational reference throughout the claim lifecycle. Required.
      - name: claim_date
        type: datetime
        help: Date and time the claim was raised. Establishes when the organization formally asserted the supplier issue. Supports SLA measurement dispute aging supplier performance and audit. Distinct from receipt inspection return resolution and financial-document dates. Anchors claim chronology. Required.
      - name: status
        type: string
        enum: SupplierClaimStatus
        help: Lifecycle state of the supplier claim. Indicates whether the issue is being prepared investigated accepted disputed resolved or closed. Controls investigation supplier response settlement and escalation. Claim status is independent from SupplierReturn SupplierCreditNote SupplierDebitNote and SupplierClaimResolution statuses. Coordinates the case while physical and financial effects remain separate transactions. Required.
        default: OPEN
      - name: claim_type
        type: string
        enum: SupplierClaimClaimType
        help: Classification of the supplier issue. States the principal business nature of the claim. Drives routing evidence requirements supplier scorecards and analytics. May be supported by QualityInspection or receiving evidence and may result in a return credit debit or other resolution. Determines investigation and resolution policy. Required.
      - name: claimed_amount
        type: Money
        optional: true
        help: Financial value asserted by the organization in the claim. Represents requested or estimated monetary recovery before supplier agreement or final adjustment. Supports negotiation exposure reporting and recovery analysis. It is not an accounting posting and must not be confused with SupplierCreditNote.totalAmount or SupplierDebitNote.totalAmount. Provides commercial context for settlement negotiation. Optional for non-financial claims.
      - name: resolution_code
        type: string
        optional: true
        enum: SupplierClaimResolutionCode
        help: Agreed outcome category of the supplier claim. Records the high-level outcome without itself executing the resulting transaction. Supports supplier performance recovery analytics and downstream workflow routing. Detailed authorization is represented by SupplierClaimResolution; RETURN may create SupplierReturn; CREDIT may create SupplierCreditNote; DEBIT_ADJUSTMENT may create SupplierDebitNote. Summarizes the resolution after agreement. Optional until resolution is agreed.
      - name: notes
        type: string(4000)
        optional: true
        help: Additional claim narrative and investigation context. Records information not represented by structured fields. Supplier communication investigation escalation and audit. Complements structured inspection receipt invoice and return evidence without replacing it. Supports review and resolution. Optional.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier against whom the claim is raised. Identifies the external party responsible for the disputed supply or service. Supports communication scorecards recovery and escalation. Supplies supplier qualification and commercial context.
      - name: purchase_order_id
        type: string
        fk: true
        optional: true
        help: Procurement commitment associated with the claim. Connects the supplier issue to the original purchasing commitment. Supports contractual price and quantity investigation. Supplies commercial source evidence.
      - name: supplier_performance_assessment_id
        type: string
        fk: true
        optional: true
        help: The SupplierPerformanceAssessment this SupplierClaim belongs to.
  - name: SupplierClaimResolution
    help: Converts a supplier claim decision into a controlled auditable execution plan without conflating the case remedy and resulting transactions. SupplierClaim explains the problem; SupplierClaimResolution records the agreed remedy; SupplierReturn SupplierCreditNote SupplierDebitNote and Payment execute distinct physical or financial consequences. Supplier dispute management procurement recovery accounts payable quality logistics and audit. The resolution bridges case management and execution while preserving independent transaction histories. SupplierClaim accepted → remedy negotiated → SupplierClaimResolution approved → required return/credit/debit/payment executed → evidence reconciled → claim resolved/closed. Draft → approved → in execution → partially executed/executed, with failed and cancelled paths. Changes to the originating claim or downstream execution evidence require resolution revalidation; completed downstream transactions are corrected through their own compensating workflows. A quality claim is accepted for three defective units and EUR 300 recovery. The resolution authorizes RETURN plus CREDIT, links the resulting SupplierReturn and SupplierCreditNote, and becomes executed only after both required outcomes reconcile.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the claim resolution. Identifies one authorized resolution decision independently of the originating claim and downstream transactions. Used for approvals reconciliation audit and supplier performance. SupplierClaim records the case; this record captures the agreed outcome; SupplierReturn SupplierCreditNote SupplierDebitNote and Payment provide execution evidence. Stable reference across approval execution and closure. Required.
      - name: resolution_number
        type: string(100)
        unique: true
        help: Human-facing resolution reference. Identifies the resolution decision for operational and supplier communication. Used in approvals correspondence reconciliation and audit. Distinct from the SupplierClaim claimNumber and downstream transaction numbers. Correlates resolution activity. Required.
      - name: resolution_date
        type: datetime
        help: Date and time the resolution was authorized. Establishes when the agreed remedy became effective. SLA reporting audit and financial control. Anchors downstream execution. Required.
      - name: resolution_type
        type: string
        enum: SupplierClaimResolutionResolutionType
        help: Authorized remedy for the supplier claim. Defines what outcome was agreed without itself executing the remedy. Routes downstream workflows and measures recovery outcomes. RETURN may require SupplierReturn; CREDIT may require SupplierCreditNote; DEBIT_ADJUSTMENT may require SupplierDebitNote; CASH_RECOVERY may require Payment. Determines required execution evidence. Required.
      - name: status
        type: string
        enum: SupplierClaimResolutionStatus
        help: Lifecycle state of the resolution. Separates decision approval from execution and completion. Controls downstream work and claim closure. Resolution status does not replace SupplierClaim or downstream transaction statuses. Gates execution and confirms whether required consequences completed. Required.
        default: DRAFT
      - name: approved_amount
        type: Money
        optional: true
        help: Monetary recovery authorized by the resolution. Defines the financial amount expected from the agreed remedy. Supplier recovery and reconciliation. Not itself a credit note debit note or cash receipt; execution requires the appropriate financial transaction. Provides the controlled financial target. Optional for non-financial remedies.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: The Supplier this SupplierClaimResolution belongs to.
      - name: supplier_claim_id
        type: string
        fk: true
        help: Supplier claim being resolved. Connects the remedy to the case and evidence that established the issue. Claim closure and audit. Supplies authoritative case context.
      - name: supplier_performance_assessment_id
        type: string
        fk: true
        optional: true
        help: The SupplierPerformanceAssessment this SupplierClaimResolution belongs to.
  - name: SupplierCreditNote
    help: Represents an explicit financial reduction of supplier payable exposure while preserving original procurement invoice claim resolution and return history. SupplierClaim explains the issue; SupplierClaimResolution authorizes the remedy; SupplierReturn is the physical event; SupplierCreditNote records the financial consequence; SupplierCreditNoteApplication records consumption against invoices; JournalEntry records accounting recognition. Accounts payable procurement supplier reconciliation claims tax accounting and audit. SupplierReturn records physical reversal, SupplierClaim records the case, SupplierClaimResolution records the authorized outcome, Invoice records the original payable claim, SupplierCreditNoteLine records financial detail, SupplierCreditNoteApplication records payable application, and JournalEntry records accounting. Claim/return/adjustment approval → SupplierClaimResolution → credit calculation from original transaction evidence → supplier credit approval → posting → JournalEntry → SupplierCreditNoteApplication against eligible Invoice → payable balance reconciliation. Supplier settlement or refund is a separate financial workflow. Draft → approved → posted → partially applied/fully applied, with cancellation before posting and reversal after posting. Changes to claim resolution return or invoice evidence trigger revalidation before posting. Posted credit changes require reversal/replacement. Applications are corrected by reversal/reallocation rather than mutation. Three defective units are returned. SupplierClaimResolution authorizes CREDIT for EUR 300, SupplierCreditNote records the approved credit, accounting recognizes it, and SupplierCreditNoteApplication applies it against the supplier invoice without changing historical invoice lines.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier credit note. Identifies the financial adjustment independently of its number source return claim invoice application and accounting entries. Used for accounts payable reconciliation audit tax and integration. Stable identity across drafting approval posting application and reversal. Required.
      - name: credit_note_number
        type: string(100)
        unique: true
        help: Business-facing supplier credit reference. Identifies the credit document for supplier communication and financial reconciliation. Used by accounts payable suppliers auditors and integrations. Correlates internal adjustment with external supplier documentation. Required.
      - name: credit_note_date
        type: date
        help: Effective date of supplier credit adjustment. Establishes financial chronology and applicable accounting/tax period. Payable aging tax reporting and period control. Anchors recognition of adjustment. Required.
      - name: status
        type: string
        enum: SupplierCreditNoteStatus
        help: Lifecycle state of supplier credit. Separates preparation authorization accounting recognition and application against supplier claims. Controls posting payable reconciliation and reversal. Status does not change original Invoice GoodsReceipt SupplierClaim or SupplierClaimResolution history. POSTED establishes adjustment; application states reflect controlled consumption. Required.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency in which supplier credit is denominated. Defines monetary denomination of adjustment. Payable reconciliation accounting tax and application. Qualifies all credit monetary values. Required.
      - name: subtotal
        type: Money
        help: Credit value before applicable tax. Pre-tax reduction derived from credit lines. Tax calculation and reconciliation. Feeds total credit calculation. Required.
      - name: tax_amount
        type: Money
        help: Tax component reversed or adjusted. Tax correction associated with credited value. Tax reporting and accounting reconciliation. Contributes to total credit. Required, including zero.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total payable reduction represented by supplier credit. Financial value recognized as credit against supplier exposure. Accounts payable reconciliation statements and accounting. Determines maximum adjustment available for application. Required.
      - name: amount_applied
        type: Money
        help: Portion of supplier credit already applied to payable claims. Separates credit created from portion consumed against invoices. Drives open credit and payable reconciliation. Must reconcile with active SupplierCreditNoteApplication records. Changes only through explicit application/reversal events. Required.
        default: '{"amount":0}'
      - name: amount_unapplied
        type: Money
        help: Remaining supplier credit not yet applied. Available credit exposure under policy. Future invoice application or supplier settlement/refund processing. Reconciles totalAmount less active applications. Required.
        default: '{"amount":0}'
      - name: supplier_id
        type: string
        fk: true
        help: Supplier associated with the credit. Identifies supplier whose payable exposure is reduced. Payables and supplier statements. Reconciles source Invoice SupplierClaim and SupplierReturn context.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: Supplier claim supporting the credit. Connects the financial adjustment to the business case and evidence for recovery. Claim resolution audit and reconciliation. Provides case context for credit authorization.
      - name: supplier_claim_resolution_id
        type: string
        fk: true
        optional: true
        help: Authorized claim resolution that approved this credit remedy. Connects the credit to the controlled decision authorizing the financial recovery. Governance approval execution tracking and claim closure. Supplies execution mandate for CREDIT resolution.
      - name: source_return_id
        type: string
        fk: true
        references: SupplierReturn
        optional: true
        help: Supplier return that caused the credit. Connects financial adjustment to physical reverse-procurement event. Return-to-credit traceability and approval. Provides return eligibility evidence.
  - name: SupplierCreditNoteLine
    help: Provides the auditable quantity, value, discount and tax detail behind a supplier payable adjustment. It is the financial mirror of an original supplier invoice line for the credited portion, not a replacement of that line. Accounts payable, tax, supplier reconciliation, audit and accounting. SupplierReturnLine explains the physical cause; InvoiceLine explains the original financial claim; SupplierCreditNoteLine explains the approved financial reduction. Identify eligible invoice evidence → determine credited quantity/value → apply original pricing and tax evidence → calculate credit → approve → post to SupplierCreditNote. Three units originally invoiced at EUR 100 are returned. The line preserves quantity 3 and original price EUR 100, applies the applicable historical discount/tax treatment, and contributes the resulting amount to the supplier credit note.
    parent: SupplierCreditNote
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier credit line. Identifies one component of a supplier financial adjustment. Used for reconciliation, accounting, tax and audit. Stable reference for posting and reversal. Required for traceability.
      - name: line_number
        type: integer
        help: Sequence number within the supplier credit note. Provides deterministic document ordering. Used in credit documents and reconciliation. Identifies the line during approval and posting. Required for deterministic document structure.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Quantity to which the supplier credit relates. Connects the financial adjustment to a returned or otherwise adjusted quantity. Supports quantity/value reconciliation. Must reconcile with eligible SupplierReturnLine quantity where return-originated. Supports credit calculation. Optional for purely monetary adjustments.
      - name: unit_price
        type: Money
        optional: true
        help: Original transaction-time unit price used to value the credited quantity. Preserves historical commercial value rather than current supplier pricing. Supports audit and reproducible credit calculation. Feeds gross credit calculation. Optional when the adjustment is not quantity-based.
      - name: gross_amount
        type: Money
        help: Gross credited value before discount and tax adjustments. Represents the value of the credited transaction component. Supports calculation and reconciliation. Feeds net taxable credit calculation. Required for financial calculation.
      - name: discount_amount
        type: Money
        help: Discount component reversed or adjusted on the credited value. Preserves the original transaction discount treatment. Supports reproducibility and reconciliation. Reduces the applicable credit base. Required, including zero.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: Taxable base of the supplier credit line. Amount to which applicable tax reversal or adjustment applies. Supports tax and accounting reconciliation. Feeds tax calculation. Required for deterministic tax treatment.
      - name: tax_amount
        type: Money
        help: Tax component of the supplier credit line. Reverses or adjusts tax associated with the credited amount. Supports tax reporting and accounting. Contributes to line total. Required, including zero.
        default: '{"amount":0}'
      - name: net_amount
        type: Money
        help: Total financial value of this supplier credit line. Represents the payable reduction attributable to the line. Feeds SupplierCreditNote totals and payable reconciliation. Authoritative line contribution to the credit. Required.
      - name: supplier_credit_note_id
        type: string
        fk: true
        help: Parent supplier credit document. Supplies supplier, currency and lifecycle context. Controls whether the line may be posted.
      - name: supplier_return_line_id
        type: string
        fk: true
        optional: true
        help: Return line that caused the credit. Connects financial adjustment to physical reverse procurement. Supplies approved quantity and credit eligibility.
      - name: invoice_line_id
        type: string
        fk: true
        optional: true
        help: Original supplier invoice line being financially adjusted. Preserves traceability to the original payable claim. Supplies original price, discount, tax and amount evidence.
  - name: SupplierCreditNoteApplication
    help: Provides the auditable bridge by which a posted SupplierCreditNote is consumed against a purchase Invoice. SupplierCreditNote establishes the authorized payable reduction; Invoice remains the original claim; SupplierCreditNoteApplication records exactly where and how much of the credit was used. Accounts payable, supplier returns, supplier statements, invoice reconciliation, tax, audit and payment planning. SupplierCreditNoteLine explains source credit detail; InvoiceLine explains original payable detail; this entity records header-level application evidence; JournalEntry records accounting recognition. SupplierCreditNote posted → select eligible purchase Invoice → validate remaining credit and payable exposure → currency/rate validation → activate application → update SupplierCreditNote amountApplied/amountUnapplied and payable exposure → reverse and reallocate when required. Draft → active → reversed/cancelled. Historical applications are retained. Changes to posted SupplierCreditNote or Invoice never rewrite an application; corrections use reversal and replacement applications. A posted USD 1,000 SupplierCreditNote is applied to a USD 1,000 purchase invoice. The application consumes USD 1,000 of available supplier credit and reduces the payable exposure by USD 1,000. If applied incorrectly, the application is reversed and a new application is created.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier credit application. Identifies one controlled application independently of its supplier credit and invoice. Used for payable reconciliation, audit, reversal and settlement projections. SupplierCreditNote supplies the adjustment; Invoice supplies the payable claim; this entity records the application bridge. Stable reference for applying and reversing supplier credit. Required.
      - name: supplier_credit_amount
        type: Money
        help: Portion of the SupplierCreditNote consumed by this application. Represents the source-side amount of supplier credit allocated to an invoice. Controls remaining unapplied supplier credit and reconciliation. Must use the SupplierCreditNote currency. Establishes the amount consumed from the supplier credit. Required.
      - name: invoice_amount
        type: Money
        help: Amount by which the purchase Invoice payable claim is reduced. Represents the target-side financial effect on the payable. Drives payable exposure and reconciliation. Must use the Invoice currency and may differ from supplierCreditAmount only under governed exchange-rate treatment. Supplies the claim-side adjustment. Required.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: Exchange rate used when supplier credit and invoice currencies differ. Preserves conversion evidence for cross-currency supplier credit application. Supports audit and reproducibility. Required for permitted cross-currency applications. Connects source supplier credit value to target invoice value. Optional when currencies are identical.
      - name: applied_at
        type: datetime
        help: Timestamp when the supplier credit application became effective. Establishes adjustment chronology. Supports accounting periods, supplier statements, audit and reconciliation. Distinct from SupplierCreditNoteDate and InvoiceDate. Determines when payable exposure changes. Required.
      - name: status
        type: string
        enum: SupplierCreditNoteApplicationStatus
        help: Lifecycle state of the supplier credit application. Indicates whether the application currently reduces payable exposure. Controls SupplierCreditNote and Invoice projections. SupplierCreditNote and Invoice statuses remain independent historical facts. ACTIVE creates the application effect; reversal removes it through a compensating event. Required.
        default: ACTIVE
      - name: reversal_of_application_id
        type: string
        fk: true
        references: SupplierCreditNoteApplication
        optional: true
        help: Prior supplier credit application reversed by this record. Links correction to the original payable adjustment application. Supports audit and controlled reallocation. Reversal is a new historical event and does not edit the original. Enables correction while preserving history. Optional for normal applications.
      - name: supplier_credit_note_id
        type: string
        fk: true
        help: Supplier credit note supplying the payable reduction. Identifies the authorized supplier financial credit being consumed. Supports payable reconciliation and supplier statements. Exactly one SupplierCreditNote supplies each application. Supplies available credit and currency context.
      - name: invoice_id
        type: string
        fk: true
        help: Purchase Invoice receiving the payable reduction. Identifies the supplier claim whose exposure is reduced. Supports accounts payable, reconciliation and supplier statements. Exactly one Invoice is targeted. Supplies eligible payable exposure and currency context.
  - name: SupplierDebitNote
    help: Represents a buyer-issued financial debit against a supplier while preserving the original payable claim supplier-claim history resolution decision and application evidence. SupplierClaim explains the issue, SupplierClaimResolution authorizes the remedy, SupplierDebitNote records the financial recovery, SupplierDebitNoteApplication allocates that recovery to payable claims, and JournalEntry provides accounting recognition. Payment remains the separate cash-movement concept. Accounts payable procurement recovery supplier disputes tax accounting and audit. SupplierClaim provides the case, SupplierClaimResolution provides authorization, Invoice provides the original payable claim, SupplierDebitNote provides the adjustment, SupplierDebitNoteApplication provides claim-level application, and JournalEntry provides accounting evidence. Claim/investigation → recovery approval → SupplierClaimResolution → debit calculation → approval → posting → accounting recognition → SupplierDebitNoteApplication → payable reconciliation or supplier dispute → claim closure/reversal. Draft → approved → posted → partially/fully applied, with dispute cancellation and reversal paths. Changes to claim resolution invoice or supporting evidence before posting trigger revalidation. Posted adjustments and active applications are corrected by reversal/replacement rather than mutation. A supplier overcharges by EUR 500. The SupplierClaim is accepted, SupplierClaimResolution authorizes DEBIT_ADJUSTMENT for EUR 500, SupplierDebitNote is posted for EUR 500, and a SupplierDebitNoteApplication applies the debit to the eligible supplier invoice without rewriting the original Invoice.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier debit note. Identifies one financial debit adjustment independently of its supplier claim invoice lines applications or accounting evidence. Used for accounts payable recovery supplier communication reconciliation audit and integration. Distinct from SupplierClaim SupplierClaimResolution Invoice and SupplierCreditNote identities. Stable identity across drafting approval posting application and reversal. Required.
      - name: debit_note_number
        type: string(100)
        unique: true
        help: Human-facing supplier debit reference. Identifies the debit adjustment in supplier correspondence and financial operations. Used for reconciliation supplier statements audit and integrations. Distinct from supplier claim purchase order invoice and return numbers. Provides operational reference throughout the debit lifecycle. Required.
      - name: debit_note_date
        type: date
        help: Effective date of the supplier debit adjustment. Establishes financial chronology and accounting or tax period. Period control reconciliation reporting and supplier communication. Distinct from claim resolution invoice return and payment dates. Anchors recognition of the adjustment. Required.
      - name: status
        type: string
        enum: SupplierDebitNoteStatus
        help: Lifecycle state of the supplier debit adjustment. Separates preparation authorization accounting recognition application dispute and reversal. Controls posting payable reconciliation and supplier dispute workflows. Status does not alter original Invoice GoodsReceipt SupplierClaim or SupplierClaimResolution evidence. POSTED creates financial evidence; application and dispute states track subsequent handling. Required.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency in which debit amounts are denominated. Defines the monetary denomination of the adjustment. Accounting reconciliation supplier settlement and reporting. Cross-currency application requires explicit ExchangeRate evidence. Qualifies all monetary values. Required.
      - name: subtotal
        type: Money
        help: Pre-tax value of the supplier debit adjustment. Aggregate financial increase before applicable tax. Calculation tax and reconciliation. Feeds totalAmount. Required.
      - name: tax_amount
        type: Money
        help: Tax component associated with the debit adjustment. Represents applicable tax added to the adjustment. Tax reporting accounting and reconciliation. Contributes to totalAmount. Required including zero.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total supplier debit adjustment. Financial amount by which supplier-related recoverable exposure is increased. Accounts payable supplier settlement accounting and reconciliation. It is an adjustment, not a replacement for the original supplier Invoice. Determines the maximum amount available for controlled application. Required.
      - name: amount_applied
        type: Money
        help: Portion of the supplier debit recognized against eligible supplier payable claims. Tracks how much posted debit has been consumed by active SupplierDebitNoteApplication records. Reconciliation supplier statements and reporting. SupplierDebitNoteApplication is the explicit settlement evidence; Payment remains separate cash movement. Changes through controlled application or reversal events. Required.
        default: '{"amount":0}'
      - name: amount_remaining
        type: Money
        help: Unapplied portion of the posted supplier debit. Represents debit value still available for payable application or governed settlement handling. Reconciliation supplier statements and resolution tracking. Determines whether the debit is fully applied. Required.
        default: '{"amount":0}'
      - name: supplier_id
        type: string
        fk: true
        help: Supplier responsible for the financial adjustment. Identifies the external party whose payable exposure is adjusted. Payables supplier communication and reconciliation. Establishes party context.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: Supplier claim that provides the commercial or quality case for the debit. Connects financial adjustment to the case that established the recovery entitlement. Traceability approval and dispute management. Provides supporting evidence without replacing the debit document.
      - name: supplier_claim_resolution_id
        type: string
        fk: true
        optional: true
        help: Authorized claim resolution that approved this debit remedy. Connects the posted financial adjustment to the controlled decision that authorized the recovery. Governance approval audit and claim closure. Supplies the execution mandate for DEBIT_ADJUSTMENT or another authorized financial remedy.
  - name: SupplierDebitNoteLine
    help: Provides the auditable financial detail supporting one component of a SupplierDebitNote. The line explains exactly how a supplier recovery amount was calculated; it does not replace the original invoice supplier claim or claim resolution. Accounts payable supplier disputes accounting tax and audit. SupplierClaim supplies the business case, SupplierClaimResolution supplies authorization, InvoiceLine supplies original financial evidence, and SupplierDebitNote aggregates approved recovery lines. Gather source evidence → determine line basis → calculate amount and tax → validate against claim resolution → approve → post with parent SupplierDebitNote → reconcile payable. A supplier billed 100 units but 5 were not received. The SupplierClaimResolution authorizes a shortage recovery; a debit line records quantity 5 and the applicable transaction-time unit value with supporting InvoiceLine evidence.
    parent: SupplierDebitNote
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier debit line. Identifies one adjustment component independently of its parent debit note and source transactions. Accounting reconciliation audit and integration. Distinct from InvoiceLine SupplierClaim and SupplierReturnLine identities. Stable attribution for calculation and accounting. Required.
      - name: line_number
        type: integer
        help: Sequence number of the debit line within its SupplierDebitNote. Provides deterministic ordering and human-readable identification. Documents review and reconciliation. Unique within the parent debit note. Identifies the line during approval and posting. Required.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Quantity to which the debit calculation applies when the adjustment is quantity-based. Measures affected goods or services for shortage overcharge damage or other quantity-driven recovery. Calculation reconciliation and audit. Must reconcile with relevant InvoiceLine GoodsReceiptLine or claim evidence when applicable. Supplies quantity basis for adjustment valuation. Optional for purely monetary adjustments.
      - name: unit_price
        type: Money
        optional: true
        help: Unit monetary value used to calculate a quantity-based debit. Captures the transaction-time valuation relevant to the recovery. Calculation and audit. Should derive from original commercial evidence rather than current master pricing. Supports reproducible line valuation. Optional for non-quantity adjustments.
      - name: gross_amount
        type: Money
        help: Pre-tax financial amount of the debit line before applicable deductions or tax. Represents the base recovery attributable to this line. Total calculation accounting and reconciliation. Feeds taxableAmount and totalAmount. Required.
      - name: tax_amount
        type: Money
        help: Tax component associated with the debit line. Represents applicable tax added to the adjustment. Tax reporting and accounting. Contributes to line and header total. Required including zero.
        default: '{"amount":0}'
      - name: net_amount
        type: Money
        help: Final financial amount represented by this debit line. Represents the line's gross adjustment plus applicable tax under governing calculation policy. Supplier reconciliation and accounting. Contributes to SupplierDebitNote.totalAmount. Required.
      - name: reason_code
        type: string(100)
        help: Reason explaining why this particular debit amount is being raised. Provides line-level cause such as shortage overcharge damage or penalty. Supplier dispute reporting and recovery analytics. Complements SupplierClaim.claimType and source transaction evidence. Supports validation and approval. Required for line-level auditability.
      - name: supplier_debit_note_id
        type: string
        fk: true
        help: Parent supplier debit note containing this line. Supplies supplier currency lifecycle and posting context. Controls whether the line can be posted.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: Claim evidence supporting the debit line. Connects the monetary adjustment to the supplier issue being recovered. Investigation approval and audit. Supplies justification for the debit.
      - name: supplier_claim_resolution_id
        type: string
        fk: true
        optional: true
        help: Authorized claim resolution supporting this debit line. Links the line to the approved recovery decision and its financial limit. Approval audit and claim closure. Supplies remedy authorization for DEBIT_ADJUSTMENT.
  - name: SupplierDebitNoteApplication
    help: Records the controlled application of a posted SupplierDebitNote against a specific supplier invoice payable claim. SupplierDebitNote establishes the financial adjustment; this entity records where that adjustment is consumed. It is not a Payment and does not rewrite the original Invoice. Accounts payable, supplier statements, reconciliation, audit, dispute resolution and financial integration. SupplierDebitNote is the source adjustment, Invoice is the target payable claim, ExchangeRate provides cross-currency evidence, and JournalEntry records accounting recognition separately. SupplierClaim/SupplierClaimResolution authorize recovery → SupplierDebitNote approved and posted → eligible Invoice selected → application validated → ACTIVE application → payable exposure reduced → debit remaining reconciled. Corrections use reversal. Draft → active, with reversed or cancelled paths. Changes to source debit posting, invoice eligibility, currency or exchange-rate evidence require application revalidation; active applications are corrected through reversal rather than mutation. A posted EUR 500 SupplierDebitNote is applied against a EUR 500 supplier invoice. The application records EUR 500 debit amount and invoice amount, becomes ACTIVE, and reduces the payable exposure while preserving the original invoice history.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier debit application. Identifies one application of a supplier debit to a payable claim. Used for reconciliation, audit, supplier statements and integration. Distinct from SupplierDebitNote, Invoice and Payment identities. Stable identity across creation, activation, reversal and cancellation. Required.
      - name: supplier_debit_amount
        type: Money
        help: Amount of the supplier debit consumed by this application in debit-note currency. Defines the portion of the posted debit allocated to this payable claim. Reconciliation and remaining-amount calculation. May differ from invoiceAmount when currencies differ and an ExchangeRate is used. Reduces the unapplied supplier debit balance. Required and positive.
      - name: invoice_amount
        type: Money
        help: Amount of payable exposure reduced on the target invoice. Records the invoice-currency effect of the debit application. Accounts payable reconciliation and audit. Must reconcile to supplierDebitAmount using the recorded exchange rate when currencies differ. Reduces invoice payable exposure without changing original invoice totals. Required and positive.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: Exchange-rate evidence used when debit and invoice currencies differ. Provides reproducible conversion between application currencies. Accounting, tax, reconciliation and audit. Required for cross-currency application under policy. Determines the conversion used for invoiceAmount. Optional when currencies are identical.
      - name: applied_at
        type: datetime
        help: Time the debit application became effective. Establishes settlement chronology. Period control, audit, supplier statements and reconciliation. Anchors the application event. Required.
      - name: status
        type: string
        enum: SupplierDebitNoteApplicationStatus
        help: Lifecycle state of the debit application. Separates preparation from effective application and later reversal. Controls payable projections and remaining debit balance. Application status does not replace SupplierDebitNote or Invoice status. ACTIVE contributes to settlement projections; REVERSED removes its active effect through compensating evidence. Required.
        default: DRAFT
      - name: reversal_of_application_id
        type: string
        fk: true
        references: SupplierDebitNoteApplication
        optional: true
        help: Prior application being reversed. Provides explicit lineage for a corrective reversal. Audit, reconciliation and error correction. Reversal is a new event and does not mutate the original application. Links compensating evidence to the prior application. Required when status is REVERSED under the reversal model.
      - name: supplier_debit_note_id
        type: string
        fk: true
        help: Posted supplier debit being applied. Identifies the source financial adjustment. Remaining-balance and audit reconciliation. Supplies available debit amount and supplier context.
      - name: invoice_id
        type: string
        fk: true
        help: Supplier payable invoice receiving the debit application. Identifies the eligible original payable claim whose outstanding exposure is reduced. Accounts payable, reconciliation and supplier statements. Supplies target claim and currency context.
  - name: SupplierPerformanceAssessment
    help: Provides a governed supplier scorecard that converts procurement, receipt, quality, claim, return and corrective-action evidence into an auditable performance assessment. Supplier remains the master relationship; operational transactions provide evidence; SupplierPerformanceAssessment interprets that evidence for governance without rewriting the underlying facts. Supplier qualification, sourcing, supplier reviews, performance management, corrective improvement, risk management and procurement analytics. PurchaseOrder and GoodsReceipt provide commercial and delivery evidence; QualityInspection and SupplierClaim provide quality evidence; SupplierReturn and SupplierClaimResolution provide recovery evidence; CorrectiveAction provides improvement evidence. Define evaluation period and methodology → collect transaction evidence → calculate measures → review → approve → publish scorecard → trigger supplier improvement, qualification or sourcing decisions where policy requires → later supersede with a new assessment. Draft → in review → approved → published, with superseded and cancelled paths. Changes to source transactions do not rewrite a published assessment; they trigger governed re-evaluation or a superseding assessment when the change materially affects the score. Supplier qualification decisions consuming the assessment must retain the assessment identity as evidence. A quarterly assessment evaluates 120 purchase orders, 115 receipts, inspection failures, supplier claims and returns. The governed score is 82 and rating GOOD. The published assessment supports the next supplier review while all underlying transactions remain independently auditable.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier performance assessment. Identifies one governed evaluation of supplier performance for a defined period and scope. Supplier governance, sourcing decisions, improvement plans, audit and reporting. Distinct from Supplier identity, PurchaseOrder transactions, SupplierClaim cases and individual quality inspections. Stable reference across calculation, review, approval and follow-up. Required.
      - name: assessment_number
        type: string(100)
        unique: true
        help: Human-facing assessment reference. Identifies the performance evaluation for operational and supplier communication. Review meetings, supplier scorecards, audit and reporting. Distinct from supplierCode, claimNumber and purchase order numbers. Correlates evidence and decisions throughout the assessment lifecycle. Required.
      - name: assessment_date
        type: date
        help: Date on which the assessment is formally recorded. Establishes the governance point at which the evaluated performance becomes an assessment record. Supplier reviews, audit, reporting and decision chronology. Anchors approval and follow-up actions. Required.
      - name: period_start
        type: date
        help: Beginning of the performance evaluation period. Defines the historical window from which performance evidence is evaluated. Score calculation, supplier comparison and trend reporting. Evidence transactions must fall within or be explicitly associated with this evaluation scope. Establishes assessment boundaries. Required.
      - name: period_end
        type: date
        help: End of the performance evaluation period. Defines the closing boundary of the performance evidence window. Score calculation, reporting and supplier review. Completes the assessment scope. Required.
      - name: status
        type: string
        enum: SupplierPerformanceAssessmentStatus
        help: Lifecycle state of the supplier performance assessment. Separates calculation, review, approval, publication and replacement of scorecard results. Controls whether the assessment may be changed or consumed by supplier governance. Does not change the status of Supplier, PurchaseOrder, GoodsReceipt, Invoice or SupplierClaim records. PUBLISHED makes the assessment an approved historical scorecard; corrections use a replacement or superseding assessment. Required.
        default: DRAFT
      - name: overall_score
        type: decimal
        optional: true
        help: Aggregate supplier performance score for the assessment scope. Represents the governed result of the configured supplier scorecard calculation. Supplier ranking, sourcing decisions, escalation and trend analysis. Must be derived from defined performance measures and must not be treated as raw transaction evidence. Supports approval and supplier governance decisions. Optional until score calculation is complete.
        min: 0
        max: 100
      - name: rating
        type: string
        optional: true
        enum: SupplierPerformanceAssessmentRating
        help: Interpreted supplier performance rating. Converts the approved score or governed assessment criteria into a business-facing performance category. Supplier segmentation, review cadence and improvement decisions. Rating is an assessment conclusion, not a replacement for underlying delivery, quality, claim or commercial evidence. Supports governance actions and escalation. Optional until the assessment is evaluated.
      - name: notes
        type: string(4000)
        optional: true
        help: Qualitative context supporting the assessment. Records material observations, explanations or agreed context that structured scores do not capture. Supplier review, audit and improvement planning. Supplements but does not replace measurable evidence. Optional.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier being evaluated. Identifies the external party whose performance is assessed. Supplier governance, sourcing and improvement management. Supplies the master relationship and qualification context.
  - name: SupplierReturn
    help: Coordinates the controlled reversal of accepted procurement fulfillment while preserving original purchasing, receiving, inventory, quality and financial history. A supplier return is a new reverse-procurement event; it does not delete or rewrite the original PurchaseOrder, GoodsReceipt or Invoice. Purchasing, warehouse operations, quality, supplier management, accounts payable and audit. PurchaseOrder identifies the commitment, GoodsReceipt identifies accepted receipt, SupplierReturnLine identifies returned quantity, QualityInspection provides quality evidence where required, InventoryMovement records physical reversal, and SupplierCreditNote records financial adjustment. Return request → authorization → quality inspection where required → dispatch → supplier receipt → inventory reversal → supplier credit assessment/posting → completion. Each physical, quality and financial consequence has independent evidence. Draft → authorized → in transit → received by supplier → completed, with cancellation and exception paths. Changes to source receipt, supplier return lines, product, quality policy or financial eligibility affecting an open return trigger revalidation of dependent inspections, inventory and credit workflows. Ten accepted units were received from a supplier and three are defective. A supplier return authorizes three units, QualityInspection records the failed inspection and return disposition, InventoryMovement reduces eligible stock by three, and a SupplierCreditNote reduces the payable claim for the approved amount. The original receipt and invoice remain historical evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier return event. Identifies the reverse-procurement transaction independently of its supplier reference, receipt, shipment, inventory or financial adjustment. Used for authorization, warehouse execution, supplier communication, accounting, audit and integration. Distinct from returnNumber and all original PurchaseOrder, GoodsReceipt and Invoice identities. Stable root reference across authorization, dispatch, supplier receipt, quality inspection, inventory reversal and supplier credit processing. Required for traceability.
      - name: return_number
        type: string(100)
        unique: true
        help: Human-facing supplier return reference. Operational identifier communicated to warehouse staff and the supplier. Used for logistics, supplier communication, investigation and reconciliation. Distinct from the original purchase order, receipt and invoice numbers. Correlates operational return activity across systems. Required for operational traceability.
      - name: status
        type: string
        enum: SupplierReturnStatus
        help: Lifecycle state of the supplier return. Indicates authorization, transport, supplier receipt, completion or controlled exception. Controls logistics, inventory and financial workflows. Return status does not itself reverse inventory or accounts payable. Coordinates dependent workflows without replacing InventoryMovement, QualityInspection or SupplierCreditNote evidence. Required for controlled lifecycle.
        default: DRAFT
      - name: return_date
        type: datetime
        help: Business timestamp for initiating the supplier return. Establishes the chronology of the reverse-procurement event. Supports logistics, audit, reporting and supplier claims. Distinct from original receipt date and supplier acceptance date. Anchors the return event. Required for chronology.
      - name: reason_code
        type: string(100)
        optional: true
        help: Reason for returning received goods to the supplier. Classifies defects, over-receipt, wrong item, damage, commercial rejection or other causes. Supports quality, supplier performance, warranty, claims and analytics. Explains why the return occurs and is distinct from physical disposition. Drives applicable approval, quality and supplier-claim policies. Optional only when policy permits an uncoded reason.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier to whom the goods are being returned. Identifies the external party receiving the returned goods. Supports authorization, logistics, supplier claims and payable reconciliation. Must normally agree with the source PurchaseOrder and GoodsReceipt supplier.
      - name: purchase_order_id
        type: string
        fk: true
        optional: true
        help: Original procurement commitment associated with the returned goods. Connects the reverse event to the commercial purchase commitment. Supports quantity eligibility and procurement traceability. Supplies original commitment context; it is not itself changed by the return.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: The SupplierClaim this SupplierReturn belongs to.
      - name: supplier_claim_resolution_id
        type: string
        fk: true
        optional: true
        help: The SupplierClaimResolution this SupplierReturn belongs to.
      - name: supplier_performance_assessment_id
        type: string
        fk: true
        optional: true
        help: The SupplierPerformanceAssessment this SupplierReturn belongs to.
  - name: SupplierReturnLine
    help: Defines exactly what previously accepted procurement quantity is being returned and connects that quantity to quality, physical and financial consequences. SupplierReturnLine is the bridge between accepted receiving evidence and quality, reverse inventory and payable workflows. Reverse logistics, supplier claims, quality, warehouse control and accounts payable. PurchaseOrderLine states the commitment; GoodsReceiptLine states accepted fulfillment; QualityInspection provides quality evidence; SupplierReturnLine states reversal; InventoryMovement records stock reduction; SupplierCreditNoteLine records payable adjustment. Validate eligible receipt quantity → inspect where required → authorize return → execute physical return → post InventoryMovement → assess supplier credit → post SupplierCreditNoteLine. Changes to receipt eligibility, inspection result, product, UOM or approved credit affecting an open line trigger revalidation of dependent return, inventory and financial workflows. Three defective units from a five-unit accepted receipt are returned. QualityInspection records the failed result and return disposition, this line records quantityReturned=3, inventory is reduced by three through an attributable movement, and any approved supplier credit is calculated from the original invoice evidence.
    parent: SupplierReturn
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the supplier return line. Identifies one quantity-level reverse-procurement instruction. Used for inventory, supplier credit, quality, reconciliation and audit. Distinct from the original PurchaseOrderLine and GoodsReceiptLine identities. Provides stable attribution for every downstream reversal. Required for traceability.
      - name: line_number
        type: integer
        help: Sequence number of the return line within SupplierReturn. Provides human-readable ordering of returned items. Used in documents, warehouse operations and reconciliation. Unique within the parent return, not globally. Identifies a line during approval and execution. Required for deterministic line identification.
        min: 1
      - name: quantity_returned
        type: decimal
        help: Quantity of previously accepted goods being returned to the supplier. Measures the physical quantity leaving the organization through the reverse procurement process. Drives eligibility, inventory reversal and supplier credit calculation. Must reconcile to eligible GoodsReceiptLine accepted quantity and UOM. Primary quantity input for return execution. Required because a return line without quantity has no physical meaning.
      - name: approved_credit_amount
        type: Money
        optional: true
        help: Maximum or approved financial amount eligible for supplier credit for this return line. Separates the financial claim from the physical quantity returned. Feeds SupplierCreditNote calculation and accounts-payable reconciliation. Must be derived using original transaction price, tax, discount, currency and return policy rather than current supplier pricing. Provides controlled input to financial adjustment after applicable approval. Optional where no supplier credit is expected.
      - name: disposition
        type: string
        enum: SupplierReturnLineDisposition
        help: Operational result governing how the returned procurement quantity is handled. Identifies whether the quantity is actually being returned to the supplier or requires exception processing. Supports warehouse and supplier-claim workflows. Distinct from the original GoodsReceipt acceptance status and any QualityInspection disposition. Controls whether the normal supplier-return workflow may proceed. Required for controlled physical processing.
      - name: purchase_order_line_id
        type: string
        fk: true
        help: Original procurement commitment associated with the returned item. Identifies what was originally ordered. Supplies product, UOM and commercial context.
      - name: supplier_return_id
        type: string
        fk: true
        help: Parent reverse-procurement transaction containing this line. Supplies supplier, authorization and overall lifecycle context. Controls whether this line may execute.
  - name: Product
    help: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules. Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts. Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics. Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration. If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(300)
      - name: description
        type: string(4000)
        optional: true
      - name: product_type
        type: string
        enum: ProductProductType
      - name: status
        type: string
        enum: ProductStatus
        default: ACTIVE
      - name: sku
        type: string(100)
        optional: true
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
      - name: standard_price
        type: money
        optional: true
      - name: tax_category
        type: string(100)
        optional: true
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
  - name: Invoice
    help: Represents a formal financial claim and its controlled settlement and adjustment state. Invoice records what was originally claimed. Payment records money moved. PaymentAllocation records how money is applied. CreditNote, SupplierCreditNote, and SupplierDebitNote record separate authorized financial adjustments; their application entities record claim-level consumption. Used by order-to-cash, procure-to-pay, accounting, tax, collections, payments, reconciliation, customer credit, supplier recovery and audit. SalesOrder provides commercial commitment, Shipment or delivery provides fulfillment where applicable, GoodsReceipt provides accepted procurement fulfillment, Invoice provides the claim, CreditNote provides customer reduction, SupplierCreditNote provides supplier reduction, SupplierDebitNote provides buyer recovery, Payment provides settlement, and application entities connect each adjustment to the claim. Invoice preparation → line calculation → discount → taxable base → tax determination → total → PaymentTerm due-date calculation → issue → payment → PaymentAllocation and/or approved adjustment application → amountSettled/amountCredited/amountOutstanding → PARTIALLY_PAID or PAID. Supplier credit and debit applications remain explicit non-cash financial evidence. Draft → issued → partially paid or overdue → paid, with cancellation and void paths. Corrections use CreditNote, SupplierCreditNote, SupplierDebitNote, controlled adjustments, or allocation/application reversals rather than silently rewriting posted evidence. Changes to Customer, Supplier, Product, UOM, pricing, discount, tax, Currency, SalesOrder, PurchaseOrder, GoodsReceipt, return, claim, credit, or debit evidence affecting an open transaction trigger controlled revalidation. Posted invoice history is not silently recalculated. Posted adjustments and applications are corrected through explicit reversal/replacement. A purchase invoice totals 10,000 EUR. A 1,000 EUR supplier credit and a 500 EUR supplier debit are each explicitly applied through their application entities; the invoice's original values remain unchanged while payable exposure is reconciled from the active settlement and adjustment evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the invoice claim. Identifies the financial claim independently of its number, lines, source order, receipts, credits, debits, or payments. Used for financial integrations, audit, payment allocation, reconciliation, reporting, and lifecycle navigation. InvoiceId identifies the claim; InvoiceNumber is its business-facing reference; CreditNote and supplier debit/credit applications provide later financial adjustment evidence. Provides the stable identity carried through issuance, settlement, adjustment, reversal, and accounting. Required for claim traceability.
      - name: invoice_number
        type: string(100)
        unique: true
        help: Business-facing invoice reference. Identifier communicated to customers, suppliers, tax authorities, and financial operations. Used in documents, statements, reconciliation, collections, payables, and integrations. Distinct from invoiceId and source order numbers. Provides the human-recognizable reference throughout the claim lifecycle. Required for operational and financial communication.
      - name: invoice_date
        type: date
        help: Accounting and commercial date assigned to the invoice. Establishes the date used for financial chronology and applicable billing and tax rules. Used for accounting periods, tax, payment-term calculation, aging, reporting, and reconciliation. Distinct from payment, bank settlement, credit-note, debit-note, and clearing dates. Provides the temporal anchor for invoice issuance and applicable PaymentTerm calculation. Required for financial chronology.
      - name: due_date
        type: date
        optional: true
        help: Transaction-level date by which the claim is expected to be settled. Result of applying the effective PaymentTerm and due-date basis to the invoice. Drives aging, collections, cash forecasting, and payment planning. PaymentTerm is policy; dueDate is the invoice-specific result and must not be silently recalculated after issue. Determines when the outstanding claim becomes overdue under the applicable policy. Optional while terms remain unresolved or for claim types without a due date.
      - name: invoice_type
        type: string
        enum: InvoiceInvoiceType
        help: Defines the commercial direction and accounting nature of the invoice document. Determines whether the document establishes a receivable, payable, or adjustment. Used by accounting, tax, receivables, payables, matching, and reporting. Must agree with Customer/Supplier and source transaction relationships. A dedicated CreditNote or SupplierDebitNote is preferred for explicit financial adjustments. Controls which party, matching, tax, and settlement processes apply. Required for correct financial treatment.
      - name: status
        type: string
        enum: InvoiceStatus
        help: Lifecycle state of the financial claim. Indicates whether the claim is being prepared, outstanding, settled, overdue, cancelled, or voided. Controls issuance, settlement, aging, cancellation, reporting, and accounting workflows. PaymentAllocation supplies settlement evidence; CreditNote and SupplierDebitNoteApplication supply authorized adjustment evidence; Payment status alone must never determine invoice payment status. ISSUED establishes the claim; active allocations and authorized adjustment applications change settlement projection; PAID requires no remaining amount under policy; OVERDUE is time-based and may coexist with partial settlement. Claim is being prepared and is not issued. Claim is formally outstanding. Active settlement evidence covers part of the amount due after authorized adjustments. Active settlement evidence and authorized adjustments fully satisfy the claim under policy. Claim remains outstanding after its due date. Claim has been cancelled under authorized controls. Claim has been invalidated under accounting controls. Required for controlled claim lifecycle.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency denomination shared by the invoice's monetary values. Defines the monetary denomination of the claim and its calculated totals. Used for accounting, payment allocation, tax, reconciliation, reporting, and credit or debit adjustment. Payment, CreditNote, SupplierCreditNote, or SupplierDebitNote may use another currency only under explicitly governed exchange-rate treatment. Provides the denomination against which invoice amounts, settlement and adjustments are evaluated. Required for interpreting the claim.
      - name: subtotal
        type: Money
        help: Aggregate of invoice line amounts before document-level tax and other applicable document adjustments. Represents the pre-tax financial base derived from invoice lines after line-level pricing treatment. Used for tax calculation, accounting, reconciliation, and document totals. Must use invoice currency and reconcile with InvoiceLine monetary values. Feeds document-level discount, tax, and total calculations according to policy. Required for claim calculation.
      - name: discount_amount
        type: Money
        help: Aggregate document-level discount applied after applicable line pricing and before taxable base where policy requires. Represents a document-level reduction distinct from line-level discounts and settlement discounts. Used for invoice calculation, tax determination, reporting, and reconciliation. Must reconcile with applicable DiscountRule evidence and must not be confused with credit notes or early-payment discounts. Reduces the applicable document base before tax according to the invoice calculation policy. Required as a zero-valued projection when no document discount exists.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: Aggregate monetary base on which applicable invoice taxes are calculated. Represents the amount subject to tax after applicable discounts and exemptions. Used for tax calculation, tax reporting, audit, and reconciliation. Must reconcile with InvoiceLine taxable amounts and document-level tax determinations. Supplies the base for TaxRule application and tax calculation. Required for deterministic tax calculation.
      - name: tax_amount
        type: Money
        help: Aggregate tax amount calculated under applicable TaxRules and transaction tax determinations. Represents tax charged or otherwise recognized on the claim, not the taxable base. Used for tax reporting, invoice totals, accounting, and reconciliation. Must reconcile with transaction-level tax evidence and jurisdictional treatment. Contributes to totalAmount and downstream tax/accounting reporting. Required, including zero when no tax applies.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total financial claim after applicable line values, discounts, taxes, credits, debits, and document adjustments. Represents the amount owed under the original invoice before settlement allocations and later adjustment applications. Used for settlement, aging, statements, reporting, and accounting. Represents the original claim itself, not the amount already paid or subsequently adjusted. Provides the claim base against which active PaymentAllocation and authorized adjustment application evidence are evaluated. Required for financial settlement.
      - name: amount_settled
        type: Money
        help: Projection of active settlement amounts applied to this invoice. Represents how much of the claim is settled according to active PaymentAllocation records. Used to calculate outstanding balance and derive settlement status. Not an independent cash event; Payment and PaymentAllocation provide the underlying evidence. Changes when allocations are posted, activated, reversed, or corrected. Required as a settlement projection.
        default: '{"amount":0}'
      - name: amount_credited
        type: Money
        help: Projection of active CreditNote amounts applied against this invoice claim. Represents authorized financial reductions supported by posted CreditNote evidence. Used for customer balance, invoice settlement, statements, reconciliation and reporting. CreditNote is a separate financial document; this projection must not rewrite original Invoice or InvoiceLine values. Changes through controlled credit-note application or reversal workflows. Required as a zero-valued adjustment projection when no credits apply.
        default: '{"amount":0}'
      - name: amount_outstanding
        type: Money
        help: Projection of the portion of the invoice claim that remains unsettled after authorized credits and debits. Represents current open exposure under the applicable accounting and rounding policy. Drives collections, payment allocation, aging, statements, and cash forecasting. Normally reconciles totalAmount less active settlement and authorized adjustment applications in invoice currency. Determines whether additional allocation or adjustment application is permitted and whether PAID can be reached. Required for operational settlement decisions.
        default: '{"amount":0}'
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: Supplier associated with a purchase invoice. Identifies the party to whom a payable claim relates. Supports payables, supplier statements, procurement reconciliation, tax, and payment processing. Required for PURCHASE invoices unless another controlled party model applies. Supplies commercial party context for three-way matching and settlement.
      - name: purchase_order_id
        type: string
        fk: true
        optional: true
        help: Procurement commitment against which a supplier invoice may be evaluated. Connects supplier commitment to the resulting payable claim. Supports three-way matching and accounts payable controls. PurchaseOrder is commitment; GoodsReceipt is accepted fulfillment; Invoice is the claim. Supplies ordered quantity and price context for InvoiceLine matching.
      - name: supplier_claim_id
        type: string
        fk: true
        optional: true
        help: The SupplierClaim this Invoice belongs to.
      - name: supplier_return_id
        type: string
        fk: true
        optional: true
        help: The SupplierReturn this Invoice belongs to.
  - name: InvoiceLine
    help: Represents one immutable financial claim line with reproducible calculation evidence and explicit customer and supplier adjustment references. InvoiceLine is the historical financial result. Current Product, DiscountRule, TaxRule, UOM and pricing master data are inputs to future transactions, not live dependencies of a posted line. CreditNoteLine and SupplierCreditNoteLine record later reductions separately. Billing, accounts payable, accounts receivable, procurement matching, tax, accounting, returns, credit processing, audit and settlement. Invoice provides claim context; Product/UOM identify and measure the billed item; DiscountRule and TaxRule explain policy; pricingEvidence, discountEvidence and taxEvidence preserve transaction-time results; PO/receipt relationships support three-way matching; CreditNoteLine records customer adjustment; SupplierCreditNoteLine records supplier adjustment. Determine transaction price → calculate gross → resolve discount → calculate taxable base → resolve tax → calculate tax → calculate net → snapshot evidence → matching/approval → post. If a customer or supplier return/correction occurs later, determine eligible adjustment → create corresponding credit line → post credit → apply through explicit application evidence. Subsequent master-data changes never rewrite posted history. Draft → calculated → matched/exception → approved → posted. After posting, historical calculation evidence is immutable and corrections use explicit financial documents or adjustments. Changes to Product/UOM/pricing/discount/tax masters require validation of future and open transactions but never silently modify posted InvoiceLines. Changes to procurement commitments, receipts, customer returns, supplier returns or credits can change downstream matching/adjustment eligibility through controlled reconciliation without rewriting the invoice calculation. A purchase invoice line is linked to a PurchaseOrderLine and accepted GoodsReceiptLine. If three received units are later returned to the supplier, SupplierReturnLine and SupplierCreditNoteLine reference this InvoiceLine; the original billed price and tax remain unchanged while the supplier credit is applied separately.
    parent: Invoice
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the original invoice line. Identifies the historical billed detail independently of later credits or corrections. Used for billing, audit, matching, credit and reconciliation. CreditNoteLine and SupplierCreditNoteLine may reference this identity as source evidence. Stable root reference for the line lifecycle. Required for financial traceability.
      - name: line_number
        type: integer
        help: Sequence number within the invoice. Identifies the line for documents and reconciliation. Used in invoice presentation and audit. Unique within Invoice and distinct from CreditNoteLine and SupplierCreditNoteLine numbering. Supports deterministic document reconstruction. Required.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Originally billed quantity. Preserves the historical quantity on the original claim. Used for billing, matching and return eligibility. CustomerReturnLine or SupplierReturnLine may reference eligible quantities and CreditNoteLine or SupplierCreditNoteLine may credit an eligible portion. Provides source quantity evidence. Optional for purely monetary lines.
      - name: unit_price
        type: Money
        optional: true
        help: Transaction-time billed price per unit. Captures the price actually used to value the invoice line, not today's master price. Supports invoice calculation, audit, price variance, settlement and credit calculation. Customer or supplier credit lines may preserve this as source valuation evidence; later pricing changes do not rewrite it. Provides authoritative historical pricing evidence for the invoice line. Optional for non-quantity monetary lines.
      - name: gross_amount
        type: Money
        help: Gross monetary value before line discount and tax. Original calculated value of the billed line. Used for invoice reconciliation and credit evidence. Credit adjustment lines do not mutate this historical amount. Feeds original line calculation. Required.
      - name: discount_amount
        type: Money
        help: Discount originally applied to the line. Historical line-level commercial reduction. Used for reproducibility, tax and credit calculation. Return credits use original discount evidence where policy requires. Contributes to original taxable and net values. Required, including zero.
        default: "0"
      - name: taxable_amount
        type: Money
        help: Original taxable base of the invoice line. Amount subjected to the original tax treatment. Used for tax audit and credit calculation. Credit adjustment tax evidence may derive from this historical treatment. Provides source tax basis. Required.
      - name: tax_amount
        type: Money
        help: Tax originally recognized on the line. Historical tax component of the claim. Used for tax reporting, accounting and credit calculation. A credit line may reverse an eligible portion without editing this amount. Provides source tax evidence. Required, including zero.
        default: "0"
      - name: net_amount
        type: Money
        help: Original net financial value of the line after discount and applicable tax treatment. Historical line contribution to the Invoice total. Used for billing, accounting and credit reference. Credit adjustment lines record a separate reduction rather than changing netAmount. Provides immutable source value. Required.
      - name: pricing_evidence
        type: object
        optional: true
        help: Snapshot of material pricing inputs used to determine the invoice line amount. Preserves source, effective date, and approved commercial context needed to reproduce pricing even when master data changes. Supports audit, dispute resolution, recalculation, credit calculation and integration. Links the invoice result to the effective transaction price without making the posted invoice depend on mutable pricing master data.
      - name: discount_evidence
        type: object
        optional: true
        help: Snapshot of the discount policy inputs and result used on the invoice line. Preserves the applied discount rule/version, method, base, rate or fixed amount, and resulting discount. Supports audit and prevents later DiscountRule changes from altering historical calculations or credits. Provides reproducible discount calculation evidence.
      - name: tax_evidence
        type: object
        optional: true
        help: Snapshot of the tax determination inputs and result used on the invoice line. Preserves tax rule/version, jurisdiction, rate, taxable base, rounding and calculated tax. Supports tax audit, compliance, dispute resolution and credit-note tax calculation. Prevents later TaxRule changes from rewriting posted invoice tax.
      - name: description
        type: string(1000)
        optional: true
        help: Human-readable description of the original billed line. Describes the billed good or service. Used on documents and audit. Complements Product and source transaction references. Supports document presentation. Optional descriptive context.
      - name: matching_status
        type: string
        enum: InvoiceLineMatchingStatus
        help: Procurement matching state of the invoice line. Indicates whether the line agrees with applicable purchase and receipt evidence. Used for accounts payable controls and reconciliation. Independent from CreditNote and SupplierCreditNote status; a credit may correct a posted line after matching. Controls matching approval before posting.
        default: NOT_APPLICABLE
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit in which the original quantity was billed. Defines measurement semantics for the historical quantity. Supports billing, fulfillment and return conversion. Provides source measurement context for eligible credits.
      - name: purchase_order_line_id
        type: string
        fk: true
        optional: true
        help: Procurement line associated with a purchase invoice line. Connects payable billing to the original procurement commitment. Supports three-way matching and supplier-return traceability. Supplies source procurement evidence.
      - name: supplier_debit_note_line_id
        type: string
        fk: true
        optional: true
        help: The SupplierDebitNoteLine this InvoiceLine belongs to.
      - name: supplier_return_line_id
        type: string
        fk: true
        optional: true
        help: The SupplierReturnLine this InvoiceLine belongs to.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Product or service identified by the original invoice line. Identifies what was billed without making current product master data a live dependency of posted history. Supports billing, fulfillment and return traceability. Supplies source item context.
      - name: invoice_id
        type: string
        fk: true
        help: Parent invoice containing the original claim line. Provides financial document context. Supports billing, settlement, adjustment and audit. Parent claim owns the line's historical calculation.
