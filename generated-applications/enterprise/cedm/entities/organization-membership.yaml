entity:
  name: OrganizationMembership
  namespace: cedm.domain
  kind: iam_membership
  description: A governed relationship connecting a User or Party to an Organization with membership status and role context.
  ui:
    icon: building-2
  identity: {key: organizationMembershipId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: organizationMembershipId, type: uuid, required: true, immutable: true, help: {summary: The identity of the membership., usage: Generated on creation; role assignments and audit entries refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the person currently belongs to the organisation.
        usage: Moved by administrators or the invitation process; access based on membership applies only while ACTIVE.
        valueSemantics:
          PENDING: Offered or requested, not yet effective.
          ACTIVE: In force; the person belongs to the organisation.
          COMPLETED: Ended normally. A final state.
          CANCELLED: Withdrawn before it took effect. A final state.
  relationships: []
  invariants:
    - {id: ORGANIZATION-MEMBERSHIP-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Organization Membership Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a organization membership is ended"
      description: "When a organization membership is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ORGANIZATION-MEMBERSHIP-FOLLOW-UP-{{id}}"
              name: "Follow up on organization membership {{id}}"
              description: "Organization membership {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A relationship that connects a user or party to an organisation, with its membership status and role context.
    businessMeaning: 'People belong to organisations in different ways: as staff, partners, members or contractors. The membership says that a person belongs, in what capacity and whether it is current, which access and responsibilities are then based on.'
    usage: Created when someone is invited or added; activated on acceptance; ended when they leave; read by access control and administration.
    relationshipContext: A membership links a User or Party to an Organization.
    lifecycle: A membership is pending until accepted, active while in force, completed when it ends normally and cancelled if withdrawn before it began. State changes keep auditable history and do not duplicate effects.
    example: A consultant added to a client organisation for the duration of a project.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ORGANIZATION-MEMBERSHIP}
