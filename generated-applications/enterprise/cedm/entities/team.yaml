entity:
  name: Team
  namespace: cedm.domain
  kind: organization_structure
  description: A governed collaborative organizational grouping used to assign people, roles, work, ownership, and accountability.
  ui:
    icon: table
  identity: {key: teamId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: teamId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent system identity of the team, unchanged when its name or code is edited.', usage: 'Generated on creation and never changed; assignments, memberships and ownership records refer to the team through it.', businessMeaning: Lets assignments and ownership point at the team rather than its name., relationshipContext: Referenced by tasks and records owned by the team.}}
    - {name: code, type: string, required: true, maxLength: 100, help: {summary: 'The short code of the team, such as WH-LDS.', businessMeaning: Gives a stable way to refer to the team in imports and rules., usage: Unique; used in imports and rules., relationshipContext: Read with the name.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: 'The descriptive name of the team, such as Customer Support Tier 2.', usage: "Entered by the organization administrator; shown in assignment pickers and reports, and may change without affecting the team's identity.", businessMeaning: What people look for when assigning work., relationshipContext: Read with the organisation.}}
  relationships:
    - {name: organization, target: Organization, cardinality: "1", ownership: reference, help: {summary: The organisation the team belongs to., usage: Chosen when the team is created., cardinalityMeaning: Exactly one organisation., workflowRole: Decides whose structure the team is part of.}}
  invariants:
    - {id: TEAM-001, rule: Code and identity semantics must remain stable within the governing context and historical references must not be silently repointed.}
  help:
    summary: A collaborative grouping of people used to assign work, roles, ownership and accountability.
    businessMeaning: Teams let work and responsibility be given to a group rather than a single person, and let access and reporting follow the group. A team belongs to an organisation, so each unit manages its own groups.
    usage: Set up by managers or administrators; chosen on tasks and records; read in reports.
    relationshipContext: A team belongs to one organisation.
    lifecycle: A team is created, used while it works together, and left unused when disbanded. History keeps its name.
    example: The "Warehouse Leeds" team is responsible for stock counts at the Leeds site.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TEAM}
