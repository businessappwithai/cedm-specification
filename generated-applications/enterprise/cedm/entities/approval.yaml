entity:
  name: Approval
  namespace: cedm.domain
  kind: workflow_decision
  description: A governed approval decision or approval request associated with a business object, process, task, or controlled change.
  ui:
    icon: table
  identity: {key: approvalId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: approvalId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of the approval., usage: Generated on request; workflow steps and audit entries refer to the approval through it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the approval request is in its path to a decision.
        usage: Moved by the approver and the workflow; a gated step proceeds only when the approval is COMPLETED with a positive decision.
        valueSemantics:
          PENDING: Requested and waiting to be picked up.
          ACTIVE: Under review by the approver.
          COMPLETED: Decided; the decision is final evidence.
          CANCELLED: Withdrawn by the requester before a decision.
    - name: subject
      type: string
      required: true
      maxLength: 200
      help:
        summary: A one-line statement of what is to be approved.
        usage: Shown in the approver's list, so it should name the item and the amount if there is one.
        relationshipContext: Identifies the approval on screens; the item itself is named by its kind and reference.
    - name: itemType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of item awaiting a decision, such as "Purchase requisition" or "Expense claim".
        usage: Set by the process that raises the approval; reports group approvals by it.
        relationshipContext: Read with the item reference to find the item.
    - name: itemReference
      type: string
      required: true
      maxLength: 100
      help:
        summary: The number or reference of the item awaiting a decision.
        usage: Set by the process that raises the approval, such as "PR-2024-0871"; the approver uses it to open the item.
        relationshipContext: Together with the item type it identifies exactly one record.
    - name: approvalLevel
      type: integer
      required: true
      default: 1
      help:
        summary: Which level of a multi-level approval this is.
        usage: Level 1 is decided first; a higher level is raised only after the level below is approved.
        relationshipContext: Single-level approvals use level 1.
    - name: amount
      type: Money
      required: false
      help:
        summary: The value of the item, where the decision depends on it.
        usage: Copied from the item when the approval is raised; it decides which approval limit applies.
        relationshipContext: Empty for approvals that carry no amount, such as a document review.
    - name: requestedAt
      type: datetime
      required: true
      help:
        summary: When the decision was asked for.
        usage: Recorded when the approval is raised; the time to decide is measured from it.
        relationshipContext: Precedes the decision time.
    - name: dueAt
      type: datetime
      required: false
      help:
        summary: When the decision is needed by.
        usage: Set by the process from its service level; an approval still pending after it is overdue.
        relationshipContext: Overdue approvals are escalated.
    - name: decidedAt
      type: datetime
      required: false
      help:
        summary: When the approver decided.
        usage: Recorded with the decision; it is the evidence of when the control operated.
        relationshipContext: Present once the approval is approved or rejected.
    - name: decisionComment
      type: text
      required: false
      help:
        summary: What the approver said about the decision.
        usage: Required in practice for rejections, so the requester knows what to change.
        relationshipContext: Kept with the decision as audit evidence.
  relationships:
    - name: approver
      target: Person
      cardinality: "1"
      ownership: reference
      help:
        summary: The person asked to decide.
        usage: Chosen by the process from the approval rules; the approval appears in this person's list.
        cardinalityMeaning: One approver per approval; several approvers mean several approvals.
        context: The approver should hold the authority the item needs and should not be the requester.
    - name: requester
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who asked for the decision.
        usage: Recorded when the approval is raised; told of the decision.
        cardinalityMeaning: One requester per approval.
        context: Separation of duties requires the requester and the approver to differ.
    - name: task
      target: Task
      cardinality: 0..1
      ownership: reference
      help:
        summary: The work item through which the approver is asked to decide.
        usage: Linked when the approval is raised through the task list.
        cardinalityMeaning: At most one task per approval.
        context: Completing the task records the decision on the approval.
  invariants:
    - {id: APPROVAL-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
    - {id: APPROVAL-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  lifecycle:
    title: Approval Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  help:
    summary: A request for, or the outcome of, an approval decision about a business object, process, task or controlled change.
    businessMeaning: Approvals are the checkpoints where a person with authority says yes or no. Recording them as data, not email, shows who approved what and when, and lets processes wait for or react to the decision.
    usage: Created when something needs sign-off, decided by the approver, and read afterwards by anyone who needs to show the control was applied.
    relationshipContext: An approval refers to the thing it approves and to the approver; workflow and access governance use it to gate steps.
    lifecycle: An approval is pending when requested, active while under review, completed once decided and cancelled if the request is withdrawn. The decision is evidence and is not rewritten.
    example: A purchase order above the buyer's limit goes to the finance director for approval before it can be sent to the supplier.
    commonProcesses: Workflow orchestration, approval, assignment, escalation, access governance, and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-APPROVAL}
