entity:
  name: ChemicalBatch
  namespace: cedm.domain
  kind: process_industry_entity
  description: A traceable batch of chemical or process-industry material produced, received, or processed under controlled conditions.
  ui:
    icon: table
  identity:
    key: chemicalBatchId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: chemicalBatchId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the batch record.
        usage: Generated on creation; inspections, stock movements and recalls refer to it.
    - name: batchNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The lot number assigned to the batch, printed on labels and certificates.
        usage: Allocated at production or receipt; unique, and the key by which the batch is traced forwards and backwards.
    - name: manufactureDate
      type: date
      required: false
      help:
        summary: The date the batch was produced.
        usage: Entered at production; the start of the batch's shelf life.
    - name: expiryDate
      type: date
      required: false
      help:
        summary: The date after which the batch must not be used.
        usage: Set from the product's shelf life; stock past it is blocked. It must not be before the manufacture date.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - QUARANTINED
        - RELEASED
        - REJECTED
        - EXPIRED
        - CONSUMED
      help:
        valueSemantics:
          PLANNED: Scheduled to be produced or received; no material exists yet.
          QUARANTINED: Present but held until quality checks pass; not usable.
          RELEASED: Passed quality checks and available for use.
          REJECTED: Failed quality checks; must not be used. A final state.
          EXPIRED: Past its expiry date and no longer usable. A final state.
          CONSUMED: Fully used up, with no material left to issue. A final state.
        summary: Whether the batch may be used.
        usage: Set by quality and production; only RELEASED batches may be issued to production or sold.
  relationships:
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product of which this is a batch.
        usage: Set at creation; determines the specification the batch is tested against.
        cardinalityMeaning: Exactly one product; a batch is of one product.
        workflowRole: Gives the batch its specification and shelf life.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the batch is currently stored.
        usage: Updated as the batch moves; used for picking and inventory checks.
        cardinalityMeaning: At most one current location; empty while the batch is not yet stored.
        workflowRole: Supports stock visibility and recall.
    - name: qualityInspections
      target: QualityInspection
      cardinality: 0..*
      ownership: reference
      help:
        summary: The inspections carried out on the batch.
        usage: Read when deciding release and when investigating a quality complaint.
        cardinalityMeaning: Any number; a new batch may have none yet.
        workflowRole: Release depends on passing inspections.
  invariants:
    - id: CHEMICAL-BATCH-001
      rule: expiryDate must not precede manufactureDate.
  lifecycle:
    title: Chemical Batch Lifecycle
    attribute: status
    states: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    initial: PLANNED
    terminal:
      - CONSUMED
      - REJECTED
      - EXPIRED
    transitions:
      - {from: PLANNED, to: QUARANTINED, action: receive}
      - {from: QUARANTINED, to: RELEASED, action: release}
      - {from: QUARANTINED, to: REJECTED, action: reject}
      - {from: QUARANTINED, to: EXPIRED, action: expire}
      - {from: RELEASED, to: QUARANTINED, action: quarantine}
      - {from: RELEASED, to: CONSUMED, action: consume}
      - {from: RELEASED, to: EXPIRED, action: expire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a chemical batch is stopped"
      description: "When a chemical batch is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHEMICAL-BATCH-EXCEPTION-{{id}}"
              name: "Resolve chemical batch {{batch_number}}"
              description: "Chemical batch {{batch_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a chemical batch is ended"
      description: "When a chemical batch is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHEMICAL-BATCH-FOLLOW-UP-{{id}}"
              name: "Follow up on chemical batch {{batch_number}}"
              description: "Chemical batch {{batch_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A traceable batch of chemical or process-industry material that was produced, received or processed under controlled conditions.
    businessMeaning: In process industries the batch is the unit of quality and traceability. If a batch turns out to be faulty, the batch record shows where it was made, what was tested and where it went.
    usage: Created when a batch is planned, produced or received; updated as it is tested, released or consumed; read by quality, production and recall processes.
    relationshipContext: A batch is of one Product, is stored at a Location and is judged through QualityInspections.
    lifecycle: A batch is planned, then held in quarantine until it passes quality. Released batches can be consumed, quarantined again if a problem appears, or expire. Rejected, expired and fully consumed batches are final.
    example: Batch B-2026-0417 of 2,000 litres of solvent, made on 3 March, quarantined until its purity test passed and released on 5 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CHEMICAL-BATCH
