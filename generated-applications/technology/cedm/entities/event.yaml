      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  relationships:
  - name: actor
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Event to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Event.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: EVENT-001
    rule: eventType and source are required for every event.
  - id: EVENT-002
    rule: an event is immutable after publication.
  help:
    summary: Represents a cross domain event called Event within the CEDM business model.
    businessMeaning: Event is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Event records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party. These relationships
      provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Event record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
