entity:
  name: Event
  namespace: cedm.domain
  kind: cross_domain_event
  description: A significant occurrence that can trigger business processing, notifications, workflows, integrations, or audit
    activity.
  identity:
    key: eventId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: eventId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the event record associated with this Event. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: eventType
    type: string
    required: true
    maxLength: 200
    help:
      summary: Captures the business meaning of event type for the Event. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: occurredAt
    type: datetime
    required: true
    help:
      summary: Records when the occurred event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: source
    type: string
    required: true
    maxLength: 300
    help:
      summary: Captures the business meaning of source for the Event. It is interpreted together with the entity's other attributes
        and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: payload
    type: object
    required: false
    help:
      summary: Captures the business meaning of payload for the Event. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
