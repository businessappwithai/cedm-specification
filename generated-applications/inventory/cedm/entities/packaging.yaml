entity:
  name: Packaging
  namespace: cedm.domain
  kind: product_packaging_master
  description: A governed packaging configuration defining how a Product or ProductVariant is contained, quantified, measured, labeled, and handled for procurement, storage, sale, and logistics.
  ui:
    icon: database
  identity: {key: packagingId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: packagingId, type: uuid, required: true, immutable: true, help: {summary: Stable packaging identity., businessMeaning: Identifies one governed pack configuration., usage: "PIM, procurement, WMS, sales and logistics.", relationshipContext: References Product and quantity/UOM semantics., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, maxLength: 100, help: {summary: Packaging configuration code., businessMeaning: Operational identifier for pack form., usage: "Catalog, labels and integration.", relationshipContext: Unique within applicable Product context., requiredMeaning: Required.}}
  - {name: quantityPerPackage, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Product quantity contained in one package., businessMeaning: Defines pack conversion., usage: "Ordering, storage, picking and shipping.", relationshipContext: Interpreted with UnitOfMeasure., requiredMeaning: Required.}}
  relationships:
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product packaged., businessMeaning: Defines package contents., usage: PIM and logistics., cardinalityMeaning: Exactly one Product., workflowRole: Product eligibility applies.}}
  - {name: productVariant, target: ProductVariant, cardinality: 0..1, ownership: reference, help: {summary: Specific variant packaged when configuration-specific., businessMeaning: Narrows packaging to one variant., usage: Commerce/WMS., cardinalityMeaning: Optional., workflowRole: Variant must belong to Product.}}
  - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: '1', ownership: reference, help: {summary: Measurement unit for quantityPerPackage., businessMeaning: Makes pack quantity unambiguous., usage: Conversion and validation., cardinalityMeaning: Exactly one UOM., workflowRole: Must be compatible with Product quantity semantics.}}
  invariants:
  - {id: PACKAGING-001, rule: quantityPerPackage must be greater than zero.}
  - {id: PACKAGING-002, rule: productVariant when present must belong to product.}
  - {id: PACKAGING-003, rule: "Packaging conversion changes must not silently reinterpret historical order, receipt, inventory or shipment quantities."}
  help:
    summary: Product packaging and pack-quantity master.
    businessMeaning: Packaging describes commercial/logistics containment; HandlingUnit identifies an actual pallet/carton/tote/package occurrence.
    usage: PIM, procurement, sales, WMS, shipping and labeling.
    relationshipContext: Product defines contents, UOM defines quantity semantics, HandlingUnit represents physical execution instances.
    lifecycle: Created/activated → revised/retired under controlled master-data change.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PACKAGING}
