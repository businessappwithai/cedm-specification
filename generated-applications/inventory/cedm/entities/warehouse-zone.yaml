entity:
  name: WarehouseZone
  namespace: cedm.domain
  kind: warehouse_structure_master
  description: A governed operational subdivision of a Warehouse grouping InventoryLocations by storage, handling, temperature, security, process, or fulfillment purpose.
  identity: {key: warehouseZoneId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: warehouseZoneId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of warehouse zone., businessMeaning: Identifies an operational storage/handling area., usage: "Putaway, picking, replenishment, capacity and controls.", relationshipContext: Groups InventoryLocations within one Warehouse., requiredMeaning: Required.}}
  - {name: zoneCode, type: string, required: true, maxLength: 100, help: {summary: Human-facing zone code., businessMeaning: Operational identifier used by warehouse workers and systems., usage: "Routing, labels and reporting.", relationshipContext: Unique within Warehouse., requiredMeaning: Required.}}
  - name: zoneType
    type: enum
    required: true
    values: [RECEIVING, RESERVE, PICKING, STAGING, SHIPPING, QUARANTINE, RETURNS, COLD_STORAGE, HAZARDOUS, GENERAL]
    help: {summary: Primary operational purpose of zone., businessMeaning: Governs eligible warehouse processes and stock., usage: Putaway/picking routing and compliance., relationshipContext: Location-level controls may further restrict eligibility., valueSemantics: {RECEIVING: Inbound receiving area., RESERVE: Bulk/reserve storage., PICKING: Forward picking area., STAGING: Temporary process staging., SHIPPING: Outbound dispatch area., QUARANTINE: Restricted inventory pending disposition., RETURNS: Reverse-logistics processing., COLD_STORAGE: Temperature-controlled storage., HAZARDOUS: Controlled hazardous-material area., GENERAL: General-purpose storage/handling.}, requiredMeaning: Required.}
  relationships:
  - {name: warehouse, target: Warehouse, cardinality: '1', ownership: reference, inverse: zones, help: {summary: Parent warehouse., businessMeaning: Supplies facility and operating context., usage: WMS hierarchy., cardinalityMeaning: Exactly one Warehouse., workflowRole: Warehouse status constrains zone use.}}
  - {name: inventoryLocations, target: InventoryLocation, cardinality: "0..*", ownership: aggregate, help: {summary: Stock-holding/staging locations within zone., businessMeaning: Provides executable storage granularity., usage: "Putaway, picking, count and transfer.", cardinalityMeaning: Zero or many locations., workflowRole: Zone rules constrain location eligibility.}}
  invariants:
  - {id: WAREHOUSE-ZONE-001, rule: zoneCode must be unique within Warehouse.}
  - {id: WAREHOUSE-ZONE-002, rule: InventoryLocation assigned to a zone must belong to the same Warehouse context.}
  - {id: WAREHOUSE-ZONE-003, rule: "Restricted zone types must enforce applicable product, quality, safety and access controls."}
  help:
    summary: Operational grouping between Warehouse and InventoryLocation.
    businessMeaning: Warehouse is the facility, WarehouseZone is the process/storage area, InventoryLocation is the stock-control position.
    usage: Receiving, putaway, reserve/pick storage, quarantine, returns, staging and shipping.
    relationshipContext: Zone rules guide InventoryTransfer and WMS tasks but do not themselves alter inventory.
    lifecycle: Configured → active/restricted → retired while historical transactions retain zone context.
    changePropagation: Zone control changes revalidate future putaway/picking/transfer destinations without rewriting completed movements.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-WAREHOUSE-ZONE}
