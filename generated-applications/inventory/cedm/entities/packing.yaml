entity:
  name: Packing
  namespace: cedm.domain
  kind: warehouse_execution_transaction
  description: A governed warehouse task grouping picked goods into HandlingUnits and preparing them for shipment while preserving line, lot, serial, quantity, and package traceability.
  ui:
    icon: file-text
  identity: {key: packingId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: packingId, type: uuid, required: true, immutable: true, help: {summary: The identity of the packing task., usage: Generated on creation; shipments and handling units refer to it., businessMeaning: Identifies one governed packaging execution., relationshipContext: Links picked goods to handling unit and shipment.}}
    - {name: packedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: The quantity of goods put into the package., usage: Entered or scanned as goods are packed; compared with the picked quantity., businessMeaning: Measures goods prepared for transport., relationshipContext: Must not exceed eligible picked quantity.}}
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, IN_PROGRESS, PACKED, CANCELLED, EXCEPTION]
      help:
        summary: Shows how far the packing task has progressed, from planned through packed, or into cancellation or exception.
        usage: Updated by packers as work starts and finishes; shipping may proceed only once the task is packed.
        valueSemantics:
          PLANNED: Created, not yet started.
          IN_PROGRESS: Packers are filling packages.
          PACKED: Finished and ready to ship.
          CANCELLED: Called off. A final state.
          EXCEPTION: Held because something is wrong, such as a shortage or damage.
        businessMeaning: Controls packaging workflow.
        relationshipContext: PACKED is not dispatch/delivery evidence.
  relationships:
    - {name: picking, target: Picking, cardinality: 0..1, ownership: reference, help: {summary: The pick that supplied the goods., usage: Linked when packing follows a pick., cardinalityMeaning: At most one picking., workflowRole: Confirms that what is packed matches what was picked., businessMeaning: Preserves pick-to-pack provenance.}}
    - {name: handlingUnit, target: HandlingUnit, cardinality: "1", ownership: reference, help: {summary: 'The package, carton or pallet that the goods go into.', usage: Chosen when packing starts., cardinalityMeaning: 'Exactly one handling unit: each packing task fills one package.', workflowRole: Gives the package contents and its identity., businessMeaning: Establishes physical logistics identity.}}
    - {name: shipment, target: Shipment, cardinality: 0..1, ownership: reference, help: {summary: The shipment the package will be part of., usage: Linked when assigned to a delivery., cardinalityMeaning: At most one shipment., workflowRole: Adds the package to a delivery., businessMeaning: Connects warehouse packaging to transport.}}
    - {name: shipmentLine, target: ShipmentLine, cardinality: 0..1, ownership: reference, help: {summary: The shipment line that the packed goods satisfy., usage: Linked to tie packed goods to order lines., cardinalityMeaning: At most one shipment line., workflowRole: Shows which order line the goods fulfil., businessMeaning: Preserves line-level fulfillment provenance.}}
  invariants:
    - {id: PACKING-001, rule: packedQuantity must be greater than zero.}
    - {id: PACKING-002, rule: Packed quantity must not exceed eligible picked or shipment quantity and must preserve lot/serial identity where controlled.}
    - {id: PACKING-003, rule: "Packing must not itself create inventory issue, dispatch, delivery, invoice or payment effects."}
    - {id: PACKING-EXE-001, rule: "Packed Quantity cannot be negative.", violatedWhen: "packed_quantity != null and packed_quantity < 0", message: "Packed Quantity cannot be negative."}
  lifecycle:
    title: Packing Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, PACKED, CANCELLED, EXCEPTION]
    initial: PLANNED
    terminal: [CANCELLED]
    transitions:
      - {from: PLANNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: PACKED, action: mark_packed}
      - {from: IN_PROGRESS, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: IN_PROGRESS, action: resolve_exception}
      - {from: PACKED, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: PACKED, action: resolve_exception}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: PACKED, to: CANCELLED, action: cancel}
      - {from: EXCEPTION, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a packing is stopped"
      description: "When a packing is exception, a high-priority task asks someone to resolve it."
      when: "status == \"EXCEPTION\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PACKING-EXCEPTION-{{id}}"
              name: "Resolve packing {{id}}"
              description: "Packing {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a packing is ended"
      description: "When a packing is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PACKING-FOLLOW-UP-{{id}}"
              name: "Follow up on packing {{id}}"
              description: "Packing {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A warehouse task that groups picked goods into handling units and prepares them for shipment, keeping line, lot, serial, quantity and package traceability.
    businessMeaning: Between picking and shipping, goods are put into boxes, cartons or pallets. Packing records which goods went into which package, so the customer's shipment is complete and any item can be traced to its package.
    usage: Created when picked goods are ready to be packed; completed when packages are closed; read by shipping and customer service.
    relationshipContext: Packing follows a Picking, fills a HandlingUnit and prepares a Shipment (and its lines).
    lifecycle: Packing is planned, in progress while packages are filled, and packed when finished. It can be cancelled, or flagged as an exception when something does not match.
    example: Eight cartons packed for order SO-20413 on the evening shift.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PACKING}
