entity:
  name: InventoryLocation
  namespace: cedm.domain
  kind: inventory_master_entity
  description: A defined physical or logical stock-holding position inside a Warehouse or managed inventory network where quantities can be received, stored, staged, picked, reserved, counted, transferred, or controlled. Location lifecycle changes propagate to dependent inventory and execution workflows while preserving historical stock evidence.
  ui:
    icon: boxes
  identity: {key: inventoryLocationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: inventoryLocationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: 'The inventory location id of the inventory location: an identifier the business records on it.'
      usage: Entered or maintained when a inventory location is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory location's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a inventory location cannot be understood without its inventory location id.'
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: 'The code of the inventory location: a value the business records on it.'
      usage: Entered or maintained when a inventory location is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory location's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a inventory location cannot be understood without its code.'
  - name: locationType
    type: enum
    required: true
    values:
    - RECEIVING
    - BIN
    - SHELF
    - RACK
    - FLOOR
    - PICK
    - STAGING
    - QUARANTINE
    - YARD_SLOT
    - OTHER
    help:
      summary: 'The location type of the inventory location: a value the business records on it.'
      usage: Entered or maintained when a inventory location is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory location's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a inventory location cannot be understood without its location type.'
      valueSemantics:
        RECEIVING: The location type of the inventory location is receiving; set it when that is what the business means for
          this record.
        BIN: The location type of the inventory location is bin; set it when that is what the business means for this record.
        SHELF: The location type of the inventory location is shelf; set it when that is what the business means for this record.
        RACK: The location type of the inventory location is rack; set it when that is what the business means for this record.
        FLOOR: The location type of the inventory location is floor; set it when that is what the business means for this record.
        PICK: The location type of the inventory location is pick; set it when that is what the business means for this record.
        STAGING: The location type of the inventory location is staging; set it when that is what the business means for this
          record.
        QUARANTINE: The location type of the inventory location is quarantine; set it when that is what the business means for
          this record.
        YARD_SLOT: The location type of the inventory location is yard slot; set it when that is what the business means for
          this record.
        OTHER: The location type of the inventory location is other; set it when that is what the business means for this record.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, BLOCKED, INACTIVE]
    help:
      summary: Controls whether the location can participate in normal future inventory operations.
      usage: Applies to receiving, put-away, picking, transfer, allocation, replenishment, counting and staging.
      relationshipContext: Status constrains future operations; it never deletes current balances or historical movements.
      workflowRole: Status changes trigger dependent-workflow validation before operational eligibility changes become effective.
      valueSemantics:
        ACTIVE: The status of the inventory location is active; set it when that is what the business means for this record.
        BLOCKED: The status of the inventory location is blocked; set it when that is what the business means for this record.
        INACTIVE: The status of the inventory location is inactive; set it when that is what the business means for this record.
  - name: capacity
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: 'The capacity of the inventory location: a number the business records on it.'
      usage: Entered or maintained when a inventory location is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory location's other fields and its relationships; it is not meaningful
        on its own.
  relationships:
  - name: warehouse
    target: Warehouse
    cardinality: '1'
    ownership: reference
    help:
      summary: Links a inventory location to warehouse, the warehouse it relates to.
      usage: Chosen from the existing warehouse records when the inventory location is created or edited.
      cardinalityMeaning: A inventory location has exactly one warehouse in this role.
      context: Lets the inventory location be found from, and reported with, its warehouse.
  - name: inventoryBalances
    target: InventoryBalance
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Current product/location stock projections.
      workflowRole: Location status changes must validate balances and outstanding reservations before new operations are blocked.
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: Historical inventory events involving this location.
      workflowRole: Historical movements remain valid evidence even when the location is blocked or inactive.
  - name: openReservations
    target: InventoryReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Active reservations dependent on the location's available stock.
      workflowRole: Blocking or retiring a location requires controlled handling of outstanding reservations before the location is removed from future allocation.
  - name: warehouseZone
    target: WarehouseZone
    cardinality: 0..1
    ownership: reference
    help: {summary: Operational warehouse zone containing this inventory location., businessMeaning: Supplies storage/process/control classification., usage: "Putaway, picking, quarantine, replenishment and reporting.", cardinalityMeaning: Optional for locations outside zoned warehouses., workflowRole: Location eligibility must comply with zone controls.}
  - name: handlingUnits
    target: HandlingUnit
    cardinality: 0..*
    ownership: reference
    help: {summary: Physical logistics units currently associated with this location., businessMeaning: Supports pallet/carton/tote execution without replacing stock balances., usage: "Scanning, putaway, picking and count.", cardinalityMeaning: Zero or many handling units., workflowRole: Handling-unit moves must reconcile with underlying inventory execution.}
  invariants:
  - {id: INVENTORY-LOCATION-001, rule: code must be unique within its Warehouse.}
  - {id: INVENTORY-LOCATION-002, rule: capacity must be non-negative when supplied.}
  - {id: INVENTORY-LOCATION-003, rule: "BLOCKED and INACTIVE locations must not receive new normal put-away, receipt, or transfer movements unless an explicit exception workflow permits them."}
  - {id: INVENTORY-LOCATION-004, rule: QUARANTINE stock must not be treated as unrestricted available inventory without explicit quality/disposition authorization.}
  - {id: INVENTORY-LOCATION-005, rule: "Changing status, warehouse, location type, capacity semantics, or operational eligibility must identify affected InventoryBalance, InventoryMovement, InventoryReservation, receiving, picking, transfer, replenishment, and fulfillment workflows before becoming effective."}
  - {id: INVENTORY-LOCATION-006, rule: "A location with on-hand stock cannot be made operationally inaccessible without a controlled relocation, exception, or stock-management workflow."}
  - {id: INVENTORY-LOCATION-007, rule: "Existing reservations on a blocked/inactive location must be released, transferred, or explicitly retained under an authorized exception before the location is excluded from allocation."}
  - {id: INVENTORY-LOCATION-008, rule: Historical inventory movements and balances must retain the original location identity even after the location becomes inactive.}
  - {id: INVENTORY-LOCATION-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Inventory Location Lifecycle
    attribute: status
    states: [ACTIVE, BLOCKED, INACTIVE]
    initial: ACTIVE
    transitions:
      - {from: ACTIVE, to: BLOCKED, action: block}
      - {from: BLOCKED, to: ACTIVE, action: unblock}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a inventory location is stopped"
      description: "When a inventory location is blocked, a high-priority task asks someone to resolve it."
      when: "status == \"BLOCKED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INVENTORY-LOCATION-EXCEPTION-{{id}}"
              name: "Resolve inventory location {{code}}"
              description: "Inventory location {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: Granular inventory position whose lifecycle controls future execution while preserving historical inventory state.
    businessMeaning: A location is operational infrastructure, not merely an address. Changing its status can affect receiving, put-away, reservations, picking, transfers, replenishment and shipment staging.
    usage: Receiving, warehouse execution, picking, replenishment, stock counting, transfers, reservation, fulfillment, quarantine and yard operations.
    relationshipContext: Warehouse supplies facility context. InventoryLocation supplies operational position. InventoryBalance supplies current state. InventoryMovement supplies historical event evidence. InventoryReservation supplies committed demand.
    workflowContext: Location create → configure capacity/type → activate → participate in receiving/put-away/reservation/picking/transfer → block or quarantine when necessary → resolve dependent stock/reservations → inactive. Status changes trigger dependency validation rather than simply toggling a flag.
    changePropagation: Location status changes affect future transaction eligibility; location hierarchy/warehouse changes require validation of balances and open reservations; capacity/type changes require validation of affected put-away and transfer rules; historical movements remain unchanged.
    lifecycle: Configured → ACTIVE → BLOCKED/QUARANTINE operational state → resolved or INACTIVE. Existing stock is retained and must be deliberately relocated or handled through authorized workflow.
    example: A storage rack is blocked because of damage. New put-away and allocation are stopped. Existing stock and reservations are identified; reservations are moved or released and stock is transferred to valid locations. Historical movements still point to the original rack.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-LOCATION}
