entity:
  name: Wave
  namespace: cedm.domain
  kind: warehouse_orchestration_transaction
  description: A governed grouping of warehouse execution work released together for coordinated picking, putaway, packing, staging, or shipping.
  ui:
    icon: file-text
  identity: {key: waveId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: waveId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identifier of the wave, unchanged while its tasks and status change.', usage: Generated on creation; pick and putaway tasks carry it to show which release batch they belong to., businessMeaning: Identifies one coordinated work release., relationshipContext: Groups tasks without replacing individual evidence.}}
    - {name: waveNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: 'The number of the wave, such as WV-2026-0412, shown to supervisors and pickers.', usage: 'Unique; assigned when the wave is planned and used on task lists, labour planning and reporting for the shift.', businessMeaning: Operational identifier for grouped work., relationshipContext: Distinct from task and shipment identifiers.}}
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
      help:
        summary: How far the batch of warehouse work has progressed, from planning through release to completion.
        usage: Starts as PLANNED; moved by the warehouse system or supervisor as the wave is released, worked and finished.
        valueSemantics:
          PLANNED: Orders and tasks are grouped but not yet released to the floor.
          RELEASED: Released to the floor and ready for workers to start.
          IN_PROGRESS: Workers are executing the picking, putaway or packing tasks.
          COMPLETED: All the wave's work is done. A final state.
          CANCELLED: The wave was abandoned and its tasks released for other planning. A final state.
        businessMeaning: Controls grouped task release and closure.
        relationshipContext: Wave completion cannot substitute for task or inventory evidence.
    - name: waveType
      type: enum
      required: true
      default: PICKING
      values:
        - PICKING
        - PUTAWAY
        - REPLENISHMENT
      help:
        summary: The kind of work the wave releases to the floor.
        usage: Chosen when the wave is planned and decides which tasks it groups; most waves are picking waves.
        relationshipContext: Most waves are picking waves.
        valueSemantics:
          PICKING: Picking for outbound orders.
          PUTAWAY: Putting away received goods.
          REPLENISHMENT: Moving stock from reserve to picking locations.
    - name: releasedAt
      type: datetime
      required: false
      help:
        summary: The date and time the wave was released to workers on the floor.
        usage: Recorded automatically at release and empty while the wave is still planned.
        relationshipContext: Present once released.
    - name: plannedCompletionAt
      type: datetime
      required: false
      help:
        summary: When the wave should be finished, usually to meet a carrier cut-off.
        usage: Set when planning the wave.
        relationshipContext: Late waves are flagged.
    - name: completedAt
      type: datetime
      required: false
      help:
        summary: The date and time the last task in the wave was finished.
        usage: Recorded when the wave completes and compared with the planned completion to measure lateness.
        relationshipContext: Present once completed.
    - name: taskCount
      type: integer
      required: false
      help:
        summary: How many tasks, picks and putaways together, the wave contains.
        usage: Calculated by the system and shown on the wave monitor so supervisors can size labour.
        relationshipContext: Summed from its picks and putaways.
  relationships:
    - {name: warehouse, target: Warehouse, cardinality: '1', ownership: reference, help: {cardinalityMeaning: Each wave is run in one warehouse., summary: Warehouse executing wave., businessMeaning: Defines operating facility., usage: Labor/task orchestration., workflowRole: Included tasks must be compatible with warehouse.}}
    - {name: picks, target: Picking, cardinality: 0..*, ownership: reference, help: {cardinalityMeaning: Any number of picking tasks are released with a wave., summary: Pick tasks grouped in wave., businessMeaning: Coordinates inventory-selection work., usage: Batch/zone/order picking., workflowRole: Each pick retains independent execution evidence.}}
    - {name: putaways, target: Putaway, cardinality: 0..*, ownership: reference, help: {summary: Putaway tasks grouped in wave., businessMeaning: Coordinates storage work., usage: Labor orchestration., cardinalityMeaning: Zero or many tasks., workflowRole: Each task remains independently reconcilable.}}
  invariants:
    - {id: WAVE-001, rule: RELEASED wave must contain at least one executable task.}
    - {id: WAVE-002, rule: Cancelling a wave cannot erase or reverse already posted task or inventory effects.}
    - {id: WAVE-003, rule: COMPLETED requires included released tasks to be terminal or explicitly excepted.}
    - {id: WAVE-EXE-001, rule: "Task Count cannot be negative.", violatedWhen: "task_count != null and task_count < 0", message: "Task Count cannot be negative."}
    - {id: WAVE-EXE-002, rule: "A wave that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the wave is completed."}
  lifecycle:
    title: Wave Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RELEASED, action: release}
      - {from: RELEASED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a wave is ended"
      description: "When a wave is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "WAVE-FOLLOW-UP-{{id}}"
              name: "Follow up on wave {{wave_number}}"
              description: "Wave {{wave_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a wave is done"
      description: "When a wave is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "WAVE-COMPLETED-{{id}}"
              name: "Confirm wave {{wave_number}}"
              description: "Wave {{wave_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Warehouse work-release grouping for coordinated execution.
    businessMeaning: Wave organizes tasks; it does not itself move inventory or fulfill orders.
    usage: Labor planning, batch/zone picking, putaway and shipping-cutoff execution.
    relationshipContext: Warehouse supplies facility; Picking and Putaway supply executable tasks.
    lifecycle: Planned to released to in progress to completed or cancelled.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-WAVE}
