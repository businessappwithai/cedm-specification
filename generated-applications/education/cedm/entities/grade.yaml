entity:
  name: Grade
  namespace: cedm.domain
  kind: education_grade
  description: A governed learner-specific outcome for an Assessment, preserving score, grade value and finalization history independently of the Assessment definition.
  ui: {icon: badge}
  identity: {key: gradeId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: gradeId, type: uuid, required: true, immutable: true, help: {summary: "The permanent identity of one learner's result, kept even when the score or grade value is corrected.", usage: 'Generated when the result is first recorded; transcripts, gradebooks and certificates refer to it by this value.', businessMeaning: Identifies one Grade independently of later correction or transcript presentation., relationshipContext: Assessment and EducationStudent define what and who were evaluated.}}
    - {name: score, type: decimal, required: false, precision: 12, scale: 4, help: {summary: Numeric score achieved by the learner when numeric scoring applies., businessMeaning: Raw or governed numeric outcome before or alongside grade-value interpretation., usage: "Grade calculation and analytics.", relationshipContext: Must respect Assessment maxScore when applicable.}}
    - {name: gradeValue, type: string, required: false, maxLength: 80, help: {summary: 'The grade as the learner sees it, such as A, 72 percent or Pass, as defined by the grading scheme.', usage: Entered or derived from the score by the teacher; shown in gradebooks and transcripts and fixed once the grade is final., businessMeaning: "Records values such as A, Pass, Distinction or rubric result under policy.", relationshipContext: Interpretation belongs to the applicable grading policy.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, FINAL, VOID]
      help:
        summary: Whether the grade is provisional, official or withdrawn.
        usage: Set by the teacher or registrar; only FINAL grades count towards transcripts and progression.
        valueSemantics:
          DRAFT: Entered but not yet official; can still change.
          FINAL: Confirmed and official; part of the student's record. A final state.
          VOID: Withdrawn because it was entered in error or annulled; kept for audit. A final state.
        businessMeaning: "Distinguishes provisional result, finalized academic evidence and voided erroneous record."
        relationshipContext: FINAL grades are immutable historical evidence under ordinary operation.
  relationships:
    - {name: student, target: EducationStudent, cardinality: "1", ownership: reference, help: {usage: Set when the grade is entered; transcripts are produced from a student's final grades., cardinalityMeaning: "Exactly one student: a grade is one learner's result.", summary: Student receiving this Grade., businessMeaning: Establishes learner identity for the result., workflowRole: Student must be eligible for the Assessment context.}}
    - {name: assessment, target: Assessment, cardinality: "1", ownership: reference, help: {cardinalityMeaning: 'Exactly one assessment: a grade is a result for a specific evaluated activity.', summary: Assessment producing this learner outcome., businessMeaning: "Supplies scoring scale, type and curriculum context.", usage: Grade validation and reporting., workflowRole: Score and finalization must comply with Assessment policy.}}
    - {name: enrollment, target: Enrollment, cardinality: "0..1", ownership: reference, help: {summary: Enrollment establishing learner eligibility for the course or class., businessMeaning: Provides registration context for the Grade., usage: "Gradebook, transcript and eligibility checks.", cardinalityMeaning: Optional when eligibility is established elsewhere., workflowRole: Enrollment student/course context must agree with Grade and Assessment.}}
  invariants:
    - {id: GRADE-001, rule: At least one of score or gradeValue must be supplied.}
    - {id: GRADE-002, rule: "score must not exceed Assessment maxScore when maxScore is defined, except under explicit governed extra-credit policy."}
    - {id: GRADE-003, rule: "FINAL Grade is immutable academic evidence; correction uses a governed replacement, amendment or void process rather than destructive overwrite."}
  lifecycle:
    title: Grade Lifecycle
    attribute: status
    states: [DRAFT, FINAL, VOID]
    initial: DRAFT
    terminal: [FINAL, VOID]
    transitions:
      - {from: DRAFT, to: FINAL, action: finalize}
      - {from: DRAFT, to: VOID, action: void}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a grade is ended"
      description: "When a grade is void, a task asks someone to settle what depended on it."
      when: "status == \"VOID\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GRADE-FOLLOW-UP-{{id}}"
              name: "Follow up on grade {{id}}"
              description: "Grade {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Records one learner's result for one Assessment.
    businessMeaning: Assessment defines the evaluated activity; Grade is the student-specific outcome retained for academic evidence.
    usage: Gradebooks, transcripts, learner progress, reporting, certification and audit.
    relationshipContext: EducationStudent and Assessment are mandatory; Enrollment may supply eligibility context.
    lifecycle: Grade begins provisional and becomes final or void; final outcomes are corrected through explicit follow-up evidence.
    example: A student receives score 86 and grade value A on a published Assessment, then the Grade is finalized for transcript use.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-GRADE}
