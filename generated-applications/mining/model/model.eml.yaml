entities:
  - name: Party
    help: The foundational CEDM business concept for an identifiable person or organization participating in business. Party separates who an actor is from the roles that actor performs. The same party can be a customer, supplier, employee, owner, provider, or contract party without creating duplicate identities. Used as the identity foundation for onboarding, customer management, procurement, sales, finance, logistics, HR, healthcare, contracts, compliance, and audit. Party connects to Person or Organization for intrinsic identity details and to PartyRole for business roles. Transactions and domain entities should reference the appropriate role when role-specific behavior matters. Party identity is long-lived. Operational eligibility is controlled by status, while historical relationships and transactions remain referentially valid. One organization may be represented by a single Party and simultaneously participate as Customer and Supplier in different business relationships.
    icon: users
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The stable internal identity of the party. Identifies the real-world person or organization represented by this record without changing when the party changes roles or business relationships. Used as the identity anchor for party roles, addresses, transactions, contracts, ownership, audit, and integrations. PartyId identifies the root party; role-specific identifiers such as Customer.customerId must not be used as substitutes for party identity.
      - name: party_type
        type: string
        enum: PartyPartyType
        help: Identifies whether the party is a person or an organization. Determines which party specialization is applicable and prevents business processes from interpreting an organization as an individual or vice versa. Used to select Person or Organization details and to drive validation, forms, search, reporting, and role assignment. PERSON requires the Person specialization; ORGANIZATION requires the Organization specialization. The party represents an individual human being. The party represents a legal, commercial, governmental, nonprofit, or other organized body.
      - name: display_name
        type: string(300)
        help: The business-facing name by which the party is normally displayed and recognized. Provides a consistent human-readable representation independent of whether the party is a person or organization. Used in forms, search results, documents, transactions, reports, notifications, and user interfaces. It is a presentation identity for the Party and does not replace legal names, person names, or organization registration names stored by specializations.
      - name: status
        type: string
        enum: PartyStatus
        help: Controls whether the party may participate in new business activity. Represents the operational lifecycle of the party relationship with the enterprise, not the party's legal existence. Used by onboarding, transaction validation, account maintenance, compliance, and deactivation processes. A party may remain historically referenced after becoming INACTIVE, BLOCKED, or RETIRED; lifecycle state therefore does not imply deletion. The party is available for normal business participation. The party is retained but is not normally eligible for new activity. Business activity is restricted pending resolution of a business, risk, compliance, or operational condition. The party relationship is permanently ended for normal operational use while historical references remain valid.
        default: ACTIVE
      - name: external_reference
        type: string(200)
        optional: true
        help: An identifier assigned to the party by an external system or business partner. Preserves a cross-system identity that allows CEDM to reconcile a party with another master-data system. Used for integrations, migration, reconciliation, EDI, synchronization, and external lookup. It is not the canonical CEDM identity; Party.partyId remains the internal identity while externalReference provides interoperability context.
  - name: Person
    help: Person is the individual specialization of Party, not a business role. Party identifies the individual; Person supplies intrinsic individual details; PartyRole determines how the person participates. Used for customers, employees, agents, owners, contractors, and other roles without duplicating individual identity. Party → Person establishes intrinsic identity; Party → PartyRole establishes business participation; Organization links provide employment or other organizational context. Create/maintain Party → create Person specialization → establish PartyRole → apply role-specific qualification/authorization → execute transactions. Ending one role does not end the person or other roles. Person specialization follows Party identity while role eligibility remains independently controlled by PartyRole. One individual may be both an Employee and Customer. The same Party and Person specialization is reused while separate PartyRoles govern employment and customer processes.
    icon: user
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the Person specialization. individual identity processes. Party.partyId remains canonical. identifies person-specific record.
      - name: party_id
        type: string
        fk: true
        unique: true
        help: Canonical Party identity represented by this Person specialization. Connects person-specific data to common Party identity and all PartyRoles. Exactly one Person specialization may represent a Party classified as PERSON. Ensures transactions and roles use one stable person identity.
      - name: title
        type: string(50)
        optional: true
        help: Personal title. documents and presentation. presentation attribute. supports person display.
      - name: given_name
        type: string(150)
        help: Given name. identity and documents. intrinsic person identity. identification.
      - name: middle_name
        type: string(150)
        optional: true
        help: Middle name. identity and documents. intrinsic person identity. identification.
      - name: family_name
        type: string(150)
        help: Family name. identity and documents. intrinsic person identity. identification.
      - name: preferred_name
        type: string(150)
        optional: true
        help: Preferred display name. communication and UI. presentation not canonical identity. human interaction.
      - name: date_of_birth
        type: date
        optional: true
        help: Date of birth. processes requiring verified individual identity. sensitive person attribute subject to access policy. eligibility/verification where applicable.
      - name: gender
        type: string
        optional: true
        enum: PersonGender
        help: The person's gender as recorded for the organisation's purposes. Entered only where there is a need and a lawful basis; never used to decide eligibility unless the law requires it. Identifies as female. Identifies as male. Identifies as neither exclusively male nor female. Identifies in another way. Not stated or not collected. person attribute and not role. process-specific.
      - name: nationality_id
        type: string
        fk: true
        references: Country
        optional: true
        help: The country whose nationality the person holds. Chosen from the list of countries; used by identity and compliance processes. Not Party identity; process-specific.
      - name: party_type
        type: string
        enum: PersonPartyType
        help: Identifies whether the party is a person or an organization. Determines which party specialization is applicable and prevents business processes from interpreting an organization as an individual or vice versa. Used to select Person or Organization details and to drive validation, forms, search, reporting, and role assignment. PERSON requires the Person specialization; ORGANIZATION requires the Organization specialization. The party represents an individual human being. The party represents a legal, commercial, governmental, nonprofit, or other organized body.
      - name: display_name
        type: string(300)
        help: The business-facing name by which the party is normally displayed and recognized. Provides a consistent human-readable representation independent of whether the party is a person or organization. Used in forms, search results, documents, transactions, reports, notifications, and user interfaces. It is a presentation identity for the Party and does not replace legal names, person names, or organization registration names stored by specializations.
      - name: status
        type: string
        enum: PersonStatus
        help: Controls whether the party may participate in new business activity. Represents the operational lifecycle of the party relationship with the enterprise, not the party's legal existence. Used by onboarding, transaction validation, account maintenance, compliance, and deactivation processes. A party may remain historically referenced after becoming INACTIVE, BLOCKED, or RETIRED; lifecycle state therefore does not imply deletion. The party is available for normal business participation. The party is retained but is not normally eligible for new activity. Business activity is restricted pending resolution of a business, risk, compliance, or operational condition. The party relationship is permanently ended for normal operational use while historical references remain valid.
        default: ACTIVE
      - name: external_reference
        type: string(200)
        optional: true
        help: An identifier assigned to the party by an external system or business partner. Preserves a cross-system identity that allows CEDM to reconcile a party with another master-data system. Used for integrations, migration, reconciliation, EDI, synchronization, and external lookup. It is not the canonical CEDM identity; Party.partyId remains the internal identity while externalReference provides interoperability context.
  - name: Organization
    help: Organization is the organizational specialization of Party, not an independent party identity or business role. Party identifies who the organization is; Organization describes intrinsic organizational structure; PartyRole describes how it participates; Customer and Supplier provide commercial behavior. Used across sales, procurement, finance, logistics, contracts, compliance, HR, and enterprise hierarchy. Party → Organization provides identity specialization. Party → PartyRole provides participation. Customer/Supplier must not create duplicate Party identities. Create/maintain Party → create Organization specialization → establish organizational hierarchy → assign PartyRole → apply specialized commercial qualification → permit transactions. Master-data changes affect future eligibility and presentation while historical transactions retain their original context. Organization follows its own master-data lifecycle while remaining subordinate to Party identity consistency. Retirement does not delete historical transactions or roles. One company exists as one Party and one Organization specialization, while holding CUSTOMER and SUPPLIER PartyRoles with separate commercial controls.
    icon: building-2
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the Organization specialization. Used to navigate organizational identity details from the underlying Party. Party.partyId remains the canonical party identity; organizationId identifies the specialization record. Provides stable reference for organization-specific information.
      - name: party_id
        type: string
        fk: true
        unique: true
        help: Canonical Party identity represented by this Organization specialization. Connects organizational details to the shared Party identity used by all roles and transactions. One Party may have exactly one Organization specialization when partyType is ORGANIZATION. Ensures Customer, Supplier, Owner, and other roles resolve to the same underlying organization.
      - name: code
        type: string(50)
        help: Business code for the organization within its governed business context. Used for operations, reporting, integrations, and organizational selection. Code is not the canonical Party identity and uniqueness is governed by organization scope. Provides operational reference for organization hierarchy and business context.
      - name: name
        type: string(200)
        help: Common organizational name used in business operations. Used in search, forms, reports, documents, and transactions. LegalName may differ and provides formal legal identity. Provides human-readable organizational identification.
      - name: organization_type
        type: string
        enum: OrganizationOrganizationType
        help: The top-level body, such as a group or corporation. A legal company. A business division with its own results. A major part of the organisation. A functional unit. A local office or branch. A company controlled by another. Any other organised body. Classifies the organizational structure represented by the specialization. Used for hierarchy, authorization, reporting, transaction scope, and organizational configuration. Organization type describes structure, not commercial role. Customer/Supplier behavior belongs to PartyRole specializations. Controls applicable organizational hierarchy and operating-context rules.
      - name: status
        type: string
        enum: OrganizationStatus
        help: Being set up; not yet in use. In use. Temporarily not in use; can be reactivated. Closed; kept for history. A final state. Lifecycle of the organizational specialization. Controls whether the organization can normally be selected as an organizational context. Organization status does not replace Party.status or PartyRole.status; all applicable states must permit new activity. Governs organizational use while preserving historical relationships.
        default: DRAFT
      - name: legal_name
        type: string(300)
        optional: true
        help: Formal legal name of the organization. Used for contracts, invoices, tax, regulatory reporting, and legal documentation. LegalName is distinct from the operational name. Supplies legal presentation and compliance context.
      - name: registration_number
        type: string(100)
        optional: true
        help: Registration identifier assigned by a competent authority. Used for legal verification, compliance, tax, and integrations. Registration number identifies the organization in an external legal system, not in CEDM. Supports identity verification and compliance controls.
      - name: tax_identifier
        type: string(100)
        optional: true
        help: Tax identifier applicable to the organization in a relevant jurisdiction. Used for tax determination, invoices, reporting, and compliance. Tax identity may vary by jurisdiction and should not replace Party identity. Supports tax-rule applicability and statutory reporting.
      - name: party_type
        type: string
        enum: OrganizationPartyType
        help: Identifies whether the party is a person or an organization. Determines which party specialization is applicable and prevents business processes from interpreting an organization as an individual or vice versa. Used to select Person or Organization details and to drive validation, forms, search, reporting, and role assignment. PERSON requires the Person specialization; ORGANIZATION requires the Organization specialization. The party represents an individual human being. The party represents a legal, commercial, governmental, nonprofit, or other organized body.
      - name: display_name
        type: string(300)
        help: The business-facing name by which the party is normally displayed and recognized. Provides a consistent human-readable representation independent of whether the party is a person or organization. Used in forms, search results, documents, transactions, reports, notifications, and user interfaces. It is a presentation identity for the Party and does not replace legal names, person names, or organization registration names stored by specializations.
      - name: external_reference
        type: string(200)
        optional: true
        help: An identifier assigned to the party by an external system or business partner. Preserves a cross-system identity that allows CEDM to reconcile a party with another master-data system. Used for integrations, migration, reconciliation, EDI, synchronization, and external lookup. It is not the canonical CEDM identity; Party.partyId remains the internal identity while externalReference provides interoperability context.
      - name: person_id
        type: string
        fk: true
        optional: true
        help: The Person this Organization belongs to.
      - name: parent_organization_id
        type: string
        fk: true
        optional: true
        help: Immediate parent organizational unit. Supports enterprise hierarchy and organizational scope. Zero or one immediate parent. Determines inherited organizational context where explicitly supported.
  - name: PartyRole
    help: The bridge between stable Party identity and contextual business participation. Party answers who the actor is; PartyRole answers how that actor participates; Customer and Supplier add role-specific commercial behavior. Foundation for sales, procurement, employment, logistics, ownership, contracts, finance, and relationship management. Customer and Supplier specialize PartyRole. Party identity is never duplicated in those specializations. Transaction entities should retain the role context that was effective when the transaction was created or confirmed. Party onboarding → PartyRole creation → role-specific qualification/controls → transaction eligibility → transaction creation → transaction lifecycle. Role changes affect future eligibility but preserve historical role attribution. Create role → validate scope/eligibility → activate → optionally inactivate/expire → preserve historical references. A role ending does not end the Party or unrelated roles. One organization can be a Customer and Supplier simultaneously. Its Party record is shared; each PartyRole has its own roleType, scope, lifecycle, and specialized controls. A SalesOrder references the Customer role while a PurchaseOrder references the Supplier role.
    icon: users
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the role, separate from the identity of the party. Generated on creation; customer and supplier records refer to it. Distinct from Party.partyId and specialized identifiers such as Customer.customerId or Supplier.supplierId. Provides the stable role reference used throughout the role lifecycle.
      - name: party_id
        type: string
        fk: true
        help: The party that holds the role. Set when the role is assigned and not changed. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity.
      - name: role_type
        type: string
        enum: PartyRoleRoleType
        help: The kind of role the party plays. Chosen when the role is assigned; decides which specialised record (customer, supplier and so on) is expected. Buys from the organisation. Sells to the organisation. Works for the organisation. A business partner or reseller. Transports goods for the organisation. Acts on behalf of the organisation or its customers. Provides services under a contract. Owns property or a share in the organisation. Provides capital. Any other role. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process.
      - name: code
        type: string(100)
        optional: true
        help: An optional code for the role. Used by integrations that identify the role separately from the party. Identifies the role instance and must not replace Party or specialized role identifiers.
      - name: valid_from
        type: date
        optional: true
        help: The first date on which the role applies. Set when the role is assigned. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role.
      - name: valid_to
        type: date
        optional: true
        help: The last date on which the role applies. Set when the role ends. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution.
      - name: status
        type: string
        enum: PartyRoleStatus
        help: Whether the role is currently held. Set by master-data staff. The party currently holds the role. Dormant but may resume. Ended; kept for history. A final state. Role status is independent of Party.status and other PartyRole statuses. ACTIVE permits normal role use; INACTIVE temporarily prevents ordinary use; EXPIRED represents ended validity.
        default: ACTIVE
      - name: person_id
        type: string
        fk: true
        optional: true
        help: The Person this PartyRole belongs to.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
  - name: PartyRelationship
    help: "A time-bound relationship between two parties that describes how they stand to each other in business, legal, household, employment or another way. Parties are connected to each other: a company to its subsidiary, a person to their employer, one household member to another. Recording the relationship, with its dates, lets the organisation see who is connected to whom and since when. Created when a relationship is established; ended when it stops; read by sales, compliance and customer service. A relationship runs from one Party to another. Code and identity stay stable, and the relationship's history is kept when it ends or changes. \"Subsidiary of\": Acme Ltd is a subsidiary of Acme Holdings from 1 January 2019."
    icon: users
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the relationship. Generated on creation; documents and reports refer to it.
      - name: code
        type: string(100)
        help: The code of the relationship type or instance, such as SUBSIDIARY_OF. Chosen from the relationship list; used in queries and rules.
      - name: name
        type: string(300)
        help: A description of the relationship. Shown in party views.
      - name: from_party_id
        type: string
        fk: true
        references: Party
        help: "The party at the origin of the relationship. Chosen when the relationship is created. Exactly one origin party: a relationship always starts at a particular party. Together with the other party it identifies the relationship."
  - name: LegalEntity
    help: A legally recognised organisation or person that can hold rights and obligations, registrations, contracts, assets, liabilities or filings. Contracts are signed and taxes are paid by legal entities, not by business units. Knowing exactly which entity is involved determines liability, reporting and registration duties. Registered when an entity is formed or acquired; referenced by contracts, filings and ledgers. Contracts, filings and accounting books refer to the legal entity. Finalised evidence and effective history are preserved; changes such as name changes or mergers are recorded explicitly. Acme Holdings GmbH, a limited company registered in Germany.
    icon: database
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the legal entity. Generated on registration.
      - name: occurred_at
        type: datetime
        optional: true
        help: When the entity was formed, or its record took effect. Set from the registration data.
  - name: BusinessUnit
    help: A major business, division, product line or operating segment within an organisation. Business units are how a large organisation divides its activity for management and reporting. They let results, budgets and responsibility be assigned to a meaningful segment rather than to the organisation as a whole. Defined by management and finance; assigned to people, transactions and budgets; read when reporting by segment. Each business unit belongs to one Organization and groups the work and results of one part of it. A business unit keeps its code and identity stable. Reorganisations are recorded explicitly so earlier reports are not silently changed. The Consumer Electronics division of a manufacturer, with its own budget and profit target.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the business unit. Generated on creation; budgets, transactions and reports refer to it.
      - name: code
        type: string(100)
        help: The short reference for the unit, such as CE or EMEA-RETAIL. Assigned by finance and used on reports and in postings; kept stable because history relies on it.
      - name: name
        type: string(300)
        help: The full name of the unit. Shown in organisation charts and management reports.
      - name: organization_id
        type: string
        fk: true
        help: The organisation to which the unit belongs. Set when the unit is created. Exactly one organisation; a unit cannot stand alone. Rolls the unit's results up into its parent organisation.
  - name: Department
    help: A unit of an organisation that groups people, positions, responsibilities and work. Departments are how people are organised day to day. They define reporting lines, budgets and responsibilities. Defined by HR and management; assigned to people and positions; used in reporting and approvals. A department belongs to an Organization (or one of its business units). Code and identity stay stable. Reorganisations are recorded explicitly so earlier reports do not change. The Accounts Payable department of the finance function.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the department. Generated on creation; people, positions and budgets refer to it.
      - name: code
        type: string(100)
        help: The short code of the department, such as FIN-AP. Used in postings and reports; kept stable.
      - name: name
        type: string(300)
        help: The name of the department. Shown in organisation charts and on documents.
      - name: organization_id
        type: string
        fk: true
        help: "The organisation the department belongs to. Exactly one organisation: a department is part of a single organisation. Places the department in the reporting structure."
  - name: Address
    help: A structured postal or physical address for a party or location, held once so it can be reused wherever it is needed. Addresses are reusable master data, yet an address printed on an issued invoice or shipment is historical evidence. This entity therefore holds the current address while documents keep their own copy of what was printed. Created when a party or location needs an address, selected when documents are prepared, and retired when it is no longer valid; read by invoicing, shipping, tax and mailing processes. An address is placed through its Country, optional StateProvince and City, so it follows the geography lists, and may be used by a Party or a Location. Addresses are active, can be made inactive and reactivated, and are retired when finished with. Retirement stops new use but never removes the address from past documents. A customer moves its billing address; the customer record now points to the new active address while already issued invoices keep the address that applied when they were issued. Address create/update → validate country/geography → validate Party/Location dependency → select effective address → transaction captures address evidence → later master-data changes affect future selection only.
    icon: map-pin
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of the address. Generated on creation; parties, locations and document snapshots refer to the address through it.
      - name: address_type
        type: string
        enum: AddressAddressType
        help: The purpose for which the address is used. Chosen when the address is created and used to pick the right address for a document, such as BILLING for invoices and SHIPPING for deliveries. A private home address. A place of business or office. Where invoices and statements are sent. Where goods are delivered. The official registered address of a legal entity. A mailing address such as a post office box. Any purpose not listed.
      - name: line1
        type: string(200)
        help: The first line of the street address, usually building number and street. Entered by the person maintaining the address; printed on labels and documents.
      - name: line2
        type: string(200)
        optional: true
        help: An optional second address line, such as a suite, unit or floor. Filled when line 1 is not enough to find the exact delivery point.
      - name: line3
        type: string(200)
        optional: true
        help: An optional third address line for additional delivery details. Rarely used; kept for countries and carriers whose formats need more than two lines.
      - name: city_name
        type: string(150)
        optional: true
        help: The name of the town or locality when it is not in the list of cities. Filled only when no city can be chosen; leave it empty when the city is picked from the list. Stands in for the city relationship; an address states one or the other.
      - name: postal_code
        type: string(30)
        optional: true
        help: The postal or ZIP code of the address. Entered according to the country's format; used for delivery, tax zones and distance calculation.
      - name: latitude
        type: decimal
        optional: true
        help: The north-south position of the address on the earth in decimal degrees, from -90 to 90. Optional; filled by geocoding for mapping and routing. Must stay within -90 to 90.
      - name: longitude
        type: decimal
        optional: true
        help: The east-west position of the address on the earth in decimal degrees, from -180 to 180. Optional; filled by geocoding for mapping and routing. Must stay within -180 to 180.
      - name: is_primary
        type: boolean
        help: Marks the address a party or location uses by default for its address type. Set by the person maintaining addresses; at most one active primary address of each type applies per party or location, and it is the one documents pick unless told otherwise.
        default: "false"
      - name: status
        type: string
        enum: AddressStatus
        help: Whether the address may still be used for new business. Changed by data stewards; selection lists offer only ACTIVE addresses. Valid and available for new documents. Temporarily not offered, for example while a move is being confirmed; it can be reactivated. No longer valid; kept only as history and in past documents.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        optional: true
        help: The party that uses or maintains this address. Set when a party's address is added; used to find a party's addresses and pick the effective one. At most one party; an address being prepared may have none yet. Supplies the party context for selecting an address.
      - name: person_id
        type: string
        fk: true
        optional: true
        help: The Person this Address belongs to.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The Organization this Address belongs to.
      - name: country_id
        type: string
        fk: true
        help: The country the address is in. Chosen first; it sets the address format and narrows the states and cities offered. Exactly one country is required. Settles the format, tax and trade rules that apply to the address. Every address names its country, which settles the format, tax and trade rules that apply to it.
      - name: state_province_id
        type: string
        fk: true
        narrowedBy: [country_id]
        optional: true
        help: The state, province or equivalent division the address is in. Chosen after the country, from that country's divisions. At most one; some countries have no divisions in the list. Must belong to the address's own country. Must be a division of the address's own country.
      - name: city_id
        type: string
        fk: true
        narrowedBy: [state_province_id, country_id]
        optional: true
        help: The city the address is in, chosen from the list. Chosen after the state or province; use the city name field only when the city is not listed. At most one. Must belong to the address's own country, and to its state or province where one is given. Must be a city of the address's own country, and of its state or province where one is stated.
  - name: ContactPoint
    help: A communication endpoint for a party, such as an email address, telephone number, web address or other channel. Reaching someone requires a specific address. A contact point holds each one with its own status, so messages go to working endpoints and old ones are not lost. Added when a party gives an email, phone or other channel; read by communications, notifications and service processes. Each contact point belongs to one Party, which may have several. Code and identity stay stable, and an endpoint that is retired remains in history. The billing team's email address invoices@acme.example, recorded for a customer.
    icon: database
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the contact point. Generated on creation; messages and preferences refer to it.
      - name: code
        type: string(100)
        help: A short reference for the contact point. Assigned or imported; stays stable so integrations can match it.
      - name: name
        type: string(300)
        help: A descriptive label for the endpoint, such as Head office switchboard. Shown wherever contact points are listed.
      - name: party_id
        type: string
        fk: true
        help: The party the endpoint belongs to. Set when the endpoint is added. Exactly one party; each endpoint has one owner. Lets communications find the right channel for a party.
  - name: Location
    help: "A physical or logical place where resources, activities, stock, services or organisational operations are situated. Almost everything in a business happens somewhere. The location is the shared reference for that: sites, warehouses, stores, offices, ports and even virtual places, arranged in a hierarchy so addresses, stock and assets can all point to the same place. Created when a place becomes relevant; arranged under parent locations; referenced by assets, stock, facilities and addresses; read by logistics, facilities and reporting. A location may sit within a parent Location with children beneath it, has an Address and may belong to an Organization. A location is planned, becomes active when in use, may be inactive for a time, and is closed or retired when no longer used. History and references remain valid. The Rotterdam distribution centre, a warehouse location within the Netherlands site, with its own address. Location create → validate hierarchy/address/organization → activate → use in operational transactions → status change/closure → validate dependent resources and prevent incompatible future use → preserve historical transaction context."
    icon: map-pin
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the location, which stays the same when its name or code changes. Generated on creation; assets, stock and documents refer to the location through it.
      - name: code
        type: string(100)
        unique: true
        help: The code of the place in the organisation's site list, such as NL-RTM-DC1. Unique; assigned by the administrator and used in integrations and labels.
      - name: name
        type: string(200)
        help: The name people use for the place. Shown in lists, maps and documents.
      - name: location_type
        type: string
        enum: LocationLocationType
        help: What kind of place it is. Chosen at creation; decides which processes can use the location. A geographic site that may contain several buildings. A building or area for storing goods. A retail outlet. A place where office work is done. A place where goods are made. An open area for storing or staging equipment or containers. A harbour or terminal. A base for vehicles and equipment. A logical place with no physical presence, such as an online store. Any other kind of place.
      - name: status
        type: string
        enum: LocationStatus
        help: Whether the place is in use. Set by the administrator; only ACTIVE locations are offered for new assignments. Expected but not yet in use. In use. Temporarily not used. Closed down. Removed from use altogether. A final state.
        default: PLANNED
      - name: address_id
        type: string
        fk: true
        optional: true
        help: The postal address of the location. Chosen from the address list; used for deliveries, mapping and tax.
      - name: parent_location_id
        type: string
        fk: true
        optional: true
        help: The place that contains this one, such as the site that holds a warehouse. Set to build the hierarchy; a top-level place has none.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation that operates the place. Set where operation is clear. At most one operating organisation. Determines responsibility and reporting.
  - name: Country
    help: A country or territory from the ISO 3166-1 registry, used consistently for addresses, tax, trade, localization, compliance and reporting. A country or territory from the ISO 3166-1 registry, used consistently for addresses, tax, trade, localization, compliance and reporting. Chosen from the list wherever a record needs a place, code or currency; maintained by an administrator when a registry changes.
