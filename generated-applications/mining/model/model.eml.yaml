rules:
  - name: partyRoleInvariantsBeforeCreate
    title: PartyRole invariants (beforeCreate)
    entity: PartyRole
    event: beforeCreate
    nodes:
      - id: S
        label: "Start: PartyRole beforeCreate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: PARTY-ROLE-EXE-001
        type: validation-error
        when: valid_from != null and valid_to != null and valid_to < valid_from
        props:
          message: Valid To cannot be earlier than valid from.
  - name: partyRoleInvariantsBeforeUpdate
    title: PartyRole invariants (beforeUpdate)
    entity: PartyRole
    event: beforeUpdate
    nodes:
      - id: S
        label: "Start: PartyRole beforeUpdate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: PARTY-ROLE-EXE-001
        type: validation-error
        when: valid_from != null and valid_to != null and valid_to < valid_from
        props:
          message: Valid To cannot be earlier than valid from.
  - name: addressInvariantsBeforeCreate
    title: Address invariants (beforeCreate)
    entity: Address
    event: beforeCreate
    nodes:
      - id: S
        label: "Start: Address beforeCreate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: ADDRESS-EXE-001
        type: validation-error
        when: city_id == null and city_name == null
        props:
          message: Choose the city, or give its name when it is not in the list.
  - name: addressInvariantsBeforeUpdate
    title: Address invariants (beforeUpdate)
    entity: Address
    event: beforeUpdate
    nodes:
      - id: S
        label: "Start: Address beforeUpdate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: ADDRESS-EXE-001
        type: validation-error
        when: city_id == null and city_name == null
        props:
          message: Choose the city, or give its name when it is not in the list.
  - name: exchangeRateInvariantsBeforeCreate
    title: ExchangeRate invariants (beforeCreate)
    entity: ExchangeRate
    event: beforeCreate
    nodes:
      - id: S
        label: "Start: ExchangeRate beforeCreate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: EXCHANGE-RATE-EXE-001
        type: validation-error
        when: rate != null and rate < 0
        props:
          message: Rate cannot be negative.
  - name: exchangeRateInvariantsBeforeUpdate
    title: ExchangeRate invariants (beforeUpdate)
    entity: ExchangeRate
    event: beforeUpdate
    nodes:
      - id: S
        label: "Start: ExchangeRate beforeUpdate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: EXCHANGE-RATE-EXE-001
        type: validation-error
        when: rate != null and rate < 0
        props:
          message: Rate cannot be negative.
  - name: taskInvariantsBeforeCreate
    title: Task invariants (beforeCreate)
    entity: Task
    event: beforeCreate
    nodes:
      - id: S
        label: "Start: Task beforeCreate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: TASK-EXE-001
        type: validation-error
        when: status == "COMPLETED" and completed_at == null
        props:
          message: Record completed at when the task is completed.
  - name: taskInvariantsBeforeUpdate
    title: Task invariants (beforeUpdate)
    entity: Task
    event: beforeUpdate
    nodes:
      - id: S
        label: "Start: Task beforeUpdate"
        type: start
      - id: E
        label: "End: invariants hold"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: TASK-EXE-001
        type: validation-error
        when: status == "COMPLETED" and completed_at == null
        props:
          message: Record completed at when the task is completed.
  - name: partyWorkflowsAfterUpdate
    title: Party workflows (afterUpdate)
    entity: Party
    event: afterUpdate
    nodes:
      - id: S
        label: "Start: Party afterUpdate"
        type: start
      - id: E
        label: "End: workflows started"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: ExceptionRaised
        type: trigger-workflow
        when: status == "BLOCKED" and status != _previous_status
        props:
          workflow: PartyExceptionRaised
  - name: exchangeRateWorkflowsAfterUpdate
    title: ExchangeRate workflows (afterUpdate)
    entity: ExchangeRate
    event: afterUpdate
    nodes:
      - id: S
        label: "Start: ExchangeRate afterUpdate"
        type: start
      - id: E
        label: "End: workflows started"
        type: end
    edges:
      - from: S
        to: E
    actions:
      - name: FollowUpRequired
        type: trigger-workflow
        when: status == "CANCELLED" and status != _previous_status
        props:
          workflow: ExchangeRateFollowUpRequired
stateMachines:
  - name: PartyLifecycle
    title: Party Lifecycle
    entity: Party
    states: [ACTIVE, INACTIVE, BLOCKED, RETIRED]
    initial: ACTIVE
    final: [RETIRED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: ACTIVE
        to: BLOCKED
        trigger: block
      - from: BLOCKED
        to: ACTIVE
        trigger: unblock
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
      - from: BLOCKED
        to: RETIRED
        trigger: retire
  - name: OrganizationLifecycle
    title: Organization Lifecycle
    entity: Organization
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    final: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: activate
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: DRAFT
        to: RETIRED
        trigger: retire
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
  - name: PartyRoleLifecycle
    title: Party Role Lifecycle
    entity: PartyRole
    states: [ACTIVE, INACTIVE, EXPIRED]
    initial: ACTIVE
    final: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: ACTIVE
        to: EXPIRED
        trigger: expire
      - from: INACTIVE
        to: EXPIRED
        trigger: expire
  - name: AddressLifecycle
    title: Address Lifecycle
    entity: Address
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    final: [RETIRED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
  - name: LocationLifecycle
    title: Location Lifecycle
    entity: Location
    states: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    final: [CLOSED, RETIRED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: activate
      - from: ACTIVE
        to: CLOSED
        trigger: close
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: PLANNED
        to: RETIRED
        trigger: retire
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
  - name: CurrencyLifecycle
    title: Currency Lifecycle
    entity: Currency
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    final: [RETIRED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
  - name: ExchangeRateLifecycle
    title: Exchange Rate Lifecycle
    entity: ExchangeRate
    states: [DRAFT, ACTIVE, EXPIRED, CANCELLED]
    initial: DRAFT
    final: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: activate
      - from: ACTIVE
        to: EXPIRED
        trigger: expire
      - from: DRAFT
        to: CANCELLED
        trigger: cancel
      - from: ACTIVE
        to: CANCELLED
        trigger: cancel
  - name: UnitOfMeasureLifecycle
    title: Unit Of Measure Lifecycle
    entity: UnitOfMeasure
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    final: [RETIRED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: deactivate
      - from: INACTIVE
        to: ACTIVE
        trigger: reactivate
      - from: ACTIVE
        to: RETIRED
        trigger: retire
      - from: INACTIVE
        to: RETIRED
        trigger: retire
  - name: TaskLifecycle
    title: Task Lifecycle
    entity: Task
    states: [CREATED, READY, ASSIGNED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED, FAILED]
    initial: CREATED
    final: [COMPLETED, CANCELLED, FAILED]
    transitions:
      - from: CREATED
        to: READY
        trigger: mark_ready
      - from: READY
        to: ASSIGNED
        trigger: assign
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: start
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: complete
      - from: READY
        to: BLOCKED
        trigger: block
      - from: BLOCKED
        to: READY
        trigger: unblock
      - from: ASSIGNED
        to: BLOCKED
        trigger: block
      - from: BLOCKED
        to: ASSIGNED
        trigger: unblock
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: block
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: unblock
      - from: CREATED
        to: CANCELLED
        trigger: cancel
      - from: READY
        to: CANCELLED
        trigger: cancel
      - from: ASSIGNED
        to: CANCELLED
        trigger: cancel
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: cancel
      - from: BLOCKED
        to: CANCELLED
        trigger: cancel
      - from: READY
        to: FAILED
        trigger: fail
      - from: ASSIGNED
        to: FAILED
        trigger: fail
      - from: IN_PROGRESS
        to: FAILED
        trigger: fail
      - from: BLOCKED
        to: FAILED
        trigger: fail
  - name: MiningSiteLifecycle
    title: Mining Site Lifecycle
    entity: MiningSite
    states: [EXPLORATION, DEVELOPMENT, ACTIVE, SUSPENDED, CLOSED]
    initial: EXPLORATION
    final: [CLOSED]
    transitions:
      - from: EXPLORATION
        to: DEVELOPMENT
        trigger: develop
      - from: DEVELOPMENT
        to: ACTIVE
        trigger: start_production
      - from: ACTIVE
        to: SUSPENDED
        trigger: suspend
      - from: SUSPENDED
        to: ACTIVE
        trigger: resume
      - from: ACTIVE
        to: CLOSED
        trigger: close
      - from: SUSPENDED
        to: CLOSED
        trigger: close
      - from: EXPLORATION
        to: CLOSED
        trigger: abandon
      - from: DEVELOPMENT
        to: CLOSED
        trigger: abandon
sagas:
  - name: PartyExceptionRaised
    title: Raise a task when a party is stopped
    entity: Party
    operation: UPDATE
    trigger: rule
    description: When a party is blocked, a high-priority task asks someone to resolve it.
    steps:
      - id: S1
        type: CreateEntity
        label: "Raise a task: resolve"
        properties:
          entity: bus_task
          as: taskId
          fields: '{"code":"PARTY-EXCEPTION-{{id}}","name":"Resolve party {{display_name}}","description":"Party {{display_name}} is now {{status}}. Find out why it stopped and move it on or close it.","task_type":"USER","status":"CREATED","priority":"HIGH"}'
  - name: ExchangeRateFollowUpRequired
    title: Follow up when a exchange rate is ended
    entity: ExchangeRate
    operation: UPDATE
    trigger: rule
    description: When a exchange rate is cancelled, a task asks someone to settle what depended on it.
    steps:
      - id: S1
        type: CreateEntity
        label: "Raise a task: follow up on"
        properties:
          entity: bus_task
          as: taskId
          fields: '{"code":"EXCHANGE-RATE-FOLLOW-UP-{{id}}","name":"Follow up on exchange rate {{id}}","description":"Exchange rate {{id}} is now {{status}}. Check the records that depended on it and tell the people affected.","task_type":"USER","status":"CREATED","priority":"NORMAL"}'
