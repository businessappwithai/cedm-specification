    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the state or province, constant for its life. Generated on load; addresses refer to it. Referenced by addresses and cities.
      - name: code
        type: string(10)
        unique: true
        help: The ISO 3166-2 code, the country code and the division's own, such as US-CA. Search, integration and reporting. Unique; begins with the code of the country it belongs to.
      - name: name
        type: string(200)
        help: The division's name in English. Shown in lists and on addresses. Does not replace the code as the stable key.
      - name: subdivision_type
        type: string(100)
        optional: true
        help: "What the registry calls the division in its country: State, Province, Region, Territory and so on. Labelling the field for users of that country. Describes this division only."
      - name: country_id
        type: string
        fk: true
        help: The country the division belongs to. Chosen first; the divisions offered are those of that country. Every state or province belongs to exactly one country. A city and an address are narrowed by the country before the state.
  - name: City
    help: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province. A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province. Chosen from the list wherever a record needs a place, code or currency; maintained by an administrator when a registry changes."
