entity:
  name: MeterReading
  namespace: cedm.domain
  kind: utility_transaction
  description: A measured reading recorded from a utility meter at a point in time.
  ui:
    icon: gauge
  identity:
    key: meterReadingId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: meterReadingId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the reading.
        usage: Generated on creation; billing lines refer to it.
    - name: readingAt
      type: datetime
      required: true
      help:
        summary: When the reading was taken.
        usage: Entered or imported with the value; consumption is the difference between successive readings.
    - name: readingValue
      type: decimal
      required: true
      precision: 24
      scale: 8
      help:
        summary: The value shown on the meter.
        usage: Entered or imported; not negative unless the meter is configured for signed values.
    - name: readingType
      type: enum
      required: true
      values:
        - ACTUAL
        - ESTIMATED
        - CORRECTED
      help:
        summary: How the reading was obtained.
        usage: Set at entry; billing prefers actual readings.
        valueSemantics:
          ACTUAL: Taken from the meter.
          ESTIMATED: Calculated because no actual reading was available.
          CORRECTED: Replaces an earlier reading found to be wrong.
    - name: quality
      type: enum
      required: false
      values:
        - GOOD
        - SUSPECT
        - INVALID
      help:
        summary: How far the reading can be trusted.
        usage: Set by validation checks or the reader.
        valueSemantics:
          GOOD: Passed checks.
          SUSPECT: Looks unusual and needs review.
          INVALID: Failed checks and must not be used.
  relationships:
    - name: meter
      target: EnergyMeter
      cardinality: '1'
      ownership: reference
      help:
        summary: The meter the reading was taken from.
        usage: Set at entry.
        cardinalityMeaning: 'Exactly one meter: a reading is a measurement from a particular device.'
        workflowRole: Builds the meter's history.
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: '1'
      ownership: reference
      help:
        summary: The unit of the value.
        usage: Taken from the meter; entered if the reading arrives with its own unit.
        cardinalityMeaning: Exactly one unit.
        workflowRole: Lets values be converted and compared.
  invariants:
    - id: METER-READING-001
      rule: readingValue must not be negative unless the meter configuration permits signed values.
  help:
    summary: A measured value recorded from a utility meter at a point in time.
    businessMeaning: Bills and consumption figures are computed from readings. Each reading records the value, when it was taken, how it was obtained and whether it can be trusted.
    usage: Entered by meter readers, imported from smart meters, or estimated; read by billing and analysis.
    relationshipContext: A reading belongs to one EnergyMeter and uses a UnitOfMeasure.
    example: The electricity meter at a customer's premises reads 48,213.4 kWh on 1 April at 08:00.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-METER-READING
