entity:
  name: EnergyMeter
  namespace: cedm.domain
  kind: utility_entity
  description: A metering device or logical metering point used to record consumption or production of a utility resource.
  ui:
    icon: zap
  identity:
    key: energyMeterId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: energyMeterId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the meter record.
        usage: Generated on registration; readings and bills refer to it.
    - name: meterNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The serial number or metering point number of the meter.
        usage: Unique; printed on the device and on bills; used to match readings that arrive from the field.
    - name: meterType
      type: enum
      required: true
      values:
        - ELECTRICITY
        - GAS
        - WATER
        - STEAM
        - SOLAR
        - OTHER
      help:
        summary: The utility resource the meter measures, such as electricity, gas or water.
        usage: Chosen at registration; it fixes the unit of measure and which tariffs can be applied to the readings.
        valueSemantics:
          ELECTRICITY: Electrical energy consumed or produced at the metering point.
          GAS: Natural gas consumed, usually read in volume or energy content.
          WATER: Water consumed, usually read in cubic metres.
          STEAM: Steam or district heat consumed.
          SOLAR: Electricity generated by solar installations and exported or used on site.
          OTHER: Any other metered resource not covered by the listed types.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - DISCONNECTED
        - RETIRED
      help:
        summary: Whether the meter is in service and being read.
        usage: Set by field services and billing.
        valueSemantics:
          PLANNED: Ordered or scheduled for installation; not yet recording.
          ACTIVE: Installed and being read for billing.
          DISCONNECTED: Supply disconnected; no readings are billed.
          RETIRED: Removed permanently; history is kept.
    - name: installedAt
      type: date
      required: false
      help:
        summary: The date the meter was installed.
        usage: Entered by the installer; consumption is billed from this date.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The place where the meter is installed.
        usage: Set at installation.
        cardinalityMeaning: 'Exactly one location: a meter measures at one physical point.'
        workflowRole: Ties readings and billing to the premises supplied.
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: The customer who is billed for what the meter records.
        usage: Set when supply starts; changed on move-in or move-out.
        cardinalityMeaning: At most one customer; a meter at vacant premises has none.
        workflowRole: Directs the meter's consumption to the right bills.
    - name: readings
      target: MeterReading
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The readings taken from the meter.
        usage: Read to calculate consumption between two dates.
        cardinalityMeaning: Any number, accumulating at each reading.
        workflowRole: Consumption is the difference between successive readings.
  lifecycle:
    title: Energy Meter Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, DISCONNECTED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: DISCONNECTED, action: mark_disconnected}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: DISCONNECTED, to: RETIRED, action: retire}
  help:
    summary: A metering device or logical metering point that records consumption or production of a utility resource.
    businessMeaning: Billing and balancing depend on measured quantities. The meter is where those measurements originate, so it must be identified, located and tied to the customer it serves.
    usage: Registered at installation; read periodically for billing; updated when disconnected or retired.
    relationshipContext: A meter is installed at a Location, may serve a Customer and accumulates MeterReadings over time.
    lifecycle: A meter is planned, becomes active when installed and read, may be disconnected from supply, and is retired when removed.
    example: Electricity meter M-884201 at a customer's premises, read monthly and billed on the residential tariff.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-METER
