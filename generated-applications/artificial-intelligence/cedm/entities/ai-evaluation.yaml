entity:
  name: AIEvaluation
  namespace: cedm.domain
  kind: ai_governance_entity
  description: An evaluation record assessing an AIModel against defined quality, safety, performance, or business criteria.
  ui:
    icon: table
  identity:
    key: aIEvaluationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aIEvaluationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the AIEvaluation record.
      businessMeaning: Identifies one governed AIEvaluation independently of related records and later lifecycle changes.
      usage: Referencing, workflow execution, reporting, audit, and integration.
      relationshipContext: Connects this record to its governing AIModel context and downstream evidence.
      requiredMeaning: Required for stable traceability.
  - name: aIEvaluationCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: Human-readable business reference for the AIEvaluation.
      businessMeaning: Provides an operational identifier for searching, documents, reports, and integrations.
      usage: Creation, review, search, workflow, reporting, and audit.
      relationshipContext: Distinct from the immutable UUID identity and scoped to the governed business context.
      requiredMeaning: Required for operational identification.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help:
      summary: Lifecycle state of the AIEvaluation.
      businessMeaning: Controls whether the record is being prepared, operationally active, historically complete, or cancelled.
      usage: Workflow gating, governance, reporting, and audit.
      relationshipContext: Status changes can affect related AIModel workflows but never erase historical evidence.
      valueSemantics:
        DRAFT: Record is being prepared and is not yet normally effective.
        ACTIVE: Record is effective for its governed business purpose.
        COMPLETED: Governed work or assessment is complete and retained as historical evidence.
        CANCELLED: Record was cancelled through controlled workflow and remains auditable.
      requiredMeaning: Required for lifecycle governance.
  relationships:
  - name: context
    target: AIModel
    cardinality: '1'
    ownership: reference
    help:
      summary: Governing AIModel associated with this AIEvaluation.
      businessMeaning: Supplies the business context needed to interpret and validate the record.
      usage: Workflow navigation, validation, traceability, reporting, and audit.
      cardinalityMeaning: Every AIEvaluation belongs to exactly one governing AIModel in this baseline model.
      context: Changes to the governing record require revalidation of open dependent records while completed evidence remains historical.
  invariants:
  - id: AIEVALUATION-001
    rule: The governing AIModel relationship is required and must reference a valid record.
  - id: AIEVALUATION-002
    rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
  - id: AIEVALUATION-003
    rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: AI Evaluation Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a ai evaluation is ended"
      description: "When a ai evaluation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "AI-EVALUATION-FOLLOW-UP-{{id}}"
              name: "Follow up on ai evaluation {{id}}"
              description: "Ai evaluation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents AIEvaluation as a first-class governed CEDM business concept.
    businessMeaning: An evaluation record assessing an AIModel against defined quality, safety, performance, or business criteria.
    usage: Domain workflows, validation, reporting, audit, integration, and cross-entity traceability.
    relationshipContext: AIModel supplies the primary governing context; dependent workflows consume this record without silently mutating historical evidence.
    lifecycle: Draft → active → completed, with controlled cancellation and correction paths.
    changePropagation: Material changes revalidate open dependent workflows and preserve completed historical evidence.
    example: A AIEvaluation is created for a valid AIModel, progresses through its governed lifecycle, and remains traceable after completion.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AIEVALUATION
