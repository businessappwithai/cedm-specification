entity:
  name: Renewal
  namespace: cedm.domain
  kind: subscription_lifecycle
  description: A governed subscription or service continuation event extending commercial entitlement into a subsequent term.
  ui:
    icon: table
  identity: {key: renewalId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: renewalId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the renewal, constant for its life.', usage: Generated on creation; billing and entitlement records refer to it.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: The stage the renewal has reached on the way to a new term.
        usage: Starts as DRAFT and is moved by account management as the customer is approached and a decision is reached; filters renewal pipeline reports.
        valueSemantics:
          DRAFT: Being prepared by account management; nothing has been offered or committed to the customer.
          ACTIVE: Offered to or confirmed with the customer and now being carried out.
          COMPLETED: The new term is in place and the entitlement continues. A final state.
          CANCELLED: The customer chose not to continue, so no new term starts. A final state.
    - name: renewalNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The reference by which sales and customers identify this particular renewal.
        usage: Assigned when the renewal is created and quoted on renewal offers and reminders to the customer.
        relationshipContext: Unique across all renewals.
    - name: currentTermEnd
      type: date
      required: true
      help:
        summary: The last day of the subscription's current term.
        usage: Copied from the subscription; the renewal must be decided before it.
        relationshipContext: The new term starts the day after.
    - name: newTermStart
      type: date
      required: false
      help:
        summary: The first day of the period the customer will be entitled to once the renewal takes effect.
        usage: Entered when the renewal is confirmed and passed on to billing and entitlement.
        relationshipContext: Usually the day after the current term ends.
    - name: newTermEnd
      type: date
      required: false
      help:
        summary: The last day of the period covered by the renewal.
        usage: Entered when the renewal is confirmed; the next renewal decision falls due before this date.
        relationshipContext: Not earlier than the new term start.
    - name: currentValue
      type: Money
      required: false
      help:
        summary: The recurring value of the subscription in its current term.
        usage: Copied from the subscription; the basis for retention figures.
        relationshipContext: Annualised for comparison.
    - name: renewalValue
      type: Money
      required: false
      help:
        summary: The recurring value offered or agreed for the new term.
        usage: Entered with the quote; compared with the current value for expansion or contraction.
        relationshipContext: In the subscription's currency.
    - name: isAutomatic
      type: boolean
      required: true
      default: false
      help:
        summary: Tells whether the renewal happens by itself or needs the customer's explicit agreement.
        usage: Copied from the subscription terms when the renewal is created, so staff know whether to chase a confirmation.
        relationshipContext: Automatic renewals still appear here so they can be reviewed.
    - name: churnReason
      type: string
      required: false
      maxLength: 300
      help:
        summary: Why the customer did not renew.
        usage: Recorded when the renewal is lost; churn analysis groups by it.
        relationshipContext: Present only on churned renewals.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer whose subscription is being renewed., usage: Chosen when the renewal is created., cardinalityMeaning: At most one customer; empty until identified., workflowRole: Decides whom to invoice and contact.}}
    - name: subscription
      target: Subscription
      cardinality: 0..1
      ownership: reference
      help:
        summary: The subscription being renewed.
        usage: Set when the renewal is created.
        cardinalityMeaning: One per renewal.
        context: The subscription's term follows the confirmed renewal.
    - name: newPlan
      target: SubscriptionPlan
      cardinality: 0..1
      ownership: reference
      help:
        summary: The plan for the new term, when it changes.
        usage: Set when the customer upgrades or downgrades on renewal.
        cardinalityMeaning: At most one.
        context: Empty when the plan stays the same.
  invariants:
    - {id: RENEWAL-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
    - {id: RENEWAL-EXE-001, rule: "New Term End must not be earlier than new term start.", violatedWhen: "new_term_start != null and new_term_end != null and new_term_end < new_term_start", message: "New Term End cannot be earlier than new term start."}
  lifecycle:
    title: Renewal Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a renewal is ended"
      description: "When a renewal is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RENEWAL-FOLLOW-UP-{{id}}"
              name: "Follow up on renewal {{id}}"
              description: "Renewal {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A subscription or service continuation that extends a customer's entitlement into the next term.
    businessMeaning: A renewal is the decision point at the end of a term. Recording it lets the business offer, confirm and track continuation, and decide whether the customer keeps the service, without altering the billing or entitlement records that carry out the result.
    usage: Created by account management ahead of the term end; read by sales, finance and support.
    relationshipContext: A renewal concerns one customer and the subscription or service being continued.
    lifecycle: A renewal is drafted, becomes active while it is being worked, and completes when the new term is in place. It is cancelled if the customer does not continue.
    example: In October the "Platform Premium" renewal for a customer is drafted, confirmed in November and completed when the new term starts.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-RENEWAL}
