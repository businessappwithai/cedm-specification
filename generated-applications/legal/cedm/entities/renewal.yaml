entity:
  name: Renewal
  namespace: cedm.domain
  kind: subscription_lifecycle
  description: A governed subscription or service continuation event extending commercial entitlement into a subsequent term.
  ui:
    icon: table
  identity: {key: renewalId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: renewalId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the renewal, constant for its life.', usage: Generated on creation; billing and entitlement records refer to it.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: The stage the renewal has reached on the way to a new term.
        usage: Starts as DRAFT and is moved by account management as the customer is approached and a decision is reached; filters renewal pipeline reports.
        valueSemantics:
          DRAFT: Being prepared by account management; nothing has been offered or committed to the customer.
          ACTIVE: Offered to or confirmed with the customer and now being carried out.
          COMPLETED: The new term is in place and the entitlement continues. A final state.
          CANCELLED: The customer chose not to continue, so no new term starts. A final state.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer whose subscription is being renewed., usage: Chosen when the renewal is created., cardinalityMeaning: At most one customer; empty until identified., workflowRole: Decides whom to invoice and contact.}}
  invariants:
    - {id: RENEWAL-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Renewal Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a renewal is ended"
      description: "When a renewal is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RENEWAL-FOLLOW-UP-{{id}}"
              name: "Follow up on renewal {{id}}"
              description: "Renewal {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A subscription or service continuation that extends a customer's entitlement into the next term.
    businessMeaning: A renewal is the decision point at the end of a term. Recording it lets the business offer, confirm and track continuation, and decide whether the customer keeps the service, without altering the billing or entitlement records that carry out the result.
    usage: Created by account management ahead of the term end; read by sales, finance and support.
    relationshipContext: A renewal concerns one customer and the subscription or service being continued.
    lifecycle: A renewal is drafted, becomes active while it is being worked, and completes when the new term is in place. It is cancelled if the customer does not continue.
    example: In October the "Platform Premium" renewal for a customer is drafted, confirmed in November and completed when the new term starts.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-RENEWAL}
