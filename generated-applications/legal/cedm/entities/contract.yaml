entity:
  name: Contract
  namespace: cedm.domain
  kind: legal_commercial_entity
  description: A legally or commercially binding agreement between parties defining rights, obligations, terms, and conditions.
  ui:
    icon: file-check
  identity:
    key: contractId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: contractId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the contract.
        usage: Generated on creation; obligations, amendments and invoices refer to the contract.
    - name: contractNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number by which the contract is known in correspondence and systems.
        usage: Allocated from a number series; unique across contracts.
    - name: title
      type: string
      required: true
      maxLength: 300
      help:
        summary: The descriptive title of the contract.
        usage: Shown in lists and documents, for example Master Supply Agreement 2026.
    - name: contractType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of contract, such as supply, service, licence or employment.
        usage: Chosen at creation; drives templates, approvals and the obligations typically attached.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - NEGOTIATION
        - APPROVAL
        - ACTIVE
        - SUSPENDED
        - EXPIRED
        - TERMINATED
        - CANCELLED
      help:
        summary: Where the contract stands from drafting to end.
        usage: Moved by the contract owner; obligations are enforced while the contract is ACTIVE.
        valueSemantics:
          DRAFT: Being written; not yet shared with the other party.
          NEGOTIATION: Terms are being discussed with the other party.
          APPROVAL: Agreed in principle and awaiting internal approval and signature.
          ACTIVE: Signed and in force.
          SUSPENDED: Temporarily not in effect, for example during a dispute.
          EXPIRED: Reached its end date without renewal.
          TERMINATED: Ended early by notice or breach.
          CANCELLED: Withdrawn before it ever became active.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The date from which the contract is in force.
        usage: Entered from the signed document; obligations and charges run from it.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The date on which the contract ends.
        usage: Entered from the signed document; must not be before the start date.
    - name: signedAt
      type: datetime
      required: false
      help:
        summary: When the contract was signed by the last party.
        usage: Recorded at signature; marks the point at which the contract became binding.
    - name: autoRenew
      type: boolean
      required: true
      default: false
      help:
        summary: Whether the contract renews by itself at the end of its term.
        usage: Set from the contract terms; renewal processes act on contracts with this on, unless notice is given.
  relationships:
    - name: parties
      target: Party
      cardinality: 2..*
      ownership: reference
      help:
        summary: The parties that are bound by the contract.
        usage: Added when the contract is drafted; read to see who owes what.
        cardinalityMeaning: At least two parties; one party alone cannot make an agreement.
        workflowRole: Each party is bound by the contract's obligations.
    - name: ownerOrganization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The part of the organisation that owns the relationship.
        usage: Set at creation; receives renewal reminders and answers for performance.
        cardinalityMeaning: At most one owner.
        workflowRole: Gives the contract an internal owner.
    - name: document
      target: Document
      cardinality: 0..1
      ownership: reference
      help:
        summary: The signed document that evidences the contract.
        usage: Attached after signature; read in case of dispute.
        cardinalityMeaning: At most one primary document.
        workflowRole: Provides the authoritative text.
    - name: obligations
      target: ContractObligation
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The obligations the contract imposes.
        usage: Read to track who must do what and by when.
        cardinalityMeaning: Any number.
        workflowRole: Obligations are monitored while the contract is active.
    - {name: serviceContracts, target: ServiceContract, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: 'Any number, each one covering a service the contract provides.', summary: Operational service-coverage specializations of this Contract., businessMeaning: Keeps legal/commercial agreement semantics in Contract while allowing service-specific administration., usage: "Service entitlement, SLA, renewals and audit.", workflowRole: ServiceContract terms must remain compatible with Contract lifecycle and amendments.}}

  invariants:
    - id: CONTRACT-001
      rule: effectiveTo must not precede effectiveFrom.
    - id: CONTRACT-002
      rule: an ACTIVE contract must have at least two parties.
    - {id: CONTRACT-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Contract Lifecycle
    attribute: status
    states: [DRAFT, NEGOTIATION, APPROVAL, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]
    initial: DRAFT
    terminal:
      - EXPIRED
      - TERMINATED
      - CANCELLED
    transitions:
      - {from: DRAFT, to: NEGOTIATION, action: negotiate}
      - {from: DRAFT, to: APPROVAL, action: submit_for_approval}
      - {from: NEGOTIATION, to: APPROVAL, action: submit_for_approval}
      - {from: APPROVAL, to: NEGOTIATION, action: return_to_negotiation}
      - {from: APPROVAL, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: NEGOTIATION, to: CANCELLED, action: cancel}
      - {from: APPROVAL, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a contract is ended"
      description: "When a contract is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CONTRACT-FOLLOW-UP-{{id}}"
              name: "Follow up on contract {{title}}"
              description: "Contract {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A binding agreement between parties that fixes their rights, obligations, terms and conditions.
    businessMeaning: A contract is the formal basis of a commercial relationship. It says who has agreed to what, for how long and on what terms, so obligations can be performed, tracked and enforced.
    usage: Drafted and negotiated by commercial and legal teams; approved and signed; consulted throughout its life to check obligations, renewal and termination.
    relationshipContext: A contract has at least two Parties, may be owned by an Organization, is evidenced by a Document and breaks down into ContractObligations and ServiceContracts.
    lifecycle: A contract is drafted, negotiated, approved and becomes active when signed. It can be suspended and resumed, and ends by expiring or being terminated; one that never became active is cancelled.
    example: A three-year supply contract between a manufacturer and a distributor, signed on 1 March and renewing automatically each year.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTRACT
