entity:
  name: ContractRenewal
  namespace: cedm.domain
  kind: contract_lifecycle
  description: A governed event extending or replacing a Contract for a new term under approved renewal conditions.
  ui:
    icon: file-check
  identity: {key: contractRenewalId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: contractRenewalId, type: uuid, required: true, immutable: true, help: {summary: The identity of the renewal., usage: Generated on creation; invoices and term calculations refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: The date and time from which the new term starts., usage: 'Set from the renewal terms, normally the day after the previous term ended.'}}
  relationships:
    - {name: contract, target: Contract, cardinality: '1', ownership: reference, help: {cardinalityMeaning: 'Exactly one contract: a renewal extends a single agreement, and one contract may be renewed many times.', summary: The contract that is renewed., usage: Set when the renewal is created., workflowRole: Extends the contract's period of effect.}}
  invariants:
    - {id: CONTRACT-RENEWAL-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An event that extends a contract, or replaces it, for a new term under agreed renewal conditions.
    businessMeaning: Many contracts run in terms. A renewal record shows that the relationship continued, on what terms and from when, so there is no doubt whether a contract was in force on a given day.
    usage: Created when a contract is renewed, automatically or by agreement; read when checking coverage or planning the next renewal.
    relationshipContext: Each renewal belongs to one Contract; a chain of renewals gives its full term history.
    lifecycle: Executed renewals are evidence. A correction is recorded as a further record.
    example: Automatic one-year renewal of a software licence from 1 January, at the price in the renewal terms.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CONTRACT-RENEWAL}
