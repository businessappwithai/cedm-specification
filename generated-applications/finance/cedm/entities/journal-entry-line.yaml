entity:
  name: JournalEntryLine
  namespace: cedm.domain
  kind: financial_transaction_line
  description: A debit or credit line within a journal entry.
  ui:
    icon: book-open
  identity:
    key: journalEntryLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: journalEntryLineId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the ledger line.
        usage: Generated on creation; drill-downs and reconciliations refer to it.
    - name: lineNumber
      type: integer
      required: true
      minimum: 1
      help:
        summary: The position of the line within the entry.
        usage: Set when the entry is created; keeps the order of lines stable.
    - name: debitAmount
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 4
      help:
        summary: The amount debited to the account.
        usage: Entered or derived from the source; not negative, and zero if the line is a credit.
    - name: creditAmount
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 4
      help:
        summary: The amount credited to the account.
        usage: Entered or derived from the source; not negative, and zero if the line is a debit.
    - name: description
      type: string
      required: false
      maxLength: 500
      help:
        summary: A note about this line.
        usage: Shown in ledger drill-downs.
  relationships:
    - name: journalEntry
      target: JournalEntry
      cardinality: '1'
      ownership: reference
      help:
        summary: The entry the line belongs to.
        usage: Set when the line is created.
        cardinalityMeaning: 'Exactly one entry: a line has no meaning outside the entry it balances.'
        workflowRole: The entry's lines must balance before it can be posted.
    - name: account
      target: Account
      cardinality: '1'
      ownership: reference
      help:
        summary: The ledger account the line posts to.
        usage: Chosen when the entry is made.
        cardinalityMeaning: 'Exactly one account: each line affects a single account.'
        workflowRole: Determines which balance and statement line the amount affects.
  invariants:
    - id: JOURNAL-LINE-001
      rule: exactly one of debitAmount and creditAmount must be greater than zero unless zero-value lines are explicitly permitted.
    - id: JOURNAL-LINE-002
      rule: debitAmount and creditAmount must not be negative.
  help:
    summary: One debit or credit line within a journal entry.
    businessMeaning: 'Double-entry accounting records every event as at least two lines which balance. The line is the unit of the ledger: an account, an amount and a direction.'
    usage: Created with its entry; summed per account to give balances; read by financial reports and audits.
    relationshipContext: Each line belongs to one JournalEntry and posts to one Account.
    lifecycle: 'Lines are part of their entry: they are edited while it is a draft and fixed once it is posted.'
    example: Debit 1,200.00 to Accounts Receivable as part of the entry for invoice INV-2026-0441.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-JOURNAL-ENTRY-LINE
