entity:
  name: TaxTransaction
  namespace: cedm.domain
  kind: tax_transaction
  description: A governed tax consequence derived from a taxable business transaction and retained separately from payment and general-ledger posting.
  ui:
    icon: percent
  identity: {key: taxTransactionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: taxTransactionId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the tax transaction, constant for its life.', businessMeaning: Lets returns and the source document point at the same tax record., usage: Generated on creation., relationshipContext: Referenced by returns.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the tax transaction is in reporting.
        businessMeaning: Shows whether the tax has been reported.
        usage: Starts as DRAFT; moved by tax staff and returns.
        relationshipContext: Only active transactions are included in a return.
        valueSemantics:
          DRAFT: Calculated and not yet confirmed.
          ACTIVE: Confirmed and due to be reported.
          COMPLETED: Reported or settled. A final state.
          CANCELLED: Withdrawn, for example after a credit. A final state.
  relationships:
    - {name: organization, target: Organization, cardinality: 0..1, ownership: reference, help: {summary: The organisation the tax is reported by., usage: Chosen from the source document., cardinalityMeaning: At most one organisation., workflowRole: Decides which company's return includes it.}}
  invariants:
    - {id: TAX-TRANSACTION-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Tax Transaction Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a tax transaction is ended"
      description: "When a tax transaction is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TAX-TRANSACTION-FOLLOW-UP-{{id}}"
              name: "Follow up on tax transaction {{id}}"
              description: "Tax transaction {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a tax transaction is done"
      description: "When a tax transaction is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TAX-TRANSACTION-COMPLETED-{{id}}"
              name: "Confirm tax transaction {{id}}"
              description: "Tax transaction {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: The tax consequence of a taxable business transaction, kept apart from payment and ledger posting.
    businessMeaning: A tax transaction records how much tax arose on a sale or purchase and under what treatment. Keeping it on its own lets tax be reported and checked without changing the payment or accounting records.
    usage: Created automatically from taxable documents; read by tax returns and audit.
    relationshipContext: A tax transaction may belong to an organisation and follows a taxable document.
    lifecycle: A tax transaction is drafted, becomes active when reportable and completed once reported. It may be cancelled before. Completed and cancelled are final.
    example: The 20 tax charged on invoice INV-3041 is recorded as a tax transaction for the March VAT return.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TAX-TRANSACTION}
