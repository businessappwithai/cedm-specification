entity:
  name: Subscription
  namespace: cedm.domain
  kind: subscription_contract
  description: A governed customer subscription to a plan, product, service, or entitlement over a defined lifecycle.
  ui:
    icon: repeat
  identity: {key: subscriptionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: subscriptionId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the subscription, constant for its life.', usage: Generated on creation; billing and entitlements refer to it., relationshipContext: Referenced by invoices and usage records.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: "Where the customer's subscription is in its life: being set up, running, finished or cancelled."
        usage: Starts as DRAFT; account management activates it at sign-up, and billing and entitlements apply only while it is active.
        valueSemantics:
          DRAFT: The subscription is being set up and does not yet bill or grant access.
          ACTIVE: The subscription is running; charges are billed and entitlements are granted.
          COMPLETED: The subscription reached its end date or fulfilled its term. A final state.
          CANCELLED: The subscription was ended early by the customer or the business. A final state.
    - name: subscriptionNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The reference of the subscription.
        usage: Assigned at sign-up; shown on invoices and in the customer portal.
        relationshipContext: Unique.
    - name: quantity
      type: decimal
      required: true
      precision: 18
      scale: 4
      default: 1
      help:
        summary: How many units — users, seats, devices — are subscribed.
        usage: Multiplies the plan's per-unit fee.
        relationshipContext: Changes take effect from the next period unless prorated.
    - name: startDate
      type: date
      required: true
      help:
        summary: The day on which the customer's subscription began.
        usage: Recorded at sign-up and used for reporting on customer tenure.
        relationshipContext: Not later than the end date.
    - name: trialEndDate
      type: date
      required: false
      help:
        summary: The last day the customer can use the service free of charge.
        usage: Set at sign-up from the plan's trial length; billing starts the day after.
        relationshipContext: Empty when there was no trial.
    - name: currentTermStart
      type: date
      required: false
      help:
        summary: The first day of the billing term the subscription is now in.
        usage: Moved on automatically at each renewal.
        relationshipContext: Not later than the current term end.
    - name: currentTermEnd
      type: date
      required: false
      help:
        summary: The last day of the billing term the subscription is now in.
        usage: Renewal is decided before this date, and billing for the next term follows it.
        relationshipContext: Empty for subscriptions without fixed terms.
    - name: autoRenew
      type: boolean
      required: true
      default: true
      help:
        summary: Whether the subscription renews automatically at term end.
        usage: Set by the customer or by contract.
        relationshipContext: When off, the subscription expires at term end unless renewed.
    - name: cancelledDate
      type: date
      required: false
      help:
        summary: The day the customer cancelled.
        usage: Recorded on cancellation; service may continue to term end.
        relationshipContext: Present only on cancelled subscriptions.
    - name: cancellationReason
      type: string
      required: false
      maxLength: 300
      help:
        summary: The explanation the customer or staff gave for ending the subscription.
        usage: Recorded at cancellation; churn analysis groups cancelled subscriptions by it.
        relationshipContext: Present only on cancelled subscriptions.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer who subscribes., usage: Chosen when created., cardinalityMeaning: At most one customer; empty until identified., workflowRole: Decides who is billed and served.}}
    - name: plan
      target: SubscriptionPlan
      cardinality: "1"
      ownership: reference
      help:
        summary: The plan subscribed to.
        usage: Chosen at sign-up; changed on upgrade or downgrade.
        cardinalityMeaning: One plan at a time.
        context: Its prices and entitlements apply.
    - name: billingCycle
      target: BillingCycle
      cardinality: 0..1
      ownership: reference
      help:
        summary: The cycle the subscription is billed on.
        usage: Copied from the plan at sign-up.
        cardinalityMeaning: One per subscription.
        context: Decides the billing dates.
  invariants:
    - {id: SUBSCRIPTION-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
    - {id: SUBSCRIPTION-EXE-001, rule: "Current Term End must not be earlier than current term start.", violatedWhen: "current_term_start != null and current_term_end != null and current_term_end < current_term_start", message: "Current Term End cannot be earlier than current term start."}
    - {id: SUBSCRIPTION-EXE-002, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: SUBSCRIPTION-EXE-003, rule: "A subscription that is cancelled states cancellation reason.", violatedWhen: "status == \"CANCELLED\" and cancellation_reason == null", message: "Give the cancellation reason before the subscription is cancelled."}
  lifecycle:
    title: Subscription Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a subscription is ended"
      description: "When a subscription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUBSCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on subscription {{id}}"
              description: "Subscription {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A customer's subscription to a plan, product, service or entitlement over a defined life.
    businessMeaning: A subscription is the ongoing agreement to supply something for a period. It records who subscribes and its state, while billing, usage and entitlement are recorded in their own records so none is duplicated.
    usage: Created when a customer signs up; read by billing, support and account management.
    relationshipContext: A subscription belongs to a customer and follows a plan.
    lifecycle: A subscription is drafted, active while it runs, and completes at the end of its term or is cancelled. Completed and cancelled are final.
    example: A customer subscribes to the Premium plan for twelve months from 1 March.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SUBSCRIPTION}
