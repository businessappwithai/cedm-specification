entity:
  name: TaxRegistration
  namespace: cedm.domain
  kind: tax_master
  description: A governed registration of a Party or Organization with a TaxJurisdiction and tax authority.
  ui:
    icon: percent
  identity: {key: taxRegistrationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: taxRegistrationId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the registration, constant for its life.', businessMeaning: Lets documents and returns point at the registration., usage: Generated on creation., relationshipContext: Referenced by returns and invoices.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the registration is valid for use.
        businessMeaning: Prevents tax numbers that have lapsed from appearing on documents.
        usage: Starts as DRAFT; set by tax staff.
        relationshipContext: Only active registrations are printed on invoices.
        valueSemantics:
          DRAFT: Applied for or being recorded; not yet valid.
          ACTIVE: Valid and in use.
          COMPLETED: Ended, for example after deregistration. A final state.
          CANCELLED: Withdrawn before use. A final state.
  relationships:
    - {name: organization, target: Organization, cardinality: 0..1, ownership: reference, help: {summary: The organisation that holds the registration., usage: Chosen when recorded., cardinalityMeaning: At most one organisation., workflowRole: Decides which company files returns.}}
  invariants:
    - {id: TAX-REGISTRATION-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Tax Registration Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a tax registration is ended"
      description: "When a tax registration is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TAX-REGISTRATION-FOLLOW-UP-{{id}}"
              name: "Follow up on tax registration {{id}}"
              description: "Tax registration {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: The registration of a party or organisation with a tax jurisdiction and its tax authority.
    businessMeaning: A registration is the tax identity the business holds in a place, such as a VAT number. Recording it shows where the business may charge and must report tax and which number to print on invoices.
    usage: Maintained by tax staff; read when invoicing and filing returns.
    relationshipContext: A registration may belong to an organisation and is held in a jurisdiction.
    lifecycle: A registration is drafted, active while valid and completed when it ends. It may be cancelled before use. Completed and cancelled are final.
    example: The company's VAT registration in Germany, active since March 2022.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TAX-REGISTRATION}
