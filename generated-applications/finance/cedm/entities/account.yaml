  invariants:
  - id: ACCOUNT-001
    rule: account code must be unique within its chart-of-accounts context.
  - id: ACCOUNT-002
    rule: account hierarchy must not contain cycles.
  help:
    summary: Represents a financial master entity called Account within the CEDM business model.
    businessMeaning: Account is a business concept with its own identity and lifecycle. It captures information that must
