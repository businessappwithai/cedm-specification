entity:
  name: Account
  namespace: cedm.domain
  kind: financial_master_entity
  description: A financial ledger account used to classify and record monetary activity.
  identity:
    key: accountId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: accountId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the account record associated with this Account. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: accountType
    type: enum
    required: true
    values:
    - ASSET
    - LIABILITY
    - EQUITY
    - REVENUE
    - EXPENSE
    - CONTRA
    help:
      summary: Captures the business meaning of account type for the Account. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        ASSET: Represents the asset state or classification in the context of Account.
        LIABILITY: Represents the liability state or classification in the context of Account.
        EQUITY: Represents the equity state or classification in the context of Account.
        REVENUE: Represents the revenue state or classification in the context of Account.
        EXPENSE: Represents the expense state or classification in the context of Account.
        CONTRA: Represents the contra state or classification in the context of Account.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of Account.
        INACTIVE: Represents the inactive state or classification in the context of Account.
        RETIRED: Represents the retired state or classification in the context of Account.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: currencyId
    type: reference
    target: Currency
    required: false
    help:
      summary: Identifies the currency in which monetary amounts on the record are expressed, allowing amounts to be interpreted
        and aggregated consistently.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable.
      relationshipContext: This field connects Account to Currency. The reference establishes business context between the
        two entities and lets processes navigate from this record to the related Currency.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  relationships:
  - name: parentAccount
    target: Account
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Account to Account so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Account records associated with a Account.
