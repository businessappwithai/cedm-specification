entity:
  name: PurchaseOrder
  namespace: cedm.domain
  kind: procurement_transaction
  description: A formal procurement commitment issued by a buying organization to a Supplier for specified goods or services under agreed commercial and delivery conditions.
  ui:
    icon: shopping-cart
  identity: {key: purchaseOrderId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: purchaseOrderId
      type: uuid
      required: true
      immutable: true
      help: {summary: Immutable system identity of the purchase order., usage: "Used for procurement, receiving, invoice matching, supplier returns, audit and integrations.", relationshipContext: "Identifies the order independently of orderNumber, Supplier, lines, GoodsReceipt and SupplierReturn.", workflowRole: "Stable root reference across commitment, fulfillment, reversal and closure."}
    - name: orderNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The human-facing procurement reference quoted by the buyer and supplier for this order.
        usage: Assigned when the order is created and unique; used by buyers, suppliers, receiving, accounts payable and integrations to find it.
        relationshipContext: Business reference distinct from technical purchaseOrderId.
        workflowRole: Correlates procurement activity across systems.
    - name: orderDate
      type: datetime
      required: true
      help: {summary: Date and time the procurement commitment is created or issued., usage: "Supports chronology, approval, reporting and reconciliation.", relationshipContext: "Distinct from requested delivery, receipt, return, invoice and payment dates.", workflowRole: Anchors the commitment lifecycle.}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, SENT, PARTIALLY_RECEIVED, RECEIVED, CANCELLED, CLOSED]
      help:
        summary: Where the purchase commitment stands from draft through issue, receipt and closure.
        usage: Moved by buyers, approvers and receiving; controls authorisation, issuing, cancellation and closure, and cancelled and closed are final.
        valueSemantics:
          DRAFT: Being prepared by the buyer; not yet binding on anyone.
          APPROVED: Authorised internally and ready to be sent to the supplier.
          SENT: Issued to the supplier, who is now expected to deliver.
          PARTIALLY_RECEIVED: Some of the ordered quantity has been received and accepted; the rest is outstanding.
          RECEIVED: Everything required has been received and accepted.
          CANCELLED: The remaining commitment has been withdrawn. A final state.
          CLOSED: Receiving and invoicing are complete. A final state.
        relationshipContext: PurchaseOrder status does not prove physical receipt, supplier return or invoice settlement; those are separate facts.
    - name: currencyId
      type: reference
      target: Currency
      required: false
      help: {summary: Currency qualifying order monetary values., usage: "Used for pricing, totals, invoice matching, supplier credit calculation and financial reporting.", relationshipContext: Qualifies amounts and does not identify Supplier or Product.}
    - name: requestedDeliveryDate
      type: date
      required: false
      help:
        summary: The date by which the buyer asks the supplier to deliver the goods or complete the service.
        usage: Entered by the buyer and communicated to the supplier; receiving and planners use it to expect arrivals and chase late orders.
        relationshipContext: "A request, not proof of actual receipt or return."
        workflowRole: Supports delivery planning.
    - name: totalAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help: {summary: Order-level value derived from committed lines and commercial adjustments., usage: "Used for approval, budget, supplier commitment and invoice reconciliation.", relationshipContext: Must reconcile with PurchaseOrderLine values and currencyId.}
  relationships:
    - name: supplier
      target: Supplier
      cardinality: '1'
      ownership: reference
      help: {summary: Supplier receiving the procurement commitment., usage: "Drives sourcing, delivery, receiving, supplier performance, returns and accounts payable.", context: GoodsReceipt and SupplierReturn supplier should normally match this supplier.}
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The buying organization that issues the order and is committed to pay for it.
        usage: Chosen when the order is created; decides which legal entity, budget, tax rules and approvals apply to the purchase.
        cardinalityMeaning: 'At most one organization: the buyer is a single legal entity, and it may be unset on an early draft.'
        workflowRole: Identifies the buyer for authorisation, budgeting and reporting.
        context: Ties the commitment to a legal entity for tax and budget.
    - name: lines
      target: PurchaseOrderLine
      cardinality: 1..*
      ownership: aggregate
      help: {summary: Individual commercial commitments within the order., usage: "Defines products/services, quantities, units, prices and fulfillment expectations.", context: GoodsReceipt and SupplierReturn quantities must be evaluated against these ordered lines.}
    - name: deliveryLocation
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place where the ordered goods are to be delivered or the service performed.
        usage: Chosen by the buyer; receiving, logistics planning and the supplier's dispatch use it to route the delivery.
        cardinalityMeaning: At most one delivery location per order; a single order is delivered to one place and may be unset.
        workflowRole: Tells receiving where to expect the goods.
        context: Directs the supplier's dispatch to the receiving site.
    - name: goodsReceipts
      target: GoodsReceipt
      cardinality: 0..*
      ownership: reference
      help: {summary: Fulfillment confirmations recorded against this purchase order., usage: Measures actual received and accepted quantities and supports three-way matching., cardinalityMeaning: Multiple receipts may fulfill one order through partial deliveries., context: PurchaseOrder is commitment; GoodsReceipt is fulfillment evidence.}
    - name: invoices
      target: Invoice
      cardinality: 0..*
      ownership: reference
      help: {summary: Supplier financial claims associated with this procurement commitment., usage: "Supports three-way matching, accounts payable and reconciliation.", cardinalityMeaning: Multiple invoices may reference one order., context: Invoice is a financial claim and cannot substitute for GoodsReceipt evidence.}
    - name: supplierReturns
      target: SupplierReturn
      cardinality: 0..*
      ownership: reference
      help:
        summary: Authorized reverse-procurement transactions against goods previously committed and received under this order.
        businessMeaning: Connects the original procurement commitment to subsequent physical and financial reversals.
        usage: Supports supplier returns, inventory reversal, supplier claims and payable reconciliation.
        cardinalityMeaning: One purchase order may have multiple returns across partial deliveries and return events.
        workflowRole: Provides original commitment context for SupplierReturn eligibility without mutating the purchase order history.
    - name: requestForQuotation
      target: RequestForQuotation
      cardinality: 0..1
      ownership: reference
      help: {summary: Sourcing solicitation from which this order was awarded when applicable., businessMeaning: Preserves demand-to-source-to-order traceability., usage: "Procurement compliance, price validation, and audit.", cardinalityMeaning: Optional for direct or non-RFQ procurement., workflowRole: Supplies sourcing context without replacing order approval.}
    - name: supplierQuotation
      target: SupplierQuotation
      cardinality: 0..1
      ownership: reference
      help: {summary: Accepted supplier offer forming the commercial basis of this order when applicable., businessMeaning: Preserves awarded price and term provenance., usage: "Order verification, three-way sourcing audit, and supplier analysis.", cardinalityMeaning: Optional where procurement does not use supplier quotations., workflowRole: Provides offer evidence while PurchaseOrder remains the external commitment.}
  invariants:
    - {id: PURCHASE-ORDER-001, rule: An APPROVED or later purchase order must contain at least one PurchaseOrderLine.}
    - {id: PURCHASE-ORDER-002, rule: totalAmount must reconcile with applicable PurchaseOrderLine amounts and commercial adjustments when maintained.}
    - {id: PURCHASE-ORDER-003, rule: CANCELLED purchase orders must not create new receiving commitments.}
    - {id: PURCHASE-ORDER-004, rule: RECEIVED indicates operational fulfillment completion and does not imply supplier invoice settlement or absence of later returns.}
    - {id: PURCHASE-ORDER-005, rule: Order fulfillment quantities must be derived from accepted GoodsReceipt quantities rather than invoice quantities.}
    - {id: PURCHASE-ORDER-006, rule: SupplierReturn eligibility must be derived from previously accepted GoodsReceipt evidence and applicable return policy; PurchaseOrder quantity alone is insufficient.}
    - {id: PURCHASE-ORDER-007, rule: Supplier returns must not silently reduce the historical ordered quantity or rewrite approved PurchaseOrderLine commercial evidence.}
    - {id: PURCHASE-ORDER-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Purchase Order Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, SENT, PARTIALLY_RECEIVED, RECEIVED, CANCELLED, CLOSED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: SENT, action: mark_sent}
      - {from: SENT, to: PARTIALLY_RECEIVED, action: mark_partially_received}
      - {from: PARTIALLY_RECEIVED, to: RECEIVED, action: receive}
      - {from: RECEIVED, to: CLOSED, action: close}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: SENT, to: CANCELLED, action: cancel}
      - {from: PARTIALLY_RECEIVED, to: CANCELLED, action: cancel}
      - {from: RECEIVED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a purchase order is ended"
      description: "When a purchase order is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PURCHASE-ORDER-FOLLOW-UP-{{id}}"
              name: "Follow up on purchase order {{order_number}}"
              description: "Purchase order {{order_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents the formal commercial procurement commitment between a buying organization and a Supplier.
    businessMeaning: PurchaseOrder establishes what the Supplier is expected to provide; it is not proof that goods arrived or that later returns occurred.
    usage: Purchasing, supplier management, receiving, warehouse operations, accounts payable, budgeting, inventory planning and analytics.
    relationshipContext: PurchaseRequisition represents internal demand. PurchaseOrder converts approved demand into an external commitment. PurchaseOrderLine specifies the commitment. GoodsReceipt records actual receipt and acceptance. InventoryMovement records stock effects. SupplierReturn reverses eligible fulfillment. Invoice records the supplier claim. SupplierCreditNote records authorized financial reduction. Payment settles claims.
    lifecycle: Draft, approval, issuance, receipt, return, cancellation and closure are distinct stages. Financial settlement can continue after physical fulfillment or return.
    workflowContext: PurchaseOrder → GoodsReceipt → acceptance → InventoryMovement; when goods must be returned, eligible receipt → SupplierReturn → InventoryMovement reversal → SupplierCreditNote → payable reconciliation.
    example: A depot orders 100 parts, receives 96 and accepts 94. Later, three accepted parts are returned as defective. The original order and receipt remain unchanged; SupplierReturn and its inventory/credit workflows record the reversal.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-PURCHASE-ORDER}
