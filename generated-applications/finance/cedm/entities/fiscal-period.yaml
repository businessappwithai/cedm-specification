entity:
  name: FiscalPeriod
  namespace: cedm.domain
  kind: accounting_control_master
  description: A governed accounting time interval controlling when financial transactions may be posted, adjusted, closed, or reported for an Organization.
  ui:
    icon: database
  identity: {key: fiscalPeriodId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: fiscalPeriodId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identity of the accounting period, unchanged when its dates or status change.', usage: 'Generated on creation; journal entries, close tasks and financial reports refer to the period by this value.', businessMeaning: Identifies one accounting control interval independently of its label., relationshipContext: JournalEntry accounting dates resolve to an eligible period.}}
    - {name: code, type: string, required: true, maxLength: 50, help: {summary: 'The business code of the period, such as 2026-03 or FY2026-Q1, by which finance staff name it.', usage: "Assigned when the calendar is set up and shown on journals, close checklists and reports; unique within an organisation's calendar.", businessMeaning: Human-facing accounting interval reference such as 2026-09., relationshipContext: Unique within organization/calendar context.}}
    - {name: startDate, type: date, required: true, help: {summary: 'The first accounting date that falls inside the period, from which postings are assigned to it.', usage: Set when the calendar is defined; a journal entry is posted to the period whose dates contain its entry date., businessMeaning: Defines lower posting boundary., relationshipContext: Inclusive with endDate.}}
    - {name: endDate, type: date, required: true, help: {summary: The last day covered by the accounting period., usage: Set when the calendar is defined; must not be before the start date. Postings dated after it belong to a later period., relationshipContext: Together with the start date it defines the interval in which journal entries may be dated., businessMeaning: Defines upper posting boundary.}}
    - name: status
      type: enum
      required: true
      default: FUTURE
      values: [FUTURE, OPEN, SOFT_CLOSED, CLOSED, LOCKED]
      help:
        summary: Controls whether journal entries may be posted to the period, from not yet open to finally closed.
        usage: Moved by finance through open, soft close, close and lock; journal validation reads it before accepting any posting.
        valueSemantics:
          FUTURE: Defined but not yet open; no postings are accepted.
          OPEN: Open and accepting postings from ordinary finance users.
          SOFT_CLOSED: Normally closed but still open to postings by authorised finance staff, for adjustments.
          CLOSED: Closed; no further postings and figures are final for reporting. A final state.
          LOCKED: Frozen temporarily, for example during an audit or a month-end freeze; it can be reopened.
        businessMeaning: Governs permitted accounting recognition and correction.
        relationshipContext: Historical posted entries remain immutable.
  relationships:
    - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {cardinalityMeaning: 'Exactly one organisation: each legal entity keeps its own accounting calendar and closes its own periods.', summary: Accounting organization owning period., businessMeaning: Establishes books/control boundary., usage: Posting and reporting., workflowRole: Journal organization must match.}}
    - {name: journalEntries, target: JournalEntry, cardinality: "0..*", ownership: reference, help: {summary: Accounting entries recognized in period., businessMeaning: Provides posting chronology., usage: "Close, reporting and audit.", cardinalityMeaning: Zero or many entries., workflowRole: Posted entry date must fall within boundaries and allowed state.}}
  invariants:
    - {id: FISCAL-PERIOD-001, rule: endDate must be on or after startDate.}
    - {id: FISCAL-PERIOD-002, rule: Periods for the same organization and accounting calendar must not overlap unless explicitly modeled as distinct adjustment-period types.}
    - {id: FISCAL-PERIOD-003, rule: POSTED JournalEntry requires an eligible FiscalPeriod containing entryDate.}
    - {id: FISCAL-PERIOD-004, rule: CLOSED or LOCKED period rejects ordinary new posting; corrections require governed reopen or permitted adjustment-period treatment.}
    - {id: FISCAL-PERIOD-005, rule: Period close never rewrites posted journal history.}
    - {id: FISCAL-PERIOD-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Fiscal Period Lifecycle
    attribute: status
    states: [FUTURE, OPEN, SOFT_CLOSED, CLOSED, LOCKED]
    initial: FUTURE
    terminal: [CLOSED]
    transitions:
      - {from: FUTURE, to: OPEN, action: open}
      - {from: OPEN, to: SOFT_CLOSED, action: mark_soft_closed}
      - {from: SOFT_CLOSED, to: CLOSED, action: close}
      - {from: OPEN, to: LOCKED, action: lock}
      - {from: LOCKED, to: OPEN, action: unlock}
  help:
    summary: Accounting-period control for posting, close and reporting.
    businessMeaning: FiscalPeriod determines whether an accounting date is currently eligible for recognition; it does not replace JournalEntry.
    usage: General ledger, AP, AR, treasury, assets, inventory accounting, tax and financial close.
    relationshipContext: Organization defines books; JournalEntry carries accounting date; period state controls posting eligibility.
    lifecycle: Future → open → soft closed → closed → locked, with governed reopen where policy permits.
    changePropagation: Closing/reopening immediately revalidates pending postings and close processes while preserving already posted history.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FISCAL-PERIOD}
