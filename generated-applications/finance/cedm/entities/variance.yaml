entity:
  name: Variance
  namespace: cedm.domain
  kind: financial_analysis
  description: A derived comparison between planned, forecast, or actual financial measures for a defined period and dimensional context.
  ui:
    icon: table
  identity: {key: varianceId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: varianceId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identifier of the variance comparison, unchanged when its figures are recalculated.', usage: Generated on creation; reports and commentary refer to it to point at one specific comparison of plan against actual., businessMeaning: Lets reports point at the comparison., relationshipContext: Referenced by review reports.}}
    - {name: code, type: string, required: true, maxLength: 100, help: {summary: 'The reference code of the variance, such as VAR-2026-03-MKT, naming the period and area compared.', usage: 'Assigned by finance or the planning system when the comparison is produced; used in reports, review packs and when quoting a variance to managers.', businessMeaning: Gives reviewers a stable reference., relationshipContext: Read with the period.}}
    - name: periodStart
      type: date
      required: true
      help:
        summary: The first day of the period being compared.
        usage: Set when the variance is calculated; actual and plan figures are taken from this date.
        relationshipContext: Not later than the period end.
    - name: periodEnd
      type: date
      required: true
      help:
        summary: The last day of the period being compared.
        usage: Set when the variance is calculated; must not be before the start of the period.
        relationshipContext: Defines the length of the comparison period.
    - name: basis
      type: enum
      values:
        - BUDGET
        - FORECAST
      required: true
      help:
        summary: Whether the actual figure is compared with a budget or with a forecast.
        usage: Chosen when calculated; decides which of the linked budget or forecast supplies the plan figure.
        relationshipContext: Read with the budget and forecast relationships.
        valueSemantics:
          BUDGET: Actuals are compared with the approved budget.
          FORECAST: Actuals are compared with the latest forecast.
    - name: plannedAmount
      type: decimal
      precision: 20
      scale: 4
      required: true
      help:
        summary: The budgeted or forecast amount for the period.
        usage: Copied from the budget or forecast when the variance is calculated, so later revisions do not change it.
        relationshipContext: Compared with the actual amount to give the variance.
    - name: actualAmount
      type: decimal
      precision: 20
      scale: 4
      required: true
      help:
        summary: The amount actually incurred or earned in the period according to the ledger.
        usage: Taken from posted accounting evidence when calculated; the variance never changes those entries.
        relationshipContext: Compared with the planned amount.
    - name: varianceAmount
      type: decimal
      precision: 20
      scale: 4
      required: true
      help:
        summary: The actual amount minus the planned amount; a positive figure is above plan.
        usage: Calculated when the variance is produced; read by budget owners to see where spend or revenue departs from plan.
        relationshipContext: The difference between the actual and planned amounts.
    - name: measure
      type: string
      required: true
      maxLength: 150
      help:
        summary: What is being compared, such as travel expenses or revenue.
        usage: Set by the calculation, usually an account or account group, so the owner knows which line departs from plan.
        relationshipContext: Usually an account or account group.
    - name: comparisonType
      type: enum
      required: true
      default: ACTUAL_VS_BUDGET
      values:
        - ACTUAL_VS_BUDGET
        - ACTUAL_VS_FORECAST
        - FORECAST_VS_BUDGET
        - FORECAST_VS_PRIOR
      help:
        summary: Which two figures are being set against each other.
        usage: Chosen by the calculation and decides which figure acts as the plan.
        valueSemantics:
          ACTUAL_VS_BUDGET: Posted actual results are compared with the approved budget.
          ACTUAL_VS_FORECAST: Posted actual results are compared with the current forecast.
          FORECAST_VS_BUDGET: The latest forecast is compared with the approved budget to show expected overruns.
          FORECAST_VS_PRIOR: This forecast is compared with the previous forecast to show how expectations moved.
        relationshipContext: Decides which figure is the plan.
    - name: variancePercent
      type: decimal
      required: false
      precision: 9
      scale: 2
      help:
        summary: The variance as a percentage of the planned figure.
        usage: Used to decide whether it needs explaining.
        relationshipContext: Empty when the planned figure is zero.
    - name: isFavourable
      type: boolean
      required: false
      help:
        summary: Whether the difference is good for the business — more revenue or less cost.
        usage: Computed from the measure's nature.
        relationshipContext: Read with the amount.
    - name: explanation
      type: text
      required: false
      help:
        summary: Why the figures differ, in the owner's words.
        usage: Written by the owner; required above the threshold.
        relationshipContext: Read by management.
    - name: status
      type: enum
      required: true
      default: CALCULATED
      values:
        - CALCULATED
        - EXPLAINED
        - REVIEWED
        - ACCEPTED
      help:
        summary: How far the variance has progressed through explanation and review.
        usage: Moved on by the owner and by controlling; only reviewed variances are reported as explained.
        valueSemantics:
          CALCULATED: Computed and waiting for the owner to explain it.
          EXPLAINED: The owner has written an explanation for the difference.
          REVIEWED: Controlling has examined and accepted the explanation.
          ACCEPTED: The difference is under the threshold, so no explanation is needed.
        relationshipContext: Only reviewed variances are reported as explained.
  relationships:
    - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: The organisation the comparison is for., usage: Chosen when created., cardinalityMeaning: Exactly one organisation., workflowRole: Decides whose budget is measured.}}
    - {name: budget, target: Budget, cardinality: 0..1, ownership: reference, help: {summary: The budget used as the plan., usage: Chosen when comparing with budget., cardinalityMeaning: At most one budget., workflowRole: Provides the planned figure., businessMeaning: Supplies planned value source.}}
    - {name: forecast, target: Forecast, cardinality: 0..1, ownership: reference, help: {summary: The forecast used as the expectation., usage: Chosen when comparing with forecast., cardinalityMeaning: At most one forecast; empty if only a budget is used., workflowRole: Provides the expected figure., businessMeaning: Supplies projected value source.}}
    - name: costCenter
      target: CostCenter
      cardinality: 0..1
      ownership: reference
      help:
        summary: The cost centre compared, when the variance is by cost centre.
        usage: Set by the calculation.
        cardinalityMeaning: At most one.
        context: Its manager explains the variance.
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who must explain the variance.
        usage: Usually the cost-centre or budget owner.
        cardinalityMeaning: One per variance.
        context: Receives variances above the threshold.
    - name: currency
      target: Currency
      cardinality: 0..1
      ownership: reference
      help:
        summary: The currency of the amounts.
        usage: The organization's reporting currency.
        cardinalityMeaning: One per variance.
        context: All amounts use it.
  invariants:
    - {id: VARIANCE-001, rule: The record must not directly create or rewrite actual JournalEntry evidence.}
    - id: VARIANCE-002
      rule: periodEnd must not precede periodStart.
    - {id: VARIANCE-EXE-001, rule: "Period End must not be earlier than period start.", violatedWhen: "period_start != null and period_end != null and period_end < period_start", message: "Period End cannot be earlier than period start."}
  help:
    summary: A comparison between planned, forecast or actual financial measures for a period and dimension.
    businessMeaning: A variance shows how far reality is from the plan and in which direction. It lets managers see where budget is overspent or revenue falls short, without altering the accounting entries it is derived from.
    usage: Calculated by finance or the planning system; read by managers and budget owners.
    relationshipContext: A variance belongs to an organisation and compares a budget or a forecast with actuals.
    lifecycle: A variance is calculated for a period and recalculated as actuals arrive. It never changes the entries it compares.
    example: Marketing spend is 12 percent over budget for March.
  lifecycle:
    title: Variance Lifecycle
    attribute: status
    states:
      - CALCULATED
      - EXPLAINED
      - REVIEWED
      - ACCEPTED
    initial: CALCULATED
    terminal:
      - REVIEWED
      - ACCEPTED
    transitions:
      - from: CALCULATED
        to: EXPLAINED
        action: explain
      - from: EXPLAINED
        to: REVIEWED
        action: review
      - from: EXPLAINED
        to: CALCULATED
        action: return
      - from: CALCULATED
        to: ACCEPTED
        action: accept
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-VARIANCE}
