entity:
  name: Scenario
  namespace: cedm.domain
  kind: planning_reference
  description: A governed planning assumption set used to distinguish alternative budgets and forecasts without altering actual business transactions.
  ui:
    icon: list
  identity: {key: scenarioId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: scenarioId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the scenario, constant for its life.', businessMeaning: Identifies one planning assumption set., usage: Budget/forecast comparison., relationshipContext: Referenced by planning artifacts.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: Scenario business code., businessMeaning: Identifies baseline/upside/downside or named case., usage: Planning and reports., relationshipContext: Does not identify actual ledger.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, ARCHIVED]
      help:
        valueSemantics:
          DRAFT: Being defined; not yet used in planning.
          ACTIVE: Available for budgets and forecasts.
          ARCHIVED: No longer used; kept for history. A final state.
        summary: Scenario lifecycle.
        businessMeaning: Controls new planning use.
        usage: Planning governance.
        relationshipContext: Historical plans retain scenario reference.
  invariants:
    - {id: SCENARIO-001, rule: Scenario assumptions must not directly mutate actual transactions or accounting.}
  lifecycle:
    title: Scenario Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, ARCHIVED]
    initial: DRAFT
    terminal: [ARCHIVED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: ARCHIVED, action: archive}
  help:
    summary: Alternative planning assumption context.
    businessMeaning: Separates hypothetical plans from actual outcomes.
    usage: "Budgeting, forecasting and sensitivity analysis."
    relationshipContext: Budget and Forecast may reference it.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SCENARIO}
