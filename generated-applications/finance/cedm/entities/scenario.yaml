entity:
  name: Scenario
  namespace: cedm.domain
  kind: planning_reference
  description: A governed planning assumption set used to distinguish alternative budgets and forecasts without altering actual business transactions.
  identity: {key: scenarioId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: scenarioId, type: uuid, required: true, immutable: true, help: {summary: Stable scenario identity., businessMeaning: Identifies one planning assumption set., usage: Budget/forecast comparison., relationshipContext: Referenced by planning artifacts., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: Scenario business code., businessMeaning: Identifies baseline/upside/downside or named case., usage: Planning and reports., relationshipContext: Does not identify actual ledger., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, ARCHIVED]
    help: {summary: Scenario lifecycle., businessMeaning: Controls new planning use., usage: Planning governance., relationshipContext: Historical plans retain scenario reference., valueSemantics: {DRAFT: Being prepared., ACTIVE: Available for plans., ARCHIVED: Closed to new normal use.}, requiredMeaning: Required.}
  invariants:
  - {id: SCENARIO-001, rule: Scenario assumptions must not directly mutate actual transactions or accounting.}
  help: {summary: Alternative planning assumption context., businessMeaning: Separates hypothetical plans from actual outcomes., usage: "Budgeting, forecasting and sensitivity analysis.", relationshipContext: Budget and Forecast may reference it.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SCENARIO}
