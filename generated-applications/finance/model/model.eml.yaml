    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the city record. Generated when the city is loaded; addresses refer to the city through it.
      - name: code
        type: string(80)
        unique: true
        help: "The city's code: its country code and its name in capitals, such as FR-PARIS. Quoted beside the name in lists; integration with other systems. Unique; the country prefix keeps cities of one name in different countries apart."
      - name: name
        type: string(200)
        help: "The city's name in English, as it is written on addresses and in place lists. Loaded with the reference data; shown in lists, pickers and address lines, and narrowed by the country and state chosen. Not unique: two countries can have a city of one name."
      - name: population
        type: integer
        optional: true
        help: The population figure recorded in the GeoNames registry when the data was loaded. Used to rank and size cities in lists and pickers; it is an approximate registry value, not a current census count. Describes the city only.
      - name: latitude
        type: decimal
        optional: true
        help: The city's north-south position in decimal degrees, with north positive and south negative. Loaded with the reference data; paired with longitude to place the city on maps and measure distances. Describes the city only.
      - name: longitude
        type: decimal
        optional: true
        help: The city's east-west position in decimal degrees, with east positive and west negative. Loaded with the reference data; paired with latitude to place the city on maps and measure distances. Describes the city only.
      - name: timezone
        type: string(64)
        optional: true
        help: The IANA time zone the city keeps, such as Europe/Paris. Showing local times for the city. Describes the city only.
      - name: is_capital
        type: boolean
        optional: true
        help: Marks the city as the capital of its country in the reference data. Loaded with the reference data; lists use it to highlight or sort capitals first when people choose a city. At most one capital per country in this list.
      - name: country_id
        type: string
        fk: true
        help: Exactly one country; a city belongs to a single country. The country the city is in. Chosen first; the cities offered are those of that country. A city is narrowed by its country, and by its state where it has one.
      - name: state_province_id
        type: string
        fk: true
        narrowedBy: [country_id]
        optional: true
        help: The state or province the city is in, where the registry says which. Chosen after the country; narrows the cities offered. A city has at most one state or province; outside the United States and Canada the list leaves it empty. The state of a city must be a division of the city's own country.
  - name: Language
    help: A language used for localisation, communication preferences, content and reporting. People read and write in different languages. A language record lets the application offer translations, remember preferences and tag content with the language it is written in. Loaded from the standard language registry; chosen on user profiles, documents and messages. Parties, users and content refer to a language; the language itself depends on nothing. Code and identity stay stable, and history is never silently rewritten. English, with code en.
