        help: Connects Account to Organization so related business context can be navigated and enforced. Used when processes need to find or reason about Organization records associated with a Account. The declared cardinality 0..1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: JournalEntry
    help: Represents accounting recognition of a business event in a balanced double-entry ledger. JournalEntry is the accounting representation, not the operational event itself. Payment records settlement activity, BankTransaction records external bank evidence, Invoice records a claim, CreditNote records customer adjustment, SupplierCreditNote records supplier payable adjustment, SupplierDebitNote records buyer recovery, and JournalEntry records accounting recognition. General ledger, accounts receivable, accounts payable, treasury, inventory accounting, asset accounting, tax, audit, period close and financial reporting. sourceTransaction provides generic origin. Payment, CreditNote, SupplierCreditNote and SupplierDebitNote provide direct traceability when applicable. JournalEntryLine contains debit/credit effects. Organization provides accounting boundary. Business event → accounting determination → JournalEntry draft → line validation → balance validation → POSTED. Customer and supplier credit/debit posting follows adjustment calculation and approval and must create/link required accounting recognition. Payment workflow independently progresses through payment states and bank reconciliation. Draft entries may be prepared and corrected under authorization. Posting establishes immutable recognition. Corrections after posting use explicit reversal and replacement entries. Changes to unposted CreditNote, SupplierCreditNote or SupplierDebitNote require accounting recalculation. Posted adjustment changes require reversal/replacement JournalEntry treatment; posted journal history is never destructively rewritten. A USD 500 SupplierDebitNote increases supplier recovery exposure. A balanced JournalEntry records the authorized accounting consequence. If the debit is later reversed, the original JournalEntry remains and a compensating reversal entry is posted.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the accounting entry. Used for posting, audit, reporting, reversal, reconciliation and integration. Identifies the accounting event independently of its source transaction and journal lines. Provides the stable root reference across accounting preparation, validation, posting, reporting and reversal. Required.
      - name: entry_number
        type: string(100)
        unique: true
        help: Human-facing accounting journal reference. Used by accountants, auditors, reports and integrations. Distinct from source transaction numbers such as Invoice, Payment, CreditNote, SupplierCreditNote and SupplierDebitNote references. Identifies the accounting record in ledgers and audit trails. Required.
      - name: entry_date
        type: datetime
        help: Accounting date at which the entry is recognized. Determines accounting period, reporting chronology and period controls. May differ from originating transaction, bank value, invoice, CreditNote, SupplierCreditNote or SupplierDebitNote date. Controls the period into which the entry is posted. Required.
      - name: status
        type: string
        enum: JournalEntryStatus
        help: Accounting lifecycle state. Controls editing, posting, reporting and reversal permissions. Independent of Payment, Invoice, CreditNote, SupplierCreditNote, SupplierDebitNote and BankTransaction statuses. DRAFT permits preparation; POSTED establishes recognition; REVERSED preserves original history while counteracting its effect. Required.
        default: DRAFT
      - name: description
        type: string(1000)
        optional: true
        help: Human-readable explanation of the accounting event. Supports review, audit, reconciliation and reporting. Complements source transaction and lines; must not be sole accounting evidence. Helps accountants understand why the entry was generated. Optional when source and line information fully explain the event.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this JournalEntry belongs to.
      - name: payment_id
        type: string
        fk: true
        optional: true
        help: Payment whose financial recognition is represented when applicable. Supports cash, receivable, payable, clearing, fee and settlement accounting traceability. Optional because not every journal entry originates from a payment. A posted payment may generate accounting recognition while Payment status remains separate.
      - name: credit_note_id
        type: string
        fk: true
        optional: true
        help: Customer CreditNote whose financial adjustment is represented. Supports receivable, revenue, tax, inventory-related and refund-obligation accounting traceability. Optional because not every journal entry represents a customer credit. CreditNote posting requires appropriate accounting recognition.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Organization whose books recognize the accounting entry. Supports legal-entity accounting, reporting, period control and ledger ownership. Optional when organization is inherited from ledger context. Determines accounting boundary and applicable chart/period policies.
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: Accounting control period containing entryDate. Establishes posting eligibility and close context. Posting, close, reporting and audit. Required for POSTED entries under period-controlled accounting; optional while draft before determination. Organization/date must resolve to an eligible period before posting.
      - name: ledger_id
        type: string
        fk: true
        optional: true
        help: The Ledger this JournalEntry belongs to.
  - name: JournalEntryLine
    help: Represents a financial transaction line called JournalEntryLine within the CEDM business model. JournalEntryLine is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface. Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate JournalEntryLine records. The entity participates in a wider business graph through relationships with JournalEntry, Account. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns. The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships. A typical JournalEntryLine record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Identifies the journal entry line record associated with this JournalEntryLine. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object. Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records, where applicable. Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: line_number
        type: integer
        help: Captures the business meaning of line number for the JournalEntryLine. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records, where applicable. Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
        min: 1
      - name: debit_amount
        type: decimal
        help: Captures the business meaning of debit amount for the JournalEntryLine. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records, where applicable. Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
        default: "0"
      - name: credit_amount
        type: decimal
        help: Captures the business meaning of credit amount for the JournalEntryLine. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records, where applicable. Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
        default: "0"
      - name: description
        type: string(500)
        optional: true
        help: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes. Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records, where applicable. Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      - name: journal_entry_id
        type: string
        fk: true
        help: Connects JournalEntryLine to JournalEntry so related business context can be navigated and enforced. Used when processes need to find or reason about JournalEntry records associated with a JournalEntryLine. The declared cardinality 1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
      - name: account_id
        type: string
        fk: true
        help: Connects JournalEntryLine to Account so related business context can be navigated and enforced. Used when processes need to find or reason about Account records associated with a JournalEntryLine. The declared cardinality 1 expresses how many related records may participate in the relationship. The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: Invoice
    help: Represents a formal financial claim and its controlled settlement and adjustment state. Invoice records what was originally claimed. Payment records money moved. PaymentAllocation records how money is applied. CreditNote, SupplierCreditNote, and SupplierDebitNote record separate authorized financial adjustments; their application entities record claim-level consumption. Used by order-to-cash, procure-to-pay, accounting, tax, collections, payments, reconciliation, customer credit, supplier recovery and audit. SalesOrder provides commercial commitment, Shipment or delivery provides fulfillment where applicable, GoodsReceipt provides accepted procurement fulfillment, Invoice provides the claim, CreditNote provides customer reduction, SupplierCreditNote provides supplier reduction, SupplierDebitNote provides buyer recovery, Payment provides settlement, and application entities connect each adjustment to the claim. Invoice preparation → line calculation → discount → taxable base → tax determination → total → PaymentTerm due-date calculation → issue → payment → PaymentAllocation and/or approved adjustment application → amountSettled/amountCredited/amountOutstanding → PARTIALLY_PAID or PAID. Supplier credit and debit applications remain explicit non-cash financial evidence. Draft → issued → partially paid or overdue → paid, with cancellation and void paths. Corrections use CreditNote, SupplierCreditNote, SupplierDebitNote, controlled adjustments, or allocation/application reversals rather than silently rewriting posted evidence. Changes to Customer, Supplier, Product, UOM, pricing, discount, tax, Currency, SalesOrder, PurchaseOrder, GoodsReceipt, return, claim, credit, or debit evidence affecting an open transaction trigger controlled revalidation. Posted invoice history is not silently recalculated. Posted adjustments and applications are corrected through explicit reversal/replacement. A purchase invoice totals 10,000 EUR. A 1,000 EUR supplier credit and a 500 EUR supplier debit are each explicitly applied through their application entities; the invoice's original values remain unchanged while payable exposure is reconciled from the active settlement and adjustment evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the invoice claim. Identifies the financial claim independently of its number, lines, source order, receipts, credits, debits, or payments. Used for financial integrations, audit, payment allocation, reconciliation, reporting, and lifecycle navigation. InvoiceId identifies the claim; InvoiceNumber is its business-facing reference; CreditNote and supplier debit/credit applications provide later financial adjustment evidence. Provides the stable identity carried through issuance, settlement, adjustment, reversal, and accounting. Required for claim traceability.
      - name: invoice_number
        type: string(100)
        unique: true
        help: Business-facing invoice reference. Identifier communicated to customers, suppliers, tax authorities, and financial operations. Used in documents, statements, reconciliation, collections, payables, and integrations. Distinct from invoiceId and source order numbers. Provides the human-recognizable reference throughout the claim lifecycle. Required for operational and financial communication.
      - name: invoice_date
        type: date
        help: Accounting and commercial date assigned to the invoice. Establishes the date used for financial chronology and applicable billing and tax rules. Used for accounting periods, tax, payment-term calculation, aging, reporting, and reconciliation. Distinct from payment, bank settlement, credit-note, debit-note, and clearing dates. Provides the temporal anchor for invoice issuance and applicable PaymentTerm calculation. Required for financial chronology.
      - name: due_date
        type: date
        optional: true
        help: Transaction-level date by which the claim is expected to be settled. Result of applying the effective PaymentTerm and due-date basis to the invoice. Drives aging, collections, cash forecasting, and payment planning. PaymentTerm is policy; dueDate is the invoice-specific result and must not be silently recalculated after issue. Determines when the outstanding claim becomes overdue under the applicable policy. Optional while terms remain unresolved or for claim types without a due date.
      - name: invoice_type
        type: string
        enum: InvoiceInvoiceType
        help: Defines the commercial direction and accounting nature of the invoice document. Determines whether the document establishes a receivable, payable, or adjustment. Used by accounting, tax, receivables, payables, matching, and reporting. Must agree with Customer/Supplier and source transaction relationships. A dedicated CreditNote or SupplierDebitNote is preferred for explicit financial adjustments. Controls which party, matching, tax, and settlement processes apply. Required for correct financial treatment.
      - name: status
        type: string
        enum: InvoiceStatus
        help: Lifecycle state of the financial claim. Indicates whether the claim is being prepared, outstanding, settled, overdue, cancelled, or voided. Controls issuance, settlement, aging, cancellation, reporting, and accounting workflows. PaymentAllocation supplies settlement evidence; CreditNote and SupplierDebitNoteApplication supply authorized adjustment evidence; Payment status alone must never determine invoice payment status. ISSUED establishes the claim; active allocations and authorized adjustment applications change settlement projection; PAID requires no remaining amount under policy; OVERDUE is time-based and may coexist with partial settlement. Claim is being prepared and is not issued. Claim is formally outstanding. Active settlement evidence covers part of the amount due after authorized adjustments. Active settlement evidence and authorized adjustments fully satisfy the claim under policy. Claim remains outstanding after its due date. Claim has been cancelled under authorized controls. Claim has been invalidated under accounting controls. Required for controlled claim lifecycle.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency denomination shared by the invoice's monetary values. Defines the monetary denomination of the claim and its calculated totals. Used for accounting, payment allocation, tax, reconciliation, reporting, and credit or debit adjustment. Payment, CreditNote, SupplierCreditNote, or SupplierDebitNote may use another currency only under explicitly governed exchange-rate treatment. Provides the denomination against which invoice amounts, settlement and adjustments are evaluated. Required for interpreting the claim.
      - name: subtotal
        type: Money
        help: Aggregate of invoice line amounts before document-level tax and other applicable document adjustments. Represents the pre-tax financial base derived from invoice lines after line-level pricing treatment. Used for tax calculation, accounting, reconciliation, and document totals. Must use invoice currency and reconcile with InvoiceLine monetary values. Feeds document-level discount, tax, and total calculations according to policy. Required for claim calculation.
      - name: discount_amount
        type: Money
        help: Aggregate document-level discount applied after applicable line pricing and before taxable base where policy requires. Represents a document-level reduction distinct from line-level discounts and settlement discounts. Used for invoice calculation, tax determination, reporting, and reconciliation. Must reconcile with applicable DiscountRule evidence and must not be confused with credit notes or early-payment discounts. Reduces the applicable document base before tax according to the invoice calculation policy. Required as a zero-valued projection when no document discount exists.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: Aggregate monetary base on which applicable invoice taxes are calculated. Represents the amount subject to tax after applicable discounts and exemptions. Used for tax calculation, tax reporting, audit, and reconciliation. Must reconcile with InvoiceLine taxable amounts and document-level tax determinations. Supplies the base for TaxRule application and tax calculation. Required for deterministic tax calculation.
      - name: tax_amount
        type: Money
        help: Aggregate tax amount calculated under applicable TaxRules and transaction tax determinations. Represents tax charged or otherwise recognized on the claim, not the taxable base. Used for tax reporting, invoice totals, accounting, and reconciliation. Must reconcile with transaction-level tax evidence and jurisdictional treatment. Contributes to totalAmount and downstream tax/accounting reporting. Required, including zero when no tax applies.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total financial claim after applicable line values, discounts, taxes, credits, debits, and document adjustments. Represents the amount owed under the original invoice before settlement allocations and later adjustment applications. Used for settlement, aging, statements, reporting, and accounting. Represents the original claim itself, not the amount already paid or subsequently adjusted. Provides the claim base against which active PaymentAllocation and authorized adjustment application evidence are evaluated. Required for financial settlement.
      - name: amount_settled
        type: Money
        help: Projection of active settlement amounts applied to this invoice. Represents how much of the claim is settled according to active PaymentAllocation records. Used to calculate outstanding balance and derive settlement status. Not an independent cash event; Payment and PaymentAllocation provide the underlying evidence. Changes when allocations are posted, activated, reversed, or corrected. Required as a settlement projection.
        default: '{"amount":0}'
      - name: amount_credited
        type: Money
        help: Projection of active CreditNote amounts applied against this invoice claim. Represents authorized financial reductions supported by posted CreditNote evidence. Used for customer balance, invoice settlement, statements, reconciliation and reporting. CreditNote is a separate financial document; this projection must not rewrite original Invoice or InvoiceLine values. Changes through controlled credit-note application or reversal workflows. Required as a zero-valued adjustment projection when no credits apply.
        default: '{"amount":0}'
      - name: amount_outstanding
        type: Money
        help: Projection of the portion of the invoice claim that remains unsettled after authorized credits and debits. Represents current open exposure under the applicable accounting and rounding policy. Drives collections, payment allocation, aging, statements, and cash forecasting. Normally reconciles totalAmount less active settlement and authorized adjustment applications in invoice currency. Determines whether additional allocation or adjustment application is permitted and whether PAID can be reached. Required for operational settlement decisions.
        default: '{"amount":0}'
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: Customer associated with a sales invoice. Identifies the party against whom a receivable claim is established. Supports receivables, statements, collections, tax, credit, and customer reporting. Required for SALES invoices unless another controlled party model applies. Supplies commercial party context for the claim and settlement.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: Supplier associated with a purchase invoice. Identifies the party to whom a payable claim relates. Supports payables, supplier statements, procurement reconciliation, tax, and payment processing. Required for PURCHASE invoices unless another controlled party model applies. Supplies commercial party context for three-way matching and settlement.
      - name: sales_order_id
        type: string
        fk: true
        optional: true
        help: Sales commitment from which a sales invoice may originate. Connects customer demand commitment to the resulting financial claim. Supports order-to-cash traceability, billing reconciliation, and revenue processes. SalesOrder is the commercial commitment; Invoice is the financial claim. Provides source context for sales billing.
      - name: purchase_order_id
        type: string
        fk: true
        optional: true
        help: Procurement commitment against which a supplier invoice may be evaluated. Connects supplier commitment to the resulting payable claim. Supports three-way matching and accounts payable controls. PurchaseOrder is commitment; GoodsReceipt is accepted fulfillment; Invoice is the claim. Supplies ordered quantity and price context for InvoiceLine matching.
  - name: Payment
    help: "Represents movement or recognition of money while keeping payment execution, claim settlement, bank evidence, accounting recognition, customer refunds and supplier-credit refunds as separate connected facts. Payment is the settlement event. Invoice is the claim. PaymentAllocation applies receipt payments to claims. CreditNote is a customer financial adjustment. SupplierCreditNote is a supplier payable adjustment. A refund or settlement Payment is separate cash evidence. Accounts receivable, accounts payable, treasury, banking integrations, cash management, reconciliation, collections, supplier payments, customer refunds and supplier-credit refunds. Currency defines denomination. PaymentAllocation connects receipt Payments to claims. CreditNote connects customer refunds. SupplierCreditNote connects supplier-credit cash settlements when a supplier returns funds. BankTransaction confirms external settlement. JournalEntry records accounting consequences. Receipt Payment → approval → posting → allocation → bank evidence → cleared. Customer credit: CreditNote posted → application or refund due → DISBURSEMENT Payment → bank reconciliation. Supplier credit: SupplierCreditNote posted → application against payable or supplier refund due → RECEIPT Payment from supplier → bank reconciliation. Original payment and credit histories remain immutable. Draft → approved → posted → cleared, with controlled void and reversal paths. Payment, Invoice, CreditNote, SupplierCreditNote, BankTransaction and JournalEntry retain independent lifecycle states because they represent different business facts. Changes to CreditNote or SupplierCreditNote settlement obligations require validation of linked payment eligibility. Payment reversal requires corresponding reversal of affected refund/settlement projections and accounting evidence; it must never rewrite the originating credit note. A supplier has a EUR 300 unapplied SupplierCreditNote. The supplier refunds EUR 300 rather than applying it to another invoice. A new RECEIPT Payment for EUR 300 is linked to the SupplierCreditNote and reconciled to bank evidence. The original supplier credit remains unchanged except for its controlled cash-settlement projection."
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the payment event. Identifies the financial movement independently of its business reference, allocations, bank evidence, accounting entries or credit settlement purpose. Reconciliation, allocation, accounting, audit, integration and reversal. Identity remains stable when allocations are reversed or a refund/settlement is associated with a credit note. Root reference across preparation, authorization, posting, clearing and reversal. Required.
      - name: payment_number
        type: string(100)
        unique: true
        help: Business-facing payment reference. Reference communicated in remittance, statements, bank reconciliation and payment inquiries. Finance, counterparties, integrations and reconciliation. Distinct from paymentId and bank transaction identifiers. Correlates internal payment evidence with operational and external references. Required.
      - name: payment_date
        type: datetime
        help: Timestamp at which the payment event is recognized by the business process. Establishes internal settlement chronology. Accounting periods, cash reporting, reconciliation and settlement analysis. Distinct from bank value date, clearing date, posting date, allocation date and credit-note date. Provides event time for internal payment processing. Required.
      - name: direction
        type: string
        enum: PaymentDirection
        help: Indicates whether the organization receives or disburses money. Establishes cash-flow direction and payer/payee interpretation. Receivables, payables, treasury, accounting and refunds/credit settlements. Customer refund and supplier-credit refund/settlement payments are DISBURSEMENT events and never rewrite original receipt payments. Determines cash-flow and settlement path. Required.
      - name: status
        type: string
        enum: PaymentStatus
        help: Lifecycle state of the payment event. Indicates authorization, internal recognition, external clearing, invalidation or reversal. Controls execution, reconciliation, reporting and correction. Independent of Invoice, CreditNote, SupplierCreditNote and BankTransaction statuses. APPROVED authorizes processing; POSTED recognizes internally; CLEARED confirms external evidence; VOID/REVERSED handle correction. Required.
        default: DRAFT
      - name: amount
        type: Money
        help: Total monetary value of the payment event. Represents money received or disbursed, not the amount allocated to one claim or credit. Cash position, allocation validation, accounting and reconciliation. PaymentAllocation distributes receipt payments; a credit-settlement payment settles an explicit customer or supplier credit obligation. Provides source monetary amount. Required.
      - name: currency_id
        type: string
        fk: true
        help: Currency denomination of the payment. Defines interpretation of payment amount. Allocation, exchange-rate selection, bank reconciliation, accounting and reporting. May differ from invoice or credit currency only with explicit ExchangeRate evidence. Establishes source currency. Required.
      - name: payment_method
        type: string
        enum: PaymentPaymentMethod
        help: Mechanism through which payment is executed or received. Describes how money moves rather than which obligation it settles. Execution, bank matching, treasury and reconciliation. Refund or supplier-credit settlement method must satisfy applicable policy. Determines expected settlement evidence. Required.
      - name: value_date
        type: date
        optional: true
        help: Economic effective date of funds under settlement convention. Distinguishes economic cash availability from internal creation time. Cash forecasting, interest, reconciliation and accounting analysis. May differ from paymentDate and bank clearing timestamp. Provides settlement timing context. Optional when no separate value date exists.
      - name: external_reference
        type: string(250)
        optional: true
        help: External remittance, bank, processor or instrument reference. Connects internal payment evidence to external settlement identifier. Bank reconciliation, remittance matching, gateway reconciliation and audit. Does not replace allocations or credit identities. Helps resolve external evidence. Optional.
      - name: payer_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party providing money for a receipt or associated with a disbursement. Identifies source-side party. Customer receipts, refunds, supplier settlements and audit. Optional for aggregated/external settlement. Supplies party context.
      - name: bank_account_id
        type: string
        fk: true
        optional: true
        help: Bank account through which payment is expected to be received or disbursed. Connects payment to internal financial account. Treasury, cash management, execution and reconciliation. Optional for cash or externally managed methods. Provides account context.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: The Supplier this Payment belongs to.
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: The Customer this Payment belongs to.
      - name: cash_position_id
        type: string
        fk: true
        optional: true
        help: The CashPosition this Payment belongs to.
  - name: Supplier
    help: Represents the procurement-facing role of a Party that supplies business inputs and participates in reverse procurement, supplier claims, financial recovery and performance governance. Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific qualification, terms and transaction history. SupplierClaim captures the case; SupplierClaimResolution captures the remedy; downstream transactions execute it; SupplierPerformanceAssessment interprets accumulated evidence for governance. Central to source-to-pay, sourcing, procurement, receiving, supplier returns, quality claims, accounts payable, supplier qualification, recovery and performance management. Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, SupplierReturn, SupplierCreditNote, SupplierDebitNote, SupplierClaim, SupplierClaimResolution, SupplierPerformanceAssessment, Product and PaymentTerm. Supplier qualification/status → PurchaseOrder → GoodsReceipt → Invoice matching → Payment; issue detection → SupplierClaim → SupplierClaimResolution → SupplierReturn and/or SupplierCreditNote/SupplierDebitNote/Payment → reconciliation; periodic evidence aggregation → SupplierPerformanceAssessment → governance/improvement decision. Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence. A supplier's quarterly assessment combines delivery receipts, inspection failures, claims and returns into an approved scorecard. The result informs qualification and improvement decisions while the underlying transactions remain unchanged.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable Supplier role identity. Connects procurement purchase orders receipts invoices payments returns credits claims resolutions and supplier performance. Supplier identifies the role while PartyRole and Party identify the underlying party. Preserves supplier traceability across procure-to-pay reverse procurement claim recovery and performance management. Required for stable supplier history.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: PartyRole backing the Supplier specialization. Navigates to common party identity and role information. Supplier must not duplicate Party identity. Supplies shared party context to procurement and financial workflows. Required for role specialization.
      - name: supplier_code
        type: string(100)
        unique: true
        help: Enterprise supplier business reference. Used on purchase orders receipts invoices returns credits payments claims portals reports and integrations. Distinct from legal name and external registration identifiers. Identifies the supplier across procurement settlement recovery and performance. Required for operational recognition.
      - name: supplier_type
        type: string
        optional: true
        enum: SupplierSupplierType
        help: Classification of supplier relationship. Supports onboarding compliance tax contracting and reporting. Does not replace Party identity classification. Supplies supplier classification to procurement policy. Optional.
      - name: qualification_status
        type: string
        optional: true
        enum: SupplierQualificationStatus
        help: Procurement qualification state. Controls sourcing eligibility and supplier governance. Qualification is distinct from master lifecycle status and may consume SupplierPerformanceAssessment evidence. Gates new procurement commitments while historical transactions remain valid. Optional where supplier qualification is not used.
      - name: payment_terms
        type: string
        optional: true
        help: Default supplier settlement policy. Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting. Transaction or contract terms may override the default. Supplies default payable timing. Optional.
      - name: status
        type: string
        enum: SupplierStatus
        help: Supplier relationship lifecycle state. Controls procurement eligibility. Historical transactions remain valid after state changes. New procurement return claim-resolution and performance workflows must evaluate status. Required for eligibility.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: Identifies the underlying person or organization performing this role. Provides common identity without duplicating Party data. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity. Required because a role cannot exist without a participant.
      - name: role_type
        type: string
        enum: SupplierRoleType
        help: Defines the business capacity in which the Party participates. Determines specialized capabilities, policies, workflows, and validations. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process. Required for contextual participation.
      - name: code
        type: string(100)
        optional: true
        help: Optional business-context identifier for this role instance. Supports operational search, integrations, reports, and legacy references. Identifies the role instance and must not replace Party or specialized role identifiers. Optional when partyRoleId is sufficient.
      - name: valid_from
        type: date
        optional: true
        help: Date from which this role is eligible for ordinary business processing. Used by eligibility and transaction validation. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role. Optional for immediately effective roles.
      - name: valid_to
        type: date
        optional: true
        help: Date after which the role is no longer normally eligible for new business processing. Used by eligibility, renewal, reporting, and expiry workflows. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution. Optional for open-ended roles.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
  - name: PurchaseOrder
    help: Represents the formal commercial procurement commitment between a buying organization and a Supplier. PurchaseOrder establishes what the Supplier is expected to provide; it is not proof that goods arrived or that later returns occurred. Purchasing, supplier management, receiving, warehouse operations, accounts payable, budgeting, inventory planning and analytics. PurchaseRequisition represents internal demand. PurchaseOrder converts approved demand into an external commitment. PurchaseOrderLine specifies the commitment. GoodsReceipt records actual receipt and acceptance. InventoryMovement records stock effects. SupplierReturn reverses eligible fulfillment. Invoice records the supplier claim. SupplierCreditNote records authorized financial reduction. Payment settles claims. Draft, approval, issuance, receipt, return, cancellation and closure are distinct stages. Financial settlement can continue after physical fulfillment or return. PurchaseOrder → GoodsReceipt → acceptance → InventoryMovement; when goods must be returned, eligible receipt → SupplierReturn → InventoryMovement reversal → SupplierCreditNote → payable reconciliation. A depot orders 100 parts, receives 96 and accepts 94. Later, three accepted parts are returned as defective. The original order and receipt remain unchanged; SupplierReturn and its inventory/credit workflows record the reversal.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the purchase order. Used for procurement, receiving, invoice matching, supplier returns, audit and integrations. Identifies the order independently of orderNumber, Supplier, lines, GoodsReceipt and SupplierReturn. Stable root reference across commitment, fulfillment, reversal and closure. Required for procurement traceability.
      - name: order_number
        type: string(100)
        unique: true
        help: Human-facing procurement reference. Used by buyers, suppliers, receiving, accounts payable and integrations. Business reference distinct from technical purchaseOrderId. Correlates procurement activity across systems. Required for operational traceability.
      - name: order_date
        type: datetime
        help: Date and time the procurement commitment is created or issued. Supports chronology, approval, reporting and reconciliation. Distinct from requested delivery, receipt, return, invoice and payment dates. Anchors the commitment lifecycle. Required for chronology.
      - name: status
        type: string
        enum: PurchaseOrderStatus
        help: Lifecycle state of the procurement commitment. Controls authorization, issuance, fulfillment, cancellation and closure. PurchaseOrder status does not prove physical receipt, supplier return or invoice settlement; those are separate facts. Being prepared. Internally authorized. Communicated to Supplier. Some committed quantity accepted while outstanding fulfillment remains. Required fulfillment accepted under policy. Remaining commitment terminated. Required operational and financial processing complete.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Currency qualifying order monetary values. Used for pricing, totals, invoice matching, supplier credit calculation and financial reporting. Qualifies amounts and does not identify Supplier or Product.
      - name: requested_delivery_date
        type: date
        optional: true
        help: Buyer's requested delivery or completion date. Used for supplier communication and fulfillment planning. A request, not proof of actual receipt or return. Supports delivery planning.
      - name: total_amount
        type: decimal
        optional: true
        help: Order-level value derived from committed lines and commercial adjustments. Used for approval, budget, supplier commitment and invoice reconciliation. Must reconcile with PurchaseOrderLine values and currencyId.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier receiving the procurement commitment. Drives sourcing, delivery, receiving, supplier performance, returns and accounts payable. GoodsReceipt and SupplierReturn supplier should normally match this supplier.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Buying organization responsible for the commitment. Supports authorization, legal entity, budget, tax and reporting.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Intended operational destination for ordered goods or services. Used for receiving and logistics planning.
  - name: Customer
    help: Represents the commercial customer role of a Party. Party identifies who the party is; PartyRole establishes a role; Customer governs buyer-specific commercial behavior and controls. Central to sales order-to-cash, pricing, billing, receivables, collections, service, and customer analytics. Customer connects to SalesOrder, Invoice, Payment, PaymentAllocation through those transaction entities while retaining the underlying Party identity. Customer onboarding → eligibility/credit → SalesOrder → fulfillment → Invoice → Payment → PaymentAllocation → receivables settlement. Customer status constrains new activity but does not replace transaction evidence or rewrite history. Onboard → active → inactive/blocked → retired. Future eligibility changes do not invalidate historical relationships. A Party may simultaneously act as Customer and Supplier. Both roles reference the same Party identity while maintaining separate commercial controls and histories.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identifier for the Customer business relationship. Used by orders invoices receivables service pricing credit contracts and analytics. Party identifies the underlying party while customerId identifies the customer relationship. Provides the stable customer reference carried into SalesOrder Invoice Payment shipment service and receivables workflows. Required for unambiguous customer transaction traceability.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: Links Customer to its underlying PartyRole. Resolves common party identity and role information. Customer is a role specialization and must not duplicate Party identity. Supplies common party context to customer-facing workflows. Required because Customer depends on PartyRole.
      - name: customer_code
        type: string(100)
        unique: true
        help: Human-facing customer business code. Used in orders invoices statements integrations and communication. Distinct from customerId and external legal identifiers. Supports customer selection and transaction recognition. Required for operational identification.
      - name: customer_type
        type: string
        optional: true
        enum: CustomerCustomerType
        help: Commercial classification of the customer relationship. Supports pricing credit tax service and reporting. Does not replace Party partyType. Supplies customer classification to transaction policy. Optional when not needed.
      - name: credit_status
        type: string
        optional: true
        enum: CustomerCreditStatus
        help: Current credit-control disposition. Used by order authorization receivables collections and credit review. Credit control affects exposure and does not alter party identity. SalesOrder confirmation must evaluate current credit policy when applicable. Optional where credit controls are not used.
      - name: credit_limit
        type: Money
        optional: true
        help: Authorized monetary credit exposure limit. Used in credit checks exposure monitoring and risk reporting. Must be interpreted with currency outstanding exposure payment terms and credit status. Provides one input to credit authorization before additional exposure. Optional for cash-only customers.
      - name: payment_terms
        type: string
        optional: true
        help: Default settlement policy for customer invoices. Used by SalesOrder Invoice receivables collections and cash forecasting. May be overridden by authorized contract or transaction-level terms. Supplies default due-date expectations to order and invoice creation. Optional when determined elsewhere.
      - name: status
        type: string
        enum: CustomerStatus
        help: Lifecycle state of the customer relationship. Controls eligibility for new commercial activity. Historical transactions remain attributable after status changes. New workflows must evaluate status; historical records remain valid. Required for eligibility decisions.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: Identifies the underlying person or organization performing this role. Provides common identity without duplicating Party data. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity. Required because a role cannot exist without a participant.
      - name: role_type
        type: string
        enum: CustomerRoleType
        help: Defines the business capacity in which the Party participates. Determines specialized capabilities, policies, workflows, and validations. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process. Required for contextual participation.
      - name: code
        type: string(100)
        optional: true
        help: Optional business-context identifier for this role instance. Supports operational search, integrations, reports, and legacy references. Identifies the role instance and must not replace Party or specialized role identifiers. Optional when partyRoleId is sufficient.
      - name: valid_from
        type: date
        optional: true
        help: Date from which this role is eligible for ordinary business processing. Used by eligibility and transaction validation. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role. Optional for immediately effective roles.
      - name: valid_to
        type: date
        optional: true
        help: Date after which the role is no longer normally eligible for new business processing. Used by eligibility, renewal, reporting, and expiry workflows. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution. Optional for open-ended roles.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
      - name: tax_rule_id
        type: string
        fk: true
        optional: true
        help: The TaxRule this Customer belongs to.
  - name: SalesOrder
    help: Represents the commercial customer commitment from which fulfillment and financial processes derive work. SalesOrder establishes accepted demand; it does not itself move inventory, prove shipment, or prove payment. Order management, allocation, inventory, warehouse execution, transportation, invoicing, customer service and revenue processes. Customer supplies commercial context, SalesOrderLine supplies demand detail, InventoryReservation supplies committed stock, InventoryMovement supplies stock execution, Shipment supplies transport evidence, and Invoice supplies financial claim evidence. Confirmed order → validation → availability check → reservation/allocation → pick/issue → Shipment → delivery/acceptance evidence → SalesOrderLine fulfillment → order status. Invoice is generated according to billing policy and remains independent evidence. Cancellation releases remaining reservations and stops new work while preserving historical downstream effects. Draft → confirmed → allocated → partially fulfilled → fulfilled, with cancellation of remaining demand and controlled exception/recovery paths. Entity changes must propagate through affected dependent workflows rather than directly mutating derived states. Line fulfillment changes recalculate order status; reservation changes affect allocation state; shipment events contribute fulfillment evidence; billing changes do not independently determine fulfillment. Allocation, fulfillment, cancellation and status transitions require concurrency control and idempotency to prevent double reservation, double fulfillment or contradictory terminal states. An order for 20 units reserves 20, ships 12, and becomes PARTIALLY_FULFILLED from accepted fulfillment evidence. The remaining 8 stay executable. A cancellation then releases the remaining reservation and terminates the open demand without reversing the already accepted 12-unit fulfillment.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: order_number
        type: string(100)
        unique: true
      - name: order_date
        type: datetime
      - name: status
        type: string
        enum: SalesOrderStatus
        help: Order-level lifecycle state controlling commercial and fulfillment permissions. Drives confirmation, allocation, fulfillment, shipment readiness and cancellation. Summarizes downstream evidence; it is not an independent source of fulfillment quantity. Status transitions are validated against line, reservation, shipment and fulfillment evidence.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
      - name: requested_delivery_date
        type: date
        optional: true
      - name: total_amount
        type: decimal
        optional: true
      - name: customer_id
        type: string
        fk: true
        help: The Customer this SalesOrder refers to.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The Organization this SalesOrder refers to.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: The Location this SalesOrder refers to.
  - name: Budget
    help: Governed financial planning baseline. Budget records intended/authorized financial amounts while JournalEntry records actual accounting. Planning, spending control and variance reporting. BudgetLine supplies dimensional detail; FiscalPeriod supplies accounting time; Scenario supplies planning assumptions. Draft to submitted to approved/active to superseded/closed.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable budget identity. Identifies one financial plan version. Planning, approval, control and reporting. Owns BudgetLines and references planning context. Required.
      - name: code
        type: string(100)
        help: Business budget code. Human/integration reference for plan. Planning and reporting. Unique within organization/version policy. Required.
      - name: status
        type: string
        enum: BudgetStatus
        help: Budget governance state. Controls editability and authoritative planning use. Approval and control. Actual accounting remains in JournalEntry. Editable proposal. Awaiting approval. Authorized plan. Current control baseline. Replaced by later plan. Planning cycle ended. Required.
        default: DRAFT
      - name: organization_id
        type: string
        fk: true
        help: Organization owning budget. Defines planning boundary. Planning and reporting. Exactly one Organization. Accounting dimensions must belong to compatible context.
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: Fiscal period governed by budget. Aligns plan with accounting time. Budget control and variance. Optional when budget spans multiple periods represented by lines. Does not open/close accounting period.
      - name: scenario_id
        type: string
        fk: true
        optional: true
        help: Planning scenario represented. Distinguishes baseline/upside/downside etc. Comparative planning. Optional for single-scenario plans. Scenario never changes actual ledger.
  - name: BudgetLine
    help: Detailed dimensional budget allocation. Defines planned money at an account/responsibility intersection. Budgeting and variance analysis. Budget governs; Account/CostCenter/ProfitCenter classify.
    parent: Budget
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable line identity. Identifies one dimensional allocation. Budget control and variance. Belongs to Budget. Required.
      - name: amount
        type: Money
        help: Planned monetary amount. Financial target/limit for dimensions. Planning and variance. Not an actual ledger balance. Required.
      - name: budget_id
        type: string
        fk: true
        help: Parent financial plan. Supplies governance/version context. Planning. Exactly one Budget. Line lifecycle follows budget governance.
      - name: account_id
        type: string
        fk: true
        optional: true
        help: Financial account dimension. Classifies planned amount. Budget-vs-actual. Optional under non-account planning. Actuals derive from accounting not line mutation.
      - name: cost_center_id
        type: string
        fk: true
        optional: true
        help: Cost responsibility dimension. Allocates plan to cost center. Expense control. Optional. Must be eligible for budget period.
      - name: profit_center_id
        type: string
        fk: true
        optional: true
        help: Profit responsibility dimension. Allocates plan to profit center. Management reporting. Optional. Must be eligible for budget period.
  - name: Forecast
    help: A versioned forward-looking financial projection based on a defined scenario and as-of information, kept separate from approved budgets and actual accounting. Provides planning/management semantics separately from actual accounting evidence. Planning, control, management reporting and analysis. Organization supplies governance; financial transactions remain authoritative for actuals.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable Forecast identity. Identifies the governed Forecast concept independently of labels. Planning, reporting and integration. Referenced by compatible financial planning processes. Required.
      - name: code
        type: string(100)
        help: Governed business code. Human/integration identifier. Planning and reporting. Unique within governing context. Required.
      - name: organization_id
        type: string
        fk: true
        help: Governing organization. Defines management/reporting boundary. Planning and analysis. Exactly one Organization. References must use compatible organization context.
      - name: scenario_id
        type: string
        fk: true
        optional: true
        help: Assumption scenario used by forecast. Identifies planning case. Forecast comparison. Optional. Scenario remains hypothetical.
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: Forecast accounting time bucket. Aligns projection to reporting period. Forecast-vs-actual. Optional for multi-period forecasts. Does not control ledger posting.
  - name: Scenario
    help: Alternative planning assumption context. Separates hypothetical plans from actual outcomes. Budgeting, forecasting and sensitivity analysis. Budget and Forecast may reference it.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable scenario identity. Identifies one planning assumption set. Budget/forecast comparison. Referenced by planning artifacts. Required.
      - name: code
        type: string(100)
        unique: true
        help: Scenario business code. Identifies baseline/upside/downside or named case. Planning and reports. Does not identify actual ledger. Required.
      - name: status
        type: string
        enum: ScenarioStatus
        help: Scenario lifecycle. Controls new planning use. Planning governance. Historical plans retain scenario reference. Being prepared. Available for plans. Closed to new normal use. Required.
  - name: CostCenter
    help: A governed responsibility center used to assign and analyze costs independently of legal-account identity. Provides planning/management semantics separately from actual accounting evidence. Planning, control, management reporting and analysis. Organization supplies governance; financial transactions remain authoritative for actuals.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable CostCenter identity. Identifies the governed CostCenter concept independently of labels. Planning, reporting and integration. Referenced by compatible financial planning processes. Required.
      - name: code
        type: string(100)
        help: Governed business code. Human/integration identifier. Planning and reporting. Unique within governing context. Required.
      - name: organization_id
        type: string
        fk: true
        help: Governing organization. Defines management/reporting boundary. Planning and analysis. Exactly one Organization. References must use compatible organization context.
  - name: ProfitCenter
    help: A governed responsibility center used to analyze revenue, cost, and profitability independently of legal-account identity. Provides planning/management semantics separately from actual accounting evidence. Planning, control, management reporting and analysis. Organization supplies governance; financial transactions remain authoritative for actuals.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable ProfitCenter identity. Identifies the governed ProfitCenter concept independently of labels. Planning, reporting and integration. Referenced by compatible financial planning processes. Required.
      - name: code
        type: string(100)
        help: Governed business code. Human/integration identifier. Planning and reporting. Unique within governing context. Required.
      - name: organization_id
        type: string
        fk: true
        help: Governing organization. Defines management/reporting boundary. Planning and analysis. Exactly one Organization. References must use compatible organization context.
  - name: Variance
    help: A derived comparison between planned, forecast, or actual financial measures for a defined period and dimensional context. Provides planning/management semantics separately from actual accounting evidence. Planning, control, management reporting and analysis. Organization supplies governance; financial transactions remain authoritative for actuals.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable Variance identity. Identifies the governed Variance concept independently of labels. Planning, reporting and integration. Referenced by compatible financial planning processes. Required.
      - name: code
        type: string(100)
        help: Governed business code. Human/integration identifier. Planning and reporting. Unique within governing context. Required.
      - name: organization_id
        type: string
        fk: true
        help: Governing organization. Defines management/reporting boundary. Planning and analysis. Exactly one Organization. References must use compatible organization context.
      - name: budget_id
        type: string
        fk: true
        optional: true
        help: Budget baseline compared. Supplies planned value source. Budget-vs-actual analysis. Optional for forecast-only comparison. Analysis cannot mutate budget.
      - name: forecast_id
        type: string
        fk: true
        optional: true
        help: Forecast baseline compared. Supplies projected value source. Forecast-vs-actual/budget analysis. Optional. Analysis cannot mutate forecast.
  - name: Ledger
    help: A governed accounting book defining the scope in which journal entries are recorded and reported. Provide canonical enterprise semantics for Ledger while keeping planning, operational, financial and evidential responsibilities separated. A governed accounting book defining the scope in which journal entries are recorded and reported. Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows. References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable. Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation. Financial control, tax, billing, subscription management, settlement, reconciliation and audit. Enterprise finance and recurring-revenue operations.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Ledger. Identifies one governed Ledger record. Enterprise processing, integration, reporting and audit. Referenced by compatible domain workflows. Required.
      - name: status
        type: string
        enum: LedgerStatus
        help: Governed lifecycle state. Indicates usability/execution state of Ledger. Workflow and controls. Historical terminal evidence is retained. Being prepared. Effective or executing. Concluded successfully. Terminated without normal completion. Required.
      - name: organization_id
        type: string
        fk: true
        help: Organization owning accounting book. Defines legal/management accounting boundary. Posting and reporting. Exactly one Organization. Journal entries must use compatible organization context.
  - name: FiscalPeriod
    help: Accounting-period control for posting, close and reporting. FiscalPeriod determines whether an accounting date is currently eligible for recognition; it does not replace JournalEntry. General ledger, AP, AR, treasury, assets, inventory accounting, tax and financial close. Organization defines books; JournalEntry carries accounting date; period state controls posting eligibility. Future → open → soft closed → closed → locked, with governed reopen where policy permits. Closing/reopening immediately revalidates pending postings and close processes while preserving already posted history.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable fiscal-period identity. Identifies one accounting control interval independently of its label. Posting, close, reporting and audit. JournalEntry accounting dates resolve to an eligible period. Required.
      - name: code
        type: string(50)
        help: Business period code. Human-facing accounting interval reference such as 2026-09. Journals, close and reports. Unique within organization/calendar context. Required.
      - name: start_date
        type: date
        help: First accounting date in period. Defines lower posting boundary. Period determination. Inclusive with endDate. Required.
      - name: end_date
        type: date
        help: Last accounting date in period. Defines upper posting boundary. Period determination and close. Must not precede startDate. Required.
      - name: status
        type: string
        enum: FiscalPeriodStatus
        help: Posting-control state. Governs permitted accounting recognition and correction. Journal validation and close. Historical posted entries remain immutable. Not yet normally postable. Normal posting allowed. Restricted adjustment posting only. Ordinary posting prohibited. Administratively locked against posting/reopen without exceptional governance. Required.
        default: OPEN
      - name: organization_id
        type: string
        fk: true
        help: Accounting organization owning period. Establishes books/control boundary. Posting and reporting. Exactly one Organization. Journal organization must match.
  - name: InvoiceLine
    help: Represents one immutable financial claim line with reproducible calculation evidence and explicit customer and supplier adjustment references. InvoiceLine is the historical financial result. Current Product, DiscountRule, TaxRule, UOM and pricing master data are inputs to future transactions, not live dependencies of a posted line. CreditNoteLine and SupplierCreditNoteLine record later reductions separately. Billing, accounts payable, accounts receivable, procurement matching, tax, accounting, returns, credit processing, audit and settlement. Invoice provides claim context; Product/UOM identify and measure the billed item; DiscountRule and TaxRule explain policy; pricingEvidence, discountEvidence and taxEvidence preserve transaction-time results; PO/receipt relationships support three-way matching; CreditNoteLine records customer adjustment; SupplierCreditNoteLine records supplier adjustment. Determine transaction price → calculate gross → resolve discount → calculate taxable base → resolve tax → calculate tax → calculate net → snapshot evidence → matching/approval → post. If a customer or supplier return/correction occurs later, determine eligible adjustment → create corresponding credit line → post credit → apply through explicit application evidence. Subsequent master-data changes never rewrite posted history. Draft → calculated → matched/exception → approved → posted. After posting, historical calculation evidence is immutable and corrections use explicit financial documents or adjustments. Changes to Product/UOM/pricing/discount/tax masters require validation of future and open transactions but never silently modify posted InvoiceLines. Changes to procurement commitments, receipts, customer returns, supplier returns or credits can change downstream matching/adjustment eligibility through controlled reconciliation without rewriting the invoice calculation. A purchase invoice line is linked to a PurchaseOrderLine and accepted GoodsReceiptLine. If three received units are later returned to the supplier, SupplierReturnLine and SupplierCreditNoteLine reference this InvoiceLine; the original billed price and tax remain unchanged while the supplier credit is applied separately.
    parent: Invoice
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the original invoice line. Identifies the historical billed detail independently of later credits or corrections. Used for billing, audit, matching, credit and reconciliation. CreditNoteLine and SupplierCreditNoteLine may reference this identity as source evidence. Stable root reference for the line lifecycle. Required for financial traceability.
      - name: line_number
        type: integer
        help: Sequence number within the invoice. Identifies the line for documents and reconciliation. Used in invoice presentation and audit. Unique within Invoice and distinct from CreditNoteLine and SupplierCreditNoteLine numbering. Supports deterministic document reconstruction. Required.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Originally billed quantity. Preserves the historical quantity on the original claim. Used for billing, matching and return eligibility. CustomerReturnLine or SupplierReturnLine may reference eligible quantities and CreditNoteLine or SupplierCreditNoteLine may credit an eligible portion. Provides source quantity evidence. Optional for purely monetary lines.
      - name: unit_price
        type: Money
        optional: true
        help: Transaction-time billed price per unit. Captures the price actually used to value the invoice line, not today's master price. Supports invoice calculation, audit, price variance, settlement and credit calculation. Customer or supplier credit lines may preserve this as source valuation evidence; later pricing changes do not rewrite it. Provides authoritative historical pricing evidence for the invoice line. Optional for non-quantity monetary lines.
      - name: gross_amount
        type: Money
        help: Gross monetary value before line discount and tax. Original calculated value of the billed line. Used for invoice reconciliation and credit evidence. Credit adjustment lines do not mutate this historical amount. Feeds original line calculation. Required.
      - name: discount_amount
        type: Money
        help: Discount originally applied to the line. Historical line-level commercial reduction. Used for reproducibility, tax and credit calculation. Return credits use original discount evidence where policy requires. Contributes to original taxable and net values. Required, including zero.
        default: "0"
      - name: taxable_amount
        type: Money
        help: Original taxable base of the invoice line. Amount subjected to the original tax treatment. Used for tax audit and credit calculation. Credit adjustment tax evidence may derive from this historical treatment. Provides source tax basis. Required.
      - name: tax_amount
        type: Money
        help: Tax originally recognized on the line. Historical tax component of the claim. Used for tax reporting, accounting and credit calculation. A credit line may reverse an eligible portion without editing this amount. Provides source tax evidence. Required, including zero.
        default: "0"
      - name: net_amount
        type: Money
        help: Original net financial value of the line after discount and applicable tax treatment. Historical line contribution to the Invoice total. Used for billing, accounting and credit reference. Credit adjustment lines record a separate reduction rather than changing netAmount. Provides immutable source value. Required.
      - name: pricing_evidence
        type: object
        optional: true
        help: Snapshot of material pricing inputs used to determine the invoice line amount. Preserves source, effective date, and approved commercial context needed to reproduce pricing even when master data changes. Supports audit, dispute resolution, recalculation, credit calculation and integration. Links the invoice result to the effective transaction price without making the posted invoice depend on mutable pricing master data.
      - name: discount_evidence
        type: object
        optional: true
        help: Snapshot of the discount policy inputs and result used on the invoice line. Preserves the applied discount rule/version, method, base, rate or fixed amount, and resulting discount. Supports audit and prevents later DiscountRule changes from altering historical calculations or credits. Provides reproducible discount calculation evidence.
      - name: tax_evidence
        type: object
        optional: true
        help: Snapshot of the tax determination inputs and result used on the invoice line. Preserves tax rule/version, jurisdiction, rate, taxable base, rounding and calculated tax. Supports tax audit, compliance, dispute resolution and credit-note tax calculation. Prevents later TaxRule changes from rewriting posted invoice tax.
      - name: description
        type: string(1000)
        optional: true
        help: Human-readable description of the original billed line. Describes the billed good or service. Used on documents and audit. Complements Product and source transaction references. Supports document presentation. Optional descriptive context.
      - name: matching_status
        type: string
        enum: InvoiceLineMatchingStatus
        help: Procurement matching state of the invoice line. Indicates whether the line agrees with applicable purchase and receipt evidence. Used for accounts payable controls and reconciliation. Independent from CreditNote and SupplierCreditNote status; a credit may correct a posted line after matching. Controls matching approval before posting.
        default: NOT_APPLICABLE
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit in which the original quantity was billed. Defines measurement semantics for the historical quantity. Supports billing, fulfillment and return conversion. Provides source measurement context for eligible credits.
      - name: invoice_id
        type: string
        fk: true
        help: Parent invoice containing the original claim line. Provides financial document context. Supports billing, settlement, adjustment and audit. Parent claim owns the line's historical calculation.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Product or service identified by the original invoice line. Identifies what was billed without making current product master data a live dependency of posted history. Supports billing, fulfillment and return traceability. Supplies source item context.
      - name: purchase_order_line_id
        type: string
        fk: true
        optional: true
        help: Procurement line associated with a purchase invoice line. Connects payable billing to the original procurement commitment. Supports three-way matching and supplier-return traceability. Supplies source procurement evidence.
      - name: sales_order_line_id
        type: string
        fk: true
        optional: true
        help: The SalesOrderLine this InvoiceLine belongs to.
  - name: PaymentAllocation
    help: Provides the controlled bridge between a Payment event and an Invoice claim. Payment says money moved; Invoice says money is owed; PaymentAllocation says exactly how much of that payment satisfies that claim. Central to receivables, payables, collections, payment reconciliation, bank reconciliation, refunds, reallocation, and accounting. Payment supplies source funds. Invoice supplies target obligation. Currency defines denominations. ExchangeRate converts denominations when required. Invoice derives settlement projections from active allocations. Payment received or posted → validate available unapplied amount → select Invoice → compare currencies → select approved ExchangeRate if required → calculate target invoice amount → apply rounding policy → activate PaymentAllocation → update Invoice amountSettled/amountOutstanding/status → reconcile with bank and accounting evidence. Draft allocation → validation → active settlement → optional reversal/cancellation → corrected allocation if needed. Historical allocations are never silently rewritten. A EUR 5,000 Payment is applied to a USD invoice using an approved EUR-to-USD ExchangeRate. paymentAmount remains EUR 5,000, invoiceAmount records the USD claim value satisfied, ExchangeRate preserves the conversion evidence, and any rounding adjustment is explicit. The Invoice is not marked paid until its active allocations satisfy its outstanding amount.
    parent: Payment
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the settlement allocation. Identifies the application of payment value to a claim independently of the Payment and Invoice identities. Used for reconciliation, audit, reversal, reallocation, and settlement projections. Payment identifies money received or sent; Invoice identifies the claim; PaymentAllocation connects the two. Provides the auditable settlement bridge used to derive Invoice amountSettled and amountOutstanding. Required for traceable allocation evidence.
      - name: payment_id
        type: string
        fk: true
        help: Payment from which the allocated settlement amount originates. Identifies the cash or settlement event being applied. Supports payment reconciliation, bank matching, and settlement audit. The allocation cannot create or replace the underlying Payment event. Supplies the source monetary amount and payment currency for allocation. Required to trace settlement to its source.
      - name: invoice_id
        type: string
        fk: true
        help: Invoice claim to which the payment is applied. Identifies the financial obligation being reduced by the allocation. Supports receivables/payables settlement, aging, statements, and reconciliation. The allocation reduces the claim; it does not change the original Invoice total. Supplies the target claim and invoice currency for settlement comparison. Required to identify the settlement target.
      - name: payment_amount
        type: Money
        help: Portion of the Payment amount consumed by this allocation in the Payment currency. Represents how much of the source payment is assigned to this claim. Supports remaining-payment calculation and reconciliation to the Payment. Must use the Payment currency and must not exceed the unapplied source payment amount under policy. Establishes the source-side settlement quantity before any cross-currency conversion. Required for allocation calculation.
      - name: invoice_amount
        type: Money
        help: Amount of the Invoice claim satisfied by this allocation in the Invoice currency. Represents the claim-side effect of the allocation. Drives Invoice amountSettled and amountOutstanding projections. May differ numerically and in currency from paymentAmount when an approved ExchangeRate is used. Supplies the target-side settlement value applied to the claim. Required for deterministic claim settlement.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: Exchange-rate record used when Payment and Invoice currencies differ. Preserves the exact conversion context used to translate payment currency into invoice currency. Supports audit, reconciliation, accounting, and reproducibility of cross-currency settlement. Required for cross-currency allocation and normally absent when currencies are identical. Connects paymentAmount to invoiceAmount through an approved conversion rule. Optional when source and target currencies are identical.
      - name: allocated_at
        type: datetime
        help: Timestamp at which the allocation became effective. Establishes settlement chronology and supports period-sensitive reconciliation. Used for aging, accounting period determination, audit, and dispute investigation. Distinct from Payment creation time and bank clearing time. Determines when the Invoice settlement projection is changed. Required for settlement chronology.
      - name: status
        type: string
        enum: PaymentAllocationStatus
        help: Lifecycle state of the allocation. Indicates whether the allocation currently affects settlement or has been reversed/cancelled. Controls Invoice settlement projections, reconciliation, and audit. Invoice amountSettled must be derived from active allocations rather than every historical allocation record. ACTIVE affects settlement; REVERSED removes the allocation effect through a controlled correction; CANCELLED prevents activation. Required for controlled settlement state.
        default: ACTIVE
      - name: reversal_of_allocation_id
        type: string
        fk: true
        references: PaymentAllocation
        optional: true
        help: Original allocation that this record reverses. Links a correction to the settlement evidence it negates. Supports audit, dispute resolution, reallocation, and accounting correction. A reversal is a new historical event and does not rewrite the original allocation. Enables controlled reversal followed by a corrected allocation. Optional for normal allocations.
      - name: rounding_adjustment
        type: Money
        optional: true
        help: Explicit rounding difference required to reconcile source and target settlement values under the approved conversion and currency precision policy. Represents a controlled rounding effect, not an unexplained difference in payment or invoice value. Used in cross-currency reconciliation and accounting adjustment. Must use an appropriate currency and remain within configured tolerance. Makes small conversion/precision differences explicit and auditable. Optional when no rounding adjustment is required.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this PaymentAllocation belongs to.
  - name: PaymentInstruction
    help: A governed instruction authorizing or requesting a future payment through a bank or payment channel, separate from the resulting Payment and BankTransaction evidence. Provide canonical enterprise semantics for PaymentInstruction while keeping planning, operational, financial and evidential responsibilities separated. A governed instruction authorizing or requesting a future payment through a bank or payment channel, separate from the resulting Payment and BankTransaction evidence. Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows. References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable. Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation. Financial control, tax, billing, subscription management, settlement, reconciliation and audit. Enterprise finance and recurring-revenue operations.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of PaymentInstruction. Identifies one governed PaymentInstruction record. Enterprise processing, integration, reporting and audit. Referenced by compatible domain workflows. Required.
      - name: status
        type: string
        enum: PaymentInstructionStatus
        help: Governed lifecycle state. Indicates usability/execution state of PaymentInstruction. Workflow and controls. Historical terminal evidence is retained. Being prepared. Effective or executing. Concluded successfully. Terminated without normal completion. Required.
      - name: bank_account_id
        type: string
        fk: true
        help: Bank account from/to which payment is instructed. Supplies treasury settlement account. Payment execution. Exactly one BankAccount. Instruction does not itself prove bank settlement.
      - name: payment_id
        type: string
        fk: true
        optional: true
        help: Payment resulting from executed instruction. Connects intent to settlement transaction. Treasury reconciliation. Optional until execution. Retries must not create duplicate Payment.
  - name: CreditNote
    help: Represents an explicit reduction of a customer's financial claim while preserving original invoice, return, accounting, application and refund evidence. CustomerReturn records reverse fulfillment; CreditNote records the financial adjustment; CreditNoteApplication records how it is consumed; Invoice remains the historical claim; JournalEntry records accounting; Payment records any refund cash. Customer returns, accounts receivable, billing corrections, tax adjustments, customer concessions, statements, audit and refunds. CustomerReturnLine provides returned quantity and approved credit basis. InvoiceLine provides original billed evidence. CreditNoteLine captures adjustment detail. CreditNoteApplication connects the adjustment to invoice exposure. JournalEntry records accounting. Payment records refund. Return authorized → received/inspected → disposition approved → credit eligibility calculated → CreditNote draft → approval → accounting determination → post → create CreditNoteApplication against open Invoice or establish refund due → refund Payment if required → reconcile → fully applied/refunded. Original Invoice and Payment history remain immutable. Draft → approved → posted → partially applied/fully applied or refund due → refunded, with cancellation and reversal paths. Changes to return disposition or original invoice evidence trigger revalidation of an unposted credit. Posted credit changes require explicit reversal and replacement. Applications are corrected by reversal/reallocation, and refund payments remain separate evidence. A customer returns five units with approved credit of USD 590. CreditNote is posted for USD 590. A CreditNoteApplication can consume the credit against an open invoice; if no eligible balance exists, the credit becomes refund due and a separate Payment settles it.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the credit note. Identifies the financial adjustment independently of its business number, original invoice, return, accounting entry, application or refund. Used for audit, accounting, customer statements, integrations, reconciliation, tax and reversal workflows. CreditNoteId is the stable system identity; creditNoteNumber is the business-facing reference; the original Invoice remains a separate historical claim. Root reference across preparation, approval, posting, application, reversal, reporting and refund processing. Required.
      - name: credit_note_number
        type: string(100)
        unique: true
        help: Business-facing reference assigned to the credit note. Identifies the adjustment in customer communication, tax documents, statements and finance operations. Used for reconciliation, customer service, reporting, tax and integrations. Distinct from creditNoteId and original Invoice.invoiceNumber. Provides the human-recognizable adjustment reference throughout its lifecycle. Required.
      - name: credit_note_date
        type: date
        help: Commercial and accounting date of the credit adjustment. Establishes the temporal basis for accounting, tax and customer balance treatment. Used for accounting periods, tax reporting, statements and audit. May differ from CustomerReturn returnDate and refund payment date. Anchors the financial adjustment in the applicable accounting and tax period. Required.
      - name: status
        type: string
        enum: CreditNoteStatus
        help: Lifecycle state of the credit adjustment. Indicates preparation, authorization, accounting recognition, application to invoices, customer refund obligation, settlement, cancellation or reversal. Controls approval, posting, application, refund and correction workflows. CreditNote status is independent of Invoice, CustomerReturn, Payment and CreditNoteApplication status. POSTED establishes the financial adjustment; application reduces eligible outstanding receivable; refund states apply when money must be returned. Required.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency in which the credit note is denominated. Defines the monetary denomination of all credit-note amounts. Used for calculation, tax, accounting, invoice application, customer balance and refund processing. Must normally match credited Invoice currency; permitted cross-currency application requires explicit ExchangeRate evidence. Establishes monetary basis for adjustment and application. Required.
      - name: reason_code
        type: string(100)
        help: Controlled business reason for issuing the credit. Explains why customer exposure is reduced. Used for approval, policy, analytics, tax, audit and customer communication. Return reason and financial credit reason may differ. Determines applicable approval, calculation, tax and posting policy. Required.
      - name: subtotal
        type: Money
        help: Aggregate credit value before document-level tax and adjustments. Sum of credit-note line bases after applicable line pricing treatment. Used for tax, reconciliation, accounting and reporting. Must reconcile with CreditNoteLine amounts and original transaction evidence. Feeds taxable amount and total credit calculation. Required.
      - name: tax_amount
        type: Money
        help: Tax component reversed or credited by the adjustment. Represents tax reduction associated with credited transaction. Used for tax reporting, accounting and reconciliation. Must reconcile with CreditNoteLine tax evidence and original InvoiceLine treatment where applicable. Contributes to total adjustment. Required, including zero.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total monetary reduction represented by the credit note. Amount by which eligible customer exposure is reduced before application or refund settlement. Used for receivable adjustment, statements, tax, accounting, application and refund decisions. Not itself a cash refund; refund requires a separate Payment event. Maximum amount that can be applied or refunded under policy. Required.
      - name: amount_applied
        type: Money
        help: Portion of the posted credit note already applied to eligible invoice balances. Represents non-cash use of the credit to reduce receivable exposure. Used for application status, statements and remaining credit calculation. Must reconcile with active CreditNoteApplication records. Changes through controlled application or reversal workflows. Required as a settlement projection.
        default: '{"amount":0}'
      - name: amount_refunded
        type: Money
        help: Portion of the credit actually paid back to the customer. Represents cash settlement of customer credit. Used for refund reconciliation, customer balance and audit. Must reconcile with refund Payment evidence. Changes only after an authorized refund Payment is posted and linked. Required as a refund projection.
        default: '{"amount":0}'
      - name: amount_remaining
        type: Money
        help: Unapplied and unrefunded portion of the posted credit. Represents remaining customer credit exposure available for application or refund. Drives application, refund and reconciliation decisions. Reconciles totalAmount against active application and refund evidence. Determines whether further application or refund is permitted. Required.
        default: '{"amount":0}'
      - name: customer_id
        type: string
        fk: true
        help: Customer whose financial exposure is reduced. Identifies party receiving financial benefit. Supports statements, receivables, approval, tax, refund and audit. Provides customer eligibility and settlement context.
  - name: CreditNoteLine
    help: Represents one auditable financial adjustment detail and its source evidence. CreditNoteLine translates an eligible original invoice or return into a specific credited value while preserving historical source facts. Return credits, billing corrections, tax adjustments, customer concessions and audit. InvoiceLine is the original financial evidence; CustomerReturnLine is the reverse-fulfillment evidence; CreditNoteLine is the new financial result. Validate source → determine eligible quantity/value → apply return and pricing/tax policy → snapshot evidence → calculate line credit → approve → post through CreditNote. Corrections use reversal/replacement. Draft → calculated → approved → posted, with controlled reversal after posting. Three returned units are eligible for credit at the original transaction value. CreditNoteLine records quantity 3, preserves the source InvoiceLine and CustomerReturnLine, recalculates applicable tax, and contributes its total to CreditNote without changing the original invoice line.
    parent: CreditNote
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the credit-note line. Identifies one financial adjustment detail independently of its source invoice or return. Used for accounting, audit, reconciliation, tax and correction workflows. Links the line to CreditNote while preserving distinct source InvoiceLine and CustomerReturnLine identities. Stable reference for calculation, posting and reversal. Required for traceability.
      - name: line_number
        type: integer
        help: Business sequence number within the CreditNote. Orders the adjustment details for document presentation and audit. Used for documents, reconciliation and integrations. Unique within the parent CreditNote and independent of original InvoiceLine.lineNumber. Supports deterministic document reconstruction. Required for line identification.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Quantity being financially credited when the adjustment is quantity-based. Represents the credited quantity, which may be less than or equal to the returned quantity or originally billed quantity. Used for return credits, quantity corrections and reconciliation. Must reconcile with eligible source InvoiceLine and CustomerReturnLine quantities. Feeds line valuation where credit is quantity-derived. Optional for purely monetary corrections.
      - name: unit_price
        type: Money
        optional: true
        help: Transaction-time unit value used to calculate the credit where applicable. Preserves the original or policy-approved value rather than using mutable current pricing. Supports reproducibility, dispute resolution and audit. Should reconcile with source InvoiceLine pricing evidence or authorized return-credit policy. Supplies valuation evidence for quantity-based credits. Optional for fixed monetary adjustments.
      - name: subtotal
        type: Money
        help: Pre-tax monetary credit represented by this line. The line's financial base before credited tax. Used for CreditNote calculation, accounting and reconciliation. Must reconcile with quantity, unitPrice, discounts and source evidence where applicable. Feeds taxable amount and total line credit. Required for deterministic financial calculation.
      - name: discount_amount
        type: Money
        help: Discount component included in determining the credited line value. Preserves the applicable discount treatment from the original transaction or return policy. Used for reconciliation and tax calculation. Must not be confused with a new settlement discount. Determines the credited taxable base according to policy. Required, including zero when no discount applies.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: Taxable base of the credited line. Amount to which applicable tax treatment is applied for the credit. Used for tax reporting and accounting. Must reconcile with original InvoiceLine tax treatment or authorized correction policy. Feeds credited tax calculation. Required for tax determinism.
      - name: tax_amount
        type: Money
        help: Tax amount reversed or credited on this line. Represents the tax consequence of the credited value. Used for tax reporting, accounting and reconciliation. Must reconcile with applicable TaxRule and source invoice tax evidence. Contributes to the line's total credit. Required, including zero when no tax applies.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total credit represented by this line including applicable tax. Financial reduction attributable to this specific adjustment detail. Aggregated into CreditNote.totalAmount and used for accounting/application. Does not mutate the original InvoiceLine amount. Provides authoritative line contribution to the CreditNote total. Required for document reconciliation.
      - name: pricing_evidence
        type: object
        optional: true
        help: Snapshot of material valuation inputs used for the credited amount. Preserves original price, source, effective date or authorized override required to reproduce the credit. Supports audit and dispute resolution. Connects valuation to original InvoiceLine evidence without making the credit depend on current price master data. Provides historical calculation evidence.
      - name: tax_evidence
        type: object
        optional: true
        help: Snapshot of material tax inputs used to determine credited tax. Preserves tax rule/version, jurisdiction, rate, base and rounding used for the adjustment. Supports tax audit and historical reproducibility. Should reconcile with source InvoiceLine tax evidence and applicable correction policy. Supports deterministic tax calculation and posting.
      - name: invoice_line_id
        type: string
        fk: true
        optional: true
        help: Original billed line from which the credit is derived or corrected. Preserves the financial claim basis without modifying its historical values. Supports return credit, billing correction, tax correction and audit. Supplies eligible quantity, price, discount and tax evidence.
      - name: credit_note_id
        type: string
        fk: true
        help: Parent financial adjustment document containing this line. Establishes the document context for the adjustment detail. Supports aggregation, approval, posting and audit. Line totals feed the parent CreditNote totals and lifecycle.
  - name: CreditNoteApplication
    help: Provides the auditable bridge by which a posted customer CreditNote is consumed against an Invoice. CreditNote establishes the authorized financial reduction; Invoice remains the original claim; CreditNoteApplication records exactly where and how much of the credit was used. Receivables, customer statements, returns, billing corrections, tax, reconciliation, audit and refund-versus-application decisions. CreditNoteLine explains source credit detail; InvoiceLine explains original claim detail; this entity records header-level application evidence; JournalEntry records accounting recognition; Payment records any separate refund. CreditNote posted → select eligible Invoice → validate remaining credit and invoice exposure → currency/rate validation → activate application → update CreditNote amountApplied/amountRemaining and Invoice amountCredited/amountOutstanding/status → reverse and reallocate when required. Draft → active → reversed/cancelled. Historical applications are retained. Changes to posted CreditNote or Invoice never rewrite an application; corrections use reversal and replacement applications. A posted USD 590 CreditNote is applied to a USD 590 open invoice. The application consumes USD 590 of available credit and reduces the invoice exposure by USD 590. If applied incorrectly, the application is reversed and a new application is created.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the credit application. Identifies one controlled application independently of the CreditNote and Invoice. Used for reconciliation, audit, reversal and settlement projections. CreditNote supplies the adjustment; Invoice supplies the claim; this entity records the application bridge. Stable reference for applying and reversing customer credit. Required for traceability.
      - name: credit_note_amount
        type: Money
        help: Portion of the CreditNote consumed by this application. Represents the source-side amount of credit allocated to an invoice. Controls remaining unapplied credit and reconciliation. Must use the CreditNote currency. Establishes the amount consumed from the credit. Required.
      - name: invoice_amount
        type: Money
        help: Amount by which the Invoice claim is reduced by this application. Represents the target-side financial effect on the invoice. Drives Invoice amountCredited and amountOutstanding. Must use the Invoice currency and may differ from creditNoteAmount only under governed exchange-rate treatment. Supplies the claim-side adjustment. Required.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: Exchange rate used when CreditNote and Invoice currencies differ. Preserves conversion evidence for cross-currency credit application. Supports audit and reproducibility. Required for permitted cross-currency applications. Connects source credit value to target invoice value. Optional when currencies are identical.
      - name: applied_at
        type: datetime
        help: Timestamp when the application became effective. Establishes adjustment chronology. Supports accounting periods, statements, audit and reconciliation. Distinct from CreditNoteDate and InvoiceDate. Determines when the Invoice credit projection changes. Required.
      - name: status
        type: string
        enum: CreditNoteApplicationStatus
        help: Lifecycle state of the application. Indicates whether the application currently reduces the invoice. Controls credit and invoice projections. CreditNote and Invoice statuses remain independent historical facts. ACTIVE creates the application effect; reversal removes it through a compensating event. Required.
        default: ACTIVE
      - name: reversal_of_application_id
        type: string
        fk: true
        references: CreditNoteApplication
        optional: true
        help: Prior application reversed by this record. Links correction to the original adjustment application. Supports audit and controlled reallocation. Reversal is a new historical event and does not edit the original. Enables correction while preserving history. Optional for normal applications.
      - name: credit_note_id
        type: string
        fk: true
        help: Customer credit note supplying the adjustment. Identifies the authorized financial credit being consumed. Supports credit lifecycle and reconciliation. Exactly one CreditNote supplies each application. Supplies available credit and currency context.
      - name: invoice_id
        type: string
        fk: true
        help: Invoice receiving the financial reduction. Identifies the claim whose outstanding exposure is reduced. Supports receivables and statements. Exactly one Invoice is targeted. Supplies eligible outstanding exposure and currency context.
