        help: Captures the business meaning of account type for the Account. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating Account records, where applicable. Its meaning is specific to Account; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the asset state or classification in the context of Account. Represents the liability state or classification in the context of Account. Represents the equity state or classification in the context of Account. Represents the revenue state or classification in the context of Account. Represents the expense state or classification in the context of Account. Represents the contra state or classification in the context of Account. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
