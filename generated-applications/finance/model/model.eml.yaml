        help: Effective timestamp of position. Defines evidence cutoff. Intraday/end-of-day liquidity. Transactions after cutoff are excluded. Required.
      - name: ledger_balance
        type: Money
        help: Account balance recognized at cutoff under position policy. Baseline cash amount. Treasury reporting. Must be reproducible from authoritative evidence. Required.
      - name: available_balance
        type: Money
        help: Cash considered available for use at cutoff. Liquidity available after restrictions/pending effects under policy. Funding and payment decisions. Currency must match account/position currency. Required.
      - name: forecast_balance
        type: Money
        optional: true
        help: Projected cash after included future inflows/outflows. Forward liquidity estimate, not posted cash. Treasury planning. Must identify forecast policy/horizon externally or through consuming process. Optional when no forecast is calculated.
      - name: bank_account_id
        type: string
        fk: true
        help: Bank account positioned. Defines cash account context. Treasury and reconciliation. Exactly one BankAccount. Account status/currency constrain calculation.
  - name: Interest
    help: A governed interest accrual or charge calculated for an eligible financial balance, rate basis, and period. Provide canonical enterprise semantics for Interest. A governed interest accrual or charge calculated for an eligible financial balance, rate basis, and period. Used in asset, maintenance, treasury, banking, credit-risk, accounting, integration, and audit workflows where applicable. Connects operational or financial lifecycle evidence to canonical masters while keeping accounting, bank, and physical records authoritative in their own domains. Created under governed conditions, progressed or finalized with audit history, and corrected through explicit subsequent evidence. Asset lifecycle, maintenance, treasury operations, bank reconciliation, lending, accounting, reporting, and audit. Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
