  - name: TaxRule
    help: Defines reusable tax policy used to determine tax treatment and calculate tax amounts. TaxRule is policy; transaction tax evidence records what tax was actually determined and charged. Sales, procurement, invoicing, tax reporting, accounting and compliance. Discount determination normally establishes the post-discount base. Product, Customer, Organization, Location, transaction date and jurisdiction determine TaxRule applicability. InvoiceLine or TaxLine records the resulting tax. Gross amount → discount → taxable base → resolve effective TaxRule → calculate tax → round → snapshot tax evidence → invoice total → accounting/tax reporting. Policy changes trigger revalidation of eligible open transactions, not retroactive mutation. Draft → active for an effective period → inactive/retired. Future transactions respect lifecycle; historical tax calculations remain reproducible. Rate changes affect future determination and eligible open transactions; jurisdiction/scope changes trigger affected transaction validation; status changes prevent future selection; issued tax evidence remains unchanged. A taxable USD 900 post-discount base is subject to an 18% GST rule, producing USD 162 tax. If the rule later changes to 20%, the existing issued invoice retains USD 162 unless a legally authorized correction process creates a new tax document.
