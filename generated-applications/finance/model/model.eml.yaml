    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the country record, independent of its ISO codes. Generated when the country is loaded; addresses, states and cities refer to the country through it.
      - name: code
        type: string(2)
        unique: true
        help: The two-letter ISO 3166-1 code, such as US or DE. Search, integration and reporting; stored on nothing else, because records point at the country itself. Unique; a state or province and a city belong to a country through it.
      - name: alpha3
        type: string(3)
        optional: true
        help: The three-letter ISO 3166-1 code, such as USA or DEU. Trade and customs documents, which use the long form. Unique among countries.
      - name: numeric_code
        type: string(3)
        optional: true
        help: The three-digit ISO 3166-1 numeric code, such as 840. Banking and statistical exchange formats. Unique among countries.
      - name: name
        type: string(300)
        help: The country's short name in English. Shown in lists, on addresses and on reports. Does not replace the code as the stable key.
      - name: phone_code
        type: string(20)
        optional: true
        help: The international dialling prefix for the country, held without the plus sign, such as 44 or 1. Used to validate and format telephone numbers entered against addresses and contacts, so the same number reads the same everywhere. Belongs to the country; several countries can share a prefix.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The currency the country mainly uses. Chosen from the currency list; used to suggest a currency on records for the country. A country has at most one main currency; a currency can be the main one of many countries. Lets a default currency follow the country chosen on an address.
  - name: StateProvince
    help: A first-level division of a country, such as a state, province or region, from the ISO 3166-2 registry. States and provinces give addresses a standard, checkable subdivision. Choosing from this list avoids misspelt regions and lets reports group by region. Maintained as reference data; chosen in addresses; read by tax, shipping and reports. A state or province belongs to one country and contains cities. Entries are loaded from the standard and rarely change; when a division is abolished it is withdrawn without deleting history. "California" belongs to the United States and contains cities such as Los Angeles. Chosen from the list wherever a record needs a place, code or currency; maintained by an administrator when a registry changes.
