  - name: AssetDepreciation
    help: Represents the financial measurement of how an Asset's depreciable value is consumed over time or usage. AssetDepreciation translates an asset's economic consumption into an accounting measure. It is not a description of physical condition; an asset can be heavily depreciated while remaining operational, or have a high book value while requiring significant repair. Used by fixed-asset accounting, period close, financial reporting, asset valuation, disposal analysis, budgeting, management reporting, and repair/disposition economics. Asset identifies the resource. AssetDepreciation supplies the accounting method and resulting financial measures. RepairEstimate may compare estimated repair cost or sale value against net book value, but those are different business concepts. MaintenanceWorkOrder captures physical work and actual maintenance execution; depreciation captures accounting consumption. A depreciation schedule begins when an asset becomes subject to the applicable accounting policy, accumulates depreciation through accounting periods or usage, may be revised after approved accounting changes, and ends or is settled when the asset is disposed, retired, fully depreciated, or otherwise removed from the relevant accounting basis. A container acquired for 10,000 units of currency has a defined salvage value and useful life. Under STRAIGHT depreciation, its depreciable base is allocated over the useful life. A RepairEstimate later evaluates a 3,000-unit repair against its net book value and expected sale value; the depreciation record provides the accounting baseline but does not determine the repair decision by itself.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the depreciation record or schedule. Used to trace depreciation calculations, accounting periods, revisions, reporting, and financial integrations. Identifies the depreciation record; Asset identifies the resource being measured and the schedule's parameters determine how depreciation is calculated. Required so financial history can be traced without relying on calculation values.
      - name: depreciation_method
        type: string
        enum: AssetDepreciationDepreciationMethod
        help: Defines the mathematical or business method used to allocate an asset's depreciable value over its useful life or usage. Drives depreciation calculations, period expense, net book value, forecasting, and financial reporting. The method must be interpreted together with depreciableBase, salvageValue, usefulLifeMonths, usage metrics, and the accounting policy governing the Asset. Allocates depreciable value systematically over the defined useful life, normally producing an approximately even periodic depreciation amount. Calculates depreciation using the asset's remaining depreciable value and remaining useful life under the organization's remaining-life policy. Applies a declining-balance approach in which depreciation is calculated at a defined rate against an appropriate declining carrying base. Allocates depreciation based on usage units or output relative to the expected total units, appropriate where consumption rather than elapsed time drives asset value reduction. Required because the same asset can produce materially different book values under different accounting methods.
      - name: depreciation_rate
        type: decimal
        optional: true
        help: The rate used by applicable depreciation methods to calculate the portion of the depreciable base recognized during a period. Used by declining-balance or other rate-driven calculations and for financial forecasting. Rate is method-dependent; it must not be interpreted as a universal percentage independent of depreciationMethod. Optional for methods where rate is derived from useful life or usage rather than directly supplied.
      - name: salvage_value
        type: decimal
        optional: true
        help: The expected residual value that the asset's carrying amount should generally not depreciate below under the applicable accounting policy. Used to determine the depreciable base, depreciation limits, disposal analysis, and residual-value reporting. Salvage value is an accounting assumption and is distinct from current market sale value or an estimated sale amount in a RepairEstimate. Optional where policy assumes zero residual value or the value is maintained elsewhere.
      - name: useful_life_months
        type: integer
        optional: true
        help: The expected number of months over which the asset's depreciable value is allocated under a time-based depreciation policy. Used for straight-line and remaining-life calculations, asset planning, forecasting, and depreciation schedules. Useful life is an accounting assumption about consumption of economic benefit and is not necessarily the physical service life or maintenance interval. Optional for usage-based methods or where useful life is derived from another policy.
        min: 0
      - name: depreciable_base
        type: decimal
        optional: true
        help: The portion of the asset's value subject to depreciation after considering the applicable acquisition basis and residual-value rules. Provides the financial basis from which depreciation expense is calculated. It is related to Asset acquisition cost and salvage value but may differ because capitalization, impairment, revaluation, or accounting adjustments can change the depreciable basis. Optional when the base is calculated dynamically from other financial records.
      - name: accumulated_depreciation
        type: decimal
        help: The cumulative depreciation recognized against the asset under this schedule up to the relevant accounting point. Used to determine carrying value, period depreciation, disposal gain or loss, and financial reporting. It is an accumulated financial measure and should not be confused with physical wear, repair cost, or market-value reduction. Required with zero as the initial value so an asset with no depreciation recognized has an explicit financial state.
        default: "0"
      - name: net_book_value
        type: decimal
        optional: true
        help: The asset's carrying amount after recognized depreciation and other applicable accounting adjustments under this schedule. Used for balance-sheet reporting, disposal analysis, impairment assessment, management reporting, and asset valuation. Net book value is an accounting measure and should not be interpreted as market sale value, repair-adjusted value, or predicted disposition value. Optional when carrying value is calculated on demand from the asset's accounting history rather than stored.
      - name: asset_id
        type: string
        fk: true
        help: Identifies the individual Asset whose financial depreciation is being measured. Connects depreciation calculations to the asset's acquisition, lifecycle, ownership, maintenance, and disposal history. Exactly one Asset is measured by a depreciation record. Asset is the physical/accountable resource; AssetDepreciation is the financial measurement of that resource.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized product or equipment definition relevant to the depreciated asset. Supports fleet/class-level depreciation analysis, equipment reporting, and policy assignment. Zero or one Product may be linked when depreciation policy is associated with a product class or model. Product describes the reusable model; depreciation remains attached to the individual Asset and its accounting context.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Identifies the currency in which monetary depreciation values are expressed. Used to interpret depreciable base, accumulated depreciation, salvage value, and net book value in financial reporting. Zero or one Currency may be linked when currency is inherited from the accounting ledger or financial context. Currency gives monetary values their denomination and does not define the depreciation method or asset identity.
