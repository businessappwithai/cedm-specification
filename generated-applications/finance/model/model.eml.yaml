  - name: PurchaseOrderLine
    help: Represents one measurable procurement commitment and its accumulated fulfillment, billing and reverse-fulfillment state. PurchaseOrderLine states what the buyer committed to purchase. GoodsReceiptLine records receipt. SupplierReturnLine records subsequent reversal. InvoiceLine records supplier claim. Purchasing, supplier communication, receiving, inventory, supplier returns, accounts payable, budgeting and three-way matching. PurchaseOrder supplies supplier and commercial context; GoodsReceiptLine supplies accepted fulfillment; SupplierReturnLine supplies reverse quantity; SupplierCreditNoteLine supplies financial adjustment. Pricing → commitment → receipt → acceptance → InventoryMovement; if goods are returned, eligible accepted quantity → SupplierReturnLine → InventoryMovement reversal → SupplierCreditNoteLine. Historical commitment remains unchanged. Created → approved/issued → partially/fully received → optionally partially/fully returned → billed/closed according to policy. Historical commercial evidence remains reproducible. A line commits to 100 units, 94 are accepted, and three are later returned. receivedQuantity remains the receipt projection, acceptedQuantity remains accepted fulfillment evidence, returnedQuantity becomes three from posted return events, and the original quantity/price remain unchanged.
    parent: PurchaseOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: unit_price
        type: Money
      - name: line_amount
        type: Money
      - name: received_quantity
        type: decimal
        default: "0"
      - name: accepted_quantity
        type: decimal
        default: "0"
      - name: returned_quantity
        type: decimal
        default: "0"
      - name: outstanding_quantity
        type: decimal
        default: "0"
      - name: price_source
        type: string
        optional: true
        enum: PurchaseOrderLinePriceSource
        help: Source used to determine procurement price. Supports audit, spend analysis and supplier negotiations. Does not replace transaction-time unitPrice. Explains price determination.
      - name: price_determined_at
        type: datetime
        optional: true
        help: Time at which effective purchase price was determined. Supports effective-dated pricing and audit. Distinct from PurchaseOrder creation time. Anchors commercial pricing evidence.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit used to quantify the commitment. Defines how quantity is interpreted. Must reconcile with receiving and return conversions.
      - name: purchase_order_id
        type: string
        fk: true
        help: Parent procurement commitment. Supplies supplier, organization, currency and lifecycle context. Controls commitment and closure.
      - name: product_id
        type: string
        fk: true
        help: Product or item being procured. Identifies what was committed. Must reconcile across receipt, return and invoice evidence.
  - name: SalesOrderLine
    help: Authoritative commercial commitment at product/quantity level, reconciling transaction pricing with allocation, fulfillment and billing evidence. The line states what the customer agreed to buy and how it is priced. Reservations state committed stock, shipment/fulfillment events state what was delivered, and InvoiceLines state what was billed. Order management, allocation, warehouse fulfillment, shipment, invoicing, credit, margin, customer service and audit. SalesOrder supplies customer/currency context; Product/UOM define item and quantity semantics; InventoryReservation supplies allocation evidence; Shipment supplies transport/fulfillment evidence; InvoiceLine supplies financial claim evidence. Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation. Draft → confirmed → allocated → partially fulfilled → fulfilled/cancelled. Historical pricing and fulfillment evidence remain reproducible. quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only. Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing. A line requests 20 units. Twenty are reserved, 12 are shipped and accepted, leaving 8 executable. quantityAllocated and quantityFulfilled are updated from their respective workflows. Cancelling the remaining 8 releases the reservation and cancels open work without reversing the accepted 12.
    parent: SalesOrder
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: line_number
        type: integer
        min: 1
      - name: quantity
        type: decimal
      - name: quantity_fulfilled
        type: decimal
        default: "0"
      - name: quantity_allocated
        type: decimal
        default: "0"
      - name: unit_price
        type: Money
        help: Agreed transaction-time price per unit including currency. Order valuation, invoicing, margin, credit and reconciliation. Must align with SalesOrder currency and UnitOfMeasure pricing basis. Authoritative commercial price for downstream billing unless controlled repricing occurs.
      - name: discount_amount
        type: Money
        optional: true
        help: Approved transaction-time discount amount. Reconciles net commercial value and invoice calculations. Currency must match order pricing currency. Preserves the concession actually granted rather than relying on current DiscountRule.
      - name: tax_amount
        type: Money
        optional: true
        help: Tax determined for the order line when tax is calculated at order stage. Supports order and invoice reconciliation. Determination may depend on Product, Customer, address, location, date and TaxRule. Preserves tax evidence when the order commits to a tax amount.
      - name: line_amount
        type: Money
        help: Calculated commercial value of the line. Supports order totals, invoicing, credit and reporting. Must reconcile with pricing, discount, tax and rounding policy. Financial baseline for downstream billing and reconciliation.
      - name: price_source
        type: string
        optional: true
        enum: SalesOrderLinePriceSource
      - name: price_determined_at
        type: datetime
        optional: true
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The UnitOfMeasure this SalesOrderLine refers to.
      - name: sales_order_id
        type: string
        fk: true
        help: The SalesOrder this SalesOrderLine refers to.
      - name: product_id
        type: string
        fk: true
        help: The Product this SalesOrderLine refers to.
  - name: BankAccount
    help: Represents the controlled banking account context through which cash is received, disbursed, observed, and reconciled. BankAccount is master data for the financial account; it is not a bank transaction, payment, or accounting entry. Central to treasury, Payment execution, BankTransaction ingestion, bank reconciliation, cash reporting, and accounting. Party provides ownership context. Organization provides the financial institution. Payment represents internal settlement events. BankTransaction represents external statement evidence. JournalEntry represents accounting consequences. BankAccount setup → verification → activation → Payment execution/receipt → BankTransaction import → account/date/currency/reference reconciliation → Payment clearing → accounting reconciliation. Account closure affects future activity but preserves historical evidence. Pending → active → blocked or closed. Lifecycle controls future operational use and never deletes historical transactions. A USD current account at a bank is ACTIVE. Customer Payments are received into it, corresponding USD BankTransactions are imported from the bank feed, each is reconciled to the appropriate Payment, and the Payment becomes CLEARED only after controlled matching.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the internal BankAccount master record. Identifies the account independently of its institution, number, currency, or current lifecycle state. Used by Payment, BankTransaction, reconciliation, treasury, accounting, and integrations. The identifier is the CEDM identity; accountNumber is an operational banking identifier. Provides the stable account context for payment execution and statement reconciliation. Required for account traceability.
      - name: account_number
        type: string(100)
        help: Banking identifier for the account, subject to applicable security and masking controls. Identifies the account at the financial institution for operational settlement and reconciliation. Used for payment routing, bank-feed matching, statements, and treasury operations, subject to sensitive-data controls. Must be interpreted with institution and account identity; it is not a CEDM entity identifier. Allows external bank activity and payment instructions to be associated with the correct account. Required where the banking institution provides an account identifier.
      - name: account_type
        type: string
        enum: BankAccountAccountType
        help: Classification of the banking account's operational purpose. Describes how the account is intended to function in treasury and settlement processes. Used for payment eligibility, cash reporting, treasury controls, and accounting configuration. Account type does not determine accounting treatment by itself; ledger configuration may provide additional context. Helps determine which Payment directions and banking operations are appropriate. Operational transaction account normally used for frequent receipts/disbursements. Account primarily maintained for savings or reserve purposes. Account associated with borrowing or loan-related banking arrangements. Account holding funds under controlled escrow arrangements. Controlled account type outside the standard classifications. Required for account governance.
      - name: currency_id
        type: string
        fk: true
        help: Currency in which the bank account is normally denominated. Establishes the account's primary monetary denomination and expected statement currency. Used by Payment, BankTransaction, reconciliation, cash reporting, and treasury controls. A BankTransaction normally uses the account currency, although supported multi-currency bank products may require additional transaction-level currency rules. Provides a currency baseline for validating Payment and BankTransaction activity. Required for monetary account interpretation.
      - name: status
        type: string
        enum: BankAccountStatus
        help: Lifecycle state controlling whether the account can participate in new banking operations. Indicates whether the account is awaiting activation, available, restricted, or closed. Used by Payment execution, bank-feed ingestion, reconciliation, treasury, and account administration. Closing an account must not invalidate historical BankTransactions, Payments, or JournalEntries. ACTIVE permits normal use; BLOCKED prevents applicable new activity; CLOSED prevents new normal use while historical evidence remains accessible. Account setup or verification is incomplete. Available for authorized banking activity. Temporarily prohibited from applicable activity. Permanently unavailable for new normal activity. Required for account lifecycle control.
        default: PENDING
      - name: institution_id
        type: string
        fk: true
        references: Organization
        help: Financial institution maintaining the bank account. Supports bank-feed configuration, payment routing, statements, reconciliation, and institution-specific rules. Exactly one institution maintains the account in this model. Connects account operations to the correct banking organization.
  - name: Asset
    help: Represents the long-lived business object for a durable resource whose identity, ownership, location, maintenance, financial treatment, and lifecycle must be managed over time. Asset is the instance-level concept used when an organization must manage a specific physical or accountable resource rather than merely a product type. A container, vehicle, machine, aircraft, or facility equipment item can be represented as an Asset when individual lifecycle and accountability matter. Used across asset management, maintenance, finance, depreciation, inventory, logistics, leasing, insurance, compliance, and operational planning. Product describes what the asset is as a standardized model. Asset identifies the individual resource. Location describes current operational placement. MaintenanceWorkOrder records maintenance activity. AssetDepreciation records financial measurement. Organization identifies ownership when applicable. Historical movements and transactions should preserve changes rather than overwriting the asset's identity. An asset may be planned before entering service, active during productive use, under maintenance while temporarily unavailable, held pending a business decision, disposed when ownership/control has ended, or retired when operational use has ceased. Lifecycle state should not erase history; it changes how current processes may act on the asset. A shipping container is acquired and assigned an assetNumber and serial/equipment identity. It is linked to a Product model, located at a depot, receives MaintenanceWorkOrder records during its service life, and has AssetDepreciation records for financial reporting. When its repair economics no longer justify continued use, a RepairEstimate may recommend SALE or SCRAP; the resulting disposition changes the asset lifecycle while preserving its historical record.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the asset master record. Used to connect maintenance, depreciation, movements, ownership, location, and other lifecycle records to the same physical or accountable asset. assetId identifies the asset itself; assetNumber and serialNumber are business-facing or manufacturer identifiers and must not replace the stable CEDM identity. Every managed asset requires a stable identity so its operational and financial history remains continuous.
      - name: asset_number
        type: string(100)
        unique: true
        help: The organization-assigned business identifier used to recognize an asset in operational and financial processes. Used by asset managers, maintenance teams, finance, warehouse operations, reports, documents, and users when referring to the asset. It is the organization's business reference, while serialNumber may identify the manufacturer's physical equipment identity and assetId remains the immutable CEDM identity. Required because managed assets need a recognizable organizational identifier.
      - name: name
        type: string(300)
        help: A human-readable description of the asset used to identify it in lists, forms, reports, and operational communication. Supports search, maintenance screens, asset registers, reporting, and user recognition when an asset number alone is insufficient. The name describes this asset instance and should not be confused with Product.name, which describes a reusable product definition or asset type. Required for practical human interpretation of the asset record.
      - name: asset_type
        type: string(100)
        help: Classifies the kind of durable resource represented by the asset, such as container, vehicle, machine, building equipment, or other capital-controlled resource. Drives asset policies, maintenance programs, depreciation treatment, reporting, authorization, and lifecycle rules. assetType classifies the asset instance; Product can provide the standardized model or product definition from which the asset originated. Required because asset lifecycle and financial treatment depend on the type of resource being managed.
      - name: acquisition_date
        type: date
        optional: true
        help: The business date on which the organization acquired or otherwise recognized control of the asset. Used for capitalization, depreciation start rules, asset aging, warranty analysis, lifecycle reporting, and ownership history. AcquisitionDate concerns the organization's acquisition event and is distinct from manufacture date, commissioning date, or first operational use. Optional when the asset predates the available records or acquisition occurred outside the modeled process.
      - name: acquisition_cost
        type: money
        optional: true
        help: The capitalized or recognized cost associated with acquiring the asset under the organization's accounting policy. Used as an input to capitalization, depreciation, book-value calculations, asset valuation, and financial reporting. Acquisition cost is an accounting/business value and should not be confused with Product price, repair cost, sale price, or current market value. Optional for assets whose historical cost is unavailable, immaterial, or maintained in a separate financial system.
      - name: status
        type: string
        enum: AssetStatus
        help: The lifecycle state describing whether the asset is planned, operational, temporarily unavailable, disposed, or retired. Controls operational availability, maintenance eligibility, reporting, depreciation policy, and downstream business actions. Asset status describes the asset's lifecycle, while MaintenanceWorkOrder status describes a particular maintenance activity. An asset can be UNDER_MAINTENANCE while a work order is IN_PROGRESS. The asset is expected to enter service or be recognized operationally but is not yet active. The asset is available for its intended business use subject to normal operational constraints. The asset is temporarily undergoing maintenance and may be unavailable or restricted from normal use. The asset is intentionally retained but is not currently available for normal productive use, often pending inspection, disposition, or another decision. The organization has completed the disposition process and no longer treats the asset as an active managed resource. The asset has been withdrawn from operational use, while historical records may remain available for audit and analysis. Required because asset processes need an authoritative lifecycle state.
        default: ACTIVE
      - name: serial_number
        type: string(200)
        optional: true
        help: The manufacturer or industry identifier permanently associated with the physical equipment when such an identifier exists. Used for equipment traceability, warranty, maintenance history, inspections, recalls, regulatory reporting, and physical identification. SerialNumber identifies physical equipment supplied by a manufacturer; it is different from the organization's assetNumber and CEDM assetId. Optional for assets that are not individually serialized or where the serial identifier is unavailable.
      - name: owner_id
        type: string
        fk: true
        references: Organization
        optional: true
        help: Identifies the organization that legally or commercially owns the asset when ownership is relevant to the asset model. Used for ownership reporting, financial accountability, insurance, maintenance responsibility, leasing, and disposition. Zero or one owner may be recorded because ownership may be external, shared, represented by a separate agreement, or maintained in another system. Owner is an organizational relationship; it is distinct from the Party that currently possesses, leases, operates, or maintains the asset.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Identifies the current operational location at which the asset is recorded or physically situated. Used for maintenance dispatch, inventory visibility, asset tracking, utilization, inspections, and operational planning. Zero or one current location may be recorded when the asset is mobile, in transit, or its location is maintained through a separate movement system. Location is current state; historical movements should be preserved through movement/event entities rather than inferred from a changing location field.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized product or equipment model from which the asset instance was created or classified. Used for technical specifications, spare-parts planning, maintenance standards, procurement, fleet classification, and analytics. Zero or one Product may be linked because not every managed asset has a corresponding product-master definition. Product represents the reusable definition or model; Asset represents the individually managed instance.
  - name: Product
    help: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules. Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts. Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics. Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration. If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(300)
      - name: description
        type: string(4000)
        optional: true
      - name: product_type
        type: string
        enum: ProductProductType
      - name: status
        type: string
        enum: ProductStatus
        default: ACTIVE
      - name: sku
        type: string(100)
        optional: true
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
      - name: standard_price
        type: money
        optional: true
      - name: tax_category
        type: string(100)
        optional: true
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
      - name: tax_rule_id
        type: string
        fk: true
        optional: true
        help: The TaxRule this Product belongs to.
