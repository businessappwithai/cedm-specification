    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the currency master record. Referenced by monetary transactions and financial master data. Identifies the currency definition, not a monetary amount or an exchange-rate observation. Allows Product pricing, SalesOrder, Invoice, Payment, BankTransaction, PaymentAllocation, and accounting records to resolve the same currency.
      - name: code
        type: string(3)
        unique: true
        help: Three-letter business currency code, normally an ISO 4217 code where one exists. Used in documents, APIs, integrations, reports, pricing, banking, and accounting. Code identifies the denomination and is not an exchange rate or amount. Provides the currency identity carried through order, invoice, payment, bank, and ledger workflows.
      - name: name
        type: string(100)
        help: The name of the currency, such as Euro or US Dollar. Used in user interfaces, documents, reports, master-data management, and integrations. Describes the currency identified by code and currencyId. Provides understandable monetary context to business users.
      - name: symbol
        type: string(10)
        optional: true
        help: Common display symbol for the currency. Used in user interfaces, customer documents, reports, and formatted amounts. Presentation metadata; it must not be used as the canonical currency identity. Improves human-readable display without affecting financial calculations.
      - name: decimal_places
        type: integer
        help: Standard number of decimal places normally used when representing amounts in this currency. Used for amount formatting, rounding, validation, invoicing, payment processing, and accounting presentation. Transaction-specific precision or financial-system rules may be stricter; this field does not itself define rounding policy. Supplies a currency-level precision baseline to monetary workflows.
        default: "2"
        min: 0
        max: 6
      - name: status
        type: string
        enum: CurrencyStatus
        help: Available for use on new prices, documents and payments. Temporarily not offered, for example while a market is closed; it can be reactivated. No longer in use, such as a replaced national currency; historical amounts keep it. Controls whether the currency is available for new monetary transactions. Used by pricing, order, invoicing, payment, banking, and accounting validation. Retiring a currency must not invalidate historical transactions expressed in that currency. New transactions should use ACTIVE currencies unless an authorized legacy exception applies.
        default: ACTIVE
  - name: ExchangeRate
    help: Represents an auditable conversion rate between two currencies for a defined time and business purpose. ExchangeRate is the conversion context between Currency denominations; it is not itself money, a payment, or an accounting entry. Used by multi-currency orders, invoices, payments, payment allocations, bank reconciliation, accounting, consolidation, and financial reporting. Currency defines denominations. Money carries amount plus currency. ExchangeRate provides the conversion between two Money values. PaymentAllocation and accounting consume the rate when cross-currency conversion is permitted. Source Money + source Currency → select valid ExchangeRate by rate type/effective time/source → convert → target Money → preserve ExchangeRate reference and rounding result. The selected rate becomes historical evidence of the conversion decision. Rate is created or imported, activated for its validity window, expires or is cancelled, while historical transactions retain the original rate reference. A customer invoice is USD 1,000 and payment is EUR. An approved EUR-to-USD ExchangeRate is selected according to settlement policy. The Payment remains EUR, the Invoice remains USD, PaymentAllocation records the conversion context, and accounting retains the rate used rather than later recalculating the historical settlement.
    icon: list
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the exchange-rate observation or published rate record. Referenced by PaymentAllocation, accounting conversions, reporting, and other multi-currency calculations. Identifies one rate record rather than a currency or monetary amount. Provides auditable linkage from a converted amount back to the rate used.
      - name: from_currency_id
        type: string
        fk: true
        references: Currency
        help: Currency from which an amount is converted. Identifies the source denomination of the monetary amount being converted. Must differ from toCurrency for a meaningful exchange-rate conversion. Identifies the currency of the source Money value in an explicit conversion.
      - name: to_currency_id
        type: string
        fk: true
        references: Currency
        help: Currency into which an amount is converted. Identifies the target denomination of the converted monetary amount. Conversion direction is from fromCurrency to toCurrency; reversing the direction requires an appropriate inverse rate rather than assuming arithmetic equivalence. Identifies the currency of the resulting Money value.
      - name: rate
        type: decimal
        help: Positive conversion factor that expresses how much target currency corresponds to one unit of source currency under this rate convention. Used to calculate converted monetary amounts while preserving the declared direction. Must always be interpreted with fromCurrency, toCurrency, effectiveAt, and rateType. Supplies the mathematical conversion input used by settlement and accounting calculations.
      - name: rate_type
        type: string
        enum: ExchangeRateRateType
        help: The market rate at a moment in time. A rate fixed by agreement with a counterparty. The rate published for a business day. An average or closing rate for a month. A rate set by the finance team for ledger translation. Any other rate defined by policy. Classifies the business purpose and provenance context of the exchange rate. Used to select an appropriate rate according to transaction and accounting policy. Different workflows may require different rate types; a spot rate must not automatically replace a contractual or accounting rate. Controls which rate is eligible for a conversion event.
      - name: effective_at
        type: datetime
        help: Date and time from which the exchange rate is applicable under its rate policy. Used to select the correct rate for a transaction, settlement, or accounting event. A rate without an effective time cannot be reliably reproduced when rates change over time. Supports deterministic selection and audit of the rate used by PaymentAllocation and accounting conversion.
      - name: expires_at
        type: datetime
        optional: true
        help: Optional end of the period during which the rate is valid. Used to prevent application of expired rates. When supplied, expiresAt must be later than effectiveAt. Defines the rate's validity window for transaction and reporting calculations.
      - name: source
        type: string(200)
        help: Identifies the provider or business authority from which the rate was obtained. Used for audit, reconciliation, regulatory reporting, and rate governance. Source identifies provenance; it does not by itself determine which rate is applicable. Allows users and systems to reproduce or validate the conversion decision.
      - name: status
        type: string
        enum: ExchangeRateStatus
        help: Being prepared; not yet used. In force and usable for conversion. Its validity period has ended; kept for past conversions. Withdrawn; must not be used. Lifecycle state of the exchange-rate record. Used by conversion services to determine whether a rate may be applied. Historical calculations retain the rate record even after it expires. Prevents use of draft, cancelled, or expired rates where policy does not permit them.
        default: DRAFT
  - name: UnitOfMeasure
    help: Defines the measurement semantics that make numeric quantities comparable across CEDM workflows. A quantity without a valid unit is incomplete business information. UnitOfMeasure provides the dimension and conversion context needed to interpret quantities correctly. Central to Product, sales, procurement, receiving, inventory, fulfillment, invoicing, manufacturing, logistics, service, and reporting. Product supplies a default measurement context. Transaction lines may use compatible units. GoodsReceiptLine supplies received/accepted quantities. InventoryBalance and InventoryMovement require consistent measurement. InvoiceLine must be comparable for matching. UOM create/update/retire → identify Products and open transaction dependencies → validate conversions → update future eligibility/configuration → revalidate affected SalesOrderLine/PurchaseOrderLine/GoodsReceiptLine/InventoryMovement/InvoiceLine workflows → preserve historical quantity meaning. A conversion change is never a silent retroactive data transformation. Units are created and activated for use, may become inactive, and may eventually be retired. Retirement prevents new normal use but never changes the meaning of historical quantities. A change to code/name/symbol affects presentation and integrations; a change to category/baseUnit/conversionFactor affects quantity semantics and requires dependency validation; a status change affects future transaction eligibility; historical transaction evidence remains immutable. A product is stocked in EACH but purchased in BOX. If one BOX equals 10 EACH, the PO records 5 BOX and inventory posts 50 EACH after conversion. If the BOX conversion changes to 12 EACH, existing PO and receipt quantities are not silently reinterpreted. Open affected transactions must be revalidated or explicitly converted, while historical receipts and invoices retain the original conversion evidence.
    icon: list
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the unit-of-measure definition. Referenced by Product, transaction lines, inventory, and conversion rules. Identifies the measurement definition rather than a quantity value. Allows every quantity-bearing workflow to resolve exactly how a numeric quantity must be interpreted.
      - name: code
        type: string(30)
        unique: true
        help: Standard business code for the unit, such as EACH, KG, L, HOUR, or DAY. Used in forms, integrations, documents, validation, and quantity display. Code identifies the unit definition; it does not represent a conversion or quantity itself. Used to resolve units during order entry, purchasing, receipt, inventory, invoicing, and reporting.
      - name: name
        type: string(100)
        help: Human-readable name of the measurement unit. Used in user interfaces, reports, documents, catalogs, and search. Describes the unit definition identified by code and unitOfMeasureId. Provides understandable measurement context to business users.
      - name: symbol
        type: string(20)
        optional: true
        help: Standard display symbol for the unit. Used for compact display in documents, labels, reports, and interfaces. Symbol is presentation metadata and does not replace the canonical unit code. Improves human-readable representation of quantities.
      - name: category
        type: string
        enum: UnitOfMeasureCategory
        help: A general count or quantity of items. A distance, such as metres or inches. A surface, such as square metres. A capacity, such as litres. A weight, such as kilograms or tonnes. A duration, such as hours or days. A number of discrete things, such as each or dozen. A monetary unit used as a measure. A unit that fits no other category. Defines the dimensional family of the unit. Prevents invalid conversions and supports dimensional validation. Conversion is valid only between compatible dimensions under the applicable conversion model. Used when validating Product, SalesOrderLine, PurchaseOrderLine, GoodsReceiptLine, InvoiceLine, and InventoryMovement quantities.
      - name: conversion_factor
        type: decimal
        optional: true
        help: Default multiplicative factor relating this unit to its base unit when a simple linear conversion applies. Defines a master conversion used for future quantity interpretation. Used for quantity conversion when no context-specific conversion rule overrides the default. Interpreted with baseUnit and category; it must not be changed casually because dependent open transactions may rely on the prior interpretation. Supplies the conversion used by new and eligible future quantity transactions after dependency validation.
      - name: base_unit_id
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
        help: Identifies the canonical base unit against which this derived unit is normally converted. Supports standardized quantity storage and conversion. A derived unit belongs to the same dimensional category as its base unit. Provides the common measurement basis for reconciliation across PO, receipt, inventory, sales, and invoice quantities.
      - name: status
        type: string
        enum: UnitOfMeasureStatus
        help: Available for use on products and documents. Not offered for now; can be reactivated. No longer used; kept for history. A final state. Controls whether the unit can be used for new transactions. Used by master-data validation and transaction entry. Retiring a unit must not invalidate historical quantities already recorded with that unit. New quantity-bearing transactions should use ACTIVE units unless an authorized legacy exception exists.
        default: ACTIVE
  - name: Calendar
    help: "A calendar that defines business dates, working days, holidays and time-control rules used for planning and operations. Whether a date counts as a working day is not obvious: it depends on region, industry and company. A calendar states that explicitly, so due dates, delivery promises and schedules all agree. Maintained by administrators; referenced by schedulers, service-level calculations and planning when they need to know which days count. Locations, teams, contracts and schedules point to the calendar that governs their working days. A calendar's code and identity stay stable. Changes to holidays apply from their effective date and do not rewrite history. The German national business calendar, with weekends and public holidays marked non-working."
    icon: calendar
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the calendar. Generated on creation; schedules and rules refer to the calendar through it.
      - name: code
        type: string(100)
        help: The short reference for the calendar, such as DE-NAT. Assigned by the administrator; used in configuration and reports; kept stable.
      - name: name
        type: string(300)
        help: The descriptive name of the calendar, such as UK Working Days or Group Fiscal Calendar. Entered by the administrator who maintains it; shown wherever a schedule, service level or plan asks which calendar applies.
  - name: Attachment
    help: A file or other content attached to an enterprise record, with its content identity and provenance kept for audit. Supporting documents, photos and scans back up decisions. Keeping them as governed records, rather than loose files, proves what was attached to what and when, and lets the same content be recognised if it is attached twice. Added when a user or system attaches evidence to a record; read when someone needs to see or verify the supporting document. An attachment is linked to the record it supports; the same file may be attached to more than one. Once attached, the content is evidence and is not silently replaced; a corrected file is attached as a new record. A signed delivery note PDF is attached to a shipment record by the driver's handheld at delivery.
    icon: paperclip
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the attachment record. Generated on creation; links to the supported record and audit entries use it.
      - name: effective_at
        type: datetime
        optional: true
        help: When the attachment became part of the record. Set when the file is attached; used to show what evidence existed at a given moment.
  - name: Task
    help: A discrete unit of business work performed by a person, organisation, system or workflow participant. Tasks are how work is handed out and tracked, whether a person must act or a system step must run. Their type, status, owner and dates show what is waiting, what is stuck and what is done. Created by people or workflows; picked up by assignees; read by managers and reports. A task may belong to a workflow, an assignee, an organisation and a related document. A task is created, becomes ready, is assigned and worked, and ends completed, cancelled or failed. It may be blocked and resumed. All three end states are final. A task "Approve purchase order PO-5120" is assigned to a manager and completed the same day.
    icon: list-checks
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the task, constant for its life. Generated on creation; workflow and audit records refer to it.
      - name: code
        type: string(100)
        help: The short business code that identifies the task in work queues, such as TSK-10482. Assigned when the task is created; quoted in assignments, escalations and reports, and used to find the task without its full name.
      - name: name
        type: string(300)
        help: A short title stating what work the task asks someone or something to do. Entered by the creator or the workflow that spawned it; shown in queues and notifications, so it should read as an action.
      - name: description
        type: string(2000)
        optional: true
        help: Fuller instructions explaining what is to be done, why, and any details the performer needs. Written by the creator; read by the assignee before starting, and updated if scope changes while the task is open.
      - name: task_type
        type: string
        enum: TaskTaskType
        help: The kind of work the task is. Chosen when created; decides who or what performs it. Work done by a person. A step run automatically. A person must approve or refuse something. A choice that decides the path. A message to be sent. A script run by the system. Work that fits no other type.
      - name: status
        type: string
        enum: TaskStatus
        help: Where the task stands, from creation through assignment and execution to completion, cancellation or failure. Moved by the assignee, workflow or system as work proceeds; completed, cancelled and failed tasks are closed to further work. The task exists but is not yet ready to be picked up. The task is released and waiting for someone to be assigned. A person or party has been given the task but has not started it. The assignee is actively working on the task. Work is held up by a dependency, missing input or decision. The work was done as required. A final state. The task was withdrawn before completion. A final state. The task ended without achieving its result and needs follow-up elsewhere. A final state.
        default: CREATED
      - name: priority
        type: string
        enum: TaskPriority
        help: How urgently the task should be worked relative to others in the same queue. Set by the creator or workflow rules; assignees and queue views sort by it, and it may raise escalations when overdue. Can wait behind other work without business impact. Standard urgency, handled in the ordinary course of work. Needs prompt attention ahead of normal work. Needs immediate action because delay causes serious business impact.
        default: NORMAL
      - name: due_at
        type: datetime
        optional: true
        help: Set when created; overdue tasks are flagged. Compared with the completion time. Records when the due event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      - name: started_at
        type: datetime
        optional: true
        help: Set when work starts. Not later than the completion time. Records when the started event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      - name: completed_at
        type: datetime
        optional: true
        help: Set when the task is completed; required for a completed task. Gives the time taken. Records when the completed event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      - name: assignee_id
        type: string
        fk: true
        references: Party
        optional: true
        help: The person responsible for the task. Chosen when assigned. At most one assignee. Decides whose list it is on.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation the task is for. Chosen when it concerns a unit. At most one organisation. Groups tasks by unit.
  - name: Account
    help: "A ledger account in a chart of accounts: the named bucket to which monetary activity is posted and from which balances are reported. Account is how an organisation classifies money. Every posting lands on an account, and the account's type decides which statement it appears on (balance sheet or income statement) and which direction increases its balance. Created when the chart of accounts is set up or extended; referenced by journal postings, invoices, payments, budgets and financial reports. Accounts are retired, never deleted, so past postings stay explainable. Accounts form a tree through parent and child accounts so balances roll up into reporting groups; each chart belongs to an Organization, and an account may be pinned to a Currency for foreign-currency ledgers. Active accounts accept postings. Inactive accounts are paused and can be reactivated. Retired accounts are closed for good but remain in reports covering the periods in which they were used. Account 4000 \"Product Revenue\" (type REVENUE) is a child of 4000-series \"Revenue\"; every sales invoice line posts to it, and the income statement sums it into total revenue."
    icon: landmark
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of the ledger account. Generated when the account is created and never changed; postings, budgets and reports hold this identity so renumbering the account code does not break them.
      - name: code
        type: string(100)
        help: The account number or code under which the account appears in the chart of accounts, such as 1100 or 4000. Entered by the finance team when creating the account and used for lookup, sorting and imports. It must be unique within its chart, and finance teams usually structure it so the leading digits indicate the account class.
      - name: name
        type: string(300)
        help: The descriptive title of the account, such as Accounts Receivable or Product Revenue. Shown on ledgers, trial balances and statements. It can be reworded for clarity without affecting history because postings refer to the account by identity.
      - name: account_type
        type: string
        enum: AccountAccountType
        help: The accounting class of the account, which decides where it appears in the statements and whether debits or credits increase it. Chosen when the account is created and rarely changed afterwards, because changing it reclassifies every historical posting. Reports group and sign balances by this value. Something the organisation owns or is owed, such as cash or receivables; debits increase it and it appears on the balance sheet. Something the organisation owes, such as payables or loans; credits increase it and it appears on the balance sheet. The owners' residual interest, such as share capital and retained earnings; credits increase it and it appears on the balance sheet. Income earned from the organisation's activities; credits increase it and it appears on the income statement. Cost incurred in earning revenue; debits increase it and it appears on the income statement. An account that offsets another, such as accumulated depreciation against an asset or sales returns against revenue; it carries the opposite sign of the account it offsets.
      - name: status
        type: string
        enum: AccountStatus
        help: "Whether the account is open for new postings. New accounts start ACTIVE. Finance staff move an account to INACTIVE to stop postings temporarily and to RETIRED when it is closed for good; posting screens offer only ACTIVE accounts. Open for postings and shown in account pick-lists. Paused: no new postings are accepted, but it can be reactivated and still appears in reports. Closed for good: no postings, kept only so historical periods stay reportable."
        default: ACTIVE
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The currency in which this account is denominated, when it is held in something other than the organisation's base currency. Set for foreign-currency accounts such as a euro bank account so that postings and balances are held in that currency; left empty for ordinary base-currency accounts. Points to Currency so foreign-currency balances can be revalued into the reporting currency.
      - name: parent_account_id
        type: string
        fk: true
        optional: true
        help: "The account directly above this one in the chart of accounts hierarchy. Chosen when the account is created to place it in a reporting group, for example Bank Accounts under Current Assets. Leave empty for a top-level account. At most one parent: the chart is a tree, so an account sits in exactly one place or at the top. Lets reports roll balances up the tree; a cycle would make roll-up impossible, which is why the hierarchy must stay acyclic."
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation whose chart of accounts this account belongs to. Set when the account is created so each legal entity keeps its own chart; used to scope ledgers and reports to one organisation. At most one organisation; an account with none is treated as shared across the chart it is loaded into. Keeps one organisation's ledger from mixing with another's in consolidated or multi-entity setups.
  - name: JournalEntry
    help: Represents accounting recognition of a business event in a balanced double-entry ledger. JournalEntry is the accounting representation, not the operational event itself. Payment records settlement activity, BankTransaction records external bank evidence, Invoice records a claim, CreditNote records customer adjustment, SupplierCreditNote records supplier payable adjustment, SupplierDebitNote records buyer recovery, and JournalEntry records accounting recognition. General ledger, accounts receivable, accounts payable, treasury, inventory accounting, asset accounting, tax, audit, period close and financial reporting. sourceTransaction provides generic origin. Payment, CreditNote, SupplierCreditNote and SupplierDebitNote provide direct traceability when applicable. JournalEntryLine contains debit/credit effects. Organization provides accounting boundary. Business event → accounting determination → JournalEntry draft → line validation → balance validation → POSTED. Customer and supplier credit/debit posting follows adjustment calculation and approval and must create/link required accounting recognition. Payment workflow independently progresses through payment states and bank reconciliation. Draft entries may be prepared and corrected under authorization. Posting establishes immutable recognition. Corrections after posting use explicit reversal and replacement entries. Changes to unposted CreditNote, SupplierCreditNote or SupplierDebitNote require accounting recalculation. Posted adjustment changes require reversal/replacement JournalEntry treatment; posted journal history is never destructively rewritten. A USD 500 SupplierDebitNote increases supplier recovery exposure. A balanced JournalEntry records the authorized accounting consequence. If the debit is later reversed, the original JournalEntry remains and a compensating reversal entry is posted.
    icon: book-open
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the accounting entry. Generated on creation; ledger lines and audit refer to it. Identifies the accounting event independently of its source transaction and journal lines. Provides the stable root reference across accounting preparation, validation, posting, reporting and reversal.
      - name: entry_number
        type: string(100)
        unique: true
        help: The sequential number of the entry in the ledger. Allocated from the ledger's number series; unique; quoted in audit queries. Distinct from source transaction numbers such as Invoice, Payment, CreditNote, SupplierCreditNote and SupplierDebitNote references. Identifies the accounting record in ledgers and audit trails.
      - name: entry_date
        type: datetime
        help: The accounting date of the entry. Set from the originating event; decides the fiscal period the entry belongs to. May differ from originating transaction, bank value, invoice, CreditNote, SupplierCreditNote or SupplierDebitNote date. Controls the period into which the entry is posted.
      - name: status
        type: string
        enum: JournalEntryStatus
        help: Whether the entry has been recorded in the books. Moved by the posting process; only POSTED entries affect balances. Prepared but not yet recorded; no effect on balances. Recorded in the ledger; it affects balances and can no longer be edited. Cancelled by a reversing entry; the original stays on record. A final state. Independent of Payment, Invoice, CreditNote, SupplierCreditNote, SupplierDebitNote and BankTransaction statuses. DRAFT permits preparation; POSTED establishes recognition; REVERSED preserves original history while counteracting its effect.
        default: DRAFT
      - name: description
        type: string(1000)
        optional: true
        help: A short explanation of what the entry records. Written or generated at posting; shown in ledgers and drill-downs. Complements source transaction and lines; must not be sole accounting evidence. Helps accountants understand why the entry was generated.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this JournalEntry belongs to.
      - name: payment_id
        type: string
        fk: true
        optional: true
        help: At most one payment, the payment that gave rise to the entry. Payment whose financial recognition is represented when applicable. Supports cash, receivable, payable, clearing, fee and settlement accounting traceability. A posted payment may generate accounting recognition while Payment status remains separate.
      - name: credit_note_id
        type: string
        fk: true
        optional: true
        help: At most one credit note, the document that gave rise to the entry. Customer CreditNote whose financial adjustment is represented. Supports receivable, revenue, tax, inventory-related and refund-obligation accounting traceability. CreditNote posting requires appropriate accounting recognition.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: At most one organisation, the ledger owner; it defaults to the current ledger. Organization whose books recognize the accounting entry. Supports legal-entity accounting, reporting, period control and ledger ownership. Determines accounting boundary and applicable chart/period policies.
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: Accounting control period containing entryDate. Establishes posting eligibility and close context. Posting, close, reporting and audit. Required for POSTED entries under period-controlled accounting; optional while draft before determination. Organization/date must resolve to an eligible period before posting.
      - name: ledger_id
        type: string
        fk: true
        optional: true
        help: The Ledger this JournalEntry belongs to.
  - name: JournalEntryLine
    help: "One debit or credit line within a journal entry. Double-entry accounting records every event as at least two lines which balance. The line is the unit of the ledger: an account, an amount and a direction. Created with its entry; summed per account to give balances; read by financial reports and audits. Each line belongs to one JournalEntry and posts to one Account. Lines are part of their entry: they are edited while it is a draft and fixed once it is posted. Debit 1,200.00 to Accounts Receivable as part of the entry for invoice INV-2026-0441."
    icon: book-open
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the ledger line. Generated on creation; drill-downs and reconciliations refer to it.
      - name: line_number
        type: integer
        help: The position of the line within the entry. Set when the entry is created; keeps the order of lines stable.
        min: 1
      - name: debit_amount
        type: decimal
        help: The amount debited to the account. Entered or derived from the source; not negative, and zero if the line is a credit.
        default: "0"
      - name: credit_amount
        type: decimal
        help: The amount credited to the account. Entered or derived from the source; not negative, and zero if the line is a debit.
        default: "0"
      - name: description
        type: string(500)
        optional: true
        help: A short note explaining what this single debit or credit line records. Typed by the person or process posting the entry; shown when a user drills down from a ledger balance to the underlying lines.
      - name: journal_entry_id
        type: string
        fk: true
        help: "The entry the line belongs to. Set when the line is created. Exactly one entry: a line has no meaning outside the entry it balances. The entry's lines must balance before it can be posted."
      - name: account_id
        type: string
        fk: true
        help: "The ledger account the line posts to. Chosen when the entry is made. Exactly one account: each line affects a single account. Determines which balance and statement line the amount affects."
  - name: Invoice
    help: Represents a formal financial claim and its controlled settlement and adjustment state. Invoice records what was originally claimed. Payment records money moved. PaymentAllocation records how money is applied. CreditNote, SupplierCreditNote, and SupplierDebitNote record separate authorized financial adjustments; their application entities record claim-level consumption. Used by order-to-cash, procure-to-pay, accounting, tax, collections, payments, reconciliation, customer credit, supplier recovery and audit. SalesOrder provides commercial commitment, Shipment or delivery provides fulfillment where applicable, GoodsReceipt provides accepted procurement fulfillment, Invoice provides the claim, CreditNote provides customer reduction, SupplierCreditNote provides supplier reduction, SupplierDebitNote provides buyer recovery, Payment provides settlement, and application entities connect each adjustment to the claim. Invoice preparation → line calculation → discount → taxable base → tax determination → total → PaymentTerm due-date calculation → issue → payment → PaymentAllocation and/or approved adjustment application → amountSettled/amountCredited/amountOutstanding → PARTIALLY_PAID or PAID. Supplier credit and debit applications remain explicit non-cash financial evidence. Draft → issued → partially paid or overdue → paid, with cancellation and void paths. Corrections use CreditNote, SupplierCreditNote, SupplierDebitNote, controlled adjustments, or allocation/application reversals rather than silently rewriting posted evidence. Changes to Customer, Supplier, Product, UOM, pricing, discount, tax, Currency, SalesOrder, PurchaseOrder, GoodsReceipt, return, claim, credit, or debit evidence affecting an open transaction trigger controlled revalidation. Posted invoice history is not silently recalculated. Posted adjustments and applications are corrected through explicit reversal/replacement. A purchase invoice totals 10,000 EUR. A 1,000 EUR supplier credit and a 500 EUR supplier debit are each explicitly applied through their application entities; the invoice's original values remain unchanged while payable exposure is reconciled from the active settlement and adjustment evidence.
    icon: receipt
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the invoice claim. Identifies the financial claim independently of its number, lines, source order, receipts, credits, debits, or payments. Used for financial integrations, audit, payment allocation, reconciliation, reporting, and lifecycle navigation. InvoiceId identifies the claim; InvoiceNumber is its business-facing reference; CreditNote and supplier debit/credit applications provide later financial adjustment evidence. Provides the stable identity carried through issuance, settlement, adjustment, reversal, and accounting.
      - name: invoice_number
        type: string(100)
        unique: true
        help: The number printed on the invoice, by which customer and supplier refer to it. Identifier communicated to customers, suppliers, tax authorities, and financial operations. Used in documents, statements, reconciliation, collections, payables, and integrations. Distinct from invoiceId and source order numbers. Provides the human-recognizable reference throughout the claim lifecycle.
      - name: invoice_date
        type: date
        help: Accounting and commercial date assigned to the invoice. Establishes the date used for financial chronology and applicable billing and tax rules. Used for accounting periods, tax, payment-term calculation, aging, reporting, and reconciliation. Distinct from payment, bank settlement, credit-note, debit-note, and clearing dates. Provides the temporal anchor for invoice issuance and applicable PaymentTerm calculation.
      - name: due_date
        type: date
        optional: true
        help: Transaction-level date by which the claim is expected to be settled. Result of applying the effective PaymentTerm and due-date basis to the invoice. Drives aging, collections, cash forecasting, and payment planning. PaymentTerm is policy; dueDate is the invoice-specific result and must not be silently recalculated after issue. Determines when the outstanding claim becomes overdue under the applicable policy.
      - name: invoice_type
        type: string
        enum: InvoiceInvoiceType
        help: An invoice the organisation issues to a customer for goods or services supplied. An invoice the organisation receives from a supplier. A document that reduces what is owed under an earlier invoice. A document that increases what is owed under an earlier invoice. Defines the commercial direction and accounting nature of the invoice document. Determines whether the document establishes a receivable, payable, or adjustment. Used by accounting, tax, receivables, payables, matching, and reporting. Must agree with Customer/Supplier and source transaction relationships. A dedicated CreditNote or SupplierDebitNote is preferred for explicit financial adjustments. Controls which party, matching, tax, and settlement processes apply.
      - name: status
        type: string
        enum: InvoiceStatus
        help: Being prepared; not yet sent and not yet part of the receivables. Sent or recorded; the amount is now owed and due by its due date. Part of the amount has been settled by payments or credits. Fully settled. A final state. Past its due date with an amount still outstanding. Withdrawn before it became effective. A final state. Cancelled after issue by a controlled process that keeps the original on record. A final state. Lifecycle state of the financial claim. Indicates whether the claim is being prepared, outstanding, settled, overdue, cancelled, or voided. Controls issuance, settlement, aging, cancellation, reporting, and accounting workflows. PaymentAllocation supplies settlement evidence; CreditNote and SupplierDebitNoteApplication supply authorized adjustment evidence; Payment status alone must never determine invoice payment status. ISSUED establishes the claim; active allocations and authorized adjustment applications change settlement projection; PAID requires no remaining amount under policy; OVERDUE is time-based and may coexist with partial settlement.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency denomination shared by the invoice's monetary values. Defines the monetary denomination of the claim and its calculated totals. Used for accounting, payment allocation, tax, reconciliation, reporting, and credit or debit adjustment. Payment, CreditNote, SupplierCreditNote, or SupplierDebitNote may use another currency only under explicitly governed exchange-rate treatment. Provides the denomination against which invoice amounts, settlement and adjustments are evaluated.
      - name: subtotal
        type: Money
        help: Aggregate of invoice line amounts before document-level tax and other applicable document adjustments. Represents the pre-tax financial base derived from invoice lines after line-level pricing treatment. Used for tax calculation, accounting, reconciliation, and document totals. Must use invoice currency and reconcile with InvoiceLine monetary values. Feeds document-level discount, tax, and total calculations according to policy.
      - name: discount_amount
        type: Money
        help: Aggregate document-level discount applied after applicable line pricing and before taxable base where policy requires. Represents a document-level reduction distinct from line-level discounts and settlement discounts. Used for invoice calculation, tax determination, reporting, and reconciliation. Must reconcile with applicable DiscountRule evidence and must not be confused with credit notes or early-payment discounts. Reduces the applicable document base before tax according to the invoice calculation policy.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: Aggregate monetary base on which applicable invoice taxes are calculated. Represents the amount subject to tax after applicable discounts and exemptions. Used for tax calculation, tax reporting, audit, and reconciliation. Must reconcile with InvoiceLine taxable amounts and document-level tax determinations. Supplies the base for TaxRule application and tax calculation.
      - name: tax_amount
        type: Money
        help: Aggregate tax amount calculated under applicable TaxRules and transaction tax determinations. Represents tax charged or otherwise recognized on the claim, not the taxable base. Used for tax reporting, invoice totals, accounting, and reconciliation. Must reconcile with transaction-level tax evidence and jurisdictional treatment. Contributes to totalAmount and downstream tax/accounting reporting.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total financial claim after applicable line values, discounts, taxes, credits, debits, and document adjustments. Represents the amount owed under the original invoice before settlement allocations and later adjustment applications. Used for settlement, aging, statements, reporting, and accounting. Represents the original claim itself, not the amount already paid or subsequently adjusted. Provides the claim base against which active PaymentAllocation and authorized adjustment application evidence are evaluated.
      - name: amount_settled
        type: Money
        help: Projection of active settlement amounts applied to this invoice. Represents how much of the claim is settled according to active PaymentAllocation records. Used to calculate outstanding balance and derive settlement status. Not an independent cash event; Payment and PaymentAllocation provide the underlying evidence. Changes when allocations are posted, activated, reversed, or corrected.
        default: '{"amount":0}'
      - name: amount_credited
        type: Money
        help: Projection of active CreditNote amounts applied against this invoice claim. Represents authorized financial reductions supported by posted CreditNote evidence. Used for customer balance, invoice settlement, statements, reconciliation and reporting. CreditNote is a separate financial document; this projection must not rewrite original Invoice or InvoiceLine values. Changes through controlled credit-note application or reversal workflows.
        default: '{"amount":0}'
      - name: amount_outstanding
        type: Money
        help: Projection of the portion of the invoice claim that remains unsettled after authorized credits and debits. Represents current open exposure under the applicable accounting and rounding policy. Drives collections, payment allocation, aging, statements, and cash forecasting. Normally reconciles totalAmount less active settlement and authorized adjustment applications in invoice currency. Determines whether additional allocation or adjustment application is permitted and whether PAID can be reached.
        default: '{"amount":0}'
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: Customer associated with a sales invoice. Identifies the party against whom a receivable claim is established. Supports receivables, statements, collections, tax, credit, and customer reporting. Required for SALES invoices unless another controlled party model applies. Supplies commercial party context for the claim and settlement.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: Supplier associated with a purchase invoice. Identifies the party to whom a payable claim relates. Supports payables, supplier statements, procurement reconciliation, tax, and payment processing. Required for PURCHASE invoices unless another controlled party model applies. Supplies commercial party context for three-way matching and settlement.
      - name: sales_order_id
        type: string
        fk: true
        optional: true
        help: Sales commitment from which a sales invoice may originate. Connects customer demand commitment to the resulting financial claim. Supports order-to-cash traceability, billing reconciliation, and revenue processes. SalesOrder is the commercial commitment; Invoice is the financial claim. Provides source context for sales billing.
      - name: purchase_order_id
        type: string
        fk: true
        optional: true
        help: Procurement commitment against which a supplier invoice may be evaluated. Connects supplier commitment to the resulting payable claim. Supports three-way matching and accounts payable controls. PurchaseOrder is commitment; GoodsReceipt is accepted fulfillment; Invoice is the claim. Supplies ordered quantity and price context for InvoiceLine matching.
  - name: Payment
    help: "Represents movement or recognition of money while keeping payment execution, claim settlement, bank evidence, accounting recognition, customer refunds and supplier-credit refunds as separate connected facts. Payment is the settlement event. Invoice is the claim. PaymentAllocation applies receipt payments to claims. CreditNote is a customer financial adjustment. SupplierCreditNote is a supplier payable adjustment. A refund or settlement Payment is separate cash evidence. Accounts receivable, accounts payable, treasury, banking integrations, cash management, reconciliation, collections, supplier payments, customer refunds and supplier-credit refunds. Currency defines denomination. PaymentAllocation connects receipt Payments to claims. CreditNote connects customer refunds. SupplierCreditNote connects supplier-credit cash settlements when a supplier returns funds. BankTransaction confirms external settlement. JournalEntry records accounting consequences. Receipt Payment → approval → posting → allocation → bank evidence → cleared. Customer credit: CreditNote posted → application or refund due → DISBURSEMENT Payment → bank reconciliation. Supplier credit: SupplierCreditNote posted → application against payable or supplier refund due → RECEIPT Payment from supplier → bank reconciliation. Original payment and credit histories remain immutable. Draft → approved → posted → cleared, with controlled void and reversal paths. Payment, Invoice, CreditNote, SupplierCreditNote, BankTransaction and JournalEntry retain independent lifecycle states because they represent different business facts. Changes to CreditNote or SupplierCreditNote settlement obligations require validation of linked payment eligibility. Payment reversal requires corresponding reversal of affected refund/settlement projections and accounting evidence; it must never rewrite the originating credit note. A supplier has a EUR 300 unapplied SupplierCreditNote. The supplier refunds EUR 300 rather than applying it to another invoice. A new RECEIPT Payment for EUR 300 is linked to the SupplierCreditNote and reconciled to bank evidence. The original supplier credit remains unchanged except for its controlled cash-settlement projection."
    icon: credit-card
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the payment, separate from the bank's reference. Generated on creation; allocations, ledger entries and bank matches refer to it. Identifies the financial movement independently of its business reference, allocations, bank evidence, accounting entries or credit settlement purpose. Identity remains stable when allocations are reversed or a refund/settlement is associated with a credit note. Root reference across preparation, authorization, posting, clearing and reversal.
      - name: payment_number
        type: string(100)
        unique: true
        help: The number under which the payment is recorded and quoted. Allocated from a number series; unique; shown on remittance advices and receipts. Reference communicated in remittance, statements, bank reconciliation and payment inquiries. Distinct from paymentId and bank transaction identifiers. Correlates internal payment evidence with operational and external references.
      - name: payment_date
        type: datetime
        help: Timestamp at which the payment event is recognized by the business process. Establishes internal settlement chronology. Accounting periods, cash reporting, reconciliation and settlement analysis. Distinct from bank value date, clearing date, posting date, allocation date and credit-note date. Provides event time for internal payment processing.
      - name: direction
        type: string
        enum: PaymentDirection
        help: Whether money is coming in or going out. Set when the payment is created; decides whose account is debited and credited. Money received from a payer. Money paid out to a payee. Establishes cash-flow direction and payer/payee interpretation. Customer refund and supplier-credit refund/settlement payments are DISBURSEMENT events and never rewrite original receipt payments. Determines cash-flow and settlement path.
      - name: status
        type: string
        enum: PaymentStatus
        help: How far the payment has progressed from preparation to clearing. Moved by treasury and the bank reconciliation process. Being prepared; no financial effect. Authorised but not yet recorded in the books. Recorded in the ledger but not yet confirmed by the bank. Confirmed by bank evidence. A final state. Cancelled and of no effect. A final state. Cancelled after posting by a compensating entry. A final state. Indicates authorization, internal recognition, external clearing, invalidation or reversal. Independent of Invoice, CreditNote, SupplierCreditNote and BankTransaction statuses. APPROVED authorizes processing; POSTED recognizes internally; CLEARED confirms external evidence; VOID/REVERSED handle correction.
        default: DRAFT
      - name: amount
        type: Money
        help: Total monetary value of the payment event. Represents money received or disbursed, not the amount allocated to one claim or credit. Cash position, allocation validation, accounting and reconciliation. PaymentAllocation distributes receipt payments; a credit-settlement payment settles an explicit customer or supplier credit obligation. Provides source monetary amount.
      - name: currency_id
        type: string
        fk: true
        help: The currency in which the payment amount is denominated, such as EUR or USD. Chosen when the payment is created; used to pick exchange rates, validate allocations and reconcile to the bank account. Defines interpretation of payment amount. May differ from invoice or credit currency only with explicit ExchangeRate evidence. Establishes source currency.
      - name: payment_method
        type: string
        enum: PaymentPaymentMethod
        help: Describes how the money is physically moved, such as by bank transfer, card, cheque or cash. Chosen when the payment is created; decides how it is processed, which fees apply and how it is reconciled. Money is handed over in notes and coins and recorded against a cash box or till. Funds move between bank accounts by credit transfer and are matched to a bank statement line. Payment is taken or made on a debit or credit card, normally through a processor that charges fees. Payment is made by a paper cheque that is issued or banked and clears after a delay. Funds are collected from the payer's bank account under a standing mandate the payer has authorised. Payment uses a method not listed here, with the detail held in the external reference. Describes how money moves rather than which obligation it settles. Refund or supplier-credit settlement method must satisfy applicable policy. Determines expected settlement evidence.
      - name: value_date
        type: date
        optional: true
        help: Economic effective date of funds under settlement convention. Distinguishes economic cash availability from internal creation time. Cash forecasting, interest, reconciliation and accounting analysis. May differ from paymentDate and bank clearing timestamp. Provides settlement timing context.
      - name: external_reference
        type: string(250)
        optional: true
        help: External remittance, bank, processor or instrument reference. Connects internal payment evidence to external settlement identifier. Bank reconciliation, remittance matching, gateway reconciliation and audit. Does not replace allocations or credit identities. Helps resolve external evidence.
      - name: payer_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Party providing money for a receipt or associated with a disbursement. Identifies source-side party. Customer receipts, refunds, supplier settlements and audit. Optional for aggregated/external settlement. Supplies party context.
      - name: bank_account_id
        type: string
        fk: true
        optional: true
        help: Bank account through which payment is expected to be received or disbursed. Connects payment to internal financial account. Treasury, cash management, execution and reconciliation. Optional for cash or externally managed methods. Provides account context.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: The Supplier this Payment belongs to.
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: The Customer this Payment belongs to.
      - name: cash_position_id
        type: string
        fk: true
        optional: true
        help: The CashPosition this Payment belongs to.
  - name: Supplier
    help: Represents the procurement-facing role of a Party that supplies business inputs and participates in reverse procurement, supplier claims, financial recovery and performance governance. Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific qualification, terms and transaction history. SupplierClaim captures the case; SupplierClaimResolution captures the remedy; downstream transactions execute it; SupplierPerformanceAssessment interprets accumulated evidence for governance. Central to source-to-pay, sourcing, procurement, receiving, supplier returns, quality claims, accounts payable, supplier qualification, recovery and performance management. Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, SupplierReturn, SupplierCreditNote, SupplierDebitNote, SupplierClaim, SupplierClaimResolution, SupplierPerformanceAssessment, Product and PaymentTerm. Supplier qualification/status → PurchaseOrder → GoodsReceipt → Invoice matching → Payment; issue detection → SupplierClaim → SupplierClaimResolution → SupplierReturn and/or SupplierCreditNote/SupplierDebitNote/Payment → reconciliation; periodic evidence aggregation → SupplierPerformanceAssessment → governance/improvement decision. Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence. A supplier's quarterly assessment combines delivery receipts, inspection failures, claims and returns into an approved scorecard. The result informs qualification and improvement decisions while the underlying transactions remain unchanged.
    icon: factory
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable Supplier role identity. Connects procurement purchase orders receipts invoices payments returns credits claims resolutions and supplier performance. Supplier identifies the role while PartyRole and Party identify the underlying party. Preserves supplier traceability across procure-to-pay reverse procurement claim recovery and performance management.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: Points to the party role this supplier record specializes, tying the sourcing profile to the underlying party. Set once at creation and never reassigned; unique, so a party role has at most one supplier profile, and names and addresses are read through it. Supplier must not duplicate Party identity. Supplies shared party context to procurement and financial workflows.
      - name: supplier_code
        type: string(100)
        unique: true
        help: Enterprise supplier business reference. Used on purchase orders receipts invoices returns credits payments claims portals reports and integrations. Distinct from legal name and external registration identifiers. Identifies the supplier across procurement settlement recovery and performance.
      - name: supplier_type
        type: string
        optional: true
        enum: SupplierSupplierType
        help: Classifies what kind of organization or person the supplier is, for due diligence and reporting. Chosen at onboarding; it influences which qualification checks, tax treatment and spend reports apply to the supplier. A natural person or sole trader supplying goods or services in their own name. A commercial company or partnership that supplies goods or services for profit. A public authority or agency supplying goods, services or licences, often under statutory terms. Another unit of the same enterprise supplying through intercompany arrangements. A supplier that fits none of the other types, such as a charity or association. Does not replace Party identity classification. Supplies supplier classification to procurement policy.
      - name: qualification_status
        type: string
        optional: true
        enum: SupplierQualificationStatus
        help: Records whether the supplier has been vetted and cleared to receive orders under sourcing policy. Updated by procurement or compliance after due diligence; buyers check it before issuing requests for quotation or orders. No qualification review has been carried out for this supplier yet. A review is under way and the supplier is not yet cleared to receive orders. The supplier has passed review and may be used for sourcing and ordering. Qualification is temporarily withdrawn pending resolution of an issue. The supplier failed or lost qualification and must not be used for new orders. Qualification is distinct from master lifecycle status and may consume SupplierPerformanceAssessment evidence. Gates new procurement commitments while historical transactions remain valid.
      - name: payment_terms
        type: string
        optional: true
        help: Default supplier settlement policy. Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting. Transaction or contract terms may override the default. Supplies default payable timing.
      - name: status
        type: string
        enum: SupplierStatus
        help: The operational state of the supplier record, showing whether it can currently be dealt with. Set by procurement; ACTIVE suppliers appear in pickers, while blocked or retired ones are refused on new transactions. The supplier is open for business and may be selected on new orders and quotation requests. The supplier is dormant and hidden from selection but can be reactivated. New transactions are barred, for example during a dispute or compliance hold. The relationship has ended and the record is kept for history only. A final state. Historical transactions remain valid after state changes. New procurement return claim-resolution and performance workflows must evaluate status.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: The party that holds the role. Set when the role is assigned and not changed. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity.
      - name: role_type
        type: string
        enum: SupplierRoleType
        help: The kind of role the party plays, such as customer, supplier, employee or partner. Chosen when the role is assigned; decides which specialised record (customer, supplier and so on) carries its detail. The party buys goods or services from the organization and is handled in sales and receivables. The party sells goods or services to the organization and is handled in procurement and payables. The party works for the organization under an employment relationship. The party collaborates with the organization commercially, such as a reseller or alliance member. The party transports goods or people for the organization. The party acts on behalf of the organization or of another party, usually for a commission. The party provides labour or services under a contract rather than as an employee. The party holds an ownership or beneficial interest in an asset or organization. The party provides capital to the organization in return for a financial return or equity stake. A role that fits none of the listed kinds and is explained in the role code or description. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process.
      - name: code
        type: string(100)
        optional: true
        help: An optional code for the role. Used by integrations that identify the role separately from the party. Identifies the role instance and must not replace Party or specialized role identifiers.
      - name: valid_from
        type: date
        optional: true
        help: The first date on which the role applies. Set when the role is assigned. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role.
      - name: valid_to
        type: date
        optional: true
        help: The last date on which the role still applies to the party. Set when the role ends, such as a contract expiry; empty while open-ended, and later use of the role is refused. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
  - name: PurchaseOrder
    help: Represents the formal commercial procurement commitment between a buying organization and a Supplier. PurchaseOrder establishes what the Supplier is expected to provide; it is not proof that goods arrived or that later returns occurred. Purchasing, supplier management, receiving, warehouse operations, accounts payable, budgeting, inventory planning and analytics. PurchaseRequisition represents internal demand. PurchaseOrder converts approved demand into an external commitment. PurchaseOrderLine specifies the commitment. GoodsReceipt records actual receipt and acceptance. InventoryMovement records stock effects. SupplierReturn reverses eligible fulfillment. Invoice records the supplier claim. SupplierCreditNote records authorized financial reduction. Payment settles claims. Draft, approval, issuance, receipt, return, cancellation and closure are distinct stages. Financial settlement can continue after physical fulfillment or return. PurchaseOrder → GoodsReceipt → acceptance → InventoryMovement; when goods must be returned, eligible receipt → SupplierReturn → InventoryMovement reversal → SupplierCreditNote → payable reconciliation. A depot orders 100 parts, receives 96 and accepts 94. Later, three accepted parts are returned as defective. The original order and receipt remain unchanged; SupplierReturn and its inventory/credit workflows record the reversal.
    icon: shopping-cart
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable system identity of the purchase order. Used for procurement, receiving, invoice matching, supplier returns, audit and integrations. Identifies the order independently of orderNumber, Supplier, lines, GoodsReceipt and SupplierReturn. Stable root reference across commitment, fulfillment, reversal and closure.
      - name: order_number
        type: string(100)
        unique: true
        help: The human-facing procurement reference quoted by the buyer and supplier for this order. Assigned when the order is created and unique; used by buyers, suppliers, receiving, accounts payable and integrations to find it. Business reference distinct from technical purchaseOrderId. Correlates procurement activity across systems.
      - name: order_date
        type: datetime
        help: Date and time the procurement commitment is created or issued. Supports chronology, approval, reporting and reconciliation. Distinct from requested delivery, receipt, return, invoice and payment dates. Anchors the commitment lifecycle.
      - name: status
        type: string
        enum: PurchaseOrderStatus
        help: Where the purchase commitment stands from draft through issue, receipt and closure. Moved by buyers, approvers and receiving; controls authorisation, issuing, cancellation and closure, and cancelled and closed are final. Being prepared by the buyer; not yet binding on anyone. Authorised internally and ready to be sent to the supplier. Issued to the supplier, who is now expected to deliver. Some of the ordered quantity has been received and accepted; the rest is outstanding. Everything required has been received and accepted. The remaining commitment has been withdrawn. A final state. Receiving and invoicing are complete. A final state. PurchaseOrder status does not prove physical receipt, supplier return or invoice settlement; those are separate facts.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Currency qualifying order monetary values. Used for pricing, totals, invoice matching, supplier credit calculation and financial reporting. Qualifies amounts and does not identify Supplier or Product.
      - name: requested_delivery_date
        type: date
        optional: true
        help: The date by which the buyer asks the supplier to deliver the goods or complete the service. Entered by the buyer and communicated to the supplier; receiving and planners use it to expect arrivals and chase late orders. A request, not proof of actual receipt or return. Supports delivery planning.
      - name: total_amount
        type: decimal
        optional: true
        help: Order-level value derived from committed lines and commercial adjustments. Used for approval, budget, supplier commitment and invoice reconciliation. Must reconcile with PurchaseOrderLine values and currencyId.
      - name: supplier_id
        type: string
        fk: true
        help: Supplier receiving the procurement commitment. Drives sourcing, delivery, receiving, supplier performance, returns and accounts payable. GoodsReceipt and SupplierReturn supplier should normally match this supplier.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: "The buying organization that issues the order and is committed to pay for it. Chosen when the order is created; decides which legal entity, budget, tax rules and approvals apply to the purchase. At most one organization: the buyer is a single legal entity, and it may be unset on an early draft. Identifies the buyer for authorisation, budgeting and reporting. Ties the commitment to a legal entity for tax and budget."
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: The place where the ordered goods are to be delivered or the service performed. Chosen by the buyer; receiving, logistics planning and the supplier's dispatch use it to route the delivery. At most one delivery location per order; a single order is delivered to one place and may be unset. Tells receiving where to expect the goods. Directs the supplier's dispatch to the receiving site.
  - name: Customer
    help: Represents the commercial customer role of a Party. Party identifies who the party is; PartyRole establishes a role; Customer governs buyer-specific commercial behavior and controls. Central to sales order-to-cash, pricing, billing, receivables, collections, service, and customer analytics. Customer connects to SalesOrder, Invoice, Payment, PaymentAllocation through those transaction entities while retaining the underlying Party identity. Customer onboarding → eligibility/credit → SalesOrder → fulfillment → Invoice → Payment → PaymentAllocation → receivables settlement. Customer status constrains new activity but does not replace transaction evidence or rewrite history. Onboard → active → inactive/blocked → retired. Future eligibility changes do not invalidate historical relationships. A Party may simultaneously act as Customer and Supplier. Both roles reference the same Party identity while maintaining separate commercial controls and histories.
    icon: user-round
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identifier for the Customer business relationship. Used by orders invoices receivables service pricing credit contracts and analytics. Party identifies the underlying party while customerId identifies the customer relationship. Provides the stable customer reference carried into SalesOrder Invoice Payment shipment service and receivables workflows.
      - name: party_role_id
        type: string
        fk: true
        unique: true
        help: The link to the party role that makes this party a customer. Set when the customer is created; the party's name, addresses and contacts are read through it and are not copied here. Customer is a role specialization and must not duplicate Party identity. Supplies common party context to customer-facing workflows.
      - name: customer_code
        type: string(100)
        unique: true
        help: The short code staff and systems use to refer to this customer. Assigned when the customer is set up; quoted on orders, invoices and statements and used in integrations, and different from the system id. Distinct from customerId and external legal identifiers. Supports customer selection and transaction recognition.
      - name: customer_type
        type: string
        optional: true
        enum: CustomerCustomerType
        help: The commercial kind of buyer, such as a private consumer, a company or a public body. Chosen by sales when the customer is created; it steers pricing, credit rules, tax handling and reporting segments. A private consumer buying for personal use rather than for a business. A company or other commercial organisation buying for its own operations. A public authority or agency, often with its own procurement and payment rules. Another unit of the organisation itself, supplied through internal sales. A customer that fits none of the other kinds. Does not replace Party partyType. Supplies customer classification to transaction policy.
      - name: credit_status
        type: string
        optional: true
        enum: CustomerCreditStatus
        help: The credit-control decision currently in force for this customer. Set by credit control after review; order authorisation, receivables and collections check it before releasing credit-bearing orders. Credit has not been assessed; trading is on the default terms. Credit has been assessed and approved up to the credit limit. Credit is paused pending review; new credit-bearing orders need approval. Credit is refused; no new credit-bearing orders. Credit control affects exposure and does not alter party identity. SalesOrder confirmation must evaluate current credit policy when applicable.
      - name: credit_limit
        type: Money
        optional: true
        help: Authorized monetary credit exposure limit. Used in credit checks exposure monitoring and risk reporting. Must be interpreted with currency outstanding exposure payment terms and credit status. Provides one input to credit authorization before additional exposure.
      - name: payment_terms
        type: string
        optional: true
        help: Default settlement policy for customer invoices. Used by SalesOrder Invoice receivables collections and cash forecasting. May be overridden by authorized contract or transaction-level terms. Supplies default due-date expectations to order and invoice creation.
      - name: status
        type: string
        enum: CustomerStatus
        help: Whether the customer relationship is open for business, dormant, held back or closed. Moved by sales or finance; it decides whether new orders may be taken, while past transactions stay attributed to the customer. A customer the organisation can sell to. Dormant, with no new business expected; can be reactivated. Held back from new business, for example for non-payment or compliance reasons. Closed for good; history is kept. Historical transactions remain attributable after status changes. New workflows must evaluate status; historical records remain valid.
        default: ACTIVE
      - name: party_id
        type: string
        fk: true
        help: The party that holds the role. Set when the role is assigned and not changed. One Party may have multiple PartyRoles simultaneously or historically. Connects role-specific processing back to the canonical identity.
      - name: role_type
        type: string
        enum: CustomerRoleType
        help: The kind of role the party plays, such as customer, supplier, employee or partner. Chosen when the role is assigned; decides which specialised record (customer, supplier and so on) carries its detail. The party buys goods or services from the organization and is handled in sales and receivables. The party sells goods or services to the organization and is handled in procurement and payables. The party works for the organization under an employment relationship. The party collaborates with the organization commercially, such as a reseller or alliance member. The party transports goods or people for the organization. The party acts on behalf of the organization or of another party, usually for a commission. The party provides labour or services under a contract rather than as an employee. The party holds an ownership or beneficial interest in an asset or organization. The party provides capital to the organization in return for a financial return or equity stake. A role that fits none of the listed kinds and is explained in the role code or description. Separate from Party.partyType, which describes whether the participant is a person or organization. Selects the applicable downstream role specialization and business process.
      - name: code
        type: string(100)
        optional: true
        help: An optional code for the role. Used by integrations that identify the role separately from the party. Identifies the role instance and must not replace Party or specialized role identifiers.
      - name: valid_from
        type: date
        optional: true
        help: The first date on which the role applies. Set when the role is assigned. Works with validTo and status; ending a role does not delete Party identity or other roles. Prevents premature use of a newly established role.
      - name: valid_to
        type: date
        optional: true
        help: The last date on which the role still applies to the party. Set when the role ends, such as a contract expiry; empty while open-ended, and later use of the role is refused. Historical transactions may continue referencing the role after validTo. Prevents new use after role expiration while preserving historical attribution.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: Optional organizational scope in which the role is recognized. Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios. Zero means global/context-independent; one means explicitly scoped to one organization. Determines which organization can use the role for applicable transactions and policies.
      - name: tax_rule_id
        type: string
        fk: true
        optional: true
        help: The TaxRule this Customer belongs to.
  - name: SalesOrder
    help: A customer's firm commitment to buy specified products or services on stated commercial terms and delivery needs. The sales order is the contract in operational form. It fixes what was ordered, by whom, at what price and for when, and drives allocation of stock, shipment and invoicing, so everything downstream can be traced back to what the customer agreed. Entered by sales or placed online; confirmed by the business; read by warehouse, shipping and finance. An order is for one customer, has lines, may name an organisation and delivery location, and is followed by shipments and invoices. An order is drafted and confirmed, then stock is allocated and it is fulfilled in whole or in parts. It may be cancelled. Fulfilled and cancelled are final. Order SO-10482 for 40 units is confirmed on Monday, shipped in two parts and invoiced on delivery. Confirmed order → validation → availability check → reservation/allocation → pick/issue → Shipment → delivery/acceptance evidence → SalesOrderLine fulfillment → order status. Invoice is generated according to billing policy and remains independent evidence. Cancellation releases remaining reservations and stops new work while preserving historical downstream effects. Entity changes must propagate through affected dependent workflows rather than directly mutating derived states. Line fulfillment changes recalculate order status; reservation changes affect allocation state; shipment events contribute fulfillment evidence; billing changes do not independently determine fulfillment. Allocation, fulfillment, cancellation and status transitions require concurrency control and idempotency to prevent double reservation, double fulfillment or contradictory terminal states.
    icon: shopping-cart
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the order, constant for its life. Generated on creation; shipments and invoices refer to it. Referenced by every document that follows the order.
      - name: order_number
        type: string(100)
        unique: true
        help: The number the customer sees, such as SO-10482. Unique; quoted on confirmations and invoices. Used to find the order from any following document.
      - name: order_date
        type: datetime
        help: The date and time the customer's order was placed. Set when the order is entered or received; sales reporting, delivery promises and payment terms are counted from it. Compared with the requested delivery date.
      - name: status
        type: string
        enum: SalesOrderStatus
        help: Being entered; not yet binding on either side. Accepted by the business; the commitment stands. Stock has been reserved to meet the order. Part of the order has been shipped. Everything ordered has been delivered. A final state. Withdrawn before fulfilment. A final state. Order-level lifecycle state controlling commercial and fulfillment permissions. Drives confirmation, allocation, fulfillment, shipment readiness and cancellation. Summarizes downstream evidence; it is not an independent source of fulfillment quantity. Status transitions are validated against line, reservation, shipment and fulfillment evidence.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: "Chosen when the order is created; all amounts are in it. Read with the total. The currency id of the sales order: a link to another record the business records on it."
      - name: requested_delivery_date
        type: date
        optional: true
        help: "Entered from the customer's request; used to plan allocation and shipping. Compared with the promised and actual shipment dates. The requested delivery date of the sales order: a calendar date the business records on it."
      - name: total_amount
        type: decimal
        optional: true
        help: The total value of the order after discounts and tax. Calculated from the lines. Matched with the invoiced amount.
      - name: customer_id
        type: string
        fk: true
        help: An order is placed by a single customer, who is the one shipped to and invoiced unless stated otherwise. The customer who placed the order. Chosen when the order is created. Decides who is shipped to and invoiced.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The selling organisation that takes the order. Chosen when the business has several companies. At most one organisation. Decides whose accounts record the sale.
      - name: delivery_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Chosen when delivery is not to the customer's default address. The place the goods are to be delivered. At most one location; empty uses the customer's address. Used by shipping.
  - name: Budget
    help: Governed financial planning baseline. Budget records intended/authorized financial amounts while JournalEntry records actual accounting. Planning, spending control and variance reporting. BudgetLine supplies dimensional detail; FiscalPeriod supplies accounting time; Scenario supplies planning assumptions. Draft to submitted to approved/active to superseded/closed.
    icon: piggy-bank
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the budget, stable across revisions of its figures. Identifies one financial plan version. Planning, approval, control and reporting. Owns BudgetLines and references planning context.
      - name: code
        type: string(100)
        help: Assigned by finance when the budget is created, for example FY26-OPS-V1; used to find the budget and cite it in approvals. Business budget code. Human/integration reference for plan. Unique within organization/version policy.
      - name: status
        type: string
        enum: BudgetStatus
        help: How far the budget has progressed through preparation, approval, use and replacement. Moved by the budget owner and approvers; only active budgets control spending, and later changes need a new revision. Being prepared by the budget owner; figures may change freely. Sent for approval; changes are held while it is reviewed. Accepted by the authorising body but not yet the live control. The live budget against which spending is monitored. Replaced by a later version; kept as the record of what was once approved. A final state. The period is over and the budget is closed for comparison with actuals. A final state. Controls editability and authoritative planning use. Actual accounting remains in JournalEntry.
        default: DRAFT
      - name: organization_id
        type: string
        fk: true
        help: "Set when the budget is created; determines whose spending the budget limits. Exactly one organisation: a budget always plans the money of a single organisation. Organization owning budget. Defines planning boundary. Accounting dimensions must belong to compatible context."
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: Fiscal period governed by budget. Aligns plan with accounting time. Budget control and variance. Optional when budget spans multiple periods represented by lines. Does not open/close accounting period.
      - name: scenario_id
        type: string
        fk: true
        optional: true
        help: Planning scenario represented. Distinguishes baseline/upside/downside etc. Comparative planning. Optional for single-scenario plans. Scenario never changes actual ledger.
  - name: BudgetLine
    help: Detailed dimensional budget allocation. Defines planned money at an account/responsibility intersection. Budgeting and variance analysis. Budget governs; Account/CostCenter/ProfitCenter classify.
    icon: piggy-bank
    parent: Budget
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of one allocation within a budget. Generated on creation; variance reports and revisions refer to the line through it. Identifies one dimensional allocation. Belongs to Budget.
      - name: amount
        type: Money
        help: The money planned for this combination of account, cost centre and profit centre in the budget period. Entered by the budget owner; never negative, and compared with actual postings to show overspend or underspend. Financial target/limit for dimensions. Not an actual ledger balance.
      - name: budget_id
        type: string
        fk: true
        help: Exactly one budget; a line cannot exist outside the plan that contains it. Parent financial plan. Supplies governance/version context. Planning. Line lifecycle follows budget governance.
      - name: account_id
        type: string
        fk: true
        optional: true
        help: Financial account dimension. Classifies planned amount. Budget-vs-actual. Optional under non-account planning. Actuals derive from accounting not line mutation.
      - name: cost_center_id
        type: string
        fk: true
        optional: true
        help: At most one cost centre; a line may be planned by account alone. Cost responsibility dimension. Allocates plan to cost center. Expense control. Must be eligible for budget period.
      - name: profit_center_id
        type: string
        fk: true
        optional: true
        help: At most one profit centre; used when the plan is organised by profit responsibility. Profit responsibility dimension. Allocates plan to profit center. Management reporting. Must be eligible for budget period.
  - name: Forecast
    help: A versioned forward-looking financial projection built on a defined scenario and the information available at a given date. A forecast says where the numbers are expected to go. Keeping it apart from approved budgets and actual postings lets the organisation compare what was planned, what is expected and what happened. Prepared by finance each cycle; versioned as assumptions change; read by management. A forecast belongs to an Organization, may use a Scenario and covers a FiscalPeriod. It never creates or alters actual journal entries. The Q3 rolling forecast of revenue and costs for the European subsidiary, prepared in July under the base scenario.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the forecast version. Generated on creation; later versions refer to it.
      - name: code
        type: string(100)
        help: The reference of the forecast, such as FC-2026-Q3-V2. Assigned by finance; identifies version and cycle.
      - name: organization_id
        type: string
        fk: true
        help: "The organisation the forecast is for. Set when prepared. Exactly one organisation: forecasts are made for a particular entity. Scopes the projected figures."
      - name: scenario_id
        type: string
        fk: true
        optional: true
        help: The scenario of assumptions on which the forecast is based. Chosen when prepared. At most one scenario. Allows alternative projections to be compared. Identifies planning case.
      - name: fiscal_period_id
        type: string
        fk: true
        optional: true
        help: The period the forecast covers. Set when prepared. At most one period. Places the projection in time. Aligns projection to reporting period.
  - name: Scenario
    help: Alternative planning assumption context. Separates hypothetical plans from actual outcomes. Budgeting, forecasting and sensitivity analysis. Budget and Forecast may reference it.
    icon: list
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identifier of one planning scenario. Generated on creation; budget and forecast lines refer to the scenario through it so versions can be compared side by side. Identifies one planning assumption set. Referenced by planning artifacts.
      - name: code
        type: string(100)
        unique: true
        help: The short code naming the scenario, such as BASE, UPSIDE or DOWNSIDE. Chosen by finance when the scenario is created, unique, and shown in planning screens and variance reports. Identifies baseline/upside/downside or named case. Does not identify actual ledger.
      - name: status
        type: string
        enum: ScenarioStatus
        help: Whether the scenario is still being defined, open for planning, or retired. Starts as DRAFT and is moved by finance; only ACTIVE scenarios accept new budget and forecast figures. Being defined and not yet used in planning. Available for budgets and forecasts. No longer used but kept for history. A final state. Controls new planning use. Historical plans retain scenario reference.
  - name: CostCenter
    help: A unit of responsibility to which costs are assigned and against which they are analysed, separate from the legal accounts. Ledger accounts say what a cost was; a cost centre says who is responsible for it. Splitting the two lets a manager see and answer for their own spending without changing the chart of accounts. Defined by finance; chosen on cost postings, budgets and purchase requests; read in management reports and budget reviews. Each cost centre belongs to one Organization; budgets and postings refer to it as a dimension. It never creates or alters ledger entries on its own. A cost centre is created for the life of the responsibility and retired when it ends; postings made to it remain in history. Cost centre 4100 "Marketing – Events", responsible for trade show and sponsorship spending.
    icon: calculator
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the cost centre. Generated on creation; budget lines and postings refer to it.
      - name: code
        type: string(100)
        help: The code by which the cost centre is known in postings and reports, such as 4100. Assigned by finance; stable, because history is reported under it.
      - name: organization_id
        type: string
        fk: true
        help: "The organisation that the cost centre belongs to. Set at creation; limits the postings and budgets that can use it. Exactly one organisation: responsibility cannot be split between legal entities. Scopes cost reporting to the right entity."
  - name: ProfitCenter
    help: A responsibility centre used to analyse revenue, cost and profit independently of the legal accounts. A profit centre lets management see how a part of the business performs, such as a product line or region, whatever legal entity or account the money passes through. It supports management reporting only and never rewrites accounting entries. Defined by finance; chosen on transactions and budgets; read by management reports. A profit centre belongs to one organisation. A profit centre is created, used while it is reported on, and left unused when the unit closes. Existing analysis keeps it. The "Northern Region" profit centre reports revenue and cost for all sales and branches in that region.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the profit centre, constant when it is renamed. Generated on creation; transactions and reports refer to it.
      - name: code
        type: string(100)
        help: The short code of the profit centre, such as PC-NORTH. Unique within the organisation; used in imports, budgets and reports.
      - name: organization_id
        type: string
        fk: true
        help: The organisation the profit centre belongs to. Chosen when it is created. Exactly one organisation. Keeps profit analysis within the right company.
  - name: Variance
    help: A comparison between planned, forecast or actual financial measures for a period and dimension. A variance shows how far reality is from the plan and in which direction. It lets managers see where budget is overspent or revenue falls short, without altering the accounting entries it is derived from. Calculated by finance or the planning system; read by managers and budget owners. A variance belongs to an organisation and compares a budget or a forecast with actuals. A variance is calculated for a period and recalculated as actuals arrive. It never changes the entries it compares. Marketing spend is 12 percent over budget for March.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent identifier of the variance comparison, unchanged when its figures are recalculated. Generated on creation; reports and commentary refer to it to point at one specific comparison of plan against actual. Lets reports point at the comparison. Referenced by review reports.
      - name: code
        type: string(100)
        help: The reference code of the variance, such as VAR-2026-03-MKT, naming the period and area compared. Assigned by finance or the planning system when the comparison is produced; used in reports, review packs and when quoting a variance to managers. Gives reviewers a stable reference. Read with the period.
      - name: organization_id
        type: string
        fk: true
        help: The organisation the comparison is for. Chosen when created. Exactly one organisation. Decides whose budget is measured.
      - name: budget_id
        type: string
        fk: true
        optional: true
        help: The budget used as the plan. Chosen when comparing with budget. At most one budget. Provides the planned figure. Supplies planned value source.
      - name: forecast_id
        type: string
        fk: true
        optional: true
        help: The forecast used as the expectation. Chosen when comparing with forecast. At most one forecast; empty if only a budget is used. Provides the expected figure. Supplies projected value source.
  - name: Ledger
    help: An accounting book that defines the scope in which journal entries are recorded and reported. A single organisation may keep several books, for example one for local statutory reporting and one for group reporting. The ledger names a book and holds its entries, so figures in one book are never mixed with another. Created when accounting is set up for an organisation; filled by journal entries; read by accountants and auditors. A ledger belongs to one Organization and contains JournalEntries. It must not silently duplicate or rewrite authoritative cash, tax or billing records. A ledger is drafted, becomes active when open for postings, is completed when its books are finally closed, and is cancelled if it was never used. The statutory ledger of the German subsidiary, active for the current fiscal year. References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    icon: book-open
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The stable identity of the accounting ledger, constant for the life of the books. Generated on creation; journal entries, periods and reports refer to the ledger through it.
      - name: status
        type: string
        enum: LedgerStatus
        help: Whether the ledger is currently open to receive journal entries. Moved by finance as books are opened and closed; postings are accepted only while ACTIVE, and finished ledgers are kept for reporting. Being set up and not yet accepting entries. Open for posting journal entries. Closed for good after the final period. A final state. Set up but never used. A final state.
      - name: organization_id
        type: string
        fk: true
        help: "Exactly one organisation: a book is kept for a single legal entity. Organization owning accounting book. Defines legal/management accounting boundary. Posting and reporting. Journal entries must use compatible organization context."
  - name: FiscalPeriod
    help: Accounting-period control for posting, close and reporting. FiscalPeriod determines whether an accounting date is currently eligible for recognition; it does not replace JournalEntry. General ledger, AP, AR, treasury, assets, inventory accounting, tax and financial close. Organization defines books; JournalEntry carries accounting date; period state controls posting eligibility. Future → open → soft closed → closed → locked, with governed reopen where policy permits. Closing/reopening immediately revalidates pending postings and close processes while preserving already posted history.
    icon: database
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent identity of the accounting period, unchanged when its dates or status change. Generated on creation; journal entries, close tasks and financial reports refer to the period by this value. Identifies one accounting control interval independently of its label. JournalEntry accounting dates resolve to an eligible period.
      - name: code
        type: string(50)
        help: The business code of the period, such as 2026-03 or FY2026-Q1, by which finance staff name it. Assigned when the calendar is set up and shown on journals, close checklists and reports; unique within an organisation's calendar. Human-facing accounting interval reference such as 2026-09. Unique within organization/calendar context.
      - name: start_date
        type: date
        help: The first accounting date that falls inside the period, from which postings are assigned to it. Set when the calendar is defined; a journal entry is posted to the period whose dates contain its entry date. Defines lower posting boundary. Inclusive with endDate.
      - name: end_date
        type: date
        help: The last day covered by the accounting period. Set when the calendar is defined; must not be before the start date. Postings dated after it belong to a later period. Together with the start date it defines the interval in which journal entries may be dated. Defines upper posting boundary.
      - name: status
        type: string
        enum: FiscalPeriodStatus
        help: Controls whether journal entries may be posted to the period, from not yet open to finally closed. Moved by finance through open, soft close, close and lock; journal validation reads it before accepting any posting. Defined but not yet open; no postings are accepted. Open and accepting postings from ordinary finance users. Normally closed but still open to postings by authorised finance staff, for adjustments. Closed; no further postings and figures are final for reporting. A final state. Frozen temporarily, for example during an audit or a month-end freeze; it can be reopened. Governs permitted accounting recognition and correction. Historical posted entries remain immutable.
        default: FUTURE
      - name: organization_id
        type: string
        fk: true
        help: "Exactly one organisation: each legal entity keeps its own accounting calendar and closes its own periods. Accounting organization owning period. Establishes books/control boundary. Posting and reporting. Journal organization must match."
  - name: InvoiceLine
    help: Represents one immutable financial claim line with reproducible calculation evidence and explicit customer and supplier adjustment references. InvoiceLine is the historical financial result. Current Product, DiscountRule, TaxRule, UOM and pricing master data are inputs to future transactions, not live dependencies of a posted line. CreditNoteLine and SupplierCreditNoteLine record later reductions separately. Billing, accounts payable, accounts receivable, procurement matching, tax, accounting, returns, credit processing, audit and settlement. Invoice provides claim context; Product/UOM identify and measure the billed item; DiscountRule and TaxRule explain policy; pricingEvidence, discountEvidence and taxEvidence preserve transaction-time results; PO/receipt relationships support three-way matching; CreditNoteLine records customer adjustment; SupplierCreditNoteLine records supplier adjustment. Determine transaction price → calculate gross → resolve discount → calculate taxable base → resolve tax → calculate tax → calculate net → snapshot evidence → matching/approval → post. If a customer or supplier return/correction occurs later, determine eligible adjustment → create corresponding credit line → post credit → apply through explicit application evidence. Subsequent master-data changes never rewrite posted history. Draft → calculated → matched/exception → approved → posted. After posting, historical calculation evidence is immutable and corrections use explicit financial documents or adjustments. Changes to Product/UOM/pricing/discount/tax masters require validation of future and open transactions but never silently modify posted InvoiceLines. Changes to procurement commitments, receipts, customer returns, supplier returns or credits can change downstream matching/adjustment eligibility through controlled reconciliation without rewriting the invoice calculation. A purchase invoice line is linked to a PurchaseOrderLine and accepted GoodsReceiptLine. If three received units are later returned to the supplier, SupplierReturnLine and SupplierCreditNoteLine reference this InvoiceLine; the original billed price and tax remain unchanged while the supplier credit is applied separately.
    icon: receipt
    parent: Invoice
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the original invoice line. Identifies the historical billed detail independently of later credits or corrections. Used for billing, audit, matching, credit and reconciliation. CreditNoteLine and SupplierCreditNoteLine may reference this identity as source evidence. Stable root reference for the line lifecycle.
      - name: line_number
        type: integer
        help: The position of this line within its invoice, starting at one and used to reference the line. Assigned in sequence when the line is added; it fixes the order of lines on the printed invoice and lets credits and audit entries point to one line. Identifies the line for documents and reconciliation. Unique within Invoice and distinct from CreditNoteLine and SupplierCreditNoteLine numbering. Supports deterministic document reconstruction.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: The number of units originally billed on this line, in the unit of the billed product or service. Set when the line is created; invoice matching, credit notes and return-eligibility checks compare other quantities against it. Preserves the historical quantity on the original claim. CustomerReturnLine or SupplierReturnLine may reference eligible quantities and CreditNoteLine or SupplierCreditNoteLine may credit an eligible portion. Provides source quantity evidence.
      - name: unit_price
        type: Money
        optional: true
        help: Transaction-time billed price per unit. Captures the price actually used to value the invoice line, not today's master price. Supports invoice calculation, audit, price variance, settlement and credit calculation. Customer or supplier credit lines may preserve this as source valuation evidence; later pricing changes do not rewrite it. Provides authoritative historical pricing evidence for the invoice line.
      - name: gross_amount
        type: Money
        help: Gross monetary value before line discount and tax. Original calculated value of the billed line. Used for invoice reconciliation and credit evidence. Credit adjustment lines do not mutate this historical amount. Feeds original line calculation.
      - name: discount_amount
        type: Money
        help: The money value of the discount originally applied to this line before tax. Recorded when the line is calculated; tax and credit calculations reuse it so a later credit reproduces the original charge exactly. Historical line-level commercial reduction. Return credits use original discount evidence where policy requires. Contributes to original taxable and net values.
        default: "0"
      - name: taxable_amount
        type: Money
        help: Original taxable base of the invoice line. Amount subjected to the original tax treatment. Used for tax audit and credit calculation. Credit adjustment tax evidence may derive from this historical treatment. Provides source tax basis.
      - name: tax_amount
        type: Money
        help: Tax originally recognized on the line. Historical tax component of the claim. Used for tax reporting, accounting and credit calculation. A credit line may reverse an eligible portion without editing this amount. Provides source tax evidence.
        default: "0"
      - name: net_amount
        type: Money
        help: Original net financial value of the line after discount and applicable tax treatment. Historical line contribution to the Invoice total. Used for billing, accounting and credit reference. Credit adjustment lines record a separate reduction rather than changing netAmount. Provides immutable source value.
      - name: pricing_evidence
        type: object
        optional: true
        help: Snapshot of material pricing inputs used to determine the invoice line amount. Preserves source, effective date, and approved commercial context needed to reproduce pricing even when master data changes. Supports audit, dispute resolution, recalculation, credit calculation and integration. Links the invoice result to the effective transaction price without making the posted invoice depend on mutable pricing master data.
      - name: discount_evidence
        type: object
        optional: true
        help: Snapshot of the discount policy inputs and result used on the invoice line. Preserves the applied discount rule/version, method, base, rate or fixed amount, and resulting discount. Supports audit and prevents later DiscountRule changes from altering historical calculations or credits. Provides reproducible discount calculation evidence.
      - name: tax_evidence
        type: object
        optional: true
        help: Snapshot of the tax determination inputs and result used on the invoice line. Preserves tax rule/version, jurisdiction, rate, taxable base, rounding and calculated tax. Supports tax audit, compliance, dispute resolution and credit-note tax calculation. Prevents later TaxRule changes from rewriting posted invoice tax.
      - name: description
        type: string(1000)
        optional: true
        help: The text describing what was billed on this line, as it appeared on the invoice. Copied from the product or typed by the biller; it is printed on invoice documents and read in audit, and is kept even if the product later changes. Describes the billed good or service. Complements Product and source transaction references. Supports document presentation.
      - name: matching_status
        type: string
        enum: InvoiceLineMatchingStatus
        help: Whether the line has been checked against the order and receipt it bills for. Set by the three-way matching process; lines in EXCEPTION block payment until they are resolved or waived. The line does not need matching, for example a sales invoice line. Not yet compared with the purchase order and goods receipt. Quantity and price agree with the order and receipt within tolerance. Some of the line's quantity or amount agrees; the rest does not. A difference outside tolerance needs a decision. The difference was accepted by an authorised approver. Indicates whether the line agrees with applicable purchase and receipt evidence. Independent from CreditNote and SupplierCreditNote status; a credit may correct a posted line after matching. Controls matching approval before posting.
        default: NOT_APPLICABLE
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: Unit in which the original quantity was billed. Defines measurement semantics for the historical quantity. Supports billing, fulfillment and return conversion. Provides source measurement context for eligible credits.
      - name: invoice_id
        type: string
        fk: true
        help: Parent invoice containing the original claim line. Provides financial document context. Supports billing, settlement, adjustment and audit. Parent claim owns the line's historical calculation.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Product or service identified by the original invoice line. Identifies what was billed without making current product master data a live dependency of posted history. Supports billing, fulfillment and return traceability. Supplies source item context.
      - name: purchase_order_line_id
        type: string
        fk: true
        optional: true
        help: Procurement line associated with a purchase invoice line. Connects payable billing to the original procurement commitment. Supports three-way matching and supplier-return traceability. Supplies source procurement evidence.
      - name: sales_order_line_id
        type: string
        fk: true
        optional: true
        help: The SalesOrderLine this InvoiceLine belongs to.
  - name: PaymentAllocation
    help: Provides the controlled bridge between a Payment event and an Invoice claim. Payment says money moved; Invoice says money is owed; PaymentAllocation says exactly how much of that payment satisfies that claim. Central to receivables, payables, collections, payment reconciliation, bank reconciliation, refunds, reallocation, and accounting. Payment supplies source funds. Invoice supplies target obligation. Currency defines denominations. ExchangeRate converts denominations when required. Invoice derives settlement projections from active allocations. Payment received or posted → validate available unapplied amount → select Invoice → compare currencies → select approved ExchangeRate if required → calculate target invoice amount → apply rounding policy → activate PaymentAllocation → update Invoice amountSettled/amountOutstanding/status → reconcile with bank and accounting evidence. Draft allocation → validation → active settlement → optional reversal/cancellation → corrected allocation if needed. Historical allocations are never silently rewritten. A EUR 5,000 Payment is applied to a USD invoice using an approved EUR-to-USD ExchangeRate. paymentAmount remains EUR 5,000, invoiceAmount records the USD claim value satisfied, ExchangeRate preserves the conversion evidence, and any rounding adjustment is explicit. The Invoice is not marked paid until its active allocations satisfy its outstanding amount.
    icon: credit-card
    parent: Payment
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the allocation. Generated on creation; reversals and ledger entries refer to it. Identifies the application of payment value to a claim independently of the Payment and Invoice identities. Payment identifies money received or sent; Invoice identifies the claim; PaymentAllocation connects the two. Provides the auditable settlement bridge used to derive Invoice amountSettled and amountOutstanding.
      - name: payment_id
        type: string
        fk: true
        help: Payment from which the allocated settlement amount originates. Identifies the cash or settlement event being applied. Supports payment reconciliation, bank matching, and settlement audit. The allocation cannot create or replace the underlying Payment event. Supplies the source monetary amount and payment currency for allocation.
      - name: invoice_id
        type: string
        fk: true
        help: Invoice claim to which the payment is applied. Identifies the financial obligation being reduced by the allocation. Supports receivables/payables settlement, aging, statements, and reconciliation. The allocation reduces the claim; it does not change the original Invoice total. Supplies the target claim and invoice currency for settlement comparison.
      - name: payment_amount
        type: Money
        help: Portion of the Payment amount consumed by this allocation in the Payment currency. Represents how much of the source payment is assigned to this claim. Supports remaining-payment calculation and reconciliation to the Payment. Must use the Payment currency and must not exceed the unapplied source payment amount under policy. Establishes the source-side settlement quantity before any cross-currency conversion.
      - name: invoice_amount
        type: Money
        help: Amount of the Invoice claim satisfied by this allocation in the Invoice currency. Represents the claim-side effect of the allocation. Drives Invoice amountSettled and amountOutstanding projections. May differ numerically and in currency from paymentAmount when an approved ExchangeRate is used. Supplies the target-side settlement value applied to the claim.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: Exchange-rate record used when Payment and Invoice currencies differ. Preserves the exact conversion context used to translate payment currency into invoice currency. Supports audit, reconciliation, accounting, and reproducibility of cross-currency settlement. Required for cross-currency allocation and normally absent when currencies are identical. Connects paymentAmount to invoiceAmount through an approved conversion rule.
      - name: allocated_at
        type: datetime
        help: Timestamp at which the allocation became effective. Establishes settlement chronology and supports period-sensitive reconciliation. Used for aging, accounting period determination, audit, and dispute investigation. Distinct from Payment creation time and bank clearing time. Determines when the Invoice settlement projection is changed.
      - name: status
        type: string
        enum: PaymentAllocationStatus
        help: Shows whether the allocation is still being prepared, is settling the invoice, or has been undone. Moved by accounts receivable or payable; only active allocations reduce the amount outstanding on the invoice. Prepared but not yet applied. Applied; the invoice's outstanding amount is reduced. Undone by a compensating record. A final state. Withdrawn before taking effect. A final state. Indicates whether the allocation currently affects settlement or has been reversed/cancelled. Invoice amountSettled must be derived from active allocations rather than every historical allocation record. ACTIVE affects settlement; REVERSED removes the allocation effect through a controlled correction; CANCELLED prevents activation.
        default: DRAFT
      - name: reversal_of_allocation_id
        type: string
        fk: true
        references: PaymentAllocation
        optional: true
        help: Original allocation that this record reverses. Links a correction to the settlement evidence it negates. Supports audit, dispute resolution, reallocation, and accounting correction. A reversal is a new historical event and does not rewrite the original allocation. Enables controlled reversal followed by a corrected allocation.
      - name: rounding_adjustment
        type: Money
        optional: true
        help: Explicit rounding difference required to reconcile source and target settlement values under the approved conversion and currency precision policy. Represents a controlled rounding effect, not an unexplained difference in payment or invoice value. Used in cross-currency reconciliation and accounting adjustment. Must use an appropriate currency and remain within configured tolerance. Makes small conversion/precision differences explicit and auditable.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this PaymentAllocation belongs to.
  - name: PaymentInstruction
    help: "An instruction that authorises or requests a future payment through a bank or payment channel, kept apart from the payment and bank transaction that result. Paying someone is a two-step affair: the organisation instructs the bank, and later the bank confirms. Holding the instruction separately shows what was authorised, by whom and when, and lets it be compared with what the bank actually did. Created when a payment run is approved or a standing instruction is set up; sent to the bank; read by treasury to follow what was authorised. An instruction is for a BankAccount and, once executed, relates to the Payment it produces. It does not itself duplicate or rewrite cash, accounting or billing evidence. An instruction is drafted, becomes active when released to the bank, completes when executed and is cancelled if withdrawn first. A supplier payment run of 38 invoices approved on Thursday and sent to the bank for execution on Friday. References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable."
    icon: credit-card
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the instruction. Generated on creation; the bank file and the resulting payments refer to it.
      - name: status
        type: string
        enum: PaymentInstructionStatus
        help: Where the instruction is in its path to the bank. Moved by treasury and the bank interface. Being prepared; not yet released. Released to the bank and awaiting execution. Executed by the bank. A final state. Withdrawn before execution. A final state.
      - name: bank_account_id
        type: string
        fk: true
        help: "The bank account from which the payment is to be made. Chosen when the instruction is created. Exactly one account: an instruction debits one account. Determines the bank channel, balances and approval limits. Supplies treasury settlement account."
      - name: payment_id
        type: string
        fk: true
        optional: true
        help: The payment that results from the instruction. Linked when the instruction has been executed. At most one payment; a draft or cancelled instruction produces none. Connects what was authorised to what was paid. Connects intent to settlement transaction.
  - name: CreditNote
    help: Represents an explicit reduction of a customer's financial claim while preserving original invoice, return, accounting, application and refund evidence. CustomerReturn records reverse fulfillment; CreditNote records the financial adjustment; CreditNoteApplication records how it is consumed; Invoice remains the historical claim; JournalEntry records accounting; Payment records any refund cash. Customer returns, accounts receivable, billing corrections, tax adjustments, customer concessions, statements, audit and refunds. CustomerReturnLine provides returned quantity and approved credit basis. InvoiceLine provides original billed evidence. CreditNoteLine captures adjustment detail. CreditNoteApplication connects the adjustment to invoice exposure. JournalEntry records accounting. Payment records refund. Return authorized → received/inspected → disposition approved → credit eligibility calculated → CreditNote draft → approval → accounting determination → post → create CreditNoteApplication against open Invoice or establish refund due → refund Payment if required → reconcile → fully applied/refunded. Original Invoice and Payment history remain immutable. Draft → approved → posted → partially applied/fully applied or refund due → refunded, with cancellation and reversal paths. Changes to return disposition or original invoice evidence trigger revalidation of an unposted credit. Posted credit changes require explicit reversal and replacement. Applications are corrected by reversal/reallocation, and refund payments remain separate evidence. A customer returns five units with approved credit of USD 590. CreditNote is posted for USD 590. A CreditNoteApplication can consume the credit against an open invoice; if no eligible balance exists, the credit becomes refund due and a separate Payment settles it.
    icon: credit-card
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the credit note. Identifies the financial adjustment independently of its business number, original invoice, return, accounting entry, application or refund. Used for audit, accounting, customer statements, integrations, reconciliation, tax and reversal workflows. CreditNoteId is the stable system identity; creditNoteNumber is the business-facing reference; the original Invoice remains a separate historical claim. Root reference across preparation, approval, posting, application, reversal, reporting and refund processing.
      - name: credit_note_number
        type: string(100)
        unique: true
        help: Business-facing reference assigned to the credit note. Identifies the adjustment in customer communication, tax documents, statements and finance operations. Used for reconciliation, customer service, reporting, tax and integrations. Distinct from creditNoteId and original Invoice.invoiceNumber. Provides the human-recognizable adjustment reference throughout its lifecycle.
      - name: credit_note_date
        type: date
        help: Commercial and accounting date of the credit adjustment. Establishes the temporal basis for accounting, tax and customer balance treatment. Used for accounting periods, tax reporting, statements and audit. May differ from CustomerReturn returnDate and refund payment date. Anchors the financial adjustment in the applicable accounting and tax period.
      - name: status
        type: string
        enum: CreditNoteStatus
        help: Being prepared; has no financial effect. Authorised but not yet posted to the ledger. Recorded in the books; it now reduces what the customer owes. Part of its value has been set against invoices; some remains. All of its value has been set against invoices. The remaining value is to be paid back to the customer in cash. The remaining value has been refunded. Withdrawn before it was posted. Cancelled after posting by a compensating entry; the original stays on record. Lifecycle state of the credit adjustment. Indicates preparation, authorization, accounting recognition, application to invoices, customer refund obligation, settlement, cancellation or reversal. Controls approval, posting, application, refund and correction workflows. CreditNote status is independent of Invoice, CustomerReturn, Payment and CreditNoteApplication status. POSTED establishes the financial adjustment; application reduces eligible outstanding receivable; refund states apply when money must be returned.
        default: DRAFT
      - name: currency_id
        type: string
        fk: true
        help: Currency in which the credit note is denominated. Defines the monetary denomination of all credit-note amounts. Used for calculation, tax, accounting, invoice application, customer balance and refund processing. Must normally match credited Invoice currency; permitted cross-currency application requires explicit ExchangeRate evidence. Establishes monetary basis for adjustment and application.
      - name: reason_code
        type: string(100)
        help: Controlled business reason for issuing the credit. Explains why customer exposure is reduced. Used for approval, policy, analytics, tax, audit and customer communication. Return reason and financial credit reason may differ. Determines applicable approval, calculation, tax and posting policy.
      - name: subtotal
        type: Money
        help: Aggregate credit value before document-level tax and adjustments. Sum of credit-note line bases after applicable line pricing treatment. Used for tax, reconciliation, accounting and reporting. Must reconcile with CreditNoteLine amounts and original transaction evidence. Feeds taxable amount and total credit calculation.
      - name: tax_amount
        type: Money
        help: Tax component reversed or credited by the adjustment. Represents tax reduction associated with credited transaction. Used for tax reporting, accounting and reconciliation. Must reconcile with CreditNoteLine tax evidence and original InvoiceLine treatment where applicable. Contributes to total adjustment.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total monetary reduction represented by the credit note. Amount by which eligible customer exposure is reduced before application or refund settlement. Used for receivable adjustment, statements, tax, accounting, application and refund decisions. Not itself a cash refund; refund requires a separate Payment event. Maximum amount that can be applied or refunded under policy.
      - name: amount_applied
        type: Money
        help: Portion of the posted credit note already applied to eligible invoice balances. Represents non-cash use of the credit to reduce receivable exposure. Used for application status, statements and remaining credit calculation. Must reconcile with active CreditNoteApplication records. Changes through controlled application or reversal workflows.
        default: '{"amount":0}'
      - name: amount_refunded
        type: Money
        help: Portion of the credit actually paid back to the customer. Represents cash settlement of customer credit. Used for refund reconciliation, customer balance and audit. Must reconcile with refund Payment evidence. Changes only after an authorized refund Payment is posted and linked.
        default: '{"amount":0}'
      - name: amount_remaining
        type: Money
        help: Unapplied and unrefunded portion of the posted credit. Represents remaining customer credit exposure available for application or refund. Drives application, refund and reconciliation decisions. Reconciles totalAmount against active application and refund evidence. Determines whether further application or refund is permitted.
        default: '{"amount":0}'
      - name: customer_id
        type: string
        fk: true
        help: Customer whose financial exposure is reduced. Identifies party receiving financial benefit. Supports statements, receivables, approval, tax, refund and audit. Provides customer eligibility and settlement context.
  - name: CreditNoteLine
    help: Represents one auditable financial adjustment detail and its source evidence. CreditNoteLine translates an eligible original invoice or return into a specific credited value while preserving historical source facts. Return credits, billing corrections, tax adjustments, customer concessions and audit. InvoiceLine is the original financial evidence; CustomerReturnLine is the reverse-fulfillment evidence; CreditNoteLine is the new financial result. Validate source → determine eligible quantity/value → apply return and pricing/tax policy → snapshot evidence → calculate line credit → approve → post through CreditNote. Corrections use reversal/replacement. Draft → calculated → approved → posted, with controlled reversal after posting. Three returned units are eligible for credit at the original transaction value. CreditNoteLine records quantity 3, preserves the source InvoiceLine and CustomerReturnLine, recalculates applicable tax, and contributes its total to CreditNote without changing the original invoice line.
    icon: credit-card
    parent: CreditNote
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Immutable identity of the credit-note line. Identifies one financial adjustment detail independently of its source invoice or return. Used for accounting, audit, reconciliation, tax and correction workflows. Links the line to CreditNote while preserving distinct source InvoiceLine and CustomerReturnLine identities. Stable reference for calculation, posting and reversal.
      - name: line_number
        type: integer
        help: The position of this line within its credit note, counting from one. Assigned when the line is added; it orders the lines on the printed document and lets integrations and reconciliation refer to one line. Orders the adjustment details for document presentation and audit. Unique within the parent CreditNote and independent of original InvoiceLine.lineNumber. Supports deterministic document reconstruction.
        min: 1
      - name: quantity
        type: decimal
        optional: true
        help: Quantity being financially credited when the adjustment is quantity-based. Represents the credited quantity, which may be less than or equal to the returned quantity or originally billed quantity. Used for return credits, quantity corrections and reconciliation. Must reconcile with eligible source InvoiceLine and CustomerReturnLine quantities. Feeds line valuation where credit is quantity-derived.
      - name: unit_price
        type: Money
        optional: true
        help: Transaction-time unit value used to calculate the credit where applicable. Preserves the original or policy-approved value rather than using mutable current pricing. Supports reproducibility, dispute resolution and audit. Should reconcile with source InvoiceLine pricing evidence or authorized return-credit policy. Supplies valuation evidence for quantity-based credits.
      - name: subtotal
        type: Money
        help: Pre-tax monetary credit represented by this line. The line's financial base before credited tax. Used for CreditNote calculation, accounting and reconciliation. Must reconcile with quantity, unitPrice, discounts and source evidence where applicable. Feeds taxable amount and total line credit.
      - name: discount_amount
        type: Money
        help: Discount component included in determining the credited line value. Preserves the applicable discount treatment from the original transaction or return policy. Used for reconciliation and tax calculation. Must not be confused with a new settlement discount. Determines the credited taxable base according to policy.
        default: '{"amount":0}'
      - name: taxable_amount
        type: Money
        help: The part of the credited line value on which tax is calculated. Calculated from the credited quantity and price; it must agree with the original invoice line's tax treatment, and tax reports read it. Amount to which applicable tax treatment is applied for the credit. Must reconcile with original InvoiceLine tax treatment or authorized correction policy. Feeds credited tax calculation.
      - name: tax_amount
        type: Money
        help: Tax amount reversed or credited on this line. Represents the tax consequence of the credited value. Used for tax reporting, accounting and reconciliation. Must reconcile with applicable TaxRule and source invoice tax evidence. Contributes to the line's total credit.
        default: '{"amount":0}'
      - name: total_amount
        type: Money
        help: Total credit represented by this line including applicable tax. Financial reduction attributable to this specific adjustment detail. Aggregated into CreditNote.totalAmount and used for accounting/application. Does not mutate the original InvoiceLine amount. Provides authoritative line contribution to the CreditNote total.
      - name: pricing_evidence
        type: object
        optional: true
        help: Snapshot of material valuation inputs used for the credited amount. Preserves original price, source, effective date or authorized override required to reproduce the credit. Supports audit and dispute resolution. Connects valuation to original InvoiceLine evidence without making the credit depend on current price master data. Provides historical calculation evidence.
      - name: tax_evidence
        type: object
        optional: true
        help: Snapshot of material tax inputs used to determine credited tax. Preserves tax rule/version, jurisdiction, rate, base and rounding used for the adjustment. Supports tax audit and historical reproducibility. Should reconcile with source InvoiceLine tax evidence and applicable correction policy. Supports deterministic tax calculation and posting.
      - name: invoice_line_id
        type: string
        fk: true
        optional: true
        help: Original billed line from which the credit is derived or corrected. Preserves the financial claim basis without modifying its historical values. Supports return credit, billing correction, tax correction and audit. Supplies eligible quantity, price, discount and tax evidence.
      - name: credit_note_id
        type: string
        fk: true
        help: Parent financial adjustment document containing this line. Establishes the document context for the adjustment detail. Supports aggregation, approval, posting and audit. Line totals feed the parent CreditNote totals and lifecycle.
  - name: CreditNoteApplication
    help: Provides the auditable bridge by which a posted customer CreditNote is consumed against an Invoice. CreditNote establishes the authorized financial reduction; Invoice remains the original claim; CreditNoteApplication records exactly where and how much of the credit was used. Receivables, customer statements, returns, billing corrections, tax, reconciliation, audit and refund-versus-application decisions. CreditNoteLine explains source credit detail; InvoiceLine explains original claim detail; this entity records header-level application evidence; JournalEntry records accounting recognition; Payment records any separate refund. CreditNote posted → select eligible Invoice → validate remaining credit and invoice exposure → currency/rate validation → activate application → update CreditNote amountApplied/amountRemaining and Invoice amountCredited/amountOutstanding/status → reverse and reallocate when required. Draft → active → reversed/cancelled. Historical applications are retained. Changes to posted CreditNote or Invoice never rewrite an application; corrections use reversal and replacement applications. A posted USD 590 CreditNote is applied to a USD 590 open invoice. The application consumes USD 590 of available credit and reduces the invoice exposure by USD 590. If applied incorrectly, the application is reversed and a new application is created.
    icon: credit-card
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of this application of credit. Identifies one controlled application independently of the CreditNote and Invoice. Used for reconciliation, audit, reversal and settlement projections. CreditNote supplies the adjustment; Invoice supplies the claim; this entity records the application bridge. Stable reference for applying and reversing customer credit.
      - name: credit_note_amount
        type: Money
        help: Portion of the CreditNote consumed by this application. Represents the source-side amount of credit allocated to an invoice. Controls remaining unapplied credit and reconciliation. Must use the CreditNote currency. Establishes the amount consumed from the credit.
      - name: invoice_amount
        type: Money
        help: Amount by which the Invoice claim is reduced by this application. Represents the target-side financial effect on the invoice. Drives Invoice amountCredited and amountOutstanding. Must use the Invoice currency and may differ from creditNoteAmount only under governed exchange-rate treatment. Supplies the claim-side adjustment.
      - name: exchange_rate_id
        type: string
        fk: true
        optional: true
        help: The exchange rate used to convert between the credit note's currency and the invoice's currency. Filled only when the two currencies differ; it freezes the conversion so the application can be audited and reproduced later. Preserves conversion evidence for cross-currency credit application. Required for permitted cross-currency applications. Connects source credit value to target invoice value.
      - name: applied_at
        type: datetime
        help: The date and time the application took effect and began reducing the invoice. Set when the application is activated; it decides which accounting period and customer statement show the reduction. Establishes adjustment chronology. Distinct from CreditNoteDate and InvoiceDate. Determines when the Invoice credit projection changes.
      - name: status
        type: string
        enum: CreditNoteApplicationStatus
        help: Whether the application is being prepared, currently reducing the invoice, undone, or withdrawn. Moved by receivables staff; only an ACTIVE application reduces the invoice, and the credit note and invoice keep their own statuses. Prepared but not yet in effect. In effect; it reduces the invoice's outstanding amount. Undone by a compensating record; no longer reduces the invoice. Withdrawn before it took effect. Indicates whether the application currently reduces the invoice. CreditNote and Invoice statuses remain independent historical facts. ACTIVE creates the application effect; reversal removes it through a compensating event.
        default: DRAFT
      - name: reversal_of_application_id
        type: string
        fk: true
        references: CreditNoteApplication
        optional: true
        help: The earlier application that this record undoes, when it is a reversal. Set when a wrong application is corrected; the original is never edited, so audit sees both the mistake and its correction. Links correction to the original adjustment application. Reversal is a new historical event and does not edit the original. Enables correction while preserving history.
      - name: credit_note_id
        type: string
        fk: true
        help: Customer credit note supplying the adjustment. Identifies the authorized financial credit being consumed. Supports credit lifecycle and reconciliation. Exactly one CreditNote supplies each application. Supplies available credit and currency context.
      - name: invoice_id
        type: string
        fk: true
        help: Invoice receiving the financial reduction. Identifies the claim whose outstanding exposure is reduced. Supports receivables and statements. Exactly one Invoice is targeted. Supplies eligible outstanding exposure and currency context.
  - name: TaxCode
    help: A tax classification code used to choose the tax rules, rates, registrations and reporting treatment that apply. A tax code lets a product, service or transaction be given its tax treatment by name instead of retyping rules. It keeps tax decisions consistent and makes it clear why a given rate was charged. Maintained by tax or finance; chosen on products, lines and accounts; read by tax calculation and returns. A tax code may belong to an organisation and is used with jurisdictions and rates. A tax code is drafted, active while it is used, and completed when no longer used. It may be cancelled before use. Completed and cancelled are final; past transactions keep it. Code "STD-20" marks goods taxed at the standard rate of twenty percent.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the tax code, constant when it is renamed. Lets transactions point at the code without depending on its label. Generated on creation; tax lines refer to it. Referenced by every transaction taxed under the code.
      - name: status
        type: string
        enum: TaxCodeStatus
        help: Whether the tax code can be used on new transactions. Keeps retired codes from being chosen while history stays intact. Starts as DRAFT; set by tax staff. Only active codes are offered on documents. Being defined; not yet usable. In use on transactions. No longer used on new transactions. A final state. Withdrawn before use. A final state.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation the code is set up for. Chosen when the code is company specific. At most one organisation; empty means it applies to all. Decides which company's returns the code feeds.
  - name: TaxJurisdiction
    help: A geographic or legal authority under which taxes are imposed, collected, reported or remitted. Jurisdictions say who is owed tax and under whose rules. Recording them lets tax be worked out and reported to the right authority and keeps the rates of different places apart. Maintained by tax or finance; used when calculating and reporting tax. A jurisdiction may belong to an organisation and is the place where tax codes apply. A jurisdiction is drafted, active while taxes are due, and completed when it no longer applies. It may be cancelled before use. Completed and cancelled are final. "Ontario, Canada" is the jurisdiction in which provincial sales tax is collected.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the jurisdiction, constant when it is renamed. Lets tax rates and registrations point at the jurisdiction. Generated on creation; tax rates and returns refer to it. Referenced by rates and registrations.
      - name: status
        type: string
        enum: TaxJurisdictionStatus
        help: Shows whether this tax jurisdiction record is still being prepared, in force, or no longer in use. Moved by tax administrators; only active jurisdictions are offered when determining tax, and completed or cancelled ones are kept for history. Stops tax being worked out against a place that no longer applies. Only active jurisdictions are used in calculation. Being defined; not yet used. Taxes are calculated and reported under it. No longer applies to new transactions. A final state. Withdrawn before use. A final state.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation that is registered or reports in the jurisdiction. Chosen when the jurisdiction is company specific. At most one organisation. Decides whose returns go to the authority.
  - name: TaxRate
    help: A tax percentage or amount that applies under a tax code and jurisdiction for a period of time. A tax rate is the figure applied to a taxable amount. Because rates change by date and place, each is recorded with its period so a transaction is taxed at the rate in force on its date, and past calculations can be explained. Maintained by tax staff when authorities change rates; read by tax calculation. A rate may belong to an organisation and applies to a tax code in a jurisdiction. A rate is drafted, active while in force and completed when superseded. It may be cancelled before use. Completed and cancelled are final. The standard rate for code STD in the United Kingdom is twenty percent from 4 January 2011.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the tax rate, constant for its life. Lets tax lines point at the rate that was applied. Generated on creation; tax lines refer to it. Referenced by every tax calculation that used it.
      - name: status
        type: string
        enum: TaxRateStatus
        help: Shows whether the tax rate is being prepared, currently applicable, or withdrawn from use. Moved by tax administrators; only active rates are picked up by tax calculation, and older rates stay for history. Stops an out-of-date rate being used on new transactions. Only active rates are picked up in calculation. Being defined; not yet applied. In force and applied to transactions. Replaced or expired. A final state. Withdrawn before use. A final state.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation the rate is set up for. Chosen when the rate is company specific. At most one organisation; empty means it applies to all. Decides which company's returns carry the tax.
  - name: TaxRegistration
    help: The registration of a party or organisation with a tax jurisdiction and its tax authority. A registration is the tax identity the business holds in a place, such as a VAT number. Recording it shows where the business may charge and must report tax and which number to print on invoices. Maintained by tax staff; read when invoicing and filing returns. A registration may belong to an organisation and is held in a jurisdiction. A registration is drafted, active while valid and completed when it ends. It may be cancelled before use. Completed and cancelled are final. The company's VAT registration in Germany, active since March 2022.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of one tax registration, unaffected by changes to the registration number. Generated on creation and never changed; tax transactions and filings refer to the registration through it. Lets documents and returns point at the registration. Referenced by returns and invoices.
      - name: status
        type: string
        enum: TaxRegistrationStatus
        help: Whether the registration is valid for use. Prevents tax numbers that have lapsed from appearing on documents. Starts as DRAFT; set by tax staff. Only active registrations are printed on invoices. Applied for or being recorded; not yet valid. Valid and in use. Ended, for example after deregistration. A final state. Withdrawn before use. A final state.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation that holds the registration. Chosen when recorded. At most one organisation. Decides which company files returns.
  - name: TaxRule
    help: A reusable tax determination policy that sets the treatment, rate, jurisdiction and applicability for qualifying goods, services, parties and transactions. Tax rules say what tax applies to what. Keeping them as dated policy lets the business change treatment on a given date without editing past transactions, and lets tax be explained from the rule that produced it. Maintained by tax staff; read by pricing and invoicing when working out tax. A rule may name a jurisdiction and the products, customers and organisations it applies to. A rule is drafted, active while in force, may be set inactive and back, and is retired when replaced. Retired is final. Rule "UK standard VAT" applies twenty percent to standard-rated goods sold to UK customers from 1 January 2011. Gross amount → discount → taxable base → resolve effective TaxRule → calculate tax → round → snapshot tax evidence → invoice total → accounting/tax reporting. Policy changes trigger revalidation of eligible open transactions, not retroactive mutation. Rate changes affect future determination and eligible open transactions; jurisdiction/scope changes trigger affected transaction validation; status changes prevent future selection; issued tax evidence remains unchanged.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the rule, constant when it is renamed. Generated on creation; tax lines refer to it. Referenced by every tax line it produced.
      - name: code
        type: string(100)
        unique: true
        help: The code of the rule, such as UK-VAT-STD. Unique; used in imports and reports. Read with the name.
      - name: name
        type: string(200)
        help: The descriptive name of the tax rule, such as Standard VAT on domestic goods. Entered by tax administrators; shown wherever a rule is chosen or explained, and should say what the rule covers. Read by tax staff.
      - name: rate
        type: decimal
        help: The rate applied, as a fraction of the taxable amount. Entered by tax staff; applied to the taxable amount. Read with the tax type.
        min: 0
      - name: jurisdiction_code
        type: string(100)
        optional: true
        help: The code of the jurisdiction the rule applies in. Entered to narrow the rule to a place. Matched to the transaction's place.
      - name: tax_type
        type: string
        enum: TaxRuleTaxType
        help: The kind of tax the rule works out. Chosen when the rule is created; returns are grouped by it. Decides which return the amount goes to. A sales tax charged at the point of sale. Value added tax charged at each stage. Goods and services tax. A tax on use of goods bought without sales tax. Tax held back from a payment. A tax of another kind.
      - name: valid_from
        type: datetime
        optional: true
        help: The date and time the rule takes effect. Set when the rule is created. Compared with the transaction date.
      - name: valid_to
        type: datetime
        optional: true
        help: The date and time the rule stops applying. Set when the rule is superseded. Compared with the transaction date.
      - name: status
        type: string
        enum: TaxRuleStatus
        help: Shows whether the tax rule is being drafted, applied to transactions, paused, or withdrawn. Moved by tax administrators; only active rules inside their validity dates are used to determine tax. The rule is being prepared and is not used for tax determination. The rule is in force and applied to qualifying transactions within its validity dates. The rule is switched off for now but can be reactivated. The rule has been withdrawn permanently and is kept for history. A final state.
        default: DRAFT
      - name: invoice_line_id
        type: string
        fk: true
        optional: true
        help: The InvoiceLine this TaxRule belongs to.
      - name: credit_note_line_id
        type: string
        fk: true
        optional: true
        help: The CreditNoteLine this TaxRule belongs to.
      - name: jurisdiction_id
        type: string
        fk: true
        references: Location
        optional: true
        help: The place the rule applies in. Chosen when the rule is place specific. At most one location. Limits the rule to transactions there.
  - name: TaxTransaction
    help: The tax consequence of a taxable business transaction, kept apart from payment and ledger posting. A tax transaction records how much tax arose on a sale or purchase and under what treatment. Keeping it on its own lets tax be reported and checked without changing the payment or accounting records. Created automatically from taxable documents; read by tax returns and audit. A tax transaction may belong to an organisation and follows a taxable document. A tax transaction is drafted, becomes active when reportable and completed once reported. It may be cancelled before. Completed and cancelled are final. The 20 tax charged on invoice INV-3041 is recorded as a tax transaction for the March VAT return.
    icon: percent
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of one tax transaction, separate from the sales or purchase document it arose from. Generated on creation and never changed; tax returns, reconciliations and audit entries refer to the tax consequence through it. Lets returns and the source document point at the same tax record. Referenced by returns.
      - name: status
        type: string
        enum: TaxTransactionStatus
        help: Where the tax transaction is in reporting. Shows whether the tax has been reported. Starts as DRAFT; moved by tax staff and returns. Only active transactions are included in a return. Calculated and not yet confirmed. Confirmed and due to be reported. Reported or settled. A final state. Withdrawn, for example after a credit. A final state.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organisation the tax is reported by. Chosen from the source document. At most one organisation. Decides which company's return includes it.
  - name: BillingCycle
    help: A recurring billing interval with its cut-off, which decides which period's charges a billing run picks up. Billing happens on a rhythm, such as monthly on the first. A billing cycle defines that rhythm, so charges are collected into the right invoice period and no charge is billed twice or missed. Defined by the billing team; assigned to accounts or contracts; read by billing runs to decide the period and cut-off for charge generation. Customers, contracts or subscriptions are assigned a cycle; the billing run generates charges for the period it defines. A cycle is drafted, active while it drives billing, completed when it is no longer used and cancelled if withdrawn before use. It must not rewrite charges already generated. A monthly cycle that closes on the last day of the month and invoices on the first working day of the next.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the billing cycle. Generated on creation; accounts and billing runs refer to the cycle through it.
      - name: status
        type: string
        enum: BillingCycleStatus
        help: Whether the cycle is being prepared, driving billing, or finished. Set by the billing team; only ACTIVE cycles are used to generate charges. Being defined; not yet used by billing runs. In force; billing runs use it to determine charge periods. No longer used for new billing; past runs remain valid. Withdrawn before it was used.
  - name: Charge
    help: A billable amount produced from a subscription, usage, service, product, fee or adjustment rule, before it is settled. A charge is the line between something the customer received and something they will be invoiced for. Holding it as a record lets billing check, adjust or cancel amounts before they become part of an invoice. Generated by billing runs and manual adjustments; reviewed before invoicing; read when a customer queries what they were billed for. A charge belongs to the Customer it is billed to. It never replaces the invoice, payment or ledger entries that follow from it. A charge is drafted, becomes active when ready to bill, completes when it has been invoiced and cancelled if it should not be billed. It does not rewrite cash, accounting or tax records. A monthly platform fee of 49.00 for March, generated by the billing cycle for a subscriber account.
    icon: file-text
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the charge. Generated on creation; invoice lines and adjustments refer to the charge through it.
      - name: status
        type: string
        enum: ChargeStatus
        help: Where the charge stands before it is billed. Moved by the billing run and by billing staff; only ACTIVE charges are picked up by invoicing. Generated but not yet checked; excluded from invoicing. Confirmed and waiting to be invoiced. Invoiced; the charge has done its job. Withdrawn and will not be billed.
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: The customer who is billed for the charge. Set when the charge is generated; invoices are assembled per customer. At most one customer; a charge for an internal cost centre may have none. Decides which invoice the charge lands on and whose credit exposure it affects.
  - name: Subscription
    help: A customer's subscription to a plan, product, service or entitlement over a defined life. A subscription is the ongoing agreement to supply something for a period. It records who subscribes and its state, while billing, usage and entitlement are recorded in their own records so none is duplicated. Created when a customer signs up; read by billing, support and account management. A subscription belongs to a customer and follows a plan. A subscription is drafted, active while it runs, and completes at the end of its term or is cancelled. Completed and cancelled are final. A customer subscribes to the Premium plan for twelve months from 1 March. Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows. Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    icon: repeat
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the subscription, constant for its life. Generated on creation; billing and entitlements refer to it. Referenced by invoices and usage records.
      - name: status
        type: string
        enum: SubscriptionStatus
        help: "Where the customer's subscription is in its life: being set up, running, finished or cancelled. Starts as DRAFT; account management activates it at sign-up, and billing and entitlements apply only while it is active. The subscription is being set up and does not yet bill or grant access. The subscription is running; charges are billed and entitlements are granted. The subscription reached its end date or fulfilled its term. A final state. The subscription was ended early by the customer or the business. A final state."
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: The customer who subscribes. Chosen when created. At most one customer; empty until identified. Decides who is billed and served.
  - name: SubscriptionPlan
    help: A reusable commercial plan that sets the recurring charges, usage, entitlements and billing terms of subscriptions. A plan is the product definition of a subscription. Defining it once lets many subscriptions share the same price and terms, and changing the plan leaves existing subscriptions on the terms they signed. Defined by product or pricing managers; chosen when a subscription is made. A plan is followed by subscriptions. A plan is drafted, active while offered, and completed when no longer offered. It may be cancelled before use. Completed and cancelled are final. The "Premium annual" plan charges 480 a year and includes five users.
    icon: repeat
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the plan, constant when renamed. Generated on creation; subscriptions refer to it.
      - name: status
        type: string
        enum: SubscriptionPlanStatus
        help: Whether the plan is still being defined, on sale, retired after its run, or withdrawn. Starts as DRAFT; pricing managers activate it to offer it, and only an active plan can be chosen for new subscriptions. The plan is being defined and cannot yet be sold. The plan is on offer and customers can subscribe to it. The plan has run its course and is no longer offered, though existing subscriptions keep their terms. A final state. The plan was withdrawn without ever being fully offered. A final state.
  - name: UsageRecord
    help: A fixed record of measured usage, either a single event or an aggregate, used for usage-based entitlement and billing. A usage record is the evidence of how much a customer consumed, such as minutes or gigabytes. It feeds billing and entitlement checks and, because it is never rewritten, can be shown to the customer if a charge is queried. Created by metering systems; read by billing and customer support. A usage record may relate to a customer. A record is drafted and becomes active when confirmed, then completed once billed. It may be cancelled if recorded in error. Completed and cancelled are final. 1,240 call minutes used by a customer in March are recorded as one usage record.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent identifier of the usage record, unchanged for as long as the record exists. Generated on creation by the metering system; invoice lines and disputes cite it to show which measured usage was billed. Lets invoice lines point at the exact usage they charged for. Referenced by billing lines.
      - name: status
        type: string
        enum: UsageRecordStatus
        help: Where the record is in billing. Shows whether usage has been confirmed and charged. Starts as DRAFT; moved by metering and billing. Only active records are charged. Received and not yet confirmed. Confirmed and waiting to be billed. Billed. A final state. Discarded as recorded in error. A final state.
      - name: customer_id
        type: string
        fk: true
        optional: true
        help: The customer whose usage it is. Chosen from the metered account. At most one customer; empty until matched. Decides whom to charge.
  - name: AssetClass
    help: A classification of assets that carries default accounting, depreciation, lifecycle and control rules for every asset placed in it. Without classes every asset would need its own depreciation method and useful life. A class holds those policies once so assets of the same kind, such as vehicles, buildings or IT equipment, are treated consistently. Set up by asset accountants and policy owners; chosen when an asset is registered so its defaults are inherited. Assets are assigned to a class; the class's accounting defaults feed depreciation and the ledger. A class is defined, used by assets, and eventually closed to new assets; history keeps the policy that applied when each asset was registered. The Vehicles class sets straight-line depreciation over five years and requires an insurance record for each asset.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the asset class. Generated on creation; assets and policies refer to the class through it.
      - name: effective_at
        type: datetime
        optional: true
        help: When this version of the class's rules takes effect. Set when the class is defined or its policy revised, so each asset can be evaluated under the rules in force on its own dates.
  - name: AssetAcquisition
    help: The event by which an organisation takes on an asset, with the context needed to capitalise it, while the accounting entry itself stays in the journal. Acquiring an asset is a business event with its own date, source and cost. Recording it separately keeps the asset register and the ledger consistent without mixing the story of how the asset arrived into the asset itself. Created when an asset is purchased, built, leased in or received as a transfer in; read by asset accounting for capitalisation and depreciation start dates. Each acquisition refers to the Asset it brought into the register; the related JournalEntry holds the accounting posting. The event is recorded once and is then evidence. Errors are corrected by a compensating or superseding record rather than by editing the original. A forklift purchased on 3 March for 28,000 is recorded as an acquisition of that asset effective on delivery, from which depreciation starts.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of this acquisition event, so corrections and postings can refer to it. Generated on creation; journal entries and audit records point back to it.
      - name: effective_at
        type: datetime
        optional: true
        help: The date and time from which the organisation treats itself as holding the asset. Entered from the delivery or transfer document; it starts depreciation and ageing, so it is the date finance relies on.
      - name: asset_id
        type: string
        fk: true
        help: The asset that was acquired. Chosen when the acquisition is recorded; one asset is normally acquired once. Exactly one asset per acquisition event. Links the capitalisation event to the register entry it created.
  - name: AssetDepreciation
    help: Represents the financial measurement of how an Asset's depreciable value is consumed over time or usage. AssetDepreciation translates an asset's economic consumption into an accounting measure. It is not a description of physical condition; an asset can be heavily depreciated while remaining operational, or have a high book value while requiring significant repair. Used by fixed-asset accounting, period close, financial reporting, asset valuation, disposal analysis, budgeting, management reporting, and repair/disposition economics. Asset identifies the resource. AssetDepreciation supplies the accounting method and resulting financial measures. RepairEstimate may compare estimated repair cost or sale value against net book value, but those are different business concepts. MaintenanceWorkOrder captures physical work and actual maintenance execution; depreciation captures accounting consumption. A depreciation schedule begins when an asset becomes subject to the applicable accounting policy, accumulates depreciation through accounting periods or usage, may be revised after approved accounting changes, and ends or is settled when the asset is disposed, retired, fully depreciated, or otherwise removed from the relevant accounting basis. A container acquired for 10,000 units of currency has a defined salvage value and useful life. Under STRAIGHT depreciation, its depreciable base is allocated over the useful life. A RepairEstimate later evaluates a 3,000-unit repair against its net book value and expected sale value; the depreciation record provides the accounting baseline but does not determine the repair decision by itself.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the depreciation record or schedule. Used to trace depreciation calculations, accounting periods, revisions, reporting, and financial integrations. Identifies the depreciation record; Asset identifies the resource being measured and the schedule's parameters determine how depreciation is calculated.
      - name: depreciation_method
        type: string
        enum: AssetDepreciationDepreciationMethod
        help: Defines the mathematical or business method used to allocate an asset's depreciable value over its useful life or usage. Drives depreciation calculations, period expense, net book value, forecasting, and financial reporting. The method must be interpreted together with depreciableBase, salvageValue, usefulLifeMonths, usage metrics, and the accounting policy governing the Asset. Allocates depreciable value systematically over the defined useful life, normally producing an approximately even periodic depreciation amount. Calculates depreciation using the asset's remaining depreciable value and remaining useful life under the organization's remaining-life policy. Applies a declining-balance approach in which depreciation is calculated at a defined rate against an appropriate declining carrying base. Allocates depreciation based on usage units or output relative to the expected total units, appropriate where consumption rather than elapsed time drives asset value reduction.
      - name: depreciation_rate
        type: decimal
        optional: true
        help: The rate used by applicable depreciation methods to calculate the portion of the depreciable base recognized during a period. Used by declining-balance or other rate-driven calculations and for financial forecasting. Rate is method-dependent; it must not be interpreted as a universal percentage independent of depreciationMethod.
      - name: salvage_value
        type: decimal
        optional: true
        help: The expected residual value that the asset's carrying amount should generally not depreciate below under the applicable accounting policy. Used to determine the depreciable base, depreciation limits, disposal analysis, and residual-value reporting. Salvage value is an accounting assumption and is distinct from current market sale value or an estimated sale amount in a RepairEstimate.
      - name: useful_life_months
        type: integer
        optional: true
        help: The expected number of months over which the asset's depreciable value is allocated under a time-based depreciation policy. Used for straight-line and remaining-life calculations, asset planning, forecasting, and depreciation schedules. Useful life is an accounting assumption about consumption of economic benefit and is not necessarily the physical service life or maintenance interval.
        min: 0
      - name: depreciable_base
        type: decimal
        optional: true
        help: The portion of the asset's value subject to depreciation after considering the applicable acquisition basis and residual-value rules. Provides the financial basis from which depreciation expense is calculated. It is related to Asset acquisition cost and salvage value but may differ because capitalization, impairment, revaluation, or accounting adjustments can change the depreciable basis.
      - name: accumulated_depreciation
        type: decimal
        help: The cumulative depreciation recognized against the asset under this schedule up to the relevant accounting point. Used to determine carrying value, period depreciation, disposal gain or loss, and financial reporting. It is an accumulated financial measure and should not be confused with physical wear, repair cost, or market-value reduction.
        default: "0"
      - name: net_book_value
        type: decimal
        optional: true
        help: The asset's carrying amount after recognized depreciation and other applicable accounting adjustments under this schedule. Used for balance-sheet reporting, disposal analysis, impairment assessment, management reporting, and asset valuation. Net book value is an accounting measure and should not be interpreted as market sale value, repair-adjusted value, or predicted disposition value.
      - name: asset_id
        type: string
        fk: true
        help: Identifies the individual Asset whose financial depreciation is being measured. Connects depreciation calculations to the asset's acquisition, lifecycle, ownership, maintenance, and disposal history. Exactly one Asset is measured by a depreciation record. Asset is the physical/accountable resource; AssetDepreciation is the financial measurement of that resource.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized product or equipment definition relevant to the depreciated asset. Supports fleet/class-level depreciation analysis, equipment reporting, and policy assignment. Zero or one Product may be linked when depreciation policy is associated with a product class or model. Product describes the reusable model; depreciation remains attached to the individual Asset and its accounting context.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: Identifies the currency in which monetary depreciation values are expressed. Used to interpret depreciable base, accumulated depreciation, salvage value, and net book value in financial reporting. Zero or one Currency may be linked when currency is inherited from the accounting ledger or financial context. Currency gives monetary values their denomination and does not define the depreciation method or asset identity.
  - name: AssetDisposal
    help: The event by which an organisation retires, sells, scraps or otherwise disposes of an asset, with its operational and accounting consequences. Disposal ends an asset's life in the register. Recording it as an event shows how and when the asset left, supports the gain or loss calculation, and stops the asset being used by mistake. Created when an asset is sold, scrapped, donated or written off; read by finance for the disposal entry and by operations to confirm the asset is gone. Each disposal points to the Asset it removes; the accounting posting lives in the journal. A disposal is recorded once and becomes evidence; mistakes are corrected by a reversing or superseding record, and a reinstated asset needs an explicit process. A damaged delivery van is sold for scrap on 12 June; the disposal records the sale and the asset leaves the active register.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of this disposal event. Generated on creation; journal entries and audit refer to it.
      - name: effective_at
        type: datetime
        optional: true
        help: The date and time at which the organisation ceased to hold the asset. Taken from the sale, scrap or write-off document; depreciation stops and the gain or loss is measured at this date.
      - name: asset_id
        type: string
        fk: true
        help: The asset that was disposed of. Chosen when the disposal is recorded; the asset then stops being offered for new assignments. Exactly one asset per disposal event. Marks the end of the asset's operational life while keeping its history.
  - name: AssetTransfer
    help: The event by which responsibility for an asset, its location, organisational assignment or custody moves, without rewriting how the asset was acquired. Assets move between departments, sites and custodians during their life. A transfer records that move as an event, so the asset's current owner and place are right while its earlier history stays intact. Created when an asset is relocated, reassigned or handed over; read to answer who held an asset when and for audits of custody. Each transfer points to the Asset that moved; the register reflects the latest effective transfer. A transfer is recorded once and is then evidence. A wrong transfer is corrected by a further transfer rather than an edit. A laptop moves from the Sales department in Berlin to Support in Madrid on 1 September.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of this transfer event. Generated on creation; history and audit queries refer to it.
      - name: effective_at
        type: datetime
        optional: true
        help: When the move took effect. Taken from the hand-over document; the asset's current assignment is the latest transfer whose effective date has passed.
      - name: asset_id
        type: string
        fk: true
        help: The asset being moved. Chosen when the transfer is recorded. Exactly one asset per transfer; moving several assets means several transfers. Keeps custody history for each asset separate from its acquisition.
  - name: ForeignExchangeTransaction
    help: An agreement or execution that exchanges one currency for another at defined amounts, rate, dates and counterparties. Whenever money changes currency, a rate is fixed and an obligation arises. This record preserves the terms so the gain or loss, the cash movement and the accounting can be explained. Created when a trade is agreed; settled on the value date; read by treasury and accounting. A transaction exchanges two currencies between counterparties and may be linked to payments and journal entries. Finalised financial evidence is corrected by compensating or superseding records, not edited. Buying 1,000,000 EUR for USD at 1.0840 for value in two days.
    icon: file-text
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the exchange transaction. Generated on creation; settlement and accounting refer to it.
      - name: effective_at
        type: datetime
        optional: true
        help: When the exchange takes effect (the value date). Set from the deal; cash moves on this date.
  - name: CashPosition
    help: Reproducible point-in-time treasury liquidity view. CashPosition summarizes cash; BankTransaction supplies external evidence, Payment supplies internal settlement state, and JournalEntry supplies accounting recognition. Daily cash management, liquidity, funding, payment planning and treasury reporting. BankAccount defines account/currency; bank transactions and payments supply observed/pending cash evidence. Calculated for an as-of cutoff → reviewed/published where required → retained or superseded by later snapshots. New/reversed/reconciled cash evidence affects subsequent positions and forecasts, not source transaction history.
    icon: briefcase
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The permanent system identity of one cash snapshot for a bank account at a cut-off time. Generated when the position is calculated; forecasts, funding decisions and audit trails refer to that snapshot through it. Identifies one reproducible treasury position. Derived from BankAccount and cash evidence.
      - name: as_of
        type: datetime
        help: The date and time of the cut-off for which balances and pending items were calculated. Chosen when the snapshot is taken, such as end of day or an intraday check; the position must be reproducible from evidence at that moment. Defines evidence cutoff. Transactions after cutoff are excluded.
      - name: ledger_balance
        type: Money
        help: The balance according to the books at the cut-off, including items not yet cleared at the bank. Baseline cash amount. Treasury reporting. Must be reproducible from authoritative evidence.
      - name: available_balance
        type: Money
        help: The amount that can actually be spent at the cut-off, after holds and pending items. Liquidity available after restrictions/pending effects under policy. Funding and payment decisions. Currency must match account/position currency.
      - name: forecast_balance
        type: Money
        optional: true
        help: The expected balance at a future date, based on scheduled receipts and payments. Forward liquidity estimate, not posted cash. Treasury planning. Must identify forecast policy/horizon externally or through consuming process.
      - name: bank_account_id
        type: string
        fk: true
        help: Exactly one bank account; each snapshot describes a single account in a single currency. Bank account positioned. Defines cash account context. Treasury and reconciliation. Account status/currency constrain calculation.
  - name: Interest
    help: An interest accrual or charge calculated for an eligible balance, on a rate basis, for a period. Interest turns time and balance into money. Recording each calculation, with its inputs and period, lets finance explain what was charged or earned and recompute it if the basis is challenged. Produced by interest runs on loans, deposits and receivables; posted to the ledger; read by finance and customers. Interest refers to the balance and rate it was computed from and to the ledger entries that record it. Finalised financial evidence is corrected by compensating or superseding records and never overwritten. Interest of 41.67 accrued for March on a 10,000 deposit at a 5% annual rate. Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
    icon: table
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the interest record. Generated by the interest run; postings and statements refer to it.
      - name: effective_at
        type: datetime
        optional: true
        help: The date and time as of which the interest was calculated. Set by the run, normally the end of the accrual period; it decides the period the interest belongs to.
  - name: PurchaseOrderLine
    help: "One item ordered on a purchase order, with the quantity, price and the progress of receipt, invoicing and return. The line is where the commitment is made precise: which product, how many, at what price and from what source. It keeps the price as agreed at the time and tracks what has since arrived, been accepted, returned and is still owed, so the order's completion can be judged line by line. Created with the order, from a requisition or quotation line; updated as goods arrive; read by receiving, accounts payable and buyers. A line belongs to one order and product, may come from a quotation or requisition line, and is matched by receipt, invoice and return lines. A line follows its order: open until fully received, then settled. Its quantities change only through receipts and returns. Line 2 of PO-5120 orders 400 bolts at 0.35 each; 250 have been received and 150 are outstanding. Pricing → commitment → receipt → acceptance → InventoryMovement; if goods are returned, eligible accepted quantity → SupplierReturnLine → InventoryMovement reversal → SupplierCreditNoteLine. Historical commitment remains unchanged."
    icon: shopping-cart
    parent: PurchaseOrder
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the line, constant for its life. Generated on creation; receipt and invoice lines refer to it. Referenced when matching receipts and invoices.
      - name: line_number
        type: integer
        help: The position of the line on the order. Assigned in sequence; used to refer to the line in documents. Read with the order number to name a line.
        min: 1
      - name: quantity
        type: decimal
        help: The quantity ordered, in the line's unit of measure. Entered when ordering; receipts are measured against it. Compared with received quantity to find what is outstanding.
      - name: unit_price
        type: Money
        help: The price for one unit, as agreed when the order was placed. Set from the price source; kept even if prices later change. Multiplied by quantity to give the line amount.
      - name: line_amount
        type: Money
        help: "The value of the line: quantity times unit price. Calculated; summed into the order total. Matched against the invoiced amount."
      - name: received_quantity
        type: decimal
        help: The total quantity of this line that has physically arrived from the supplier so far, accepted or not. Increased by goods receipt lines; compared with the ordered quantity to show what is outstanding, and never negative. Compared with accepted quantity to find rejections.
        default: "0"
      - name: accepted_quantity
        type: decimal
        help: The quantity received and accepted after inspection. Increased as receipts are accepted; invoicing is matched to it. Never more than the received quantity.
        default: "0"
      - name: returned_quantity
        type: decimal
        help: The total quantity of this line that has been sent back to the supplier after receipt. Increased by supplier return lines; must not exceed what was accepted unless an exception is authorised, and does not reopen the original commitment. Reduces the accepted quantity that is payable.
        default: "0"
      - name: outstanding_quantity
        type: decimal
        help: The quantity still to be delivered. Calculated from ordered, received and returned; read by expediters. Reaches zero when the line is fully delivered.
        default: "0"
      - name: price_source
        type: string
        optional: true
        enum: PurchaseOrderLinePriceSource
        help: Where the unit price on this line came from, such as a price list, a contract or a buyer's manual entry. Recorded when the price is determined; supports audit, spend analysis and supplier negotiation by showing which agreement justified the price. Taken from the supplier's published price list in force at the time. Taken from a negotiated contract with the supplier. Taken from a standing supplier agreement covering repeat purchases. Taken from a supplier quotation that the buyer accepted. Typed in by the buyer without a supporting agreement. Determined in some other way not covered by the listed sources. Does not replace transaction-time unitPrice. Explains price determination.
      - name: price_determined_at
        type: datetime
        optional: true
        help: The date and time at which the price on this line was fixed. Recorded when the price is determined; lets later audits tell which effective-dated price applied even after price lists change. Distinct from PurchaseOrder creation time. Anchors commercial pricing evidence.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The unit the quantity is expressed in. Defaults to the product's purchasing unit. At most one unit; empty uses the product's default. Defines how quantity is interpreted. Must reconcile with receiving and return conversions.
      - name: purchase_order_id
        type: string
        fk: true
        help: The purchase order this line belongs to. Set when the line is added. Exactly one order; a line cannot stand alone. Supplies supplier, organization, currency and lifecycle context. Controls commitment and closure.
      - name: product_id
        type: string
        fk: true
        help: The product being ordered. Chosen when the line is entered. Exactly one product per line. Identifies what was committed. Must reconcile across receipt, return and invoice evidence.
  - name: SalesOrderLine
    help: "One product or service on a sales order, with its quantity, price, discount, tax and fulfilment progress. The line is the precise commitment: what, how many, at what price from which source. It tracks how much has been reserved, shipped and billed, so each line can be followed to completion and the price the customer agreed is preserved. Created with the order; updated as stock is allocated and shipped; read by warehouse and billing. A line belongs to one order and product, and is matched by shipments, reservations and invoice lines. A line follows its order. Its allocated and fulfilled quantities grow as stock is reserved and shipped. Line 2 of SO-10482 orders 40 units at 18.50; 25 are allocated and 15 shipped. Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation. quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only. Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing."
    icon: shopping-cart
    parent: SalesOrder
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the line, constant for its life. Generated on creation; shipments and invoices refer to it. Referenced when delivery and billing are matched.
      - name: line_number
        type: integer
        help: The position of the line on the order. Assigned in sequence; used to refer to the line. Read with the order number to name a line.
        min: 1
      - name: quantity
        type: decimal
        help: The number of units of the product or service the customer ordered on this line. Entered by sales; stock allocation, shipment and invoicing are all measured against it, and it drives the line amount. Compared with allocated and fulfilled quantity.
      - name: quantity_fulfilled
        type: decimal
        help: How many units of the ordered quantity have been shipped or delivered so far. Increased by each shipment and never above the ordered quantity; the line is fulfilled when it equals the quantity. Reaching the ordered quantity completes the line.
        default: "0"
      - name: quantity_allocated
        type: decimal
        help: The quantity of stock reserved for the line. Increased by reservations; read by the warehouse. Compared with the quantity still to ship.
        default: "0"
      - name: unit_price
        type: Money
        help: Agreed transaction-time price per unit including currency. Order valuation, invoicing, margin, credit and reconciliation. Must align with SalesOrder currency and UnitOfMeasure pricing basis. Authoritative commercial price for downstream billing unless controlled repricing occurs.
      - name: discount_amount
        type: Money
        optional: true
        help: The money taken off this line by the discount agreed when the order was taken. Set when the price is determined and approved under discount policy; subtracted in the line amount and shown on invoices. Currency must match order pricing currency. Preserves the concession actually granted rather than relying on current DiscountRule.
      - name: tax_amount
        type: Money
        optional: true
        help: Tax determined for the order line when tax is calculated at order stage. Supports order and invoice reconciliation. Determination may depend on Product, Customer, address, location, date and TaxRule. Preserves tax evidence when the order commits to a tax amount.
      - name: line_amount
        type: Money
        help: The net value of the line after quantity, price, discount and tax have been worked out. Calculated by the system rather than typed; summed into order totals, invoiced, and used for credit checks and reporting. Must reconcile with pricing, discount, tax and rounding policy. Financial baseline for downstream billing and reconciliation.
      - name: price_source
        type: string
        optional: true
        enum: SalesOrderLinePriceSource
        help: Where the price on the line came from. Set when the price is determined. Lets a disputed price be traced. Taken from the price list. Taken from a contract with the customer. Taken from a standing customer agreement. Taken from an accepted quotation. Entered by the salesperson. Set by a promotion. Determined some other way.
      - name: price_determined_at
        type: datetime
        optional: true
        help: The date and time the unit price for this line was fixed. Stamped when pricing runs and kept, so a later price list change does not alter what the customer was quoted. Used to explain which price list was in force.
      - name: unit_of_measure_id
        type: string
        fk: true
        optional: true
        help: The unit the quantity is expressed in. Defaults to the product's selling unit. At most one unit; empty uses the default. Makes the quantity unambiguous.
      - name: sales_order_id
        type: string
        fk: true
        help: Links a sales order line to sales order, the sales order it relates to. Chosen from the existing sales order records when the sales order line is created or edited. A sales order line has exactly one sales order in this role. Lets the sales order line be found from, and reported with, its sales order.
      - name: product_id
        type: string
        fk: true
        help: The product ordered. Chosen when the line is entered. Exactly one product per line. Decides what stock is allocated and shipped.
  - name: BankAccount
    help: Represents the controlled banking account context through which cash is received, disbursed, observed, and reconciled. BankAccount is master data for the financial account; it is not a bank transaction, payment, or accounting entry. Central to treasury, Payment execution, BankTransaction ingestion, bank reconciliation, cash reporting, and accounting. Party provides ownership context. Organization provides the financial institution. Payment represents internal settlement events. BankTransaction represents external statement evidence. JournalEntry represents accounting consequences. BankAccount setup → verification → activation → Payment execution/receipt → BankTransaction import → account/date/currency/reference reconciliation → Payment clearing → accounting reconciliation. Account closure affects future activity but preserves historical evidence. Pending → active → blocked or closed. Lifecycle controls future operational use and never deletes historical transactions. A USD current account at a bank is ACTIVE. Customer Payments are received into it, corresponding USD BankTransactions are imported from the bank feed, each is reconciled to the appropriate Payment, and the Payment becomes CLEARED only after controlled matching.
    icon: landmark
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the internal BankAccount master record. Identifies the account independently of its institution, number, currency, or current lifecycle state. Used by Payment, BankTransaction, reconciliation, treasury, accounting, and integrations. The identifier is the CEDM identity; accountNumber is an operational banking identifier. Provides the stable account context for payment execution and statement reconciliation.
      - name: account_number
        type: string(100)
        help: Banking identifier for the account, subject to applicable security and masking controls. Identifies the account at the financial institution for operational settlement and reconciliation. Used for payment routing, bank-feed matching, statements, and treasury operations, subject to sensitive-data controls. Must be interpreted with institution and account identity; it is not a CEDM entity identifier. Allows external bank activity and payment instructions to be associated with the correct account.
      - name: account_type
        type: string
        enum: BankAccountAccountType
        help: A transaction account for everyday receipts and payments. An interest-bearing account held mainly to accumulate balances. An account carrying borrowing from the bank. An account holding money on behalf of others until conditions are met. Any other kind of account. Classification of the banking account's operational purpose. Describes how the account is intended to function in treasury and settlement processes. Used for payment eligibility, cash reporting, treasury controls, and accounting configuration. Account type does not determine accounting treatment by itself; ledger configuration may provide additional context. Helps determine which Payment directions and banking operations are appropriate.
      - name: currency_id
        type: string
        fk: true
        help: Currency in which the bank account is normally denominated. Establishes the account's primary monetary denomination and expected statement currency. Used by Payment, BankTransaction, reconciliation, cash reporting, and treasury controls. A BankTransaction normally uses the account currency, although supported multi-currency bank products may require additional transaction-level currency rules. Provides a currency baseline for validating Payment and BankTransaction activity.
      - name: status
        type: string
        enum: BankAccountStatus
        help: Opened or requested but not yet confirmed by the bank; not available for payments. Open and available for receipts and payments. Temporarily frozen, for example for compliance reasons; no new payments should be routed to it. Permanently closed; history remains for reconciliation and audit. Lifecycle state controlling whether the account can participate in new banking operations. Indicates whether the account is awaiting activation, available, restricted, or closed. Used by Payment execution, bank-feed ingestion, reconciliation, treasury, and account administration. Closing an account must not invalidate historical BankTransactions, Payments, or JournalEntries. ACTIVE permits normal use; BLOCKED prevents applicable new activity; CLOSED prevents new normal use while historical evidence remains accessible.
        default: PENDING
      - name: institution_id
        type: string
        fk: true
        references: Organization
        help: Financial institution maintaining the bank account. Supports bank-feed configuration, payment routing, statements, reconciliation, and institution-specific rules. Exactly one institution maintains the account in this model. Connects account operations to the correct banking organization.
  - name: Asset
    help: Represents the long-lived business object for a durable resource whose identity, ownership, location, maintenance, financial treatment, and lifecycle must be managed over time. Asset is the instance-level concept used when an organization must manage a specific physical or accountable resource rather than merely a product type. A container, vehicle, machine, aircraft, or facility equipment item can be represented as an Asset when individual lifecycle and accountability matter. Used across asset management, maintenance, finance, depreciation, inventory, logistics, leasing, insurance, compliance, and operational planning. Product describes what the asset is as a standardized model. Asset identifies the individual resource. Location describes current operational placement. MaintenanceWorkOrder records maintenance activity. AssetDepreciation records financial measurement. Organization identifies ownership when applicable. Historical movements and transactions should preserve changes rather than overwriting the asset's identity. An asset may be planned before entering service, active during productive use, under maintenance while temporarily unavailable, held pending a business decision, disposed when ownership/control has ended, or retired when operational use has ceased. Lifecycle state should not erase history; it changes how current processes may act on the asset. A shipping container is acquired and assigned an assetNumber and serial/equipment identity. It is linked to a Product model, located at a depot, receives MaintenanceWorkOrder records during its service life, and has AssetDepreciation records for financial reporting. When its repair economics no longer justify continued use, a RepairEstimate may recommend SALE or SCRAP; the resulting disposition changes the asset lifecycle while preserving its historical record.
    icon: box
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the asset master record. Used to connect maintenance, depreciation, movements, ownership, location, and other lifecycle records to the same physical or accountable asset. assetId identifies the asset itself; assetNumber and serialNumber are business-facing or manufacturer identifiers and must not replace the stable CEDM identity.
      - name: asset_number
        type: string(100)
        unique: true
        help: The organization-assigned business identifier used to recognize an asset in operational and financial processes. Used by asset managers, maintenance teams, finance, warehouse operations, reports, documents, and users when referring to the asset. It is the organization's business reference, while serialNumber may identify the manufacturer's physical equipment identity and assetId remains the immutable CEDM identity.
      - name: name
        type: string(300)
        help: A human-readable description of the asset used to identify it in lists, forms, reports, and operational communication. Supports search, maintenance screens, asset registers, reporting, and user recognition when an asset number alone is insufficient. The name describes this asset instance and should not be confused with Product.name, which describes a reusable product definition or asset type.
      - name: asset_type
        type: string(100)
        help: Classifies the kind of durable resource represented by the asset, such as container, vehicle, machine, building equipment, or other capital-controlled resource. Drives asset policies, maintenance programs, depreciation treatment, reporting, authorization, and lifecycle rules. assetType classifies the asset instance; Product can provide the standardized model or product definition from which the asset originated.
      - name: acquisition_date
        type: date
        optional: true
        help: The business date on which the organization acquired or otherwise recognized control of the asset. Used for capitalization, depreciation start rules, asset aging, warranty analysis, lifecycle reporting, and ownership history. AcquisitionDate concerns the organization's acquisition event and is distinct from manufacture date, commissioning date, or first operational use.
      - name: acquisition_cost
        type: money
        optional: true
        help: The capitalized or recognized cost associated with acquiring the asset under the organization's accounting policy. Used as an input to capitalization, depreciation, book-value calculations, asset valuation, and financial reporting. Acquisition cost is an accounting/business value and should not be confused with Product price, repair cost, sale price, or current market value.
      - name: status
        type: string
        enum: AssetStatus
        help: The lifecycle state describing whether the asset is planned, operational, temporarily unavailable, disposed, or retired. Controls operational availability, maintenance eligibility, reporting, depreciation policy, and downstream business actions. Asset status describes the asset's lifecycle, while MaintenanceWorkOrder status describes a particular maintenance activity. An asset can be UNDER_MAINTENANCE while a work order is IN_PROGRESS. The asset is expected to enter service or be recognized operationally but is not yet active. The asset is available for its intended business use subject to normal operational constraints. The asset is temporarily undergoing maintenance and may be unavailable or restricted from normal use. The asset is intentionally retained but is not currently available for normal productive use, often pending inspection, disposition, or another decision. The organization has completed the disposition process and no longer treats the asset as an active managed resource. The asset has been withdrawn from operational use, while historical records may remain available for audit and analysis.
        default: PLANNED
      - name: serial_number
        type: string(200)
        optional: true
        help: The manufacturer or industry identifier permanently associated with the physical equipment when such an identifier exists. Used for equipment traceability, warranty, maintenance history, inspections, recalls, regulatory reporting, and physical identification. SerialNumber identifies physical equipment supplied by a manufacturer; it is different from the organization's assetNumber and CEDM assetId.
      - name: owner_id
        type: string
        fk: true
        references: Organization
        optional: true
        help: Identifies the organization that legally or commercially owns the asset when ownership is relevant to the asset model. Used for ownership reporting, financial accountability, insurance, maintenance responsibility, leasing, and disposition. Zero or one owner may be recorded because ownership may be external, shared, represented by a separate agreement, or maintained in another system. Owner is an organizational relationship; it is distinct from the Party that currently possesses, leases, operates, or maintains the asset.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Identifies the current operational location at which the asset is recorded or physically situated. Used for maintenance dispatch, inventory visibility, asset tracking, utilization, inspections, and operational planning. Zero or one current location may be recorded when the asset is mobile, in transit, or its location is maintained through a separate movement system. Location is current state; historical movements should be preserved through movement/event entities rather than inferred from a changing location field.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized product or equipment model from which the asset instance was created or classified. Used for technical specifications, spare-parts planning, maintenance standards, procurement, fleet classification, and analytics. Zero or one Product may be linked because not every managed asset has a corresponding product-master definition. Product represents the reusable definition or model; Asset represents the individually managed instance.
  - name: Product
    help: A canonical business offering or managed item that can be bought, sold, stocked, consumed, delivered or subscribed to, and that other processes refer to. Product is the shared definition of what the business deals in. Sales, purchasing, stock, manufacturing and finance all refer to the same product record, so a price, a stock level and an invoice line are about the same thing. Created by product management when an item enters the catalogue; maintained over its life; referenced on almost every order, movement and invoice line. A product belongs to a ProductCategory and Brand, is supplied by Suppliers, is stored at Locations, has variants, attributes, packaging and a lifecycle history, and appears on order, stock and invoice lines. A product is drafted, becomes active when approved for trade, can be blocked while an issue is resolved, and ends discontinued or retired. History and past documents keep their reference. Item A-200, "Cordless drill 18V", a finished good in the Power Tools category, sold in cartons of four. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration.
    icon: package
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The identity of the product, which never changes even when its code or name does. Generated on creation; order lines, stock and invoices refer to it.
      - name: code
        type: string(100)
        unique: true
        help: The code by which staff and systems name the product. Unique; assigned by product management and used in orders, price lists and integrations.
      - name: name
        type: string(300)
        help: The name of the product as shown to users and customers. Shown in catalogues, on documents and in search results.
      - name: description
        type: string(4000)
        optional: true
        help: A longer description of what the product is. Written by product management; used on websites, quotes and datasheets.
      - name: product_type
        type: string
        enum: ProductProductType
        help: What kind of offering the product is, which decides how it is bought, stocked and delivered. Chosen on creation; stock rules apply only to physical types. A finished physical item that is bought or sold and held in stock. A raw material or component consumed in production. Work performed for a customer, not held in stock. A recurring entitlement billed on a schedule. A durable item the business keeps and depreciates. A package of other products sold together. Anything else that is traded.
      - name: status
        type: string
        enum: ProductStatus
        help: Whether the product can currently be traded. Set by product management; new orders are accepted only for ACTIVE products. Being set up; not yet tradable. Available for ordinary trading. Being phased out; existing stock may be sold but it is not reordered. A final state. Temporarily barred from trading, for example during a quality or compliance issue. Removed from the catalogue; kept for history. A final state.
        default: DRAFT
      - name: sku
        type: string(100)
        optional: true
        help: The stock-keeping unit code used in warehouses and on retail systems. Assigned at creation; printed on labels and scanned during handling.
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
        help: The base unit in which the product is counted, such as each or kilogram. Chosen on creation; stock and order quantities are converted to it.
      - name: standard_price
        type: money
        optional: true
        help: The standard selling price of the product. Set by pricing; quotes and orders start from it before discounts.
      - name: tax_category
        type: string(100)
        optional: true
        help: The tax category that decides how the product is taxed. Chosen on creation; tax rules look it up when documents are priced.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
      - name: tax_rule_id
        type: string
        fk: true
        optional: true
        help: The TaxRule this Product belongs to.
