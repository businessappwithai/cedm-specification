entity:
  name: GovernmentCase
  namespace: cedm.domain
  kind: public_sector_entity
  description: A government case representing an application, request, investigation, benefit, permit, or public-service matter.
  ui:
    icon: briefcase
  identity:
    key: governmentCaseId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: governmentCaseId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the case.
        usage: Generated on creation.
    - name: caseNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number of the case, quoted in all correspondence.
        usage: Allocated on submission; unique.
    - name: caseType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of matter, such as permit, benefit claim or inspection.
        usage: Chosen at submission; decides the workflow and the documents required.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - OPEN
        - UNDER_REVIEW
        - APPROVED
        - DENIED
        - CLOSED
        - CANCELLED
      help:
        summary: Where the case stands.
        usage: Moved by caseworkers.
        valueSemantics:
          DRAFT: Being prepared by or for the applicant.
          OPEN: Submitted and awaiting review.
          UNDER_REVIEW: Being assessed.
          APPROVED: The matter was decided in the applicant's favour.
          DENIED: The matter was refused. A final state.
          CLOSED: Completed after approval. A final state.
          CANCELLED: Withdrawn before a decision. A final state.
    - name: openedAt
      type: datetime
      required: true
      help:
        summary: When the case was opened.
        usage: Set on submission; statutory deadlines run from it.
    - name: closedAt
      type: datetime
      required: false
      help:
        summary: When the case was closed.
        usage: Set on closure; must not be before the opening date.
  relationships:
    - name: applicant
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The people or organisations that applied.
        usage: Added at submission.
        cardinalityMeaning: Any number of applicants, including a family or joint applicants.
        workflowRole: Identify who the decision is for.
    - name: agency
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The agency responsible for the case.
        usage: Set at submission.
        cardinalityMeaning: 'Exactly one agency: a single body is accountable for the decision.'
        workflowRole: Determines which rules apply.
    - name: tasks
      target: Task
      cardinality: 0..*
      ownership: reference
      help:
        summary: The tasks carried out in handling the case.
        usage: Created by the workflow or caseworker.
        cardinalityMeaning: Any number.
        workflowRole: Record the work done.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents supplied or issued.
        usage: Added during handling.
        cardinalityMeaning: Any number.
        workflowRole: Form the evidence on which the decision is based.
  invariants:
    - id: GOV-CASE-001
      rule: closedAt must not precede openedAt.
    - {id: GOVERNMENT-CASE-EXE-001, rule: "A government case that is closed states when (closed at).", violatedWhen: "status == \"CLOSED\" and closed_at == null", message: "Record closed at when the government case is closed."}
  lifecycle:
    title: Government Case Lifecycle
    attribute: status
    states: [DRAFT, OPEN, UNDER_REVIEW, APPROVED, DENIED, CLOSED, CANCELLED]
    initial: DRAFT
    terminal:
      - CLOSED
      - DENIED
      - CANCELLED
    transitions:
      - {from: DRAFT, to: OPEN, action: submit}
      - {from: OPEN, to: UNDER_REVIEW, action: start_review}
      - {from: UNDER_REVIEW, to: APPROVED, action: approve}
      - {from: UNDER_REVIEW, to: DENIED, action: deny}
      - {from: APPROVED, to: CLOSED, action: close}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: UNDER_REVIEW, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a government case is put forward"
      description: "When a government case is under review, a task asks someone to decide on it."
      when: "status == \"UNDER_REVIEW\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GOVERNMENT-CASE-APPROVAL-{{id}}"
              name: "Decide on government case {{case_number}}"
              description: "Government case {{case_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a government case is ended"
      description: "When a government case is cancelled or denied, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"DENIED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GOVERNMENT-CASE-FOLLOW-UP-{{id}}"
              name: "Follow up on government case {{case_number}}"
              description: "Government case {{case_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A case for an application, request, investigation, benefit, permit or other public-service matter.
    businessMeaning: A public body handles matters one by one. A case collects everything about a matter in one place, from who applied to how it was decided, so each decision can be explained and appealed.
    usage: Opened when a matter is received; worked by caseworkers; decided and closed; read by applicants, caseworkers and auditors.
    relationshipContext: A case has applicants (Parties), is handled by an agency Organization, and has Tasks and Documents.
    lifecycle: A case is drafted, opened on submission, under review while caseworkers assess it, and ends approved and closed, denied or cancelled.
    example: Building permit application 2026-04112, submitted by a homeowner and approved after review.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-GOVERNMENT-CASE
