entity:
  name: GovernmentCase
  namespace: cedm.domain
  kind: public_sector_entity
  description: A government case representing an application, request, investigation, benefit, permit, or public-service matter.
  ui:
    icon: briefcase
  identity:
    key: governmentCaseId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: governmentCaseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the government case record associated with this GovernmentCase. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: caseNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of case number for the GovernmentCase. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: caseType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of case type for the GovernmentCase. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - DRAFT
    - OPEN
    - UNDER_REVIEW
    - APPROVED
    - DENIED
    - CLOSED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of GovernmentCase.
        OPEN: Represents the open state or classification in the context of GovernmentCase.
        UNDER_REVIEW: Represents the under review state or classification in the context of GovernmentCase.
        APPROVED: Represents the approved state or classification in the context of GovernmentCase.
        DENIED: Represents the denied state or classification in the context of GovernmentCase.
        CLOSED: Represents the closed state or classification in the context of GovernmentCase.
        CANCELLED: Represents the cancelled state or classification in the context of GovernmentCase.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: openedAt
    type: datetime
    required: true
    help:
      summary: Records when the opened event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: closedAt
    type: datetime
    required: false
    help:
      summary: Records when the closed event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating GovernmentCase records, where
        applicable.
      relationshipContext: Its meaning is specific to GovernmentCase; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  relationships:
  - name: applicant
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects GovernmentCase to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a GovernmentCase.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: agency
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects GovernmentCase to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a GovernmentCase.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: tasks
    target: Task
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects GovernmentCase to Task so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Task records associated with a GovernmentCase.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects GovernmentCase to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a GovernmentCase.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: GOV-CASE-001
    rule: closedAt must not precede openedAt.
  - {id: GOVERNMENT-CASE-EXE-001, rule: "A government case that is closed states when (closed at).", violatedWhen: "status == \"CLOSED\" and closed_at == null", message: "Record closed at when the government case is closed."}
  lifecycle:
    title: Government Case Lifecycle
    attribute: status
    states: [DRAFT, OPEN, UNDER_REVIEW, APPROVED, DENIED, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [CLOSED, DENIED, CANCELLED]
    transitions:
      - {from: DRAFT, to: OPEN, action: open}
      - {from: OPEN, to: UNDER_REVIEW, action: review}
      - {from: UNDER_REVIEW, to: APPROVED, action: approve}
      - {from: APPROVED, to: CLOSED, action: close}
      - {from: DRAFT, to: DENIED, action: deny}
      - {from: OPEN, to: DENIED, action: deny}
      - {from: UNDER_REVIEW, to: DENIED, action: deny}
      - {from: APPROVED, to: DENIED, action: deny}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: UNDER_REVIEW, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a government case is put forward"
      description: "When a government case is under review, a task asks someone to decide on it."
      when: "status == \"UNDER_REVIEW\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GOVERNMENT-CASE-APPROVAL-{{id}}"
              name: "Decide on government case {{case_number}}"
              description: "Government case {{case_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a government case is ended"
      description: "When a government case is cancelled or denied, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"DENIED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GOVERNMENT-CASE-FOLLOW-UP-{{id}}"
              name: "Follow up on government case {{case_number}}"
              description: "Government case {{case_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a public sector entity called GovernmentCase within the CEDM business model.
    businessMeaning: GovernmentCase is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate GovernmentCase records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization,
      Task, Document. These relationships provide the context needed to interpret the record rather than treating its fields
      as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical GovernmentCase record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-GOVERNMENT-CASE
