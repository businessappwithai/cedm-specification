entity:
  name: RetailSaleLine
  namespace: cedm.domain
  kind: retail_transaction_line
  description: A product or service line within a retail sale.
  ui:
    icon: list
  identity:
    key: retailSaleLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: retailSaleLineId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the line, constant for its life.
        usage: Generated on creation; refunds refer to it.
        relationshipContext: Referenced when an item is returned.
    - name: quantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The number of units of the product sold on this line.
        usage: Entered by the cashier or counted by barcode scans; must be greater than zero and reduces the product's stock when the sale completes.
        relationshipContext: Multiplied by the unit price.
    - name: unitPrice
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: The price for one unit at the time of sale.
        usage: Taken from the price list; must not be negative; kept even if prices change.
        relationshipContext: Used with quantity to give the line amount.
    - name: discountAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The discount given on the line.
        usage: Applied by a promotion or the cashier; must not be negative.
        relationshipContext: Subtracted from quantity times price.
    - name: taxAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The tax charged on the line.
        usage: Calculated from the product's tax class; must not be negative.
        relationshipContext: Included in the line amount.
    - name: lineAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: The amount charged for this line after quantity, price, discount and tax have been applied.
        usage: Calculated by the till rather than typed; the lines are added together to give the sale total.
        relationshipContext: Matched against the receipt.
  relationships:
    - name: sale
      target: RetailSale
      cardinality: '1'
      ownership: reference
      help:
        summary: The sale the line belongs to.
        usage: Set when the line is added.
        cardinalityMeaning: Exactly one sale; a line cannot stand alone.
        context: Ties the line to its receipt.
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product or service the shopper bought on this line.
        usage: Chosen from the catalogue or identified by a barcode scan at the till when the line is added.
        cardinalityMeaning: Each line sells exactly one product, though a product can appear on many lines across many sales.
        context: Reduces the product's stock.
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: 0..1
      ownership: reference
      help:
        summary: The unit the quantity is expressed in.
        usage: Defaults to the product's selling unit.
        cardinalityMeaning: At most one unit; empty uses the default.
        context: Makes the quantity unambiguous, for example kilograms versus items.
  invariants:
    - id: RETAIL-SALE-LINE-001
      rule: quantity must be greater than zero.
    - {id: RETAIL-SALE-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: RETAIL-SALE-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
    - {id: RETAIL-SALE-LINE-EXE-003, rule: "Discount Amount cannot be negative.", violatedWhen: "discount_amount != null and discount_amount < 0", message: "Discount Amount cannot be negative."}
    - {id: RETAIL-SALE-LINE-EXE-004, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
    - {id: RETAIL-SALE-LINE-EXE-005, rule: "Line Amount cannot be negative.", violatedWhen: "line_amount != null and line_amount < 0", message: "Line Amount cannot be negative."}
  help:
    summary: One product or service sold on a retail sale, with its quantity, price, discount and tax.
    businessMeaning: Each line records what was sold and at what price at that moment, so the receipt, tax return and stock reduction can be reproduced even after prices change.
    usage: Created at the till for each item; read by stock, tax and returns.
    relationshipContext: A line belongs to one sale and names a product and optionally a unit.
    lifecycle: A line follows its sale. It is fixed when the sale completes; changes after that are made by refund.
    example: Three bottles of olive oil at 6.50 each, with 1.95 tax, on receipt R-88213.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RETAIL-SALE-LINE
