entity:
  name: BankTransaction
  namespace: cedm.domain
  kind: external_financial_evidence
  description: A bank-statement or financial-institution transaction representing external cash movement or bank-side adjustment, retained as independent evidence and reconciled to internal Payment and accounting records through controlled workflows.
  identity:
    key: bankTransactionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: bankTransactionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the imported bank transaction evidence.
      usage: Used for statement import, deduplication, reconciliation, audit, and integration.
      relationshipContext: Identifies external evidence and is never substituted for Payment or JournalEntry identity.
      workflowRole: Provides the root key for bank reconciliation and exception handling.
      requiredMeaning: Required for evidence traceability.
  - name: transactionNumber
    type: string
    required: true
    unique: true
    maxLength: 150
    help:
      summary: Bank or internally assigned business reference for the statement transaction.
      usage: Used for search, duplicate detection, reconciliation, investigation, and bank-feed integration.
      relationshipContext: Must not be assumed to equal Payment.paymentNumber.
      workflowRole: Provides a primary external reference for candidate matching.
      requiredMeaning: Required for operational traceability.
  - name: transactionDate
    type: datetime
    required: true
    help:
      summary: Timestamp supplied by the bank or statement source for the transaction.
      usage: Supports statement chronology, reconciliation windows, cash reporting, and investigation.
      relationshipContext: May differ from Payment.paymentDate, Payment.valueDate, accounting posting date, and clearing date.
      workflowRole: Provides external chronology used in matching and period analysis.
      requiredMeaning: Required for bank evidence chronology.
  - name: valueDate
    type: date
    required: false
    help:
      summary: Bank-provided economic value date for the transaction.
      usage: Supports cash availability, interest, treasury analysis, reconciliation, and accounting interpretation.
      relationshipContext: Separate from transactionDate because a bank may record and value a transaction on different dates.
      workflowRole: Provides bank-side settlement timing context.
      optionalMeaning: Optional where the bank source does not provide a distinct value date.
  - name: transactionType
    type: enum
    required: true
    values: [CREDIT, DEBIT, TRANSFER, FEE, INTEREST, REVERSAL, OTHER]
    help:
      summary: Classification of the movement reported by the financial institution.
      usage: Supports matching, cash classification, fee handling, transfer processing, and reconciliation.
      relationshipContext: Bank classification does not by itself determine internal accounting meaning.
      workflowRole: Helps identify whether evidence is a candidate Payment, fee, transfer, interest, or reversal.
      requiredMeaning: Required for reconciliation interpretation.
  - name: amount
    type: Money
    required: true
    help:
      summary: Monetary value reported by the bank for this transaction.
      usage: Used for matching, reconciliation, cash reporting, fee analysis, and accounting comparison.
      relationshipContext: Currency is intrinsic to Money; direct comparison with Payment.amount is permitted only when currencies and applicable amount semantics match.
      workflowRole: Provides bank-side monetary evidence used to validate Payment clearing.
      requiredMeaning: Required for financial reconciliation.
  - name: status
    type: enum
    required: true
    default: POSTED
    values: [PENDING, POSTED, REVERSED, FAILED]
    help:
      summary: Lifecycle state of the bank-reported transaction.
      usage: Controls whether the transaction is eligible as external settlement evidence.
      relationshipContext: Independent from Payment status and JournalEntry status.
      workflowRole: POSTED evidence can normally support reconciliation; REVERSED evidence must trigger corresponding correction handling.
      requiredMeaning: Required for evidence lifecycle control.
  - name: reference
    type: string
    required: false
    maxLength: 250
    help:
      summary: Bank-provided remittance or transaction reference used to identify the underlying business event.
      usage: Supports automatic and manual matching to Payment, Invoice, customer remittance, or supplier payment.
      relationshipContext: It is a matching signal, not definitive proof without reconciliation controls.
      workflowRole: Provides high-value matching evidence.
      optionalMeaning: Optional when the bank supplies no usable reference.
  - name: description
    type: string
    required: false
    maxLength: 1000
    help:
      summary: Bank-provided narrative or transaction description.
      usage: Supports reconciliation, exception investigation, and manual matching.
      relationshipContext: Descriptive evidence may be incomplete or ambiguous and must not override controlled matching rules.
      workflowRole: Provides secondary matching and investigation context.
      optionalMeaning: Optional depending on bank feed quality.
  - name: externalReference
    type: string
    required: false
    maxLength: 250
    help:
      summary: Unique processor, bank, statement-line, or gateway identifier supplied by the external source.
      usage: Supports idempotent imports and duplicate detection across statement retrievals.
      relationshipContext: External reference is evidence metadata and does not replace bankTransactionId.
      workflowRole: Prevents duplicate ingestion of the same external transaction.
      optionalMeaning: Optional where the source provides no stable external identifier.
  relationships:
  - name: account
    target: BankAccount
    cardinality: '1'
    ownership: reference
    help:
      summary: Bank account whose statement contains the transaction.
      usage: Establishes cash-account context and reconciliation scope.
      cardinalityMeaning: Exactly one account is the source context for each BankTransaction.
      workflowRole: Matching is performed within the account and statement context.
  - name: counterparty
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Bank-reported counterparty when identifiable.
      usage: Supports candidate matching, sanctions/compliance workflows where applicable, and investigation.
      cardinalityMeaning: Optional because bank evidence may omit or obscure counterparty identity.
      workflowRole: Provides supporting evidence for Payment matching, not definitive internal party identity.
  - name: payment
    target: Payment
    cardinality: 0..1
    ownership: reference
    help:
      summary: Internal Payment reconciled to this external bank transaction.
      usage: Connects bank evidence to the organization's recognized settlement event.
      cardinalityMeaning: Zero while unmatched; one when controlled reconciliation establishes the relationship.
      workflowRole: A valid match may support Payment.CLEARED according to reconciliation policy.
  - name: journalEntries
    target: JournalEntry
    cardinality: 0..*
    ownership: reference
    help:
      summary: Accounting entries associated with the bank-side transaction, such as bank fees, interest, or reconciliation adjustments.
      usage: Supports cash accounting, fee recognition, interest, and reconciliation differences.
      cardinalityMeaning: A bank transaction may have multiple accounting consequences.
      workflowRole: Accounting consequences remain distinct from the external evidence itself.
  invariants:
  - id: BANK-TRANSACTION-001
    rule: amount must be greater than zero for a substantive bank transaction; zero-value statement metadata requires an explicitly supported import policy.
  - id: BANK-TRANSACTION-002
    rule: A BankTransaction cannot be treated as proof of an internal Payment unless an explicit reconciliation relationship or approved deterministic auto-match establishes it.
  - id: BANK-TRANSACTION-003
    rule: A reversed bank transaction must not continue to support Payment.CLEARED without corresponding reversal or reconciliation handling.
  - id: BANK-TRANSACTION-004
    rule: Duplicate external bank records must be prevented through stable source identifiers and/or controlled duplicate-detection rules.
  - id: BANK-TRANSACTION-005
    rule: Direct amount matching between BankTransaction and Payment requires compatible currency and transaction semantics; documented bank fees or adjustments must be represented explicitly rather than silently ignored.
  - id: BANK-TRANSACTION-006
    rule: An unmatched BankTransaction must not automatically alter Invoice balances or statuses.
  - id: BANK-TRANSACTION-007
    rule: Bank fees, interest, FX differences, and other statement adjustments must not be silently converted into Payment amounts; they require their own accounting/reconciliation treatment.
  help:
    summary: Represents external financial-institution evidence of a bank-side movement while keeping reconciliation, internal payment, and accounting meaning separate.
    businessMeaning: BankTransaction says what the bank reported. Payment says what the organization recognized as a payment. PaymentAllocation says how payment is applied to claims. JournalEntry says how the event is recognized in accounting.
    usage: Central to treasury, bank-feed ingestion, accounts receivable, accounts payable, cash management, reconciliation, audit, fee processing, and accounting.
    relationshipContext: BankAccount provides the statement account. BankTransaction provides external evidence. Payment is the internal settlement event. PaymentAllocation connects settlement to claims. JournalEntry records accounting consequences.
    workflowContext: Bank statement import → validate source → deduplicate → classify → candidate match Payment → validate account/date/currency/amount/reference → reconcile → Payment may become CLEARED → Invoice settlement remains driven by active PaymentAllocation. Unmatched items remain reconciliation exceptions.
    lifecycle: Imported/pending → posted → reconciled through a Payment or other accounting treatment; reversal/failure paths remain explicit. Historical statement evidence is retained and corrected through reconciliation events rather than rewriting the source transaction.
    example: A bank statement imports a USD 10,000 credit. The system matches it to a USD 10,000 Payment using account, date, currency, amount, and remittance reference. The BankTransaction remains independent evidence, the Payment becomes CLEARED, and its PaymentAllocations settle the applicable invoices. A separate USD 25 bank fee is recorded as bank-side fee evidence and accounting treatment rather than silently reducing the Payment.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-BANK-TRANSACTION
