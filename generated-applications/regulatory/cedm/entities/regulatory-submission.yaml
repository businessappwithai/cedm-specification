entity:
  name: RegulatorySubmission
  namespace: cedm.domain
  kind: regulatory_entity
  description: A formal submission made to a regulatory authority to obtain approval, authorization, registration, or fulfill a regulatory obligation.
  ui:
    icon: table
  identity:
    key: regulatorySubmissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: regulatorySubmissionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the submission, constant for its life.
        usage: Generated on creation; documents and correspondence refer to it.
        relationshipContext: Referenced by the documents filed with it.
    - name: submissionNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number the business gives the submission, such as RS-2026-031.
        usage: Unique; quoted in correspondence with the authority.
        relationshipContext: Read with the authority's own reference number if any.
    - name: submissionType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of submission, such as registration or renewal.
        usage: Entered when the submission is created; chooses the documents required.
        relationshipContext: Decides which authority procedures apply.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - SUBMITTED
        - UNDER_REVIEW
        - QUESTIONS
        - APPROVED
        - REJECTED
        - WITHDRAWN
      help:
        summary: Where the submission is in the authority's process.
        usage: Starts as DRAFT; moved as the submission is filed and answered.
        relationshipContext: Decides whether documents can still be added.
        valueSemantics:
          DRAFT: Being prepared; not yet filed.
          SUBMITTED: Filed with the authority.
          UNDER_REVIEW: The authority is reviewing it.
          QUESTIONS: The authority has asked for more information.
          APPROVED: The authority approved it. A final state.
          REJECTED: The authority refused it. A final state.
          WITHDRAWN: Withdrawn by the submitter before a decision. A final state.
    - name: submittedAt
      type: datetime
      required: false
      help:
        summary: When the submission was filed with the authority.
        usage: Set on filing; required once the submission is no longer a draft.
        relationshipContext: Starts the review period.
    - name: decisionAt
      type: datetime
      required: false
      help:
        summary: The date and time the regulatory authority announced its decision on the submission.
        usage: Recorded by regulatory affairs when the submission is approved or rejected; empty while it is pending, and used to track authority turnaround.
        relationshipContext: Measured against the filing date to give review time.
  relationships:
    - name: authority
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A submission is addressed to a single regulator; a filing to two authorities is two submissions.
        summary: The regulator the submission is made to.
        usage: Chosen when the submission is created.
        context: Decides the rules and the format required.
    - name: sponsor
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation on whose behalf the submission is made.
        usage: Chosen when it differs from the submitting company.
        cardinalityMeaning: At most one sponsor.
        context: Names who holds the resulting approval.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents filed in support of the submission.
        usage: Attached before filing and with later answers.
        cardinalityMeaning: Any number of documents.
        context: Forms the evidence the authority reviews.
  invariants:
    - id: REG-SUB-001
      rule: submittedAt is required when status is SUBMITTED or later.
  lifecycle:
    title: Regulatory Submission Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, UNDER_REVIEW, QUESTIONS, APPROVED, REJECTED, WITHDRAWN]
    initial: DRAFT
    terminal:
      - APPROVED
      - REJECTED
      - WITHDRAWN
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: UNDER_REVIEW, action: review}
      - {from: UNDER_REVIEW, to: QUESTIONS, action: query}
      - {from: QUESTIONS, to: UNDER_REVIEW, action: respond}
      - {from: UNDER_REVIEW, to: APPROVED, action: approve}
      - {from: UNDER_REVIEW, to: REJECTED, action: reject}
      - {from: DRAFT, to: WITHDRAWN, action: withdraw}
      - {from: SUBMITTED, to: WITHDRAWN, action: withdraw}
      - {from: UNDER_REVIEW, to: WITHDRAWN, action: withdraw}
      - {from: QUESTIONS, to: WITHDRAWN, action: withdraw}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a regulatory submission is put forward"
      description: "When a regulatory submission is submitted or under review, a task asks someone to decide on it."
      when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "REGULATORY-SUBMISSION-APPROVAL-{{id}}"
              name: "Decide on regulatory submission {{submission_number}}"
              description: "Regulatory submission {{submission_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a regulatory submission is ended"
      description: "When a regulatory submission is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "REGULATORY-SUBMISSION-FOLLOW-UP-{{id}}"
              name: "Follow up on regulatory submission {{submission_number}}"
              description: "Regulatory submission {{submission_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A formal submission to a regulatory authority to obtain an approval, authorisation or registration, or to meet a regulatory obligation.
    businessMeaning: A submission is the business's record of what it filed with a regulator, when, and what came of it. Keeping the stages and the documents together proves what was submitted, shows where it stands, and keeps the questions and decision on file.
    usage: Prepared by regulatory affairs; submitted to the authority; updated as the authority responds.
    relationshipContext: A submission is made to one authority, may be on behalf of a sponsor, and includes documents.
    lifecycle: A submission is drafted and submitted, goes under review, and may be sent back with questions that are answered. It ends approved, rejected or withdrawn, all final.
    example: Submission RS-2026-031 asks the authority to register a new formulation; it is under review until questions arrive.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-REGULATORY-SUBMISSION
