entity:
  name: Identity
  namespace: cedm.domain
  kind: security_identity_entity
  description: An authentication identity or credential-bearing representation associated with a user or principal.
  ui:
    icon: table
  identity:
    key: identityId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: identityId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the credential record.
        usage: Generated on creation; audit entries refer to it.
    - name: identityType
      type: enum
      required: true
      values:
        - PASSWORD
        - SSO
        - OAUTH
        - API_KEY
        - CERTIFICATE
        - BIOMETRIC
        - OTHER
      help:
        summary: The way in which this identity authenticates.
        usage: Chosen when it is created; decides how the sign-in is checked.
        valueSemantics:
          PASSWORD: A password held by the application.
          SSO: A single sign-on account from the organisation's identity provider.
          OAUTH: An account at an external OAuth provider.
          API_KEY: A key used by software to call the application.
          CERTIFICATE: A client certificate.
          BIOMETRIC: A fingerprint, face or similar trait.
          OTHER: Any other mechanism.
    - name: externalSubject
      type: string
      required: false
      maxLength: 500
      help:
        summary: The identifier that the external identity provider uses for the person.
        usage: Filled for SSO and OAuth identities; the sign-in is matched to the user through it.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - SUSPENDED
        - REVOKED
        - EXPIRED
      help:
        summary: Whether the identity can currently be used.
        usage: Set by security administrators or expiry processing; only ACTIVE identities authenticate.
        valueSemantics:
          ACTIVE: Can be used to sign in.
          SUSPENDED: Temporarily blocked; can be restored.
          REVOKED: Withdrawn on purpose and not reusable. A final state.
          EXPIRED: Past its validity period. A final state.
    - name: issuedAt
      type: datetime
      required: false
      help:
        summary: When the identity or credential was issued.
        usage: Set on creation; used to enforce rotation.
    - name: expiresAt
      type: datetime
      required: false
      help:
        summary: When the identity stops being valid.
        usage: Set when issued; must not be before the issue time. After it, the status becomes EXPIRED.
  relationships:
    - name: user
      target: User
      cardinality: '1'
      ownership: reference
      help:
        summary: The user this identity authenticates.
        usage: Set when the identity is created.
        cardinalityMeaning: 'Exactly one user: an identity always belongs to one account.'
        workflowRole: A user's access is the sum of its active identities.
  invariants:
    - id: IDENTITY-001
      rule: expiresAt must not precede issuedAt.
  lifecycle:
    title: Identity Lifecycle
    attribute: status
    states: [ACTIVE, SUSPENDED, REVOKED, EXPIRED]
    initial: ACTIVE
    terminal: [REVOKED, EXPIRED]
    transitions:
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: REVOKED, action: revoke}
      - {from: SUSPENDED, to: REVOKED, action: revoke}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
  help:
    summary: An authentication identity or credential-bearing representation that a user or principal can sign in or act with.
    businessMeaning: 'People and systems prove who they are in different ways: a password, a single sign-on account, an API key. Each way is an identity, with its own lifetime and status, so that access can be granted, suspended or revoked without deleting the user.'
    usage: Created when a user is given a way to authenticate; updated when it is suspended, renewed or revoked; read by the authentication service and security reviews.
    relationshipContext: An identity belongs to one User; a user may have several identities.
    lifecycle: An identity is active, may be suspended and restored, and ends revoked or expired. Revoked and expired identities cannot be used again.
    example: A single sign-on identity from the corporate directory for a staff user, expiring when their contract ends.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-IDENTITY
