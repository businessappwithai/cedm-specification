entity:
  name: Permission
  namespace: cedm.domain
  kind: authorization_entity
  description: A fine-grained authorization capability governing an operation on a resource.
  ui:
    icon: key
  identity:
    key: permissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: permissionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the permission.
        usage: Generated on creation; roles refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 200
      help:
        summary: The code of the permission, such as purchase_order:approve.
        usage: Unique; used in access checks.
    - name: resource
      type: string
      required: true
      maxLength: 200
      help:
        summary: The kind of thing the permission governs, such as purchase_order or customer.
        usage: Entered at definition; the check is made against this resource.
    - name: action
      type: enum
      required: true
      values:
        - CREATE
        - READ
        - UPDATE
        - DELETE
        - EXECUTE
        - APPROVE
        - EXPORT
        - ADMINISTER
      help:
        summary: The operation the permission allows.
        usage: Chosen at definition.
        valueSemantics:
          CREATE: Create new records.
          READ: View records.
          UPDATE: Change records.
          DELETE: Remove records.
          EXECUTE: Run an operation or process.
          APPROVE: Approve a pending item.
          EXPORT: Export data.
          ADMINISTER: Manage the resource's configuration and access.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the permission can be granted.
        usage: Set by security administrators.
        valueSemantics:
          ACTIVE: Available and enforced.
          INACTIVE: Temporarily not granted.
          RETIRED: Withdrawn. A final state.
  relationships:
    - name: roles
      target: Role
      cardinality: 0..*
      ownership: reference
      help:
        summary: The roles that include the permission.
        usage: Read to see who can do what.
        cardinalityMeaning: Any number of roles.
        workflowRole: Shows how widely a capability is granted.
  lifecycle:
    title: Permission Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A fine-grained authorisation that allows an operation on a resource.
    businessMeaning: Access control is built from small permissions, such as "approve invoices" or "export customers". Defining each one explicitly lets roles be composed from them and reviewed.
    usage: Defined by security administrators; added to roles; checked at each protected operation.
    relationshipContext: Permissions are granted through Roles.
    lifecycle: A permission is active while in use, can be made inactive, and is retired when no longer needed. Roles that held it keep the history.
    example: The permission to APPROVE the resource "purchase_order", granted to the Purchasing Manager role.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PERMISSION
