entity:
  name: Role
  namespace: cedm.domain
  kind: authorization_entity
  description: A named set of permissions or responsibilities assignable to users or service principals.
  ui:
    icon: shield
  identity:
    key: roleId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: roleId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the role, constant when it is renamed.
        usage: Generated on creation; grants refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the role, such as SALES_MANAGER.
        usage: Unique; used in imports and rules.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name of the role as administrators and users see it.
        usage: Shown when roles are assigned.
    - name: description
      type: string
      required: false
      maxLength: 2000
      help:
        summary: What the role is for and who should hold it.
        usage: Read by administrators before granting.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the role can be granted and used.
        usage: Starts as DRAFT; set by an administrator.
        valueSemantics:
          DRAFT: Being defined; not yet granted.
          ACTIVE: In use and can be granted.
          INACTIVE: Switched off for a time; its grants give no access.
          RETIRED: No longer used. A final state.
  relationships:
    - name: permissions
      target: Permission
      cardinality: 0..*
      ownership: reference
      help:
        summary: The permissions the role gives.
        usage: Chosen when the role is defined.
        cardinalityMeaning: Any number, none for an empty role.
        context: Decides what holders may do.
    - name: users
      target: User
      cardinality: 0..*
      ownership: reference
      help:
        summary: The users holding the role.
        usage: Read to review who has access.
        cardinalityMeaning: Any number, none for an unassigned role.
        context: Anyone holding the role gains its permissions.
  lifecycle:
    title: Role Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A named set of permissions or responsibilities that can be given to users or service accounts.
    businessMeaning: Roles let access be granted by job function instead of person by person. Changing what a role may do changes it for everyone who holds it, so access stays consistent and reviewable.
    usage: Defined by an administrator; assigned to users; read when access is decided and audited.
    relationshipContext: A role holds permissions and is held by users.
    lifecycle: A role is drafted, active while in use, may be switched off and back on, and is retired when no longer needed. Retired is final.
    example: The "Sales manager" role may read and update all orders but not change prices.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ROLE
