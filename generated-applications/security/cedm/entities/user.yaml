entity:
  name: User
  namespace: cedm.domain
  kind: identity_entity
  description: A digital identity representing an individual or system principal that can authenticate and act within an application.
  ui:
    icon: user
  identity:
    key: userId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: userId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the user, constant when the sign-in name changes.
        usage: Generated on creation; roles, audit entries and sessions refer to it.
        relationshipContext: Referenced by everything the user did.
    - name: username
      type: string
      required: true
      unique: true
      maxLength: 200
      help:
        summary: The sign-in name the user types to authenticate, distinct from the permanent user identifier.
        usage: Unique across the application; chosen at registration or by an administrator and entered at every sign-in, so changing it affects how the person logs in.
        relationshipContext: Read with the linked party for display.
    - name: status
      type: enum
      required: true
      default: PENDING
      values:
        - PENDING
        - ACTIVE
        - LOCKED
        - DISABLED
        - RETIRED
      help:
        summary: Whether the account can be used.
        usage: Starts as PENDING; moved by administrators and security rules.
        relationshipContext: Only active users can sign in.
        valueSemantics:
          PENDING: Created and awaiting activation.
          ACTIVE: Can sign in and act.
          LOCKED: Blocked temporarily, for example after repeated failures.
          DISABLED: Switched off by an administrator; can be reactivated.
          RETIRED: Closed for good; kept for the audit trail. A final state.
    - name: lastLoginAt
      type: datetime
      required: false
      help:
        usage: Set at each successful sign-in; reviewed to find unused accounts.
        relationshipContext: Read by security reviews.
        summary: Records when the last login event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: displayName
      type: string
      required: false
      maxLength: 200
      help:
        summary: The name shown on screens and in the audit trail.
        usage: Usually the person's full name.
        relationshipContext: Taken from the person's party record where linked.
    - name: email
      type: email
      required: false
      help:
        summary: The email address the user receives notifications and password resets at.
        usage: Entered when the user is created; verified before use.
        relationshipContext: Usually the same as the username for people.
    - name: userType
      type: enum
      required: true
      default: PERSON
      values:
        - PERSON
        - SERVICE
      help:
        summary: Whether the user is a person or a system.
        usage: System users sign in with keys or tokens, not passwords, and have no person behind them.
        relationshipContext: System users are reviewed by their owning team.
        valueSemantics:
          PERSON: A person signing in interactively.
          SERVICE: A system or integration acting through the API.
    - name: failedLoginCount
      type: integer
      required: true
      default: 0
      help:
        summary: How many sign-ins have failed since the last successful one.
        usage: The user is locked when it reaches the configured limit.
        relationshipContext: Reset on a successful sign-in.
    - name: passwordChangedAt
      type: datetime
      required: false
      help:
        summary: When the password was last changed.
        usage: Used to enforce password expiry where the policy requires it.
        relationshipContext: Empty for system users.
    - name: mfaEnabled
      type: boolean
      required: true
      default: false
      help:
        summary: Whether the user signs in with a second factor.
        usage: Required for privileged users by the access policy.
        relationshipContext: Read in access reviews.
  relationships:
    - name: party
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person or organisation the user represents.
        usage: Linked when the identity belongs to a known party.
        cardinalityMeaning: At most one party; empty for a system account.
        context: Connects the sign-in to a real person.
    - name: roles
      target: Role
      cardinality: 0..*
      ownership: reference
      help:
        summary: The roles the user holds.
        usage: Granted by administrators.
        cardinalityMeaning: Any number of roles.
        context: Together decide what the user may do.
    - name: identities
      target: Identity
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The sign-in identities linked to the user.
        usage: Added when a provider or credential is linked.
        cardinalityMeaning: Any number of identities.
        context: Belong to the user and go with it.
  lifecycle:
    title: User Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, LOCKED, DISABLED, RETIRED]
    initial: PENDING
    terminal: [RETIRED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: LOCKED, action: lock}
      - {from: LOCKED, to: ACTIVE, action: unlock}
      - {from: ACTIVE, to: DISABLED, action: disable}
      - {from: DISABLED, to: ACTIVE, action: enable}
      - {from: PENDING, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: LOCKED, to: RETIRED, action: retire}
      - {from: DISABLED, to: RETIRED, action: retire}
  invariants:
    - {id: USER-EXE-001, rule: "Failed Login Count cannot be negative.", violatedWhen: "failed_login_count != null and failed_login_count < 0", message: "Failed Login Count cannot be negative."}
  help:
    summary: A digital identity for a person or system that can sign in and act within the application.
    businessMeaning: A user is what the application recognises when someone signs in. It carries the sign-in name, the state of the account and the roles that decide what the identity may do, and may be linked to the person it represents.
    usage: Created by administrators or through registration; read whenever access is decided and in audits.
    relationshipContext: A user may represent a party, holds roles and has linked identities from sign-in providers.
    lifecycle: A user is pending until activated, active while in use, may be locked or disabled and reactivated, and is retired when it is no longer needed. Retired is final.
    example: User "priya.n" is created pending, activated after confirming an email address and given the Sales manager role.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-USER
