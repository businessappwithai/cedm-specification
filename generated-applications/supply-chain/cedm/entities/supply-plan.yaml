entity:
  name: SupplyPlan
  namespace: cedm.domain
  kind: supply_chain_entity
  description: A plan describing expected demand, supply, inventory, and replenishment actions over a planning horizon.
  ui:
    icon: table
  identity:
    key: supplyPlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: supplyPlanId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the plan, constant for its life.
        usage: Generated on creation; plan lines refer to it.
    - name: planNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique business reference of a supply plan, such as SP-2026-Q3, used to find and discuss it.
        usage: Assigned when the plan is created; quoted in planning reviews, approvals and replenishment documents, and never reused.
    - name: planningStart
      type: date
      required: true
      help:
        summary: The first date of the horizon the plan covers for demand, supply and inventory.
        usage: Set when the plan is drafted; plan lines dated before it are out of scope, and it must not be later than the end.
        relationshipContext: Compared with the end date.
    - name: planningEnd
      type: date
      required: true
      help:
        summary: The last date of the planning horizon, closing the period over which demand and supply are balanced.
        usage: Set with the start date; it must not precede the start, and plans of successive horizons are chained by it.
        relationshipContext: Defines the horizon.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - APPROVED
        - ACTIVE
        - CLOSED
        - CANCELLED
      help:
        summary: Shows how far the plan has progressed from drafting through approval to execution and closure.
        usage: Advanced by planners and approvers; only approved or active plans release replenishment actions, and closed or cancelled ones are read-only.
        valueSemantics:
          DRAFT: The plan is being built and can be freely changed.
          APPROVED: The plan has been signed off but is not yet being executed.
          ACTIVE: The plan is being executed and its lines drive replenishment.
          CLOSED: The horizon has ended and the plan is kept for review. A final state.
          CANCELLED: The plan was abandoned without being completed. A final state.
  relationships:
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation the plan is for.
        usage: Chosen when the plan is created.
        cardinalityMeaning: At most one organisation.
        context: Decides whose stock and budget the plan uses.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products covered by the plan.
        usage: Chosen when the plan is built.
        cardinalityMeaning: Any number of products.
        context: Limits the plan to the range.
    - name: locations
      target: Location
      cardinality: 0..*
      ownership: reference
      help:
        summary: The places covered by the plan.
        usage: Chosen when the plan is built.
        cardinalityMeaning: Any number of locations.
        context: Limits the plan to the sites.
  invariants:
    - id: SUPPLY-PLAN-001
      rule: planningEnd must not precede planningStart.
    - {id: SUPPLY-PLAN-EXE-001, rule: "Planning End must not be earlier than planning start.", violatedWhen: "planning_start != null and planning_end != null and planning_end < planning_start", message: "Planning End cannot be earlier than planning start."}
  lifecycle:
    title: Supply Plan Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a supply plan is ended"
      description: "When a supply plan is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUPPLY-PLAN-FOLLOW-UP-{{id}}"
              name: "Follow up on supply plan {{plan_number}}"
              description: "Supply plan {{plan_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A plan of expected demand, supply, stock and replenishment actions over a planning horizon.
    businessMeaning: The supply plan turns forecasts and stock policy into what must be bought, made or moved and when. Keeping each plan with its period lets planners compare versions, release actions and see what was intended.
    usage: Prepared by supply planners; approved by management; read by purchasing, production and warehouse.
    relationshipContext: A plan may belong to an organisation, covers products and locations, and is broken into plan lines.
    lifecycle: A plan is drafted and approved, becomes active while being executed, and is closed at the end of its horizon. It may be cancelled before closing. Closed and cancelled are final.
    example: The Q4 plan for the northern warehouses covers October to December and is approved in September.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLY-PLAN
