entity:
  name: SupplyPlanLine
  namespace: cedm.domain
  kind: supply_chain_entity
  description: A planned quantity for a product at a location and time within a supply plan.
  ui:
    icon: table
  identity:
    key: supplyPlanLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: supplyPlanLineId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the line, constant for its life.
        usage: Generated on creation; fulfilment records refer to it.
    - name: planningDate
      type: date
      required: true
      help:
        usage: Set when the line is created; actions are due by it.
        relationshipContext: Falls inside the plan's horizon.
        summary: Records the business date associated with the planning. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
    - name: plannedQuantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The quantity of the product that the plan expects to be available or replenished at the location on the planning date.
        usage: Entered or calculated by planners; compared with demand and safety stock to drive replenishment orders.
        relationshipContext: Compared with the quantity actually delivered.
    - name: safetyStockQuantity
      type: decimal
      required: false
      precision: 20
      scale: 6
      help:
        summary: The buffer stock to hold in addition.
        usage: Set from policy; must not be negative.
        relationshipContext: Added to the planned quantity when ordering.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - RELEASED
        - FULFILLED
        - CANCELLED
      help:
        summary: Where the line is.
        usage: Starts as PLANNED; moved as it is released and met.
        valueSemantics:
          PLANNED: Proposed and not yet acted on.
          RELEASED: Passed to purchasing or production.
          FULFILLED: The quantity has been supplied. A final state.
          CANCELLED: No longer needed. A final state.
  relationships:
    - name: supplyPlan
      target: SupplyPlan
      cardinality: '1'
      ownership: reference
      help:
        summary: The plan the line belongs to.
        usage: Set when the line is created.
        cardinalityMeaning: Exactly one plan.
        context: Places the action in a horizon.
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: Each line plans one product; several products need several lines.
        summary: The product planned.
        usage: Chosen when the line is created.
        context: Decides what is bought or made.
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: Each line plans for one location; the same product at another site is another line.
        summary: The location the quantity is planned for.
        usage: Chosen when the line is created.
        context: Decides where stock must be.
  invariants:
    - id: SUPPLY-PLAN-LINE-001
      rule: plannedQuantity must not be negative.
    - {id: SUPPLY-PLAN-LINE-EXE-001, rule: "Planned Quantity cannot be negative.", violatedWhen: "planned_quantity != null and planned_quantity < 0", message: "Planned Quantity cannot be negative."}
    - {id: SUPPLY-PLAN-LINE-EXE-002, rule: "Safety Stock Quantity cannot be negative.", violatedWhen: "safety_stock_quantity != null and safety_stock_quantity < 0", message: "Safety Stock Quantity cannot be negative."}
  lifecycle:
    title: Supply Plan Line Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, FULFILLED, CANCELLED]
    initial: PLANNED
    terminal: [FULFILLED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RELEASED, action: release}
      - {from: RELEASED, to: FULFILLED, action: fulfil}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a supply plan line is ended"
      description: "When a supply plan line is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUPPLY-PLAN-LINE-FOLLOW-UP-{{id}}"
              name: "Follow up on supply plan line {{id}}"
              description: "Supply plan line {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A quantity planned for a product at a location on a date within a supply plan.
    businessMeaning: Each line is one planned action, such as the stock to hold or buy for a product at a site. Lines are released and fulfilled as the plan runs, so the plan can be compared with what happened.
    usage: Created by planners or the planning run; released to purchasing or production; read to track fulfilment.
    relationshipContext: A line belongs to one plan and names a product and a location.
    lifecycle: A line is planned, released for action and fulfilled. It may be cancelled. Fulfilled and cancelled are final.
    example: Plan 2,000 units of product P-14 at the Leeds warehouse for 15 November.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLY-PLAN-LINE
