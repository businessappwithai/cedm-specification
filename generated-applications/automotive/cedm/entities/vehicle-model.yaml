entity:
  name: VehicleModel
  namespace: cedm.domain
  kind: automotive_master_entity
  description: A manufacturer-defined model and configuration family for vehicles.
  ui:
    icon: car
  identity:
    key: vehicleModelId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: vehicleModelId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the model, constant when it is renamed.
        usage: Generated on creation; vehicles refer to it.
        relationshipContext: Referenced by each vehicle of the model.
    - name: manufacturer
      type: string
      required: true
      maxLength: 200
      help:
        summary: The maker of the vehicle.
        usage: Entered once for the model.
        relationshipContext: Read with the model name.
    - name: modelName
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name the maker gives the model.
        usage: Shown in lists.
        relationshipContext: Read with the manufacturer.
    - name: modelCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the model.
        usage: Unique; used in imports.
        relationshipContext: Read with the year.
    - name: modelYear
      type: integer
      required: false
      help:
        summary: The model year.
        usage: Entered when different years are distinguished.
        relationshipContext: Read with the code.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - DISCONTINUED
      help:
        summary: Whether the model is current.
        usage: Starts as PLANNED.
        valueSemantics:
          PLANNED: Announced and not yet available.
          ACTIVE: Current.
          DISCONTINUED: No longer made or supported. A final state.
  relationships:
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        summary: The product that sells this model.
        usage: Chosen when the model is sold.
        cardinalityMeaning: At most one product.
        context: Links catalogue and fleet.
    - name: vehicles
      target: Vehicle
      cardinality: 0..*
      ownership: reference
      help:
        summary: The vehicles of this model.
        usage: Read to list the fleet by model.
        cardinalityMeaning: Any number of vehicles.
        context: Show how many are in service.
  lifecycle:
    title: Vehicle Model Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, DISCONTINUED]
    initial: PLANNED
    terminal: [DISCONTINUED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: PLANNED, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
  help:
    summary: A manufacturer's model and configuration family for vehicles.
    businessMeaning: The model describes what a vehicle is, such as make, model and year, so the same facts are not repeated on every vehicle and fleets can be analysed by model.
    usage: Maintained by fleet or product managers; chosen when vehicles are registered.
    relationshipContext: A model may be sold as a product and has vehicles of that model.
    lifecycle: A model is planned, active while produced or supported, and discontinued when withdrawn. Discontinued is final.
    example: The "Transit 350" from a van maker, model year 2026.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-VEHICLE-MODEL
