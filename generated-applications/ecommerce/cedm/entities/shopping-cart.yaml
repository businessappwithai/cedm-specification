entity:
  name: ShoppingCart
  namespace: cedm.domain
  kind: ecommerce_entity
  description: A temporary collection of products selected by a customer or shopper before checkout.
  ui:
    icon: table
  identity:
    key: shoppingCartId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: shoppingCartId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the cart, constant for its life.
        usage: Generated on creation; lines and the resulting order refer to it.
        relationshipContext: Referenced by each cart line.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - CHECKED_OUT
        - ABANDONED
        - EXPIRED
      help:
        summary: 'The stage of the cart: still being filled, turned into an order, left idle or timed out.'
        usage: Starts as ACTIVE; set to CHECKED_OUT by checkout and to ABANDONED or EXPIRED by timeouts. Only an active cart can be edited.
        relationshipContext: Only an active cart can be edited.
        valueSemantics:
          ACTIVE: Open and being filled.
          CHECKED_OUT: Turned into an order; no longer editable. A final state.
          ABANDONED: Left without buying. A final state.
          EXPIRED: Timed out. A final state.
    - name: createdAt
      type: datetime
      required: true
      help:
        summary: The date and time the shopper added the first item and the cart came into existence.
        usage: Set automatically and never edited; used to measure cart age, trigger abandonment follow-up and compare with the expiry time.
        relationshipContext: Compared with the expiry time.
    - name: expiresAt
      type: datetime
      required: false
      help:
        usage: Set when the cart is created; the cart expires if it is still active then.
        relationshipContext: Read by the clean-up process.
        summary: Records when the expires event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
  relationships:
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: The customer the cart belongs to, if known.
        usage: Set when the shopper signs in.
        cardinalityMeaning: At most one customer; empty for a guest.
        context: Lets the cart follow the shopper across devices.
    - name: lines
      target: ShoppingCartLine
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The products in the cart.
        usage: Edited as the shopper adds and removes items.
        cardinalityMeaning: Any number of lines, none for an empty cart.
        context: The lines belong to the cart and go with it.
  invariants:
    - id: CART-001
      rule: a CHECKED_OUT cart cannot be modified.
  lifecycle:
    title: Shopping Cart Lifecycle
    attribute: status
    states: [ACTIVE, CHECKED_OUT, ABANDONED, EXPIRED]
    initial: ACTIVE
    terminal:
      - CHECKED_OUT
      - ABANDONED
      - EXPIRED
    transitions:
      - {from: ACTIVE, to: CHECKED_OUT, action: check_out}
      - {from: ACTIVE, to: ABANDONED, action: abandon}
      - {from: ACTIVE, to: EXPIRED, action: expire}
  help:
    summary: A temporary collection of products a shopper has chosen before checkout.
    businessMeaning: The cart holds a shopper's intended purchase until they pay, leave or time out. Keeping it lets the shopper return to it, lets the business see abandoned baskets, and gives checkout the exact selection to turn into an order.
    usage: Created when a shopper adds the first item; updated as items change; read at checkout and in abandonment reports.
    relationshipContext: A cart may belong to a known customer and contains lines for the chosen products.
    lifecycle: A cart is active while the shopper browses. It ends checked out when an order is placed, abandoned when the shopper leaves, or expired when it times out. All three are final; a checked-out cart can no longer change.
    example: A shopper adds two items on Monday, never checks out and the cart expires after thirty days.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SHOPPING-CART
