entity:
  name: Language
  namespace: cedm.domain
  kind: reference_data
  description: A governed language reference used for localization, communication preferences, content, and reporting.
  ui:
    icon: languages
  referenceData: reference-data/language.yaml
  identity: {key: languageId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: languageId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of the language record, constant even if its name or code is later corrected.', usage: 'Generated when the language is first loaded from the reference list; content, user preferences and translations refer to it.'}}
    - {name: code, type: string, required: true, unique: true, maxLength: 2, help: {summary: 'The two-letter ISO 639-1 code of the language, such as en or de.', usage: Taken from the standard; unique; used in locale settings and APIs.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: 'The English name of the language, such as French or Portuguese.', usage: 'Loaded from the language reference data; it is shown in language pick-lists and reports, while the code remains the identifier.'}}
  relationships: []
  invariants:
    - {id: LANGUAGE-001, rule: Code and identity semantics must remain stable within the governing context and historical references must not be silently repointed.}
  help:
    summary: A language used for localisation, communication preferences, content and reporting.
    businessMeaning: People read and write in different languages. A language record lets the application offer translations, remember preferences and tag content with the language it is written in.
    usage: Loaded from the standard language registry; chosen on user profiles, documents and messages.
    relationshipContext: Parties, users and content refer to a language; the language itself depends on nothing.
    lifecycle: Code and identity stay stable, and history is never silently rewritten.
    example: English, with code en.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-LANGUAGE}
