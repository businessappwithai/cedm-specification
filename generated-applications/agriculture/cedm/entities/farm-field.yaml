entity:
  name: FarmField
  namespace: cedm.domain
  kind: agriculture_entity
  description: A defined agricultural land area managed as a production unit.
  ui:
    icon: table
  identity:
    key: farmFieldId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: farmFieldId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent identity of the field, unchanged when its code, farm or crop changes.
        usage: Generated on creation; crop plantings, work plans and harvest records refer to the field by this value.
    - name: fieldCode
      type: string
      required: true
      maxLength: 100
      help:
        summary: The code of the field within the farm, such as N-12.
        usage: Assigned by the farm; used in work plans.
    - name: area
      type: decimal
      required: false
      precision: 18
      scale: 4
      help:
        summary: The surveyed size of the field, a decimal measure that is meaningful only together with its unit.
        usage: Entered from a land survey or boundary measurement and revised if the boundary changes; always read with the unit of measure.
    - name: areaUnit
      type: reference
      target: UnitOfMeasure
      required: false
      help:
        summary: The unit of measure, such as hectare or acre, in which the field's area is expressed.
        usage: Chosen from the unit of measure list when the area is recorded, so farms can compare and total fields correctly.
    - name: soilType
      type: string
      required: false
      maxLength: 100
      help:
        summary: The main soil of the field.
        usage: Entered from soil surveys; used in crop choice.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - FALLOW
        - INACTIVE
      help:
        summary: Whether the field is in cultivation, resting between crops, or out of use altogether.
        usage: Set by the farm as land is planted, rested or withdrawn; it determines whether the field appears in planting plans.
        valueSemantics:
          ACTIVE: In cultivation and available for planting, treatment and harvest.
          FALLOW: Resting without a crop to restore the soil, and expected to return to cultivation.
          INACTIVE: Taken out of use and not planned for cropping.
  relationships:
    - name: farm
      target: Farm
      cardinality: '1'
      ownership: reference
      help:
        summary: The farm the field belongs to.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one farm: land is managed within a single holding.'
        workflowRole: Rolls the field's results up to the farm.
    - name: crops
      target: Crop
      cardinality: 0..*
      ownership: reference
      help:
        summary: The crops grown in the field.
        usage: Linked as plantings are made.
        cardinalityMeaning: Any number of crops over time.
        workflowRole: Records the rotation history.
  lifecycle:
    title: Farm Field Lifecycle
    attribute: status
    states: [ACTIVE, FALLOW, INACTIVE]
    initial: ACTIVE
    transitions:
      - {from: ACTIVE, to: FALLOW, action: mark_fallow}
      - {from: FALLOW, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: FALLOW, action: reactivate}
  help:
    summary: A defined area of agricultural land that is managed as a unit of production.
    businessMeaning: Crops are planted, treated and harvested field by field. A field record lets the farm plan rotations and track yields for each area.
    usage: Defined when land is surveyed; planted with crops; read for plans and harvest records.
    relationshipContext: A field belongs to a Farm and is planted with Crops.
    lifecycle: A field is active while cropped, may be left fallow to recover, and becomes inactive when taken out of use.
    example: Field N-12, 18 hectares of clay loam, planted with winter wheat.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM-FIELD
