entity:
  name: Crop
  namespace: cedm.domain
  kind: agriculture_master_entity
  description: A crop or cultivated plant category managed within an agricultural operation.
  ui:
    icon: sprout
  identity:
    key: cropId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: cropId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the crop record.
        usage: Generated on creation; plantings, harvests and products refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The short code by which the crop is known in plans and reports, such as WHT-W.
        usage: Unique; assigned when the crop is defined.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The common name of the crop, such as winter wheat or sweet corn.
        usage: Entered by agronomy staff; shown on planting plans and harvest records, so one crop should keep one agreed spelling.
    - name: cropType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The general group the crop belongs to, such as cereal, oilseed or vegetable.
        usage: Chosen at definition; used for rotation planning and reporting by group.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the crop is currently grown, resting between seasons, or no longer grown.
        usage: Set by agronomy staff; only ACTIVE crops are normally offered when planning plantings, and retired ones stay for history.
        valueSemantics:
          ACTIVE: Currently grown or available for planting.
          INACTIVE: Not grown at present, for example out of season; it can be reactivated.
          RETIRED: No longer grown; kept for history.
  relationships:
    - name: farms
      target: Farm
      cardinality: 0..*
      ownership: reference
      help:
        summary: The farms that grow this crop.
        usage: Maintained as farms add or drop the crop; read in yield, planning and market reports to see where the crop is produced.
        cardinalityMeaning: Any number of farms, since a crop may be grown on many farms or on none yet.
    - name: fields
      target: FarmField
      cardinality: 0..*
      ownership: reference
      help:
        summary: The fields in which this crop is currently or was previously planted.
        usage: Recorded for each planting; agronomists read it to plan rotations and to compare yields field by field.
        cardinalityMeaning: Any number of fields, one per planting, and a field may carry different crops over time.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products that come from this crop, such as grain, flour or seed.
        usage: Linked by sales and product staff; it shows what can be sold from a harvest and traces a product back to its crop.
        cardinalityMeaning: Any number of products, because one crop can yield several sellable items.
  lifecycle:
    title: Crop Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A crop or category of cultivated plant that an agricultural operation grows.
    businessMeaning: Planning, agronomy and sales all depend on knowing what is grown. A crop record is the shared reference for farms, fields and the products that come from them.
    usage: Maintained by agronomy staff; chosen when planning plantings and recording harvests; read in yield and market reports.
    relationshipContext: A crop is grown on Farms and in FarmFields, and is sold as Products.
    lifecycle: A crop is active while grown, can be made inactive between seasons, and is retired when the operation stops growing it. History stays.
    example: Winter wheat, grown on three farms in the autumn and sold as milling wheat.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CROP
