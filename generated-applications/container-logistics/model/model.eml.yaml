  - name: Currency
    help: Defines the monetary denomination that gives financial amounts their business meaning. Currency is not an amount. It defines the denomination in which an amount is stated and provides the reference needed for pricing, billing, settlement, banking, and accounting. Central to Product pricing, SalesOrder, Invoice, Payment, PaymentAllocation, BankTransaction, JournalEntry, ExchangeRate, and financial reporting. Product may carry reference pricing. SalesOrder establishes commercial amounts. Invoice establishes claims. Payment establishes settlement. PaymentAllocation applies settlement to claims. BankTransaction supplies external evidence. JournalEntry records accounting recognition. ExchangeRate provides auditable conversion between Currency denominations. Price → SalesOrder → Invoice → Payment → PaymentAllocation → BankTransaction reconciliation → JournalEntry. When currencies differ, an approved ExchangeRate and explicit rounding/conversion policy must be used; Currency master data never substitutes for an exchange-rate record. Currency is activated for use, may become inactive, and may eventually be retired. Lifecycle changes affect future transactions only and preserve historical financial evidence. A SalesOrder is denominated in USD and an Invoice is issued in USD. A customer pays in EUR. Payment records EUR, PaymentAllocation records the approved ExchangeRate and conversion context needed to settle the USD invoice, BankTransaction provides bank evidence in EUR, and accounting retains the rate used rather than later recalculating the historical settlement.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the currency master record. Referenced by monetary transactions and financial master data. Identifies the currency definition, not a monetary amount or an exchange-rate observation. Allows Product pricing, SalesOrder, Invoice, Payment, BankTransaction, PaymentAllocation, and accounting records to resolve the same currency. Required for unambiguous monetary interpretation.
      - name: code
        type: string(3)
        unique: true
        help: Three-letter business currency code, normally an ISO 4217 code where one exists. Used in documents, APIs, integrations, reports, pricing, banking, and accounting. Code identifies the denomination and is not an exchange rate or amount. Provides the currency identity carried through order, invoice, payment, bank, and ledger workflows. Required for interoperable monetary representation.
      - name: name
        type: string(100)
        help: Human-readable currency name. Used in user interfaces, documents, reports, master-data management, and integrations. Describes the currency identified by code and currencyId. Provides understandable monetary context to business users. Required for usable currency master data.
      - name: symbol
        type: string(10)
        optional: true
        help: Common display symbol for the currency. Used in user interfaces, customer documents, reports, and formatted amounts. Presentation metadata; it must not be used as the canonical currency identity. Improves human-readable display without affecting financial calculations. Optional where no standard symbol or display policy exists.
      - name: decimal_places
        type: integer
        help: Standard number of decimal places normally used when representing amounts in this currency. Used for amount formatting, rounding, validation, invoicing, payment processing, and accounting presentation. Transaction-specific precision or financial-system rules may be stricter; this field does not itself define rounding policy. Supplies a currency-level precision baseline to monetary workflows. Required because monetary amounts must have predictable representation.
        default: "2"
        min: 0
        max: 6
      - name: status
        type: string
        enum: CurrencyStatus
        help: Controls whether the currency is available for new monetary transactions. Used by pricing, order, invoicing, payment, banking, and accounting validation. Retiring a currency must not invalidate historical transactions expressed in that currency. New transactions should use ACTIVE currencies unless an authorized legacy exception applies. Available for normal financial activity. Temporarily unavailable for new normal activity. No longer available for new normal activity while historical financial records remain valid. Required for transaction eligibility.
        default: ACTIVE
  - name: ExchangeRate
    help: Represents an auditable conversion rate between two currencies for a defined time and business purpose. ExchangeRate is the conversion context between Currency denominations; it is not itself money, a payment, or an accounting entry. Used by multi-currency orders, invoices, payments, payment allocations, bank reconciliation, accounting, consolidation, and financial reporting. Currency defines denominations. Money carries amount plus currency. ExchangeRate provides the conversion between two Money values. PaymentAllocation and accounting consume the rate when cross-currency conversion is permitted. Source Money + source Currency → select valid ExchangeRate by rate type/effective time/source → convert → target Money → preserve ExchangeRate reference and rounding result. The selected rate becomes historical evidence of the conversion decision. Rate is created or imported, activated for its validity window, expires or is cancelled, while historical transactions retain the original rate reference. A customer invoice is USD 1,000 and payment is EUR. An approved EUR-to-USD ExchangeRate is selected according to settlement policy. The Payment remains EUR, the Invoice remains USD, PaymentAllocation records the conversion context, and accounting retains the rate used rather than later recalculating the historical settlement.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the exchange-rate observation or published rate record. Referenced by PaymentAllocation, accounting conversions, reporting, and other multi-currency calculations. Identifies one rate record rather than a currency or monetary amount. Provides auditable linkage from a converted amount back to the rate used. Required for traceable currency conversion.
      - name: from_currency
        type: string
        fk: true
        references: Currency
        help: Currency from which an amount is converted. Identifies the source denomination of the monetary amount being converted. Must differ from toCurrency for a meaningful exchange-rate conversion. Identifies the currency of the source Money value in an explicit conversion. Required to prevent ambiguous conversion direction.
      - name: to_currency
        type: string
        fk: true
        references: Currency
        help: Currency into which an amount is converted. Identifies the target denomination of the converted monetary amount. Conversion direction is from fromCurrency to toCurrency; reversing the direction requires an appropriate inverse rate rather than assuming arithmetic equivalence. Identifies the currency of the resulting Money value. Required for an auditable conversion.
      - name: rate
        type: decimal
        help: Positive conversion factor that expresses how much target currency corresponds to one unit of source currency under this rate convention. Used to calculate converted monetary amounts while preserving the declared direction. Must always be interpreted with fromCurrency, toCurrency, effectiveAt, and rateType. Supplies the mathematical conversion input used by settlement and accounting calculations. Required for conversion.
      - name: rate_type
        type: string
        enum: ExchangeRateRateType
        help: Classifies the business purpose and provenance context of the exchange rate. Used to select an appropriate rate according to transaction and accounting policy. Different workflows may require different rate types; a spot rate must not automatically replace a contractual or accounting rate. Controls which rate is eligible for a conversion event. Market or transaction-time conversion rate. Rate established by an agreement or commercial contract. Published daily rate for a defined business date. Published rate intended for a defined monthly reporting period. Rate designated by accounting policy for ledger translation or reporting. Controlled rate established for a specific business purpose. Required to preserve conversion context.
      - name: effective_at
        type: datetime
        help: Date and time from which the exchange rate is applicable under its rate policy. Used to select the correct rate for a transaction, settlement, or accounting event. A rate without an effective time cannot be reliably reproduced when rates change over time. Supports deterministic selection and audit of the rate used by PaymentAllocation and accounting conversion. Required for temporal validity.
      - name: expires_at
        type: datetime
        optional: true
        help: Optional end of the period during which the rate is valid. Used to prevent application of expired rates. When supplied, expiresAt must be later than effectiveAt. Defines the rate's validity window for transaction and reporting calculations. Optional for rates whose validity is governed by another period convention.
      - name: source
        type: string(200)
        help: Identifies the provider or business authority from which the rate was obtained. Used for audit, reconciliation, regulatory reporting, and rate governance. Source identifies provenance; it does not by itself determine which rate is applicable. Allows users and systems to reproduce or validate the conversion decision. Required for financial traceability.
      - name: status
        type: string
        enum: ExchangeRateStatus
        help: Lifecycle state of the exchange-rate record. Used by conversion services to determine whether a rate may be applied. Historical calculations retain the rate record even after it expires. Prevents use of draft, cancelled, or expired rates where policy does not permit them. Required for controlled rate selection.
        default: ACTIVE
  - name: UnitOfMeasure
    help: Defines the measurement semantics that make numeric quantities comparable across CEDM workflows. A quantity without a valid unit is incomplete business information. UnitOfMeasure provides the dimension and conversion context needed to interpret quantities correctly. Central to Product, sales, procurement, receiving, inventory, fulfillment, invoicing, manufacturing, logistics, service, and reporting. Product supplies a default measurement context. Transaction lines may use compatible units. GoodsReceiptLine supplies received/accepted quantities. InventoryBalance and InventoryMovement require consistent measurement. InvoiceLine must be comparable for matching. UOM create/update/retire → identify Products and open transaction dependencies → validate conversions → update future eligibility/configuration → revalidate affected SalesOrderLine/PurchaseOrderLine/GoodsReceiptLine/InventoryMovement/InvoiceLine workflows → preserve historical quantity meaning. A conversion change is never a silent retroactive data transformation. Units are created and activated for use, may become inactive, and may eventually be retired. Retirement prevents new normal use but never changes the meaning of historical quantities. A change to code/name/symbol affects presentation and integrations; a change to category/baseUnit/conversionFactor affects quantity semantics and requires dependency validation; a status change affects future transaction eligibility; historical transaction evidence remains immutable. A product is stocked in EACH but purchased in BOX. If one BOX equals 10 EACH, the PO records 5 BOX and inventory posts 50 EACH after conversion. If the BOX conversion changes to 12 EACH, existing PO and receipt quantities are not silently reinterpreted. Open affected transactions must be revalidated or explicitly converted, while historical receipts and invoices retain the original conversion evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of the unit-of-measure definition. Referenced by Product, transaction lines, inventory, and conversion rules. Identifies the measurement definition rather than a quantity value. Allows every quantity-bearing workflow to resolve exactly how a numeric quantity must be interpreted. Required for unambiguous measurement semantics.
      - name: code
        type: string(30)
        unique: true
        help: Standard business code for the unit, such as EACH, KG, L, HOUR, or DAY. Used in forms, integrations, documents, validation, and quantity display. Code identifies the unit definition; it does not represent a conversion or quantity itself. Used to resolve units during order entry, purchasing, receipt, inventory, invoicing, and reporting. Required for operational interoperability.
      - name: name
        type: string(100)
        help: Human-readable name of the measurement unit. Used in user interfaces, reports, documents, catalogs, and search. Describes the unit definition identified by code and unitOfMeasureId. Provides understandable measurement context to business users. Required for clear business interpretation.
      - name: symbol
        type: string(20)
        optional: true
        help: Standard display symbol for the unit. Used for compact display in documents, labels, reports, and interfaces. Symbol is presentation metadata and does not replace the canonical unit code. Improves human-readable representation of quantities. Optional when the unit has no standard symbol or display policy does not require one.
      - name: category
        type: string
        enum: UnitOfMeasureCategory
        help: Defines the dimensional family of the unit. Prevents invalid conversions and supports dimensional validation. Conversion is valid only between compatible dimensions under the applicable conversion model. Used when validating Product, SalesOrderLine, PurchaseOrderLine, GoodsReceiptLine, InvoiceLine, and InventoryMovement quantities. Required to establish dimensional compatibility.
      - name: conversion_factor
        type: decimal
        optional: true
        help: Default multiplicative factor relating this unit to its base unit when a simple linear conversion applies. Defines a master conversion used for future quantity interpretation. Used for quantity conversion when no context-specific conversion rule overrides the default. Interpreted with baseUnit and category; it must not be changed casually because dependent open transactions may rely on the prior interpretation. Supplies the conversion used by new and eligible future quantity transactions after dependency validation. Optional for base units or units whose conversion requires a dedicated rule.
      - name: base_unit_id
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
        help: Identifies the canonical base unit against which this derived unit is normally converted. Supports standardized quantity storage and conversion. A derived unit belongs to the same dimensional category as its base unit. Provides the common measurement basis for reconciliation across PO, receipt, inventory, sales, and invoice quantities. Optional for a base unit itself.
      - name: status
        type: string
        enum: UnitOfMeasureStatus
        help: Controls whether the unit can be used for new transactions. Used by master-data validation and transaction entry. Retiring a unit must not invalidate historical quantities already recorded with that unit. New quantity-bearing transactions should use ACTIVE units unless an authorized legacy exception exists. Required for transaction eligibility.
        default: ACTIVE
  - name: Calendar
    help: A governed calendar defining business dates, working days, holidays, and time-control semantics for planning and operational processes. Provide a canonical enterprise representation with stable identity and governed semantics. A governed calendar defining business dates, working days, holidays, and time-control semantics for planning and operational processes. Used whenever enterprise processes need this concept as controlled master or reference data. Referenced by compatible domain entities and workflows while preserving a single canonical identity. Created under governance, maintained through controlled changes, and retired or superseded without rewriting history where applicable. Master-data governance, transaction validation, reporting, integration, and audit. Enterprise configuration and cross-domain business workflows.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Calendar. Identifies the governed concept independently of mutable labels. Cross-domain reference, integration and audit. Used wherever this Calendar is referenced. Required.
      - name: code
        type: string(100)
        help: Governed business code for Calendar. Human and integration-friendly identifier. Search, configuration, exchange and reporting. Unique within its governing context according to policy. Required.
      - name: name
        type: string(300)
        help: Human-readable name of Calendar. Communicates the concept to business users. UI, documents and reports. Does not replace immutable identity. Required.
  - name: Attachment
    help: A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Provide durable, implementation-neutral governance semantics for Attachment. A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable. Connects authoritative business records to controlled lifecycle, evidence, findings, and downstream remediation without replacing source transactions. Created under governance, reviewed or finalized where applicable, and retained or superseded with history preserved. Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation. Enterprise agreements, controlled records, audit evidence, compliance findings, and lifecycle changes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Attachment. Identifies one governed record independently of mutable labels or state. Governance, workflow, integration and audit. Referenced by related enterprise records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Time at which this record becomes effective or evidentially applicable. Establishes temporal business meaning. Lifecycle, audit and reporting. Does not rewrite earlier effective evidence. Optional when lifecycle does not require a separate effective timestamp.
  - name: Container
    help: Represents a reusable intermodal freight container as a continuously identifiable physical logistics asset. Container is the equipment anchor connecting transport, depot, terminal, yard, maintenance, leasing, ownership, inventory, shipment, interchange, and commercial disposition processes. Used for gate events, yard placement, movement tracking, shipment assignment, inspection, repair, inventory, leasing, sale, scrap, and asset reporting. Party provides ownership context; Location provides present geographic context; YardSlot provides exact yard position; ContainerMovement provides chronological movement; RepairEstimate provides repair/disposition assessment. These concepts must remain separate because they represent different business facts. A container can move from active service to damaged or repair state and eventually return to service, be sold, scrapped, lost, or retired. Lifecycle transitions should be tied to the corresponding operational, maintenance, commercial, or exception process. A 40-foot dry container enters a depot, is assigned to YardSlot B03-012-04-02, moves to a repair area after damage, receives a RepairEstimate, returns to ACTIVE service, and later leaves the depot for a customer. The same containerId and containerNumber remain attached throughout the lifecycle while its location, slot, movement history, condition, and commercial context change.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable CEDM identity of the physical container asset. Used as the stable technical-to-business key across yard, movement, repair, inventory, shipment, interchange, leasing, and reporting processes. ContainerMovement, YardSlot, RepairEstimate, Shipment, and Location use this identity to preserve one continuous asset history even as the container changes place, condition, owner, or commercial use. Required because every event and transaction involving equipment must resolve to one unambiguous physical asset.
      - name: container_number
        type: string(20)
        unique: true
        help: The industry-facing identification number assigned to the physical container. Used by carriers, terminals, depots, customs, gate operations, interchange messages, shipping documents, and customers to identify the equipment. It is the operational identifier of the same asset represented internally by containerId; it must remain stable across movements and commercial events. Required because logistics actors normally identify equipment by its container number.
      - name: iso_code
        type: string(10)
        optional: true
        help: The standardized equipment code describing the container's equipment characteristics. Used for transport compatibility, yard allocation, vessel planning, depot handling, interchange, and equipment classification. Complements containerNumber and informs physical compatibility; it is not itself the container's identity. Optional only while standardized classification is unavailable; operations requiring equipment compatibility should resolve it before execution.
      - name: size_code
        type: string(20)
        optional: true
        help: The operational size classification of the container. Used for slot allocation, transport planning, pricing, capacity calculations, and TEU reporting. Size influences physical placement and transport constraints and should remain consistent with the authoritative equipment classification. Optional when derived from isoCode or an equipment master.
      - name: container_type
        type: string(50)
        optional: true
        help: The functional equipment category of the container, such as dry, refrigerated, tank, or open-top equipment. Drives handling, power, inspection, safety, maintenance, shipment compatibility, and yard-placement rules. Type determines operational capabilities and restrictions but does not replace Product or equipment-master classification where standardized definitions exist. Optional when maintained by a controlled equipment master.
      - name: tare_weight
        type: decimal
        optional: true
        help: The empty weight of the container without cargo. Combined with cargo weight for gross-weight calculations, transport compliance, loading decisions, and interchange. It is an equipment characteristic and should be interpreted with the applicable unit of measure and weighing source. Optional when authoritative equipment specifications provide the value dynamically.
      - name: max_gross_weight
        type: decimal
        optional: true
        help: The maximum permitted gross weight of the container and its cargo under the applicable equipment and operating rules. Used for loading, transport planning, safety, vessel/rail/road compliance, and handling decisions. Must be evaluated with tare weight, cargo weight, transport-mode limits, and regulatory constraints. Optional when maintained by an authoritative equipment specification.
      - name: manufacture_date
        type: date
        optional: true
        help: The date on which the physical container equipment was manufactured. Used for equipment age, inspection, maintenance, depreciation, leasing, resale, and retirement analysis. Commonly combined with acquisition, depreciation, repair, and disposition history to understand economic and operational life. Optional when provenance is incomplete, but its absence limits age-dependent analytics.
      - name: status
        type: string
        enum: ContainerStatus
        help: The current lifecycle state governing whether the container is available for ordinary operational use. Controls equipment allocation, yard placement, shipment assignment, repair workflows, disposition, and exception handling. Status is an asset lifecycle state, not a location state or repair estimate result; transitions should be justified by corresponding business processes. Equipment is available for normal assignment subject to operational constraints. Equipment is undergoing repair or maintenance and should normally be excluded from ordinary transport assignment. Equipment has known damage and requires assessment, restriction, or repair before normal use. Ownership or commercial disposition has transferred through a sale process and the equipment is no longer ordinary available inventory unless explicitly returned. Equipment has been designated for disposal and must not be assigned to operational movements. Equipment cannot currently be located and requires investigation or recovery. Equipment has permanently left normal operational service without necessarily being sold or scrapped. Required because equipment availability decisions depend on an explicit lifecycle state.
        default: ACTIVE
      - name: inventory_status
        type: string(50)
        optional: true
        help: The equipment's inventory classification within the owning or managing organization's asset inventory process. Supports fleet availability, ownership/lease reporting, depot inventory, and disposition workflows. Inventory classification is distinct from physical condition and lifecycle status and should not be used as a substitute for status. Optional where a dedicated equipment-inventory model supplies the classification.
      - name: owner_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Identifies the party that owns the physical equipment or is recorded as its commercial owner. Supports asset accounting, leasing, billing, maintenance responsibility, sale, and fleet reporting. At most one owner is represented at a point in time; absence means ownership is not modeled here. Owner is distinct from the carrier, lessee, customer, terminal, depot, or party physically possessing the container.
      - name: current_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Identifies the current physical or operational location of the container. Provides present-state visibility for routing, pickup, inventory, customer service, and exception handling. A container has at most one current location at a point in time. This is a current-state projection; chronological location changes belong in ContainerMovement.
      - name: current_slot_id
        type: string
        fk: true
        references: YardSlot
        optional: true
        help: Identifies the exact YardSlot currently occupied when the container is physically positioned in a modeled yard. Enables precise yard visibility, crane instructions, retrieval planning, and rehandle optimization. A container can occupy zero or one current slot. currentSlot is more precise than currentLocation and must be consistent with the slot's current occupancy state.
      - name: yard_id
        type: string
        fk: true
        optional: true
        help: The Yard this Container belongs to.
  - name: ContainerMovement
    help: Represents one traceable physical or operational movement of one shipping container. ContainerMovement is the execution-level event connecting the Container asset to yard positions, transport states, operators, and the business process that caused the move. It is deliberately separate from Container, which represents the asset, and YardSlot, which represents a physical storage position. Used by yard management, terminal/depot operations, gate management, vessel operations, repair operations, dispatch, equipment optimization, safety, audit, and movement analytics. Container answers what asset moved. SourceSlot and targetSlot answer where it moved. MovementType explains the physical purpose. RelatedTransaction explains why it was needed. AssignedTo identifies execution responsibility. Container.currentLocation/currentSlot represent present state; ContainerMovement preserves historical chronology. A movement is planned, optionally assigned, started when physical handling begins, and completed only when the resulting position or transport state is confirmed. Cancellation prevents execution. Failure records unsuccessful execution and triggers recovery or replanning. Completed movements remain immutable historical events. A yard system should reserve a target slot before executing a placement movement, validate container compatibility and stack constraints, atomically release the source and occupy the target when completion is confirmed, and update the container's present position. Optimization may create restack movements whose purpose is to reduce future rehandles rather than fulfill a customer transaction. Container C123 is in B12-08-02 and must leave the depot on an outbound truck. A GATE_OUT movement records the source slot, planned time, priority, and related release transaction. After the container crosses the gate, the movement becomes COMPLETED and the container no longer has an active yard slot. The movement remains immutable evidence of the physical departure.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the movement record. Used to trace planning, dispatch, execution, completion, exceptions, integrations, and audit history for one movement. Identifies the movement event/instruction; Container identifies the equipment and sourceSlot/targetSlot identify physical positions. Required because every movement must remain independently traceable.
      - name: movement_number
        type: string(100)
        unique: true
        help: The human-facing operational reference for the movement. Used by planners, operators, dispatchers, supervisors, gate teams, and external systems. It identifies the operational work item and is distinct from containerNumber and containerMovementId. Required for human and integration traceability.
      - name: movement_type
        type: string
        enum: ContainerMovementMovementType
        help: Defines the operational purpose and physical consequence of the movement. Determines validation, required source/target context, equipment needs, workflow, capacity effects, and reporting. Explains why the container is moving; the related transaction supplies the broader business reason when one exists. Establishes controlled receipt of a container into a facility or receiving flow. Places a container into a yard storage position. Relocates a container between yard positions to improve access, safety, capacity, or operational efficiency. Removes a container from a stacked position for another operation. Moves a container between controlled operational areas or locations. Records controlled exit through a facility gate. Records controlled entry through a facility gate. Places a container onto a transport asset for onward movement. Removes a container from a transport asset into the receiving flow. Positions equipment for inspection or survey. Moves equipment to or from a repair/workshop area. Required because the movement type determines physical and business rules.
      - name: status
        type: string
        enum: ContainerMovementStatus
        help: The execution state of the movement work item. Controls dispatch, assignment, execution, exception handling, and operational dashboards. Describes movement execution only; it must not be interpreted as the lifecycle status of the Container. Movement is required or scheduled but execution has not started. An operator, vehicle, crane, tractor, or other execution resource has been assigned. Physical execution has begun. The intended movement and resulting physical/transport state have been confirmed. The movement will not be executed under this instruction. Execution was attempted or initiated but did not complete successfully and requires recovery or replanning. Required for controlled operational execution.
        default: PLANNED
      - name: planned_at
        type: datetime
        optional: true
        help: The planned execution time for the movement. Supports yard sequencing, appointment coordination, crane/tractor scheduling, congestion management, and optimization. A planning timestamp is not evidence that movement occurred. Optional until a schedule is established.
      - name: started_at
        type: datetime
        optional: true
        help: The timestamp when physical execution actually began. Supports productivity, equipment utilization, delay analysis, turnaround measurement, and audit. Represents actual execution and is distinct from plannedAt. Optional before execution or when supplied by an external execution system.
      - name: completed_at
        type: datetime
        optional: true
        help: The timestamp when the intended movement was confirmed complete. Establishes completion chronology, move duration, resulting position/state, and operational metrics. For yard movements, completion should correspond to confirmed target-slot occupancy or source-slot release; for external movements it should correspond to the appropriate transport state. Optional until completion.
      - name: priority
        type: string
        enum: ContainerMovementPriority
        help: The relative urgency used to sequence this movement against competing work. Used by dispatch, yard optimization, exception management, and operational scheduling. Priority influences scheduling order but does not change the movement's physical meaning or the Container's business importance. Can normally wait behind higher-priority work. Follows ordinary operational sequencing. Receives preferential scheduling because delay may affect downstream activity. Requires protected or immediate execution because delay may materially affect safety, vessel operations, gate commitments, customer commitments, or another critical process. Required for consistent competing-work prioritization.
        default: NORMAL
      - name: container_id
        type: string
        fk: true
        help: Identifies the physical container being moved. Connects movement execution to equipment identity, size, type, ownership, condition, status, and current position. Exactly one Container is the subject of a movement. Container is the asset/current-state object; ContainerMovement is the event that changes its operational position or transport state.
      - name: source_slot_id
        type: string
        fk: true
        references: YardSlot
        optional: true
        help: Identifies the exact yard position occupied immediately before the movement when the move originates in a modeled yard slot. Supports occupancy release, validation, stack dependency analysis, travel planning, and historical reconstruction. Zero when the movement originates outside a yard slot, such as a gate-in or external discharge. Source slot is the physical starting position, not merely the facility or block containing the container.
      - name: assigned_to_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Identifies the party responsible for executing the movement when responsibility is modeled at party level. Supports dispatch accountability, contractor management, workload, safety, and performance reporting. Optional because execution may instead be assigned through a specialized worker, vehicle, crane, or external execution model. Party provides identity; specialized assignment entities can provide the operational execution details.
  - name: Yard
    help: Represents the facility-level operational boundary for container storage and handling. Yard is the physical and operational context in which containers enter, occupy storage positions, move between positions, undergo inspection or repair, and eventually leave the facility. It is more specific than Location but broader than a YardBlock or YardSlot. Used by container depots, terminals, inland yards, maintenance facilities, logistics operators, gate systems, yard management systems, capacity planning, and transport integrations. Location provides geographic identity. Yard provides facility semantics. YardBlock → YardBay → YardTier → YardSlot provides progressively finer storage position. Container identifies the equipment. ContainerMovement records movement history. Yard status controls facility-level availability while slot status controls individual placement availability. A yard is planned and configured, activated for operations, potentially suspended during incidents or restrictions, and eventually closed. Suspension or closure changes what new work may be accepted but does not erase historical container, movement, inspection, repair, or gate records. A typical flow is gate-in → equipment identification/inspection → yard allocation → placement in a compatible YardSlot → internal movement as required → inspection/repair or release → pre-dispatch staging → gate-out. Each stage should remain traceable to the yard and its physical position. A container depot operates YARD01. A truck gates in a container, the system identifies its size/type and condition, selects a compatible slot such as Block B / Bay 12 / Tier 3, records the placement, and later moves the container to a repair area. The yard remains the facility context while the slot and movement records provide precise operational history.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable CEDM identity of the managed yard facility. Identifies one operational yard regardless of the containers, blocks, slots, operators, or activities currently associated with it. Used by yard operations, location management, movements, inventory, reporting, access, planning, and integrations to anchor yard-specific records. YardBlock, Location, Container, and yard movement records use the yard as operational context. Configuration changes must not change this identity. Required because subordinate yard structures and operational records need an unambiguous facility identity.
      - name: code
        type: string(100)
        unique: true
        help: The operational business code used to identify the yard. Provides the concise facility reference used by operators, transport partners, EDI messages, reports, integrations, and searches. Used in gate, movement, inventory, shipment, location, and reporting processes where a yard must be selected or communicated. Code identifies the facility; the YardBlock/YardBay/YardTier/YardSlot hierarchy identifies the exact physical storage position. Required because operational systems need a stable human-facing facility identifier.
      - name: name
        type: string(200)
        help: The human-readable name of the yard facility. Identifies the facility in user interfaces, reports, documents, maps, and business communications. Supports operational search and reporting where a descriptive name is preferable to a technical code. Names the facility identified by yardId and code; it is not the technical identity and should not be used as a unique key. Required for clear human interpretation of the facility.
      - name: status
        type: string
        enum: YardStatus
        help: The controlled operational lifecycle state of the yard. Determines whether the facility is being prepared, accepting normal operations, temporarily restricted, or closed. Controls new allocations, inbound movements, gate activity, planning, and other operational actions. Yard status provides facility-level availability; individual YardSlot status and Container status provide more granular operational constraints. Facility exists in the master model but is not available for normal yard transactions. Facility can perform normal operations subject to capacity, safety, equipment, and process constraints. Normal operations are temporarily restricted because of incidents, maintenance, weather, regulatory action, or another controlled reason. Facility is no longer available for normal operations; closure activities may still be performed under controlled processes. Required because the facility's ability to accept new work must be explicit.
        default: ACTIVE
      - name: location_id
        type: string
        fk: true
        help: Associates the yard with its primary geographic or business Location. Provides address, coordinates, jurisdiction, routing, mapping, and regional context. Each yard has exactly one primary Location in this model. Location answers where the facility is; Yard answers what container-yard operational capabilities exist at that location.
  - name: YardBlock
    help: Represents a major storage subdivision within a container yard and the planning boundary above individual bays and slots. YardBlock organizes physical capacity into a manageable operational area, commonly grouping bays that share layout, equipment, traffic, cargo, container-type, or handling characteristics. It is a zoning and planning concept as well as a physical hierarchy element. Used for yard zoning, capacity management, container placement strategy, traffic planning, congestion management, navigation, reporting, and movement optimization. The hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. Yard supplies the facility boundary; YardBlock groups related bays; YardBay represents a longitudinal storage row; YardTier represents vertical stacking; YardSlot identifies an atomic physical position. Container placement should ultimately resolve to a YardSlot rather than stopping at block level. Block-level rules can constrain all subordinate locations. A placement algorithm should evaluate block status before bay/tier/slot capacity, compatibility, accessibility, safety, and movement cost. A block can also be a useful optimization unit for balancing density, minimizing rehandles, separating container classes, and controlling traffic. A block may be configured before the yard opens, activated for operations, temporarily blocked, or closed. Blocking does not automatically mean that containers disappear or move; existing occupancy must be preserved and any required relocation should be represented by explicit ContainerMovement events. A depot operates Block B03 for export dry containers. B03 contains bays B03-01 through B03-20. Each bay contains tiers and atomic slots. When a container arrives, the yard-planning process evaluates B03 and its subordinate locations for compatibility, availability, travel distance, rehandle impact, and operational rules before assigning a precise slot.
    parent: Yard
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the yard block. Identifies one storage-area subdivision within a specific Yard regardless of later changes to layout, capacity, or operating rules. Used by yard allocation, planning, reporting, navigation, movement planning, and integrations to address an area above bay level. The block belongs to one Yard and contains YardBays; its identity is therefore part of the physical hierarchy but remains stable across configuration changes. Required because every operational storage subdivision must be uniquely addressable.
      - name: code
        type: string(50)
        help: The operational code used by people and systems to identify the block. Provides the concise block designation shown on yard maps, operator instructions, dashboards, gate/move messages, and integrations. Used for navigation, slot addressing, capacity reporting, movement planning, and exception handling. The code is interpreted within its parent Yard and should be unique within that yard; it is not the identity of a bay or slot. Required because operators and systems need a practical hierarchical address.
      - name: name
        type: string(150)
        optional: true
        help: A descriptive name for the block used in user-facing operations and reporting. Allows a block to be identified by operational purpose, physical area, or local terminology in addition to its code. Used in yard maps, dashboards, reports, planning screens, and operator interfaces. Describes the same block identified by yardBlockId and code and should not replace those technical/business identifiers. Optional when the operational code is sufficient.
      - name: status
        type: string
        enum: YardBlockStatus
        help: "The operational availability of the entire block for container storage and movement activity. Determines whether subordinate bays may normally be selected for placement, relocation, or planning. Used by allocation and optimization algorithms to exclude unavailable storage areas. Block status is an upper-level constraint: a BLOCKED or CLOSED block can make otherwise ACTIVE bays and slots unusable for new placement. The block may participate in normal yard operations subject to bay, tier, slot, equipment, safety, and container constraints. The block is temporarily unavailable for normal placement or movement, for example because of maintenance, safety, congestion, inspection, or an incident. The block is administratively or permanently unavailable for normal operations. Required because block availability affects all subordinate storage positions."
        default: ACTIVE
      - name: yard_id
        type: string
        fk: true
        help: Places the block within its parent Yard facility. Supplies facility identity, location, operating status, capacity context, and the top-level yard rules governing the block. Every YardBlock belongs to exactly one Yard. Yard is the facility boundary; YardBlock is a subdivision within that facility.
  - name: YardBay
    help: Represents the longitudinal storage lane between a yard block and the vertical stacking levels used for container storage. YardBay is a physical and operational addressing level. It groups a sequence of vertically stacked positions and provides a useful unit for capacity planning, traffic analysis, container allocation, and rehandling optimization. Used by yard management, gate and dispatch operations, storage allocation, capacity planning, digital-twin visualization, equipment routing, and container movement optimization. The physical hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. Yard identifies the facility; YardBlock defines a major storage area; YardBay defines the longitudinal lane; YardTier defines vertical level; YardSlot identifies the atomic physical position. Container records the equipment being stored, while ContainerMovement records changes in its physical position. A bay is not itself a container position. It is a collection of stack levels and slots. Allocation algorithms can use bay-level characteristics such as distance to gate, crane/equipment access, traffic pattern, container class, expected dwell time, and rehandle risk before selecting a precise slot. A bay may be configured, activated, temporarily blocked, or closed. Blocking or closing a bay prevents new normal placements but does not erase current occupancy. Existing containers may require controlled relocation, and each relocation should produce an auditable ContainerMovement event. Bay is a natural optimization unit for balancing yard density, reducing travel distance, minimizing rehandles, grouping containers by destination or dwell profile, and managing equipment workload. A good placement decision evaluates bay-level cost together with tier/slot availability, stack compatibility, container dimensions, weight, hazardous status, reefer requirements, appointment/dispatch timing, and future retrieval priority. Block B03 contains Bay 12. Bay 12 has five tiers and multiple atomic slots. A container arriving at the depot is evaluated against Bay 12's access, capacity, compatibility, and future retrieval cost before a precise YardSlot is selected. If Bay 12 becomes blocked for maintenance, existing containers remain associated with their slots while new placements are prevented until the block is resolved.
    parent: YardBlock
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the yard bay. Identifies one longitudinal storage lane within a specific YardBlock regardless of changes to layout, numbering, or operational status. Used by yard allocation, movement planning, capacity analysis, digital-yard visualization, and integrations. The bay inherits facility context from YardBlock and provides the parent context for YardTier records. Required because every modeled bay must remain uniquely traceable.
      - name: code
        type: string(50)
        help: The operational business code used to identify the bay. Provides the human-facing bay address used by operators, terminal systems, equipment instructions, maps, reports, and integrations. Used in container move instructions, search, visualization, slot addressing, and exception handling. The code is scoped to the parent YardBlock and should not be treated as a globally unique yard address. Required for deterministic operational addressing.
      - name: bay_number
        type: integer
        help: The ordinal position of the bay within its parent YardBlock. Represents the bay's longitudinal sequence in the block's physical addressing scheme. Used for sorting, navigation, visualization, slot-code construction, distance estimation, and movement optimization. It is meaningful within the block; a bayNumber of 12 in two different blocks does not identify the same physical location. Required to provide deterministic physical ordering.
        min: 1
      - name: status
        type: string
        enum: YardBayStatus
        help: The operational availability of the bay and its subordinate tiers and slots. Determines whether the bay can normally participate in container placement, retrieval, relocation, and planning. Used by allocation and optimization algorithms to eliminate unavailable storage lanes before evaluating individual slots. Bay status is an upper-level constraint. A blocked bay can make otherwise active tiers and slots unavailable for new placement while containers already occupying them remain physically valid. The bay may participate in normal operations subject to tier, slot, container, equipment, safety, and yard rules. The bay is temporarily unavailable for normal placement or movement, for example because of maintenance, safety, congestion, inspection, or an incident. The bay is administratively or physically unavailable for normal operations until an explicit reopening or reconfiguration process occurs. Required because bay availability affects all subordinate storage positions.
        default: ACTIVE
      - name: block_id
        type: string
        fk: true
        references: YardBlock
        help: Places the bay inside its parent YardBlock. Supplies the yard, zoning, operational rules, capacity context, and addressing scope for the bay. Every YardBay belongs to exactly one YardBlock. YardBlock is the planning/storage-area boundary; YardBay is the longitudinal lane within that boundary.
  - name: YardTier
    help: Represents one vertical level in a container stack and provides the model's explicit representation of stacking height and access dependency. YardTier answers the question "how high in this bay is the position?" It is essential for calculating stack height, determining whether equipment can reach a container, and understanding whether retrieving one container requires moving containers above it. Used by yard allocation, crane planning, stacking validation, rehandle optimization, safety controls, capacity planning, digital-twin visualization, and operational reporting. The physical hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. YardTier should not be treated as the final location of a container; YardSlot is the atomic position. Container.currentSlot points to the exact position, while ContainerMovement records changes between positions. A higher tier generally implies greater retrieval dependency because containers beneath it can obstruct direct access. Placement algorithms therefore consider tier height together with container weight, allowable stacking, equipment reach, dwell time, expected retrieval order, hazardous/reefer rules, and rehandle cost. A tier can be structurally valid but operationally unusable because of equipment or safety restrictions. A tier can be active, temporarily blocked, or closed. Changing its status must not erase existing occupancy. If containers must be relocated, those relocations are explicit ContainerMovement events and the resulting slot state is updated separately. Bay B03-12 has tiers 1 through 5. A container at Tier 4 is above three lower stack positions. If the Tier 1 container is needed urgently, the yard optimizer may calculate one or more rehandles before retrieval. The tier model therefore directly contributes to movement cost and yard optimization.
    parent: YardBay
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable identity of the vertical tier. Identifies one modeled stack level within a specific YardBay regardless of later operational status changes. Used by yard addressing, stacking rules, capacity calculation, movement planning, visualization, and historical references. YardBay establishes the horizontal lane; YardTier establishes the vertical level; YardSlot identifies the exact physical position. Required because each stack level must be uniquely addressable.
      - name: tier_number
        type: integer
        help: The ordinal vertical level of the tier within its parent YardBay. Expresses how high the tier is in the stack according to the yard's numbering convention, normally with 1 as the lowest level. Used to validate stack height, determine access dependencies, calculate rehandle risk, generate physical addresses, and instruct yard equipment. Tier number has meaning only within its YardBay; it is not a global location identifier. Required because vertical position is fundamental to container stacking.
        min: 1
      - name: status
        type: string
        enum: YardTierStatus
        help: The operational availability of the entire stack level. Determines whether subordinate positions can normally be used for placement, retrieval, or relocation. Used by allocation, stacking, crane planning, safety, and yard optimization algorithms. Tier status can make all subordinate YardSlots operationally unavailable even if their individual status is ACTIVE. Positions may be used subject to slot, container, equipment, safety, and yard rules. The tier is temporarily unavailable, for example because of equipment reach limits, safety restrictions, inspection, damage, or operational constraints. The tier is administratively unavailable for normal operations until explicitly reactivated or reconfigured. Required because a tier-level restriction propagates to its subordinate positions.
        default: ACTIVE
      - name: bay_id
        type: string
        fk: true
        references: YardBay
        help: Places the tier within its parent YardBay and therefore within the containing block and yard. Provides the physical addressing scope, inherited operating constraints, and relationship to other stack levels in the same bay. Every YardTier belongs to exactly one YardBay. The bay provides horizontal context; the tier provides vertical context.
  - name: YardSlot
    help: Represents the final, atomic physical position used to place and retrieve a container in a structured yard. YardSlot answers the operational question "exactly where is this container?" It is the location at which a move becomes physically executable and where occupancy can be validated without ambiguity. Used by yard management, gate operations, dispatch, crane/handling equipment, inventory visibility, container tracking, rehandling optimization, digital twins, and movement execution. The physical hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. Container references the current slot, while ContainerMovement records every meaningful relocation. YardSlot should therefore represent current physical state, not the movement history. A valid placement requires the slot to be usable and compatible with the container's size, type, weight, hazardous classification, reefer requirements, stack rules, equipment access, and yard policy. A sophisticated allocator should also consider expected dwell time, retrieval priority, traffic distance, rehandle probability, and energy/equipment cost. Slot occupancy is current state. When a container moves, the origin becomes available and the destination becomes occupied as part of one controlled movement transaction. Historical positions must remain queryable from ContainerMovement so audit, dwell-time, rehandle, and optimization analysis are not lost. Latitude and longitude enable mapping and route calculations but are supplementary. Hierarchical addressing remains the authoritative operational structure because adjacent slots, stack relationships, and equipment access cannot be inferred reliably from coordinates alone. A slot is configured, may become active and empty, can be reserved for an expected placement, becomes occupied when a container arrives, and returns to empty after a successful departure. It can also be blocked or taken out of service without deleting its historical occupancy. Slot B03-012-04-02 is an EMPTY ground position. The yard optimizer reserves it for an inbound 40-foot container. When the container is physically placed, the slot becomes OCCUPIED and the Container.currentSlot is updated. When the container later moves to a repair area, the movement records the origin and destination and the original slot returns to EMPTY.
    parent: YardTier
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable CEDM identity of the physical yard position. Identifies one storage position independently of the container currently occupying it. Used by allocation, movement instructions, crane operations, digital-yard visualization, occupancy history, and integrations. Container.currentSlot references the current position while ContainerMovement records historical changes; the slot identity itself does not change when occupancy changes. Required because every executable yard position must have a stable identity.
      - name: slot_code
        type: string(100)
        help: The human-readable operational address of the exact yard position. Provides the address operators use to identify where a container should be placed or retrieved. Used in handheld devices, yard maps, gate/interchange documents, move orders, search, reports, and equipment instructions. Its meaning is derived from the YardBlock, YardBay, YardTier, and local position hierarchy; it is not a substitute for those structural relationships. Required because yard execution needs an unambiguous physical address.
      - name: position
        type: integer
        help: The ordinal horizontal position of the slot within its parent YardTier according to the yard's addressing convention. Distinguishes adjacent storage positions on the same tier and provides deterministic placement/navigation. Used for physical addressing, yard visualization, movement planning, and layout validation. Position is scoped to the parent tier and should not be interpreted as a global coordinate or geographic distance. Required to identify the exact position within the tier.
        min: 1
      - name: status
        type: string
        enum: YardSlotStatus
        help: The current operational state of the storage position. Determines whether the position is available, physically occupied, preallocated, temporarily restricted, or physically unavailable. Drives allocation, movement validation, yard optimization, equipment dispatch, and exception handling. OCCUPIED represents actual current placement; RESERVED represents intended future placement; BLOCKED and OUT_OF_SERVICE prevent normal placement regardless of whether the position is physically empty. Physically available for a valid container placement. Currently occupied by exactly one container. Held for an expected move or planned placement but not yet physically occupied. Temporarily unavailable because of an operational restriction such as traffic, safety, inspection, congestion, or local control. Physically or administratively unavailable for an extended reason such as damage, maintenance, construction, or reconfiguration. Required because slot state is an execution constraint for every placement or relocation.
        default: EMPTY
      - name: latitude
        type: decimal
        optional: true
        help: The geographic latitude of the physical slot or its defined mapping reference point. Allows the atomic yard position to participate in geospatial visualization and route calculations. Used by digital twins, mapping, equipment routing, geospatial analysis, and integration with external mapping services. Coordinates complement hierarchical addressing and should correspond to the same physical position represented by slotCode. Optional where the yard operates entirely from a logical grid or local coordinate system.
      - name: longitude
        type: decimal
        optional: true
        help: The geographic longitude of the physical slot or its defined mapping reference point. Completes the geographic coordinate for the exact storage position. Used with latitude for mapping, visualization, route calculation, and geospatial analysis. Longitude must describe the same physical reference point as latitude and does not replace the operational hierarchy. Optional where geographic coordinates are not maintained at slot level.
      - name: tier_id
        type: string
        fk: true
        references: YardTier
        help: Places the slot within its parent YardTier and therefore determines its complete physical yard hierarchy. Used to derive bay, block, and yard context and validate addressing and stacking rules. Every YardSlot belongs to exactly one YardTier. Tier provides vertical context; position supplies local horizontal context; together with the parent hierarchy they identify the atomic storage address.
      - name: container_id
        type: string
        fk: true
        optional: true
        help: Identifies the container currently occupying the slot. Used for current yard visibility, retrieval planning, inventory lookup, movement validation, and operator instructions. At most one container may occupy a slot at a time. This is current-state occupancy. Historical occupants and previous locations must be derived from ContainerMovement rather than overwritten in this relationship.
