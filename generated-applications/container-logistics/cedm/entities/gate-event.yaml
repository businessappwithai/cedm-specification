entity:
  name: GateEvent
  namespace: cedm.domain
  kind: terminal_gate_event
  description: An immutable operational event recording a governed entry, exit or gate-processing occurrence for a Container, Vehicle or visit at a terminal Gate.
  ui: {icon: log-in}
  identity: {key: gateEventId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: gateEventId, type: uuid, required: true, immutable: true, help: {summary: The identity of this gate occurrence., usage: 'Generated on capture; verification, reversal and visit records refer to it.', businessMeaning: Identifies one terminal entry/exit occurrence independently of current container or vehicle state., relationshipContext: Gate supplies checkpoint context while Container/Vehicle/Visit identify subjects.}}
    - {name: occurredAt, type: datetime, required: true, help: {summary: 'The moment the container, vehicle or visit passed through the gate or was processed there.', usage: "Taken from the gate system's own timestamp; dwell time, security review and billing disputes are resolved against it.", businessMeaning: Establishes custody and terminal chronology., relationshipContext: Must preserve source event time independently of ingestion time.}}
    - name: direction
      type: enum
      required: true
      values: [IN, OUT, INTERNAL, OTHER]
      help:
        summary: Whether the movement entered the controlled area, left it, or passed between internal zones.
        usage: Set by the gate system at capture; yard inventory and custody transfer change according to it.
        valueSemantics:
          IN: Entry into the controlled terminal area, which starts the subject's time inside.
          OUT: Exit from the controlled terminal area, which ends the subject's time inside.
          INTERNAL: A gate-controlled move between zones inside the terminal, with no entry or exit.
          OTHER: Another governed gate occurrence that is neither entry, exit nor internal move.
        businessMeaning: "Determines whether the event represents entry, exit or another gate-controlled movement."
        relationshipContext: ContainerVisit/Movement must reconcile to direction.
    - name: status
      type: enum
      required: true
      default: RECORDED
      values: [RECORDED, VERIFIED, REVERSED]
      help:
        summary: Whether the recorded gate event has been checked.
        usage: Set by gate supervision or reconciliation.
        valueSemantics:
          RECORDED: Captured at the gate, not yet checked.
          VERIFIED: Checked and accepted as evidence. A final state.
          REVERSED: Withdrawn because it was recorded in error; a follow-up event carries the correction. A final state.
        businessMeaning: "Distinguishes captured, verified and explicitly reversed events."
        relationshipContext: Reversal preserves original evidence.
  relationships:
    - {name: gate, target: Gate, cardinality: "1", ownership: reference, help: {cardinalityMeaning: 'Exactly one gate: every occurrence is recorded at a specific checkpoint.', summary: Terminal Gate where the event occurred., businessMeaning: Supplies checkpoint context., usage: "Operations, security and reporting.", workflowRole: Gate must be operational at event time except governed exceptions.}}
    - {name: container, target: Container, cardinality: "0..1", ownership: reference, help: {summary: Container processed by the GateEvent., businessMeaning: Preserves container custody and terminal presence evidence., usage: "Container tracking and yard operations.", cardinalityMeaning: Optional for vehicle-only or non-container events., workflowRole: ContainerVisit/Movement direction must reconcile.}}
    - {name: vehicle, target: Vehicle, cardinality: "0..1", ownership: reference, help: {summary: Vehicle processed by the GateEvent., businessMeaning: Preserves landside transport context., usage: "Truck gate, fleet and security.", cardinalityMeaning: Optional where no Vehicle is involved., workflowRole: Vehicle/driver eligibility may be validated under terminal policy.}}
    - {name: driver, target: Driver, cardinality: "0..1", ownership: reference, help: {summary: Driver associated with the gate movement., businessMeaning: Supports access authorization and accountability., usage: "Security, transport and audit.", cardinalityMeaning: Optional where no driver is involved., workflowRole: Driver eligibility is evaluated at event time.}}
    - {name: containerVisit, target: ContainerVisit, cardinality: "0..1", ownership: reference, help: {summary: Container terminal visit to which this GateEvent belongs., businessMeaning: Connects immutable gate evidence to the container's broader terminal stay., usage: "Dwell, custody and terminal reporting.", cardinalityMeaning: Optional before visit matching or for non-container events., workflowRole: Gate-in/out chronology must reconcile to Visit lifecycle.}}
  invariants:
    - {id: GATE-EVENT-001, rule: GateEvent must identify at least one operational subject such as Container or Vehicle.}
    - {id: GATE-EVENT-002, rule: VERIFIED GateEvent is immutable evidence; corrections use an explicit reversal/follow-up event.}
    - {id: GATE-EVENT-003, rule: Import retries must be idempotent for the same external gate transaction identity.}
  lifecycle:
    title: Gate Event Lifecycle
    attribute: status
    states: [RECORDED, VERIFIED, REVERSED]
    initial: RECORDED
    terminal: [VERIFIED, REVERSED]
    transitions:
      - {from: RECORDED, to: VERIFIED, action: verify}
      - {from: RECORDED, to: REVERSED, action: reverse}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a gate event is ended"
      description: "When a gate event is reversed, a task asks someone to settle what depended on it."
      when: "status == \"REVERSED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GATE-EVENT-FOLLOW-UP-{{id}}"
              name: "Follow up on gate event {{id}}"
              description: "Gate event {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Preserves immutable terminal gate entry/exit evidence.
    businessMeaning: Gate is checkpoint master data; GateEvent records what happened; ContainerVisit and Movement summarize broader operational state/history.
    usage: Container terminals, ports, yards, security, custody, billing, tracking and audit.
    relationshipContext: Gate is mandatory; Container, Vehicle, Driver and ContainerVisit identify event subjects and context.
    lifecycle: Event is recorded, then verified or reversed with original evidence retained.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-GATE-EVENT}
