entity:
  name: ContainerMovement
  namespace: cedm.domain
  kind: logistics_transaction
  description: A traceable operational instruction and, once executed, historical event representing the movement of one specific shipping container between physical positions or transport states within a depot, terminal, port, workshop, yard, gate, or wider logistics network.
  identity:
    key: containerMovementId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: containerMovementId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The immutable identity of the movement record.
      usage: Used to trace planning, dispatch, execution, completion, exceptions, integrations, and audit history for one movement.
      relationshipContext: Identifies the movement event/instruction; Container identifies the equipment and sourceSlot/targetSlot identify physical positions.
      requiredMeaning: Required because every movement must remain independently traceable.
  - name: movementNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The human-facing operational reference for the movement.
      usage: Used by planners, operators, dispatchers, supervisors, gate teams, and external systems.
      relationshipContext: It identifies the operational work item and is distinct from containerNumber and containerMovementId.
      requiredMeaning: Required for human and integration traceability.
  - name: movementType
    type: enum
    required: true
    values: [RECEIVE, STACK, RESTACK, UNSTACK, TRANSFER, GATE_OUT, GATE_IN, LOAD, DISCHARGE, INSPECTION, REPAIR_MOVE]
    help:
      summary: Defines the operational purpose and physical consequence of the movement.
      usage: Determines validation, required source/target context, equipment needs, workflow, capacity effects, and reporting.
      relationshipContext: Explains why the container is moving; the related transaction supplies the broader business reason when one exists.
      valueSemantics:
        RECEIVE: Establishes controlled receipt of a container into a facility or receiving flow.
        STACK: Places a container into a yard storage position.
        RESTACK: Relocates a container between yard positions to improve access, safety, capacity, or operational efficiency.
        UNSTACK: Removes a container from a stacked position for another operation.
        TRANSFER: Moves a container between controlled operational areas or locations.
        GATE_OUT: Records controlled exit through a facility gate.
        GATE_IN: Records controlled entry through a facility gate.
        LOAD: Places a container onto a transport asset for onward movement.
        DISCHARGE: Removes a container from a transport asset into the receiving flow.
        INSPECTION: Positions equipment for inspection or survey.
        REPAIR_MOVE: Moves equipment to or from a repair/workshop area.
      requiredMeaning: Required because the movement type determines physical and business rules.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED]
    help:
      summary: The execution state of the movement work item.
      usage: Controls dispatch, assignment, execution, exception handling, and operational dashboards.
      relationshipContext: Describes movement execution only; it must not be interpreted as the lifecycle status of the Container.
      valueSemantics:
        PLANNED: Movement is required or scheduled but execution has not started.
        ASSIGNED: An operator, vehicle, crane, tractor, or other execution resource has been assigned.
        IN_PROGRESS: Physical execution has begun.
        COMPLETED: The intended movement and resulting physical/transport state have been confirmed.
        CANCELLED: The movement will not be executed under this instruction.
        FAILED: Execution was attempted or initiated but did not complete successfully and requires recovery or replanning.
      requiredMeaning: Required for controlled operational execution.
  - name: plannedAt
    type: datetime
    required: false
    help:
      summary: The planned execution time for the movement.
      usage: Supports yard sequencing, appointment coordination, crane/tractor scheduling, congestion management, and optimization.
      relationshipContext: A planning timestamp is not evidence that movement occurred.
      optionalMeaning: Optional until a schedule is established.
  - name: startedAt
    type: datetime
    required: false
    help:
      summary: The timestamp when physical execution actually began.
      usage: Supports productivity, equipment utilization, delay analysis, turnaround measurement, and audit.
      relationshipContext: Represents actual execution and is distinct from plannedAt.
      optionalMeaning: Optional before execution or when supplied by an external execution system.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: The timestamp when the intended movement was confirmed complete.
      usage: Establishes completion chronology, move duration, resulting position/state, and operational metrics.
      relationshipContext: For yard movements, completion should correspond to confirmed target-slot occupancy or source-slot release; for external movements it should correspond to the appropriate transport state.
      optionalMeaning: Optional until completion.
  - name: priority
    type: enum
    required: true
    default: NORMAL
    values: [LOW, NORMAL, HIGH, CRITICAL]
    help:
      summary: The relative urgency used to sequence this movement against competing work.
      usage: Used by dispatch, yard optimization, exception management, and operational scheduling.
      relationshipContext: Priority influences scheduling order but does not change the movement's physical meaning or the Container's business importance.
      valueSemantics:
        LOW: Can normally wait behind higher-priority work.
        NORMAL: Follows ordinary operational sequencing.
        HIGH: Receives preferential scheduling because delay may affect downstream activity.
        CRITICAL: Requires protected or immediate execution because delay may materially affect safety, vessel operations, gate commitments, customer commitments, or another critical process.
      requiredMeaning: Required for consistent competing-work prioritization.
  relationships:
  - name: container
    target: Container
    cardinality: '1'
    ownership: reference
    help:
      summary: Identifies the physical container being moved.
      usage: Connects movement execution to equipment identity, size, type, ownership, condition, status, and current position.
      cardinalityMeaning: Exactly one Container is the subject of a movement.
      context: Container is the asset/current-state object; ContainerMovement is the event that changes its operational position or transport state.
  - name: sourceSlot
    target: YardSlot
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the exact yard position occupied immediately before the movement when the move originates in a modeled yard slot.
      usage: Supports occupancy release, validation, stack dependency analysis, travel planning, and historical reconstruction.
      cardinalityMeaning: Zero when the movement originates outside a yard slot, such as a gate-in or external discharge.
      context: Source slot is the physical starting position, not merely the facility or block containing the container.
  - name: targetSlot
    target: YardSlot
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the intended or resulting exact yard position when the movement places the container into a modeled slot.
      usage: Supports reservation, compatibility validation, stacking checks, occupancy updates, route planning, and confirmation.
      cardinalityMeaning: Zero for movements whose destination is outside a controlled yard slot, such as gate-out or transport loading.
      context: Target slot must be compatible with container dimensions, stacking rules, status, accessibility, and current availability.
  - name: assignedTo
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the party responsible for executing the movement when responsibility is modeled at party level.
      usage: Supports dispatch accountability, contractor management, workload, safety, and performance reporting.
      cardinalityMeaning: Optional because execution may instead be assigned through a specialized worker, vehicle, crane, or external execution model.
      context: Party provides identity; specialized assignment entities can provide the operational execution details.
  - name: relatedTransaction
    target: BusinessTransaction
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links the movement to the business transaction or operational process that caused or justified it.
      usage: Provides traceability from physical execution to shipment, gate transaction, delivery, inspection, repair, discharge, or other business context.
      cardinalityMeaning: Optional because internal restacks, safety moves, and optimization moves may have no separate originating transaction.
      context: Separates the physical event from its business reason.
  invariants:
  - id: CONTAINER-MOVEMENT-001
    rule: COMPLETED movement requires completedAt.
  - id: CONTAINER-MOVEMENT-002
    rule: sourceSlot and targetSlot must not be the same when both are present.
  - id: CONTAINER-MOVEMENT-003
    rule: STACK, RESTACK, and yard-directed TRANSFER movements must have a targetSlot before physical execution begins.
  - id: CONTAINER-MOVEMENT-004
    rule: A completed movement must produce a container position or transport state consistent with movementType.
  - id: CONTAINER-MOVEMENT-005
    rule: A completed movement is historical evidence and must not be overwritten to correct history; corrective activity is represented by a subsequent authorized event or reversal process.
  help:
    summary: Represents one traceable physical or operational movement of one shipping container.
    businessMeaning: ContainerMovement is the execution-level event connecting the Container asset to yard positions, transport states, operators, and the business process that caused the move. It is deliberately separate from Container, which represents the asset, and YardSlot, which represents a physical storage position.
    usage: Used by yard management, terminal/depot operations, gate management, vessel operations, repair operations, dispatch, equipment optimization, safety, audit, and movement analytics.
    relationshipContext: Container answers what asset moved. SourceSlot and targetSlot answer where it moved. MovementType explains the physical purpose. RelatedTransaction explains why it was needed. AssignedTo identifies execution responsibility. Container.currentLocation/currentSlot represent present state; ContainerMovement preserves historical chronology.
    lifecycle: A movement is planned, optionally assigned, started when physical handling begins, and completed only when the resulting position or transport state is confirmed. Cancellation prevents execution. Failure records unsuccessful execution and triggers recovery or replanning. Completed movements remain immutable historical events.
    operationalSemantics: A yard system should reserve a target slot before executing a placement movement, validate container compatibility and stack constraints, atomically release the source and occupy the target when completion is confirmed, and update the container's present position. Optimization may create restack movements whose purpose is to reduce future rehandles rather than fulfill a customer transaction.
    example: Container C123 is in B12-08-02 and must leave the depot on an outbound truck. A GATE_OUT movement records the source slot, planned time, priority, and related release transaction. After the container crosses the gate, the movement becomes COMPLETED and the container no longer has an active yard slot. The movement remains immutable evidence of the physical departure.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-CONTAINER-MOVEMENT
