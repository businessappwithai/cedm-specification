entity:
  name: HealthcareEncounter
  namespace: cedm.domain
  kind: healthcare_transaction
  description: A recorded interaction between a patient and healthcare provider or facility for evaluation, treatment, or service.
  ui:
    icon: file-text
  identity:
    key: encounterId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: encounterId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the encounter.
        usage: Generated on creation; clinical entries refer to it.
    - name: encounterType
      type: enum
      required: true
      values:
        - OUTPATIENT
        - INPATIENT
        - EMERGENCY
        - VIRTUAL
        - HOME_CARE
        - OTHER
      help:
        summary: The setting in which care is delivered.
        usage: Chosen at registration; decides coding, billing and workflow.
        valueSemantics:
          OUTPATIENT: A visit without an overnight stay.
          INPATIENT: Care with admission to a ward.
          EMERGENCY: Unplanned urgent care.
          VIRTUAL: Care delivered remotely by video or telephone.
          HOME_CARE: Care delivered at the patient's home.
          OTHER: Any other setting.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the encounter is in its course.
        usage: Updated by the provider.
        valueSemantics:
          PLANNED: Expected but not started.
          IN_PROGRESS: Care is being delivered.
          COMPLETED: Finished. A final state.
          CANCELLED: Did not take place. A final state.
    - name: startAt
      type: datetime
      required: true
      help:
        summary: When the encounter began.
        usage: Recorded at check-in or start.
    - name: endAt
      type: datetime
      required: false
      help:
        summary: When the encounter ended.
        usage: Recorded at discharge or end; must not be before the start.
    - name: reason
      type: string
      required: false
      maxLength: 2000
      help:
        summary: Why the patient was seen, in the patient's or clinician's words.
        usage: Written at registration; read by the care team.
  relationships:
    - name: patient
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        summary: The patient who received care.
        usage: Set at registration.
        cardinalityMeaning: "Exactly one patient: an encounter is a particular person's episode of care."
        workflowRole: Adds the encounter to the patient's record.
    - name: provider
      target: HealthcareProvider
      cardinality: 0..1
      ownership: reference
      help:
        summary: The provider organisation delivering the care.
        usage: Set at registration.
        cardinalityMeaning: At most one provider; some encounters are recorded before the provider is allocated.
        workflowRole: Identifies who is responsible for the care and billing.
    - name: diagnoses
      target: Diagnosis
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The diagnoses made during the encounter.
        usage: Added by clinicians.
        cardinalityMeaning: Any number.
        workflowRole: Document why the care was needed.
    - name: procedures
      target: Procedure
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The procedures carried out.
        usage: Added by clinicians.
        cardinalityMeaning: Any number.
        workflowRole: Document what was done.
    - name: orders
      target: HealthcareOrder
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The orders raised during the encounter.
        usage: Added by clinicians.
        cardinalityMeaning: Any number.
        workflowRole: Drive tests, treatments and referrals.
    - {name: practitioners, target: Practitioner, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of practitioners who took part in the encounter., summary: Practitioners participating in this encounter., businessMeaning: Preserves actual professional care attribution., usage: "Clinical operations, reporting and audit.", workflowRole: Historical participation remains attributable after later credential or affiliation changes.}}
    - {name: appointment, target: Appointment, cardinality: "0..1", ownership: reference, help: {cardinalityMeaning: 'At most one appointment, the booking that led to the encounter.', summary: Appointment from which this encounter arose., businessMeaning: Reconciles planned care with actual care delivery., usage: "Scheduling analytics, patient flow and audit.", workflowRole: Appointment and Encounter patient/provider context must reconcile where linked.}}

  invariants:
    - id: ENCOUNTER-001
      rule: endAt must not precede startAt.
  lifecycle:
    title: Healthcare Encounter Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a healthcare encounter is ended"
      description: "When a healthcare encounter is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "HEALTHCARE-ENCOUNTER-FOLLOW-UP-{{id}}"
              name: "Follow up on healthcare encounter {{id}}"
              description: "Healthcare encounter {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a healthcare encounter is done"
      description: "When a healthcare encounter is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "HEALTHCARE-ENCOUNTER-COMPLETED-{{id}}"
              name: "Confirm healthcare encounter {{id}}"
              description: "Healthcare encounter {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A recorded interaction between a patient and a healthcare provider or facility for evaluation, treatment or service.
    businessMeaning: The encounter is the unit of care. Diagnoses, procedures and orders are made within an encounter, and billing and quality reporting follow from it.
    usage: Created when care is planned or begins; completed when it ends; read by clinicians, coders and billing.
    relationshipContext: An encounter is for a HealthcarePatient, may be with a HealthcareProvider and Practitioners, may arise from an Appointment, and contains Diagnoses, Procedures and HealthcareOrders.
    lifecycle: An encounter is planned, in progress while care is delivered, and completed when finished; it can be cancelled if care does not take place.
    example: A 30-minute outpatient visit to a cardiology clinic on 4 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-ENCOUNTER
