entity:
  name: HealthcareProvider
  namespace: cedm.domain
  kind: healthcare_party_role
  description: A person or organization authorized to provide healthcare services.
  ui:
    icon: database
  identity:
    key: providerId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: providerId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the provider record.
        usage: Generated on registration; encounters and claims refer to it.
    - name: partyId
      type: reference
      target: Party
      required: true
      help:
        summary: The party that is the provider.
        usage: Set at registration so the provider shares one identity with its other roles.
    - name: providerNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique number that identifies the provider to payers and authorities.
        usage: Entered at registration from the licence or payer contract; printed on claims.
    - name: providerType
      type: enum
      required: true
      values:
        - PHYSICIAN
        - NURSE
        - CLINIC
        - HOSPITAL
        - LABORATORY
        - PHARMACY
        - OTHER
      help:
        summary: The kind of provider.
        usage: Chosen at registration; decides what services it can be scheduled for and how claims are submitted.
        valueSemantics:
          PHYSICIAN: A doctor in independent practice.
          NURSE: A nurse or nurse practitioner providing care.
          CLINIC: An outpatient clinic or practice.
          HOSPITAL: A hospital or inpatient facility.
          LABORATORY: A diagnostic laboratory.
          PHARMACY: A pharmacy dispensing medicines.
          OTHER: Any other kind of provider.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: Whether the provider is currently authorised to give care.
        usage: Set by credentialing staff; only ACTIVE providers can be scheduled.
        valueSemantics:
          ACTIVE: Authorised and available for scheduling.
          INACTIVE: Not currently providing services; can return.
          SUSPENDED: Barred while a licence, credential or conduct issue is reviewed.
          RETIRED: No longer a provider; kept for history. A final state.
  relationships:
    - name: party
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party that acts as the provider.
        usage: Set at registration.
        cardinalityMeaning: 'Exactly one party: a provider is a specific person or organisation.'
        workflowRole: Holds the provider's name and contact details.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation the provider belongs to or works through.
        usage: Set where the provider is part of a larger body, such as a hospital group.
        cardinalityMeaning: At most one organisation; an independent practitioner has none.
        workflowRole: Places the provider in a reporting and billing structure.
    - name: encounters
      target: HealthcareEncounter
      cardinality: 0..*
      ownership: reference
      help:
        summary: The encounters delivered by the provider.
        usage: Read for workload and quality reporting.
        cardinalityMeaning: Any number over the provider's service.
        workflowRole: Shows what care the provider has delivered.
    - {name: practitioners, target: Practitioner, cardinality: "0..*", ownership: reference, help: {summary: The practitioners who work for or through the provider., usage: Read to see who can be scheduled., cardinalityMeaning: 'Any number, from one in a solo practice to many in a hospital.', workflowRole: Link clinical staff to the organisation delivering care., businessMeaning: Connects organizational delivery context to professional roles.}}
    - {name: appointments, target: Appointment, cardinality: "0..*", ownership: reference, help: {summary: The appointments booked with the provider., usage: Read for capacity planning and reminders., cardinalityMeaning: 'Any number of appointments, past and future.', workflowRole: Show demand on the provider's time., businessMeaning: Provides planned service workload distinct from completed encounters.}}

  lifecycle:
    title: Healthcare Provider Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, SUSPENDED, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A person or organisation that is authorised to provide healthcare services.
    businessMeaning: Care is given by providers who must be licensed and credentialed. This record identifies each provider and its type, so that encounters, referrals and claims can name who gave care.
    usage: Registered when a provider joins or contracts with the organisation; read by scheduling, billing and quality processes.
    relationshipContext: A provider is a Party, may belong to an Organization, delivers Encounters and works with Practitioners and Appointments.
    lifecycle: A provider is active while authorised, can be made inactive or suspended while a licence or contract issue is resolved, and is retired when it stops providing services.
    example: City General Hospital, a hospital provider with provider number HP-001245.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-PROVIDER
