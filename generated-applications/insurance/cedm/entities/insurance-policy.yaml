entity:
  name: InsurancePolicy
  namespace: cedm.domain
  kind: insurance_entity
  description: A contract providing defined insurance coverage in exchange for premium obligations.
  ui:
    icon: shield
  identity:
    key: insurancePolicyId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: insurancePolicyId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the policy.
        usage: Generated at quotation; coverages, premiums and claims refer to it.
    - name: policyNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number printed on the policy documents.
        usage: Allocated by the insurer; unique.
    - name: policyType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of insurance, such as home, motor or life.
        usage: Chosen at quotation; decides the available coverages and rating.
    - name: effectiveFrom
      type: date
      required: true
      help:
        summary: The date cover starts.
        usage: Agreed at binding; claims for losses before this date are not covered.
    - name: effectiveTo
      type: date
      required: true
      help:
        summary: The date cover ends.
        usage: Agreed at binding; must not be before the start date.
    - name: premium
      type: money
      required: false
      help:
        summary: The price of the cover for the policy period.
        usage: Calculated by rating and agreed at binding; billed through premium records.
    - name: status
      type: enum
      required: true
      default: QUOTED
      values:
        - QUOTED
        - ACTIVE
        - SUSPENDED
        - EXPIRED
        - CANCELLED
      help:
        summary: Whether the policy is a quote, in force or ended.
        usage: Moved by underwriting and policy administration; claims are accepted under ACTIVE policies.
        valueSemantics:
          QUOTED: Offered but not yet accepted; no cover.
          ACTIVE: In force.
          SUSPENDED: Cover paused, for example for unpaid premium.
          EXPIRED: The term has ended. A final state.
          CANCELLED: Ended early, or withdrawn as a quote. A final state.
  relationships:
    - name: insurer
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation that carries the risk and issues the policy.
        usage: Set at quotation; its underwriting rules and capital stand behind the cover.
        cardinalityMeaning: 'Exactly one insurer: a policy is a contract with a single risk carrier (co-insurance is split into separate policies).'
        workflowRole: Determines who must pay valid claims.
    - name: policyholders
      target: Party
      cardinality: 1..*
      ownership: reference
      help:
        summary: The parties who hold the contract and are responsible for premiums.
        usage: Added at quotation; they receive documents and renewal notices.
        cardinalityMeaning: 'At least one policyholder: a policy needs someone to hold it, and joint holders are allowed.'
        workflowRole: Identifies who may change or cancel the policy.
    - name: contract
      target: Contract
      cardinality: 0..1
      ownership: reference
      help:
        summary: The legal contract on which the policy rests, when the cover is arranged by a wider agreement.
        usage: Linked for group schemes and negotiated programmes.
        cardinalityMeaning: At most one contract; ordinary retail policies stand on their own terms.
        workflowRole: Brings the wider agreement's terms into the policy.
    - name: claims
      target: InsuranceClaim
      cardinality: 0..*
      ownership: reference
      help:
        summary: The claims made under the policy.
        usage: Read to see a policy's claims history and remaining limits.
        cardinalityMeaning: Any number of claims over the policy's life, including none.
        workflowRole: Claims history affects renewal and pricing.
    - {name: coverages, target: Coverage, cardinality: "0..*", ownership: aggregate, help: {summary: 'The coverages, each insuring a particular risk with its own limit and deductible.', usage: Added at quotation; claim lines are assessed against them., cardinalityMeaning: 'Any number of coverages, usually several.', workflowRole: Define what the policy actually pays for., businessMeaning: "Separates policy header from specific limits, deductibles and benefit scope."}}
    - {name: insuredParties, target: InsuredParty, cardinality: "0..*", ownership: aggregate, help: {summary: The people or entities covered by the policy., usage: Added at quotation and changed during the term., cardinalityMeaning: Any number of insured parties., workflowRole: Decide whose losses are covered and who is paid., businessMeaning: "Identifies insured, beneficiary or dependent roles without duplicating Party identity."}}
    - {name: premiums, target: Premium, cardinality: "0..*", ownership: aggregate, help: {summary: The premium amounts billed for each period., usage: Created by the billing schedule., cardinalityMeaning: 'Any number of premium records, one for each billing period.', workflowRole: Unpaid premium can lead to suspension of cover., businessMeaning: Separates policy contract from billing installments and settlement.}}
    - {name: underwritingEvaluations, target: Underwriting, cardinality: "0..*", ownership: reference, help: {summary: The underwriting evaluations made when the policy was quoted or renewed., usage: Read to see the basis for acceptance and pricing., cardinalityMeaning: Any number of evaluations over the policy's life., workflowRole: Document why the risk was accepted on the terms offered., businessMeaning: Preserves risk-decision provenance behind policy terms.}}

  invariants:
    - id: INSURANCE-POLICY-001
      rule: effectiveTo must not precede effectiveFrom.
    - {id: INSURANCE-POLICY-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Insurance Policy Lifecycle
    attribute: status
    states: [QUOTED, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
    initial: QUOTED
    terminal: [EXPIRED, CANCELLED]
    transitions:
      - {from: QUOTED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: QUOTED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a insurance policy is ended"
      description: "When a insurance policy is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INSURANCE-POLICY-FOLLOW-UP-{{id}}"
              name: "Follow up on insurance policy {{policy_number}}"
              description: "Insurance policy {{policy_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A contract that provides defined insurance cover in return for premium payments.
    businessMeaning: The policy is the product the customer holds. It defines who is covered, for what, over which period and at what price, and everything else, from premiums to claims, hangs from it.
    usage: Quoted, bound and issued by underwriting; maintained through its term; consulted when claims are made and premiums are collected.
    relationshipContext: A policy is issued by an insurer (Organization) to policyholders, may rest on a Contract, and has Coverages, InsuredParties, Premiums, Underwriting evaluations and Claims.
    lifecycle: A policy begins as a quote, becomes active when accepted, may be suspended and restored, and ends expired or cancelled.
    example: Home policy HP-884201 with the insurer Northern Mutual, valid for twelve months from 1 June with an annual premium of 640.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-INSURANCE-POLICY
