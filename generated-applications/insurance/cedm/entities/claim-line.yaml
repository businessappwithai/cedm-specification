entity:
  name: ClaimLine
  namespace: cedm.domain
  kind: insurance_claim_line
  description: A governed line-level insurance claim item representing one requested benefit, loss component, service or expense assessed against a specific Coverage.
  ui: {icon: list-checks}
  identity: {key: claimLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: claimLineId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of one line of an insurance claim., usage: Generated on creation; settlements and adjudication decisions refer to the line through it., businessMeaning: Identifies one line-level claimed item independently of claim header and settlement., relationshipContext: InsuranceClaim supplies header context and Coverage supplies benefit/risk rules.}}
    - {name: lineNumber, type: integer, required: true, help: {summary: 'The position of the line within its claim, used to refer to it in conversation and documents.', usage: 'Assigned in sequence when lines are added; unique within the parent claim, and quoted to claimants and in integrations.', businessMeaning: Supports ordered claim review and communication., relationshipContext: Unique within the parent InsuranceClaim under policy.}}
    - {name: description, type: string, required: true, maxLength: 1000, help: {summary: 'A plain statement of the benefit, loss item or expense the claimant is asking to be paid for.', usage: Written at submission; the adjudicator reads it to judge the line against the coverage and to explain a decision., businessMeaning: Explains the line-level subject of adjudication., relationshipContext: Coverage provides structured policy context.}}
    - {name: claimedAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: 'The amount the claimant requests for this line, before any assessment.', usage: Entered at submission and never negative; compared with the approved amount to show how much was reduced or declined., businessMeaning: Line-level claimant request before adjudication., relationshipContext: Currency is inherited or governed by Claim policy context.}}
    - {name: approvedAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: The amount the insurer agrees to pay for this line after adjudication., usage: Set by the adjudicator when the line is approved and never negative; it drives reserves and the settlement that follows., businessMeaning: Insurer-recognized line benefit before settlement., relationshipContext: "Must comply with Coverage limits, deductibles and policy terms."}}
    - name: status
      type: enum
      required: true
      default: SUBMITTED
      values: [SUBMITTED, ASSESSED, APPROVED, DENIED, SETTLED, CANCELLED]
      help:
        summary: Where the line stands in adjudication, from receipt through a decision to settlement or cancellation.
        usage: Moved by claims staff as the line is assessed and decided; settlement only follows an approval, and decisions are retained.
        valueSemantics:
          SUBMITTED: Line was received and awaits assessment by claims staff.
          ASSESSED: Review is underway or completed without final decision.
          APPROVED: Benefit was approved and is awaiting payment.
          DENIED: Benefit was denied and no payment will be made. A final state.
          SETTLED: Approved benefit has been paid and reconciled to a settlement. A final state.
          CANCELLED: Line was withdrawn or cancelled before a decision was paid. A final state.
        businessMeaning: "Tracks review, decision and settlement progression."
        relationshipContext: Header claim status may summarize but does not replace line decisions.
  relationships:
    - {name: claim, target: InsuranceClaim, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Exactly one claim; a line is one component of a single claim., summary: Parent InsuranceClaim containing this line., businessMeaning: "Supplies policy, claimant and loss context.", usage: Claims processing and reporting., workflowRole: Line lifecycle must remain compatible with claim lifecycle.}}
    - {name: coverage, target: Coverage, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Exactly one coverage; each line is assessed against the coverage under which it is claimed., summary: Coverage against which this line is adjudicated., businessMeaning: "Supplies limits, deductibles and eligibility rules.", usage: Claims decisioning and exposure., workflowRole: Coverage must belong to the Claim policy and apply to the loss context.}}
    - {name: settlements, target: Settlement, cardinality: "0..*", ownership: reference, help: {summary: Settlements allocating payment or service against this claim line., businessMeaning: Separates adjudicated liability from actual settlement transactions., usage: "Claims payment and reconciliation.", cardinalityMeaning: Zero or many settlements for partial or multi-party payment., workflowRole: Total settlement must not exceed approved liability except under explicit adjustment policy.}}
  invariants:
    - {id: CLAIM-LINE-001, rule: lineNumber must be unique within the parent InsuranceClaim.}
    - {id: CLAIM-LINE-002, rule: claimedAmount and approvedAmount must be non-negative when supplied.}
    - {id: CLAIM-LINE-003, rule: Coverage must belong to the same InsurancePolicy as the parent claim.}
    - {id: CLAIM-LINE-004, rule: SETTLED line must reconcile to attributable Settlement evidence.}
    - {id: CLAIM-LINE-EXE-001, rule: "Claimed Amount cannot be negative.", violatedWhen: "claimed_amount != null and claimed_amount < 0", message: "Claimed Amount cannot be negative."}
    - {id: CLAIM-LINE-EXE-002, rule: "Approved Amount cannot be negative.", violatedWhen: "approved_amount != null and approved_amount < 0", message: "Approved Amount cannot be negative."}
  lifecycle:
    title: Claim Line Lifecycle
    attribute: status
    states: [SUBMITTED, ASSESSED, APPROVED, DENIED, SETTLED, CANCELLED]
    initial: SUBMITTED
    terminal: [DENIED, SETTLED, CANCELLED]
    transitions:
      - {from: SUBMITTED, to: ASSESSED, action: assess}
      - {from: SUBMITTED, to: CANCELLED, action: cancel}
      - {from: ASSESSED, to: APPROVED, action: approve}
      - {from: ASSESSED, to: DENIED, action: deny}
      - {from: ASSESSED, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: SETTLED, action: settle}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a claim line is put forward"
      description: "When a claim line is submitted, a task asks someone to decide on it."
      when: "status == \"SUBMITTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CLAIM-LINE-APPROVAL-{{id}}"
              name: "Decide on claim line {{id}}"
              description: "Claim line {{id}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a claim line is ended"
      description: "When a claim line is cancelled or denied, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"DENIED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CLAIM-LINE-FOLLOW-UP-{{id}}"
              name: "Follow up on claim line {{id}}"
              description: "Claim line {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Provides line-level insurance claim adjudication and settlement traceability.
    businessMeaning: InsuranceClaim is the claim aggregate; ClaimLine evaluates a particular benefit/loss against Coverage; Settlement records actual discharge of approved liability.
    usage: Claims intake, adjudication, reserves, settlement, analytics and audit.
    relationshipContext: Claim and Coverage are mandatory; Settlements provide downstream payment/service evidence.
    lifecycle: Lines are submitted, assessed and then approved, denied, settled or cancelled with decisions retained.
    example: A vehicle repair claim has separate parts and towing ClaimLines evaluated against different Coverage components.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CLAIM-LINE}
