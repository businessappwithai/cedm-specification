entity:
  name: MaintenancePlan
  namespace: cedm.domain
  kind: maintenance_definition
  description: A preventive or condition-based maintenance schedule and policy.
  ui:
    icon: wrench
  identity:
    key: maintenancePlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: maintenancePlanId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the maintenance plan.
        usage: Generated on creation; work orders refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the plan, such as PM-FORK-500.
        usage: Unique; used on work orders and reports.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The descriptive name of the plan.
        usage: Shown in planners' lists.
    - name: maintenanceType
      type: enum
      required: true
      values:
        - PREVENTIVE
        - CONDITION_BASED
        - PREDICTIVE
        - INSPECTION
      help:
        summary: The approach the plan takes to maintenance.
        usage: Chosen at creation; decides how work is triggered.
        valueSemantics:
          PREVENTIVE: Work done at fixed intervals whether or not anything is wrong.
          CONDITION_BASED: Work done when a measured condition crosses a threshold.
          PREDICTIVE: Work done when analysis predicts a failure is likely.
          INSPECTION: A check that may lead to further work.
    - name: frequencyValue
      type: decimal
      required: false
      precision: 12
      scale: 4
      help:
        summary: How often the plan's work is due, in the unit given by the frequency unit.
        usage: Entered by the engineer; positive. For example 500 with unit hours.
    - name: frequencyUnit
      type: enum
      required: false
      values:
        - HOURS
        - DAYS
        - WEEKS
        - MONTHS
        - MILES
        - CYCLES
        - OTHER
      help:
        summary: The unit in which the frequency is measured.
        usage: Chosen with the frequency value.
        valueSemantics:
          HOURS: Operating hours.
          DAYS: Calendar days.
          WEEKS: Calendar weeks.
          MONTHS: Calendar months.
          MILES: Distance travelled.
          CYCLES: Operating cycles, such as starts or lifts.
          OTHER: Any other measure.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: Whether the plan is generating work.
        usage: Set by maintenance engineering.
        valueSemantics:
          DRAFT: Being prepared; not generating work.
          ACTIVE: In force; work orders are raised from it.
          SUSPENDED: Paused; no new work orders.
          RETIRED: Withdrawn. A final state.
  relationships:
    - name: assets
      target: Asset
      cardinality: 0..*
      ownership: reference
      help:
        summary: The assets the plan applies to.
        usage: Linked when the plan is assigned.
        cardinalityMeaning: Any number of assets, since one plan covers a class of equipment.
        workflowRole: Determines which assets get work orders from the plan.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The product types the plan applies to.
        usage: Linked to apply the plan to every asset of a model.
        cardinalityMeaning: Any number of products.
        workflowRole: Lets one plan cover a whole equipment model.
    - name: meters
      target: Meter
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of meters, whose readings trigger usage-based work.
        summary: Meters whose accepted readings can drive or inform this MaintenancePlan.
        businessMeaning: Enables usage-based and condition-based maintenance independently of calendar frequency.
        usage: Preventive maintenance, predictive maintenance and due-date calculation.
        workflowRole: Reading thresholds can make work due but do not themselves complete maintenance or rewrite meter evidence.
  invariants:
    - id: MAINT-PLAN-001
      rule: frequencyValue must be positive when supplied.
  lifecycle:
    title: Maintenance Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A preventive or condition-based schedule and policy for maintaining assets.
    businessMeaning: Equipment fails less and lasts longer when it is looked after on a plan. The plan states what to do and how often, so work orders are raised automatically instead of when something breaks.
    usage: Defined by maintenance engineers; linked to assets and meters; read by planners who generate work orders from it.
    relationshipContext: A plan applies to Assets and Products, and may be triggered by Meters.
    lifecycle: A plan is drafted, becomes active when approved, can be suspended, and is retired when replaced or no longer needed. Work orders already raised stay valid.
    example: 'Quarterly inspection of a forklift fleet: lubricate, check brakes and test the mast, every 500 operating hours.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MAINTENANCE-PLAN
