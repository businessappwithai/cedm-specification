        help: Human-readable name of Calendar. Communicates the concept to business users. UI, documents and reports. Does not replace immutable identity. Required.
  - name: Attachment
    help: A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Provide durable, implementation-neutral governance semantics for Attachment. A governed file or content attachment associated with an enterprise record while preserving content identity and audit provenance. Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable. Connects authoritative business records to controlled lifecycle, evidence, findings, and downstream remediation without replacing source transactions. Created under governance, reviewed or finalized where applicable, and retained or superseded with history preserved. Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation. Enterprise agreements, controlled records, audit evidence, compliance findings, and lifecycle changes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Attachment. Identifies one governed record independently of mutable labels or state. Governance, workflow, integration and audit. Referenced by related enterprise records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Time at which this record becomes effective or evidentially applicable. Establishes temporal business meaning. Lifecycle, audit and reporting. Does not rewrite earlier effective evidence. Optional when lifecycle does not require a separate effective timestamp.
  - name: Asset
    help: Represents the long-lived business object for a durable resource whose identity, ownership, location, maintenance, financial treatment, and lifecycle must be managed over time. Asset is the instance-level concept used when an organization must manage a specific physical or accountable resource rather than merely a product type. A container, vehicle, machine, aircraft, or facility equipment item can be represented as an Asset when individual lifecycle and accountability matter. Used across asset management, maintenance, finance, depreciation, inventory, logistics, leasing, insurance, compliance, and operational planning. Product describes what the asset is as a standardized model. Asset identifies the individual resource. Location describes current operational placement. MaintenanceWorkOrder records maintenance activity. AssetDepreciation records financial measurement. Organization identifies ownership when applicable. Historical movements and transactions should preserve changes rather than overwriting the asset's identity. An asset may be planned before entering service, active during productive use, under maintenance while temporarily unavailable, held pending a business decision, disposed when ownership/control has ended, or retired when operational use has ceased. Lifecycle state should not erase history; it changes how current processes may act on the asset. A shipping container is acquired and assigned an assetNumber and serial/equipment identity. It is linked to a Product model, located at a depot, receives MaintenanceWorkOrder records during its service life, and has AssetDepreciation records for financial reporting. When its repair economics no longer justify continued use, a RepairEstimate may recommend SALE or SCRAP; the resulting disposition changes the asset lifecycle while preserving its historical record.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the asset master record. Used to connect maintenance, depreciation, movements, ownership, location, and other lifecycle records to the same physical or accountable asset. assetId identifies the asset itself; assetNumber and serialNumber are business-facing or manufacturer identifiers and must not replace the stable CEDM identity. Every managed asset requires a stable identity so its operational and financial history remains continuous.
      - name: asset_number
        type: string(100)
        unique: true
        help: The organization-assigned business identifier used to recognize an asset in operational and financial processes. Used by asset managers, maintenance teams, finance, warehouse operations, reports, documents, and users when referring to the asset. It is the organization's business reference, while serialNumber may identify the manufacturer's physical equipment identity and assetId remains the immutable CEDM identity. Required because managed assets need a recognizable organizational identifier.
      - name: name
        type: string(300)
        help: A human-readable description of the asset used to identify it in lists, forms, reports, and operational communication. Supports search, maintenance screens, asset registers, reporting, and user recognition when an asset number alone is insufficient. The name describes this asset instance and should not be confused with Product.name, which describes a reusable product definition or asset type. Required for practical human interpretation of the asset record.
      - name: asset_type
        type: string(100)
        help: Classifies the kind of durable resource represented by the asset, such as container, vehicle, machine, building equipment, or other capital-controlled resource. Drives asset policies, maintenance programs, depreciation treatment, reporting, authorization, and lifecycle rules. assetType classifies the asset instance; Product can provide the standardized model or product definition from which the asset originated. Required because asset lifecycle and financial treatment depend on the type of resource being managed.
      - name: acquisition_date
        type: date
        optional: true
        help: The business date on which the organization acquired or otherwise recognized control of the asset. Used for capitalization, depreciation start rules, asset aging, warranty analysis, lifecycle reporting, and ownership history. AcquisitionDate concerns the organization's acquisition event and is distinct from manufacture date, commissioning date, or first operational use. Optional when the asset predates the available records or acquisition occurred outside the modeled process.
      - name: acquisition_cost
        type: money
        optional: true
        help: The capitalized or recognized cost associated with acquiring the asset under the organization's accounting policy. Used as an input to capitalization, depreciation, book-value calculations, asset valuation, and financial reporting. Acquisition cost is an accounting/business value and should not be confused with Product price, repair cost, sale price, or current market value. Optional for assets whose historical cost is unavailable, immaterial, or maintained in a separate financial system.
      - name: status
        type: string
        enum: AssetStatus
        help: The lifecycle state describing whether the asset is planned, operational, temporarily unavailable, disposed, or retired. Controls operational availability, maintenance eligibility, reporting, depreciation policy, and downstream business actions. Asset status describes the asset's lifecycle, while MaintenanceWorkOrder status describes a particular maintenance activity. An asset can be UNDER_MAINTENANCE while a work order is IN_PROGRESS. The asset is expected to enter service or be recognized operationally but is not yet active. The asset is available for its intended business use subject to normal operational constraints. The asset is temporarily undergoing maintenance and may be unavailable or restricted from normal use. The asset is intentionally retained but is not currently available for normal productive use, often pending inspection, disposition, or another decision. The organization has completed the disposition process and no longer treats the asset as an active managed resource. The asset has been withdrawn from operational use, while historical records may remain available for audit and analysis. Required because asset processes need an authoritative lifecycle state.
        default: ACTIVE
      - name: serial_number
        type: string(200)
        optional: true
        help: The manufacturer or industry identifier permanently associated with the physical equipment when such an identifier exists. Used for equipment traceability, warranty, maintenance history, inspections, recalls, regulatory reporting, and physical identification. SerialNumber identifies physical equipment supplied by a manufacturer; it is different from the organization's assetNumber and CEDM assetId. Optional for assets that are not individually serialized or where the serial identifier is unavailable.
      - name: owner_id
        type: string
        fk: true
        references: Organization
        optional: true
        help: Identifies the organization that legally or commercially owns the asset when ownership is relevant to the asset model. Used for ownership reporting, financial accountability, insurance, maintenance responsibility, leasing, and disposition. Zero or one owner may be recorded because ownership may be external, shared, represented by a separate agreement, or maintained in another system. Owner is an organizational relationship; it is distinct from the Party that currently possesses, leases, operates, or maintains the asset.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Identifies the current operational location at which the asset is recorded or physically situated. Used for maintenance dispatch, inventory visibility, asset tracking, utilization, inspections, and operational planning. Zero or one current location may be recorded when the asset is mobile, in transit, or its location is maintained through a separate movement system. Location is current state; historical movements should be preserved through movement/event entities rather than inferred from a changing location field.
      - name: product_id
        type: string
        fk: true
        optional: true
        help: Identifies the standardized product or equipment model from which the asset instance was created or classified. Used for technical specifications, spare-parts planning, maintenance standards, procurement, fleet classification, and analytics. Zero or one Product may be linked because not every managed asset has a corresponding product-master definition. Product represents the reusable definition or model; Asset represents the individually managed instance.
      - name: maintenance_plan_id
        type: string
        fk: true
        optional: true
        help: The MaintenancePlan this Asset belongs to.
  - name: MaintenancePlan
    help: Represents a maintenance definition called MaintenancePlan within the CEDM business model. MaintenancePlan is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface. Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate MaintenancePlan records. The entity participates in a wider business graph through relationships with Asset, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns. The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships. A typical MaintenancePlan record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Identifies the maintenance plan record associated with this MaintenancePlan. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: code
        type: string(100)
        unique: true
        help: A human-readable business code used to identify or reference the record in operational processes and integrations. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: name
        type: string(300)
        help: The human-readable name used by people, reports, searches, and related business processes. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: maintenance_type
        type: string
        enum: MaintenancePlanMaintenanceType
        help: Captures the business meaning of maintenance type for the MaintenancePlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the preventive state or classification in the context of MaintenancePlan. Represents the condition based state or classification in the context of MaintenancePlan. Represents the predictive state or classification in the context of MaintenancePlan. Represents the inspection state or classification in the context of MaintenancePlan. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
      - name: frequency_value
        type: decimal
        optional: true
        help: Captures the business meaning of frequency value for the MaintenancePlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      - name: frequency_unit
        type: string
        optional: true
        enum: MaintenancePlanFrequencyUnit
        help: Captures the business meaning of frequency unit for the MaintenancePlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the hours state or classification in the context of MaintenancePlan. Represents the days state or classification in the context of MaintenancePlan. Represents the weeks state or classification in the context of MaintenancePlan. Represents the months state or classification in the context of MaintenancePlan. Represents the miles state or classification in the context of MaintenancePlan. Represents the cycles state or classification in the context of MaintenancePlan. Represents the other state or classification in the context of MaintenancePlan. Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      - name: status
        type: string
        enum: MaintenancePlanStatus
        help: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes. Used when creating, reviewing, searching, validating, reporting on, or integrating MaintenancePlan records, where applicable. Its meaning is specific to MaintenancePlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value. Represents the draft state or classification in the context of MaintenancePlan. Represents the active state or classification in the context of MaintenancePlan. Represents the suspended state or classification in the context of MaintenancePlan. Represents the retired state or classification in the context of MaintenancePlan. Required because the business model cannot reliably interpret the record for its declared purpose without this value.
        default: ACTIVE
  - name: MaintenanceWorkOrder
    help: Represents one controlled maintenance intervention from reported need through planning, assignment, execution, and completion or cancellation. MaintenanceWorkOrder is the executable maintenance record that turns an identified need into accountable work. It provides the bridge between Asset condition or maintenance policy and the technicians, contractors, parts, estimates, costs, physical movements, and completion evidence needed to restore or preserve asset capability. Used by maintenance management, field service, depot repair, fleet maintenance, facilities management, manufacturing maintenance, container repair, utilities, aviation, automotive, and other asset-intensive operations. Asset identifies what requires work. MaintenancePlan explains recurring preventive work. Party identifies who is responsible. Location identifies where work occurs. RepairEstimate can define expected repair economics before execution. ContainerMovement records physical repositioning when the maintained asset is a container. Detailed labor, parts, inspections, failures, and costs should be represented by their own related entities when required. A request opens the maintenance need. Planning establishes timing and resources. Assignment establishes accountability. In-progress records active execution. On-hold preserves the work order while a blocking condition is resolved. Completion records acceptance of the defined scope. Cancellation terminates the work without claiming that the maintenance objective was achieved. For a container repair, an approved RepairEstimate with disposition REPAIR may create the MaintenanceWorkOrder. If the container is not already at the repair location, ContainerMovement moves it into the workshop or repair area. Work execution then consumes labor/material resources and produces completion evidence. After acceptance, a subsequent operational workflow may return the container to ACTIVE service and move it to an available YardSlot. None of these downstream facts should be inferred solely from work-order status. A shipping container is found with damaged flooring during depot inspection. A corrective MaintenanceWorkOrder identifies the container asset, records the requested condition, receives high priority, links to an approved RepairEstimate for expected material and labor, is assigned to a repair team, may link to ContainerMovement events bringing the container into and out of the workshop, progresses through execution, and is completed after the repair is inspected and accepted.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the maintenance work order. Used for maintenance history, integrations, audit, reporting, scheduling, and traceability across the asset lifecycle. Identifies the work order independently of its business number, Asset, MaintenancePlan, assignee, or RepairEstimate. Required because every maintenance intervention must be uniquely traceable.
      - name: work_order_number
        type: string(100)
        unique: true
        help: The human-facing reference used by maintenance personnel to identify the work order. Used on maintenance requests, work instructions, technician communications, inspection records, repair documents, and reports. It is a business reference rather than the technical identity and remains the primary operational reference for people. Required so maintenance teams can unambiguously refer to the work instruction.
      - name: work_type
        type: string
        enum: MaintenanceWorkOrderWorkType
        help: Classifies the maintenance purpose and determines the general execution method and planning context. Drives maintenance planning, technician assignment, priority, preventive-compliance reporting, repair analytics, and cost analysis. Work type describes why maintenance is being performed; Asset identifies what is being maintained and MaintenancePlan explains recurring planned work when applicable. Examination performed to determine condition, compliance, or the need for further work without necessarily changing the asset. Planned maintenance performed at a defined interval, usage threshold, or condition trigger to reduce the likelihood of failure. Work performed to correct a known condition or restore an asset to its required operating state. Work specifically focused on restoring damaged, defective, or failed components or equipment. Urgent intervention required because an immediate failure, safety concern, operational disruption, or critical condition requires action. Required because maintenance planning and reporting depend on the reason for the work.
      - name: status
        type: string
        enum: MaintenanceWorkOrderStatus
        help: The controlled lifecycle state of the maintenance work order. Controls scheduling, assignment, execution, escalation, completion, reporting, and downstream asset-history processing. Work-order status describes the maintenance instruction and execution; it does not by itself prove that an Asset is operational, repaired, or returned to service. A valid maintenance need exists but execution has not yet been fully planned. Timing, scope, or resources have been planned sufficiently for execution. Responsibility for performing the work has been allocated to a Party or maintenance team. Maintenance execution has started. Work is temporarily stopped because of parts, access, safety, approval, diagnosis, scheduling, or another blocking condition. The defined work has been performed and accepted according to the applicable completion criteria. The work order has been intentionally terminated without completing the planned work. Required because maintenance processes must know whether work is pending, active, blocked, completed, or terminated.
        default: OPEN
      - name: priority
        type: string
        enum: MaintenanceWorkOrderPriority
        help: Indicates the operational urgency with which the maintenance work should be scheduled and executed. Used for dispatching, queue ordering, escalation, resource allocation, service-level monitoring, and maintenance planning. Priority expresses urgency; it is different from workType, which expresses purpose, and from Asset criticality, which expresses the importance of the asset itself. Can normally be scheduled after higher-priority maintenance without significant operational impact. Standard maintenance urgency under normal operational planning. Requires accelerated scheduling because delay may materially affect operations, reliability, or service. Requires immediate or near-immediate attention because delay may create severe safety, operational, financial, or regulatory consequences. Required because maintenance queues need a defined prioritization basis.
        default: NORMAL
      - name: requested_at
        type: datetime
        help: The date and time when the maintenance need or work request was formally raised. Used for response-time measurement, backlog analysis, SLA monitoring, maintenance history, and audit. It marks demand for maintenance, not necessarily the time work was scheduled, assigned, or started. Required to measure the elapsed time from maintenance demand to execution.
      - name: scheduled_at
        type: datetime
        optional: true
        help: The planned date and time at which maintenance execution is expected to begin. Used for technician scheduling, asset availability planning, shutdown coordination, parts readiness, and maintenance calendars. It represents a plan and may differ from the actual execution start recorded elsewhere or inferred from status history. Optional while the work remains unscheduled.
      - name: completed_at
        type: datetime
        optional: true
        help: The date and time at which the maintenance work order was formally completed and accepted. Used for maintenance history, downtime analysis, SLA measurement, compliance reporting, asset availability, and cost closure. Completion means the work-order scope has been accepted; it does not necessarily mean the Asset has returned to service if a separate commissioning or release process exists. Optional until the work is completed.
      - name: description
        type: string(4000)
        optional: true
        help: The human-readable statement of the maintenance problem, requested work, observed condition, or intended scope. Provides context to planners, technicians, inspectors, approvers, and downstream reports when structured fields alone cannot capture the maintenance requirement. It complements structured workType, Asset, RepairEstimate, and MaintenancePlan information and should not be used as the sole source for critical machine-readable conditions. Optional when the work scope is fully defined through structured request or task data.
      - name: asset_id
        type: string
        fk: true
        optional: true
        help: Identifies the physical or operational Asset that the maintenance work is intended to inspect, maintain, correct, or repair. Connects maintenance history to asset condition, service intervals, failure history, warranty, depreciation, and operational availability. Zero or one Asset may be recorded when the work concerns a location, general maintenance activity, or an asset not yet identified at request time. Asset answers what is being maintained; MaintenanceWorkOrder answers what work is being requested or performed on it.
      - name: maintenance_plan_id
        type: string
        fk: true
        optional: true
        help: Identifies the recurring or preventive maintenance plan that generated or governs the work order. Supports preventive scheduling, compliance tracking, service intervals, and automatic work-order generation. Zero or one plan may be linked because corrective, emergency, and ad-hoc work can originate outside a maintenance plan. MaintenancePlan defines recurring maintenance policy; the work order represents one executable occurrence of that policy.
      - name: assignee_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Identifies the person, team, contractor, or organization responsible for executing or coordinating the work. Drives dispatching, accountability, workload planning, technician performance, contractor management, and communication. Zero or one Party may be assigned while work is unallocated or when assignment is maintained in an external workforce system. Party supplies identity; its applicable role determines whether it acts as technician, maintenance organization, contractor, or another responsibility type.
      - name: location_id
        type: string
        fk: true
        optional: true
        help: Identifies the physical location where the maintenance activity is expected to occur. Used for technician routing, access planning, site coordination, safety requirements, and operational scheduling. Zero or one location may be supplied when the Asset itself determines location or work is performed remotely. Location describes where work occurs and is distinct from the Asset being serviced.
      - name: repair_estimate_id
        type: string
        fk: true
        optional: true
        help: Links the work order to the approved estimate that authorizes or informs the repair scope and financial boundary. Supports traceability from condition assessment and approved repair economics into executable maintenance work. Zero or one estimate may be linked because inspection, preventive, corrective, and emergency work may not require a repair estimate. RepairEstimate evaluates and authorizes the proposed repair decision; MaintenanceWorkOrder executes it. A work order must not be treated as proof that the estimate's predicted amount became actual cost.
      - name: spare_part_id
        type: string
        fk: true
        optional: true
        help: The SparePart this MaintenanceWorkOrder belongs to.
  - name: RepairEstimate
    help: Represents the controlled decision assessment between asset condition and the eventual repair or commercial disposition action. RepairEstimate is not the repair itself. It evaluates what is wrong, what it is expected to cost, and which outcome is economically or operationally appropriate. It therefore sits between inspection/condition evidence and downstream execution or disposition. Used by depot maintenance, fleet management, repair vendors, asset managers, finance, approval workflows, and predictive analytics. Historical estimates can also provide labeled data for disposition and sale-value prediction. Container identifies the asset. RepairEstimateLine explains technical scope. MaintenanceWorkOrder executes approved repair. SalesOrder or a disposition transaction executes sale. Inventory and financial transactions record actual operational and monetary outcomes. Currency qualifies monetary values and Document supplies evidence. DRAFT → SUBMITTED → APPROVED or REJECTED, followed by COMPLETED or CANCELLED according to policy. Approval authorizes a decision but does not itself perform repair or sale. Revisions preserve decision history rather than overwriting earlier approved facts. When disposition is REPAIR, an approved estimate may create one or more MaintenanceWorkOrders. The work order must reference the originating estimate, remain within the approved scope unless an authorized estimate revision is made, and record actual execution separately. Work-order completion does not automatically make the estimate's estimated amounts actual costs. A returned container has damaged flooring, side panels, and door hardware. The estimate contains line-level components and labor, compares expected repair cost with sale value and asset economics, and is approved with disposition REPAIR. A MaintenanceWorkOrder is then created for execution. The final actual repair cost is recorded separately from the estimate.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the repair estimate. Connects the assessment to revisions, line items, approvals, work orders, documents, analytics, and integrations. Identifies the assessment record; Container identifies the asset and RepairEstimateLine identifies its detailed technical scope. Required so the decision and its history remain independently traceable.
      - name: estimate_number
        type: string(100)
        unique: true
        help: The human-facing business reference for the repair assessment. Used by depot, maintenance, fleet, owners, approvers, customers, and reports. Unlike repairEstimateId, this is intended for business communication and documents. Required for operational and approval workflows.
      - name: revision
        type: integer
        help: The version number of the technical and commercial assessment. Preserves changes in damage scope, material pricing, labor assumptions, disposition, or approval values. A revision is historical decision context and must not silently overwrite an earlier approved assessment. Required for traceable estimate evolution.
        default: "1"
        min: 1
      - name: estimate_date
        type: date
        help: The business date on which this estimate revision was prepared or recognized. Supports approval chronology, estimate aging, repair-cycle analysis, and financial reporting. Distinct from Container manufacture date, damage date, repair completion date, or sale date. Required to establish decision chronology.
      - name: status
        type: string
        enum: RepairEstimateStatus
        help: The lifecycle state of the assessment and its authorization status. Controls preparation, review, approval, rejection, completion, and cancellation workflows. Estimate status describes the decision artifact; it does not mean that repair execution or sale execution has completed. Assessment is still being prepared. Assessment is awaiting review or authorization. The proposed decision/scope has been authorized; execution remains a separate process. The proposed assessment or decision was not authorized. The estimate's decision process is concluded. Assessment was intentionally terminated and must not drive active downstream work. Required to separate assessment preparation from authorization and execution.
        default: DRAFT
      - name: disposition
        type: string
        optional: true
        enum: RepairEstimateDisposition
        help: The intended operational or commercial outcome selected after evaluating condition and economics. Determines whether the asset returns to lease-related use, enters a sale process, is scrapped, requires repair, or remains pending. Disposition is a decision about the asset, not a physical repair status. REPAIR may create a MaintenanceWorkOrder; SALE may create a SalesOrder or disposition transaction. Asset is intended to remain available for lease-related use after the applicable process. Asset is intended for commercial sale rather than return to the active lease fleet. Asset is intended for disposal and removal from productive inventory. Repair is justified and maintenance execution is required or expected. No final disposition has been executed; further information or approval is required. Optional until a disposition decision is reached.
      - name: estimated_repair_amount
        type: decimal
        optional: true
        help: The estimated cost of the repair scope represented by the assessment. Supports repair-vs-sale-vs-scrap economics, approval thresholds, budgets, and predictive analysis. Should reconcile to RepairEstimateLine values and Currency; it is an estimate, not an actual posted maintenance cost. Optional until sufficient repair scope is known.
      - name: estimated_sale_amount
        type: decimal
        optional: true
        help: The expected realization from selling the asset under the current valuation assumptions. Supports disposition economics and comparison with repair cost, book value, residual value, and lease alternatives. It is decision-support data, not an executed sale amount or payment. Optional when sale is not under consideration.
      - name: approved_amount
        type: decimal
        optional: true
        help: The monetary amount explicitly authorized by the approval decision. Establishes the financial boundary for downstream repair execution or approved disposition activity. Approval amount is not the same as final actual maintenance cost; actual cost belongs to execution and financial records. Optional before approval or for non-monetary decisions.
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The currency that gives monetary estimate values their denomination. Required to interpret repair, sale, and approval amounts consistently. Currency qualifies amounts; it does not identify ownership, supplier, or asset identity. Optional while monetary assessment is incomplete.
      - name: container_id
        type: string
        fk: true
        help: The physical container whose condition, repair economics, and disposition are being assessed. Connects the estimate to equipment identity, current location, ownership/lease context, condition, and maintenance history. Exactly one Container is assessed. Container is the asset; RepairEstimate records a decision assessment about that asset without duplicating master data.
      - name: organization_id
        type: string
        fk: true
        optional: true
        help: The organization responsible for preparing, owning, or approving the assessment. Supports depot responsibility, approval authority, cost attribution, and reporting. Optional when organization is inherited from operating context. This organization may differ from Container owner, lessor, lessee, customer, or repair vendor.
  - name: RepairEstimateLine
    help: Represents one actionable or evaluative item within a repair estimate, connecting observed asset condition to proposed repair work and estimated cost. RepairEstimateLine is the detailed evidence behind the overall repair decision. It can identify what is damaged, where it is damaged, what repair is proposed, what material or replacement is required, and what labor and cost are expected. Used by inspectors, repair estimators, maintenance planners, depot operators, repair vendors, procurement, inventory, finance, and predictive analytics. RepairEstimate provides the overall decision and Container context. DamageCode describes the observed condition, ComponentCode identifies the affected area, RepairCode describes the proposed action, and MaterialCode/quantity describe expected material requirements. MaintenanceWorkOrder later converts approved repair scope into executable work; actual material consumption and labor are separate execution outcomes. Lines are created while an estimate is prepared, may be revised as inspection or pricing changes, become part of an approved scope when the parent estimate is approved, and remain historical evidence of the decision even after maintenance execution completes. An inspection finds a damaged container door gasket. A RepairEstimateLine records the damage code, affected component, proposed repair code, replacement material, quantity of one, estimated material cost, estimated labor cost, and total estimated line cost. After approval, the line can be used to create executable maintenance work and material demand.
    parent: RepairEstimate
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable system identity of the estimate line. Used for traceability between the estimate, repair execution, material planning, analytics, and integrations. Identifies one detailed estimate item independently of its parent RepairEstimate, line number, damage, component, or material. Required so every estimated repair requirement can be individually traced.
      - name: line_number
        type: integer
        help: The sequence number identifying the line within a particular RepairEstimate revision. Used by inspectors, repair estimators, approvers, work-order planners, documents, and reports to discuss a specific estimate item. It is unique within the parent estimate revision rather than globally; the stable identity remains repairEstimateLineId. Required for human-readable estimate structure and traceability.
        min: 1
      - name: repair_code
        type: string(50)
        optional: true
        help: A standardized classification identifying the repair operation or repair action proposed for the line. Used for maintenance coding, labor standards, repair analytics, cost estimation, vendor instructions, and historical repair analysis. RepairCode describes the required action, while DamageCode describes the observed condition that caused the action and ComponentCode identifies the affected component. Optional when the repair action is still being assessed or is represented by another controlled classification.
      - name: damage_code
        type: string(50)
        optional: true
        help: A standardized classification identifying the damage or defect observed on the asset. Used for inspection, repair estimation, damage trend analysis, customer recovery, warranty/lease assessment, and predictive maintenance models. DamageCode explains the condition; RepairCode explains the proposed response. Keeping them separate allows the same damage type to lead to different repair or disposition decisions. Optional when no specific damage classification is available or the line represents a non-damage activity such as inspection or routine labor.
      - name: component_code
        type: string(50)
        optional: true
        help: Identifies the component, structural area, or equipment part affected by the estimated work. Used to locate the work physically, select repair procedures, determine material requirements, analyze recurring failures, and calculate component-level costs. ComponentCode provides the 'where' or affected part of the repair; DamageCode provides the condition and RepairCode provides the proposed action. Optional when the estimate line applies to the asset generally or the component is not yet identified.
      - name: material_code
        type: string(100)
        optional: true
        help: Identifies a material or replacement item expected to be consumed or installed as part of the repair. Used for material planning, inventory reservation, purchasing, supplier sourcing, costing, and maintenance execution. MaterialCode identifies what is consumed or installed; quantity and materialAmount determine the estimated requirement and financial impact. Optional for labor-only, inspection-only, adjustment, or repair methods that do not require a specific material.
      - name: quantity
        type: decimal
        optional: true
        help: The estimated quantity of the material, replacement item, or measurable repair resource required for this line. Used to calculate material requirements, expected consumption, replacement cost, inventory demand, and repair scope. Quantity must be interpreted with MaterialCode and the applicable UnitOfMeasure; it is an estimate of required work/material, not necessarily actual consumption. Optional for activities where quantity is not meaningful or is represented through labor or fixed-price estimation.
      - name: material_amount
        type: decimal
        optional: true
        help: The estimated cost attributable to materials consumed or installed for this repair line. Used for repair-cost calculation, approval, inventory valuation, supplier comparison, and actual-versus-estimated analysis. MaterialAmount belongs to the estimate and should not be interpreted as the actual inventory issue or supplier invoice amount. Optional when the line has no material component.
      - name: labour_amount
        type: decimal
        optional: true
        help: The estimated labor cost required to perform the repair activity represented by the line. Used for repair economics, approval thresholds, workforce planning, vendor quotation comparison, and variance analysis. LabourAmount is an estimate of execution cost; actual technician time and actual labor cost belong to maintenance execution records. Optional for material-only or externally priced repair lines.
      - name: replacement_amount
        type: decimal
        optional: true
        help: The estimated cost of replacing the affected component or asset element when replacement is the selected repair approach. Used to compare repair versus replacement economics and to support disposition decisions. ReplacementAmount may overlap with material cost depending on the organization's costing policy, so its relationship to MaterialAmount must be governed by the estimate's calculation rules. Optional when replacement is not being considered.
      - name: total_amount
        type: decimal
        optional: true
        help: The estimated total financial impact of the repair requirement represented by this line. Used to aggregate RepairEstimate cost, support approval, compare alternatives, and feed repair/disposition analytics. It should reconcile to the applicable material, labor, replacement, discount, and other cost components according to the organization's estimate calculation policy. Optional while the line is incomplete or not financially valued.
      - name: repair_estimate_id
        type: string
        fk: true
        help: Identifies the RepairEstimate revision to which this detailed repair requirement belongs. Supplies the container, estimate revision, status, disposition, currency, and approval context for the line. Every RepairEstimateLine belongs to exactly one RepairEstimate. The parent estimate provides decision context; the line provides the technical and cost detail supporting that decision.
  - name: Equipment
    help: A governed maintainable equipment identity linked to an Asset where financial capitalization and operational maintenance identities overlap. Provide canonical enterprise semantics for Equipment. A governed maintainable equipment identity linked to an Asset where financial capitalization and operational maintenance identities overlap. Used in asset, maintenance, treasury, banking, credit-risk, accounting, integration, and audit workflows where applicable. Connects operational or financial lifecycle evidence to canonical masters while keeping accounting, bank, and physical records authoritative in their own domains. Created under governed conditions, progressed or finalized with audit history, and corrected through explicit subsequent evidence. Asset lifecycle, maintenance, treasury operations, bank reconciliation, lending, accounting, reporting, and audit. Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Equipment. Identifies one governed Equipment record independently of mutable state. Operations, finance, integration, reporting and audit. Referenced by compatible lifecycle and transaction records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Effective timestamp for the record. Establishes temporal applicability or evidence cutoff. Lifecycle, reconciliation and reporting. Historical evidence before this time remains intact. Optional where the concept uses another effective period.
      - name: asset_id
        type: string
        fk: true
        optional: true
        help: Financial/fixed Asset represented by equipment. Connects maintainable object to capitalization identity when applicable. EAM, depreciation and maintenance. Optional for non-capitalized equipment. Maintenance history remains independent from accounting postings.
      - name: spare_part_id
        type: string
        fk: true
        optional: true
        help: The SparePart this Equipment belongs to.
  - name: Failure
    help: A governed observed equipment or asset failure recording symptom, occurrence, effect, and maintenance context without overwriting repair evidence. Provide canonical enterprise semantics for Failure. A governed observed equipment or asset failure recording symptom, occurrence, effect, and maintenance context without overwriting repair evidence. Used in asset, maintenance, treasury, banking, credit-risk, accounting, integration, and audit workflows where applicable. Connects operational or financial lifecycle evidence to canonical masters while keeping accounting, bank, and physical records authoritative in their own domains. Created under governed conditions, progressed or finalized with audit history, and corrected through explicit subsequent evidence. Asset lifecycle, maintenance, treasury operations, bank reconciliation, lending, accounting, reporting, and audit. Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable identity of Failure. Identifies one governed Failure record independently of mutable state. Operations, finance, integration, reporting and audit. Referenced by compatible lifecycle and transaction records. Required.
      - name: effective_at
        type: datetime
        optional: true
        help: Effective timestamp for the record. Establishes temporal applicability or evidence cutoff. Lifecycle, reconciliation and reporting. Historical evidence before this time remains intact. Optional where the concept uses another effective period.
      - name: equipment_id
        type: string
        fk: true
        help: Equipment experiencing failure. Defines affected maintainable object. Reliability and maintenance. Exactly one Equipment. May trigger MaintenanceWorkOrder but does not itself prove repair.
  - name: SparePart
    help: Maintenance-specific role for an inventory Product used to repair or service assets and equipment. Connect maintenance planning and execution to canonical product and inventory semantics without creating a second material master. A SparePart states that a Product is approved or expected for maintenance use. Used for preventive/corrective maintenance planning, work-order materials, critical-spares stocking, procurement and maintenance costing. Product provides material identity; Equipment provides applicability; MaintenanceWorkOrder provides demand/execution; InventoryMovement provides physical stock truth. Approved for maintenance use, maintained for applicability and criticality, then retired without rewriting historical work orders. Maintenance planning, spare-parts management, reservation, issue, return, replenishment and reliability analysis. Bearings, filters, seals, replacement motors and repair kits.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: Stable spare-part identity. Identifies one governed maintenance-material designation. Maintenance planning, inventory, procurement and costing. References canonical Product rather than duplicating product master data. Required.
      - name: criticality
        type: string
        enum: SparePartCriticality
        help: Maintenance availability criticality. Indicates operational consequence of part unavailability. Stocking, replenishment and maintenance planning. Does not replace product or asset criticality. Limited operational consequence. Material but manageable consequence. Significant availability consequence. Severe operational/safety/service consequence requiring strict control. Required.
      - name: product_id
        type: string
        fk: true
        help: Canonical Product used as spare part. Supplies item identity, UOM and inventory semantics. Procurement, stock and maintenance issue. Exactly one Product. SparePart is a role/designation and must not duplicate Product.
  - name: Container
    help: Represents a reusable intermodal freight container as a continuously identifiable physical logistics asset. Container is the equipment anchor connecting transport, depot, terminal, yard, maintenance, leasing, ownership, inventory, shipment, interchange, and commercial disposition processes. Used for gate events, yard placement, movement tracking, shipment assignment, inspection, repair, inventory, leasing, sale, scrap, and asset reporting. Party provides ownership context; Location provides present geographic context; YardSlot provides exact yard position; ContainerMovement provides chronological movement; RepairEstimate provides repair/disposition assessment. These concepts must remain separate because they represent different business facts. A container can move from active service to damaged or repair state and eventually return to service, be sold, scrapped, lost, or retired. Lifecycle transitions should be tied to the corresponding operational, maintenance, commercial, or exception process. A 40-foot dry container enters a depot, is assigned to YardSlot B03-012-04-02, moves to a repair area after damage, receives a RepairEstimate, returns to ACTIVE service, and later leaves the depot for a customer. The same containerId and containerNumber remain attached throughout the lifecycle while its location, slot, movement history, condition, and commercial context change.
    attributes:
      - name: id
        type: uuid
        pk: true
        help: The immutable CEDM identity of the physical container asset. Used as the stable technical-to-business key across yard, movement, repair, inventory, shipment, interchange, leasing, and reporting processes. ContainerMovement, YardSlot, RepairEstimate, Shipment, and Location use this identity to preserve one continuous asset history even as the container changes place, condition, owner, or commercial use. Required because every event and transaction involving equipment must resolve to one unambiguous physical asset.
      - name: container_number
        type: string(20)
        unique: true
        help: The industry-facing identification number assigned to the physical container. Used by carriers, terminals, depots, customs, gate operations, interchange messages, shipping documents, and customers to identify the equipment. It is the operational identifier of the same asset represented internally by containerId; it must remain stable across movements and commercial events. Required because logistics actors normally identify equipment by its container number.
      - name: iso_code
        type: string(10)
        optional: true
        help: The standardized equipment code describing the container's equipment characteristics. Used for transport compatibility, yard allocation, vessel planning, depot handling, interchange, and equipment classification. Complements containerNumber and informs physical compatibility; it is not itself the container's identity. Optional only while standardized classification is unavailable; operations requiring equipment compatibility should resolve it before execution.
      - name: size_code
        type: string(20)
        optional: true
        help: The operational size classification of the container. Used for slot allocation, transport planning, pricing, capacity calculations, and TEU reporting. Size influences physical placement and transport constraints and should remain consistent with the authoritative equipment classification. Optional when derived from isoCode or an equipment master.
      - name: container_type
        type: string(50)
        optional: true
        help: The functional equipment category of the container, such as dry, refrigerated, tank, or open-top equipment. Drives handling, power, inspection, safety, maintenance, shipment compatibility, and yard-placement rules. Type determines operational capabilities and restrictions but does not replace Product or equipment-master classification where standardized definitions exist. Optional when maintained by a controlled equipment master.
      - name: tare_weight
        type: decimal
        optional: true
        help: The empty weight of the container without cargo. Combined with cargo weight for gross-weight calculations, transport compliance, loading decisions, and interchange. It is an equipment characteristic and should be interpreted with the applicable unit of measure and weighing source. Optional when authoritative equipment specifications provide the value dynamically.
      - name: max_gross_weight
        type: decimal
        optional: true
        help: The maximum permitted gross weight of the container and its cargo under the applicable equipment and operating rules. Used for loading, transport planning, safety, vessel/rail/road compliance, and handling decisions. Must be evaluated with tare weight, cargo weight, transport-mode limits, and regulatory constraints. Optional when maintained by an authoritative equipment specification.
      - name: manufacture_date
        type: date
        optional: true
        help: The date on which the physical container equipment was manufactured. Used for equipment age, inspection, maintenance, depreciation, leasing, resale, and retirement analysis. Commonly combined with acquisition, depreciation, repair, and disposition history to understand economic and operational life. Optional when provenance is incomplete, but its absence limits age-dependent analytics.
      - name: status
        type: string
        enum: ContainerStatus
        help: The current lifecycle state governing whether the container is available for ordinary operational use. Controls equipment allocation, yard placement, shipment assignment, repair workflows, disposition, and exception handling. Status is an asset lifecycle state, not a location state or repair estimate result; transitions should be justified by corresponding business processes. Equipment is available for normal assignment subject to operational constraints. Equipment is undergoing repair or maintenance and should normally be excluded from ordinary transport assignment. Equipment has known damage and requires assessment, restriction, or repair before normal use. Ownership or commercial disposition has transferred through a sale process and the equipment is no longer ordinary available inventory unless explicitly returned. Equipment has been designated for disposal and must not be assigned to operational movements. Equipment cannot currently be located and requires investigation or recovery. Equipment has permanently left normal operational service without necessarily being sold or scrapped. Required because equipment availability decisions depend on an explicit lifecycle state.
        default: ACTIVE
      - name: inventory_status
        type: string(50)
        optional: true
        help: The equipment's inventory classification within the owning or managing organization's asset inventory process. Supports fleet availability, ownership/lease reporting, depot inventory, and disposition workflows. Inventory classification is distinct from physical condition and lifecycle status and should not be used as a substitute for status. Optional where a dedicated equipment-inventory model supplies the classification.
      - name: owner_id
        type: string
        fk: true
        references: Party
        optional: true
        help: Identifies the party that owns the physical equipment or is recorded as its commercial owner. Supports asset accounting, leasing, billing, maintenance responsibility, sale, and fleet reporting. At most one owner is represented at a point in time; absence means ownership is not modeled here. Owner is distinct from the carrier, lessee, customer, terminal, depot, or party physically possessing the container.
      - name: current_location_id
        type: string
        fk: true
        references: Location
        optional: true
        help: Identifies the current physical or operational location of the container. Provides present-state visibility for routing, pickup, inventory, customer service, and exception handling. A container has at most one current location at a point in time. This is a current-state projection; chronological location changes belong in ContainerMovement.
  - name: Product
    help: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules. Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts. Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics. Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts. Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements. Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references. SalesOrderLine eligibility. PurchaseOrderLine eligibility. inventory operations. fulfillment eligibility. future InvoiceLine creation. open order quantities. receipt quantities. inventory operations. conversion rules. future TaxRule determination. future InvoiceLine calculation. future default pricing only. catalog. assortment. reporting. policy eligibility. future sourcing and PurchaseOrder eligibility. future operational availability and inventory configuration. If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
    attributes:
      - name: id
        type: uuid
        pk: true
      - name: code
        type: string(100)
        unique: true
      - name: name
        type: string(300)
      - name: description
        type: string(4000)
        optional: true
      - name: product_type
        type: string
        enum: ProductProductType
      - name: status
        type: string
        enum: ProductStatus
        default: ACTIVE
      - name: sku
        type: string(100)
        optional: true
      - name: unit_of_measure
        type: string
        fk: true
        references: UnitOfMeasure
        optional: true
      - name: standard_price
        type: money
        optional: true
      - name: tax_category
        type: string(100)
        optional: true
      - name: currency_id
        type: string
        fk: true
        optional: true
        help: The Currency this Product belongs to.
      - name: maintenance_plan_id
        type: string
        fk: true
        optional: true
        help: The MaintenancePlan this Product belongs to.
