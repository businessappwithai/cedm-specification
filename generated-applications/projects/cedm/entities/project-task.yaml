entity:
  name: ProjectTask
  namespace: cedm.domain
  kind: project_management_entity
  description: A work item contributing to delivery of a project objective or deliverable.
  ui:
    icon: folder-kanban
  identity:
    key: projectTaskId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: projectTaskId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the task, constant for its life.
        usage: Generated on creation; costs and child tasks refer to it.
        relationshipContext: Referenced by costs and by sub-tasks.
    - name: taskCode
      type: string
      required: true
      maxLength: 100
      help:
        summary: The code of the task within the project, such as T-014.
        usage: Used to refer to the task in plans and time booking.
        relationshipContext: Read with the project code to identify the task.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A short statement of the work item that team members can read at a glance, such as Prepare site survey.
        usage: Entered by the planner or task owner; shown on boards, schedules and time sheets, and kept brief while detail goes elsewhere.
        relationshipContext: Read by the assignee and the reviewer.
    - name: status
      type: enum
      required: true
      default: NOT_STARTED
      values:
        - NOT_STARTED
        - IN_PROGRESS
        - BLOCKED
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the task is in its work.
        usage: Starts as NOT_STARTED; changed by the assignee.
        relationshipContext: Rolled up to show project progress.
        valueSemantics:
          NOT_STARTED: Planned but no work has begun.
          IN_PROGRESS: Work is under way.
          BLOCKED: Waiting on something; cannot proceed until resolved.
          COMPLETED: The work is done. A final state.
          CANCELLED: Dropped from the plan. A final state.
    - name: priority
      type: enum
      required: true
      default: NORMAL
      values:
        - LOW
        - NORMAL
        - HIGH
        - CRITICAL
      help:
        summary: How urgent this task is relative to the other tasks of the project.
        usage: Set when planned and revised as the schedule changes; used to order work queues and decide which delays to escalate.
        valueSemantics:
          LOW: Can wait without affecting delivery of the project.
          NORMAL: Ordinary priority, scheduled in turn with other work.
          HIGH: Should be done ahead of normal work to protect the schedule.
          CRITICAL: Delays the project if not done now and needs immediate attention.
        relationshipContext: Read alongside the due date when scheduling.
    - name: startDate
      type: date
      required: false
      help:
        summary: The date work on the task is due to start.
        usage: Set when scheduled; used to order tasks.
        relationshipContext: Compared with the project and phase dates.
    - name: dueDate
      type: date
      required: false
      help:
        summary: The date the task is due to finish.
        usage: Must not be before the start date; reported when overdue.
        relationshipContext: Compared with its milestone date.
    - name: percentComplete
      type: decimal
      required: true
      default: 0
      precision: 5
      scale: 2
      help:
        summary: How much of the task is done, from 0 to 100.
        usage: Updated by the assignee; must stay between 0 and 100; rolls up to project progress.
        relationshipContext: Averaged with other tasks to give the progress of a phase or project.
  relationships:
    - name: project
      target: Project
      cardinality: '1'
      ownership: reference
      help:
        summary: The project the task belongs to.
        usage: Chosen when the task is created.
        cardinalityMeaning: Exactly one project; a task has no life outside its project.
        context: Places the work in the project's plan and budget.
    - name: assignee
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for doing the task.
        usage: Chosen when work is assigned.
        cardinalityMeaning: At most one assignee; empty until assigned.
        context: Decides whose list the task appears on.
    - name: parentTask
      target: ProjectTask
      cardinality: 0..1
      ownership: reference
      help:
        summary: The task this one is a part of.
        usage: Chosen to break a large task into steps.
        cardinalityMeaning: At most one parent; a top-level task has none.
        context: Builds the task hierarchy so progress can roll up.
    - name: milestone
      target: Milestone
      cardinality: 0..1
      ownership: reference
      help:
        summary: The milestone this task contributes to.
        usage: Chosen when the task is part of reaching a key date.
        cardinalityMeaning: At most one milestone; empty if none applies.
        context: Links day-to-day work to the dates the project is judged by.
    - name: projectCosts
      target: ProjectCost
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of cost records can be charged to a task.
        summary: Project costs attributed to this task.
        businessMeaning: Provides task-level cost traceability within the parent Project.
        usage: Work-breakdown costing, earned-value analysis, profitability and audit.
        workflowRole: Every linked ProjectCost must reference the same parent Project as this task.
  invariants:
    - id: PROJECT-TASK-001
      rule: percentComplete must be between 0 and 100.
    - id: PROJECT-TASK-002
      rule: dueDate must not precede startDate.
    - id: PROJECT-TASK-003
      rule: A ProjectTask must not be its own parent or one of its own ancestors; the task hierarchy through parentTask is acyclic and stays within one Project.
  lifecycle:
    title: Project Task Lifecycle
    attribute: status
    states: [NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]
    initial: NOT_STARTED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: NOT_STARTED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: IN_PROGRESS, to: BLOCKED, action: block}
      - {from: BLOCKED, to: IN_PROGRESS, action: unblock}
      - {from: NOT_STARTED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: BLOCKED, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a project task is stopped"
      description: "When a project task is blocked, a high-priority task asks someone to resolve it."
      when: "status == \"BLOCKED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-TASK-EXCEPTION-{{id}}"
              name: "Resolve project task {{name}}"
              description: "Project task {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a project task is ended"
      description: "When a project task is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-TASK-FOLLOW-UP-{{id}}"
              name: "Follow up on project task {{name}}"
              description: "Project task {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A unit of work within a project, with an owner, dates, a priority and a measure of progress.
    businessMeaning: Tasks break a project into work people can be assigned, scheduled and held to. Their status and percent complete roll up into how far the project has progressed and show what is blocked.
    usage: Created by the project manager or team; updated by the assignee as work proceeds; read in plans and boards.
    relationshipContext: A task belongs to a project, may have an assignee, a parent task and a milestone, and may carry project costs.
    lifecycle: A task starts not started, moves to in progress, may be blocked and resumed, and ends completed or cancelled. Completed and cancelled are final.
    example: Task "Install conveyor controls" in PRJ-0042 is assigned to a technician, due 20 June, and is 60 percent complete.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROJECT-TASK
