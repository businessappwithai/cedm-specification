entity:
  name: Milestone
  namespace: cedm.domain
  kind: project_management_entity
  description: A significant planned achievement or checkpoint within a project or process.
  ui:
    icon: table
  identity:
    key: milestoneId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: milestoneId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the milestone.
        usage: Generated on creation; tasks refer to it.
    - name: code
      type: string
      required: true
      maxLength: 100
      help:
        summary: The reference of the milestone within the project, such as M3.
        usage: Assigned by the project manager.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the checkpoint.
        usage: Shown on plans and status reports.
    - name: targetDate
      type: date
      required: true
      help:
        summary: The date by which the milestone should be reached.
        usage: Set at planning; reviewed at status meetings.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - AT_RISK
        - ACHIEVED
        - MISSED
        - CANCELLED
      help:
        summary: How the milestone is progressing.
        usage: Updated by the project manager at status reviews.
        valueSemantics:
          PLANNED: Not yet reached and expected on time.
          AT_RISK: Likely to be late without action.
          ACHIEVED: Reached. A final state.
          MISSED: Passed without being reached. A final state.
          CANCELLED: No longer needed. A final state.
  relationships:
    - name: project
      target: Project
      cardinality: '1'
      ownership: reference
      help:
        summary: The project the milestone belongs to.
        usage: Set at planning.
        cardinalityMeaning: 'Exactly one project: a milestone is a checkpoint of a single undertaking.'
        workflowRole: Rolls the milestone's status up to the project.
    - name: tasks
      target: ProjectTask
      cardinality: 0..*
      ownership: reference
      help:
        summary: The tasks whose completion leads to the milestone.
        usage: Linked at planning.
        cardinalityMeaning: Any number of tasks.
        workflowRole: Task progress feeds the milestone's status.
  lifecycle:
    title: Milestone Lifecycle
    attribute: status
    states: [PLANNED, AT_RISK, ACHIEVED, MISSED, CANCELLED]
    initial: PLANNED
    terminal:
      - ACHIEVED
      - MISSED
      - CANCELLED
    transitions:
      - {from: PLANNED, to: AT_RISK, action: flag_at_risk}
      - {from: AT_RISK, to: PLANNED, action: recover}
      - {from: PLANNED, to: ACHIEVED, action: achieve}
      - {from: AT_RISK, to: ACHIEVED, action: achieve}
      - {from: PLANNED, to: MISSED, action: miss}
      - {from: AT_RISK, to: MISSED, action: miss}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: AT_RISK, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a milestone is ended"
      description: "When a milestone is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MILESTONE-FOLLOW-UP-{{id}}"
              name: "Follow up on milestone {{name}}"
              description: "Milestone {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A significant planned achievement or checkpoint in a project or process.
    businessMeaning: A project's progress is judged against its milestones. Naming each checkpoint and its target date lets sponsors see whether the work is on track without reading every task.
    usage: Set by the project manager at planning; updated as the date approaches; read by sponsors and steering groups.
    relationshipContext: A milestone belongs to one Project and is reached by completing a set of ProjectTasks.
    lifecycle: A milestone is planned, may be flagged at risk and recover, and ends achieved, missed or cancelled.
    example: '"Go-live" for a system implementation, targeted for 1 September and flagged at risk in July.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MILESTONE
