entity:
  name: ResourceAssignment
  namespace: cedm.domain
  kind: project_transaction
  description: A governed assignment of a person, role, or resource to a Project with defined responsibility and allocation.
  ui:
    icon: file-text
  identity:
    key: resourceAssignmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: resourceAssignmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the assignment, constant for its life.
        usage: Generated on creation; time and cost records refer to it.
        relationshipContext: Referenced by timesheets booked under the assignment.
    - name: resourceAssignmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The code that identifies one assignment of a person or resource to a project, such as RA-0231.
        usage: Generated or entered when the assignment is made, unique, and quoted in resource plans and utilisation reports.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: The stage of the assignment, from proposal to the end of the commitment.
        usage: Starts as DRAFT and is moved by the project manager; only ACTIVE assignments count toward a person's committed allocation.
        valueSemantics:
          DRAFT: Proposed and not yet committed; it does not count against availability.
          ACTIVE: The person or resource is committed to the project for the stated period.
          COMPLETED: The commitment has ended as planned. A final state.
          CANCELLED: Withdrawn before or during the commitment. A final state.
        relationshipContext: Status changes can affect related Project workflows but never erase historical evidence.
    - name: projectRole
      type: string
      required: true
      maxLength: 100
      help:
        summary: The role the person plays on the project, such as "Data engineer".
        usage: Shown in the project's staffing plan.
        relationshipContext: May differ from the person's job title.
    - name: startDate
      type: date
      required: true
      help:
        summary: The first day on which the person or resource is committed to the project.
        usage: Set when the assignment is planned, and used to build the capacity plan for the period.
        relationshipContext: Not later than the end date.
    - name: endDate
      type: date
      required: false
      help:
        summary: The last day of the assignment.
        usage: Set when planning; moved if the project slips.
        relationshipContext: Empty for open-ended assignments.
    - name: allocationPercent
      type: decimal
      required: true
      precision: 5
      scale: 2
      default: 100
      help:
        summary: The share of the person's time the project takes.
        usage: Summed across a person's assignments to check for overbooking.
        relationshipContext: Between 0 and 100.
    - name: plannedHours
      type: decimal
      required: false
      precision: 10
      scale: 2
      help:
        summary: The total working hours the project manager expects this person to give the project.
        usage: Compared with the hours actually booked to show whether the assignment is on track.
        relationshipContext: Usually the allocation percentage times the hours available in the period.
    - name: costRate
      type: Money
      required: false
      help:
        summary: The internal cost of an hour of the person's time.
        usage: Used to cost the project.
        relationshipContext: From the person's grade.
    - name: billRate
      type: Money
      required: false
      help:
        summary: The rate charged to the client per hour, for billable projects.
        usage: Used to bill the project.
        relationshipContext: From the contract or rate card.
  relationships:
    - name: context
      target: Project
      cardinality: '1'
      ownership: reference
      help:
        summary: The project the resource is assigned to.
        usage: Chosen when the assignment is created.
        cardinalityMeaning: Exactly one project; an assignment to two projects is two assignments.
        context: Places the commitment in the right plan and budget.
    - name: project
      target: Project
      cardinality: "1"
      ownership: reference
      help:
        summary: The project the person is assigned to.
        usage: Chosen when proposing the assignment.
        cardinalityMeaning: Every assignment is to exactly one project.
        context: The project's staffing plan lists its assignments.
    - name: person
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person assigned.
        usage: Named once known; a role may be requested before a person is found.
        cardinalityMeaning: At most one.
        context: Their availability limits the allocation.
    - name: task
      target: ProjectTask
      cardinality: 0..1
      ownership: reference
      help:
        summary: The project task the assignment is for, when it is that specific.
        usage: Set for task-level staffing.
        cardinalityMeaning: At most one.
        context: Time booked rolls up to the task.
  invariants:
    - id: RESOURCE-ASSIGNMENT-001
      rule: The governing Project relationship is required and must reference a valid record.
    - id: RESOURCE-ASSIGNMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: RESOURCE-ASSIGNMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
    - {id: RESOURCE-ASSIGNMENT-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
    - {id: RESOURCE-ASSIGNMENT-EXE-002, rule: "Allocation Percent is a percentage between 0 and 100.", violatedWhen: "allocation_percent != null and (allocation_percent < 0 or allocation_percent > 100)", message: "Allocation Percent must be between 0 and 100."}
    - {id: RESOURCE-ASSIGNMENT-EXE-003, rule: "Cost Rate cannot be negative.", violatedWhen: "cost_rate != null and cost_rate < 0", message: "Cost Rate cannot be negative."}
    - {id: RESOURCE-ASSIGNMENT-EXE-004, rule: "Bill Rate cannot be negative.", violatedWhen: "bill_rate != null and bill_rate < 0", message: "Bill Rate cannot be negative."}
  lifecycle:
    title: Resource Assignment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a resource assignment is ended"
      description: "When a resource assignment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RESOURCE-ASSIGNMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on resource assignment {{id}}"
              description: "Resource assignment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a resource assignment is done"
      description: "When a resource assignment is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RESOURCE-ASSIGNMENT-COMPLETED-{{id}}"
              name: "Confirm resource assignment {{id}}"
              description: "Resource assignment {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: An assignment of a person, role or resource to a project with a defined responsibility and allocation.
    businessMeaning: An assignment says who is committed to a project and in what capacity. It lets managers see how people are allocated, plan capacity and attribute time and cost, and it keeps the history of who was on the project when.
    usage: Created by the project manager; read by resource planning, timesheets and finance.
    relationshipContext: An assignment belongs to one project.
    lifecycle: An assignment is drafted, active while the person is committed, and completed when the commitment ends. It may be cancelled before it starts to matter. Completed and cancelled are final.
    example: A senior engineer is assigned to the Warehouse automation project at 50 percent from March to August.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RESOURCE-ASSIGNMENT
