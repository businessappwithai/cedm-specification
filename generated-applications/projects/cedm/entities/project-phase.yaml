entity:
  name: ProjectPhase
  namespace: cedm.domain
  kind: project_structure
  description: A governed stage of a Project used to group milestones, tasks, resources, costs, and delivery controls within a defined portion of the project lifecycle.
  ui:
    icon: folder-kanban
  identity: {key: projectPhaseId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: projectPhaseId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the phase, constant for its life.', usage: Generated on creation; tasks and milestones refer to it., businessMeaning: Identifies one project stage., relationshipContext: Belongs to one Project.}}
    - {name: name, type: string, required: true, maxLength: 200, help: {summary: 'The name of the phase, such as Design or Handover.', usage: Shown in plans and reports., businessMeaning: Communicates project stage., relationshipContext: Unique according to project policy.}}
    - name: status
      type: enum
      required: true
      values: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where this stage of the project stands from being scheduled through work under way to closure.
        usage: Starts as PLANNED and is moved by the project manager; completion requires its required tasks and milestones to be reconciled.
        valueSemantics:
          PLANNED: Scheduled but work in the phase has not started.
          ACTIVE: Work in the phase is under way and tasks are being executed.
          COMPLETED: All required work in the phase is finished. A final state.
          CANCELLED: The phase will not be carried out. A final state.
        businessMeaning: Controls phase execution.
        relationshipContext: Task/milestone state must reconcile.
    - name: sequence
      type: integer
      required: true
      help:
        summary: The order of the phase in the project.
        usage: Phases are shown and run in this order.
        relationshipContext: Unique within the project.
    - name: plannedStart
      type: date
      required: false
      help:
        summary: The date on which work in this phase is scheduled to begin.
        usage: Set in the project plan by the project manager and revised when the schedule changes.
        relationshipContext: It cannot be later than the planned end.
    - name: plannedEnd
      type: date
      required: false
      help:
        summary: The date by which this phase is scheduled to be finished.
        usage: Set in the project plan; progress reports measure delay by comparing the actual end against it.
        relationshipContext: Delays are measured against this date.
    - name: actualStart
      type: date
      required: false
      help:
        summary: The date on which work in this phase really began.
        usage: Recorded by the project manager when the phase starts, which may differ from the plan.
        relationshipContext: Present once the phase is active.
    - name: actualEnd
      type: date
      required: false
      help:
        summary: The date on which this phase was really finished.
        usage: Recorded by the project manager when the phase is completed or signed off.
        relationshipContext: Present once the phase is completed.
    - name: budget
      type: Money
      required: false
      help:
        summary: The amount of money approved for the work done in this phase.
        usage: Set in the project plan and compared with the costs booked to its tasks.
        relationshipContext: Held in the project's currency.
    - name: gateCriteria
      type: text
      required: false
      help:
        summary: What must be true to close the phase and move on.
        usage: Checked at the phase gate review.
        relationshipContext: Such as signed-off designs or passed tests.
  relationships:
    - {name: project, target: Project, cardinality: '1', ownership: reference, help: {summary: The project the phase belongs to., usage: Chosen when the phase is created., cardinalityMeaning: Exactly one project; a phase cannot exist alone., workflowRole: Places the stage in the project's plan., businessMeaning: Supplies overall scope/governance.}}
    - {name: tasks, target: ProjectTask, cardinality: 0..*, ownership: reference, help: {cardinalityMeaning: 'Any number of tasks, none for a phase not yet broken down.', summary: Tasks assigned to phase., businessMeaning: Supplies executable work., usage: Scheduling and delivery., workflowRole: Completion requires task reconciliation.}}
    - {name: milestones, target: Milestone, cardinality: 0..*, ownership: reference, help: {cardinalityMeaning: Any number of milestones that mark the phase's progress., summary: Milestones governed by phase., businessMeaning: Supplies delivery checkpoints., usage: Project tracking., workflowRole: Milestone evidence supports phase completion.}}
  invariants:
    - {id: PROJECT-PHASE-001, rule: COMPLETED phase must reconcile non-cancelled required tasks and milestones.}
    - {id: PROJECT-PHASE-002, rule: Phase dates and lifecycle must remain compatible with parent Project.}
    - {id: PROJECT-PHASE-EXE-001, rule: "Planned End must not be earlier than planned start.", violatedWhen: "planned_start != null and planned_end != null and planned_end < planned_start", message: "Planned End cannot be earlier than planned start."}
    - {id: PROJECT-PHASE-EXE-002, rule: "Actual End must not be earlier than actual start.", violatedWhen: "actual_start != null and actual_end != null and actual_end < actual_start", message: "Actual End cannot be earlier than actual start."}
  lifecycle:
    title: Project Phase Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a project phase is ended"
      description: "When a project phase is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-PHASE-FOLLOW-UP-{{id}}"
              name: "Follow up on project phase {{name}}"
              description: "Project phase {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A stage of a project that groups tasks and milestones within one portion of its lifecycle.
    businessMeaning: Phases divide a project into stages such as design, build and handover, so progress can be reviewed and approved stage by stage rather than as one undifferentiated piece of work.
    usage: Defined by the project manager; read in plans and status reports.
    relationshipContext: A phase belongs to one project and groups its tasks and milestones.
    lifecycle: A phase is planned, active while its work runs, then completed. It may be cancelled. Completed and cancelled are final.
    example: The "Build" phase of PRJ-0042 contains twelve tasks and the milestone "Prototype accepted".
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROJECT-PHASE}
