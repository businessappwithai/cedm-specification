entity:
  name: Task
  namespace: cedm.domain
  kind: process_runtime_entity
  description: A discrete unit of business work performed by a person, organization, system, or workflow participant.
  ui:
    icon: list-checks
  identity:
    key: taskId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: taskId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the task, constant for its life.
        usage: Generated on creation; workflow and audit records refer to it.
    - name: code
      type: string
      required: true
      maxLength: 100
      help:
        summary: The short business code that identifies the task in work queues, such as TSK-10482.
        usage: Assigned when the task is created; quoted in assignments, escalations and reports, and used to find the task without its full name.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A short title stating what work the task asks someone or something to do.
        usage: Entered by the creator or the workflow that spawned it; shown in queues and notifications, so it should read as an action.
    - name: description
      type: string
      required: false
      maxLength: 2000
      help:
        summary: Fuller instructions explaining what is to be done, why, and any details the performer needs.
        usage: Written by the creator; read by the assignee before starting, and updated if scope changes while the task is open.
    - name: taskType
      type: enum
      required: true
      values:
        - USER
        - SYSTEM
        - APPROVAL
        - DECISION
        - NOTIFICATION
        - SCRIPT
        - OTHER
      help:
        summary: The kind of work the task is.
        usage: Chosen when created; decides who or what performs it.
        valueSemantics:
          USER: Work done by a person.
          SYSTEM: A step run automatically.
          APPROVAL: A person must approve or refuse something.
          DECISION: A choice that decides the path.
          NOTIFICATION: A message to be sent.
          SCRIPT: A script run by the system.
          OTHER: Work that fits no other type.
    - name: status
      type: enum
      required: true
      default: CREATED
      values:
        - CREATED
        - READY
        - ASSIGNED
        - IN_PROGRESS
        - BLOCKED
        - COMPLETED
        - CANCELLED
        - FAILED
      help:
        summary: Where the task stands, from creation through assignment and execution to completion, cancellation or failure.
        usage: Moved by the assignee, workflow or system as work proceeds; completed, cancelled and failed tasks are closed to further work.
        valueSemantics:
          CREATED: The task exists but is not yet ready to be picked up.
          READY: The task is released and waiting for someone to be assigned.
          ASSIGNED: A person or party has been given the task but has not started it.
          IN_PROGRESS: The assignee is actively working on the task.
          BLOCKED: Work is held up by a dependency, missing input or decision.
          COMPLETED: The work was done as required. A final state.
          CANCELLED: The task was withdrawn before completion. A final state.
          FAILED: The task ended without achieving its result and needs follow-up elsewhere. A final state.
    - name: priority
      type: enum
      required: true
      default: NORMAL
      values:
        - LOW
        - NORMAL
        - HIGH
        - CRITICAL
      help:
        summary: How urgently the task should be worked relative to others in the same queue.
        usage: Set by the creator or workflow rules; assignees and queue views sort by it, and it may raise escalations when overdue.
        valueSemantics:
          LOW: Can wait behind other work without business impact.
          NORMAL: Standard urgency, handled in the ordinary course of work.
          HIGH: Needs prompt attention ahead of normal work.
          CRITICAL: Needs immediate action because delay causes serious business impact.
    - name: dueAt
      type: datetime
      required: false
      help:
        usage: Set when created; overdue tasks are flagged.
        relationshipContext: Compared with the completion time.
        summary: Records when the due event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: startedAt
      type: datetime
      required: false
      help:
        usage: Set when work starts.
        relationshipContext: Not later than the completion time.
        summary: Records when the started event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: completedAt
      type: datetime
      required: false
      help:
        usage: Set when the task is completed; required for a completed task.
        relationshipContext: Gives the time taken.
        summary: Records when the completed event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
  relationships:
    - name: workflow
      target: Workflow
      cardinality: 0..1
      ownership: reference
      help:
        summary: The workflow the task is part of.
        usage: Set when the task is created by a workflow.
        cardinalityMeaning: At most one workflow.
        context: Places the task in a larger process.
    - name: assignee
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for the task.
        usage: Chosen when assigned.
        cardinalityMeaning: At most one assignee.
        context: Decides whose list it is on.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation the task is for.
        usage: Chosen when it concerns a unit.
        cardinalityMeaning: At most one organisation.
        context: Groups tasks by unit.
    - name: relatedDocument
      target: Document
      cardinality: 0..1
      ownership: reference
      help:
        summary: The document the task concerns.
        usage: Linked when the task is about a document.
        cardinalityMeaning: At most one document.
        context: Gives the assignee what to act on.
  invariants:
    - id: TASK-001
      rule: completedAt is required when status is COMPLETED.
    - id: TASK-002
      rule: completedAt must not precede startedAt.
    - id: TASK-003
      rule: A USER or APPROVAL task should have an assignee before entering IN_PROGRESS unless explicitly configured otherwise.
    - {id: TASK-EXE-001, rule: "A task that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the task is completed."}
  lifecycle:
    title: Task Lifecycle
    attribute: status
    states: [CREATED, READY, ASSIGNED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED, FAILED]
    initial: CREATED
    terminal: [COMPLETED, CANCELLED, FAILED]
    transitions:
      - {from: CREATED, to: READY, action: mark_ready}
      - {from: READY, to: ASSIGNED, action: assign}
      - {from: ASSIGNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: READY, to: BLOCKED, action: block}
      - {from: BLOCKED, to: READY, action: unblock}
      - {from: ASSIGNED, to: BLOCKED, action: block}
      - {from: BLOCKED, to: ASSIGNED, action: unblock}
      - {from: IN_PROGRESS, to: BLOCKED, action: block}
      - {from: BLOCKED, to: IN_PROGRESS, action: unblock}
      - {from: CREATED, to: CANCELLED, action: cancel}
      - {from: READY, to: CANCELLED, action: cancel}
      - {from: ASSIGNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: BLOCKED, to: CANCELLED, action: cancel}
      - {from: READY, to: FAILED, action: fail}
      - {from: ASSIGNED, to: FAILED, action: fail}
      - {from: IN_PROGRESS, to: FAILED, action: fail}
      - {from: BLOCKED, to: FAILED, action: fail}
  help:
    summary: A discrete unit of business work performed by a person, organisation, system or workflow participant.
    businessMeaning: Tasks are how work is handed out and tracked, whether a person must act or a system step must run. Their type, status, owner and dates show what is waiting, what is stuck and what is done.
    usage: Created by people or workflows; picked up by assignees; read by managers and reports.
    relationshipContext: A task may belong to a workflow, an assignee, an organisation and a related document.
    lifecycle: A task is created, becomes ready, is assigned and worked, and ends completed, cancelled or failed. It may be blocked and resumed. All three end states are final.
    example: A task "Approve purchase order PO-5120" is assigned to a manager and completed the same day.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TASK
