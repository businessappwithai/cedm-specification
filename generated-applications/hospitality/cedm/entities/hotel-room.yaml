entity:
  name: HotelRoom
  namespace: cedm.domain
  kind: hospitality_asset
  description: An individual accommodation unit within a hotel.
  ui:
    icon: bed
  identity:
    key: hotelRoomId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: hotelRoomId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the room record.
        usage: Generated on creation; reservations and work orders refer to it.
    - name: roomNumber
      type: string
      required: true
      maxLength: 50
      help:
        summary: The number on the door.
        usage: Entered when the room is set up; unique within the hotel and used by guests and staff.
    - name: roomType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The category of the room, such as standard double, suite or accessible twin.
        usage: Chosen when set up; reservations are sold by type and rates differ by it.
    - name: status
      type: enum
      required: true
      default: AVAILABLE
      values:
        - AVAILABLE
        - OCCUPIED
        - RESERVED
        - CLEANING
        - OUT_OF_SERVICE
      help:
        summary: What the room is doing now.
        usage: Updated by the front desk and housekeeping; only AVAILABLE rooms can be allocated to arrivals.
        valueSemantics:
          AVAILABLE: Clean and ready to be sold or allocated.
          OCCUPIED: A guest is staying in it.
          RESERVED: Held for a confirmed reservation that has not yet arrived.
          CLEANING: Vacated and being cleaned before it can be sold again.
          OUT_OF_SERVICE: Unavailable because of repair or another problem.
    - name: capacity
      type: integer
      required: true
      minimum: 1
      help:
        summary: The maximum number of guests the room can accommodate.
        usage: Set from the room's fit-out; used to choose a room for a party and to meet safety limits.
  relationships:
    - name: hotel
      target: Hotel
      cardinality: '1'
      ownership: reference
      help:
        summary: The hotel the room belongs to.
        usage: Set when the room is created.
        cardinalityMeaning: 'Exactly one hotel: a room is part of a single property.'
        workflowRole: Rooms make up a hotel's inventory.
    - name: reservations
      target: HotelReservation
      cardinality: 0..*
      ownership: reference
      help:
        summary: The reservations that have used or will use the room.
        usage: Read to see the room's booking calendar.
        cardinalityMeaning: Any number over the room's life.
        workflowRole: Show the room's occupancy and prevent double-booking.
  lifecycle:
    title: Hotel Room Lifecycle
    attribute: status
    states: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
    initial: AVAILABLE
    transitions:
      - {from: AVAILABLE, to: RESERVED, action: reserve}
      - {from: RESERVED, to: AVAILABLE, action: release}
      - {from: RESERVED, to: OCCUPIED, action: check_in}
      - {from: AVAILABLE, to: OCCUPIED, action: check_in}
      - {from: OCCUPIED, to: CLEANING, action: check_out}
      - {from: CLEANING, to: AVAILABLE, action: mark_clean}
      - {from: AVAILABLE, to: OUT_OF_SERVICE, action: take_out_of_service}
      - {from: CLEANING, to: OUT_OF_SERVICE, action: take_out_of_service}
      - {from: OUT_OF_SERVICE, to: AVAILABLE, action: return_to_service}
  help:
    summary: An individual accommodation unit within a hotel.
    businessMeaning: Rooms are what a hotel sells. Each room record carries its number, type, capacity and current state, so reservations, housekeeping and maintenance all work from the same picture of what is available.
    usage: Created when the hotel is set up or extended; updated as guests arrive and leave and as the room is cleaned or serviced; read by the front desk and housekeeping.
    relationshipContext: A room belongs to one Hotel and is occupied through HotelReservations.
    lifecycle: A room is available, can be reserved for a guest, becomes occupied at check-in, is cleaned after check-out and then returns to available. It can be taken out of service for repair.
    example: Room 412, a double room for up to three guests, currently being cleaned after check-out.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-ROOM
