entity:
  name: Hotel
  namespace: cedm.domain
  kind: hospitality_entity
  description: A hospitality property providing accommodation and related services.
  ui:
    icon: bed
  identity:
    key: hotelId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: hotelId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the hotel property.
        usage: Generated on registration; rooms and reservations refer to it.
    - name: hotelCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The property code, such as SEA01, used in reservation and channel systems.
        usage: Unique; assigned at registration.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The trading name guests know the hotel by, as shown on its website and booking channels.
        usage: Shown on confirmations, invoices and search results; it may be rebranded while the hotel code stays the key.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - CLOSED
        - RETIRED
      help:
        valueSemantics:
          PLANNED: Not yet open to guests.
          ACTIVE: Open for business and taking reservations.
          CLOSED: Closed to guests, for example for renovation, and expected to reopen.
          RETIRED: Removed from the portfolio. A final state.
        summary: Whether the property is trading.
        usage: Set by the operator; reservations are taken only for ACTIVE hotels.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The place where the hotel stands.
        usage: Set at registration; supplies the address and map position.
        cardinalityMeaning: 'Exactly one location: a hotel is a physical property.'
        workflowRole: Anchors distance, tax and time-zone rules.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that operates the hotel.
        usage: Set at registration.
        cardinalityMeaning: At most one operator; a property being acquired may not have one yet.
        workflowRole: Determines who is accountable for the property's results.
    - name: rooms
      target: HotelRoom
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: The rooms the hotel offers.
        usage: Read for inventory and availability.
        cardinalityMeaning: 'At least one room: a hotel with no rooms has nothing to sell.'
        workflowRole: Rooms are the inventory that reservations draw on.
    - name: reservations
      target: HotelReservation
      cardinality: 0..*
      ownership: reference
      help:
        summary: The reservations booked at the hotel.
        usage: Read for occupancy and revenue.
        cardinalityMeaning: Any number over the hotel's life.
        workflowRole: Show the demand for the hotel's rooms.
  lifecycle:
    title: Hotel Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: A hospitality property that provides accommodation and related services.
    businessMeaning: A hotel is the unit that sells rooms. It holds the property's identity and status and owns the rooms and reservations that make up its business.
    usage: Registered when a property is opened or acquired; read by reservations, revenue management and operations.
    relationshipContext: A hotel stands at a Location, is operated by an Organization, has HotelRooms and takes HotelReservations.
    lifecycle: A hotel is planned, becomes active when it opens, and is closed or retired when it stops trading. Reservations and room history are kept.
    example: Seaview Hotel, a 120-room property on the coast, open since 2018.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL
