name: CEDM Entity Help

# Checks that every entity and field carries the help the contract in
# specification/help-semantics.yaml asks for, and that the authored help in
# domain/help/authored/ is applied to the library.
#
# This workflow used to generate help itself and push the result. Its scripts
# rewrote every help block from templates through a YAML round trip, so each
# run replaced authored text with boilerplate and rewrapped every folded line
# in the library. Help is now written by hand in domain/help/authored/ and
# applied with tools/apply_authored.py; this workflow only checks.

on:
  push:
    paths:
      - 'domain/entities/**/*.yaml'
      - 'domain/help/**'
      - 'specification/help-semantics.yaml'
      - 'specification/dictionary-mapping.yaml'
      - 'tools/apply_authored.py'
      - 'tools/validate_help.py'
      - '.github/workflows/enrich-entity-help.yml'
  pull_request:
    paths:
      - 'domain/entities/**/*.yaml'
      - 'domain/help/**'
      - 'specification/help-semantics.yaml'
      - 'specification/dictionary-mapping.yaml'
      - 'tools/apply_authored.py'
      - 'tools/validate_help.py'
      - '.github/workflows/enrich-entity-help.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Authored help is applied
        run: python tools/apply_authored.py --check
      - name: Help coverage
        run: python tools/validate_help.py
