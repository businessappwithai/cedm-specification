name: Check CEDM Entity Help

# This workflow used to run tools/enrich_entity_help.py and
# tools/enrich_domain_specific_help.py on every push and commit the result.
# Both rewrite every entity's, attribute's and relationship's `help` with
# generated filler, discarding the authored text, so it is now read-only:
# it only checks, and never writes to the repository. Help is authored with
# tools/help_skeleton.py and tools/help_apply.py (see CLAUDE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-help:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: No template filler (HELP-001)
        run: python tools/help_shapes.py --check
      - name: Dictionary and help rules (DICT-001..010, ENUM-001..003)
        run: python tools/validate.py
