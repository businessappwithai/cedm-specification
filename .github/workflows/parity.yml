# Generator parity.
#
# Two generators emit the same backend: `packages/generator` in TypeScript and
# `crates/appwithai-gen` in Rust. The Rust one exists to become the generator,
# and the only evidence that it still matches is generating both and diffing.
#
# This runs on every push and pull request because the failure it catches is
# silent: Handlebars strict mode is off in both engines, so a helper the Rust
# registry never registered renders as an empty string rather than an error.
name: parity

# Once per commit, not twice. `push` on every branch plus `pull_request` ran the
# whole job twice for each push to an open PR — same commit, same result, double
# the runner minutes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: |
          bun run type-check
          bun run type-check:language

      - name: Generator unit tests
        run: bun run test:generator

      - name: Rust generator — format, lint, test
        run: |
          cargo fmt --check -p appwithai-gen
          cargo clippy -p appwithai-gen --all-targets -- -D warnings
          cargo clippy -p appwithai-gen --target wasm32-wasip1 -- -D warnings
          cargo test -p appwithai-gen

      # The gate. Every corpus model, both generators, byte-for-byte.
      - name: Backend parity
        run: bun run parity
