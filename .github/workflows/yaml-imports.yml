# The imported repositories under `yaml/`.
#
# `yaml/` holds three repositories brought into this one and converted to the
# YAML model language: the orchestrator (`app-and-report-with-ai-rust`), the
# reporting platform (`enterprise_reporting_rust`) and the published website
# (`businessappwithairust`). Their own workflows lived in `.github/workflows/`
# inside each of them, where GitHub never looks — only this directory runs — so
# their checks are here, run from the directories they were written for.
#
# Nothing here checks a dependency out: the language, the generator and both
# products are directories of this repository, which is the point of the move.
name: yaml-imports

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "yaml/**"
      - "language/**"
      - "packages/generator/**"
      - "packages/core/**"
      - "crates/appwithai-gen/**"
      - "scripts/build-site-bundles.ts"
      - "scripts/patch-vendored-generators.ts"
      - "scripts/lib/browser-bundle.ts"
      - ".github/workflows/yaml-imports.yml"

jobs:
  # The published pages' bundles are built from `language/browser/` here, and the
  # vendored in-browser generator is patched to take a compiled model. A stale
  # copy is a page that disagrees with the language it ships beside.
  site-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Every site bundle matches its entry
        run: bun scripts/build-site-bundles.ts --check
      - name: Every vendored generator takes a compiled model
        run: bun scripts/patch-vendored-generators.ts --check

  orchestrator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qapass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: qapass
    defaults:
      run:
        working-directory: yaml/app-and-report-with-ai-rust/common
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The root's dependencies are what the orchestrator's scripts import: the
      # model reader, the generator pipeline, the reporting-pack derivation.
      - name: Install the root
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build core and the generator
        working-directory: .
        run: bun --filter @appwithai/core build && bun --filter @appwithai/generator build
      - run: bun install
      - name: Every model reads clean, and the twins match
        run: bun run check:models
      - run: bun run type-check
      - run: bun run lint
      - name: Every --stack target generates
        run: bun run check:stacks
      - name: Both generator CLIs generate
        run: bun run check:clis
      - name: Every derived report query runs against a generated schema
        run: bun run check:pack:ci
      - name: No check rewrote a tracked file
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::a check modified tracked files"
            exit 1
          fi

  reporting-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaml/enterprise_reporting_rust
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install the root
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - name: The eml CLI reads every example model
        run: |
          for model in language/examples/*.eml.yaml; do
            bun language/cli/eml.ts validate -i "$model"
          done
