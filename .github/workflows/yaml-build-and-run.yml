# Build a whole application from one model, and run it.
#
# The orchestrator (`yaml/app-and-report-with-ai-rust`) composes the two
# products this repository holds into one running system:
#
#   check the model            the root's `eml validate` (YAML, schema, checker)
#   generate the application   the root's pipeline, --stack tanstack-astryx-loco:
#                              a Loco.rs backend crate + a TanStack Start front end
#   put it on /app             common/build/subpath-overlay.ts
#   derive the reporting pack  common/build/reporting-pack.ts
#   write the front door       common/build/landing.ts
#   build and start            docker compose — postgres; the generated Loco
#                              backend and its front end; the reporting
#                              platform (yaml/enterprise_reporting_rust) and its
#                              Rust seeder; nginx in front
#   smoke-test                 /app and /report answer, both APIs are Rust's,
#                              and the seeder finished
#
# It used to check both products out at commits pinned in deps.json, which
# needed a DEPS_TOKEN because they are private. They are directories of this
# repository now, so a run builds exactly the commit it was started on.

name: Build and run an application

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (*.eml.yaml), relative to yaml/app-and-report-with-ai-rust"
        type: string
        default: "common/examples/crm.eml.yaml"
      profile:
        description: "demo = one PostgreSQL holding three databases; prod = two servers"
        type: choice
        options: [demo, prod]
        default: demo
  # The full build is slow and needs no secrets, so a nightly is the right
  # cadence: it catches a change to either product breaking the composition
  # without waiting for someone to ask.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  # Where start.sh writes everything, relative to the orchestrator.
  RUNTIME: common/.runtime

concurrency:
  group: build-and-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    name: Build ${{ inputs.model || 'the CRM model' }} and run it
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: yaml/app-and-report-with-ai-rust
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The tanstack-astryx-loco target drives the root's pipeline, which needs
      # the root's dependencies present. No Rust toolchain on the runner:
      # generation skips the `loco new` scaffold, and both crates are compiled
      # inside their images.
      - name: Install the root
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build core and the generator
        working-directory: .
        run: bun --filter @appwithai/core build && bun --filter @appwithai/generator build

      - name: Install the orchestrator's tooling
        working-directory: yaml/app-and-report-with-ai-rust/common
        run: bun install

      - name: Say what is being built
        run: |
          {
            echo "### Build inputs"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\` — the language, the generator, the orchestrator"
            echo "and the reporting platform all come from this one tree."
            echo ""
            echo "Model: \`${{ inputs.model || 'common/examples/crm.eml.yaml' }}\` · profile: \`${{ inputs.profile || 'demo' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A hosted runner starts with ~14 GB free, and this stack does not fit in
      # it: two Rust release builds (the generated Loco backend and the
      # platform's), two front ends with their node_modules, and the image
      # layers of all of them. The first run that got this far died on
      # "No space left on device" while copying the reporting front end's
      # node_modules into its runtime stage. The preinstalled toolchains below
      # are ~25 GB this job never uses.
      - name: Free disk space for the image builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup
          docker system prune -af --volumes >/dev/null
          df -h /

      # ── Injected configuration ──────────────────────────────────────────
      #
      # start.sh generates these secrets on first run and then leaves them
      # alone — regenerating ENCRYPTION_KEY would leave every stored data-source
      # password undecryptable, and the failure looks like a broken data source
      # rather than a rotated key. Writing the file first is therefore the
      # supported way to inject: start.sh finds it and keeps what is in it,
      # rewriting only the block it derives from the run.
      #
      # These are throwaway values for a runner that is destroyed at the end of
      # the job. A deployment would take them from `secrets` instead — the shape
      # of the file is the same either way.
      - name: Inject configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME"
          gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          {
            echo "# Written by .github/workflows/yaml-build-and-run.yml"
            echo "AUTH_SECRET=$(gen)"
            echo "ENCRYPTION_KEY=$(gen)"
            echo "JWT_SECRET=$(gen)"
            echo "REPORT_ADMIN_PASSWORD=$(gen)"
          } > "$RUNTIME/.env"
          chmod 600 "$RUNTIME/.env"

      # Checks the model, generates the application, puts it on /app, derives
      # the reporting pack, keeps the secrets just written, and brings the whole
      # stack up. Everything it writes stays under common/.runtime/.
      - name: Check, generate, configure and start
        run: ./start.sh "${{ inputs.model || 'common/examples/crm.eml.yaml' }}" --profile "${{ inputs.profile || 'demo' }}"

      # nginx is the front door and answers as soon as it is up, so its health
      # endpoint says nothing about either application behind it. Both are
      # polled on their own URL instead.
      - name: Wait for both applications to answer
        run: |
          set -euo pipefail
          wait_for() {
            local name="$1" url="$2" deadline=$((SECONDS + 600))
            echo "waiting for ${name} at ${url}"
            while [ "$SECONDS" -lt "$deadline" ]; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url" || echo 000)
              case "$code" in
                2*|3*) echo "  ${name} answered ${code}"; return 0 ;;
              esac
              sleep 5
            done
            echo "::error::${name} never answered at ${url} (last status ${code})"
            return 1
          }
          wait_for "the front door" http://localhost/healthz
          wait_for "the generated application" http://localhost/app/
          wait_for "the reporting platform" http://localhost/report/

      # Status codes alone do not settle it. An application served under a URL
      # prefix it was not built for answers a stylesheet request with its own
      # HTML fallback — 200 and all — and the page renders unstyled and inert
      # while every check above stays green. smoke.sh asserts the content type
      # of each asset the two pages actually reference, which is what catches
      # that.
      - name: Smoke-test both applications, content types included
        run: ORIGIN=http://localhost bash common/build/smoke.sh

      # The seeder is one shot: it registers the generated application's
      # database as a data source, caches its introspected schema, and writes
      # every saved query, report, chart and dashboard in the pack. Until it
      # exits 0, /report is up but empty — so a smoke test that only checked the
      # two URLs would pass on an empty platform.
      - name: Wait for the seeder to finish, and check it succeeded
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' \
              "$(docker compose --env-file "$RUNTIME/.env" ps -aq seeder)" 2>/dev/null || echo "missing:")
            case "$state" in
              exited:0) echo "the seeder finished cleanly"; exit 0 ;;
              exited:*) echo "::error::the seeder exited ${state#exited:}"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::the seeder never finished"
          exit 1

      - name: What the platform was loaded with
        run: |
          set -euo pipefail
          count() {
            docker compose --env-file "$RUNTIME/.env" exec -T \
              "$(docker compose --env-file "$RUNTIME/.env" ps --services | grep -E '^postgres' | head -1)" \
              psql -U "${REPORT_DB_USER:-app}" -d enterprise_config -tAc "select count(*) from $1" 2>/dev/null || echo "?"
          }
          {
            echo ""
            echo "### Loaded into the reporting platform"
            echo ""
            echo "| Table | Rows |"
            echo "|---|---|"
            for t in data_sources saved_queries report_definitions chart_definitions dashboard_layouts dashboard_widgets; do
              echo "| \`$t\` | $(count "$t") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every container's log, not just the failing one: the interesting
      # failures here are one service reacting to another (the backend not
      # migrating, so the seeder finds no bus_ tables and waits it out).
      - name: Logs
        if: always()
        run: |
          mkdir -p logs
          docker compose --env-file "$RUNTIME/.env" ps -a > logs/ps.txt 2>&1 || true
          # `config --services`, not `ps --services`: the latter lists running
          # services only, so the one that crashed — the one whose log is
          # wanted — was the one left out.
          for s in $(docker compose --env-file "$RUNTIME/.env" --profile "${{ inputs.profile || 'demo' }}" config --services 2>/dev/null); do
            docker compose --env-file "$RUNTIME/.env" logs --no-color --tail 2000 "$s" > "logs/$s.log" 2>&1 || true
          done
          # A failed run is diagnosed from the job log, not only from the
          # artifact: print every service's state and health, and the tail of
          # the log of each one that is not running and healthy.
          if [ "${{ job.status }}" != "success" ]; then
            cat logs/ps.txt
            for c in $(docker compose --env-file "$RUNTIME/.env" ps -aq 2>/dev/null); do
              state=$(docker inspect -f '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
              echo "$state"
              case "$state" in
                *"status=running"*"health=healthy"*|*"status=running"*"health=none"*) ;;
                *)
                  name=$(docker inspect -f '{{.Name}}' "$c")
                  echo "::group::last 80 lines of ${name#/}"
                  docker logs --tail 80 "$c" 2>&1 || true
                  docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' "$c" 2>/dev/null | tail -5 || true
                  echo "::endgroup::"
                  ;;
              esac
            done
          fi

      - name: Keep the logs and the generated application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-run-${{ github.run_id }}
          retention-days: 7
          # The generated source, not its node_modules or build output — the
          # point is to be able to read what the generator wrote.
          path: |
            yaml/app-and-report-with-ai-rust/logs/
            yaml/app-and-report-with-ai-rust/common/.runtime/pack/reporting-pack.json
            yaml/app-and-report-with-ai-rust/common/.runtime/app/**
            !yaml/app-and-report-with-ai-rust/common/.runtime/app/**/node_modules/**
            !yaml/app-and-report-with-ai-rust/common/.runtime/app/**/dist/**
            !yaml/app-and-report-with-ai-rust/common/.runtime/app/**/target/**

      - name: Stop everything
        if: always()
        run: ./stop.sh --volumes
