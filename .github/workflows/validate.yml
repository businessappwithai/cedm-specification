name: Validate CEDM Specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate CEDM model
        run: python tools/validate.py

      - name: The model is YAML, and nothing carries the earlier notation
        run: bash scripts/check-yaml-only.sh

      - name: No template filler in help (HELP-001)
        run: python tools/help_shapes.py --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Application models are in sync with the catalog
        run: bun scripts/build-domain-applications.ts --check
