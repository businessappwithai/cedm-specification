reports:
  # ---- The reporting pass (llmdetailed §10.5.1) -----------------------------

  # What the derived pack already gives this model without being asked: a
  # register per entity, a breakdown per enum-bound column, created-per-month,
  # a lifecycle report over all ten state machines in the diagram's own order,
  # and children-per-parent for all 52 relationships. None of that needed anyone
  # who has run a ward.

  # These do. Each of the eleven roles on the rbac matrix above is walked
  # through the four questions — what they open first, what tells them something
  # is wrong today, what they are asked for weekly, and what rots silently if
  # nobody looks — so each can do its whole job from what it can see.

  # -- receptionist: the front desk --------------------------------------------
  - name: front-desk-today
    title: Today's clinic list
    entity: Appointment
    help: "The desk's whole morning in one screen: who is expected, with which doctor, and whether they have arrived. Sorted by time because that is the order people walk in."
    sql: SELECT a.scheduled_at, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, s.first_name || ' ' || s.last_name AS doctor, a.appointment_type, a.status FROM bus_appointment a JOIN bus_patient p ON p.id = a.patient_id LEFT JOIN bus_doctor d ON d.id = a.doctor_id LEFT JOIN bus_staff s ON s.id = d.staff_id WHERE a.deleted_at IS NULL AND a.status IN ('requested', 'confirmed', 'checked_in') AND a.scheduled_at >= date_trunc('day', now()) AND a.scheduled_at < date_trunc('day', now()) + interval '1 day' ORDER BY a.scheduled_at
  - name: front-desk-unconfirmed
    title: Appointments nobody has confirmed
    entity: Appointment
    help: An appointment still merely requested two days out is a slot that will probably be wasted and a patient who does not know they are expected. Confirming it costs a phone call.
    sql: SELECT a.scheduled_at, a.appointment_number, p.first_name || ' ' || p.last_name AS patient, p.phone, a.appointment_type FROM bus_appointment a JOIN bus_patient p ON p.id = a.patient_id WHERE a.deleted_at IS NULL AND a.status = 'requested' AND a.scheduled_at BETWEEN now() AND now() + interval '48 hours' ORDER BY a.scheduled_at
  - name: front-desk-expiring-policies
    title: Insurance cover about to lapse
    entity: InsurancePolicy
    help: Cover that expires while a patient is mid-treatment turns into a bill the patient did not expect. The desk is the only place it can be caught before the invoice is raised.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, i.insurer_name, i.policy_number, i.valid_to, (i.valid_to - now()::date) AS days_left FROM bus_insurance_policy i JOIN bus_patient p ON p.id = i.patient_id WHERE i.deleted_at IS NULL AND i.status = 'active' AND i.valid_to BETWEEN now()::date AND (now() + interval '30 days')::date ORDER BY i.valid_to
  - name: front-desk-repeat-no-shows
    title: Patients who repeatedly do not attend
    entity: Patient
    chart: bar
    x: patient
    y: no_shows
    help: Three missed appointments is a pattern, not bad luck — usually transport, or a number that has changed. Worth a different kind of booking rather than another letter.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, p.phone, COUNT(*) AS no_shows FROM bus_appointment a JOIN bus_patient p ON p.id = a.patient_id WHERE a.deleted_at IS NULL AND a.status = 'no_show' AND a.scheduled_at > now() - interval '180 days' GROUP BY p.id, p.medical_record_number, p.first_name, p.last_name, p.phone HAVING COUNT(*) >= 3 ORDER BY no_shows DESC
  # -- nurse: the patients in front of them ------------------------------------
  - name: nurse-deteriorating-patients
    title: Patients with a high early warning score
    entity: VitalSign
    help: The single most important screen in this application. An early warning score of five or more is the threshold at which a nurse escalates, and the most recent observation is the only one that matters.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, w.name AS ward, v.early_warning_score AS news, v.pulse_bpm, v.systolic_bp, v.oxygen_saturation, v.recorded_at FROM bus_vital_sign v JOIN bus_encounter e ON e.id = v.encounter_id JOIN bus_patient p ON p.id = e.patient_id LEFT JOIN bus_admission ad ON ad.encounter_id = e.id AND ad.deleted_at IS NULL AND ad.status IN ('admitted', 'on_ward', 'discharge_planned') LEFT JOIN bus_ward w ON w.id = ad.ward_id WHERE v.deleted_at IS NULL AND v.early_warning_score >= 5 AND v.recorded_at > now() - interval '24 hours' ORDER BY v.early_warning_score DESC, v.recorded_at DESC
  - name: nurse-observations-overdue
    title: Inpatients with no recent observations
    entity: Admission
    help: The absence that kills. A patient on a ward with no vital signs recorded for eight hours has not been assessed, and nothing on the patient screen says so — only the gap does.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, w.name AS ward, b.bed_code, MAX(v.recorded_at) AS last_observation FROM bus_admission a JOIN bus_patient p ON p.id = a.patient_id JOIN bus_encounter e ON e.id = a.encounter_id LEFT JOIN bus_ward w ON w.id = a.ward_id LEFT JOIN bus_bed b ON b.id = a.bed_id LEFT JOIN bus_vital_sign v ON v.encounter_id = e.id AND v.deleted_at IS NULL WHERE a.deleted_at IS NULL AND a.status IN ('admitted', 'on_ward') GROUP BY a.id, p.medical_record_number, p.first_name, p.last_name, w.name, b.bed_code HAVING MAX(v.recorded_at) IS NULL OR MAX(v.recorded_at) < now() - interval '8 hours' ORDER BY last_observation NULLS FIRST
  - name: nurse-critical-results-unseen
    title: Critical results nobody has verified
    entity: LabResult
    help: A critical value that has been resulted but not verified is a number the laboratory has flagged and the ward has not read. This is the gap that incident reports are written about.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, l.analyte, l.value_numeric, l.unit, l.abnormal_flag, l.resulted_at FROM bus_lab_result l JOIN bus_lab_order o ON o.id = l.lab_order_id JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE l.deleted_at IS NULL AND l.abnormal_flag IN ('critical_low', 'critical_high') AND l.verified_at IS NULL ORDER BY l.resulted_at
  - name: nurse-high-alert-medicines
    title: High-alert medicines without a second check
    entity: PrescriptionItem
    help: The model requires a second signature on high-alert drugs. This lists the ones dispensed without it — a control that only means something if somebody counts the exceptions.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, m.name AS medication, i.dose, i.route, i.frequency, r.status FROM bus_prescription_item i JOIN bus_prescription r ON r.id = i.prescription_id JOIN bus_encounter e ON e.id = r.encounter_id JOIN bus_patient p ON p.id = e.patient_id JOIN bus_medication m ON m.id = i.medication_id WHERE i.deleted_at IS NULL AND i.is_high_alert AND i.second_check_by_id IS NULL AND r.status IN ('verified', 'dispensed', 'collected') ORDER BY r.prescribed_at DESC
  - name: nurse-allergy-alerts
    title: Inpatients with recorded allergies
    entity: Patient
    help: Carried at handover and checked before every administration. Free text on purpose, because an allergy nobody could code is still an allergy that will hurt somebody.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, w.name AS ward, b.bed_code, p.known_allergies FROM bus_admission a JOIN bus_patient p ON p.id = a.patient_id LEFT JOIN bus_ward w ON w.id = a.ward_id LEFT JOIN bus_bed b ON b.id = a.bed_id WHERE a.deleted_at IS NULL AND a.status IN ('admitted', 'on_ward', 'discharge_planned') AND p.known_allergies IS NOT NULL AND p.known_allergies <> '' ORDER BY w.name, b.bed_code
  # -- doctor: their own patients and what is outstanding ----------------------
  - name: doctor-results-awaiting-review
    title: Results back and not yet acted on
    entity: LabOrder
    help: The ordering doctor's outstanding list. A result that arrives while the doctor is in theatre is read hours later or not at all, and the order screen does not distinguish resulted from reviewed.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, o.test_name, o.priority, o.ordered_at, MAX(l.resulted_at) AS resulted_at FROM bus_lab_order o JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id JOIN bus_lab_result l ON l.lab_order_id = o.id AND l.deleted_at IS NULL WHERE o.deleted_at IS NULL AND o.status = 'resulted' GROUP BY o.id, p.medical_record_number, p.first_name, p.last_name, o.test_name, o.priority, o.ordered_at ORDER BY o.priority DESC, resulted_at
  - name: doctor-critical-imaging
    title: Imaging reported as critical
    entity: ImagingReport
    help: A critical radiology finding is a phone call, not a document. This is the list that proves the call was possible; whether it was made is the conversation it starts.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, o.modality, o.body_part, r.reported_at, r.impression FROM bus_imaging_report r JOIN bus_imaging_order o ON o.id = r.imaging_order_id JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE r.deleted_at IS NULL AND r.is_critical AND r.reported_at > now() - interval '7 days' ORDER BY r.reported_at DESC
  - name: doctor-open-encounters
    title: Encounters left open
    entity: Encounter
    help: An encounter that was never closed keeps a patient nominally under care and blocks the invoice behind it. They accumulate silently, and the clinician who opened it is the only one who can close it.
    sql: SELECT e.encounter_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, s.first_name || ' ' || s.last_name AS doctor, e.encounter_type, e.started_at, EXTRACT(day FROM now() - e.started_at)::int AS days_open FROM bus_encounter e JOIN bus_patient p ON p.id = e.patient_id LEFT JOIN bus_doctor d ON d.id = e.doctor_id LEFT JOIN bus_staff s ON s.id = d.staff_id WHERE e.deleted_at IS NULL AND e.status IN ('open', 'in_progress') AND e.started_at < now() - interval '3 days' ORDER BY days_open DESC
  - name: doctor-procedures-without-consent
    title: Procedures with no valid consent
    entity: Procedure
    help: A procedure planned or consented whose consent is missing or withdrawn. It is a stop, not a warning, and it is the one thing that must be checked before the patient is on the table.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, pr.name AS procedure_name, pr.status, pr.scheduled_for FROM bus_procedure pr JOIN bus_encounter e ON e.id = pr.encounter_id JOIN bus_patient p ON p.id = e.patient_id LEFT JOIN bus_consent c ON c.procedure_id = pr.id AND c.deleted_at IS NULL AND NOT c.is_withdrawn WHERE pr.deleted_at IS NULL AND pr.status IN ('planned', 'consented', 'in_progress') GROUP BY pr.id, p.medical_record_number, p.first_name, p.last_name, pr.name, pr.status, pr.scheduled_for HAVING COUNT(c.id) = 0 ORDER BY pr.scheduled_for
  - name: doctor-stat-orders-waiting
    title: Urgent and stat orders still waiting
    entity: LabOrder
    help: Stat means now. An order still uncollected an hour after it was raised has lost the reason it was marked urgent, and nobody is told — the order simply sits.
    sql: SELECT o.order_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, o.test_name, o.priority, o.status, o.ordered_at, EXTRACT(epoch FROM now() - o.ordered_at)/3600 AS hours_waiting FROM bus_lab_order o JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE o.deleted_at IS NULL AND o.priority IN ('urgent', 'stat') AND o.status IN ('requested', 'collected', 'in_lab') AND o.ordered_at < now() - interval '1 hour' ORDER BY o.priority DESC, o.ordered_at
  # -- ward_manager: beds, flow and the ward's own stock -----------------------
  - name: ward-bed-state
    title: Beds by ward and what they are doing
    entity: Bed
    chart: bar
    x: ward
    y: available
    help: The bed manager's whole job in one row per ward. Available against capacity, with cleaning counted separately because a bed waiting to be cleaned is capacity that exists but cannot be used yet.
    sql: SELECT w.name AS ward, w.ward_type, w.bed_capacity AS capacity, COUNT(*) FILTER (WHERE b.status = 'available') AS available, COUNT(*) FILTER (WHERE b.status = 'occupied') AS occupied, COUNT(*) FILTER (WHERE b.status = 'cleaning') AS cleaning, COUNT(*) FILTER (WHERE b.status = 'closed') AS closed FROM bus_ward w LEFT JOIN bus_bed b ON b.ward_id = w.id AND b.deleted_at IS NULL AND b.is_active WHERE w.deleted_at IS NULL AND w.is_active GROUP BY w.id, w.name, w.ward_type, w.bed_capacity ORDER BY available
  - name: ward-beds-awaiting-cleaning
    title: Beds waiting to be cleaned
    entity: Bed
    help: Every one is a patient who could be admitted and is not. Hours since last cleaned is the argument for another domestic, and it exists nowhere except here.
    sql: SELECT w.name AS ward, b.bed_code, b.bed_type, b.last_cleaned_at, ROUND(EXTRACT(epoch FROM now() - b.last_cleaned_at)/3600) AS hours_waiting FROM bus_bed b JOIN bus_ward w ON w.id = b.ward_id WHERE b.deleted_at IS NULL AND b.is_active AND b.status = 'cleaning' ORDER BY b.last_cleaned_at
  - name: ward-discharges-overdue
    title: Inpatients past their expected discharge
    entity: Admission
    help: A stay that has run past its expected discharge date is either a patient who got worse or a discharge nobody organised. The two need different people, and both need finding today.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, w.name AS ward, b.bed_code, a.admitted_at, a.expected_discharge_date, (now()::date - a.expected_discharge_date) AS days_over FROM bus_admission a JOIN bus_patient p ON p.id = a.patient_id LEFT JOIN bus_ward w ON w.id = a.ward_id LEFT JOIN bus_bed b ON b.id = a.bed_id WHERE a.deleted_at IS NULL AND a.status IN ('admitted', 'on_ward', 'discharge_planned') AND a.expected_discharge_date < now()::date ORDER BY days_over DESC
  - name: ward-long-stays
    title: The longest current stays
    entity: Admission
    chart: bar
    x: patient
    y: days
    help: Length of stay is the measure a hospital is judged on and the one nobody sees day to day, because each ward only sees its own. Sorted longest first, which is where the delayed discharges are.
    sql: SELECT p.first_name || ' ' || p.last_name AS patient, w.name AS ward, a.admission_type, a.admitted_at, EXTRACT(day FROM now() - a.admitted_at)::int AS days FROM bus_admission a JOIN bus_patient p ON p.id = a.patient_id LEFT JOIN bus_ward w ON w.id = a.ward_id WHERE a.deleted_at IS NULL AND a.status IN ('admitted', 'on_ward', 'discharge_planned') ORDER BY days DESC
  # -- lab_technician: the specimens in the laboratory -------------------------
  - name: lab-collection-queue
    title: Specimens ordered and not collected
    entity: LabOrder
    help: The round the phlebotomist walks. Priority first, then age, because a stat sample taken late is a stat sample wasted.
    sql: SELECT o.order_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, o.test_name, o.specimen_type, o.priority, o.ordered_at FROM bus_lab_order o JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE o.deleted_at IS NULL AND o.status = 'requested' ORDER BY CASE o.priority WHEN 'stat' THEN 1 WHEN 'urgent' THEN 2 ELSE 3 END, o.ordered_at
  - name: lab-samples-in-lab-too-long
    title: Specimens sitting in the laboratory
    entity: LabOrder
    help: Collected, delivered, and then nothing. A specimen in the lab for over a day is either lost or degrading, and both are found by looking at the clock rather than at the sample.
    sql: SELECT o.order_number, o.test_name, o.specimen_type, o.priority, o.collected_at, EXTRACT(day FROM now() - o.collected_at)::int AS days_in_lab FROM bus_lab_order o WHERE o.deleted_at IS NULL AND o.status IN ('collected', 'in_lab') AND o.collected_at < now() - interval '24 hours' ORDER BY days_in_lab DESC
  - name: lab-results-unverified
    title: Results resulted but not verified
    entity: LabResult
    help: The laboratory's own outstanding queue. A result nobody has verified is not yet a result, and the ward is treating it as one.
    sql: SELECT o.order_number, l.analyte, l.value_numeric, l.unit, l.abnormal_flag, l.resulted_at, EXTRACT(epoch FROM now() - l.resulted_at)/3600 AS hours_unverified FROM bus_lab_result l JOIN bus_lab_order o ON o.id = l.lab_order_id WHERE l.deleted_at IS NULL AND l.verified_at IS NULL AND l.resulted_at IS NOT NULL ORDER BY l.resulted_at
  # -- radiologist: the reporting worklist -------------------------------------
  - name: imaging-unreported-studies
    title: Studies performed and not reported
    entity: ImagingOrder
    help: The reporting backlog, which is the number that decides whether a scanner slot was worth using. A performed study without a report has cost everything and delivered nothing.
    sql: SELECT o.order_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, o.modality, o.body_part, o.priority, o.performed_at, EXTRACT(day FROM now() - o.performed_at)::int AS days_unreported FROM bus_imaging_order o JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE o.deleted_at IS NULL AND o.status = 'performed' AND o.performed_at IS NOT NULL ORDER BY CASE o.priority WHEN 'stat' THEN 1 WHEN 'urgent' THEN 2 ELSE 3 END, o.performed_at
  - name: imaging-unscheduled-requests
    title: Imaging requested and never scheduled
    entity: ImagingOrder
    help: A request that never became an appointment. The ordering doctor believes it is booked; nothing tells them otherwise until they ask for the result.
    sql: SELECT o.order_number, p.first_name || ' ' || p.last_name AS patient, o.modality, o.body_part, o.priority, o.is_escalated, o.ordered_at FROM bus_imaging_order o JOIN bus_encounter e ON e.id = o.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE o.deleted_at IS NULL AND o.status = 'requested' AND o.ordered_at < now() - interval '48 hours' ORDER BY o.ordered_at
  - name: imaging-workload-by-modality
    title: Studies reported by modality
    entity: ImagingOrder
    chart: bar
    x: modality
    y: reported
    help: What the department actually did last month, which is how the next rota and the next business case are argued. Contrast studies counted separately because they cost more of everything.
    sql: SELECT o.modality, COUNT(*) AS reported, COUNT(*) FILTER (WHERE o.contrast_used) AS with_contrast FROM bus_imaging_order o WHERE o.deleted_at IS NULL AND o.status = 'reported' AND o.performed_at > now() - interval '30 days' GROUP BY o.modality ORDER BY reported DESC
  # -- pharmacist: what is being prescribed and dispensed ----------------------
  - name: pharmacy-verification-queue
    title: Prescriptions waiting for a pharmacist
    entity: Prescription
    help: The queue the pharmacy works from. Controlled items are called out because they carry a different check and cannot simply be worked in order.
    sql: SELECT r.prescription_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, r.has_controlled_item, r.is_discharge_prescription, r.prescribed_at, EXTRACT(epoch FROM now() - r.prescribed_at)/3600 AS hours_waiting FROM bus_prescription r JOIN bus_encounter e ON e.id = r.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE r.deleted_at IS NULL AND r.status = 'prescribed' ORDER BY r.has_controlled_item DESC, r.prescribed_at
  - name: pharmacy-discharge-delays
    title: Discharge prescriptions holding up a bed
    entity: Prescription
    help: The commonest reason a discharge slips past midday. The bed cannot be released until the medicines are dispensed, and the ward has no way to see where in the pharmacy the prescription is.
    sql: SELECT r.prescription_number, p.first_name || ' ' || p.last_name AS patient, w.name AS ward, r.status, r.prescribed_at FROM bus_prescription r JOIN bus_encounter e ON e.id = r.encounter_id JOIN bus_patient p ON p.id = e.patient_id LEFT JOIN bus_admission a ON a.encounter_id = e.id AND a.deleted_at IS NULL LEFT JOIN bus_ward w ON w.id = a.ward_id WHERE r.deleted_at IS NULL AND r.is_discharge_prescription AND r.status IN ('prescribed', 'verified') ORDER BY r.prescribed_at
  - name: pharmacy-controlled-drugs
    title: Controlled medicines dispensed
    entity: PrescriptionItem
    help: The register that has to balance. Every controlled item dispensed, with who prescribed and who dispensed it, because that pairing is exactly what an inspection asks to see.
    sql: SELECT r.prescription_number, m.name AS medication, m.strength, i.quantity, s1.first_name || ' ' || s1.last_name AS prescribed_by, s2.first_name || ' ' || s2.last_name AS dispensed_by, r.dispensed_at FROM bus_prescription_item i JOIN bus_prescription r ON r.id = i.prescription_id JOIN bus_medication m ON m.id = i.medication_id LEFT JOIN bus_staff s1 ON s1.id = r.prescribed_by_id LEFT JOIN bus_staff s2 ON s2.id = r.dispensed_by_id WHERE i.deleted_at IS NULL AND m.is_controlled AND r.status IN ('dispensed', 'collected') AND r.dispensed_at > now() - interval '90 days' ORDER BY r.dispensed_at DESC
  - name: pharmacy-stock-cover
    title: Medicines with no stock behind them
    entity: Medication
    help: A medicine on the formulary whose inventory item is at or below its reorder level. It will be prescribed today and refused at the counter, and the prescriber will not know why.
    sql: SELECT m.name AS medication, m.strength, m.form, v.quantity_on_hand, v.reorder_level, v.is_on_reorder FROM bus_medication m JOIN bus_inventory_item v ON v.id = m.inventory_item_id WHERE m.deleted_at IS NULL AND v.deleted_at IS NULL AND m.is_active AND v.quantity_on_hand <= v.reorder_level ORDER BY v.quantity_on_hand
  # -- inventory_manager: stock, suppliers and expiry --------------------------
  - name: stock-below-reorder
    title: Items at or below reorder level
    entity: InventoryItem
    chart: bar
    x: item
    y: on_hand
    help: The order that has to go out today. Lead time is shown because an item three days from empty with a fourteen-day supplier is already a shortage, whatever the level says.
    sql: SELECT v.code, v.name AS item, v.category, v.quantity_on_hand AS on_hand, v.reorder_level, v.reorder_quantity, s.name AS supplier, s.lead_time_days FROM bus_inventory_item v LEFT JOIN bus_supplier s ON s.id = v.supplier_id WHERE v.deleted_at IS NULL AND v.is_active AND v.quantity_on_hand <= v.reorder_level ORDER BY (v.quantity_on_hand - v.reorder_level), s.lead_time_days DESC
  - name: stock-expiring-batches
    title: Batches about to expire
    entity: StockTransaction
    help: Stock that will have to be destroyed if it is not used first. Cold chain items are flagged because they are the expensive ones and the ones that cannot be moved to another site.
    sql: SELECT v.name AS item, v.category, t.batch_number, t.expiry_date, t.quantity, v.requires_cold_chain, t.occurred_on FROM bus_stock_transaction t JOIN bus_inventory_item v ON v.id = t.inventory_item_id WHERE t.deleted_at IS NULL AND t.transaction_type = 'receipt' AND t.expiry_date IS NOT NULL AND t.expiry_date BETWEEN now()::date AND (now() + interval '90 days')::date ORDER BY t.expiry_date
  - name: stock-consumption-by-ward
    title: What each ward is using
    entity: StockTransaction
    chart: bar
    x: ward
    y: issued
    help: Where the consumables actually go, which is the only basis on which a ward budget can be argued. Issues only, over a quarter, so one heavy week does not distort it.
    sql: SELECT w.name AS ward, SUM(t.quantity) AS issued, COUNT(DISTINCT t.inventory_item_id) AS distinct_items FROM bus_stock_transaction t JOIN bus_ward w ON w.id = t.ward_id WHERE t.deleted_at IS NULL AND t.transaction_type = 'issue' AND t.occurred_on > now()::date - 90 GROUP BY w.id, w.name ORDER BY issued DESC
  # -- billing_clerk: what has been billed and what has been paid --------------
  - name: billing-overdue-invoices
    title: Invoices past their due date
    entity: Invoice
    chart: bar
    x: status
    y: outstanding
    help: The ledger the finance office works from. Outstanding rather than gross, because what matters is what is still owed, not what was once charged.
    sql: SELECT i.status, COUNT(*) AS invoices, SUM(i.gross_amount - i.paid_amount) AS outstanding FROM bus_invoice i WHERE i.deleted_at IS NULL AND i.status IN ('issued', 'submitted', 'part_paid', 'overdue') AND i.due_on < now()::date GROUP BY i.status ORDER BY outstanding DESC
  - name: billing-unverified-policies
    title: Invoices raised against unverified cover
    entity: Invoice
    help: An invoice sent to an insurer without the policy having been checked is a rejection waiting to happen, and a rejection is thirty days lost before anyone starts again.
    sql: SELECT i.invoice_number, p.first_name || ' ' || p.last_name AS patient, i.insurer_amount, i.status, i.issued_on FROM bus_invoice i JOIN bus_patient p ON p.id = i.patient_id WHERE i.deleted_at IS NULL AND NOT i.policy_verified AND i.insurer_amount > 0 AND i.status IN ('issued', 'submitted') ORDER BY i.insurer_amount DESC
  - name: billing-unbilled-encounters
    title: Billable encounters with no invoice
    entity: Encounter
    help: Work done and never charged for. It is the largest single leak in a hospital's income and it is invisible from every screen, because nothing shows the absence of an invoice.
    sql: SELECT e.encounter_number, p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, e.encounter_type, e.started_at, e.ended_at FROM bus_encounter e JOIN bus_patient p ON p.id = e.patient_id LEFT JOIN bus_invoice i ON i.encounter_id = e.id AND i.deleted_at IS NULL WHERE e.deleted_at IS NULL AND e.is_billable AND e.status = 'closed' AND e.ended_at < now() - interval '7 days' GROUP BY e.id, e.encounter_number, p.medical_record_number, p.first_name, p.last_name, e.encounter_type, e.started_at, e.ended_at HAVING COUNT(i.id) = 0 ORDER BY e.ended_at
  - name: billing-rejected-claims
    title: Claims the insurer sent back
    entity: Invoice
    help: Every rejection is money already earned and not collected, and it has a clock on it. Read weekly it is a work list; read monthly it is a write-off.
    sql: SELECT i.invoice_number, p.first_name || ' ' || p.last_name AS patient, ip.insurer_name, i.insurer_amount, i.issued_on, i.notes FROM bus_invoice i JOIN bus_patient p ON p.id = i.patient_id LEFT JOIN bus_insurance_policy ip ON ip.id = i.insurance_policy_id WHERE i.deleted_at IS NULL AND i.status = 'rejected' ORDER BY i.insurer_amount DESC
  - name: billing-collections-by-method
    title: Money collected, by how it arrived
    entity: Payment
    chart: bar
    x: method
    y: collected
    help: Cash handling, card fees and insurer settlement behave differently and are reconciled differently. Split by method this is a reconciliation; totalled it is a number nobody can check.
    sql: SELECT y.method, y.payer_type, COUNT(*) AS payments, SUM(y.amount) AS collected FROM bus_payment y WHERE y.deleted_at IS NULL AND y.received_on > now()::date - 90 GROUP BY y.method, y.payer_type ORDER BY collected DESC
  # -- hospital_manager: whether the hospital is coping ------------------------
  - name: manager-occupancy-by-ward
    title: Occupancy against capacity
    entity: Ward
    chart: bar
    x: ward
    y: occupancy_pct
    help: The board's number. Anything sustained above ninety per cent means no headroom for an emergency admission, which is when a hospital starts diverting.
    sql: SELECT w.name AS ward, w.ward_type, w.bed_capacity AS capacity, COUNT(*) FILTER (WHERE b.status = 'occupied') AS occupied, ROUND(100.0 * COUNT(*) FILTER (WHERE b.status = 'occupied') / NULLIF(w.bed_capacity, 0)) AS occupancy_pct FROM bus_ward w LEFT JOIN bus_bed b ON b.ward_id = w.id AND b.deleted_at IS NULL AND b.is_active WHERE w.deleted_at IS NULL AND w.is_active GROUP BY w.id, w.name, w.ward_type, w.bed_capacity ORDER BY occupancy_pct DESC
  - name: manager-revenue-by-month
    title: Money collected by month
    entity: Payment
    chart: line
    x: month
    y: collected
    help: Cash actually received rather than invoiced, which is the only version of the number a finance director will accept. Twelve months, so seasonality is visible rather than surprising.
    sql: SELECT to_char(date_trunc('month', y.received_on), 'YYYY-MM') AS month, SUM(y.amount) AS collected, COUNT(*) AS payments FROM bus_payment y WHERE y.deleted_at IS NULL AND y.received_on > now()::date - 365 GROUP BY 1 ORDER BY 1
  - name: manager-cancelled-appointments
    title: Appointments cancelled or missed
    entity: Appointment
    chart: bar
    x: department
    y: lost
    help: "Capacity paid for and not used, by department. The split between cancelled and no-show matters: one is a scheduling problem, the other is a patient-contact problem."
    sql: SELECT d.name AS department, COUNT(*) FILTER (WHERE a.status = 'cancelled') AS cancelled, COUNT(*) FILTER (WHERE a.status = 'no_show') AS no_shows, COUNT(*) AS lost FROM bus_appointment a LEFT JOIN bus_department d ON d.id = a.department_id WHERE a.deleted_at IS NULL AND a.status IN ('cancelled', 'no_show') AND a.scheduled_at > now() - interval '90 days' GROUP BY d.id, d.name ORDER BY lost DESC
  - name: manager-readmissions
    title: Patients readmitted within thirty days
    entity: Admission
    help: The quality measure that regulators and funders both use. A readmission inside a month usually means the first discharge was too early or the follow-up never happened.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, a1.discharged_at AS first_discharge, a2.admitted_at AS readmitted, EXTRACT(day FROM a2.admitted_at - a1.discharged_at)::int AS days_between FROM bus_admission a1 JOIN bus_admission a2 ON a2.patient_id = a1.patient_id AND a2.admitted_at > a1.discharged_at AND a2.admitted_at < a1.discharged_at + interval '30 days' JOIN bus_patient p ON p.id = a1.patient_id WHERE a1.deleted_at IS NULL AND a2.deleted_at IS NULL AND a1.status = 'discharged' AND a1.discharged_at IS NOT NULL ORDER BY a2.admitted_at DESC
  - name: manager-uninsured-exposure
    title: Charges with no insurance behind them
    entity: Invoice
    help: What the hospital is carrying itself. A large patient-payable balance is either a payment plan nobody has set up or a debt that will not be collected, and both need deciding rather than discovering.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, i.invoice_number, i.gross_amount, i.patient_amount, i.paid_amount, i.status, i.due_on FROM bus_invoice i JOIN bus_patient p ON p.id = i.patient_id WHERE i.deleted_at IS NULL AND i.insurer_amount = 0 AND i.patient_amount > 0 AND i.status NOT IN ('paid', 'cancelled', 'written_off') ORDER BY i.patient_amount DESC
  # -- administrator: what nobody else can see ---------------------------------
  - name: admin-records-without-owner
    title: Clinical records with no responsible clinician
    entity: Encounter
    help: An encounter with no doctor answers to nobody and appears on no consultant's list. It is not visible from inside any single screen, which is why only an administrator ever finds it.
    sql: SELECT 'Encounter' AS record_type, COUNT(*) AS records FROM bus_encounter WHERE deleted_at IS NULL AND doctor_id IS NULL UNION ALL SELECT 'Appointment', COUNT(*) FROM bus_appointment WHERE deleted_at IS NULL AND doctor_id IS NULL UNION ALL SELECT 'Admission (no bed)', COUNT(*) FROM bus_admission WHERE deleted_at IS NULL AND status IN ('admitted', 'on_ward') AND bed_id IS NULL UNION ALL SELECT 'Procedure', COUNT(*) FROM bus_procedure WHERE deleted_at IS NULL AND doctor_id IS NULL ORDER BY records DESC
  - name: admin-inactive-staff-with-work
    title: Departed staff still attached to open work
    entity: Staff
    help: When somebody leaves, their patients do not. Every row is work that has no living owner, and it is found only by joining the staff record to the things it is still named on.
    sql: SELECT s.staff_number, s.first_name || ' ' || s.last_name AS staff, s.staff_role, COUNT(e.id) AS open_encounters FROM bus_staff s JOIN bus_doctor d ON d.staff_id = s.id AND d.deleted_at IS NULL JOIN bus_encounter e ON e.doctor_id = d.id AND e.deleted_at IS NULL AND e.status IN ('open', 'in_progress') WHERE s.deleted_at IS NULL AND NOT s.is_active GROUP BY s.id, s.staff_number, s.first_name, s.last_name, s.staff_role ORDER BY open_encounters DESC
  - name: admin-consent-withdrawn
    title: Consent withdrawn after the fact
    entity: Consent
    help: A withdrawal recorded against a procedure that has already been performed is the most serious record pairing in this application. Rare, and every instance needs reading rather than counting.
    sql: SELECT p.medical_record_number, p.first_name || ' ' || p.last_name AS patient, pr.name AS procedure_name, pr.status, pr.performed_at, c.withdrawn_at, c.notes FROM bus_consent c JOIN bus_procedure pr ON pr.id = c.procedure_id JOIN bus_encounter e ON e.id = pr.encounter_id JOIN bus_patient p ON p.id = e.patient_id WHERE c.deleted_at IS NULL AND c.is_withdrawn AND pr.performed_at IS NOT NULL AND c.withdrawn_at > pr.performed_at ORDER BY c.withdrawn_at DESC
rules:
  - name: appointmentSlotGate
    title: Appointment Slot Gate
    entity: Appointment
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Booking requested"
        type: start
      - id: D
        label: slot in the past?
        type: decision
      - id: E
        label: Refuse the booking
        type: expression
      - id: F
        label: Accept the booking
        type: expression
      - id: G
        label: Refused
        type: end
      - id: H
        label: Booked
        type: end
    edges:
      - from: A
        to: D
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: E
        to: G
      - from: F
        to: H
    actions:
      - name: refusePastSlot
        type: validation-error
        when: scheduled_at < now
        props:
          message: An appointment cannot be booked in the past.
  - name: dischargeSummaryGate
    title: Discharge Summary Gate
    entity: Admission
    event: beforeUpdate
    priority: 20
    nodes:
      - id: A
        label: "Start: Admission being discharged"
        type: start
      - id: B
        label: status becoming discharged?
        type: decision
      - id: E
        label: Allow the change
        type: expression
      - id: C
        label: discharge summary written?
        type: decision
      - id: D
        label: Refuse the discharge
        type: expression
      - id: F
        label: Refused
        type: end
      - id: G
        label: Allowed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: E
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: D
        label: No
      - from: C
        to: E
        label: Yes
      - from: D
        to: F
      - from: E
        to: G
    actions:
      - name: requireDischargeSummary
        type: validation-error
        when: status == 'discharged' and discharge_summary == null
        props:
          message: Write the discharge summary before discharging. A patient sent home without one leaves their GP with nothing.
  - name: labResultValueGate
    title: Lab Result Value Gate
    entity: LabResult
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Result being recorded"
        type: start
      - id: B
        label: a numeric value?
        type: decision
      - id: F
        label: Record the result
        type: expression
      - id: C
        label: a text value?
        type: decision
      - id: D
        label: Refuse the result
        type: expression
      - id: G
        label: Refused
        type: end
      - id: H
        label: Recorded
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: F
        label: Yes
      - from: B
        to: C
        label: No
      - from: C
        to: F
        label: Yes
      - from: C
        to: D
        label: No
      - from: D
        to: G
      - from: F
        to: H
    actions:
      - name: requireResultValue
        type: validation-error
        when: value_numeric == null and value_text == null
        props:
          message: A result must carry a value — a number with its unit, or the words the laboratory reported. An empty result is an order that has not come back yet.
  - name: criticalResultGate
    title: Critical Result Gate
    entity: LabResult
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Result recorded"
        type: start
      - id: B
        label: flagged critical?
        type: decision
      - id: E
        label: File the result
        type: expression
      - id: C
        label: Escalate the request
        type: expression
      - id: D
        label: Escalated
        type: end
      - id: F
        label: Filed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: E
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: D
      - from: E
        to: F
    actions:
      - name: escalateCriticalResult
        type: trigger-workflow
        when: abnormal_flag == 'critical_high' or abnormal_flag == 'critical_low'
        props:
          workflow: CriticalResultEscalation
          message: A critical value has to be told to the requesting clinician now, not read at the next ward round.
  - name: criticalFindingGate
    title: Critical Finding Gate
    entity: ImagingReport
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Report signed"
        type: start
      - id: B
        label: marked critical?
        type: decision
      - id: E
        label: File the report
        type: expression
      - id: C
        label: Escalate the study
        type: expression
      - id: D
        label: Escalated
        type: end
      - id: F
        label: Filed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: E
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: D
      - from: E
        to: F
    actions:
      - name: escalateCriticalFinding
        type: trigger-workflow
        when: is_critical == true
        props:
          workflow: CriticalFindingEscalation
          message: A critical imaging finding has to be told to the requesting clinician now, not left in the report for them to find.
  - name: controlledDrugSegregation
    title: Controlled Drug Segregation
    entity: Prescription
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Prescription being dispensed"
        type: start
      - id: B
        label: status becoming dispensed?
        type: decision
      - id: F
        label: Allow the change
        type: expression
      - id: C
        label: a controlled drug on it?
        type: decision
      - id: D
        label: dispenser is the prescriber?
        type: decision
      - id: E
        label: Refuse the dispense
        type: expression
      - id: G
        label: Refused
        type: end
      - id: H
        label: Allowed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: F
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: F
        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: E
        to: G
      - from: F
        to: H
    actions:
      - name: refuseSelfDispense
        type: validation-error
        when: status == 'dispensed' and has_controlled_item == true and dispensed_by_id == prescribed_by_id
        props:
          message: A controlled drug cannot be dispensed by the person who prescribed it. Ask a second member of staff to dispense.
  - name: highAlertCheckGate
    title: High Alert Check Gate
    entity: PrescriptionItem
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Item being added"
        type: start
      - id: D
        label: high-alert medicine?
        type: decision
      - id: F
        label: Add the item
        type: expression
      - id: E
        label: second check recorded?
        type: decision
      - id: C
        label: Refuse the item
        type: expression
      - id: G
        label: Refused
        type: end
      - id: H
        label: Added
        type: end
    edges:
      - from: A
        to: D
      - from: D
        to: F
        label: No
      - from: D
        to: E
        label: Yes
      - from: E
        to: C
        label: No
      - from: E
        to: F
        label: Yes
      - from: C
        to: G
      - from: F
        to: H
    actions:
      - name: requireSecondCheck
        type: validation-error
        when: is_high_alert == true and second_check_by_id == null
        props:
          message: A high-alert medicine needs a second qualified check before it goes on the prescription.
  - name: invoiceIssueGate
    title: Invoice Issue Gate
    entity: Invoice
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Bill being issued"
        type: start
      - id: B
        label: status becoming issued?
        type: decision
      - id: G
        label: Allow the change
        type: expression
      - id: C
        label: policy valid on the charge dates?
        type: decision
      - id: F
        label: Refuse the issue
        type: expression
      - id: D
        label: insurer and patient shares add up?
        type: decision
      - id: E
        label: marked overdue before its due date?
        type: decision
      - id: H
        label: Refused
        type: end
      - id: I
        label: Allowed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: G
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: F
        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: F
        label: No
      - from: D
        to: E
        label: Yes
      - from: E
        to: F
        label: Yes
      - from: E
        to: G
        label: No
      - from: F
        to: H
      - from: G
        to: I
    actions:
      - name: refuseInvalidPolicy
        type: validation-error
        when: status == 'issued' and insurance_policy_id != null and policy_verified == false
        props:
          message: The policy on this bill is not active for the dates being charged. Correct the cover, or bill the patient directly.
      - name: refuseUnbalancedSplit
        type: validation-error
        when: status == 'issued' and insurer_amount + patient_amount != gross_amount
        props:
          message: The insurer's share and the patient's share do not add up to the total. The co-payment has not been applied.
      - name: refuseEarlyOverdue
        type: validation-error
        when: status == 'overdue' and due_on >= today
        props:
          message: A bill cannot be overdue before the day it falls due.
  - name: invoiceEpisodeGate
    title: Invoice Episode Gate
    entity: Invoice
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Bill being raised"
        type: start
      - id: B
        label: an encounter or an admission?
        type: decision
      - id: C
        label: Refuse the bill
        type: expression
      - id: D
        label: Raise the bill
        type: expression
      - id: E
        label: Refused
        type: end
      - id: F
        label: Raised
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Neither
      - from: B
        to: D
        label: One of them
      - from: C
        to: E
      - from: D
        to: F
    actions:
      - name: requireEpisode
        type: validation-error
        when: encounter_id == null and admission_id == null
        props:
          message: A bill prices an episode. Attach it to the outpatient contact or to the admission it is charging for.
  - name: invoiceLineGate
    title: Invoice Line Gate
    entity: InvoiceLine
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Line being added"
        type: start
      - id: C
        label: amount equals quantity times price?
        type: decision
      - id: D
        label: Refuse the line
        type: expression
      - id: E
        label: Add the line
        type: expression
      - id: F
        label: Refused
        type: end
      - id: G
        label: Added
        type: end
    edges:
      - from: A
        to: C
      - from: C
        to: D
        label: No
      - from: C
        to: E
        label: Yes
      - from: D
        to: F
      - from: E
        to: G
    actions:
      - name: refuseMiscalculatedLine
        type: validation-error
        when: line_amount != quantity * unit_price
        props:
          message: The line total does not equal the quantity times the unit price. A bill whose lines do not add up cannot be defended to a patient or an insurer.
  - name: paymentPostingGate
    title: Payment Posting Gate
    entity: Payment
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Payment being recorded"
        type: start
      - id: B
        label: amount positive?
        type: decision
      - id: C
        label: Refuse the payment
        type: expression
      - id: D
        label: more than the bill still owes?
        type: decision
      - id: E
        label: Record the payment
        type: expression
      - id: F
        label: Refused
        type: end
      - id: G
        label: Recorded
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: C
        label: Yes
      - from: D
        to: E
        label: No
      - from: C
        to: F
      - from: E
        to: G
    actions:
      - name: refuseNonPositivePayment
        type: validation-error
        when: amount <= 0
        props:
          message: A payment must be for a positive amount. A refund is not recorded here.
      - name: refuseOverpayment
        type: validation-error
        when: amount > outstanding_before
        props:
          message: That is more than this bill still owes. Check the amount, or apply the balance to another invoice.
  - name: paymentSettlementGate
    title: Payment Settlement Gate
    entity: Payment
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Payment recorded"
        type: start
      - id: B
        label: clears the balance?
        type: decision
      - id: C
        label: Settle the bill
        type: expression
      - id: D
        label: Mark the bill part paid
        type: expression
      - id: E
        label: Settled
        type: end
      - id: F
        label: Part paid
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: E
      - from: D
        to: F
    actions:
      - name: settleInvoice
        type: trigger-workflow
        when: amount >= outstanding_before
        props:
          workflow: InvoiceSettlement
          message: The bill is now fully paid.
      - name: partPayInvoice
        type: trigger-workflow
        when: amount < outstanding_before
        props:
          workflow: InvoicePartPayment
          message: The bill is partly paid and a balance remains.
  - name: stockMovementGate
    title: Stock Movement Gate
    entity: StockTransaction
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Movement being recorded"
        type: start
      - id: B
        label: quantity is zero?
        type: decision
      - id: F
        label: Refuse the movement
        type: expression
      - id: C
        label: direction matches the type?
        type: decision
      - id: D
        label: issue leaves enough stock?
        type: decision
      - id: E
        label: Record the movement
        type: expression
      - id: G
        label: Refused
        type: end
      - id: H
        label: Recorded
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: F
        label: Yes
      - from: B
        to: C
        label: No
      - from: C
        to: F
        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: F
        label: No
      - from: D
        to: E
        label: Yes
      - from: F
        to: G
      - from: E
        to: H
    actions:
      - name: refuseZeroMovement
        type: validation-error
        when: quantity == 0
        props:
          message: A movement of nothing is not a movement. To correct a count, record the difference.
      - name: refuseWrongDirectionIn
        type: validation-error
        when: transaction_type == 'receipt' and quantity <= 0
        props:
          message: A receipt adds to the store. Record a negative quantity as a return or a disposal.
      - name: refuseWrongDirectionOut
        type: validation-error
        when: transaction_type == 'issue' and quantity >= 0
        props:
          message: An issue takes stock away. Record it as a negative quantity.
      - name: refuseNegativeStock
        type: validation-error
        when: quantity_on_hand_after < 0
        props:
          message: There is not that much in the store. Count the shelf and record a correction before issuing.
  - name: stockReorderGate
    title: Stock Reorder Gate
    entity: StockTransaction
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Movement recorded"
        type: start
      - id: B
        label: item at or below its reorder level?
        type: decision
      - id: E
        label: Nothing to do
        type: expression
      - id: C
        label: already on the worklist?
        type: decision
      - id: D
        label: Raise a replenishment
        type: expression
      - id: F
        label: Raised
        type: end
      - id: G
        label: Done
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: E
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: E
        label: Yes
      - from: C
        to: D
        label: No
      - from: D
        to: F
      - from: E
        to: G
    actions:
      - name: raiseReplenishment
        type: trigger-workflow
        when: triggers_reorder == true
        props:
          workflow: StockReplenishment
          message: This item has fallen to its reorder level and is now on the buyer's worklist.
  - name: appointmentCheckInGate
    title: Appointment Check In Gate
    entity: Appointment
    event: afterUpdate
    priority: 20
    nodes:
      - id: A
        label: "Start: Appointment updated"
        type: start
      - id: B
        label: status becoming checked_in?
        type: decision
      - id: D
        label: Nothing to do
        type: expression
      - id: C
        label: Open the encounter
        type: expression
      - id: E
        label: Encounter opened
        type: end
      - id: F
        label: Done
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: D
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: E
      - from: D
        to: F
    actions:
      - name: openEncounter
        type: trigger-workflow
        when: status == 'checked_in'
        props:
          workflow: AppointmentCheckIn
          message: The patient has arrived, so the booking becomes a clinical contact.
  - name: dischargeBedGate
    title: Discharge Bed Gate
    entity: Admission
    event: afterUpdate
    priority: 30
    nodes:
      - id: A
        label: "Start: Admission updated"
        type: start
      - id: B
        label: status becoming discharged?
        type: decision
      - id: D
        label: Nothing to do
        type: expression
      - id: C
        label: Release the bed
        type: expression
      - id: E
        label: Bed released
        type: end
      - id: F
        label: Done
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: D
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: E
      - from: D
        to: F
    actions:
      - name: releaseBed
        type: trigger-workflow
        when: status == 'discharged'
        props:
          workflow: DischargeReleasesBed
          message: The stay has ended, so the bed goes for cleaning rather than straight back into the pool.
  - name: encounterInvoicingGate
    title: Encounter Invoicing Gate
    entity: Encounter
    event: afterUpdate
    priority: 20
    nodes:
      - id: A
        label: "Start: Encounter updated"
        type: start
      - id: B
        label: status becoming closed?
        type: decision
      - id: E
        label: Nothing to do
        type: expression
      - id: C
        label: billable?
        type: decision
      - id: D
        label: Raise the bill
        type: expression
      - id: F
        label: Invoice drafted
        type: end
      - id: G
        label: Done
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: E
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: E
        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: F
      - from: E
        to: G
    actions:
      - name: raiseInvoice
        type: trigger-workflow
        when: status == 'closed' and is_billable == true
        props:
          workflow: EncounterInvoicing
          message: A closed contact is what makes an episode billable, so the bill is drafted here rather than typed later.
  - name: consentWithdrawalGate
    title: Consent Withdrawal Gate
    entity: Consent
    event: afterUpdate
    priority: 20
    nodes:
      - id: A
        label: "Start: Consent updated"
        type: start
      - id: B
        label: withdrawn?
        type: decision
      - id: D
        label: Nothing to do
        type: expression
      - id: C
        label: Take the procedure back to planned
        type: expression
      - id: E
        label: Procedure unconsented
        type: end
      - id: F
        label: Done
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: D
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: E
      - from: D
        to: F
    actions:
      - name: unconsentProcedure
        type: trigger-workflow
        when: is_withdrawn == true
        props:
          workflow: ConsentWithdrawal
          message: Consent has been withdrawn, so the procedure it authorised is no longer consented.
stateMachines:
  - name: BedOccupancy
    title: Bed Occupancy
    entity: Bed
    states: [available, occupied, cleaning, closed]
    initial: available
    final: [closed]
    transitions:
      - from: available
        to: occupied
        trigger: admit
      - from: occupied
        to: cleaning
        trigger: discharge
      - from: cleaning
        to: available
        trigger: cleaned
      - from: available
        to: closed
        trigger: close
      - from: cleaning
        to: closed
        trigger: close
      - from: closed
        to: available
        trigger: reopen
  - name: PolicyLifecycle
    title: Policy Lifecycle
    entity: InsurancePolicy
    states: [active, suspended, expired, cancelled]
    initial: active
    final: [expired, cancelled]
    transitions:
      - from: active
        to: suspended
        trigger: suspend
      - from: suspended
        to: active
        trigger: reinstate
      - from: active
        to: expired
        trigger: expire
      - from: active
        to: cancelled
        trigger: cancel
      - from: suspended
        to: cancelled
        trigger: cancel
  - name: AppointmentLifecycle
    title: Appointment Lifecycle
    entity: Appointment
    states: [requested, confirmed, cancelled, checked_in, no_show, completed]
    initial: requested
    final: [completed, cancelled, no_show]
    transitions:
      - from: requested
        to: confirmed
        trigger: confirm
      - from: requested
        to: cancelled
        trigger: cancel
      - from: confirmed
        to: checked_in
        trigger: check_in
      - from: confirmed
        to: cancelled
        trigger: cancel
      - from: confirmed
        to: no_show
        trigger: mark_no_show
      - from: checked_in
        to: completed
        trigger: complete
  - name: EncounterLifecycle
    title: Encounter Lifecycle
    entity: Encounter
    states: [open, in_progress, cancelled, closed]
    initial: open
    final: [closed, cancelled]
    transitions:
      - from: open
        to: in_progress
        trigger: begin
      - from: open
        to: cancelled
        trigger: cancel
      - from: in_progress
        to: closed
        trigger: close
  - name: AdmissionLifecycle
    title: Admission Lifecycle
    entity: Admission
    states: [admitted, on_ward, cancelled, discharge_planned, discharged]
    initial: admitted
    final: [discharged, cancelled]
    transitions:
      - from: admitted
        to: on_ward
        trigger: settle
      - from: admitted
        to: cancelled
        trigger: cancel
      - from: on_ward
        to: discharge_planned
        trigger: plan_discharge
      - from: on_ward
        to: discharged
        trigger: discharge
      - from: discharge_planned
        to: discharged
        trigger: discharge
      - from: discharge_planned
        to: on_ward
        trigger: defer_discharge
  - name: ProcedureLifecycle
    title: Procedure Lifecycle
    entity: Procedure
    states: [planned, consented, cancelled, in_progress, completed, abandoned]
    initial: planned
    final: [completed, abandoned, cancelled]
    transitions:
      - from: planned
        to: consented
        trigger: obtain_consent
      - from: planned
        to: cancelled
        trigger: cancel
      - from: consented
        to: planned
        trigger: withdraw_consent
      - from: consented
        to: in_progress
        trigger: begin
      - from: consented
        to: cancelled
        trigger: cancel
      - from: in_progress
        to: completed
        trigger: complete
      - from: in_progress
        to: abandoned
        trigger: abandon
  - name: LabOrderLifecycle
    title: Lab Order Lifecycle
    entity: LabOrder
    states: [requested, collected, cancelled, in_lab, resulted]
    initial: requested
    final: [resulted, cancelled]
    transitions:
      - from: requested
        to: collected
        trigger: collect
      - from: requested
        to: cancelled
        trigger: cancel
      - from: collected
        to: in_lab
        trigger: receive
      - from: collected
        to: cancelled
        trigger: cancel
      - from: in_lab
        to: resulted
        trigger: result
  - name: ImagingOrderLifecycle
    title: Imaging Order Lifecycle
    entity: ImagingOrder
    states: [requested, scheduled, cancelled, performed, reported]
    initial: requested
    final: [reported, cancelled]
    transitions:
      - from: requested
        to: scheduled
        trigger: schedule
      - from: requested
        to: cancelled
        trigger: cancel
      - from: scheduled
        to: performed
        trigger: perform
      - from: scheduled
        to: cancelled
        trigger: cancel
      - from: performed
        to: reported
        trigger: report
  - name: PrescriptionLifecycle
    title: Prescription Lifecycle
    entity: Prescription
    states: [draft, prescribed, cancelled, verified, dispensed, collected]
    initial: draft
    final: [collected, cancelled]
    transitions:
      - from: draft
        to: prescribed
        trigger: prescribe
      - from: draft
        to: cancelled
        trigger: cancel
      - from: prescribed
        to: verified
        trigger: verify
      - from: prescribed
        to: cancelled
        trigger: cancel
      - from: verified
        to: dispensed
        trigger: dispense
      - from: verified
        to: cancelled
        trigger: cancel
      - from: dispensed
        to: collected
        trigger: collect
  - name: InvoiceLifecycle
    title: Invoice Lifecycle
    entity: Invoice
    states: [draft, issued, cancelled, submitted, part_paid, paid, overdue, rejected, written_off]
    initial: draft
    final: [paid, written_off, cancelled]
    transitions:
      - from: draft
        to: issued
        trigger: issue
      - from: draft
        to: cancelled
        trigger: cancel
      - from: issued
        to: submitted
        trigger: submit_claim
      - from: issued
        to: part_paid
        trigger: receive_part_payment
      - from: issued
        to: paid
        trigger: settle
      - from: issued
        to: overdue
        trigger: mark_overdue
      - from: submitted
        to: rejected
        trigger: reject_claim
      - from: submitted
        to: part_paid
        trigger: receive_part_payment
      - from: submitted
        to: paid
        trigger: settle
      - from: rejected
        to: issued
        trigger: rebill
      - from: rejected
        to: written_off
        trigger: write_off
      - from: part_paid
        to: part_paid
        trigger: receive_part_payment
      - from: part_paid
        to: paid
        trigger: settle
      - from: part_paid
        to: overdue
        trigger: mark_overdue
      - from: overdue
        to: part_paid
        trigger: receive_part_payment
      - from: overdue
        to: paid
        trigger: settle
      - from: overdue
        to: written_off
        trigger: write_off
sagas:
  - name: CriticalResultEscalation
    title: Critical Result Escalation
    entity: LabResult
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Flag the request as escalated
        properties:
          entity: LabOrder
          targetField: lab_order_id
          field: is_escalated
          value: "true"
      - id: C
        type: UpdateEntity
        label: Raise the request to stat on every worklist
        properties:
          entity: LabOrder
          targetField: lab_order_id
          field: priority
          value: stat
  - name: CriticalFindingEscalation
    title: Critical Finding Escalation
    entity: ImagingReport
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Flag the study as escalated
        properties:
          entity: ImagingOrder
          targetField: imaging_order_id
          field: is_escalated
          value: "true"
      - id: C
        type: UpdateEntity
        label: Raise the study to stat on every worklist
        properties:
          entity: ImagingOrder
          targetField: imaging_order_id
          field: priority
          value: stat
  - name: InvoiceSettlement
    title: Invoice Settlement
    entity: Payment
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Settle the bill
        properties:
          entity: Invoice
          targetField: invoice_id
          field: status
          value: paid
  - name: InvoicePartPayment
    title: Invoice Part Payment
    entity: Payment
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Mark the bill part paid
        properties:
          entity: Invoice
          targetField: invoice_id
          field: status
          value: part_paid
  - name: StockReplenishment
    title: Stock Replenishment
    entity: StockTransaction
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Put the item on the buyer's worklist
        properties:
          entity: InventoryItem
          targetField: inventory_item_id
          field: is_on_reorder
          value: "true"
  # ---- Gate D — the effects that cross entities ------------------------------
  - name: AppointmentCheckIn
    title: Appointment Check In
    entity: Appointment
    trigger: rule
    steps:
      - id: B
        type: CreateEntity
        label: Open the encounter
        properties:
          entity: Encounter
          as: newEncounterId
          fields: '{"patient_id":"patient_id","doctor_id":"doctor_id","department_id":"department_id","appointment_id":"id","encounter_type":"outpatient","status":"open","is_billable":true}'
  - name: AdmissionTakesBed
    title: Admission Takes Bed
    entity: Admission
    steps:
      - id: B
        type: UpdateEntity
        label: Take the bed out of the pool
        properties:
          entity: Bed
          targetField: bed_id
          field: status
          value: occupied
  - name: DischargeReleasesBed
    title: Discharge Releases Bed
    entity: Admission
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Send the bed for cleaning
        properties:
          entity: Bed
          targetField: bed_id
          field: status
          value: cleaning
  - name: EncounterInvoicing
    title: Encounter Invoicing
    entity: Encounter
    trigger: rule
    steps:
      - id: B
        type: CreateEntity
        label: Raise the bill in draft
        properties:
          entity: Invoice
          as: newInvoiceId
          fields: '{"patient_id":"patient_id","encounter_id":"id","status":"draft","gross_amount":0,"insurer_amount":0,"patient_amount":0,"paid_amount":0}'
  - name: ConsentWithdrawal
    title: Consent Withdrawal
    entity: Consent
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Take the procedure back to planned
        properties:
          entity: Procedure
          targetField: procedure_id
          field: status
          value: planned
