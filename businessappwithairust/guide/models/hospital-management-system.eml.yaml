eml: "1.0"
name: Hospital Management System
version: 1.0.0
description: "A hospital information system covering the whole of a patient's contact with the hospital. It holds the master patient record and the insurance policies attached to it; departments, wards and beds; the staff who work in them, and the doctors and nurses among them. Around those sits the clinical record: appointments that become encounters, and encounters that carry clinical notes, vital signs, diagnoses and procedures. Orders flow out of an encounter — prescriptions and their items, lab orders and their results, imaging orders and the radiologist's report — and each has a lifecycle of its own that the application enforces rather than describes. An admission takes a bed out of the pool and gives it back on discharge. Billing turns what was done into invoice lines priced from a chargeable-item catalogue, applies the insurance policy, and settles the balance against payments. Pharmacy and consumable stock is tracked through inventory items, suppliers and stock transactions, and an item that falls to its reorder level raises a replenishment of its own."
enums:
  - name: NoteType
    values: [admission, progress, ward_round, nursing, discharge, addendum]
  - name: DiagnosisType
    values: [primary, secondary, provisional, differential, complication]
  - name: ProcedureStatus
    values: [planned, consented, in_progress, completed, abandoned, cancelled]
  - name: AnaestheticType
    values: [none, local, regional, sedation, general]
  - name: ConsentType
    values: [written, verbal, implied, electronic]
  - name: ConsentGiver
    values: [patient, next_of_kin, legal_guardian, court_order]
  - name: SpecimenType
    values: [blood, urine, stool, sputum, swab, tissue, csf]
  - name: OrderPriority
    values: [routine, urgent, stat]
  - name: LabOrderStatus
    values: [requested, collected, in_lab, resulted, cancelled]
  - name: AbnormalFlag
    values: [normal, low, high, critical_low, critical_high]
  - name: ImagingModality
    values: [x_ray, ct, mri, ultrasound, mammography, fluoroscopy, nuclear_medicine]
  - name: ImagingOrderStatus
    values: [requested, scheduled, performed, reported, cancelled]
  - name: MedicationForm
    values: [tablet, capsule, liquid, injection, infusion, cream, inhaler, patch, drops, suppository]
  - name: MedicationRoute
    values: [oral, intravenous, intramuscular, subcutaneous, topical, inhaled, rectal, ophthalmic]
  - name: PrescriptionStatus
    values: [draft, prescribed, verified, dispensed, collected, cancelled]
  - name: ChargeCategory
    values: [consultation, procedure, bed_night, laboratory, imaging, medication, consumable, other]
  - name: InvoiceStatus
    values: [draft, issued, submitted, rejected, part_paid, paid, overdue, written_off, cancelled]
  - name: PayerType
    values: [insurer, patient, third_party]
  - name: PaymentMethod
    values: [cash, card, bank_transfer, cheque, insurer_settlement]
  - name: StockCategory
    values: [drug, consumable, ppe, surgical, reagent, linen, other]
  - name: StockTransactionType
    values: [receipt, issue, correction, return, disposal]
  - name: AppointmentType
    values: [new_patient, follow_up, procedure, review, telemedicine]
  - name: AppointmentStatus
    values: [requested, confirmed, checked_in, completed, cancelled, no_show]
  - name: EncounterType
    values: [outpatient, inpatient, emergency, telemedicine]
  - name: EncounterStatus
    values: [open, in_progress, closed, cancelled]
  - name: AdmissionType
    values: [elective, emergency, transfer_in, day_case]
  - name: AdmissionStatus
    values: [admitted, on_ward, discharge_planned, discharged, cancelled]
  - name: Gender
    values: [female, male, other, prefer_not_to_say]
  - name: BloodGroup
    values: [a_pos, a_neg, b_pos, b_neg, ab_pos, ab_neg, o_pos, o_neg]
  - name: PolicyType
    values: [individual, family, corporate, government]
  - name: PolicyStatus
    values: [active, expired, cancelled, suspended]
  - name: DoctorSpecialty
    values: [general_medicine, cardiology, surgery, paediatrics, obstetrics, radiology, pathology, anaesthetics, psychiatry, geriatrics]
  - name: NurseGrade
    values: [student, staff_nurse, senior_staff_nurse, charge_nurse, matron]
  - name: ShiftPattern
    values: [days, nights, rotating, bank]
  - name: StaffRole
    values: [receptionist, doctor, nurse, lab_technician, radiologist, pharmacist, ward_manager, billing_clerk, inventory_manager, hospital_manager]
  - name: BedType
    values: [standard, icu, hdu, cot, isolation, bariatric]
  - name: BedStatus
    values: [available, occupied, cleaning, closed]
  - name: WardType
    values: [general, icu, hdu, maternity, paediatric, isolation, day_case]
  - name: DepartmentType
    values: [clinical, diagnostic, surgical, support, administrative]
categories:
  - name: Organisation
    icon: building
    entities: [Department, Ward, Bed, Staff, Doctor, Nurse]
  - name: Patients
    icon: user
    entities: [Patient, InsurancePolicy]
  - name: Scheduling
    icon: calendar
    entities: [Appointment]
  - name: Clinical
    icon: activity
    entities: [Encounter, Admission, Consent]
  - name: Diagnostics
    icon: search
    entities: [LabOrder, ImagingOrder]
  - name: Pharmacy
    icon: package
    entities: [Medication, Prescription]
  - name: Billing
    icon: credit-card
    entities: [ChargeableItem, Invoice, Payment]
  - name: Stock
    icon: box
    entities: [Supplier, InventoryItem, StockTransaction]
entities:
  - name: Department
    help: An organisational unit of the hospital, such as Cardiology or Radiology. It employs staff, runs wards, and is what an appointment or an encounter is booked against.
    icon: building-2
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        unique: true
        help: The department's name as the hospital uses it — Cardiology, Radiology, Pathology. Unique, because two departments with one name is how a patient is sent to the wrong place.
      - name: code
        type: string
        unique: true
        help: The short code that appears on forms and reports, such as CARD.
      - name: department_type
        type: string
        enum: DepartmentType
        help: What kind of unit this is. Decides whether it holds wards and beds, or only sees outpatients.
      - name: doctor_id
        type: string
        fk: true
        optional: true
        help: The consultant who runs the department. Named plainly rather than `head_doctor_id`, because the generator resolves a reference from the column name and `head_doctor_id` resolves to nothing. Left empty while a department is between heads.
      - name: phone_extension
        type: string
        optional: true
        help: The internal number the switchboard puts calls through on.
      - name: floor
        type: string
        optional: true
        help: Which floor of the building to find it on.
      - name: is_active
        type: boolean
        help: Untick when a department closes rather than deleting it — the encounters it managed must still resolve.
    indexes:
      - columns: [department_type, is_active]
  - name: Ward
    help: "A physical place holding beds, run by one department. Distinct from the department: a department may run several wards."
    icon: bed-double
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        unique: true
        help: What the ward is called on the signage and in conversation — Coronary Care, Ward 3B. Unique, because a patient sent to the wrong ward of the same name is a real incident.
      - name: code
        type: string
        unique: true
        help: The short code used on bed boards and transfer notes, such as CCU.
      - name: department_id
        type: string
        fk: true
        help: The department that runs this ward.
      - name: ward_type
        type: string
        enum: WardType
        help: What kind of ward it is. Decides which patients may be admitted here and what level of nursing is required.
      - name: bed_capacity
        type: integer
        help: How many beds this ward is commissioned for. A gap between this and the number of bed records means beds were added or closed without the establishment being updated.
      - name: floor
        type: string
        optional: true
        help: Which floor to find it on. Used by porters moving patients.
      - name: phone_extension
        type: string
        optional: true
        help: The nurses' station number.
      - name: is_active
        type: boolean
        help: Untick when a ward closes rather than deleting it — past admissions must still resolve to somewhere.
    indexes:
      - columns: [department_id, is_active]
      - columns: [ward_type]
  - name: Bed
    help: One trackable bed in a ward, with its own type and occupancy. Managed as a pool — an admission takes one out of it and discharge gives it back.
    icon: bed
    attributes:
      - name: id
        type: string
        pk: true
      - name: bed_code
        type: string
        unique: true
        help: The hospital-wide identifier, ward code and number together, such as CCU-04. Unique across the hospital, because a bed board showing two beds called 4 is a bed board nobody trusts.
      - name: bed_number
        type: string
        help: The number on the bed itself, unique only within its ward.
      - name: ward_id
        type: string
        fk: true
        help: The ward this bed stands in.
      - name: bed_type
        type: string
        enum: BedType
        help: What the bed is equipped for. An admission may only take a bed whose type suits it.
      - name: status
        type: string
        enum: BedStatus
        help: Where the bed is in its cycle. Driven by the bed occupancy workflow rather than typed in.
      - name: last_cleaned_at
        type: datetime
        optional: true
        help: When housekeeping last turned it round. Empty on a bed that has never been used.
      - name: is_active
        type: boolean
        help: Untick when a bed is decommissioned rather than deleting it — past admissions must still resolve to the bed they were in.
    indexes:
      - columns: [ward_id, status]
      - columns: [bed_type, status]
  - name: Staff
    help: Anyone who works here and signs in. Deactivated when they leave rather than deleted, because the notes, orders and results they signed must still resolve years later.
    icon: users
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_number
        type: string
        unique: true
        help: The payroll and badge number. Unique, and the identifier used on anything printed.
      - name: first_name
        type: string
        help: Given name, as it should appear on screen and on a signed note.
      - name: last_name
        type: string
        help: Family name.
      - name: work_email
        type: email
        unique: true
        help: Where work reaches them, and the address they sign in with.
      - name: phone
        type: phone
        optional: true
        help: Contact number — a bleep or a mobile.
      - name: department_id
        type: string
        fk: true
        help: The department that employs them.
      - name: staff_role
        type: string
        enum: StaffRole
        help: What this person does, which decides what the application lets them see and do. The values match the roles named in the access rules.
      - name: job_title
        type: string
        optional: true
        help: The title on their contract, finer-grained than the role — Senior Staff Nurse against a role of nurse.
      - name: hired_on
        type: date
        help: When they joined.
      - name: is_active
        type: boolean
        help: Untick when someone leaves rather than deleting them — every note, order and result they signed must still resolve to a person, for years.
    indexes:
      - columns: [department_id, is_active]
      - columns: [staff_role]
  - name: Doctor
    help: The clinical extension of a staff record for someone who may lead an encounter, perform a procedure and prescribe. Carries the specialty and the registration number a nurse record does not.
    icon: stethoscope
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_id
        type: string
        fk: true
        unique: true
        help: The staff record this doctor is. Unique, because one person is one doctor.
      - name: registration_number
        type: string
        unique: true
        help: The number on the professional register they are licensed under. Unique, and the thing an audit checks.
      - name: specialty
        type: string
        enum: DoctorSpecialty
        help: The field they practise in. Decides which encounters and bookings reach them.
      - name: qualification
        type: string
        optional: true
        help: Their qualifications as they should appear on a letter — MBBS, FRCP.
      - name: is_consultant
        type: boolean
        help: Whether they hold consultant responsibility. A consultant may sign off work a junior cannot.
      - name: accepts_new_patients
        type: boolean
        help: Untick to keep them off the booking screen without deactivating the staff record.
    indexes:
      - columns: [specialty, accepts_new_patients]
  - name: Nurse
    help: The clinical extension of a staff record for nursing staff. Carries the grade and the home ward, which decide what a nurse may do and where they normally do it.
    icon: heart-pulse
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_id
        type: string
        fk: true
        unique: true
        help: The staff record this nurse is. Unique, because one person is one nurse.
      - name: registration_number
        type: string
        unique: true
        help: The number on the nursing register they are licensed under.
      - name: grade
        type: string
        enum: NurseGrade
        help: Their nursing grade, which decides what they may do unsupervised and what needs countersigning.
      - name: home_ward_id
        type: string
        fk: true
        optional: true
        help: The ward they normally work on. Left empty for bank and float staff, who have none.
      - name: shift_pattern
        type: string
        enum: ShiftPattern
        help: Which shifts they normally work. Not a roster — it is what a ward manager filters on when looking for cover.
    indexes:
      - columns: [home_ward_id, grade]
  - name: Patient
    help: The master patient record, created at first contact and kept for decades. Everything clinical, and everything billable, hangs off one.
    icon: user-round
    attributes:
      - name: id
        type: string
        pk: true
      - name: medical_record_number
        type: string
        unique: true
        help: The hospital's own patient identifier, on every wristband, chart and label. Generated on registration and never reused.
      - name: national_health_number
        type: string
        unique: true
        optional: true
        help: The national identifier where the patient has one. Left empty for an emergency admission that arrives without it.
      - name: first_name
        type: string
        help: Given name, as it should be spoken to them and printed.
      - name: last_name
        type: string
        help: Family name.
      - name: date_of_birth
        type: date
        help: Used to identify the patient alongside their name, and to decide paediatric and geriatric pathways.
      - name: gender
        type: string
        enum: Gender
        help: As the patient states it.
      - name: blood_group
        type: string
        optional: true
        enum: BloodGroup
        help: Recorded once typed. Empty until a sample has been taken.
      - name: phone
        type: phone
        optional: true
        help: The number to reach them on.
      - name: email
        type: email
        optional: true
        help: Where appointment reminders and letters go.
      - name: address_line
        type: string
        optional: true
        help: Street address.
      - name: city
        type: string
        optional: true
        help: Town or city.
      - name: postcode
        type: string
        optional: true
        help: Postcode, which is also how catchment reporting is done.
      - name: emergency_contact_name
        type: string
        optional: true
        help: Who to call if the patient cannot speak for themselves.
      - name: emergency_contact_phone
        type: phone
        optional: true
        help: The number to call them on.
      - name: known_allergies
        type: text
        optional: true
        help: Allergies and adverse reactions, in the words they were reported in. Read before prescribing.
      - name: registered_on
        type: date
        help: When this record was first created.
      - name: is_deceased
        type: boolean
        help: Marks the record closed to new activity while leaving every past encounter intact. Records are closed, never deleted.
    indexes:
      - columns: [last_name, date_of_birth]
      - columns: [medical_record_number]
        unique: true
  - name: InsurancePolicy
    help: "The cover a patient carries: the insurer, the policy number, the dates it is valid between, and the share of a bill the patient pays themselves."
    icon: shield-check
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient this cover belongs to.
      - name: insurer_name
        type: string
        help: The company underwriting the policy, as it should appear on a claim.
      - name: policy_number
        type: string
        unique: true
        help: The insurer's own reference. Unique, and quoted on every claim.
      - name: policy_type
        type: string
        enum: PolicyType
        help: What kind of cover this is, which decides what may be claimed under it.
      - name: valid_from
        type: date
        help: The first day the cover applies.
      - name: valid_to
        type: date
        help: The last day it applies. An invoice dated outside these two is not claimable.
      - name: coverage_limit
        type: decimal
        help: The most the insurer will pay across the policy period, in currency.
      - name: copay_percentage
        type: decimal
        help: The share of each bill the patient pays themselves, as a percentage. The billing rule computes the split from this.
      - name: is_primary
        type: boolean
        help: Which policy to claim against first where a patient holds more than one. Exactly one should be ticked.
      - name: status
        type: string
        enum: PolicyStatus
        help: Whether the cover is live. Driven by the policy lifecycle rather than typed in.
    indexes:
      - columns: [patient_id, status]
      - columns: [valid_to]
  - name: Appointment
    help: A booked future slot with a doctor. Created by reception; becomes an encounter when the patient actually arrives.
    icon: calendar
    attributes:
      - name: id
        type: string
        pk: true
      - name: appointment_number
        type: string
        unique: true
        help: The reference quoted to the patient in their letter and on the phone.
      - name: patient_id
        type: string
        fk: true
        help: Who the appointment is for.
      - name: doctor_id
        type: string
        fk: true
        help: The doctor the patient is booked to see.
      - name: department_id
        type: string
        fk: true
        help: The department running the clinic.
      - name: scheduled_at
        type: datetime
        help: When the patient is expected.
      - name: duration_minutes
        type: integer
        help: How long the slot is, which is what the clinic template allocates.
      - name: appointment_type
        type: string
        enum: AppointmentType
        help: What kind of visit this is. Decides the slot length a clinic offers.
      - name: status
        type: string
        enum: AppointmentStatus
        help: Where the booking has got to. Driven by the appointment lifecycle rather than typed in.
      - name: reason
        type: text
        optional: true
        help: Why the patient is coming, in the referrer's or the patient's own words.
      - name: booked_at
        type: datetime
        help: When the booking was made — the clock a time-to-be-seen measure runs from.
      - name: cancellation_reason
        type: string
        optional: true
        help: Why it was cancelled or missed. Empty unless it was.
    indexes:
      - columns: [doctor_id, scheduled_at]
      - columns: [patient_id, status]
  - name: Encounter
    help: One clinical contact between a patient and a clinician — the spine of the record. Notes, observations, diagnoses, procedures and every order hang off it, and closing it is what makes it billable.
    icon: clipboard-list
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_number
        type: string
        unique: true
        help: The reference this contact is known by across the whole record.
      - name: patient_id
        type: string
        fk: true
        help: Who was seen.
      - name: doctor_id
        type: string
        fk: true
        help: The clinician who led the contact and is accountable for it.
      - name: department_id
        type: string
        fk: true
        help: The department that managed it.
      - name: appointment_id
        type: string
        fk: true
        optional: true
        help: The appointment this came from. Empty for an unbooked contact such as a ward review or a walk-in.
      - name: encounter_type
        type: string
        enum: EncounterType
        help: Which setting the contact happened in.
      - name: status
        type: string
        enum: EncounterStatus
        help: Where the contact has got to. Closing it is what makes it billable.
      - name: started_at
        type: datetime
        help: When the clinician began.
      - name: ended_at
        type: datetime
        optional: true
        help: When they finished. Empty while the encounter is open.
      - name: chief_complaint
        type: text
        optional: true
        help: What the patient came in about, in their own words.
      - name: is_billable
        type: boolean
        help: Whether this contact generates an invoice. A ward review inside an admission usually does not.
    indexes:
      - columns: [patient_id, started_at]
      - columns: [doctor_id, status]
      - columns: [department_id, status]
  - name: Admission
    help: One inpatient stay, from taking a bed to giving it back. A transfer between wards moves the bed on this record rather than starting a new one, so one stay is always one admission.
    icon: log-in
    attributes:
      - name: id
        type: string
        pk: true
      - name: admission_number
        type: string
        unique: true
        help: The reference this stay is known by.
      - name: patient_id
        type: string
        fk: true
        help: Who was admitted.
      - name: encounter_id
        type: string
        fk: true
        help: The clinical contact that led to the admission.
      - name: ward_id
        type: string
        fk: true
        help: The ward the patient is on now. Changes when they are transferred.
      - name: bed_id
        type: string
        fk: true
        help: The bed they are in now. Changes when they are transferred.
      - name: admission_type
        type: string
        enum: AdmissionType
        help: How they came in, which drives priority and reporting.
      - name: status
        type: string
        enum: AdmissionStatus
        help: Where the stay has got to.
      - name: admitted_at
        type: datetime
        help: When the bed was taken.
      - name: expected_discharge_date
        type: date
        optional: true
        help: The working estimate, used for bed planning.
      - name: discharged_at
        type: datetime
        optional: true
        help: When the bed was given back. Empty until discharge.
      - name: discharge_summary
        type: text
        optional: true
        help: What happened and what happens next. Required before the patient can be discharged.
    indexes:
      - columns: [ward_id, status]
      - columns: [patient_id, admitted_at]
      - columns: [bed_id, status]
  - name: ClinicalNote
    help: One written note recorded during an encounter, by the member of staff who wrote it. Read as part of the encounter it belongs to, never on its own.
    icon: notebook-pen
    parent: Encounter
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The contact this note belongs to.
      - name: staff_id
        type: string
        fk: true
        help: Who wrote it. Never changes — an addendum is a new note, not an edit of this one.
      - name: note_type
        type: string
        enum: NoteType
        help: What kind of note this is, which decides where it appears in the record.
      - name: content
        type: text
        help: The note itself, in the author's own words.
      - name: recorded_at
        type: datetime
        help: When it was written.
      - name: is_confidential
        type: boolean
        help: Restricts the note to the clinical team. Used for safeguarding and mental-health entries the wider team should not see.
    indexes:
      - columns: [encounter_id, recorded_at]
  - name: VitalSign
    help: One set of observations — temperature, pulse, blood pressure, oxygen saturation — taken at one moment during an encounter.
    icon: activity
    parent: Encounter
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The contact these observations were taken during.
      - name: staff_id
        type: string
        fk: true
        help: Who took them.
      - name: recorded_at
        type: datetime
        help: When they were taken — not when they were typed in.
      - name: temperature_c
        type: decimal
        optional: true
        help: Body temperature in degrees Celsius.
      - name: pulse_bpm
        type: integer
        optional: true
        help: Heart rate in beats per minute.
      - name: systolic_bp
        type: integer
        optional: true
        help: Systolic blood pressure in millimetres of mercury.
      - name: diastolic_bp
        type: integer
        optional: true
        help: Diastolic blood pressure in millimetres of mercury.
      - name: respiratory_rate
        type: integer
        optional: true
        help: Breaths per minute.
      - name: oxygen_saturation
        type: integer
        optional: true
        help: Peripheral oxygen saturation as a percentage.
      - name: early_warning_score
        type: integer
        optional: true
        help: The aggregate score these observations produce. Above the escalation threshold it means call someone.
    indexes:
      - columns: [encounter_id, recorded_at]
  - name: Diagnosis
    help: A conclusion recorded against an encounter, with its coding and whether it is the primary reason for the contact.
    icon: scan-search
    parent: Encounter
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The contact this conclusion was reached in.
      - name: staff_id
        type: string
        fk: true
        help: The clinician who recorded it and is accountable for it.
      - name: diagnosis_code
        type: string
        help: The classification code, from whichever coding standard the hospital uses. What billing and reporting key on.
      - name: description
        type: string
        help: The diagnosis in words, as it should read on a letter.
      - name: diagnosis_type
        type: string
        enum: DiagnosisType
        help: Whether this is the main reason for the contact or something recorded alongside it.
      - name: diagnosed_at
        type: datetime
        help: When it was recorded.
      - name: is_chronic
        type: boolean
        help: Whether this is a long-term condition rather than something arising from this contact. Chronic diagnoses carry forward.
    indexes:
      - columns: [encounter_id, diagnosis_type]
      - columns: [diagnosis_code]
  - name: Procedure
    help: Something done to the patient during an encounter. It is what a consent record attaches to, and what the theatre and billing sides both refer back to.
    icon: scissors
    parent: Encounter
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The contact this was done during.
      - name: doctor_id
        type: string
        fk: true
        help: The doctor who performed it and is accountable for it.
      - name: procedure_code
        type: string
        help: The classification code, which is what billing prices from.
      - name: name
        type: string
        help: What was done, in words.
      - name: status
        type: string
        enum: ProcedureStatus
        help: Where the procedure has got to. Driven by the procedure lifecycle rather than typed in.
      - name: scheduled_for
        type: datetime
        optional: true
        help: When it is planned for. Empty for something done there and then.
      - name: performed_at
        type: datetime
        optional: true
        help: When it was actually done. Empty until it is.
      - name: anaesthetic_type
        type: string
        optional: true
        enum: AnaestheticType
        help: What anaesthetic was used, if any.
      - name: outcome
        type: text
        optional: true
        help: What happened, including any complications.
    indexes:
      - columns: [encounter_id, status]
      - columns: [procedure_code]
  - name: Consent
    help: "A patient's recorded consent to one procedure: who consented, when, and who witnessed it. Kept as a record rather than a flag so that \"was this consented?\" is a question the application can refuse a write on."
    icon: file-check
    attributes:
      - name: id
        type: string
        pk: true
      - name: procedure_id
        type: string
        fk: true
        help: The procedure being consented to.
      - name: consent_type
        type: string
        enum: ConsentType
        help: How consent was given and recorded.
      - name: giver_type
        type: string
        enum: ConsentGiver
        help: In what capacity consent was given — the patient themselves, or someone entitled to consent on their behalf.
      - name: giver_name
        type: string
        help: The name of the person who consented, as they signed it.
      - name: witnessed_by_id
        type: string
        fk: true
        help: The member of staff who witnessed it. Required, because an unwitnessed consent is not a consent.
      - name: consented_at
        type: datetime
        help: When it was given.
      - name: is_withdrawn
        type: boolean
        help: Consent can be withdrawn at any time up to the procedure, and withdrawal must be as easy to record as consent was.
      - name: withdrawn_at
        type: datetime
        optional: true
        help: When it was withdrawn. Empty unless it was.
      - name: notes
        type: text
        optional: true
        help: What was explained, and anything the patient asked.
    indexes:
      - columns: [procedure_id, is_withdrawn]
      - columns: [consented_at]
  - name: LabOrder
    help: A request for a laboratory test, raised during an encounter and owned by the member of staff responsible for it.
    icon: test-tube
    attributes:
      - name: id
        type: string
        pk: true
      - name: order_number
        type: string
        unique: true
        help: The laboratory's own number for this request, printed on every specimen label and quoted on the result. Generated on saving, never typed.
      - name: encounter_id
        type: string
        fk: true
        help: The clinical contact the test was requested during.
      - name: ordered_by_id
        type: string
        fk: true
        help: The member of staff responsible for the request, and the person a critical result is escalated to.
      - name: test_code
        type: string
        help: The laboratory's code for the test requested.
      - name: test_name
        type: string
        help: The test in words, as it appears on the request and the report.
      - name: specimen_type
        type: string
        enum: SpecimenType
        help: What has to be collected. Decides the container, and whether the request can be met at all.
      - name: priority
        type: string
        enum: OrderPriority
        help: How fast the laboratory must turn it round. A stat request goes to the top of the worklist.
      - name: status
        type: string
        enum: LabOrderStatus
        help: Where the request has got to, from asked for to resulted. Driven by the lifecycle.
      - name: is_escalated
        type: boolean
        help: Set by the escalation workflow when a critical value comes back, so the worklist shows which requests someone still has to be told about.
      - name: ordered_at
        type: datetime
        help: When the request was raised.
      - name: collected_at
        type: datetime
        optional: true
        help: When the specimen was actually taken. Empty until it is, and the gap between this and the order time is the collection delay a ward is measured on.
      - name: clinical_details
        type: text
        optional: true
        help: Why the test was requested. The laboratory needs it to interpret the value, not merely to report it.
    indexes:
      - columns: [status, priority]
      - columns: [encounter_id, ordered_at]
  - name: LabResult
    help: One measured value against a lab order, with the reference range it is read against and the person who verified it. An unverified result is not clinically actionable.
    icon: microscope
    parent: LabOrder
    attributes:
      - name: id
        type: string
        pk: true
      - name: lab_order_id
        type: string
        fk: true
        help: The request this value answers.
      - name: analyte
        type: string
        help: What was measured — haemoglobin, sodium, C-reactive protein. One order commonly produces several.
      - name: value_numeric
        type: decimal
        optional: true
        help: The measured value, where the test produces a number. Empty for a test that reports words.
      - name: value_text
        type: string
        optional: true
        help: The result in words, where the test produces no number — an organism named, or positive and negative. Empty for a numeric test.
      - name: unit
        type: string
        optional: true
        help: The unit the numeric value is in. A number without its unit is not a result.
      - name: reference_low
        type: decimal
        optional: true
        help: The bottom of the normal range this value is read against.
      - name: reference_high
        type: decimal
        optional: true
        help: The top of the normal range this value is read against.
      - name: abnormal_flag
        type: string
        enum: AbnormalFlag
        help: How the value reads against its range. A critical flag escalates rather than merely colouring the row.
      - name: verified_by_id
        type: string
        fk: true
        optional: true
        help: The laboratory member of staff who verified the value. Empty until someone has, and an unverified result is not clinically actionable.
      - name: verified_at
        type: datetime
        optional: true
        help: When it was verified.
      - name: resulted_at
        type: datetime
        help: When the analyser produced the value.
    indexes:
      - columns: [lab_order_id, resulted_at]
      - columns: [abnormal_flag]
  - name: ImagingOrder
    help: A request for an imaging study, raised during an encounter.
    icon: scan
    attributes:
      - name: id
        type: string
        pk: true
      - name: order_number
        type: string
        unique: true
        help: The imaging department's own number for this request, quoted on the study and the report. Generated on saving, never typed.
      - name: encounter_id
        type: string
        fk: true
        help: The clinical contact the study was requested during.
      - name: ordered_by_id
        type: string
        fk: true
        help: The member of staff responsible for the request, and the person a critical finding is escalated to.
      - name: modality
        type: string
        enum: ImagingModality
        help: What kind of imaging is being asked for. Decides which room and which equipment the study is booked into.
      - name: body_part
        type: string
        help: What is to be imaged, in the words the request was written in.
      - name: priority
        type: string
        enum: OrderPriority
        help: How fast the study is needed. Same vocabulary as a laboratory request, deliberately.
      - name: status
        type: string
        enum: ImagingOrderStatus
        help: Where the request has got to, from asked for to reported. Driven by the lifecycle.
      - name: contrast_used
        type: boolean
        help: Whether contrast was given. It changes the preparation, the safety checks and the price.
      - name: is_escalated
        type: boolean
        help: Set by the escalation workflow when a critical finding is reported, so the worklist shows which studies someone still has to be told about.
      - name: ordered_at
        type: datetime
        help: When the request was raised.
      - name: scheduled_for
        type: datetime
        optional: true
        help: When the study is booked for. Empty until it is booked.
      - name: performed_at
        type: datetime
        optional: true
        help: When the study was actually carried out. Empty until it is.
      - name: clinical_question
        type: text
        optional: true
        help: The question the study is meant to answer. A radiologist reports against this; without it the report is a description rather than an answer.
    indexes:
      - columns: [status, priority]
      - columns: [encounter_id, ordered_at]
      - columns: [modality, scheduled_for]
  - name: ImagingReport
    help: The radiologist's written interpretation of an imaging study. Prose, not a value — which is why it is a different thing from a lab result and not a variation of one.
    icon: file-image
    parent: ImagingOrder
    attributes:
      - name: id
        type: string
        pk: true
      - name: imaging_order_id
        type: string
        fk: true
        help: The study this report interprets.
      - name: doctor_id
        type: string
        fk: true
        help: The radiologist who read the study and signed the report.
      - name: findings
        type: text
        help: What is visible on the study, described.
      - name: impression
        type: text
        help: What it means. This is the part the ordering clinician reads first and acts on.
      - name: is_addendum
        type: boolean
        help: Marks a later report that amends an earlier one rather than replacing it. The first report is kept, because a decision was made on it.
      - name: is_critical
        type: boolean
        help: A finding that has to be communicated now rather than read at the next ward round. Set by the radiologist; the escalation workflow acts on it.
      - name: reported_at
        type: datetime
        help: When the report was signed.
    indexes:
      - columns: [imaging_order_id, reported_at]
      - columns: [is_critical]
  - name: Medication
    help: "The drug catalogue: what may be prescribed, in what form and strength, and whether it is a controlled drug. Referenced by prescription items rather than typed into them."
    icon: pill
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The catalogue's own code for this medicine. Quoted on a prescription and on a stock order.
      - name: name
        type: string
        help: The generic name, which is what a prescription is written in.
      - name: brand_name
        type: string
        optional: true
        help: The brand it is stocked as, where that differs. Shown to the person picking it off the shelf.
      - name: form
        type: string
        enum: MedicationForm
        help: What it physically is — a tablet, an injection, a cream. Decides how it is given and how it is counted.
      - name: strength
        type: string
        help: The strength of one unit, as printed on the packaging, such as 500 mg.
      - name: route
        type: string
        enum: MedicationRoute
        help: The route it is normally given by. A prescription item may narrow this but not contradict it.
      - name: therapeutic_class
        type: string
        help: "The class of medicine this belongs to. This is what the duplication rule reads: a second medicine of the same class is the clash a hospital without a full formulary can actually detect."
      - name: is_controlled
        type: boolean
        help: Whether it is a controlled drug. Controlled drugs cannot be dispensed by the person who prescribed them.
      - name: is_high_alert
        type: boolean
        help: Marks a medicine where an error causes serious harm — insulin, heparin, an opioid. A high-alert item needs a second qualified check before it goes on a prescription.
      - name: is_active
        type: boolean
        help: Whether it may still be prescribed. A withdrawn medicine is deactivated rather than deleted, because the prescriptions that named it must still resolve.
      - name: inventory_item_id
        type: string
        fk: true
        optional: true
        help: The stocked item this medicine is held as. Empty for a medicine the hospital does not stock — a patient's own supply, or one ordered in for them. It is what lets dispensing decrement the store, which without this link it could not find.
      - name: contraindication_notes
        type: text
        optional: true
        help: What the prescriber should know before choosing it, in the pharmacy's own words. Not a substitute for a formulary — see the model's scope.
    indexes:
      - columns: [therapeutic_class]
      - columns: [is_controlled, is_active]
  - name: Prescription
    help: What was prescribed at one encounter, by one prescriber, for one patient. Verified and dispensed by pharmacy before the patient collects it.
    icon: file-text
    attributes:
      - name: id
        type: string
        pk: true
      - name: prescription_number
        type: string
        unique: true
        help: The pharmacy's own number for this prescription. Generated on saving, never typed.
      - name: encounter_id
        type: string
        fk: true
        help: The clinical contact it was written during.
      - name: prescribed_by_id
        type: string
        fk: true
        help: Who wrote it. Held as a member of staff rather than as a doctor so that it can be compared with who dispensed it — that comparison is the controlled-drug rule.
      - name: status
        type: string
        enum: PrescriptionStatus
        help: Where it has got to, from written to collected. Driven by the lifecycle.
      - name: has_controlled_item
        type: boolean
        help: Whether any item on this prescription is a controlled drug. Written by the application when an item is added, never by hand, and it is what the segregation rule reads — a rule can only see the row it is given, so the fact has to be on it.
      - name: is_discharge_prescription
        type: boolean
        help: Marks a prescription the patient takes home rather than one given on the ward. It is dispensed differently and it goes on the discharge summary.
      - name: prescribed_at
        type: datetime
        help: When it was written.
      - name: verified_by_id
        type: string
        fk: true
        optional: true
        help: The pharmacist who checked it. Empty until one has.
      - name: verified_at
        type: datetime
        optional: true
        help: When it was checked.
      - name: dispensed_by_id
        type: string
        fk: true
        optional: true
        help: Who handed out the medicine. For a controlled drug this may not be the person who prescribed it.
      - name: dispensed_at
        type: datetime
        optional: true
        help: When it was dispensed.
      - name: notes
        type: text
        optional: true
        help: Anything the prescriber wants pharmacy to know.
    indexes:
      - columns: [status, prescribed_at]
      - columns: [encounter_id, prescribed_at]
  - name: PrescriptionItem
    help: One drug on a prescription, with its dose, route and duration. Meaningless away from the prescription it belongs to.
    icon: list-checks
    parent: Prescription
    attributes:
      - name: id
        type: string
        pk: true
      - name: prescription_id
        type: string
        fk: true
        help: The prescription this line belongs to.
      - name: medication_id
        type: string
        fk: true
        help: Which medicine. Chosen from the catalogue rather than typed, so that the controlled and high-alert flags are the catalogue's and not the prescriber's memory.
      - name: dose
        type: string
        help: How much is given at once, such as 500 mg or 10 mL.
      - name: route
        type: string
        enum: MedicationRoute
        help: How it is given for this patient. Narrows the medicine's usual route.
      - name: frequency
        type: string
        help: How often, in the words the prescription is written in — three times a day, at night, every four hours.
      - name: quantity
        type: decimal
        help: How much to dispense in total. This is what pharmacy counts out and what stock is decremented by.
      - name: is_prn
        type: boolean
        help: Marks a medicine given as required rather than on a schedule. A nurse decides when; the prescription decides the limit.
      - name: is_high_alert
        type: boolean
        help: "The medicine's high-alert flag as it stood when this was prescribed. Copied from the catalogue by the application, for the same reason the invoice line keeps its own price: the rule that demands a second check reads this row and nothing else."
      - name: duration_days
        type: integer
        optional: true
        help: How many days the course runs for. Empty for a medicine taken indefinitely.
      - name: second_check_by_id
        type: string
        fk: true
        optional: true
        help: The second qualified person who checked a high-alert medicine. Required for one, and empty for everything else.
      - name: instructions
        type: text
        optional: true
        help: How to take it, in the words that go on the label — with food, before bed.
    indexes:
      - columns: [prescription_id]
      - columns: [medication_id]
  - name: ChargeableItem
    help: "The price list: what a consultation, a bed-night, a test, an image or a drug costs. Invoice lines are priced from this rather than typed, so two invoices for the same procedure agree."
    icon: tag
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The price list's own code for this charge, quoted on an invoice line and in a price review.
      - name: name
        type: string
        help: What the charge is called on the bill the patient reads.
      - name: category
        type: string
        enum: ChargeCategory
        help: What kind of charge it is. Decides which part of the episode it is grouped under on the invoice.
      - name: unit_price
        type: decimal
        help: What one of them costs today. An invoice line keeps its own copy, so changing this never rewrites a bill already raised.
      - name: is_active
        type: boolean
        help: Whether it may still be charged. A withdrawn charge is deactivated rather than deleted, because the invoice lines that used it must still resolve.
      - name: description
        type: text
        optional: true
        help: What the charge covers, for the person choosing it and for the patient querying it.
    indexes:
      - columns: [category, is_active]
  - name: Invoice
    help: One episode of care, priced. Created when an encounter or an admission closes, settled against the insurance policy and the patient's own share.
    icon: receipt
    attributes:
      - name: id
        type: string
        pk: true
      - name: invoice_number
        type: string
        unique: true
        help: The hospital's own number for this bill. Generated on saving, never typed, and quoted on every payment and claim.
      - name: patient_id
        type: string
        fk: true
        help: Whose episode this is. The one anchor every invoice has, whether it prices an outpatient contact or a whole stay.
      - name: status
        type: string
        enum: InvoiceStatus
        help: Where the bill has got to, from drafted to settled. Driven by the lifecycle.
      - name: gross_amount
        type: decimal
        help: What the episode cost in total, before the policy is applied. The sum of the lines.
      - name: insurer_amount
        type: decimal
        help: The share the insurer is being asked for.
      - name: patient_amount
        type: decimal
        help: The share the patient owes themselves — the co-payment. Computed from the policy, not typed.
      - name: paid_amount
        type: decimal
        help: How much has actually been received against this bill so far, from either payer.
      - name: policy_verified
        type: boolean
        help: Whether the cover was checked against the dates being charged and passed. Set by the application when the co-payment is applied; a bill cannot be issued while it is false.
      - name: issued_on
        type: date
        optional: true
        help: The day the bill was raised. Empty while it is still a draft.
      - name: due_on
        type: date
        optional: true
        help: The day it falls due. Nothing may be marked overdue before this date has passed.
      - name: encounter_id
        type: string
        fk: true
        optional: true
        help: The outpatient contact being billed, where the episode is one contact.
      - name: admission_id
        type: string
        fk: true
        optional: true
        help: The inpatient stay being billed, where the episode is a whole admission. An invoice carries one or the other, never neither.
      - name: insurance_policy_id
        type: string
        fk: true
        optional: true
        help: The cover being claimed against. Empty for a self-paying patient, and the whole bill is then the patient's.
      - name: notes
        type: text
        optional: true
        help: Anything the billing office needs to record about this bill.
    indexes:
      - columns: [status, due_on]
      - columns: [patient_id, issued_on]
      - columns: [insurance_policy_id, status]
  - name: InvoiceLine
    help: One charge on an invoice, priced from a chargeable item. Held on the line rather than recomputed, so an invoice reprints identically years later.
    icon: list-checks
    parent: Invoice
    attributes:
      - name: id
        type: string
        pk: true
      - name: invoice_id
        type: string
        fk: true
        help: The bill this charge is on.
      - name: chargeable_item_id
        type: string
        fk: true
        help: Which charge from the price list. Chosen rather than typed, so two bills for the same procedure agree.
      - name: description
        type: string
        help: What the line says on the bill. Copied from the price list when the line is raised, so a later rename does not rewrite an old invoice.
      - name: quantity
        type: decimal
        help: How many — nights, tests, tablets, hours.
      - name: unit_price
        type: decimal
        help: What one cost on the day it was charged. Held here rather than looked up, so the bill reprints identically years later.
      - name: line_amount
        type: decimal
        help: Quantity times unit price. Refused if the three disagree.
      - name: charged_on
        type: date
        help: The day the thing charged for actually happened, which is not always the day the bill was raised.
      - name: source_reference
        type: string
        optional: true
        help: "What in the record this charge came from — a procedure code, a lab order number, a range of bed-nights. Free text: the model has no one entity a charge points back at, and four nullable references would be worse than a legible sentence."
    indexes:
      - columns: [invoice_id]
      - columns: [chargeable_item_id, charged_on]
  - name: Payment
    help: Money received against an invoice, from the insurer or from the patient, in whole or in part.
    icon: banknote
    attributes:
      - name: id
        type: string
        pk: true
      - name: receipt_number
        type: string
        unique: true
        help: The receipt this payment was given. Generated on saving, never typed.
      - name: invoice_id
        type: string
        fk: true
        help: The bill the money was received against.
      - name: received_by_id
        type: string
        fk: true
        help: The member of staff who took the payment. Every receipt has a name against it.
      - name: payer_type
        type: string
        enum: PayerType
        help: Who paid — the insurer settling a claim, the patient paying their share, or a third party.
      - name: method
        type: string
        enum: PaymentMethod
        help: How the money arrived. Decides what reconciling it against the bank looks like.
      - name: amount
        type: decimal
        help: How much was received. Refused if it is not positive, or if it is more than the bill still owes.
      - name: outstanding_before
        type: decimal
        help: What the bill still owed immediately before this payment. Resolved by the application when the receipt is written, and it is what makes both the overpayment refusal and the settlement decision answerable from the receipt alone.
      - name: received_on
        type: date
        help: The day the money was received, which is not always the day it was recorded.
      - name: bank_reference
        type: string
        optional: true
        help: The reference the money arrived with, for reconciling it against a bank statement.
    indexes:
      - columns: [invoice_id, received_on]
      - columns: [payer_type, received_on]
  - name: Supplier
    help: Who consumables and drugs are bought from, and who a replenishment is raised against.
    icon: truck
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The purchasing department's own code for this supplier.
      - name: name
        type: string
        help: The company as it appears on an order and an invoice.
      - name: lead_time_days
        type: integer
        help: How many days a delivery takes once ordered. A reorder level means nothing without it — the level exists to cover exactly this many days of use.
      - name: is_active
        type: boolean
        help: Whether they may still be ordered from. Deactivated rather than deleted, because the deliveries they made must still resolve.
      - name: contact_name
        type: string
        optional: true
        help: Who to speak to about an order.
      - name: email
        type: email
        optional: true
        help: Where an order is sent.
      - name: phone
        type: phone
        optional: true
        help: The number to chase a late delivery on.
      - name: address_line
        type: string
        optional: true
        help: Where they are, for returns and correspondence.
      - name: notes
        type: text
        optional: true
        help: Anything purchasing needs to remember about them — minimum order, delivery days, account number.
    indexes:
      - columns: [is_active]
  - name: InventoryItem
    help: A stocked consumable with a quantity on hand and a reorder level. Falling to that level is what raises a replenishment.
    icon: package
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The store's own code for this item, on the shelf label and every requisition.
      - name: name
        type: string
        help: What it is called by the people who order and use it.
      - name: supplier_id
        type: string
        fk: true
        help: Who it is bought from, and who a replenishment is raised against.
      - name: category
        type: string
        enum: StockCategory
        help: What kind of stock it is. Decides where it is stored and who counts it.
      - name: unit_of_issue
        type: string
        help: What one unit is, in the words the store uses — each, box of 100, 500 mL bottle. Every quantity in the system is in these units.
      - name: quantity_on_hand
        type: decimal
        help: How many are in the store now. This is the sum of every movement against the item and is never typed in directly.
      - name: reorder_level
        type: decimal
        help: The quantity at which more must be ordered. Set to cover the supplier's lead time at the expected rate of use.
      - name: reorder_quantity
        type: decimal
        help: How many to order when it falls to that level.
      - name: requires_cold_chain
        type: boolean
        help: Marks stock that must be kept refrigerated. It changes where it is stored, how it is delivered, and what happens if a fridge fails.
      - name: is_on_reorder
        type: boolean
        help: Set by the replenishment workflow when the item falls to its reorder level, and cleared when the delivery is received. It is what puts the item on the buyer's worklist.
      - name: is_active
        type: boolean
        help: Whether it is still stocked. A discontinued item is deactivated rather than deleted, because the movements against it must still resolve.
      - name: storage_location
        type: string
        optional: true
        help: Where in the store it lives — the aisle, shelf or fridge.
    indexes:
      - columns: [is_on_reorder, is_active]
      - columns: [category, storage_location]
      - columns: [supplier_id]
  - name: StockTransaction
    help: One movement that changes a quantity — a receipt, an issue to a ward, a correction after a count, or a return. The quantity on hand is the sum of these and is never typed in directly.
    icon: arrow-left-right
    attributes:
      - name: id
        type: string
        pk: true
      - name: inventory_item_id
        type: string
        fk: true
        help: Which item moved.
      - name: performed_by_id
        type: string
        fk: true
        help: Who moved it. Every movement has a name against it, because an unexplained count difference is investigated by asking that person.
      - name: transaction_type
        type: string
        enum: StockTransactionType
        help: What kind of movement this is. It decides which direction the quantity must go, and a movement whose sign contradicts its type is refused.
      - name: quantity
        type: decimal
        help: How many units moved, in the item's unit of issue. Positive adds to the store, negative takes away.
      - name: quantity_on_hand_after
        type: decimal
        help: The running balance after this movement — a stock ledger's own column, and what makes a count difference traceable to the movement that caused it.
      - name: triggers_reorder
        type: boolean
        help: Set by the application when this movement takes the item to or below its reorder level and it is not already on the buyer's worklist. It is what the replenishment workflow fires on.
      - name: occurred_on
        type: datetime
        help: When the movement actually happened, which is not always when it was entered.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: Who delivered it. Set on a receipt and empty on everything else.
      - name: ward_id
        type: string
        fk: true
        optional: true
        help: Where an issue went. Set on an issue and empty on everything else, and it is how consumption is attributed to a ward.
      - name: batch_number
        type: string
        optional: true
        help: The manufacturer's batch, which is what a recall is traced by.
      - name: expiry_date
        type: date
        optional: true
        help: When this batch expires. Empty for stock that does not expire.
      - name: reference
        type: string
        optional: true
        help: The delivery note, requisition or stock-count reference this movement came from.
      - name: notes
        type: text
        optional: true
        help: Why, where the type alone does not say — a correction after a count, a disposal after a fridge failure.
    indexes:
      - columns: [inventory_item_id, occurred_on]
      - columns: [transaction_type, occurred_on]
      - columns: [batch_number]
