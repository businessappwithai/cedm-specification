# CEDM Completion Backlog
todo:
  version: 1.0.0
  status: active
  objective: Complete a broad Common Enterprise Domain Model with deep entity semantics and cross-domain workflow integrity.
  completionCriteria:
    - Every required entity is represented by a canonical entity specification or an explicitly documented canonical equivalent.
    - Every entity and every field has detailed help covering meaning, usage, required or optional semantics, and relationship/workflow context where applicable.
    - Enumerations define governed value semantics.
    - Relationships define target, cardinality, ownership and business/workflow meaning.
    - Reciprocal relationships and all workflow-affected entities are reconciled whenever a model changes.
    - Lifecycle states, invariants, correction semantics, idempotency and historical immutability are defined where applicable.
    - Physical, commercial, financial and accounting effects are represented as separate auditable business events where appropriate.
    - Entity registry, domain catalog and capability catalog are synchronized.
    - No dangling entity targets, obsolete duplicate concepts or unexplained isolated transaction chains remain.
    - Available repository validators and CI checks are executed and their actual results recorded; absence of CI is never treated as a pass.
  executionPolicy:
    approval: All remaining backlog items are pre-approved for implementation, integration, repair, validation and cleanup.
    sequence: Work domain-by-domain while immediately propagating every cross-domain dependency.
    doneDefinition: An item is complete only after its entity definitions, reciprocal dependencies, catalogs/registry and available validation have been reconciled.
  domains:
    - id: party-organization
      name: Party & Organization
      entities: [Party, Person, Organization, BusinessUnit, Department, Team, Role, Address, ContactPoint, PartyRelationship]
      status: pending-verification
    - id: customer-crm
