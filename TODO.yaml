    - id: procurement
      name: Procurement
      entities: [Supplier, PurchaseRequisition, RequestForQuotation, SupplierQuotation, PurchaseOrder, GoodsReceipt, SupplierReturn, SupplierClaim]
      status: in-progress
      notes: Header-level requisition-to-RFQ-to-supplier-quotation-to-purchase-order chain has been added. Line-level sourcing is now implemented through RequestForQuotationLine and SupplierQuotationLine with reciprocal demand and PurchaseOrderLine traceability; remaining procurement depth and validation are still pending.
