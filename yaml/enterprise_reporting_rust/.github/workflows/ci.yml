# Enterprise Reporting — its own CI.
#
# This repository had no workflows at all until now. Nothing on GitHub checked a
# pull request, so `bun run precommit` passing was only ever true of whichever
# tree someone happened to run it in. The orchestrator
# (businessappwithai/app-and-report-with-ai-tanstack) does pin a commit of this
# repository and build it, but only as a Docker build context for its `report`
# and `seeder` services — it never runs this project's lint, types or build, so
# a regression in any of the three would reach that pin unnoticed.
#
# ── The two jobs ────────────────────────────────────────────────────────────
#
#   checks   `bun run precommit`, split into its three parts so a failure names
#            itself rather than reporting as "precommit". These are the same
#            three commands a contributor runs locally.
#   build    The production build, and then `format:check` a second time — see
#            below for why the second one is the point of the job.
#
# ── Why format:check runs again after the build ─────────────────────────────
#
# `src/routeTree.gen.ts` is written by the TanStack router generator on every
# `vite build`, in a shape Biome's formatter disagrees with. Formatting it by
# hand makes `format:check` pass exactly until the next build regenerates it —
# so a tree can pass the check, build, and fail it again with nothing modified
# and nothing in `git status`. `biome.json` excludes the generated file from the
# formatter for that reason, and running the check on both sides of a build is
# what keeps that exclusion honest.
#
# The two sides catch different mistakes, which is why both are here. Dropping
# the exclusion on its own turns the `checks` job red, because the committed
# file is in generator form. Dropping it *and* formatting the file by hand — the
# tempting fix, and the one that looks like it worked — leaves `checks` green:
# only the build job sees the generator put the file back and the check fail.
#
# The dirty-tree check beside it is the other half. The generator's output is
# deterministic and committed, so a build must leave the tree unchanged; a diff
# there means either a route was added without regenerating, or someone edited
# the generated file by hand.
#
# ── What this deliberately does not run ─────────────────────────────────────
#
# The Playwright suite under `e2e/`. It needs a dev server on port 4050, a
# PostgreSQL config database, and a signed-in session cached by
# `e2e/global-setup.ts` — its `webServer` config is commented out, so it does
# not start anything itself. That is a larger job than this one and worth doing
# separately; leaving it out is a decision, not an oversight.
#
# There is no `paths:` filter on purpose. `tsconfig.json` includes `**/*.ts`, so
# typecheck already covers `language/`, `scripts/`, `e2e/` and `tests/` as well
# as `src/` — any filter narrow enough to be useful would leave one of them
# unguarded. A path-filtered run that is skipped also reports no status at all,
# which makes these awkward to require later.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The version these steps were verified against, including the
# `--frozen-lockfile` install. package.json asks only for `>=1.3.0`; CI pins an
# exact one so a runner and a developer's tree agree.
env:
  BUN_VERSION: "1.3.11"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile so a lockfile that has drifted from package.json fails
      # here rather than being silently resolved into something CI never saw.
      - name: Install
        run: bun install --frozen-lockfile

      # Biome exits non-zero on errors only; the tree carries several hundred
      # pre-existing style warnings, and `lint` is not the place to argue with
      # them.
      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      # `biome format src` without --write IS the check. Biome v2 has no
      # --check flag, and passing one makes it ignore the whole invocation and
      # report success without having run.
      - name: Format check
        run: bun run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --bun vite build

      # The two checks this job exists for. See the header.
      - name: Format check survives the build
        run: bun run format:check

      - name: Build leaves no uncommitted changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
