rules:
  # ---- Section 2: Business rule — inbound lead scoring -----------------------
  # Scores a lead on firmographics and source, then grades it. The grade is what
  # routing (Section 3) and conversion (Section 22) both read, so the arithmetic
  # lives in exactly one place.
  - name: leadScoring
    title: Lead Scoring
    entity: Lead
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Lead Captured"
        type: start
      - id: B
        label: employee_count >= 1000?
        type: decision
      - id: C
        label: Add 35 firmographic points
        type: expression
      - id: D
        label: employee_count >= 100?
        type: decision
      - id: E
        label: Add 20 firmographic points
        type: expression
      - id: F
        label: Add 5 firmographic points
        type: expression
      - id: G
        label: lead_source == referral?
        type: decision
      - id: H
        label: Add 30 source points
        type: expression
      - id: I
        label: lead_source == event?
        type: decision
      - id: J
        label: Add 20 source points
        type: expression
      - id: K
        label: Add 8 source points
        type: expression
      - id: L
        label: annual_revenue > 10000000?
        type: decision
      - id: M
        label: Add 25 revenue points
        type: expression
      - id: N
        label: Add 5 revenue points
        type: expression
      - id: O
        label: Compute lead score
        type: function
      - id: P
        label: score >= 70?
        type: decision
      - id: Q
        label: Set rating hot
        type: expression
      - id: R
        label: score >= 40?
        type: decision
      - id: S
        label: Set rating warm
        type: expression
      - id: T
        label: Set rating cold
        type: expression
      - id: Z
        label: "End: Lead Scored"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: G
      - from: E
        to: G
      - from: F
        to: G
      - from: G
        to: H
        label: Yes
      - from: G
        to: I
        label: No
      - from: I
        to: J
        label: Yes
      - from: I
        to: K
        label: No
      - from: H
        to: L
      - from: J
        to: L
      - from: K
        to: L
      - from: L
        to: M
        label: Yes
      - from: L
        to: N
        label: No
      - from: M
        to: O
      - from: N
        to: O
      - from: O
        to: P
      - from: P
        to: Q
        label: Yes
      - from: P
        to: R
        label: No
      - from: R
        to: S
        label: Yes
      - from: R
        to: T
        label: No
      - from: Q
        to: Z
      - from: S
        to: Z
      - from: T
        to: Z
  # ---- Section 3: Business rule — lead routing -------------------------------
  # Who picks the lead up. Enterprise-sized leads never sit in the shared queue,
  # and a lead that arrived through a partner goes back to the partner desk
  # whatever its size.
  - name: leadRouting
    title: Lead Routing
    entity: Lead
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Lead Scored"
        type: start
      - id: B
        label: lead_source == partner?
        type: decision
      - id: C
        label: Route to Partner Desk
        type: expression
      - id: D
        label: annual_revenue > 50000000?
        type: decision
      - id: E
        label: Route to Strategic Accounts Team
        type: expression
      - id: F
        label: employee_count >= 500?
        type: decision
      - id: G
        label: Route to Enterprise Team
        type: expression
      - id: H
        label: rating == hot?
        type: decision
      - id: I
        label: Route to Mid Market Team
        type: expression
      - id: J
        label: Route to SMB Queue
        type: expression
      - id: K
        label: Assign owner from territory
        type: function
      - id: L
        label: owner assigned?
        type: decision
      - id: M
        label: Notify assigned owner
        type: expression
      - id: N
        label: Hold in unassigned queue
        type: expression
      - id: Z
        label: "End: Lead Routed"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
        label: No
      - from: H
        to: I
        label: Yes
      - from: H
        to: J
        label: No
      - from: C
        to: K
      - from: E
        to: K
      - from: G
        to: K
      - from: I
        to: K
      - from: J
        to: K
      - from: K
        to: L
      - from: L
        to: M
        label: Yes
      - from: L
        to: N
        label: No
      - from: M
        to: Z
      - from: N
        to: Z
  # ---- Section 4: Business rule — lead qualification gate --------------------
  # The gate a lead has to pass before it becomes an account. Its %%action is
  # what makes the conversion saga in Section 22 run — without it the saga would
  # either fire on every lead update or never fire at all.
  - name: leadQualification
    title: Lead Qualification
    entity: Lead
    event: beforeUpdate
    priority: 15
    nodes:
      - id: A
        label: "Start: Qualification Requested"
        type: start
      - id: B
        label: email present?
        type: decision
      - id: C
        label: "Reject: Contact email required"
        type: expression
      - id: D
        label: company_name present?
        type: decision
      - id: E
        label: "Reject: Company name required"
        type: expression
      - id: F
        label: score >= 40?
        type: decision
      - id: G
        label: Route back to nurturing
        type: expression
      - id: H
        label: owner assigned?
        type: decision
      - id: I
        label: "Reject: Owner required before conversion"
        type: expression
      - id: J
        label: Set status qualified
        type: expression
      - id: Z
        label: "End: Qualification Decided"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: No
      - from: D
        to: F
        label: Yes
      - from: F
        to: G
        label: No
      - from: F
        to: H
        label: Yes
      - from: H
        to: I
        label: No
      - from: H
        to: J
        label: Yes
      - from: C
        to: Z
      - from: E
        to: Z
      - from: G
        to: Z
      - from: I
        to: Z
      - from: J
        to: Z
    actions:
      - name: convertQualifiedLead
        type: trigger-workflow
        when: status == "qualified"
        props:
          workflow: LeadConversion
          message: Lead qualified — opening the account, contact and first opportunity
  # A qualified lead is converted by the multi-step workflow in Section 22.
  # The `when` is what keeps that workflow off every other lead update.

  # ---- Section 5: Business rule — opportunity forecasting --------------------
  # Probability and forecast category are derived, never typed in. Reps disagree
  # about what "70% likely" means; a stage does not.
  - name: opportunityForecast
    title: Opportunity Forecasting
    entity: Opportunity
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Opportunity Updated"
        type: start
      - id: B
        label: stage == closed_won?
        type: decision
      - id: C
        label: Set probability 100 and category closed
        type: expression
      - id: D
        label: stage == closed_lost?
        type: decision
      - id: E
        label: Set probability 0 and category omitted
        type: expression
      - id: F
        label: stage == negotiation?
        type: decision
      - id: G
        label: Set probability 80 and category commit
        type: expression
      - id: H
        label: stage == proposal?
        type: decision
      - id: I
        label: Set probability 60 and category best_case
        type: expression
      - id: J
        label: stage == needs_analysis?
        type: decision
      - id: K
        label: Set probability 40 and category pipeline
        type: expression
      - id: L
        label: stage == qualification?
        type: decision
      - id: M
        label: Set probability 20 and category pipeline
        type: expression
      - id: N
        label: Set probability 10 and category pipeline
        type: expression
      - id: O
        label: Recompute account pipeline
        type: function
      - id: P
        label: expected_close_date in the past?
        type: decision
      - id: Q
        label: Flag as slipped
        type: expression
      - id: R
        label: Keep current close date
        type: expression
      - id: Z
        label: "End: Forecast Recomputed"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
