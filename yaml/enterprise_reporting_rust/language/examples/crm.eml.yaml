        to: Z
  # ---- Section 7: Business rule — quote discount policy ----------------------
  # Discount authority by band. Anything past the rep's own authority stops the
  # quote and raises an approval; anything past the ceiling is refused outright
  # rather than sent up the chain, because no one is allowed to approve it.
  - name: quoteDiscountApproval
    title: Quote Discount Policy
    entity: Quote
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Quote Priced"
        type: start
      - id: B
        label: discount_percent > 40?
        type: decision
      - id: C
        label: "Reject: Above the maximum discount"
        type: expression
      - id: D
        label: discount_percent > 25?
        type: decision
      - id: E
        label: Require VP approval
        type: expression
      - id: F
        label: discount_percent > 15?
        type: decision
      - id: G
        label: Require sales manager approval
        type: expression
      - id: H
        label: discount_percent > 0?
        type: decision
      - id: I
        label: Auto approve within rep authority
        type: expression
      - id: J
        label: No discount applied
        type: expression
      - id: K
        label: Recompute grand total
        type: function
      - id: Z
        label: "End: Discount Decided"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
        label: No
      - from: H
        to: I
        label: Yes
      - from: H
        to: J
        label: No
      - from: E
        to: K
      - from: G
        to: K
      - from: I
        to: K
      - from: J
        to: K
      - from: C
        to: Z
      - from: K
        to: Z
    actions:
      - name: escalateDiscount
        type: trigger-workflow
        when: discount_percent > 15
        props:
          workflow: QuoteApprovalEscalation
          message: Discount above rep authority — holding the quote for approval
      - name: refuseDiscount
        type: validation-error
        when: discount_percent > 40
        props:
          message: Discounts above 40 percent cannot be approved by anyone — reprice the quote
  # Out-of-policy discounts hold the quote and raise an approval task; the
  # multi-step process that does it is Section 23.

  # ---- Section 8: Business rule — support case triage ------------------------
  # Priority is a function of who is asking and what broke, not of how the case
  # was worded. The %%action hands a critical case to the escalation process in
  # Section 24.
  - name: caseTriage
    title: Support Case Triage
    entity: SupportCase
    event: beforeCreate
    priority: 5
    nodes:
      - id: A
        label: "Start: Case Raised"
        type: start
      - id: B
        label: account tier == strategic?
        type: decision
      - id: C
        label: case_type == incident?
        type: decision
      - id: D
        label: Set priority critical
        type: expression
      - id: E
        label: Set priority high
        type: expression
      - id: F
        label: case_type == incident?
        type: decision
      - id: G
        label: account tier == enterprise?
        type: decision
      - id: H
        label: Set priority high
        type: expression
      - id: I
        label: Set priority medium
        type: expression
      - id: J
        label: case_type == billing?
        type: decision
      - id: K
        label: Set priority medium
        type: expression
      - id: L
        label: Set priority low
        type: expression
      - id: M
        label: Stamp SLA targets from policy
        type: function
      - id: N
        label: first response due within 60 minutes?
        type: decision
      - id: O
        label: Page the on-call queue
        type: expression
      - id: P
        label: Queue for the next available agent
        type: expression
      - id: Z
        label: "End: Case Triaged"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: D
        label: Yes
      - from: C
        to: E
        label: No
      - from: B
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: G
        to: H
        label: Yes
      - from: G
        to: I
        label: No
      - from: F
        to: J
        label: No
      - from: J
        to: K
        label: Yes
      - from: J
        to: L
        label: No
      - from: D
        to: M
      - from: E
        to: M
      - from: H
        to: M
      - from: I
        to: M
      - from: K
        to: M
      - from: L
        to: M
      - from: M
        to: N
      - from: N
        to: O
        label: Yes
      - from: N
        to: P
        label: No
      - from: O
        to: Z
      - from: P
        to: Z
    actions:
      - name: escalateCriticalCase
        type: trigger-workflow
        when: priority == "critical"
        props:
          workflow: CriticalCaseEscalation
          message: Critical case — escalating and raising an escalation task
      - name: requireResolutionNotes
        type: validation-error
        when: status == "resolved" and resolution_notes == null
        props:
          message: A resolved case needs resolution notes
  # A critical case escalates through Section 24 rather than waiting for an
  # agent to notice it.

  # ---- Section 9: Business rule — renewal risk -------------------------------
  # Grades a contract as its renewal window opens. The renewal playbook in
  # Section 26 evaluates this same rule as a step rather than forking a second
  # copy of the policy.
  - name: renewalRisk
    title: Renewal Risk
    entity: Contract
    event: beforeUpdate
    priority: 15
    nodes:
