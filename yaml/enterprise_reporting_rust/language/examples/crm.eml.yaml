hooks:
  # account_number is unique and minted here rather than supplied by the
  # caller. That is why it is OPTIONAL in the ERD: the conversion saga in
  # Section 22 inserts an account without one, and a NOT NULL column would
  # fail that insert before the hook ever ran. Postgres allows repeated NULLs
  # under a unique index, so nothing collides in the window before the hook
  # stamps a value. quote_number, contract_number and case_number are the
  # same shape for the same reason.
  - entity: Account
    event: beforeCreate
    handler: normalizeAccountName
    fields: [name]
  - entity: Account
    event: beforeCreate
    handler: assignAccountNumber
    fields: [account_number]
  - entity: Account
    event: customValidate
    handler: ensureAccountNumberUnique
    fields: [account_number]
  - entity: Account
    event: afterCreate
    handler: seedAccountTeam
  - entity: Account
    event: beforeList
    handler: scopeToTerritory
    fields: [territory_id]
  - entity: Account
    event: afterList
    handler: attachHealthScore
    fields: [health_score]
  - entity: Account
    event: beforeDelete
    handler: blockDeleteWithOpenBusiness
  - entity: Contact
    event: beforeCreate
    handler: normalizeEmail
    fields: [email]
  - entity: Contact
    event: customValidate
    handler: ensureUniqueEmail
    fields: [email]
  - entity: Contact
    event: afterCreate
    handler: enqueueWelcomeSequence
  - entity: Contact
    event: afterUpdate
    handler: syncToMarketingPlatform
    fields: [email_opt_out]
  - entity: Contact
    event: beforeRead
    handler: enforceFieldLevelSecurity
  - entity: Contact
    event: afterRead
    handler: maskPersonalData
    fields: [phone, mobile]
  - entity: Contact
    event: afterDelete
    handler: purgeMarketingConsent
  - entity: Lead
    event: beforeCreate
    handler: stampLeadSource
    fields: [lead_source]
  - entity: Lead
    event: customValidate
    handler: requireContactChannel
    fields: [email, phone]
  - entity: Lead
    event: afterCreate
    handler: notifyOwnerOfNewLead
  - entity: Lead
    event: beforeQuery
    handler: scopeToOwnedLeads
    fields: [owner_id]
  - entity: Lead
    event: afterQuery
    handler: annotateDuplicateLeads
    fields: [email]
  - entity: Opportunity
    event: beforeUpdate
    handler: snapshotStageChange
    fields: [stage]
  - entity: Opportunity
    event: customValidate
    handler: requireLossReasonOnLoss
    fields: [loss_reason]
  - entity: Opportunity
    event: afterCreate
    handler: notifySellingTeam
  - entity: Opportunity
    event: afterUpdate
    handler: recalculateAccountPipeline
    fields: [amount]
  - entity: Quote
    event: beforeCreate
    handler: generateQuoteNumber
    fields: [quote_number]
  - entity: Quote
    event: beforeUpdate
    handler: recalculateQuoteTotals
    fields: [grand_total]
  - entity: Quote
    event: customValidate
    handler: enforceDiscountCeiling
    fields: [discount_percent]
  - entity: Quote
    event: afterUpdate
    handler: regenerateQuoteDocument
  - entity: SupportCase
    event: beforeCreate
    handler: assignCaseNumber
    fields: [case_number]
  - entity: SupportCase
    event: beforeCreate
    handler: stampSlaTargets
    fields: [first_response_due_at, resolution_due_at]
  - entity: SupportCase
    event: beforeUpdate
    handler: captureFirstResponse
    fields: [first_response_at]
  - entity: SupportCase
    event: afterCreate
    handler: acknowledgeCustomer
  - entity: SupportCase
    event: afterUpdate
    handler: recomputeSlaBreach
    fields: [is_sla_breached]
  - entity: SupportCase
    event: beforeDelete
    handler: blockDeleteOfOpenCase
  - entity: SupportCase
    event: afterDelete
    handler: archiveCaseTranscript
  - entity: Contract
    event: beforeCreate
    handler: generateContractNumber
    fields: [contract_number]
  - entity: Contract
    event: customValidate
    handler: ensureTermMatchesDates
    fields: [start_date, end_date, term_months]
  - entity: Contract
    event: afterCreate
    handler: notifyFinanceOfNewContract
  - entity: Contract
    event: afterUpdate
    handler: scheduleRenewalReminders
    fields: [renewal_notice_days]
