# ============================================================================
# Enterprise Customer Relationship Management Platform
# EML — complete model: ERD · business rules · workflows

# Every rule, state and saga diagram below is stock Mermaid and renders as
# drawn. The ERD carries EML's OPTIONAL modifier, which Mermaid's ER grammar
# has no equivalent for, so it renders through toRenderableMermaid()
# (packages/web/src/lib/mermaid-render.ts) — the normalization the application
# applies to every ERD before handing it to Mermaid.

# Scope: the whole commercial lifecycle, front to back —
#   marketing   Campaign, CampaignMember, Lead
#   sales       Account, Contact, Opportunity, OpportunityLineItem, Product
#   commerce    Quote, QuoteLineItem, Contract
#   service     SupportCase, SlaPolicy
#   operations  User, Team, Territory, Activity

# Generate:
#   bun run generate:tanstack -- -i language/examples/crm.eml.mmd \
#     -o generated-projects/crm -n crm

# Check:
#   bun language/checker.ts language/examples/crm.eml.mmd

# ---- How the three layers fit together --------------------------------------
# Structure is the ERD in Section 1. Everything after it is behaviour, and the
# file is arranged so behaviour reads in the order it fires:

#   rules (2-9)      declarative decisions — scoring, routing, forecasting,
#                    discount policy, triage, renewal risk. Compiled to GoRules
#                    decision graphs and evaluated around the write.
#   state (10-14)    the lifecycle each revenue object moves through, and who
#                    is allowed to move it.
#   hooks (15-21)    imperative side effects bound to CRUD lifecycle events.
#   sagas (22-26)    multi-step, multi-entity processes: lead conversion,
#                    discount approval, case escalation, closed-won handoff,
#                    renewal playbook.

# Three of the sagas are `trigger: rule` — they run only when a rule's
# %%action names them, so the rule's condition is what decides. The other two
# run on the entity's own lifecycle. Both halves of that pairing are here on
# purpose: it is the difference between "escalate when the discount is out of
# policy" and "hand off every opportunity that closes".
# ============================================================================

# ---- Section 1: ERD --------------------------------------------------------

eml: "1.0"
name: Enterprise CRM
version: 1.0.0
enums:
  # ---- Enumerations ----------------------------------------------------------
  # Lifecycle enums carry exactly the states of the matching state workflow in
  # Sections 10-14; the rest are closed vocabularies for reporting fields.
  - name: UserRole
    values: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager, support_agent, support_manager, administrator]
  - name: LeadStatus
    values: [new, working, nurturing, qualified, converted, disqualified]
  - name: LeadRating
    values: [hot, warm, cold]
  - name: LeadSource
    values: [web, inbound_call, referral, event, partner, outbound, advertisement]
  - name: AccountType
    values: [prospect, customer, partner, reseller, former_customer]
  - name: AccountTier
    values: [strategic, enterprise, mid_market, smb]
  - name: AccountStatus
    values: [active, on_hold, churned]
  - name: Industry
    values: [technology, financial_services, healthcare, manufacturing, retail, public_sector, energy, education, other]
  - name: ContactStatus
    values: [active, inactive, bounced, do_not_contact]
  - name: OpportunityStage
    values: [prospecting, qualification, needs_analysis, proposal, negotiation, closed_won, closed_lost]
  - name: ForecastCategory
    values: [pipeline, best_case, commit, closed, omitted]
  - name: LossReason
    values: [price, product_fit, competitor, no_decision, timing, budget]
  - name: ProductFamily
    values: [platform, add_on, professional_services, support_plan, training]
  - name: QuoteStatus
    values: [draft, in_review, approved, rejected, presented, accepted, expired]
  - name: ContractStatus
    values: [draft, in_approval, active, expiring, renewed, expired, terminated]
  - name: CaseStatus
    values: [new, assigned, in_progress, waiting_on_customer, escalated, resolved, closed]
  - name: CasePriority
    values: [low, medium, high, critical]
  - name: CaseType
    values: [question, incident, defect, feature_request, billing]
  - name: CaseOrigin
    values: [email, phone, web, chat, partner_portal]
  - name: SlaTier
    values: [standard, premium, enterprise, platinum]
  - name: CampaignType
    values: [email, webinar, conference, paid_search, content, field_event, partner]
  - name: CampaignStatus
    values: [planning, active, completed, cancelled]
  - name: CampaignMemberStatus
    values: [targeted, invited, registered, attended, responded, converted, unsubscribed]
  - name: ActivityType
    values: [call, email, meeting, task, note, demo]
  - name: ActivityStatus
    values: [planned, in_progress, completed, cancelled]
  - name: ActivityPriority
    values: [low, medium, high, urgent]
categories:
  # ---- Entity categories ------------------------------------------------------
  # Group entities into dashboard sections. One block per category.
  - name: Accounts and Contacts
    description: Customer organisations, their people and the territories that cover them
    icon: Building2
    color: "#6366f1"
    entities: [Account, Contact, Territory]
  - name: Demand Generation
    description: Campaigns, campaign membership and inbound leads
    icon: Megaphone
    color: "#ec4899"
    entities: [Campaign, CampaignMember, Lead]
  - name: Sales Pipeline
    description: Opportunities, their line items and the products sold
    icon: TrendingUp
    color: "#0ea5e9"
    entities: [Opportunity, OpportunityLineItem, Product]
  - name: Quotes and Contracts
    description: Priced quotes, their line items and signed agreements
    icon: FileSignature
    color: "#14b8a6"
    entities: [Quote, QuoteLineItem, Contract]
  - name: Customer Service
    description: Support cases and the service levels that govern them
    icon: LifeBuoy
    color: "#f59e0b"
    entities: [SupportCase, SlaPolicy]
  - name: Activities
    description: Calls, emails, meetings and tasks logged against any record
    icon: CalendarClock
    color: "#8b5cf6"
    entities: [Activity]
  - name: People and Teams
    description: Users, selling teams and organisational structure
    icon: Users
    color: "#64748b"
    default: true
    entities: [User, Team]
