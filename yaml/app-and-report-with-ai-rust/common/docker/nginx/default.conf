# One origin, two applications.
#
#   http://localhost/app      the generated application
#   http://localhost/report   the reporting platform
#
# Neither prefix is stripped. Both applications are *built* to live under their
# prefix — bundler base, router basepath, static lookup — so an incoming
# /report/dashboard is the path the reporting app's router expects to match.
# Stripping here would give it /dashboard while every link it writes says
# /report/dashboard, and navigation would break on the first click.
#
# See common/build/subpath-overlay.ts for how that is applied.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, with a short TTL, and every upstream addressed
    # through a variable.
    #
    # nginx resolves a literal proxy_pass host once, at startup, and refuses to
    # start when it does not resolve. That makes the proxy depend on both
    # applications already being up — so a restart of either, or a compose
    # profile that starts them in a different order, takes the whole origin
    # down. Through a variable the name is resolved per request instead: an
    # application that is not up yet answers 502 and starts working the moment
    # it is, which is what a front door should do.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64m;

    # Redirects stay relative.
    #
    # The three `return` directives below are written as paths, and nginx turns
    # a relative redirect into an absolute one using `$host` and *the port it is
    # listening on* — 80, inside the container. Published anywhere else, which
    # is exactly what `./start.sh --port 8080` does, `/report` answered
    # `Location: http://localhost/report/`: the port dropped, and the browser
    # went to an origin with nothing on it. The three entry points a reader is
    # given — `/`, `/app` and `/report` — were the three that broke.
    #
    # Off, nginx sends the path it was given and the browser resolves it against
    # the origin it actually used, port and all.
    absolute_redirect off;

    # The root opens the running application.
    #
    # It used to serve the front-door page here: a document listing both
    # applications and every account, which is what somebody opening the site
    # saw first instead of an application. That page is still written, from the
    # reporting pack, and served at /accounts — the addresses and passwords
    # stay one link away, and `./start.sh` prints both applications' addresses
    # when it finishes — but the site itself opens on the application.
    location = / {
        return 302 /app/;
    }

    # The accounts for both applications, side by side: one pair per role the
    # model declares. `common/build/landing.ts` writes it from the reporting
    # pack, so the accounts on it are the model's own.
    location = /accounts {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
        default_type text/html;
    }

    location = /accounts/ {
        return 301 /accounts;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- The generated application's API: Loco, directly ---------------------
    #
    # The application's client calls `/app/api/…` — the subpath overlay moved
    # its `/api` literals under the prefix — and its API is the Loco backend,
    # which renders nothing and routes `/api/…`. So this is the one place a
    # prefix *is* taken off: the trailing slash on `proxy_pass` would do it for
    # a literal host, and through a variable the rewrite has to say so itself.
    # The front end is not in the path at all; it serves pages.
    #
    # Nothing is served at the root `/api/` any more. It used to go to the
    # generated front end, because that application could not be built under a
    # prefix and kept its root-absolute URLs; the Vite-based front end the Loco
    # stack generates can, and does, so every path it asks for is under /app/.
    location ^~ /app/api/ {
        set $app_api_upstream http://app-backend:4001;
        rewrite ^/app(/api/.*)$ $1 break;
        proxy_pass $app_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- The generated application -----------------------------------------
    location /app/ {
        set $app_upstream http://app-frontend:4000;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    location = /app {
        return 301 /app/;
    }

    # --- The reporting platform ---------------------------------------------
    #
    # Everything under /report/ goes to its TanStack Start server, API included:
    # that server forwards each route in rust/routes.json to the Rust backend
    # (ERS_RUST_API_URL), taking the prefix off first. The client address goes
    # along as a single X-Forwarded-For value, which is what the backend's
    # sign-in rate limit believes — a list is not trusted.
    location /report/ {
        set $report_upstream http://report:3000;
        proxy_pass $report_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /report;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    location = /report {
        return 301 /report/;
    }
}
