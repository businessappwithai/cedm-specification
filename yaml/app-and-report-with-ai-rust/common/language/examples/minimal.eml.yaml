# ============================================================================
# EML Minimal Example — smallest complete model with all three sections.
# Every diagram below is valid, renderable Mermaid.
# ============================================================================

# ---- Section 1: ERD (structure) -------------------------------------------

eml: "1.0"
name: Minimal Blog
enums:
  - name: PostStatus
    values: [draft, published, archived]
entities:
  - name: Author
    help: Somebody who writes for this blog. An author account is created when an editor invites a contributor, and it survives their posts — deactivating an author keeps everything they wrote readable and only stops them signing in and publishing again.
    attributes:
      - name: id
        type: string
        pk: true
      - name: email
        type: string
        unique: true
        help: The address the author signs in with and where editorial notifications are sent. Unique across the blog, because it is the identity, not a contact detail — changing it changes who the account belongs to.
      - name: name
        type: string
        help: The by-line, exactly as it should appear above a published post. This is the name readers see, so it is a display name rather than a legal one.
      - name: is_active
        type: boolean
        help: Whether this author may still sign in and publish. Cleared instead of deleting the account, which would orphan every post they wrote; the publish rule refuses a post whose author is inactive.
  - name: Post
    help: "One article, from first draft to archive. A post carries its own text and its own lifecycle, and the publish rule is what stands between a draft and a live URL: a post shorter than 100 characters, or written by an author who has been deactivated, cannot be published."
    attributes:
      - name: id
        type: string
        pk: true
      - name: author_id
        type: string
        fk: true
        help: The author whose by-line the post carries. It decides whose name appears above the article and whether the publish rule will let it go live, so it is set at creation and rarely changed afterwards.
      - name: title
        type: string
        help: The headline, as readers and search engines see it. Write it for a reader who has not opened the article yet — it is the whole of what most people will ever read of the post.
      - name: slug
        type: string
        unique: true
        help: "The URL segment the post is served at, generated from the title before the record is first saved. It is unique across the blog and should not change once a post is published: an edited slug breaks every link anyone has shared."
      - name: body
        type: text
        help: The article itself, in Markdown. The publish rule requires at least 100 characters, so a placeholder cannot reach a reader by accident.
      - name: status
        type: string
        enum: PostStatus
        help: draft — visible only to its author; published — live and indexed; archived — kept for the record but taken off the site. Only the publish rule moves a post out of draft.
      - name: published_at
        type: datetime
        optional: true
        help: When the post first went live. Left empty while a post is a draft and set once on the first publish, so it stays the article's original date through later edits.
    indexes:
      - columns: [slug]
        unique: true
relationships:
  - from: Author
    fromCardinality: exactly-one
    to: Post
    toCardinality: zero-or-more
    label: writes
hooks:
  - entity: Post
    event: beforeCreate
    handler: generateSlug
    fields: [slug]
  - entity: Post
    event: afterUpdate
    handler: reindexSearch
hookFlows:
  # ---- Section 3: Workflow (lifecycle hooks) --------------------------------
  - name: PostAuthoring
    title: Post Authoring
    entity: Post
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: generateSlug
      - id: D
        label: Process Post
      - id: E
        event: afterUpdate
        handler: reindexSearch
      - id: F
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
rules:
  # ---- Section 2: Business rule (declarative decision flow) ------------------
  - name: publishGate
    title: Publish Eligibility
    entity: Post
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Publish Requested"
        type: start
      - id: B
        label: Body length >= 100?
        type: decision
      - id: R1
        label: "Reject: Too Short"
        type: expression
      - id: C
        label: Author is_active?
        type: decision
      - id: R2
        label: "Reject: Inactive Author"
        type: expression
      - id: P
        label: Approve Publish
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: R1
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: R2
        label: No
      - from: C
        to: P
        label: Yes
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
