hooks:
  # A patient is never deleted once anything clinical hangs off them — an
  # encounter, an invoice, a dispensed prescription. The refusal is here
  # rather than in the UI because the record is reachable from the API and
  # from an import, and a deleted patient orphans a diagnosis.
  - entity: Patient
    event: beforeCreate
    handler: normalizePatientName
    fields: [last_name]
  - entity: Patient
    event: customValidate
    handler: ensureMedicalRecordNumberUnique
    fields: [medical_record_number]
  - entity: Patient
    event: afterCreate
    handler: openPatientTimeline
  - entity: Patient
    event: beforeList
    handler: scopeToTreatingDepartment
  - entity: Patient
    event: beforeDelete
    handler: blockDeleteWithClinicalHistory
  # Bed status is the one piece of state two records disagree about if
  # nobody owns it: `Bed.status` says whether it can be given out, and
  # `Admission` is what takes it. These four keep the pair honest — the bed
  # is checked before the admission is written, taken when it is, and given
  # back the moment a discharge time lands on the row.
  - entity: Admission
    event: beforeCreate
    handler: ensureBedAvailable
    fields: [bed_id]
  - entity: Admission
    event: afterCreate
    handler: occupyBed
    fields: [bed_id]
  - entity: Admission
    event: beforeUpdate
    handler: stampDischargedAt
    fields: [discharged_at]
  - entity: Admission
    event: afterUpdate
    handler: releaseBedOnDischarge
    fields: [bed_id]
  # Dispensing is where the clinical record and the pharmacy stock meet.
  # `decrementDispensedStock` is on afterUpdate rather than afterCreate
  # because stock moves when the prescription reaches `dispensed`, not when
  # it is written.
  - entity: Prescription
    event: beforeCreate
    handler: stampPrescribedAt
    fields: [prescribed_at]
  - entity: Prescription
    event: customValidate
    handler: ensurePrescriberIsLicensed
    fields: [doctor_id]
  - entity: Prescription
    event: afterUpdate
    handler: decrementDispensedStock
  - entity: Prescription
    event: afterList
    handler: attachDispensingStatus
  # Totals are arithmetic over the lines, so they are computed on the write
  # and never trusted from the caller: an invoice whose `total` disagrees
  # with its own lines is the one defect a billing system may not have.
  - entity: Invoice
    event: beforeCreate
    handler: computeInvoiceTotals
    fields: [total]
  - entity: Invoice
    event: customValidate
    handler: ensureInvoiceNumberUnique
    fields: [invoice_number]
  - entity: Invoice
    event: beforeUpdate
    handler: recomputeBalanceDue
    fields: [balance_due]
  - entity: Invoice
    event: afterList
    handler: attachAgeingBucket
hookFlows:
  # ---- Lifecycle hooks -------------------------------------------------------
  # Rules decide; hooks act on the write itself. Everything below is something
  # that has to happen on every path into the record — the API, an import, a
  # saga — and so cannot live in a screen. The hook flow is what a reader sees
  # and the `hooks` entries are what the generator compiles; both halves have to
  # say the same thing.
  - name: PatientRegistration
    title: Patient Registration
    entity: Patient
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: normalizePatientName
      - id: D
        event: customValidate
        handler: ensureMedicalRecordNumberUnique
      - id: E
        label: Process Patient
      - id: F
        event: afterCreate
        handler: openPatientTimeline
      - id: G
        event: beforeList
        handler: scopeToTreatingDepartment
      - id: H
        event: beforeDelete
        handler: blockDeleteWithClinicalHistory
      - id: I
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
  - name: BedOccupancy
    title: Bed Occupancy
    entity: Admission
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: ensureBedAvailable
      - id: D
        label: Process Admission
      - id: E
        event: afterCreate
        handler: occupyBed
      - id: F
        event: beforeUpdate
        handler: stampDischargedAt
      - id: G
        event: afterUpdate
        handler: releaseBedOnDischarge
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  - name: PrescriptionDispensing
    title: Prescription Dispensing
    entity: Prescription
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: stampPrescribedAt
      - id: D
        event: customValidate
        handler: ensurePrescriberIsLicensed
      - id: E
        label: Process Prescription
      - id: F
        event: afterUpdate
        handler: decrementDispensedStock
      - id: G
        event: afterList
        handler: attachDispensingStatus
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  - name: InvoiceCalculation
    title: Invoice Calculation
    entity: Invoice
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: computeInvoiceTotals
      - id: D
        event: customValidate
        handler: ensureInvoiceNumberUnique
      - id: E
        label: Process Invoice
      - id: F
        event: beforeUpdate
        handler: recomputeBalanceDue
      - id: G
        event: afterList
        handler: attachAgeingBucket
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
