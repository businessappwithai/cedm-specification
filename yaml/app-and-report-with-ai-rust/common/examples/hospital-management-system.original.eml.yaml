eml: "1.0"
name: Hospital Management System
version: 1.0.0
description: "A hospital information system covering the whole of a patient's contact with the hospital. It holds the master patient record and the insurance policies attached to it; departments, wards and beds; the staff who work in them, and the doctors and nurses among them. Around those sits the clinical record: appointments that become encounters, and encounters that carry clinical notes, vital signs, diagnoses and procedures. Orders flow out of an encounter — prescriptions and their items, lab orders and their results, imaging orders and the radiologist's report — and each has a lifecycle of its own that the application enforces rather than describes. An admission takes a bed out of the pool and gives it back on discharge. Billing turns what was done into invoice lines, applies the insurance policy, and settles the balance against payments. Pharmacy and consumable stock is tracked through inventory items, suppliers and stock transactions, and an item that falls to its reorder level raises a replenishment of its own."
enums:
  - name: PatientStatus
    values: [active, inactive, deceased]
  - name: AppointmentStatus
    values: [requested, confirmed, checked_in, completed, cancelled, no_show]
  - name: EncounterStatus
    values: [open, in_progress, completed, cancelled]
  - name: AdmissionStatus
    values: [planned, admitted, discharged, cancelled]
  - name: BedStatus
    values: [available, occupied, cleaning, maintenance]
  - name: PrescriptionStatus
    values: [draft, prescribed, dispensed, cancelled]
  - name: LabOrderStatus
    values: [ordered, collected, processing, completed, cancelled]
  - name: ImagingOrderStatus
    values: [ordered, scheduled, performed, reported, cancelled]
  - name: InvoiceStatus
    values: [draft, issued, partially_paid, paid, cancelled]
  - name: PaymentStatus
    values: [pending, completed, failed, refunded]
  - name: InventoryStatus
    values: [active, inactive]
  - name: StockTransactionStatus
    values: [pending, posted, cancelled]
categories:
  - name: Patient Administration
    icon: users
    entities: [Patient, Appointment, InsurancePolicy]
  - name: Clinical Care
    icon: stethoscope
    entities: [Department, Staff, Doctor, Nurse, Encounter, ClinicalNote, VitalSign, Diagnosis, Procedure]
  - name: Inpatient Care
    icon: bed
    entities: [Ward, Bed, Admission]
  - name: Pharmacy
    icon: pill
    entities: [Medication, Prescription]
  - name: Diagnostics
    icon: flask-conical
    entities: [LabOrder, LabResult, ImagingOrder, ImagingReport]
  - name: Billing
    icon: receipt
    entities: [Invoice, Payment]
  - name: Inventory
    icon: boxes
    entities: [InventoryItem, Supplier, StockTransaction]
entities:
  # Real DDL indexes, not hints. Each one is a query the application actually
  # makes — a ward board reading beds by ward and status, a doctor's day reading
  # appointments by doctor and time, a billing screen reading invoices by patient
  # and status — and on a table with a hundred thousand encounters the difference
  # is not academic. The `unique` ones back the UK columns above, which is what
  # makes the customValidate hooks below cheap to enforce.
  - name: Patient
    help: The master patient record containing identity, contact details and the hospital medical record number.
    icon: user-round
    attributes:
      - name: id
        type: string
        pk: true
      - name: medical_record_number
        type: string
        unique: true
        help: The permanent hospital identifier used to locate the patient's longitudinal record.
      - name: first_name
        type: string
        help: The patient's given name, as it should appear on wristbands and letters.
      - name: last_name
        type: string
        help: The patient's family name, used with the date of birth to confirm identity at every handover.
      - name: date_of_birth
        type: date
        help: The patient's date of birth used for age-sensitive clinical decisions.
      - name: gender
        type: string
        help: Recorded because it changes reference ranges, screening eligibility and ward placement.
      - name: phone
        type: phone
        optional: true
        help: The number the hospital calls to confirm or move an appointment.
      - name: email
        type: email
        optional: true
        help: Where appointment letters and results notifications are sent, when the patient opts in.
      - name: blood_group
        type: string
        optional: true
        help: The known blood group used when clinically relevant.
      - name: address
        type: string
        optional: true
        help: The residential address used for correspondence and for catchment reporting.
      - name: emergency_contact_name
        type: string
        optional: true
        help: Who to call when the patient cannot speak for themselves.
      - name: emergency_contact_phone
        type: phone
        optional: true
        help: The number for that contact. Checked on admission, not at the moment it is needed.
      - name: status
        type: string
        enum: PatientStatus
        help: Whether this record is in active use, archived, or closed because the patient has died.
    indexes:
      - columns: [medical_record_number]
        unique: true
      - columns: [last_name, first_name]
  - name: Department
    help: A clinical or operational department that owns staff, wards and scheduled services.
    icon: building-2
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        unique: true
        help: What the department is called on signage and in referral letters.
      - name: code
        type: string
        unique: true
        help: The short code used on orders and billing lines where the full name will not fit.
      - name: description
        type: string
        optional: true
        help: What this department treats, so referrers pick the right one.
  - name: Staff
    help: A hospital employee account used for clinical, operational and administrative work.
    icon: users
    attributes:
      - name: id
        type: string
        pk: true
      - name: employee_number
        type: string
        unique: true
        help: The payroll and badge identifier, and the way HR systems refer to this person.
      - name: first_name
        type: string
        help: The staff member's given name as it appears on their badge.
      - name: last_name
        type: string
        help: The staff member's family name, used in clinical records and sign-offs.
      - name: role
        type: string
        help: What this person is employed to do, which decides the screens and actions they get.
      - name: department_id
        type: string
        fk: true
        help: The department this person is established in, for rostering and cost allocation.
      - name: phone
        type: phone
        help: The extension or mobile used to reach them while on shift.
      - name: email
        type: email
        unique: true
        help: Their work address, used for notifications and account recovery.
      - name: is_active
        type: boolean
        help: False when they have left or are suspended; keeps the record without granting access.
    indexes:
      - columns: [employee_number]
        unique: true
  - name: Doctor
    help: A staff member with a medical license who can conduct encounters, prescribe and perform procedures.
    icon: stethoscope
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_id
        type: string
        fk: true
        help: The staff record this doctor is, so one person is not held twice.
      - name: license_number
        type: string
        unique: true
        help: The registration number that proves they may practise. Checked at credentialing.
      - name: specialty
        type: string
        help: What they are credentialed to treat, which constrains the referrals they can accept.
      - name: is_active
        type: boolean
        help: False when their registration lapses or they stop practising here.
    indexes:
      - columns: [license_number]
        unique: true
  - name: Nurse
    help: A nursing staff member who records observations and supports inpatient care.
    icon: heart-pulse
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_id
        type: string
        fk: true
        help: The staff record this nurse is, so one person is not held twice.
      - name: nursing_license
        type: string
        unique: true
        help: The registration number that proves they may practise.
      - name: grade
        type: string
        help: The banding that decides what they may do unsupervised and how shifts are costed.
      - name: is_active
        type: boolean
        help: False when their registration lapses or they leave.
  - name: Ward
    help: An inpatient care area within a department containing beds.
    icon: bed-double
    attributes:
      - name: id
        type: string
        pk: true
      - name: department_id
        type: string
        fk: true
        help: The department that runs this ward and carries its costs.
      - name: name
        type: string
        help: What the ward is called on signage and in bed-management conversations.
      - name: ward_type
        type: string
        help: What kind of care the ward is equipped for, which limits who can be admitted to it.
      - name: capacity
        type: integer
        help: How many beds the ward is established for, against which occupancy is reported.
  - name: Bed
    help: A physical inpatient bed whose availability is controlled by admissions and cleaning.
    icon: bed
    attributes:
      - name: id
        type: string
        pk: true
      - name: ward_id
        type: string
        fk: true
        help: The ward this bed stands in.
      - name: bed_number
        type: string
        help: The bay and bed label staff use to find the patient.
      - name: status
        type: string
        enum: BedStatus
        help: Whether the bed can take a patient now, is occupied, or is out of use for cleaning or repair.
    indexes:
      - columns: [ward_id, status]
  - name: Appointment
    help: A scheduled patient visit with a doctor or department.
    icon: calendar
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient who is expected to attend the appointment.
      - name: doctor_id
        type: string
        fk: true
        help: The doctor responsible for the scheduled visit.
      - name: department_id
        type: string
        fk: true
        help: The department the patient is being seen by.
      - name: scheduled_at
        type: datetime
        help: When the patient is expected. Drives reminders and the clinic list.
      - name: reason
        type: string
        help: Why the appointment was made, in the referrer's words, so the clinician can prepare.
      - name: status
        type: string
        enum: AppointmentStatus
        help: Where the appointment has got to, from requested through to attended or missed.
      - name: notes
        type: string
        optional: true
        help: Anything the booking clerk needs the clinic to know — interpreter, transport, access.
    indexes:
      - columns: [doctor_id, scheduled_at]
      - columns: [patient_id, status]
  - name: Encounter
    help: The clinical episode where a doctor evaluates and treats a patient.
    icon: clipboard-list
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient receiving care during the clinical episode.
      - name: doctor_id
        type: string
        fk: true
        help: The doctor responsible for the clinical encounter.
      - name: appointment_id
        type: string
        fk: true
        optional: true
        help: The appointment this encounter arose from, when it was a booked one.
      - name: department_id
        type: string
        fk: true
        help: The department accountable for this episode of care.
      - name: started_at
        type: datetime
        help: When the clinician actually began, which is what clinical timings are measured from.
      - name: ended_at
        type: datetime
        optional: true
        help: When the encounter closed. Empty while it is still open.
      - name: status
        type: string
        enum: EncounterStatus
        help: Whether the encounter is open, in progress, finished or abandoned.
      - name: chief_complaint
        type: string
        help: What the patient said was wrong, in their own words.
      - name: clinical_summary
        type: string
        optional: true
        help: The clinician's account of what was found and decided, written at the close.
    indexes:
      - columns: [patient_id, started_at]
  - name: Admission
    help: An inpatient stay linking a patient and encounter to a ward and bed.
    icon: log-in
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient occupying the bed.
      - name: encounter_id
        type: string
        fk: true
        help: The encounter that led to admission, tying the stay to its clinical reason.
      - name: ward_id
        type: string
        fk: true
        help: The ward the patient is admitted to.
      - name: bed_id
        type: string
        fk: true
        help: The physical bed assigned to this inpatient stay.
      - name: admitted_at
        type: datetime
        help: When the patient took the bed. Length of stay is measured from here.
      - name: discharged_at
        type: datetime
        optional: true
        help: When the patient left. Empty while they are still in.
      - name: status
        type: string
        enum: AdmissionStatus
        help: Whether the admission is planned, current, discharged or cancelled.
      - name: discharge_summary
        type: string
        optional: true
        help: What happened during the stay and what happens next, sent to the GP.
    indexes:
      - columns: [ward_id, status]
  - name: ClinicalNote
    help: A narrative clinical note authored against an encounter.
    icon: notebook-pen
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter this note belongs to.
      - name: author_id
        type: string
        fk: true
        help: The staff member accountable for the clinical note.
      - name: note_type
        type: string
        help: What kind of note it is, which decides where it appears in the record.
      - name: note_text
        type: text
        help: The note itself. Part of the legal record and never edited after the fact.
  - name: VitalSign
    help: A time-stamped set of patient observations recorded during an encounter.
    icon: activity
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter these observations were taken during.
      - name: recorded_by_id
        type: string
        fk: true
        help: Who took the observations, so a questionable reading can be checked with them.
      - name: recorded_at
        type: datetime
        help: When they were taken, which is what a deteriorating trend is read against.
      - name: temperature
        type: decimal
        optional: true
        help: Body temperature in degrees Celsius.
      - name: pulse
        type: integer
        optional: true
        help: Heart rate in beats per minute.
      - name: respiratory_rate
        type: integer
        optional: true
        help: Breaths per minute — the earliest sign of deterioration in most patients.
      - name: systolic_bp
        type: integer
        optional: true
        help: Systolic blood pressure in mmHg.
      - name: diastolic_bp
        type: integer
        optional: true
        help: Diastolic blood pressure in mmHg.
      - name: oxygen_saturation
        type: decimal
        optional: true
        help: Peripheral oxygen saturation as a percentage.
      - name: weight
        type: decimal
        optional: true
        help: Body weight in kilograms, used to calculate doses.
  - name: Diagnosis
    help: A diagnosis recorded against an encounter, including its clinical code and whether it is primary.
    icon: scan-search
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter at which this diagnosis was made.
      - name: recorded_by_id
        type: string
        fk: true
        help: The clinician who made it and is accountable for it.
      - name: diagnosis_code
        type: string
        help: The coded diagnosis, which is what reporting and reimbursement are driven from.
      - name: diagnosis_name
        type: string
        help: The diagnosis in words, for anyone reading the record rather than counting it.
      - name: diagnosis_type
        type: string
        help: Whether this is the condition treated, a comorbidity, or a complication.
      - name: primary_diagnosis
        type: boolean
        help: True for the one condition that most explains the episode of care.
  - name: Procedure
    help: A billable or clinical procedure performed during an encounter.
    icon: scissors
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter during which the procedure was performed.
      - name: doctor_id
        type: string
        fk: true
        help: The doctor who performed it and is accountable for it.
      - name: procedure_code
        type: string
        help: The coded procedure, which drives billing and activity reporting.
      - name: procedure_name
        type: string
        help: The procedure in words, for the clinical record.
      - name: performed_at
        type: datetime
        optional: true
        help: When it was done.
      - name: charge
        type: decimal
        help: What is billed for the procedure before insurance is applied.
      - name: notes
        type: string
        optional: true
        help: Anything about how it went that the coded record cannot carry.
  - name: Medication
    help: A catalog item that can be prescribed to a patient.
    icon: pill
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        unique: true
        help: The brand or trade name staff will search for.
      - name: generic_name
        type: string
        help: The active ingredient, which is what allergy and interaction checks compare.
      - name: form
        type: string
        help: How it is given — tablet, capsule, injection — which changes the dose that makes sense.
      - name: strength
        type: string
        help: The amount of active ingredient per unit, e.g. 500 mg.
      - name: manufacturer
        type: string
        optional: true
        help: Who makes it, which matters for recalls and for supply substitution.
      - name: is_active
        type: boolean
        help: False when the formulary drops it; keeps history without offering it for new prescriptions.
  - name: Prescription
    help: A doctor's medication order for a patient arising from an encounter.
    icon: file-text
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter this prescription was written during.
      - name: patient_id
        type: string
        fk: true
        help: The patient it is for. Held directly so pharmacy can work without opening the encounter.
      - name: doctor_id
        type: string
        fk: true
        help: The prescriber, who is accountable for it.
      - name: prescribed_at
        type: datetime
        help: When it was written, which starts the clock on its validity.
      - name: status
        type: string
        enum: PrescriptionStatus
        help: Where it has got to, from draft through dispensed or cancelled.
      - name: instructions
        type: string
        optional: true
        help: What the patient is told to do, printed on the label.
    indexes:
      - columns: [patient_id, prescribed_at]
  - name: PrescriptionItem
    help: One medication, dose, frequency and duration within a prescription.
    icon: list-checks
    parent: Prescription
    attributes:
      - name: id
        type: string
        pk: true
      - name: prescription_id
        type: string
        fk: true
        help: The prescription this line belongs to.
      - name: medication_id
        type: string
        fk: true
        help: The medication selected from the hospital medication catalog.
      - name: dose
        type: decimal
        help: How much is taken each time.
      - name: dose_unit
        type: string
        help: The unit the dose is measured in, without which the number is meaningless.
      - name: frequency
        type: string
        help: How often it is taken, e.g. three times a day.
      - name: duration_days
        type: integer
        help: How many days the course runs for.
      - name: quantity
        type: integer
        help: How many units to dispense, which is what pharmacy counts out.
    indexes:
      - columns: [prescription_id]
  - name: LabOrder
    help: A laboratory test requested for a patient and tracked through collection and processing.
    icon: test-tube
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter the test was ordered during.
      - name: patient_id
        type: string
        fk: true
        help: The patient the sample is from. Held directly so the lab can work without the encounter.
      - name: ordered_by_id
        type: string
        fk: true
        help: The clinician who ordered it and who the result goes back to.
      - name: test_name
        type: string
        help: What was asked for.
      - name: priority
        type: string
        help: How urgently the result is needed, which decides where it sits in the lab queue.
      - name: ordered_at
        type: datetime
        help: When it was requested. Turnaround is measured from here.
      - name: collected_at
        type: datetime
        optional: true
        help: When the sample was actually taken. Empty until it is.
      - name: status
        type: string
        enum: LabOrderStatus
        help: Where the order has got to, from ordered through to completed or cancelled.
    indexes:
      - columns: [patient_id, status]
  - name: LabResult
    help: A laboratory result that belongs to a lab order and may require verification.
    icon: microscope
    attributes:
      - name: id
        type: string
        pk: true
      - name: lab_order_id
        type: string
        fk: true
        help: The order this result answers.
      - name: result_value
        type: string
        help: The measured value.
      - name: result_unit
        type: string
        optional: true
        help: The unit it was measured in, without which the value cannot be read.
      - name: reference_range
        type: string
        optional: true
        help: The normal range for this test, so the value can be judged.
      - name: interpretation
        type: string
        optional: true
        help: What the lab concluded — normal, high, low, critical.
      - name: verified_by_id
        type: string
        fk: true
        optional: true
        help: The staff member who verified the laboratory result.
      - name: verified_at
        type: datetime
        optional: true
        help: When a qualified person checked and released it. Unverified results are not acted on.
    indexes:
      - columns: [lab_order_id]
  - name: ImagingOrder
    help: A diagnostic imaging request tracked from ordering through reporting.
    icon: scan
    attributes:
      - name: id
        type: string
        pk: true
      - name: encounter_id
        type: string
        fk: true
        help: The encounter the imaging was ordered during.
      - name: patient_id
        type: string
        fk: true
        help: The patient to be imaged. Held directly so radiology can work without the encounter.
      - name: ordered_by_id
        type: string
        fk: true
        help: The clinician who ordered it and who the report goes back to.
      - name: modality
        type: string
        help: The kind of imaging — X-ray, CT, MRI — which decides the room and the preparation.
      - name: body_site
        type: string
        help: What is to be imaged, which the radiographer positions for.
      - name: priority
        type: string
        help: How urgently it is needed, which decides its place in the list.
      - name: ordered_at
        type: datetime
        help: When it was requested.
      - name: performed_at
        type: datetime
        optional: true
        help: When the images were actually taken. Empty until they are.
      - name: status
        type: string
        enum: ImagingOrderStatus
        help: Where the order has got to, from ordered through to reported or cancelled.
    indexes:
      - columns: [patient_id, status]
  - name: ImagingReport
    help: A radiologist's final interpretation of an imaging order.
    icon: file-image
    attributes:
      - name: id
        type: string
        pk: true
      - name: imaging_order_id
        type: string
        fk: true
        help: The imaging order this report answers.
      - name: radiologist_id
        type: string
        fk: true
        help: The doctor responsible for the final imaging interpretation.
      - name: findings
        type: text
        help: What the radiologist saw, described without conclusion.
      - name: impression
        type: text
        help: What the radiologist concludes it means. This is what the referrer acts on.
      - name: reported_at
        type: datetime
        help: When the report was issued, which is when the referrer could first have acted.
    indexes:
      - columns: [imaging_order_id]
  - name: InsurancePolicy
    help: A patient's active or historical insurance coverage used for billing.
    icon: shield-check
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient covered by the policy.
      - name: insurer_name
        type: string
        help: Who the insurer is, and therefore who is billed.
      - name: policy_number
        type: string
        unique: true
        help: The policy's identifier, quoted on every claim.
      - name: member_number
        type: string
        optional: true
        help: The patient's identifier with that insurer, which differs from the policy number.
      - name: valid_from
        type: date
        help: When cover starts. A claim before this date is the patient's to pay.
      - name: valid_to
        type: date
        help: When cover ends.
      - name: coverage_percent
        type: decimal
        help: What share of a charge the insurer pays, which decides the patient's balance.
      - name: is_active
        type: boolean
        help: False when the policy lapses or is superseded.
    indexes:
      - columns: [policy_number]
        unique: true
  - name: Invoice
    help: A patient charge document summarizing services and the amount still owed.
    icon: receipt
    attributes:
      - name: id
        type: string
        pk: true
      - name: patient_id
        type: string
        fk: true
        help: The patient the invoice is raised against.
      - name: encounter_id
        type: string
        fk: true
        optional: true
        help: The episode of care being billed for.
      - name: insurance_policy_id
        type: string
        fk: true
        optional: true
        help: The insurance policy used to determine covered charges.
      - name: invoice_number
        type: string
        unique: true
        help: The reference quoted on statements and in every payment conversation.
      - name: invoice_date
        type: date
        help: When it was raised, which starts the payment terms.
      - name: subtotal
        type: decimal
        help: The sum of the lines before tax.
      - name: tax
        type: decimal
        help: Tax charged on the subtotal.
      - name: total
        type: decimal
        help: What is owed in full before payments and insurance.
      - name: balance_due
        type: decimal
        help: The remaining amount payable after payments and adjustments.
      - name: status
        type: string
        enum: InvoiceStatus
        help: Where the invoice has got to, from draft through paid, part-paid or written off.
    indexes:
      - columns: [invoice_number]
        unique: true
      - columns: [patient_id, status]
  - name: InvoiceLine
    help: One billable service or charge on an invoice.
    icon: list-checks
    parent: Invoice
    attributes:
      - name: id
        type: string
        pk: true
      - name: invoice_id
        type: string
        fk: true
        help: The invoice this line belongs to.
      - name: description
        type: string
        help: What is being charged for, in words the patient can recognise.
      - name: quantity
        type: integer
        help: How many units of it.
      - name: unit_price
        type: decimal
        help: The price of one unit before tax.
      - name: line_total
        type: decimal
        help: Quantity times unit price, held so the invoice does not change if a price later does.
      - name: service_type
        type: string
        help: What kind of service this is, which drives reporting and insurer categories.
    indexes:
      - columns: [invoice_id]
  - name: Payment
    help: A financial receipt applied to an invoice.
    icon: banknote
    attributes:
      - name: id
        type: string
        pk: true
      - name: invoice_id
        type: string
        fk: true
        help: The invoice this payment is against.
      - name: amount
        type: decimal
        help: How much was paid.
      - name: method
        type: string
        help: How it was paid, which decides reconciliation and refund route.
      - name: paid_at
        type: datetime
        help: When it was received.
      - name: status
        type: string
        enum: PaymentStatus
        help: Whether the payment cleared, is pending, or failed and must be chased.
      - name: reference
        type: string
        optional: true
        help: The bank or card reference, which is how a disputed payment is traced.
    indexes:
      - columns: [invoice_id, status]
  - name: InventoryItem
    help: A stock-controlled medicine, consumable or other hospital item.
    icon: package
    attributes:
      - name: id
        type: string
        pk: true
      - name: sku
        type: string
        unique: true
        help: The stock code used on orders and on the shelf label.
      - name: name
        type: string
        help: What the item is called when someone is looking for it.
      - name: item_type
        type: string
        help: What kind of item it is, which decides storage and who may order it.
      - name: unit
        type: string
        help: The unit stock is counted in, without which quantities cannot be compared.
      - name: reorder_level
        type: integer
        help: The quantity at which more is ordered. Set too low and the shelf empties.
      - name: quantity_on_hand
        type: integer
        help: How much is physically in stock now.
      - name: unit_cost
        type: decimal
        help: What one unit costs, used to value the stock held.
      - name: status
        type: string
        enum: InventoryStatus
        help: Whether the item is in use, discontinued, or temporarily unavailable.
    indexes:
      - columns: [sku]
        unique: true
  - name: Supplier
    help: An external supplier providing stock items to the hospital.
    icon: truck
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        unique: true
        help: Who the supplier is, as it appears on purchase orders.
      - name: phone
        type: phone
        optional: true
        help: The number used to chase a late delivery.
      - name: email
        type: email
        optional: true
        help: Where purchase orders are sent.
      - name: address
        type: string
        optional: true
        help: Where goods are returned to and invoices come from.
      - name: is_active
        type: boolean
        help: False when the contract ends; keeps history without offering them for new orders.
  - name: StockTransaction
    help: An inbound, outbound or adjustment movement of an inventory item.
    icon: arrow-left-right
    attributes:
      - name: id
        type: string
        pk: true
      - name: inventory_item_id
        type: string
        fk: true
        help: The stock item whose quantity changes in this transaction.
      - name: supplier_id
        type: string
        fk: true
        optional: true
        help: The supplier involved, when the movement is a receipt or a return.
      - name: transaction_type
        type: string
        help: Whether stock came in, went out, or was corrected — which decides the sign.
      - name: quantity
        type: integer
        help: How many units moved.
      - name: unit_cost
        type: decimal
        optional: true
        help: What each unit cost in this movement, which is what stock is valued at.
      - name: reference_number
        type: string
        optional: true
        help: The delivery note or requisition this movement came from.
      - name: transaction_at
        type: datetime
        help: When the movement happened.
      - name: status
        type: string
        enum: StockTransactionStatus
        help: Whether the movement is confirmed or still pending.
    indexes:
      - columns: [inventory_item_id, transaction_at]
