triggers:
  # Nobody presses these; the clock does. A trigger is validated rather
  # than compiled, so it documents the schedule the operator has to provide
  # rather than creating it — check the construct's status before promising
  # a user that it runs.
  - entity: Appointment
    source: cron:0 7 * * *
    handler: remindTomorrowsAppointments
  - entity: Appointment
    source: cron:0 1 * * *
    handler: expireUnconfirmedAppointments
  - entity: Invoice
    source: cron:0 2 * * *
    handler: flagOverdueInvoices
  - entity: StockTransaction
    source: cron:0 3 * * 1
    handler: reconcileStockOnHand
rules:
  - name: patientValidation
    title: Patient Validation
    entity: Patient
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Patient registration
        type: start
      - id: B
        label: medical_record_number present?
        type: decision
      - id: C
        label: Accept registration
        type: expression
      - id: D
        label: Reject registration
        type: expression
      - id: Z
        label: Patient accepted
        type: end
      - id: E
        label: Registration rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: requirePatientNumber
        type: validation-error
        when: medical_record_number == null
        props:
          message: Medical record number is required
  - name: appointmentGate
    title: Appointment Gate
    entity: Appointment
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Appointment request
        type: start
      - id: B
        label: scheduled_at present?
        type: decision
      - id: C
        label: Accept appointment
        type: expression
      - id: D
        label: Reject appointment
        type: expression
      - id: Z
        label: Appointment accepted
        type: end
      - id: E
        label: Appointment rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: requireAppointmentTime
        type: validation-error
        when: scheduled_at == null
        props:
          message: Appointment date and time are required
      - name: startEncounterWorkflow
        type: trigger-workflow
        when: status == "checked_in"
        props:
          workflow: AppointmentToEncounter
          message: Checked-in appointment creates an encounter
  - name: prescriptionSafety
    title: Prescription Safety
    entity: Prescription
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Prescription request
        type: start
      - id: B
        label: doctor present?
        type: decision
      - id: C
        label: Accept prescription
        type: expression
      - id: D
        label: Reject prescription
        type: expression
      - id: Z
        label: Prescription accepted
        type: end
      - id: E
        label: Prescription rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: requirePrescribingDoctor
        type: validation-error
        when: doctor_id == null
        props:
          message: A prescribing doctor is required
  - name: admissionAllocationGate
    title: Admission Allocation Gate
    entity: Admission
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Admission planned
        type: start
      - id: B
        label: bed present?
        type: decision
      - id: C
        label: Allocate admission
        type: expression
      - id: D
        label: Reject admission
        type: expression
      - id: Z
        label: Admission accepted
        type: end
      - id: E
        label: Admission rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: requireAdmissionBed
        type: validation-error
        when: bed_id == null
        props:
          message: An assigned bed is required for an admission
      - name: startAdmissionWorkflow
        type: trigger-workflow
        when: status == "planned"
        props:
          workflow: AdmissionBedAllocation
          message: Planned admission allocates the assigned bed
  - name: labCompletionGate
    title: Lab Completion Gate
    entity: LabResult
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Lab result
        type: start
      - id: B
        label: result value present?
        type: decision
      - id: C
        label: Accept result
        type: expression
      - id: D
        label: Reject result
        type: expression
      - id: Z
        label: Result accepted
        type: end
      - id: E
        label: Result rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: requireLabValue
        type: validation-error
        when: result_value == null
        props:
          message: Laboratory result value is required
  - name: invoiceIntegrity
    title: Invoice Integrity
    entity: Invoice
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Invoice
        type: start
      - id: B
        label: total >= 0?
        type: decision
      - id: C
        label: Accept invoice
        type: expression
      - id: D
        label: Reject invoice
        type: expression
      - id: Z
        label: Invoice accepted
        type: end
      - id: E
        label: Invoice rejected
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: E
    actions:
      - name: rejectNegativeInvoice
        type: validation-error
        when: total < 0
        props:
          message: Invoice total cannot be negative
  - name: paymentSettlementGate
    title: Payment Settlement Gate
    entity: Payment
    event: afterUpdate
    priority: 10
    nodes:
      - id: A
        label: Payment updated
        type: start
      - id: B
        label: status == completed?
        type: decision
      - id: C
        label: Apply settlement
        type: expression
      - id: D
        label: Leave invoice open
        type: expression
      - id: Z
        label: Settlement started
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: Z
    actions:
      - name: startPaymentSettlement
        type: trigger-workflow
        when: status == "completed"
        props:
          workflow: InvoicePaymentSettlement
          message: Completed payment updates the invoice
  - name: inventoryReorder
    title: Inventory Reorder
    entity: InventoryItem
    event: afterUpdate
    priority: 20
    nodes:
      - id: A
        label: Inventory updated
        type: start
      - id: B
        label: quantity_on_hand <= reorder_level?
        type: decision
      - id: C
        label: Flag for replenishment
        type: expression
      - id: D
        label: No replenishment action
        type: expression
      - id: Z
        label: Reorder evaluation complete
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: C
        to: Z
      - from: D
        to: Z
stateMachines:
  - name: AppointmentLifecycle
    title: Appointment Lifecycle
    entity: Appointment
    states: [requested, confirmed, cancelled, checked_in, no_show, completed]
    initial: requested
    final: [completed, cancelled, no_show]
    transitions:
      - from: requested
        to: confirmed
        trigger: confirm
      - from: requested
        to: cancelled
        trigger: cancel
      - from: confirmed
        to: checked_in
        trigger: check_in
      - from: confirmed
        to: cancelled
        trigger: cancel
      - from: confirmed
        to: no_show
        trigger: mark_no_show
      - from: checked_in
        to: completed
        trigger: complete
      - from: checked_in
        to: cancelled
        trigger: cancel
  - name: EncounterLifecycle
    title: Encounter Lifecycle
    entity: Encounter
    states: [open, in_progress, cancelled, completed]
    initial: open
    final: [completed, cancelled]
    transitions:
      - from: open
        to: in_progress
        trigger: start
      - from: open
        to: cancelled
        trigger: cancel
      - from: in_progress
        to: completed
        trigger: complete
      - from: in_progress
        to: cancelled
        trigger: cancel
  - name: AdmissionLifecycle
    title: Admission Lifecycle
    entity: Admission
    states: [planned, admitted, cancelled, discharged]
    initial: planned
    final: [discharged, cancelled]
    transitions:
      - from: planned
        to: admitted
        trigger: admit
      - from: planned
        to: cancelled
        trigger: cancel
      - from: admitted
        to: discharged
        trigger: discharge
  - name: PrescriptionLifecycle
    title: Prescription Lifecycle
    entity: Prescription
    states: [draft, prescribed, cancelled, dispensed]
    initial: draft
    final: [dispensed, cancelled]
    transitions:
      - from: draft
        to: prescribed
        trigger: prescribe
      - from: draft
        to: cancelled
        trigger: cancel
      - from: prescribed
        to: dispensed
        trigger: dispense
      - from: prescribed
        to: cancelled
        trigger: cancel
  - name: LabOrderLifecycle
    title: Lab Order Lifecycle
    entity: LabOrder
    states: [ordered, collected, cancelled, processing, completed]
    initial: ordered
    final: [completed, cancelled]
    transitions:
      - from: ordered
        to: collected
        trigger: collect
      - from: ordered
        to: cancelled
        trigger: cancel
      - from: collected
        to: processing
        trigger: process
      - from: processing
        to: completed
        trigger: complete
  - name: ImagingOrderLifecycle
    title: Imaging Order Lifecycle
    entity: ImagingOrder
    states: [ordered, scheduled, cancelled, performed, reported]
    initial: ordered
    final: [reported, cancelled]
    transitions:
      - from: ordered
        to: scheduled
        trigger: schedule
      - from: ordered
        to: cancelled
        trigger: cancel
      - from: scheduled
        to: performed
        trigger: perform
      - from: performed
        to: reported
        trigger: report
  - name: InvoiceLifecycle
    title: Invoice Lifecycle
    entity: Invoice
    states: [draft, issued, cancelled, partially_paid, paid]
    initial: draft
    final: [paid, cancelled]
    transitions:
      - from: draft
        to: issued
        trigger: issue
      - from: draft
        to: cancelled
        trigger: cancel
      - from: issued
        to: partially_paid
        trigger: record_partial_payment
      - from: issued
        to: paid
        trigger: settle
      - from: partially_paid
        to: paid
        trigger: settle
      - from: issued
        to: cancelled
        trigger: cancel
  - name: PaymentLifecycle
    title: Payment Lifecycle
    entity: Payment
    states: [pending, completed, failed, refunded]
    initial: pending
    final: [failed, refunded]
    transitions:
      - from: pending
        to: completed
        trigger: complete
      - from: pending
        to: failed
        trigger: fail
      - from: completed
        to: refunded
        trigger: refund
  - name: StockTransactionLifecycle
    title: Inventory Transaction Lifecycle
    entity: StockTransaction
    states: [pending, posted, cancelled]
    initial: pending
    final: [posted, cancelled]
    transitions:
      - from: pending
        to: posted
        trigger: post
      - from: pending
        to: cancelled
        trigger: cancel
sagas:
  - name: AppointmentToEncounter
    title: Appointment To Encounter
    entity: Appointment
    trigger: rule
    steps:
      - id: B
        type: CreateEntity
        label: Create encounter
        properties:
          entity: Encounter
          as: encounterId
          fields: '{"patient_id":"patient_id","doctor_id":"doctor_id","appointment_id":"id","department_id":"department_id","status":"open","chief_complaint":"reason","started_at":"scheduled_at"}'
      - id: C
        type: UpdateEntity
        label: Link appointment
        properties:
          field: status
          value: checked_in
  - name: AdmissionBedAllocation
    title: Admission Bed Allocation
    entity: Admission
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Occupy assigned bed
        properties:
          entity: Bed
          targetSource: bed_id
          field: status
          value: occupied
      - id: C
        type: UpdateEntity
        label: Mark admission admitted
        properties:
          field: status
          value: admitted
  - name: InvoicePaymentSettlement
    title: Invoice Payment Settlement
    entity: Payment
    trigger: rule
    steps:
      - id: B
        type: Formula
        label: Apply payment to invoice
        properties:
          target: newBalance
          operation: subtract
          source: balance_due
          operand: amount
      - id: C
        type: UpdateEntity
        label: Recalculate balance
        properties:
          entity: Invoice
          targetField: invoice_id
          field: balance_due
          source: newBalance
      - id: D
        type: UpdateEntity
        label: Close invoice when fully paid
        properties:
          entity: Invoice
          targetField: invoice_id
          field: status
          value: paid
