# ============================================================================
# EML Model — Education Management System

# A fee-charging secondary school, modelled end to end: nineteen entities, the
# five lifecycles the school actually runs on, the admission decision it takes
# by judgement today, the capacity and overpayment refusals that must act, and
# the two sagas that turn an accepted application into an enrolled, invoiced
# student and a payment into a settled invoice.

# Built through the interactive authoring protocol in llmdetailed.txt §10, so
# it holds that section's standard: help text on every entity and every column,
# one %%rbac read rule per entity, every state backed by a declared %%enum, and
# reports for every role on the matrix. Every diagram is valid, renderable
# Mermaid.
# ============================================================================


eml: "1.0"
name: Education Management System
version: 1.0.0
enums:
  - name: TermStatus
    values: [planned, current, closed]
  - name: StaffType
    values: [teaching, administrative, pastoral, leadership]
  - name: EmploymentStatus
    values: [active, on_leave, left]
  - name: CourseLevel
    values: [foundation, core, higher, advanced]
  - name: ContactMethod
    values: [email, phone, post]
  - name: StudentStatus
    values: [enrolled, on_leave, suspended, graduated, withdrawn]
  - name: GuardianRelationship
    values: [mother, father, step_parent, grandparent, carer, local_authority, other]
  - name: ApplicationStatus
    values: [submitted, under_review, offer_made, accepted, declined, rejected, withdrawn]
  - name: AdmissionBand
    values: [priority, standard, review]
  - name: DayOfWeek
    values: [monday, tuesday, wednesday, thursday, friday]
  - name: SectionStatus
    values: [planned, open, in_progress, completed, cancelled]
  - name: SessionStatus
    values: [scheduled, held, cancelled]
  - name: EnrollmentStatus
    values: [pending, enrolled, completed, withdrawn, failed]
  - name: FinalGrade
    values: [distinction, merit, pass, borderline, fail, incomplete]
  - name: AttendanceMark
    values: [present, late, absent, excused]
  - name: AssessmentType
    values: [quiz, essay, project, practical, mock_exam, final_exam]
  - name: AssessmentStatus
    values: [draft, published, marking, marked, cancelled]
  - name: ResultStatus
    values: [pending, submitted, marked, missing, excused]
  - name: InvoiceStatus
    values: [draft, issued, part_paid, paid, overdue, cancelled]
  - name: ChargeType
    values: [tuition, transport, examination_entry, materials, activity, late_fee]
  - name: PaymentMethod
    values: [card, bank_transfer, cash, cheque, bursary]
  - name: IncidentCategory
    values: [disruption, absence_without_leave, bullying, damage, academic_misconduct, safeguarding]
  - name: IncidentSeverity
    values: [minor, moderate, serious, critical]
  - name: IncidentStatus
    values: [reported, under_review, action_taken, closed, dismissed]
  - name: Sanction
    values: [none, warning, detention, parental_meeting, suspension, exclusion]
categories:
  - name: Admissions
    icon: file-text
    entities: [AdmissionApplication]
  - name: People
    icon: users
    entities: [Student, Guardian, Staff]
  - name: Academics
    icon: book-open
    entities: [Department, Course, AcademicTerm, Room, ClassSection, ClassSession]
  - name: Enrolment
    icon: clipboard-list
    entities: [Enrollment]
  - name: Assessment
    icon: graduation-cap
    entities: [Assessment]
  - name: Finance
    icon: credit-card
    entities: [FeeInvoice, Payment]
  - name: Conduct
    icon: shield-alert
    entities: [DisciplineIncident]
entities:
  - name: Department
    help: A teaching department that owns a group of courses and employs the staff who teach them. Reference data, created once when the school's structure is set up.
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The short label used on the timetable and in reporting, e.g. SCI. Unique and stable — it is printed on every report card, so it is not renamed lightly.
      - name: name
        type: string
        help: The department as staff and families say it, e.g. "Science". Shown wherever a course is listed.
      - name: staff_id
        type: string
        fk: true
        optional: true
        help: The head of department — the member of staff accountable for its courses and its marking trail. Named staff_id rather than head_teacher_id so the reference resolves to the Staff table and renders as a person picker.
      - name: is_active
        type: boolean
        help: Cleared when a department is merged or dissolved. Its courses and history survive; no new course can be created against it.
  - name: Room
    help: A teaching space with a legal capacity. A section's own capacity may be lower but is never allowed above the room's.
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The label on the door, e.g. S12. Unique, and what appears on the printed timetable a student follows.
      - name: name
        type: string
        help: The room's full name where it has one, e.g. "Physics Laboratory 2". Blank rooms are shown by code alone.
      - name: building
        type: string
        help: Which building the room is in. Used to catch timetables that move a class across the site in a five-minute gap.
      - name: capacity
        type: integer
        help: The maximum number of people the room legally holds. A section's own capacity is seeded from this and may be lower, never higher.
      - name: is_active
        type: boolean
        help: Cleared while a room is out of use for refurbishment. Past sessions survive; the timetable will not schedule into it.
  - name: AcademicTerm
    help: A named teaching period inside an academic year. Every enrolment, invoice and result in the school is bounded by exactly one term.
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The short key used in every reference number, e.g. 2026-AUT. Unique, and stable once the calendar is published.
      - name: name
        type: string
        help: The term as the school says it, e.g. "Autumn 2026".
      - name: academic_year
        type: string
        help: 'The year the term belongs to, e.g. "2026/2027". A label rather than a table: the school reports by year but never manages one as a record.'
      - name: starts_on
        type: date
        help: First teaching day. Sessions may not be scheduled before it.
      - name: ends_on
        type: date
        help: Last teaching day. Results for the term are expected within ten working days of it.
      - name: census_on
        type: date
        help: The date enrolment is counted for billing. A student enrolled on this date is invoiced for the whole term whether or not they attend, so it is the date the finance office plans around.
      - name: status
        type: string
        enum: TermStatus
        help: planned — timetabling in progress, nothing billed; current — teaching, registers open; closed — results published and invoices final, no further writes expected.
  - name: Staff
    help: An employee of the school, teaching or administrative. This is the model's person entity, so every _by_id column in the model resolves to a member of staff.
    attributes:
      - name: id
        type: string
        pk: true
      - name: staff_number
        type: string
        unique: true
        help: The payroll identifier, unique and unchanging. It is how a member of staff is matched against the HR system this application deliberately does not hold.
      - name: email
        type: email
        unique: true
        help: The school address used for the teaching rota, marking reminders and password recovery. Unique — a second appointment reuses the existing record rather than creating a rival one.
      - name: first_name
        type: string
        help: Given name, as shown on the staff list and in every person picker in the application.
      - name: last_name
        type: string
        help: Family name. The staff list sorts by it, which is why the name is stored in two fields rather than one.
      - name: department_id
        type: string
        fk: true
        optional: true
        help: The department a teacher belongs to. Optional because administrative and leadership staff belong to none, and a blank here is what keeps them out of departmental marking reports.
      - name: job_title
        type: string
        help: The title as it appears in the school's own directory, e.g. "Teacher of Physics". Free text — it is written on letters, not reported on.
      - name: staff_type
        type: string
        enum: StaffType
        help: teaching — takes sections and marks work; administrative — office and finance; pastoral — counselling and conduct; leadership — the senior team. This decides which reports a person is offered, so it is not a job description.
      - name: status
        type: string
        enum: EmploymentStatus
        help: active — may be timetabled; on_leave — keeps their sections but cannot be assigned new ones; left — retained for the marking and conduct trail, never assignable.
      - name: started_on
        type: date
        help: The date the appointment began. Used for length-of-service reporting and never changed by a change of role.
      - name: phone
        type: phone
        optional: true
        help: A direct number, used only for same-day cover arrangements where email is too slow. Optional.
  - name: Course
    help: A subject as it is offered and examined. Distinct from the taught groups it is scheduled as, which are sections.
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The examination code the subject is known by, e.g. MATH-H. Unique and stable across terms, because results are reported against it for years afterwards.
      - name: name
        type: string
        help: The subject as families see it on a report card, e.g. "Mathematics (Higher)".
      - name: department_id
        type: string
        fk: true
        help: The department that owns the course, sets its marking policy and is accountable for its results.
      - name: level
        type: string
        enum: CourseLevel
        help: foundation — supported entry; core — the standard offer; higher — extended content; advanced — final-year specialism with an entry requirement. The level decides which year groups may be enrolled and appears on the transcript.
      - name: credit_hours
        type: integer
        help: Taught hours per week. The timetable is built from this, and a change here does not move sections already scheduled.
      - name: is_active
        type: boolean
        help: Cleared when a subject is withdrawn from the curriculum. Past sections and results survive; no new section can be scheduled against it.
  - name: Guardian
    help: The adult legally responsible for one or more students. Not a parent field on the student, because step-parents, carers and local authorities all appear here and only one of them is the primary contact.
    attributes:
      - name: id
        type: string
        pk: true
      - name: email
        type: email
        unique: true
        help: The address invoices, offers and absence notifications are sent to. Unique — two students sharing a guardian share this record, which is the whole point of guardians being their own entity.
      - name: first_name
        type: string
        help: Given name, as it should appear on correspondence.
      - name: last_name
        type: string
        help: Family name. Often differs from the student's, which is exactly why it is held here rather than assumed.
      - name: phone
        type: phone
        help: The number the school calls when a child is ill or has not arrived. The single most important field in a safeguarding emergency.
      - name: address_line
        type: string
        help: The billing and correspondence address. A student's home address is the primary contact's, which is why it lives here.
      - name: city
        type: string
        help: Town or city, used for transport route planning and catchment reporting.
      - name: postcode
        type: string
        help: Postal code — the field the catchment and transport reports actually group by.
      - name: preferred_contact_method
        type: string
        enum: ContactMethod
        help: email — the default and the only one that scales; phone — reserved for guardians who ask, and used for every emergency regardless; post — required where a guardian has no email, and it slows every notice by three days.
  - name: Student
    help: The child. Created when an offer is accepted, never at enquiry, and never deleted — a leaver is a status, because safeguarding and alumni obligations both need the record to survive.
    attributes:
      - name: id
        type: string
        pk: true
      - name: student_number
        type: string
        unique: true
        help: The school's own identifier, unique and unchanging for the child's whole time here. Printed on every report, invoice and examination entry.
      - name: first_name
        type: string
        help: Given name as it should appear on a certificate. A preferred name is not held separately — the school records the legal name and staff use it.
      - name: last_name
        type: string
        help: Family name. Registers and result lists sort by it.
      - name: date_of_birth
        type: date
        help: Used to derive the year group at admission and to check examination-board age rules. Never changed after admission except to correct a keying error.
      - name: year_group
        type: integer
        help: The teaching year the student is in, 7 to 13. Advanced once a year at rollover; a repeated year is an explicit edit, and the reason belongs in a conduct or pastoral record rather than here.
      - name: status
        type: string
        enum: StudentStatus
        help: enrolled — attending and fee-liable; on_leave — place held for a term abroad or extended illness; suspended — a conduct outcome, still enrolled and still fee-liable but barred from sessions; graduated — completed year 13; withdrawn — left before completing, and the reason is required.
      - name: enrolled_on
        type: date
        help: The date the offer was accepted and the record created. The fee position, the year group and the alumni record are all measured from it.
      - name: withdrawn_on
        type: date
        optional: true
        help: The date the student left. Set with the status; the term's invoice is not cancelled by it, which is what makes the leavers report a finance report as well as a registry one.
      - name: withdrawal_reason
        type: text
        optional: true
        help: Why the student left, in the family's terms — relocation, transfer, financial, exclusion. Required on withdrawal, because the retention report is built from it and an unexplained leaver is the one the governors ask about.
      - name: school_email
        type: email
        optional: true
        help: "The account the student signs in with. Optional: it is issued at year 7 and some transfers arrive without one."
      - name: has_support_plan
        type: boolean
        help: "Set when the student has a formal learning-support plan. It is a flag, not the plan: the plan itself is held outside this system, and this field exists so a teacher opening the register knows to ask for it."
    indexes:
      - columns: [status, year_group]
  - name: StudentGuardian
    help: One guardian's relationship to one student — the kind of relationship, the contact order and whether they may collect. This is where the duty of care is recorded.
    parent: Student
    attributes:
      - name: id
        type: string
        pk: true
      - name: student_id
        type: string
        fk: true
        help: The child. This is the link back to the parent record, so guardians appear as a tab on the student rather than as a screen of their own.
      - name: guardian_id
        type: string
        fk: true
        help: The adult. One guardian may be linked to several students, which is why this is a link record rather than a column on the student.
      - name: relationship
        type: string
        enum: GuardianRelationship
        help: mother, father, step_parent, grandparent, carer — the relationship as the family states it; local_authority — a corporate parent, which changes who may consent; other — anything else, and the detail belongs in the student's pastoral record.
      - name: is_primary_contact
        type: boolean
        help: Exactly one guardian per student carries this. They receive the invoice, the reports and the first phone call, and setting it on a second guardian is what the primary-contact exception report exists to catch.
      - name: may_collect
        type: boolean
        help: Whether this adult may take the child from the premises. Cleared where a court order says otherwise, and the reception screen reads nothing else.
      - name: contact_order
        type: integer
        help: The order the school works down in an emergency, lowest first. The primary contact is normally 1, but a guardian who works away may deliberately not be.
    indexes:
      - columns: [student_id, contact_order]
  - name: AdmissionApplication
    help: A request for a place, with an outcome. Terminal once accepted, declined, rejected or withdrawn; the student record is created at acceptance.
    attributes:
      - name: id
        type: string
        pk: true
      - name: reference
        type: string
        unique: true
        help: The reference quoted in every letter to the family, e.g. APP-2026-0142. Unique, and the only identifier a family has before a student number exists.
      - name: guardian_id
        type: string
        fk: true
        help: The adult who applied and who every decision letter goes to. Created before the application where the guardian is new to the school.
      - name: student_id
        type: string
        fk: true
        optional: true
        help: The student record created when the offer was accepted. Blank until then — this is the field that links an admission to the child it produced, and it is what makes the conversion report possible.
      - name: academic_term_id
        type: string
        fk: true
        help: The term the place is applied for. An application for a term that has already started is a mid-year admission and is handled by the registrar rather than the intake process.
      - name: decided_by_id
        type: string
        fk: true
        optional: true
        help: The member of staff who made the decision and is accountable for it. Blank while the application is still open.
      - name: applicant_first_name
        type: string
        help: The child's given name as the family wrote it. Held on the application rather than taken from a student record, because no student record exists until the offer is accepted.
      - name: applicant_last_name
        type: string
        help: The child's family name, as written on the application.
      - name: applicant_date_of_birth
        type: date
        help: Used to check the child is of age for the year group applied for. A mismatch here is the most common reason an application goes to review rather than straight to an offer.
      - name: year_group_applied_for
        type: integer
        help: The teaching year the place is wanted in, 7 to 13. Entry to 12 and 13 carries subject requirements the interview checks.
      - name: status
        type: string
        enum: ApplicationStatus
        help: submitted — received, nothing looked at; under_review — with an admissions officer; offer_made — the family has a letter and a deadline; accepted — the place is taken and the student record now exists; declined — the family said no; rejected — the school said no; withdrawn — the family pulled the application before a decision.
      - name: submitted_on
        type: date
        help: When the family applied. Intakes are worked in submission order where the band is equal, so this is a fairness field, not a timestamp.
      - name: decided_on
        type: date
        optional: true
        help: When the decision was recorded. The offer deadline is measured from it, and the gap between this and submitted_on is the response time the intake report is judged on.
      - name: prior_attainment_score
        type: integer
        optional: true
        help: The score from the previous school's report or the entrance paper, 0 to 100. Optional — an in-year transfer often arrives without one, and its absence sends the application to review rather than refusing it.
      - name: has_sibling_enrolled
        type: boolean
        help: Set where a brother or sister is already enrolled. Sibling priority is school policy, and this is the field the admission banding rule reads.
      - name: admission_band
        type: string
        optional: true
        enum: AdmissionBand
        help: priority — meets the attainment bar or carries sibling priority; standard — the ordinary offer queue; review — needs a person to look, because something is missing or borderline. Set by the admission banding rule on submission; an admissions officer may overwrite it, and the override is what the banding-override report shows.
      - name: decision_notes
        type: text
        optional: true
        help: Why the decision went the way it did, written for the family's file rather than for the assessor. Required in practice for a rejection, because it is what the appeal is answered from.
    indexes:
      - columns: [status, submitted_on]
  - name: ClassSection
    help: One taught group of a course in one term, with a teacher, a room and a capacity. The thing a student is actually enrolled in.
    attributes:
      - name: id
        type: string
        pk: true
      - name: code
        type: string
        unique: true
        help: The timetable code, e.g. MATH-H-A-2026AUT. Unique — it is how a teacher, a room and a group are matched on a printed timetable.
      - name: course_id
        type: string
        fk: true
        help: "The subject being taught. Fixed at timetabling: moving a section to a different course is a cancellation and a new section, because the students enrolled chose the subject."
      - name: academic_term_id
        type: string
        fk: true
        help: The term this group runs in. A section belongs to exactly one term, which is what makes a term's results a closed set.
      - name: staff_id
        type: string
        fk: true
        help: The teacher who takes the group and marks its work. Named staff_id rather than teacher_id so it resolves to the Staff table and renders as a person picker rather than a raw id.
      - name: room_id
        type: string
        fk: true
        optional: true
        help: The room the group normally meets in. Optional for a section taught off-site or online, and a session may override it for one meeting.
      - name: capacity
        type: integer
        help: Places in this group. Seeded from the room's capacity and lowered where the subject needs bench space; never raised above the room's, and the enrolment handler refuses a place past it.
      - name: enrolled_count
        type: integer
        help: How many students currently hold a place. Maintained by the enrolment hooks rather than counted on every screen, because the timetable shows fill on every row and the count would otherwise be a query per row.
      - name: day_of_week
        type: string
        enum: DayOfWeek
        help: The teaching day the group meets. One day and one period per section keeps the timetable a grid a person can read; a subject needing two slots is two sections of the same course.
      - name: period
        type: integer
        help: "The numbered teaching period within the day, 1 to 8. With day_of_week it is the clash key: a student may not hold two enrolments in the same day and period."
      - name: status
        type: string
        enum: SectionStatus
        help: planned — being timetabled, not yet open for enrolment; open — accepting students; in_progress — teaching, enrolment closed to newcomers; completed — the term ended and final grades are in; cancelled — the group will not run, which withdraws every enrolment on it.
      - name: cancellation_reason
        type: text
        optional: true
        help: Why the group was pulled — under-recruitment, no teacher, room lost. Shown to every affected family in the notice, so it is written for them rather than for the office.
    indexes:
      - columns: [academic_term_id, status]
  - name: ClassSession
    help: One dated, timed meeting of a section. The register is taken against this and nothing else.
    attributes:
      - name: id
        type: string
        pk: true
      - name: class_section_id
        type: string
        fk: true
        help: The group meeting. A session belongs to exactly one section, which is what makes attendance attributable to a teacher.
      - name: room_id
        type: string
        fk: true
        optional: true
        help: Where this one meeting happens. Blank means the section's usual room; set only for a one-off move, which is why the register prints it.
      - name: staff_id
        type: string
        fk: true
        optional: true
        help: Who is actually taking this meeting. Blank means the section's own teacher; set for cover, and the cover report is built from exactly this field being non-blank.
      - name: starts_at
        type: datetime
        help: When the meeting begins, in school local time. The register is expected within the first fifteen minutes of it, and the late-register report measures from here.
      - name: ends_at
        type: datetime
        help: When the meeting finishes. Derived from the course's taught hours at scheduling time and held rather than recomputed, so a later curriculum change cannot move a session already taught.
      - name: status
        type: string
        enum: SessionStatus
        help: scheduled — will run, register not yet taken; held — it happened and the register is closed; cancelled — it did not run, and no attendance marks are expected against it.
      - name: register_taken
        type: boolean
        help: Set when the teacher closes the register. It is the field the statutory return counts against, because a session with no register is a hole in the return rather than a day nobody was absent.
      - name: topic
        type: string
        optional: true
        help: What was taught, in a line. Optional, and the only place a family looking at a missed session can see what their child missed.
      - name: cancellation_reason
        type: text
        optional: true
        help: Why the meeting did not run — snow, cover unavailable, examination clash. Read by the attendance officer when explaining a gap in a student's record.
    indexes:
      - columns: [starts_at, status]
  - name: Enrollment
    help: One student's place in one section for one term. Created when the registrar places the student; terminal once completed, withdrawn or failed.
    attributes:
      - name: id
        type: string
        pk: true
      - name: student_id
        type: string
        fk: true
        help: The student holding the place. An enrolment is never transferred between students; a change of group is a withdrawal and a new enrolment, so the attendance and marking trail stays attached to the right child.
      - name: class_section_id
        type: string
        fk: true
        help: The taught group the place is in. With the section's day and period this is what a timetable clash is detected on.
      - name: status
        type: string
        enum: EnrollmentStatus
        help: pending — requested, not yet placed by the registrar; enrolled — holding a place and expected at every session; completed — the term ended with a final grade; withdrawn — left the group during the term, and the reason is required; failed — completed without meeting the pass standard.
      - name: enrolled_on
        type: date
        help: When the place was taken. Compared against the term's census date to decide whether the term is billable, which is why it is a date the registrar may not backdate freely.
      - name: withdrawn_on
        type: date
        optional: true
        help: When the student left the group. The fee is not automatically adjusted — a withdrawal after census is still billed, and this date is the evidence in that conversation.
      - name: withdrawal_reason
        type: text
        optional: true
        help: Why the student left the group — timetable clash, subject change, medical, exclusion. Required on withdrawal, and the subject-change reports are built entirely from it.
      - name: final_grade
        type: string
        optional: true
        enum: FinalGrade
        help: distinction, merit, pass, borderline, fail — the outcome recorded when the section completes; incomplete — the student left or missed too much of the course to be graded. Written once at term end and never edited afterwards; a correction is a documented re-grade.
      - name: attendance_rate
        type: decimal
        help: The percentage of held sessions this student was present for, maintained by the attendance hook as marks are entered. Held on the enrolment rather than computed because it is the number the pastoral team sorts by every week, and the statutory floor is measured against it.
    indexes:
      - columns: [class_section_id, status]
      - columns: [student_id, status]
  - name: AttendanceRecord
    help: One student's mark for one session. The statutory attendance return is built from these, which is why an absence must say whether it was authorised.
    parent: ClassSession
    attributes:
      - name: id
        type: string
        pk: true
      - name: class_session_id
        type: string
        fk: true
        help: The meeting being registered. This is the link back to the parent record, so the register appears as a tab on the session rather than a screen of its own.
      - name: student_id
        type: string
        fk: true
        help: The student being marked. One mark per student per session; a second is a correction and replaces the first.
      - name: marked_by_id
        type: string
        fk: true
        help: The member of staff who took the register and is accountable for the mark. Named marked_by_id so it resolves to the Staff table; a cover teacher's name here is how a disputed mark is traced.
      - name: status
        type: string
        enum: AttendanceMark
        help: present — in the room; late — arrived after the register, and minutes_late says how late; absent — not there, and is_authorised decides whether it counts against the statutory return; excused — off site on school business, which is not an absence at all.
      - name: minutes_late
        type: integer
        optional: true
        help: How late the student arrived. Only meaningful with a late mark, and the persistent-lateness report is built from the sum of it rather than the count of marks.
      - name: is_authorised
        type: boolean
        help: Whether the school accepted the reason for the absence. This single boolean is the statutory distinction the whole return turns on, and it is deliberately separate from the mark so that an absence can be re-authorised later without rewriting the register.
      - name: absence_reason
        type: text
        optional: true
        help: Why the student was not there, in the guardian's words where they gave them. Required for an authorised absence and for an excused mark — an unexplained authorisation is the one the inspector asks about.
      - name: marked_at
        type: datetime
        help: When the mark was entered, not when the session ran. A register closed two days late is a compliance finding, and this is the field that shows it.
    indexes:
      - columns: [class_session_id, status]
      - columns: [student_id, status]
  - name: Assessment
    help: A marked piece of work set on a section — a quiz, an essay, a mock exam — with a maximum score, a weight and a due date.
    attributes:
      - name: id
        type: string
        pk: true
      - name: class_section_id
        type: string
        fk: true
        help: The taught group the work is set on. Every student enrolled in the section gets a result row when the assessment is published.
      - name: title
        type: string
        help: What the work is called, as it appears in the student's list, e.g. "Unit 3 test — forces".
      - name: assessment_type
        type: string
        enum: AssessmentType
        help: quiz — short, low weight; essay — extended writing; project — coursework over weeks; practical — laboratory or performance; mock_exam — full paper under examination conditions; final_exam — the summative paper the term's grade rests on.
      - name: max_score
        type: decimal
        help: The maximum mark available on the paper. Copied onto each result when marking opens, so a later correction to the paper cannot silently rescale marks already given.
      - name: weight_percent
        type: decimal
        help: How much of the section's final grade this piece carries, as a percentage. The weights of a section's published assessments are expected to total 100, and the weighting report is what shows when they do not.
      - name: due_on
        type: date
        help: When the work is due in. The overdue-marking report measures from here, not from the date the assessment was set.
      - name: status
        type: string
        enum: AssessmentStatus
        help: draft — being written, invisible to students; published — visible, result rows created for the group; marking — work is in and being marked; marked — every result is in and the grade contributes; cancelled — the piece will not count, and its results are ignored by the weighting.
      - name: instructions
        type: text
        optional: true
        help: What the students were told to do. Optional, and the only record of the task when a mark is queried a term later.
  - name: AssessmentResult
    help: One student's mark for one assessment. Created when the assessment is published to the group and scored when it is marked.
    parent: Assessment
    attributes:
      - name: id
        type: string
        pk: true
      - name: assessment_id
        type: string
        fk: true
        help: The piece of work being marked. This is the link back to the parent record, so results appear as a tab on the assessment.
      - name: student_id
        type: string
        fk: true
        help: Whose work it is. One result per student per assessment.
      - name: marked_by_id
        type: string
        fk: true
        optional: true
        help: Who marked it. Usually the section's teacher, but a moderated or second-marked paper carries the moderator, and that is what makes the moderation trail auditable.
      - name: score
        type: decimal
        optional: true
        help: The mark awarded, on the scale max_score sets. Blank until marked — a blank is not a zero, and the reports keep the two apart deliberately.
      - name: max_score
        type: decimal
        help: "The paper's maximum as it stood when this result was created, copied from the assessment. Held here for the same reason an invoice line keeps its price: a paper rescaled next year must not rewrite marks already awarded, and the score rule compares against this rather than against the assessment."
      - name: status
        type: string
        enum: ResultStatus
        help: pending — published, nothing submitted yet; submitted — work is in, not marked; marked — a score is recorded; missing — nothing was submitted and the deadline passed, which counts as zero in the weighting; excused — the student was authorised not to sit it, and it is removed from the weighting rather than counted as zero.
      - name: marked_at
        type: datetime
        optional: true
        help: When the mark was recorded. The turnaround report is the gap between this and the assessment's due date, and it is the number departments are held to.
      - name: feedback
        type: text
        optional: true
        help: What the student is told about the work. The one field in the model written to be read by a child, so it is never a grade restated as a sentence.
    indexes:
      - columns: [assessment_id, status]
  - name: FeeInvoice
    help: What a student's guardians owe for one term. Raised at the census date, so a student enrolled that day is billed whether or not they attend.
    attributes:
      - name: id
        type: string
        pk: true
      - name: invoice_number
        type: string
        unique: true
        help: The number quoted on every statement and payment, e.g. INV-2026-AUT-0331. Unique, sequential within a term, and never reused even when an invoice is cancelled.
      - name: student_id
        type: string
        fk: true
        help: The student the fees are for. The invoice goes to their primary contact guardian, which is why that flag on the guardian link is a finance field as much as a safeguarding one.
      - name: academic_term_id
        type: string
        fk: true
        help: The term being billed. One invoice per student per term; an extra charge later in the term is a line on the same invoice, not a second invoice.
      - name: status
        type: string
        enum: InvoiceStatus
        help: draft — being assembled, nothing sent; issued — sent to the guardian and payable; part_paid — some money received, a balance outstanding; paid — settled in full; overdue — past the due date with a balance, which starts the finance office's chase; cancelled — written off or raised in error, and the reason is required.
      - name: issued_on
        type: date
        optional: true
        help: When the invoice was sent. Blank while in draft; the due date and every reminder are measured from it.
      - name: due_on
        type: date
        optional: true
        help: When payment is expected. Thirty days from issue by school policy, and the overdue report reads nothing else.
      - name: total_amount
        type: decimal
        help: The sum of the invoice's lines, gross, in school currency. Recalculated by the invoice hooks whenever a line changes, and frozen once the invoice is issued.
      - name: amount_paid
        type: decimal
        help: How much has been received against this invoice so far. Maintained by the payment hooks, never keyed by hand — a manual adjustment here is how an invoice comes to disagree with its own payments.
      - name: balance_due
        type: decimal
        help: "What is still owed: total less payments. The payment rule reads this to refuse an overpayment, and the finance dashboard sorts by it."
      - name: cancellation_reason
        type: text
        optional: true
        help: Why the invoice was cancelled — bursary awarded, raised in error, place never taken. Required on cancellation, because a cancelled invoice is money the school chose not to collect and every one of them is looked at.
    indexes:
      - columns: [status, due_on]
      - columns: [student_id, academic_term_id]
  - name: FeeInvoiceLine
    help: One charge on an invoice — tuition, transport, examination entry or materials. Priced when the line is written and never repriced afterwards.
    parent: FeeInvoice
    attributes:
      - name: id
        type: string
        pk: true
      - name: fee_invoice_id
        type: string
        fk: true
        help: The invoice this charge belongs to. This is the link back to the parent record, so lines appear as a tab on the invoice.
      - name: charge_type
        type: string
        enum: ChargeType
        help: tuition — the termly fee for the place; transport — the school bus; examination_entry — board fees, which are not refundable once entered; materials — laboratory and art consumables; activity — trips and clubs; late_fee — added by the finance office and always explained in the description.
      - name: description
        type: string
        help: What the charge is for, in the words the guardian will read on the statement. "Chemistry practical materials — Autumn" rather than "materials".
      - name: quantity
        type: integer
        help: How many of the charge. One for a termly fee; several for trips or repeated items, and the line total is checked against it.
      - name: unit_amount
        type: decimal
        help: The price of one, gross, as it stood when the line was written. Never repriced afterwards — a fee increase applies to the next term's invoice, not to a line already raised.
      - name: line_total
        type: decimal
        help: Quantity times unit amount, held rather than computed so that a rounding decision made once is the number the guardian sees on every statement.
  - name: Payment
    help: Money received against an invoice. Recorded once and never edited; a correction is a second, offsetting record.
    attributes:
      - name: id
        type: string
        pk: true
      - name: fee_invoice_id
        type: string
        fk: true
        help: The invoice this money settles. A payment always names an invoice; money received with no invoice is held by the finance office outside this system until one exists.
      - name: received_by_id
        type: string
        fk: true
        optional: true
        help: The member of staff who took the payment. Blank for an automated bank feed, and its blankness is what separates counter takings from transfers in the daily reconciliation.
      - name: amount
        type: decimal
        help: The sum received, gross, in school currency. Never edited — a correction is a second, offsetting record, so the audit trail survives.
      - name: balance_before
        type: decimal
        help: What the invoice still owed immediately before this payment was applied, stamped by the payment hook. It is on the receipt for the guardian's benefit, and it is what the overpayment rule compares against — the rule can only read the record being written, so the balance has to be on it.
      - name: method
        type: string
        enum: PaymentMethod
        help: card — taken at the office or online; bank_transfer — matched against the statement, so it may be recorded days after it arrived; cash — counted into the safe and reconciled the same day; cheque — cleared before the invoice is credited; bursary — an internal award rather than money, and it settles the invoice without any cash moving.
      - name: received_at
        type: datetime
        help: When the money actually arrived, not when it was keyed in. Transfers are routinely recorded late, and the reconciliation depends on the distinction.
      - name: reference
        type: string
        optional: true
        help: The bank reference, card authorisation or cheque number used to match this payment against the statement. Optional for cash, where there is nothing to match.
    indexes:
      - columns: [fee_invoice_id, received_at]
  - name: DisciplineIncident
    help: A recorded conduct event, its investigation and its outcome. Readable by pastoral staff and the principal only.
    attributes:
      - name: id
        type: string
        pk: true
      - name: reference
        type: string
        unique: true
        help: The reference the incident is known by in pastoral meetings and in any correspondence with the family, e.g. INC-2026-0087. Unique.
      - name: student_id
        type: string
        fk: true
        help: The student the incident concerns. One record per student per incident — an incident involving three students is three records, so that each family's correspondence stays separate.
      - name: reported_by_id
        type: string
        fk: true
        help: "The member of staff who reported it. Named reported_by_id so it resolves to the Staff table, and it is never blank: an anonymous conduct record cannot be investigated."
      - name: occurred_at
        type: datetime
        help: When the incident happened, not when it was written up. The gap between the two is what the reporting-delay report measures, and a long one is a safeguarding finding in itself.
      - name: category
        type: string
        enum: IncidentCategory
        help: disruption — classroom behaviour; absence_without_leave — off site without permission; bullying — treated as safeguarding-adjacent and never closed without a recorded outcome; damage — property, and a fee line may follow; academic_misconduct — plagiarism or examination irregularity, which the examination board may need to be told about; safeguarding — child protection, which restricts who may read the record further.
      - name: severity
        type: string
        enum: IncidentSeverity
        help: minor — dealt with in the room; moderate — a sanction and a note home; serious — a meeting with the family; critical — exclusion is on the table and the principal is involved from the start.
      - name: status
        type: string
        enum: IncidentStatus
        help: reported — written up, nobody assigned; under_review — being investigated by pastoral staff; action_taken — a sanction has been decided and applied; closed — the matter is finished and the outcome recorded; dismissed — investigated and found not to have happened, which is a finding and not a deletion.
      - name: summary
        type: text
        help: What happened, factually, in the words of the person who saw it. Written knowing the family may read it, because in a serious case they will.
      - name: sanction
        type: string
        optional: true
        enum: Sanction
        help: none — recorded, no sanction; warning — spoken or written; detention — supervised time; parental_meeting — the family is asked in; suspension — the student is barred from sessions and their status changes; exclusion — permanent, and the governors are involved. Required before an incident can move to action_taken.
      - name: sanction_notes
        type: text
        optional: true
        help: The detail of the sanction — how long, when, who supervised. The field the appeal is answered from, and the reason a bare enum was not enough.
      - name: closed_on
        type: date
        optional: true
        help: When the matter was finished. The open-incidents report is everything with no date here, and the ageing on that list is the pastoral team's real workload.
    indexes:
      - columns: [status, occurred_at]
