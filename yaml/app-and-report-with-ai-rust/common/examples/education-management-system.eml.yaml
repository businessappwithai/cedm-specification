hookFlows:
  # ---- Workflow — lifecycle hooks -------------------------------------------
  - name: EnrolmentHooks
    title: Enrolment Hooks
    entity: Enrollment
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: checkSectionCapacity
      - id: D
        label: Process Enrolment
      - id: E
        event: afterCreate
        handler: incrementSectionEnrolment
      - id: F
        event: afterUpdate
        handler: maintainSectionEnrolment
      - id: G
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
  # ---- Workflow — attendance hooks ------------------------------------------
  - name: AttendanceHooks
    title: Attendance Hooks
    entity: AttendanceRecord
    nodes:
      - id: A
        label: Register entered
      - id: B
        event: beforeCreate
        handler: stampMarkedAt
      - id: C
        label: Store the mark
      - id: D
        event: afterCreate
        handler: updateEnrolmentAttendanceRate
      - id: E
        event: afterUpdate
        handler: correctEnrolmentAttendanceRate
      - id: F
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
  # ---- Workflow — marking hooks ---------------------------------------------
  - name: MarkingHooks
    title: Marking Hooks
    entity: AssessmentResult
    nodes:
      - id: A
        label: Result created
      - id: B
        event: beforeCreate
        handler: copyAssessmentMaximum
      - id: C
        label: Store the result
      - id: D
        event: afterUpdate
        handler: stampMarkedAt
      - id: E
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
  # ---- Workflow — money hooks ------------------------------------------------
  - name: FinanceHooks
    title: Finance Hooks
    entity: Payment
    nodes:
      - id: A
        label: Payment offered
      - id: B
        event: beforeCreate
        handler: resolveInvoiceBalance
      - id: C
        label: Store the payment
      - id: D
        event: afterCreate
        handler: applyPaymentToInvoice
      - id: E
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
  # ---- Workflow — invoice line hooks -----------------------------------------
  - name: InvoiceLineHooks
    title: Invoice Line Hooks
    entity: FeeInvoiceLine
    nodes:
      - id: A
        label: Line written
      - id: B
        event: beforeCreate
        handler: priceLine
      - id: C
        label: Store the line
      - id: D
        event: afterCreate
        handler: addLineToInvoiceTotal
      - id: E
        event: afterUpdate
        handler: recalculateInvoiceTotal
      - id: F
        event: afterDelete
        handler: removeLineFromInvoiceTotal
      - id: G
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
  # ---- Workflow — identity hooks ---------------------------------------------
  - name: ReferenceHooks
    title: Reference Hooks
    entity: Student
    nodes:
      - id: A
        label: Record created
      - id: B
        event: beforeCreate
        handler: assignStudentNumber
      - id: C
        label: Store the record
      - id: D
        event: afterUpdate
        handler: notifyGuardiansOfStatusChange
      - id: E
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
