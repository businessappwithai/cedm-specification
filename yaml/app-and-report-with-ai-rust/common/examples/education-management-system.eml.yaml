reports:
  # ---- The reporting pass (llmdetailed §10.5.1) ------------------------------

  # What the derived pack already gives this model without being asked: a
  # register per entity, a breakdown per %%enum-bound column, created-per-month,
  # a lifecycle report over all eleven state machines in the diagram's own order,
  # totals over the numeric columns, and children-per-parent for all 31
  # relationships. None of that needed anyone who understands how a school runs.

  # These do. Each of the eight roles on the %%rbac matrix above is walked through
  # the four questions — what they open first, what tells them something is wrong
  # today, what they are asked for weekly, and what rots silently if nobody
  # looks — so each can do its whole job from what it can see.

  # -- principal: whether the school is working --------------------------------
  - name: principal-roll-by-year
    title: The roll, by year group
    entity: Student
    chart: bar
    x: year_group
    y: students
    help: The first number the head is asked for by governors and by the local authority, and the one every capacity decision starts from. Enrolled only — on leave and suspended students hold a place but are not in a classroom.
    sql: SELECT s.year_group, COUNT(*) AS students FROM bus_student s WHERE s.deleted_at IS NULL AND s.status = 'enrolled' GROUP BY s.year_group ORDER BY s.year_group
  - name: principal-attendance-by-year
    title: Attendance against the statutory floor
    entity: Enrollment
    chart: bar
    x: year_group
    y: attendance_pct
    help: The number an inspection opens with. Below ninety-five percent a year group is a conversation with the local authority, and the head would rather have it before they do.
    sql: SELECT s.year_group, ROUND(AVG(e.attendance_rate), 1) AS attendance_pct, COUNT(DISTINCT s.id) AS students FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id WHERE e.deleted_at IS NULL AND s.deleted_at IS NULL AND e.status = 'enrolled' GROUP BY s.year_group ORDER BY s.year_group
  - name: principal-open-serious-incidents
    title: Serious conduct still open
    entity: DisciplineIncident
    help: What would make the head say someone needs to fix this today. A serious or critical incident with no outcome recorded is a family waiting for an answer and a governing body that will ask for the file.
    sql: SELECT i.reference, s.first_name || ' ' || s.last_name AS student, i.category, i.severity, i.status, i.occurred_at, EXTRACT(DAY FROM now() - i.occurred_at)::int AS days_open FROM bus_discipline_incident i JOIN bus_student s ON s.id = i.student_id WHERE i.deleted_at IS NULL AND i.severity IN ('serious', 'critical') AND i.status NOT IN ('closed', 'dismissed') ORDER BY i.occurred_at
  - name: principal-fee-collection-by-term
    title: Billed against collected, by term
    entity: FeeInvoice
    chart: bar
    x: term
    y: collected
    help: The weekly question from the bursar in one row per term. Billed is what the school committed to teach for; collected is what actually arrived, and the gap is the working-capital conversation.
    sql: SELECT t.name AS term, SUM(f.total_amount) AS billed, SUM(f.amount_paid) AS collected, SUM(f.balance_due) AS outstanding FROM bus_fee_invoice f JOIN bus_academic_term t ON t.id = f.academic_term_id WHERE f.deleted_at IS NULL AND f.status <> 'cancelled' GROUP BY t.id, t.name, t.starts_on ORDER BY t.starts_on DESC
  - name: principal-oversubscribed-sections
    title: Groups holding more students than places
    entity: ClassSection
    help: A group over its capacity is a health-and-safety exposure and a teaching problem, and neither is visible from the timetable. Counted from the enrolments themselves rather than from the maintained counter, so a broken counter cannot hide it.
    sql: SELECT sec.code AS section, c.name AS course, st.first_name || ' ' || st.last_name AS teacher, sec.capacity, COUNT(e.id) AS enrolled FROM bus_class_section sec JOIN bus_course c ON c.id = sec.course_id LEFT JOIN bus_staff st ON st.id = sec.staff_id LEFT JOIN bus_enrollment e ON e.class_section_id = sec.id AND e.deleted_at IS NULL AND e.status = 'enrolled' WHERE sec.deleted_at IS NULL AND sec.status IN ('open', 'in_progress') GROUP BY sec.id, sec.code, c.name, st.first_name, st.last_name, sec.capacity HAVING COUNT(e.id) > sec.capacity ORDER BY COUNT(e.id) - sec.capacity DESC
  - name: principal-teaching-cover-gap
    title: Groups whose teacher has left or is on leave
    entity: ClassSection
    help: The report that rots silently. A teacher leaves, their sections keep their name on them, and nobody notices until a class turns up to an empty room.
    sql: SELECT sec.code AS section, c.name AS course, st.first_name || ' ' || st.last_name AS teacher, st.status AS teacher_status, t.name AS term FROM bus_class_section sec JOIN bus_staff st ON st.id = sec.staff_id JOIN bus_course c ON c.id = sec.course_id JOIN bus_academic_term t ON t.id = sec.academic_term_id WHERE sec.deleted_at IS NULL AND st.deleted_at IS NULL AND sec.status IN ('planned', 'open', 'in_progress') AND st.status <> 'active' ORDER BY t.starts_on, sec.code
  # -- registrar: every student in a group that exists -------------------------
  - name: registrar-unplaced-enrolments
    title: Enrolment requests not yet placed
    entity: Enrollment
    help: The registrar's queue, and the first screen of the day. A request left pending is a student with a free period and a family who thinks the subject was chosen.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, c.name AS course, sec.code AS section, e.created_at FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id JOIN bus_class_section sec ON sec.id = e.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE e.deleted_at IS NULL AND e.status = 'pending' ORDER BY e.created_at
  - name: registrar-timetable-clashes
    title: Students booked into two groups at once
    entity: Enrollment
    help: What makes a registrar say that is wrong, someone needs to fix it today. Two enrolments in the same term on the same day and period means a child cannot attend one of them, and the first anyone hears of it is usually a missing mark.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, a.code AS section_one, b.code AS section_two, a.day_of_week, a.period FROM bus_enrollment ea JOIN bus_enrollment eb ON eb.student_id = ea.student_id AND eb.id > ea.id AND eb.deleted_at IS NULL AND eb.status = 'enrolled' JOIN bus_class_section a ON a.id = ea.class_section_id JOIN bus_class_section b ON b.id = eb.class_section_id AND b.academic_term_id = a.academic_term_id AND b.day_of_week = a.day_of_week AND b.period = a.period JOIN bus_student s ON s.id = ea.student_id WHERE ea.deleted_at IS NULL AND ea.status = 'enrolled' AND a.deleted_at IS NULL AND b.deleted_at IS NULL ORDER BY s.last_name, a.day_of_week, a.period
  - name: registrar-section-fill
    title: How full each group is
    entity: ClassSection
    chart: bar
    x: section
    y: fill_pct
    help: What to open before agreeing to another enrolment, and what tells a head of department that a group is not viable. Places taken against places built, for the groups currently teaching.
    sql: SELECT sec.code AS section, c.name AS course, sec.capacity, COUNT(e.id) AS enrolled, ROUND(100.0 * COUNT(e.id) / NULLIF(sec.capacity, 0)) AS fill_pct FROM bus_class_section sec JOIN bus_course c ON c.id = sec.course_id LEFT JOIN bus_enrollment e ON e.class_section_id = sec.id AND e.deleted_at IS NULL AND e.status = 'enrolled' WHERE sec.deleted_at IS NULL AND sec.status IN ('open', 'in_progress') GROUP BY sec.id, sec.code, c.name, sec.capacity ORDER BY fill_pct
  - name: registrar-students-without-a-timetable
    title: Enrolled students in no group at all
    entity: Student
    help: A student on the roll with no enrolment anywhere is either a registration that never finished or a leaver nobody recorded. Both are invisible from every other screen and both cost the school money.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, s.year_group, s.enrolled_on FROM bus_student s LEFT JOIN bus_enrollment e ON e.student_id = s.id AND e.deleted_at IS NULL AND e.status IN ('pending', 'enrolled') WHERE s.deleted_at IS NULL AND s.status = 'enrolled' GROUP BY s.id, s.student_number, s.first_name, s.last_name, s.year_group, s.enrolled_on HAVING COUNT(e.id) = 0 ORDER BY s.year_group, s.last_name
  - name: registrar-counter-disagrees
    title: Groups whose enrolled counter is wrong
    entity: ClassSection
    help: The maintained counter on a section is what every timetable row shows; when it disagrees with the enrolments themselves a hook has failed silently, and every screen has been lying since. Nothing else in the application notices.
    sql: SELECT sec.code AS section, sec.enrolled_count AS counter, COUNT(e.id) AS actual FROM bus_class_section sec LEFT JOIN bus_enrollment e ON e.class_section_id = sec.id AND e.deleted_at IS NULL AND e.status = 'enrolled' WHERE sec.deleted_at IS NULL GROUP BY sec.id, sec.code, sec.enrolled_count HAVING sec.enrolled_count <> COUNT(e.id) ORDER BY ABS(sec.enrolled_count - COUNT(e.id)) DESC
  - name: registrar-withdrawals-this-term
    title: Students who left a group, and why
    entity: Enrollment
    help: What the registrar is asked for at every curriculum meeting. Read together the reasons say whether a subject is losing students to a clash, to difficulty, or to a teacher.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, c.name AS course, e.withdrawn_on, e.withdrawal_reason FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id JOIN bus_class_section sec ON sec.id = e.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE e.deleted_at IS NULL AND e.status = 'withdrawn' AND e.withdrawn_on > now()::date - 120 ORDER BY e.withdrawn_on DESC
  # -- teacher: the room they are about to walk into ---------------------------
  - name: teacher-today
    title: Today's sessions, by teacher
    entity: ClassSession
    help: "The first screen of a teaching day: what is on, where, and how many are expected. The room comes from the session where a one-off move was made and from the section otherwise, which is exactly the case a teacher needs told."
    sql: SELECT COALESCE(cover.first_name || ' ' || cover.last_name, st.first_name || ' ' || st.last_name) AS teacher, c.name AS course, sec.code AS section, COALESCE(sr.code, r.code) AS room, ses.starts_at, COUNT(e.id) AS expected FROM bus_class_session ses JOIN bus_class_section sec ON sec.id = ses.class_section_id JOIN bus_course c ON c.id = sec.course_id JOIN bus_staff st ON st.id = sec.staff_id LEFT JOIN bus_staff cover ON cover.id = ses.staff_id LEFT JOIN bus_room r ON r.id = sec.room_id LEFT JOIN bus_room sr ON sr.id = ses.room_id LEFT JOIN bus_enrollment e ON e.class_section_id = sec.id AND e.deleted_at IS NULL AND e.status = 'enrolled' WHERE ses.deleted_at IS NULL AND ses.status = 'scheduled' AND ses.starts_at >= date_trunc('day', now()) AND ses.starts_at < date_trunc('day', now()) + interval '1 day' GROUP BY cover.first_name, cover.last_name, st.first_name, st.last_name, c.name, sec.code, sr.code, r.code, ses.starts_at ORDER BY ses.starts_at
  - name: teacher-registers-not-taken
    title: Sessions that ran with no register
    entity: ClassSession
    help: A missing register is a hole in the statutory return, and it is invisible the moment the day ends. Chased the same week it is a reminder; chased at the end of term it is a compliance finding nobody can now fix.
    sql: SELECT st.first_name || ' ' || st.last_name AS teacher, c.name AS course, sec.code AS section, ses.starts_at FROM bus_class_session ses JOIN bus_class_section sec ON sec.id = ses.class_section_id JOIN bus_course c ON c.id = sec.course_id LEFT JOIN bus_staff st ON st.id = COALESCE(ses.staff_id, sec.staff_id) WHERE ses.deleted_at IS NULL AND ses.status <> 'cancelled' AND ses.register_taken = false AND ses.ends_at < now() ORDER BY ses.starts_at
  - name: teacher-marking-outstanding
    title: Work handed in and not yet marked
    entity: Assessment
    help: What a teacher opens to plan an evening. Submitted results with no mark, oldest paper first, because a class waiting three weeks for a grade has stopped acting on the feedback.
    sql: SELECT c.name AS course, sec.code AS section, a.title, a.due_on, COUNT(*) FILTER (WHERE ar.status = 'submitted') AS unmarked, COUNT(*) AS results FROM bus_assessment a JOIN bus_class_section sec ON sec.id = a.class_section_id JOIN bus_course c ON c.id = sec.course_id JOIN bus_assessment_result ar ON ar.assessment_id = a.id AND ar.deleted_at IS NULL WHERE a.deleted_at IS NULL AND a.status IN ('published', 'marking') GROUP BY a.id, c.name, sec.code, a.title, a.due_on HAVING COUNT(*) FILTER (WHERE ar.status = 'submitted') > 0 ORDER BY a.due_on
  - name: teacher-students-below-floor
    title: Students in my groups below the attendance floor
    entity: Enrollment
    help: The pastoral conversation a teacher is expected to have first, and the evidence for it. Below ninety percent a student is missing one lesson in ten, which is a grade, and the teacher sees it before the year head does.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, c.name AS course, sec.code AS section, e.attendance_rate FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id JOIN bus_class_section sec ON sec.id = e.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE e.deleted_at IS NULL AND e.status = 'enrolled' AND e.attendance_rate < 90 ORDER BY e.attendance_rate
  - name: teacher-upcoming-assessments
    title: Work due in the next fortnight
    entity: Assessment
    help: What a teacher checks before setting anything else, and what a head of department reads to see whether a group has four papers in one week.
    sql: SELECT c.name AS course, sec.code AS section, a.title, a.assessment_type, a.due_on, a.weight_percent FROM bus_assessment a JOIN bus_class_section sec ON sec.id = a.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE a.deleted_at IS NULL AND a.status IN ('draft', 'published') AND a.due_on BETWEEN now()::date AND now()::date + 14 ORDER BY a.due_on
  # -- head of department: the subject, and the people teaching it -------------
  - name: hod-results-by-course
    title: Average score by course
    entity: Course
    chart: bar
    x: course
    y: average_pct
    help: What the head of department is asked for at every review. Marks as a percentage of each paper's own maximum, so a course marked out of 40 and one marked out of 100 can sit in the same chart.
    sql: SELECT c.name AS course, COUNT(ar.id) AS marks, ROUND(AVG(100.0 * ar.score / NULLIF(ar.max_score, 0)), 1) AS average_pct FROM bus_assessment_result ar JOIN bus_assessment a ON a.id = ar.assessment_id JOIN bus_class_section sec ON sec.id = a.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE ar.deleted_at IS NULL AND a.deleted_at IS NULL AND ar.status = 'marked' AND ar.score IS NOT NULL GROUP BY c.id, c.name ORDER BY average_pct
  - name: hod-marking-turnaround
    title: How long marking takes, by teacher
    entity: Staff
    chart: bar
    x: teacher
    y: median_days
    help: The number a department is actually held to. Days from the due date to the mark being recorded; a teacher consistently at three weeks is not lazy, they are teaching too many groups, and this is the evidence for saying so.
    sql: SELECT st.first_name || ' ' || st.last_name AS teacher, COUNT(*) AS marked, ROUND(AVG(EXTRACT(EPOCH FROM ar.marked_at - a.due_on::timestamp) / 86400)::numeric, 1) AS median_days FROM bus_assessment_result ar JOIN bus_assessment a ON a.id = ar.assessment_id JOIN bus_staff st ON st.id = ar.marked_by_id WHERE ar.deleted_at IS NULL AND a.deleted_at IS NULL AND ar.status = 'marked' AND ar.marked_at IS NOT NULL GROUP BY st.id, st.first_name, st.last_name ORDER BY median_days DESC
  - name: hod-weights-not-adding-up
    title: Groups whose assessment weights do not total 100
    entity: ClassSection
    help: A section whose published papers add to eighty percent has a grade that means nothing, and no diagnostic anywhere reports it. Found at term end it is a re-grade; found in week three it is one edit.
    sql: SELECT sec.code AS section, c.name AS course, COUNT(a.id) AS papers, SUM(a.weight_percent) AS total_weight FROM bus_class_section sec JOIN bus_course c ON c.id = sec.course_id JOIN bus_assessment a ON a.class_section_id = sec.id AND a.deleted_at IS NULL AND a.status <> 'cancelled' WHERE sec.deleted_at IS NULL AND sec.status IN ('open', 'in_progress') GROUP BY sec.id, sec.code, c.name HAVING SUM(a.weight_percent) <> 100 ORDER BY ABS(SUM(a.weight_percent) - 100) DESC
  - name: hod-teaching-load
    title: Teaching load, by teacher
    entity: Staff
    chart: bar
    x: teacher
    y: students
    help: What a head of department takes into a timetabling meeting. Groups and students carried, because two teachers with four sections each are not carrying the same load if one of them has forty more children.
    sql: SELECT st.first_name || ' ' || st.last_name AS teacher, d.name AS department, COUNT(DISTINCT sec.id) AS sections, COUNT(e.id) AS students FROM bus_staff st LEFT JOIN bus_department d ON d.id = st.department_id LEFT JOIN bus_class_section sec ON sec.staff_id = st.id AND sec.deleted_at IS NULL AND sec.status IN ('open', 'in_progress') LEFT JOIN bus_enrollment e ON e.class_section_id = sec.id AND e.deleted_at IS NULL AND e.status = 'enrolled' WHERE st.deleted_at IS NULL AND st.staff_type = 'teaching' AND st.status = 'active' GROUP BY st.id, st.first_name, st.last_name, d.name ORDER BY students DESC
  # -- admissions officer: turning enquiries into students ---------------------
  - name: admissions-open-applications
    title: Applications waiting on us
    entity: AdmissionApplication
    help: The admissions queue, oldest first, because families judge a school by how long it took to answer. Anything past ten working days is a complaint waiting to be made.
    sql: SELECT ap.reference, ap.applicant_first_name || ' ' || ap.applicant_last_name AS applicant, ap.year_group_applied_for AS year_group, ap.admission_band, ap.status, ap.submitted_on, (now()::date - ap.submitted_on) AS days_waiting FROM bus_admission_application ap WHERE ap.deleted_at IS NULL AND ap.status IN ('submitted', 'under_review') ORDER BY ap.submitted_on
  - name: admissions-offers-unanswered
    title: Offers the family has not answered
    entity: AdmissionApplication
    help: An offer nobody chased is a place held for a family who has already accepted somewhere else, and it is held out of the queue for everyone behind them. Two weeks is the point at which a phone call is worth more than a letter.
    sql: SELECT ap.reference, ap.applicant_first_name || ' ' || ap.applicant_last_name AS applicant, g.first_name || ' ' || g.last_name AS guardian, g.email, g.phone, ap.decided_on, (now()::date - ap.decided_on) AS days_since_offer FROM bus_admission_application ap JOIN bus_guardian g ON g.id = ap.guardian_id WHERE ap.deleted_at IS NULL AND ap.status = 'offer_made' AND ap.decided_on < now()::date - 14 ORDER BY ap.decided_on
  - name: admissions-conversion-by-band
    title: What each band actually converts at
    entity: AdmissionApplication
    chart: bar
    x: band
    y: accepted
    help: The weekly question from the head, and the only evidence that the banding rule is doing anything useful. If review converts as well as priority, the bar is in the wrong place.
    sql: SELECT ap.admission_band AS band, COUNT(*) AS applications, COUNT(*) FILTER (WHERE ap.status = 'accepted') AS accepted, ROUND(100.0 * COUNT(*) FILTER (WHERE ap.status = 'accepted') / NULLIF(COUNT(*), 0)) AS conversion_pct FROM bus_admission_application ap WHERE ap.deleted_at IS NULL AND ap.admission_band IS NOT NULL GROUP BY ap.admission_band ORDER BY accepted DESC
  - name: admissions-needing-a-person
    title: Applications the rule could not band
    entity: AdmissionApplication
    help: "The band the automation deliberately does not decide: something is missing or borderline and a person has to look. Left alone they sit behind every banded application and age quietly."
    sql: SELECT ap.reference, ap.applicant_first_name || ' ' || ap.applicant_last_name AS applicant, ap.year_group_applied_for AS year_group, ap.prior_attainment_score, ap.has_sibling_enrolled, ap.submitted_on FROM bus_admission_application ap WHERE ap.deleted_at IS NULL AND ap.admission_band = 'review' AND ap.status IN ('submitted', 'under_review') ORDER BY ap.submitted_on
  # -- finance officer: the money -----------------------------------------------
  - name: finance-overdue-invoices
    title: Invoices past their due date
    entity: FeeInvoice
    help: The chase list, and the first screen of the finance day. Sorted by what is owed rather than by age, because one large balance is worth more than ten small ones and the day is not long enough for both.
    sql: SELECT f.invoice_number, s.first_name || ' ' || s.last_name AS student, t.name AS term, f.due_on, f.total_amount, f.amount_paid, f.balance_due FROM bus_fee_invoice f JOIN bus_student s ON s.id = f.student_id JOIN bus_academic_term t ON t.id = f.academic_term_id WHERE f.deleted_at IS NULL AND f.status IN ('issued', 'part_paid', 'overdue') AND f.due_on < now()::date AND f.balance_due > 0 ORDER BY f.balance_due DESC
  - name: finance-debt-ageing
    title: Outstanding fees by age
    entity: FeeInvoice
    chart: bar
    x: bucket
    y: outstanding
    help: What the bursar takes to the governors. Anything past ninety days is a provision decision rather than a chase, and the shape of this chart is what says whether the school has a collection problem or a calendar problem.
    sql: SELECT CASE WHEN now()::date - f.due_on <= 30 THEN '0-30 days' WHEN now()::date - f.due_on <= 60 THEN '31-60 days' WHEN now()::date - f.due_on <= 90 THEN '61-90 days' ELSE 'over 90 days' END AS bucket, COUNT(*) AS invoices, SUM(f.balance_due) AS outstanding FROM bus_fee_invoice f WHERE f.deleted_at IS NULL AND f.status IN ('issued', 'part_paid', 'overdue') AND f.balance_due > 0 AND f.due_on < now()::date GROUP BY 1 ORDER BY 1
  - name: finance-issued-without-payment
    title: Issued invoices with no payment at all
    entity: FeeInvoice
    help: Not a late payer but a family who has paid nothing since the invoice went out, which is usually a statement that never arrived or a bursary that was agreed and never applied. Both are fixed with one phone call and neither is visible from the ageing report.
    sql: SELECT f.invoice_number, s.first_name || ' ' || s.last_name AS student, g.email AS billing_email, f.issued_on, f.total_amount FROM bus_fee_invoice f JOIN bus_student s ON s.id = f.student_id LEFT JOIN bus_student_guardian sg ON sg.student_id = s.id AND sg.deleted_at IS NULL AND sg.is_primary_contact = true LEFT JOIN bus_guardian g ON g.id = sg.guardian_id LEFT JOIN bus_payment p ON p.fee_invoice_id = f.id AND p.deleted_at IS NULL WHERE f.deleted_at IS NULL AND f.status IN ('issued', 'overdue') GROUP BY f.id, f.invoice_number, s.first_name, s.last_name, g.email, f.issued_on, f.total_amount HAVING COUNT(p.id) = 0 ORDER BY f.issued_on
  - name: finance-daily-takings
    title: Money received, by month and method
    entity: Payment
    chart: line
    x: month
    y: received
    help: The reconciliation the office runs against the bank statement, and the only report here a bank would recognise. Taken from payments received rather than invoices raised, so an unpaid invoice never counts as income.
    sql: SELECT to_char(date_trunc('month', p.received_at), 'YYYY-MM') AS month, SUM(p.amount) AS received, COUNT(*) AS payments FROM bus_payment p WHERE p.deleted_at IS NULL AND p.received_at > now() - interval '12 months' GROUP BY 1 ORDER BY 1
  - name: finance-cancelled-invoices
    title: Fees written off, and why
    entity: FeeInvoice
    help: Every cancelled invoice is money the school chose not to collect, and the reason is free text because the judgement is human. Read together they show whether write-offs are policy or habit.
    sql: SELECT f.invoice_number, s.first_name || ' ' || s.last_name AS student, t.name AS term, f.total_amount, f.cancellation_reason, f.updated_at FROM bus_fee_invoice f JOIN bus_student s ON s.id = f.student_id JOIN bus_academic_term t ON t.id = f.academic_term_id WHERE f.deleted_at IS NULL AND f.status = 'cancelled' ORDER BY f.updated_at DESC
  - name: finance-drafts-past-census
    title: Draft invoices for a term already counted
    entity: FeeInvoice
    help: The report that rots silently, and the most expensive one here. The census date passed, the student is being taught, and the invoice was never issued — so nobody is chasing a bill that does not exist.
    sql: SELECT f.invoice_number, s.first_name || ' ' || s.last_name AS student, t.name AS term, t.census_on, f.total_amount FROM bus_fee_invoice f JOIN bus_student s ON s.id = f.student_id JOIN bus_academic_term t ON t.id = f.academic_term_id WHERE f.deleted_at IS NULL AND f.status = 'draft' AND t.census_on < now()::date ORDER BY t.census_on
  - name: finance-unapplied-payments
    title: Payments that did not move the invoice
    entity: Payment
    help: A payment recorded against an invoice that is still showing the same balance means the settlement workflow did not run. The money is in the bank and the family is still on the chase list, which is the worst of both.
    sql: SELECT p.reference, s.first_name || ' ' || s.last_name AS student, f.invoice_number, p.amount, p.balance_before, f.balance_due, p.received_at FROM bus_payment p JOIN bus_fee_invoice f ON f.id = p.fee_invoice_id JOIN bus_student s ON s.id = f.student_id WHERE p.deleted_at IS NULL AND f.deleted_at IS NULL AND f.status IN ('issued', 'overdue') AND f.balance_due = p.balance_before ORDER BY p.received_at DESC
  # -- counsellor: the children who need somebody to notice --------------------
  - name: counsellor-open-incidents
    title: Conduct records still open
    entity: DisciplineIncident
    help: The pastoral workload, and the list the team works down every morning. Ageing rather than severity, because a minor incident nobody closed for a month is its own kind of failure.
    sql: SELECT i.reference, s.first_name || ' ' || s.last_name AS student, s.year_group, i.category, i.severity, i.status, i.occurred_at, EXTRACT(DAY FROM now() - i.occurred_at)::int AS days_open FROM bus_discipline_incident i JOIN bus_student s ON s.id = i.student_id WHERE i.deleted_at IS NULL AND i.status NOT IN ('closed', 'dismissed') ORDER BY i.occurred_at
  - name: counsellor-repeat-incidents
    title: Students with a pattern, not an incident
    entity: Student
    chart: bar
    x: student
    y: incidents
    help: Three records in a term is a child in trouble rather than a child misbehaving, and it is the point at which the response should change. Nobody sees the pattern from the individual records, which is why this report exists.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, s.year_group, COUNT(*) AS incidents, MAX(i.occurred_at) AS most_recent FROM bus_discipline_incident i JOIN bus_student s ON s.id = i.student_id WHERE i.deleted_at IS NULL AND i.occurred_at > now() - interval '90 days' GROUP BY s.id, s.first_name, s.last_name, s.year_group HAVING COUNT(*) >= 3 ORDER BY incidents DESC
  - name: counsellor-current-suspensions
    title: Students currently suspended
    entity: Student
    help: Who is out of lessons today, and on what authority. A suspension with no incident carrying a suspension sanction is either a keying error or a decision taken outside the process, and both need finding.
    sql: SELECT s.student_number, s.first_name || ' ' || s.last_name AS student, s.year_group, i.reference AS incident, i.sanction_notes, i.occurred_at FROM bus_student s LEFT JOIN bus_discipline_incident i ON i.student_id = s.id AND i.deleted_at IS NULL AND i.sanction = 'suspension' WHERE s.deleted_at IS NULL AND s.status = 'suspended' ORDER BY i.occurred_at DESC NULLS FIRST
  - name: counsellor-unauthorised-absence
    title: Unauthorised absence, worst first
    entity: AttendanceRecord
    chart: bar
    x: student
    y: sessions_missed
    help: The statutory conversation, and the one that reaches a family fastest. An unauthorised absence is the school saying it did not accept the reason, so a run of them is a safeguarding question rather than an attendance one.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, s.year_group, COUNT(*) AS sessions_missed FROM bus_attendance_record ar JOIN bus_student s ON s.id = ar.student_id JOIN bus_class_session ses ON ses.id = ar.class_session_id WHERE ar.deleted_at IS NULL AND ses.deleted_at IS NULL AND ar.status = 'absent' AND ar.is_authorised = false AND ses.starts_at > now() - interval '60 days' GROUP BY s.id, s.first_name, s.last_name, s.year_group ORDER BY sessions_missed DESC
  # -- guardian: their own child ------------------------------------------------
  - name: guardian-child-timetable
    title: My child's groups this term
    entity: Enrollment
    help: What a guardian opens the application for, and what stops the phone call to the office. Subject, teacher, day and period, in the order the week runs.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, c.name AS course, st.first_name || ' ' || st.last_name AS teacher, sec.day_of_week, sec.period, r.code AS room FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id JOIN bus_class_section sec ON sec.id = e.class_section_id JOIN bus_course c ON c.id = sec.course_id LEFT JOIN bus_staff st ON st.id = sec.staff_id LEFT JOIN bus_room r ON r.id = sec.room_id WHERE e.deleted_at IS NULL AND e.status = 'enrolled' AND sec.status IN ('open', 'in_progress') ORDER BY s.last_name, sec.day_of_week, sec.period
  - name: guardian-child-attendance
    title: My child's attendance, by subject
    entity: Enrollment
    help: The number the school will quote in any conversation about progress, shown before that conversation rather than during it. A subject twenty points below the others is a timetable problem or a teacher problem, and either is worth asking about.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, c.name AS course, e.attendance_rate FROM bus_enrollment e JOIN bus_student s ON s.id = e.student_id JOIN bus_class_section sec ON sec.id = e.class_section_id JOIN bus_course c ON c.id = sec.course_id WHERE e.deleted_at IS NULL AND e.status = 'enrolled' ORDER BY s.last_name, e.attendance_rate
  - name: guardian-child-results
    title: My child's marked work
    entity: AssessmentResult
    help: Marks as they were given, with the paper's own maximum beside them, because a 34 means nothing until you know it was out of 40. Newest first, which is the order a family reads them in.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, c.name AS course, a.title, ar.score, ar.max_score, ROUND(100.0 * ar.score / NULLIF(ar.max_score, 0)) AS percent, ar.marked_at FROM bus_assessment_result ar JOIN bus_assessment a ON a.id = ar.assessment_id JOIN bus_class_section sec ON sec.id = a.class_section_id JOIN bus_course c ON c.id = sec.course_id JOIN bus_student s ON s.id = ar.student_id WHERE ar.deleted_at IS NULL AND a.deleted_at IS NULL AND ar.status = 'marked' ORDER BY ar.marked_at DESC
  - name: guardian-outstanding-fees
    title: What I still owe, and by when
    entity: FeeInvoice
    help: One row per unpaid invoice with the balance and the due date, so a family can see what is outstanding without ringing the office — which is most of what the office is rung about.
    sql: SELECT s.first_name || ' ' || s.last_name AS student, f.invoice_number, t.name AS term, f.due_on, f.total_amount, f.amount_paid, f.balance_due, f.status FROM bus_fee_invoice f JOIN bus_student s ON s.id = f.student_id JOIN bus_academic_term t ON t.id = f.academic_term_id WHERE f.deleted_at IS NULL AND f.status IN ('issued', 'part_paid', 'overdue') AND f.balance_due > 0 ORDER BY f.due_on
rules:
  # ---- Business rules — admission assessment (decides only, cannot act) -------
  # This section carries a node graph and no %%action directives, deliberately.
  # It is the judgement an admissions officer exercises today, written down so it
  # is visible in the application's rule screen and in the viewers — and per §3.4
  # a node-graph rule carries no outputs, so it decides and never writes. The
  # banding it describes is applied by the decision table in the next section.
  - name: admissionAssessment
    title: Admission Assessment
    entity: AdmissionApplication
    event: beforeCreate
    priority: 5
    nodes:
      - id: A
        label: Application received
        type: start
      - id: B
        label: Prior attainment recorded?
        type: decision
      - id: R1
        label: "Send to review: nothing to assess on"
        type: expression
      - id: C
        label: Sibling already enrolled?
        type: decision
      - id: P1
        label: "Priority: sibling policy"
        type: expression
      - id: D
        label: Attainment at or above the bar?
        type: decision
      - id: P2
        label: "Priority: meets the academic bar"
        type: expression
      - id: S1
        label: Standard offer queue
        type: expression
      - id: E
        label: Assessed
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: R1
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: P1
        label: Yes
      - from: C
        to: D
        label: No
      - from: D
        to: P2
        label: Yes
      - from: D
        to: S1
        label: No
      - from: R1
        to: E
      - from: P1
        to: E
      - from: P2
        to: E
      - from: S1
        to: E
  # ---- Business rules — admission banding (acts: stamps the band) ------------
  - name: admissionBanding
    title: Admission Banding
    entity: AdmissionApplication
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Application received
        type: start
      - id: B
        label: Attainment recorded?
        type: decision
      - id: R
        label: "Band: review"
        type: expression
      - id: C
        label: Sibling enrolled, or at the bar?
        type: decision
      - id: P
        label: "Band: priority"
        type: expression
      - id: S
        label: "Band: standard"
        type: expression
      - id: E
        label: Banded
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: R
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: P
        label: Yes
      - from: C
        to: S
        label: No
      - from: R
        to: E
      - from: P
        to: E
      - from: S
        to: E
    actions:
      - name: bandOnSibling
        type: transform
        when: has_sibling_enrolled == true
        props:
          field: admission_band
          value: priority
      - name: bandOnAttainment
        type: transform
        when: has_sibling_enrolled == false and prior_attainment_score >= 70
        props:
          field: admission_band
          value: priority
      - name: bandStandard
        type: transform
        when: has_sibling_enrolled == false and prior_attainment_score < 70
        props:
          field: admission_band
          value: standard
      - name: bandForReview
        type: transform
        when: prior_attainment_score == null
        props:
          field: admission_band
          value: review
      - name: requireDecisionNotesOnRejection
        type: validation-error
        when: status == "rejected" and decision_notes == null
        props:
          message: A rejected application needs a note — it is what the appeal is answered from.
      - name: enrolOnAcceptance
        type: trigger-workflow
        when: status == "accepted"
        props:
          workflow: AdmissionToEnrolment
  # ---- Business rules — the student record ----------------------------------
  - name: studentRecordControl
    title: Student Record Control
    entity: Student
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Student record written
        type: start
      - id: B
        label: Leaving?
        type: decision
      - id: C
        label: Date and reason recorded?
        type: decision
      - id: R1
        label: "Refuse: an unexplained leaver cannot be reported"
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: P
        label: Yes
      - from: B
        to: P
        label: No
      - from: R1
        to: E
      - from: P
        to: E
    actions:
      - name: requireWithdrawalReason
        type: validation-error
        when: status == "withdrawn" and withdrawal_reason == null
        props:
          message: A withdrawal needs a reason — the retention report is built from it.
      - name: requireWithdrawalDate
        type: validation-error
        when: status == "withdrawn" and withdrawn_on == null
        props:
          message: A withdrawal needs the date the student left.
  # ---- Business rules — enrolment -------------------------------------------
  - name: enrolmentControl
    title: Enrolment Control
    entity: Enrollment
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Enrolment written
        type: start
      - id: B
        label: Withdrawing?
        type: decision
      - id: C
        label: Reason given?
        type: decision
      - id: R1
        label: Refuse
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: D
        label: Grade recorded before completion?
        type: decision
      - id: R2
        label: Refuse
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: P
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: R2
        label: Yes
      - from: D
        to: P
        label: No
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
    actions:
      - name: requireEnrolmentWithdrawalReason
        type: validation-error
        when: status == "withdrawn" and withdrawal_reason == null
        props:
          message: A student leaving a group needs a reason — the subject-change reports are built from it.
      - name: refuseGradeBeforeCompletion
        type: validation-error
        when: status == "pending" and final_grade != null
        props:
          message: A final grade cannot be recorded on an enrolment that has not been placed yet.
      - name: requireGradeOnCompletion
        type: validation-error
        when: status == "completed" and final_grade == null
        props:
          message: A completed enrolment needs a final grade.
  # ---- Business rules — the register ----------------------------------------
  - name: attendanceMarking
    title: Attendance Marking
    entity: AttendanceRecord
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Mark entered
        type: start
      - id: B
        label: Absent or excused?
        type: decision
      - id: C
        label: Reason recorded?
        type: decision
      - id: R1
        label: "Refuse: the statutory return needs it"
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: D
        label: Late?
        type: decision
      - id: F
        label: Minutes recorded?
        type: decision
      - id: R2
        label: Refuse
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: P
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: F
        label: Yes
      - from: F
        to: R2
        label: No
      - from: F
        to: P
        label: Yes
      - from: D
        to: P
        label: No
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
    actions:
      - name: requireAuthorisedAbsenceReason
        type: validation-error
        when: status == "absent" and is_authorised == true and absence_reason == null
        props:
          message: An authorised absence needs the reason the school accepted — it is what the inspector asks about.
      - name: requireExcusedReason
        type: validation-error
        when: status == "excused" and absence_reason == null
        props:
          message: An excused mark needs to say what the student was doing instead.
      - name: requireMinutesLate
        type: validation-error
        when: status == "late" and minutes_late == null
        props:
          message: A late mark needs the minutes — the persistent-lateness report sums them.
      - name: clearAuthorisationWhenPresent
        type: transform
        when: status == "present"
        props:
          field: is_authorised
          value: "false"
  # ---- Business rules — marking ---------------------------------------------
  - name: markingControl
    title: Marking Control
    entity: AssessmentResult
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Mark recorded
        type: start
      - id: B
        label: Score within the paper's maximum?
        type: decision
      - id: R1
        label: "Refuse: a keying error, always"
        type: expression
      - id: C
        label: Marked without a score?
        type: decision
      - id: R2
        label: Refuse
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: R1
        label: No
      - from: B
        to: C
        label: Yes
      - from: C
        to: R2
        label: Yes
      - from: C
        to: P
        label: No
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
    actions:
      - name: refuseScoreAboveMaximum
        type: validation-error
        when: score > max_score
        props:
          message: A score cannot exceed the paper's maximum as it stood when the result was created.
      - name: refuseNegativeScore
        type: validation-error
        when: score < 0
        props:
          message: A score cannot be negative. A missing piece of work is the missing status, not a negative mark.
      - name: requireScoreWhenMarked
        type: validation-error
        when: status == "marked" and score == null
        props:
          message: A marked result needs a score. A blank is not a zero and the reports keep the two apart.
  # ---- Business rules — invoicing -------------------------------------------
  - name: invoiceControl
    title: Invoice Control
    entity: FeeInvoice
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Invoice written
        type: start
      - id: B
        label: Cancelling?
        type: decision
      - id: C
        label: Reason recorded?
        type: decision
      - id: R1
        label: "Refuse: every write-off is looked at"
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: D
        label: Issuing?
        type: decision
      - id: F
        label: Issue date set?
        type: decision
      - id: R2
        label: Refuse
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: P
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: F
        label: Yes
      - from: F
        to: R2
        label: No
      - from: F
        to: P
        label: Yes
      - from: D
        to: P
        label: No
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
    actions:
      - name: requireInvoiceCancellationReason
        type: validation-error
        when: status == "cancelled" and cancellation_reason == null
        props:
          message: A cancelled invoice is money the school chose not to collect — every one of them needs a reason.
      - name: requireIssueDate
        type: validation-error
        when: status == "issued" and issued_on == null
        props:
          message: An issued invoice needs its issue date — the due date and every reminder are measured from it.
  # ---- Business rules — taking money ----------------------------------------
  - name: paymentAcceptance
    title: Payment Acceptance
    entity: Payment
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: Payment offered
        type: start
      - id: B
        label: More than the invoice owes?
        type: decision
      - id: R1
        label: "Refuse: a keying error or a credit decision"
        type: expression
      - id: C
        label: Settles the balance?
        type: decision
      - id: S
        label: Settle the invoice
        type: expression
      - id: T
        label: Post a part payment
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: R1
        label: Yes
      - from: B
        to: C
        label: No
      - from: C
        to: S
        label: Yes
      - from: C
        to: T
        label: No
      - from: R1
        to: E
      - from: S
        to: E
      - from: T
        to: E
    actions:
      - name: refuseOverpayment
        type: validation-error
        when: amount > balance_before
        props:
          message: A payment cannot exceed what the invoice still owes. A credit is a decision for the finance office, not a keying accident.
      - name: refuseNonPositivePayment
        type: validation-error
        when: amount <= 0
        props:
          message: A payment must be a positive sum. A correction is a second, offsetting record.
      - name: settleInvoice
        type: trigger-workflow
        when: amount >= balance_before
        props:
          workflow: InvoiceSettlement
      - name: postPartPayment
        type: trigger-workflow
        when: amount < balance_before
        props:
          workflow: PartPaymentPosting
  # ---- Business rules — the timetable ---------------------------------------
  - name: sectionControl
    title: Section Control
    entity: ClassSection
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Section written
        type: start
      - id: B
        label: Cancelling?
        type: decision
      - id: C
        label: Reason recorded?
        type: decision
      - id: R1
        label: Refuse
        type: expression
      - id: W
        label: Withdraw every enrolment on it
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: W
        label: Yes
      - from: B
        to: P
        label: No
      - from: R1
        to: E
      - from: W
        to: E
      - from: P
        to: E
    actions:
      - name: requireSectionCancellationReason
        type: validation-error
        when: status == "cancelled" and cancellation_reason == null
        props:
          message: Families are told why a group was pulled, so the reason is written for them and it is required.
      - name: withdrawEnrolmentsOnCancellation
        type: trigger-workflow
        when: status == "cancelled"
        props:
          workflow: SectionCancellation
  # ---- Business rules — conduct ---------------------------------------------
  - name: conductOutcome
    title: Conduct Outcome
    entity: DisciplineIncident
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: Incident updated
        type: start
      - id: B
        label: Applying a sanction?
        type: decision
      - id: C
        label: Sanction recorded?
        type: decision
      - id: R1
        label: "Refuse: an incident closed with no outcome disappears"
        type: expression
      - id: P
        label: Accept
        type: expression
      - id: D
        label: Closing?
        type: decision
      - id: F
        label: Closure date set?
        type: decision
      - id: R2
        label: Refuse
        type: expression
      - id: E
        label: End
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: R1
        label: No
      - from: C
        to: P
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: F
        label: Yes
      - from: F
        to: R2
        label: No
      - from: F
        to: P
        label: Yes
      - from: D
        to: P
        label: No
      - from: R1
        to: E
      - from: R2
        to: E
      - from: P
        to: E
    actions:
      - name: requireSanction
        type: validation-error
        when: status == "action_taken" and sanction == null
        props:
          message: An incident cannot move to action taken with no sanction recorded — including a sanction of none, which is itself a decision.
      - name: requireSanctionNotes
        type: validation-error
        when: sanction == "suspension" and sanction_notes == null
        props:
          message: A suspension needs its detail — how long, from when, and who agreed it. The appeal is answered from this field.
      - name: requireClosureDate
        type: validation-error
        when: status == "closed" and closed_on == null
        props:
          message: A closed incident needs the date it was closed; the ageing on the open list is measured from it.
      - name: suspendOnSuspension
        type: trigger-workflow
        when: sanction == "suspension"
        props:
          workflow: SuspensionEscalation
stateMachines:
  # ---- Workflow — the student lifecycle -------------------------------------
  - name: StudentLifecycle
    title: Student Lifecycle
    entity: Student
    states: [enrolled, on_leave, suspended, graduated, withdrawn]
    initial: enrolled
    final: [graduated, withdrawn]
    transitions:
      - from: enrolled
        to: on_leave
        trigger: take_leave
      - from: on_leave
        to: enrolled
        trigger: return_from_leave
      - from: enrolled
        to: suspended
        trigger: suspend
      - from: on_leave
        to: suspended
        trigger: suspend
      - from: suspended
        to: enrolled
        trigger: reinstate
      - from: enrolled
        to: graduated
        trigger: graduate
      - from: enrolled
        to: withdrawn
        trigger: withdraw
      - from: on_leave
        to: withdrawn
        trigger: withdraw
      - from: suspended
        to: withdrawn
        trigger: withdraw
  # ---- Workflow — the admission lifecycle -----------------------------------
  - name: AdmissionLifecycle
    title: Admission Lifecycle
    entity: AdmissionApplication
    states: [submitted, under_review, offer_made, rejected, accepted, declined, withdrawn]
    initial: submitted
    final: [accepted, declined, rejected, withdrawn]
    transitions:
      - from: submitted
        to: under_review
        trigger: begin_review
      - from: under_review
        to: offer_made
        trigger: make_offer
      - from: under_review
        to: rejected
        trigger: reject
      - from: offer_made
        to: accepted
        trigger: accept_offer
      - from: offer_made
        to: declined
        trigger: decline_offer
      - from: submitted
        to: withdrawn
        trigger: withdraw_application
      - from: under_review
        to: withdrawn
        trigger: withdraw_application
      - from: offer_made
        to: withdrawn
        trigger: withdraw_application
  # ---- Workflow — the section lifecycle -------------------------------------
  - name: SectionLifecycle
    title: Section Lifecycle
    entity: ClassSection
    states: [planned, open, in_progress, completed, cancelled]
    initial: planned
    final: [completed, cancelled]
    transitions:
      - from: planned
        to: open
        trigger: open_enrolment
      - from: open
        to: in_progress
        trigger: start_teaching
      - from: in_progress
        to: completed
        trigger: complete
      - from: planned
        to: cancelled
        trigger: cancel
      - from: open
        to: cancelled
        trigger: cancel
  # ---- Workflow — the session lifecycle -------------------------------------
  - name: SessionLifecycle
    title: Session Lifecycle
    entity: ClassSession
    states: [scheduled, held, cancelled]
    initial: scheduled
    final: [held, cancelled]
    transitions:
      - from: scheduled
        to: held
        trigger: hold
      - from: scheduled
        to: cancelled
        trigger: cancel
  # ---- Workflow — the enrolment lifecycle -----------------------------------
  - name: EnrolmentLifecycle
    title: Enrolment Lifecycle
    entity: Enrollment
    states: [pending, enrolled, withdrawn, completed, failed]
    initial: pending
    final: [completed, failed, withdrawn]
    transitions:
      - from: pending
        to: enrolled
        trigger: place
      - from: pending
        to: withdrawn
        trigger: cancel_request
      - from: enrolled
        to: completed
        trigger: complete
      - from: enrolled
        to: failed
        trigger: fail
      - from: enrolled
        to: withdrawn
        trigger: withdraw
  # ---- Workflow — the assessment lifecycle ----------------------------------
  - name: AssessmentLifecycle
    title: Assessment Lifecycle
    entity: Assessment
    states: [draft, published, marking, marked, cancelled]
    initial: draft
    final: [marked, cancelled]
    transitions:
      - from: draft
        to: published
        trigger: publish
      - from: published
        to: marking
        trigger: open_marking
      - from: marking
        to: marked
        trigger: publish_marks
      - from: draft
        to: cancelled
        trigger: cancel
      - from: published
        to: cancelled
        trigger: cancel
  # ---- Workflow — the result lifecycle --------------------------------------
  - name: ResultLifecycle
    title: Result Lifecycle
    entity: AssessmentResult
    states: [pending, submitted, missing, excused, marked]
    initial: pending
    final: [marked, excused]
    transitions:
      - from: pending
        to: submitted
        trigger: submit
      - from: pending
        to: missing
        trigger: mark_missing
      - from: pending
        to: excused
        trigger: excuse
      - from: submitted
        to: marked
        trigger: mark
      - from: missing
        to: submitted
        trigger: accept_late
  # ---- Workflow — the invoice lifecycle -------------------------------------
  - name: InvoiceLifecycle
    title: Invoice Lifecycle
    entity: FeeInvoice
    states: [draft, issued, cancelled, part_paid, paid, overdue]
    initial: draft
    final: [paid, cancelled]
    transitions:
      - from: draft
        to: issued
        trigger: issue
      - from: draft
        to: cancelled
        trigger: cancel_draft
      - from: issued
        to: part_paid
        trigger: record_part_payment
      - from: issued
        to: paid
        trigger: settle
      - from: issued
        to: overdue
        trigger: mark_overdue
      - from: issued
        to: cancelled
        trigger: cancel_issued
      - from: part_paid
        to: part_paid
        trigger: record_further_part_payment
      - from: part_paid
        to: paid
        trigger: settle
      - from: part_paid
        to: overdue
        trigger: mark_overdue
      - from: overdue
        to: part_paid
        trigger: record_part_payment
      - from: overdue
        to: paid
        trigger: settle
  # ---- Workflow — the conduct lifecycle -------------------------------------
  - name: ConductLifecycle
    title: Conduct Lifecycle
    entity: DisciplineIncident
    states: [reported, under_review, dismissed, action_taken, closed]
    initial: reported
    final: [closed, dismissed]
    transitions:
      - from: reported
        to: under_review
        trigger: begin_review
      - from: reported
        to: dismissed
        trigger: dismiss
      - from: under_review
        to: action_taken
        trigger: apply_sanction
      - from: under_review
        to: dismissed
        trigger: dismiss
      - from: action_taken
        to: closed
        trigger: close
  # ---- Workflow — the term lifecycle ----------------------------------------
  - name: TermLifecycle
    title: Term Lifecycle
    entity: AcademicTerm
    states: [planned, current, closed]
    initial: planned
    final: [closed]
    transitions:
      - from: planned
        to: current
        trigger: open_term
      - from: current
        to: closed
        trigger: close_term
  # ---- Workflow — the staff lifecycle ---------------------------------------
  - name: StaffLifecycle
    title: Staff Lifecycle
    entity: Staff
    states: [active, on_leave, left]
    initial: active
    final: [left]
    transitions:
      - from: active
        to: on_leave
        trigger: start_leave
      - from: on_leave
        to: active
        trigger: return_to_work
      - from: active
        to: left
        trigger: leave_school
      - from: on_leave
        to: left
        trigger: leave_school
sagas:
  # ---- Workflow — admission to enrolment (saga) -----------------------------
  - name: AdmissionToEnrolment
    title: Admission To Enrolment
    entity: AdmissionApplication
    trigger: rule
    steps:
      - id: B
        type: CreateEntity
        label: Create the student record
        properties:
          entity: Student
          as: newStudentId
          fields: '{"first_name":"applicant_first_name","last_name":"applicant_last_name","date_of_birth":"applicant_date_of_birth","year_group":"year_group_applied_for","status":"enrolled","has_support_plan":false}'
      - id: C
        type: UpdateEntity
        label: Link the student to the application
        properties:
          field: student_id
          source: newStudentId
      - id: D
        type: CreateEntity
        label: Raise the term's fee invoice
        properties:
          entity: FeeInvoice
          as: newInvoiceId
          fields: '{"student_id":"newStudentId","academic_term_id":"academic_term_id","status":"draft","total_amount":0,"amount_paid":0,"balance_due":0}'
  # ---- Workflow — settling an invoice (saga) --------------------------------
  - name: InvoiceSettlement
    title: Invoice Settlement
    entity: Payment
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Mark the invoice paid
        properties:
          entity: FeeInvoice
          targetField: fee_invoice_id
          field: status
          value: paid
  # ---- Workflow — posting a part payment (saga) -----------------------------
  - name: PartPaymentPosting
    title: Part Payment Posting
    entity: Payment
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Mark the invoice part paid
        properties:
          entity: FeeInvoice
          targetField: fee_invoice_id
          field: status
          value: part_paid
  # ---- Workflow — cancelling a section (saga) -------------------------------
  - name: SectionCancellation
    title: Section Cancellation
    entity: ClassSection
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Withdraw every enrolment on it
        properties:
          entity: Enrollment
          targetField: class_section_id
          field: status
          value: withdrawn
  # ---- Workflow — suspension (saga) -----------------------------------------
  - name: SuspensionEscalation
    title: Suspension Escalation
    entity: DisciplineIncident
    trigger: rule
    steps:
      - id: B
        type: UpdateEntity
        label: Suspend the student
        properties:
          entity: Student
          targetField: student_id
          field: status
          value: suspended
