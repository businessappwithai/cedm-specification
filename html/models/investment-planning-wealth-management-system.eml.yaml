    icon: Building2
    color: "#0ea5e9"
    entities: [OrganizationUnit, Advisor, Team]
  - name: CRM and Onboarding
    description: Prospects, the conversations held with them, service requests raised afterwards, and the case that carries a prospect through to an active client
    icon: UserPlus
    color: "#ec4899"
    entities: [Prospect, Interaction, Activity, ServiceRequest, OnboardingCase]
  - name: Compliance and Identity
    description: The regulatory file — KYC, FATCA and CRS declarations, suitability assessments, identity documents, signatures and the audit trail
    icon: ShieldCheck
    color: "#f59e0b"
    entities: [KYCRecord, SuitabilityAssessment, ESignatureRequest, BankAccount, Document, AuditEvent, AdvancedComplianceRecord]
  - name: Financial Planning
