    icon: Layers
    color: "#64748b"
    entities: [Equity, Bond, AIF, PMS, Insurance, RealEstate, TaxLot, CapitalGain, ExternalIntegration]
entities:
  - name: Party
    help: The root identity record — one row for every real person or legal entity the firm deals with, whatever role they later play. A party can be a client, a nominee, an attorney, an advisor and a sub-broker at once; separating identity from role is what stops the same human being duplicated five times and lets KYC be done once.
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_type
        type: string
        help: "individual or organization — which of the two detail tables carries the rest of this identity. It is set when the party is created and never changed: switching it would orphan the Person or Organization record hanging off it."
      - name: display_name
        type: string
        help: The name shown wherever this identity appears in a list, a dropdown or an audit line. Derived from the person's or organization's own name at creation, and kept as one field so every screen can label a party without joining to whichever detail table applies.
      - name: status
        type: string
        enum: PartyStatus
        help: Whether this identity may still be used. A party is deactivated rather than deleted — regulatory record-keeping outlives the relationship, and a nominee or attorney on a historic mandate must remain resolvable years after they stopped being current.
  - name: Person
    help: "The natural-person half of an identity: the demographic detail that KYC, suitability and nomination all read. It exists once per human being no matter how many households, mandates or roles they appear in, which is why it hangs off Party rather than off Client."
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity this individual detail belongs to. One row per party, and the reason a person can be a client in one household and a nominee in another without being entered twice.
      - name: first_name
        type: string
        help: Given name exactly as it appears on the primary identity document. Regulators match on the document, not on the preferred name, so a mismatch here is the most common cause of a KYC rejection.
      - name: middle_name
        type: string
        optional: true
        help: Middle name or patronymic where the identity document carries one. Optional, but omitting it when the document shows it will fail an exact-match KYC check.
      - name: last_name
        type: string
        help: Family name as printed on the identity document. Combined with the first name to form the display name and to match against sanctions and PEP lists.
      - name: date_of_birth
        type: date
        optional: true
        help: Date of birth, used to establish legal capacity, to compute the investment horizon a suitability assessment assumes, and to match identity records. A minor's account needs a guardian mandate before it can transact.
      - name: gender
        type: string
        optional: true
        help: As recorded on the identity document. Held because some product applications and statutory returns require it, not because the firm makes any decision on it.
      - name: marital_status
        type: string
        optional: true
        help: Marital status, which changes who has a claim on the estate and therefore what nomination and succession advice is appropriate. Reviewed at every periodic review rather than assumed to be static.
      - name: nationality
        type: string
        optional: true
        help: Country of citizenship. It drives the tax-residency questions on the FATCA and CRS declarations and determines which products the client is eligible to hold at all.
      - name: occupation
        type: string
        optional: true
        help: "What the client does for a living. Two things read it: the source-of-funds justification KYC requires, and the risk assessment, where income stability matters as much as income size."
  - name: Organization
    help: "The legal-entity half of an identity — a company, trust, partnership or society that invests in its own name. Corporate clients differ from individuals in almost every downstream process: authorised signatories rather than a single holder, board resolutions rather than consent, and a different documentary standard for KYC."
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity this corporate detail belongs to. One row per party, mirroring Person on the other branch.
      - name: legal_name
        type: string
        help: The entity's registered name, exactly as on the incorporation certificate. Every mandate, contract note and statutory filing must use this form, not the trading name people use in conversation.
      - name: organization_type
        type: string
        help: Company, trust, partnership, HUF, society — the constitution of the entity. It decides which documents KYC demands, who can sign, and which products the entity may hold.
      - name: registration_number
        type: string
        optional: true
        help: The number the entity is incorporated under (CIN, registration or trust deed number). It is what a registry lookup is performed against during onboarding.
      - name: tax_identifier
        type: string
        optional: true
        help: The entity's tax registration — PAN or the local equivalent. Required before any investment can be made and quoted on every capital-gains statement.
  - name: Household
    help: "The advisory unit: the group of parties whose wealth is planned together. Almost nothing in planning is done per person — a goal, a plan, a portfolio and an allocation belong to a family, and a couple's retirement is one problem, not two. The household is also what an advisor is assigned to and what fees are usually struck against."
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: How the family is referred to in the firm — usually the principal's surname. It appears on every plan, review pack and portfolio statement, so keep it the form the family would recognise.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the household is an active advisory relationship. Closing it stops new plans and recommendations while leaving history, valuations and tax records readable.
      - name: advisor_id
        type: string
        fk: true
        help: "The advisor accountable for the relationship as a whole. Distinct from the assignment records, which can carry several advisors over time: this is the single name the family expects to hear from."
      - name: risk_profile_id
        type: string
        fk: true
        help: The risk profile currently in force for the household. Recommendations and rebalancing are checked against this, so a household whose profile has expired cannot be advised until it is reassessed.
      - name: annual_income
        type: money
        optional: true
        help: Combined income of the household's members, as declared at the last review. Used to size affordability in the plan and, with net worth, to sanity-check the risk capacity the questionnaire reported.
      - name: net_worth
        type: money
        optional: true
        help: "Total assets less liabilities across the household, including assets the firm does not manage. It is what makes a recommendation proportionate: a position that is aggressive for the managed portfolio may be trivial against the whole balance sheet."
  - name: HouseholdMember
    help: "One party's membership of one household, over a period. Membership is time-bounded because families change: a spouse joins, a child becomes independent, an estate is settled. Holding it as a record rather than a link keeps the history a review needs."
    parent: Household
    attributes:
      - name: id
        type: string
        pk: true
      - name: household_id
        type: string
        fk: true
        help: The family this membership is in. Listed inside the household's own screen — a membership away from its household is not something anybody looks up.
      - name: party_id
        type: string
        fk: true
        help: The person or entity that is a member. The same party may be a member of more than one household — an elderly parent counted in their children's plan, for instance.
      - name: relationship_type
        type: string
        help: How this member relates to the principal — spouse, child, parent, dependant, trustee. It determines whose goals are whose and who has a natural claim in succession planning.
      - name: ownership_percentage
        type: money
        optional: true
        help: This member's share of jointly held household assets, where the family has agreed one. Used to split valuations and gains when reporting per person rather than per household.
      - name: is_primary
        type: boolean
        help: Whether this member is the principal — the person the firm corresponds with and whose consent carries the relationship. Exactly one member should hold it at a time.
      - name: start_date
        type: date
        help: When this member joined the household for planning purposes. It bounds the period their income, goals and assets belong in the household's figures.
      - name: end_date
        type: date
        optional: true
        help: When the membership ended — separation, death, or a child setting up their own household. Empty for a current member; setting it excludes them from future plans without erasing them from past ones.
  - name: Client
    help: "A party the firm actually advises, under a stated service and fee arrangement. The distinction from Party matters commercially: a party becomes a client only when onboarding completes, and everything billable, reportable or regulated hangs off this record rather than off the identity."
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity being advised. One party can hold only one client record — a second would split the relationship's history and its fee accrual.
      - name: household_id
        type: string
        fk: true
        help: The family this client is planned within. Goals, plans and portfolios are held at the household, so a client outside one can transact but cannot be planned for.
      - name: client_number
        type: string
        unique: true
        help: The reference quoted on statements, contract notes and in correspondence. It is what a client reads out on the phone, which is why it exists alongside the internal key.
      - name: client_type
        type: string
        help: Retail, HNI, ultra-HNI or institutional. It sets the regulatory protections that apply, the products the client may be offered, and the service model the firm is committing to.
      - name: status
        type: string
        enum: ClientStatus
        help: Where the relationship stands — prospective, onboarding, active, dormant or closed. Only an active client may be transacted for; a dormant one keeps holdings but generates no new advice.
      - name: onboarding_date
        type: date
        optional: true
        help: When onboarding completed and advice could begin. It is the start of the fee clock and the anchor for every since-inception performance figure.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor of record for this client. Where a household has several members with different advisors, this is the one accountable for this client's suitability.
      - name: service_model
        type: string
        help: What the client has been promised — execution-only, advisory or discretionary. It decides whether the firm may act without asking, and therefore which recommendations need an acceptance before anything is bought.
      - name: fee_model
        type: string
        help: "How the firm is paid for this client: a percentage of assets, a flat retainer, commission on products, or a combination. It must be disclosed and it governs which fee schedule accrues against the relationship."
  - name: Address
    help: A postal address belonging to a party, kept as its own record because a party has several — registered, correspondence, and often an overseas one — and because a change of address is a KYC event that has to be evidenced rather than typed over the old one.
    parent: Party
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity this address belongs to. Addresses are read inside the party's own screen; a list of every address in the firm is not a screen anybody opens.
      - name: address_type
        type: string
        help: Registered, correspondence, permanent or overseas. The registered address is what statutory filings use; correspondence is where paper actually goes, and the two are often not the same.
      - name: line1
        type: string
        help: Street address, in the form the postal service expects. Written as the courier will read it, because dispatch of physical contract notes and cheques depends on it.
      - name: city
        type: string
        help: City or town. Part of the postal address and one of the fields matched when verifying an address document.
      - name: state_province
        type: string
        help: "State or province. It matters beyond the postal address: stamp duty and some product eligibility vary by state."
      - name: postal_code
        type: string
        help: Postal or PIN code, matched against the address proof during KYC. A mismatch here is a common reason a verification is rejected.
      - name: country
        type: string
        help: Country of the address. A non-domestic address raises tax-residency questions and may make the client reportable under FATCA or CRS regardless of what the declaration says.
      - name: is_primary
        type: boolean
        help: Whether this is the address the firm uses by default. One per party — the flag is what a statement run and a courier both read.
  - name: ContactPoint
    help: One way of reaching a party — a mobile number, an email address, a landline. Held as records rather than columns because a party has several, each verified separately, and because a change to the one used for transaction confirmation is itself a controlled event.
    parent: Party
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity that can be reached this way. Read from the party's own screen along with their addresses.
      - name: contact_type
        type: string
        help: "mobile, email, landline or fax. The type decides what the channel can be used for: one-time passwords go to a mobile, contract notes to an email."
      - name: value
        type: string
        help: The number or address itself. Stored exactly as it should be dialled or sent to, including country code, because an automated dispatch will not repair it.
      - name: is_primary
        type: boolean
        help: Whether this is the default for its type. Statements, alerts and confirmations go to the primary; the others exist so a client can be reached when it fails.
      - name: verified
        type: boolean
        help: Whether the firm has proved the party actually controls this channel — a one-time password answered, or a confirmation link followed. An unverified channel must not be used for transaction authorisation.
  - name: Nominee
    help: "The person a client has named to receive an investment on their death. Nomination is a statutory mechanism separate from a will, and getting it wrong is expensive for the family: an out-of-date nominee overrides what everyone assumed, so the record is time-bounded and reviewed at every periodic review."
    parent: Client
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client whose holdings this nomination applies to. Nominations are read inside the client's own screen, because a nomination away from the client it protects means nothing.
      - name: party_id
        type: string
        fk: true
        help: The person named to receive. Held as a party rather than free text so the nominee's own identity and contact details are already on file when a claim is made.
      - name: relationship_type
        type: string
        help: How the nominee is related to the client — spouse, child, parent, sibling, other. Registrars require it, and it is what a claims team checks the supporting documents against.
      - name: allocation_percentage
        type: money
        optional: true
        help: This nominee's share of the proceeds. Shares across a client's active nominations should total one hundred per cent; anything less leaves the remainder to the estate and a much slower process.
      - name: start_date
        type: date
        help: When this nomination took effect. Nominations are dated because a claim is settled against whichever was in force on the date of death.
      - name: end_date
        type: date
        optional: true
        help: When the nomination was superseded or revoked. Empty for the nomination currently in force; setting it keeps the earlier one on file, which is exactly what a disputed claim needs.
  - name: PowerOfAttorney
    help: A mandate letting one party act on another's investments. It is the instrument behind every discretionary arrangement and every account operated by a family member, and its scope and expiry are what an operations team checks before accepting an instruction from anyone who is not the holder.
    attributes:
      - name: id
        type: string
        pk: true
      - name: grantor_party_id
        type: string
        fk: true
        help: The party whose investments may be operated — the person giving the authority away. Nothing may be done under this mandate that the grantor could not do themselves.
      - name: attorney_party_id
        type: string
        fk: true
        help: The party granted the authority. Held as a party so the attorney's own identity is verified before any instruction of theirs is accepted.
      - name: effective_date
        type: date
        help: When the authority begins. An instruction dated before this is not covered by the mandate, however plainly it was intended to be.
      - name: expiry_date
        type: date
        optional: true
        help: When the authority lapses, where it is time-limited. Empty for an open mandate; a lapsed one must be refused even when the parties are unaware it has expired.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the mandate is active, suspended or revoked. Revocation takes effect immediately and is the reason this is a status rather than an expiry date alone.
      - name: scope
        type: string
        help: "What the attorney may actually do — operate accounts, transact, redeem, change nominations. Scope is what makes a mandate safe: a general authority where a limited one would do is the finding a compliance review reports."
  - name: OrganizationUnit
    help: A branch, region or desk within the advisory firm. Units nest, so the tree is what revenue, supervision and access are rolled up along — an advisor belongs to a unit, and who may see whose clients follows from where they sit.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The unit as the firm refers to it internally — the branch or desk name that appears in reporting hierarchies.
      - name: unit_type
        type: string
        help: Branch, region, zone or head office. The type is what the reporting rollup understands, so a unit typed wrongly appears at the wrong level of every management report.
      - name: parent_unit_id
        type: string
        fk: true
        optional: true
        help: The unit this one reports into, empty at the top of the tree. It is the edge that makes the hierarchy, and a unit pointing at its own descendant would make the rollup loop.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the unit is currently operating. Closed units are kept so historic revenue and supervision records still resolve to somewhere.
  - name: Advisor
    help: "A licensed individual who advises clients on the firm's behalf. Advisors are the accountable name on every recommendation, and their licence state is a hard gate: advice given on a lapsed licence is a regulatory breach regardless of its quality."
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The advisor's own identity record. Holding it as a party means an advisor who is also a client of the firm is one human being in the system, not two.
      - name: organization_unit_id
        type: string
        fk: true
        help: The branch or desk the advisor sits in. It decides whose supervision they fall under and which slice of the revenue hierarchy their production rolls into.
      - name: employee_number
        type: string
        unique: true
        help: The firm's own staff reference for this advisor, and the key payroll and commission systems reconcile against.
      - name: advisor_type
        type: string
        help: Relationship manager, investment adviser, distributor or sub-broker. The type governs what they may advise on and how they are remunerated for it.
      - name: license_number
        type: string
        optional: true
        help: The regulatory registration the advisor operates under. It is quoted on advice documents and is what a client or regulator verifies them by.
      - name: license_expiry
        type: date
        optional: true
        help: When the registration lapses. Recommendations and approvals should be refused past this date — the usual failure is that nobody notices until an audit does.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the advisor is currently practising. Deactivating one stops new assignments while keeping their name on the advice they have already given.
  - name: AdvisorAssignment
    help: One advisor's responsibility for one household, over a period. Assignments are time-bounded rather than overwritten, because who was advising a family in a given quarter is the first question when a recommendation is later reviewed.
    parent: Advisor
    attributes:
      - name: id
        type: string
        pk: true
      - name: advisor_id
        type: string
        fk: true
        help: The advisor taking responsibility. Read from the advisor's own screen, where the assignments together are the advisor's book.
      - name: household_id
        type: string
        fk: true
        help: The family being taken on. A household can carry several concurrent assignments — a relationship manager and a specialist, for instance.
      - name: assignment_type
        type: string
        help: Primary, secondary, specialist or servicing. It distinguishes the advisor who owns the relationship from those supporting it, which is what a handover and a commission split both depend on.
      - name: start_date
        type: date
        help: When this advisor took the household on. Advice given before it belongs to whoever held the assignment then.
      - name: end_date
        type: date
        optional: true
        help: When the assignment ended. Empty while current; setting it is what a handover actually is, and leaving it empty on a departed advisor is why orphaned households go unnoticed.
      - name: is_primary
        type: boolean
        help: Whether this is the household's lead relationship. One primary at a time — it decides who the family hears from and who is answerable for their suitability.
  - name: Team
    help: "A group of advisors working a book together. Teams matter for coverage rather than hierarchy: an advisor's clients must still be serviced when they are away, and the team is who picks them up."
    attributes:
      - name: id
        type: string
        pk: true
      - name: organization_unit_id
        type: string
        fk: true
        help: The branch or desk the team belongs to. Teams do not span units, because supervision and revenue both follow the unit.
      - name: name
        type: string
        help: What the team is called internally. It appears in coverage lists and in the handover notes a client-facing screen shows.
      - name: team_type
        type: string
        help: Advisory, sales, service or specialist. The type says what the team is for, and therefore which work can reasonably be routed to it.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the team is currently constituted. Disbanded teams stay on file so historic coverage still resolves.
  - name: TeamMember
    help: One advisor's membership of one team, over a period. It is a line item of the team — a membership away from its team is not something anyone looks up — and it is dated so past coverage can be reconstructed.
    parent: Team
    attributes:
      - name: id
        type: string
        pk: true
      - name: team_id
        type: string
        fk: true
        help: The team this membership is in. Listed inside the team's own screen, alongside the other members.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor who is a member. The same advisor may sit on more than one team, which is normal where a specialist supports several desks.
      - name: start_date
        type: date
        help: When the advisor joined the team. It bounds the period their work counts towards the team's coverage and production.
      - name: end_date
        type: date
        optional: true
        help: When they left it. Empty for a current member; an unset end date on somebody who has moved on is why a team looks better staffed than it is.
      - name: role
        type: string
        help: What the advisor does on this team — lead, member, support or specialist. It is what routing reads when deciding who to hand a piece of work to.
  - name: Prospect
    help: Somebody the firm is trying to win, before they are a client. A prospect is a party with an estimated size and a next action against it, and the point of keeping them here rather than in a spreadsheet is that the conversation history survives the handover to onboarding.
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity being pursued. Recording a prospect as a party means that when they convert, the KYC already gathered is not re-keyed.
      - name: source
        type: string
        help: Where the lead came from — referral, campaign, walk-in, an existing client's family. It is the only honest input to which channels actually produce clients, as opposed to which produce leads.
      - name: status
        type: string
        enum: ProspectStatus
        help: "How far the pursuit has got: new, contacted, qualified, proposal issued, converted or lost. A prospect stuck in one status past its next action date is what a pipeline review looks for."
      - name: lead_score
        type: string
        optional: true
        help: A ranking of how likely and how valuable this prospect is, used to order an advisor's day. It is a judgement recorded so it can be argued with, not a computed certainty.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor pursuing this prospect. It is who the next action belongs to, and who inherits the relationship if it converts.
      - name: estimated_aum
        type: money
        optional: true
        help: What the firm believes this prospect would bring, in assets. It sizes the opportunity for pipeline reporting; it is an estimate before onboarding and should not be quoted as a commitment.
      - name: next_action_date
        type: date
        optional: true
        help: When somebody has undertaken to do the next thing. A prospect without one is a prospect nobody is working, which is the point of the field.
  - name: Interaction
    help: "A recorded conversation with a party — a call, a meeting, an email exchange. Interactions are the relationship's memory: they establish what was discussed and when, which is what a suitability review reconstructs the advice from."
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: Who the conversation was with. Held as a party rather than a client so conversations with prospects, nominees and family members are recorded on the same footing.
      - name: advisor_id
        type: string
        fk: true
        help: Who from the firm was speaking. Every piece of advice has a name against it, and this is where a conversation acquires one.
      - name: interaction_type
        type: string
        help: "Call, meeting, email, video or note. The type matters for the record: a documented meeting carries more evidential weight than a note somebody typed afterwards."
      - name: interaction_at
        type: datetime
        help: When the conversation happened, not when it was written up. A suitability review reads these in date order against the advice given, so a wrong timestamp misplaces the reasoning.
      - name: subject
        type: string
        help: One line saying what the conversation was about, as it would appear in a chronological list of the relationship.
      - name: notes
        type: string
        optional: true
        help: What was actually discussed, decided and promised. This is the substance a later reviewer relies on, so write it for somebody who was not in the room and is reading it two years on.
  - name: Activity
    help: A piece of work owed to a client with a date on it — a call-back, a document to chase, a review to prepare. Activities are how service commitments stop being remembered and start being tracked.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client the work is for. Read from the client's own screen so an advisor opening a relationship sees what is outstanding on it.
      - name: advisor_id
        type: string
        fk: true
        help: Who owes the work. An activity without an owner is a wish; this is what makes it an assignment.
      - name: activity_type
        type: string
        help: Call, meeting, document, review or follow-up. It says what kind of effort the item needs, which is what makes a day's list sortable into something workable.
      - name: subject
        type: string
        help: What has to be done, in one line. Specific enough that the person picking it up does not have to open it to know whether they can do it now.
      - name: due_date
        type: date
        help: When it is owed by. Everything overdue is what a morning list is, so a date set optimistically is worse than no activity at all.
      - name: priority
        type: string
        help: How much this displaces other work. Used to break ties on a day where everything is due, and to escalate what genuinely cannot wait.
      - name: status
        type: string
        enum: RecordStatus
        help: open, in progress, completed or cancelled. Only the moves the lifecycle allows are accepted, so an activity cannot be quietly completed without having been started.
      - name: completed_at
        type: datetime
        optional: true
        help: When the work was actually finished. Empty until then; comparing it with the due date is the whole of the service-level picture.
  - name: ServiceRequest
    help: "Something a client has asked the firm to do — a change of address, a statement, a redemption instruction, a complaint. Distinct from an activity, which the firm sets itself: a service request has a client waiting on the other end of it and usually a promised turnaround."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client who asked. It decides which service standard applies and who is told when the request is done.
      - name: request_type
        type: string
        help: What kind of request it is — information, transaction, change of detail, or complaint. Complaints in particular carry regulatory timelines that other requests do not.
      - name: subject
        type: string
        help: What the client asked for, in their terms. The operations team triages from this line before opening anything.
      - name: status
        type: string
        enum: ServiceRequestStatus
        help: submitted, in progress, completed or rejected. Only the drawn transitions are allowed, so a request cannot be completed without having been picked up.
      - name: priority
        type: string
        help: How quickly this has to be answered, from the request type and the client's service model. It is what orders the queue when more arrives than can be done.
      - name: submitted_at
        type: datetime
        help: When the client raised it. The clock every turnaround promise is measured from, so it is the time of receipt rather than of logging.
      - name: completed_at
        type: datetime
        optional: true
        help: When the client actually got their answer. Empty while open; the gap from submission is the number a service review is conducted on.
  - name: OnboardingCase
    help: The file that carries a prospect through to being an active client — KYC, declarations, suitability, mandates and the first account. It exists because onboarding is a process with a state, not an event, and because a case that stalls needs to be visible while it is stalling.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client record this case is creating or completing. Present from the start, in draft, so documents and declarations have something to attach to.
      - name: prospect_id
        type: string
        fk: true
        help: The prospect this case grew out of. It is the join that lets the firm measure how long conversion actually takes, and to carry the pursuit's history into the relationship.
      - name: status
        type: string
        enum: OnboardingStatus
        help: Where onboarding has reached — initiated, documents pending, under verification, approved or rejected. A case cannot be approved with an outstanding KYC or declaration, which is the whole reason for tracking it.
      - name: started_date
        type: date
        help: When onboarding began. With the completion date it gives the turnaround figure that says whether the process is working.
      - name: completed_date
        type: date
        optional: true
        help: When the client became active. Empty while the case is open; a case open past the firm's own standard is what an operations review escalates.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor driving the case. Onboarding stalls when nobody chases the client for the missing document, and this is who is expected to.
  - name: KYCRecord
    help: "The client's know-your-customer file: what identity was established, on what evidence, when, and when it expires. It is the gate on everything — no transaction may be accepted against a client whose KYC is incomplete or lapsed, whatever the commercial pressure."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client whose identity this file establishes. One current record per client, superseded rather than edited when re-verification happens.
      - name: kyc_status
        type: string
        help: pending, in progress, verified, rejected or expired. Only `verified` permits transacting; `expired` is the one that catches firms out, because nothing about the client changed on the day it flipped.
      - name: kyc_type
        type: string
        help: The standard applied — simplified, standard or enhanced due diligence. Enhanced applies to politically exposed persons and higher-risk profiles, and demands materially more evidence.
      - name: verification_date
        type: date
        optional: true
        help: When identity was last established. It is the date the expiry is computed from and the date an auditor asks to see the evidence for.
      - name: verification_source
        type: string
        optional: true
        help: Who or what verified it — an in-person check, a central KYC registry, or a third-party verification agency. The source determines how much weight the check carries.
      - name: kyc_identifier
        type: string
        optional: true
        help: The reference issued by the central KYC registry, where one applies. It lets another intermediary confirm the client is already verified without repeating the process.
      - name: expiry_date
        type: date
        optional: true
        help: When re-verification falls due. Periodic review is mandatory and risk-based — an enhanced-diligence client comes round far sooner than a simplified one.
  - name: KYCVerification
    help: One individual check performed as part of a client's KYC file — an identity document validated, an address confirmed, a sanctions list searched. Held as line items of the record because a KYC file is only as good as the checks under it, and each has its own source, date and outcome.
    parent: KYCRecord
    attributes:
      - name: id
        type: string
        pk: true
      - name: kyc_record_id
        type: string
        fk: true
        help: The KYC file this check belongs to. Read inside that file, where the checks together are the evidence for its status.
      - name: verification_type
        type: string
        help: What was checked — identity, address, PAN, bank account, sanctions or PEP screening. Each type has its own acceptable evidence and its own failure meaning.
      - name: status
        type: string
        enum: RecordStatus
        help: "pending, passed or failed. One failed check is enough to hold the whole file: a KYC record cannot be verified while any of its checks has not passed."
      - name: verified_at
        type: datetime
        optional: true
        help: When this particular check was carried out. Checks age at different rates, which is why the dates are held per check rather than only on the file.
      - name: verification_source
        type: string
        optional: true
        help: The agency, registry or document the check was performed against. It is what an auditor traces the result back to.
      - name: reference_number
        type: string
        optional: true
        help: The provider's own reference for this check, so the result can be re-pulled or disputed with them later.
  - name: FATCADeclaration
    help: The client's declaration of United States tax status, which the firm is required to collect and, where it applies, to report. Getting it wrong is not a service failure but a reporting breach, which is why it is a dated declaration by the client rather than a field somebody set.
    parent: Client
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client making the declaration. One current declaration per client, refreshed whenever their circumstances change.
      - name: tax_residency
        type: string
        help: The country the client declares they are tax resident in. It may differ from nationality and from where they live, and the declaration is what the firm reports on.
      - name: country
        type: string
        help: The jurisdiction this declaration line refers to. A client with obligations in more than one country needs a line for each.
      - name: tin
        type: string
        optional: true
        help: The taxpayer identification number in that jurisdiction. Mandatory where the client is reportable; a missing one is itself something the firm must report.
      - name: us_person
        type: boolean
        help: Whether the client is a US person for tax purposes. Set, this makes the account reportable under FATCA and constrains which products may be offered at all.
      - name: declaration_date
        type: date
        help: When the client made this declaration. Declarations have a shelf life and must be refreshed on a change of circumstances, so the date is what triggers the refresh.
  - name: CRSDeclaration
    help: The client's declaration of tax residency under the Common Reporting Standard — the multilateral counterpart to FATCA. Separate because the reportable population and the exchange partners differ, and a client can be reportable under one and not the other.
    parent: Client
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client making the declaration. Held per client and refreshed on any change of residency.
      - name: tax_residency
        type: string
        help: The jurisdiction of tax residency being declared. CRS exchanges information with the declared jurisdiction, so this is the field that decides who is told what.
      - name: country
        type: string
        help: The country this declaration line covers. Multiple residencies mean multiple lines, each reportable in its own right.
      - name: tin
        type: string
        optional: true
        help: The tax identification number in the declared jurisdiction. Its absence has to be explained, not merely left blank.
      - name: declaration_date
        type: date
        help: When the declaration was made. Reporting is annual and against the declaration in force, so the date decides which year it counts for.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the declaration is pending, valid or superseded. Only a valid declaration satisfies the requirement; a pending one blocks account opening.
  - name: SuitabilityAssessment
    help: The formal judgement that a course of advice fits this client — their objectives, horizon, knowledge, experience and capacity for loss. It is the document that answers the only question a regulator ever really asks about a recommendation, and it is dated because suitability is a judgement about a moment.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: "The client being assessed. Suitability is personal: a household-level plan still needs each transacting client to have been assessed."
      - name: assessment_type
        type: string
        help: Initial, periodic or event-driven. An event-driven assessment follows a material change — retirement, inheritance, a change in dependants — and is the one most often skipped.
      - name: assessment_date
        type: date
        help: When the assessment was made. Advice is defended against the assessment in force on the day it was given, so this date is load-bearing.
      - name: status
        type: string
        enum: RecordStatus
        help: draft, completed or expired. Advice given against an expired assessment is unsupported, however sound it happens to be.
      - name: result
        type: string
        help: The conclusion — suitable, suitable with conditions, or unsuitable. An unsuitable result is a legitimate outcome and must stop the recommendation rather than be worked around.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor who made the judgement. Suitability is signed, not computed, and this is the signature.
  - name: IdentityDocument
    help: One document evidencing a party's identity — a passport, national identity card, driving licence or tax card. Kept as records of the party because documents expire on their own schedules, and a KYC file is only current while the documents under it are.
    parent: Party
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity this document evidences. Read from the party's own screen, alongside their addresses and contact points.
      - name: document_type
        type: string
        help: "Passport, national identity card, driving licence, PAN or utility bill. Different types satisfy different checks: one that proves identity may not prove address."
      - name: document_number
        type: string
        optional: true
        help: The number printed on the document, which is what a registry or verification agency is queried against.
      - name: issue_date
        type: date
        optional: true
        help: When the document was issued. Some checks require a document issued within a recent window, particularly for address evidence.
      - name: expiry_date
        type: date
        optional: true
        help: When the document ceases to be valid. An expired document silently invalidates the KYC check that relied on it, which is why it is tracked per document.
      - name: verification_status
        type: string
        help: "pending, verified or rejected. Rejected is kept rather than deleted: an auditor wants to see what was refused as much as what was accepted."
  - name: ESignatureRequest
    help: A document sent to a client for electronic signature, and the record of what came back. It exists as its own entity because the signing provider is external and asynchronous — the firm needs somewhere to hold the request while it is outstanding and the provider's reference when it is not.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client being asked to sign. It is who the reminder goes to and whose acceptance the signature evidences.
      - name: document_id
        type: string
        fk: true
        help: The document put out for signature. The signed copy comes back against the same record, so the version signed is never in doubt.
      - name: status
        type: string
        enum: RecordStatus
        help: requested, sent, viewed, signed, declined or expired. Anything that is not `signed` after the firm's own follow-up window is a request somebody has to chase.
      - name: requested_at
        type: datetime
        help: When the request was raised. With the signature time it gives the turnaround, which is what says whether the signing journey is working.
      - name: signed_at
        type: datetime
        optional: true
        help: When the client actually signed. Empty until they do, and it is the timestamp the instrument takes effect from.
      - name: provider_reference
        type: string
        optional: true
        help: The signing provider's own reference for this envelope. It is what a support query or an evidential certificate is retrieved with.
  - name: BankAccount
    help: "A client's own bank account, registered with the firm so money can move. Registration is a controlled event: payouts go only to a verified account in the client's name, which is the main defence against redemption fraud."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client the account belongs to. Third-party payouts are not permitted, so an account whose name does not match the client cannot be used.
      - name: bank_name
        type: string
        help: The bank holding the account, as it should appear on payment instructions and in the client's own statements.
      - name: account_number
        type: string
        help: The account number money is credited to. Verified before first use — a redemption paid to a mistyped number is recovered slowly if at all.
      - name: account_type
        type: string
        help: "Savings, current or non-resident. The type constrains what may be credited to it: repatriable proceeds may not be paid into a resident account."
      - name: ifsc
        type: string
        optional: true
        help: The branch routing code for domestic transfers. Wrong, the payment is rejected by the clearing system rather than misdirected, which is the better of the two failures.
      - name: branch
        type: string
        optional: true
        help: The branch the account is held at, kept for reconciliation and for the cases where a manual instruction has to name it.
      - name: is_primary
        type: boolean
        help: Whether this is the default account for payouts. One per client — it is what a redemption picks when the instruction does not name an account.
      - name: verification_status
        type: string
        help: pending, verified or rejected. Only a verified account may receive money; verification is usually a penny credit or a cancelled-cheque check.
  - name: Document
    help: Any file the firm holds against a party — an agreement, a statement, a proof, a signed mandate. Documents are the evidence behind almost every regulated decision, which is why they are records with a status rather than files in a folder.
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The identity the document belongs to. Documents are read from the party's own screen, in the context of what they evidence.
      - name: document_type
        type: string
        help: Agreement, KYC proof, mandate, statement, correspondence or report. It decides retention, who may see it, and what process it satisfies.
      - name: file_name
        type: string
        help: The name of the stored file, as it will be presented when downloaded. Meaningful names matter here because a client asks for a document by what it is, not by its key.
      - name: document_url
        type: url
        optional: true
        help: Where the stored file can be retrieved from. Held rather than the bytes so the firm's document store remains the system of record.
      - name: status
        type: string
        enum: RecordStatus
        help: "draft, active, superseded or archived. A superseded document is kept: it is what was in force at the time, which is exactly what a dispute turns on."
      - name: uploaded_at
        type: datetime
        help: When the file was placed on record. It is the date retention is counted from and the date an auditor matches against the event it evidences.
  - name: AuditEvent
    help: One recorded change to something that matters — who did it, to what, when, from where, and what the value was before and after. It is written by the application rather than by people, and it is the record a regulator, a dispute or an internal investigation is reconstructed from.
    attributes:
      - name: id
        type: string
        pk: true
      - name: timestamp
        type: datetime
        help: When the change happened, from the server rather than the client. Ordering is the whole value of an audit trail, so this is never taken from a browser.
      - name: advisor_id
        type: string
        fk: true
        help: Who made the change. An event without an actor is of no use to an investigation, which is why unattributed changes are the finding rather than the norm.
      - name: action
        type: string
        help: "What was done — created, updated, deleted, viewed, exported or approved. Exports and views are included deliberately: reading a client's data is itself an event worth recording."
      - name: entity_type
        type: string
        help: Which kind of record was affected. With the reference below it identifies the subject without the audit trail needing a foreign key to every table in the system.
      - name: entity_ref
        type: string
        help: "The key of the affected record. Held as text for the same reason: the trail must outlive the record, including one that has since been deleted."
      - name: before_value
        type: string
        optional: true
        help: The state before the change, as far as it is worth keeping. It is what makes a trail reversible in argument, if not in fact.
      - name: after_value
        type: string
        optional: true
        help: The state after the change. With the before value it answers what actually altered, which a bare 'updated' never does.
      - name: source
        type: string
        help: Where the change came in from — the web application, an API client, a scheduled job or a data import. It distinguishes a person's decision from a batch's side effect.
      - name: ip_address
        type: string
        optional: true
        help: The network address the change originated from, kept for security investigation. It is the field that turns 'the account was changed' into 'the account was changed from an unfamiliar location'.
      - name: correlation_ref
        type: string
        optional: true
        help: A reference shared by every event from one request or job, so a single business action can be read as a whole rather than as scattered rows.
  - name: FinancialPlan
    help: "The household's written financial plan: the assumptions, the income and outgoings, the liabilities and the goals, brought together as one dated version. Plans are versioned rather than edited because advice is defended against the plan that was in force, and a plan quietly rewritten is a plan nobody can be held to."
    attributes:
      - name: id
        type: string
        pk: true
      - name: household_id
        type: string
        fk: true
        help: The family this plan is for. Planning is a household exercise — one retirement, one education bill, one balance sheet — which is why the plan hangs here and not on a client.
      - name: advisor_id
        type: string
        fk: true
        help: "The advisor who built the plan and is accountable for its assumptions. Signed rather than generated: a projection is only as good as the judgements behind it."
      - name: plan_number
        type: string
        help: The reference the plan is quoted by in review packs and correspondence, so a family and their advisor can be certain they are discussing the same document.
      - name: plan_version
        type: string
        help: Which revision this is. A new version is issued whenever assumptions or goals change materially, and the superseded one stays readable.
      - name: status
        type: string
        enum: PlanStatus
        help: draft, active, superseded or archived. Exactly one active plan per household at a time — two would mean two answers to what the family is aiming at.
      - name: effective_date
        type: date
        help: The date the plan's figures are stated as at. Every projection in it runs forward from here, so comparing two plans means comparing their effective dates first.
      - name: review_date
        type: date
        optional: true
        help: When the plan is next due to be revisited. A plan past its review date is stale advice, and the whole point of the field is that somebody notices before the client does.
      - name: base_currency
        type: string
        help: The currency the plan's figures are expressed in. Holdings in other currencies are translated to it, so a change here changes every number in the plan.
  - name: FinancialPlanAssumption
    help: One economic assumption the plan's arithmetic rests on — inflation, return by asset class, salary growth, life expectancy. Held as line items because the assumptions are what a reviewer argues with, and a projection whose assumptions are buried cannot be argued with at all.
    parent: FinancialPlan
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan this assumption belongs to. Read inside the plan, where the assumptions together are the basis of every figure in it.
      - name: assumption_type
        type: string
        help: What is being assumed — inflation, expected return, salary growth, life expectancy, tax rate. The type is what a projection looks the value up by.
      - name: value
        type: string
        help: The figure assumed. Stated as the plan states it, so a reader can check the projection by hand if they wish.
      - name: unit
        type: string
        optional: true
        help: How to read the value — a percentage a year, an absolute amount, or a count of years. Without it a bare number is ambiguous in exactly the way that produces wrong projections.
      - name: source
        type: string
        optional: true
        help: Where the assumption came from — a house view, a regulator's prescribed rate, or the client's own statement. It is what makes an assumption defensible rather than merely stated.
  - name: IncomeSource
    help: "Money coming into the household, by source and schedule. Income is what funds every goal, so the plan needs each stream separately: salary stops at retirement, rent does not, and a bonus is not the same promise as a salary."
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan this income belongs to. It is one of the inputs the projection is built from, and it is versioned with the plan.
      - name: party_id
        type: string
        fk: true
        help: Which member of the household earns it. Needed because income stops at different times for different people, and because tax is assessed per person.
      - name: income_type
        type: string
        help: Salary, business, rental, dividend, interest, pension or other. The type carries the assumptions about how long it lasts and how it is taxed.
      - name: amount
        type: money
        help: "The amount received each period, before tax unless the plan says otherwise. Consistency here matters more than precision: mixing gross and net across sources quietly breaks the plan."
      - name: frequency
        type: string
        help: How often it is received — monthly, quarterly, annually or one-off. It is what the projection annualises from.
      - name: start_date
        type: date
        help: When this income begins, which for a pension or a maturing annuity may be years away. The projection has nothing before this date.
      - name: end_date
        type: date
        optional: true
        help: When it stops — retirement, the end of a lease, the last instalment. Empty for income assumed to continue throughout the plan, which is an assumption worth being deliberate about.
      - name: inflation_linked
        type: boolean
        help: Whether the amount is assumed to rise with inflation. A salary usually is and a fixed annuity is not, and the difference compounds into a very different picture over thirty years.
  - name: Expense
    help: "Money going out of the household, by category and schedule. Expenses are the other half of the cash-flow picture and the part clients underestimate: a plan built on stated expenses that do not reconcile to income is the first thing a good adviser challenges."
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan this outgoing belongs to. Held with the plan's version so a revised plan can revise the spending picture without rewriting history.
      - name: expense_type
        type: string
        help: Household, education, medical, lifestyle, insurance premium or loan repayment. The type decides whether it is discretionary, which is what gets tested in a stress scenario.
      - name: amount
        type: money
        help: The amount spent each period. Understating it is the most common source of a plan that looks affordable and is not.
      - name: frequency
        type: string
        help: monthly, quarterly, annually or one-off. School fees are annual, groceries monthly, a wedding once — and treating them alike distorts the cash-flow curve.
      - name: start_date
        type: date
        help: When this spending begins. Future expenses — a child's university, a planned purchase — are planned for from their own start date rather than smeared across the whole term.
      - name: end_date
        type: date
        optional: true
        help: When it ceases. Empty for spending assumed to continue for life; setting it is what makes a school fee stop when the child graduates.
      - name: inflation_linked
        type: boolean
        help: Whether the amount is assumed to rise with prices. Most living costs are, and medical costs typically faster than the general index — an assumption worth stating rather than defaulting.
  - name: Liability
    help: "A debt the household owes. Liabilities matter twice in planning: they consume cash flow while they run, and they reduce net worth until they are repaid, which is what makes an otherwise wealthy balance sheet fragile."
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan this debt appears in. Part of the same versioned picture as the income and expenses it interacts with.
      - name: liability_type
        type: string
        help: Home loan, personal loan, education loan, credit card or margin borrowing. The type carries very different interest and very different urgency about repaying it.
      - name: outstanding_amount
        type: money
        help: What is still owed. Deducted from assets to give net worth, and the figure a repay-or-invest comparison is made against.
      - name: interest_rate
        type: money
        optional: true
        help: The rate being charged. It is the hurdle any investment has to clear before borrowing to invest makes sense, which is the calculation this field exists for.
      - name: maturity_date
        type: date
        optional: true
        help: When the debt is due to be cleared. It tells the projection when the repayment stops consuming cash flow.
      - name: monthly_payment
        type: money
        optional: true
        help: The regular servicing amount. It comes out of income before anything is available to invest, so a plan that ignores it overstates what the family can save.
      - name: status
        type: string
        enum: RecordStatus
        help: active, closed or in default. A default is not a bookkeeping state — it changes the advice entirely, and clearing it usually takes priority over every goal in the plan.
  - name: CashFlow
    help: A modelled movement of money in the plan, in or out, at a stated frequency. Where income and expenses describe the household's ordinary life, cash flows are what the projection actually runs on — including the ones that exist only in the plan, like a planned lump sum or a goal contribution.
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan being projected. Cash flows have no meaning outside the plan whose assumptions they are discounted under.
      - name: cashflow_type
        type: string
        help: inflow or outflow. The sign of the whole line, kept explicit rather than implied by a negative amount, which is easy to get wrong on entry.
      - name: category
        type: string
        help: What this flow represents — a contribution, a withdrawal, a goal funding, a windfall. It is how a projection chart is broken down into something a client recognises.
      - name: amount
        type: money
        help: The size of the movement each period, in the plan's base currency.
      - name: frequency
        type: string
        help: monthly, quarterly, annually or one-off. Together with the dates this is what the projection discretises the plan into.
      - name: start_date
        type: date
        help: When the flow begins. A goal contribution starting three years out is a materially different plan from one starting now.
      - name: end_date
        type: date
        optional: true
        help: When it stops. Empty for a flow assumed to run to the end of the plan.
      - name: inflation_linked
        type: boolean
        help: Whether the amount grows with inflation. A contribution the client intends to step up with their salary should be; a fixed instalment should not.
  - name: Goal
    help: "Something the family is actually trying to pay for — a retirement, a house, a child's education — with an amount and a date. Goals are the point of the whole plan: a portfolio without one is money with no purpose, and it is against goals rather than benchmarks that a family judges whether advice worked."
    attributes:
      - name: id
        type: string
        pk: true
      - name: household_id
        type: string
        fk: true
        help: The family whose goal this is. Goals belong to households because they are usually paid for jointly, whoever's name the account is in.
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan version this goal was set in. Keeping it tied to a version means a goal's target can be revised without silently rewriting the advice that was given against the old one.
      - name: goal_type
        type: string
        help: Retirement, education, property, wedding, emergency fund, wealth creation or legacy. The type sets the default horizon and how much shortfall risk is tolerable — an education bill has a date that cannot move.
      - name: name
        type: string
        help: "What the family calls it, in their words: not 'Goal 2' but 'Ananya's university'. It is what appears on the review pack, and naming it properly is what makes the plan theirs."
      - name: target_amount
        type: money
        help: What it will cost, in today's money unless the plan says otherwise. Inflating it to the target date is the projection's job, and the most commonly skipped step in do-it-yourself planning.
      - name: target_date
        type: date
        help: When the money is needed. It determines the investment horizon, and therefore how much risk the goal can bear — a three-year goal cannot be funded from equity however good the long-run case is.
      - name: priority
        type: string
        help: How this goal ranks when there is not enough to fund everything. Agreed with the family in advance, because the moment to decide which goal gives way is not the moment it becomes unaffordable.
      - name: status
        type: string
        enum: GoalStatus
        help: "planned, on track, at risk, achieved or abandoned. `at risk` is the one that earns the field: it is what a review is for, and what a projection sets."
      - name: funded_percentage
        type: money
        optional: true
        help: How much of the target the assets earmarked for it currently cover. The single number a family understands immediately, and the one a review opens with.
  - name: GoalFunding
    help: An earmarking of a specific holding, portfolio or cash flow against a specific goal. It is what turns 'we have investments' into 'this is what the education bill will be paid from', and it is a line item of the goal because a funding line away from its goal means nothing.
    parent: Goal
    attributes:
      - name: id
        type: string
        pk: true
      - name: goal_id
        type: string
        fk: true
        help: The goal being funded. Read from inside the goal, where the funding lines together are what its funded percentage is computed from.
      - name: security_id
        type: string
        fk: true
        help: The instrument earmarked, where the earmarking is that specific. Useful for a goal funded from a named fund rather than from a portfolio as a whole.
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio the money is coming from. The usual level of earmarking, because families rebalance within a portfolio without changing what it is for.
      - name: cash_flow_id
        type: string
        fk: true
        help: The planned contribution funding the goal, where it is funded from future saving rather than from existing assets.
      - name: allocated_amount
        type: money
        help: How much of that source is earmarked for this goal. The same portfolio can fund several goals, and the allocations should not add up to more than it holds.
  - name: GoalProjection
    help: What a goal is projected to be worth on a given date under a given scenario, and whether that leaves a shortfall. Projections are stored rather than recomputed on demand so a review can show what was expected last year against what happened.
    parent: Goal
    attributes:
      - name: id
        type: string
        pk: true
      - name: goal_id
        type: string
        fk: true
        help: The goal being projected. Read inside the goal alongside its funding, because a projection detached from what it projects is a number with no meaning.
      - name: scenario_id
        type: string
        fk: true
        help: The scenario this projection was run under. The same goal projects very differently under a base case and a market-downturn case, which is the entire reason scenarios exist.
      - name: projection_date
        type: date
        help: The date the projected value is stated at — normally the goal's target date, but interim dates are run to show the path.
      - name: projected_value
        type: money
        help: What the earmarked assets are expected to be worth by then, under this scenario's assumptions.
      - name: shortfall
        type: money
        optional: true
        help: How far the projection falls below the target. Empty when the goal is projected to be met; a shortfall is the number that drives every recommendation the review produces.
      - name: result
        type: string
        help: on track, at risk or shortfall. The one-word verdict a review pack leads with, derived from the shortfall against the family's own tolerance.
  - name: Scenario
    help: A named set of alternative assumptions the plan can be re-run under — a market downturn, early retirement, a job loss, higher inflation. Scenarios are how a plan stops being a single optimistic line and starts being a range the family can prepare for.
    attributes:
      - name: id
        type: string
        pk: true
      - name: financial_plan_id
        type: string
        fk: true
        help: The plan this scenario varies. A scenario is a modification of a plan's assumptions, so it has no meaning apart from one.
      - name: name
        type: string
        help: What the scenario is called in conversation — 'retire at 55', 'two years of poor markets'. It is the label on the chart the family looks at.
      - name: scenario_type
        type: string
        help: "base, optimistic, pessimistic, or a stress test of a specific event. The type says how the result should be read: a stress test is not a forecast."
      - name: status
        type: string
        enum: RecordStatus
        help: draft, active or archived. Archived scenarios are kept because what the family was shown last year is part of the advice record.
      - name: description
        type: string
        optional: true
        help: What this scenario supposes, in plain words. Without it a chart line labelled 'pessimistic' means whatever the reader assumes it means.
  - name: ScenarioAssumption
    help: One assumption this scenario overrides. Held as line items of the scenario so the difference from the base case is explicit — a scenario that silently changes six things is not one anybody can reason about.
    parent: Scenario
    attributes:
      - name: id
        type: string
        pk: true
      - name: scenario_id
        type: string
        fk: true
        help: The scenario this override belongs to. Read inside it, where the overrides together are the whole of what the scenario is.
      - name: assumption_type
        type: string
        help: Which of the plan's assumptions is being replaced — return, inflation, retirement age, longevity.
      - name: value
        type: string
        help: The value used instead of the plan's. Stated the same way the plan states it, so the two can be read side by side.
      - name: unit
        type: string
        optional: true
        help: How to read the value — per cent a year, an amount, or years. The same ambiguity the plan's own assumptions have, and the same reason for the field.
  - name: RiskAssessment
    help: The questionnaire and conversation that establishes how much risk a client is willing and able to take. It is the input to the risk profile, kept separately because the assessment is an event with a date and an author, while the profile is the state it produces.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client being assessed. Risk tolerance is personal even inside a household, and a spouse's differing tolerance is a real planning constraint.
      - name: household_id
        type: string
        fk: true
        help: The household the assessment was carried out in the context of. It is what makes a joint portfolio's risk profile reconcilable with two individual answers.
      - name: assessment_date
        type: date
        help: When the assessment was carried out. Risk tolerance is not stable across a market cycle, which is why the date matters as much as the answer.
      - name: assessment_type
        type: string
        help: initial, periodic or event-driven. An event-driven reassessment follows something that plausibly changed the client's capacity — a redundancy, an inheritance, a market shock.
      - name: status
        type: string
        enum: RecordStatus
        help: draft, completed or expired. An expired assessment cannot support new advice, and this is the field a recommendation checks before it is allowed to proceed.
      - name: result
        type: string
        help: The conclusion drawn — the risk category the answers support. Recorded as the assessment's own output so a later change to the scoring model does not rewrite history.
  - name: RiskProfile
    help: "The risk category currently in force for a client or household, and the thing every recommendation is checked against. A profile has an expiry because a stale profile is worse than none: it looks like evidence and is not."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client this profile belongs to, where it is held individually.
      - name: household_id
        type: string
        fk: true
        help: The household this profile applies to, where the family is advised as one. A household-level profile is what a jointly held portfolio is measured against.
      - name: risk_score
        type: string
        help: The numeric score the assessment produced. Kept alongside the category because a score near a boundary is a materially different conversation from one in the middle of a band.
      - name: risk_category
        type: string
        enum: RiskCategory
        help: conservative, moderate, balanced, growth or aggressive. This is what a recommendation's suitability check actually compares against, so the banding is the operative decision.
      - name: effective_date
        type: date
        help: When this profile took effect. Advice is judged against the profile in force on the day it was given.
      - name: expiry_date
        type: date
        optional: true
        help: When reassessment falls due. Past it, new recommendations should be refused until the client has been reassessed.
      - name: assessment_id
        type: string
        fk: true
        help: The assessment this profile was derived from. It is the evidence behind the category, and the first thing an audit asks to see.
      - name: status
        type: string
        enum: RiskStatus
        help: active, expired or superseded. Exactly one active profile per client or household — two would let a recommendation pick whichever suited it.
  - name: RiskProfileHistory
    help: A superseded risk profile, kept with the reason it changed. It is a line item of the profile because the history has no independent life, and it exists because 'the client's attitude to risk changed' is a claim that has to be evidenced with a date and a cause.
    parent: RiskProfile
    attributes:
      - name: id
        type: string
        pk: true
      - name: risk_profile_id
        type: string
        fk: true
        help: The profile this entry is a past state of. Read inside the profile, where the history is the record of how the current category was arrived at.
      - name: risk_score
        type: string
        help: The score as it stood in that period. Comparing successive scores is what shows drift, which is often more informative than any single reading.
      - name: risk_category
        type: string
        enum: RiskCategory
        help: The category in force during that period. It is what any advice given in that window has to be judged against.
      - name: effective_date
        type: date
        help: When this historic profile took effect.
      - name: expiry_date
        type: date
        optional: true
        help: When it was superseded. Together with the effective date it bounds the window this category governed.
      - name: reason
        type: string
        optional: true
        help: Why the profile changed — a reassessment, a life event, a client's own request. Without it the history is a list of numbers that nobody can interpret.
  - name: Security
    help: Any investable instrument the firm can hold a position in — a share, a bond, a mutual fund unit, an alternative. It is the common record every price, holding, order and transaction points at, with the asset-specific detail held in the satellite tables beside it, so a portfolio can be valued without knowing what kind of thing each line is.
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_type_id
        type: string
        fk: true
        help: What kind of instrument this is. It decides which satellite table carries the rest of the detail and how the position is valued and taxed.
      - name: symbol
        type: string
        optional: true
        help: The trading symbol or scheme code the instrument is quoted under. Optional because unlisted instruments — an alternative fund, a property — have none.
      - name: name
        type: string
        help: The instrument as it appears on a statement and in a recommendation. Use the form the client will see on their own contract note, not an internal abbreviation.
      - name: isin
        type: string
        optional: true
        help: The international securities identification number, which is the only globally unambiguous handle on an instrument. Reconciliation with registrars and custodians is done on this, not on the name.
      - name: currency
        type: string
        help: The currency the instrument is denominated and priced in. A portfolio holding instruments in several currencies is translated to its base currency for valuation, so this is what that translation reads.
      - name: status
        type: string
        enum: RecordStatus
        help: active, suspended, matured or delisted. A suspended instrument cannot be dealt but must still be valued, which is why this is a status rather than a deletion.
  - name: SecurityType
    help: The classification of instruments the firm deals in — equity, bond, mutual fund, alternative, insurance, property. Held as a table rather than an enum because each type carries its own valuation, taxation and eligibility behaviour, and new types are added as the firm's product range grows.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: What this class of instrument is called, as it appears in product lists and asset breakdowns.
      - name: category
        type: string
        help: The broader grouping the type sits in — market-traded, fund, alternative or physical. It is what a high-level asset breakdown rolls up to.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the firm currently deals in this type. Closing a type stops new purchases without affecting the positions already held in it.
  - name: MutualFundScheme
    help: "The scheme-specific detail behind a mutual fund security: which house runs it, which plan and option the client holds, and what it is benchmarked against. Funds need their own record because plan and option decide the client's actual return — a regular plan and a direct plan of the same scheme differ by the distributor's commission."
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this scheme detail belongs to. One row per fund security, so a portfolio line can be valued without knowing it is a fund.
      - name: amc_id
        type: string
        fk: true
        help: The asset management company that runs the scheme. Concentration of a client's holdings in one house is a risk a review should surface, and this is what makes it visible.
      - name: scheme_code
        type: string
        unique: true
        help: The registrar's own code for the scheme, used when placing orders and reconciling folios. It is the identifier the fund house's systems answer to.
      - name: isin
        type: string
        optional: true
        help: The scheme's ISIN, which differs by plan and option — the same fund has several. Getting it wrong buys the right fund on the wrong terms.
      - name: scheme_name
        type: string
        help: The full scheme name as the fund house publishes it, including plan and option, because that is what appears on the client's account statement.
      - name: category
        type: string
        help: The scheme's classification — equity, debt, hybrid, liquid, index. It is what the asset allocation is computed from, so a misclassified scheme distorts the whole picture.
      - name: plan_type
        type: string
        help: regular or direct. A direct plan carries no distributor commission and therefore a higher return to the client; which is held is a disclosure matter, not a detail.
      - name: option_type
        type: string
        help: growth or dividend, and where dividend, its frequency. It decides whether returns compound inside the scheme or are paid out, which changes both the projection and the tax.
      - name: benchmark
        type: string
        optional: true
        help: The index the scheme measures itself against. Performance reporting compares the holding to this, so quoting the wrong benchmark flatters or penalises the fund unfairly.
      - name: risk_level
        type: string
        help: The scheme's own risk classification, as published by the fund house. It is checked against the client's risk profile before the scheme can be recommended.
  - name: AMC
    help: "An asset management company whose schemes the firm distributes or advises on. Held as an entity because exposure is tracked per house: a client whose entire portfolio sits with one manager carries a concentration risk no fund fact sheet will show."
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The fund house as clients and fact sheets refer to it.
      - name: registration_number
        type: string
        optional: true
        help: The regulatory registration the house operates under, quoted in disclosures and verified during product onboarding.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the firm currently deals with this house. Suspending one stops new business while existing holdings continue to be valued and serviced.
  - name: ProductPrice
    help: One instrument's price on one date. Prices are stored as a series rather than a current value because every valuation, gain and performance figure is computed as at a date — and a portfolio valued at today's prices cannot answer what it was worth at the last review.
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument this price is for. Read as a series per instrument rather than as a list across all of them.
      - name: price_date
        type: date
        help: The date the price applies to. Valuations pick the latest price on or before their own date, so a missing day silently values a portfolio on stale prices.
      - name: price
        type: money
        help: The price per unit, in the instrument's own currency. For a fund this is the net asset value; for a listed security, the close.
      - name: price_type
        type: string
        help: net asset value, closing price, or a manual mark. A manual mark for an unlisted asset is a judgement and should be visible as one.
      - name: source
        type: string
        optional: true
        help: Where the price came from — an exchange feed, the registrar, the fund house, or an internal valuation. It is what a disputed valuation is traced back to.
  - name: AssetClass
    help: A category of investment for allocation purposes — equity, debt, gold, real estate, cash — nested so that broad classes break into the sub-classes an allocation model actually targets. Allocation is the single decision that drives most of a portfolio's return, and this is the vocabulary it is expressed in.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The class as it appears in an allocation model and on a client's asset breakdown.
      - name: parent_asset_class_id
        type: string
        fk: true
        optional: true
        help: The broader class this one sits within — large-cap inside equity, for example. Empty at the top level; the tree is what lets an allocation be shown at whatever depth the audience needs.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the class is currently used in allocation. Retiring one keeps historic models and attributions readable.
  - name: InvestmentAccount
    help: "An account at an institution through which investments are actually held — a demat account, a fund-house account, a custody account. It is the operational layer beneath a portfolio: a portfolio is how the firm thinks about the money, an account is where it legally sits."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client in whose name the account is held. Ownership is a legal fact, and it constrains who may instruct on the account and where proceeds may be paid.
      - name: institution_id
        type: string
        fk: true
        help: The bank, broker or fund house holding the account. Reconciliation runs per institution, so this is what a statement is matched against.
      - name: account_number
        type: string
        help: The account's number at that institution, as it appears on their statements. It is the reconciliation key and is quoted on every instruction.
      - name: account_type
        type: string
        help: demat, trading, folio, custody or PMS account. The type decides what can be held in it and what an instruction has to look like.
      - name: ownership_type
        type: string
        help: single, joint, either-or-survivor or corporate. It decides who has to sign an instruction, which is the most common reason a redemption is held up.
      - name: opened_date
        type: date
        help: When the account was opened. It bounds what can have been held in it, and it is the start of the account's own statement history.
      - name: status
        type: string
        enum: RecordStatus
        help: active, dormant, frozen or closed. A frozen account can be valued but not dealt, usually pending a compliance or succession matter.
  - name: Folio
    help: "A client's registered folio with one fund house for one scheme. Folios exist because fund houses account per folio rather than per client: units, statements and redemption instructions are all folio-level, and a client with two folios in the same scheme has two balances."
    attributes:
      - name: id
        type: string
        pk: true
      - name: investment_account_id
        type: string
        fk: true
        help: The account the folio is held under. It is how the folio's holdings roll up into the client's portfolio.
      - name: mutual_fund_scheme_id
        type: string
        fk: true
        help: The scheme the folio is in. A folio belongs to exactly one scheme, which is why a client accumulates several.
      - name: folio_number
        type: string
        help: The number the fund house issued. Every order, statement and redemption for these units quotes it, and consolidating folios is a common piece of housekeeping.
      - name: status
        type: string
        enum: RecordStatus
        help: active, dormant or closed. A closed folio with a nil balance is kept because past transactions and capital gains still reference it.
  - name: Portfolio
    help: "A managed pool of investments for a household, with its own objective, risk profile and base currency. The portfolio is the unit advice is given at: allocation models, rebalancing, performance and recommendations all operate here, above the accounts the assets physically sit in."
    attributes:
      - name: id
        type: string
        pk: true
      - name: household_id
        type: string
        fk: true
        help: The family the portfolio is managed for. A household may run several — a retirement pool and a shorter-horizon one — with different objectives.
      - name: portfolio_name
        type: string
        help: What the family calls this pool, ideally naming its purpose rather than its number. It appears on every valuation and review pack.
      - name: portfolio_type
        type: string
        help: "core, satellite, tactical or goal-specific. The type sets the expectation: a satellite portfolio is meant to be more concentrated, and judging it against a core benchmark is unfair."
      - name: base_currency
        type: string
        help: The currency the portfolio is valued and reported in. Holdings in other currencies are translated to it, so changing it changes every figure on the statement.
      - name: investment_objective
        type: string
        optional: true
        help: What this money is for, in the family's own words — income, growth, capital preservation, a named goal. It is the sentence a recommendation has to be consistent with.
      - name: risk_profile_id
        type: string
        fk: true
        help: The risk profile this portfolio is managed to. Rebalancing and recommendation checks read it, so a portfolio whose profile has expired cannot be advised on.
      - name: status
        type: string
        enum: RecordStatus
        help: active, closed or transferred. Closing one keeps its history, which is what a since-inception performance figure for the family depends on.
  - name: PortfolioAccount
    help: The link between a portfolio and one of the accounts its assets are held in, over a period. It is a line item of the portfolio, and it is dated because assets are moved between accounts without the advice changing — a transfer of custody should not restate the portfolio's history.
    parent: Portfolio
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio being composed. Read inside it, where the accounts together are where the portfolio's assets physically sit.
      - name: investment_account_id
        type: string
        fk: true
        help: The account contributing holdings to this portfolio. One account can serve more than one portfolio where the family has agreed a split.
      - name: start_date
        type: date
        help: When this account's holdings began counting towards the portfolio. Valuations before it do not include them.
      - name: end_date
        type: date
        optional: true
        help: When the account left the portfolio — a transfer out, or a closure. Empty while it is part of it.
  - name: Holding
    help: "A current position: how much of one instrument a portfolio owns, what it cost and what it is worth. This is the row a valuation, an allocation breakdown and a rebalancing calculation all read, and it is maintained by the transactions rather than entered."
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio holding the position. Holdings are read inside the portfolio, which is where a valuation is assembled.
      - name: security_id
        type: string
        fk: true
        help: The instrument held. With the portfolio it identifies the position, and it is what the price series is joined on to value it.
      - name: quantity
        type: string
        help: Units currently held. Maintained from the transactions, so a quantity that disagrees with the custodian's statement is a reconciliation break rather than a typo.
      - name: average_cost
        type: money
        help: The weighted average price paid per unit across the lots making up this position. It is what an unrealised gain is computed against when lots are not being tracked individually.
      - name: market_value
        type: money
        help: What the position is worth at the latest available price. The figure the client's statement leads with, and the one every allocation percentage is computed from.
      - name: cost_value
        type: money
        help: Total amount invested in this position. The difference from market value is the unrealised gain, which is the number clients react to.
      - name: unrealized_gain
        type: money
        optional: true
        help: Market value less cost value — profit on paper. It becomes a taxable gain only on sale, which is the distinction a client statement has to make plainly.
      - name: weight
        type: money
        optional: true
        help: This position as a percentage of the portfolio's market value. It is what an allocation model's targets are compared against, and what a concentration limit is tested on.
  - name: HoldingLot
    help: One purchase within a position, kept separately because tax is computed per lot. Which units are sold decides the gain and whether it is short or long term, so a position bought over five years is five lots and not one average — and this is a line item of the holding for exactly that reason.
    parent: Holding
    attributes:
      - name: id
        type: string
        pk: true
      - name: holding_id
        type: string
        fk: true
        help: The position this purchase is part of. Read inside the holding, where the lots together are what its average cost is derived from.
      - name: acquisition_date
        type: date
        help: When these units were bought. It is what decides whether a sale from this lot is a short-term or long-term gain, which can double the tax.
      - name: quantity
        type: string
        help: Units acquired in this purchase, and the amount still available to sell from it.
      - name: cost_basis
        type: money
        help: What was paid for these units, including the charges that are allowed to be added. It is the figure subtracted from the sale proceeds to give the gain.
      - name: tax_status
        type: string
        optional: true
        help: Whether this lot has crossed the long-term holding period. Selling a short-term lot when a long-term one was available is a common and entirely avoidable tax cost.
  - name: PortfolioValuation
    help: What a portfolio was worth on a given date, stored rather than recomputed. Valuations are a series because performance, drawdown and every comparison with a previous review depend on being able to read the portfolio as it stood, at prices as they stood.
    parent: Portfolio
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio valued. Read as the portfolio's own history rather than as a list across the firm.
      - name: valuation_date
        type: date
        help: The date the portfolio is valued as at. Prices are taken as of this date, so a valuation is reproducible rather than dependent on when it was run.
      - name: market_value
        type: money
        help: The portfolio's worth at that date's prices — the headline figure on the statement.
      - name: cost_value
        type: money
        help: Total invested capital as at that date. The gap to market value is the portfolio's gain, and holding both means the gain does not have to be recomputed from transactions.
      - name: cash_value
        type: money
        optional: true
        help: Uninvested cash sitting in the portfolio. Worth separating, because cash drag is a real and frequently unnoticed cause of underperformance.
      - name: net_value
        type: money
        help: Market value plus cash, less anything owed on the portfolio. This is the number a client's net worth uses, and the one a fee is usually struck against.
  - name: AssetAllocationModel
    help: "A target mix of asset classes for a given risk category — the house view expressed as percentages. Models exist so that advice is consistent between advisors and clients: a balanced portfolio should mean the same thing in two different branches."
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: What the model is called — usually naming its risk stance, because that is what an advisor selects it by.
      - name: risk_category
        type: string
        enum: RiskCategory
        help: The risk profile this model is intended for. It is what matches a model to a client, so a model applied outside its category is an exception that needs justifying.
      - name: status
        type: string
        enum: RecordStatus
        help: draft, active or retired. Only an active model should be assigned; retired ones are kept because portfolios were managed to them.
      - name: description
        type: string
        optional: true
        help: The reasoning behind the mix, in words. It is what an advisor explains to a client and what an investment committee revisits when the house view changes.
  - name: AllocationTarget
    help: "One asset class's target weight in a model, with the band it is allowed to drift inside. It is a line item of the model, and the bands are what turn a target into something operable: a portfolio is not rebalanced because it is off target, but because it is outside the band."
    parent: AssetAllocationModel
    attributes:
      - name: id
        type: string
        pk: true
      - name: asset_allocation_model_id
        type: string
        fk: true
        help: The model this target belongs to. Read inside it, where the targets together should sum to one hundred per cent.
      - name: asset_class_id
        type: string
        fk: true
        help: The asset class being targeted. At whatever depth the model works — broad classes for a simple model, sub-classes for a detailed one.
      - name: target_percentage
        type: money
        help: The intended weight for this class. The point the portfolio is rebalanced back towards.
      - name: min_percentage
        type: money
        optional: true
        help: The lowest weight tolerated before rebalancing is triggered. Too tight a band means constant trading and constant tax.
      - name: max_percentage
        type: money
        optional: true
        help: The highest weight tolerated. It is what caps a concentration built up by one asset class performing well, which is how portfolios drift into more risk than the client agreed to.
  - name: InvestmentTransaction
    help: "A movement that actually happened in a portfolio — a purchase, a sale, a dividend, a switch, a fee. Transactions are the ledger every holding, gain and performance figure is derived from, which is why they are never edited: a wrong transaction is corrected by a reversing one."
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio affected. It is how the transaction reaches the holdings and the valuations that depend on it.
      - name: holding_id
        type: string
        fk: true
        help: The position the movement applies to. A purchase creates the holding if there is none; everything afterwards adjusts it.
      - name: order_id
        type: string
        fk: true
        help: The order this transaction settles, where it came from one. Corporate actions and fees have no order, which is why it is not always present.
      - name: transaction_type
        type: string
        help: buy, sell, dividend, switch-in, switch-out, bonus, fee or transfer. The type decides which way quantity and cost move, and whether a gain is realised.
      - name: transaction_date
        type: date
        help: The date the movement takes effect for accounting and tax — the trade date, not the date it was keyed. It determines the holding period a sale is taxed on.
      - name: quantity
        type: string
        optional: true
        help: Units moved. Absent on a cash-only movement such as a dividend or a fee.
      - name: amount
        type: money
        help: The money that moved. Always present, because a movement with no amount has no effect worth recording.
      - name: price
        type: money
        optional: true
        help: The price per unit at which it was done. Absent on movements that are not priced per unit, and it is what the average cost of a position is recomputed from.
      - name: status
        type: string
        enum: TransactionStatus
        help: pending, settled, failed or reversed. Only settled transactions count towards holdings — including a pending sale in the valuation is how a portfolio comes to show units it has already disposed of.
  - name: Order
    help: "An instruction to buy or sell, from the moment it is placed to the moment it is executed. Orders are held separately from transactions because the two are not the same event: an order can be partially filled, rejected or left unexecuted for days, and the client's question is usually about the order rather than the trade."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client the order is placed for. It is whose mandate authorises it and whose account the money moves through.
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio the order is for. It is what the resulting holding lands in, and what the order was sized against.
      - name: security_id
        type: string
        fk: true
        help: The instrument being dealt. With the amount or quantity it is the whole of what the order instructs.
      - name: order_type
        type: string
        help: buy, sell, switch, systematic instalment or redemption. It decides which market or registrar route the order takes and what confirmation the client should expect.
      - name: status
        type: string
        enum: OrderStatus
        help: placed, submitted, partially executed, executed, rejected or cancelled. Only the drawn transitions are allowed, so an order cannot be executed without having been submitted.
      - name: quantity
        type: string
        optional: true
        help: Units to deal, where the client is instructing in units. Mutual fund purchases are usually by amount instead, which is why both exist and only one is set.
      - name: amount
        type: money
        optional: true
        help: Money to deal, where the client is instructing by value. The units follow from the price on the day, which is why a fund purchase cannot promise a unit count.
      - name: ordered_at
        type: datetime
        help: When the instruction was received. Cut-off times decide which day's price applies, so an order received a minute late gets a different price — and this is the timestamp that proves which.
      - name: executed_at
        type: datetime
        optional: true
        help: When it was actually filled. Empty while outstanding; the gap from placement is what an execution-quality review looks at.
  - name: SIPInstruction
    help: A standing instruction to invest a fixed amount at a fixed interval — the systematic investment plan. It is the single most effective habit in retail investing, and it is modelled as an instruction with its own schedule and mandate because it runs for years without anybody touching it.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client whose money is being invested. Their bank mandate is what each instalment is collected under.
      - name: security_id
        type: string
        fk: true
        help: The instrument bought each time. Changing it means stopping this instruction and starting another, so the history stays attributable.
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio the accumulated units belong to. It is what the instalments build up inside.
      - name: amount
        type: money
        help: "The amount invested each instalment. Its constancy is the point: the same sum buys more units when prices are low, which is the whole mechanism."
      - name: frequency
        type: string
        help: monthly, quarterly or weekly. Monthly is the norm because it matches how salaries arrive.
      - name: start_date
        type: date
        help: When instalments begin. The first collection needs the mandate registered, which is usually what delays it.
      - name: end_date
        type: date
        optional: true
        help: When instalments stop. Empty for a perpetual instruction, which is generally the better default — an end date reached without anybody noticing silently stops the client investing.
      - name: next_execution_date
        type: date
        optional: true
        help: When the next instalment is due. It is what the collection run reads, and what a client asks about when money has not left their account.
      - name: mandate_reference
        type: string
        help: The bank mandate the instalments are collected under. Without a live mandate the instruction cannot execute, however valid it looks.
      - name: status
        type: string
        enum: RecordStatus
        help: active, paused, stopped or completed. A paused instruction keeps its mandate and schedule and resumes; a stopped one does not, and restarting means a new mandate.
  - name: InvestmentRecommendation
    help: "A piece of advice put to a household: what to do, why, and what it is checked against. This is the regulated artefact of the whole system — it names the advisor, the risk profile it was tested against, and the rationale, because a recommendation without those three is not defensible."
    attributes:
      - name: id
        type: string
        pk: true
      - name: household_id
        type: string
        fk: true
        help: The family being advised. Recommendations are made at household level because that is where the plan and the goals live.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor making the recommendation. Advice is signed, and this is the signature the firm stands behind.
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio the advice applies to. A recommendation for a satellite portfolio is judged differently from one for the core.
      - name: recommendation_date
        type: date
        help: When the advice was given. It fixes which risk profile, suitability assessment and market conditions the advice has to be judged against.
      - name: recommendation_type
        type: string
        help: new investment, rebalance, switch, redemption or a change to a systematic instruction. It says what kind of action the client is being asked to take.
      - name: rationale
        type: string
        help: Why this is being recommended, in words the client can weigh. It is the field regulators read first and the one advisors are most tempted to leave thin — a rationale that does not connect the advice to the client's own goals is not a rationale.
      - name: status
        type: string
        enum: RecommendationStatus
        help: draft, pending approval, approved, presented, accepted, rejected or expired. Only the drawn transitions are allowed, so a recommendation cannot be presented to a client before it has been approved.
      - name: risk_profile_id
        type: string
        fk: true
        help: The risk profile this advice was tested against. Captured on the recommendation rather than looked up later, because the profile may since have changed.
      - name: suitability_status
        type: string
        help: Whether the suitability check passed, passed with conditions or failed. A failed check must stop the recommendation; overriding it is an exception that has to be recorded as one.
  - name: RecommendationItem
    help: "One line of a recommendation: an instrument, an amount, and the reason it is there. Held as line items because a recommendation is a basket — sell this, buy that, leave the rest — and the basket has to be read against the portfolio as a whole."
    parent: InvestmentRecommendation
    attributes:
      - name: id
        type: string
        pk: true
      - name: investment_recommendation_id
        type: string
        fk: true
        help: The recommendation this line belongs to. Read inside it, where the lines together are what the client is being asked to do.
      - name: security_id
        type: string
        fk: true
        help: The instrument being recommended. It is what the resulting order will be placed in if the client accepts.
      - name: asset_class_id
        type: string
        fk: true
        help: The asset class this line moves the portfolio's allocation towards. It is how the basket's effect on allocation is computed before anything is bought.
      - name: recommended_amount
        type: money
        help: How much to put into, or take out of, this instrument. The lines together should leave the portfolio inside its allocation bands.
      - name: target_percentage
        type: money
        optional: true
        help: The weight this instrument should end up at in the portfolio. Stated as well as the amount, because the weight is what the client is really agreeing to.
      - name: reason
        type: string
        optional: true
        help: Why this instrument rather than another. It is the line-level counterpart of the recommendation's rationale, and it is what makes a basket reviewable line by line.
  - name: SuitabilityResult
    help: The recorded outcome of checking one recommendation against one suitability assessment. It is kept as its own record, and as a line item of the recommendation, because the check has three separate answers — risk, eligibility, overall — and a recommendation that passed two of them has not passed.
    parent: InvestmentRecommendation
    attributes:
      - name: id
        type: string
        pk: true
      - name: investment_recommendation_id
        type: string
        fk: true
        help: The recommendation that was checked. Read inside it, alongside the lines the check was run over.
      - name: suitability_assessment_id
        type: string
        fk: true
        help: "The assessment it was checked against. Naming it makes the check reproducible: the same recommendation against a later assessment can legitimately give a different answer."
      - name: result
        type: string
        help: The overall verdict — suitable, suitable with conditions, or unsuitable. This is what gates the recommendation's approval.
      - name: risk_result
        type: string
        help: "Whether the recommendation sits inside the client's risk profile. The most common failure: a sound investment that is simply more volatile than the client agreed to hold."
      - name: eligibility_result
        type: string
        help: Whether the client is permitted to hold these instruments at all — some products are restricted by client category, residency or minimum investment. A failure here cannot be advised around.
      - name: reason
        type: string
        optional: true
        help: Why the check reached this answer. Essential on a failure, because the advisor's next step depends on which of the three tests failed and by how much.
      - name: evaluated_at
        type: datetime
        help: When the check was run. Recommendations move slowly through approval, and a check run before a profile changed has to be identifiable as such.
  - name: RecommendationApproval
    help: The supervisory sign-off on a recommendation before it reaches a client. Approval exists because advice is a firm's liability rather than an individual's, and the approver is the second pair of eyes the firm is required to put on it.
    parent: InvestmentRecommendation
    attributes:
      - name: id
        type: string
        pk: true
      - name: investment_recommendation_id
        type: string
        fk: true
        help: The recommendation being approved. Read inside it, where the approvals together are the record of who let it through.
      - name: advisor_id
        type: string
        fk: true
        help: Who approved it. Deliberately a different person from the recommending advisor — a self-approved recommendation defeats the control.
      - name: status
        type: string
        enum: RecordStatus
        help: "pending, approved or rejected. A rejection is a legitimate outcome and is kept: what was refused, and why, is as much a part of the record as what was allowed."
      - name: approved_at
        type: datetime
        optional: true
        help: When approval was given. Empty while pending; a recommendation presented to a client before this timestamp is a control breach.
      - name: comments
        type: string
        optional: true
        help: What the approver had to say — conditions attached, concerns noted, or reasons for refusal. It is the most useful text in the whole approval chain and the most often left blank.
  - name: Proposal
    help: The client-facing document that carries an approved recommendation — what is being proposed, what it costs, and what the client is being asked to agree to. Separate from the recommendation because the internal artefact and the document the client signs have different lifespans and different audiences.
    attributes:
      - name: id
        type: string
        pk: true
      - name: investment_recommendation_id
        type: string
        fk: true
        help: The approved advice this document presents. One proposal per recommendation, so what the client saw is never in doubt.
      - name: client_id
        type: string
        fk: true
        help: The client the proposal is put to. Within a household it is the client who will actually transact and whose acceptance is needed.
      - name: proposal_number
        type: string
        help: The reference the proposal is quoted by in conversation and correspondence, so client and advisor can be sure they are discussing the same version.
      - name: status
        type: string
        enum: ProposalStatus
        help: "draft, issued, accepted, rejected or expired. An expired proposal must be reissued rather than acted on: the prices and the suitability behind it have moved."
      - name: proposal_date
        type: date
        help: When it was issued to the client. The clock the validity period runs from.
      - name: expiry_date
        type: date
        optional: true
        help: When the proposal lapses. It exists because a recommendation priced against last month's market is not advice any more, and acting on a lapsed one is the failure the date prevents.
  - name: ClientAcceptance
    help: The client's recorded decision on a proposal. It is the moment advice becomes an instruction, so it is a record with a timestamp and the client's own words rather than a flag on the proposal.
    parent: Proposal
    attributes:
      - name: id
        type: string
        pk: true
      - name: proposal_id
        type: string
        fk: true
        help: The proposal being decided on. Read inside it, because an acceptance away from what was accepted means nothing.
      - name: client_id
        type: string
        fk: true
        help: Who accepted. In a joint arrangement, whose consent this is — which matters when the account needs both.
      - name: decision
        type: string
        help: "accepted, partially accepted, rejected or deferred. A partial acceptance is common and consequential: acting on the whole basket when the client took half of it is unauthorised dealing."
      - name: decision_at
        type: datetime
        help: When the client decided. Orders placed before this timestamp were placed without authority, which is why it is recorded to the minute.
      - name: comments
        type: string
        optional: true
        help: What the client said — which parts they were unhappy with, what they want to revisit. It is the beginning of the next conversation, and it belongs on the record rather than in an advisor's memory.
  - name: RebalanceRecommendation
    help: "A detected drift of a portfolio outside its allocation bands, and the advice to correct it. It is generated rather than composed: the bands are breached or they are not, which is what makes rebalancing a discipline rather than a judgement."
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio that has drifted. Rebalancing is always portfolio-level, because a single holding cannot be off-allocation on its own.
      - name: asset_allocation_model_id
        type: string
        fk: true
        help: The model the portfolio is being measured against. Changing the model is a different decision from rebalancing to it, and conflating the two is how portfolios end up chasing performance.
      - name: status
        type: string
        enum: RebalanceStatus
        help: detected, reviewed, recommended, executed or dismissed. Dismissed is legitimate — the tax cost of correcting a small drift often exceeds the benefit — but it should be a recorded decision.
      - name: deviation_amount
        type: money
        optional: true
        help: How far the portfolio is from its targets, in money. Money rather than percentage points, because that is what makes the trading and tax cost comparable with the benefit.
      - name: detected_date
        type: date
        help: When the breach was found. Drift left unaddressed for months is the finding, and this date is what makes it visible.
      - name: reason
        type: string
        optional: true
        help: What caused the drift and why acting or not acting is right — a run in one asset class, a large contribution, an imminent goal. It is what turns a computed breach into advice.
  - name: PerformanceSnapshot
    help: "A portfolio's performance as at a date: what it is worth, what it returned, and how that compares with its benchmark. Snapshots are stored because performance is the thing clients remember being told, and it must be reproducible months later rather than recomputed from whatever prices are current."
    attributes:
      - name: id
        type: string
        pk: true
      - name: portfolio_id
        type: string
        fk: true
        help: The portfolio measured. Read as the portfolio's own series, which is what a performance chart is.
      - name: snapshot_date
        type: date
        help: The date performance is measured to. Every return below is computed to this date, so comparing snapshots means comparing like periods.
      - name: market_value
        type: money
        help: The portfolio's value at the snapshot date, so the returns can be read against the size they were earned on.
      - name: absolute_return
        type: money
        optional: true
        help: Money made or lost over the period, before any annualisation. It is the figure clients understand instantly and the one that should be quoted first.
      - name: xirr
        type: money
        optional: true
        help: The money-weighted annualised return, which accounts for when contributions were made. It is what the client actually earned, and it is the honest number for a portfolio fed by systematic instalments.
      - name: time_weighted_return
        type: money
        optional: true
        help: The annualised return with the effect of cash flows removed. It measures the manager rather than the client's timing, which is why both are reported and neither alone is enough.
      - name: benchmark_return
        type: money
        optional: true
        help: "What the benchmark did over the same period. A return without it is a number with no scale: eight per cent is excellent in one year and poor in another."
  - name: ClientReview
    help: "The periodic review meeting and its conclusions — where the portfolio, the goals and the risk profile stand, and what is being recommended as a result. Reviews are the firm's central service obligation, which is why the record carries a next-review date: a relationship without one has quietly stopped being advised."
    attributes:
      - name: id
        type: string
        pk: true
      - name: status
        type: string
        enum: ReviewStatus
        help: "scheduled, in progress, completed or missed. `missed` is deliberately recordable: a review that did not happen is a service failure worth seeing rather than deleting."
      - name: client_id
        type: string
        fk: true
        help: The client reviewed. The review is held at client level because suitability is personal, even where the plan is the household's.
      - name: review_date
        type: date
        help: When the review took place. Reviews are due at an agreed interval, and this is what the next due date is computed from.
      - name: advisor_id
        type: string
        fk: true
        help: The advisor who conducted it. The review is a piece of advice and carries a name like any other.
      - name: portfolio_status
        type: string
        help: How the portfolio stood at the review — on allocation, drifted, or requiring action. The summary line a client remembers from the meeting.
      - name: goal_status
        type: string
        help: "Where the goals stood: on track, at risk, or in shortfall. This is the part of the review the family actually cares about, ahead of any return figure."
      - name: risk_status
        type: string
        help: Whether the risk profile is still current and still appropriate. A review that does not revisit it is how a retiring client ends up in a growth portfolio.
      - name: recommendations
        type: string
        optional: true
        help: What was agreed to do next, in the words used with the client. It is the bridge from the review to the recommendations that follow it.
      - name: next_review_date
        type: date
        optional: true
        help: "When the next review is due. Empty only on a closed relationship: an active client without a next review date is the gap this field exists to expose."
  - name: FeeSchedule
    help: A way the firm charges for its work — a percentage of assets, a flat retainer, a transaction fee. Schedules are held as records because the charge has to be disclosed, applied consistently and reconciled, and because a client's fee arrangement outlives whoever agreed it.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: What this arrangement is called internally and in the client's agreement, so the fee on an invoice can be traced to the terms that produced it.
      - name: fee_type
        type: string
        help: Percentage of assets, flat retainer, transaction-based or performance-based. Performance fees carry additional disclosure requirements that the others do not.
      - name: rate
        type: money
        help: The rate or amount charged. For a percentage schedule, the annual rate applied to the value the fee is struck on.
      - name: frequency
        type: string
        help: How often the fee is charged — monthly, quarterly or annually. An annual rate billed quarterly is a quarter of it, which is worth being explicit about.
      - name: status
        type: string
        enum: RecordStatus
        help: active, superseded or retired. A superseded schedule is kept because past invoices were raised under it and have to remain explicable.
  - name: Commission
    help: Money the firm earns from a product provider on a client's investment — trail, upfront or brokerage. It is tracked per client and instrument because it is a conflict of interest that has to be disclosed, and because what the provider says they paid and what arrived are frequently different.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client whose investment generated the commission. Disclosure is per client, and so is the conflict.
      - name: security_id
        type: string
        fk: true
        help: The instrument that paid it. Commission varies sharply by product, which is exactly why recommendations have to be defensible on suitability rather than on revenue.
      - name: amount
        type: money
        help: The commission earned. Recorded gross, with reconciliation against what was actually received held separately.
      - name: commission_type
        type: string
        help: upfront, trail or brokerage. Trail accrues for as long as the client holds the product, which is what makes it the bulk of a distributor's revenue.
      - name: earned_date
        type: date
        help: The period the commission relates to, as opposed to when it was paid. Revenue is recognised on this date, so a payment arriving late does not move the month it belongs to.
      - name: status
        type: string
        enum: RecordStatus
        help: "accrued, received, reconciled or written off. Written off is real: small differences are not always worth chasing, but they should be a decision rather than a silence."
  - name: CommissionReconciliation
    help: The comparison between what the firm expected on a commission and what the provider actually paid. It is a line item of the commission and it exists because provider statements routinely disagree with the firm's own accrual, and the difference has to be chased while it is still traceable.
    parent: Commission
    attributes:
      - name: id
        type: string
        pk: true
      - name: commission_id
        type: string
        fk: true
        help: The commission being reconciled. Read inside it, where the reconciliation is the account of whether the money arrived.
      - name: expected_amount
        type: money
        help: What the firm calculated it was owed, from the product's own rate card.
      - name: received_amount
        type: money
        optional: true
        help: What the provider actually paid. Empty until their statement arrives; the difference from the expected amount is the whole subject of the record.
      - name: status
        type: string
        enum: CommissionStatus
        help: pending, matched, short paid, over paid or written off. A short payment left in `pending` for a quarter is revenue quietly lost.
      - name: reconciliation_date
        type: date
        help: When the comparison was performed. Providers have their own dispute windows, and a reconciliation done after one closes cannot be acted on.
  - name: Equity
    help: "The listed-share detail behind an equity security: where it trades, under what ticker, and in which sector. Sector in particular is not cosmetic — it is what a concentration check reads, and a portfolio of ten stocks in one sector is one bet rather than ten."
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this share detail belongs to. One row per equity security.
      - name: exchange
        type: string
        optional: true
        help: The exchange the share is listed on. It decides the price source, the settlement cycle and, for a dual-listed company, which line the client actually holds.
      - name: ticker
        type: string
        optional: true
        help: The symbol the share trades under on that exchange. The same company can have different tickers on different exchanges, which is why it is held with the exchange rather than alone.
      - name: sector
        type: string
        optional: true
        help: The economic sector the company operates in. Aggregating a portfolio by it is how a sector concentration becomes visible, which no single holding's own fact sheet will show.
  - name: Bond
    help: "The fixed-income detail behind a bond security: who is borrowing, at what coupon, until when, and how creditworthy they are judged to be. All four change what the instrument is: two bonds at the same price can be entirely different risks."
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this bond detail belongs to. One row per bond security.
      - name: issuer
        type: string
        help: Who is borrowing the money. The issuer is the credit risk, and issuer concentration across a portfolio's bonds is the exposure that matters most in fixed income.
      - name: coupon_rate
        type: money
        optional: true
        help: The annual interest the bond pays on its face value. With the price it gives the yield, which is what the holding actually earns rather than what the certificate says.
      - name: maturity_date
        type: date
        optional: true
        help: When the principal is repaid. It sets the duration, and therefore how much the price moves when rates move — a long bond is a far more volatile holding than its coupon suggests.
      - name: credit_rating
        type: string
        optional: true
        help: The agency rating of the issuer's creditworthiness. It gates eligibility for conservative mandates and is the first thing to check when a bond's price moves without rates moving.
  - name: AIF
    help: The detail behind an alternative investment fund holding — the fund's name, its category, and the minimum ticket. Alternatives are restricted products with long lock-ins, so the minimum and the category are eligibility facts rather than descriptive ones.
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this fund detail belongs to. One row per alternative fund security.
      - name: fund_name
        type: string
        help: The fund as its offering document names it, which is the form that appears on the client's statement and in every regulatory disclosure.
      - name: category
        type: string
        help: The regulatory category of the fund, which determines who may invest and what the fund is permitted to do. It is a compliance fact before it is a classification.
      - name: minimum_investment
        type: money
        optional: true
        help: The smallest permitted commitment. It is high by design, and it is the first check before an alternative can even be recommended to a client.
  - name: PMS
    help: "The detail behind a portfolio management service holding: who runs it and under which strategy. A discretionary mandate placed with an external manager is a single line in the client's portfolio but a whole portfolio underneath, which is why the strategy is named."
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this mandate belongs to. One row per portfolio management service security.
      - name: provider_name
        type: string
        help: The manager running the mandate. Manager concentration across a client's portfolio is the risk this makes visible.
      - name: strategy_name
        type: string
        help: The specific strategy the money is managed under. The same provider runs several with very different risk, so naming it is what makes the holding meaningful.
      - name: minimum_investment
        type: money
        optional: true
        help: The regulatory or contractual minimum for the mandate. It restricts which clients can hold it at all, and it is checked before recommending rather than after.
  - name: Insurance
    help: "The detail behind an insurance policy held as part of a client's financial picture: the insurer, the kind of cover, the premium and the sum assured. Protection is part of planning rather than a separate subject — an unprotected earner is the largest single risk in most household plans."
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this policy belongs to. Held as a security so cover appears on the same balance sheet as the investments.
      - name: insurer
        type: string
        help: The company carrying the risk. Their claims record and solvency are the substance of whether the cover is worth anything.
      - name: policy_type
        type: string
        help: term, endowment, unit-linked, health or general. The type decides whether this is protection, investment, or an expensive mixture of the two.
      - name: premium
        type: money
        optional: true
        help: What the client pays for the cover, per period. It is an expense in the plan's cash flow, and comparing it with the sum assured is how a poor-value policy is spotted.
      - name: sum_assured
        type: money
        optional: true
        help: What the policy pays on a claim. Set against the household's liabilities and its dependants' needs, this is the number that says whether the family is actually protected.
  - name: RealEstate
    help: A property held as part of the household's wealth. Property is usually the largest asset a family owns and the least liquid, so recording it — even though the firm does not manage it — is what makes the allocation picture honest.
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument record this property belongs to, so it appears in the asset allocation alongside financial holdings.
      - name: property_type
        type: string
        help: residential, commercial, land or plot. The type determines how it is valued, how quickly it could be sold, and how it is taxed on sale.
      - name: location
        type: string
        help: Where the property is. Property valuation is almost entirely local, so the location is the valuation's main input.
      - name: acquisition_value
        type: money
        optional: true
        help: What was paid for it, including the costs allowed to be added to the base. It is the cost basis a capital gain on sale is computed from, decades later.
      - name: current_value
        type: money
        optional: true
        help: The latest estimate of what it would fetch. An estimate rather than a price — it is worth showing as at a date, because an unrevisited property valuation distorts every allocation percentage in the portfolio.
  - name: STPInstruction
    help: A standing instruction to move money gradually from one instrument to another — the systematic transfer plan. It is how a lump sum is fed into equity over months instead of at one price, which is the practical answer to a client who has cash and is afraid of the market's timing.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client whose money is being moved. Both instruments must be held in their name for the transfer to be permitted.
      - name: source_security_id
        type: string
        fk: true
        help: What the money comes out of, usually a liquid or short-duration fund where it earns something while it waits.
      - name: target_security_id
        type: string
        fk: true
        help: What it goes into. The instalments accumulate here at whatever price applies each time, which is the entire point of the arrangement.
      - name: amount
        type: money
        help: The amount transferred each instalment. Constant, so the transfer buys more units when the target is cheaper.
      - name: frequency
        type: string
        help: weekly, monthly or quarterly. Shorter intervals smooth the entry price more but cost more in transaction charges.
      - name: status
        type: string
        enum: RecordStatus
        help: active, paused, completed or stopped. It completes when the source is exhausted, which is the normal ending and worth distinguishing from being stopped early.
  - name: SWPInstruction
    help: "A standing instruction to withdraw a fixed amount at a fixed interval — the systematic withdrawal plan. It is how a retired client draws an income from a portfolio, and it is the mirror image of a systematic investment: regular, automatic, and in need of watching lest it outrun the portfolio."
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client receiving the money. The proceeds go to their verified bank account and nowhere else.
      - name: security_id
        type: string
        fk: true
        help: The holding being drawn down. Each withdrawal is a redemption, so it realises a gain and consumes units — which is why the sustainability of the rate matters.
      - name: amount
        type: money
        help: "The amount withdrawn each time. Set against the portfolio's expected return: a rate above it depletes capital, slowly at first and then quickly."
      - name: frequency
        type: string
        help: monthly, quarterly or annually. Monthly is usual because it replaces a salary.
      - name: start_date
        type: date
        help: When withdrawals begin. Often set to a retirement date, in which case it should be reviewed shortly before it takes effect rather than left to start unexamined.
      - name: status
        type: string
        enum: RecordStatus
        help: active, paused, completed or stopped. Pausing during a market fall is the classic protective move, because withdrawing from a depressed portfolio sells the most units.
  - name: CorporateAction
    help: Something an issuer does that changes what a holder holds — a dividend, a bonus, a split, a merger, a buyback. Corporate actions have to be recorded because they alter quantities and cost bases without anybody having traded, and a portfolio that misses one is simply wrong.
    attributes:
      - name: id
        type: string
        pk: true
      - name: security_id
        type: string
        fk: true
        help: The instrument the action applies to. Every holder of it is affected, which is why the action is recorded once against the instrument rather than per portfolio.
      - name: action_type
        type: string
        help: dividend, bonus, split, rights issue, merger, buyback or delisting. The type decides what happens to the quantity, the cost basis, or both.
      - name: record_date
        type: date
        help: The date on which holders are identified. Only positions held on this date participate, which is the whole mechanism of entitlement.
      - name: effective_date
        type: date
        help: When the action actually changes holdings. It can be well after the record date, and the gap is where reconciliation breaks tend to appear.
      - name: status
        type: string
        enum: RecordStatus
        help: "announced, processed or cancelled. An announced action not yet processed is the state that needs watching: the entitlement exists and the holdings do not reflect it yet."
      - name: details
        type: string
        optional: true
        help: The terms — the ratio, the amount per unit, the price. Without them the action cannot be applied, and 'bonus issue' on its own tells an operations team nothing.
  - name: TaxLot
    help: "A holding lot as the tax computation sees it: units, acquisition date and cost basis, held for the tax year they belong to. It is kept apart from the holding lot because tax rules differ from accounting ones and are revised, and rewriting the accounting record every time a rule changes would be worse than keeping two."
    attributes:
      - name: id
        type: string
        pk: true
      - name: holding_lot_id
        type: string
        fk: true
        help: The purchase this tax lot corresponds to. The link back is what makes a capital-gains statement traceable to the actual trade.
      - name: acquisition_date
        type: date
        help: When the units were acquired for tax purposes. It decides the holding period and therefore the rate, which is the single most consequential fact in the whole computation.
      - name: quantity
        type: string
        help: Units in the lot still available to be matched against a sale.
      - name: cost_basis
        type: money
        help: The cost allowed to be deducted from the proceeds, including any indexation or grandfathering the rules provide for. It differs from the accounting cost, which is exactly why this record exists.
      - name: tax_year
        type: string
        optional: true
        help: The year the lot is reported in when sold. It is what a client's annual statement is assembled by.
  - name: CapitalGain
    help: A realised gain or loss from a sale, matched against the lot it came from. Computed at the moment of sale and stored, because the rules in force on the sale date are the rules that apply — and recomputing an old gain under today's rules would silently restate the client's tax position.
    attributes:
      - name: id
        type: string
        pk: true
      - name: tax_lot_id
        type: string
        fk: true
        help: The lot the units were sold from. Which lot was matched decides the gain and its term, so the link is what makes the figure auditable.
      - name: sale_date
        type: date
        help: When the sale took place. It sets the tax year and, against the acquisition date, whether the gain is short or long term.
      - name: sale_proceeds
        type: money
        help: What was received, net of the charges allowed to be deducted. It is the gross side of the computation.
      - name: cost_basis
        type: money
        help: The cost attributed to the units sold, taken from the tax lot rather than from the position's average. Averaging here would misstate the gain on any position built up over time.
      - name: gain_amount
        type: money
        help: Proceeds less cost — the taxable figure, positive or negative. Losses are as valuable as gains here, because they can be set off.
      - name: gain_type
        type: string
        help: short term or long term, from the holding period. The rates differ enough that the type is usually worth more to the client than the timing of the sale itself.
      - name: tax_year
        type: string
        help: The year this gain is reportable in. It is what the annual capital-gains statement is grouped by, and what a set-off against a loss has to match.
  - name: Benchmark
    help: An index a portfolio's performance is compared against. Benchmarks are held as records because the comparison is only meaningful if the benchmark is appropriate and stated in advance — choosing one after the fact is how performance reporting stops being honest.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The index as it is published and as it will appear on a client's performance report.
      - name: symbol
        type: string
        optional: true
        help: The code the index's values are retrieved under, where it has one.
      - name: benchmark_type
        type: string
        help: equity, debt, hybrid or a composite blend. A portfolio holding several asset classes needs a blended benchmark; comparing it to an equity index alone flatters it in a falling market and penalises it in a rising one.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the benchmark is still in use. Retired ones are kept because past performance reports were made against them.
  - name: PerformanceAttribution
    help: "How much of a portfolio's return came from each asset class, split into the part from choosing the weights and the part from choosing the instruments. Attribution is what turns a return into a diagnosis: it says whether the allocation or the selection did the work."
    parent: PerformanceSnapshot
    attributes:
      - name: id
        type: string
        pk: true
      - name: performance_snapshot_id
        type: string
        fk: true
        help: The performance measurement this attribution decomposes. Read inside the snapshot, because an attribution away from the return it explains is meaningless.
      - name: asset_class_id
        type: string
        fk: true
        help: The asset class whose contribution this line describes. The lines together should account for the snapshot's total return.
      - name: contribution
        type: money
        help: How much of the portfolio's return this class produced, weight and return combined. It is what a client's eye goes to first.
      - name: allocation_effect
        type: money
        optional: true
        help: The part of the contribution that came from holding more or less of this class than the benchmark. This is the advisor's allocation decision, measured.
      - name: selection_effect
        type: money
        optional: true
        help: The part that came from the specific instruments chosen within the class, rather than from the class itself. It is the honest measure of whether fund selection added anything.
  - name: RevenueHierarchy
    help: The tree revenue is rolled up along — advisor to team to branch to region. Held separately from the organisation chart because revenue is reported along lines that do not always match supervision, and a reorganisation should not restate last year's numbers.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The node as it appears in revenue reporting.
      - name: parent_id
        type: string
        fk: true
        optional: true
        help: The node this one rolls into, empty at the top. It is the edge that makes the rollup, and a node pointing into its own subtree would make the total infinite.
      - name: level_type
        type: string
        help: advisor, team, branch, region or firm. It says which level of the report a node belongs at, so a mistyped node appears in the wrong total.
      - name: status
        type: string
        enum: RecordStatus
        help: Whether the node is current. Closed nodes are kept so historic revenue still rolls up somewhere.
  - name: SubBroker
    help: An intermediary who introduces and services clients under the firm's registration. Sub-brokers are held as their own records because they are remunerated differently from employed advisors and because the firm is answerable for their conduct.
    attributes:
      - name: id
        type: string
        pk: true
      - name: party_id
        type: string
        fk: true
        help: The sub-broker's own identity record, so their KYC and contact details sit with everyone else's.
      - name: code
        type: string
        unique: true
        help: The registration code the sub-broker operates under, quoted on business they introduce and used to attribute commission.
      - name: name
        type: string
        help: The sub-broker as clients and statements refer to them, which may be a firm rather than an individual.
      - name: status
        type: string
        enum: RecordStatus
        help: active, suspended or terminated. Suspension stops new business immediately while their existing clients continue to be serviced by the firm.
  - name: AdvancedComplianceRecord
    help: A compliance review of a client beyond ordinary KYC — sanctions screening, politically-exposed-person status, source-of-wealth verification, transaction-monitoring alerts. These are held apart because they are risk-based, recur on their own schedule, and their outcomes constrain what the client may do.
    attributes:
      - name: id
        type: string
        pk: true
      - name: client_id
        type: string
        fk: true
        help: The client reviewed. Enhanced review is triggered by risk rather than applied to everyone, which is why not every client has one.
      - name: compliance_type
        type: string
        help: sanctions screening, PEP check, source-of-wealth verification, or a transaction-monitoring review. Each has its own evidence and its own consequence on failure.
      - name: status
        type: string
        enum: RecordStatus
        help: pending, cleared, escalated or blocked. `blocked` stops activity on the relationship outright and is not an advisor's decision to override.
      - name: review_date
        type: date
        help: When the review was carried out or is next due. Enhanced-risk clients come round far more often, and this is what the schedule reads.
      - name: result
        type: string
        optional: true
        help: What the review found and what was decided. On an escalation this text is the handover to the compliance officer, so it needs to say what was seen rather than only what was concluded.
  - name: ExternalIntegration
    help: "A connection to an outside system the firm depends on — a registrar, a custodian, a price feed, a KYC agency, a payment gateway. Held as records because a silent integration failure looks exactly like a data problem: prices stop moving, holdings stop reconciling, and nobody suspects the pipe."
    attributes:
      - name: id
        type: string
        pk: true
      - name: integration_type
        type: string
        help: price feed, registrar, custodian, KYC provider, payment gateway or e-signature provider. It says what stops working when this connection does.
      - name: provider_name
        type: string
        help: Who supplies the service. It is who is called when the connection fails and whose contract governs the service level.
      - name: endpoint_url
        type: url
        optional: true
        help: Where the firm connects to. Held so a configuration change is a recorded event rather than an environment variable nobody remembers setting.
      - name: status
        type: string
        enum: RecordStatus
        help: "active, degraded, failed or disabled. `degraded` is the state worth having: a feed that is answering slowly is not yet broken but is already affecting valuations."
      - name: last_sync_at
        type: datetime
        optional: true
        help: When the connection last exchanged data successfully. It is the single most useful field here — a last sync from three days ago explains a great many apparent data problems.
