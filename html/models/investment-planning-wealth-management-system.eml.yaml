eml: "1.0"
name: Investment Planning & Wealth Management System
version: 1.0.0
description: "A wealth-management platform for an advisory firm, from the first conversation with a prospect through to the commission the firm is paid. It holds parties and the households they belong to, the advisors and teams who serve them, and the compliance file — KYC, FATCA and CRS declarations, suitability assessments, powers of attorney and signed documents — that has to be complete before any money moves. On top of that sits the planning side: goals, income, expenses, liabilities, cash flows and the scenarios run against them; a security master covering funds, equities, bonds, AIF, PMS, insurance and real estate; and the portfolios, accounts, folios, holdings and tax lots that record what a client actually owns. Recommendations are assessed for suitability and concentration, approved by someone other than their author, turned into proposals a client accepts, and executed as orders on a dealing desk. Drift against the model allocation raises a rebalance; performance is snapshotted and attributed against a benchmark; fees and commissions are reconciled against what the manufacturer paid. Every write is audited."
enums:
  - name: PartyStatus
    values: [active, inactive, deceased, merged]
  - name: ClientStatus
    values: [prospect, onboarding, pending_kyc, active, suspended, inactive, closed]
  - name: ProspectStatus
    values: [new, contacted, qualified, meeting, proposal, converted, lost]
  - name: ServiceRequestStatus
    values: [submitted, assigned, processing, awaiting_client, completed, rejected]
  - name: OnboardingStatus
    values: [started, kyc, suitability, approval, active, rejected, cancelled]
  - name: KYCStatus
    values: [pending, in_review, verified, rejected, expired]
  - name: PlanStatus
    values: [draft, analysis, proposed, approved, active, superseded, archived]
  - name: GoalStatus
    values: [identified, planned, funded, achieved, cancelled]
  - name: RiskStatus
    values: [draft, assessed, approved, expired, superseded]
  - name: ProposalStatus
    values: [draft, presented, accepted, rejected, expired]
  - name: RecommendationStatus
    values: [draft, suitability_check, pending_approval, approved, presented, accepted, executed, rejected, expired]
  - name: OrderStatus
    values: [draft, pending_approval, approved, submitted, partially_executed, executed, rejected, cancelled, failed]
  - name: TransactionStatus
    values: [pending, settled, reversed, failed, cancelled]
  - name: ReviewStatus
    values: [due, scheduled, conducted, follow_up, closed]
  - name: RebalanceStatus
    values: [detected, analysed, proposed, approved, executing, completed, failed]
  - name: CommissionStatus
    values: [expected, received, matched, exception, resolved]
  - name: RecordStatus
    values: [active, inactive, draft, pending, approved, rejected, completed, cancelled, failed, expired, superseded]
  - name: RiskCategory
    values: [conservative, moderately_conservative, moderate, moderately_aggressive, aggressive]
