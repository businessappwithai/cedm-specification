reports:
  - name: advisor-clients-stuck-onboarding
    title: Clients who never finished onboarding
    entity: Client
    help: The first question of the week. A client in onboarding or pending KYC past a month is revenue that has been sold and not started, and every one of them is waiting on a document somebody forgot to chase.
    sql: SELECT c.client_number, y.display_name AS client, c.status, c.onboarding_date, EXTRACT(day FROM now() - c.onboarding_date)::int AS days_since FROM bus_client c LEFT JOIN bus_party y ON y.id = c.party_id WHERE c.deleted_at IS NULL AND c.status IN ('onboarding', 'pending_kyc') AND c.onboarding_date < now()::date - 30 ORDER BY days_since DESC
  - name: advisor-clients-without-portfolio
    title: Active clients with no portfolio
    entity: Client
    help: An active client with nothing invested is either a sale that stopped halfway or a data error, and both look identical from the client screen. Only the absence of a portfolio shows it.
    sql: SELECT c.client_number, y.display_name AS client, c.client_type, c.service_model, c.onboarding_date FROM bus_client c LEFT JOIN bus_party y ON y.id = c.party_id LEFT JOIN bus_portfolio p ON p.household_id = c.household_id AND p.deleted_at IS NULL AND p.status = 'active' WHERE c.deleted_at IS NULL AND c.status = 'active' GROUP BY c.id, c.client_number, y.display_name, c.client_type, c.service_model, c.onboarding_date HAVING COUNT(p.id) = 0 ORDER BY c.onboarding_date
  - name: advisor-book-by-service-model
    title: The book, by service model
    entity: Client
    chart: bar
    x: service_model
    y: clients
    help: What an advisor is actually carrying, which is the conversation about capacity. A book that is mostly the highest-touch model is one that cannot take another client, whatever the headcount says.
    sql: SELECT COALESCE(NULLIF(c.service_model, ''), '(not set)') AS service_model, COUNT(*) AS clients, COUNT(*) FILTER (WHERE c.status = 'active') AS active FROM bus_client c WHERE c.deleted_at IS NULL AND c.status NOT IN ('closed', 'inactive') GROUP BY 1 ORDER BY clients DESC
  - name: advisor-dormant-clients
    title: Active clients nobody has spoken to
    entity: Client
    help: The account that rots silently. An active client with no interaction recorded in six months has usually already been approached by somebody else, and the first anyone here hears of it is the transfer request.
    sql: SELECT c.client_number, y.display_name AS client, c.status, MAX(i.interaction_at) AS last_contact FROM bus_client c LEFT JOIN bus_party y ON y.id = c.party_id LEFT JOIN bus_interaction i ON i.party_id = c.party_id AND i.deleted_at IS NULL WHERE c.deleted_at IS NULL AND c.status = 'active' GROUP BY c.id, c.client_number, y.display_name, c.status HAVING MAX(i.interaction_at) IS NULL OR MAX(i.interaction_at) < now() - interval '180 days' ORDER BY last_contact NULLS FIRST
  - name: client-proposals-awaiting-answer
    title: Proposals presented and not answered
    entity: Proposal
    help: What the client has been asked to decide and has not. Shown with the expiry date, because a proposal that lapses has to be rebuilt at current prices rather than simply re-sent.
    sql: SELECT p.proposal_number, y.display_name AS client, p.status, p.proposal_date, p.expiry_date, (p.expiry_date - now()::date) AS days_to_expiry FROM bus_proposal p JOIN bus_client c ON c.id = p.client_id LEFT JOIN bus_party y ON y.id = c.party_id WHERE p.deleted_at IS NULL AND p.status = 'presented' AND p.expiry_date >= now()::date ORDER BY p.expiry_date
  - name: client-proposals-expired
    title: Proposals that lapsed unanswered
    entity: Proposal
    help: Every one is work already done and thrown away. Read weekly it is a list of calls to make; read never, it is the reason the pipeline number is wrong.
    sql: SELECT p.proposal_number, y.display_name AS client, p.proposal_date, p.expiry_date FROM bus_proposal p JOIN bus_client c ON c.id = p.client_id LEFT JOIN bus_party y ON y.id = c.party_id WHERE p.deleted_at IS NULL AND (p.status = 'expired' OR (p.status = 'presented' AND p.expiry_date < now()::date)) ORDER BY p.expiry_date DESC
  - name: client-portfolios-by-objective
    title: Portfolios by stated objective
    entity: Portfolio
    chart: pie
    x: objective
    y: portfolios
    help: What the client asked the money to do, in their own words rather than the risk model's. Where this and the risk profile disagree, the suitability file is the thing that has to explain it.
    sql: SELECT COALESCE(NULLIF(p.investment_objective, ''), '(not stated)') AS objective, COUNT(*) AS portfolios FROM bus_portfolio p WHERE p.deleted_at IS NULL AND p.status = 'active' GROUP BY 1 ORDER BY portfolios DESC
  - name: dealer-portfolios-without-risk-profile
    title: Portfolios with no risk profile attached
    entity: Portfolio
    help: A portfolio nobody can check a trade against. The dealing desk cannot assess suitability without it, so the trade either waits or goes through unchecked — and the second is the one that becomes a complaint.
    sql: SELECT p.portfolio_name, p.portfolio_type, p.base_currency, p.investment_objective, p.status FROM bus_portfolio p WHERE p.deleted_at IS NULL AND p.status = 'active' AND p.risk_profile_id IS NULL ORDER BY p.portfolio_name
  - name: dealer-portfolios-by-currency
    title: Live portfolios by base currency
    entity: Portfolio
    chart: bar
    x: currency
    y: portfolios
    help: What the desk has to be able to settle in. A currency with a handful of portfolios still needs the same custody arrangement as the main one, and that cost is invisible until somebody counts.
    sql: SELECT p.base_currency AS currency, p.portfolio_type, COUNT(*) AS portfolios FROM bus_portfolio p WHERE p.deleted_at IS NULL AND p.status = 'active' GROUP BY p.base_currency, p.portfolio_type ORDER BY portfolios DESC
  - name: compliance-assessments-overdue
    title: Clients with no current suitability assessment
    entity: SuitabilityAssessment
    help: The single finding a regulator looks for. An active client whose most recent assessment is over a year old is being advised on a view of their circumstances that is out of date, and nothing prompts anyone.
    sql: SELECT c.client_number, y.display_name AS client, MAX(s.assessment_date) AS last_assessed, (now()::date - MAX(s.assessment_date)) AS days_since FROM bus_client c LEFT JOIN bus_party y ON y.id = c.party_id LEFT JOIN bus_suitability_assessment s ON s.client_id = c.id AND s.deleted_at IS NULL AND s.status = 'approved' WHERE c.deleted_at IS NULL AND c.status = 'active' GROUP BY c.id, c.client_number, y.display_name HAVING MAX(s.assessment_date) IS NULL OR MAX(s.assessment_date) < now()::date - 365 ORDER BY last_assessed NULLS FIRST
  - name: compliance-assessments-unapproved
    title: Assessments completed but never approved
    entity: SuitabilityAssessment
    help: The assessment was done and then stalled before sign-off, so the client counts as unassessed however much work went in. It is the cheapest compliance gap in the system to close.
    sql: SELECT c.client_number, y.display_name AS client, s.assessment_type, s.status, s.assessment_date, s.result FROM bus_suitability_assessment s JOIN bus_client c ON c.id = s.client_id LEFT JOIN bus_party y ON y.id = c.party_id WHERE s.deleted_at IS NULL AND s.status IN ('draft', 'pending') AND s.assessment_date < now()::date - 14 ORDER BY s.assessment_date
  - name: compliance-overrides
    title: Records changed outside the normal path
    entity: AuditEvent
    help: "The audit trail read the way an investigator reads it: not everything that happened, but the actions that overrode, cancelled or superseded something. These are the entries that need a reason recorded against them."
    sql: SELECT a."timestamp" AS occurred_at, y.display_name AS advisor, a.action, a.entity_type, a.entity_ref, a.source FROM bus_audit_event a LEFT JOIN bus_advisor v ON v.id = a.advisor_id LEFT JOIN bus_party y ON y.id = v.party_id WHERE a.deleted_at IS NULL AND a.action ILIKE ANY (ARRAY['%override%', '%cancel%', '%supersede%', '%delete%', '%reject%']) AND a."timestamp" > now() - interval '90 days' ORDER BY a."timestamp" DESC
  - name: compliance-activity-by-advisor
    title: Audited actions by advisor
    entity: AuditEvent
    chart: bar
    x: advisor
    y: actions
    help: "Not a productivity measure and must not be read as one. It is the denominator: an advisor with far more audited changes than the rest is either carrying more, or working around something."
    sql: SELECT COALESCE(y.display_name, '(system)') AS advisor, COUNT(*) AS actions, COUNT(DISTINCT a.entity_type) AS entity_types FROM bus_audit_event a LEFT JOIN bus_advisor v ON v.id = a.advisor_id LEFT JOIN bus_party y ON y.id = v.party_id WHERE a.deleted_at IS NULL AND a."timestamp" > now() - interval '30 days' GROUP BY y.display_name ORDER BY actions DESC
  - name: finance-commission-outstanding
    title: Commission earned and not settled
    entity: Commission
    chart: bar
    x: commission_type
    y: amount
    help: What is owed to the firm, by the kind of business that generated it. Anything still unsettled after a quarter is a reconciliation nobody finished, not a payment that is late.
    sql: SELECT COALESCE(NULLIF(m.commission_type, ''), '(not set)') AS commission_type, COUNT(*) AS entries, SUM(m.amount) AS amount FROM bus_commission m WHERE m.deleted_at IS NULL AND m.status IN ('pending', 'active') GROUP BY 1 ORDER BY amount DESC
  - name: finance-commission-by-month
    title: Commission earned by month
    entity: Commission
    chart: line
    x: month
    y: amount
    help: The revenue line the business is run on. Earned date rather than received, because that is the month the work belongs to however long the settlement takes.
    sql: SELECT to_char(date_trunc('month', m.earned_date), 'YYYY-MM') AS month, SUM(m.amount) AS amount, COUNT(*) AS entries FROM bus_commission m WHERE m.deleted_at IS NULL AND m.earned_date > now()::date - 365 GROUP BY 1 ORDER BY 1
  - name: finance-commission-failures
    title: Commission entries in exception
    entity: Commission
    help: Entries the reconciliation could not match. Each is money the firm believes it earned and the counterparty does not, and every one has to be chased individually before it ages out.
    sql: SELECT c.client_number, y.display_name AS client, m.commission_type, m.amount, m.earned_date, m.status FROM bus_commission m LEFT JOIN bus_client c ON c.id = m.client_id LEFT JOIN bus_party y ON y.id = c.party_id WHERE m.deleted_at IS NULL AND m.status IN ('failed', 'rejected', 'cancelled') ORDER BY m.earned_date DESC
  - name: admin-audit-gaps
    title: Days with no audit activity at all
    entity: AuditEvent
    help: A silent day in an audit trail is either a genuinely quiet day or a collector that stopped writing. The difference matters enormously and only shows up when the days are counted rather than the events.
    sql: SELECT to_char(d.day, 'YYYY-MM-DD') AS day, COUNT(a.id) AS events FROM generate_series((now() - interval '30 days')::date, now()::date, interval '1 day') AS d(day) LEFT JOIN bus_audit_event a ON a."timestamp" >= d.day AND a."timestamp" < d.day + interval '1 day' AND a.deleted_at IS NULL GROUP BY d.day HAVING COUNT(a.id) = 0 ORDER BY d.day
  - name: admin-actions-without-advisor
    title: Audited changes with no advisor attached
    entity: AuditEvent
    help: An action nobody is recorded as having taken. Some are genuinely the system; the rest are a session that lost its user, and only an administrator can tell the two apart.
    sql: SELECT a."timestamp" AS occurred_at, a.action, a.entity_type, a.entity_ref, a.source, a.ip_address FROM bus_audit_event a WHERE a.deleted_at IS NULL AND a.advisor_id IS NULL AND a."timestamp" > now() - interval '30 days' ORDER BY a."timestamp" DESC
  - name: admin-audit-by-source
    title: Where audited changes come from
    entity: AuditEvent
    chart: pie
    x: source
    y: events
    help: The mix of interactive, batch and integration traffic. A source that suddenly dominates is usually an integration retrying, and it will fill the audit store long before anybody notices the cost.
    sql: SELECT COALESCE(NULLIF(a.source, ''), '(not recorded)') AS source, COUNT(*) AS events FROM bus_audit_event a WHERE a.deleted_at IS NULL AND a."timestamp" > now() - interval '30 days' GROUP BY 1 ORDER BY events DESC
rules:
  - name: riskSuitability
    title: Risk Suitability
    entity: InvestmentRecommendation
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Recommendation moving forward"
        shape: stadium
      - id: B
        label: status == pending_approval?
        shape: diamond
      - id: C
        label: Leave the write alone
        shape: rect
      - id: D
        label: suitability_result == pass?
        shape: diamond
      - id: E
        label: Allow the approval
        shape: rect
      - id: F
        label: "Refuse: suitability has not passed"
        shape: rect
      - id: Z
        label: "End: Suitability decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: refuseUnsuitedRecommendation
        type: validation-error
        when: status == "pending_approval" and suitability_result != "pass"
        props:
          message: Suitability has not passed — a recommendation cannot go for approval until it has
  - name: productEligibility
    title: Product Eligibility
    entity: RecommendationItem
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Line added to a recommendation"
        shape: stadium
      - id: B
        label: security is active?
        shape: diamond
      - id: C
        label: "Refuse: product withdrawn"
        shape: rect
      - id: D
        label: product risk <= household risk band?
        shape: diamond
      - id: E
        label: Accept the line
        shape: rect
      - id: F
        label: "Refuse: outside the assessed risk band"
        shape: rect
      - id: Z
        label: "End: Eligibility decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: refuseWithdrawnProduct
        type: validation-error
        when: security_status != "active"
        props:
          message: This product has been withdrawn and cannot be recommended
  - name: concentrationCheck
    title: Concentration Check
    entity: Order
    event: beforeCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Order raised"
        shape: stadium
      - id: B
        label: resulting weight > 25 percent?
        shape: diamond
      - id: C
        label: Within policy
        shape: rect
      - id: D
        label: dealer override recorded?
        shape: diamond
      - id: E
        label: Allow, and flag for review
        shape: rect
      - id: F
        label: "Refuse: concentration ceiling"
        shape: rect
      - id: Z
        label: "End: Concentration decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: refuseConcentrationBreach
        type: validation-error
        when: resulting_weight > 25 and override_reference == null
        props:
          message: This order would take one holding above the 25 percent concentration ceiling — record a dealer override or resize it
  - name: allocationDeviation
    title: Allocation Deviation
    entity: RebalanceRecommendation
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Drift measured"
        shape: stadium
      - id: B
        label: deviation >= 5 percent?
        shape: diamond
      - id: C
        label: Below the band — no action
        shape: rect
      - id: D
        label: deviation >= 10 percent?
        shape: diamond
      - id: E
        label: Raise a priority rebalance
        shape: rect
      - id: F
        label: Raise a routine rebalance
        shape: rect
      - id: Z
        label: "End: Deviation graded"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: startRebalance
        type: trigger-workflow
        when: deviation_amount >= 5
        props:
          workflow: Rebalancing
          message: Allocation has drifted past the tolerance band — raising a rebalance
  - name: kycCompleteness
    title: KYC Completeness
    entity: Order
    event: beforeCreate
    priority: 5
    nodes:
      - id: A
        label: "Start: Order raised"
        shape: stadium
      - id: B
        label: KYC verified?
        shape: diamond
      - id: C
        label: "Refuse: KYC incomplete"
        shape: rect
      - id: D
        label: KYC expiry in the future?
        shape: diamond
      - id: E
        label: Allow the order
        shape: rect
      - id: F
        label: "Refuse: KYC expired"
        shape: rect
      - id: Z
        label: "End: KYC decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: refuseIncompleteKyc
        type: validation-error
        when: kyc_status != "verified"
        props:
          message: No order may be raised for a client whose KYC is not verified
  - name: recommendationApprovalGate
    title: Recommendation Approval Gate
    entity: Proposal
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Proposal requested"
        shape: stadium
      - id: B
        label: approval recorded?
        shape: diamond
      - id: C
        label: "Refuse: approval missing"
        shape: rect
      - id: D
        label: approver differs from author?
        shape: diamond
      - id: E
        label: Produce the proposal
        shape: rect
      - id: F
        label: "Refuse: self-approval"
        shape: rect
      - id: Z
        label: "End: Approval decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: refuseUnapprovedProposal
        type: validation-error
        when: approval_reference == null
        props:
          message: A proposal cannot be produced from a recommendation nobody approved
      - name: refuseSelfApproval
        type: validation-error
        when: approver_id == advisor_id
        props:
          message: The approver of a recommendation may not be its author
  - name: transactionEligibility
    title: Transaction Eligibility
    entity: InvestmentTransaction
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Transaction booked"
        shape: stadium
      - id: B
        label: account active?
        shape: diamond
      - id: C
        label: "Refuse: account not active"
        shape: rect
      - id: D
        label: mandate in force?
        shape: diamond
      - id: E
        label: Book the transaction
        shape: rect
      - id: F
        label: "Refuse: no mandate"
        shape: rect
      - id: Z
        label: "End: Eligibility decided"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
  - name: commissionReconciliation
    title: Commission Reconciliation
    entity: CommissionReconciliation
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Statement received"
        shape: stadium
      - id: B
        label: difference within tolerance?
        shape: diamond
      - id: C
        label: Mark matched
        shape: rect
      - id: D
        label: difference in the platform's favour?
        shape: diamond
      - id: E
        label: Raise a payable exception
        shape: rect
      - id: F
        label: Raise a receivable exception
        shape: rect
      - id: Z
        label: "End: Reconciliation graded"
        shape: stadium
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: Z
      - from: E
        to: Z
      - from: F
        to: Z
    actions:
      - name: raiseCommissionException
        type: validation-error
        when: difference_amount != 0 and exception_reference == null
        props:
          message: Expected and received commission differ — record an exception before marking this reconciliation matched
stateMachines:
  - name: ProspectLifecycle
    title: Prospect Lifecycle
    entity: Prospect
    states: [new, contacted, qualified, lost, meeting, proposal, converted]
    initial: new
    final: [converted, lost]
    transitions:
      - from: new
        to: contacted
        trigger: contact
      - from: contacted
        to: qualified
        trigger: qualify
      - from: contacted
        to: lost
        trigger: disqualify
      - from: qualified
        to: meeting
        trigger: book_meeting
      - from: qualified
        to: lost
        trigger: disqualify
      - from: meeting
        to: proposal
        trigger: present
      - from: meeting
        to: lost
        trigger: withdraw
      - from: proposal
        to: converted
        trigger: convert
      - from: proposal
        to: lost
        trigger: decline
  - name: ClientLifecycle
    title: Client Lifecycle
    entity: Client
    states: [prospect, onboarding, pending_kyc, active, suspended, inactive, closed]
    initial: prospect
    final: [closed]
    transitions:
      - from: prospect
        to: onboarding
        trigger: begin_onboarding
      - from: onboarding
        to: pending_kyc
        trigger: submit_kyc
      - from: pending_kyc
        to: active
        trigger: activate
      - from: pending_kyc
        to: onboarding
        trigger: return_for_information
      - from: active
        to: suspended
        trigger: suspend
      - from: suspended
        to: active
        trigger: reinstate
      - from: active
        to: inactive
        trigger: go_dormant
      - from: inactive
        to: active
        trigger: reactivate
      - from: inactive
        to: closed
        trigger: close
      - from: suspended
        to: closed
        trigger: close
  - name: FinancialPlanLifecycle
    title: Financial Plan Lifecycle
    entity: FinancialPlan
    states: [draft, analysis, proposed, approved, active, superseded, archived]
    initial: draft
    final: [archived]
    transitions:
      - from: draft
        to: analysis
        trigger: run_analysis
      - from: analysis
        to: proposed
        trigger: propose
      - from: analysis
        to: draft
        trigger: revise
      - from: proposed
        to: approved
        trigger: approve
      - from: proposed
        to: draft
        trigger: reject
      - from: approved
        to: active
        trigger: adopt
      - from: active
        to: superseded
        trigger: supersede
      - from: superseded
        to: archived
        trigger: archive
  - name: GoalLifecycle
    title: Goal Lifecycle
    entity: Goal
    states: [identified, planned, cancelled, funded, achieved]
    initial: identified
    final: [achieved, cancelled]
    transitions:
      - from: identified
        to: planned
        trigger: plan
      - from: identified
        to: cancelled
        trigger: drop
      - from: planned
        to: funded
        trigger: fund
      - from: planned
        to: cancelled
        trigger: drop
      - from: funded
        to: achieved
        trigger: achieve
      - from: funded
        to: cancelled
        trigger: abandon
  - name: RecommendationLifecycle
    title: Recommendation Lifecycle
    entity: InvestmentRecommendation
    states: [draft, suitability_check, pending_approval, rejected, approved, presented, accepted, expired, executed]
    initial: draft
    final: [executed, rejected, expired]
    transitions:
      - from: draft
        to: suitability_check
        trigger: submit
      - from: suitability_check
        to: pending_approval
        trigger: suitability_passed
      - from: suitability_check
        to: rejected
        trigger: suitability_failed
      - from: pending_approval
        to: approved
        trigger: approve
      - from: pending_approval
        to: rejected
        trigger: reject
      - from: approved
        to: presented
        trigger: present
      - from: presented
        to: accepted
        trigger: accept
      - from: presented
        to: rejected
        trigger: decline
      - from: presented
        to: expired
        trigger: lapse
      - from: accepted
        to: executed
        trigger: execute
  - name: ProposalLifecycle
    title: Proposal Lifecycle
    entity: Proposal
    states: [draft, presented, accepted, rejected, expired]
    initial: draft
    final: [accepted, rejected, expired]
    transitions:
      - from: draft
        to: presented
        trigger: present
      - from: presented
        to: accepted
        trigger: accept
      - from: presented
        to: rejected
        trigger: decline
      - from: presented
        to: expired
        trigger: lapse
  - name: OrderLifecycle
    title: Order Lifecycle
    entity: Order
    states: [draft, pending_approval, cancelled, approved, rejected, submitted, partially_executed, executed, failed]
    initial: draft
    final: [executed, rejected, cancelled, failed]
    transitions:
      - from: draft
        to: pending_approval
        trigger: submit
      - from: draft
        to: cancelled
        trigger: withdraw
      - from: pending_approval
        to: approved
        trigger: approve
      - from: pending_approval
        to: rejected
        trigger: reject
      - from: approved
        to: submitted
        trigger: place
      - from: approved
        to: cancelled
        trigger: cancel
      - from: submitted
        to: partially_executed
        trigger: partial_fill
      - from: submitted
        to: executed
        trigger: fill
      - from: submitted
        to: failed
        trigger: reject_at_exchange
      - from: partially_executed
        to: executed
        trigger: fill
      - from: partially_executed
        to: cancelled
        trigger: cancel_balance
  - name: RebalanceLifecycle
    title: Rebalance Lifecycle
    entity: RebalanceRecommendation
    states: [detected, analysed, proposed, approved, failed, executing, completed]
    initial: detected
    final: [completed, failed]
    transitions:
      - from: detected
        to: analysed
        trigger: analyse
      - from: analysed
        to: proposed
        trigger: propose
      - from: proposed
        to: approved
        trigger: approve
      - from: proposed
        to: failed
        trigger: abandon
      - from: approved
        to: executing
        trigger: execute
      - from: executing
        to: completed
        trigger: settle
      - from: executing
        to: failed
        trigger: break
  - name: ServiceRequestLifecycle
    title: Service Request Lifecycle
    entity: ServiceRequest
    states: [submitted, assigned, rejected, processing, awaiting_client, completed]
    initial: submitted
    final: [completed, rejected]
    transitions:
      - from: submitted
        to: assigned
        trigger: assign
      - from: submitted
        to: rejected
        trigger: reject
      - from: assigned
        to: processing
        trigger: start
      - from: processing
        to: awaiting_client
        trigger: request_information
      - from: awaiting_client
        to: processing
        trigger: information_received
      - from: processing
        to: completed
        trigger: complete
      - from: processing
        to: rejected
        trigger: reject
  - name: ClientReviewLifecycle
    title: Client Review Lifecycle
    entity: ClientReview
    states: [due, scheduled, conducted, follow_up, closed]
    initial: due
    final: [closed]
    transitions:
      - from: due
        to: scheduled
        trigger: schedule
      - from: scheduled
        to: conducted
        trigger: conduct
      - from: scheduled
        to: due
        trigger: postpone
      - from: conducted
        to: follow_up
        trigger: raise_actions
      - from: conducted
        to: closed
        trigger: close
      - from: follow_up
        to: closed
        trigger: close
  - name: OnboardingCaseLifecycle
    title: Onboarding Case Lifecycle
    entity: OnboardingCase
    states: [started, kyc, cancelled, suitability, rejected, approval, active]
    initial: started
    final: [active, rejected, cancelled]
    transitions:
      - from: started
        to: kyc
        trigger: collect_kyc
      - from: started
        to: cancelled
        trigger: abandon
      - from: kyc
        to: suitability
        trigger: assess_suitability
      - from: kyc
        to: rejected
        trigger: fail_kyc
      - from: suitability
        to: approval
        trigger: send_for_approval
      - from: suitability
        to: rejected
        trigger: fail_suitability
      - from: approval
        to: active
        trigger: approve
      - from: approval
        to: rejected
        trigger: reject
sagas:
  - name: ClientOnboarding
    title: Client Onboarding
    entity: OnboardingCase
    steps:
      - id: B
        type: Decision
        label: Grade the household
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Investable\",\"field\":\"estimated_aum\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Segment\",\"field\":\"householdSegment\"},{\"id\":\"o2\",\"name\":\"RiskBand\",\"field\":\"openingRiskBand\"}],\"rules\":[{\"_id\":\"uhnw\",\"i1\":\">= 5000000\",\"o1\":\"'ultra_high_net_worth'\",\"o2\":\"'moderately_aggressive'\"},{\"_id\":\"hnw\",\"i1\":\">= 1000000\",\"o1\":\"'high_net_worth'\",\"o2\":\"'moderate'\"},{\"_id\":\"affluent\",\"i1\":\">= 250000\",\"o1\":\"'affluent'\",\"o2\":\"'moderately_conservative'\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'retail'\",\"o2\":\"'conservative'\"}]}"
      - id: C
        type: CreateEntity
        label: Open the household
        properties:
          entity: Household
          as: newHouseholdId
          fields: '{"name":"case_reference","status":"active","advisor_id":"advisor_id"}'
      - id: D
        type: CreateEntity
        label: Open the risk profile
        properties:
          entity: RiskProfile
          as: newRiskProfileId
          fields: '{"household_id":"newHouseholdId","risk_category":"openingRiskBand","status":"draft"}'
      - id: E
        type: CreateEntity
        label: Open the financial plan
        properties:
          entity: FinancialPlan
          as: newFinancialPlanId
          fields: '{"household_id":"newHouseholdId","advisor_id":"advisor_id","status":"draft"}'
      - id: F
        type: UpdateEntity
        label: Move the case to KYC
        properties:
          field: status
          value: kyc
  - name: RecommendationExecution
    title: Recommendation Execution
    entity: ClientAcceptance
    steps:
      - id: B
        type: Decision
        label: Size the first order
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Accepted\",\"field\":\"accepted_amount\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"OrderType\",\"field\":\"openingOrderType\"},{\"id\":\"o2\",\"name\":\"OrderAmount\",\"field\":\"openingOrderAmount\"}],\"rules\":[{\"_id\":\"block\",\"i1\":\">= 1000000\",\"o1\":\"'block'\",\"o2\":\"accepted_amount\"},{\"_id\":\"standard\",\"i1\":\"\",\"o1\":\"'market'\",\"o2\":\"accepted_amount\"}]}"
      - id: C
        type: CreateEntity
        label: Raise the order
        properties:
          entity: Order
          as: newOrderId
          fields: '{"client_id":"client_id","order_type":"openingOrderType","amount":"openingOrderAmount","status":"draft"}'
      - id: D
        type: CreateEntity
        label: Write the audit record
        properties:
          entity: AuditEvent
          as: newAuditEventId
          fields: '{"action":"recommendation_executed","entity_type":"ClientAcceptance","entity_ref":"id","source":"saga"}'
      - id: E
        type: UpdateEntity
        label: Close the acceptance
        properties:
          field: status
          value: accepted
  - name: Rebalancing
    entity: RebalanceRecommendation
    steps:
      - id: B
        type: Decision
        label: Grade the drift
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Deviation\",\"field\":\"deviation_amount\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Urgency\",\"field\":\"rebalanceUrgency\"},{\"id\":\"o2\",\"name\":\"Factor\",\"field\":\"correctionFactor\"}],\"rules\":[{\"_id\":\"urgent\",\"i1\":\">= 100000\",\"o1\":\"'priority'\",\"o2\":\"1\"},{\"_id\":\"routine\",\"i1\":\"\",\"o1\":\"'routine'\",\"o2\":\"0.5\"}]}"
      - id: C
        type: Formula
        label: Size the corrective trade
        properties:
          target: correctiveTradeAmount
          operation: multiply
          source: deviation_amount
          operand: correctionFactor
      - id: D
        type: CreateEntity
        label: Write the audit record
        properties:
          entity: AuditEvent
          as: newAuditEventId
          fields: '{"action":"rebalance_detected","entity_type":"RebalanceRecommendation","entity_ref":"id","source":"saga"}'
      - id: E
        type: UpdateEntity
        label: Move the rebalance to analysed
        properties:
          field: status
          value: analysed
hookDiagrams:
  - name: ClientOnboardingHooks
    title: Client Onboarding Hooks
    entity: Client
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: assignClientNumber]
          C --> D[customValidate: ensureClientNumberUnique]
          D --> E[Process Client]
          E --> F[afterCreate: openComplianceFile]
          F --> G[beforeList: scopeToOwnHouseholds]
          G --> H[beforeDelete: blockDeleteWithPortfolio]
          H --> I[Response]

          %% `beforeList: scopeToOwnHouseholds` is the one that matters most here. An
          %% advisor may read Client — that is what the %%rbac rule says — but reading
          %% *every* client is a different permission from reading their own, and RBAC
          %% has no way to express the difference. The row filter belongs on the query.
  - name: PortfolioValuationHooks
    title: Portfolio Valuation Hooks
    entity: Holding
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: normalizeQuantityScale]
          C --> D[Process Holding]
          D --> E[afterCreate: revalueOnNewHolding]
          E --> F[afterUpdate: revalueOnHoldingChange]
          F --> G[afterList: attachUnrealisedGain]
          G --> H[Response]

          %% A portfolio's value is arithmetic over its holdings, so it is recomputed
          %% on the write rather than read from a column somebody remembered to
          %% update. Unrealised gain is attached on the way out instead of stored: it
          %% moves with the price, and a stored copy is wrong the moment the market
          %% opens.
          %% One handler name per event. Binding the same name to both afterCreate
          %% and afterUpdate makes the generator keep the first and drop the second,
          %% so the update path would have had no handler at all.
  - name: OrderExecutionHooks
    title: Order Execution Hooks
    entity: Order
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: stampOrderedAt]
          C --> D[customValidate: ensureDealingDeskOpen]
          D --> E[Process Order]
          E --> F[afterUpdate: bookExecutedTransaction]
          F --> G[beforeDelete: blockDeleteAfterSubmission]
          G --> H[Response]

          %% An order that reached the exchange is a record of something that
          %% happened, and deleting it is not a correction — it is a hole in the audit
          %% trail. Cancel it through the state machine instead; that edge exists.
  - name: AuditTrailHooks
    title: Audit Trail Hooks
    entity: AuditEvent
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[beforeCreate: stampCorrelationRef]
          C --> D[Process AuditEvent]
          D --> E[beforeUpdate: blockAmendment]
          E --> F[beforeDelete: blockDeletion]
          F --> G[Response]

          %% The audit trail is append-only, and that has to be enforced where the
          %% write happens rather than by withholding a button: %%rbac can say who may
          %% update the table, and the answer here is nobody, including the
          %% administrator the master role would otherwise let through.

      %% ---- Section 9: Workflow — prospect lifecycle ------------------------------
