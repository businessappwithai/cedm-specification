        to: K
      - from: J
        to: K
      - from: K
        to: L
      - from: L
        to: M
        label: Yes
      - from: L
        to: N
        label: No
      - from: M
        to: Z
      - from: N
        to: Z
  # ---- Section 4: Business rule — lead qualification gate --------------------
  # The gate a lead has to pass before it becomes an account. Its action is
  # what makes the conversion saga in Section 22 run — without it the saga would
  # either fire on every lead update or never fire at all.
  - name: leadQualification
    title: Lead Qualification
    entity: Lead
    event: beforeUpdate
    priority: 15
    nodes:
      - id: A
        label: "Start: Qualification Requested"
        type: start
      - id: B
        label: email present?
        type: decision
      - id: C
        label: "Reject: Contact email required"
        type: expression
      - id: D
        label: company_name present?
        type: decision
      - id: E
        label: "Reject: Company name required"
        type: expression
      - id: F
        label: score >= 40?
        type: decision
      - id: G
        label: Route back to nurturing
        type: expression
      - id: H
        label: owner assigned?
        type: decision
      - id: I
        label: "Reject: Owner required before conversion"
        type: expression
      - id: J
        label: Set status qualified
        type: expression
      - id: Z
        label: "End: Qualification Decided"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: B
        to: D
        label: Yes
      - from: D
        to: E
        label: No
      - from: D
        to: F
        label: Yes
      - from: F
        to: G
        label: No
      - from: F
        to: H
        label: Yes
      - from: H
        to: I
        label: No
      - from: H
        to: J
        label: Yes
      - from: C
        to: Z
      - from: E
        to: Z
      - from: G
        to: Z
      - from: I
        to: Z
      - from: J
        to: Z
    actions:
      - name: convertQualifiedLead
        type: trigger-workflow
        when: status == "qualified"
        props:
          workflow: LeadConversion
          message: Lead qualified — opening the account, contact and first opportunity
  # A qualified lead is converted by the multi-step workflow in Section 22.
  # The `when` is what keeps that workflow off every other lead update.

  # ---- Section 5: Business rule — opportunity forecasting --------------------
  # Probability and forecast category are derived, never typed in. Reps disagree
  # about what "70% likely" means; a stage does not.
  - name: opportunityForecast
    title: Opportunity Forecasting
    entity: Opportunity
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Opportunity Updated"
        type: start
      - id: B
        label: stage == closed_won?
        type: decision
      - id: C
        label: Set probability 100 and category closed
        type: expression
      - id: D
        label: stage == closed_lost?
        type: decision
      - id: E
        label: Set probability 0 and category omitted
        type: expression
      - id: F
        label: stage == negotiation?
        type: decision
      - id: G
        label: Set probability 80 and category commit
        type: expression
      - id: H
        label: stage == proposal?
        type: decision
      - id: I
        label: Set probability 60 and category best_case
        type: expression
      - id: J
        label: stage == needs_analysis?
        type: decision
      - id: K
        label: Set probability 40 and category pipeline
        type: expression
      - id: L
        label: stage == qualification?
        type: decision
      - id: M
        label: Set probability 20 and category pipeline
        type: expression
      - id: N
        label: Set probability 10 and category pipeline
        type: expression
      - id: O
        label: Recompute account pipeline
        type: function
      - id: P
        label: expected_close_date in the past?
        type: decision
      - id: Q
        label: Flag as slipped
        type: expression
      - id: R
        label: Keep current close date
        type: expression
      - id: Z
        label: "End: Forecast Recomputed"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
        label: No
      - from: H
        to: I
        label: Yes
      - from: H
        to: J
        label: No
      - from: J
        to: K
        label: Yes
      - from: J
        to: L
        label: No
      - from: L
        to: M
        label: Yes
      - from: L
        to: N
        label: No
      - from: C
        to: O
      - from: E
        to: O
      - from: G
        to: O
      - from: I
        to: O
      - from: K
        to: O
      - from: M
        to: O
      - from: N
        to: O
      - from: O
        to: P
      - from: P
        to: Q
        label: Yes
      - from: P
        to: R
        label: No
      - from: Q
        to: Z
      - from: R
        to: Z
  # ---- Section 6: Business rule — closed-won gate ----------------------------
  # What a deal has to have before anyone is allowed to call it won. A pipeline
  # nobody can trust is usually a pipeline where this gate was never written down.
  - name: opportunityCloseGate
    title: Closed Won Gate
    entity: Opportunity
    event: beforeUpdate
    priority: 5
    nodes:
      - id: A
        label: "Start: Close Requested"
        type: start
      - id: B
        label: stage == closed_won?
        type: decision
      - id: C
        label: stage == closed_lost?
        type: decision
      - id: D
        label: loss_reason present?
        type: decision
      - id: E
        label: "Reject: Loss reason required"
        type: expression
      - id: F
        label: Stamp actual close date
        type: expression
      - id: G
        label: "Allow: Not a closing transition"
        type: expression
      - id: H
        label: amount > 0?
        type: decision
      - id: I
        label: "Reject: Amount required to close won"
        type: expression
      - id: J
        label: accepted quote present?
        type: decision
      - id: K
        label: "Reject: An accepted quote is required"
        type: expression
      - id: L
        label: primary contact present?
        type: decision
      - id: M
        label: "Reject: A primary contact is required"
        type: expression
      - id: N
        label: Stamp actual close date and category closed
        type: expression
      - id: Z
        label: "End: Close Decided"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: E
        label: No
      - from: D
        to: F
        label: Yes
      - from: C
        to: G
        label: No
      - from: B
        to: H
        label: Yes
      - from: H
        to: I
        label: No
      - from: H
        to: J
        label: Yes
      - from: J
        to: K
        label: No
      - from: J
        to: L
        label: Yes
      - from: L
        to: M
        label: No
      - from: L
        to: N
        label: Yes
      - from: E
        to: Z
      - from: F
        to: Z
      - from: G
        to: Z
      - from: I
        to: Z
      - from: K
        to: Z
      - from: M
        to: Z
      - from: N
        to: Z
  # ---- Section 7: Business rule — quote discount policy ----------------------
  # Discount authority by band. Anything past the rep's own authority stops the
  # quote and raises an approval; anything past the ceiling is refused outright
  # rather than sent up the chain, because no one is allowed to approve it.
  - name: quoteDiscountApproval
    title: Quote Discount Policy
    entity: Quote
    event: beforeUpdate
    priority: 10
    nodes:
      - id: A
        label: "Start: Quote Priced"
        type: start
      - id: B
        label: discount_percent > 40?
        type: decision
      - id: C
        label: "Reject: Above the maximum discount"
        type: expression
      - id: D
        label: discount_percent > 25?
        type: decision
      - id: E
        label: Require VP approval
        type: expression
      - id: F
        label: discount_percent > 15?
        type: decision
      - id: G
        label: Require sales manager approval
        type: expression
      - id: H
        label: discount_percent > 0?
        type: decision
      - id: I
        label: Auto approve within rep authority
        type: expression
      - id: J
        label: No discount applied
        type: expression
      - id: K
        label: Recompute grand total
        type: function
      - id: Z
        label: "End: Discount Decided"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
        label: No
      - from: H
        to: I
        label: Yes
      - from: H
        to: J
        label: No
      - from: E
        to: K
      - from: G
        to: K
      - from: I
        to: K
      - from: J
        to: K
      - from: C
        to: Z
      - from: K
        to: Z
    actions:
      - name: escalateDiscount
        type: trigger-workflow
        when: discount_percent > 15
        props:
          workflow: QuoteApprovalEscalation
          message: Discount above rep authority — holding the quote for approval
      - name: refuseDiscount
        type: validation-error
        when: discount_percent > 40
        props:
          message: Discounts above 40 percent cannot be approved by anyone — reprice the quote
  # Out-of-policy discounts hold the quote and raise an approval task; the
  # multi-step process that does it is Section 23.

  # ---- Section 8: Business rule — support case triage ------------------------
  # Priority is a function of who is asking and what broke, not of how the case
  # was worded. The action hands a critical case to the escalation process in
  # Section 24.
  - name: caseTriage
    title: Support Case Triage
    entity: SupportCase
    event: beforeCreate
    priority: 5
    nodes:
      - id: A
        label: "Start: Case Raised"
        type: start
      - id: B
        label: account tier == strategic?
        type: decision
      - id: C
        label: case_type == incident?
        type: decision
      - id: D
        label: Set priority critical
        type: expression
      - id: E
        label: Set priority high
        type: expression
      - id: F
        label: case_type == incident?
        type: decision
      - id: G
        label: account tier == enterprise?
        type: decision
      - id: H
        label: Set priority high
        type: expression
      - id: I
        label: Set priority medium
        type: expression
      - id: J
        label: case_type == billing?
        type: decision
      - id: K
        label: Set priority medium
        type: expression
      - id: L
        label: Set priority low
        type: expression
      - id: M
        label: Stamp SLA targets from policy
        type: function
      - id: N
        label: first response due within 60 minutes?
        type: decision
      - id: O
        label: Page the on-call queue
        type: expression
      - id: P
        label: Queue for the next available agent
        type: expression
      - id: Z
        label: "End: Case Triaged"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: C
        to: D
        label: Yes
      - from: C
        to: E
        label: No
      - from: B
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: G
        to: H
        label: Yes
      - from: G
        to: I
        label: No
      - from: F
        to: J
        label: No
      - from: J
        to: K
        label: Yes
      - from: J
        to: L
        label: No
      - from: D
        to: M
      - from: E
        to: M
      - from: H
        to: M
      - from: I
        to: M
      - from: K
        to: M
      - from: L
        to: M
      - from: M
        to: N
      - from: N
        to: O
        label: Yes
      - from: N
        to: P
        label: No
      - from: O
        to: Z
      - from: P
        to: Z
    actions:
      - name: escalateCriticalCase
        type: trigger-workflow
        when: priority == "critical"
        props:
          workflow: CriticalCaseEscalation
          message: Critical case — escalating and raising an escalation task
      - name: requireResolutionNotes
        type: validation-error
        when: status == "resolved" and resolution_notes == null
        props:
          message: A resolved case needs resolution notes
  # A critical case escalates through Section 24 rather than waiting for an
  # agent to notice it.

  # ---- Section 9: Business rule — renewal risk -------------------------------
  # Grades a contract as its renewal window opens. The renewal playbook in
  # Section 26 evaluates this same rule as a step rather than forking a second
  # copy of the policy.
  - name: renewalRisk
    title: Renewal Risk
    entity: Contract
    event: beforeUpdate
    priority: 15
    nodes:
      - id: A
        label: "Start: Renewal Window Opened"
        type: start
      - id: B
