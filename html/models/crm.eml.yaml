    handler: markContractActive
rules:
  # ---- Section 2: Business rule — inbound lead scoring -----------------------
  # Scores a lead on firmographics and source, then grades it. The grade is what
  # routing (Section 3) and conversion (Section 22) both read, so the arithmetic
  # lives in exactly one place.
  - name: leadScoring
    title: Lead Scoring
    entity: Lead
    event: beforeCreate
    priority: 10
    nodes:
      - id: A
        label: "Start: Lead Captured"
        type: start
      - id: B
        label: employee_count >= 1000?
        type: decision
      - id: C
        label: Add 35 firmographic points
        type: expression
      - id: D
        label: employee_count >= 100?
        type: decision
      - id: E
        label: Add 20 firmographic points
        type: expression
      - id: F
        label: Add 5 firmographic points
        type: expression
      - id: G
        label: lead_source == referral?
        type: decision
      - id: H
        label: Add 30 source points
        type: expression
      - id: I
        label: lead_source == event?
        type: decision
      - id: J
        label: Add 20 source points
        type: expression
      - id: K
        label: Add 8 source points
        type: expression
      - id: L
        label: annual_revenue > 10000000?
        type: decision
      - id: M
        label: Add 25 revenue points
        type: expression
      - id: N
        label: Add 5 revenue points
        type: expression
      - id: O
        label: Compute lead score
        type: function
      - id: P
        label: score >= 70?
        type: decision
      - id: Q
        label: Set rating hot
        type: expression
      - id: R
        label: score >= 40?
        type: decision
      - id: S
        label: Set rating warm
        type: expression
      - id: T
        label: Set rating cold
        type: expression
      - id: Z
        label: "End: Lead Scored"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: C
        to: G
      - from: E
        to: G
      - from: F
        to: G
      - from: G
        to: H
        label: Yes
      - from: G
        to: I
        label: No
      - from: I
        to: J
        label: Yes
      - from: I
        to: K
        label: No
      - from: H
        to: L
      - from: J
        to: L
      - from: K
        to: L
      - from: L
        to: M
        label: Yes
      - from: L
        to: N
        label: No
      - from: M
        to: O
      - from: N
        to: O
      - from: O
        to: P
      - from: P
        to: Q
        label: Yes
      - from: P
        to: R
        label: No
      - from: R
        to: S
        label: Yes
      - from: R
        to: T
        label: No
      - from: Q
        to: Z
      - from: S
        to: Z
      - from: T
        to: Z
  # ---- Section 3: Business rule — lead routing -------------------------------
  # Who picks the lead up. Enterprise-sized leads never sit in the shared queue,
  # and a lead that arrived through a partner goes back to the partner desk
  # whatever its size.
  - name: leadRouting
    title: Lead Routing
    entity: Lead
    event: afterCreate
    priority: 20
    nodes:
      - id: A
        label: "Start: Lead Scored"
        type: start
      - id: B
        label: lead_source == partner?
        type: decision
      - id: C
        label: Route to Partner Desk
        type: expression
      - id: D
        label: annual_revenue > 50000000?
        type: decision
      - id: E
        label: Route to Strategic Accounts Team
        type: expression
      - id: F
        label: employee_count >= 500?
        type: decision
      - id: G
        label: Route to Enterprise Team
        type: expression
      - id: H
        label: rating == hot?
        type: decision
      - id: I
        label: Route to Mid Market Team
        type: expression
      - id: J
        label: Route to SMB Queue
        type: expression
      - id: K
        label: Assign owner from territory
        type: function
      - id: L
        label: owner assigned?
        type: decision
      - id: M
        label: Notify assigned owner
        type: expression
      - id: N
        label: Hold in unassigned queue
        type: expression
      - id: Z
        label: "End: Lead Routed"
        type: end
    edges:
      - from: A
        to: B
      - from: B
        to: C
        label: Yes
      - from: B
        to: D
        label: No
      - from: D
        to: E
        label: Yes
      - from: D
        to: F
        label: No
      - from: F
        to: G
        label: Yes
      - from: F
        to: H
        label: No
