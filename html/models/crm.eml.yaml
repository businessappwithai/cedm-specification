hooks:
  # account_number is unique and minted here rather than supplied by the
  # caller. That is why it is OPTIONAL in the ERD: the conversion saga in
  # Section 22 inserts an account without one, and a NOT NULL column would
  # fail that insert before the hook ever ran. Postgres allows repeated NULLs
  # under a unique index, so nothing collides in the window before the hook
  # stamps a value. quote_number, contract_number and case_number are the
  # same shape for the same reason.
  - entity: Account
    event: beforeCreate
    handler: normalizeAccountName
    fields: [name]
  - entity: Account
    event: beforeCreate
    handler: assignAccountNumber
    fields: [account_number]
  - entity: Account
    event: customValidate
    handler: ensureAccountNumberUnique
    fields: [account_number]
  - entity: Account
    event: afterCreate
    handler: seedAccountTeam
  - entity: Account
    event: beforeList
    handler: scopeToTerritory
    fields: [territory_id]
  - entity: Account
    event: afterList
    handler: attachHealthScore
    fields: [health_score]
  - entity: Account
    event: beforeDelete
    handler: blockDeleteWithOpenBusiness
  - entity: Contact
    event: beforeCreate
    handler: normalizeEmail
    fields: [email]
  - entity: Contact
    event: customValidate
    handler: ensureUniqueEmail
    fields: [email]
  - entity: Contact
    event: afterCreate
    handler: enqueueWelcomeSequence
  - entity: Contact
    event: afterUpdate
    handler: syncToMarketingPlatform
    fields: [email_opt_out]
  - entity: Contact
    event: beforeRead
    handler: enforceFieldLevelSecurity
  - entity: Contact
    event: afterRead
    handler: maskPersonalData
    fields: [phone, mobile]
  - entity: Contact
    event: afterDelete
    handler: purgeMarketingConsent
  - entity: Lead
    event: beforeCreate
    handler: stampLeadSource
    fields: [lead_source]
  - entity: Lead
    event: customValidate
    handler: requireContactChannel
    fields: [email, phone]
  - entity: Lead
    event: afterCreate
    handler: notifyOwnerOfNewLead
  - entity: Lead
    event: beforeQuery
    handler: scopeToOwnedLeads
    fields: [owner_id]
  - entity: Lead
    event: afterQuery
    handler: annotateDuplicateLeads
    fields: [email]
  - entity: Opportunity
    event: beforeUpdate
    handler: snapshotStageChange
    fields: [stage]
  - entity: Opportunity
    event: customValidate
    handler: requireLossReasonOnLoss
    fields: [loss_reason]
  - entity: Opportunity
    event: afterCreate
    handler: notifySellingTeam
  - entity: Opportunity
    event: afterUpdate
    handler: recalculateAccountPipeline
    fields: [amount]
  - entity: Quote
    event: beforeCreate
    handler: generateQuoteNumber
    fields: [quote_number]
  - entity: Quote
    event: beforeUpdate
    handler: recalculateQuoteTotals
    fields: [grand_total]
  - entity: Quote
    event: customValidate
    handler: enforceDiscountCeiling
    fields: [discount_percent]
  - entity: Quote
    event: afterUpdate
    handler: regenerateQuoteDocument
  - entity: SupportCase
    event: beforeCreate
    handler: assignCaseNumber
    fields: [case_number]
  - entity: SupportCase
    event: beforeCreate
    handler: stampSlaTargets
    fields: [first_response_due_at, resolution_due_at]
  - entity: SupportCase
    event: beforeUpdate
    handler: captureFirstResponse
    fields: [first_response_at]
  - entity: SupportCase
    event: afterCreate
    handler: acknowledgeCustomer
  - entity: SupportCase
    event: afterUpdate
    handler: recomputeSlaBreach
    fields: [is_sla_breached]
  - entity: SupportCase
    event: beforeDelete
    handler: blockDeleteOfOpenCase
  - entity: SupportCase
    event: afterDelete
    handler: archiveCaseTranscript
  - entity: Contract
    event: beforeCreate
    handler: generateContractNumber
    fields: [contract_number]
  - entity: Contract
    event: customValidate
    handler: ensureTermMatchesDates
    fields: [start_date, end_date, term_months]
  - entity: Contract
    event: afterCreate
    handler: notifyFinanceOfNewContract
  - entity: Contract
    event: afterUpdate
    handler: scheduleRenewalReminders
    fields: [renewal_notice_days]
hookFlows:
  # ---- Section 15: Workflow — account governance hooks -----------------------
  - name: AccountGovernance
    title: Account Governance
    entity: Account
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: normalizeAccountName
      - id: D
        event: beforeCreate
        handler: assignAccountNumber
      - id: E
        event: customValidate
        handler: ensureAccountNumberUnique
      - id: F
        label: Process Account
      - id: G
        event: afterCreate
        handler: seedAccountTeam
      - id: H
        event: beforeList
        handler: scopeToTerritory
      - id: I
        event: afterList
        handler: attachHealthScore
      - id: J
        event: beforeDelete
        handler: blockDeleteWithOpenBusiness
      - id: K
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
      - from: I
        to: J
      - from: J
        to: K
  # ---- Section 16: Workflow — contact hygiene hooks --------------------------
  # Deliverability and consent are the two things a CRM quietly destroys if
  # nobody guards them, so both are enforced at the write rather than in the UI.
  - name: ContactHygiene
    title: Contact Hygiene
    entity: Contact
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: normalizeEmail
      - id: D
        event: customValidate
        handler: ensureUniqueEmail
      - id: E
        label: Process Contact
      - id: F
        event: afterCreate
        handler: enqueueWelcomeSequence
      - id: G
        event: afterUpdate
        handler: syncToMarketingPlatform
      - id: H
        event: beforeRead
        handler: enforceFieldLevelSecurity
      - id: I
        event: afterRead
        handler: maskPersonalData
      - id: J
        event: afterDelete
        handler: purgeMarketingConsent
      - id: K
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
      - from: I
        to: J
      - from: J
        to: K
  # ---- Section 17: Workflow — lead intake hooks ------------------------------
  - name: LeadIntake
    title: Lead Intake
    entity: Lead
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: stampLeadSource
      - id: D
        event: customValidate
        handler: requireContactChannel
      - id: E
        label: Process Lead
      - id: F
        event: afterCreate
        handler: notifyOwnerOfNewLead
      - id: G
        event: beforeQuery
        handler: scopeToOwnedLeads
      - id: H
        event: afterQuery
        handler: annotateDuplicateLeads
      - id: I
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
  # ---- Section 18: Workflow — opportunity integrity hooks --------------------
  - name: OpportunityIntegrity
    title: Opportunity Integrity
    entity: Opportunity
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeUpdate
        handler: snapshotStageChange
      - id: D
        event: customValidate
        handler: requireLossReasonOnLoss
      - id: E
        label: Process Opportunity
      - id: F
        event: afterCreate
        handler: notifySellingTeam
      - id: G
        event: afterUpdate
        handler: recalculateAccountPipeline
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  # ---- Section 19: Workflow — quote calculation hooks ------------------------
  - name: QuoteCalculation
    title: Quote Calculation
    entity: Quote
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: generateQuoteNumber
      - id: D
        event: beforeUpdate
        handler: recalculateQuoteTotals
      - id: E
        event: customValidate
        handler: enforceDiscountCeiling
      - id: F
        label: Process Quote
      - id: G
        event: afterUpdate
        handler: regenerateQuoteDocument
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  # ---- Section 20: Workflow — case SLA tracking hooks ------------------------
  - name: CaseSlaTracking
    title: Case SLA Tracking
    entity: SupportCase
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: assignCaseNumber
      - id: D
        event: beforeCreate
        handler: stampSlaTargets
      - id: E
        event: beforeUpdate
        handler: captureFirstResponse
      - id: F
        label: Process Case
      - id: G
        event: afterCreate
        handler: acknowledgeCustomer
      - id: H
        event: afterUpdate
        handler: recomputeSlaBreach
      - id: I
        event: beforeDelete
        handler: blockDeleteOfOpenCase
      - id: J
        event: afterDelete
        handler: archiveCaseTranscript
      - id: K
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
      - from: I
        to: J
      - from: J
        to: K
  # ---- Section 21: Workflow — contract governance hooks ----------------------
  # A contract is drafted by the handoff saga in Section 25 before anyone has
  # agreed dates, so the number is minted here and the date/term agreement is
  # validated on the way out of draft rather than on the way in.
  - name: ContractGovernance
    title: Contract Governance
    entity: Contract
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: generateContractNumber
      - id: D
        event: customValidate
        handler: ensureTermMatchesDates
      - id: E
        label: Process Contract
      - id: F
        event: afterCreate
        handler: notifyFinanceOfNewContract
      - id: G
        event: afterUpdate
        handler: scheduleRenewalReminders
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
rbac:
  # ---- Access by functional role ---------------------------------------------
  # Every entity belongs to at least one functional role, and `read` is the
  # operation that decides it: a role that may not read an entity does not see it
  # in the navigation at all, so signing in as `support.agent@…` gives you the
  # service desk rather than the whole CRM with most of it refusing to open.
  # The roles are the ones UserRole already names. Administrator bypasses all of
  # it, which is what makes it the account to compare the others against.
  # Restricting `read` is deliberately separate from the update and transition
  # rules further down: those say who may change a record, this says whose
  # application it is part of.
  - entity: Account
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager, support_agent, support_manager]
  - entity: Contact
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager, support_agent, support_manager]
  - entity: Activity
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager, support_agent, support_manager]
  - entity: Territory
    action: read
    roles: [sales_manager, sales_ops]
  - entity: Campaign
    action: read
    roles: [marketing_manager, sales_ops]
  - entity: CampaignMember
    action: read
    roles: [marketing_manager, sales_ops]
  - entity: Lead
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops, marketing_manager]
  - entity: Opportunity
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops]
  - entity: OpportunityLineItem
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops]
  - entity: Product
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops]
  - entity: Quote
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops]
  - entity: QuoteLineItem
    action: read
    roles: [sales_rep, account_executive, sales_manager, sales_ops]
  - entity: Contract
    action: read
    roles: [account_executive, sales_manager, sales_ops]
  - entity: SupportCase
    action: read
    roles: [support_agent, support_manager]
  - entity: SlaPolicy
    action: read
    roles: [support_agent, support_manager]
  - entity: User
    action: read
    roles: [sales_manager, sales_ops, support_manager]
  - entity: Team
    action: read
    roles: [sales_manager, sales_ops]
  - entity: Lead
    action: update
    roles: [sales_rep, account_executive, sales_manager]
  - entity: Lead
    action: convert
    roles: [sales_manager, sales_ops]
  - entity: Lead
    action: disqualify
    roles: [sales_manager]
  - entity: Opportunity
    action: update
    roles: [sales_rep, account_executive]
  - entity: Opportunity
    action: close_won
    roles: [sales_manager]
  - entity: Opportunity
    action: delete
    roles: [sales_manager, sales_ops]
  - entity: Quote
    action: update
    roles: [sales_rep, account_executive]
  - entity: Quote
    action: approve
    roles: [sales_manager, sales_ops]
  - entity: Quote
    action: reject
    roles: [sales_manager]
  - entity: SupportCase
    action: update
    roles: [support_agent, support_manager]
  - entity: SupportCase
    action: escalate
    roles: [support_manager]
  - entity: SupportCase
    action: delete
    roles: [support_manager, administrator]
  - entity: Contract
    action: update
    roles: [sales_manager, sales_ops]
  - entity: Contract
    action: counter_signed
    roles: [sales_ops, administrator]
  - entity: Contract
    action: terminate
    roles: [administrator]
triggers:
  - entity: Lead
