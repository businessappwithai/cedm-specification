stateMachines:
  - name: ProgramLifecycle
    title: Programme Lifecycle
    entity: Program
    states: [proposed, active, on_hold, completed, discontinued]
    initial: proposed
    final: [completed, discontinued]
    transitions:
      - from: proposed
        to: active
        trigger: fund
      - from: active
        to: on_hold
        trigger: pause
      - from: on_hold
        to: active
        trigger: resume
      - from: active
        to: completed
        trigger: nominate_candidate
      - from: active
        to: discontinued
        trigger: discontinue
      - from: on_hold
        to: discontinued
        trigger: discontinue
  - name: ExperimentLifecycle
    title: Experiment Lifecycle
    entity: Experiment
    states: [draft, submitted, in_review, approved, in_progress, completed, on_hold, cancelled]
    initial: draft
    final: [completed, cancelled]
    transitions:
      - from: draft
        to: submitted
        trigger: submit
      - from: submitted
        to: in_review
        trigger: assign_reviewer
      - from: submitted
        to: draft
        trigger: return_to_draft
      - from: in_review
        to: approved
        trigger: approve
      - from: in_review
        to: draft
        trigger: reject
      - from: approved
        to: in_progress
        trigger: start
      - from: in_progress
        to: completed
        trigger: complete
      - from: in_progress
        to: on_hold
        trigger: pause
      - from: on_hold
        to: in_progress
        trigger: resume
      - from: in_progress
        to: cancelled
        trigger: cancel
      - from: approved
        to: cancelled
        trigger: cancel
  - name: CapaLifecycle
    title: CAPA Lifecycle
    entity: CAPA
    states: [open, in_progress, pending_verification, closed, cancelled]
    initial: open
    final: [closed, cancelled]
    transitions:
      - from: open
        to: in_progress
        trigger: assign
      - from: in_progress
        to: pending_verification
        trigger: submit_for_review
      - from: pending_verification
        to: closed
        trigger: verify_effective
      - from: pending_verification
        to: in_progress
        trigger: reopen
      - from: in_progress
        to: cancelled
        trigger: cancel
sagas:
  - name: CriticalDeviationEscalation
    title: Critical Deviation Escalation
    entity: DeviationReport
    trigger: rule
    steps:
      - id: B
        type: Decision
        label: Classify the severity
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Severity\",\"field\":\"severity\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"BaseDays\",\"field\":\"baseDays\"},{\"id\":\"o2\",\"name\":\"Category\",\"field\":\"capaCategory\"}],\"rules\":[{\"_id\":\"critical\",\"i1\":\"\\\"critical\\\"\",\"o1\":\"1\",\"o2\":\"'immediate_containment'\"},{\"_id\":\"major\",\"i1\":\"\\\"major\\\"\",\"o1\":\"3\",\"o2\":\"'under_investigation'\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"7\",\"o2\":\"'under_investigation'\"}]}"
      - id: C
        type: Formula
        label: Compute the resolution window
        properties:
          target: resolutionDays
          source: baseDays
          operation: multiply
          operand: "7"
      - id: D
        type: CreateEntity
        label: Open a CAPA
        properties:
          entity: CAPA
          as: newCapaId
          fields: '{"deviation_report_id":"id","title":"CAPA for a critical deviation","root_cause_category":"capaCategory","remediation_owner_id":"reported_by_id","required_resolution_date":"anomaly_timestamp","status":"open"}'
      - id: E
        type: UpdateEntity
        label: Escalate the deviation
        properties:
          field: status
          value: escalated
      - id: F
        type: UpdateEntity
        label: Record the window on the CAPA
        properties:
          entity: CAPA
          targetSource: newCapaId
          field: effectiveness_metric
          source: resolutionDays
  - name: SampleDisposition
    title: Sample Disposition
    entity: Sample
    operation: UPDATE
    steps:
      - id: B
        type: Decision
        label: Decide the disposition
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Status\",\"field\":\"status\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"MovementType\",\"field\":\"dispositionType\"},{\"id\":\"o2\",\"name\":\"Location\",\"field\":\"dispositionLocation\"}],\"rules\":[{\"_id\":\"consumed\",\"i1\":\"\\\"consumed\\\"\",\"o1\":\"'consumption'\",\"o2\":\"'ARCHIVE-A'\"},{\"_id\":\"quarantined\",\"i1\":\"\\\"quarantined\\\"\",\"o1\":\"'transfer'\",\"o2\":\"'QUARANTINE-1'\"},{\"_id\":\"disposed\",\"i1\":\"\\\"disposed\\\"\",\"o1\":\"'disposal'\",\"o2\":\"'WASTE'\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'adjustment'\",\"o2\":\"'FREEZER-A'\"}]}"
      - id: C
        type: CreateEntity
        label: Open a ledger entry
        properties:
          entity: InventoryTransaction
          as: ledgerEntryId
          fields: '{"sample_id":"id","transaction_type":"dispositionType","from_location":"storage_location"}'
      - id: D
        type: UpdateEntity
        label: Move the sample
        properties:
          field: storage_location
          source: dispositionLocation
      - id: E
        type: UpdateEntity
        label: Complete the ledger entry
        properties:
          entity: InventoryTransaction
          targetSource: ledgerEntryId
          field: to_location
          source: dispositionLocation
  - name: AssayRetirement
    title: Assay Retirement
    entity: Assay
    operation: DELETE
    steps:
      - id: B
        type: Decision
        label: Classify the retirement
        properties:
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Active\",\"field\":\"is_active\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Reason\",\"field\":\"retirementReason\"}],\"rules\":[{\"_id\":\"inactive\",\"i1\":\"false\",\"o1\":\"'retired_after_decommission'\"},{\"_id\":\"rest\",\"i1\":\"\",\"o1\":\"'retired_early'\"}]}"
      - id: C
        type: UpdateEntity
        label: Record the retirement
        properties:
          field: protocol_reference
          source: retirementReason
      - id: D
        type: DeleteEntity
        label: Clear the runs
        properties:
          entity: AssayRun
          targetField: assay_id
hookDiagrams:
  - name: CompoundRegistration
    title: Compound Registration
    entity: Compound
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate SMILES]
          B --> C[customValidate: validateSmilesFormat]
          C --> D[beforeCreate: generateInchiKey]
          D --> E[beforeCreate: computeMolecularProperties]
          E --> F[beforeCreate: countLipinskiViolations]
          F --> G[Process Compound]
          G --> H[afterCreate: indexForStructureSearch]
          H --> I[afterCreate: notifyRegistrationTeam]
          I --> J[Response]

      %% ---- Section 9: Workflow — assay result validation hooks -------------------
      %% The quality gate on a number. A result is checked against the run it came
      %% from before it is stored, because a result from a plate that failed QC is
      %% worse than no result at all — it looks like data.
  - name: AssayResultValidation
    title: Assay Result Validation
    entity: AssayResult
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate Request]
          B --> C[customValidate: rejectResultsFromFailedRun]
          C --> D[beforeCreate: normaliseUnit]
          D --> E[Process Result]
          E --> F[afterCreate: recomputeSeriesPotency]
          F --> G[afterCreate: flagPotencyOutliers]
          G --> H[Response]

      %% ---- Section 10: Workflow — deviation report hooks -------------------------
  - name: DeviationReportHooks
    title: Deviation Report Hooks
    entity: DeviationReport
    diagram: |-
      flowchart TD
          A[Client Request] --> B[Validate]
          B --> C[beforeCreate: timestampAnomaly]
          C --> D[customValidate: requireDescription]
          D --> E[Process Deviation]
          E --> F[afterCreate: triggerCapaIfCritical]
          F --> G[afterCreate: notifyQualityTeam]
          G --> H[Response]

      %% ---- Section 11: Workflow — critical deviation escalation ------------------
      %% A multi-step process: it decides an SLA from a table, computes from what the
      %% table published, creates a CAPA in another entity, updates the record that
      %% triggered it, and then reaches back into the row it created using the id that
      %% step bound. `trigger: rule` is what makes the severity condition in Section 3
      %% load-bearing — without it the workflow would run on every deviation, critical
      %% or not.
      %%
      %% Step B is a decision table living inside the process. The base SLA used to be
      %% a literal 3, which meant the number was in the diagram but the reasoning
      %% behind it was nowhere: changing the window for major deviations meant editing
      %% a Formula and hoping the reader inferred why. As a table, the policy is the
      %% artifact, and the two variables it publishes are read by the steps after it.
