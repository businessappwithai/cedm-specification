        label: No
      - from: C
        to: D
        label: Yes
      - from: D
        to: X3
        label: No
      - from: D
        to: E
        label: Yes
      - from: E
        to: X4
        label: No
      - from: E
        to: F
        label: Yes
      - from: F
        to: X5
        label: No
      - from: F
        to: P
        label: Yes
      - from: X1
        to: Z
      - from: X2
        to: Z
      - from: X3
        to: Z
      - from: X4
        to: Z
      - from: X5
        to: Z
      - from: P
        to: Z
