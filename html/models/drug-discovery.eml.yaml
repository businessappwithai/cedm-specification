eml: "1.0"
name: Drug Discovery Platform
version: 2.0.0
enums:
  - name: TherapeuticArea
    values: [oncology, immunology, neuroscience, infectious_disease, cardiovascular, metabolic, respiratory, rare_disease]
  - name: ProgramStage
    values: [target_identification, hit_identification, hit_to_lead, lead_optimization, candidate_selection, preclinical]
  - name: ProgramStatus
    values: [proposed, active, on_hold, completed, discontinued]
  - name: TargetClass
    values: [kinase, gpcr, ion_channel, protease, nuclear_receptor, transporter, epigenetic, protein_protein_interaction, other]
  - name: TargetValidation
    values: [hypothesis, in_vitro_validated, in_vivo_validated, clinically_validated]
  - name: SeriesStatus
    values: [exploratory, active, deprioritised, abandoned]
  - name: CompoundRegistrationStatus
    values: [draft, pending_review, approved, rejected, withdrawn]
  - name: CompoundClass
    values: [small_molecule, fragment, peptide, natural_product, biologic, oligonucleotide]
  - name: AssayType
    values: [biochemical, cell_based, biophysical, admet, selectivity_panel, in_vivo]
  - name: AssayReadout
    values: [ic50, ec50, ki, kd, percent_inhibition, mic, half_life, permeability]
  - name: MeasurementUnit
    values: [nm, um, mg_ml, percent, minutes, nm_s]
  - name: AssayRunStatus
    values: [scheduled, in_progress, completed, failed, cancelled]
  - name: QcStatus
    values: [pending, pass, fail, flagged]
  - name: ResultQualifier
    values: [exact, greater_than, less_than, not_determined]
  - name: AmesResult
    values: [not_tested, negative, positive, equivocal]
  - name: ExperimentStatus
    values: [draft, submitted, in_review, approved, in_progress, completed, cancelled, on_hold]
  - name: SampleStatus
    values: [available, reserved, consumed, exhausted, quarantined, disposed]
  - name: SamplePhysicalState
    values: [solid, liquid, solution, suspension, lyophilized]
  - name: InventoryTransactionType
    values: [receipt, aliquot, consumption, transfer, disposal, adjustment]
  - name: InstrumentType
    values: [hplc, mass_spectrometer, nmr, plate_reader, liquid_handler, flow_cytometer, centrifuge]
  - name: CalibrationStatus
    values: [calibrated, due_soon, overdue, under_maintenance, decommissioned]
  - name: BookingStatus
    values: [pending, confirmed, in_use, completed, cancelled]
  - name: VendorType
    values: [cro, supplier, testing_lab, logistics, consultant]
  - name: SlaTier
    values: [standard, priority, enterprise]
  - name: VendorRequestStatus
    values: [draft, submitted, under_review, approved, in_progress, delivered, cancelled]
  - name: DeviationSeverity
    values: [minor, major, critical, catastrophic]
  - name: DeviationStatus
    values: [open, under_investigation, escalated, resolved, closed]
  - name: CapaStatus
    values: [open, in_progress, pending_verification, closed, cancelled]
  - name: CapaRootCauseCategory
    values: [equipment_failure, process_deviation, human_error, environmental, supplier_issue, immediate_containment, unknown]
  - name: UserRole
    values: [medicinal_chemist, biologist, dmpk_scientist, computational_chemist, lab_technician, project_manager, quality_assurance, lab_manager, administrator]
categories:
  - name: Portfolio
    description: Discovery programmes, the targets they pursue and the chemical series that carry them
    icon: Target
    color: "#6366f1"
    entities: [Program, Target, CompoundSeries]
  - name: Chemistry
    description: Registered compound structures and their calculated properties
    icon: FlaskConical
    color: "#8b5cf6"
    entities: [Compound]
  - name: Screening
    description: Assay definitions and the runs that execute them
    icon: Microscope
    color: "#0ea5e9"
    entities: [Assay, AssayRun]
  - name: Laboratory
    description: Experiments, physical samples and the movements of material between them
    icon: Beaker
    color: "#14b8a6"
    entities: [Experiment, Sample, InventoryTransaction]
  - name: Instruments
    description: Laboratory instruments and their bookings
    icon: Cpu
    color: "#f59e0b"
    entities: [Instrument, InstrumentBooking]
  - name: Quality and Suppliers
    description: Deviations, corrective actions, and the vendors and contract labs that do outsourced work
    icon: ShieldCheck
    color: "#ef4444"
    entities: [DeviationReport, CAPA, Vendor, VendorRequest]
  - name: People and Teams
    description: Scientists, technicians and the teams they belong to
    icon: Users
    color: "#64748b"
    default: true
    entities: [User, Team]
entities:
  - name: Program
    help: A funded attempt to find a medicine for one indication by acting on one biological target. Everything else in this application ultimately hangs off a programme, and a programme that is discontinued takes its series and experiments out of the active portfolio with it.
    attributes:
      - name: id
        type: string
        pk: true
      - name: program_code
        type: string
        unique: true
        help: The short internal code the programme is known by in every meeting and slide, such as ONC-114.
      - name: name
        type: string
        help: The readable name of the programme.
      - name: therapeutic_area
        type: string
        enum: TherapeuticArea
        help: The broad disease area the programme sits in. Portfolio reviews are usually run one area at a time.
      - name: indication
        type: string
        help: The specific disease the medicine is intended to treat.
      - name: stage
        type: string
        enum: ProgramStage
        help: Where the programme has reached, from picking a target to selecting a clinical candidate. Stage decides which data is expected to exist.
      - name: status
        type: string
        enum: ProgramStatus
        help: Whether the programme is active, paused, finished or stopped.
      - name: target_id
        type: string
        fk: true
        help: The biological target this programme acts on. One target per programme, by design — two targets is two programmes.
      - name: owner_id
        type: string
        fk: true
        help: The scientist accountable for the programme's science.
      - name: started_on
        type: date
        help: The date the programme was funded and work began.
      - name: target_candidate_date
        type: date
        optional: true
        help: The date the programme aims to nominate a clinical candidate. A plan, not a promise.
      - name: annual_budget
        type: decimal
        optional: true
        help: Approved spend for the current year, in the site's reporting currency.
      - name: objective
        type: text
        optional: true
        help: What the programme is trying to prove, in a sentence a new joiner could read.
    indexes:
      - columns: [program_code]
        unique: true
  - name: Target
    help: "A protein or gene the programme intends to act on. The validation level is the most important thing on the record: a target nobody has validated in vivo is a much larger bet than one with clinical precedent, and the whole programme inherits that risk."
    attributes:
      - name: id
        type: string
        pk: true
      - name: gene_symbol
        type: string
        help: The HGNC gene symbol, such as EGFR or BTK.
      - name: uniprot_accession
        type: string
        unique: true
        optional: true
        help: The UniProt accession for the protein, which is how this target is matched against external data.
      - name: name
        type: string
        help: The full protein name.
      - name: target_class
        type: string
        enum: TargetClass
        help: The structural family the target belongs to. It largely decides which screening approaches are worth trying.
      - name: validation_level
        type: string
        enum: TargetValidation
        help: How strong the evidence is that acting on this target changes the disease — from a hypothesis to clinical precedent.
      - name: is_antitarget
        type: boolean
        help: Set when the target is one to avoid rather than to hit, such as hERG. Selectivity panels are built from antitargets.
      - name: biological_rationale
        type: text
        optional: true
        help: The argument for why this target matters in this disease.
    indexes:
      - columns: [uniprot_accession]
        unique: true
  - name: CompoundSeries
    help: A family of compounds sharing a chemical scaffold, explored together. Medicinal chemistry advances by series rather than by molecule, so this is the unit a portfolio review actually discusses — a series is progressed, deprioritised or abandoned as a whole.
    attributes:
      - name: id
        type: string
        pk: true
      - name: series_code
        type: string
        unique: true
        help: The short code the series is known by.
      - name: name
        type: string
        help: A readable name for the series, usually naming the scaffold.
      - name: program_id
        type: string
        fk: true
        help: The programme this series belongs to.
      - name: scaffold_smiles
        type: string
        optional: true
        help: The core structure shared by the series, as SMILES.
      - name: status
        type: string
        enum: SeriesStatus
        help: Whether the series is being actively worked, parked or dropped.
      - name: compound_count
        type: integer
        optional: true
        help: How many compounds have been made in this series so far.
      - name: design_hypothesis
        type: text
        optional: true
        help: What the chemists believe this scaffold can be made to do, and what they are changing to find out.
    indexes:
      - columns: [series_code]
        unique: true
  - name: Compound
    help: One registered chemical structure. A compound is registered once and measured many times; its calculated properties are computed on registration from the structure, while everything measured about it lives in AssayResult and AdmetProfile.
    attributes:
      - name: id
        type: string
        pk: true
      - name: compound_number
        type: string
        unique: true
        help: The internal registration number, the identifier the compound is known by everywhere else.
      - name: smiles
        type: string
        help: The chemical structure in SMILES notation. This is the definition of the compound; everything else is derived from it or measured about it.
      - name: inchi_key
        type: string
        optional: true
        help: The hashed structure identifier, computed on registration. It is what makes duplicate registration detectable.
      - name: common_name
        type: string
        optional: true
        help: A human name for the compound where it has one.
      - name: cas_number
        type: string
        optional: true
        help: The CAS registry number, where the compound is a known substance.
      - name: formula
        type: string
        optional: true
        help: The molecular formula, computed from the structure.
      - name: compound_class
        type: string
        enum: CompoundClass
        help: What kind of molecule this is. Most discovery compounds are small molecules; fragments are handled differently because they are deliberately weak.
      - name: compound_series_id
        type: string
        fk: true
        optional: true
        help: The chemical series this compound belongs to, where it belongs to one.
      - name: molecular_weight
        type: decimal
        optional: true
        help: Molecular weight in daltons, computed from the structure.
      - name: logp
        type: decimal
        optional: true
        help: Calculated lipophilicity. High logP buys potency and costs solubility, which is the oldest trade in medicinal chemistry.
      - name: tpsa
        type: decimal
        optional: true
        help: Topological polar surface area, in square angstroms. It predicts whether a molecule can cross a membrane.
      - name: hydrogen_bond_donors
        type: integer
        optional: true
        help: Count of hydrogen bond donors, computed from the structure.
      - name: hydrogen_bond_acceptors
        type: integer
        optional: true
        help: Count of hydrogen bond acceptors, computed from the structure.
      - name: rotatable_bonds
        type: integer
        optional: true
        help: Count of rotatable bonds. More flexibility usually means a worse binder and worse oral absorption.
      - name: lipinski_violations
        type: integer
        optional: true
        help: How many of Lipinski's four rule-of-five criteria the compound breaks. Two or more is a warning rather than a verdict.
        min: 0
        max: 4
      - name: registration_status
        type: string
        enum: CompoundRegistrationStatus
        help: Where the compound is in registration. Only an approved compound may be screened.
      - name: registered_by_id
        type: string
        fk: true
        help: The chemist who registered the structure.
    indexes:
      - columns: [compound_number]
        unique: true
      - columns: [inchi_key]
  - name: Assay
    help: A defined way of measuring something about a compound. The definition is separate from the running of it because the same assay is run hundreds of times, and a result is only comparable with another when both came from the same assay definition.
    attributes:
      - name: id
        type: string
        pk: true
      - name: assay_code
        type: string
        unique: true
        help: The short code the assay is known by on plates and in reports.
      - name: name
        type: string
        help: A readable description of what the assay measures.
      - name: assay_type
        type: string
        enum: AssayType
        help: Whether this is a purified-protein assay, a cell assay, a biophysical measurement, an ADMET endpoint, a selectivity panel or an animal study.
      - name: readout
        type: string
        enum: AssayReadout
        help: What the assay reports — a potency value, a percentage inhibition, a half-life, a permeability.
      - name: unit
        type: string
        enum: MeasurementUnit
        help: The unit the readout is expressed in. A number without its unit is not a result.
      - name: target_id
        type: string
        fk: true
        optional: true
        help: The target this assay measures activity against, where it measures one.
      - name: protocol_reference
        type: string
        optional: true
        help: A reference to the written protocol the assay follows.
      - name: acceptance_z_prime
        type: decimal
        optional: true
        help: The lowest Z-prime a run of this assay may have and still be trusted. Below it, the plate is noise.
      - name: is_active
        type: boolean
        help: Whether the assay is still available to be run.
    indexes:
      - columns: [assay_code]
        unique: true
  - name: AssayRun
    help: "One execution of an assay — typically one plate, on one instrument, on one day, by one operator. The run is where quality is judged: if its Z-prime is below the assay's acceptance threshold, every result on the plate is suspect no matter how good the numbers look."
    attributes:
      - name: id
        type: string
        pk: true
      - name: run_reference
        type: string
        unique: true
        help: The identifier for this run, used to trace a result back to the day and plate it came from.
      - name: assay_id
        type: string
        fk: true
        help: The assay definition being executed.
      - name: experiment_id
        type: string
        fk: true
        optional: true
        help: The experiment this run was scheduled under, where it was scheduled under one.
      - name: instrument_id
        type: string
        fk: true
        optional: true
        help: The instrument that read the plate.
      - name: operated_by_id
        type: string
        fk: true
        help: The person who ran the plate.
      - name: run_date
        type: date
        help: The date the plate was run.
      - name: plate_barcode
        type: string
        optional: true
        help: The barcode of the physical plate, which is how the run is matched to the raw instrument file.
      - name: z_prime
        type: decimal
        optional: true
        help: The statistical quality of the plate, between minus infinity and 1. Above 0.5 is a good assay; below the assay's threshold the run is rejected.
        min: -10
        max: 1
      - name: qc_status
        type: string
        enum: QcStatus
        help: Whether the run has passed quality control. Results from a failed run must not be used to make decisions.
      - name: status
        type: string
        enum: AssayRunStatus
        help: Where the run has got to, from scheduled to completed or failed.
      - name: retest_count
        type: integer
        optional: true
        help: How many times this run has been retested after a failure. A plate that keeps failing is an assay problem, not a compound problem.
      - name: failure_reason
        type: text
        optional: true
        help: Why the run failed, where it did.
    indexes:
      - columns: [run_reference]
        unique: true
  - name: AssayResult
    help: "One compound's measurement from one run. This is the row the whole application exists to produce: a number, its unit, and enough context to know whether to believe it."
    parent: AssayRun
    attributes:
      - name: id
        type: string
        pk: true
      - name: assay_run_id
        type: string
        fk: true
        help: The run this measurement came from.
      - name: compound_id
        type: string
        fk: true
        help: The compound that was measured.
      - name: value
        type: decimal
        help: The measured number, in the unit beside it.
      - name: unit
        type: string
        enum: MeasurementUnit
        help: The unit of the measurement. Kept on the result as well as the assay because units are occasionally reported differently for the same assay.
      - name: qualifier
        type: string
        enum: ResultQualifier
        help: Whether the value is exact or a bound. A compound too weak to measure gives a greater-than, and treating that as an exact number is a classic way to mislead a project.
      - name: replicate_count
        type: integer
        optional: true
        help: How many replicates the value is averaged over.
        min: 1
      - name: standard_deviation
        type: decimal
        optional: true
        help: The spread across replicates, which is how much of the value to trust.
      - name: is_validated
        type: boolean
        help: Whether a scientist has reviewed and accepted this result.
    indexes:
      - columns: [compound_id, assay_run_id]
  - name: AdmetProfile
    help: What is known about whether a compound could behave like a drug — absorption, distribution, metabolism, excretion and toxicity. Kept apart from Compound because each endpoint is measured separately, at different times, by different people, and a potent compound can be killed by any one of them.
    parent: Compound
    attributes:
      - name: id
        type: string
        pk: true
      - name: compound_id
        type: string
        fk: true
        help: The compound this profile describes.
      - name: kinetic_solubility_um
        type: decimal
        optional: true
        help: How much of the compound will dissolve, in micromolar. A compound that will not dissolve cannot be dosed and often cannot even be assayed honestly.
      - name: caco2_permeability
        type: decimal
        optional: true
        help: Apparent permeability through a Caco-2 cell monolayer, the standard laboratory stand-in for absorption across the gut wall.
      - name: microsomal_half_life_min
        type: decimal
        optional: true
        help: How long the compound survives in liver microsomes, in minutes. Short half-lives mean the liver clears the drug before it can work.
      - name: herg_ic50_um
        type: decimal
        optional: true
        help: "Potency against the hERG cardiac ion channel. Here a high number is the good outcome: hERG is an antitarget, and blocking it causes arrhythmia."
      - name: cyp3a4_inhibition_percent
        type: decimal
        optional: true
        help: How much the compound inhibits CYP3A4, the enzyme that metabolises much of the pharmacopoeia. Strong inhibition means drug-drug interactions.
        min: 0
        max: 100
      - name: plasma_protein_bound_percent
        type: decimal
        optional: true
        help: The percentage bound to plasma proteins. Only the unbound fraction is free to act, so a highly bound compound needs a much higher dose.
        min: 0
        max: 100
      - name: is_bbb_penetrant
        type: boolean
        optional: true
        help: Whether the compound crosses the blood-brain barrier. Required for a neuroscience programme and usually unwanted everywhere else.
      - name: ames_result
        type: string
        enum: AmesResult
        help: The outcome of the Ames mutagenicity test. A positive is normally the end of the compound.
      - name: assessed_on
        type: date
        help: The date this profile was compiled.
      - name: assessed_by_id
        type: string
        fk: true
        help: The DMPK scientist who compiled it.
  - name: Experiment
    help: A planned piece of laboratory work, reviewed and approved before it runs. The experiment is what instrument bookings, outsourced requests, samples and deviations all hang from, so it is the record an auditor follows to reconstruct what was done.
    attributes:
      - name: id
        type: string
        pk: true
      - name: title
        type: string
        help: What the experiment is called.
      - name: status
        type: string
        enum: ExperimentStatus
        help: Where the experiment has reached in its lifecycle, from draft to completed.
      - name: program_id
        type: string
        fk: true
        optional: true
        help: The programme the work is being done for.
      - name: pi_id
        type: string
        fk: true
        help: The principal investigator accountable for the experiment.
      - name: project_code
        type: string
        optional: true
        help: The code the work is charged to.
      - name: estimated_duration_days
        type: integer
        optional: true
        help: How many days the work is expected to take. Required before the experiment may be submitted.
        min: 1
      - name: is_gmp_critical
        type: boolean
        help: Whether the work falls under good manufacturing practice. It raises the bar on every deviation raised against it.
      - name: submitted_at
        type: datetime
        optional: true
        help: When the experiment was submitted for review.
      - name: completed_at
        type: datetime
        optional: true
        help: When the work finished.
      - name: objective
        type: text
        optional: true
        help: What the experiment is meant to establish.
  - name: Sample
    help: A physical quantity of material in a tube, plate or vial, in a known place. A sample is the thing a scientist can actually pick up, and the difference between the compound and the sample is the difference between a structure and eight microlitres of it in freezer A.
    attributes:
      - name: id
        type: string
        pk: true
      - name: sample_barcode
        type: string
        unique: true
        help: The barcode on the physical container. Scanning it is how the material is identified at the bench.
      - name: compound_id
        type: string
        fk: true
        optional: true
        help: The compound this material is, where it is a registered compound.
      - name: experiment_id
        type: string
        fk: true
        optional: true
        help: The experiment the sample was prepared for.
      - name: volume_ul
        type: decimal
        optional: true
        help: Volume on hand, in microlitres.
      - name: mass_mg
        type: decimal
        optional: true
        help: Mass on hand, in milligrams.
      - name: concentration_mm
        type: decimal
        optional: true
        help: Concentration of the solution, in millimolar.
      - name: physical_state
        type: string
        enum: SamplePhysicalState
        help: What form the material is in, which decides how it can be handled.
      - name: storage_location
        type: string
        optional: true
        help: Where the sample physically is — the freezer, shelf and rack.
      - name: storage_temperature
        type: string
        optional: true
        help: The temperature the sample must be kept at.
      - name: expiration_date
        type: date
        optional: true
        help: The date after which the material should not be trusted.
      - name: status
        type: string
        enum: SampleStatus
        help: Whether the sample is available, spoken for, used up or quarantined.
    indexes:
      - columns: [sample_barcode]
        unique: true
  - name: InventoryTransaction
    help: One movement of material — received, split into aliquots, consumed, moved, discarded or corrected. Samples are edited constantly, and a stock figure nobody can explain is worse than none, so every change to a sample leaves one of these behind.
    attributes:
      - name: id
        type: string
        pk: true
      - name: sample_id
        type: string
        fk: true
        help: The sample that moved.
      - name: performed_by_id
        type: string
        fk: true
        optional: true
        help: Who moved it. Empty when the movement was recorded automatically by the disposition process rather than by a person at the bench.
      - name: transaction_type
        type: string
        enum: InventoryTransactionType
        help: What kind of movement this was.
      - name: quantity_change
        type: decimal
        optional: true
        help: How much material was added or removed. Negative for a consumption.
      - name: from_location
        type: string
        optional: true
        help: Where the material was before.
      - name: to_location
        type: string
        optional: true
        help: Where it went.
      - name: occurred_at
        type: datetime
        optional: true
        help: When the movement happened, where that is known separately from when the row was written.
      - name: reason
        type: text
        optional: true
        help: Why, where the movement needs explaining.
  - name: Instrument
    help: "A piece of laboratory equipment that produces data. Calibration is the field that matters: an overdue instrument invalidates everything measured on it, which is why a booking is refused rather than warned about."
    attributes:
      - name: id
        type: string
        pk: true
      - name: asset_tag
        type: string
        unique: true
        help: The asset tag physically stuck to the instrument.
      - name: name
        type: string
        help: What people call it.
      - name: instrument_type
        type: string
        enum: InstrumentType
        help: What kind of instrument it is.
      - name: calibration_status
        type: string
        enum: CalibrationStatus
        help: Whether calibration is current, approaching, overdue or the instrument is out of service.
      - name: last_calibration_date
        type: date
        optional: true
        help: When it was last calibrated.
      - name: next_calibration_date
        type: date
        optional: true
        help: When calibration falls due.
      - name: location
        type: string
        optional: true
        help: Which laboratory it lives in.
      - name: is_active
        type: boolean
        help: Whether the instrument is in service. An inactive instrument cannot be booked.
    indexes:
      - columns: [asset_tag]
        unique: true
  - name: InstrumentBooking
    help: A reserved block of time on an instrument. Instruments are the scarce resource in most laboratories, so the booking is where contention is resolved and where an overdue calibration stops work before it starts.
    attributes:
      - name: id
        type: string
        pk: true
      - name: instrument_id
        type: string
        fk: true
        help: The instrument being booked.
      - name: experiment_id
        type: string
        fk: true
        help: The experiment the time is for.
      - name: booked_by_id
        type: string
        fk: true
        help: Who made the booking.
      - name: start_time
        type: datetime
        help: When the block starts.
      - name: end_time
        type: datetime
        help: When it ends.
      - name: status
        type: string
        enum: BookingStatus
        help: Whether the booking is pending, confirmed, running, finished or cancelled.
      - name: cancellation_reason
        type: text
        optional: true
        help: Why the booking was cancelled, where it was.
  - name: Vendor
    help: An external supplier or contract research organisation. Much of discovery chemistry and biology is outsourced, so a vendor's approval status and service tier decide what work may be sent where.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: The organisation's name.
      - name: vendor_type
        type: string
        enum: VendorType
        help: What the vendor does for you.
      - name: sla_tier
        type: string
        enum: SlaTier
        help: The service level agreed with them, which sets the turnaround you can rely on.
      - name: contact_email
        type: email
        optional: true
        help: The address work is arranged through.
      - name: contact_phone
        type: phone
        optional: true
        help: A number for when email is too slow.
      - name: country
        type: string
        optional: true
        help: Where the vendor operates, which affects shipping and what may be sent.
      - name: is_approved
        type: boolean
        help: Whether the vendor has passed qualification. Unapproved vendors may not be sent work.
  - name: VendorRequest
    help: A piece of work sent outside — a synthesis, a panel, an analysis. It is raised against an experiment so that outsourced results can be traced back to the work that needed them.
    attributes:
      - name: id
        type: string
        pk: true
      - name: request_number
        type: string
        unique: true
        help: The reference the request is tracked by with the vendor.
      - name: vendor_id
        type: string
        fk: true
        help: Who the work was sent to.
      - name: experiment_id
        type: string
        fk: true
        help: The experiment the work belongs to.
      - name: raised_by_id
        type: string
        fk: true
        help: Who raised the request.
      - name: description
        type: string
        help: What was asked for.
      - name: quoted_cost
        type: decimal
        optional: true
        help: The price quoted for the work.
      - name: required_date
        type: date
        optional: true
        help: The date the results are needed.
      - name: status
        type: string
        enum: VendorRequestStatus
        help: Where the request has got to.
    indexes:
      - columns: [request_number]
        unique: true
  - name: DeviationReport
    help: "A record that something did not go to plan. Deviations are the raw material of laboratory quality: severity is assigned by rule rather than by opinion, and a critical one opens a corrective action automatically."
    attributes:
      - name: id
        type: string
        pk: true
      - name: experiment_id
        type: string
        fk: true
        help: The experiment the deviation happened in.
      - name: reported_by_id
        type: string
        fk: true
        help: Who reported it.
      - name: severity
        type: string
        enum: DeviationSeverity
        help: How serious it is. Assigned by the routing rule rather than chosen by the reporter.
      - name: status
        type: string
        enum: DeviationStatus
        help: Where the investigation has reached.
      - name: anomaly_description
        type: text
        help: What happened, in enough detail for somebody who was not there.
      - name: anomaly_timestamp
        type: datetime
        help: When it happened, as distinct from when it was reported.
      - name: instrument_failure_involved
        type: boolean
        help: Whether equipment was implicated, which raises the severity and usually the scope.
  - name: CAPA
    help: A corrective and preventive action — what was done about a deviation, and what stops it happening again. A CAPA is closed only when its effectiveness has been verified, which is the whole difference between fixing an incident and fixing a process.
    attributes:
      - name: id
        type: string
        pk: true
      - name: deviation_report_id
        type: string
        fk: true
        help: The deviation this action answers.
      - name: remediation_owner_id
        type: string
        fk: true
        help: Who owns getting it done.
      - name: title
        type: string
        help: A short description of the action.
      - name: root_cause_category
        type: string
        enum: CapaRootCauseCategory
        help: What the investigation concluded was the underlying cause.
      - name: status
        type: string
        enum: CapaStatus
        help: Where the action has reached. Closing requires verification.
      - name: required_resolution_date
        type: date
        optional: true
        help: The date the action must be complete by, set from the severity.
      - name: effectiveness_metric
        type: decimal
        optional: true
        help: The measure used to judge whether the fix worked.
      - name: remediation_plan
        type: text
        optional: true
        help: What is actually going to be done.
  - name: User
    help: Somebody who works in the laboratory or on the portfolio. The role is what decides which of the entities above they can see at all.
    attributes:
      - name: id
        type: string
        pk: true
      - name: email
        type: email
        unique: true
        help: Their work address, which is also how they sign in.
      - name: first_name
        type: string
        help: Given name.
      - name: last_name
        type: string
        help: Family name.
      - name: role
        type: string
        enum: UserRole
        help: Their function, which determines what this application shows them.
      - name: team_id
        type: string
        fk: true
        optional: true
        help: The team they belong to.
      - name: department
        type: string
        optional: true
        help: The department they sit in.
      - name: is_active
        type: boolean
        help: Whether they still work here.
      - name: last_login
        type: datetime
        optional: true
        help: When they last signed in.
    indexes:
      - columns: [email]
        unique: true
  - name: Team
    help: A group of people who work together, usually around a technique or a programme.
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
        help: What the team is called.
      - name: manager_id
        type: string
        fk: true
        optional: true
        help: Who runs it.
      - name: department
        type: string
        optional: true
        help: The department the team belongs to.
