processes:
  - name: CriticalDeviationEscalation
    title: Critical Deviation Escalation
    entity: DeviationReport
    trigger: rule
    steps:
      - id: B
        type: Formula
        label: Stage base days
        properties:
          target: baseDays
          operation: set
          value: "3"
      - id: B2
        type: Decision
        label: Classify by severity
        properties:
          publish: baseDays
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Severity\",\"field\":\"severity\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Base days\",\"field\":\"baseDays\"}],\"rules\":[{\"_id\":\"critical\",\"i1\":\"'critical'\",\"o1\":\"1\"},{\"_id\":\"major\",\"i1\":\"'major'\",\"o1\":\"2\"}]}"
      - id: C
        type: Formula
        label: Compute resolution days
        properties:
          target: resolutionDays
          source: baseDays
          operation: multiply
          operand: "7"
      - id: D
        type: CreateEntity
        label: Open a CAPA
        properties:
          entity: bus_capa
          as: newCapaId
          fields: '{"title":"CAPA for deviation {{id}}","status":"open","root_cause_category":"under-review","deviation_report_id":"{{id}}","remediation_owner_id":"{{reported_by_id}}","required_resolution_date":"2026-12-31"}'
      - id: E
        type: UpdateEntity
        label: Escalate the deviation
        properties:
          field: status
          value: escalated
