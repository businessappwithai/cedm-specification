  # ---- Section 5: Business rule — Opportunity probability scoring -----------
  - name: opportunityScoring
    title: Opportunity Probability Scoring
    entity: Opportunity
    event: beforeUpdate
    priority: 20
    nodes:
      - id: S
        label: "Start: Opportunity Updated"
        type: start
      - id: Q1
        label: stage == closed_won?
        type: decision
      - id: W
        label: Set Probability 100%
        type: expression
      - id: Q2
        label: stage == closed_lost?
        type: decision
      - id: L
        label: Set Probability 0%
        type: expression
      - id: Q3
        label: stage == negotiation?
        type: decision
      - id: H
        label: Set Probability 70%
        type: expression
      - id: Q4
        label: stage == proposal?
        type: decision
      - id: M
        label: Set Probability 50%
        type: expression
      - id: D
        label: Set Probability 20%
        type: expression
      - id: C
        label: Recompute Forecast
        type: function
      - id: E
        label: "End: Scored"
        type: end
    edges:
      - from: S
        to: Q1
      - from: Q1
        to: W
        label: Yes
      - from: Q1
        to: Q2
        label: No
      - from: Q2
        to: L
        label: Yes
