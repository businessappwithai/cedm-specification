        to: E
  # ---- Section 6: Business rule — Activity validation ----------------------
  - name: activityValidation
    title: Activity Validation
    entity: Activity
    event: beforeCreate
    priority: 10
    nodes:
      - id: S
        label: "Start: Activity Create"
        type: start
      - id: Q1
        label: type == null?
        type: decision
      - id: E1
        label: "Prevent: Type is required"
        type: expression
      - id: Q2
        label: type not in valid enum?
        type: decision
      - id: E2
        label: "Prevent: Type must be one of: call, email, meeting, task, note"
        type: expression
      - id: Q3
