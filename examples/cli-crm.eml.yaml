      - id: E7
        label: "Prevent: Close date is required"
        type: expression
      - id: P
        label: Pass Validation
        type: expression
      - id: END
        label: "End: Validated"
        type: end
    edges:
      - from: S
        to: Q1
      - from: Q1
        to: E1
        label: Yes
      - from: Q1
        to: Q2
        label: No
      - from: Q2
        to: E2
        label: Yes
      - from: Q2
        to: Q3
        label: No
