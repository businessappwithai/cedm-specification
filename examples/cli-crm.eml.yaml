# ============================================================================
# EML — Simple CRM
# Reverse-engineered from generated-projects/simple-crm
# Entities: Account, Contact, Opportunity, Activity
# Every construct is drawn by the model viewer from this document.
# ============================================================================

# ---- Section 1: ERD --------------------------------------------------------

eml: "1.0"
name: Simple CRM
version: 1.0.0
enums:
  - name: OpportunityStage
    values: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
  - name: ActivityType
    values: [call, email, meeting, task, note]
entities:
  - name: Account
    prefix: bus
    attributes:
      - name: id
        type: string
        pk: true
      - name: name
        type: string
      - name: email
        type: string
        unique: true
      - name: phone
        type: string
  - name: Contact
    attributes:
      - name: id
        type: string
        pk: true
      - name: account_id
        type: string
        fk: true
      - name: first_name
        type: string
      - name: last_name
        type: string
      - name: email
        type: string
        unique: true
      - name: phone
        type: string
    indexes:
      - columns: [email]
        unique: true
  - name: Opportunity
    audited: true
    attributes:
      - name: id
        type: string
        pk: true
      - name: account_id
        type: string
        fk: true
      - name: name
        type: string
      - name: amount
        type: decimal
      - name: stage
        type: string
        enum: OpportunityStage
      - name: close_date
        type: datetime
    indexes:
      - columns: [account_id, stage]
  - name: Activity
    attributes:
      - name: id
        type: string
        pk: true
      - name: contact_id
        type: string
        fk: true
      - name: opportunity_id
        type: string
        fk: true
      - name: type
        type: string
        enum: ActivityType
      - name: description
        type: string
      - name: activity_date
        type: datetime
    indexes:
      - columns: [contact_id, activity_date]
relationships:
  - from: Account
    fromCardinality: exactly-one
    to: Contact
    toCardinality: zero-or-more
    label: employs
  - from: Account
    fromCardinality: exactly-one
    to: Opportunity
    toCardinality: zero-or-more
    label: has
  - from: Contact
    fromCardinality: exactly-one
    to: Activity
    toCardinality: zero-or-more
    label: logged_for
  - from: Opportunity
    fromCardinality: exactly-one
    to: Activity
    toCardinality: zero-or-more
    label: tracked_on
hooks:
  - entity: Contact
    event: beforeCreate
    handler: normalizeEmail
    fields: [email]
  - entity: Contact
    event: customValidate
    handler: ensureUniqueEmail
    fields: [email]
  - entity: Contact
    event: afterCreate
    handler: notifyAccountOwner
  - entity: Contact
    event: afterUpdate
    handler: syncContactData
  - entity: Activity
    event: beforeCreate
    handler: validateActivityDate
    fields: [activity_date]
  - entity: Activity
    event: afterCreate
    handler: updateOpportunityLastActivity
  - entity: Activity
    event: afterCreate
    handler: logActivityAudit
hookFlows:
  # ---- Section 8: Workflow — Contact lifecycle hooks -----------------------
  - name: ContactHooks
    title: Contact Hooks
    entity: Contact
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: normalizeEmail
      - id: D
        event: customValidate
        handler: ensureUniqueEmail
      - id: E
        label: Process Contact
      - id: F
        event: afterCreate
        handler: notifyAccountOwner
      - id: G
        event: afterUpdate
        handler: syncContactData
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  # ---- Section 9: Workflow — Activity lifecycle hooks ----------------------
  - name: ActivityHooks
    title: Activity Hooks
    entity: Activity
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeCreate
        handler: validateActivityDate
      - id: D
        label: Process Activity
      - id: E
        event: afterCreate
        handler: updateOpportunityLastActivity
      - id: F
        event: afterCreate
        handler: logActivityAudit
      - id: G
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
rbac:
  - entity: Opportunity
    action: update
    roles: [sales, manager]
  - entity: Opportunity
    action: close_won
    roles: [manager]
triggers:
  - entity: Opportunity
    source: cron:0 9 * * 1
    handler: nudgeStaleOpportunities
rules:
  # ---- Section 2: Business rule — Account validation ------------------------
  - name: accountValidation
    title: Account Validation
    entity: Account
    event: beforeCreate
    priority: 10
    nodes:
      - id: S
        label: "Start: Account Create"
        type: start
      - id: Q1
        label: name == null?
        type: decision
      - id: E1
        label: "Prevent: Name is required"
        type: expression
      - id: Q2
        label: email == null?
        type: decision
      - id: E2
        label: "Prevent: Email is required"
        type: expression
      - id: Q3
        label: email format invalid?
        type: decision
      - id: E3
        label: "Prevent: Email must be a valid email address"
        type: expression
      - id: Q4
        label: phone == null?
        type: decision
      - id: E4
        label: "Prevent: Phone is required"
        type: expression
      - id: P
        label: Pass Validation
        type: expression
      - id: END
        label: "End: Validated"
        type: end
    edges:
      - from: S
        to: Q1
      - from: Q1
        to: E1
        label: Yes
      - from: Q1
        to: Q2
        label: No
      - from: Q2
        to: E2
        label: Yes
      - from: Q2
        to: Q3
        label: No
      - from: Q3
        to: E3
        label: Yes
      - from: Q3
        to: Q4
        label: No
      - from: Q4
        to: E4
        label: Yes
      - from: Q4
        to: P
        label: No
      - from: E1
        to: END
      - from: E2
        to: END
      - from: E3
        to: END
      - from: E4
        to: END
      - from: P
        to: END
  # ---- Section 3: Business rule — Contact validation ------------------------
  - name: contactValidation
    title: Contact Validation
    entity: Contact
    event: beforeCreate
    priority: 10
    nodes:
      - id: S
        label: "Start: Contact Create"
        type: start
      - id: Q1
        label: first_name == null?
        type: decision
      - id: E1
        label: "Prevent: First name is required"
        type: expression
      - id: Q2
        label: last_name == null?
        type: decision
      - id: E2
        label: "Prevent: Last name is required"
        type: expression
      - id: Q3
        label: email == null?
        type: decision
      - id: E3
        label: "Prevent: Email is required"
        type: expression
      - id: Q4
        label: email format invalid?
        type: decision
      - id: E4
        label: "Prevent: Email must be a valid email address"
        type: expression
      - id: Q5
        label: phone == null?
        type: decision
      - id: E5
        label: "Prevent: Phone is required"
        type: expression
      - id: Q6
        label: account_id == null?
        type: decision
      - id: E6
        label: "Prevent: Account is required"
        type: expression
      - id: P
        label: Pass Validation
        type: expression
      - id: END
        label: "End: Validated"
        type: end
    edges:
      - from: S
        to: Q1
      - from: Q1
        to: E1
        label: Yes
      - from: Q1
        to: Q2
        label: No
      - from: Q2
        to: E2
        label: Yes
      - from: Q2
        to: Q3
        label: No
      - from: Q3
        to: E3
        label: Yes
      - from: Q3
        to: Q4
        label: No
      - from: Q4
        to: E4
        label: Yes
      - from: Q4
        to: Q5
        label: No
      - from: Q5
        to: E5
        label: Yes
      - from: Q5
        to: Q6
        label: No
      - from: Q6
        to: E6
        label: Yes
      - from: Q6
        to: P
        label: No
