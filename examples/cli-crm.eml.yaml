      - from: E2
        to: END
      - from: E3
        to: END
      - from: E4
        to: END
      - from: E5
        to: END
      - from: E6
        to: END
      - from: P
        to: END
  # ---- Section 4: Business rule — Opportunity validation --------------------
  - name: opportunityValidation
    title: Opportunity Validation
    entity: Opportunity
    event: beforeCreate
    priority: 10
    nodes:
      - id: S
        label: "Start: Opportunity Create"
        type: start
      - id: Q1
        label: name == null?
        type: decision
      - id: E1
        label: "Prevent: Name is required"
        type: expression
      - id: Q2
        label: amount == null?
        type: decision
      - id: E2
        label: "Prevent: Amount is required"
        type: expression
      - id: Q3
        label: amount <= 0?
        type: decision
      - id: E3
        label: "Prevent: Amount must be greater than zero"
        type: expression
      - id: Q4
        label: stage == null?
        type: decision
      - id: E4
        label: "Prevent: Stage is required"
        type: expression
      - id: Q5
        label: stage not in valid enum?
        type: decision
      - id: E5
        label: "Prevent: Stage must be a valid pipeline stage"
        type: expression
      - id: Q6
        label: account_id == null?
        type: decision
      - id: E6
        label: "Prevent: Account is required"
        type: expression
      - id: Q7
        label: close_date == null?
