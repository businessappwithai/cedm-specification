stateMachines:
  # ---- Section 7: Workflow — Opportunity lifecycle (state machine) ----------
  - name: OpportunityLifecycle
    title: Opportunity Lifecycle
    entity: Opportunity
    states: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
    initial: prospecting
    final: [closed_won, closed_lost]
    transitions:
      - from: prospecting
        to: qualification
        trigger: qualify
      - from: qualification
        to: proposal
        trigger: send_proposal
      - from: proposal
        to: negotiation
        trigger: negotiate
      - from: negotiation
        to: closed_won
        trigger: close_won
      - from: negotiation
        to: closed_lost
        trigger: close_lost
