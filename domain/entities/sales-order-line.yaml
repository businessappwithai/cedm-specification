entity:
  name: SalesOrderLine
  namespace: cedm.domain
  kind: transaction_line
  description: An individual commercial commitment within a SalesOrder identifying the product or service, quantity, unit, effective price, discounts, tax and fulfillment state. Transaction-time pricing is preserved as evidence and downstream quantities are reconciled from authoritative reservation and fulfillment events.
  ui:
    icon: shopping-cart
  identity: {key: salesOrderLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: salesOrderLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: 'The sales order line id of the sales order line: an identifier the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a sales order line cannot be understood without its sales order line id.'
      businessMeaning: "Lets reservations, shipments and invoice lines trace back to exactly this commitment, so each can be reconciled against what was ordered."
  - name: lineNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: 'The line number of the sales order line: a whole number the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a sales order line cannot be understood without its line number.'
      businessMeaning: "The line position the customer and staff quote when discussing a particular item on the order, its delivery or its invoice."
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: 'The quantity of the sales order line: a number the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a sales order line cannot be understood without its quantity.'
      businessMeaning: "How much the customer ordered on this line; it is the commitment the business must fulfil and the basis for pricing and invoicing."
  - name: quantityFulfilled
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: 'The quantity fulfilled of the sales order line: a number the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a sales order line cannot be understood without its quantity fulfilled.'
      businessMeaning: "How much has already been shipped or delivered; comparing it with the ordered quantity shows what is still outstanding."
  - name: quantityAllocated
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: 'The quantity allocated of the sales order line: a number the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: a sales order line cannot be understood without its quantity allocated.'
      businessMeaning: "How much stock is reserved for this line but not yet shipped; it tells planners whether the remaining quantity is covered."
  - name: unitPrice
    type: Money
    required: true
    help: {summary: "The price per unit agreed with the customer for this line when the order was placed.", usage: "Order valuation, invoicing, margin, credit and reconciliation.", relationshipContext: Must align with SalesOrder currency and UnitOfMeasure pricing basis., workflowRole: Authoritative commercial price for downstream billing unless controlled repricing occurs., businessMeaning: "The price per unit the customer agreed to; it is preserved at order time so invoicing charges what was agreed, even if the price list later changes."}
  - name: discountAmount
    type: Money
    required: false
    help: {summary: "The total reduction given on this line, taken off before tax is calculated.", usage: Reconciles net commercial value and invoice calculations., relationshipContext: Currency must match order pricing currency., workflowRole: Preserves the concession actually granted rather than relying on current DiscountRule., businessMeaning: "The reduction granted on this line; it is checked against discount authority and lowers the amount the customer is invoiced."}
  - name: taxAmount
    type: Money
    required: false
    help: {summary: Tax determined for the order line when tax is calculated at order stage., usage: Supports order and invoice reconciliation., relationshipContext: "Determination may depend on Product, Customer, address, location, date and TaxRule.", workflowRole: Preserves tax evidence when the order commits to a tax amount., businessMeaning: "The tax due on this line under the rules in force when it was ordered; it is charged on the invoice and reported to tax authorities."}
  - name: lineAmount
    type: Money
    required: true
    help: {summary: "The total value of this line after quantity, price and discount, which adds into the order total.", usage: "Supports order totals, invoicing, credit and reporting.", relationshipContext: "Must reconcile with pricing, discount, tax and rounding policy.", workflowRole: Financial baseline for downstream billing and reconciliation., businessMeaning: "What this line is worth to the business; it adds into the order total, revenue forecasts and the amount invoiced as the line is fulfilled."}
  - name: priceSource
    type: enum
    required: false
    values:
    - PRICE_LIST
    - CONTRACT
    - CUSTOMER_AGREEMENT
    - QUOTATION
    - MANUAL
    - PROMOTION
    - OTHER
    help:
      summary: 'The price source of the sales order line: a value the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      valueSemantics:
        PRICE_LIST: The price source of the sales order line is price list; set it when that is what the business means for
          this record.
        CONTRACT: The price source of the sales order line is contract; set it when that is what the business means for this
          record.
        CUSTOMER_AGREEMENT: The price source of the sales order line is customer agreement; set it when that is what the business
          means for this record.
        QUOTATION: The price source of the sales order line is quotation; set it when that is what the business means for this
          record.
        MANUAL: The price source of the sales order line is manual; set it when that is what the business means for this record.
        PROMOTION: The price source of the sales order line is promotion; set it when that is what the business means for this
          record.
        OTHER: The price source of the sales order line is other; set it when that is what the business means for this record.
      businessMeaning: "Where the price came from: the price list, a contract, a customer agreement, an accepted quotation, a promotion, a manual entry or something else; it explains the price if a customer disputes it and flags manual prices for review."
  - name: priceDeterminedAt
    type: datetime
    required: false
    help:
      summary: 'The price determined at of the sales order line: a point in time the business records on it.'
      usage: Entered or maintained when a sales order line is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the sales order line's other fields and its relationships; it is not meaningful
        on its own.
      businessMeaning: "When the price was settled, showing which price list, promotion or quotation was in force and supporting audit of the charged price."
  relationships:
  - name: salesOrder
    target: SalesOrder
    cardinality: '1'
    ownership: reference
    help:
      summary: Links a sales order line to sales order, the sales order it relates to.
      usage: Chosen from the existing sales order records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has exactly one sales order in this role.
      context: Lets the sales order line be found from, and reported with, its sales order.
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: Links a sales order line to product, the product it relates to.
      usage: Chosen from the existing product records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has exactly one product in this role.
      context: Lets the sales order line be found from, and reported with, its product.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links a sales order line to unit of measure, the unit of measure it relates to.
      usage: Chosen from the existing unit of measure records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has at most one unit of measure in this role.
      context: Lets the sales order line be found from, and reported with, its unit of measure.
  - name: shipments
    target: Shipment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links a sales order line to shipment, the shipments it relates to.
      usage: Chosen from the existing shipment records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has any number of shipment in this role.
      context: Lets the sales order line be found from, and reported with, its shipment.
  - name: reservations
    target: InventoryReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links a sales order line to inventory reservation, the reservations it relates to.
      usage: Chosen from the existing inventory reservation records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has any number of inventory reservation in this role.
      context: Lets the sales order line be found from, and reported with, its inventory reservation.
  - name: invoiceLines
    target: InvoiceLine
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links a sales order line to invoice line, the invoice lines it relates to.
      usage: Chosen from the existing invoice line records when the sales order line is created or edited.
      cardinalityMeaning: A sales order line has any number of invoice line in this role.
      context: Lets the sales order line be found from, and reported with, its invoice line.
  invariants:
  - {id: SALES-ORDER-LINE-001, rule: quantity must be greater than zero.}
  - {id: SALES-ORDER-LINE-002, rule: quantityAllocated must be between zero and quantity unless an authorized over-allocation policy applies.}
  - {id: SALES-ORDER-LINE-003, rule: quantityFulfilled must be between zero and quantity unless an authorized over-fulfillment policy applies.}
  - {id: SALES-ORDER-LINE-004, rule: lineNumber must be unique within its SalesOrder.}
  - {id: SALES-ORDER-LINE-005, rule: "lineAmount must reconcile with quantity, unitPrice, discounts, tax and configured rounding policy."}
  - {id: SALES-ORDER-LINE-006, rule: "unitPrice, discountAmount, taxAmount and lineAmount must use compatible currency semantics with SalesOrder."}
  - {id: SALES-ORDER-LINE-007, rule: "Changes to Product, PriceList, DiscountRule, TaxRule, Currency or UnitOfMeasure must not silently rewrite an executable line; affected open lines require controlled revalidation or repricing."}
  - {id: SALES-ORDER-LINE-008, rule: "If the line originated from a QuotationLine, accepted quotation pricing evidence must be retained unless authorized repricing occurs."}
  - {id: SALES-ORDER-LINE-009, rule: "Invoice generation must use effective transaction price and billing policy, not current Product or PriceList price."}
  - {id: SALES-ORDER-LINE-010, rule: quantityAllocated must be reconciled from active InventoryReservation evidence and must not be independently increased without the reservation workflow.}
  - {id: SALES-ORDER-LINE-011, rule: quantityFulfilled must be reconciled from accepted fulfillment/shipment evidence and must not be independently increased by changing Shipment status.}
  - {id: SALES-ORDER-LINE-012, rule: "A reservation consuming this line must reduce remaining reservation quantity and, when fulfillment posts, increase quantityFulfilled through one idempotent workflow."}
  - {id: SALES-ORDER-LINE-013, rule: "Shipment quantities attributed to this line must not exceed executable quantity minus already fulfilled quantity, except under an authorized over-fulfillment policy."}
  - {id: SALES-ORDER-LINE-014, rule: InvoiceLine quantities billed against this line must obey billing policy and must not silently exceed billable/fulfilled quantity where fulfillment-based billing is required.}
  - {id: SALES-ORDER-LINE-015, rule: "Cancelling or reducing the line with active reservations or open shipments requires controlled release, cancellation, reallocation or reconciliation of those dependencies before remaining quantity is changed."}
  - {id: SALES-ORDER-LINE-016, rule: "A fulfilled or financially posted line cannot be destructively reduced or deleted; corrections require explicit return, credit, debit or adjustment workflows."}
  - {id: SALES-ORDER-LINE-017, rule: "Every material quantity change must be attributable to an authoritative reservation, release, fulfillment, return, reversal or approved correction event."}
  - {id: SALES-ORDER-LINE-018, rule: Line-derived status and SalesOrder status must be recalculated atomically or through an idempotent recoverable workflow after dependent quantity events.}
  - {id: SALES-ORDER-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  - {id: SALES-ORDER-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  - {id: SALES-ORDER-LINE-EXE-003, rule: "Discount Amount cannot be negative.", violatedWhen: "discount_amount != null and discount_amount < 0", message: "Discount Amount cannot be negative."}
  - {id: SALES-ORDER-LINE-EXE-004, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
  - {id: SALES-ORDER-LINE-EXE-005, rule: "Line Amount cannot be negative.", violatedWhen: "line_amount != null and line_amount < 0", message: "Line Amount cannot be negative."}
  help:
    summary: Authoritative commercial commitment at product/quantity level, reconciling transaction pricing with allocation, fulfillment and billing evidence.
    businessMeaning: The line states what the customer agreed to buy and how it is priced. Reservations state committed stock, shipment/fulfillment events state what was delivered, and InvoiceLines state what was billed.
    usage: Order management, allocation, warehouse fulfillment, shipment, invoicing, credit, margin, customer service and audit.
    relationshipContext: SalesOrder supplies customer/currency context; Product/UOM define item and quantity semantics; InventoryReservation supplies allocation evidence; Shipment supplies transport/fulfillment evidence; InvoiceLine supplies financial claim evidence.
    workflowContext: Confirmed order line → availability → InventoryReservation → pick/issue → Shipment → accepted fulfillment → quantityFulfilled → billing. Cancellation/reduction releases or reconciles reservations and open shipments before changing remaining demand. Master-data changes trigger controlled revalidation.
    lifecycle: Draft → confirmed → allocated → partially fulfilled → fulfilled/cancelled. Historical pricing and fulfillment evidence remain reproducible.
    propagation: quantityAllocated follows reservation events; quantityFulfilled follows accepted fulfillment events; SalesOrder status follows line states; InvoiceLine follows billing policy; Product/UOM/pricing changes affect future or explicitly revalidated open work only.
    concurrency: Reservation, fulfillment, cancellation and billing allocation require concurrency control and idempotency to prevent double allocation, double fulfillment or double billing.
    example: A line requests 20 units. Twenty are reserved, 12 are shipped and accepted, leaving 8 executable. quantityAllocated and quantityFulfilled are updated from their respective workflows. Cancelling the remaining 8 releases the reservation and cancels open work without reversing the accepted 12.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SALES-ORDER-LINE}
