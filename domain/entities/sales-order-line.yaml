entity:
  name: SalesOrderLine
  namespace: cedm.domain
  kind: transaction_line
  description: An individual commercial commitment within a SalesOrder identifying exactly what product or service is requested, in what quantity, at what price, and how much remains to be fulfilled.
  identity: {key: salesOrderLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: salesOrderLineId
      type: uuid
      required: true
      immutable: true
      help: {summary: Immutable identity of the order commitment., usage: Used by allocation, fulfillment, shipment, invoicing, and audit., relationshipContext: Stable across downstream fulfillment records., workflowRole: Provides the key by which reservations, shipments, and invoices trace back to the exact demand., requiredMeaning: Every line must be independently traceable.}
    - name: lineNumber
      type: integer
      required: true
      minimum: 1
      help: {summary: Human-facing sequence within the parent order., usage: Used in documents and operational interfaces., relationshipContext: Scoped to SalesOrder., workflowRole: Provides a stable document-level reference., requiredMeaning: Required for order clarity.}
    - name: quantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help: {summary: Total quantity commercially committed on the line., usage: Drives allocation, fulfillment, pricing, and remaining-demand calculations., relationshipContext: Interpreted with Product and UnitOfMeasure., workflowRole: Baseline against which reserved, shipped, delivered, and invoiced quantities are reconciled., requiredMeaning: Required for a measurable commitment.}
    - name: quantityFulfilled
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help: {summary: Quantity accepted as fulfilled against this line under the applicable fulfillment policy., usage: Drives partial and full order fulfillment., relationshipContext: It is not automatically equal to quantity shipped; acceptance may occur at shipment, delivery, or another defined milestone., workflowRole: Used to derive remaining quantity and SalesOrder status., requiredMeaning: Required with zero before fulfillment begins.}
    - name: quantityAllocated
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help: {summary: Quantity for which supply or capacity has been committed but fulfillment is not yet complete., usage: Supports allocation visibility and prevents double commitment., relationshipContext: Allocation is distinct from physical stock movement and shipment., workflowRole: Changes when inventory or capacity is reserved and is released when allocation is cancelled or consumed according to policy., requiredMeaning: Required with zero when no allocation exists.}
    - name: unitPrice
      type: decimal
      required: true
      precision: 20
      scale: 4
      help: {summary: Agreed monetary price for one unit under the applicable pricing basis., usage: Used for line value, invoicing, margin, and reconciliation., relationshipContext: Interpreted with parent currency and unit of measure., workflowRole: Supplies financial value to downstream invoice generation., requiredMeaning: Required for a priced commitment.}
    - name: discountAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help: {summary: Approved monetary discount applied to the line., usage: Used for net pricing and invoice reconciliation., relationshipContext: Changes value, not quantity or fulfillment., workflowRole: Included in commercial calculation passed to billing., optionalMeaning: Optional when no discount applies.}
    - name: taxAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help: {summary: Tax assessed on the line., usage: Supports tax and billing reconciliation., relationshipContext: Depends on customer, product, location, date, and jurisdiction., workflowRole: Contributes to invoice totals when tax is determined at order stage., optionalMeaning: Optional when tax is calculated later.}
    - name: lineAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help: {summary: Calculated commercial value of the line., usage: Supports order total, credit, invoicing, and reporting., relationshipContext: Must reconcile with quantity, price, discount, tax treatment, and currency., workflowRole: Becomes source data for invoice calculation., requiredMeaning: Required once the line is executable.}
  relationships:
    - name: salesOrder
      target: SalesOrder
      cardinality: '1'
      ownership: reference
      help: {summary: Parent SalesOrder that owns the commitment., usage: Provides customer, organization, currency, delivery, and lifecycle context., cardinalityMeaning: Every line belongs to exactly one order., workflowRole: Parent controls activation, cancellation, and aggregate fulfillment state.}
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help: {summary: Product or service being committed., usage: Drives availability, fulfillment, pricing, tax, and inventory rules., cardinalityMeaning: Exactly one product/service per line., workflowRole: Identifies the stock or service requirement used by allocation and fulfillment.}
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: 0..1
      ownership: reference
      help: {summary: Measurement basis for quantity., usage: Supports conversion, inventory, fulfillment, and pricing., cardinalityMeaning: Optional only when the product has an unambiguous default., workflowRole: Must be resolved before quantity is allocated or fulfilled when ambiguity exists.}
    - name: shipments
      target: Shipment
      cardinality: 0..*
      ownership: reference
      help: {summary: Shipment executions that fulfill this line., usage: Provides shipment-to-demand traceability., cardinalityMeaning: Multiple shipments may fulfill one line., workflowRole: Shipment quantities contribute to fulfillment evidence and remaining demand according to acceptance policy.}
  invariants:
    - {id: SALES-ORDER-LINE-001, rule: quantity must be greater than zero.}
    - {id: SALES-ORDER-LINE-002, rule: quantityAllocated must be between zero and quantity unless an authorized over-allocation policy applies.}
    - {id: SALES-ORDER-LINE-003, rule: quantityFulfilled must be between zero and quantity unless an authorized over-fulfillment policy applies.}
    - {id: SALES-ORDER-LINE-004, rule: lineNumber must be unique within its SalesOrder.}
    - {id: SALES-ORDER-LINE-005, rule: lineAmount must be consistent with pricing calculation.}
  help:
    summary: Represents one measurable commercial commitment and the quantities committed, allocated, and fulfilled against it.
    businessMeaning: The line is the bridge between customer demand and downstream execution. It establishes the exact product/service and quantity that allocation, inventory, shipment, and invoicing processes must reconcile.
    usage: Used by order management, inventory allocation, warehouse execution, shipment planning, billing, customer service, and fulfillment analytics.
    relationshipContext: SalesOrder provides commercial context; Product identifies what is demanded; InventoryBalance and InventoryMovement provide stock execution; Shipment provides physical transport; Invoice provides financial claim evidence.
    workflowContext: Confirmed line → availability check → allocation/reservation → pick/issue → shipment → accepted fulfillment. Remaining quantity is quantity minus fulfilled quantity. Allocation is not fulfillment, shipment is not automatically delivery, and invoicing is not proof of physical fulfillment.
    lifecycle: Line lifecycle follows its parent order. Quantity may progress from unallocated to allocated to partially fulfilled to fully fulfilled. Historical fulfillment evidence must not be rewritten to alter the commercial commitment.
    example: A line orders 20 containers. Twelve are allocated and shipped in the first shipment, so quantityAllocated and quantityFulfilled reflect the applicable milestones. A second shipment fulfills the remaining eight and closes the line.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SALES-ORDER-LINE}
