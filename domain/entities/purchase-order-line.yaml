entity:
  name: PurchaseOrderLine
  namespace: cedm.domain
  kind: transaction_line
  description: An individual procurement commitment within a PurchaseOrder that preserves the transaction-time product, quantity, UOM, price, currency and fulfillment evidence used for receiving and invoice matching.
  identity: {key: purchaseOrderLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: purchaseOrderLineId, type: uuid, required: true, immutable: true}
  - {name: lineNumber, type: integer, required: true, minimum: 1}
  - {name: quantity, type: decimal, required: true, precision: 20, scale: 6}
  - {name: unitPrice, type: Money, required: true}
  - {name: lineAmount, type: Money, required: true}
  - {name: receivedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: acceptedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: outstandingQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - name: priceSource
    type: enum
    required: false
    values: [PRICE_LIST, CONTRACT, SUPPLIER_AGREEMENT, QUOTATION, MANUAL, OTHER]
    help:
      summary: Source used to determine the procurement price.
      usage: Supports audit, spend analysis, supplier negotiations and invoice matching.
      relationshipContext: Source metadata does not replace the transaction-time unitPrice.
      workflowRole: Explains the price determination used by the commitment.
      optionalMeaning: Optional when source attribution is not maintained.
  - name: priceDeterminedAt
    type: datetime
    required: false
    help:
      summary: Time at which the effective purchase price was determined.
      usage: Supports effective-dated pricing and audit.
      relationshipContext: Distinct from PurchaseOrder creation time.
      workflowRole: Anchors commercial pricing evidence.
      optionalMeaning: Optional where timing is not separately captured.
  relationships:
  - name: purchaseOrder
    target: PurchaseOrder
    cardinality: '1'
    ownership: reference
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: 0..1
    ownership: reference
  - name: goodsReceiptLines
    target: GoodsReceiptLine
    cardinality: 0..*
    ownership: reference
  - name: invoiceLines
    target: InvoiceLine
    cardinality: 0..*
    ownership: reference
  invariants:
  - {id: PURCHASE-ORDER-LINE-001, rule: quantity must be greater than zero.}
  - {id: PURCHASE-ORDER-LINE-002, rule: receivedQuantity must be zero or greater.}
  - {id: PURCHASE-ORDER-LINE-003, rule: acceptedQuantity must be zero or greater and must not exceed receivedQuantity.}
  - {id: PURCHASE-ORDER-LINE-004, rule: outstandingQuantity must not be negative and normally equals quantity minus acceptedQuantity after applicable policy adjustments.}
  - {id: PURCHASE-ORDER-LINE-005, rule: lineNumber must be unique within its PurchaseOrder.}
  - {id: PURCHASE-ORDER-LINE-006, rule: receivedQuantity and acceptedQuantity must reconcile to posted GoodsReceiptLine events rather than being independently changed without an approved reconciliation process.}
  - {id: PURCHASE-ORDER-LINE-007, rule: acceptedQuantity must not exceed quantity except where an explicit over-receipt tolerance or policy permits it.}
  - {id: PURCHASE-ORDER-LINE-008, rule: InvoiceLine matching must use accepted receipt evidence and applicable price/quantity tolerances; ordered quantity alone cannot establish a MATCHED invoice line.}
  - {id: PURCHASE-ORDER-LINE-009, rule: unitPrice and lineAmount must use the PurchaseOrder currency and reconcile under the configured pricing and rounding policy.}
  - {id: PURCHASE-ORDER-LINE-010, rule: Changes to Product, PriceList, DiscountRule, Currency or UnitOfMeasure must not silently rewrite an approved PurchaseOrderLine; affected open lines require explicit revalidation or repricing workflow.}
  - {id: PURCHASE-ORDER-LINE-011, rule: Invoice matching must use the effective PurchaseOrderLine price evidence, not a current Product or supplier price retrieved after the commitment was approved.}
  help:
    summary: Represents one measurable procurement commitment and its accumulated fulfillment and billing state while preserving agreed commercial pricing.
    businessMeaning: PurchaseOrderLine states what the buyer committed to purchase. GoodsReceiptLine records actual receiving. InvoiceLine records the supplier claim. Pricing master data determines future commitments but does not rewrite an approved commitment.
    usage: Purchasing, supplier communication, receiving, inventory, accounts payable, budgeting, supplier performance and three-way matching.
    relationshipContext: PurchaseOrder supplies Supplier, organization, currency and delivery context. Product and UOM define what and how much. GoodsReceiptLine supplies receipt evidence. InvoiceLine supplies financial claim evidence.
    workflowContext: Pricing determination → PurchaseOrderLine snapshot → approval → GoodsReceiptLine → inspection/acceptance → InventoryMovement; in parallel PurchaseOrderLine → InvoiceLine → price/quantity matching. Master changes affect future purchasing and trigger validation of open commitments.
    lifecycle: Created → approved/issued → partially/fully received → partially/fully billed → closed/cancelled according to policy. Historical commercial evidence remains reproducible.
    example: A PO line is approved at EUR 80 per unit. The supplier later changes its catalog price to EUR 85. The approved line remains EUR 80; a new PO may use EUR 85, while an explicit repricing workflow is required to alter an eligible open commitment.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PURCHASE-ORDER-LINE}
