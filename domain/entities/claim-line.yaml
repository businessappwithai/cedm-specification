entity:
  name: ClaimLine
  namespace: cedm.domain
  kind: insurance_claim_line
  description: A governed line-level insurance claim item representing one requested benefit, loss component, service or expense assessed against a specific Coverage.
  ui: {icon: list-checks}
  identity: {key: claimLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: claimLineId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the claim line., businessMeaning: Identifies one line-level claimed item independently of claim header and settlement., usage: "Claims adjudication, reporting and audit.", relationshipContext: InsuranceClaim supplies header context and Coverage supplies benefit/risk rules.}}
    - {name: lineNumber, type: integer, required: true, help: {summary: Human-facing sequence within the claim., businessMeaning: Supports ordered claim review and communication., usage: "Claims processing and integration.", relationshipContext: Unique within the parent InsuranceClaim under policy.}}
    - {name: description, type: string, required: true, maxLength: 1000, help: {summary: Description of the claimed benefit or loss item., businessMeaning: Explains the line-level subject of adjudication., usage: "Claims review and communication.", relationshipContext: Coverage provides structured policy context.}}
    - {name: claimedAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: Amount requested for this claim line., businessMeaning: Line-level claimant request before adjudication., usage: "Claims assessment and reporting.", relationshipContext: Currency is inherited or governed by Claim policy context.}}
    - {name: approvedAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: Amount approved after adjudication., businessMeaning: Insurer-recognized line benefit before settlement., usage: "Claims approval, reserves and settlement.", relationshipContext: "Must comply with Coverage limits, deductibles and policy terms."}}
    - name: status
      type: enum
      required: true
      default: SUBMITTED
      values: [SUBMITTED, ASSESSED, APPROVED, DENIED, SETTLED, CANCELLED]
      help: {summary: Lifecycle state of claim-line adjudication., businessMeaning: "Tracks review, decision and settlement progression.", usage: Claims operations and audit., relationshipContext: Header claim status may summarize but does not replace line decisions., valueSemantics: {SUBMITTED: Line was received., ASSESSED: Review is underway or completed without final decision., APPROVED: Benefit was approved., DENIED: Benefit was denied., SETTLED: Approved benefit has been settled., CANCELLED: Line was cancelled.}}
  relationships:
    - {name: claim, target: InsuranceClaim, cardinality: "1", ownership: reference, help: {summary: Parent InsuranceClaim containing this line., businessMeaning: "Supplies policy, claimant and loss context.", usage: Claims processing and reporting., cardinalityMeaning: Exactly one claim., workflowRole: Line lifecycle must remain compatible with claim lifecycle.}}
    - {name: coverage, target: Coverage, cardinality: "1", ownership: reference, help: {summary: Coverage against which this line is adjudicated., businessMeaning: "Supplies limits, deductibles and eligibility rules.", usage: Claims decisioning and exposure., cardinalityMeaning: Exactly one Coverage., workflowRole: Coverage must belong to the Claim policy and apply to the loss context.}}
    - {name: settlements, target: Settlement, cardinality: "0..*", ownership: reference, help: {summary: Settlements allocating payment or service against this claim line., businessMeaning: Separates adjudicated liability from actual settlement transactions., usage: "Claims payment and reconciliation.", cardinalityMeaning: Zero or many settlements for partial or multi-party payment., workflowRole: Total settlement must not exceed approved liability except under explicit adjustment policy.}}
  invariants:
    - {id: CLAIM-LINE-001, rule: lineNumber must be unique within the parent InsuranceClaim.}
    - {id: CLAIM-LINE-002, rule: claimedAmount and approvedAmount must be non-negative when supplied.}
    - {id: CLAIM-LINE-003, rule: Coverage must belong to the same InsurancePolicy as the parent claim.}
    - {id: CLAIM-LINE-004, rule: SETTLED line must reconcile to attributable Settlement evidence.}
  lifecycle:
    title: Claim Line Lifecycle
    attribute: status
    states: [SUBMITTED, ASSESSED, APPROVED, DENIED, SETTLED, CANCELLED]
    initial: SUBMITTED
    terminal: [DENIED, SETTLED, CANCELLED]
    transitions:
      - {from: SUBMITTED, to: ASSESSED, action: assess}
      - {from: SUBMITTED, to: CANCELLED, action: cancel}
      - {from: ASSESSED, to: APPROVED, action: approve}
      - {from: ASSESSED, to: DENIED, action: deny}
      - {from: ASSESSED, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: SETTLED, action: settle}
  help:
    summary: Provides line-level insurance claim adjudication and settlement traceability.
    businessMeaning: InsuranceClaim is the claim aggregate; ClaimLine evaluates a particular benefit/loss against Coverage; Settlement records actual discharge of approved liability.
    usage: Claims intake, adjudication, reserves, settlement, analytics and audit.
    relationshipContext: Claim and Coverage are mandatory; Settlements provide downstream payment/service evidence.
    lifecycle: Lines are submitted, assessed and then approved, denied, settled or cancelled with decisions retained.
    example: A vehicle repair claim has separate parts and towing ClaimLines evaluated against different Coverage components.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CLAIM-LINE}
