entity:
  name: ServiceContract
  namespace: cedm.domain
  kind: service_contract_specialization
  description: A governed operational specialization of a Contract that defines service coverage, effective period, customer scope, service levels and entitlement basis without duplicating the legal agreement.
  ui: {icon: file-badge}
  identity: {key: serviceContractId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: serviceContractId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the service-contract specialization., businessMeaning: Identifies operational service coverage independently of the generic Contract identity., usage: "Service operations, entitlement, billing, reporting and audit.", relationshipContext: Required Contract relationship supplies the legal/commercial agreement., requiredMeaning: Required.}}
    - {name: serviceContractNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing service contract reference., businessMeaning: Operational identifier for service coverage administration., usage: "Customer service, renewals, entitlement and reporting.", relationshipContext: May differ from generic Contract number., requiredMeaning: Required.}}
    - {name: effectiveFrom, type: date, required: true, help: {summary: First date service coverage is effective., businessMeaning: Starts entitlement and service-policy applicability., usage: "Coverage validation, renewal and reporting.", relationshipContext: Must be compatible with the governing Contract., requiredMeaning: Required.}}
    - {name: effectiveTo, type: date, required: false, help: {summary: Last date of service coverage., businessMeaning: Ends ordinary service entitlement under this specialization., usage: "Coverage validation and renewal.", relationshipContext: Must not precede effectiveFrom and normally cannot exceed governing Contract scope., optionalMeaning: Optional for open-ended coverage.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED]
      help:
        summary: Lifecycle state of service coverage.
        businessMeaning: Controls eligibility for new service work while preserving historical coverage decisions.
        usage: Entitlement, service authorization, renewal and audit.
        relationshipContext: Generic Contract lifecycle remains separately authoritative for legal agreement status.
        valueSemantics:
          DRAFT: Operational coverage is being prepared.
          ACTIVE: Coverage may support new eligible service.
          SUSPENDED: Coverage is temporarily unavailable for new ordinary authorization.
          EXPIRED: Effective period ended.
          TERMINATED: Coverage was ended early through governed process.
        requiredMeaning: Required.
  relationships:
    - {name: contract, target: Contract, cardinality: "1", ownership: reference, help: {summary: Generic legal or commercial Contract underlying this service specialization., businessMeaning: Prevents duplicate modeling of parties, clauses and legal obligations., usage: "Legal traceability, renewals and compliance.", cardinalityMeaning: Exactly one Contract., workflowRole: Service coverage cannot outlive or contradict governing Contract terms without explicit amendment.}}
    - {name: customer, target: Customer, cardinality: "1", ownership: reference, help: {summary: Customer receiving contracted service coverage., businessMeaning: Establishes the commercial beneficiary of service rights., usage: "Entitlement, case management and billing.", cardinalityMeaning: Exactly one Customer in this baseline specialization., workflowRole: Customer must be consistent with governing Contract parties.}}
    - {name: serviceLevelAgreements, target: ServiceLevelAgreement, cardinality: "0..*", ownership: reference, help: {summary: SLAs applicable under this service contract., businessMeaning: Converts contractual service commitments into measurable operational targets., usage: "Case, ticket and order deadline management.", cardinalityMeaning: Zero or many SLAs., workflowRole: Applied SLA/version must be retained for historical service evidence.}}
    - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: aggregate, help: {summary: Specific service rights granted under this contract., businessMeaning: Expresses covered products, assets, limits or service types without bloating the contract header., usage: "Service authorization and consumption.", cardinalityMeaning: Zero or many Entitlements., workflowRole: Entitlement effective periods and scope must remain within the contract.}}
    - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {summary: Service execution orders governed by this contract., businessMeaning: Preserves contract-to-execution traceability., usage: "Coverage, billing, compliance and audit.", cardinalityMeaning: Zero or many orders., workflowRole: Each covered order must have been eligible at authorization time.}}
  invariants:
    - {id: SERVICE-CONTRACT-001, rule: effectiveTo must not precede effectiveFrom.}
    - {id: SERVICE-CONTRACT-002, rule: ACTIVE service coverage requires an eligible governing Contract and consistent Customer party.}
    - {id: SERVICE-CONTRACT-003, rule: Historical service decisions retain the ServiceContract, Entitlement and SLA terms applied at authorization time.}
  lifecycle:
    title: Service Contract Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: DRAFT, to: TERMINATED, action: terminate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
  help:
    summary: Adds service-specific operational coverage to a generic Contract.
    businessMeaning: Contract remains the legal agreement; ServiceContract defines service administration, SLA applicability and entitlement scope.
    usage: Customer service, field service, renewals, entitlement, billing, compliance and audit.
    relationshipContext: Contract is mandatory, Customer is the service beneficiary, SLAs provide measurable commitments and Entitlements define concrete rights.
    lifecycle: Draft coverage becomes active, may suspend, and eventually expires or terminates while historical service authorization remains reproducible.
    example: A three-year equipment-support Contract has a ServiceContract with a four-hour SLA and separate Entitlements for each covered Asset.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERVICE-CONTRACT}
