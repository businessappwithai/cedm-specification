entity:
  name: Activity
  namespace: cedm.domain
  kind: crm_activity
  description: A governed CRM interaction or planned action such as a call, meeting, email, visit, or follow-up associated with commercial parties and opportunities.
  ui:
    icon: activity
  identity: {key: activityId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: activityId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of the activity., usage: 'Generated when the activity is logged; notes, follow-ups and reports refer to it.'}}
    - {name: code, type: string, required: false, maxLength: 120, help: {summary: An optional reference number or code for the activity., usage: 'Used when an external system, such as a calendar or telephony system, supplies its own reference, so the same interaction is not logged twice.'}}
  relationships: []
  invariants:
    - {id: ACTIVITY-001, rule: "Lifecycle changes, corrections and retries must preserve historical evidence and must not duplicate downstream commercial, physical or financial effects."}
  help:
    summary: A planned or completed customer-facing interaction, such as a call, meeting, email, visit or follow-up, recorded against a party or opportunity.
    businessMeaning: Activities are the trail of contact behind a commercial relationship. They show what was done for a customer or prospect, by whom and what comes next, so sales and service teams do not work blind.
    usage: Logged by sales and service staff as they plan or complete interactions, and by integrations such as email and calendar sync; read when preparing for a contact or reviewing account history.
    relationshipContext: Activities connect to the commercial parties and opportunities they concern, which gives the interaction its business meaning.
    lifecycle: An activity is planned, then completed when it happens or cancelled if it does not. Completed activities are history and are not rewritten; a follow-up is a new activity.
    example: A product demo meeting with the buyer's procurement team, scheduled for Tuesday and logged as completed with a note to send a proposal.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ACTIVITY}
