entity:
  name: BankAccount
  namespace: cedm.domain
  kind: financial_master_entity
  description: A financial institution account maintained for a Party and used as the controlled account context for cash receipts, disbursements, bank transactions, reconciliation, treasury operations, and accounting.
  identity:
    key: bankAccountId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: bankAccountId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the internal BankAccount master record.
      businessMeaning: Identifies the account independently of its institution, number, currency, or current lifecycle state.
      usage: Used by Payment, BankTransaction, reconciliation, treasury, accounting, and integrations.
      relationshipContext: The identifier is the CEDM identity; accountNumber is an operational banking identifier.
      workflowRole: Provides the stable account context for payment execution and statement reconciliation.
      requiredMeaning: Required for account traceability.
  - name: accountNumber
    type: string
    required: true
    maxLength: 100
    help:
      summary: Banking identifier for the account, subject to applicable security and masking controls.
      businessMeaning: Identifies the account at the financial institution for operational settlement and reconciliation.
      usage: Used for payment routing, bank-feed matching, statements, and treasury operations, subject to sensitive-data controls.
      relationshipContext: Must be interpreted with institution and account identity; it is not a CEDM entity identifier.
      workflowRole: Allows external bank activity and payment instructions to be associated with the correct account.
      requiredMeaning: Required where the banking institution provides an account identifier.
  - name: accountType
    type: enum
    required: true
    values: [CURRENT, SAVINGS, LOAN, ESCROW, OTHER]
    help:
      summary: Classification of the banking account's operational purpose.
      businessMeaning: Describes how the account is intended to function in treasury and settlement processes.
      usage: Used for payment eligibility, cash reporting, treasury controls, and accounting configuration.
      relationshipContext: Account type does not determine accounting treatment by itself; ledger configuration may provide additional context.
      workflowRole: Helps determine which Payment directions and banking operations are appropriate.
      valueSemantics:
        CURRENT: Operational transaction account normally used for frequent receipts/disbursements.
        SAVINGS: Account primarily maintained for savings or reserve purposes.
        LOAN: Account associated with borrowing or loan-related banking arrangements.
        ESCROW: Account holding funds under controlled escrow arrangements.
        OTHER: Controlled account type outside the standard classifications.
      requiredMeaning: Required for account governance.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    immutableAfterActivation: true
    help:
      summary: Currency in which the bank account is normally denominated.
      businessMeaning: Establishes the account's primary monetary denomination and expected statement currency.
      usage: Used by Payment, BankTransaction, reconciliation, cash reporting, and treasury controls.
      relationshipContext: A BankTransaction normally uses the account currency, although supported multi-currency bank products may require additional transaction-level currency rules.
      workflowRole: Provides a currency baseline for validating Payment and BankTransaction activity.
      requiredMeaning: Required for monetary account interpretation.
  - name: status
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACTIVE, BLOCKED, CLOSED]
    help:
      summary: Lifecycle state controlling whether the account can participate in new banking operations.
      businessMeaning: Indicates whether the account is awaiting activation, available, restricted, or closed.
      usage: Used by Payment execution, bank-feed ingestion, reconciliation, treasury, and account administration.
      relationshipContext: Closing an account must not invalidate historical BankTransactions, Payments, or JournalEntries.
      workflowRole: ACTIVE permits normal use; BLOCKED prevents applicable new activity; CLOSED prevents new normal use while historical evidence remains accessible.
      valueSemantics:
        PENDING: Account setup or verification is incomplete.
        ACTIVE: Available for authorized banking activity.
        BLOCKED: Temporarily prohibited from applicable activity.
        CLOSED: Permanently unavailable for new normal activity.
      requiredMeaning: Required for account lifecycle control.
  relationships:
  - name: owners
    target: Party
    cardinality: 1..*
    ownership: reference
    help:
      summary: Parties that own or are legally associated with the bank account.
      usage: Supports ownership validation, payment authorization, treasury, compliance, and reporting.
      cardinalityMeaning: One or more parties may be associated with an account because joint ownership or organizational structures may exist.
      workflowRole: Provides the party context required when initiating or receiving payments through the account.
  - name: institution
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Financial institution maintaining the bank account.
      usage: Supports bank-feed configuration, payment routing, statements, reconciliation, and institution-specific rules.
      cardinalityMeaning: Exactly one institution maintains the account in this model.
      workflowRole: Connects account operations to the correct banking organization.
  - name: transactions
    target: BankTransaction
    cardinality: 0..*
    ownership: reference
    help:
      summary: Bank transactions appearing on this account's statements.
      usage: Supports statement history, reconciliation, cash analysis, and audit.
      cardinalityMeaning: An account can have many bank transactions over its lifetime.
      workflowRole: Provides the external evidence stream reconciled against Payments and accounting.
  - name: payments
    target: Payment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Internal Payment events executed through or expected to settle through this bank account.
      usage: Supports payment execution, receipt processing, cash management, and reconciliation.
      cardinalityMeaning: An account can support many Payments.
      workflowRole: Connects internal settlement events to the bank account context used for execution and clearing.
  invariants:
  - id: BANK-ACCOUNT-001
    rule: accountNumber and institution context must identify the intended external banking account under applicable uniqueness policy.
  - id: BANK-ACCOUNT-002
    rule: A CLOSED or BLOCKED BankAccount must not be selected for incompatible new Payment execution or receipt processing without an authorized exception.
  - id: BANK-ACCOUNT-003
    rule: Historical BankTransactions, Payments, and JournalEntries associated with a BankAccount must remain valid after the account is CLOSED.
  - id: BANK-ACCOUNT-004
    rule: BankTransaction matching must validate the BankAccount context before supporting Payment.CLEARED.
  - id: BANK-ACCOUNT-005
    rule: Account currency must be compatible with normal Payment and BankTransaction currency expectations; supported multi-currency account behavior requires an explicit account-level policy.
  help:
    summary: Represents the controlled banking account context through which cash is received, disbursed, observed, and reconciled.
    businessMeaning: BankAccount is master data for the financial account; it is not a bank transaction, payment, or accounting entry.
    usage: Central to treasury, Payment execution, BankTransaction ingestion, bank reconciliation, cash reporting, and accounting.
    relationshipContext: Party provides ownership context. Organization provides the financial institution. Payment represents internal settlement events. BankTransaction represents external statement evidence. JournalEntry represents accounting consequences.
    workflowContext: BankAccount setup → verification → activation → Payment execution/receipt → BankTransaction import → account/date/currency/reference reconciliation → Payment clearing → accounting reconciliation. Account closure affects future activity but preserves historical evidence.
    lifecycle: Pending → active → blocked or closed. Lifecycle controls future operational use and never deletes historical transactions.
    example: A USD current account at a bank is ACTIVE. Customer Payments are received into it, corresponding USD BankTransactions are imported from the bank feed, each is reconciled to the appropriate Payment, and the Payment becomes CLEARED only after controlled matching.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-BANK-ACCOUNT
