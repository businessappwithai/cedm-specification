entity:
  name: EnergyTariff
  namespace: cedm.domain
  kind: utilities_entity
  description: A pricing schedule defining charges for consumption, demand, connection, or other utility services.
  ui:
    icon: zap
    recordLabel: [tariffCode, name]
  identity:
    key: tariffId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tariffId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the energy tariff record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a energy tariff store this identifier. The number or code people quote is a separate field.
  - name: tariffCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the tariff.
      usage: Used on contracts and bills.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the tariff.
      usage: Shown on contracts and bills.
      relationshipContext: Identifies it for customers.
  - name: effectiveFrom
    type: date
    required: true
    help:
      summary: The first day the tariff applies.
      usage: Consumption from this day is priced at it.
      relationshipContext: Not later than the effective-to date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day the tariff applies.
      usage: Empty while it applies until replaced.
      relationshipContext: Tariffs of one provider and product do not overlap.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - EXPIRED
    - RETIRED
    help:
      summary: Whether the tariff is in force.
      usage: Moved on by its dates.
      relationshipContext: Expired tariffs remain for bills of past periods.
      valueSemantics:
        DRAFT: Being prepared.
        ACTIVE: In force.
        EXPIRED: Past its end date.
        RETIRED: Withdrawn.
  - name: unitRate
    type: decimal
    required: true
    precision: 12
    scale: 6
    help:
      summary: The price per unit of energy.
      usage: Multiplied by consumption on the bill.
      relationshipContext: Per the tariff's unit of measure; the peak rate where there are bands.
  - name: offPeakUnitRate
    type: decimal
    required: false
    precision: 12
    scale: 6
    help:
      summary: The price per unit in off-peak hours, for time-of-use tariffs.
      usage: Applied to off-peak consumption.
      relationshipContext: Empty for single-rate tariffs.
  - name: standingCharge
    type: Money
    required: false
    help:
      summary: The fixed charge per billing period, whatever the consumption.
      usage: Added to every bill.
      relationshipContext: Per month unless stated otherwise.
  relationships:
  - name: provider
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The energy supplier offering the tariff.
      usage: Set when the tariff is recorded.
      cardinalityMeaning: Exactly one.
      context: Bills from this provider use its tariffs.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: '1'
    ownership: reference
    help:
      summary: The unit the rates are per, such as kWh or m³.
      usage: Set when the tariff is recorded.
      cardinalityMeaning: Exactly one.
      context: Readings are converted to it.
  invariants:
  - id: TARIFF-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: ENERGY-TARIFF-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Energy Tariff Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, EXPIRED, RETIRED]
    initial: DRAFT
    terminal: [EXPIRED, RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents a utilities entity called EnergyTariff within the CEDM business model.
    businessMeaning: EnergyTariff is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, UnitOfMeasure. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Energy retailers and procurement teams record the tariffs that price energy — unit rates, standing charges, time-of-use bands — with their validity, so bills can be computed or checked.
    lifecycle: Drafted, active during its validity, expired after its end date, and retired when withdrawn.
    example: Tariff EDF-PRO-HPHC-2024 'Professional peak/off-peak', 0.2128 EUR/kWh peak, 0.1612 EUR/kWh off-peak, standing charge 31.20 EUR/month, valid 1 February 2024 to 31 January 2025.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-TARIFF
