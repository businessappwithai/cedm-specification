entity:
  name: EnergyTariff
  namespace: cedm.domain
  kind: utilities_entity
  description: A pricing schedule defining charges for consumption, demand, connection, or other utility services.
  ui:
    icon: zap
  identity:
    key: tariffId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tariffId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the tariff record associated with this EnergyTariff. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets bills and cost calculations point to exactly this tariff version, even when the provider reuses a tariff name."
  - name: tariffCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of tariff code for the EnergyTariff. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The provider's or the business's short code for the tariff, quoted on bills and contracts to identify which rates apply."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The recognisable tariff name, such as Business Time-of-Use 2025, used when choosing or comparing tariffs."
  - name: effectiveFrom
    type: date
    required: true
    help:
      summary: Captures the business meaning of effective from for the EnergyTariff. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The first day these rates apply; consumption before it is priced under the previous tariff."
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective to for the EnergyTariff. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last day these rates apply; after it a different tariff must be used, and billing relies on it to split periods correctly."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - EXPIRED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyTariff records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyTariff; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of EnergyTariff.
        ACTIVE: Represents the active state or classification in the context of EnergyTariff.
        EXPIRED: Represents the expired state or classification in the context of EnergyTariff.
        RETIRED: Represents the retired state or classification in the context of EnergyTariff.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the tariff is still being set up, active and usable for billing, expired at the end of its validity, or retired and withdrawn."
  relationships:
  - name: provider
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects EnergyTariff to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a EnergyTariff.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects EnergyTariff to UnitOfMeasure so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about UnitOfMeasure records associated with a EnergyTariff.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: TARIFF-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: ENERGY-TARIFF-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Energy Tariff Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, EXPIRED, RETIRED]
    initial: DRAFT
    terminal: [EXPIRED, RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One energy tariff is a utility provider's price schedule for consumption, demand or connection charges, valid for a stated period and used to calculate bills and compare supply options."
    businessMeaning: EnergyTariff is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate EnergyTariff records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, UnitOfMeasure.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical EnergyTariff record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "The tariff is entered as a draft from the provider's published rates, activated from its effective date, and used by billing and cost forecasting to price meter readings; it expires when its validity ends or is retired if replaced early, while past bills keep referring to it."
