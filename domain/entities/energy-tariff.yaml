entity:
  name: EnergyTariff
  namespace: cedm.domain
  kind: utilities_entity
  description: A pricing schedule defining charges for consumption, demand, connection, or other utility services.
  ui:
    icon: zap
  identity:
    key: tariffId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: tariffId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the tariff.
        usage: Generated on creation; bills and meters refer to the tariff.
    - name: tariffCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the tariff in the provider's price list, such as RES-ELEC-2026.
        usage: Unique; assigned by the provider and quoted to customers.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The descriptive name of the tariff.
        usage: Shown on bills and in customer portals.
    - name: effectiveFrom
      type: date
      required: true
      help:
        summary: The first date on which the tariff applies.
        usage: Set when the tariff is approved; consumption from this date is priced by it.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The last date on which the tariff applies.
        usage: Set when the tariff is replaced; must not be before the start date.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - EXPIRED
        - RETIRED
      help:
        summary: Whether the tariff is available for billing.
        usage: Set by the provider; only ACTIVE tariffs are assigned to new customers.
        valueSemantics:
          DRAFT: Being prepared; not yet in force.
          ACTIVE: In force and used for billing.
          EXPIRED: Its period has ended; kept for past bills.
          RETIRED: Withdrawn before or after use; kept for history.
  relationships:
    - name: provider
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation that supplies the service and sets the tariff.
        usage: Set when the tariff is created.
        cardinalityMeaning: Exactly one provider, since tariffs are published by a single supplier.
        workflowRole: Identifies whose price list the tariff belongs to.
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: '1'
      ownership: reference
      help:
        summary: The unit in which quantities are priced, such as kilowatt-hour or cubic metre.
        usage: Chosen when the tariff is defined; readings must be converted to it.
        cardinalityMeaning: Exactly one unit.
        workflowRole: Makes sure that price and quantity use the same unit.
  invariants:
    - id: TARIFF-001
      rule: effectiveTo must not precede effectiveFrom.
    - {id: ENERGY-TARIFF-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Energy Tariff Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, EXPIRED, RETIRED]
    initial: DRAFT
    terminal: [EXPIRED, RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: A pricing schedule that sets the charges for consumption, demand, connection or other utility services.
    businessMeaning: A tariff turns metered quantities into money. Recording which rates apply from when allows any bill to be explained and recalculated.
    usage: Defined by the provider; assigned to customers or meters; read by billing.
    relationshipContext: A tariff is set by a provider Organization and prices a quantity in a UnitOfMeasure.
    lifecycle: A tariff is drafted, active during its effective period, and either expires or is retired when replaced.
    example: Residential electricity tariff 2026, 0.24 per kWh from 1 January to 31 December.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-TARIFF
