entity:
  name: BOMComponent
  namespace: cedm.domain
  kind: manufacturing_detail_entity
  description: A component line within a bill of material defining a required product or material quantity.
  ui:
    icon: table
    recordLabel: [sequence]
  identity:
    key: bomComponentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: bomComponentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the bom component record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a bom component store this identifier. The number or code people quote is a separate field.
  - name: sequence
    type: integer
    required: true
    help:
      summary: The position of the line in the bill, such as 10, 20, 30.
      usage: Lines are listed in this order.
      relationshipContext: Unique within the bill.
  - name: quantity
    type: decimal
    required: true
    precision: 18
    scale: 6
    help:
      summary: How much of the component is needed for the bill's base quantity.
      usage: Multiplied by the order quantity to give the requirement.
      relationshipContext: Greater than zero, in the component's unit.
  - name: scrapPercent
    type: decimal
    required: false
    precision: 8
    scale: 4
    minimum: 0
    help:
      summary: The share of the component expected to be lost in production.
      usage: Added to the requirement so enough is issued.
      relationshipContext: Between 0 and 100.
  - name: operationSequence
    type: integer
    required: false
    help:
      summary: The routing step at which the component is used.
      usage: Lets components be issued when that step starts.
      relationshipContext: Matches an operation's sequence in the product's routing.
  relationships:
  - name: billOfMaterial
    target: BillOfMaterial
    cardinality: '1'
    ownership: reference
    help:
      summary: The bill the line belongs to.
      usage: Set when the line is added.
      cardinalityMeaning: Every line belongs to exactly one bill.
      context: Listed under the bill.
  - name: componentProduct
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The part or material used.
      usage: Chosen when the line is added.
      cardinalityMeaning: Every line uses exactly one component.
      context: Its stock is reserved and issued for production.
  invariants:
  - id: BOM-COMPONENT-001
    rule: quantity must be greater than zero.
  - id: BOM-COMPONENT-002
    rule: scrapPercent must be zero or greater.
  - {id: BOM-COMPONENT-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  - {id: BOM-COMPONENT-EXE-002, rule: "Scrap Percent is a percentage between 0 and 100.", violatedWhen: "scrap_percent != null and (scrap_percent < 0 or scrap_percent > 100)", message: "Scrap Percent must be between 0 and 100."}
  help:
    summary: One component of a bill of materials and how much of it is needed.
    relationshipContext: The entity participates in a wider business graph through relationships with BillOfMaterial, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: Each line of a bill of materials says which part or material goes into the product, how much, at which step and with what expected scrap, so planning can order the right quantities, production can issue them, and costing can add them up.
    usage: Entered by product engineering; read by planning, production and costing.
    lifecycle: A component line follows its bill of materials; changes are made in a new version of the bill.
    example: 'Line 20 of BOM WIDGET-40 v3: 2 × bearing 6312 per unit, issued at operation 30, 1% scrap.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BOM-COMPONENT
