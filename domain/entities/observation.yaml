entity:
  name: Observation
  namespace: cedm.domain
  kind: research_observation
  description: A governed primary scientific observation or measurement captured from a Sample, Assay, Experiment or Study before or alongside downstream interpretation.
  ui: {icon: eye}
  identity: {key: observationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: observationId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this measurement, which later results and reports cite as their primary evidence.", businessMeaning: Identifies one primary evidence item independently of later interpretation., usage: "Research data, laboratory analysis, reproducibility and audit.", relationshipContext: Result may derive from one or more Observations., requiredMeaning: Required.}}
    - {name: observedAt, type: datetime, required: true, help: {summary: Timestamp at which evidence was observed or measured., businessMeaning: Establishes scientific chronology., usage: "Time-series analysis, reproducibility and audit.", relationshipContext: May differ from record-entry time., requiredMeaning: Required.}}
    - {name: observationType, type: string, required: true, maxLength: 160, help: {summary: "What property was measured or observed, such as pH, concentration, colour or cell count.", businessMeaning: Defines what property or phenomenon the value represents., usage: "Analysis, validation and reporting.", relationshipContext: Unit and value semantics depend on observation type., requiredMeaning: Required.}}
    - {name: value, type: string, required: true, maxLength: 2000, help: {summary: "The reading or description actually recorded, such as 7.42 or slight turbidity, exactly as captured at the time.", businessMeaning: Primary scientific evidence as captured under applicable method., usage: "Analysis, QC and reporting.", relationshipContext: Numeric interpretation may require UnitOfMeasure and method context., requiredMeaning: Required.}}
    - name: status
      type: enum
      required: true
      default: RECORDED
      values: [RECORDED, VERIFIED, INVALIDATED]
      help: {summary: "Whether the observation has just been recorded, has been verified by a reviewer, or has been invalidated as unusable.", businessMeaning: "Distinguishes captured evidence, verified evidence and explicitly invalidated evidence.", usage: "QC, analysis and audit.", relationshipContext: Invalidation preserves original evidence rather than deleting it., valueSemantics: {RECORDED: Evidence is captured., VERIFIED: Evidence passed applicable review/QC., INVALIDATED: Evidence is retained but excluded or flagged under governed reason.}, requiredMeaning: Required.}
  relationships:
    - {name: sample, target: Sample, cardinality: "0..1", ownership: reference, help: {summary: Sample from which the Observation originates., businessMeaning: Preserves specimen provenance., usage: "Traceability and interpretation.", cardinalityMeaning: Optional for non-sample observations., workflowRole: Sample lineage remains intact.}}
    - {name: assay, target: Assay, cardinality: "0..1", ownership: reference, help: {summary: Assay execution producing the Observation., businessMeaning: Preserves method/execution provenance., usage: "Laboratory analysis and audit.", cardinalityMeaning: Optional when captured outside an Assay., workflowRole: Completed Assay evidence retains observation identity.}}
    - {name: experiment, target: Experiment, cardinality: "0..1", ownership: reference, help: {summary: Experiment context producing the Observation., businessMeaning: Connects evidence to experimental execution., usage: "Research traceability and reproducibility.", cardinalityMeaning: Optional when Assay or Study is sufficient., workflowRole: Evidence remains historical after experiment closure.}}
    - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: "0..1", ownership: reference, help: {summary: Unit for quantitative observations., businessMeaning: Makes numerical evidence interpretable., usage: "Validation, analysis and integration.", cardinalityMeaning: Optional for qualitative/categorical values., workflowRole: Unit changes do not reinterpret historical values.}}
    - {name: results, target: Result, cardinality: "0..*", ownership: reference, help: {summary: Results derived partly or wholly from this Observation., businessMeaning: Preserves evidence-to-interpretation lineage., usage: "Analysis, reporting and audit.", cardinalityMeaning: Zero or many Results., workflowRole: Result validity depends on its source observation status and method.}}
  invariants:
    - {id: OBSERVATION-001, rule: "Observation must have at least one governed scientific context such as Sample, Assay or Experiment."}
    - {id: OBSERVATION-002, rule: Verified evidence is not destructively rewritten; corrections or invalidations remain explicit records or states.}
  lifecycle:
    title: Observation Lifecycle
    attribute: status
    states: [RECORDED, VERIFIED, INVALIDATED]
    initial: RECORDED
    terminal: [VERIFIED, INVALIDATED]
    transitions:
      - {from: RECORDED, to: VERIFIED, action: verify}
      - {from: RECORDED, to: INVALIDATED, action: invalidate}
  help:
    summary: "One raw scientific measurement or observation captured from a sample, assay or experiment, kept with its provenance and quality status before anyone interprets it."
    businessMeaning: Observation is raw or primary evidence; Result is a derived interpretation or summarized output.
    usage: Research, laboratories, life sciences, quality testing, analytics and audit.
    relationshipContext: Sample/Assay/Experiment provide provenance, UnitOfMeasure provides quantitative semantics, Results preserve downstream derivation.
    lifecycle: Observation is recorded, then verified or invalidated without destructive deletion.
    workflowContext: "A scientist or instrument records the observation during an assay or experiment, a reviewer then verifies it or invalidates it if the measurement is flawed, and verified observations feed downstream results and reports, while invalidated ones stay on record as evidence instead of being deleted."
    example: "An observation of pH 7.42 recorded from sample S-1043 during assay A-12, verified by the lab supervisor the next morning."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-OBSERVATION}
