entity:
  name: PartyRole
  namespace: cedm.domain
  kind: relationship_entity
  description: A business role assigned to a Party that defines how that party participates in a particular business context. PartyRole separates stable identity from changing roles such as Customer, Supplier, Employee, Carrier, Owner, or Partner and provides the lifecycle, validity, authorization, and organizational scope for that participation.
  ui:
    icon: users
  identity: {key: partyRoleId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: partyRoleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: "The permanent identity of this particular role held by a party, which role-specific records refer to."
      usage: Referenced by specialized entities and transactions requiring the party in a defined business capacity.
      relationshipContext: Distinct from Party.partyId and specialized identifiers such as Customer.customerId or Supplier.supplierId.
      workflowRole: Provides the stable role reference used throughout the role lifecycle.
      requiredMeaning: Required for independent role traceability.
      businessMeaning: "Lets the same party hold several roles, each tracked separately, so ending someone's supplier role does not affect them as a customer."
  - name: partyId
    type: reference
    target: Party
    required: true
    immutable: true
    help:
      summary: Identifies the underlying person or organization performing this role.
      usage: Provides common identity without duplicating Party data.
      relationshipContext: One Party may have multiple PartyRoles simultaneously or historically.
      workflowRole: Connects role-specific processing back to the canonical identity.
      requiredMeaning: Required because a role cannot exist without a participant.
      businessMeaning: "Which person or organization holds this role, so all of a party's roles and history can be seen together under one identity."
  - name: roleType
    type: enum
    required: true
    values: [CUSTOMER, SUPPLIER, EMPLOYEE, PARTNER, CARRIER, AGENT, CONTRACTOR, OWNER, INVESTOR, OTHER]
    help:
      summary: Defines the business capacity in which the Party participates.
      usage: Determines specialized capabilities, policies, workflows, and validations.
      relationshipContext: Separate from Party.partyType, which describes whether the participant is a person or organization.
      workflowRole: Selects the applicable downstream role specialization and business process.
      requiredMeaning: Required for contextual participation.
      valueSemantics:
        CUSTOMER: The role type of the party role is customer; set it when that is what the business means for this record.
        SUPPLIER: The role type of the party role is supplier; set it when that is what the business means for this record.
        EMPLOYEE: The role type of the party role is employee; set it when that is what the business means for this record.
        PARTNER: The role type of the party role is partner; set it when that is what the business means for this record.
        CARRIER: The role type of the party role is carrier; set it when that is what the business means for this record.
        AGENT: The role type of the party role is agent; set it when that is what the business means for this record.
        CONTRACTOR: The role type of the party role is contractor; set it when that is what the business means for this record.
        OWNER: The role type of the party role is owner; set it when that is what the business means for this record.
        INVESTOR: The role type of the party role is investor; set it when that is what the business means for this record.
        OTHER: The role type of the party role is other; set it when that is what the business means for this record.
      businessMeaning: "The kind of participation, such as customer, supplier, employee or carrier, which decides which processes and screens the party can take part in."
  - name: code
    type: string
    required: false
    maxLength: 100
    help:
      summary: "The short reference for this role, such as a customer or supplier number, used on documents."
      usage: Supports operational search, integrations, reports, and legacy references.
      relationshipContext: Identifies the role instance and must not replace Party or specialized role identifiers.
      optionalMeaning: Optional when partyRoleId is sufficient.
      businessMeaning: "Staff and partners quote it on orders, invoices and correspondence to identify the party in this role, for example SUP-00412 for a supplier."
  - name: validFrom
    type: date
    required: false
    help:
      summary: Date from which this role is eligible for ordinary business processing.
      usage: Used by eligibility and transaction validation.
      relationshipContext: Works with validTo and status; ending a role does not delete Party identity or other roles.
      workflowRole: Prevents premature use of a newly established role.
      optionalMeaning: Optional for immediately effective roles.
      businessMeaning: "The date from which the party may act in this role, such as the start of a supplier agreement or employment."
  - name: validTo
    type: date
    required: false
    help:
      summary: Date after which the role is no longer normally eligible for new business processing.
      usage: Used by eligibility, renewal, reporting, and expiry workflows.
      relationshipContext: Historical transactions may continue referencing the role after validTo.
      workflowRole: Prevents new use after role expiration while preserving historical attribution.
      optionalMeaning: Optional for open-ended roles.
      businessMeaning: "The date after which the role no longer applies; transactions after it should not be accepted for this role."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, EXPIRED]
    help:
      summary: "Shows whether the role is currently active, temporarily inactive, or has expired for good."
      usage: Controls whether the role can normally participate in new transactions, assignments, or authorizations.
      relationshipContext: Role status is independent of Party.status and other PartyRole statuses.
      workflowRole: ACTIVE permits normal role use; INACTIVE temporarily prevents ordinary use; EXPIRED represents ended validity.
      requiredMeaning: Required for role eligibility decisions.
      valueSemantics:
        ACTIVE: The status of the party role is active; set it when that is what the business means for this record.
        INACTIVE: The status of the party role is inactive; set it when that is what the business means for this record.
        EXPIRED: The status of the party role is expired; set it when that is what the business means for this record.
      businessMeaning: "Only active roles may be used on new transactions; an inactive role can be reactivated, while an expired one is kept only for history."
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    inverse: partyRoles
    help:
      summary: Connects this role to the Party whose participation it represents.
      usage: Provides navigation to canonical identity and all roles held by the party.
      cardinalityMeaning: Exactly one Party is required.
      workflowRole: Establishes the identity context for every role-specific workflow.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Optional organizational scope in which the role is recognized.
      usage: Supports multi-enterprise, subsidiary, business-unit, and operating-context scenarios.
      cardinalityMeaning: Zero means global/context-independent; one means explicitly scoped to one organization.
      workflowRole: Determines which organization can use the role for applicable transactions and policies.
  - name: customerRole
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: Optional role specialization corresponding to the roleType.
      usage: Connects generic PartyRole identity to role-specific business controls such as customer credit or supplier qualification.
      cardinalityMeaning: At most one specialization is represented by this relationship in the current core model.
      workflowRole: Allows specialized workflows to extend the role without duplicating Party identity.
  - name: supplierRole
    target: Supplier
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links the generic PartyRole to the specialized Supplier role record when applicable.
      usage: Provides direct navigation from role assignment to specialized supplier commercial data.
      cardinalityMeaning: Optional because not every PartyRole represents a supplier.
      workflowRole: Connects supplier-role eligibility to governed procurement and supplier-management workflows.
  invariants:
  - id: ROLE-001
    rule: validTo must not be earlier than validFrom when both are supplied.
  - id: ROLE-002
    rule: An ACTIVE role must not have a validTo date earlier than the current business date.
  - id: ROLE-003
    rule: PartyRole must not duplicate identity attributes owned by Party, Person, or Organization.
  - id: ROLE-004
    rule: Customer specialization requires roleType CUSTOMER and Supplier specialization requires roleType SUPPLIER.
  - id: ROLE-005
    rule: A Party may hold multiple roles, but one role instance must represent one roleType and one organizational scope.
  - id: ROLE-006
    rule: Ending or changing a PartyRole must not rewrite historical transactions that reference the role used at transaction time.
  - id: ROLE-007
    rule: Role eligibility for a new transaction requires Party status, PartyRole status, validity dates, organizational scope, and applicable specialized-role controls to all permit the transaction.
  - {id: PARTY-ROLE-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Party Role Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, EXPIRED]
    initial: ACTIVE
    terminal: [EXPIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: INACTIVE, to: EXPIRED, action: expire}
  help:
    summary: "One role that a person or organization plays for the business, such as customer, supplier, employee or carrier, with its own validity dates and status separate from the party's identity."
    businessMeaning: Party answers who the actor is; PartyRole answers how that actor participates; Customer and Supplier add role-specific commercial behavior.
    usage: Foundation for sales, procurement, employment, logistics, ownership, contracts, finance, and relationship management.
    relationshipContext: Customer and Supplier specialize PartyRole. Party identity is never duplicated in those specializations. Transaction entities should retain the role context that was effective when the transaction was created or confirmed.
    workflowContext: Party onboarding → PartyRole creation → role-specific qualification/controls → transaction eligibility → transaction creation → transaction lifecycle. Role changes affect future eligibility but preserve historical role attribution.
    lifecycle: Create role → validate scope/eligibility → activate → optionally inactivate/expire → preserve historical references. A role ending does not end the Party or unrelated roles.
    example: One organization can be a Customer and Supplier simultaneously. Its Party record is shared; each PartyRole has its own roleType, scope, lifecycle, and specialized controls. A SalesOrder references the Customer role while a PurchaseOrder references the Supplier role.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PARTY-ROLE}
