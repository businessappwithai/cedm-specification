entity:
  name: Coverage
  namespace: cedm.domain
  kind: insurance_coverage
  description: A governed component of an InsurancePolicy defining a specific insured risk, benefit, limit, deductible and effective scope independently of the policy header.
  ui: {icon: shield-check}
  identity: {key: coverageId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: coverageId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the policy coverage component., businessMeaning: Identifies one coverage independently of policy header and claims., usage: "Policy administration, underwriting, claims and reporting.", relationshipContext: InsurancePolicy supplies the governing contract context., requiredMeaning: Required.}}
    - {name: coverageCode, type: string, required: true, maxLength: 120, help: {summary: Business code identifying the coverage type., businessMeaning: Classifies the insured benefit or risk for policy and claim processing., usage: "Policy setup, claims matching and reporting.", relationshipContext: May repeat across policies while coverageId remains unique., requiredMeaning: Required.}}
    - {name: description, type: string, required: true, maxLength: 1000, help: {summary: Human-readable scope of insured protection., businessMeaning: Explains what benefit or risk the Coverage represents., usage: "Policy servicing, claims and communication.", relationshipContext: Detailed legal terms remain in policy/contract documents and clauses., requiredMeaning: Required.}}
    - {name: limitAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: Maximum covered monetary benefit under the applicable policy period or rule., businessMeaning: Provides claim authorization limit without replacing detailed policy terms., usage: "Claims assessment, exposure and reporting.", relationshipContext: Currency relationship defines denomination., optionalMeaning: Optional for non-monetary or unlimited coverage.}}
    - {name: deductibleAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: Amount borne before or alongside insurer liability under the coverage., businessMeaning: Supports claim responsibility calculation., usage: "Claims assessment and customer communication.", relationshipContext: Currency relationship defines denomination., optionalMeaning: Optional where no deductible applies.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
      help: {summary: Lifecycle state of the coverage component., businessMeaning: Controls eligibility for new loss events while preserving historical policy and claim evidence., usage: "Policy servicing, claims and reporting.", relationshipContext: Policy lifecycle remains separately authoritative., valueSemantics: {DRAFT: Coverage is being prepared., ACTIVE: Coverage is eligible under policy terms., SUSPENDED: New ordinary eligibility is temporarily restricted., EXPIRED: Coverage period ended., CANCELLED: Coverage was cancelled through governed workflow.}, requiredMeaning: Required.}
  relationships:
    - {name: policy, target: InsurancePolicy, cardinality: "1", ownership: reference, help: {summary: InsurancePolicy containing this Coverage., businessMeaning: Supplies contract parties and overall policy lifecycle., usage: "Policy administration and claims.", cardinalityMeaning: Exactly one policy., workflowRole: Coverage cannot be effective outside applicable policy terms.}}
    - {name: currency, target: Currency, cardinality: "0..1", ownership: reference, help: {summary: Currency for monetary limits and deductibles., businessMeaning: Makes monetary coverage values unambiguous., usage: "Claims, exposure and reporting.", cardinalityMeaning: Optional when no monetary values are defined., workflowRole: Currency changes require new governed terms rather than reinterpretation of historical claims.}}
    - {name: insuredParties, target: InsuredParty, cardinality: "0..*", ownership: reference, help: {summary: Insured-party relationships covered by this component., businessMeaning: Identifies who benefits from or is protected by the coverage., usage: "Eligibility and claims validation.", cardinalityMeaning: Zero or many where coverage is policy-wide or party-specific., workflowRole: Claim coverage eligibility must reconcile to insured-party scope.}}
    - {name: claimLines, target: ClaimLine, cardinality: "0..*", ownership: reference, help: {summary: Claim lines assessed against this Coverage., businessMeaning: Preserves coverage-to-claim utilization and decision traceability., usage: "Claims, exposure and audit.", cardinalityMeaning: Zero or many claim lines., workflowRole: Approved amounts must respect coverage rules and limits.}}
  invariants:
    - {id: COVERAGE-001, rule: limitAmount and deductibleAmount must be non-negative when supplied.}
    - {id: COVERAGE-002, rule: ACTIVE Coverage must be compatible with the governing InsurancePolicy lifecycle and effective period.}
    - {id: COVERAGE-003, rule: Policy or Coverage changes must not rewrite the terms historically applied to completed claim decisions.}
  lifecycle:
    title: Coverage Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
    initial: DRAFT
    terminal: [EXPIRED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  help:
    summary: Represents one governed insured benefit or risk component of a policy.
    businessMeaning: InsurancePolicy is the contract-level aggregate; Coverage states the specific protection and limits applied to claims.
    usage: Insurance policy administration, underwriting, claims, exposure management and audit.
    relationshipContext: Policy is mandatory, insured parties define beneficiaries or risk subjects, and ClaimLines preserve utilization and adjudication.
    lifecycle: Coverage is drafted, activated, may suspend, and ends through expiry or cancellation while historical claims retain applied terms.
    example: A motor policy has collision Coverage with a monetary limit and deductible; claim lines are assessed against that specific component.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-COVERAGE}
