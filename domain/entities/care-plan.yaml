entity:
  name: CarePlan
  namespace: cedm.domain
  kind: healthcare_entity
  description: A governed plan of care defining goals, interventions, responsibilities, and follow-up for a patient.
  ui:
    icon: table
  identity:
    key: carePlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: carePlanId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the care plan.
        usage: Generated on creation; tasks and reviews refer to the plan through it.
        relationshipContext: Connects this record to its governing HealthcarePatient context and downstream evidence.
    - name: carePlanCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The reference by which the plan is cited in the record and in handovers.
        usage: Assigned when the plan is created; unique.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the plan is being drafted, in force, or finished.
        usage: Moved by the care team.
        valueSemantics:
          DRAFT: Being prepared and not yet agreed with the patient or team.
          ACTIVE: Agreed and in force; the team is delivering it.
          COMPLETED: Goals met or care ended; the plan is closed but kept on record.
          CANCELLED: Withdrawn before it took effect.
        relationshipContext: Status changes can affect related HealthcarePatient workflows but never erase historical evidence.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: What the plan is for, such as "Type 2 diabetes management".
        usage: Shown on the patient's record.
        relationshipContext: Identifies the plan for people.
    - name: goals
      type: text
      required: true
      help:
        summary: What the plan aims to achieve, measurably where possible.
        usage: Agreed with the patient; progress is judged against them.
        relationshipContext: Reviewed at each review date.
    - name: interventions
      type: text
      required: false
      help:
        summary: What will be done — treatments, referrals, education, monitoring.
        usage: Followed by the care team.
        relationshipContext: Orders and encounters carry them out.
    - name: startDate
      type: date
      required: true
      help:
        summary: The day the plan of care begins and its goals and interventions take effect.
        usage: Set when the care team and the patient agree the plan.
        relationshipContext: Not later than the end date.
    - name: endDate
      type: date
      required: false
      help:
        summary: When the plan is expected to end.
        usage: Set if the plan has a defined length.
        relationshipContext: Empty for open-ended plans.
    - name: nextReviewDate
      type: date
      required: false
      help:
        summary: The day the care team is due to review progress against the plan's goals.
        usage: Drives review reminders for the responsible clinician and the care team.
        relationshipContext: Moved forward at each review.
  relationships:
    - name: context
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        summary: The patient the plan is for.
        usage: Set when the plan is created and not changed.
        cardinalityMeaning: Exactly one patient; a patient may have several plans over time.
        workflowRole: Attaches the plan to the patient's record so every clinician sees it.
    - name: patient
      target: HealthcarePatient
      cardinality: "1"
      ownership: reference
      help:
        summary: The patient the plan is for.
        usage: Set when creating it.
        cardinalityMeaning: Every plan is for exactly one patient.
        context: Listed among the patient's care plans.
    - name: responsibleProvider
      target: HealthcareProvider
      cardinality: 0..1
      ownership: reference
      help:
        summary: The clinician responsible for the plan.
        usage: Leads its reviews.
        cardinalityMeaning: One per plan.
        context: May change over time.
    - name: diagnosis
      target: Diagnosis
      cardinality: 0..1
      ownership: reference
      help:
        summary: The diagnosis the plan addresses.
        usage: Linked when the plan is for one condition.
        cardinalityMeaning: At most one.
        context: Plans covering several conditions name them in the goals.
  invariants:
    - id: CARE-PLAN-001
      rule: The governing HealthcarePatient relationship is required and must reference a valid record.
    - id: CARE-PLAN-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: CARE-PLAN-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
    - {id: CARE-PLAN-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Care Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a care plan is ended"
      description: "When a care plan is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CARE-PLAN-FOLLOW-UP-{{id}}"
              name: "Follow up on care plan {{id}}"
              description: "Care plan {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A plan of care that sets out a patient's goals, the interventions to reach them, who is responsible and when to follow up.
    businessMeaning: A care plan turns a diagnosis into coordinated action. It lets everyone involved in a patient's care see the same goals and responsibilities, and lets progress be checked against them.
    usage: Drawn up by the care team after assessment; reviewed at follow-up; consulted by everyone involved in the patient's care.
    relationshipContext: Each plan belongs to one HealthcarePatient and ties together the interventions and follow-up for that person.
    lifecycle: A plan is drafted, becomes active when agreed, and completes when goals are met or care ends, or is cancelled if never put into effect. Completed plans are kept and amended through explicit follow-up, not rewritten.
    example: A post-surgical recovery plan with mobility goals, physiotherapy sessions and a two-week review.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CARE-PLAN
