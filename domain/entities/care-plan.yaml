entity:
  name: CarePlan
  namespace: cedm.domain
  kind: healthcare_entity
  description: A patient's plan of care — the conditions it addresses, the goals, the interventions and who is responsible — reviewed over time until the goals are met or the plan ends.
  ui:
    icon: clipboard-list
    recordLabel: [carePlanCode, title]
  identity:
    key: carePlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: carePlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the care plan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a care plan store this identifier. The number or code people quote is a separate field.
  - name: carePlanCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: The reference of the care plan.
      usage: Assigned when it is created.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, ON_HOLD, COMPLETED, REVOKED]
    help:
      summary: Whether the plan is being followed.
      usage: Moved on by the responsible clinician.
      relationshipContext: Only active plans are shown to the care team as current.
      valueSemantics:
        DRAFT: Being prepared.
        ACTIVE: Being followed.
        ON_HOLD: Paused.
        COMPLETED: Goals met or plan finished.
        REVOKED: Stopped before completion.
  - name: title
    type: string
    required: true
    maxLength: 200
    help:
      summary: What the plan is for, such as "Type 2 diabetes management".
      usage: Shown on the patient's record.
      relationshipContext: Identifies the plan for people.
  - name: goals
    type: text
    required: true
    help:
      summary: What the plan aims to achieve, measurably where possible.
      usage: Agreed with the patient; progress is judged against them.
      relationshipContext: Reviewed at each review date.
  - name: interventions
    type: text
    required: false
    help:
      summary: What will be done — treatments, referrals, education, monitoring.
      usage: Followed by the care team.
      relationshipContext: Orders and encounters carry them out.
  - name: startDate
    type: date
    required: true
    help:
      summary: When the plan starts.
      usage: Set when it is agreed.
      relationshipContext: Not later than the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: When the plan is expected to end.
      usage: Set if the plan has a defined length.
      relationshipContext: Empty for open-ended plans.
  - name: nextReviewDate
    type: date
    required: false
    help:
      summary: When the plan will next be reviewed.
      usage: Drives review reminders.
      relationshipContext: Moved on at each review.
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient the plan is for.
      usage: Set when creating it.
      cardinalityMeaning: Every plan is for exactly one patient.
      context: Listed among the patient's care plans.
  - name: responsibleProvider
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: The clinician responsible for the plan.
      usage: Leads its reviews.
      cardinalityMeaning: One per plan.
      context: May change over time.
  - name: diagnosis
    target: Diagnosis
    cardinality: 0..1
    ownership: reference
    help:
      summary: The diagnosis the plan addresses.
      usage: Linked when the plan is for one condition.
      cardinalityMeaning: At most one.
      context: Plans covering several conditions name them in the goals.
  invariants:
  - {id: CARE-PLAN-001, rule: The plan does not end before it starts., violatedWhen: end_date != null and start_date != null and end_date < start_date, message: The end date is earlier than the start date.}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a care plan is stopped"
    description: "When a care plan is on hold, a high-priority task asks someone to resolve it."
    when: "status == \"ON_HOLD\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CARE-PLAN-EXCEPTION-{{id}}"
          name: "Resolve care plan {{title}}"
          description: "Care plan {{title}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  lifecycle:
    title: Care Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, ON_HOLD, COMPLETED, REVOKED]
    initial: DRAFT
    terminal: [COMPLETED, REVOKED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: ON_HOLD, action: hold}
    - {from: ON_HOLD, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: ACTIVE, to: REVOKED, action: revoke}
    - {from: ON_HOLD, to: REVOKED, action: revoke}
    - {from: DRAFT, to: REVOKED, action: revoke}
  help:
    summary: What the care team plans to do for a patient, why, and by when.
    businessMeaning: Patients with ongoing needs are cared for by many people over months. A care plan states the goals, the interventions agreed with the patient, who is responsible and when it will be reviewed, so that every clinician works to the same plan and progress can be judged.
    usage: Created by the responsible clinician with the patient; reviewed at set dates; updated when goals change; completed or ended when no longer needed.
    relationshipContext: A care plan belongs to one HealthcarePatient, may arise from a Diagnosis, and has a responsible HealthcareProvider. Encounters and orders carry out its interventions.
    lifecycle: Drafted, active while followed, on hold during a pause, completed when its goals are met, or revoked when stopped early.
    workflowContext: Chronic disease management, discharge planning, home care, rehabilitation.
    example: 'Care plan CP-24-0821 for type 2 diabetes: goal HbA1c below 53 mmol/mol by December 2024; interventions — metformin, dietitian referral, quarterly review; responsible GP Dr Martin; next review 15 September.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CARE-PLAN
