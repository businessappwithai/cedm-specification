entity:
  name: CarePlan
  namespace: cedm.domain
  kind: healthcare_entity
  description: A governed plan of care defining goals, interventions, responsibilities, and follow-up for a patient.
  ui:
    icon: table
  identity:
    key: carePlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: carePlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: "The internal key that ties every intervention and review to this particular care plan."
      businessMeaning: Identifies one governed CarePlan independently of related records and later lifecycle changes.
      usage: Referencing, workflow execution, reporting, audit, and integration.
      relationshipContext: Connects this record to its governing HealthcarePatient context and downstream evidence.
      requiredMeaning: Required for stable traceability.
  - name: carePlanCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: "The reference clinicians quote to find this care plan in notes, handovers and referrals."
      businessMeaning: Provides an operational identifier for searching, documents, reports, and integrations.
      usage: Creation, review, search, workflow, reporting, and audit.
      relationshipContext: Distinct from the immutable UUID identity and scoped to the governed business context.
      requiredMeaning: Required for operational identification.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help:
      summary: "Shows whether the plan is still being drafted, is active for the patient, has been completed or was cancelled."
      businessMeaning: Controls whether the record is being prepared, operationally active, historically complete, or cancelled.
      usage: Workflow gating, governance, reporting, and audit.
      relationshipContext: Status changes can affect related HealthcarePatient workflows but never erase historical evidence.
      valueSemantics:
        DRAFT: Record is being prepared and is not yet normally effective.
        ACTIVE: Record is effective for its governed business purpose.
        COMPLETED: Governed work or assessment is complete and retained as historical evidence.
        CANCELLED: Record was cancelled through controlled workflow and remains auditable.
      requiredMeaning: Required for lifecycle governance.
  relationships:
  - name: context
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: Governing HealthcarePatient associated with this CarePlan.
      businessMeaning: Supplies the business context needed to interpret and validate the record.
      usage: Workflow navigation, validation, traceability, reporting, and audit.
      cardinalityMeaning: Every CarePlan belongs to exactly one governing HealthcarePatient in this baseline model.
      context: Changes to the governing record require revalidation of open dependent records while completed evidence remains historical.
  invariants:
  - id: CARE-PLAN-001
    rule: The governing HealthcarePatient relationship is required and must reference a valid record.
  - id: CARE-PLAN-002
    rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
  - id: CARE-PLAN-003
    rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Care Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a care plan is ended"
      description: "When a care plan is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CARE-PLAN-FOLLOW-UP-{{id}}"
              name: "Follow up on care plan {{id}}"
              description: "Care plan {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "A plan agreed for one patient setting out the care goals, the interventions to deliver them, who is responsible and when progress is reviewed."
    businessMeaning: A governed plan of care defining goals, interventions, responsibilities, and follow-up for a patient.
    usage: Domain workflows, validation, reporting, audit, integration, and cross-entity traceability.
    relationshipContext: HealthcarePatient supplies the primary governing context; dependent workflows consume this record without silently mutating historical evidence.
    lifecycle: Draft → active → completed, with controlled cancellation and correction paths.
    changePropagation: Material changes revalidate open dependent workflows and preserve completed historical evidence.
    example: A CarePlan is created for a valid HealthcarePatient, progresses through its governed lifecycle, and remains traceable after completion.
    workflowContext: "A clinician drafts the plan after assessing the patient, activates it once agreed with the patient and care team, records interventions and reviews against it while active, and closes it as completed when goals are met or cancelled if it is replaced or no longer appropriate."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CARE-PLAN
