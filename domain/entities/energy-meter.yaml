entity:
  name: EnergyMeter
  namespace: cedm.domain
  kind: utility_entity
  description: A metering device or logical metering point used to record consumption or production of a utility resource.
  ui:
    icon: zap
    recordLabel: [meterNumber]
  identity:
    key: energyMeterId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: energyMeterId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the energy meter record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a energy meter store this identifier. The number or code people quote is a separate field.
  - name: meterNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the meter, as printed on it.
      usage: Used on bills and when submitting readings.
      relationshipContext: Unique.
  - name: meterType
    type: enum
    required: true
    values:
    - ELECTRICITY
    - GAS
    - WATER
    - STEAM
    - SOLAR
    - OTHER
    help:
      summary: What the meter measures.
      usage: Decides the units and tariffs that apply.
      relationshipContext: Read with its readings' unit.
      valueSemantics:
        ELECTRICITY: Electricity consumed or exported.
        GAS: Natural gas.
        WATER: Water.
        STEAM: Steam.
        SOLAR: Output of a solar installation.
        OTHER: Any other utility.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - DISCONNECTED
    - RETIRED
    help:
      summary: Whether the meter is recording.
      usage: Moved on by the utility or energy manager.
      relationshipContext: Only active meters accept readings.
      valueSemantics:
        PLANNED: Not yet installed.
        ACTIVE: Installed and recording.
        DISCONNECTED: Supply cut off; no consumption expected.
        RETIRED: Removed.
  - name: installedAt
    type: date
    required: false
    help:
      summary: When the meter was installed.
      usage: Starts its reading history.
      relationshipContext: Not in the future.
  - name: isSmartMeter
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the meter sends readings automatically.
      usage: Smart meters are read from their feed; others by hand.
      relationshipContext: Read with the reading interval.
  - name: readingIntervalMinutes
    type: integer
    required: false
    help:
      summary: How often a smart meter sends a reading, in minutes.
      usage: Used to check that the feed is complete.
      relationshipContext: Empty for meters read by hand.
  - name: multiplier
    type: decimal
    required: true
    precision: 12
    scale: 4
    default: 1
    help:
      summary: The factor applied to the register reading to get the real consumption.
      usage: Set for meters behind current transformers.
      relationshipContext: Usually 1.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the meter is installed.
      usage: Set at installation.
      cardinalityMeaning: Exactly one.
      context: The supply point it measures.
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer billed for what the meter records.
      usage: Set when a customer takes over the supply.
      cardinalityMeaning: At most one.
      context: Changes when the customer moves.
  - name: readings
    target: MeterReading
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The meter's readings.
      usage: Recorded by hand or from the feed.
      cardinalityMeaning: Any number; each reading is from one meter.
      context: Listed under the meter.
  lifecycle:
    title: Energy Meter Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, DISCONNECTED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: DISCONNECTED, action: mark_disconnected}
    - {from: PLANNED, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: DISCONNECTED, to: RETIRED, action: retire}
  help:
    summary: Represents a utility entity called EnergyMeter within the CEDM business model.
    businessMeaning: EnergyMeter is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Customer, MeterReading. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Utilities and energy managers register meters at supply points; readings are recorded against them, by hand or from smart-meter feeds; consumption is billed and analysed per meter.
    lifecycle: Planned before installation, active while recording, disconnected when supply is cut off, and retired when removed.
    example: Meter 14523987, electricity, smart meter at Plant Lyon main supply, installed 3 May 2021, readings every 30 minutes, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-METER
