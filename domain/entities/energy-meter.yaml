entity:
  name: EnergyMeter
  namespace: cedm.domain
  kind: utility_entity
  description: A metering device or logical metering point used to record consumption or production of a utility resource.
  ui:
    icon: zap
  identity:
    key: energyMeterId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: energyMeterId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the energy meter record associated with this EnergyMeter. The identifier connects this record to
        the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyMeter records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyMeter; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one meter, so all readings taken from it over its working life accumulate against the same device even if its customer changes."
  - name: meterNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of meter number for the EnergyMeter. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyMeter records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyMeter; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The serial or supply-point number printed on the meter and quoted by field technicians, customers and the network operator, such as E-1145-88231."
  - name: meterType
    type: enum
    required: true
    values:
    - ELECTRICITY
    - GAS
    - WATER
    - STEAM
    - SOLAR
    - OTHER
    help:
      summary: Captures the business meaning of meter type for the EnergyMeter. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyMeter records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyMeter; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        ELECTRICITY: Represents the electricity state or classification in the context of EnergyMeter.
        GAS: Represents the gas state or classification in the context of EnergyMeter.
        WATER: Represents the water state or classification in the context of EnergyMeter.
        STEAM: Represents the steam state or classification in the context of EnergyMeter.
        SOLAR: Represents the solar state or classification in the context of EnergyMeter.
        OTHER: Represents the other state or classification in the context of EnergyMeter.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which utility the meter measures, such as electricity, gas, water, steam or solar output, which decides the units its readings are taken in and how they are billed."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - DISCONNECTED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyMeter records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyMeter; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of EnergyMeter.
        ACTIVE: Represents the active state or classification in the context of EnergyMeter.
        DISCONNECTED: Represents the disconnected state or classification in the context of EnergyMeter.
        RETIRED: Represents the retired state or classification in the context of EnergyMeter.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the meter is PLANNED but not yet installed, ACTIVE and being read, DISCONNECTED with supply stopped, or RETIRED and removed from service."
  - name: installedAt
    type: date
    required: false
    help:
      summary: Records when the installed event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyMeter records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyMeter; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The date the meter was fitted at its location, which marks the start of its reading history and the first date from which consumption can be billed through it."
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects EnergyMeter to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a EnergyMeter.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects EnergyMeter to Customer so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Customer records associated with a EnergyMeter.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: readings
    target: MeterReading
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects EnergyMeter to MeterReading so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MeterReading records associated with a EnergyMeter.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Energy Meter Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, DISCONNECTED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: DISCONNECTED, action: mark_disconnected}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: DISCONNECTED, to: RETIRED, action: retire}
  help:
    summary: "One utility meter or metering point at a location, measuring electricity, gas, water, steam or solar consumption or production, kept so its readings can be billed to the right customer and analysed over time."
    businessMeaning: EnergyMeter is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate EnergyMeter records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Customer,
      MeterReading. These relationships provide the context needed to interpret the record rather than treating its fields
      as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical EnergyMeter record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Planned when a new supply point is designed, activated once it is installed and commissioned at its location, linked to the customer being supplied, read regularly to produce meter readings for billing and consumption analysis, disconnected when supply stops, and retired when it is removed while its reading history remains."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-METER
