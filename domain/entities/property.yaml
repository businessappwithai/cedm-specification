entity:
  name: Property
  namespace: cedm.domain
  kind: real_estate_entity
  description: A real estate asset or property managed, owned, leased, developed, or transacted by a business.
  ui:
    icon: home
    recordLabel: [propertyCode, name]
  identity:
    key: propertyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: propertyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the property record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a property store this identifier. The number or code people quote is a separate field.
  - name: propertyCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the property.
      usage: Used on leases, invoices and reports.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name or address by which the property is known.
      usage: Shown in lists and reports.
      relationshipContext: Usually the street address.
  - name: propertyType
    type: enum
    required: true
    values:
    - LAND
    - BUILDING
    - OFFICE
    - RETAIL
    - INDUSTRIAL
    - RESIDENTIAL
    - WAREHOUSE
    - OTHER
    help:
      summary: The main use of the property.
      usage: Decides valuation, leasing and reporting rules.
      relationshipContext: The dominant use if mixed.
      valueSemantics:
        LAND: Undeveloped land.
        BUILDING: A building of mixed or general use.
        OFFICE: Office space.
        RETAIL: Shops.
        INDUSTRIAL: Production or industrial use.
        RESIDENTIAL: Homes.
        WAREHOUSE: Storage and logistics.
        OTHER: Any other use.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - UNDER_CONSTRUCTION
    - INACTIVE
    - SOLD
    - RETIRED
    help:
      summary: Where the property stands.
      usage: Changed by the property manager.
      relationshipContext: Only active properties are leased.
      valueSemantics:
        PLANNED: Being developed or acquired.
        ACTIVE: In use.
        UNDER_CONSTRUCTION: Being built or redeveloped.
        INACTIVE: Empty and not offered.
        SOLD: Sold.
        RETIRED: Demolished or written off.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the property is.
      usage: Set when registering.
      cardinalityMeaning: Each property is at one location.
      context: Address and maps come from it.
  - name: owner
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties owning the property.
      usage: Recorded from the title deeds.
      cardinalityMeaning: One or more owners; a party may own many properties.
      context: Income and costs are shared among them.
    inverseCardinality: 0..*
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation managing the property.
      usage: Set when management is assigned.
      cardinalityMeaning: At most one manager.
      context: Handles leases and maintenance.
  - name: leases
    target: Lease
    cardinality: 0..*
    ownership: reference
    help:
      summary: Leases of the property.
      usage: Listed for occupancy and income.
      cardinalityMeaning: Any number of leases.
      context: Each lease is of one property.
  lifecycle:
    title: Property Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, UNDER_CONSTRUCTION, INACTIVE, SOLD, RETIRED]
    initial: PLANNED
    terminal: [SOLD, RETIRED]
    transitions:
    - {from: PLANNED, to: UNDER_CONSTRUCTION, action: build}
    - {from: PLANNED, to: ACTIVE, action: acquire}
    - {from: UNDER_CONSTRUCTION, to: ACTIVE, action: complete}
    - {from: ACTIVE, to: UNDER_CONSTRUCTION, action: redevelop}
    - {from: ACTIVE, to: INACTIVE, action: vacate}
    - {from: INACTIVE, to: ACTIVE, action: reopen}
    - {from: INACTIVE, to: UNDER_CONSTRUCTION, action: redevelop}
    - {from: ACTIVE, to: SOLD, action: sell}
    - {from: INACTIVE, to: SOLD, action: sell}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A plot of land or building the business owns, manages or leases.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Party, Organization, Lease. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Property managers register each property with its type, location and owners, record construction and leasing, and report occupancy and income; asset managers decide on sales and redevelopment.
    lifecycle: A property is planned, built or acquired, then active while in use; it may be redeveloped, left inactive, and ends sold or retired.
    example: Property MI-VR12 'Via Roma 12', retail and office building in Milan, owned by Immobiliare Sud, three leases, active.
    businessMeaning: Properties are long-term assets producing rent and incurring costs; leases, maintenance and valuations are kept per property.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROPERTY
