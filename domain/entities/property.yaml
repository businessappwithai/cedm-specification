entity:
  name: Property
  namespace: cedm.domain
  kind: real_estate_entity
  description: A real estate asset or property managed, owned, leased, developed, or transacted by a business.
  ui:
    icon: home
  identity:
    key: propertyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: propertyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the property record associated with this Property. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Property records, where applicable.
      relationshipContext: Its meaning is specific to Property; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of the property, so leases, owners and maintenance stay attached to the same asset over decades of use."
  - name: propertyCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of property code for the Property. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Property records, where applicable.
      relationshipContext: Its meaning is specific to Property; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The portfolio reference property managers use, such as PRP-LDN-012, to identify the property in leases, reports and valuations."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Property records, where applicable.
      relationshipContext: Its meaning is specific to Property; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name people know the property by, such as Riverside House, used on lease documents and portfolio reports."
  - name: propertyType
    type: enum
    required: true
    values:
    - LAND
    - BUILDING
    - OFFICE
    - RETAIL
    - INDUSTRIAL
    - RESIDENTIAL
    - WAREHOUSE
    - OTHER
    help:
      summary: Captures the business meaning of property type for the Property. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Property records, where applicable.
      relationshipContext: Its meaning is specific to Property; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        LAND: Represents the land state or classification in the context of Property.
        BUILDING: Represents the building state or classification in the context of Property.
        OFFICE: Represents the office state or classification in the context of Property.
        RETAIL: Represents the retail state or classification in the context of Property.
        INDUSTRIAL: Represents the industrial state or classification in the context of Property.
        RESIDENTIAL: Represents the residential state or classification in the context of Property.
        WAREHOUSE: Represents the warehouse state or classification in the context of Property.
        OTHER: Represents the other state or classification in the context of Property.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the property is land, an office, retail, industrial, residential or warehouse space, which affects how it is leased, valued and taxed."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - UNDER_CONSTRUCTION
    - INACTIVE
    - SOLD
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Property records, where applicable.
      relationshipContext: Its meaning is specific to Property; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Property.
        ACTIVE: Represents the active state or classification in the context of Property.
        UNDER_CONSTRUCTION: Represents the under construction state or classification in the context of Property.
        INACTIVE: Represents the inactive state or classification in the context of Property.
        SOLD: Represents the sold state or classification in the context of Property.
        RETIRED: Represents the retired state or classification in the context of Property.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the property is PLANNED, ACTIVE and in use, UNDER_CONSTRUCTION, temporarily INACTIVE, or has left the portfolio as SOLD or RETIRED."
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Property to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Property.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: owner
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Property to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Property.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Property to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Property.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: leases
    target: Lease
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Property to Lease so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Lease records associated with a Property.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Property Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, UNDER_CONSTRUCTION, INACTIVE, SOLD, RETIRED]
    initial: PLANNED
    terminal: [SOLD, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: UNDER_CONSTRUCTION, action: mark_under_construction}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: UNDER_CONSTRUCTION, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: UNDER_CONSTRUCTION, action: reactivate}
      - {from: PLANNED, to: SOLD, action: mark_sold}
      - {from: ACTIVE, to: SOLD, action: mark_sold}
      - {from: UNDER_CONSTRUCTION, to: SOLD, action: mark_sold}
      - {from: INACTIVE, to: SOLD, action: mark_sold}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: UNDER_CONSTRUCTION, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One real estate asset, such as land, an office building, retail unit or warehouse, that the business owns, leases, develops or sells, kept to manage its use, leases and ownership."
    businessMeaning: Property is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Property records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Party, Organization,
      Lease. These relationships provide the context needed to interpret the record rather than treating its fields as isolated
      database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Property record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Registered as planned during acquisition or development, activated when it is in use, marked under construction during works, made inactive when vacant, and ends as sold or retired; leasing, facilities and asset accounting all read it."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROPERTY
