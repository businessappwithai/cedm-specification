entity:
  name: Property
  namespace: cedm.domain
  kind: real_estate_entity
  description: A real estate asset or property managed, owned, leased, developed, or transacted by a business.
  ui:
    icon: home
  identity:
    key: propertyId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: propertyId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the property, constant for its life.
        usage: Generated on creation; leases and valuations refer to it.
        relationshipContext: Referenced by every lease and charge on the property.
    - name: propertyCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code used for the property, such as P-310.
        usage: Unique; quoted in leases and reports.
        relationshipContext: Read with the name to identify the property.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name the property is known by.
        usage: Shown in lists and on documents.
        relationshipContext: Read by tenants, staff and owners.
    - name: propertyType
      type: enum
      required: true
      values:
        - LAND
        - BUILDING
        - OFFICE
        - RETAIL
        - INDUSTRIAL
        - RESIDENTIAL
        - WAREHOUSE
        - OTHER
      help:
        summary: The kind of property.
        usage: Chosen when created; reports and rules split the portfolio by it.
        relationshipContext: Decides which leases and charges are expected.
        valueSemantics:
          LAND: Undeveloped land.
          BUILDING: A building of mixed or unspecified use.
          OFFICE: Office space.
          RETAIL: Shops and retail units.
          INDUSTRIAL: Factories and industrial sites.
          RESIDENTIAL: Homes and apartments.
          WAREHOUSE: Storage and distribution space.
          OTHER: A property that fits no other type.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - UNDER_CONSTRUCTION
        - INACTIVE
        - SOLD
        - RETIRED
      help:
        summary: Where the property is in its life.
        usage: Starts as PLANNED; changed by property management.
        relationshipContext: Decides whether it can be leased and charged.
        valueSemantics:
          PLANNED: Intended or acquired, not yet in use.
          ACTIVE: In use and available for lease.
          UNDER_CONSTRUCTION: Being built or renovated.
          INACTIVE: Temporarily out of use.
          SOLD: Disposed of. A final state.
          RETIRED: Withdrawn from the portfolio without a sale. A final state.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A property stands at a single location, which gives its address; a site with several addresses is modelled as several properties.
        summary: The place where the property stands.
        usage: Chosen when the property is created.
        context: Gives the address used in leases and notices.
    - name: owner
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The parties that own the property.
        usage: Chosen to record ownership.
        cardinalityMeaning: Any number of owners, to allow joint ownership.
        context: Decides who receives rent and bears costs.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that manages or holds the property.
        usage: Chosen when a group company is responsible.
        cardinalityMeaning: At most one organisation.
        context: Places the property in the right company for accounts.
    - name: leases
      target: Lease
      cardinality: 0..*
      ownership: reference
      help:
        summary: The leases granted on the property.
        usage: Read to see tenants and rent.
        cardinalityMeaning: Any number of leases, none while vacant.
        context: Shows how the property is let.
  lifecycle:
    title: Property Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, UNDER_CONSTRUCTION, INACTIVE, SOLD, RETIRED]
    initial: PLANNED
    terminal: [SOLD, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: UNDER_CONSTRUCTION, action: mark_under_construction}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: UNDER_CONSTRUCTION, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: UNDER_CONSTRUCTION, action: reactivate}
      - {from: PLANNED, to: SOLD, action: mark_sold}
      - {from: ACTIVE, to: SOLD, action: mark_sold}
      - {from: UNDER_CONSTRUCTION, to: SOLD, action: mark_sold}
      - {from: INACTIVE, to: SOLD, action: mark_sold}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: UNDER_CONSTRUCTION, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A real estate asset managed, owned, leased, developed or sold by the business.
    businessMeaning: A property is the record of a piece of land or a building and its role in the portfolio. Leases, valuations and maintenance attach to it, and its status shows whether it is being built, in use, idle or has left the portfolio.
    usage: Created by property management; read by leasing, finance and facilities.
    relationshipContext: A property sits at a location, has owners, may belong to an organisation and may be leased to tenants.
    lifecycle: A property is planned, becomes active, may be under construction or inactive, and ends sold or retired. Sold and retired are final.
    example: Property P-310 is a warehouse at 12 Dock Road, owned by the group and leased to two tenants.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROPERTY
