entity:
  name: ProductLifecycle
  namespace: cedm.domain
  kind: product_governance_transaction
  description: A governed effective-dated record of Product lifecycle transitions used to preserve why, when, and under whose authority product eligibility changed.
  ui:
    icon: package
  identity: {key: productLifecycleId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: productLifecycleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the product lifecycle record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a product lifecycle store this identifier. The number or code people quote is a separate field.
  - name: effectiveAt
    type: datetime
    required: true
    help:
      summary: When the change of lifecycle status takes effect.
      businessMeaning: Establishes point-in-time product eligibility.
      usage: Set by the product manager; the product's status changes at this time.
      relationshipContext: Records are read in this order to give the product's lifecycle history.
  - name: lifecycleStatus
    type: enum
    required: true
    values: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
    help:
      summary: The status the product enters.
      businessMeaning: Governs future product eligibility.
      usage: Decides whether the product may be sold, bought or made from this time.
      relationshipContext: The product's current status is that of its latest effective record.
      valueSemantics:
        DRAFT: Being set up; not yet sold or bought.
        ACTIVE: Available for normal business.
        DISCONTINUED: No longer replenished; remaining stock may be sold.
        BLOCKED: Temporarily barred, for example for a quality problem.
        RETIRED: No longer used at all.
  - name: reason
    type: string
    required: true
    maxLength: 1000
    help:
      summary: Why the status changed.
      businessMeaning: Provides governance/audit justification.
      usage: Written by the person making the change.
      relationshipContext: Such as "replaced by model 40B".
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product whose status changes.
      businessMeaning: Supplies governed master context.
      workflowRole: Transition triggers dependency validation.
      usage: Set when the change is recorded.
      cardinalityMeaning: Every record belongs to one product.
      context: Listed in the product's lifecycle history.
  - name: approvedBy
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who approved the change.
      usage: Recorded with the change.
      cardinalityMeaning: One per record.
      context: Status changes affecting customers need approval.
  invariants:
  - {id: PRODUCT-LIFECYCLE-001, rule: Lifecycle records are not edited; a correction is a new record.}
  help:
    summary: Effective-dated audit trail of product eligibility changes.
    businessMeaning: Product.status is current state; ProductLifecycle preserves governed transition history and reason.
    usage: PIM governance, product introduction, blocking, discontinuation and retirement.
    relationshipContext: Changes propagate to open dependent workflows while historical evidence remains immutable.
    lifecycle: Append-only governed transition history for Product.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCT-LIFECYCLE}
