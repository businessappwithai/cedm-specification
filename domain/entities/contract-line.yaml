entity:
  name: ContractLine
  namespace: cedm.domain
  kind: contract_component
  description: A governed commercial or legal line within a Contract defining a specific product, service, price, quantity, term, or obligation scope.
  ui:
    icon: file-check
  identity: {key: contractLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: contractLineId, type: uuid, required: true, immutable: true, help: {summary: The identity of the contract line., usage: Generated on creation; call-offs and invoice lines refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the line took effect., usage: Set from the signed contract or amendment; the price and quantity that apply to an order are those of the line in force on the order date.}}
  relationships:
    - {name: contract, target: Contract, cardinality: '1', ownership: reference, help: {cardinalityMeaning: 'Exactly one contract: a line is priced and scoped only within the agreement that contains it.', summary: The contract that contains the line., usage: Set when the line is created., workflowRole: Places the line within the agreed commercial terms.}}
  invariants:
    - {id: CONTRACT-LINE-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: A line within a contract that fixes a specific product or service, its price, quantity, term or scope of obligation.
    businessMeaning: Commercial contracts are priced and scoped line by line. Lines state exactly what is being bought or provided, and orders and invoices are checked against them.
    usage: Added when a contract is drafted or amended; read when orders are placed, delivered and invoiced under the contract.
    relationshipContext: Each line belongs to one Contract; orders, shipments and invoices draw on lines.
    lifecycle: Executed lines are evidence. A change in price or quantity is made by amendment, not by editing the signed line.
    example: 'Line 3 of a supply contract: 10,000 units of part A-200 per quarter at 4.20 each.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CONTRACT-LINE}
