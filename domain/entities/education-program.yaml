entity:
  name: EducationProgram
  namespace: cedm.domain
  kind: education_entity
  description: A structured educational program leading to a qualification, credential, or defined learning outcome.
  ui:
    icon: table
    recordLabel: [code, name]
  identity:
    key: educationProgramId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: educationProgramId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the education program record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a education program store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the programme.
      usage: Used in admissions, enrolments and transcripts.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the programme, such as "BSc Computer Science".
      usage: Shown in the prospectus and on awards.
      relationshipContext: Identifies it for students.
  - name: programType
    type: enum
    required: true
    values:
    - DEGREE
    - DIPLOMA
    - CERTIFICATE
    - COURSE
    - TRAINING
    - OTHER
    help:
      summary: What the programme leads to.
      usage: Decides the rules for awards and funding.
      relationshipContext: Read with its duration.
      valueSemantics:
        DEGREE: An academic degree.
        DIPLOMA: A diploma.
        CERTIFICATE: A certificate.
        COURSE: A single course offered on its own.
        TRAINING: A professional training programme.
        OTHER: Any other programme.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the programme takes students.
      usage: Moved on by the academic board.
      relationshipContext: Only active programmes take new enrolments.
      valueSemantics:
        DRAFT: Being designed or accredited.
        ACTIVE: Open to new students.
        SUSPENDED: Intake paused.
        RETIRED: Closed to new students.
  - name: durationMonths
    type: integer
    required: false
    help:
      summary: How long the programme takes full-time, in months.
      usage: Sets students' expected completion dates.
      relationshipContext: Part-time students take longer.
  - name: requiredCredits
    type: decimal
    required: false
    precision: 8
    scale: 2
    help:
      summary: The credits needed to complete the programme.
      usage: Checked before the award is conferred.
      relationshipContext: Summed from passed courses.
  - name: awardTitle
    type: string
    required: false
    maxLength: 200
    help:
      summary: The award conferred, such as "Bachelor of Science in Computer Science".
      usage: Printed on the certificate.
      relationshipContext: As accredited.
  relationships:
  - name: institution
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The institution that runs the programme.
      usage: Set when it is created.
      cardinalityMeaning: Every programme belongs to exactly one institution.
      context: Its rules apply.
  - name: enrollments
    target: Enrollment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Students enrolled on the programme.
      usage: Listed from the programme.
      cardinalityMeaning: Any number; each enrolment is on one programme.
      context: The enrolment records its programme.
  lifecycle:
    title: Education Program Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A programme of study leading to a qualification, such as a bachelor's degree, with its required courses.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Enrollment. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Institutions define the programmes they offer, with their award, duration and credit requirements; admissions recruit students to them; the registry checks students' progress against them and confers the award.
    lifecycle: Drafted while being designed and accredited, active while open to new students, suspended when intake stops for a while, and retired when it closes; current students may finish a retired programme.
    example: Programme BSC-CS 'BSc Computer Science', degree, 3 years full-time, 180 ECTS, accredited, active.
    businessMeaning: Programmes decide what a student must complete to graduate and are what the institution is accredited for.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EDUCATION-PROGRAM
