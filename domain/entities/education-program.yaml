entity:
  name: EducationProgram
  namespace: cedm.domain
  kind: education_entity
  description: A structured educational program leading to a qualification, credential, or defined learning outcome.
  ui:
    icon: table
  identity:
    key: educationProgramId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: educationProgramId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the program, independent of its code or title.
        usage: Generated on creation; courses and enrolments refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The catalogue code of the program, such as CS-BSC.
        usage: Assigned by the registrar; unique.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The title of the program, such as BSc Computer Science.
        usage: Shown in prospectuses and on certificates.
    - name: programType
      type: enum
      required: true
      values:
        - DEGREE
        - DIPLOMA
        - CERTIFICATE
        - COURSE
        - TRAINING
        - OTHER
      help:
        summary: The kind of qualification the program leads to, such as a degree, diploma or certificate.
        usage: Chosen when the program is created; it drives admission rules, credit requirements and how graduates are described.
        valueSemantics:
          DEGREE: A university-level degree awarded on completing a full course of study.
          DIPLOMA: A diploma-level qualification, usually shorter or more applied than a degree.
          CERTIFICATE: A shorter certificate recognising completion of a focused body of study.
          COURSE: A stand-alone course that is treated as a program of its own.
          TRAINING: Vocational or workplace training that leads to a defined skill.
          OTHER: Any other kind of program that fits none of the above.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: Whether the program is being designed, open to students, closed for now, or withdrawn.
        usage: Set by the institution; only an ACTIVE program accepts new enrolments, and retired programs stay for graduates' records.
        valueSemantics:
          DRAFT: Being designed; not yet open to students.
          ACTIVE: Open for enrolment and accepting new students.
          SUSPENDED: Temporarily closed to new enrolments, with current students unaffected.
          RETIRED: Withdrawn permanently but kept for graduates' records. A final state.
  relationships:
    - name: institution
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The institution that offers the program.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one institution: a program is accredited and delivered by a single institution.'
        workflowRole: Determines accreditation and rules.
    - name: enrollments
      target: Enrollment
      cardinality: 0..*
      ownership: reference
      help:
        summary: The enrolments of students in the program.
        usage: Read for cohort reporting and progression.
        cardinalityMeaning: Any number, one for each student on the program.
        workflowRole: Show who is studying the program.
  lifecycle:
    title: Education Program Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A structured program of study that leads to a qualification, credential or defined learning outcome.
    businessMeaning: 'A program is what a student signs up for: a set of courses and rules that together earn a degree, diploma or certificate. It is the unit against which admission, progression and graduation are managed.'
    usage: Designed and approved by the institution; opened for enrolment; read by admissions, advisers and students planning their studies.
    relationshipContext: A program is offered by one institution (an Organization), contains EducationCourses and is joined through Enrollments.
    lifecycle: A program is drafted, becomes active when accredited and open, may be suspended to new students, and is retired when discontinued. Graduates keep their records.
    example: BSc Computer Science, a three-year degree offered by the Faculty of Engineering.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EDUCATION-PROGRAM
