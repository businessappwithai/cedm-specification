entity:
  name: Team
  namespace: cedm.domain
  kind: organization_structure
  description: A group of people who work together — a sales team, a support squad, a project team — with its lead, purpose, the organization it belongs to and how work is routed to it.
  ui:
    icon: users-round
    recordLabel: [code, name]
  identity: {key: teamId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: teamId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the team record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a team store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the team.
      usage: Used in routing rules and reports.
      relationshipContext: Unique within the organization.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the team.
      usage: Shown wherever work is assigned.
      relationshipContext: Identifies it for people.
  - name: purpose
    type: string
    required: false
    maxLength: 300
    help:
      summary: What the team does.
      usage: Read by people deciding where to send work.
      relationshipContext: Free text.
  - name: teamType
    type: enum
    required: true
    default: OPERATIONAL
    values: [OPERATIONAL, PROJECT, SUPPORT, SALES]
    help:
      summary: What kind of team it is.
      usage: Decides how long it is expected to exist.
      relationshipContext: Project teams are disbanded when the project ends.
      valueSemantics:
        OPERATIONAL: A standing team doing ongoing work.
        PROJECT: A team formed for one project.
        SUPPORT: A team working a support or service queue.
        SALES: A sales team or territory.
  - name: emailAddress
    type: email
    required: false
    help:
      summary: The shared mailbox of the team.
      usage: Used for notifications sent to the team.
      relationshipContext: Notifications to the team go here instead of to each member.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE]
    help:
      summary: Whether the team exists.
      usage: Made inactive when the team is disbanded.
      relationshipContext: Inactive teams receive no work.
      valueSemantics:
        ACTIVE: Working.
        INACTIVE: Disbanded.
  relationships:
  - name: organization
    target: Organization
    cardinality: "1"
    ownership: reference
    help:
      summary: The organization the team belongs to.
      usage: Set when it is created.
      cardinalityMeaning: Every team belongs to exactly one organization.
      context: Its members work for it.
  - name: department
    target: Department
    cardinality: 0..1
    ownership: reference
    help:
      summary: The department the team is part of.
      usage: Set where teams sit inside departments.
      cardinalityMeaning: At most one.
      context: Used in departmental reporting.
  - name: lead
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person who leads the team.
      usage: Receives escalations and reports.
      cardinalityMeaning: One per team.
      context: Usually a team member.
  invariants:
  - {id: TEAM-001, rule: Code and identity semantics must remain stable within the governing context and historical references must not be silently repointed.}
  lifecycle:
    title: Team Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE]
    initial: ACTIVE
    terminal: []
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: disband}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
  help:
    summary: A group of people that work is given to and that answers for it together.
    businessMeaning: Much work is owned by teams rather than individuals — a support queue, a sales territory, a maintenance crew. Defining teams, their lead and members lets work be assigned to the team and picked up by whoever is free, and lets workload and results be reported by team.
    usage: Managers create teams and keep their membership current; work is routed to teams by rules or by hand; team leads watch their queue.
    relationshipContext: A team belongs to an Organization and may sit in a Department. Its members belong through OrganizationMemberships or Assignments. Tasks and assignments can be given to a team.
    lifecycle: Active while it works; inactive when disbanded.
    workflowContext: Work routing, support queues, sales territories, shift crews.
    example: Team SUP-L2 'Second-line support', lead Tom Weber, Customer Service department, receives escalated service requests by the routing rule 'priority high or escalated'.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TEAM}
