entity:
  name: Hotel
  namespace: cedm.domain
  kind: hospitality_entity
  description: A hospitality property providing accommodation and related services.
  ui:
    icon: bed
  identity:
    key: hotelId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the hotel record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a hotel store this identifier. The number or code people quote is a separate field.
  - name: hotelCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the hotel, such as LYS-CTR.
      usage: Used in reservations, channel managers and reports.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the hotel as guests know it.
      usage: Shown on bookings, invoices and websites.
      relationshipContext: Identifies the property.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - CLOSED
    - RETIRED
    help:
      summary: Whether the hotel takes guests.
      usage: Moved on by operations.
      relationshipContext: Only active hotels accept reservations.
      valueSemantics:
        PLANNED: Not yet open.
        ACTIVE: Taking guests.
        CLOSED: Not taking guests.
        RETIRED: No longer in the portfolio.
  - name: starRating
    type: integer
    required: false
    help:
      summary: The official star rating, from 1 to 5.
      usage: Shown on booking channels.
      relationshipContext: Between 1 and 5.
  - name: checkInTime
    type: string
    required: false
    maxLength: 5
    help:
      summary: The earliest check-in time, as HH:MM.
      usage: Shown on confirmations.
      relationshipContext: Local time.
  - name: checkOutTime
    type: string
    required: false
    maxLength: 5
    help:
      summary: The latest check-out time, as HH:MM.
      usage: Shown on confirmations.
      relationshipContext: Local time.
  - name: roomCount
    type: integer
    required: false
    help:
      summary: How many rooms the hotel has.
      usage: Used for occupancy reports.
      relationshipContext: Equal to the number of its rooms.
  - name: phone
    type: string
    required: false
    maxLength: 40
    help:
      summary: The hotel's telephone number.
      usage: Shown on bookings.
      relationshipContext: International format.
  - name: email
    type: email
    required: false
    help:
      summary: The hotel's contact email.
      usage: Shown on bookings.
      relationshipContext: Usually the reception desk.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the hotel is.
      usage: Set when the hotel is created.
      cardinalityMeaning: Every hotel is at exactly one location.
      context: Its address is shown on bookings.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company that operates the hotel.
      usage: Set when the hotel is created.
      cardinalityMeaning: At most one.
      context: May differ from the brand owner.
  - name: rooms
    target: HotelRoom
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The rooms of the hotel.
      usage: Set up when the hotel is created.
      cardinalityMeaning: A hotel has at least one room.
      context: Each room belongs to one hotel.
  - name: reservations
    target: HotelReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Reservations made at the hotel.
      usage: Listed from the hotel.
      cardinalityMeaning: Any number of reservations; each is for one hotel.
      context: The reservation records its hotel.
  lifecycle:
    title: Hotel Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: PLANNED, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: A hotel property operated or represented by the business, with its rooms and services.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization, HotelRoom, HotelReservation. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: A hotel is the property guests stay at. It holds its rooms, its star rating, its check-in and check-out times and the company that operates it, so reservations, room allocation, pricing and reports all work per property.
    usage: Hospitality operations set up each property with its rooms and policies; reservations are made for a hotel; occupancy and revenue are reported per hotel.
    lifecycle: Planned before opening, active while taking guests, closed when it stops trading (for renovation or for good), and retired when it leaves the portfolio.
    example: Hotel LYS-CTR 'Hotel Bellecour Lyon', 4 stars, 128 rooms, check-in from 15:00, check-out by 11:00, operated by ACME Hospitality.
  invariants:
  - {id: HOTEL-001, rule: The star rating is between 1 and 5., violatedWhen: star_rating != null and (star_rating < 1 or star_rating > 5), message: The star rating must be between 1 and 5.}
  - {id: HOTEL-EXE-001, rule: "Room Count cannot be negative.", violatedWhen: "room_count != null and room_count < 0", message: "Room Count cannot be negative."}
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL
