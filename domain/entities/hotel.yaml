entity:
  name: Hotel
  namespace: cedm.domain
  kind: hospitality_entity
  description: A hospitality property providing accommodation and related services.
  ui:
    icon: bed
  identity:
    key: hotelId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the hotel record associated with this Hotel. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Hotel records, where applicable.
      relationshipContext: Its meaning is specific to Hotel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Keeps all rooms and reservations attached to the right property, even when its code or name is later changed."
  - name: hotelCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of hotel code for the Hotel. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Hotel records, where applicable.
      relationshipContext: Its meaning is specific to Hotel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short property code reservations staff, channel managers and booking partners use to identify the hotel unambiguously."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Hotel records, where applicable.
      relationshipContext: Its meaning is specific to Hotel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The property name guests see on confirmations, invoices and booking sites, and staff use to find the hotel."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - CLOSED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Hotel records, where applicable.
      relationshipContext: Its meaning is specific to Hotel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Hotel.
        ACTIVE: Represents the active state or classification in the context of Hotel.
        CLOSED: Represents the closed state or classification in the context of Hotel.
        RETIRED: Represents the retired state or classification in the context of Hotel.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the hotel is still being planned, open and selling rooms, closed, or retired, which decides whether new reservations can be made."
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Hotel to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Hotel.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Hotel to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Hotel.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: rooms
    target: HotelRoom
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: Connects Hotel to HotelRoom so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HotelRoom records associated with a Hotel.
      cardinalityMeaning: The declared cardinality 1..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: reservations
    target: HotelReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Hotel to HotelReservation so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HotelReservation records associated with a Hotel.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Hotel Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One hotel property at a location, with its rooms and reservations, that the business operates, manages or books guests into for accommodation and related services."
    businessMeaning: Hotel is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Hotel records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization,
      HotelRoom, HotelReservation. These relationships provide the context needed to interpret the record rather than treating
      its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Hotel record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "The hotel is set up as planned before it opens, made active so its rooms can be sold and reservations taken, and later closed when it stops trading or retired from use; existing reservations and stay history remain linked to it throughout."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL
