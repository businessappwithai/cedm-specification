entity:
  name: AIEvaluation
  namespace: cedm.domain
  kind: ai_governance_entity
  description: An evaluation record assessing an AIModel against defined quality, safety, performance, or business criteria.
  ui:
    icon: table
  identity:
    key: aIEvaluationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: aIEvaluationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the evaluation.
        usage: Generated when the evaluation is created; model approval records and audit trails refer to the evaluation through it.
        relationshipContext: Connects this record to its governing AIModel context and downstream evidence.
    - name: aIEvaluationCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The unique business reference by which reviewers and reports name this evaluation.
        usage: Entered or generated when the evaluation is raised, for example EVAL-2026-014; used in approval packs and audit queries.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the evaluation stands in its run from preparation to a recorded result.
        usage: Moved forward by the governance team as the test is prepared, run and closed; deployment checks accept only COMPLETED evaluations.
        valueSemantics:
          DRAFT: Being prepared; criteria and data are still being agreed and nothing has been run.
          ACTIVE: Under way; tests are running and results are being collected.
          COMPLETED: Finished with results recorded; this is the state approval decisions rely on, and it is final.
          CANCELLED: Abandoned before completion; kept so the attempt is on record, and it cannot support an approval.
        relationshipContext: Status changes can affect related AIModel workflows but never erase historical evidence.
    - name: evaluationType
      type: enum
      required: true
      default: PERFORMANCE
      values:
        - PERFORMANCE
        - FAIRNESS
        - ROBUSTNESS
        - SAFETY
        - DRIFT
      help:
        summary: "Which quality dimension this evaluation tests: accuracy, fairness, robustness, safety or drift."
        usage: Chosen by the model risk team when the evaluation is planned.
        relationshipContext: Several types are usually needed before a model is approved for use.
        valueSemantics:
          PERFORMANCE: Measures accuracy and other quality metrics against a labelled test set.
          FAIRNESS: Compares outcomes between groups of people to expose unequal treatment.
          ROBUSTNESS: Tests behaviour on unusual, noisy or adversarial inputs.
          SAFETY: Looks for harmful, offensive or otherwise unacceptable outputs.
          DRIFT: Checks how far performance has moved since the model was deployed.
    - name: criteria
      type: text
      required: false
      help:
        summary: The metrics and thresholds the model must meet.
        usage: Set before running, so the verdict is not chosen after seeing results.
        relationshipContext: Usually from the AI policy.
    - name: results
      type: text
      required: false
      help:
        summary: The full set of metrics and observations the tests produced, in the evaluator's own words and figures.
        usage: Recorded once the tests finish, so reviewers can read the evidence behind the headline metric.
        relationshipContext: Read against the acceptance criteria that the evaluation was planned to meet.
    - name: primaryMetric
      type: string
      required: false
      maxLength: 60
      help:
        summary: The headline measure chosen to judge this evaluation, such as AUC, F1 score or error rate.
        usage: Named by the evaluator and shown in model lists so users can compare evaluations.
        relationshipContext: Always read together with the value recorded beside it.
    - name: primaryMetricValue
      type: decimal
      required: false
      precision: 12
      scale: 6
      help:
        summary: The number the model achieved on the headline metric during this evaluation.
        usage: Entered when results are recorded; shown in model lists and trend charts across successive evaluations.
        relationshipContext: Expressed in the scale of the named metric, for example a fraction between zero and one.
    - name: passed
      type: boolean
      required: false
      help:
        summary: Whether the model met all the criteria.
        usage: Decided when the evaluation completes; deployment requires a pass.
        relationshipContext: Present once completed.
    - name: evaluatedAt
      type: datetime
      required: false
      help:
        summary: The date and time at which the evaluation finished and its results were final.
        usage: Stamped on completion by the evaluator and used to order evaluations and judge how recent the evidence is.
        relationshipContext: Empty until the evaluation has completed.
  relationships:
    - name: context
      target: AIModel
      cardinality: '1'
      ownership: reference
      help:
        summary: The AI model this evaluation assesses.
        usage: Chosen when the evaluation is created and not changed afterwards, so the evidence always stays with the model version it was run for.
        cardinalityMeaning: 'Exactly one model: an evaluation without a subject is meaningless, while a model may have many evaluations over its life.'
        workflowRole: Links the evidence to the model so deployment and review can check it.
    - name: model
      target: AIModel
      cardinality: "1"
      ownership: reference
      help:
        summary: The model evaluated.
        usage: Chosen when planning the evaluation.
        cardinalityMeaning: Every evaluation is of exactly one model.
        context: Listed among the model's evaluations.
    - name: dataset
      target: Dataset
      cardinality: 0..1
      ownership: reference
      help:
        summary: The data the model was tested on.
        usage: Named so the test can be repeated.
        cardinalityMeaning: At most one.
        context: Must not overlap the training data.
    - name: reviewedBy
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who independently examined the evaluation and its results.
        usage: Recorded when the reviewer accepts or challenges the findings, ahead of any model approval.
        cardinalityMeaning: At most one reviewer is named per evaluation; it stays empty until review happens.
        workflowRole: Gives the model approval step a named, accountable sign-off on the evidence, independent of the model's developers.
        context: Independent of the model's developers.
  invariants:
    - id: AIEVALUATION-001
      rule: The governing AIModel relationship is required and must reference a valid record.
    - id: AIEVALUATION-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: AIEVALUATION-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: AI Evaluation Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a ai evaluation is ended"
      description: "When a ai evaluation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "AI-EVALUATION-FOLLOW-UP-{{id}}"
              name: "Follow up on ai evaluation {{id}}"
              description: "Ai evaluation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A recorded assessment of an AI model against defined quality, safety, performance or business criteria.
    businessMeaning: An evaluation is the evidence that a model is fit for a stated use. Approval and deployment decisions rest on completed evaluations, so each one must stay reproducible after the model changes.
    usage: Created when a model is tested before approval, after a retraining, or on a periodic review; read by governance reviewers deciding whether to approve, keep or suspend the model.
    relationshipContext: Every evaluation belongs to exactly one AIModel, the model being assessed; the model's lifecycle checks look for a completed evaluation before deployment.
    lifecycle: An evaluation starts as a draft while criteria and test data are agreed, becomes active while tests run, and ends completed with results or cancelled if abandoned. A completed evaluation is never rewritten; a repeat test is a new evaluation.
    example: A fairness and accuracy evaluation of version 3.2 of a credit-scoring model, run against last quarter's holdout data and completed with a pass.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AIEVALUATION
