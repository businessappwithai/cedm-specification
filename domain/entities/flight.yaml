entity:
  name: Flight
  namespace: cedm.domain
  kind: travel_transport_entity
  description: A scheduled or operational air transport service between locations.
  ui:
    icon: plane
    recordLabel: [flightNumber, departureAt]
  identity:
    key: flightId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: flightId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the flight record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a flight store this identifier. The number or code people quote is a separate field.
  - name: flightNumber
    type: string
    required: true
    maxLength: 30
    help:
      summary: The flight number, such as AF1234.
      usage: Shown on bookings and boarding passes.
      relationshipContext: Unique together with the departure date.
  - name: departureAt
    type: datetime
    required: true
    help:
      summary: The scheduled departure time.
      usage: Shown on bookings; delays are measured from it.
      relationshipContext: Before the arrival time.
  - name: arrivalAt
    type: datetime
    required: true
    help:
      summary: The scheduled arrival time.
      usage: Shown on bookings; used for connections.
      relationshipContext: After the departure time.
  - name: status
    type: enum
    required: true
    default: SCHEDULED
    values:
    - SCHEDULED
    - BOARDING
    - DEPARTED
    - ARRIVED
    - DELAYED
    - CANCELLED
    help:
      summary: Where the flight is today.
      usage: Updated by operations.
      relationshipContext: Cancelled flights trigger rebooking.
      valueSemantics:
        SCHEDULED: Planned to operate on time.
        DELAYED: Expected to leave later than scheduled.
        BOARDING: Passengers are boarding.
        DEPARTED: Left the gate.
        ARRIVED: Arrived at its destination.
        CANCELLED: Will not operate.
  - name: actualDepartureAt
    type: datetime
    required: false
    help:
      summary: When the flight actually left.
      usage: Recorded by operations.
      relationshipContext: Present once departed.
  - name: actualArrivalAt
    type: datetime
    required: false
    help:
      summary: When the flight actually arrived.
      usage: Recorded by operations.
      relationshipContext: Present once arrived.
  relationships:
  - name: origin
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: The airport the flight leaves from.
      usage: Set from the schedule.
      cardinalityMeaning: Exactly one.
      context: Different from the destination.
  - name: destination
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: The airport the flight goes to.
      usage: Set from the schedule.
      cardinalityMeaning: Exactly one.
      context: Different from the origin.
  - name: carrier
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The airline operating the flight.
      usage: Set from the schedule.
      cardinalityMeaning: Exactly one.
      context: Codeshares name the operating carrier.
  - name: vehicle
    target: Aircraft
    cardinality: 0..1
    ownership: reference
    help:
      summary: The aircraft assigned to the flight.
      usage: Assigned by operations.
      cardinalityMeaning: At most one.
      context: May change until departure.
  invariants:
  - {id: FLIGHT-001, rule: An arrived flight records its actual times., violatedWhen: status == "ARRIVED" and (actual_departure_at == null or actual_arrival_at == null), message: Record the actual departure and arrival times.}
  lifecycle:
    title: Flight Lifecycle
    attribute: status
    states: [SCHEDULED, BOARDING, DEPARTED, ARRIVED, DELAYED, CANCELLED]
    initial: SCHEDULED
    terminal: [ARRIVED, CANCELLED]
    transitions:
    - {from: SCHEDULED, to: DELAYED, action: delay}
    - {from: DELAYED, to: BOARDING, action: board}
    - {from: SCHEDULED, to: BOARDING, action: board}
    - {from: BOARDING, to: DEPARTED, action: depart}
    - {from: DEPARTED, to: ARRIVED, action: arrive}
    - {from: SCHEDULED, to: CANCELLED, action: cancel}
    - {from: DELAYED, to: CANCELLED, action: cancel}
    - {from: BOARDING, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a flight is ended"
    description: "When a flight is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "FLIGHT-FOLLOW-UP-{{id}}"
          name: "Follow up on flight {{flight_number}}"
          description: "Flight {{flight_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A scheduled flight on a date, with its route, times and aircraft.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Location, Organization, Aircraft. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Airlines and travel managers record flights with their schedule, aircraft and status; bookings and trip segments refer to them; operations update their status from departure control and flight tracking.
    lifecycle: Scheduled, possibly delayed, boarding, departed and arrived. A flight can be cancelled before it departs.
    example: Flight AF1234 Lyon → Paris CDG, scheduled 07:15–08:20 on 4 June 2024, Airbus A320 F-HBXA, departed 07:22, arrived 08:24.
    businessMeaning: Bookings, crew and aircraft assignments, and operational performance are all organised by flight.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FLIGHT
