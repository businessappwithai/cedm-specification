entity:
  name: Flight
  namespace: cedm.domain
  kind: travel_transport_entity
  description: A scheduled or operational air transport service between locations.
  ui:
    icon: plane
  identity:
    key: flightId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: flightId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the flight record.
        usage: Generated on creation; bookings and crew assignments refer to it.
    - name: flightNumber
      type: string
      required: true
      maxLength: 30
      help:
        summary: The public flight number, such as LH400.
        usage: Assigned by the carrier; shown on tickets and boards. The same number is reused on different days.
    - name: departureAt
      type: datetime
      required: true
      help:
        summary: The scheduled or actual time of departure.
        usage: Set from the schedule and updated on delay; arrival must be later than it.
    - name: arrivalAt
      type: datetime
      required: true
      help:
        summary: The scheduled or actual time of arrival.
        usage: Set from the schedule and updated on delay.
    - name: status
      type: enum
      required: true
      default: SCHEDULED
      values:
        - SCHEDULED
        - BOARDING
        - DEPARTED
        - ARRIVED
        - DELAYED
        - CANCELLED
      help:
        summary: Where the flight stands in its operation, from scheduling through boarding and departure to arrival or cancellation.
        usage: Updated by flight operations as the flight progresses; booking and passenger information read it to show delays and cancellations.
        valueSemantics:
          SCHEDULED: Planned on the published schedule and open for booking.
          BOARDING: Boarding has started and passengers are being loaded.
          DEPARTED: The aircraft has left the origin and is in the air.
          ARRIVED: Landed at the destination. A final state.
          DELAYED: Departure is later than scheduled.
          CANCELLED: Will not operate. A final state.
  relationships:
    - name: origin
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The place the flight departs from.
        usage: Chosen when scheduled.
        cardinalityMeaning: 'Exactly one origin: a flight leaves from a single airport.'
        workflowRole: Determines departure handling and time zone.
    - name: destination
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: 'Exactly one destination: a flight is a single leg that ends at one airport.'
        summary: The place the flight arrives at.
        usage: Chosen when scheduled.
        workflowRole: Determines arrival handling and connections.
    - name: carrier
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The airline that operates the flight.
        usage: Set when scheduled.
        cardinalityMeaning: 'Exactly one carrier: the operator is responsible for the flight.'
        workflowRole: Establishes who sells and flies it.
    - name: vehicle
      target: Aircraft
      cardinality: 0..1
      ownership: reference
      help:
        summary: The aircraft assigned to fly it.
        usage: Assigned by operations; changed if the aircraft is swapped.
        cardinalityMeaning: At most one aircraft; the assignment may not yet be made.
        workflowRole: Links the flight to aircraft availability and maintenance.
  invariants:
    - id: FLIGHT-001
      rule: arrivalAt must be later than departureAt.
  lifecycle:
    title: Flight Lifecycle
    attribute: status
    states: [SCHEDULED, BOARDING, DEPARTED, ARRIVED, DELAYED, CANCELLED]
    initial: SCHEDULED
    terminal:
      - ARRIVED
      - CANCELLED
    transitions:
      - {from: SCHEDULED, to: BOARDING, action: start_boarding}
      - {from: BOARDING, to: DEPARTED, action: depart}
      - {from: DEPARTED, to: ARRIVED, action: arrive}
      - {from: SCHEDULED, to: DELAYED, action: delay}
      - {from: DELAYED, to: BOARDING, action: start_boarding}
      - {from: DELAYED, to: CANCELLED, action: cancel}
      - {from: SCHEDULED, to: CANCELLED, action: cancel}
      - {from: BOARDING, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a flight is ended"
      description: "When a flight is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FLIGHT-FOLLOW-UP-{{id}}"
              name: "Follow up on flight {{flight_number}}"
              description: "Flight {{flight_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A scheduled or operated air transport service between two locations.
    businessMeaning: A flight is the unit of air travel that bookings, crews and aircraft are assigned to. It states what flies when, between which places, for which carrier, and where it stands.
    usage: Created when a schedule is published; updated with delays and changes; read by booking, operations and passengers.
    relationshipContext: A flight runs between an origin and destination Location, is operated by a carrier Organization and may be flown by a specific Aircraft.
    lifecycle: A flight is scheduled, may be delayed, boards, departs and arrives. It can be cancelled before departure.
    example: Flight LH400 from Frankfurt to New York, scheduled for 10:25 and flown by an Airbus A340.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FLIGHT
