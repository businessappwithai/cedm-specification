entity:
  name: Flight
  namespace: cedm.domain
  kind: travel_transport_entity
  description: A scheduled or operational air transport service between locations.
  ui:
    icon: plane
  identity:
    key: flightId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: flightId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the flight record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a flight store this identifier. The number or code people quote is a separate field.
  - name: flightNumber
    type: string
    required: true
    maxLength: 30
    help:
      summary: Captures the business meaning of flight number for the Flight. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: departureAt
    type: datetime
    required: true
    help:
      summary: Records when the departure event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: arrivalAt
    type: datetime
    required: true
    help:
      summary: Records when the arrival event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: status
    type: enum
    required: true
    default: SCHEDULED
    values:
    - SCHEDULED
    - BOARDING
    - DEPARTED
    - ARRIVED
    - DELAYED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        SCHEDULED: Represents the scheduled state or classification in the context of Flight.
        BOARDING: Represents the boarding state or classification in the context of Flight.
        DEPARTED: Represents the departed state or classification in the context of Flight.
        ARRIVED: Represents the arrived state or classification in the context of Flight.
        DELAYED: Represents the delayed state or classification in the context of Flight.
        CANCELLED: Represents the cancelled state or classification in the context of Flight.
  relationships:
  - name: origin
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: destination
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: carrier
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: vehicle
    target: Aircraft
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Flight to Aircraft so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Aircraft records associated with a Flight.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  invariants:
  - id: FLIGHT-001
    rule: arrivalAt must be later than departureAt.
  lifecycle:
    title: Flight Lifecycle
    attribute: status
    states: [SCHEDULED, BOARDING, DEPARTED, ARRIVED, DELAYED, CANCELLED]
    initial: SCHEDULED
    terminal: [CANCELLED]
    transitions:
    - {from: SCHEDULED, to: BOARDING, action: mark_boarding}
    - {from: BOARDING, to: DEPARTED, action: mark_departed}
    - {from: DEPARTED, to: ARRIVED, action: mark_arrived}
    - {from: ARRIVED, to: DELAYED, action: mark_delayed}
    - {from: SCHEDULED, to: CANCELLED, action: cancel}
    - {from: BOARDING, to: CANCELLED, action: cancel}
    - {from: DEPARTED, to: CANCELLED, action: cancel}
    - {from: ARRIVED, to: CANCELLED, action: cancel}
    - {from: DELAYED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a flight is ended"
    description: "When a flight is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "FLIGHT-FOLLOW-UP-{{id}}"
          name: "Follow up on flight {{flight_number}}"
          description: "Flight {{flight_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a travel transport entity called Flight within the CEDM business model.
    businessMeaning: Flight is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Flight records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Location, Organization, Aircraft. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Flight record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FLIGHT
