entity:
  name: Flight
  namespace: cedm.domain
  kind: travel_transport_entity
  description: A scheduled or operational air transport service between locations.
  ui:
    icon: plane
  identity:
    key: flightId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: flightId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the flight record associated with this Flight. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Keeps bookings, itineraries and status updates attached to the correct flight even when the same flight number operates on many different days."
  - name: flightNumber
    type: string
    required: true
    maxLength: 30
    help:
      summary: Captures the business meaning of flight number for the Flight. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The airline's published flight designator, such as BA117, which travellers, agents and airport systems use to identify the service."
  - name: departureAt
    type: datetime
    required: true
    help:
      summary: Records when the departure event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the flight leaves its origin; it drives check-in deadlines, connection planning and traveller notifications."
  - name: arrivalAt
    type: datetime
    required: true
    help:
      summary: Records when the arrival event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the flight reaches its destination; ground transport, hotel check-ins and onward connections are planned around it."
  - name: status
    type: enum
    required: true
    default: SCHEDULED
    values:
    - SCHEDULED
    - BOARDING
    - DEPARTED
    - ARRIVED
    - DELAYED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Flight records, where applicable.
      relationshipContext: Its meaning is specific to Flight; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        SCHEDULED: Represents the scheduled state or classification in the context of Flight.
        BOARDING: Represents the boarding state or classification in the context of Flight.
        DEPARTED: Represents the departed state or classification in the context of Flight.
        ARRIVED: Represents the arrived state or classification in the context of Flight.
        DELAYED: Represents the delayed state or classification in the context of Flight.
        CANCELLED: Represents the cancelled state or classification in the context of Flight.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells travellers and agents whether the flight is scheduled, boarding, departed, arrived, delayed or cancelled, so they can rebook or adjust plans in time."
  relationships:
  - name: origin
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: destination
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: carrier
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Flight to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Flight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: vehicle
    target: Aircraft
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Flight to Aircraft so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Aircraft records associated with a Flight.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: FLIGHT-001
    rule: arrivalAt must be later than departureAt.
  lifecycle:
    title: Flight Lifecycle
    attribute: status
    states: [SCHEDULED, BOARDING, DEPARTED, ARRIVED, DELAYED, CANCELLED]
    initial: SCHEDULED
    terminal: [CANCELLED]
    transitions:
      - {from: SCHEDULED, to: BOARDING, action: mark_boarding}
      - {from: BOARDING, to: DEPARTED, action: mark_departed}
      - {from: DEPARTED, to: ARRIVED, action: mark_arrived}
      - {from: ARRIVED, to: DELAYED, action: mark_delayed}
      - {from: SCHEDULED, to: CANCELLED, action: cancel}
      - {from: BOARDING, to: CANCELLED, action: cancel}
      - {from: DEPARTED, to: CANCELLED, action: cancel}
      - {from: ARRIVED, to: CANCELLED, action: cancel}
      - {from: DELAYED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a flight is ended"
      description: "When a flight is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FLIGHT-FOLLOW-UP-{{id}}"
              name: "Follow up on flight {{flight_number}}"
              description: "Flight {{flight_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One scheduled air service from an origin to a destination, operated by an airline with a flight number and departure and arrival times, used to book and track travel."
    businessMeaning: Flight is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Flight records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Location,
      Organization, Aircraft. These relationships provide the context needed to interpret the record rather than treating
      its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Flight record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "The flight is created when the schedule is published, travel bookings reference it while it is scheduled, it moves to boarding and departed on the day, and is marked arrived on landing; delays are flagged as they become known, and a flight that will not operate can be cancelled at any point before completion."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FLIGHT
