entity:
  name: CertificateOfAnalysis
  namespace: cedm.domain
  kind: quality_certificate
  description: A governed certificate summarizing quality results for a product, lot, batch, receipt, shipment, or other controlled material context without replacing underlying inspection and measurement evidence.
  ui:
    icon: table
    recordLabel: [certificateNumber]
  identity: {key: certificateOfAnalysisId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: certificateOfAnalysisId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the certificate of analysis record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a certificate of analysis store this identifier. The number or code people quote is a separate field.
  - name: certificateNumber
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: The number printed on the certificate.
      businessMeaning: Controlled number used to identify the issued certificate.
      usage: Quoted by customers and auditors.
      relationshipContext: Unique.
  - name: issuedAt
    type: datetime
    required: false
    help:
      summary: When the certificate was issued.
      businessMeaning: Establishes when the quality statement became externally or operationally effective.
      optionalMeaning: Optional before issuance.
      usage: Recorded on issue.
      relationshipContext: Present once issued.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
    help:
      summary: Where the certificate stands.
      businessMeaning: "Controls whether the certificate is preparatory, approved, issued, replaced, or invalidated."
      usage: Moved on by approval and issue.
      relationshipContext: Issued certificates are not changed; a correction supersedes them.
      valueSemantics:
        DRAFT: Being prepared.
        APPROVED: Approved, not yet issued.
        ISSUED: Sent to the customer or filed with the receipt.
        SUPERSEDED: Replaced by a corrected certificate.
        VOID: Withdrawn.
  - name: lotNumber
    type: string
    required: false
    maxLength: 60
    help:
      summary: The lot or batch the certificate covers.
      usage: Printed on the certificate; matched to the goods received or shipped.
      relationshipContext: As on the product labels.
  - name: conclusion
    type: enum
    required: false
    values: [CONFORMS, CONFORMS_WITH_DEVIATION, DOES_NOT_CONFORM]
    help:
      summary: Whether the material meets its specification.
      usage: Stated on the certificate.
      relationshipContext: A certificate showing non-conformance is not normally issued to a customer.
      valueSemantics:
        CONFORMS: Meets every specification.
        CONFORMS_WITH_DEVIATION: Meets the specification with an approved deviation.
        DOES_NOT_CONFORM: Fails one or more specifications.
  - name: approvedBy
    type: string
    required: false
    maxLength: 200
    help:
      summary: The name of the quality person who approved the certificate.
      usage: Printed with the signature.
      relationshipContext: Must be authorised to release the material.
  relationships:
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product certified.
      businessMeaning: Identifies the material whose quality is certified.
      usage: Set when preparing the certificate.
      cardinalityMeaning: At most one.
      context: Its specification is the reference.
  - name: qualityInspections
    target: QualityInspection
    cardinality: "1..*"
    ownership: reference
    help:
      summary: The inspections whose results the certificate reports.
      businessMeaning: Supplies authoritative execution evidence for the certified conclusions.
      usage: Selected when preparing the certificate.
      cardinalityMeaning: At least one inspection; an inspection may support several certificates.
      context: A many-to-many relation.
  - name: measurements
    target: QualityMeasurement
    cardinality: "0..*"
    ownership: reference
    help:
      summary: The individual results printed on the certificate.
      businessMeaning: Provides source observations behind reported values.
      usage: Selected from the inspections.
      cardinalityMeaning: Any number; each measurement is reported on one certificate.
      context: The measurement records its certificate.
    inverseCardinality: '1'
  - name: goodsReceipt
    target: GoodsReceipt
    cardinality: 0..1
    ownership: reference
    help:
      summary: The receipt the certificate came with, for supplier certificates.
      businessMeaning: Connects supplier quality evidence to received material.
      usage: Linked at receiving.
      cardinalityMeaning: At most one.
      context: Missing certificates can block the receipt.
  - name: shipment
    target: Shipment
    cardinality: 0..1
    ownership: reference
    help:
      summary: The shipment the certificate goes with, for our own certificates.
      businessMeaning: Connects certified quality evidence to delivered material.
      usage: Linked at dispatch.
      cardinalityMeaning: At most one.
      context: Sent to the customer with the goods.
  invariants:
  - {id: COA-001, rule: ISSUED requires issuedAt and at least one completed supporting QualityInspection.}
  - {id: COA-002, rule: Certificate values and conclusions must be reproducible from referenced immutable quality evidence and authorized derived calculations.}
  - {id: COA-003, rule: "Issuance does not itself change inventory, inspection, receipt, shipment, or financial state."}
  - {id: COA-004, rule: "Corrections after issuance create a controlled replacement, supersession, or void history rather than destructive rewriting."}
  - {id: COA-005, rule: "Product, receipt, shipment, inspection, and measurement contexts must reconcile before issuance."}
  lifecycle:
    title: Certificate Of Analysis Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
    initial: DRAFT
    terminal: [SUPERSEDED, VOID]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: ISSUED, action: issue}
    - {from: DRAFT, to: SUPERSEDED, action: mark_superseded}
    - {from: APPROVED, to: SUPERSEDED, action: mark_superseded}
    - {from: ISSUED, to: SUPERSEDED, action: mark_superseded}
    - {from: DRAFT, to: VOID, action: void}
    - {from: APPROVED, to: VOID, action: void}
    - {from: ISSUED, to: VOID, action: void}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a certificate of analysis is ended"
    description: "When a certificate of analysis is void, a task asks someone to settle what depended on it."
    when: "status == \"VOID\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CERTIFICATE-OF-ANALYSIS-FOLLOW-UP-{{id}}"
          name: "Follow up on certificate of analysis {{certificate_number}}"
          description: "Certificate of analysis {{certificate_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Controlled certificate presenting quality evidence for governed material.
    businessMeaning: CertificateOfAnalysis is a released representation of underlying evidence, not a substitute for QualityInspection or QualityMeasurement.
    usage: Supplier quality, customer documentation, regulated release, shipments, receipts, compliance, audit, and integrations.
    relationshipContext: Inspections and measurements supply evidence; Product and receipt/shipment provide material context.
    lifecycle: Draft → approved → issued → superseded/void under controlled document history.
    changePropagation: Changes to open source evidence invalidate draft/approved certificates for revalidation; issued certificates retain historical source references and are corrected by supersession.
    example: Certificate COA-24-0331 for lot L240312-07 of citric acid, issued 13 March 2024, conforms to specification, approved by QA manager R. Lenz.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CERTIFICATE-OF-ANALYSIS}
