entity:
  name: CertificateOfAnalysis
  namespace: cedm.domain
  kind: quality_certificate
  description: A governed certificate summarizing quality results for a product, lot, batch, receipt, shipment, or other controlled material context without replacing underlying inspection and measurement evidence.
  ui:
    icon: table
  identity: {key: certificateOfAnalysisId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: certificateOfAnalysisId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the certificate., businessMeaning: Identifies one issued quality certificate independently of its document number., usage: "Compliance, customer/supplier exchange, audit, and integration.", relationshipContext: Links certificate representation to source quality evidence., requiredMeaning: Required.}}
  - {name: certificateNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: Business-facing certificate reference., businessMeaning: Controlled number used to identify the issued certificate., usage: "Documents, search, exchange, and audit.", relationshipContext: Distinct from inspection and shipment numbers., requiredMeaning: Required.}}
  - {name: issuedAt, type: datetime, required: false, help: {summary: Time the certificate was formally issued., businessMeaning: Establishes when the quality statement became externally or operationally effective., usage: "Compliance, customer documentation, and audit.", relationshipContext: Required once status is ISSUED., optionalMeaning: Optional before issuance.}}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
    help: {summary: Lifecycle state of the certificate., businessMeaning: "Controls whether the certificate is preparatory, approved, issued, replaced, or invalidated.", usage: Release and document governance., relationshipContext: Status does not alter underlying measurements., valueSemantics: {DRAFT: Being prepared., APPROVED: Reviewed and approved for issuance., ISSUED: Formally issued., SUPERSEDED: Replaced by a later controlled certificate., VOID: Invalidated while retained as history.}, requiredMeaning: Required.}
  relationships:
  - {name: product, target: Product, cardinality: 0..1, ownership: reference, help: {summary: Product represented by the certificate., businessMeaning: Identifies the material whose quality is certified., usage: Product release and customer documentation., cardinalityMeaning: Optional when context is supplied by other source records., context: Must reconcile with inspections and measurements.}}
  - {name: qualityInspections, target: QualityInspection, cardinality: "1..*", ownership: reference, help: {summary: Inspections supporting the certificate., businessMeaning: Supplies authoritative execution evidence for the certified conclusions., usage: "Certificate generation, audit, and traceability.", cardinalityMeaning: An issued certificate requires at least one governed inspection., context: Certificate summarizes but does not replace inspections.}}
  - {name: measurements, target: QualityMeasurement, cardinality: "0..*", ownership: reference, help: {summary: Measurements explicitly represented on the certificate., businessMeaning: Provides source observations behind reported values., usage: "Certificate rendering, verification, and audit.", cardinalityMeaning: Zero or many depending on certificate design., context: Must belong to the supporting inspection context.}, inverseCardinality: '1'}
  - {name: goodsReceipt, target: GoodsReceipt, cardinality: 0..1, ownership: reference, help: {summary: Incoming receipt represented by the certificate when applicable., businessMeaning: Connects supplier quality evidence to received material., usage: Incoming quality and supplier documentation., cardinalityMeaning: Optional., context: Must reconcile with inspection receipt context.}}
  - {name: shipment, target: Shipment, cardinality: 0..1, ownership: reference, help: {summary: Outbound shipment accompanied by the certificate when applicable., businessMeaning: Connects certified quality evidence to delivered material., usage: Customer fulfillment and compliance documentation., cardinalityMeaning: Optional., context: Must reconcile with certified product/material context.}}
  invariants:
  - {id: COA-001, rule: ISSUED requires issuedAt and at least one completed supporting QualityInspection.}
  - {id: COA-002, rule: Certificate values and conclusions must be reproducible from referenced immutable quality evidence and authorized derived calculations.}
  - {id: COA-003, rule: "Issuance does not itself change inventory, inspection, receipt, shipment, or financial state."}
  - {id: COA-004, rule: "Corrections after issuance create a controlled replacement, supersession, or void history rather than destructive rewriting."}
  - {id: COA-005, rule: "Product, receipt, shipment, inspection, and measurement contexts must reconcile before issuance."}
  lifecycle:
    title: Certificate Of Analysis Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ISSUED, SUPERSEDED, VOID]
    initial: DRAFT
    terminal: [SUPERSEDED, VOID]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: ISSUED, action: issue}
    - {from: DRAFT, to: SUPERSEDED, action: mark_superseded}
    - {from: APPROVED, to: SUPERSEDED, action: mark_superseded}
    - {from: ISSUED, to: SUPERSEDED, action: mark_superseded}
    - {from: DRAFT, to: VOID, action: void}
    - {from: APPROVED, to: VOID, action: void}
    - {from: ISSUED, to: VOID, action: void}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a certificate of analysis is ended"
    description: "When a certificate of analysis is void, a task asks someone to settle what depended on it."
    when: "status == \"VOID\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CERTIFICATE-OF-ANALYSIS-FOLLOW-UP-{{id}}"
          name: "Follow up on certificate of analysis {{certificate_number}}"
          description: "Certificate of analysis {{certificate_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Controlled certificate presenting quality evidence for governed material.
    businessMeaning: CertificateOfAnalysis is a released representation of underlying evidence, not a substitute for QualityInspection or QualityMeasurement.
    usage: Supplier quality, customer documentation, regulated release, shipments, receipts, compliance, audit, and integrations.
    relationshipContext: Inspections and measurements supply evidence; Product and receipt/shipment provide material context.
    lifecycle: Draft → approved → issued → superseded/void under controlled document history.
    changePropagation: Changes to open source evidence invalidate draft/approved certificates for revalidation; issued certificates retain historical source references and are corrected by supersession.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CERTIFICATE-OF-ANALYSIS}
