entity:
  name: InventoryItem
  namespace: cedm.domain
  kind: inventory_master_entity
  description: A governed inventory-control profile that states how a Product is stocked, measured, replenished and controlled independently of current quantity.
  ui: {icon: package-check}
  identity: {key: inventoryItemId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: inventoryItemId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the inventory-control profile., businessMeaning: Identifies one governed InventoryItem independently of Product and changing stock state., usage: "Inventory setup, planning, integration, reporting and audit.", relationshipContext: Product identifies what is stocked; InventoryItem governs how it is controlled.}}
    - {name: itemCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: The stock-keeping code under which the product is managed in inventory., usage: Assigned when the item is set up and unique; used by the warehouse and in replenishment and count documents., businessMeaning: Operational code used to identify the stock-control profile., relationshipContext: Distinct from Product SKU where a separate inventory identifier is required.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED]
      help:
        summary: Whether the product may currently be stocked and moved.
        usage: Set by inventory control; movements are allowed only for ACTIVE items.
        valueSemantics:
          DRAFT: Being set up; not yet stocked.
          ACTIVE: Available for stocking and movements.
          BLOCKED: Temporarily barred from movements, for example pending a quality issue; it can be unblocked.
          DISCONTINUED: No longer stocked; the item is kept for history. A final state.
        businessMeaning: Separates setup, active use, temporary block and permanent discontinuation.
        relationshipContext: Historical balances and movements remain valid after blocking or discontinuation.
    - {name: safetyStockQuantity, type: decimal, required: false, precision: 20, scale: 6, help: {summary: Minimum planning buffer quantity., businessMeaning: Target stock retained to absorb uncertainty rather than current on-hand quantity., usage: Replenishment and shortage planning., relationshipContext: Interpreted in the stocking UOM.}}
    - {name: reorderPointQuantity, type: decimal, required: false, precision: 20, scale: 6, help: {summary: Quantity threshold at which replenishment should be considered., businessMeaning: Planning trigger rather than an inventory event., usage: "Replenishment, MRP and exception reporting.", relationshipContext: Compared with governed available or projected quantity in the stocking UOM.}}
    - {name: allowNegativeInventory, type: boolean, required: true, default: false, help: {summary: Whether controlled inventory may temporarily become negative., businessMeaning: Explicit exception policy for shortage posting., usage: Inventory validation and exception governance., relationshipContext: Does not remove reconciliation and attributable movement requirements.}}
  relationships:
    - {name: product, target: Product, cardinality: "1", ownership: reference, help: {summary: The product this inventory profile governs., usage: Set when the item is created., cardinalityMeaning: 'Exactly one product: the profile says how that product is stocked.', workflowRole: Separates how a product is described from how it is stocked., businessMeaning: Product defines material identity while InventoryItem defines stock-control behavior.}}
    - {name: stockingUom, target: UnitOfMeasure, cardinality: "1", ownership: reference, help: {summary: The unit of measure in which the product is counted and stocked., usage: Set when the item is created; all quantities for the item are expressed in it., cardinalityMeaning: 'Exactly one stocking unit, so that every quantity is unambiguous.', workflowRole: Other units are converted to this one for balances., businessMeaning: Makes safety stock and reorder thresholds unambiguous.}}
    - {name: organization, target: Organization, cardinality: "0..1", ownership: reference, help: {summary: Organization for which this inventory profile applies., businessMeaning: Allows organization-specific control of the same Product., usage: Multi-company inventory policy and reporting., cardinalityMeaning: Optional when policy is enterprise-wide., workflowRole: Organization changes affect future operations rather than historical movement ownership.}}
    - {name: balances, target: InventoryBalance, cardinality: "0..*", ownership: reference, help: {summary: Current stock-state projections governed by this item., businessMeaning: Separates control policy from current quantity., usage: "Availability, replenishment and reconciliation.", cardinalityMeaning: Zero or many location or lot balances., workflowRole: Balance changes derive from movements and reservations.}}
    - {name: movements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {usage: Read to explain the item's stock history., cardinalityMeaning: 'Any number of movements, all in the stocking unit once converted.', summary: Inventory events executed under this item profile., businessMeaning: Connects stock-control policy to immutable movement history., workflowRole: Each movement must satisfy item status and negative-stock policy at posting time.}}
  invariants:
    - {id: INVENTORY-ITEM-001, rule: safetyStockQuantity and reorderPointQuantity must be non-negative when supplied.}
    - {id: INVENTORY-ITEM-002, rule: An ACTIVE InventoryItem must reference an eligible Product and valid stocking UnitOfMeasure.}
    - {id: INVENTORY-ITEM-003, rule: "BLOCKED or DISCONTINUED prevents new ordinary stock transactions except governed correction, return, disposal or reconciliation flows."}
    - {id: INVENTORY-ITEM-004, rule: Historical InventoryMovement and InventoryBalance evidence must not be rewritten because InventoryItem policy changes.}
  lifecycle:
    title: Inventory Item Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED]
    initial: DRAFT
    terminal: [DISCONTINUED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: BLOCKED, action: block}
      - {from: BLOCKED, to: ACTIVE, action: unblock}
      - {from: DRAFT, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
      - {from: BLOCKED, to: DISCONTINUED, action: discontinue}
  help:
    summary: Governs how a Product participates in inventory without duplicating Product identity or current stock quantities.
    businessMeaning: InventoryItem is the inventory-control master. Product says what the item is; InventoryBalance says how much is currently present; InventoryMovement explains how quantity changed.
    usage: Inventory setup, WMS, replenishment, manufacturing, maintenance spares, fulfillment, planning, audit and integration.
    relationshipContext: Links Product and UnitOfMeasure policy to InventoryBalance and InventoryMovement evidence and may be scoped to an Organization.
    lifecycle: Draft setup becomes active, may be temporarily blocked, and can be discontinued without destroying historical stock evidence.
    example: A bearing Product is activated as an InventoryItem in pieces with a safety stock of 20 and reorder point of 40.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-ITEM}
