entity:
  name: RegulatorySubmission
  namespace: cedm.domain
  kind: regulatory_entity
  description: A formal submission made to a regulatory authority to obtain approval, authorization, registration, or fulfill a regulatory obligation.
  ui:
    icon: table
    recordLabel: [submissionNumber, submissionType]
  identity:
    key: regulatorySubmissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: regulatorySubmissionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the regulatory submission record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a regulatory submission store this identifier. The number or code people quote is a separate field.
  - name: submissionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the submission.
      usage: Quoted to the authority.
      relationshipContext: Unique.
  - name: submissionType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of submission, such as a marketing authorisation or a variation.
      usage: Decides the dossier contents and review timelines.
      relationshipContext: From the authority's procedure types.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - UNDER_REVIEW
    - QUESTIONS
    - APPROVED
    - REJECTED
    - WITHDRAWN
    help:
      summary: Where the submission stands.
      usage: Updated by regulatory affairs.
      relationshipContext: A decision ends it.
      valueSemantics:
        DRAFT: Being prepared.
        SUBMITTED: Filed with the authority.
        UNDER_REVIEW: Being assessed.
        QUESTIONS: The authority has asked questions.
        APPROVED: Granted.
        REJECTED: Refused.
        WITHDRAWN: Withdrawn by the sponsor.
  - name: submittedAt
    type: datetime
    required: false
    help:
      summary: When the submission was filed.
      usage: Starts the authority's review clock.
      relationshipContext: Present once submitted.
  - name: decisionAt
    type: datetime
    required: false
    help:
      summary: When the authority decided.
      usage: Recorded on approval or rejection.
      relationshipContext: Not before submission.
  relationships:
  - name: authority
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The regulatory authority the submission is filed with.
      usage: Set when drafting.
      cardinalityMeaning: Each submission goes to one authority.
      context: Its procedures apply.
  - name: sponsor
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation making the submission.
      usage: Set when drafting.
      cardinalityMeaning: At most one sponsor.
      context: Holds the resulting approval.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: The documents making up the dossier.
      usage: Attached during preparation.
      cardinalityMeaning: Any number of documents.
      context: Kept as filed.
    inverseCardinality: 0..*
  invariants:
  - id: REG-SUB-001
    rule: submittedAt is required when status is SUBMITTED or later.
  - {id: REGULATORY-SUBMISSION-001, rule: A submitted submission states when it was filed., violatedWhen: status != "DRAFT" and status != "WITHDRAWN" and submitted_at == null, message: Enter when the submission was filed.}
  lifecycle:
    title: Regulatory Submission Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, UNDER_REVIEW, QUESTIONS, APPROVED, REJECTED, WITHDRAWN]
    initial: DRAFT
    terminal: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
    - {from: DRAFT, to: SUBMITTED, action: submit}
    - {from: SUBMITTED, to: UNDER_REVIEW, action: start_review}
    - {from: UNDER_REVIEW, to: QUESTIONS, action: ask_questions}
    - {from: QUESTIONS, to: UNDER_REVIEW, action: answer}
    - {from: UNDER_REVIEW, to: APPROVED, action: approve}
    - {from: UNDER_REVIEW, to: REJECTED, action: reject}
    - {from: DRAFT, to: WITHDRAWN, action: withdraw}
    - {from: SUBMITTED, to: WITHDRAWN, action: withdraw}
    - {from: UNDER_REVIEW, to: WITHDRAWN, action: withdraw}
    - {from: QUESTIONS, to: WITHDRAWN, action: withdraw}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a regulatory submission is put forward"
    description: "When a regulatory submission is submitted or under review, a task asks someone to decide on it."
    when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "REGULATORY-SUBMISSION-APPROVAL-{{id}}"
          name: "Decide on regulatory submission {{submission_number}}"
          description: "Regulatory submission {{submission_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a regulatory submission is ended"
    description: "When a regulatory submission is rejected, a task asks someone to settle what depended on it."
    when: "status == \"REJECTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "REGULATORY-SUBMISSION-FOLLOW-UP-{{id}}"
          name: "Follow up on regulatory submission {{submission_number}}"
          description: "Regulatory submission {{submission_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A filing made to a regulator to obtain an approval or meet an obligation.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Organization, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Regulatory affairs staff prepare submissions with their dossier, file them with the authority, answer its questions and record the decision; managers track submissions by status and deadline.
    lifecycle: A submission is drafted, submitted, reviewed by the authority — which may send questions that are answered — and then approved or rejected; it can be withdrawn before a decision.
    example: Submission IND-2024-018, investigational new drug application for ACM-004512 to the FDA, sponsor Acme Pharma, submitted 8 April 2024, approved 8 May 2024.
    businessMeaning: Approvals let the business sell or operate; missing a submission deadline or a question can stop it.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-REGULATORY-SUBMISSION
