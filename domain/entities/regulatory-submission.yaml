entity:
  name: RegulatorySubmission
  namespace: cedm.domain
  kind: regulatory_entity
  description: A formal submission made to a regulatory authority to obtain approval, authorization, registration, or fulfill
    a regulatory obligation.
  ui:
    icon: table
  identity:
    key: regulatorySubmissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: regulatorySubmissionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the regulatory submission record associated with this RegulatorySubmission. The identifier connects
        this record to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for the filing, keeping documents and correspondence with the authority attached to it."
  - name: submissionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of submission number for the RegulatorySubmission. It is interpreted together
        with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The number used with the authority to identify the filing in letters, portals and follow-up questions."
  - name: submissionType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of submission type for the RegulatorySubmission. It is interpreted together with
        the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The kind of filing, such as a new application, variation, renewal or periodic report, which decides the required content and the authority's review timelines."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - UNDER_REVIEW
    - QUESTIONS
    - APPROVED
    - REJECTED
    - WITHDRAWN
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of RegulatorySubmission.
        SUBMITTED: Represents the submitted state or classification in the context of RegulatorySubmission.
        UNDER_REVIEW: Represents the under review state or classification in the context of RegulatorySubmission.
        QUESTIONS: Represents the questions state or classification in the context of RegulatorySubmission.
        APPROVED: Represents the approved state or classification in the context of RegulatorySubmission.
        REJECTED: Represents the rejected state or classification in the context of RegulatorySubmission.
        WITHDRAWN: Represents the withdrawn state or classification in the context of RegulatorySubmission.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows where the filing stands with the authority, from DRAFT and SUBMITTED through UNDER_REVIEW and QUESTIONS to APPROVED, REJECTED or WITHDRAWN, telling the team whether action is needed."
  - name: submittedAt
    type: datetime
    required: false
    help:
      summary: Records when the submitted event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the filing was lodged with the authority, which starts official review clocks and must be present once the submission has been sent."
  - name: decisionAt
    type: datetime
    required: false
    help:
      summary: Records when the decision event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating RegulatorySubmission records,
        where applicable.
      relationshipContext: Its meaning is specific to RegulatorySubmission; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the authority issued its decision, which determines when an approved product or activity may begin and is kept as compliance evidence."
  relationships:
  - name: authority
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects RegulatorySubmission to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a RegulatorySubmission.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: sponsor
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects RegulatorySubmission to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a RegulatorySubmission.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects RegulatorySubmission to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a RegulatorySubmission.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: REG-SUB-001
    rule: submittedAt is required when status is SUBMITTED or later.
  lifecycle:
    title: Regulatory Submission Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, UNDER_REVIEW, QUESTIONS, APPROVED, REJECTED, WITHDRAWN]
    initial: DRAFT
    terminal: [REJECTED, WITHDRAWN]
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: UNDER_REVIEW, action: review}
      - {from: UNDER_REVIEW, to: QUESTIONS, action: mark_questions}
      - {from: QUESTIONS, to: APPROVED, action: approve}
      - {from: DRAFT, to: REJECTED, action: reject}
      - {from: SUBMITTED, to: REJECTED, action: reject}
      - {from: UNDER_REVIEW, to: REJECTED, action: reject}
      - {from: QUESTIONS, to: REJECTED, action: reject}
      - {from: APPROVED, to: REJECTED, action: reject}
      - {from: DRAFT, to: WITHDRAWN, action: withdraw}
      - {from: SUBMITTED, to: WITHDRAWN, action: withdraw}
      - {from: UNDER_REVIEW, to: WITHDRAWN, action: withdraw}
      - {from: QUESTIONS, to: WITHDRAWN, action: withdraw}
      - {from: APPROVED, to: WITHDRAWN, action: withdraw}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a regulatory submission is put forward"
      description: "When a regulatory submission is submitted or under review, a task asks someone to decide on it."
      when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "REGULATORY-SUBMISSION-APPROVAL-{{id}}"
              name: "Decide on regulatory submission {{submission_number}}"
              description: "Regulatory submission {{submission_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a regulatory submission is ended"
      description: "When a regulatory submission is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "REGULATORY-SUBMISSION-FOLLOW-UP-{{id}}"
              name: "Follow up on regulatory submission {{submission_number}}"
              description: "Regulatory submission {{submission_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One formal filing made to a regulatory authority to obtain an approval, registration or authorization, or to meet a reporting obligation, tracked from preparation through the authority's decision."
    businessMeaning: RegulatorySubmission is a business concept with its own identity and lifecycle. It captures information
      that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate RegulatorySubmission records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Organization,
      Document. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical RegulatorySubmission record represents one identifiable business occurrence or master-data object that
      can be referenced by related CEDM processes.
    workflowContext: "Regulatory affairs prepares the submission and its documents as a draft, submits it to the authority, which reviews it and may raise questions that the sponsor answers, and the authority then approves or rejects it; the sponsor can withdraw it before a decision."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-REGULATORY-SUBMISSION
