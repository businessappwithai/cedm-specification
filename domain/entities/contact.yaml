entity:
  name: Contact
  namespace: cedm.domain
  kind: crm_contact
  description: A governed business contact representing a Person in a customer, prospect, supplier, partner, or account relationship context.
  ui:
    icon: table
  identity: {key: contactId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: contactId, type: uuid, required: true, immutable: true, help: {summary: The identity of the contact record., usage: Generated on creation; activities and opportunities refer to the contact.}}
    - {name: code, type: string, required: false, maxLength: 120, help: {summary: 'An optional short reference for the contact, often from an import or an external CRM.', usage: Used to match records during synchronisation.}}
  relationships:
    - {name: person, target: Person, cardinality: '1', ownership: reference, help: {summary: The person who is the contact., usage: Chosen when the contact is created; supplies name and personal details., cardinalityMeaning: Exactly one person; a contact is always a specific human being., workflowRole: Keeps personal identity in one place so the same person can be a contact in several relationships., businessMeaning: Preserves canonical human identity.}}
    - {name: account, target: Account, cardinality: 0..1, ownership: reference, help: {summary: 'The customer, supplier or partner account the person is a contact for.', usage: Set when the person is linked to an organisation relationship., cardinalityMeaning: At most one account; a freelance contact may have none., workflowRole: Gives the contact its business context., businessMeaning: Identifies account for which person is a contact.}}
  invariants:
    - {id: CONTACT-001, rule: "Lifecycle changes, corrections and retries must preserve historical evidence and must not duplicate downstream commercial, physical or financial effects."}
  help:
    summary: A person recorded in a business relationship, such as a contact at a customer, prospect, supplier or partner.
    businessMeaning: Selling and service happen between people. A contact says who the person is in a relationship, which account they belong to, and gives a stable place to hang conversations and activities.
    usage: Created when a person is added to a customer or partner account; read by sales and service staff when they reach out.
    relationshipContext: A contact is a Person associated with an Account; the Person record holds the identity and the contact adds the business context.
    lifecycle: Changes and retries preserve history and do not duplicate commercial effects of past interactions.
    example: Maria Lopez, purchasing manager at a customer account, recorded as the main contact for renewals.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CONTACT}
