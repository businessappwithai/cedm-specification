entity:
  name: ProjectTask
  namespace: cedm.domain
  kind: project_management_entity
  description: A work item contributing to delivery of a project objective or deliverable.
  ui:
    icon: folder-kanban
    recordLabel: [taskCode, name]
  identity:
    key: projectTaskId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: projectTaskId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the project task record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a project task store this identifier. The number or code people quote is a separate field.
  - name: taskCode
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the task within its project.
      usage: Used in plans and status reports.
      relationshipContext: Unique within the project.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What the task is.
      usage: Shown in task lists and boards.
      relationshipContext: Starts with a verb where possible.
  - name: status
    type: enum
    required: true
    default: NOT_STARTED
    values:
    - NOT_STARTED
    - IN_PROGRESS
    - BLOCKED
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the task stands.
      usage: Updated by the assignee.
      relationshipContext: Completed tasks are 100 % complete.
      valueSemantics:
        NOT_STARTED: Planned; not begun.
        IN_PROGRESS: Being worked on.
        BLOCKED: Waiting on something outside the task.
        COMPLETED: Done.
        CANCELLED: Not needed any more.
  - name: priority
    type: enum
    required: true
    default: NORMAL
    values:
    - LOW
    - NORMAL
    - HIGH
    - CRITICAL
    help:
      summary: How urgent the task is.
      usage: Orders the task lists.
      relationshipContext: Defaults to normal.
      valueSemantics:
        LOW: Can wait.
        NORMAL: Ordinary.
        HIGH: To be done before normal tasks.
        CRITICAL: Holds up the project.
  - name: startDate
    type: date
    required: false
    help:
      summary: The day work on the task starts.
      usage: Used for scheduling.
      relationshipContext: Not after the due date.
  - name: dueDate
    type: date
    required: false
    help:
      summary: The day the task should be done.
      usage: Late tasks are flagged.
      relationshipContext: Not before the start date.
  - name: percentComplete
    type: decimal
    required: true
    default: 0
    precision: 5
    scale: 2
    help:
      summary: How much of the task is done, in percent.
      usage: Rolled up into project progress.
      relationshipContext: Between 0 and 100.
  relationships:
  - name: project
    target: Project
    cardinality: '1'
    ownership: reference
    help:
      summary: The project the task belongs to.
      usage: Set when the task is created.
      cardinalityMeaning: Each task belongs to one project.
      context: Listed in the project plan.
  - name: assignee
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person doing the task.
      usage: Assigned by the project manager.
      cardinalityMeaning: At most one assignee.
      context: Sees the task in their work list.
  - name: parentTask
    target: ProjectTask
    cardinality: 0..1
    ownership: reference
    help:
      summary: The task this one is part of.
      usage: Builds the work breakdown.
      cardinalityMeaning: At most one parent task.
      context: No cycles.
  - name: milestone
    target: Milestone
    cardinality: 0..1
    ownership: reference
    help:
      summary: The milestone the task leads to.
      usage: Linked when planning.
      cardinalityMeaning: At most one milestone.
      context: A late task puts it at risk.
  invariants:
  - id: PROJECT-TASK-001
    rule: percentComplete must be between 0 and 100.
  - id: PROJECT-TASK-002
    rule: dueDate must not precede startDate.
  - {id: PROJECT-TASK-003, rule: A completed task is fully complete., violatedWhen: status == "COMPLETED" and percent_complete < 100, message: Set the task to 100 % complete before completing it.}
  lifecycle:
    title: Project Task Lifecycle
    attribute: status
    states: [NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]
    initial: NOT_STARTED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: NOT_STARTED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: IN_PROGRESS, to: BLOCKED, action: block}
    - {from: BLOCKED, to: IN_PROGRESS, action: unblock}
    - {from: NOT_STARTED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
    - {from: BLOCKED, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a project task is stopped"
    description: "When a project task is blocked, a high-priority task asks someone to resolve it."
    when: "status == \"BLOCKED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROJECT-TASK-EXCEPTION-{{id}}"
          name: "Resolve project task {{name}}"
          description: "Project task {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a project task is ended"
    description: "When a project task is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROJECT-TASK-FOLLOW-UP-{{id}}"
          name: "Follow up on project task {{name}}"
          description: "Project task {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a project management entity called ProjectTask within the CEDM business model.
    businessMeaning: ProjectTask is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Project, Party, ProjectTask, Milestone. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Project teams break the project into tasks, assign them, record progress and blockers, and link them to the milestones they lead to.
    lifecycle: A task is not started, in progress while worked on, blocked while waiting and back in progress when unblocked, and ends completed or cancelled.
    example: Task T-014 'Configure put-away rules', project WMS-2024, assigned to Sara Galli, high priority, 60 % complete, due 15 June 2024.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROJECT-TASK
