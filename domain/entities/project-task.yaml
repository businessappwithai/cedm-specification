entity:
  name: ProjectTask
  namespace: cedm.domain
  kind: project_management_entity
  description: A work item contributing to delivery of a project objective or deliverable.
  identity: {key: projectTaskId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: projectTaskId, type: uuid, required: true, immutable: true}
    - {name: taskCode, type: string, required: true, maxLength: 100}
    - {name: name, type: string, required: true, maxLength: 300}
    - {name: status, type: enum, required: true, default: NOT_STARTED, values: [NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]}
    - {name: priority, type: enum, required: true, default: NORMAL, values: [LOW, NORMAL, HIGH, CRITICAL]}
    - {name: startDate, type: date, required: false}
    - {name: dueDate, type: date, required: false}
    - {name: percentComplete, type: decimal, required: true, default: 0, precision: 5, scale: 2}
  relationships:
    - {name: project, target: Project, cardinality: "1", ownership: reference}
    - {name: assignee, target: Party, cardinality: "0..1", ownership: reference}
    - {name: parentTask, target: ProjectTask, cardinality: "0..1", ownership: reference}
    - {name: milestone, target: Milestone, cardinality: "0..1", ownership: reference}
  invariants:
    - {id: PROJECT-TASK-001, rule: percentComplete must be between 0 and 100.}
    - {id: PROJECT-TASK-002, rule: dueDate must not precede startDate.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROJECT-TASK}
