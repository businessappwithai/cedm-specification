entity:
  name: User
  namespace: cedm.domain
  kind: identity_entity
  description: A digital identity representing an individual or system principal that can authenticate and act within an application.
  ui:
    icon: user
  identity:
    key: userId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: userId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the user record associated with this User. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating User records, where applicable.
      relationshipContext: Its meaning is specific to User; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Ties the account's roles, sign-in identities and audit trail to one user, so actions can always be attributed even if the username changes."
  - name: username
    type: string
    required: true
    unique: true
    maxLength: 200
    help:
      summary: Captures the business meaning of username for the User. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating User records, where applicable.
      relationshipContext: Its meaning is specific to User; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name the person types to sign in and that appears in audit logs and assignment lists; it must not be shared between people."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - LOCKED
    - DISABLED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating User records, where applicable.
      relationshipContext: Its meaning is specific to User; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PENDING: Represents the pending state or classification in the context of User.
        ACTIVE: Represents the active state or classification in the context of User.
        LOCKED: Represents the locked state or classification in the context of User.
        DISABLED: Represents the disabled state or classification in the context of User.
        RETIRED: Represents the retired state or classification in the context of User.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Decides whether the account can be used: pending accounts await activation, active ones can sign in, locked ones are blocked after security events, disabled ones are switched off by an administrator, and retired accounts are kept only for audit."
  - name: lastLoginAt
    type: datetime
    required: false
    help:
      summary: Records when the last login event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating User records, where applicable.
      relationshipContext: Its meaning is specific to User; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the user last signed in, used by administrators and auditors to spot dormant accounts to disable and to investigate suspicious access."
  relationships:
  - name: party
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects User to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a User.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: roles
    target: Role
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects User to Role so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Role records associated with a User.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: identities
    target: Identity
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects User to Identity so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Identity records associated with a User.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: User Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, LOCKED, DISABLED, RETIRED]
    initial: PENDING
    terminal: [RETIRED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: LOCKED, action: lock}
      - {from: LOCKED, to: ACTIVE, action: unlock}
      - {from: ACTIVE, to: DISABLED, action: disable}
      - {from: DISABLED, to: ACTIVE, action: enable}
      - {from: PENDING, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: LOCKED, to: RETIRED, action: retire}
      - {from: DISABLED, to: RETIRED, action: retire}
  help:
    summary: "A login account that lets a person or a system sign in to the application and act within it, carrying the roles that decide what that user may see and do."
    businessMeaning: User is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate User records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Role, Identity.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical User record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "An administrator or self-registration creates the user as pending, the account is activated and given roles, the person signs in and works, repeated failed logins or security concerns lock it until unlocked, it can be disabled for leave or suspicion and re-enabled, and it is retired when the person leaves or the system integration is withdrawn."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-USER
