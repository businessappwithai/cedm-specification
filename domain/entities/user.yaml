entity:
  name: User
  namespace: cedm.domain
  kind: identity_entity
  description: A digital identity representing an individual or system principal that can authenticate and act within an application.
  ui:
    icon: user
  identity:
    key: userId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: userId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the user record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a user store this identifier. The number or code people quote is a separate field.
  - name: username
    type: string
    required: true
    unique: true
    maxLength: 200
    help:
      summary: The name the person signs in with.
      usage: Chosen when the user is created, usually the work email or a short login name.
      relationshipContext: Unique and never reused, even after the user is retired.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - LOCKED
    - DISABLED
    - RETIRED
    help:
      summary: Whether the user can sign in.
      usage: Moved on by administrators and by the security rules.
      relationshipContext: Only active users can sign in.
      valueSemantics:
        PENDING: Created, not yet activated.
        ACTIVE: May sign in.
        LOCKED: Locked after repeated failed sign-ins; an administrator unlocks it.
        DISABLED: Access suspended by an administrator.
        RETIRED: No longer used; kept for the audit trail.
  - name: lastLoginAt
    type: datetime
    required: false
    help:
      summary: When the user last signed in successfully.
      usage: Recorded on every sign-in; access reviews look for users who have not signed in for a long time.
      relationshipContext: Empty for users who never signed in.
  - name: displayName
    type: string
    required: false
    maxLength: 200
    help:
      summary: The name shown on screens and in the audit trail.
      usage: Usually the person's full name.
      relationshipContext: Taken from the person's party record where linked.
  - name: email
    type: email
    required: false
    help:
      summary: The email address the user receives notifications and password resets at.
      usage: Entered when the user is created; verified before use.
      relationshipContext: Usually the same as the username for people.
  - name: userType
    type: enum
    required: true
    default: PERSON
    values: [PERSON, SERVICE]
    help:
      summary: Whether the user is a person or a system.
      usage: System users sign in with keys or tokens, not passwords, and have no person behind them.
      relationshipContext: System users are reviewed by their owning team.
      valueSemantics:
        PERSON: A person signing in interactively.
        SERVICE: A system or integration acting through the API.
  - name: failedLoginCount
    type: integer
    required: true
    default: 0
    help:
      summary: How many sign-ins have failed since the last successful one.
      usage: The user is locked when it reaches the configured limit.
      relationshipContext: Reset on a successful sign-in.
  - name: passwordChangedAt
    type: datetime
    required: false
    help:
      summary: When the password was last changed.
      usage: Used to enforce password expiry where the policy requires it.
      relationshipContext: Empty for system users.
  - name: mfaEnabled
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the user signs in with a second factor.
      usage: Required for privileged users by the access policy.
      relationshipContext: Read in access reviews.
  relationships:
  - name: party
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person or organization behind the user.
      usage: Linked for people so that their name and contact details come from one place.
      cardinalityMeaning: At most one party.
      context: System users usually have none.
  - name: roles
    target: Role
    cardinality: 0..*
    ownership: reference
    help:
      summary: The roles the user holds.
      usage: Given through access grants, which record who approved them.
      cardinalityMeaning: A user holds any number of roles; a role is held by any number of users.
      context: A many-to-many relation; access grants are the records of each assignment.
  - name: identities
    target: Identity
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The external identities the user signs in with, such as a corporate single sign-on account.
      usage: Linked when the user first signs in through an identity provider.
      cardinalityMeaning: Any number of identities per user.
      context: Each identity belongs to one user.
  lifecycle:
    title: User Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, LOCKED, DISABLED, RETIRED]
    initial: PENDING
    terminal: [RETIRED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: LOCKED, action: lock}
    - {from: LOCKED, to: ACTIVE, action: unlock}
    - {from: ACTIVE, to: DISABLED, action: disable}
    - {from: DISABLED, to: ACTIVE, action: enable}
    - {from: PENDING, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: LOCKED, to: RETIRED, action: retire}
    - {from: DISABLED, to: RETIRED, action: retire}
  help:
    summary: A person or system that signs in to the application.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Role, Identity. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Administrators create users when people join or systems are connected, grant them access through roles, lock or disable them when needed, and retire them when people leave. Every action in the application is performed as a user and recorded in the audit trail under it.
    lifecycle: Pending until first activated; active while in use; locked automatically after repeated failed sign-ins and unlocked by an administrator; disabled when access must be suspended; retired when the person leaves for good. A retired user is never reused, so the audit trail keeps pointing at the right person.
    example: User m.lopez (Maria Lopez, Accounts Payable), active since 1 April 2024, roles Accounts Payable Clerk and Employee Self-Service, last signed in 4 June 08:12.
    businessMeaning: Access, accountability and audit trails depend on each action being attributed to a user.
  invariants:
  - {id: USER-001, rule: The failed sign-in count is not negative., violatedWhen: failed_login_count != null and failed_login_count < 0, message: The failed sign-in count cannot be negative.}
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-USER
