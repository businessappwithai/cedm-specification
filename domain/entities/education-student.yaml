entity:
  name: EducationStudent
  namespace: cedm.domain
  kind: education_entity
  description: A learner enrolled or eligible for enrollment in an educational institution or program.
  ui:
    icon: graduation-cap
  identity:
    key: studentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: studentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the education student record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a education student store this identifier. The number or code people quote is a separate field.
  - name: partyId
    type: reference
    target: Party
    required: true
    unique: true
    help:
      summary: The party record of the student, holding their name, addresses and contact details.
      usage: Linked when the student record is created.
      relationshipContext: The same person may also be a customer or an employee.
  - name: studentNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The student's number at the institution.
      usage: Printed on the student card and on every document about the student.
      relationshipContext: Unique and never reused.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - APPLICANT
    - ACTIVE
    - SUSPENDED
    - GRADUATED
    - WITHDRAWN
    - ALUMNI
    help:
      summary: Where the student is in their relationship with the institution.
      usage: Moved on by admissions and the registry.
      relationshipContext: Only active students may enrol on courses.
      valueSemantics:
        APPLICANT: Applied, not yet admitted.
        ACTIVE: Studying.
        SUSPENDED: Studies paused, for disciplinary, financial or personal reasons.
        GRADUATED: Completed a programme.
        WITHDRAWN: Left without completing.
        ALUMNI: A graduate kept in touch with.
  - name: dateOfAdmission
    type: date
    required: false
    help:
      summary: When the student was admitted.
      usage: Recorded by admissions.
      relationshipContext: Not later than any enrolment.
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The party record of the student.
      usage: Linked when the record is created.
      cardinalityMeaning: Every student is exactly one party.
      context: Contact details live on the party.
  - name: enrollments
    target: Enrollment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The student's enrolments on programmes.
      usage: Listed from the student.
      cardinalityMeaning: A student may hold any number of enrolments over time.
      context: Each enrolment is for one student.
  - name: institution
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The institution the student studies at.
      usage: Set at admission.
      cardinalityMeaning: At most one.
      context: Multi-campus institutions name the campus in the enrolment.
  lifecycle:
    title: Education Student Lifecycle
    attribute: status
    states: [APPLICANT, ACTIVE, SUSPENDED, GRADUATED, WITHDRAWN, ALUMNI]
    initial: APPLICANT
    terminal: [WITHDRAWN, ALUMNI]
    transitions:
    - {from: APPLICANT, to: ACTIVE, action: admit}
    - {from: APPLICANT, to: WITHDRAWN, action: withdraw}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: reinstate}
    - {from: ACTIVE, to: GRADUATED, action: graduate}
    - {from: ACTIVE, to: WITHDRAWN, action: withdraw}
    - {from: SUSPENDED, to: WITHDRAWN, action: withdraw}
    - {from: GRADUATED, to: ALUMNI, action: become_alumnus}
    - {from: GRADUATED, to: ACTIVE, action: enrol_again}
  help:
    summary: A person studying, or applying to study, at the institution.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Enrollment, Organization. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: The student record is the institution's account of a learner — their number, status, programmes and contact — kept for the whole of their relationship from applicant to alumnus, and the record every enrolment, grade, fee and award is linked to.
    usage: Created by admissions when an applicant is accepted; maintained by the registry; used by teaching, finance and student services; kept after graduation for transcripts and alumni relations.
    lifecycle: Applicant until admitted, then active; suspended while studies are paused; graduated on completing a programme and then an alumnus; withdrawn if they leave without completing.
    example: Student 2024-00871, Amina Diallo, active since 16 September 2024, enrolled on the BSc Computer Science.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EDUCATION-STUDENT
