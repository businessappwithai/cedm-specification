      type: uuid
      required: true
      immutable: true
      help:
        summary: Identifies the student record associated with this EducationStudent. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationStudent records, where applicable.
        relationshipContext: Its meaning is specific to EducationStudent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: partyId
      type: reference
      target: Party
      required: true
      unique: true
      help:
        summary: Identifies the related Party associated with this EducationStudent. It provides the link needed to navigate from this record to the related business object.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationStudent records, where applicable.
        relationshipContext: This field connects EducationStudent to Party. The reference establishes business context between the two entities and lets processes navigate from this record to the related Party.
    - name: studentNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: Captures the business meaning of student number for the EducationStudent. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationStudent records, where applicable.
        relationshipContext: Its meaning is specific to EducationStudent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - APPLICANT
        - ACTIVE
        - SUSPENDED
        - GRADUATED
        - WITHDRAWN
        - ALUMNI
      help:
        summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationStudent records, where applicable.
        relationshipContext: Its meaning is specific to EducationStudent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          APPLICANT: Represents the applicant state or classification in the context of EducationStudent.
          ACTIVE: Represents the active state or classification in the context of EducationStudent.
          SUSPENDED: Represents the suspended state or classification in the context of EducationStudent.
          GRADUATED: Represents the graduated state or classification in the context of EducationStudent.
          WITHDRAWN: Represents the withdrawn state or classification in the context of EducationStudent.
          ALUMNI: Represents the alumni state or classification in the context of EducationStudent.
  relationships:
    - name: party
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: Connects EducationStudent to Party so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Party records associated with a EducationStudent.
        cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: enrollments
      target: Enrollment
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: Connects EducationStudent to Enrollment so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Enrollment records associated with a EducationStudent.
        cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: institution
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: Connects EducationStudent to Organization so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Organization records associated with a EducationStudent.
        cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - {name: guardians, target: Guardian, cardinality: "0..*", ownership: reference, help: {summary: Guardian roles associated with this student., businessMeaning: "Supplies authorized responsibility, communication or sponsorship context without duplicating Party identity.", usage: "Student administration, consent, communication and billing.", cardinalityMeaning: Zero or many guardians according to policy., workflowRole: Current authority is evaluated independently of historical communications or consent.}}
    - {name: classes, target: Class, cardinality: "0..*", ownership: reference, help: {summary: Class offerings in which this student participates., businessMeaning: Provides delivery-instance context for attendance and assessment., usage: "Schedules, registers and learner portals.", cardinalityMeaning: Zero or many Classes., workflowRole: Membership should reconcile through eligible Enrollment or scheduling policy.}}
    - {name: attendanceRecords, target: Attendance, cardinality: "0..*", ownership: reference, help: {summary: Attendance evidence recorded for this student., businessMeaning: Preserves actual participation or absence history., usage: "Registers, learner support and reporting.", cardinalityMeaning: Zero or many records., workflowRole: Class context and student eligibility must reconcile.}}
    - {name: grades, target: Grade, cardinality: "0..*", ownership: reference, help: {summary: Assessment outcomes recorded for this student., businessMeaning: Preserves learner achievement evidence independently of Assessment definitions., usage: "Gradebook, transcript and analytics.", cardinalityMeaning: Zero or many Grades., workflowRole: Final grades remain historical evidence.}}
    - {name: fees, target: Fee, cardinality: "0..*", ownership: reference, help: {summary: Education fees assessed to this student., businessMeaning: Connects academic participation to education-specific charges without replacing finance claims., usage: "Student accounts, billing and reporting.", cardinalityMeaning: Zero or many Fees., workflowRole: Financial settlement remains reconciled through Invoice and Payment evidence.}}

  lifecycle:
    title: Education Student Lifecycle
    attribute: status
    states: [APPLICANT, ACTIVE, SUSPENDED, GRADUATED, WITHDRAWN, ALUMNI]
    initial: APPLICANT
    terminal: [WITHDRAWN]
    transitions:
      - {from: APPLICANT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: GRADUATED, action: mark_graduated}
      - {from: GRADUATED, to: ALUMNI, action: mark_alumni}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: GRADUATED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: GRADUATED, action: resume}
      - {from: ALUMNI, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ALUMNI, action: resume}
      - {from: APPLICANT, to: WITHDRAWN, action: withdraw}
      - {from: ACTIVE, to: WITHDRAWN, action: withdraw}
      - {from: GRADUATED, to: WITHDRAWN, action: withdraw}
      - {from: ALUMNI, to: WITHDRAWN, action: withdraw}
      - {from: SUSPENDED, to: WITHDRAWN, action: withdraw}
