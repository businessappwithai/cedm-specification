    relationshipContext: The entity participates in a wider business graph through relationships with Party, Enrollment, Organization. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical EducationStudent record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
