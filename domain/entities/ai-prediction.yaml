entity:
  name: AIPrediction
  namespace: cedm.domain
  kind: ai_runtime_entity
  description: A recorded output produced by an AI model for a specific input and execution context.
  ui:
    icon: table
  identity:
    key: aiPredictionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: aiPredictionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the prediction record.
        usage: Generated for every prediction; reviews, overrides and downstream actions point back through it.
    - name: predictionType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of output produced, such as score, label, ranking or generated text.
        usage: Set by the calling system so consumers know how to read the output field and which monitors apply.
    - name: inputReference
      type: string
      required: false
      maxLength: 500
      help:
        summary: A pointer to the input the model was run on, such as a record key or file location, rather than a copy of the data.
        usage: Filled by the calling system so the prediction can be traced to its source without duplicating sensitive input data; leave empty if the input is not retained.
    - name: output
      type: object
      required: true
      help:
        summary: The structured result the model returned for the input.
        usage: Stored as a structured object because output shapes vary by model type; it is read by the consuming process and by reviewers.
    - name: confidence
      type: decimal
      required: false
      precision: 8
      scale: 6
      help:
        summary: How certain the model reports it is about this output, from 0 (no confidence) to 1 (full confidence).
        usage: Recorded when the model supplies a score; used to route low-confidence results for human review and to monitor calibration.
    - name: predictedAt
      type: datetime
      required: true
      help:
        summary: When the model produced this output.
        usage: Set automatically at run time; the basis for ordering, drift monitoring and reconstructing what the model said at a given moment.
    - name: humanReviewStatus
      type: enum
      required: true
      default: NOT_REQUIRED
      values:
        - NOT_REQUIRED
        - PENDING
        - ACCEPTED
        - OVERRIDDEN
        - REJECTED
      help:
        summary: Whether a person has to review this output and, if so, what they decided.
        usage: Set to PENDING when policy requires review, then updated by the reviewer; downstream actions on high-risk predictions wait for a decision.
        valueSemantics:
          NOT_REQUIRED: The output is used without human review under the governing policy.
          PENDING: Awaiting a reviewer's decision.
          ACCEPTED: A reviewer confirmed the output and it may be acted on.
          OVERRIDDEN: A reviewer replaced the output with their own decision; the reviewer is recorded.
          REJECTED: A reviewer refused the output and it must not be acted on.
  relationships:
    - name: model
      target: AIModel
      cardinality: '1'
      ownership: reference
      help:
        summary: The AI model that produced this prediction.
        usage: Set by the runtime system; used to attribute results, measure each model's performance and investigate faults.
        cardinalityMeaning: Exactly one model per prediction; one model has many predictions.
        workflowRole: Connects each output to the model and version accountable for it.
    - name: reviewer
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person or party who reviewed the prediction.
        usage: Recorded when a reviewer accepts, overrides or rejects the output.
        cardinalityMeaning: At most one reviewer; empty until a review takes place or when no review is required.
        workflowRole: An overridden prediction must name its reviewer, so every human override is attributable.
  invariants:
    - id: AI-PREDICTION-001
      rule: confidence must be between 0 and 1 when supplied.
    - id: AI-PREDICTION-002
      rule: an OVERRIDDEN prediction requires a reviewer.
  help:
    summary: A recorded output produced by an AI model for a specific input and execution context, with its confidence and any human review.
    businessMeaning: Predictions are the model's actual decisions and suggestions. Keeping them lets the organisation explain a result, measure how well the model performs and prove who reviewed or overrode it.
    usage: Written by runtime systems each time a model is run; read by monitoring, disputes handling, reviewers and auditors.
    relationshipContext: Each prediction belongs to the AIModel (and version) that produced it, and may be reviewed by a Party who accepts, overrides or rejects it.
    lifecycle: A prediction has no draft state; it is a fact once recorded. Only its human-review status moves, from pending to accepted, overridden or rejected where review is required.
    example: The churn model scored customer 4711 at 0.87 probability of leaving; a retention analyst reviewed it, accepted it and added the customer to a call list.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-PREDICTION
