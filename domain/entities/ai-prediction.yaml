entity:
  name: AIPrediction
  namespace: cedm.domain
  kind: ai_runtime_entity
  description: A recorded output produced by an AI model for a specific input and execution context.
  ui:
    icon: table
  identity:
    key: aiPredictionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aiPredictionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the ai prediction record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a ai prediction store this identifier. The number or code people quote is a separate field.
  - name: predictionType
    type: string
    required: true
    maxLength: 100
    help:
      summary: What the prediction is about, such as "credit decision" or "demand forecast".
      usage: Lets predictions of one model be grouped by use.
      relationshipContext: A model may serve several prediction types.
  - name: inputReference
    type: string
    required: false
    maxLength: 500
    help:
      summary: A reference to the input the model was given, such as the application number.
      usage: Lets the prediction be traced back to the case it concerned.
      relationshipContext: The input data itself is kept where policy allows.
  - name: output
    type: object
    required: true
    help:
      summary: What the model returned.
      usage: Stored as returned, so the decision can be reconstructed.
      relationshipContext: Structured data whose shape depends on the model type.
  - name: confidence
    type: decimal
    required: false
    precision: 8
    scale: 6
    help:
      summary: How confident the model was, from 0 to 1.
      usage: Low-confidence predictions may be routed to a person.
      relationshipContext: Not every model provides one.
  - name: predictedAt
    type: datetime
    required: true
    help:
      summary: When the prediction was made.
      usage: Set by the serving platform.
      relationshipContext: Not edited.
  - name: humanReviewStatus
    type: enum
    required: true
    default: NOT_REQUIRED
    values:
    - NOT_REQUIRED
    - PENDING
    - ACCEPTED
    - OVERRIDDEN
    - REJECTED
    help:
      summary: Whether a person has reviewed the prediction, and what they decided.
      usage: Moved on by the reviewer.
      relationshipContext: Overridden predictions must name the reviewer.
      valueSemantics:
        NOT_REQUIRED: No review is needed under the policy.
        PENDING: Waiting for a person to review it.
        ACCEPTED: A person agreed with it.
        OVERRIDDEN: A person replaced it with a different decision.
        REJECTED: A person found it unusable.
  - name: overrideReason
    type: string
    required: false
    maxLength: 500
    help:
      summary: Why the reviewer overrode the prediction.
      usage: Written when overriding; read in model monitoring.
      relationshipContext: Present only on overridden predictions.
  relationships:
  - name: model
    target: AIModel
    cardinality: '1'
    ownership: reference
    help:
      summary: The model that made the prediction.
      usage: Set by the serving platform.
      cardinalityMeaning: Every prediction is made by exactly one model.
      context: Listed among the model's predictions.
  - name: reviewer
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person who reviewed the prediction.
      usage: Recorded with the review.
      cardinalityMeaning: At most one.
      context: Required when the prediction is overridden.
  invariants:
  - {id: AIPREDICTION-001, rule: An overridden prediction says why., violatedWhen: human_review_status == "OVERRIDDEN" and override_reason == null, message: Give the reason for overriding the prediction.}
  help:
    summary: One output a model produced for one input, kept with the model version and the context it ran in.
    relationshipContext: The entity participates in a wider business graph through relationships with AIModel, Party. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Written by the serving platform for every prediction that informs a decision; reviewed by a person where the policy requires; sampled by monitoring to detect drift and by auditors to check decisions.
    lifecycle: A prediction is recorded once and not changed. Its review status moves from pending to accepted, overridden or rejected when a person reviews it.
    example: "Prediction by CS-v4.2 for application APP-88213 at 10:42:07: decline, confidence 0.87; reviewed by the credit officer and overridden to approve with reason 'verified income'."
    businessMeaning: A prediction can approve a loan or flag a fraud; keeping it lets people review, explain and correct automated decisions and measure how well the model performs.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-PREDICTION
