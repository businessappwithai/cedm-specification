entity:
  name: AIPrediction
  namespace: cedm.domain
  kind: ai_runtime_entity
  description: A recorded output produced by an AI model for a specific input and execution context.
  ui:
    icon: table
  identity:
    key: aiPredictionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aiPredictionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the ai prediction record associated with this AIPrediction. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets auditors and reviewers point to the exact model answer behind a decision, even when the same input was scored many times."
  - name: predictionType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of prediction type for the AIPrediction. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells people what question the model was answering, for example churn risk or invoice coding, so predictions of different kinds are not compared or acted on together."
  - name: inputReference
    type: string
    required: false
    maxLength: 500
    help:
      summary: Captures the business meaning of input reference for the AIPrediction. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Points back to the case, document or transaction the model looked at, so a reviewer can check the answer against the original evidence."
  - name: output
    type: object
    required: true
    help:
      summary: Captures the business meaning of output for the AIPrediction. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The model's actual answer, such as a label, score or recommended action, which the business process acts on unless a reviewer overrides it."
  - name: confidence
    type: decimal
    required: false
    precision: 8
    scale: 6
    help:
      summary: Captures the business meaning of confidence for the AIPrediction. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How certain the model was, from 0 to 1; teams use it to decide whether an answer can be used automatically or must be checked by a person."
  - name: predictedAt
    type: datetime
    required: true
    help:
      summary: Records when the predicted event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the model gave its answer, which matters for audit trails and for knowing which model version and data were in play at the time."
  - name: humanReviewStatus
    type: enum
    required: true
    default: NOT_REQUIRED
    values:
    - NOT_REQUIRED
    - PENDING
    - ACCEPTED
    - OVERRIDDEN
    - REJECTED
    help:
      summary: Captures the business meaning of human review status for the AIPrediction. It is interpreted together with
        the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIPrediction records, where
        applicable.
      relationshipContext: Its meaning is specific to AIPrediction; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        NOT_REQUIRED: Represents the not required state or classification in the context of AIPrediction.
        PENDING: Represents the pending state or classification in the context of AIPrediction.
        ACCEPTED: Represents the accepted state or classification in the context of AIPrediction.
        OVERRIDDEN: Represents the overridden state or classification in the context of AIPrediction.
        REJECTED: Represents the rejected state or classification in the context of AIPrediction.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether a person needs to check the answer and what they decided: not required, pending, accepted, overridden (which needs a named reviewer) or rejected."
  relationships:
  - name: model
    target: AIModel
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects AIPrediction to AIModel so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about AIModel records associated with a AIPrediction.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: reviewer
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects AIPrediction to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a AIPrediction.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: AI-PREDICTION-001
    rule: confidence must be between 0 and 1 when supplied.
  - id: AI-PREDICTION-002
    rule: an OVERRIDDEN prediction requires a reviewer.
  help:
    summary: "One answer an AI model gave for a specific input, such as a fraud score or a suggested category, kept so people can see what the model said, how sure it was, and whether a person accepted it."
    businessMeaning: AIPrediction is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate AIPrediction records.
    relationshipContext: The entity participates in a wider business graph through relationships with AIModel, Party. These
      relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical AIPrediction record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "A prediction is recorded when an automated step asks a model for an answer; if the use case needs oversight it waits for a reviewer, who accepts, overrides or rejects it; the outcome then feeds the business decision and later model-quality and audit reviews."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-PREDICTION
