entity:
  name: ServiceLevelAgreement
  namespace: cedm.domain
  kind: service_commitment_master
  description: A governed service-performance commitment defining response, resolution, availability, or other measurable obligations applicable to service requests, cases, orders, contracts, or entitled customers.
  ui:
    icon: file-check
  identity: {key: serviceLevelAgreementId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: serviceLevelAgreementId, type: uuid, required: true, immutable: true, help: {summary: Stable SLA identity., businessMeaning: Identifies one governed service commitment definition., usage: "Service operations, entitlement and compliance.", relationshipContext: Referenced by service transactions/contracts.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {businessMeaning: 'The code identifies the agreement in service contracts, cases and reports, so a target can be named without quoting its terms.', summary: SLA business code., usage: Service configuration and reporting., relationshipContext: Stable across display-name changes.}}
    - {name: responseTargetMinutes, type: integer, required: false, help: {summary: Target elapsed minutes to first qualifying response., businessMeaning: Defines response commitment., usage: Deadline calculation/escalation., relationshipContext: Calendar/pause policies may modify elapsed-time computation.}}
    - {name: resolutionTargetMinutes, type: integer, required: false, help: {summary: Target elapsed minutes to qualifying resolution., businessMeaning: Defines resolution commitment., usage: Deadline calculation/escalation., relationshipContext: Applied according to SLA calendar/pause policy.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
      help:
        valueSemantics:
          DRAFT: Being drafted; targets are not yet applied.
          ACTIVE: In force; cases and orders are measured against it.
          SUSPENDED: Temporarily not applied.
          RETIRED: Replaced or withdrawn. A final state.
        summary: SLA lifecycle.
        businessMeaning: Controls applicability to new service work.
        usage: Service governance.
        relationshipContext: Historical service measurements retain applied SLA version.
  relationships:
    - {name: serviceRequests, target: ServiceRequest, cardinality: 0..*, ownership: reference, help: {summary: Requests governed by SLA., businessMeaning: Applies measurable service commitment., usage: Deadline and breach management., cardinalityMeaning: Zero or many requests., workflowRole: SLA changes do not silently recalculate closed historical evidence.}}
    - {name: contract, target: Contract, cardinality: 0..1, ownership: reference, help: {summary: Contract establishing SLA when contractual., businessMeaning: Connects operational target to legal/commercial source., usage: Entitlement and compliance., cardinalityMeaning: Optional for policy-based SLA., workflowRole: Contract eligibility constrains applicability.}}
    - {name: serviceCases, target: ServiceCase, cardinality: "0..*", ownership: reference, help: {summary: Service cases measured against this SLA., businessMeaning: Applies service commitments to durable issue management., usage: "Deadline, breach and escalation reporting.", cardinalityMeaning: Zero or many cases., workflowRole: Historical cases retain the applied SLA/version.}}
    - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of service orders are measured against the agreement., summary: Service orders governed by execution commitments from this SLA., businessMeaning: Extends measurable commitments into service execution., usage: "Scheduling, compliance and audit.", workflowRole: Applied targets remain historical.}}
    - {name: serviceContracts, target: ServiceContract, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of service contracts may carry the same agreement., summary: Service contracts that make this SLA commercially applicable., businessMeaning: Connects measurable service targets to operational contract coverage., usage: "Entitlement and compliance.", workflowRole: Contract changes do not rewrite closed service measurements.}}
    - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of entitlements may promise its targets., summary: Entitlements carrying this SLA directly., businessMeaning: Allows service-level commitments to be scoped to concrete coverage rights., usage: "Authorization and SLA selection.", workflowRole: Historical work retains the applied SLA.}}

  invariants:
    - {id: SLA-001, rule: At least one governed service target must be defined for an ACTIVE SLA.}
    - {id: SLA-002, rule: Target durations must be positive when supplied.}
    - {id: SLA-003, rule: SLA version/target changes must preserve the terms applied to already completed service work.}
  lifecycle:
    title: Service Level Agreement Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Governed measurable service commitment.
    businessMeaning: "SLA defines service targets; service transactions provide actual timestamps/outcomes used to measure compliance."
    usage: "Customer service, support, maintenance and contractual service."
    relationshipContext: "ServiceRequest consumes SLA; Contract may establish commercial/legal basis."
    lifecycle: Draft to active/suspended to retired with historical versions retained.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERVICE-LEVEL-AGREEMENT}
