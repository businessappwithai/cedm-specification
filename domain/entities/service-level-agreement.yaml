entity:
  name: ServiceLevelAgreement
  namespace: cedm.domain
  kind: service_commitment_master
  description: A governed service-performance commitment defining response, resolution, availability, or other measurable obligations applicable to service requests, cases, orders, contracts, or entitled customers.
  ui:
    icon: file-check
  identity: {key: serviceLevelAgreementId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: serviceLevelAgreementId, type: uuid, required: true, immutable: true, help: {summary: "Uniquely identifies this service agreement so requests, cases and contracts point to the right targets.", businessMeaning: Identifies one governed service commitment definition., usage: "Service operations, entitlement and compliance.", relationshipContext: Referenced by service transactions/contracts., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The short name staff use to refer to this agreement level, such as GOLD-24x7.", businessMeaning: Human/integration identifier., usage: Service configuration and reporting., relationshipContext: Stable across display-name changes., requiredMeaning: Required.}}
  - {name: responseTargetMinutes, type: integer, required: false, help: {summary: "How many minutes the team has to first respond to a request covered by this agreement.", businessMeaning: Defines response commitment., usage: Deadline calculation/escalation., relationshipContext: Calendar/pause policies may modify elapsed-time computation., optionalMeaning: Optional when SLA does not govern response.}}
  - {name: resolutionTargetMinutes, type: integer, required: false, help: {summary: "How many minutes the team has to fully resolve a request covered by this agreement.", businessMeaning: Defines resolution commitment., usage: Deadline calculation/escalation., relationshipContext: Applied according to SLA calendar/pause policy., optionalMeaning: Optional when SLA does not govern resolution.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    help: {summary: "Shows whether this agreement is still in draft, active, suspended or retired from use.", businessMeaning: Controls applicability to new service work., usage: Service governance., relationshipContext: Historical service measurements retain applied SLA version., valueSemantics: {DRAFT: Being configured., ACTIVE: Eligible., SUSPENDED: Temporarily unavailable for new assignment., RETIRED: Closed to new use.}, requiredMeaning: Required.}
  relationships:
  - {name: serviceRequests, target: ServiceRequest, cardinality: 0..*, ownership: reference, help: {summary: Requests governed by SLA., businessMeaning: Applies measurable service commitment., usage: Deadline and breach management., cardinalityMeaning: Zero or many requests., workflowRole: SLA changes do not silently recalculate closed historical evidence.}}
  - {name: contract, target: Contract, cardinality: 0..1, ownership: reference, help: {summary: Contract establishing SLA when contractual., businessMeaning: Connects operational target to legal/commercial source., usage: Entitlement and compliance., cardinalityMeaning: Optional for policy-based SLA., workflowRole: Contract eligibility constrains applicability.}}
  - {name: serviceCases, target: ServiceCase, cardinality: "0..*", ownership: reference, help: {summary: Service cases measured against this SLA., businessMeaning: Applies service commitments to durable issue management., usage: "Deadline, breach and escalation reporting.", cardinalityMeaning: Zero or many cases., workflowRole: Historical cases retain the applied SLA/version.}}
  - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {summary: Service orders governed by execution commitments from this SLA., businessMeaning: Extends measurable commitments into service execution., usage: "Scheduling, compliance and audit.", cardinalityMeaning: Zero or many orders., workflowRole: Applied targets remain historical.}}
  - {name: serviceContracts, target: ServiceContract, cardinality: "0..*", ownership: reference, help: {summary: Service contracts that make this SLA commercially applicable., businessMeaning: Connects measurable service targets to operational contract coverage., usage: "Entitlement and compliance.", cardinalityMeaning: Zero or many service contracts., workflowRole: Contract changes do not rewrite closed service measurements.}}
  - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: reference, help: {summary: Entitlements carrying this SLA directly., businessMeaning: Allows service-level commitments to be scoped to concrete coverage rights., usage: "Authorization and SLA selection.", cardinalityMeaning: Zero or many entitlements., workflowRole: Historical work retains the applied SLA.}}

  invariants:
  - {id: SLA-001, rule: At least one governed service target must be defined for an ACTIVE SLA.}
  - {id: SLA-002, rule: Target durations must be positive when supplied.}
  - {id: SLA-003, rule: SLA version/target changes must preserve the terms applied to already completed service work.}
  lifecycle:
    title: Service Level Agreement Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help: {summary: "A service commitment, such as respond within one hour and resolve within eight, that sets measurable targets for service requests, cases or orders, so performance can be tracked against what customers were promised.", businessMeaning: "SLA defines service targets; service transactions provide actual timestamps/outcomes used to measure compliance.", usage: "Customer service, support, maintenance and contractual service.", relationshipContext: "ServiceRequest consumes SLA; Contract may establish commercial/legal basis.", lifecycle: Draft to active/suspended to retired with historical versions retained., example: "SLA GOLD-24x7: respond within 30 minutes and resolve within 240 minutes, active and attached to Acme Corp's premium support contract.", workflowContext: "Service managers draft the agreement and its targets, activate it and attach it to contracts and entitlements; incoming requests, cases and orders then inherit its targets and are measured against them; it can be suspended and resumed, and is retired when replaced by new terms."}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERVICE-LEVEL-AGREEMENT}
