entity:
  name: ContractObligation
  namespace: cedm.domain
  kind: legal_commercial_entity
  description: A specific obligation, commitment, deliverable, or condition arising from a contract.
  ui:
    icon: file-check
  identity:
    key: contractObligationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: contractObligationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the obligation.
        usage: Generated on creation; evidence and breach notices refer to it.
    - name: code
      type: string
      required: true
      maxLength: 100
      help:
        summary: The reference for the obligation within the contract, such as 4.2 or DELIVERY-1.
        usage: Entered when the obligation is created; used in correspondence and reports.
    - name: description
      type: string
      required: true
      maxLength: 4000
      help:
        summary: What exactly must be done, in plain terms.
        usage: Written from the contract text; read by the responsible party and by anyone assessing performance.
    - name: obligationType
      type: enum
      required: true
      values:
        - DELIVERY
        - PAYMENT
        - SERVICE
        - REPORTING
        - COMPLIANCE
        - PERFORMANCE
        - OTHER
      help:
        summary: The kind of commitment.
        usage: Chosen when the obligation is created; drives reminders and how fulfilment is evidenced.
        valueSemantics:
          DELIVERY: Goods or deliverables must be delivered.
          PAYMENT: Money must be paid.
          SERVICE: A service must be performed.
          REPORTING: Information or reports must be supplied.
          COMPLIANCE: A legal, regulatory or standards requirement must be met.
          PERFORMANCE: A level of performance, such as a service level, must be achieved.
          OTHER: Any other commitment.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - IN_PROGRESS
        - FULFILLED
        - BREACHED
        - WAIVED
        - CANCELLED
      help:
        summary: Whether the obligation is still due, being met, or resolved.
        usage: Updated by the contract manager as work proceeds and evidence is received.
        valueSemantics:
          OPEN: Due but not yet started.
          IN_PROGRESS: Being worked on.
          FULFILLED: Met; evidence is on record. A final state.
          BREACHED: Not met in time or at the required standard. A final state that may lead to remedies.
          WAIVED: Released by the other party; no longer required. A final state.
          CANCELLED: No longer applicable, for example because the contract changed. A final state.
    - name: dueDate
      type: date
      required: false
      help:
        summary: The date by which the obligation must be met.
        usage: Taken from the contract; reminders and breach checks use it.
  relationships:
    - name: contract
      target: Contract
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: 'Exactly one contract: every obligation arises from a single agreement, though a contract may carry many.'
        summary: The contract that creates the obligation.
        usage: Set when the obligation is created.
        workflowRole: Obligations are monitored while the contract is active.
    - name: responsibleParty
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party that has to meet the obligation.
        usage: Chosen when the obligation is created; receives reminders and answers for it.
        cardinalityMeaning: Exactly one responsible party; shared duties are split into separate obligations.
        workflowRole: Makes accountability explicit.
  invariants:
    - id: CONTRACT-OBLIGATION-001
      rule: a FULFILLED obligation must have evidence or fulfillment reference where required by policy.
  lifecycle:
    title: Contract Obligation Lifecycle
    attribute: status
    states: [OPEN, IN_PROGRESS, FULFILLED, BREACHED, WAIVED, CANCELLED]
    initial: OPEN
    terminal: [FULFILLED, BREACHED, WAIVED, CANCELLED]
    transitions:
      - {from: OPEN, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: FULFILLED, action: fulfil}
      - {from: IN_PROGRESS, to: BREACHED, action: mark_breached}
      - {from: OPEN, to: WAIVED, action: mark_waived}
      - {from: IN_PROGRESS, to: WAIVED, action: mark_waived}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a contract obligation is stopped"
      description: "When a contract obligation is breached, a high-priority task asks someone to resolve it."
      when: "status == \"BREACHED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CONTRACT-OBLIGATION-EXCEPTION-{{id}}"
              name: "Resolve contract obligation {{code}}"
              description: "Contract obligation {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a contract obligation is ended"
      description: "When a contract obligation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CONTRACT-OBLIGATION-FOLLOW-UP-{{id}}"
              name: "Follow up on contract obligation {{code}}"
              description: "Contract obligation {{code}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A specific obligation, commitment, deliverable or condition that arises from a contract and that one party must fulfil.
    businessMeaning: A contract matters through what it makes people do. Tracking obligations individually shows what is due, who is responsible, and whether it was delivered, so breaches are noticed and claims are supported.
    usage: Created from the contract terms; assigned to a responsible party; updated as work proceeds; read by contract managers and in disputes.
    relationshipContext: Each obligation belongs to one Contract and is the responsibility of one Party.
    lifecycle: An obligation is open, goes in progress, and ends fulfilled, breached or waived; it can be cancelled if the contract no longer requires it. Fulfilment needs evidence where policy requires it.
    example: The supplier must deliver the first batch of parts by 15 May; recorded as an obligation, fulfilled on 14 May with a signed delivery note.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTRACT-OBLIGATION
