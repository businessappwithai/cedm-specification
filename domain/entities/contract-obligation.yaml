entity:
  name: ContractObligation
  namespace: cedm.domain
  kind: legal_commercial_entity
  description: A specific obligation, commitment, deliverable, or condition arising from a contract.
  ui:
    icon: file-check
    recordLabel: [code]
  identity:
    key: contractObligationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: contractObligationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the contract obligation record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a contract obligation store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The reference of the obligation within its contract.
      usage: Used in reminders and reports.
      relationshipContext: Unique within the contract.
  - name: description
    type: string
    required: true
    maxLength: 4000
    help:
      summary: What must be done, as the contract states it.
      usage: Read by the responsible party.
      relationshipContext: The contract text is authoritative.
  - name: obligationType
    type: enum
    required: true
    values:
    - DELIVERY
    - PAYMENT
    - SERVICE
    - REPORTING
    - COMPLIANCE
    - PERFORMANCE
    - OTHER
    help:
      summary: What kind of duty it is.
      usage: Groups obligations in reports.
      relationshipContext: Payment obligations also appear in the accounts.
      valueSemantics:
        DELIVERY: Deliver goods.
        PAYMENT: Pay an amount.
        SERVICE: Perform a service.
        REPORTING: Provide a report or notice.
        COMPLIANCE: Comply with a requirement, such as a certification.
        PERFORMANCE: Meet a service level or target.
        OTHER: Any other duty.
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - OPEN
    - IN_PROGRESS
    - FULFILLED
    - BREACHED
    - WAIVED
    - CANCELLED
    help:
      summary: Where the obligation stands.
      usage: Moved on by the owner.
      relationshipContext: Breached obligations are escalated.
      valueSemantics:
        OPEN: Not yet started.
        IN_PROGRESS: Being performed.
        FULFILLED: Performed.
        BREACHED: Not performed as required.
        WAIVED: Released by the other party.
        CANCELLED: No longer applies after a contract change.
  - name: dueDate
    type: date
    required: false
    help:
      summary: When the obligation must be met.
      usage: Reminders are sent before it.
      relationshipContext: Recurring obligations move it to the next occurrence.
  relationships:
  - name: contract
    target: Contract
    cardinality: '1'
    ownership: reference
    help:
      summary: The contract the obligation comes from.
      usage: Set when recording it.
      cardinalityMeaning: Every obligation arises from exactly one contract.
      context: Listed under the contract.
  - name: responsibleParty
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The party that must perform the obligation.
      usage: Set when recording it.
      cardinalityMeaning: Every obligation has exactly one responsible party.
      context: Either party of the contract.
  invariants:
  - id: CONTRACT-OBLIGATION-001
    rule: a FULFILLED obligation must have evidence or fulfillment reference where required by policy.
  lifecycle:
    title: Contract Obligation Lifecycle
    attribute: status
    states: [OPEN, IN_PROGRESS, FULFILLED, BREACHED, WAIVED, CANCELLED]
    initial: OPEN
    terminal: [FULFILLED, BREACHED, WAIVED, CANCELLED]
    transitions:
    - {from: OPEN, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: FULFILLED, action: fulfil}
    - {from: IN_PROGRESS, to: BREACHED, action: mark_breached}
    - {from: OPEN, to: WAIVED, action: mark_waived}
    - {from: IN_PROGRESS, to: WAIVED, action: mark_waived}
    - {from: OPEN, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a contract obligation is stopped"
    description: "When a contract obligation is breached, a high-priority task asks someone to resolve it."
    when: "status == \"BREACHED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CONTRACT-OBLIGATION-EXCEPTION-{{id}}"
          name: "Resolve contract obligation {{code}}"
          description: "Contract obligation {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a contract obligation is ended"
    description: "When a contract obligation is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CONTRACT-OBLIGATION-FOLLOW-UP-{{id}}"
          name: "Follow up on contract obligation {{code}}"
          description: "Contract obligation {{code}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: One duty a contract imposes on one of its parties, with its due date and status.
    relationshipContext: The entity participates in a wider business graph through relationships with Contract, Party. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: Contracts are only worth what is actually performed. Breaking a contract into its obligations — deliveries, payments, reports, service levels — each with its responsible party and due date, lets the business track performance, chase what is late and prove what was done.
    usage: Recorded by contract managers after signature; owners are reminded before due dates; fulfilment is recorded with its evidence; breaches are escalated.
    lifecycle: Open until work starts, in progress, then fulfilled, breached, waived by the other party, or cancelled if the contract changes.
    example: 'Obligation 4 of contract C-2022-0145: supplier to deliver quarterly quality reports within 15 days of quarter end; next due 15 July 2024; in progress.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTRACT-OBLIGATION
