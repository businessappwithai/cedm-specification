entity:
  name: InventoryReservation
  namespace: cedm.domain
  kind: inventory_commitment_entity
  description: An authorized commitment of available inventory to a demand source without changing physical on-hand quantity. It bridges demand such as SalesOrder or work demand to InventoryBalance and fulfillment, and its lifecycle controls reserved and available quantities.
  ui:
    icon: boxes
  identity: {key: inventoryReservationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: inventoryReservationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the inventory reservation record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a inventory reservation store this identifier. The number or code people quote is a separate field.
  - name: quantityReserved
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: The quantity held for the demand.
      usage: Reduces available stock without moving it.
      relationshipContext: More than zero.
  - name: quantityConsumed
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: The quantity already picked against the reservation.
      usage: Increased as picking is confirmed.
      relationshipContext: With the released quantity, not more than reserved.
  - name: quantityReleased
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: The quantity given back to available stock.
      usage: Increased when part of the reservation is no longer needed.
      relationshipContext: With the consumed quantity, not more than reserved.
  - name: status
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
    help:
      summary: Where the reservation stands.
      usage: Changed by order processing and picking.
      relationshipContext: Active and partially consumed reservations hold stock.
      valueSemantics:
        PENDING: Requested; stock not yet confirmed.
        ACTIVE: Holding stock.
        PARTIALLY_CONSUMED: Partly picked; the rest still held.
        RELEASED: The remaining quantity was given back.
        CONSUMED: Fully picked.
        CANCELLED: Withdrawn before use.
        EXPIRED: Lapsed at its expiry time.
  - name: priority
    type: integer
    required: false
    default: 100
    help:
      summary: The order in which competing reservations are served; lower comes first.
      usage: Used when stock is short.
      relationshipContext: Defaults to 100.
  - name: expiresAt
    type: datetime
    required: false
    help:
      summary: When the reservation lapses if not consumed.
      usage: Expired reservations return their quantity to available stock.
      relationshipContext: Empty for reservations that do not lapse.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The created at of the inventory reservation: a point in time the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its created at.'
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The updated at of the inventory reservation: a point in time the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its updated at.'
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product reserved.
      usage: Set when reserving.
      context: Must match the balance reserved from.
      cardinalityMeaning: Each reservation is for one product.
  - name: inventoryLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: The location the stock is reserved at.
      usage: Set when reserving.
      context: Must be active.
      cardinalityMeaning: Each reservation holds stock at one location.
  - name: salesOrderLine
    target: SalesOrderLine
    cardinality: 0..1
    ownership: reference
    help:
      summary: The order line the stock is reserved for.
      usage: Set when the reservation serves an order.
      context: Empty for reservations for other demands.
      cardinalityMeaning: At most one order line; a line may have several reservations.
  - name: inventoryBalance
    target: InventoryBalance
    cardinality: '1'
    ownership: reference
    help:
      summary: The stock balance the quantity is reserved from.
      usage: Its reserved and available quantities change with the reservation.
      context: Same product and location as the reservation.
      cardinalityMeaning: Each reservation draws on one balance; a balance may carry many reservations.
  invariants:
  - {id: INVENTORY-RESERVATION-001, rule: quantityReserved must be greater than zero when a reservation is created.}
  - {id: INVENTORY-RESERVATION-002, rule: quantityConsumed plus quantityReleased must not exceed quantityReserved.}
  - {id: INVENTORY-RESERVATION-003, rule: A reservation must reference exactly one Product and one InventoryLocation and must use compatible quantity semantics.}
  - {id: INVENTORY-RESERVATION-004, rule: Creating or increasing an ACTIVE reservation must atomically verify and consume the corresponding available quantity without changing physical quantityOnHand.}
  - {id: INVENTORY-RESERVATION-005, rule: Consuming a reservation through fulfillment must create the appropriate InventoryMovement and reduce the remaining reservation atomically or through an equivalent recoverable workflow.}
  - {id: INVENTORY-RESERVATION-006, rule: Releasing or cancelling a reservation must restore the released quantity to available inventory without creating physical stock.}
  - {id: INVENTORY-RESERVATION-007, rule: "Product, UnitOfMeasure, InventoryLocation, SalesOrderLine, or demand-status changes that invalidate an active reservation must trigger a controlled revalidation, transfer, reduction, or release workflow."}
  - {id: INVENTORY-RESERVATION-008, rule: "An InventoryLocation becoming BLOCKED or INACTIVE must not leave an active reservation silently available for allocation; it must be transferred, released, or explicitly excepted."}
  - {id: INVENTORY-RESERVATION-009, rule: "Reservation lifecycle changes must update InventoryBalance.quantityReserved and quantityAvailable through the authoritative reservation workflow, not by direct balance edits."}
  - {id: INVENTORY-RESERVATION-010, rule: Historical consumed/released reservation evidence must remain auditable even after the reservation reaches a terminal status.}
  lifecycle:
    title: Inventory Reservation Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
    initial: PENDING
    terminal: [RELEASED, CONSUMED, CANCELLED, EXPIRED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: confirm}
    - {from: ACTIVE, to: PARTIALLY_CONSUMED, action: consume_in_part}
    - {from: ACTIVE, to: CONSUMED, action: consume}
    - {from: PARTIALLY_CONSUMED, to: CONSUMED, action: consume}
    - {from: ACTIVE, to: RELEASED, action: release}
    - {from: PARTIALLY_CONSUMED, to: RELEASED, action: release}
    - {from: PENDING, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: PARTIALLY_CONSUMED, to: EXPIRED, action: expire}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when an inventory reservation is ended"
    description: "When an inventory reservation is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "INVENTORY-RESERVATION-FOLLOW-UP-{{id}}"
          name: "Follow up on inventory reservation {{id}}"
          description: "Inventory reservation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Controls the commitment of available inventory to demand while separating reservation state from physical stock movement.
    businessMeaning: Reservation means stock is committed, not physically moved. Physical movement occurs only when an authorized fulfillment or inventory movement workflow posts it.
    relationshipContext: Product identifies stock, InventoryLocation identifies where it is reserved, InventoryBalance supplies available state, and SalesOrderLine supplies one possible demand source.
    workflowContext: Demand approved → availability checked → reservation created → InventoryBalance reserved/available updated → pick/issue/fulfillment → reservation consumed and InventoryMovement posted. Cancellation/expiry releases reserved quantity. Master or location changes trigger revalidation.
    concurrency: Reservation creation, increase, consumption and release require transactional concurrency control so available inventory cannot be reserved twice.
    usage: Order processing reserves stock for sales order lines so it is not promised twice; warehouse staff consume the reservation when picking, and planners release reservations that are no longer needed.
    lifecycle: A reservation is pending until stock is confirmed, then active; picking consumes it in part or in full; an unused reservation is released, cancelled, or expires.
    example: Reservation of 40 units of 'Cordless drill X200' at bin A-04-02 for sales order SO-10442 line 2; 25 consumed, status partially consumed.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-RESERVATION}
