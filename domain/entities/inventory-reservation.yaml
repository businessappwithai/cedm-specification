entity:
  name: InventoryReservation
  namespace: cedm.domain
  kind: inventory_commitment_entity
  description: An authorized commitment of available inventory to a demand source without changing physical on-hand quantity. It bridges demand such as SalesOrder or work demand to InventoryBalance and fulfillment, and its lifecycle controls reserved and available quantities.
  ui:
    icon: boxes
  identity: {key: inventoryReservationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: inventoryReservationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: 'The inventory reservation id of the inventory reservation: an identifier the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its inventory reservation id.'
  - name: quantityReserved
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: 'The quantity reserved of the inventory reservation: a number the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its quantity reserved.'
  - name: quantityConsumed
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: 'The quantity consumed of the inventory reservation: a number the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its quantity consumed.'
  - name: quantityReleased
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: 'The quantity released of the inventory reservation: a number the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its quantity released.'
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
    help:
      summary: "The status of the inventory reservation: a value the business records on it."
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: an inventory reservation cannot be understood without its status."
      valueSemantics:
        PENDING: The status of the inventory reservation is pending; set it when that is what the business means for this record.
        ACTIVE: The status of the inventory reservation is active; set it when that is what the business means for this record.
        PARTIALLY_CONSUMED: The status of the inventory reservation is partially consumed; set it when that is what the business means for this record.
        RELEASED: The status of the inventory reservation is released; set it when that is what the business means for this record.
        CONSUMED: The status of the inventory reservation is consumed; set it when that is what the business means for this record.
        CANCELLED: The status of the inventory reservation is cancelled; set it when that is what the business means for this record.
        EXPIRED: The status of the inventory reservation is expired; set it when that is what the business means for this record.
  - name: priority
    type: integer
    required: false
    default: 100
    help:
      summary: 'The priority of the inventory reservation: a whole number the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
  - name: expiresAt
    type: datetime
    required: false
    help:
      summary: 'The expires at of the inventory reservation: a point in time the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The created at of the inventory reservation: a point in time the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its created at.'
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The updated at of the inventory reservation: a point in time the business records on it.'
      usage: Entered or maintained when an inventory reservation is created or changed; shown on its form and available to search
        and reports.
      relationshipContext: Read together with the inventory reservation's other fields and its relationships; it is not meaningful
        on its own.
      requiredMeaning: 'Required: an inventory reservation cannot be understood without its updated at.'
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: Links an inventory reservation to product, the product it relates to.
      usage: Chosen from the existing product records when the inventory reservation is created or edited.
      cardinalityMeaning: An inventory reservation has exactly one product in this role.
      context: Lets the inventory reservation be found from, and reported with, its product.
  - name: inventoryLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: Links an inventory reservation to inventory location, the inventory location it relates to.
      usage: Chosen from the existing inventory location records when the inventory reservation is created or edited.
      cardinalityMeaning: An inventory reservation has exactly one inventory location in this role.
      context: Lets the inventory reservation be found from, and reported with, its inventory location.
  - name: salesOrderLine
    target: SalesOrderLine
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links an inventory reservation to sales order line, the sales order line it relates to.
      usage: Chosen from the existing sales order line records when the inventory reservation is created or edited.
      cardinalityMeaning: An inventory reservation has at most one sales order line in this role.
      context: Lets the inventory reservation be found from, and reported with, its sales order line.
  - name: inventoryBalance
    target: InventoryBalance
    cardinality: '1'
    ownership: reference
    help:
      summary: Links an inventory reservation to inventory balance, the inventory balance it relates to.
      usage: Chosen from the existing inventory balance records when the inventory reservation is created or edited.
      cardinalityMeaning: An inventory reservation has exactly one inventory balance in this role.
      context: Lets the inventory reservation be found from, and reported with, its inventory balance.
  invariants:
  - {id: INVENTORY-RESERVATION-001, rule: quantityReserved must be greater than zero when a reservation is created.}
  - {id: INVENTORY-RESERVATION-002, rule: quantityConsumed plus quantityReleased must not exceed quantityReserved.}
  - {id: INVENTORY-RESERVATION-003, rule: A reservation must reference exactly one Product and one InventoryLocation and must use compatible quantity semantics.}
  - {id: INVENTORY-RESERVATION-004, rule: Creating or increasing an ACTIVE reservation must atomically verify and consume the corresponding available quantity without changing physical quantityOnHand.}
  - {id: INVENTORY-RESERVATION-005, rule: Consuming a reservation through fulfillment must create the appropriate InventoryMovement and reduce the remaining reservation atomically or through an equivalent recoverable workflow.}
  - {id: INVENTORY-RESERVATION-006, rule: Releasing or cancelling a reservation must restore the released quantity to available inventory without creating physical stock.}
  - {id: INVENTORY-RESERVATION-007, rule: "Product, UnitOfMeasure, InventoryLocation, SalesOrderLine, or demand-status changes that invalidate an active reservation must trigger a controlled revalidation, transfer, reduction, or release workflow."}
  - {id: INVENTORY-RESERVATION-008, rule: "An InventoryLocation becoming BLOCKED or INACTIVE must not leave an active reservation silently available for allocation; it must be transferred, released, or explicitly excepted."}
  - {id: INVENTORY-RESERVATION-009, rule: "Reservation lifecycle changes must update InventoryBalance.quantityReserved and quantityAvailable through the authoritative reservation workflow, not by direct balance edits."}
  - {id: INVENTORY-RESERVATION-010, rule: Historical consumed/released reservation evidence must remain auditable even after the reservation reaches a terminal status.}
  lifecycle:
    title: Inventory Reservation Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
    initial: PENDING
    terminal: [CONSUMED, CANCELLED, EXPIRED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: PARTIALLY_CONSUMED, action: mark_partially_consumed}
      - {from: PARTIALLY_CONSUMED, to: RELEASED, action: release}
      - {from: RELEASED, to: CONSUMED, action: consume}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: PARTIALLY_CONSUMED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: PARTIALLY_CONSUMED, to: EXPIRED, action: expire}
      - {from: RELEASED, to: EXPIRED, action: expire}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when an inventory reservation is ended"
      description: "When an inventory reservation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INVENTORY-RESERVATION-FOLLOW-UP-{{id}}"
              name: "Follow up on inventory reservation {{id}}"
              description: "Inventory reservation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Controls the commitment of available inventory to demand while separating reservation state from physical stock movement.
    businessMeaning: Reservation means stock is committed, not physically moved. Physical movement occurs only when an authorized fulfillment or inventory movement workflow posts it.
    usage: Sales fulfillment, maintenance demand, allocation, picking, replenishment, production and inventory control.
    relationshipContext: Product identifies stock, InventoryLocation identifies where it is reserved, InventoryBalance supplies available state, and SalesOrderLine supplies one possible demand source.
    workflowContext: Demand approved → availability checked → reservation created → InventoryBalance reserved/available updated → pick/issue/fulfillment → reservation consumed and InventoryMovement posted. Cancellation/expiry releases reserved quantity. Master or location changes trigger revalidation.
    lifecycle: Pending → Active → Partially consumed → Consumed, or Active → Released/Cancelled/Expired. Terminal states preserve history.
    concurrency: Reservation creation, increase, consumption and release require transactional concurrency control so available inventory cannot be reserved twice.
    example: 100 units are available. A SalesOrderLine reserves 30, making 70 available. Picking consumes 10 reserved units and posts the corresponding issue movement; the reservation has 20 remaining. If the location is blocked, the reservation must be transferred or released before the stock can be considered available elsewhere.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-RESERVATION}
