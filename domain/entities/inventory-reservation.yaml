entity:
  name: InventoryReservation
  namespace: cedm.domain
  kind: inventory_commitment_entity
  description: An authorized commitment of available inventory to a demand source without changing physical on-hand quantity. It bridges demand such as SalesOrder or work demand to InventoryBalance and fulfillment, and its lifecycle controls reserved and available quantities.
  ui:
    icon: boxes
  identity: {key: inventoryReservationId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: inventoryReservationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the reservation.
        usage: Generated on creation; picks and issues refer to it.
    - name: quantityReserved
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The quantity that is set aside.
        usage: Set when the reservation is made; it reduces the available quantity of the balance.
    - name: quantityConsumed
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help:
        summary: The quantity of the reservation that has been issued.
        usage: Increases as picks are confirmed; never more than the quantity reserved.
    - name: quantityReleased
      type: decimal
      required: true
      default: 0
      precision: 20
      scale: 6
      help:
        summary: The quantity of the reservation that has been given back to availability.
        usage: Increases when part of the demand is cancelled or the reservation expires.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
      help:
        summary: How much of the reservation is still holding stock.
        usage: Moved by order management and picking.
        valueSemantics:
          PENDING: Requested but not yet holding stock.
          ACTIVE: Holding stock for its demand.
          PARTIALLY_CONSUMED: Part of the stock has been issued; the rest is still held.
          RELEASED: The remaining stock has been given back to availability. A final state.
          CONSUMED: All the reserved stock has been issued. A final state.
          CANCELLED: Withdrawn before it held stock. A final state.
          EXPIRED: Lapsed because the demand was not fulfilled in time. A final state.
    - name: priority
      type: integer
      required: false
      default: 100
      help:
        summary: The reservation's priority when stock is short.
        usage: Lower numbers are served first; defaults to 100.
    - name: expiresAt
      type: datetime
      required: false
      help:
        summary: When the reservation lapses if it has not been used.
        usage: Set by the order promise; expired reservations return stock to availability.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the reservation was made.
        usage: Set by the system.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the reservation was last changed.
        usage: Set by the system on every change.
  relationships:
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: 'Exactly one product: a reservation commits stock of a single item.'
        summary: The product that is reserved.
        usage: Set when the reservation is made.
        workflowRole: Identifies the stock being committed.
    - name: inventoryLocation
      target: InventoryLocation
      cardinality: '1'
      ownership: reference
      help:
        summary: The location from which stock is reserved.
        usage: Chosen by the allocation process.
        cardinalityMeaning: Exactly one location, since stock is committed at a specific place.
        workflowRole: Tells pickers where to go.
    - name: salesOrderLine
      target: SalesOrderLine
      cardinality: 0..1
      ownership: reference
      help:
        summary: The sales order line that the reservation serves.
        usage: Set where the demand is a customer order.
        cardinalityMeaning: At most one order line; reservations may serve other demands such as production.
        workflowRole: Ties the commitment to the promise made to the customer.
    - name: inventoryBalance
      target: InventoryBalance
      cardinality: '1'
      ownership: reference
      help:
        summary: The stock balance from which the reservation draws.
        usage: Set when the reservation is made; its reserved quantity is increased.
        cardinalityMeaning: 'Exactly one balance: the reservation commits a particular pool of stock.'
        workflowRole: Keeps available quantity correct.
  invariants:
    - {id: INVENTORY-RESERVATION-001, rule: quantityReserved must be greater than zero when a reservation is created.}
    - {id: INVENTORY-RESERVATION-002, rule: quantityConsumed plus quantityReleased must not exceed quantityReserved.}
    - {id: INVENTORY-RESERVATION-003, rule: A reservation must reference exactly one Product and one InventoryLocation and must use compatible quantity semantics.}
    - {id: INVENTORY-RESERVATION-004, rule: Creating or increasing an ACTIVE reservation must atomically verify and consume the corresponding available quantity without changing physical quantityOnHand.}
    - {id: INVENTORY-RESERVATION-005, rule: Consuming a reservation through fulfillment must create the appropriate InventoryMovement and reduce the remaining reservation atomically or through an equivalent recoverable workflow.}
    - {id: INVENTORY-RESERVATION-006, rule: Releasing or cancelling a reservation must restore the released quantity to available inventory without creating physical stock.}
    - {id: INVENTORY-RESERVATION-007, rule: "Product, UnitOfMeasure, InventoryLocation, SalesOrderLine, or demand-status changes that invalidate an active reservation must trigger a controlled revalidation, transfer, reduction, or release workflow."}
    - {id: INVENTORY-RESERVATION-008, rule: "An InventoryLocation becoming BLOCKED or INACTIVE must not leave an active reservation silently available for allocation; it must be transferred, released, or explicitly excepted."}
    - {id: INVENTORY-RESERVATION-009, rule: "Reservation lifecycle changes must update InventoryBalance.quantityReserved and quantityAvailable through the authoritative reservation workflow, not by direct balance edits."}
    - {id: INVENTORY-RESERVATION-010, rule: Historical consumed/released reservation evidence must remain auditable even after the reservation reaches a terminal status.}
  lifecycle:
    title: Inventory Reservation Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, PARTIALLY_CONSUMED, RELEASED, CONSUMED, CANCELLED, EXPIRED]
    initial: PENDING
    terminal:
      - RELEASED
      - CONSUMED
      - CANCELLED
      - EXPIRED
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: PENDING, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: PARTIALLY_CONSUMED, action: consume_part}
      - {from: ACTIVE, to: CONSUMED, action: consume}
      - {from: PARTIALLY_CONSUMED, to: CONSUMED, action: consume}
      - {from: ACTIVE, to: RELEASED, action: release}
      - {from: PARTIALLY_CONSUMED, to: RELEASED, action: release}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: EXPIRED, action: expire}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a inventory reservation is ended"
      description: "When a inventory reservation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INVENTORY-RESERVATION-FOLLOW-UP-{{id}}"
              name: "Follow up on inventory reservation {{id}}"
              description: "Inventory reservation {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An authorised commitment of available stock to a demand, which does not change the physical quantity on hand.
    businessMeaning: Promising stock to a customer or job must not depend on luck. A reservation sets the quantity aside so the same units are not promised twice, while the stock stays where it is until it is picked.
    usage: Created when an order or job is committed; consumed when the stock is issued; released or expired when the demand goes away; read by order promising and picking.
    relationshipContext: A reservation is for a Product at an InventoryLocation, held against an InventoryBalance, and usually serves a SalesOrderLine.
    lifecycle: A reservation is pending until confirmed, active while it holds stock, and then partly or fully consumed as goods are issued, or released if the demand goes away. Unused reservations are cancelled or expire.
    example: 20 units of item A-200 reserved at the main warehouse for sales order line SO-20413/2 until Friday.
    workflowContext: Demand approved → availability checked → reservation created → InventoryBalance reserved/available updated → pick/issue/fulfillment → reservation consumed and InventoryMovement posted. Cancellation/expiry releases reserved quantity. Master or location changes trigger revalidation.
    concurrency: Reservation creation, increase, consumption and release require transactional concurrency control so available inventory cannot be reserved twice.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-RESERVATION}
