entity:
  name: QualityPlan
  namespace: cedm.domain
  kind: quality_definition
  description: A defined set of inspections, tests, sampling rules, quality characteristics, and acceptance criteria governing how a product or process is evaluated.
  ui:
    icon: badge-check
    recordLabel: [code, name]
  identity:
    key: qualityPlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: qualityPlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the quality plan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a quality plan store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the quality plan.
      businessMeaning: Provides a stable human-readable reference for the governed inspection definition.
      usage: Referenced by routings and inspections.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the plan, such as "Incoming inspection – bearings".
      businessMeaning: Explains the purpose of the inspection definition.
      requiredMeaning: Required for understandable plan governance.
      usage: Shown where plans are chosen.
      relationshipContext: Identifies the plan for people.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    help:
      summary: Whether the plan may be used for inspections.
      businessMeaning: Controls whether the plan may normally govern new inspections.
      requiredMeaning: Required to govern lifecycle behavior.
      usage: Moved on by quality engineering.
      relationshipContext: Only active plans create inspections.
      valueSemantics:
        DRAFT: Being written.
        ACTIVE: Used for inspections.
        SUSPENDED: Temporarily not used.
        RETIRED: No longer used.
  - name: planType
    type: enum
    required: true
    default: INCOMING
    values: [INCOMING, IN_PROCESS, FINAL, PERIODIC]
    help:
      summary: When the plan is applied.
      usage: Decides which events create inspections from it.
      relationshipContext: A product may have a plan of each type.
      valueSemantics:
        INCOMING: On receipt of purchased goods.
        IN_PROCESS: During production.
        FINAL: Before release of finished goods.
        PERIODIC: At set intervals, such as stability tests.
  - name: revision
    type: string
    required: false
    maxLength: 20
    help:
      summary: The revision of the plan.
      usage: Raised whenever the plan changes; inspections record the revision used.
      relationshipContext: Approved revisions are not changed.
  - name: description
    type: text
    required: false
    help:
      summary: What the plan checks and why.
      usage: Read by inspectors.
      relationshipContext: Free text.
  relationships:
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product the plan applies to.
      businessMeaning: Establishes the material or product context for the quality requirements.
      usage: Set when the plan is product-specific.
      cardinalityMeaning: At most one.
      context: Plans without a product apply by material group.
  - name: characteristics
    target: QualityPlanCharacteristic
    cardinality: 0..*
    ownership: reference
    help:
      summary: The characteristics the plan measures.
      businessMeaning: Defines what properties must be observed and how each is evaluated under the plan.
      usage: Defined by quality engineering.
      cardinalityMeaning: A plan has any number of characteristics; each belongs to one plan.
      context: The characteristic records its plan.
  - name: samplingPlans
    target: SamplingPlan
    cardinality: 0..*
    ownership: reference
    help:
      summary: How many items to sample for each lot size.
      businessMeaning: Identifies governed policies for selecting inspection samples from eligible populations.
      usage: Chosen by quality engineering.
      cardinalityMeaning: A plan uses any number of sampling plans; a sampling plan serves many plans.
      context: A many-to-many relation.
  - name: inspections
    target: QualityInspection
    cardinality: 0..*
    ownership: reference
    help:
      summary: The inspections carried out under the plan.
      businessMeaning: Shows operational inspections governed by the plan.
      usage: Listed from the plan.
      cardinalityMeaning: Any number; each inspection follows one plan.
      context: The inspection records its plan.
  invariants:
  - {id: QUALITY-PLAN-001, rule: code must be unique within the owning ERP context.}
  - {id: QUALITY-PLAN-002, rule: An ACTIVE QualityPlan must have valid QualityPlanCharacteristic configurations whenever the plan declares characteristic-based inspection controls.}
  - {id: QUALITY-PLAN-003, rule: A RETIRED or SUSPENDED QualityPlan must not be selected for new governed inspections except through an explicit authorized exception or historical/reinspection workflow.}
  - {id: QUALITY-PLAN-004, rule: "Material changes to characteristics, acceptance criteria, or sampling policies must not silently change the interpretation of completed QualityInspections or QualityMeasurements; use controlled versioning or replacement semantics."}
  - {id: QUALITY-PLAN-005, rule: "Changes to product applicability, characteristic configuration, sampling configuration, status, or acceptance criteria must trigger impact analysis across open QualityInspections, QualityMeasurements, SamplingPlan/SamplingRule execution, InspectionSample, Nonconformance, disposition, supplier-quality, and reporting workflows."}
  - {id: QUALITY-PLAN-006, rule: Plan configuration changes must be idempotent and auditable.}
  lifecycle:
    title: Quality Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Governed definition of how a product or process is inspected.
    businessMeaning: QualityPlan is the parent definition for plan-specific QualityPlanCharacteristic requirements, reusable SamplingPlan policies, and QualityInspection execution. Reusable quality meaning belongs to QualityCharacteristic and reusable sample selection belongs to SamplingPlan rather than being duplicated in every inspection.
    usage: Quality master data, inspection processes, supplier quality, incoming inspection, process control, laboratory testing, compliance, forms, reports, integrations, and analytics.
    relationshipContext: Product provides applicability; QualityPlanCharacteristic supplies detailed requirements; SamplingPlan and SamplingRule supply sample-selection controls; QualityInspection executes them; InspectionSample records actual selection; QualityMeasurement records observations; Nonconformance and disposition consume failed outcomes.
    lifecycle: Draft → active → suspended/retired under governed change control. Historical inspections retain the plan, characteristic, sampling plan, and sampling rule configuration applicable when executed.
    changePropagation: Material plan changes propagate to open inspections and measurements, sample-selection execution, requirement evaluation, nonconformance and disposition workflows, supplier performance evidence, reporting, and audit history. Completed evidence must not be rewritten.
    example: An incoming-receipt plan contains required WEIGHT and TEMPERATURE configurations and assigns an acceptance-sampling SamplingPlan. A QualityInspection selects the governed sample through its SamplingRule, captures measurements, and determines the overall result.
specification:
  version: 0.3.0
  status: draft
  identifier: CEDM-ENTITY-QUALITY-PLAN
