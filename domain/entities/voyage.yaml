entity:
  name: Voyage
  namespace: cedm.domain
  kind: maritime_voyage
  description: A governed maritime journey performed by a Vessel between Ports over a planned and actual schedule, providing transport context for container and terminal operations.
  ui: {icon: route}
  identity: {key: voyageId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: voyageId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the Voyage., businessMeaning: Identifies one maritime journey independently of the Vessel master., usage: "Shipping, port planning, container tracking and audit.", relationshipContext: Vessel performs many Voyages., requiredMeaning: Required.}}
    - {name: voyageNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: Operational voyage reference., businessMeaning: Human/integration identifier used by carriers, ports and customers., usage: "Booking, schedules, tracking and reporting.", relationshipContext: Stable for the modeled journey occurrence., requiredMeaning: Required.}}
    - {name: plannedDepartureAt, type: datetime, required: false, help: {summary: Planned departure timestamp., businessMeaning: Supports berth, yard and cargo scheduling., usage: "Port planning and ETA management.", relationshipContext: Actual tracking remains separate evidence., optionalMeaning: Optional before schedule finalization.}}
    - {name: plannedArrivalAt, type: datetime, required: false, help: {summary: Planned arrival timestamp at destination or principal port., businessMeaning: Supports downstream terminal planning., usage: "ETA, berth and yard planning.", relationshipContext: Must follow plannedDepartureAt when both are supplied., optionalMeaning: Optional while route is provisional.}}
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
      help: {summary: Lifecycle state of the Voyage., businessMeaning: Controls planning and execution progression., usage: "Shipping operations and reporting.", relationshipContext: Completed voyage history is immutable., valueSemantics: {PLANNED: Journey is scheduled., ACTIVE: Voyage is underway., COMPLETED: Journey completed., CANCELLED: Journey was cancelled.}, requiredMeaning: Required.}
  relationships:
    - {name: vessel, target: Vessel, cardinality: "1", ownership: reference, help: {summary: Vessel performing the Voyage., businessMeaning: Establishes maritime transport resource., usage: "Shipping operations and reporting.", cardinalityMeaning: Exactly one Vessel., workflowRole: Vessel must be eligible when Voyage begins.}}
    - {name: originPort, target: Port, cardinality: "0..1", ownership: reference, help: {summary: Principal origin Port., businessMeaning: Establishes planned maritime journey start., usage: "Scheduling and reporting.", cardinalityMeaning: Optional for complex multi-port voyage representation., workflowRole: Port schedule must reconcile to voyage plan.}}
    - {name: destinationPort, target: Port, cardinality: "0..1", ownership: reference, help: {summary: Principal destination Port., businessMeaning: Establishes planned journey destination., usage: "Scheduling and reporting.", cardinalityMeaning: Optional for multi-port voyage representation., workflowRole: Port schedule must reconcile to voyage plan.}}
    - {name: berths, target: Berth, cardinality: "0..*", ownership: reference, help: {summary: Berths assigned or used during Voyage port calls., businessMeaning: Connects maritime journey to terminal infrastructure., usage: "Berth planning and port operations.", cardinalityMeaning: Zero or many Berths across port calls., workflowRole: Berth availability and Port membership must reconcile.}}
    - {name: containerVisits, target: ContainerVisit, cardinality: "0..*", ownership: reference, help: {summary: Container terminal visits associated with this Voyage., businessMeaning: Links container custody/terminal presence to maritime transport context., usage: "Yard, stowage, load/discharge and tracking.", cardinalityMeaning: Zero or many container visits., workflowRole: Container movement direction and voyage context must reconcile.}}
  invariants:
    - {id: VOYAGE-001, rule: plannedArrivalAt must follow plannedDepartureAt when both are supplied.}
    - {id: VOYAGE-002, rule: COMPLETED or CANCELLED Voyage is historical operational evidence and must not be destructively rewritten.}
  lifecycle:
    title: Voyage Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: start}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  help:
    summary: Represents one maritime journey used by shipping and terminal operations.
    businessMeaning: Vessel is the resource; Voyage is the journey; Port/Berth provide terminal context; ContainerVisit ties cargo presence to the journey.
    usage: Maritime logistics, port scheduling, container terminals, tracking, reporting and audit.
    relationshipContext: Vessel is mandatory; Ports, Berths and ContainerVisits provide operational context.
    lifecycle: Voyage is planned, becomes active and completes or is cancelled with history retained.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-VOYAGE}
