entity:
  name: GoodsReceipt
  namespace: cedm.domain
  kind: procurement_fulfillment_transaction
  description: A controlled record confirming physical or service fulfillment received against a PurchaseOrder, with line-level evidence of quantities received, accepted, rejected, or pending inspection. Header state and totals are projections of line-level receipt disposition and downstream posting state.
  identity: {key: goodsReceiptId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: goodsReceiptId, type: uuid, required: true, immutable: true}
  - {name: receiptNumber, type: string, required: true, unique: true, maxLength: 100}
  - {name: receiptDate, type: datetime, required: true}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, RECEIVED, INSPECTION_PENDING, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, CANCELLED]
    help:
      summary: Controlled receiving-document lifecycle state.
      usage: Determines whether receipt evidence can affect PO fulfillment, inventory and invoice matching.
      relationshipContext: Header status summarizes line dispositions and posting state; it must not contradict line-level evidence.
      workflowRole: Controls receiving progression and authorized corrections.
  - {name: receivedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: acceptedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: notes, type: string, required: false, maxLength: 2000}
  relationships:
  - name: purchaseOrder
    target: PurchaseOrder
    cardinality: '1'
    ownership: reference
  - name: supplier
    target: Supplier
    cardinality: '1'
    ownership: reference
  - name: lines
    target: GoodsReceiptLine
    cardinality: 1..*
    ownership: aggregate
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
  invariants:
  - {id: GOODS-RECEIPT-001, rule: receivedQuantity must equal the sum of GoodsReceiptLine.receivedQuantity.}
  - {id: GOODS-RECEIPT-002, rule: acceptedQuantity must equal the sum of GoodsReceiptLine.acceptedQuantity.}
  - {id: GOODS-RECEIPT-003, rule: Every posted GoodsReceiptLine must reference a PurchaseOrderLine belonging to this receipt's PurchaseOrder unless an authorized exception workflow exists.}
  - {id: GOODS-RECEIPT-004, rule: Supplier must match PurchaseOrder.supplier unless an authorized supplier substitution process exists.}
  - {id: GOODS-RECEIPT-005, rule: ACCEPTED requires all lines to have completed required acceptance/disposition and all accepted quantities to have successful inventory posting or an explicitly non-stock service disposition.}
  - {id: GOODS-RECEIPT-006, rule: PARTIALLY_ACCEPTED requires at least one accepted quantity and at least one rejected or pending quantity, unless an explicit disposition policy defines another interpretation.}
  - {id: GOODS-RECEIPT-007, rule: REJECTED requires no accepted quantity unless a controlled partial-rejection workflow is represented by PARTIALLY_ACCEPTED.}
  - {id: GOODS-RECEIPT-008, rule: INSPECTION_PENDING requires at least one line with pendingInspectionQuantity greater than zero.}
  - {id: GOODS-RECEIPT-009, rule: A DRAFT receipt must not update PurchaseOrder fulfillment, InventoryBalance, InventoryMovement posting state, or invoice matching evidence.}
  - {id: GOODS-RECEIPT-010, rule: Transition out of DRAFT requires line validation, product/UOM validation, PO linkage validation and duplicate/idempotency validation.}
  - {id: GOODS-RECEIPT-011, rule: Posting accepted receipt quantities must update PurchaseOrderLine fulfillment and InventoryBalance through one controlled workflow and must be idempotent.}
  - {id: GOODS-RECEIPT-012, rule: A receipt cannot be marked ACCEPTED if an accepted line's required InventoryMovement posting failed or is incomplete, unless an explicitly governed service/non-stock workflow applies.}
  - {id: GOODS-RECEIPT-013, rule: CANCELLED receipts cannot be physically reversed by status change alone; if posted effects exist, cancellation requires compensating reversal/disposition events.}
  - {id: GOODS-RECEIPT-014, rule: Corrections to posted receipt evidence must use reversal, return, rejection or adjustment workflows and must preserve the original receipt.}
  - {id: GOODS-RECEIPT-015, rule: Changes to PurchaseOrder, Supplier, Product, UnitOfMeasure, Warehouse or InventoryLocation that affect an open receipt require revalidation before posting or acceptance continues.}
  help:
    summary: Controlled receiving document whose header state and totals are derived from line-level receiving evidence and synchronized with procurement fulfillment and inventory posting.
    businessMeaning: GoodsReceipt is the fulfillment bridge between PurchaseOrder commitment and accepted inventory/service. GoodsReceiptLine is authoritative for quantities; the header summarizes and controls the document lifecycle.
    usage: Receiving, warehouse operations, procurement, quality, supplier management, accounts payable, inventory control and three-way matching.
    relationshipContext: PurchaseOrder is the commitment. GoodsReceiptLine is the actual receipt/disposition evidence. InventoryMovement is the physical stock consequence. InvoiceLine is the financial claim. Payment settles the invoice.
    workflowContext: Draft → line validation → received → inspection/disposition → accepted/partially accepted/rejected → accepted inventory posting and PO fulfillment → invoice matching. Every downstream update must be idempotent and traceable to the receipt line.
    lifecycle: Draft → Received → Inspection Pending → Accepted/Partially Accepted/Rejected → controlled correction if required. Posted evidence is never destructively rewritten.
    propagation: Header status changes drive allowed downstream workflow, while line changes recalculate header totals/state. Accepted posting updates PO fulfillment and InventoryBalance atomically or through a recoverable orchestration with idempotency controls.
    example: A receipt records 96 units: 94 accepted and 2 rejected. The header becomes PARTIALLY_ACCEPTED. Exactly 94 units update PO accepted fulfillment and create receipt inventory movements. A retry of posting does not add another 94 units. Cancelling later requires compensating events rather than merely setting status to CANCELLED.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-GOODS-RECEIPT}
