entity:
  name: GoodsReceipt
  namespace: cedm.domain
  kind: procurement_fulfillment_transaction
  description: A controlled record confirming physical or service fulfillment received against a PurchaseOrder, with line-level evidence of quantities received, accepted, rejected, or pending inspection.
  identity:
    key: goodsReceiptId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: goodsReceiptId
    type: uuid
    required: true
    immutable: true
    help: {summary: The immutable identity of the receipt event., usage: Used for receiving audit, inventory posting, purchase-order fulfillment, invoice matching, and traceability., relationshipContext: Identifies the receipt independently of PurchaseOrder, supplier, lines, inventory movements, and invoice., workflowRole: Root identity for the receiving transaction.}
  - name: receiptNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: The human-facing reference for the receipt., usage: Used by receiving teams, procurement, suppliers, warehouse personnel, accounts payable, and integrations., relationshipContext: Distinct from PurchaseOrder.orderNumber and supplier invoiceNumber., workflowRole: Provides operational traceability for the receiving event.}
  - name: receiptDate
    type: datetime
    required: true
    help: {summary: The date and time the receipt was recorded., usage: Supports inventory timing, supplier performance, matching, period reporting, and fulfillment measurement., relationshipContext: Distinct from PurchaseOrder.requestedDeliveryDate and Invoice.invoiceDate., workflowRole: Establishes receipt chronology.}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, RECEIVED, INSPECTION_PENDING, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, CANCELLED]
    help:
      summary: The controlled state of the receiving document.
      usage: Determines whether receipt evidence and accepted quantities can affect fulfillment, inventory, and invoice matching.
      relationshipContext: Header status summarizes the document; GoodsReceiptLine carries the detailed quantity dispositions.
      workflowRole: Controls posting and disposition of receiving results.
      valueSemantics:
        DRAFT: Being prepared and not posted as fulfillment evidence.
        RECEIVED: Physical/service receipt recorded but acceptance may remain pending.
        INSPECTION_PENDING: Receipt requires inspection or verification.
        ACCEPTED: Receipt is fully accepted under applicable rules.
        PARTIALLY_ACCEPTED: Some quantities accepted while others are rejected or pending.
        REJECTED: Receipt is not accepted.
        CANCELLED: Receipt was voided through an authorized correction process.
  - name: receivedQuantity
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help: {summary: Aggregate quantity physically received across this receipt's GoodsReceiptLine records., usage: Provides header-level receiving visibility., relationshipContext: Must reconcile to the sum of line received quantities and is not the authoritative line-level evidence., workflowRole: Supports document summaries and controls but detailed receiving decisions occur at GoodsReceiptLine level.}
  - name: acceptedQuantity
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help: {summary: Aggregate quantity accepted across this receipt's GoodsReceiptLine records., usage: Supports inventory posting, purchase-order fulfillment, and matching summaries., relationshipContext: Must reconcile to line accepted quantities and excludes rejected/pending quantities., workflowRole: Determines the accepted portion eligible for normal inventory receipt.}
  - name: notes
    type: string
    required: false
    maxLength: 2000
    help: {summary: Header-level receiving observations., usage: Supports discrepancy investigation, supplier communication, inspection context, and audit., relationshipContext: Supplements structured line quantities and statuses., workflowRole: Captures context applying to the overall receipt.}
  relationships:
  - name: purchaseOrder
    target: PurchaseOrder
    cardinality: '1'
    ownership: reference
    help: {summary: Identifies the procurement commitment against which this receipt is recorded., usage: Provides supplier, ordered lines, delivery location, commercial context, and lifecycle., cardinalityMeaning: Every GoodsReceipt belongs to one PurchaseOrder., workflowRole: Establishes the commitment against which line-level fulfillment is reconciled.}
  - name: supplier
    target: Supplier
    cardinality: '1'
    ownership: reference
    help: {summary: Identifies the supplier delivering the goods or services., usage: Supports supplier performance, discrepancy handling, receiving accountability, and invoice reconciliation., cardinalityMeaning: Exactly one supplier is associated with the receipt and should normally agree with the PurchaseOrder supplier., workflowRole: Identifies the external fulfillment party.}
  - name: lines
    target: GoodsReceiptLine
    cardinality: 1..*
    ownership: aggregate
    help: {summary: Contains the line-level receiving evidence for products or services received under the PurchaseOrder., usage: Records actual, accepted, rejected, and pending quantities and their traceability to PurchaseOrderLine., cardinalityMeaning: A posted receipt requires at least one line., workflowRole: Lines are the authoritative detail from which header totals and PO fulfillment are derived.}
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help: {summary: Links accepted receipt quantities to resulting inventory events., usage: Provides traceability from receiving evidence to inventory state changes., cardinalityMeaning: A receipt may generate multiple movements because stock can be split across locations or controlled postings., workflowRole: Only authorized accepted quantities may create normal receipt movements.}
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
    help: {summary: Supplier financial claims matched or associated with this receipt., usage: Supports three-way matching and accounts payable., cardinalityMeaning: Multiple invoices may reference one receipt and one invoice may cover multiple receipts according to billing policy., workflowRole: Invoice matching uses receipt-line acceptance evidence rather than treating the receipt itself as payment or settlement.}
  invariants:
  - id: GOODS-RECEIPT-001
    rule: receivedQuantity must equal the sum of GoodsReceiptLine.receivedQuantity for this receipt.
  - id: GOODS-RECEIPT-002
    rule: acceptedQuantity must equal the sum of GoodsReceiptLine.acceptedQuantity for this receipt.
  - id: GOODS-RECEIPT-003
    rule: Each GoodsReceiptLine must reference a PurchaseOrderLine belonging to this receipt's PurchaseOrder unless an authorized exception workflow exists.
  - id: GOODS-RECEIPT-004
    rule: ACCEPTED or PARTIALLY_ACCEPTED quantities may create inventory receipt movements only for accepted line quantities.
  - id: GOODS-RECEIPT-005
    rule: A rejected or pending quantity must not increase accepted inventory.
  - id: GOODS-RECEIPT-006
    rule: Receipt supplier must match PurchaseOrder supplier unless an authorized supplier substitution process exists.
  help:
    summary: Represents the controlled receiving document and its line-level evidence that procurement fulfillment actually occurred.
    businessMeaning: GoodsReceipt is the fulfillment bridge between PurchaseOrder commitment and accepted inventory/service. GoodsReceiptLine is the authoritative detail; header quantities are projections for document-level visibility.
    usage: Used by receiving, warehouse operations, procurement, quality inspection, supplier management, accounts payable, inventory control, and three-way matching.
    relationshipContext: PurchaseOrder says what should be supplied. GoodsReceipt says what arrived. GoodsReceiptLine says exactly what arrived and what was accepted. InventoryMovement records accepted stock consequences. Invoice records the supplier financial claim. Payment settles that claim.
    workflowContext: PurchaseOrderLine → GoodsReceiptLine → inspection/disposition → accepted quantity → InventoryMovement → InvoiceLine matching. Partial deliveries create multiple receipt lines/events against the same PO line. Rejected and pending quantities follow exception workflows.
    lifecycle: Draft → received → inspection/acceptance → accepted/partially accepted/rejected → controlled correction if required. Posted receiving evidence is corrected through reversal or disposition rather than silently rewriting history.
    example: A PO contains 100 units on one line. A receipt records 96 received. The line accepts 94, rejects 2, and creates inventory receipt evidence only for 94. The PO line's cumulative received and accepted quantities are updated from receipt-line evidence.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-GOODS-RECEIPT}
