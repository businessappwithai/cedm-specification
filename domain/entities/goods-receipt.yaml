entity:
  name: GoodsReceipt
  namespace: cedm.domain
  kind: procurement_fulfillment_transaction
  description: A controlled record confirming physical or service fulfillment received against a PurchaseOrder, with line-level evidence of quantities received, accepted, rejected, pending inspection, and later eligible supplier returns. Header state and totals are projections of line-level receipt disposition and downstream posting state.
  ui:
    icon: file-text
  identity: {key: goodsReceiptId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: goodsReceiptId, type: uuid, required: true, immutable: true, help: {summary: The identity of the goods receipt., usage: Generated on creation; stock movements and invoices refer to it., businessMeaning: Identifies the historical receiving event independently of later supplier returns or corrections., relationshipContext: SupplierReturn references eligible receipt evidence without rewriting this identity., workflowRole: Stable root reference for receipt lifecycle and downstream traceability.}}
    - {name: receiptNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: The receipt number printed on the delivery note and used in the warehouse., usage: Allocated from a number series; unique., businessMeaning: Identifies the receipt in warehouse and supplier operations., relationshipContext: Distinct from SupplierReturn.returnNumber and PurchaseOrder number., workflowRole: Provides operational reference across receipt and later return workflows.}}
    - {name: receiptDate, type: datetime, required: true, help: {summary: The date and time the goods arrived., usage: Recorded at the dock; determines stock availability and supplier performance., businessMeaning: Establishes receiving chronology., relationshipContext: Distinct from later SupplierReturn.returnDate., workflowRole: Anchors original receipt evidence.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - RECEIVED
        - INSPECTION_PENDING
        - ACCEPTED
        - PARTIALLY_ACCEPTED
        - REJECTED
        - CANCELLED
      help:
        summary: How far the receipt has progressed from preparation through counting and inspection to a final decision.
        usage: Moved by warehouse and quality staff; accounts payable matches invoices only against receipts that were accepted.
        valueSemantics:
          DRAFT: Being prepared before the delivery is confirmed.
          RECEIVED: Delivery confirmed and counted at the dock.
          INSPECTION_PENDING: Held until a quality inspection is done.
          ACCEPTED: All received quantity accepted into stock. A final state.
          PARTIALLY_ACCEPTED: Some quantity accepted and the rest rejected. A final state.
          REJECTED: Refused entirely and returned or held. A final state.
          CANCELLED: Withdrawn before receipt was confirmed. A final state.
        businessMeaning: Indicates whether receipt evidence can affect fulfillment and inventory.
        relationshipContext: SupplierReturn is a later reverse-procurement event and does not rewrite receipt status.
        workflowRole: Controls receiving progression and authorized corrections.
    - {name: receivedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6, help: {summary: The total quantity counted at the dock across all lines of the receipt., usage: Calculated from the receipt lines rather than typed in; purchasing compares it with the ordered quantity., businessMeaning: Sum of line received quantities., relationshipContext: "SupplierReturn eligibility is derived from accepted receipt evidence, not received quantity alone.", workflowRole: Provides original physical receipt basis.}}
    - {name: acceptedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6, help: {summary: The total quantity accepted into stock., usage: Calculated from the lines; never more than the received quantity., businessMeaning: Sum of line accepted quantities that may become inventory., relationshipContext: SupplierReturnLine eligibility is normally based on accepted quantity and subsequent prior returns., workflowRole: Provides authoritative accepted receipt basis for later supplier returns.}}
    - {name: notes, type: string, required: false, maxLength: 2000, help: {summary: 'Remarks about the delivery, such as damage or discrepancies.', usage: Free text written by the receiving clerk., businessMeaning: Human-readable context for receipt exceptions or inspection., relationshipContext: Does not replace structured disposition or return evidence., workflowRole: Supports review.}}
  relationships:
    - name: purchaseOrder
      target: PurchaseOrder
      cardinality: '1'
      ownership: reference
      help:
        summary: The purchase order the delivery answers.
        usage: Selected at receiving.
        workflowRole: Receipts close the order's open quantities.
        businessMeaning: Connects received goods to what was ordered.
    - name: supplier
      target: Supplier
      cardinality: '1'
      ownership: reference
      help:
        summary: The supplier that delivered the goods.
        usage: Set from the purchase order.
        workflowRole: Supplier performance is measured on receipts.
        businessMeaning: Identifies the commercial party responsible for the delivery.
    - name: lines
      target: GoodsReceiptLine
      cardinality: 1..*
      ownership: aggregate
      help:
        cardinalityMeaning: At least one line, one for each product received.
        summary: Detailed receipt and disposition lines.
        businessMeaning: Line evidence is authoritative for quantities and later return eligibility.
        usage: "Receiving, inventory, quality, matching and returns."
        workflowRole: Drives header totals and downstream posting.
    - name: inventoryMovements
      target: InventoryMovement
      cardinality: 0..*
      ownership: reference
      help:
        summary: The stock movements created by accepting the goods.
        usage: Read to trace received goods into inventory.
        workflowRole: Accepting the receipt posts the stock.
        businessMeaning: Records physical stock consequences of the receipt separately from receipt evidence.
    - name: invoices
      target: Invoice
      cardinality: 0..*
      ownership: reference
      help:
        summary: The supplier invoices that bill for this receipt.
        usage: Used in three-way matching.
        workflowRole: An invoice is payable only for received quantities.
        businessMeaning: Connects fulfillment to supplier financial claims.
    - name: supplierReturns
      target: SupplierReturn
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of returns of rejected or defective goods to the supplier.
        summary: Supplier returns that use this receipt as eligibility evidence.
        businessMeaning: Connects the original accepted receipt to later reverse-procurement events without mutating the receipt history.
        usage: "Return authorization, inventory reversal, supplier credit and audit."
        workflowRole: Provides the receipt basis used by SupplierReturn and SupplierReturnLine eligibility validation.
  invariants:
    - {id: GOODS-RECEIPT-001, rule: receivedQuantity must equal the sum of GoodsReceiptLine.receivedQuantity.}
    - {id: GOODS-RECEIPT-002, rule: acceptedQuantity must equal the sum of GoodsReceiptLine.acceptedQuantity.}
    - {id: GOODS-RECEIPT-003, rule: Every posted GoodsReceiptLine must reference a PurchaseOrderLine belonging to this receipt's PurchaseOrder unless an authorized exception exists.}
    - {id: GOODS-RECEIPT-004, rule: Supplier must match PurchaseOrder.supplier unless authorized supplier substitution exists.}
    - {id: GOODS-RECEIPT-005, rule: ACCEPTED requires all lines to have completed required acceptance/disposition and all accepted quantities to have successful inventory posting or an explicitly non-stock service disposition.}
    - {id: GOODS-RECEIPT-006, rule: PARTIALLY_ACCEPTED requires at least one accepted quantity and at least one rejected or pending quantity unless explicit disposition policy defines otherwise.}
    - {id: GOODS-RECEIPT-007, rule: REJECTED requires no accepted quantity unless controlled partial-rejection workflow is represented by PARTIALLY_ACCEPTED.}
    - {id: GOODS-RECEIPT-008, rule: INSPECTION_PENDING requires at least one line with pendingInspectionQuantity greater than zero.}
    - {id: GOODS-RECEIPT-009, rule: "A DRAFT receipt must not update PurchaseOrder fulfillment, InventoryBalance, InventoryMovement posting state, or invoice matching evidence."}
    - {id: GOODS-RECEIPT-010, rule: "Transition out of DRAFT requires line validation, product/UOM validation, PO linkage validation and duplicate/idempotency validation."}
    - {id: GOODS-RECEIPT-011, rule: Posting accepted receipt quantities must update PurchaseOrderLine fulfillment and InventoryBalance through one controlled workflow and must be idempotent.}
    - {id: GOODS-RECEIPT-012, rule: "A receipt cannot be marked ACCEPTED if required accepted-line InventoryMovement posting failed or is incomplete, unless a governed service/non-stock workflow applies."}
    - {id: GOODS-RECEIPT-013, rule: CANCELLED receipts cannot be physically reversed by status change alone; posted effects require compensating reversal/disposition events.}
    - {id: GOODS-RECEIPT-014, rule: "Corrections to posted receipt evidence must use reversal, supplier return, rejection or adjustment workflows and preserve the original receipt."}
    - {id: GOODS-RECEIPT-015, rule: "Changes to PurchaseOrder, Supplier, Product, UnitOfMeasure, Warehouse or InventoryLocation affecting an open receipt require revalidation."}
    - {id: GOODS-RECEIPT-016, rule: "SupplierReturn eligibility must be derived from accepted GoodsReceiptLine evidence after subtracting quantities already returned through posted SupplierReturnLine records, except authorized exceptions."}
    - {id: GOODS-RECEIPT-017, rule: A SupplierReturn must not change receivedQuantity or acceptedQuantity on the historical receipt; physical reduction is represented by attributable InventoryMovement events.}
    - {id: GOODS-RECEIPT-EXE-001, rule: "Received Quantity cannot be negative.", violatedWhen: "received_quantity != null and received_quantity < 0", message: "Received Quantity cannot be negative."}
    - {id: GOODS-RECEIPT-EXE-002, rule: "Accepted Quantity cannot be negative.", violatedWhen: "accepted_quantity != null and accepted_quantity < 0", message: "Accepted Quantity cannot be negative."}
  lifecycle:
    title: Goods Receipt Lifecycle
    attribute: status
    states: [DRAFT, RECEIVED, INSPECTION_PENDING, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal:
      - ACCEPTED
      - PARTIALLY_ACCEPTED
      - REJECTED
      - CANCELLED
    transitions:
      - {from: DRAFT, to: RECEIVED, action: receive}
      - {from: RECEIVED, to: INSPECTION_PENDING, action: send_to_inspection}
      - {from: RECEIVED, to: ACCEPTED, action: accept}
      - {from: RECEIVED, to: PARTIALLY_ACCEPTED, action: accept_partially}
      - {from: RECEIVED, to: REJECTED, action: reject}
      - {from: INSPECTION_PENDING, to: ACCEPTED, action: accept}
      - {from: INSPECTION_PENDING, to: PARTIALLY_ACCEPTED, action: accept_partially}
      - {from: INSPECTION_PENDING, to: REJECTED, action: reject}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: RECEIVED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a goods receipt is ended"
      description: "When a goods receipt is rejected or cancelled, a task asks someone to settle what depended on it."
      when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "GOODS-RECEIPT-FOLLOW-UP-{{id}}"
              name: "Follow up on goods receipt {{receipt_number}}"
              description: "Goods receipt {{receipt_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A record that goods or services ordered on a purchase order have arrived, with evidence of what was received, accepted and rejected.
    businessMeaning: Receiving is the moment a purchase becomes real. The goods receipt says what physically arrived against the order, what passed inspection and what did not, so stock, supplier payment and returns can all rely on it.
    usage: Created at the dock when a delivery arrives; inspected; accepted or rejected; read by purchasing, warehouse and accounts payable.
    relationshipContext: A receipt answers a PurchaseOrder from a Supplier, has GoodsReceiptLines, creates InventoryMovements, supports Invoice matching and may lead to SupplierReturns.
    lifecycle: A receipt is drafted, received, may be sent for inspection, and is accepted, partly accepted or rejected, or cancelled before receipt is confirmed.
    example: 'Receipt R-5531: 100 of 120 ordered cartons received on Monday; 98 accepted and 2 rejected as damaged.'
    workflowContext: Draft → line validation → received → inspection/disposition → accepted/partially accepted/rejected → accepted inventory posting and PO fulfillment → invoice matching. Later, eligible accepted receipt quantity → SupplierReturn → attributable inventory issue/return-to-supplier movement → SupplierCreditNote → payable reconciliation. Historical receipt quantities remain immutable.
    propagation: Header status changes drive allowed downstream workflow; line changes recalculate header totals/state. Supplier returns consume eligible accepted quantities and create separate inventory/financial consequences rather than modifying receipt history. All downstream posting is idempotent and traceable to receipt lines.
specification:
  version: 0.3.0
  status: draft
  identifier: CEDM-ENTITY-GOODS-RECEIPT
