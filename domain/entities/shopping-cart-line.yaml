entity:
  name: ShoppingCartLine
  namespace: cedm.domain
  kind: ecommerce_detail_entity
  description: A product selection and quantity within a shopping cart.
  ui:
    icon: table
  identity:
    key: shoppingCartLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: shoppingCartLineId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the line, constant for its life.
        usage: Generated on creation.
        relationshipContext: Referenced when the line becomes an order line.
    - name: quantity
      type: decimal
      required: true
      precision: 18
      scale: 6
      help:
        summary: How many units the shopper wants.
        usage: Entered by the shopper; must be greater than zero.
        relationshipContext: Multiplied by the unit price for the line total.
    - name: unitPrice
      type: money
      required: false
      help:
        summary: The price for one unit as shown in the cart.
        usage: Set when the item is added; must not be negative.
        relationshipContext: Re-checked at checkout.
  relationships:
    - name: cart
      target: ShoppingCart
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: Every line sits in a single cart and is removed if the cart is deleted.
        summary: The cart the line belongs to.
        usage: Set when the line is added.
        context: A line cannot exist outside a cart.
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product chosen.
        usage: Chosen by the shopper.
        cardinalityMeaning: Exactly one product per line.
        context: Shows what to charge and ship.
  invariants:
    - id: CART-LINE-001
      rule: quantity must be greater than zero.
    - {id: SHOPPING-CART-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
    - {id: SHOPPING-CART-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  help:
    summary: A product and quantity a shopper has put in a cart.
    businessMeaning: A line records one choice in the cart with the price shown at the time, so checkout can place the order the shopper saw.
    usage: Added when the shopper chooses an item; changed or removed freely until checkout.
    relationshipContext: A line belongs to one cart and refers to one product.
    lifecycle: A line exists while the cart is active and is carried into the order at checkout.
    example: Two units of a desk lamp at 24.00 each.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SHOPPING-CART-LINE
