entity:
  name: ShoppingCartLine
  namespace: cedm.domain
  kind: ecommerce_detail_entity
  description: A product selection and quantity within a shopping cart.
  ui:
    icon: table
    recordLabel: [lineNumber]
  identity:
    key: shoppingCartLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: shoppingCartLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the shopping cart line record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a shopping cart line store this identifier. The number or code people quote is a separate field.
  - name: quantity
    type: decimal
    required: true
    precision: 18
    scale: 6
    help:
      summary: How many units of the product the shopper wants.
      usage: Changed by the shopper; checked against stock and order limits.
      relationshipContext: Positive.
  - name: unitPrice
    type: money
    required: false
    help:
      summary: The price per unit shown to the shopper when the product was added or last refreshed.
      usage: Recalculated at checkout, so the shopper sees any change before paying.
      relationshipContext: In the cart's currency.
  - name: lineNumber
    type: integer
    required: true
    help:
      summary: The position of the line in the cart.
      usage: Assigned in the order products are added.
      relationshipContext: Unique within the cart.
  - name: lineAmount
    type: Money
    required: false
    help:
      summary: Quantity times unit price, less any line discount.
      usage: Shown in the cart and summed into its total.
      relationshipContext: Recalculated whenever quantity or price changes.
  - name: addedAt
    type: datetime
    required: true
    help:
      summary: When the product was added to the cart.
      usage: Used for abandoned-cart analysis.
      relationshipContext: Set by the shop.
  relationships:
  - name: cart
    target: ShoppingCart
    cardinality: '1'
    ownership: reference
    help:
      summary: The cart the line belongs to.
      usage: Set when the product is added.
      cardinalityMeaning: Every line belongs to exactly one cart.
      context: Listed under the cart.
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product chosen.
      usage: Chosen by the shopper.
      cardinalityMeaning: One product per line; more of the same product increases the quantity.
      context: Its current price and availability are checked at checkout.
  - name: productVariant
    target: ProductVariant
    cardinality: 0..1
    ownership: reference
    help:
      summary: The variant chosen, such as size or colour.
      usage: Chosen on the product page.
      cardinalityMeaning: At most one.
      context: Required for products sold in variants.
  invariants:
  - {id: SHOPPING-CART-LINE-001, rule: The quantity is positive., violatedWhen: quantity != null and quantity <= 0, message: The quantity must be greater than zero.}
  - {id: SHOPPING-CART-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  - {id: SHOPPING-CART-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  - {id: SHOPPING-CART-LINE-EXE-003, rule: "Line Amount cannot be negative.", violatedWhen: "line_amount != null and line_amount < 0", message: "Line Amount cannot be negative."}
  help:
    summary: Represents a ecommerce detail entity called ShoppingCartLine within the CEDM business model.
    businessMeaning: ShoppingCartLine is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate ShoppingCartLine records.
    relationshipContext: The entity participates in a wider business graph through relationships with ShoppingCart, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical ShoppingCartLine record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SHOPPING-CART-LINE
