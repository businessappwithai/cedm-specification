entity:
  name: RetailSale
  namespace: cedm.domain
  kind: retail_transaction
  description: A point-of-sale retail transaction.
  ui:
    icon: file-text
  identity:
    key: retailSaleId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: retailSaleId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the sale, constant for its life.
        usage: Generated on creation; lines, payments and refunds refer to it.
        relationshipContext: Referenced by every line and payment of the sale.
    - name: receiptNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number printed on the shopper's receipt.
        usage: Unique; the shopper quotes it on a return.
        relationshipContext: Used to find the sale again for refunds.
    - name: saleDate
      type: datetime
      required: true
      help:
        usage: Set when the sale is opened; takings are reported by it.
        relationshipContext: Decides which trading day the sale falls in.
        summary: Records the business date associated with the sale. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - COMPLETED
        - VOIDED
        - REFUNDED
      help:
        summary: Where the sale is.
        usage: Starts as OPEN at the till; completed on payment.
        relationshipContext: Only completed sales count in takings.
        valueSemantics:
          OPEN: Being rung up; not yet paid.
          COMPLETED: Paid and receipted.
          VOIDED: Abandoned before completion. A final state.
          REFUNDED: Returned and paid back. A final state.
    - name: totalAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: The amount the shopper pays, after discounts and tax.
        usage: Calculated from the lines; must not be negative.
        relationshipContext: Compared with payments to confirm the sale is settled.
    - name: currencyId
      type: reference
      target: Currency
      required: true
      help:
        summary: The currency of the sale.
        usage: Set from the store; all amounts are in it.
        relationshipContext: Read with the total.
  relationships:
    - name: store
      target: Store
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A sale is rung up in a single store, which owns the takings and the stock sold.
        summary: The store where the sale took place.
        usage: Set from the till.
        context: Attributes takings and stock to the right outlet.
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: The customer, if the shopper is identified.
        usage: Chosen when a loyalty card or account is used.
        cardinalityMeaning: At most one customer; empty for an anonymous sale.
        context: Allows purchase history and loyalty to be recorded.
    - name: lines
      target: RetailSaleLine
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: The items sold.
        usage: Added as items are scanned.
        cardinalityMeaning: At least one line to complete the sale.
        context: The lines belong to the sale and go with it.
    - name: payments
      target: Payment
      cardinality: 0..*
      ownership: reference
      help:
        summary: The payments tendered for the sale.
        usage: Recorded at checkout.
        cardinalityMeaning: Any number, since a sale may be split between payment methods.
        context: Together they must cover the total.
  invariants:
    - id: RETAIL-SALE-001
      rule: a COMPLETED sale must contain at least one line.
    - {id: RETAIL-SALE-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Retail Sale Lifecycle
    attribute: status
    states: [OPEN, COMPLETED, VOIDED, REFUNDED]
    initial: OPEN
    terminal:
      - VOIDED
      - REFUNDED
    transitions:
      - {from: OPEN, to: COMPLETED, action: complete}
      - {from: OPEN, to: VOIDED, action: void}
      - {from: COMPLETED, to: REFUNDED, action: refund}
  workflows:
    - name: CompletionConfirmed
      title: "Confirm when a retail sale is done"
      description: "When a retail sale is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RETAIL-SALE-COMPLETED-{{id}}"
              name: "Confirm retail sale {{receipt_number}}"
              description: "Retail sale {{receipt_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A point-of-sale transaction in which a store sells goods or services to a shopper and issues a receipt.
    businessMeaning: A retail sale is the till record of one purchase. It captures what was sold, the total, the currency and the payments taken, and it is the base for the receipt, the day's takings, stock reduction and any later refund.
    usage: Created at the till as items are scanned; completed on payment; read by store management, finance and returns.
    relationshipContext: A sale happens in one store, may name a customer, has one or more lines and is settled by payments.
    lifecycle: A sale is open while being rung up, completed on payment and may later be refunded. An open sale may be voided. Voided and refunded are final.
    example: Receipt R-88213 at the Central store sells three items for 54.60 paid by card.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RETAIL-SALE
