entity:
  name: RetailSale
  namespace: cedm.domain
  kind: retail_transaction
  description: A point-of-sale retail transaction.
  ui:
    icon: file-text
    recordLabel: [receiptNumber]
  identity:
    key: retailSaleId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: retailSaleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the retail sale record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a retail sale store this identifier. The number or code people quote is a separate field.
  - name: receiptNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number printed on the receipt.
      usage: Asked for when goods are returned.
      relationshipContext: Unique.
  - name: saleDate
    type: datetime
    required: true
    help:
      summary: When the sale took place.
      usage: Used for takings, reporting and return deadlines.
      relationshipContext: Set by the till.
  - name: status
    type: enum
    required: true
    default: OPEN
    values: [OPEN, COMPLETED, VOIDED, REFUNDED]
    help:
      summary: Where the sale stands.
      usage: Set by the till.
      relationshipContext: Only completed sales count in takings.
      valueSemantics:
        OPEN: Items are being scanned.
        COMPLETED: Paid.
        VOIDED: Cancelled before payment.
        REFUNDED: Paid back to the customer.
  - name: totalAmount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: The total paid for the sale.
      usage: Summed from the lines; reconciled with payments.
      relationshipContext: Not negative.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    help:
      summary: The currency of the sale.
      usage: The store's currency.
      relationshipContext: All lines use it.
  relationships:
  - name: store
    target: Store
    cardinality: '1'
    ownership: reference
    help:
      summary: The store the sale happened in.
      usage: Set by the till.
      cardinalityMeaning: Each sale is in one store.
      context: Counted in the store's takings.
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer, when known from a loyalty card or account.
      usage: Set when the customer identifies themselves.
      cardinalityMeaning: At most one customer.
      context: Earns loyalty points.
  - name: lines
    target: RetailSaleLine
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The items sold.
      usage: Added as items are scanned.
      cardinalityMeaning: At least one line, kept with the sale.
      context: Line items of the sale.
  - name: payments
    target: Payment
    cardinality: 0..*
    ownership: reference
    help:
      summary: The payments made for the sale.
      usage: Recorded at the till.
      cardinalityMeaning: Any number; a sale may be split across methods.
      context: Must add up to the total.
    inverseCardinality: '1'
  invariants:
  - id: RETAIL-SALE-001
    rule: a COMPLETED sale must contain at least one line.
  - {id: RETAIL-SALE-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Retail Sale Lifecycle
    attribute: status
    states: [OPEN, COMPLETED, VOIDED, REFUNDED]
    initial: OPEN
    terminal: [VOIDED, REFUNDED]
    transitions:
    - {from: OPEN, to: COMPLETED, action: complete}
    - {from: OPEN, to: VOIDED, action: void}
    - {from: COMPLETED, to: REFUNDED, action: refund}
  workflows:
  - name: CompletionConfirmed
    title: "Confirm when a retail sale is done"
    description: "When a retail sale is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "RETAIL-SALE-COMPLETED-{{id}}"
          name: "Confirm retail sale {{receipt_number}}"
          description: "Retail sale {{receipt_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: A sale rung up at a till, with its lines and payments.
    relationshipContext: The entity participates in a wider business graph through relationships with Store, Customer, RetailSaleLine, Payment. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Cashiers and self-checkouts record each sale at the till; store managers reconcile takings, handle voids and refunds, and sales are summed for stock replenishment and reporting.
    lifecycle: A sale is open while items are scanned, completed when paid, or voided before payment; a completed sale may be refunded.
    example: Receipt 0142-20240514-0087 at store 0142, 14 May 2024 17:42, 4 lines, 38.70 EUR paid by card, completed.
    businessMeaning: Retail sales are the store's revenue; takings, stock and tax are reconciled from them.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RETAIL-SALE
