entity:
  name: Task
  namespace: cedm.domain
  kind: process_runtime_entity
  description: A discrete unit of business work performed by a person, organization, system, or workflow participant.
  ui:
    icon: list-checks
    recordLabel: [code, name]
  identity:
    key: taskId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: taskId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the task record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a task store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the task.
      usage: Used to refer to the task in messages and logs.
      relationshipContext: Unique within its workflow or organisation.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What has to be done.
      usage: Shown in work lists.
      relationshipContext: Starts with a verb where possible.
  - name: description
    type: string
    required: false
    maxLength: 2000
    help:
      summary: Instructions for the task.
      usage: Read by the assignee.
      relationshipContext: Plain language.
  - name: taskType
    type: enum
    required: true
    values:
    - USER
    - SYSTEM
    - APPROVAL
    - DECISION
    - NOTIFICATION
    - SCRIPT
    - OTHER
    help:
      summary: What kind of work the task is.
      usage: Decides who or what performs it and which form is shown.
      relationshipContext: Set by the workflow or creator.
      valueSemantics:
        USER: Done by a person.
        SYSTEM: Done automatically by a system.
        APPROVAL: A person approves or rejects something.
        DECISION: A choice between paths.
        NOTIFICATION: A message is sent.
        SCRIPT: A script is run.
        OTHER: Any other kind.
  - name: status
    type: enum
    required: true
    default: CREATED
    values:
    - CREATED
    - READY
    - ASSIGNED
    - IN_PROGRESS
    - BLOCKED
    - COMPLETED
    - CANCELLED
    - FAILED
    help:
      summary: Where the task stands.
      usage: Moved on by the assignee or the workflow.
      relationshipContext: Completed tasks record when they finished.
      valueSemantics:
        CREATED: Created; not yet ready.
        READY: Can be picked up.
        ASSIGNED: Given to someone.
        IN_PROGRESS: Being worked on.
        BLOCKED: Waiting on something.
        COMPLETED: Done.
        CANCELLED: No longer needed.
        FAILED: Could not be done.
  - name: priority
    type: enum
    required: true
    default: NORMAL
    values:
    - LOW
    - NORMAL
    - HIGH
    - CRITICAL
    help:
      summary: How urgent the task is.
      usage: Orders work lists.
      relationshipContext: Defaults to normal.
      valueSemantics:
        LOW: Can wait.
        NORMAL: Ordinary.
        HIGH: Before normal tasks.
        CRITICAL: At once.
  - name: dueAt
    type: datetime
    required: false
    help:
      summary: When the task should be done.
      usage: Overdue tasks are flagged and may escalate.
      relationshipContext: Set by the workflow or creator.
  - name: startedAt
    type: datetime
    required: false
    help:
      summary: When work on the task started.
      usage: Used to measure handling time.
      relationshipContext: Not after completion.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: When the task was completed.
      usage: Used to measure handling time.
      relationshipContext: Present once completed.
  relationships:
  - name: workflow
    target: Workflow
    cardinality: 0..1
    ownership: reference
    help:
      summary: The workflow that created the task.
      usage: Set when a workflow creates it.
      cardinalityMeaning: At most one workflow.
      context: Completing the task moves the workflow on.
  - name: assignee
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who performs the task.
      usage: Set when assigned.
      cardinalityMeaning: At most one assignee.
      context: Sees the task in their work list.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation unit responsible for the task.
      usage: Used to route unassigned tasks to a team.
      cardinalityMeaning: At most one unit.
      context: Its members may pick the task up.
  - name: relatedDocument
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: The document the task is about.
      usage: Opened from the task.
      cardinalityMeaning: At most one document.
      context: Such as the invoice to approve.
  invariants:
  - id: TASK-001
    rule: completedAt is required when status is COMPLETED.
  - id: TASK-002
    rule: completedAt must not precede startedAt.
  - id: TASK-003
    rule: A USER or APPROVAL task should have an assignee before entering IN_PROGRESS unless explicitly configured otherwise.
  - {id: TASK-EXE-001, rule: "A task that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the task is completed."}
  lifecycle:
    title: Task Lifecycle
    attribute: status
    states: [CREATED, READY, ASSIGNED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED, FAILED]
    initial: CREATED
    terminal: [COMPLETED, CANCELLED, FAILED]
    transitions:
    - {from: CREATED, to: READY, action: mark_ready}
    - {from: READY, to: ASSIGNED, action: assign}
    - {from: ASSIGNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: READY, to: BLOCKED, action: block}
    - {from: BLOCKED, to: READY, action: unblock}
    - {from: ASSIGNED, to: BLOCKED, action: block}
    - {from: BLOCKED, to: ASSIGNED, action: unblock}
    - {from: IN_PROGRESS, to: BLOCKED, action: block}
    - {from: BLOCKED, to: IN_PROGRESS, action: unblock}
    - {from: CREATED, to: CANCELLED, action: cancel}
    - {from: READY, to: CANCELLED, action: cancel}
    - {from: ASSIGNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
    - {from: BLOCKED, to: CANCELLED, action: cancel}
    - {from: READY, to: FAILED, action: fail}
    - {from: ASSIGNED, to: FAILED, action: fail}
    - {from: IN_PROGRESS, to: FAILED, action: fail}
    - {from: BLOCKED, to: FAILED, action: fail}
  help:
    summary: Represents a process runtime entity called Task within the CEDM business model.
    businessMeaning: Task is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Workflow, Party, Organization, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Workflows and people create tasks for work to be done; assignees pick them up from their work lists, record progress and blockers, and complete them; supervisors watch overdue and failed tasks.
    lifecycle: A task is created, ready when it can be worked, assigned, in progress, and ends completed, cancelled or failed; a task may be blocked at any working stage and resumes where it stopped.
    example: Task APR-INV-5521 'Approve invoice INV-5521', approval, high, assigned to Marta Conti, due 16 May 2024 17:00, in progress.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TASK
