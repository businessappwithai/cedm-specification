entity:
  name: CorrectiveAction
  namespace: cedm.domain
  kind: quality_process_entity
  description: An action intended to eliminate the cause of a detected nonconformance or prevent recurrence.
  identity: {key: correctiveActionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: correctiveActionId, type: uuid, required: true, immutable: true}
    - {name: actionNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: actionType, type: enum, required: true, values: [CONTAINMENT, CORRECTION, CORRECTIVE, PREVENTIVE]}
    - {name: description, type: string, required: true, maxLength: 4000}
    - {name: status, type: enum, required: true, default: OPEN, values: [OPEN, ASSIGNED, IN_PROGRESS, VERIFICATION, COMPLETED, CANCELLED]}
    - {name: dueDate, type: date, required: false}
    - {name: completedDate, type: date, required: false}
  relationships:
    - {name: nonconformance, target: Nonconformance, cardinality: "0..1", ownership: reference}
    - {name: owner, target: Party, cardinality: "0..1", ownership: reference}
  invariants:
    - {id: CORRECTIVE-ACTION-001, rule: completedDate must be present when status is COMPLETED.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CORRECTIVE-ACTION}
