entity:
  name: Scenario
  namespace: cedm.domain
  kind: planning_reference
  description: A named set of planning assumptions — Base, Upside, Downside, a stress case — under which budgets and forecasts are prepared, so alternatives can be compared without touching actuals.
  ui:
    icon: git-branch
    recordLabel: [code, name]
  identity: {key: scenarioId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: scenarioId, type: uuid, required: true, immutable: true, help: {summary: Stable scenario identity., businessMeaning: Identifies one planning assumption set., usage: Budget/forecast comparison., relationshipContext: Referenced by planning artifacts., requiredMeaning: Required.}}
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the scenario, such as BASE or DOWN-24.
      businessMeaning: Identifies baseline/upside/downside or named case.
      usage: Chosen when it is created.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, ARCHIVED]
    help:
      summary: Whether plans may be prepared under the scenario.
      businessMeaning: Controls new planning use.
      usage: Moved on by finance.
      relationshipContext: Archived scenarios keep their plans.
      valueSemantics:
        DRAFT: Being defined.
        ACTIVE: In use.
        ARCHIVED: No longer used.
  - name: name
    type: string
    required: true
    maxLength: 150
    help:
      summary: The name of the scenario.
      usage: Shown wherever a scenario is chosen.
      relationshipContext: Identifies it for people.
  - name: scenarioType
    type: enum
    required: true
    default: BASE
    values: [BASE, UPSIDE, DOWNSIDE, STRESS]
    help:
      summary: What kind of scenario it is.
      usage: Reports show the base case first and the alternatives beside it.
      relationshipContext: Only one base scenario is current at a time.
      valueSemantics:
        BASE: The expected case.
        UPSIDE: A more favourable case.
        DOWNSIDE: A less favourable case.
        STRESS: A severe case used to test resilience.
  - name: assumptions
    type: text
    required: false
    help:
      summary: The assumptions that define the scenario.
      usage: Written by finance; read by everyone preparing plans under it.
      relationshipContext: Should be specific enough to apply consistently.
  invariants:
  - {id: SCENARIO-001, rule: Scenario assumptions must not directly mutate actual transactions or accounting.}
  lifecycle:
    title: Scenario Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, ARCHIVED]
    initial: DRAFT
    terminal: [ARCHIVED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: ARCHIVED, action: archive}
  help:
    summary: A set of assumptions that budgets and forecasts are prepared under.
    businessMeaning: Planning needs alternatives — what if demand falls 10%, what if a plant closes. Each scenario names one set of assumptions; budgets and forecasts are prepared within a scenario, so management can compare outcomes across scenarios without mixing them up or disturbing actual figures.
    usage: Finance defines scenarios at the start of planning; budgets and forecasts choose one; reports compare figures across scenarios.
    relationshipContext: Budgets and Forecasts belong to a Scenario. Actual transactions belong to none.
    lifecycle: Drafted, active while plans are prepared under it, and archived once it is no longer used.
    workflowContext: Budgeting, forecasting, stress testing, strategic planning.
    example: "Scenario DOWN-24: 'Downside 2024' — demand −12%, steel +8%, no price increase; used for the Q2 forecast stress test."
  relationships: []
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SCENARIO}
