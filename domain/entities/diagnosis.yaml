entity:
  name: Diagnosis
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical finding or condition identified during healthcare assessment.
  ui:
    icon: table
  identity:
    key: diagnosisId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: diagnosisId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the diagnosis record associated with this Diagnosis. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of this recorded condition, so treatment, claims and later encounters can refer to exactly this diagnosis."
  - name: codeSystem
    type: string
    required: true
    maxLength: 50
    help:
      summary: Captures the business meaning of code system for the Diagnosis. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which coding standard the code comes from, such as ICD-10-CM or SNOMED CT, which payers and registries need to interpret the code correctly."
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The standard code for the condition, such as E11.9 for type 2 diabetes without complications, which drives claims, clinical decision support and statistics."
  - name: description
    type: string
    required: true
    maxLength: 1000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The readable wording of the condition as clinicians see it on the chart, so a reader need not decode the code."
  - name: diagnosisType
    type: enum
    required: true
    values:
    - PRIMARY
    - SECONDARY
    - SUSPECTED
    - HISTORICAL
    - OTHER
    help:
      summary: Captures the business meaning of diagnosis type for the Diagnosis. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PRIMARY: Represents the primary state or classification in the context of Diagnosis.
        SECONDARY: Represents the secondary state or classification in the context of Diagnosis.
        SUSPECTED: Represents the suspected state or classification in the context of Diagnosis.
        HISTORICAL: Represents the historical state or classification in the context of Diagnosis.
        OTHER: Represents the other state or classification in the context of Diagnosis.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether this is the main reason for the encounter, a secondary condition, only suspected, or past history, which affects billing order and how clinicians weigh it."
  - name: onsetDate
    type: date
    required: false
    help:
      summary: Records the business date associated with the onset. It is used in chronology, eligibility, scheduling, reporting,
        and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Diagnosis records, where applicable.
      relationshipContext: Its meaning is specific to Diagnosis; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the condition began or was first noticed, which clinicians use to judge its course and payers use to assess pre-existing conditions."
  relationships:
  - name: encounter
    target: HealthcareEncounter
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Diagnosis to HealthcareEncounter so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareEncounter records associated with a Diagnosis.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Diagnosis to HealthcarePatient so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcarePatient records associated with a Diagnosis.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  help:
    summary: "One clinical condition or finding identified for a patient during a healthcare encounter, coded so that care plans, billing, reporting and the patient's medical history all refer to the same problem."
    businessMeaning: Diagnosis is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Diagnosis records.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcareEncounter,
      HealthcarePatient. These relationships provide the context needed to interpret the record rather than treating its fields
      as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Diagnosis record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Recorded by a clinician during or after an encounter's assessment, refined from suspected to confirmed or marked historical as care continues, and then used by orders, treatment plans, claims coding and clinical reporting."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DIAGNOSIS
