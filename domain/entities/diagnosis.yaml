entity:
  name: Diagnosis
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical finding or condition identified during healthcare assessment.
  ui:
    icon: table
    recordLabel: [code, description]
  identity:
    key: diagnosisId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: diagnosisId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the diagnosis record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a diagnosis store this identifier. The number or code people quote is a separate field.
  - name: codeSystem
    type: string
    required: true
    maxLength: 50
    help:
      summary: The coding system of the diagnosis code, such as ICD-10 or SNOMED CT.
      usage: Tells systems how to interpret the code.
      relationshipContext: Read with the code.
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: The diagnosis code, such as E11.9.
      usage: Used for billing, reporting and decision support.
      relationshipContext: Valid in its coding system.
  - name: description
    type: string
    required: true
    maxLength: 1000
    help:
      summary: The diagnosis in words.
      usage: Shown on the patient record.
      relationshipContext: Usually the code's display text.
  - name: diagnosisType
    type: enum
    required: true
    values:
    - PRIMARY
    - SECONDARY
    - SUSPECTED
    - HISTORICAL
    - OTHER
    help:
      summary: The role of the diagnosis in the encounter.
      usage: Decides how it is reported and billed.
      relationshipContext: One primary diagnosis per encounter.
      valueSemantics:
        PRIMARY: The main reason for the encounter.
        SECONDARY: An additional condition relevant to the encounter.
        SUSPECTED: Considered but not yet confirmed.
        HISTORICAL: A past condition recorded for context.
        OTHER: Any other role.
  - name: onsetDate
    type: date
    required: false
    help:
      summary: When the condition began.
      usage: Entered if known.
      relationshipContext: Approximate dates are acceptable.
  - name: clinicalStatus
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, REMISSION, RESOLVED, ENTERED_IN_ERROR]
    help:
      summary: Whether the condition is current.
      usage: Updated by clinicians over time.
      relationshipContext: Resolved conditions stay on the history.
      valueSemantics:
        ACTIVE: The condition is present.
        REMISSION: The condition is present but not causing problems.
        RESOLVED: The condition is over.
        ENTERED_IN_ERROR: Recorded by mistake.
  - name: resolvedDate
    type: date
    required: false
    help:
      summary: When the condition resolved.
      usage: Recorded when the clinical status becomes resolved.
      relationshipContext: Not earlier than the onset date.
  relationships:
  - name: encounter
    target: HealthcareEncounter
    cardinality: '1'
    ownership: reference
    help:
      summary: The encounter during which the diagnosis was made.
      usage: Set when recording it.
      cardinalityMeaning: Every diagnosis is recorded in exactly one encounter.
      context: Listed among the encounter's diagnoses.
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient diagnosed.
      usage: The encounter's patient.
      cardinalityMeaning: Every diagnosis is of exactly one patient.
      context: Appears on the patient's problem list.
  help:
    summary: A condition a clinician has identified in a patient, recorded with its code and status.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcareEncounter, HealthcarePatient. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Clinicians record diagnoses during encounters, coded in a standard system; the patient's problem list, care plans, orders and billing all draw on them.
    lifecycle: A diagnosis is recorded as active; it may be confirmed or refuted, and later marked resolved or in remission. A diagnosis entered by mistake is marked entered in error, never deleted.
    example: E11.9 'Type 2 diabetes mellitus without complications' (ICD-10), primary, recorded in encounter E-24-30112, onset 2019, confirmed, active.
    businessMeaning: Diagnoses drive treatment decisions, billing and public-health reporting, so they must be coded correctly and kept current.
  invariants:
  - {id: DIAGNOSIS-001, rule: A condition does not resolve before it started., violatedWhen: resolved_date != null and onset_date != null and resolved_date < onset_date, message: The resolved date is earlier than the onset date.}
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DIAGNOSIS
