entity:
  name: Diagnosis
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical finding or condition identified during healthcare assessment.
  ui:
    icon: table
  identity:
    key: diagnosisId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: diagnosisId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the diagnosis entry.
        usage: Generated on creation; orders and billing refer to it.
    - name: codeSystem
      type: string
      required: true
      maxLength: 50
      help:
        summary: The coding system that the diagnosis code comes from, such as ICD-10.
        usage: Chosen with the code; both are needed for the code to be meaningful.
    - name: code
      type: string
      required: true
      maxLength: 50
      help:
        summary: The code from the system that identifies the condition.
        usage: Selected by the clinician; used for statistics and billing.
    - name: description
      type: string
      required: true
      maxLength: 1000
      help:
        summary: The plain-language description of the condition.
        usage: Entered or filled from the coding system; read by clinicians.
    - name: diagnosisType
      type: enum
      required: true
      values:
        - PRIMARY
        - SECONDARY
        - SUSPECTED
        - HISTORICAL
        - OTHER
      help:
        summary: The role the diagnosis plays in the encounter.
        usage: Chosen by the clinician when recording.
        valueSemantics:
          PRIMARY: The main condition that occasioned the encounter.
          SECONDARY: An additional condition that affects care.
          SUSPECTED: A condition thought likely but not yet confirmed.
          HISTORICAL: A past condition that is still relevant to the record.
          OTHER: Any diagnosis that does not fit the above.
    - name: onsetDate
      type: date
      required: false
      help:
        summary: The date the condition began, when known.
        usage: Entered by the clinician; used in the clinical timeline.
  relationships:
    - name: encounter
      target: HealthcareEncounter
      cardinality: '1'
      ownership: reference
      help:
        usage: Set when the clinician records the finding; it shows when and in which visit the condition was identified, and who was involved.
        summary: The encounter in which the diagnosis was made.
        cardinalityMeaning: 'Exactly one encounter: each entry is made during a specific visit.'
    - name: patient
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        usage: Set from the encounter when the diagnosis is recorded; it adds the condition to the patient's history and drives treatment and coding.
        summary: The patient who has the condition.
        cardinalityMeaning: "Exactly one patient: a diagnosis always belongs to a person's record."
  help:
    summary: A clinical finding or condition identified during a healthcare assessment.
    businessMeaning: A diagnosis is the clinical conclusion that explains a patient's problem. It drives treatment, coding for billing, and the patient's history.
    usage: Recorded by clinicians during an encounter; read by the care team, coders and later clinicians.
    relationshipContext: A diagnosis belongs to an encounter and to the patient being treated.
    lifecycle: Diagnoses are corrected by amendment; earlier entries remain as part of the clinical record.
    example: Type 2 diabetes mellitus, coded E11.9, recorded as the primary diagnosis at a clinic visit.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DIAGNOSIS
