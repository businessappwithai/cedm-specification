entity:
  name: Berth
  namespace: cedm.domain
  kind: port_berth
  description: A governed Port infrastructure location where a Vessel may be assigned for arrival, departure, loading, discharge, service or other terminal operations.
  ui: {icon: anchor}
  identity: {key: berthId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: berthId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the Berth., businessMeaning: Identifies one terminal berth independently of Port or Location labels., usage: "Berth planning, vessel operations, reporting and audit.", relationshipContext: Port owns the terminal context while Location may provide physical geography., requiredMeaning: Required.}}
    - {name: berthCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing berth reference., businessMeaning: Operational code used by terminal and vessel planners., usage: "Scheduling, communication and integration.", relationshipContext: Stable within port governance., requiredMeaning: Required.}}
    - {name: name, type: string, required: false, maxLength: 300, help: {summary: Human-readable berth name., businessMeaning: Supports operational recognition., usage: "Planning screens and reports.", relationshipContext: Code remains the primary operational reference., optionalMeaning: Optional where code is sufficient.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, RESTRICTED, OUT_OF_SERVICE, RETIRED]
      help: {summary: Operational availability state of the Berth., businessMeaning: Controls ordinary new vessel assignments., usage: "Port planning and safety.", relationshipContext: Historical vessel use remains valid after status changes., valueSemantics: {ACTIVE: Available under normal rules., RESTRICTED: Available only under constraints., OUT_OF_SERVICE: Temporarily unavailable., RETIRED: Permanently closed to new assignment.}, requiredMeaning: Required.}
  relationships:
    - {name: port, target: Port, cardinality: "1", ownership: reference, help: {summary: Port containing this Berth., businessMeaning: Establishes terminal ownership and operational context., usage: "Port planning and reporting.", cardinalityMeaning: Exactly one Port., workflowRole: Berth assignments occur within this Port.}}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Physical location record associated with the Berth., businessMeaning: Provides geospatial/site context without duplicating Location master data., usage: "Navigation, GIS and reporting.", cardinalityMeaning: Optional where Port/Berth code is sufficient., workflowRole: Location changes do not rewrite historical assignments.}}
    - {name: voyages, target: Voyage, cardinality: "0..*", ownership: reference, help: {summary: Voyages assigned to or historically using this Berth., businessMeaning: Preserves berth-utilization history., usage: "Capacity, operations and reporting.", cardinalityMeaning: Zero or many Voyages over time., workflowRole: Scheduling must avoid conflicting active assignments according to terminal policy.}}
  invariants:
    - {id: BERTH-001, rule: OUT_OF_SERVICE or RETIRED Berth cannot receive ordinary new Vessel/Voyage assignments.}
    - {id: BERTH-002, rule: Historical berth assignments remain auditable after infrastructure status or naming changes.}
  lifecycle:
    title: Berth Lifecycle
    attribute: status
    states: [ACTIVE, RESTRICTED, OUT_OF_SERVICE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: RESTRICTED, action: restrict}
      - {from: RESTRICTED, to: ACTIVE, action: restore}
      - {from: ACTIVE, to: OUT_OF_SERVICE, action: take_out_of_service}
      - {from: RESTRICTED, to: OUT_OF_SERVICE, action: take_out_of_service}
      - {from: OUT_OF_SERVICE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: RESTRICTED, to: RETIRED, action: retire}
      - {from: OUT_OF_SERVICE, to: RETIRED, action: retire}
  help:
    summary: Represents berth infrastructure and availability within a Port.
    businessMeaning: Berth is a persistent terminal resource; Voyage is a journey that may be assigned to it.
    usage: Port operations, berth planning, vessel scheduling, capacity, reporting and audit.
    relationshipContext: Port is mandatory; Location is optional physical context; Voyages preserve utilization history.
    lifecycle: Berth is active, may be restricted/out of service and eventually retired.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BERTH}
