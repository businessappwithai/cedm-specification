entity:
  name: SupplierClaim
  namespace: cedm.domain
  kind: supplier_quality_or_commercial_claim
  description: A formal claim raised against a supplier for defective, damaged, short, excess, incorrect, nonconforming, warranty-related, or otherwise disputed goods or services. It preserves claim evidence separately from SupplierReturn, SupplierCreditNote, SupplierDebitNote, and original procurement transactions.
  ui:
    icon: factory
  identity: {key: supplierClaimId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: supplierClaimId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supplier claim record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supplier claim store this identifier. The number or code people quote is a separate field.
  - {name: claimNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: Business-facing supplier claim reference., businessMeaning: Identifies the claim for procurement quality and supplier communication., usage: Used in correspondence investigations reporting and reconciliation., relationshipContext: Distinct from PurchaseOrder GoodsReceipt Invoice SupplierReturn and financial adjustment numbers., workflowRole: Provides the operational reference throughout the claim lifecycle., requiredMeaning: Required.}}
  - {name: claimDate, type: datetime, required: true, immutable: true, help: {summary: Date and time the claim was raised., businessMeaning: Establishes when the organization formally asserted the supplier issue., usage: Supports SLA measurement dispute aging supplier performance and audit., relationshipContext: Distinct from receipt inspection return resolution and financial-document dates., workflowRole: Anchors claim chronology., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - DRAFT
    - OPEN
    - UNDER_REVIEW
    - ACCEPTED
    - PARTIALLY_ACCEPTED
    - REJECTED
    - RESOLVED
    - CLOSED
    - CANCELLED
    - ESCALATED
    help:
      summary: Lifecycle state of the supplier claim.
      businessMeaning: Indicates whether the issue is being prepared investigated accepted disputed resolved or closed.
      usage: Controls investigation supplier response settlement and escalation.
      relationshipContext: Claim status is independent from SupplierReturn SupplierCreditNote SupplierDebitNote and SupplierClaimResolution statuses.
      workflowRole: Coordinates the case while physical and financial effects remain separate transactions.
      requiredMeaning: Required.
      valueSemantics:
        DRAFT: The status of the supplier claim is draft; set it when that is what the business means for this record.
        OPEN: The status of the supplier claim is open; set it when that is what the business means for this record.
        UNDER_REVIEW: The status of the supplier claim is under review; set it when that is what the business means for this record.
        ACCEPTED: The status of the supplier claim is accepted; set it when that is what the business means for this record.
        PARTIALLY_ACCEPTED: The status of the supplier claim is partially accepted; set it when that is what the business means for this record.
        REJECTED: The status of the supplier claim is rejected; set it when that is what the business means for this record.
        RESOLVED: The status of the supplier claim is resolved; set it when that is what the business means for this record.
        CLOSED: The status of the supplier claim is closed; set it when that is what the business means for this record.
        CANCELLED: The status of the supplier claim is cancelled; set it when that is what the business means for this record.
        ESCALATED: The status of the supplier claim is escalated; set it when that is what the business means for this record.
  - name: claimType
    type: enum
    required: true
    values:
    - QUALITY
    - DAMAGE
    - SHORTAGE
    - OVERAGE
    - WRONG_ITEM
    - WARRANTY
    - SERVICE
    - COMMERCIAL
    - DELIVERY
    - DOCUMENTATION
    - OTHER
    help:
      summary: Classification of the supplier issue.
      businessMeaning: States the principal business nature of the claim.
      usage: Drives routing evidence requirements supplier scorecards and analytics.
      relationshipContext: May be supported by QualityInspection or receiving evidence and may result in a return credit debit or other resolution.
      workflowRole: Determines investigation and resolution policy.
      requiredMeaning: Required.
      valueSemantics:
        QUALITY: The claim type of the supplier claim is quality; set it when that is what the business means for this record.
        DAMAGE: The claim type of the supplier claim is damage; set it when that is what the business means for this record.
        SHORTAGE: The claim type of the supplier claim is shortage; set it when that is what the business means for this record.
        OVERAGE: The claim type of the supplier claim is overage; set it when that is what the business means for this record.
        WRONG_ITEM: The claim type of the supplier claim is wrong item; set it when that is what the business means for this record.
        WARRANTY: The claim type of the supplier claim is warranty; set it when that is what the business means for this record.
        SERVICE: The claim type of the supplier claim is service; set it when that is what the business means for this record.
        COMMERCIAL: The claim type of the supplier claim is commercial; set it when that is what the business means for this record.
        DELIVERY: The claim type of the supplier claim is delivery; set it when that is what the business means for this record.
        DOCUMENTATION: The claim type of the supplier claim is documentation; set it when that is what the business means for this record.
        OTHER: The claim type of the supplier claim is other; set it when that is what the business means for this record.
  - {name: claimedAmount, type: Money, required: false, help: {summary: Financial value asserted by the organization in the claim., businessMeaning: Represents requested or estimated monetary recovery before supplier agreement or final adjustment., usage: Supports negotiation exposure reporting and recovery analysis., relationshipContext: It is not an accounting posting and must not be confused with SupplierCreditNote.totalAmount or SupplierDebitNote.totalAmount., workflowRole: Provides commercial context for settlement negotiation., optionalMeaning: Optional for non-financial claims.}}
  - name: resolutionCode
    type: enum
    required: false
    values:
    - NO_ACTION
    - REPLACEMENT
    - REPAIR
    - RETURN
    - CREDIT
    - DEBIT_ADJUSTMENT
    - PRICE_ADJUSTMENT
    - ACCEPTED_EXCEPTION
    - REJECTED
    help:
      summary: Agreed outcome category of the supplier claim.
      businessMeaning: Records the high-level outcome without itself executing the resulting transaction.
      usage: Supports supplier performance recovery analytics and downstream workflow routing.
      relationshipContext: Detailed authorization is represented by SupplierClaimResolution; RETURN may create SupplierReturn; CREDIT may create SupplierCreditNote; DEBIT_ADJUSTMENT may create SupplierDebitNote.
      workflowRole: Summarizes the resolution after agreement.
      optionalMeaning: Optional until resolution is agreed.
      valueSemantics:
        NO_ACTION: The resolution code of the supplier claim is no action; set it when that is what the business means for this record.
        REPLACEMENT: The resolution code of the supplier claim is replacement; set it when that is what the business means for this record.
        REPAIR: The resolution code of the supplier claim is repair; set it when that is what the business means for this record.
        RETURN: The resolution code of the supplier claim is return; set it when that is what the business means for this record.
        CREDIT: The resolution code of the supplier claim is credit; set it when that is what the business means for this record.
        DEBIT_ADJUSTMENT: The resolution code of the supplier claim is debit adjustment; set it when that is what the business means for this record.
        PRICE_ADJUSTMENT: The resolution code of the supplier claim is price adjustment; set it when that is what the business means for this record.
        ACCEPTED_EXCEPTION: The resolution code of the supplier claim is accepted exception; set it when that is what the business means for this record.
        REJECTED: The resolution code of the supplier claim is rejected; set it when that is what the business means for this record.
  - {name: notes, type: string, required: false, maxLength: 4000, help: {summary: Additional claim narrative and investigation context., businessMeaning: Records information not represented by structured fields., usage: Supplier communication investigation escalation and audit., relationshipContext: Complements structured inspection receipt invoice and return evidence without replacing it., workflowRole: Supports review and resolution., optionalMeaning: Optional.}}
  relationships:
  - {name: supplier, target: Supplier, cardinality: '1', ownership: reference, help: {summary: Supplier against whom the claim is raised., businessMeaning: Identifies the external party responsible for the disputed supply or service., usage: Supports communication scorecards recovery and escalation., workflowRole: Supplies supplier qualification and commercial context.}}
  - {name: purchaseOrder, target: PurchaseOrder, cardinality: 0..1, ownership: reference, help: {summary: Procurement commitment associated with the claim., businessMeaning: Connects the supplier issue to the original purchasing commitment., usage: Supports contractual price and quantity investigation., workflowRole: Supplies commercial source evidence.}}
  - {name: goodsReceipts, target: GoodsReceipt, cardinality: 0..*, ownership: reference, help: {summary: Receipt evidence supporting the supplier claim., businessMeaning: Identifies received goods or services involved in the issue., usage: Supports quantity date acceptance and supplier-performance investigation., workflowRole: Supplies authoritative receiving evidence.}, inverseCardinality: 0..*}
  - {name: qualityInspections, target: QualityInspection, cardinality: 0..*, ownership: reference, help: {summary: Quality inspections supporting the claim., businessMeaning: Links claim assertions to structured quality evidence., usage: Supports defect nonconformance and supplier-quality investigations., workflowRole: Supplies inspection results and disposition evidence.}, inverseCardinality: 0..*}
  - {name: supplierReturns, target: SupplierReturn, cardinality: 0..*, ownership: reference, help: {summary: Physical supplier returns associated with the claim., businessMeaning: Connects the case to reverse-procurement transactions used to return material., usage: Supports quantity recovery logistics inventory and claim resolution., workflowRole: A RETURN resolution may require one or more SupplierReturn records.}, inverseCardinality: 0..*}
  - {name: supplierCreditNotes, target: SupplierCreditNote, cardinality: 0..*, ownership: reference, help: {summary: Supplier financial credits associated with the claim., businessMeaning: Connects commercial recovery to explicit financial adjustment evidence., usage: Supports accounts payable reconciliation and recovery reporting., workflowRole: A CREDIT resolution may result in one or more SupplierCreditNote records.}}
  - {name: supplierDebitNotes, target: SupplierDebitNote, cardinality: 0..*, ownership: reference, help: {summary: Buyer-issued financial debits associated with the claim., businessMeaning: Connects an approved recovery case to explicit debit adjustment evidence without mutating the original Invoice., usage: Supports accounts payable recovery and supplier reconciliation., workflowRole: A DEBIT_ADJUSTMENT resolution may result in one or more SupplierDebitNote records.}}
  - {name: resolutions, target: SupplierClaimResolution, cardinality: 0..*, ownership: reference, help: {summary: Controlled decisions that define how this claim is to be resolved., businessMeaning: Separates the claim case from the authorized remedy and its downstream execution., usage: Approval governance execution tracking and audit., workflowRole: Bridges accepted claim evidence to SupplierReturn SupplierCreditNote SupplierDebitNote or Payment execution.}}
  - {name: invoices, target: Invoice, cardinality: 0..*, ownership: reference, help: {summary: Supplier invoices relevant to the claim., businessMeaning: Identifies original payable claims used as commercial or financial evidence without rewriting them., usage: Supports overcharge shortage tax and payable recovery investigation., workflowRole: Supplies transaction-time financial evidence for credit or debit resolution.}, inverseCardinality: 0..*}
  invariants:
  - {id: SUPPLIER-CLAIM-001, rule: OPEN or later claim status requires supplier context and claimType.}
  - {id: SUPPLIER-CLAIM-002, rule: "claimedAmount, when present, must be non-negative and use the governed claim currency."}
  - {id: SUPPLIER-CLAIM-003, rule: ACCEPTED or PARTIALLY_ACCEPTED requires supporting investigation evidence appropriate to claimType.}
  - {id: SUPPLIER-CLAIM-004, rule: A CREDIT resolution does not itself create accounting or payable reduction; an authorized SupplierCreditNote or other financial adjustment is required.}
  - {id: SUPPLIER-CLAIM-005, rule: A DEBIT_ADJUSTMENT resolution does not itself create accounting or payable recovery; an authorized SupplierDebitNote or other approved adjustment is required.}
  - {id: SUPPLIER-CLAIM-006, rule: A RETURN resolution does not itself change inventory; an authorized SupplierReturn and attributable InventoryMovement are required.}
  - {id: SUPPLIER-CLAIM-007, rule: "Original PurchaseOrder, GoodsReceipt, Invoice and quality records remain immutable historical evidence; claim resolution must not rewrite them."}
  - {id: SUPPLIER-CLAIM-008, rule: "Closed claims retain links to all physical, quality, resolution and financial evidence."}
  - {id: SUPPLIER-CLAIM-009, rule: "Corrections after closure use explicit amendment, reopening or compensating evidence according to policy and do not erase claim history."}
  - {id: SUPPLIER-CLAIM-010, rule: Claim creation and resolution workflows must be idempotent so retries cannot duplicate returns or financial adjustments.}
  - {id: SUPPLIER-CLAIM-EXE-001, rule: "Claimed Amount cannot be negative.", violatedWhen: "claimed_amount != null and claimed_amount < 0", message: "Claimed Amount cannot be negative."}
  lifecycle:
    title: Supplier Claim Lifecycle
    attribute: status
    states: [DRAFT, OPEN, UNDER_REVIEW, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, RESOLVED, CLOSED, CANCELLED, ESCALATED]
    initial: DRAFT
    terminal: [CLOSED, REJECTED, CANCELLED]
    transitions:
    - {from: DRAFT, to: OPEN, action: open}
    - {from: OPEN, to: UNDER_REVIEW, action: review}
    - {from: UNDER_REVIEW, to: ACCEPTED, action: accept}
    - {from: ACCEPTED, to: PARTIALLY_ACCEPTED, action: mark_partially_accepted}
    - {from: PARTIALLY_ACCEPTED, to: ESCALATED, action: mark_escalated}
    - {from: ESCALATED, to: RESOLVED, action: resolve}
    - {from: RESOLVED, to: CLOSED, action: close}
    - {from: DRAFT, to: REJECTED, action: reject}
    - {from: OPEN, to: REJECTED, action: reject}
    - {from: UNDER_REVIEW, to: REJECTED, action: reject}
    - {from: ACCEPTED, to: REJECTED, action: reject}
    - {from: PARTIALLY_ACCEPTED, to: REJECTED, action: reject}
    - {from: ESCALATED, to: REJECTED, action: reject}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: OPEN, to: CANCELLED, action: cancel}
    - {from: UNDER_REVIEW, to: CANCELLED, action: cancel}
    - {from: ACCEPTED, to: CANCELLED, action: cancel}
    - {from: PARTIALLY_ACCEPTED, to: CANCELLED, action: cancel}
    - {from: ESCALATED, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a supplier claim is put forward"
    description: "When a supplier claim is under review, a task asks someone to decide on it."
    when: "status == \"UNDER_REVIEW\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-CLAIM-APPROVAL-{{id}}"
          name: "Decide on supplier claim {{claim_number}}"
          description: "Supplier claim {{claim_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a supplier claim is ended"
    description: "When a supplier claim is rejected or cancelled, a task asks someone to settle what depended on it."
    when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-CLAIM-FOLLOW-UP-{{id}}"
          name: "Follow up on supplier claim {{claim_number}}"
          description: "Supplier claim {{claim_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Provides a formal auditable case for supplier-related quality or commercial recovery while keeping the decision and physical/financial consequences as separate controlled records.
    businessMeaning: SupplierClaim explains what went wrong and what recovery was requested or agreed. SupplierClaimResolution records the authorized remedy. SupplierReturn handles physical reversal; SupplierCreditNote or SupplierDebitNote handles financial adjustment; Payment handles cash movement.
    usage: Supplier quality procurement warranty dispute management recovery supplier scorecards accounts payable and audit.
    relationshipContext: PurchaseOrder GoodsReceipt and Invoice provide source evidence; QualityInspection provides technical evidence; SupplierClaimResolution governs the remedy; downstream transactions execute it.
    workflowContext: Issue detected → claim opened → evidence collected → supplier review → accepted/rejected → SupplierClaimResolution approved → create required SupplierReturn/SupplierCreditNote/SupplierDebitNote/Payment → reconcile outcome → close claim. No downstream effect is inferred merely from claim acceptance.
    lifecycle: Draft → open → under review → accepted/partially accepted/rejected → resolved → closed, with cancellation and escalation paths.
    changePropagation: Changes to source receipt inspection invoice return resolution or financial evidence trigger claim revalidation or reconciliation; completed source transactions remain immutable.
    example: An invoice contains an overcharge of EUR 500. A SupplierClaim records the issue, a SupplierClaimResolution authorizes DEBIT_ADJUSTMENT, and a SupplierDebitNote records the recovery while the original Invoice remains unchanged.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-CLAIM}
