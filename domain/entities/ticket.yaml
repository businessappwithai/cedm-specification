entity:
  name: Ticket
  namespace: cedm.domain
  kind: service_work_item
  description: A governed operational service work item assigned to a queue or responsible party to investigate, communicate, resolve, or coordinate a ServiceCase or ServiceRequest.
  ui: {icon: ticket}
  identity: {key: ticketId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: ticketId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the ticket., businessMeaning: Identifies one operational service work item independently of its parent case or request., usage: "Queues, assignment, escalation, reporting and audit.", relationshipContext: Remains stable across reassignment and status changes.}}
    - {name: ticketNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing ticket reference., businessMeaning: Operational identifier used by service teams and integrations., usage: "Search, communication, escalation and reporting.", relationshipContext: Distinct from case and request numbers.}}
    - {name: summary, type: string, required: true, maxLength: 500, help: {summary: Concise statement of the work to perform., businessMeaning: Defines the operational responsibility represented by the ticket., usage: "Queues, handoffs and reporting.", relationshipContext: Parent case or request provides broader business context.}}
    - {name: priority, type: enum, required: true, default: NORMAL, values: [LOW, NORMAL, HIGH, URGENT], help: {summary: Operational urgency of ticket work., businessMeaning: Guides queue ordering and escalation., usage: "Assignment, escalation and reporting.", relationshipContext: May inherit from but need not equal parent case priority., valueSemantics: {LOW: Low urgency., NORMAL: Standard urgency., HIGH: Elevated urgency., URGENT: Immediate attention.}}}
    - name: status
      type: enum
      required: true
      default: NEW
      values: [NEW, ASSIGNED, IN_PROGRESS, PENDING, RESOLVED, CLOSED, CANCELLED]
      help:
        summary: Lifecycle state of ticket execution.
        businessMeaning: Records whether work awaits assignment, is active, waits on a dependency, or is complete.
        usage: Service operations, queues, SLA and audit.
        relationshipContext: Parent case and request remain separate aggregates.
        valueSemantics:
          NEW: Ticket has been created but not assigned.
          ASSIGNED: Responsibility has been assigned.
          IN_PROGRESS: Work is actively being performed.
          PENDING: Work waits on a dependency.
          RESOLVED: Work outcome is recorded and awaits closure.
          CLOSED: Ticket is final historical evidence.
          CANCELLED: Ticket was cancelled through governed workflow.
  relationships:
    - {name: serviceCase, target: ServiceCase, cardinality: "0..1", ownership: reference, help: {summary: Service case coordinated by this ticket., businessMeaning: Places the work item within a durable customer or service issue., usage: "Case coordination and reporting.", cardinalityMeaning: Optional when ticket originates directly from a request., workflowRole: Ticket outcome contributes to case resolution.}}
    - {name: serviceRequest, target: ServiceRequest, cardinality: "0..1", ownership: reference, help: {summary: Service request directly giving rise to this ticket., businessMeaning: Preserves intake-to-work traceability., usage: "Service execution and audit.", cardinalityMeaning: Optional when case alone provides context., workflowRole: At least one of ServiceCase or ServiceRequest must provide governing context.}}
    - {name: assignee, target: Party, cardinality: "0..1", ownership: reference, help: {summary: Party currently responsible for the work., businessMeaning: Supports governed reassignment while retaining ticket identity., usage: "Queues, workload, escalation and audit.", cardinalityMeaning: Optional while unassigned., workflowRole: ASSIGNED or IN_PROGRESS normally requires a responsible party or governed queue.}}
    - {name: serviceLevelAgreement, target: ServiceLevelAgreement, cardinality: "0..1", ownership: reference, help: {summary: SLA applied to this ticket when ticket-level targets are measured., businessMeaning: Defines operational response or resolution commitment., usage: "Deadline and breach management.", cardinalityMeaning: Optional., workflowRole: Applied SLA version remains historical.}}
  invariants:
    - {id: TICKET-001, rule: Every Ticket must reference a ServiceCase or ServiceRequest as governing service context.}
    - {id: TICKET-002, rule: CLOSED or CANCELLED tickets are immutable historical work evidence except through explicit corrective follow-up records.}
    - {id: TICKET-003, rule: Resolution must preserve who performed the work and the evidence supporting the outcome.}
  lifecycle:
    title: Ticket Lifecycle
    attribute: status
    states: [NEW, ASSIGNED, IN_PROGRESS, PENDING, RESOLVED, CLOSED, CANCELLED]
    initial: NEW
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: NEW, to: ASSIGNED, action: assign}
      - {from: NEW, to: CANCELLED, action: cancel}
      - {from: ASSIGNED, to: IN_PROGRESS, action: start}
      - {from: ASSIGNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: PENDING, action: pend}
      - {from: PENDING, to: IN_PROGRESS, action: resume}
      - {from: IN_PROGRESS, to: RESOLVED, action: resolve}
      - {from: PENDING, to: RESOLVED, action: resolve}
      - {from: RESOLVED, to: CLOSED, action: close}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: PENDING, to: CANCELLED, action: cancel}
  help:
    summary: Represents assignable operational work within service management.
    businessMeaning: Ticket is a team work item, not the durable customer issue or the commercial execution authorization.
    usage: Help desk, customer service, technical support, escalation, queue management and audit.
    relationshipContext: ServiceCase or ServiceRequest provides business context, Party provides responsibility, and SLA may govern timing.
    lifecycle: New tickets are assigned, worked, may pend, and finish through resolved-to-closed or cancellation.
    example: A ServiceCase creates separate network and billing Tickets so each team can own work while the case remains one customer issue.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TICKET}
