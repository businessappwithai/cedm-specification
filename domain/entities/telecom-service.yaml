entity:
  name: TelecomService
  namespace: cedm.domain
  kind: telecom_entity
  description: A telecommunications service subscribed to or provided for a party.
  ui:
    icon: table
  identity:
    key: telecomServiceId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: telecomServiceId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the service, constant for its life.
        usage: Generated on creation; usage and billing refer to it.
        relationshipContext: Referenced by usage and invoice lines.
    - name: serviceNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number or reference of the service, such as a phone number or circuit id.
        usage: Unique; quoted on bills and support calls.
        relationshipContext: Read with the service type.
    - name: serviceType
      type: enum
      required: true
      values:
        - MOBILE
        - FIXED
        - BROADBAND
        - VOICE
        - DATA
        - IOT
        - OTHER
      help:
        summary: The kind of connectivity or communication service delivered to the customer.
        usage: Chosen when the service is set up; it determines the technical provisioning, usage records and tariffs that apply.
        valueSemantics:
          MOBILE: A cellular service tied to a handset or SIM, with voice, text and data.
          FIXED: A fixed-line telephone service delivered to a premises.
          BROADBAND: A fixed internet access service delivered to a premises.
          VOICE: A voice-only calling service, not bundled with data.
          DATA: A data-only connectivity service without voice calling.
          IOT: Machine connectivity for devices and sensors rather than people.
          OTHER: A telecommunications service that fits none of the other types.
        relationshipContext: Read by provisioning.
    - name: status
      type: enum
      required: true
      default: PENDING
      values:
        - PENDING
        - ACTIVE
        - SUSPENDED
        - TERMINATED
      help:
        summary: Where the service is in its life, from awaiting activation through use to suspension or termination.
        usage: Moved by provisioning, billing and customer care; only active services can carry usage, and terminated ones are kept for history.
        valueSemantics:
          PENDING: The service has been ordered but is not yet switched on.
          ACTIVE: The service is live and can carry traffic and be billed.
          SUSPENDED: The service is temporarily switched off, for example for non-payment or on request.
          TERMINATED: The service has been permanently ended. A final state.
        relationshipContext: Only active services carry traffic and are billed.
    - name: activationDate
      type: date
      required: false
      help:
        usage: Set when the service is switched on; billing starts from it.
        relationshipContext: Not later than the termination date.
        summary: Records the business date associated with the activation. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
    - name: terminationDate
      type: date
      required: false
      help:
        usage: Set when the service ends; must not be before activation.
        relationshipContext: Gives the length of service.
        summary: Records the business date associated with the termination. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
  relationships:
    - name: customer
      target: Customer
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: Every service is held by a single customer, who is billed and contacted about it.
        summary: The customer who holds the service.
        usage: Chosen when ordered.
        context: Decides who is billed and supported.
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        summary: The product the service was sold as.
        usage: Chosen when the service is provisioned from a product.
        cardinalityMeaning: At most one product.
        context: Decides the price and terms.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place the service is installed.
        usage: Chosen for fixed services.
        cardinalityMeaning: At most one location.
        context: Used for installation and fault repair.
  invariants:
    - id: TELECOM-SERVICE-001
      rule: terminationDate must not precede activationDate.
  lifecycle:
    title: Telecom Service Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    initial: PENDING
    terminal: [TERMINATED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
  help:
    summary: A telecommunications service that a customer subscribes to, such as a mobile line or broadband connection.
    businessMeaning: A telecom service is the thing the customer actually has and is billed for. Recording it with its number, type, dates and place lets support, provisioning and billing all work from the same record.
    usage: Created when an order is provisioned; read by support, billing and network operations.
    relationshipContext: A service belongs to one customer, may be sold as a product and may be installed at a location.
    lifecycle: A service is pending until activated, active while in use, may be suspended and resumed, and ends terminated. Terminated is final.
    example: Mobile service 07700 900123 is activated on 1 March for a business customer and suspended for non-payment in June.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TELECOM-SERVICE
