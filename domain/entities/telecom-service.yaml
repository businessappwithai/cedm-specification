entity:
  name: TelecomService
  namespace: cedm.domain
  kind: telecom_entity
  description: A telecommunications service subscribed to or provided for a party.
  ui:
    icon: table
    recordLabel: [serviceNumber]
  identity:
    key: telecomServiceId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: telecomServiceId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the telecom service record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a telecom service store this identifier. The number or code people quote is a separate field.
  - name: serviceNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number identifying the service, such as a phone number or circuit id.
      usage: Used by the customer, the network and billing.
      relationshipContext: Unique.
  - name: serviceType
    type: enum
    required: true
    values:
    - MOBILE
    - FIXED
    - BROADBAND
    - VOICE
    - DATA
    - IOT
    - OTHER
    help:
      summary: The kind of service.
      usage: Decides provisioning and rating.
      relationshipContext: Chosen when ordering.
      valueSemantics:
        MOBILE: A mobile line.
        FIXED: A fixed telephone line.
        BROADBAND: Fixed internet access.
        VOICE: A voice-only service.
        DATA: A data-only service.
        IOT: A connection for a machine or sensor.
        OTHER: Any other service.
  - name: status
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    help:
      summary: Whether the service works.
      usage: Changed by provisioning and collections.
      relationshipContext: Only active services carry traffic.
      valueSemantics:
        PENDING: Ordered; not yet active.
        ACTIVE: In use.
        SUSPENDED: Temporarily barred.
        TERMINATED: Ended.
  - name: activationDate
    type: date
    required: false
    help:
      summary: The day the service was activated.
      usage: Billing starts from it.
      relationshipContext: Not after termination.
  - name: terminationDate
    type: date
    required: false
    help:
      summary: The day the service ended.
      usage: Billing stops at it.
      relationshipContext: Present once terminated.
  relationships:
  - name: customer
    target: Customer
    cardinality: '1'
    ownership: reference
    help:
      summary: The customer the service is provided to.
      usage: Set when ordering.
      cardinalityMeaning: Each service belongs to one customer.
      context: Billed to the customer.
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product the service is sold as.
      usage: Set when ordering.
      cardinalityMeaning: At most one product.
      context: Its price applies.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where a fixed service is installed.
      usage: Set for fixed and broadband services.
      cardinalityMeaning: At most one location.
      context: Empty for mobile services.
  invariants:
  - id: TELECOM-SERVICE-001
    rule: terminationDate must not precede activationDate.
  lifecycle:
    title: Telecom Service Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    initial: PENDING
    terminal: [TERMINATED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: restore}
    - {from: ACTIVE, to: TERMINATED, action: terminate}
    - {from: SUSPENDED, to: TERMINATED, action: terminate}
    - {from: PENDING, to: TERMINATED, action: cancel}
  help:
    summary: A line or connection provided to a customer, such as a mobile number or broadband link.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, Product, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Telecom operators provision a service for each line, connection or device a customer has, activate it, suspend it for non-payment or on request, and terminate it when the contract ends.
    lifecycle: A service is pending until activated, active while in use, may be suspended and restored, and is terminated at the end.
    example: Service +39 347 123 4567, mobile, for customer Bianchi Marco, activated 2 February 2023, active.
    businessMeaning: The network is provisioned and usage is billed per service.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TELECOM-SERVICE
