entity:
  name: Supplier
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A Party that is authorized or recognized to provide goods, services, materials, assets, or other business inputs to an organization under a sourcing or commercial relationship.
  identity:
    key: supplierId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: supplierId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The immutable identity of the Supplier role record.
      usage: Used to connect procurement, purchase orders, receipts, invoices, payments, qualification, products, and supplier performance records to the same supplier relationship.
      relationshipContext: Identifies the Supplier specialization; PartyRole and Party identify the underlying party and broader role context.
      requiredMeaning: Required so supplier history remains traceable even if business codes or names change.
  - name: partyRoleId
    type: reference
    target: PartyRole
    required: true
    unique: true
    immutable: true
    help:
      summary: Links the supplier specialization to the PartyRole that establishes the party's supplier role.
      usage: Used to navigate from supplier-specific procurement data to common party identity, role, contact, and address information.
      relationshipContext: Supplier should not duplicate Party identity data; PartyRole provides the role-specific bridge and its roleType must be SUPPLIER.
      requiredMeaning: Required because Supplier is a role specialization rather than an independent replacement for Party.
  - name: supplierCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The organization's business reference for the supplier relationship.
      usage: Used on purchase orders, receiving documents, invoices, payment records, supplier portals, reports, and integrations.
      relationshipContext: SupplierCode is an enterprise-facing supplier reference and is distinct from the supplier's legal name, tax identifier, or external registration number.
      requiredMeaning: Required for procurement operations and human/system recognition.
  - name: supplierType
    type: enum
    required: false
    values: [INDIVIDUAL, BUSINESS, GOVERNMENT, INTERNAL, OTHER]
    help:
      summary: Classifies the type of party acting as the supplier.
      usage: Supports onboarding, compliance, sourcing, tax, contracting, and reporting rules.
      relationshipContext: This classifies the supplier relationship; the underlying Party remains the authoritative source for identity and legal information.
      optionalMeaning: Optional when the underlying Party classification already provides this information or it is not yet known.
  - name: qualificationStatus
    type: enum
    required: false
    values: [NOT_REVIEWED, PENDING, QUALIFIED, SUSPENDED, DISQUALIFIED]
    help:
      summary: Indicates whether the supplier has passed the organization's qualification and sourcing controls.
      usage: Used to determine whether procurement may source from the supplier, whether additional review is required, and whether existing relationships need restriction.
      relationshipContext: Qualification is a procurement control and is distinct from Supplier.status; a supplier can remain an active master record while being temporarily suspended from sourcing.
      workflowRole: Qualification gates creation or approval of new procurement commitments, while historical orders, receipts, invoices, and payments remain traceable.
      optionalMeaning: Optional where qualification is not part of the organization's supplier governance process.
  - name: paymentTerms
    type: reference
    target: PaymentTerm
    required: false
    help:
      summary: Defines the default commercial payment conditions associated with the supplier relationship.
      usage: Used when creating purchase orders, invoices, payment schedules, cash forecasts, and accounts-payable processes.
      relationshipContext: Supplier payment terms are defaults; a particular PurchaseOrder or contract may establish different negotiated terms that take precedence for that transaction.
      optionalMeaning: Optional when terms are determined by contract, supplier site, purchase order, or another specialized procurement rule.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, BLOCKED, RETIRED]
    help:
      summary: Controls whether the supplier relationship is generally available for procurement activity.
      usage: Used for sourcing eligibility, purchase-order creation, supplier portals, reporting, and master-data governance.
      relationshipContext: Supplier status controls the relationship's current usability; it does not invalidate historical PurchaseOrder, Receipt, Invoice, or Payment records.
      valueSemantics:
        ACTIVE: Supplier may normally participate in applicable procurement processes.
        INACTIVE: Supplier remains known but is not normally used for new procurement activity.
        BLOCKED: Supplier is temporarily prohibited from specified procurement activities, often for compliance, quality, commercial, or operational reasons.
        RETIRED: Supplier relationship has permanently ended for normal new activity while historical records remain retained.
      requiredMeaning: Required because procurement needs an authoritative eligibility state.
  relationships:
  - name: partyRole
    target: PartyRole
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Supplier to the common PartyRole representation of the supplier role.
      usage: Provides access to the underlying Party identity and shared role information without duplicating it in Supplier.
      cardinalityMeaning: Exactly one PartyRole represents this Supplier specialization.
  - name: addresses
    target: Address
    cardinality: 0..*
    ownership: reference
    help:
      summary: Associates addresses relevant to supplier operations, such as ordering, invoicing, remittance, manufacturing, or pickup locations.
      usage: Used for purchase orders, logistics, tax, correspondence, supplier onboarding, and site-specific procurement processes.
      cardinalityMeaning: A supplier may have multiple addresses serving different business purposes.
  - name: purchaseOrders
    target: PurchaseOrder
    cardinality: 0..*
    ownership: reference
    help:
      summary: The procurement commitments issued to this Supplier.
      usage: Supports supplier order history, spend analysis, fulfillment monitoring, cancellation, and procurement audit.
      cardinalityMeaning: A supplier may receive many purchase orders over its lifecycle.
      workflowRole: PurchaseOrder establishes a specific commitment derived from the supplier relationship; Supplier qualification and status govern whether new commitments may be created.
  - name: goodsReceipts
    target: GoodsReceipt
    cardinality: 0..*
    ownership: reference
    help:
      summary: Receiving records associated with fulfillment provided by this Supplier.
      usage: Supports delivery performance, quality, discrepancy management, accepted-quantity analysis, and invoice matching.
      cardinalityMeaning: A supplier may have many receipts across many purchase orders.
      workflowRole: Receipt evidence measures what the supplier actually delivered and what was accepted; it does not itself settle the supplier's invoice.
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
    help:
      summary: Financial claims issued by or associated with this Supplier.
      usage: Supports accounts payable, three-way matching, tax, supplier statements, payment approval, and reconciliation.
      cardinalityMeaning: A supplier may issue many invoices across purchase orders and receipts.
      workflowRole: Supplier invoice is a financial claim that must be validated against applicable commitment and accepted receipt evidence before approval where policy requires.
  - name: payments
    target: Payment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Payments in which this Supplier is the receiving party for procurement settlement.
      usage: Supports supplier settlement history, remittance, reconciliation, cash management, and audit.
      cardinalityMeaning: A supplier may receive many payments and a payment may settle one or many supplier invoices through PaymentAllocation.
      workflowRole: Payment settles approved financial claims; it does not prove receipt or invoice matching.
  - name: transactions
    target: BusinessTransaction
    cardinality: 0..*
    ownership: reference
    help:
      summary: Links the supplier to business transactions in which it participates as the providing party.
      usage: Supports end-to-end supplier history, spend analysis, procurement audit, invoice reconciliation, and performance analysis.
      cardinalityMeaning: A supplier may participate in many transactions across its lifecycle.
      context: The specific transaction type determines whether the supplier is providing goods, services, assets, or another input.
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: Identifies products that the supplier is capable or authorized to provide.
      usage: Supports sourcing, supplier-product qualification, procurement catalogs, replenishment, and supplier comparison.
      cardinalityMeaning: A supplier may provide many products, and a product may have many qualified suppliers.
      context: Supplier-product association should be extended with supplier-specific price, lead time, minimum quantity, contract, and supplier product code when those concepts are needed.
  invariants:
  - id: SUPPLIER-001
    rule: partyRole.roleType must equal SUPPLIER.
  - id: SUPPLIER-002
    rule: supplierCode must be unique within its ERP or organizational procurement context.
  - id: SUPPLIER-003
    rule: A BLOCKED or RETIRED supplier must not be selected for new procurement transactions unless an explicit exception policy permits it.
  - id: SUPPLIER-004
    rule: Supplier qualification/status may restrict new PurchaseOrder creation or approval but must not invalidate historical PurchaseOrder, GoodsReceipt, Invoice, Payment, or PaymentAllocation records.
  - id: SUPPLIER-005
    rule: Supplier invoices and payments must remain traceable through the applicable PurchaseOrder, GoodsReceipt, Invoice, and PaymentAllocation relationships; supplier master state must not be used as a substitute for transaction evidence.
  help:
    summary: Represents the procurement-facing role of a Party that supplies goods, services, materials, assets, or other business inputs.
    businessMeaning: Supplier is not simply another name for Party. Party provides identity; PartyRole establishes the supplier role; Supplier adds procurement-specific qualification, commercial defaults, sourcing eligibility, and supplier-product relationships.
    usage: Used by supplier onboarding, sourcing, procurement, PurchaseOrder, receiving, accounts payable, invoice matching, payment, supplier performance, compliance, and spend analytics.
    relationshipContext: Supplier connects PartyRole to Product, Address, PurchaseOrder, GoodsReceipt, Invoice, Payment, BusinessTransaction, and PaymentTerm. PurchaseOrder records a specific procurement commitment, GoodsReceipt records physical or service fulfillment, Invoice records the supplier financial claim, and Payment records settlement. These must remain distinct from the supplier master relationship.
    lifecycle: A supplier may be onboarded and not yet reviewed, qualified for sourcing, temporarily suspended, made inactive, or retired. Lifecycle state changes restrict future procurement activity without rewriting historical transactions.
    workflowContext: Supplier qualification/status → PurchaseOrder eligibility → supplier fulfillment → GoodsReceipt acceptance → InventoryMovement → Invoice three-way matching → Invoice approval → Payment → PaymentAllocation/settlement. Each stage provides different evidence and must not be collapsed into Supplier status.
    example: A container-repair company is onboarded as a Supplier. Its Party identity contains legal organization information, PartyRole establishes its supplier role, Supplier records qualification and sourcing eligibility, PurchaseOrders establish commitments, GoodsReceipts record accepted delivery, Invoices provide financial claims, and Payments settle approved claims.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLIER
