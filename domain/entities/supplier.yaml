entity:
  name: Supplier
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A Party that is authorized or recognized to provide goods, services, materials, assets, or other business inputs under a sourcing or commercial relationship.
  identity: {key: supplierId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: supplierId, type: uuid, required: true, immutable: true, help: {summary: Immutable Supplier role identity., usage: Connects procurement purchase orders receipts invoices payments returns credits claims resolutions and supplier performance., relationshipContext: Supplier identifies the role while PartyRole and Party identify the underlying party., workflowRole: Preserves supplier traceability across procure-to-pay reverse procurement claim recovery and performance management., requiredMeaning: Required for stable supplier history.}}
  - {name: partyRoleId, type: reference, target: PartyRole, required: true, unique: true, immutable: true, help: {summary: PartyRole backing the Supplier specialization., usage: Navigates to common party identity and role information., relationshipContext: Supplier must not duplicate Party identity., workflowRole: Supplies shared party context to procurement and financial workflows., requiredMeaning: Required for role specialization.}}
  - {name: supplierCode, type: string, required: true, unique: true, maxLength: 100, help: {summary: Enterprise supplier business reference., usage: Used on purchase orders receipts invoices returns credits payments claims portals reports and integrations., relationshipContext: Distinct from legal name and external registration identifiers., workflowRole: Identifies the supplier across procurement settlement recovery and performance., requiredMeaning: Required for operational recognition.}}
  - {name: supplierType, type: enum, required: false, values: [INDIVIDUAL, BUSINESS, GOVERNMENT, INTERNAL, OTHER], help: {summary: Classification of supplier relationship., usage: Supports onboarding compliance tax contracting and reporting., relationshipContext: Does not replace Party identity classification., workflowRole: Supplies supplier classification to procurement policy., optionalMeaning: Optional.}}
  - {name: qualificationStatus, type: enum, required: false, values: [NOT_REVIEWED, PENDING, QUALIFIED, SUSPENDED, DISQUALIFIED], help: {summary: Procurement qualification state., usage: Controls sourcing eligibility and supplier governance., relationshipContext: Qualification is distinct from master lifecycle status and may consume SupplierPerformanceAssessment evidence., workflowRole: Gates new procurement commitments while historical transactions remain valid., optionalMeaning: Optional where supplier qualification is not used.}}
  - {name: paymentTerms, type: reference, target: PaymentTerm, required: false, help: {summary: Default supplier settlement policy., usage: Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting., relationshipContext: Transaction or contract terms may override the default., workflowRole: Supplies default payable timing., optionalMeaning: Optional.}}
  - {name: status, type: enum, required: true, default: ACTIVE, values: [ACTIVE, INACTIVE, BLOCKED, RETIRED], help: {summary: Supplier relationship lifecycle state., usage: Controls procurement eligibility., relationshipContext: Historical transactions remain valid after state changes., workflowRole: New procurement return claim-resolution and performance workflows must evaluate status., requiredMeaning: Required for eligibility.}}
  relationships:
  - {name: partyRole, target: PartyRole, cardinality: '1', ownership: reference, help: {summary: Common PartyRole relationship., usage: Resolves underlying party and supplier role., cardinalityMeaning: Exactly one PartyRole., workflowRole: Supplies common identity.}}
  - {name: addresses, target: Address, cardinality: 0..*, ownership: reference, help: {summary: Supplier operational addresses., usage: Supports ordering invoicing logistics tax correspondence and returns., cardinalityMeaning: Multiple purpose-specific addresses are supported., workflowRole: Consuming workflows select the appropriate address.}}
  - {name: purchaseOrders, target: PurchaseOrder, cardinality: 0..*, ownership: reference, help: {summary: Procurement commitments issued to the supplier., usage: Supports spend fulfillment cancellation audit and performance measurement., cardinalityMeaning: Many purchase orders may exist., workflowRole: Supplier status and qualification govern new commitments.}}
  - {name: goodsReceipts, target: GoodsReceipt, cardinality: 0..*, ownership: reference, help: {summary: Accepted fulfillment records for supplier deliveries., usage: Supports quantity acceptance quality invoice matching and performance measurement., cardinalityMeaning: Many receipts may exist., workflowRole: Receipt evidence feeds matching returns and supplier scorecards.}}
  - {name: invoices, target: Invoice, cardinality: 0..*, ownership: reference, help: {summary: Supplier financial claims., usage: Supports accounts payable tax three-way matching reconciliation and supplier performance analysis., cardinalityMeaning: Many invoices may exist., workflowRole: Invoice approval depends on procurement and receipt evidence.}}
  - {name: payments, target: Payment, cardinality: 0..*, ownership: reference, help: {summary: Payments to the supplier., usage: Supports settlement remittance and reconciliation., cardinalityMeaning: Many payments may exist and one payment may settle multiple invoices., workflowRole: Payment settles approved claims; PaymentAllocation provides claim-level evidence.}}
  - {name: supplierReturns, target: SupplierReturn, cardinality: 0..*, ownership: reference, help: {summary: Reverse-procurement returns sent to the supplier., businessMeaning: Records goods returned after receipt without rewriting original receiving evidence., usage: Supports quality claims logistics inventory reversal supplier recovery and performance measurement., cardinalityMeaning: A supplier may receive many return transactions., workflowRole: Return execution requires eligible receipt evidence and may produce SupplierCreditNote.}}
  - {name: supplierCreditNotes, target: SupplierCreditNote, cardinality: 0..*, ownership: reference, help: {summary: Financial credits reducing supplier payable exposure., businessMeaning: Records explicit supplier financial adjustments without mutating original invoices., usage: Supports accounts payable tax reconciliation and supplier statements., cardinalityMeaning: A supplier may issue or receive many credits., workflowRole: Credits may originate from SupplierReturn or other authorized adjustments.}}
  - {name: supplierDebitNotes, target: SupplierDebitNote, cardinality: 0..*, ownership: reference, help: {summary: Buyer-issued financial debits increasing supplier recovery exposure., businessMeaning: Records explicit debit adjustments without mutating original supplier invoices., usage: Supports shortage overcharge damage penalty claim recovery and supplier reconciliation., cardinalityMeaning: A supplier may have many debit adjustments., workflowRole: Debit notes execute approved financial recovery independently of the claim case.}}
  - {name: supplierClaims, target: SupplierClaim, cardinality: 0..*, ownership: reference, help: {summary: Formal quality or commercial claims raised against the supplier., businessMeaning: Records disputed supply issues and their investigation history., usage: Supports supplier quality recovery disputes and performance management., cardinalityMeaning: A supplier may have many claims., workflowRole: Claims may produce returns credits debit notes or other controlled resolutions.}}
  - {name: supplierClaimResolutions, target: SupplierClaimResolution, cardinality: 0..*, ownership: reference, help: {summary: Authorized outcomes of supplier claims., businessMeaning: Records agreed remedies and the downstream transactions required to execute them., usage: Supports recovery governance execution tracking audit and supplier responsiveness measurement., cardinalityMeaning: A supplier may have many claim resolutions., workflowRole: Bridges supplier claim cases to physical returns financial adjustments and cash recovery.}}
  - {name: performanceAssessments, target: SupplierPerformanceAssessment, cardinality: 0..*, ownership: reference, help: {summary: Governed supplier performance scorecards., businessMeaning: Records periodic interpretations of delivery quality commercial and recovery evidence for supplier governance., usage: Supplier reviews qualification sourcing decisions improvement plans and risk management., cardinalityMeaning: A supplier may have many assessments across evaluation periods., workflowRole: Provides historical performance evidence without rewriting source transactions.}}
  - {name: transactions, target: BusinessTransaction, cardinality: 0..*, ownership: reference, help: {summary: Business transactions involving the supplier., usage: Supports end-to-end supplier history spend returns claims recovery audit and performance analytics., cardinalityMeaning: Many transactions may exist., workflowRole: Preserves supplier participation across processes.}}
  - {name: products, target: Product, cardinality: 0..*, ownership: reference, help: {summary: Products the supplier can provide., usage: Supports sourcing catalogs qualification supplier comparison and performance analysis., cardinalityMeaning: Many-to-many supplier-product participation is supported., workflowRole: Product supply capability can feed procurement selection and pricing.}}
  invariants:
  - {id: SUPPLIER-001, rule: partyRole.roleType must equal SUPPLIER.}
  - {id: SUPPLIER-002, rule: supplierCode must be unique within its organizational procurement context.}
  - {id: SUPPLIER-003, rule: BLOCKED or RETIRED supplier must not normally be selected for new procurement commitments or new return transactions without authorized exception.}
  - {id: SUPPLIER-004, rule: qualification or status changes must not invalidate historical PurchaseOrder GoodsReceipt Invoice Payment PaymentAllocation SupplierReturn SupplierCreditNote SupplierDebitNote SupplierClaim SupplierClaimResolution or SupplierPerformanceAssessment records.}
  - {id: SUPPLIER-005, rule: Supplier invoice approval must use applicable PurchaseOrder and accepted GoodsReceipt evidence when three-way matching is required.}
  - {id: SUPPLIER-006, rule: Supplier payment settlement must remain traceable from Payment through PaymentAllocation to applicable Invoice; supplier master status is not settlement evidence.}
  - {id: SUPPLIER-007, rule: SupplierReturn must reference eligible previously accepted GoodsReceipt evidence and must not create a financial credit merely because a return was authorized.}
  - {id: SUPPLIER-008, rule: SupplierCreditNote financial effects must remain traceable to eligible Invoice and, when return-originated, SupplierReturn evidence.}
  - {id: SUPPLIER-009, rule: SupplierDebitNote must remain traceable to the supplier and its supporting SupplierClaim or other authorized recovery evidence without rewriting the original Invoice.}
  - {id: SUPPLIER-010, rule: SupplierClaimResolution must remain traceable to exactly one SupplierClaim and its executed downstream evidence.}
  - {id: SUPPLIER-011, rule: SupplierPerformanceAssessment must reference the supplier and must not mutate the source procurement, receipt, quality, claim, return, financial or corrective-action records used as evidence.}
  - {id: SUPPLIER-012, rule: Published supplier performance assessments are immutable historical governance evidence; corrections use a superseding assessment rather than rewriting the prior result.}
  help:
    summary: Represents the procurement-facing role of a Party that supplies business inputs and participates in reverse procurement, supplier claims, financial recovery and performance governance.
    businessMeaning: Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific qualification, terms and transaction history. SupplierClaim captures the case; SupplierClaimResolution captures the remedy; downstream transactions execute it; SupplierPerformanceAssessment interprets accumulated evidence for governance.
    usage: Central to source-to-pay, sourcing, procurement, receiving, supplier returns, quality claims, accounts payable, supplier qualification, recovery and performance management.
    relationshipContext: Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, SupplierReturn, SupplierCreditNote, SupplierDebitNote, SupplierClaim, SupplierClaimResolution, SupplierPerformanceAssessment, Product and PaymentTerm.
    workflowContext: Supplier qualification/status → PurchaseOrder → GoodsReceipt → Invoice matching → Payment; issue detection → SupplierClaim → SupplierClaimResolution → SupplierReturn and/or SupplierCreditNote/SupplierDebitNote/Payment → reconciliation; periodic evidence aggregation → SupplierPerformanceAssessment → governance/improvement decision.
    lifecycle: Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence.
    example: A supplier's quarterly assessment combines delivery receipts, inspection failures, claims and returns into an approved scorecard. The result informs qualification and improvement decisions while the underlying transactions remain unchanged.
specification: {version: 0.5.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER}
