entity:
  name: Supplier
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A Party that is authorized or recognized to provide goods, services, materials, assets, or other business inputs under a sourcing or commercial relationship.
  identity: {key: supplierId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: supplierId
    type: uuid
    required: true
    immutable: true
    help: {summary: Immutable Supplier role identity., usage: Connects procurement purchase orders receipts invoices payments qualification and supplier performance., relationshipContext: Supplier identifies the role while PartyRole and Party identify the underlying party., workflowRole: Preserves supplier traceability across procure-to-pay., requiredMeaning: Required for stable supplier history.}
  - name: partyRoleId
    type: reference
    target: PartyRole
    required: true
    unique: true
    immutable: true
    help: {summary: PartyRole backing the Supplier specialization., usage: Navigates to common party identity and role information., relationshipContext: Supplier must not duplicate Party identity., workflowRole: Supplies shared party context to procurement and financial workflows., requiredMeaning: Required for role specialization.}
  - name: supplierCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: Enterprise supplier business reference., usage: Used on purchase orders receipts invoices payments portals reports and integrations., relationshipContext: Distinct from legal name and external registration identifiers., workflowRole: Identifies the supplier during procurement and settlement., requiredMeaning: Required for operational recognition.}
  - name: supplierType
    type: enum
    required: false
    values: [INDIVIDUAL, BUSINESS, GOVERNMENT, INTERNAL, OTHER]
    help: {summary: Classification of supplier relationship., usage: Supports onboarding compliance tax contracting and reporting., relationshipContext: Does not replace Party identity classification., workflowRole: Supplies supplier classification to procurement policy., optionalMeaning: Optional.}
  - name: qualificationStatus
    type: enum
    required: false
    values: [NOT_REVIEWED, PENDING, QUALIFIED, SUSPENDED, DISQUALIFIED]
    help: {summary: Procurement qualification state., usage: Controls sourcing eligibility and supplier governance., relationshipContext: Qualification is distinct from master lifecycle status., workflowRole: Gates new procurement commitments while historical transactions remain valid., optionalMeaning: Optional where supplier qualification is not used.}
  - name: paymentTerms
    type: reference
    target: PaymentTerm
    required: false
    help: {summary: Default supplier settlement policy., usage: Used by PurchaseOrder Invoice payables payment scheduling and cash forecasting., relationshipContext: Transaction or contract terms may override the default., workflowRole: Supplies default payable timing., optionalMeaning: Optional.}
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, BLOCKED, RETIRED]
    help: {summary: Supplier relationship lifecycle state., usage: Controls procurement eligibility., relationshipContext: Historical transactions remain valid after state changes., workflowRole: New procurement workflows must evaluate status., requiredMeaning: Required for eligibility.}
  relationships:
  - name: partyRole
    target: PartyRole
    cardinality: '1'
    ownership: reference
    help: {summary: Common PartyRole relationship., usage: Resolves underlying party and supplier role., cardinalityMeaning: Exactly one PartyRole., workflowRole: Supplies common identity.}
  - name: addresses
    target: Address
    cardinality: 0..*
    ownership: reference
    help: {summary: Supplier operational addresses., usage: Supports ordering invoicing logistics tax and correspondence., cardinalityMeaning: Multiple purpose-specific addresses are supported., workflowRole: Consuming workflows select the appropriate address.}
  - name: purchaseOrders
    target: PurchaseOrder
    cardinality: 0..*
    ownership: reference
    help: {summary: Procurement commitments issued to the supplier., usage: Supports spend fulfillment cancellation and audit., cardinalityMeaning: Many purchase orders may exist., workflowRole: Supplier status and qualification govern creation/approval of new commitments.}
  - name: goodsReceipts
    target: GoodsReceipt
    cardinality: 0..*
    ownership: reference
    help: {summary: Accepted fulfillment records for supplier deliveries., usage: Supports quantity acceptance quality and invoice matching., cardinalityMeaning: Many receipts may exist., workflowRole: Receipt evidence feeds three-way matching but does not settle an invoice.}
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
    help: {summary: Supplier financial claims., usage: Supports accounts payable tax three-way matching and reconciliation., cardinalityMeaning: Many invoices may exist., workflowRole: Invoice approval depends on applicable procurement and receipt evidence.}
  - name: payments
    target: Payment
    cardinality: 0..*
    ownership: reference
    help: {summary: Payments to the supplier., usage: Supports settlement remittance and reconciliation., cardinalityMeaning: Many payments may exist and one payment may settle multiple invoices., workflowRole: Payment settles approved claims; PaymentAllocation provides claim-level evidence.}
  - name: transactions
    target: BusinessTransaction
    cardinality: 0..*
    ownership: reference
    help: {summary: Business transactions involving the supplier., usage: Supports end-to-end supplier history spend and audit., cardinalityMeaning: Many transactions may exist., workflowRole: Preserves supplier participation across processes.}
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help: {summary: Products the supplier can provide., usage: Supports sourcing catalogs qualification and supplier comparison., cardinalityMeaning: Many-to-many supplier-product participation is supported., workflowRole: Product supply capability can feed procurement selection and pricing.}
  invariants:
  - {id: SUPPLIER-001, rule: partyRole.roleType must equal SUPPLIER.}
  - {id: SUPPLIER-002, rule: supplierCode must be unique within its organizational procurement context.}
  - {id: SUPPLIER-003, rule: BLOCKED or RETIRED supplier must not normally be selected for new procurement commitments without authorized exception.}
  - {id: SUPPLIER-004, rule: qualification or status changes must not invalidate historical PurchaseOrder GoodsReceipt Invoice Payment or PaymentAllocation records.}
  - {id: SUPPLIER-005, rule: Supplier invoice approval must use applicable PurchaseOrder and accepted GoodsReceipt evidence when three-way matching is required.}
  - {id: SUPPLIER-006, rule: Supplier payment settlement must remain traceable from Payment through PaymentAllocation to the applicable Invoice; supplier master status is not settlement evidence.}
  help:
    summary: Represents the procurement-facing role of a Party that supplies business inputs.
    businessMeaning: Party provides identity, PartyRole provides the role, and Supplier adds procurement-specific controls and commercial defaults.
    usage: Central to source-to-pay, sourcing, procurement, receiving, accounts payable, supplier qualification, and performance.
    relationshipContext: Supplier connects PartyRole to PurchaseOrder, GoodsReceipt, Invoice, Payment, PaymentAllocation, Product, and PaymentTerm.
    workflowContext: Supplier qualification/status → PurchaseOrder → fulfillment → GoodsReceipt → Invoice three-way match → approval → Payment → PaymentAllocation → settlement. Each stage provides distinct evidence.
    lifecycle: Onboard → qualify → active → suspend/block/inactive → retire. State changes constrain future activity without rewriting historical evidence.
    example: A repair vendor can be the same Party that is also a Customer elsewhere. Supplier retains procurement-specific qualification, terms, and history while Party remains the shared identity.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER}
