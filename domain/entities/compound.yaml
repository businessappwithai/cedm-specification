entity:
  name: Compound
  namespace: cedm.domain
  kind: life_sciences_entity
  description: A chemical or biological substance investigated for scientific, pharmaceutical, or industrial purposes.
  ui:
    icon: flask-conical
  identity:
    key: compoundId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: compoundId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the compound record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a compound store this identifier. The number or code people quote is a separate field.
  - name: compoundCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of compound code for the Compound. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: name
    type: string
    required: false
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: molecularFormula
    type: string
    required: false
    maxLength: 500
    help:
      summary: Captures the business meaning of molecular formula for the Compound. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: molecularWeight
    type: decimal
    required: false
    precision: 18
    scale: 6
    help:
      summary: Captures the business meaning of molecular weight for the Compound. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: status
    type: enum
    required: true
    default: RESEARCH
    values:
    - RESEARCH
    - DEVELOPMENT
    - CANDIDATE
    - APPROVED
    - DISCONTINUED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        RESEARCH: Represents the research state or classification in the context of Compound.
        DEVELOPMENT: Represents the development state or classification in the context of Compound.
        CANDIDATE: Represents the candidate state or classification in the context of Compound.
        APPROVED: Represents the approved state or classification in the context of Compound.
        DISCONTINUED: Represents the discontinued state or classification in the context of Compound.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  relationships:
  - name: experiments
    target: Experiment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Compound to Experiment so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Experiment records associated with a Compound.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: samples
    target: Sample
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Compound to Sample so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Sample records associated with a Compound.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  invariants:
  - {id: COMPOUND-EXE-001, rule: "Molecular Weight cannot be negative.", violatedWhen: "molecular_weight != null and molecular_weight < 0", message: "Molecular Weight cannot be negative."}
  lifecycle:
    title: Compound Lifecycle
    attribute: status
    states: [RESEARCH, DEVELOPMENT, CANDIDATE, APPROVED, DISCONTINUED]
    initial: CANDIDATE
    terminal: [DISCONTINUED]
    transitions:
    - {from: CANDIDATE, to: DEVELOPMENT, action: mark_development}
    - {from: DEVELOPMENT, to: RESEARCH, action: mark_research}
    - {from: RESEARCH, to: APPROVED, action: approve}
    - {from: CANDIDATE, to: DISCONTINUED, action: discontinue}
    - {from: DEVELOPMENT, to: DISCONTINUED, action: discontinue}
    - {from: RESEARCH, to: DISCONTINUED, action: discontinue}
    - {from: APPROVED, to: DISCONTINUED, action: discontinue}
  help:
    summary: Represents a life sciences entity called Compound within the CEDM business model.
    businessMeaning: Compound is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Compound records.
    relationshipContext: The entity participates in a wider business graph through relationships with Experiment, Sample. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Compound record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-COMPOUND
