entity:
  name: Compound
  namespace: cedm.domain
  kind: life_sciences_entity
  description: A chemical or biological substance investigated for scientific, pharmaceutical, or industrial purposes.
  ui:
    icon: flask-conical
    recordLabel: [compoundCode, name]
  identity:
    key: compoundId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: compoundId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the compound record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a compound store this identifier. The number or code people quote is a separate field.
  - name: compoundCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The registry number of the compound, such as ACM-004512.
      usage: Used on every sample label, experiment and report.
      relationshipContext: Unique and never reused.
  - name: name
    type: string
    required: false
    maxLength: 300
    help:
      summary: A name for the compound, where it has one.
      usage: Shown alongside the code.
      relationshipContext: Many research compounds have only a code.
  - name: molecularFormula
    type: string
    required: false
    maxLength: 500
    help:
      summary: The molecular formula, such as C21H27N5O2.
      usage: Used for checks and searches.
      relationshipContext: In Hill notation.
  - name: molecularWeight
    type: decimal
    required: false
    precision: 18
    scale: 6
    help:
      summary: The molecular weight, in grams per mole.
      usage: Used for concentrations and dosing.
      relationshipContext: Computed from the formula.
  - name: status
    type: enum
    required: true
    default: RESEARCH
    values:
    - RESEARCH
    - DEVELOPMENT
    - CANDIDATE
    - APPROVED
    - DISCONTINUED
    help:
      summary: How far the compound has progressed.
      usage: Moved on by the project team at stage-gate reviews.
      relationshipContext: Only candidates and later stages may enter development studies.
      valueSemantics:
        RESEARCH: Being made and tested in discovery.
        CANDIDATE: Nominated for development.
        DEVELOPMENT: In preclinical or clinical development.
        APPROVED: Approved for use as a product.
        DISCONTINUED: No longer pursued.
  - name: smiles
    type: text
    required: false
    help:
      summary: The structure as a SMILES string.
      usage: Used for structure searches and models.
      relationshipContext: Canonical form.
  - name: therapeuticArea
    type: string
    required: false
    maxLength: 100
    help:
      summary: The disease area the compound is aimed at.
      usage: Groups compounds in portfolio reviews.
      relationshipContext: Free text from the portfolio list.
  relationships:
  - name: experiments
    target: Experiment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Experiments the compound was used in.
      usage: Listed from the compound.
      cardinalityMeaning: Many experiments per compound; an experiment may test many compounds.
      context: A many-to-many relation.
  - name: samples
    target: Sample
    cardinality: 0..*
    ownership: reference
    help:
      summary: Samples of the compound.
      usage: Listed from the compound.
      cardinalityMeaning: Many samples per compound; a sample may contain several compounds.
      context: A many-to-many relation.
  invariants:
  - {id: COMPOUND-EXE-001, rule: "Molecular Weight cannot be negative.", violatedWhen: "molecular_weight != null and molecular_weight < 0", message: "Molecular Weight cannot be negative."}
  lifecycle:
    title: Compound Lifecycle
    attribute: status
    states: [RESEARCH, DEVELOPMENT, CANDIDATE, APPROVED, DISCONTINUED]
    initial: RESEARCH
    terminal: [APPROVED, DISCONTINUED]
    transitions:
    - {from: RESEARCH, to: CANDIDATE, action: nominate}
    - {from: CANDIDATE, to: DEVELOPMENT, action: develop}
    - {from: DEVELOPMENT, to: APPROVED, action: approve}
    - {from: CANDIDATE, to: RESEARCH, action: return_to_research}
    - {from: RESEARCH, to: DISCONTINUED, action: discontinue}
    - {from: CANDIDATE, to: DISCONTINUED, action: discontinue}
    - {from: DEVELOPMENT, to: DISCONTINUED, action: discontinue}
  help:
    summary: Represents a life sciences entity called Compound within the CEDM business model.
    businessMeaning: Compound is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Experiment, Sample. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Chemists register each compound they make or acquire; experiments and samples refer to it; project teams move promising compounds from research through candidate selection and development; the compound register is the reference for intellectual-property filings.
    lifecycle: A compound starts in research; promising ones are nominated as candidates, taken into development, and, rarely, approved as products. A compound can be discontinued at any stage.
    example: Compound ACM-004512, C21H27N5O2, MW 381.47, research → candidate 12 March 2024 after potency 4 nM and acceptable solubility.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-COMPOUND
