entity:
  name: Compound
  namespace: cedm.domain
  kind: life_sciences_entity
  description: A chemical or biological substance investigated for scientific, pharmaceutical, or industrial purposes.
  ui:
    icon: flask-conical
  identity:
    key: compoundId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: compoundId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the compound record.
        usage: Generated on registration; experiments, samples and results refer to it.
    - name: compoundCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique code the organisation gives the compound, such as CMP-00417.
        usage: Allocated at registration and used on labels, notebooks and reports; never reused.
    - name: name
      type: string
      required: false
      maxLength: 300
      help:
        summary: A common or working name for the compound.
        usage: Optional; shown beside the code to help scientists recognise it.
    - name: molecularFormula
      type: string
      required: false
      maxLength: 500
      help:
        summary: The chemical formula showing which elements, and how many atoms of each, make up the compound.
        usage: Entered from the structure at registration; used for search and to check weight calculations.
    - name: molecularWeight
      type: decimal
      required: false
      precision: 18
      scale: 6
      help:
        summary: The mass of one mole of the compound, in grams per mole.
        usage: Calculated from the formula or measured; used to convert between mass and amount of substance. Not negative.
    - name: status
      type: enum
      required: true
      default: RESEARCH
      values:
        - RESEARCH
        - DEVELOPMENT
        - CANDIDATE
        - APPROVED
        - DISCONTINUED
      help:
        summary: Where the compound stands in the development pipeline.
        usage: Advanced by the project team as evidence accumulates; decisions to progress or discontinue are made at review.
        valueSemantics:
          RESEARCH: Under early investigation; properties and activity are still being explored.
          DEVELOPMENT: Selected for further work such as optimisation and safety studies.
          CANDIDATE: Put forward as a candidate for approval or product development.
          APPROVED: Accepted for the intended use after review.
          DISCONTINUED: Dropped from the pipeline; history is kept.
  relationships:
    - name: experiments
      target: Experiment
      cardinality: 0..*
      ownership: reference
      help:
        summary: The experiments that study this compound.
        usage: Read to follow the evidence behind decisions about the compound.
        cardinalityMeaning: Any number, growing as work proceeds.
        workflowRole: Each experiment adds evidence used to advance or discontinue the compound.
    - name: samples
      target: Sample
      cardinality: 0..*
      ownership: reference
      help:
        summary: The physical samples of the compound.
        usage: Read to find available material and its provenance.
        cardinalityMeaning: Any number of samples, from different batches.
        workflowRole: Samples are what experiments actually consume and test.
  invariants:
    - {id: COMPOUND-EXE-001, rule: "Molecular Weight cannot be negative.", violatedWhen: "molecular_weight != null and molecular_weight < 0", message: "Molecular Weight cannot be negative."}
  lifecycle:
    title: Compound Lifecycle
    attribute: status
    states: [RESEARCH, DEVELOPMENT, CANDIDATE, APPROVED, DISCONTINUED]
    initial: RESEARCH
    terminal:
      - DISCONTINUED
    transitions:
      - {from: RESEARCH, to: DEVELOPMENT, action: mark_development}
      - {from: DEVELOPMENT, to: CANDIDATE, action: mark_candidate}
      - {from: CANDIDATE, to: APPROVED, action: approve}
      - {from: RESEARCH, to: DISCONTINUED, action: discontinue}
      - {from: DEVELOPMENT, to: DISCONTINUED, action: discontinue}
      - {from: CANDIDATE, to: DISCONTINUED, action: discontinue}
      - {from: APPROVED, to: DISCONTINUED, action: discontinue}
  help:
    summary: A chemical or biological substance being investigated for scientific, pharmaceutical or industrial purposes.
    businessMeaning: In discovery work the compound is the thing under study. Every experiment, sample and result traces back to it, so its identity, structure and development stage must be recorded exactly.
    usage: Registered when a substance is first synthesised or acquired; updated as it moves through research and development; read by scientists, project teams and regulators.
    relationshipContext: A compound is the subject of Experiments and exists physically as Samples; both link back to the compound.
    lifecycle: A compound begins in research, advances to development, becomes a candidate when it is put forward for approval, and is approved if accepted. It can be discontinued at any stage; the record remains.
    example: Compound CMP-00417, a kinase inhibitor with formula C22H24N4O3, moved from research into development after promising assay results.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-COMPOUND
