entity:
  name: Compound
  namespace: cedm.domain
  kind: life_sciences_entity
  description: A chemical or biological substance investigated for scientific, pharmaceutical, or industrial purposes.
  ui:
    icon: flask-conical
  identity:
    key: compoundId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: compoundId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the compound record associated with this Compound. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one substance; experiments and samples point at it, so results gathered over years of research all accumulate against the same compound."
  - name: compoundCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of compound code for the Compound. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The registry number scientists quote in lab notebooks, sample labels and reports, such as CPD-004512, which identifies the substance unambiguously even before it has a chosen name."
  - name: name
    type: string
    required: false
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The name researchers use for the substance, whether a chemical name, a project nickname or a proposed drug name, shown in searches, reports and on experiment records."
  - name: molecularFormula
    type: string
    required: false
    maxLength: 500
    help:
      summary: Captures the business meaning of molecular formula for the Compound. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The elements and counts of atoms that make up one molecule of the substance, such as C9H8O4, which chemists use to confirm identity and to calculate quantities."
  - name: molecularWeight
    type: decimal
    required: false
    precision: 18
    scale: 6
    help:
      summary: Captures the business meaning of molecular weight for the Compound. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The mass of one mole of the substance in grams per mole, used to convert between weighed amounts and molar quantities when preparing samples and doses."
  - name: status
    type: enum
    required: true
    default: RESEARCH
    values:
    - RESEARCH
    - DEVELOPMENT
    - CANDIDATE
    - APPROVED
    - DISCONTINUED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Compound records, where applicable.
      relationshipContext: Its meaning is specific to Compound; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        RESEARCH: Represents the research state or classification in the context of Compound.
        DEVELOPMENT: Represents the development state or classification in the context of Compound.
        CANDIDATE: Represents the candidate state or classification in the context of Compound.
        APPROVED: Represents the approved state or classification in the context of Compound.
        DISCONTINUED: Represents the discontinued state or classification in the context of Compound.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "How far the substance has progressed: CANDIDATE when first proposed, DEVELOPMENT and RESEARCH while it is being investigated, APPROVED once it meets its goals, and DISCONTINUED when work on it stops."
  relationships:
  - name: experiments
    target: Experiment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Compound to Experiment so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Experiment records associated with a Compound.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: samples
    target: Sample
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Compound to Sample so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Sample records associated with a Compound.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - {id: COMPOUND-EXE-001, rule: "Molecular Weight cannot be negative.", violatedWhen: "molecular_weight != null and molecular_weight < 0", message: "Molecular Weight cannot be negative."}
  lifecycle:
    title: Compound Lifecycle
    attribute: status
    states: [RESEARCH, DEVELOPMENT, CANDIDATE, APPROVED, DISCONTINUED]
    initial: CANDIDATE
    terminal: [DISCONTINUED]
    transitions:
      - {from: CANDIDATE, to: DEVELOPMENT, action: mark_development}
      - {from: DEVELOPMENT, to: RESEARCH, action: mark_research}
      - {from: RESEARCH, to: APPROVED, action: approve}
      - {from: CANDIDATE, to: DISCONTINUED, action: discontinue}
      - {from: DEVELOPMENT, to: DISCONTINUED, action: discontinue}
      - {from: RESEARCH, to: DISCONTINUED, action: discontinue}
      - {from: APPROVED, to: DISCONTINUED, action: discontinue}
  help:
    summary: "One chemical or biological substance the organisation is investigating, recorded once so every experiment and sample involving it can be tied to the same substance throughout its scientific and development history."
    businessMeaning: Compound is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Compound records.
    relationshipContext: The entity participates in a wider business graph through relationships with Experiment, Sample.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Compound record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Registered as a candidate when chemists first propose or synthesise the substance, taken into development and research as experiments are run and samples are prepared, approved once it meets its development goals, or discontinued at any stage while its experiments and samples remain on record."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-COMPOUND
