entity:
  name: SerialNumber
  namespace: cedm.domain
  kind: inventory_traceability_master
  description: A governed unique identity for an individually traceable unit of a Product across receipt, inventory, shipment, installation, maintenance, return, and disposal workflows.
  ui:
    icon: database
    recordLabel: [serialCode]
  identity: {key: serialNumberId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: serialNumberId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the serial number record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a serial number store this identifier. The number or code people quote is a separate field.
  - name: serialCode
    type: string
    required: true
    maxLength: 200
    help:
      summary: The serial number marked on the unit.
      businessMeaning: Operational code used to recognize the individual unit.
      usage: Scanned at every movement, installation and service of the unit.
      relationshipContext: Unique per product.
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values: [EXPECTED, AVAILABLE, RESERVED, IN_TRANSIT, INSTALLED, CONSUMED, RETURNED, QUARANTINED, SCRAPPED, RETIRED]
    help:
      summary: Where the unit is in its life.
      businessMeaning: Controls eligibility and custody transitions for the individual unit.
      usage: Moved on by receipts, reservations, shipments, installation and returns.
      relationshipContext: Read with the unit's current location.
      valueSemantics:
        EXPECTED: Announced by a supplier or production, not yet received.
        AVAILABLE: In stock and free to use.
        RESERVED: Set aside for an order or work order.
        IN_TRANSIT: On its way between locations or to a customer.
        INSTALLED: Installed at a customer's or in equipment.
        CONSUMED: Used up in production or maintenance.
        RETURNED: Came back from a customer or installation.
        QUARANTINED: Blocked pending a quality decision.
        SCRAPPED: Destroyed.
        RETIRED: Taken out of use for good.
  - name: manufacturedDate
    type: date
    required: false
    help:
      summary: When the unit was made.
      usage: Used for warranty and recall scoping.
      relationshipContext: From the manufacturer or production record.
  - name: warrantyEndDate
    type: date
    required: false
    help:
      summary: The last day of the unit's warranty.
      usage: Checked when the unit is returned or serviced.
      relationshipContext: From the warranty terms.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product the unit is an instance of.
      businessMeaning: Defines the standardized item type.
      workflowRole: Every serial movement must use the same Product.
      usage: Set when the serial number is registered.
      cardinalityMeaning: Every serial number belongs to one product.
      context: Serial numbers are unique within the product.
  - name: lot
    target: Lot
    cardinality: "0..1"
    ownership: reference
    help:
      summary: The lot the unit was made in.
      businessMeaning: Connects unit identity to batch genealogy.
      workflowRole: Serial and lot provenance must remain consistent.
      usage: Set for products tracked by both lot and serial number.
      cardinalityMeaning: At most one lot.
      context: Recalls by lot find every unit.
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: "0..*"
    ownership: reference
    help:
      summary: The movements of the unit.
      businessMeaning: Provides custody/location history.
      workflowRole: Movement history is authoritative for stock-location transitions.
      usage: Make up the unit's history.
      cardinalityMeaning: Many movements per unit; one movement can carry many units.
      context: A many-to-many relation; neither side holds the key.
  invariants:
  - {id: SERIAL-NUMBER-001, rule: The warranty does not end before the unit was made., violatedWhen: warranty_end_date != null and manufactured_date != null and warranty_end_date < manufactured_date, message: The warranty ends before the unit was made.}
  lifecycle:
    title: Serial Number Lifecycle
    attribute: status
    states: [EXPECTED, AVAILABLE, RESERVED, IN_TRANSIT, INSTALLED, CONSUMED, RETURNED, QUARANTINED, SCRAPPED, RETIRED]
    initial: EXPECTED
    terminal: [RETURNED, SCRAPPED, RETIRED]
    transitions:
    - {from: EXPECTED, to: AVAILABLE, action: mark_available}
    - {from: AVAILABLE, to: RESERVED, action: reserve}
    - {from: RESERVED, to: IN_TRANSIT, action: mark_in_transit}
    - {from: IN_TRANSIT, to: INSTALLED, action: mark_installed}
    - {from: INSTALLED, to: CONSUMED, action: consume}
    - {from: CONSUMED, to: RETURNED, action: mark_returned}
    - {from: AVAILABLE, to: QUARANTINED, action: quarantine}
    - {from: QUARANTINED, to: AVAILABLE, action: release}
    - {from: RESERVED, to: QUARANTINED, action: quarantine}
    - {from: QUARANTINED, to: RESERVED, action: release}
    - {from: IN_TRANSIT, to: QUARANTINED, action: quarantine}
    - {from: QUARANTINED, to: IN_TRANSIT, action: release}
    - {from: AVAILABLE, to: SCRAPPED, action: mark_scrapped}
    - {from: RESERVED, to: SCRAPPED, action: mark_scrapped}
    - {from: IN_TRANSIT, to: SCRAPPED, action: mark_scrapped}
    - {from: QUARANTINED, to: SCRAPPED, action: mark_scrapped}
    - {from: EXPECTED, to: RETIRED, action: retire}
    - {from: AVAILABLE, to: RETIRED, action: retire}
    - {from: RESERVED, to: RETIRED, action: retire}
    - {from: IN_TRANSIT, to: RETIRED, action: retire}
    - {from: QUARANTINED, to: RETIRED, action: retire}
    - {from: INSTALLED, to: RETIRED, action: retire}
    - {from: CONSUMED, to: RETIRED, action: retire}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a serial number is stopped"
    description: "When a serial number is quarantined, a high-priority task asks someone to resolve it."
    when: "status == \"QUARANTINED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SERIAL-NUMBER-EXCEPTION-{{id}}"
          name: "Resolve serial number {{id}}"
          description: "Serial number {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  help:
    summary: Unit-level identity and custody traceability for serialized products.
    businessMeaning: Product identifies the type, Lot identifies a batch, and SerialNumber identifies one physical unit.
    usage: Inventory, warehouse, logistics, manufacturing, service, maintenance, warranty, returns, recall, and asset management.
    relationshipContext: SerialNumber travels through InventoryMovement and may be associated with a Lot while preserving unique unit identity.
    lifecycle: Expected → available/reserved → in transit/installed/consumed/returned/quarantined → scrapped/retired as applicable.
    changePropagation: Status and custody changes revalidate inventory, reservation, shipment, service, return, and asset workflows; historical custody is never rewritten.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERIAL-NUMBER}
