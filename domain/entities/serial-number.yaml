entity:
  name: SerialNumber
  namespace: cedm.domain
  kind: inventory_traceability_master
  description: A governed unique identity for an individually traceable unit of a Product across receipt, inventory, shipment, installation, maintenance, return, and disposal workflows.
  ui:
    icon: database
  identity: {key: serialNumberId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: serialNumberId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this individual unit, used by movements, service orders and warranty claims to point at it.", businessMeaning: Identifies the unit independently of its printed serial code., usage: "Inventory, service, warranty, asset, recall, and audit.", relationshipContext: One serialized identity represents one governed physical unit., requiredMeaning: Required.}}
  - {name: serialCode, type: string, required: true, maxLength: 200, help: {summary: "The serial printed on the unit's label or nameplate, unique for the product, read by scanners and service technicians.", businessMeaning: Operational code used to recognize the individual unit., usage: "Scanning, receiving, picking, shipment, service, returns, and warranty.", relationshipContext: Uniqueness is governed for the Product or global namespace., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values: [EXPECTED, AVAILABLE, RESERVED, IN_TRANSIT, INSTALLED, CONSUMED, RETURNED, QUARANTINED, SCRAPPED, RETIRED]
    help: {summary: "Shows where this unit currently is in its life, such as available in stock, reserved, in transit, installed, quarantined or scrapped.", businessMeaning: Controls eligibility and custody transitions for the individual unit., usage: "Allocation, shipment, service, returns, and disposal.", relationshipContext: Status is reconciled from authoritative business and inventory events rather than freely edited., valueSemantics: {EXPECTED: Known before receipt., AVAILABLE: Eligible inventory., RESERVED: Committed to demand., IN_TRANSIT: Under logistics movement., INSTALLED: Deployed or installed., CONSUMED: Used in a process., RETURNED: Entered governed return flow., QUARANTINED: Restricted pending decision., SCRAPPED: Physically disposed as scrap., RETIRED: Lifecycle closed.}, requiredMeaning: Required.}
  relationships:
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product model represented by the serial., businessMeaning: Defines the standardized item type., usage: Validation and master-data context., cardinalityMeaning: Exactly one Product., workflowRole: Every serial movement must use the same Product.}}
  - {name: lot, target: Lot, cardinality: "0..1", ownership: reference, help: {summary: Lot or batch from which this serialized unit originates when applicable., businessMeaning: Connects unit identity to batch genealogy., usage: "Recall, quality, manufacturing, and provenance.", cardinalityMeaning: Optional for products not lot-controlled., workflowRole: Serial and lot provenance must remain consistent.}}
  - {name: inventoryMovements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {summary: Inventory events involving this individual unit., businessMeaning: Provides custody/location history., usage: "Traceability, reconciliation, returns, and audit.", cardinalityMeaning: Many lifecycle movements may occur., workflowRole: Movement history is authoritative for stock-location transitions.}}
  invariants:
  - {id: SERIAL-001, rule: serialCode must be unique within the governed serialization namespace.}
  - {id: SERIAL-002, rule: A serialized unit cannot simultaneously be on hand in multiple inventory locations.}
  - {id: SERIAL-003, rule: Quantity-bearing movement of an individually serialized unit must reconcile to exactly one unit per serial identity unless the product serialization policy explicitly models another measure.}
  - {id: SERIAL-004, rule: Serial identity and Product association referenced by posted evidence are immutable.}
  - {id: SERIAL-005, rule: "Status transitions must reconcile to inventory, shipment, installation, return, maintenance, or disposal evidence and retries must be idempotent."}
  lifecycle:
    title: Serial Number Lifecycle
    attribute: status
    states: [EXPECTED, AVAILABLE, RESERVED, IN_TRANSIT, INSTALLED, CONSUMED, RETURNED, QUARANTINED, SCRAPPED, RETIRED]
    initial: EXPECTED
    terminal: [RETURNED, SCRAPPED, RETIRED]
    transitions:
      - {from: EXPECTED, to: AVAILABLE, action: mark_available}
      - {from: AVAILABLE, to: RESERVED, action: reserve}
      - {from: RESERVED, to: IN_TRANSIT, action: mark_in_transit}
      - {from: IN_TRANSIT, to: INSTALLED, action: mark_installed}
      - {from: INSTALLED, to: CONSUMED, action: consume}
      - {from: CONSUMED, to: RETURNED, action: mark_returned}
      - {from: AVAILABLE, to: QUARANTINED, action: quarantine}
      - {from: QUARANTINED, to: AVAILABLE, action: release}
      - {from: RESERVED, to: QUARANTINED, action: quarantine}
      - {from: QUARANTINED, to: RESERVED, action: release}
      - {from: IN_TRANSIT, to: QUARANTINED, action: quarantine}
      - {from: QUARANTINED, to: IN_TRANSIT, action: release}
      - {from: AVAILABLE, to: SCRAPPED, action: mark_scrapped}
      - {from: RESERVED, to: SCRAPPED, action: mark_scrapped}
      - {from: IN_TRANSIT, to: SCRAPPED, action: mark_scrapped}
      - {from: QUARANTINED, to: SCRAPPED, action: mark_scrapped}
      - {from: EXPECTED, to: RETIRED, action: retire}
      - {from: AVAILABLE, to: RETIRED, action: retire}
      - {from: RESERVED, to: RETIRED, action: retire}
      - {from: IN_TRANSIT, to: RETIRED, action: retire}
      - {from: QUARANTINED, to: RETIRED, action: retire}
      - {from: INSTALLED, to: RETIRED, action: retire}
      - {from: CONSUMED, to: RETIRED, action: retire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a serial number is stopped"
      description: "When a serial number is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SERIAL-NUMBER-EXCEPTION-{{id}}"
              name: "Resolve serial number {{id}}"
              description: "Serial number {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: "The unique identity of one individual unit of a product, tracked from receipt through stock, shipment, installation, service and disposal so that each physical item can be traced."
    businessMeaning: Product identifies the type, Lot identifies a batch, and SerialNumber identifies one physical unit.
    usage: Inventory, warehouse, logistics, manufacturing, service, maintenance, warranty, returns, recall, and asset management.
    relationshipContext: SerialNumber travels through InventoryMovement and may be associated with a Lot while preserving unique unit identity.
    lifecycle: Expected → available/reserved → in transit/installed/consumed/returned/quarantined → scrapped/retired as applicable.
    changePropagation: Status and custody changes revalidate inventory, reservation, shipment, service, return, and asset workflows; historical custody is never rewritten.
    workflowContext: "Registered as expected when a serialised unit is ordered or produced, made available on receipt, reserved for an order, shipped, installed at a customer, and later returned, quarantined, scrapped or retired; inventory, service and warranty processes look the unit up by its serial."
    example: "Serial SN-7Q4K-209981 of product Compressor CX-200, from lot L-2026-37, currently INSTALLED at a customer site in Rotterdam."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERIAL-NUMBER}
