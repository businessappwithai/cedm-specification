entity:
  name: SerialNumber
  namespace: cedm.domain
  kind: inventory_traceability_master
  description: A governed unique identity for an individually traceable unit of a Product across receipt, inventory, shipment, installation, maintenance, return, and disposal workflows.
  identity: {key: serialNumberId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: serialNumberId, type: uuid, required: true, immutable: true, help: {summary: Stable system identity of the serialized unit., businessMeaning: Identifies the unit independently of its printed serial code., usage: "Inventory, service, warranty, asset, recall, and audit.", relationshipContext: One serialized identity represents one governed physical unit., requiredMeaning: Required.}}
  - {name: serialCode, type: string, required: true, maxLength: 200, help: {summary: Business/manufacturer serial identifier., businessMeaning: Operational code used to recognize the individual unit., usage: "Scanning, receiving, picking, shipment, service, returns, and warranty.", relationshipContext: Uniqueness is governed for the Product or global namespace., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values: [EXPECTED, AVAILABLE, RESERVED, IN_TRANSIT, INSTALLED, CONSUMED, RETURNED, QUARANTINED, SCRAPPED, RETIRED]
    help: {summary: Operational lifecycle state of the serialized unit., businessMeaning: Controls eligibility and custody transitions for the individual unit., usage: "Allocation, shipment, service, returns, and disposal.", relationshipContext: Status is reconciled from authoritative business and inventory events rather than freely edited., valueSemantics: {EXPECTED: Known before receipt., AVAILABLE: Eligible inventory., RESERVED: Committed to demand., IN_TRANSIT: Under logistics movement., INSTALLED: Deployed or installed., CONSUMED: Used in a process., RETURNED: Entered governed return flow., QUARANTINED: Restricted pending decision., SCRAPPED: Physically disposed as scrap., RETIRED: Lifecycle closed.}, requiredMeaning: Required.}
  relationships:
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product model represented by the serial., businessMeaning: Defines the standardized item type., usage: Validation and master-data context., cardinalityMeaning: Exactly one Product., workflowRole: Every serial movement must use the same Product.}}
  - {name: lot, target: Lot, cardinality: "0..1", ownership: reference, help: {summary: Lot or batch from which this serialized unit originates when applicable., businessMeaning: Connects unit identity to batch genealogy., usage: "Recall, quality, manufacturing, and provenance.", cardinalityMeaning: Optional for products not lot-controlled., workflowRole: Serial and lot provenance must remain consistent.}}
  - {name: inventoryMovements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {summary: Inventory events involving this individual unit., businessMeaning: Provides custody/location history., usage: "Traceability, reconciliation, returns, and audit.", cardinalityMeaning: Many lifecycle movements may occur., workflowRole: Movement history is authoritative for stock-location transitions.}}
  invariants:
  - {id: SERIAL-001, rule: serialCode must be unique within the governed serialization namespace.}
  - {id: SERIAL-002, rule: A serialized unit cannot simultaneously be on hand in multiple inventory locations.}
  - {id: SERIAL-003, rule: Quantity-bearing movement of an individually serialized unit must reconcile to exactly one unit per serial identity unless the product serialization policy explicitly models another measure.}
  - {id: SERIAL-004, rule: Serial identity and Product association referenced by posted evidence are immutable.}
  - {id: SERIAL-005, rule: "Status transitions must reconcile to inventory, shipment, installation, return, maintenance, or disposal evidence and retries must be idempotent."}
  help:
    summary: Unit-level identity and custody traceability for serialized products.
    businessMeaning: Product identifies the type, Lot identifies a batch, and SerialNumber identifies one physical unit.
    usage: Inventory, warehouse, logistics, manufacturing, service, maintenance, warranty, returns, recall, and asset management.
    relationshipContext: SerialNumber travels through InventoryMovement and may be associated with a Lot while preserving unique unit identity.
    lifecycle: Expected → available/reserved → in transit/installed/consumed/returned/quarantined → scrapped/retired as applicable.
    changePropagation: Status and custody changes revalidate inventory, reservation, shipment, service, return, and asset workflows; historical custody is never rewritten.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERIAL-NUMBER}
