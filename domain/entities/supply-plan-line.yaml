entity:
  name: SupplyPlanLine
  namespace: cedm.domain
  kind: supply_chain_entity
  description: A planned quantity for a product at a location and time within a supply plan.
  ui:
    icon: table
    recordLabel: [planningDate, plannedQuantity]
  identity:
    key: supplyPlanLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: supplyPlanLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supply plan line record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supply plan line store this identifier. The number or code people quote is a separate field.
  - name: planningDate
    type: date
    required: true
    help:
      summary: The date the quantity is needed by.
      usage: Places the line in the plan's time buckets.
      relationshipContext: Within the plan's horizon.
  - name: plannedQuantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: The quantity to supply.
      usage: Becomes the order quantity when released.
      relationshipContext: Not negative.
  - name: safetyStockQuantity
    type: decimal
    required: false
    precision: 20
    scale: 6
    help:
      summary: The stock to keep in reserve against uncertainty.
      usage: Added to demand when computing supply.
      relationshipContext: Not negative.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - RELEASED
    - FULFILLED
    - CANCELLED
    help:
      summary: Where the line stands.
      usage: Moved on as orders are created and completed.
      relationshipContext: Only planned lines can be changed freely.
      valueSemantics:
        PLANNED: Proposed by the plan.
        RELEASED: The order has been created.
        FULFILLED: The order has been completed.
        CANCELLED: No longer needed.
  relationships:
  - name: supplyPlan
    target: SupplyPlan
    cardinality: '1'
    ownership: reference
    help:
      summary: The plan the line belongs to.
      usage: Set when the line is created.
      cardinalityMeaning: Each line belongs to one plan.
      context: Shares its horizon and approval.
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product planned.
      usage: Set when the line is created.
      cardinalityMeaning: Each line is for one product.
      context: Must be in the plan's products.
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the quantity is needed.
      usage: Set when the line is created.
      cardinalityMeaning: Each line is for one location.
      context: Must be in the plan's locations.
  invariants:
  - {id: SUPPLY-PLAN-LINE-001, rule: Planned quantities are not negative., violatedWhen: planned_quantity < 0, message: The planned quantity cannot be negative.}
  - {id: SUPPLY-PLAN-LINE-002, rule: Safety stock is not negative., violatedWhen: safety_stock_quantity != null and safety_stock_quantity < 0, message: Safety stock cannot be negative.}
  - {id: SUPPLY-PLAN-LINE-EXE-001, rule: "Planned Quantity cannot be negative.", violatedWhen: "planned_quantity != null and planned_quantity < 0", message: "Planned Quantity cannot be negative."}
  lifecycle:
    title: Supply Plan Line Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, FULFILLED, CANCELLED]
    initial: PLANNED
    terminal: [FULFILLED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RELEASED, action: release}
    - {from: RELEASED, to: FULFILLED, action: fulfil}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a supply plan line is ended"
    description: "When a supply plan line is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLY-PLAN-LINE-FOLLOW-UP-{{id}}"
          name: "Follow up on supply plan line {{id}}"
          description: "Supply plan line {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A planned quantity of a product at a location for a date.
    relationshipContext: The entity participates in a wider business graph through relationships with SupplyPlan, Product, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Planners set, for each product, location and date of the plan, the quantity to make, buy or move and the safety stock to hold; released lines become purchase, production or transfer orders.
    lifecycle: A line is planned, released when the order it calls for is created, and fulfilled when that order is completed; a planned or released line may be cancelled.
    example: Plan SP-2024-W23, 'Cordless drill X200' at Lyon DC, week of 17 June 2024, 1,200 units, safety stock 300, released.
    businessMeaning: Released lines become purchase, production or transfer orders.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLY-PLAN-LINE
