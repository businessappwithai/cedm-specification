entity:
  name: Class
  namespace: cedm.domain
  kind: education_class
  description: A governed scheduled offering, section or cohort of an EducationCourse for a defined period, instructors and enrolled students.
  ui: {icon: school}
  identity: {key: classId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: classId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the class offering., businessMeaning: Identifies one scheduled course section independently of the reusable EducationCourse definition., usage: "Scheduling, enrollment, attendance, assessment and reporting.", relationshipContext: EducationCourse defines curriculum while Class defines one delivery instance.}}
    - {name: classCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing class or section reference., businessMeaning: Operational code for one course offering., usage: "Schedules, registers, search and integration.", relationshipContext: Distinct from EducationCourse code.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: Human-readable name of the class offering., businessMeaning: Identifies the teaching group to learners and staff., usage: "Schedules, portals and reports.", relationshipContext: May derive from course name plus section or term.}}
    - {name: startDate, type: date, required: false, help: {summary: First planned date of the class offering., businessMeaning: Establishes delivery period., usage: "Scheduling, enrollment eligibility and reporting.", relationshipContext: Must not follow endDate.}}
    - {name: endDate, type: date, required: false, help: {summary: Last planned date of the class offering., businessMeaning: Closes the delivery period., usage: "Scheduling and reporting.", relationshipContext: Must not precede startDate.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
      help:
        summary: Lifecycle state of the class offering.
        businessMeaning: Controls enrollment and delivery progression.
        usage: Scheduling, enrollment, attendance and reporting.
        relationshipContext: Completed class history remains immutable evidence.
        valueSemantics:
          DRAFT: Offering is being prepared.
          OPEN: Offering is available for governed enrollment or scheduling.
          IN_PROGRESS: Instruction is underway.
          COMPLETED: Delivery has concluded.
          CANCELLED: Offering was cancelled through governed process.
  relationships:
    - {name: course, target: EducationCourse, cardinality: "1", ownership: reference, help: {summary: Reusable course definition delivered by this Class., businessMeaning: Separates curriculum from one scheduled offering., usage: "Catalog, scheduling and reporting.", cardinalityMeaning: Exactly one EducationCourse., workflowRole: Course eligibility constrains new Class offerings.}}
    - {name: instructors, target: Party, cardinality: "0..*", ownership: reference, help: {summary: Parties assigned to instruct or facilitate the Class., businessMeaning: Establishes teaching responsibility., usage: "Scheduling, workload and learner communication.", cardinalityMeaning: Zero or many instructors while staffing is arranged., workflowRole: Instructor eligibility is governed externally or by education policy.}}
    - {name: enrollments, target: Enrollment, cardinality: "0..*", ownership: reference, help: {summary: Student enrollments assigned to this Class., businessMeaning: Establishes learner membership for the delivery instance., usage: "Registers, attendance and assessment.", cardinalityMeaning: Zero or many enrollments., workflowRole: Enrollment status controls attendance and assessment eligibility.}}
    - {name: attendanceRecords, target: Attendance, cardinality: "0..*", ownership: aggregate, help: {summary: Attendance evidence recorded for this Class., businessMeaning: Preserves participation history for enrolled students., usage: "Class registers, learner support and reporting.", cardinalityMeaning: Zero or many records., workflowRole: Attendance student and Class context must reconcile.}}
    - {name: assessments, target: Assessment, cardinality: "0..*", ownership: aggregate, help: {summary: Assessments scheduled or administered for this Class., businessMeaning: Connects evaluated learning activity to one delivery instance., usage: "Assessment planning, gradebook and reporting.", cardinalityMeaning: Zero or many assessments., workflowRole: Assessment timing and eligibility follow Class lifecycle and policy.}}
  invariants:
    - {id: CLASS-001, rule: endDate must not precede startDate when both are supplied.}
    - {id: CLASS-002, rule: COMPLETED or CANCELLED Class records are historical delivery evidence and must not be destructively rewritten.}
  lifecycle:
    title: Class Lifecycle
    attribute: status
    states: [DRAFT, OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: OPEN, action: open}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: OPEN, to: IN_PROGRESS, action: start}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  help:
    summary: Represents one scheduled delivery instance of an EducationCourse.
    businessMeaning: EducationCourse defines what is taught; Class defines when and to whom one offering is delivered.
    usage: School and education scheduling, enrollment, attendance, assessment, portals and reporting.
    relationshipContext: Course is mandatory; instructors and enrollments define participants; Attendance and Assessment preserve delivery evidence.
    lifecycle: Class moves from draft to open to in-progress and then completion or cancellation.
    example: Algebra I is the EducationCourse; Algebra I Section B for the 2026 term is a Class with its own students, attendance and assessments.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CLASS}
