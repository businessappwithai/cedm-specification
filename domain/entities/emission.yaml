entity:
  name: Emission
  namespace: cedm.domain
  kind: sustainability_entity
  description: A measured or calculated release of greenhouse gases or other environmental pollutants associated with a business activity or source.
  ui:
    icon: table
  identity:
    key: emissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: emissionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the emission record.
        usage: Generated on creation; reports and corrections refer to it.
    - name: emissionSource
      type: string
      required: true
      maxLength: 300
      help:
        summary: What produced the emission, such as boiler, fleet, purchased electricity or air travel.
        usage: Entered when recorded; used to group emissions by source.
    - name: emissionType
      type: enum
      required: true
      values:
        - SCOPE_1
        - SCOPE_2
        - SCOPE_3
        - OTHER
      help:
        summary: The reporting category of the emission under the greenhouse gas protocol.
        usage: Chosen when recorded; decides which reporting total it contributes to.
        valueSemantics:
          SCOPE_1: Direct emissions from sources the organisation owns or controls.
          SCOPE_2: Indirect emissions from purchased electricity, heat or steam.
          SCOPE_3: Other indirect emissions in the value chain, such as supplier and customer activity.
          OTHER: Emissions that do not fit the scope categories, such as local pollutants.
    - name: quantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The amount of gas or pollutant released, measured or calculated, in the unit the record states.
        usage: Entered from a meter reading or calculated from activity data; never negative, and it is totalled in sustainability reports.
    - name: unitOfMeasureId
      type: reference
      target: UnitOfMeasure
      required: true
      help:
        summary: The unit in which the quantity is expressed, such as tonnes of CO2 equivalent.
        usage: Chosen when recorded; quantities in different units are converted before being added.
    - name: measuredAt
      type: datetime
      required: true
      help:
        summary: When the emission was measured or the period it covers ended.
        usage: Set when recorded; used to assign it to a reporting period.
    - name: sourceQuality
      type: enum
      required: false
      values:
        - MEASURED
        - CALCULATED
        - ESTIMATED
      help:
        summary: How the figure was obtained, which tells readers how far to trust it.
        usage: Chosen when recorded; reports may show the share that is measured rather than estimated.
        valueSemantics:
          MEASURED: Taken from a meter or direct measurement.
          CALCULATED: Computed from activity data using emission factors.
          ESTIMATED: Approximated where no data was available.
  relationships:
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        usage: Chosen when the emission is recorded; it decides whose carbon total and reporting boundary the emission counts towards.
        summary: The organisation responsible for the emission.
        cardinalityMeaning: 'Exactly one organisation: every emission is attributed to a reporting entity.'
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        usage: Set when the release can be tied to a site; site-level reports and regional limits read it, and it is left empty otherwise.
        summary: The site where the emission occurred.
        cardinalityMeaning: At most one location; some emissions, such as air travel, have no single site.
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        usage: Set when the release can be assigned to a product's production or use; product carbon footprints are summed through it.
        summary: The product whose production or use caused the emission.
        cardinalityMeaning: At most one product; most emissions are not attributed to a product.
  invariants:
    - id: EMISSION-001
      rule: quantity must be zero or greater.
    - {id: EMISSION-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: A measured or calculated release of greenhouse gas or other pollutant tied to a business activity or source.
    businessMeaning: Sustainability reporting and carbon targets depend on recorded emissions. Each record says how much, of what kind, from which source and how reliable the figure is, so totals can be audited.
    usage: Recorded from meters, calculations or estimates; summed by organisation, site and period for reports.
    relationshipContext: An emission is attributed to an Organization, optionally to a Location or Product, and its quantity uses a UnitOfMeasure.
    lifecycle: Emission records are facts; a revised calculation is recorded as a new record or correction, not by overwriting.
    example: 120 tonnes of CO2e from the Rotterdam plant's natural gas use in March, calculated from metered gas volume.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMISSION
