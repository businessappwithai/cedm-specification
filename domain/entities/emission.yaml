entity:
  name: Emission
  namespace: cedm.domain
  kind: sustainability_entity
  description: A measured or calculated release of greenhouse gases or other environmental pollutants associated with a business activity or source.
  ui:
    icon: table
    recordLabel: [emissionSource, measuredAt]
  identity:
    key: emissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: emissionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the emission record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a emission store this identifier. The number or code people quote is a separate field.
  - name: emissionSource
    type: string
    required: true
    maxLength: 300
    help:
      summary: What caused the emission, such as "Natural gas boilers" or "Purchased electricity".
      usage: Groups emissions in the inventory.
      relationshipContext: From the company's list of sources.
  - name: emissionType
    type: enum
    required: true
    values:
    - SCOPE_1
    - SCOPE_2
    - SCOPE_3
    - OTHER
    help:
      summary: Which scope of the Greenhouse Gas Protocol the emission belongs to.
      usage: Decides where it appears in reports.
      relationshipContext: Scope 3 covers the value chain.
      valueSemantics:
        SCOPE_1: Direct emissions from sources the company owns or controls.
        SCOPE_2: Indirect emissions from purchased electricity, heat or steam.
        SCOPE_3: Other indirect emissions in the value chain, such as purchased goods and travel.
        OTHER: Emissions outside the three scopes, such as other pollutants.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How much was emitted.
      usage: Summed in the inventory.
      relationshipContext: In the unit of measure given, usually tonnes of CO2 equivalent.
  - name: unitOfMeasureId
    type: reference
    target: UnitOfMeasure
    required: true
    help:
      summary: The unit of the quantity, such as t CO2e.
      usage: Set when recording.
      relationshipContext: Converted for reporting if needed.
  - name: measuredAt
    type: datetime
    required: true
    help:
      summary: The end of the period the emission covers.
      usage: Assigns it to a reporting period.
      relationshipContext: Not in the future.
  - name: sourceQuality
    type: enum
    required: false
    values:
    - MEASURED
    - CALCULATED
    - ESTIMATED
    help:
      summary: How the figure was obtained.
      usage: Reported alongside the figure; estimates are replaced when better data arrives.
      relationshipContext: Measured data is preferred.
      valueSemantics:
        MEASURED: Measured directly, such as by a stack monitor.
        CALCULATED: Calculated from activity data and an emission factor.
        ESTIMATED: Estimated where data is missing.
  - name: activityAmount
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: The activity the emission was calculated from, such as kWh or litres.
      usage: Kept so the calculation can be checked.
      relationshipContext: Read with the emission factor.
  - name: emissionFactor
    type: decimal
    required: false
    precision: 18
    scale: 8
    help:
      summary: The factor used to turn the activity into emissions.
      usage: Kept so the calculation can be checked.
      relationshipContext: From a recognised source, named in the notes.
  - name: periodStart
    type: date
    required: false
    help:
      summary: The first day of the period the emission covers.
      usage: Used with the measured date for period reporting.
      relationshipContext: Not later than the measured date.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The company whose emission it is.
      usage: Set when recording.
      cardinalityMeaning: Every emission belongs to exactly one organization.
      context: Included in its carbon inventory.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: The site the emission comes from.
      usage: Set for site-level reporting.
      cardinalityMeaning: At most one.
      context: Site targets compare against it.
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product the emission is attributed to, for product footprints.
      usage: Set when emissions are allocated to products.
      cardinalityMeaning: At most one.
      context: Used in product carbon footprints.
  invariants:
  - id: EMISSION-001
    rule: quantity must be zero or greater.
  - {id: EMISSION-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: Represents a sustainability entity called Emission within the CEDM business model.
    businessMeaning: Emission is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Location, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Sustainability teams record emissions from meters, invoices and supplier data, by source and scope; they are summed into the company's carbon inventory and reported to regulators, investors and customers.
    lifecycle: An emission record is entered, then verified; once included in a published report it is not changed, and later corrections are recorded as new adjustments.
    example: 'Scope 1, natural gas boilers, Plant Lyon, March 2024: 18.4 t CO2e, calculated from 92,100 kWh with the national emission factor.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMISSION
