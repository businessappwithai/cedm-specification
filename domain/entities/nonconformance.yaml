entity:
  name: Nonconformance
  namespace: cedm.domain
  kind: quality_issue
  description: A recorded deviation from a requirement, specification, procedure, or expected result.
  identity: {key: nonconformanceId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: nonconformanceId, type: uuid, required: true, immutable: true}
    - {name: number, type: string, required: true, unique: true, maxLength: 100}
    - {name: severity, type: enum, required: true, values: [LOW, MEDIUM, HIGH, CRITICAL]}
    - {name: status, type: enum, required: true, default: OPEN, values: [OPEN, UNDER_REVIEW, CONTAINED, CORRECTIVE_ACTION, CLOSED, REJECTED]}
    - {name: description, type: string, required: true, maxLength: 4000}
    - {name: detectedAt, type: datetime, required: true}
    - {name: closedAt, type: datetime, required: false}
  relationships:
    - {name: inspection, target: QualityInspection, cardinality: "0..1", ownership: reference}
    - {name: product, target: Product, cardinality: "0..1", ownership: reference}
    - {name: owner, target: Party, cardinality: "0..1", ownership: reference}
    - {name: correctiveActions, target: CorrectiveAction, cardinality: "0..*", ownership: reference}
  invariants:
    - {id: NONCONFORMANCE-001, rule: closedAt must be present when status is CLOSED.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-NONCONFORMANCE}
