entity:
  name: Nonconformance
  namespace: cedm.domain
  kind: quality_issue
  description: A recorded deviation from a requirement, specification, procedure, or expected result, including supplier defects discovered during receipt inspection or supplier-return processing and requiring containment, disposition, corrective action, claim, or other controlled response.
  identity: {key: nonconformanceId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: nonconformanceId
    type: uuid
    required: true
    immutable: true
    help: {summary: Stable identity of the nonconformance., businessMeaning: Identifies one quality deviation independently of its inspection, product, receipt, return or corrective action., usage: Quality history, supplier performance, audit and CAPA., workflowRole: Root identity for issue lifecycle., requiredMeaning: Required.}
  - name: number
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: Business-facing nonconformance reference., businessMeaning: Identifies the issue for quality and supplier operations., usage: Audit, reporting, CAPA and dispute handling., workflowRole: Human-recognizable issue reference., requiredMeaning: Required.}
  - name: severity
    type: enum
    required: true
    values: [LOW, MEDIUM, HIGH, CRITICAL]
    help: {summary: Business severity of the deviation., businessMeaning: Indicates impact and urgency., usage: Prioritization, containment and escalation., workflowRole: Determines response urgency., requiredMeaning: Required.}
  - name: status
    type: enum
    required: true
    default: OPEN
    values: [OPEN, UNDER_REVIEW, CONTAINED, CORRECTIVE_ACTION, CLOSED, REJECTED]
    help: {summary: Lifecycle state of the quality issue., businessMeaning: Indicates investigation, containment, corrective action and closure., usage: Quality management and audit., workflowRole: Controls allowed responses and closure., requiredMeaning: Required.}
  - name: description
    type: string
    required: true
    maxLength: 4000
    help: {summary: Detailed explanation of the deviation., businessMeaning: States what requirement or expected result was not met., usage: Investigation, supplier communication, CAPA and audit., workflowRole: Provides issue evidence., requiredMeaning: Required.}
  - name: detectedAt
    type: datetime
    required: true
    help: {summary: Time the deviation was detected., businessMeaning: Establishes chronology for containment and corrective action., usage: Audit and quality analytics., workflowRole: Anchors issue occurrence., requiredMeaning: Required.}
  - name: closedAt
    type: datetime
    required: false
    help: {summary: Time the issue was formally closed., businessMeaning: Establishes completion chronology., usage: Quality performance and audit., workflowRole: Required for closure., optionalMeaning: Optional until closure.}
  relationships:
  - name: inspection
    target: QualityInspection
    cardinality: 0..1
    ownership: reference
    help: {summary: Inspection that detected or evidenced the deviation., businessMeaning: Connects issue to objective quality evaluation., usage: Investigation and audit., workflowRole: Provides detection evidence.}
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help: {summary: Product affected by the deviation., businessMeaning: Identifies material or service subject to quality issue., usage: Trend analysis and supplier quality., workflowRole: Supplies product context.}
  - name: goodsReceipt
    target: GoodsReceipt
    cardinality: 0..1
    ownership: reference
    help: {summary: Inbound receipt associated with the quality issue., businessMeaning: Connects supplier defect to receiving evidence., usage: Receiving containment and supplier performance., workflowRole: Provides original fulfillment context.}
  - name: goodsReceiptLines
    target: GoodsReceiptLine
    cardinality: 0..*
    ownership: reference
    help: {summary: Receipt lines affected by the deviation., businessMeaning: Identifies exact received quantities under issue., usage: Containment and disposition., workflowRole: Provides quantity-level evidence.}
  - name: supplierReturn
    target: SupplierReturn
    cardinality: 0..1
    ownership: reference
    help: {summary: Supplier return associated with the deviation., businessMeaning: Connects a quality issue to reverse-procurement response., usage: Return disputes, supplier claims, inspection and corrective action., workflowRole: Explains why returned material was initiated or why a return remains exceptional.}
  - name: supplierReturnLines
    target: SupplierReturnLine
    cardinality: 0..*
    ownership: reference
    help: {summary: Returned quantities affected by the quality issue., businessMeaning: Identifies exact return lines associated with the deviation., usage: Return validation and supplier accountability., workflowRole: Provides line-level response context.}
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help: {summary: Party accountable for issue management., businessMeaning: Identifies responsible quality owner or organizational party., usage: Escalation, CAPA and audit., workflowRole: Owns investigation and closure.}
  - name: correctiveActions
    target: CorrectiveAction
    cardinality: 0..*
    ownership: reference
    help: {summary: Corrective actions addressing the deviation., businessMeaning: Defines actions intended to remove causes or prevent recurrence., usage: CAPA and supplier improvement., workflowRole: Supports transition toward closure.}
  invariants:
  - {id: NONCONFORMANCE-001, rule: closedAt must be present when status is CLOSED.}
  - {id: NONCONFORMANCE-002, rule: A supplier-quality nonconformance should reference the inspection or receipt/return evidence that establishes the deviation unless an authorized external complaint or observation is the source.}
  - {id: NONCONFORMANCE-003, rule: A nonconformance associated with a SupplierReturn must not by itself change return quantity, inventory, payable exposure, or credit amount. Those effects require their respective controlled workflows.}
  - {id: NONCONFORMANCE-004, rule: Containment or disposition actions affecting inventory require attributable InventoryMovement evidence.}
  - {id: NONCONFORMANCE-005, rule: Closure requires required corrective-action, disposition and verification evidence according to severity and quality policy.}
  - {id: NONCONFORMANCE-006, rule: Historical issue evidence is immutable after closure except through explicit re-opening or linked corrective/reinspection records.}
  help:
    summary: Represents a controlled quality deviation and its investigation, containment and corrective-action lifecycle.
    businessMeaning: Nonconformance captures the quality problem; QualityInspection provides test evidence; GoodsReceipt/GoodsReceiptLine provide inbound evidence; SupplierReturn provides physical response; SupplierCreditNote provides financial response; CorrectiveAction addresses recurrence.
    usage: Supplier quality, incoming inspection, returns, CAPA, compliance, audit, supplier performance and risk management.
    relationshipContext: A quality issue may begin at receiving, inspection, customer/supplier return or external complaint. Operational, inventory and financial consequences remain separate business facts linked through traceable relationships.
    workflowContext: Inspection/receipt/return evidence → Nonconformance → containment → disposition → SupplierReturn where appropriate → attributable InventoryMovement → SupplierCreditNote where financially justified → corrective action → verification → closure.
    lifecycle: Open → under review → contained → corrective action → closed, with rejection where the issue is invalid.
    changePropagation: Changes to inspection, receipt, supplier return or product evidence affecting an open issue trigger revalidation. Financial and inventory consequences are never inferred solely from Nonconformance status.
    example: Incoming inspection detects defective units. Nonconformance records the defect, links the receipt lines, containment occurs, a supplier return is authorized, inventory is reduced through an attributable movement, and a supplier credit is applied separately. CorrectiveAction addresses the supplier root cause.