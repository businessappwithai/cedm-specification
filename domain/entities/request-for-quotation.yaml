entity:
  name: RequestForQuotation
  namespace: cedm.domain
  kind: sourcing_transaction
  description: A governed sourcing request issued to one or more Suppliers to obtain comparable commercial offers for approved procurement demand before a PurchaseOrder commitment is made.
  ui:
    icon: file-text
  identity: {key: requestForQuotationId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: requestForQuotationId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this sourcing request, which supplier quotations and resulting purchase orders point to.", businessMeaning: "Identifies one RFQ independently of requisitions, suppliers, responses, and purchase orders.", usage: "Sourcing, comparison, audit, and integration.", relationshipContext: Root identity for quotation solicitation., workflowRole: Carries sourcing context from approved demand through award., requiredMeaning: Required.}}
  - {name: rfqNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The request number buyers and suppliers quote in correspondence and on their quotations, such as RFQ-2026-0142.", businessMeaning: Identifies the solicitation to buyers and suppliers., usage: "Supplier communication, comparison, reports, and audit.", relationshipContext: Distinct from requisition and purchase-order numbers., workflowRole: Correlates supplier responses., requiredMeaning: Required.}}
  - {name: issuedAt, type: datetime, required: false, help: {summary: "When the request was formally sent to suppliers, which starts the window for them to respond.", businessMeaning: Establishes when suppliers were invited to respond., usage: Sourcing chronology and response-window control., relationshipContext: Distinct from demand approval and award time., optionalMeaning: Optional while draft.}}
  - {name: responseDueAt, type: datetime, required: false, help: {summary: "The deadline by which suppliers must submit their quotations to be considered in the comparison.", businessMeaning: Defines the normal competitive response window., usage: "Supplier communication, late-response policy, and sourcing SLA.", relationshipContext: Does not itself award business., optionalMeaning: Optional when sourcing policy has no fixed deadline.}}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ISSUED, CLOSED, AWARDED, CANCELLED]
    help: {summary: "Whether the request is being drafted, issued to suppliers, closed for responses, awarded, or cancelled.", businessMeaning: "Controls solicitation, response, closure, and award behavior.", usage: Sourcing workflow and governance., relationshipContext: "Award does not itself create a supplier commitment; PurchaseOrder does.", valueSemantics: {DRAFT: Being prepared., ISSUED: Open to invited supplier responses., CLOSED: Response collection ended without final award state., AWARDED: One or more responses were selected for downstream commitment., CANCELLED: Sourcing request terminated.}, requiredMeaning: Required.}
  relationships:
  - {name: lines, target: RequestForQuotationLine, cardinality: "1..*", ownership: aggregate, help: {summary: Detailed requirements suppliers are invited to quote., businessMeaning: "Defines line-level sourced quantity, product/service, and demand provenance.", usage: "Supplier response, comparison, split award, and audit.", cardinalityMeaning: An issued RFQ requires at least one line., workflowRole: Each line may receive multiple SupplierQuotationLine responses.}}
  - {name: requisitions, target: PurchaseRequisition, cardinality: 1..*, ownership: reference, help: {summary: Approved internal demands being sourced., businessMeaning: Provides authorized demand basis for the solicitation., usage: Demand-to-source traceability and audit., cardinalityMeaning: An RFQ must source at least one approved requisition., workflowRole: Supplies approved requirements without creating supplier commitment.}}
  - {name: suppliers, target: Supplier, cardinality: "1..*", ownership: reference, help: {summary: Suppliers invited to respond., businessMeaning: Defines the competitive or controlled supplier audience., usage: "Solicitation, qualification checks, and audit.", cardinalityMeaning: At least one eligible supplier is required before issue., workflowRole: Suppliers may respond through SupplierQuotation.}}
  - {name: supplierQuotations, target: SupplierQuotation, cardinality: "0..*", ownership: reference, help: {summary: Supplier offers received for this RFQ., businessMeaning: Captures commercial responses without converting them into commitments., usage: "Comparison, award, negotiation, and audit.", cardinalityMeaning: Zero or many responses may be received., workflowRole: Eligible responses feed controlled award decisions.}}
  - {name: purchaseOrders, target: PurchaseOrder, cardinality: 0..*, ownership: reference, help: {summary: Purchase orders created from awarded sourcing outcomes., businessMeaning: Connects sourcing selection to actual procurement commitment., usage: Source-to-pay traceability and audit., cardinalityMeaning: An RFQ may produce zero or multiple orders., workflowRole: Only approved PurchaseOrder establishes external commitment.}}
  invariants:
  - {id: RFQ-001, rule: ISSUED requires at least one approved PurchaseRequisition and at least one eligible Supplier.}
  - {id: RFQ-002, rule: AWARDED requires at least one accepted SupplierQuotation or an explicitly authorized sourcing exception.}
  - {id: RFQ-003, rule: "RFQ issuance or award does not itself create inventory, financial, or supplier commitment effects."}
  - {id: RFQ-004, rule: "PurchaseOrders created from an award must remain traceable to the RFQ, selected SupplierQuotation, and originating demand."}
  - {id: RFQ-005, rule: Corrections after award preserve sourcing history and use controlled amendment or re-award evidence.}
  lifecycle:
    title: Request For Quotation Lifecycle
    attribute: status
    states: [DRAFT, ISSUED, CLOSED, AWARDED, CANCELLED]
    initial: DRAFT
    terminal: [AWARDED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ISSUED, action: issue}
      - {from: ISSUED, to: CLOSED, action: close}
      - {from: CLOSED, to: AWARDED, action: mark_awarded}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ISSUED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a request for quotation is ended"
      description: "When a request for quotation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "REQUEST-FOR-QUOTATION-FOLLOW-UP-{{id}}"
              name: "Follow up on request for quotation {{rfq_number}}"
              description: "Request for quotation {{rfq_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One formal invitation sent to selected suppliers asking them to quote price and delivery for approved purchase requisitions, so offers can be compared before ordering."
    businessMeaning: PurchaseRequisition authorizes internal demand; RequestForQuotation solicits offers; SupplierQuotation records offers; PurchaseOrder creates the external commitment.
    usage: Strategic sourcing, competitive procurement, supplier selection, negotiation, compliance, and audit.
    relationshipContext: Bridges requisitions and suppliers to comparable responses and resulting purchase orders.
    lifecycle: Draft → issued → closed/awarded, with cancellation.
    changePropagation: Demand or supplier eligibility changes revalidate open sourcing; awarded history remains auditable and downstream orders require controlled amendment.
    workflowContext: "A buyer drafts the request from approved purchase requisitions and selects suppliers, issues it so suppliers can submit quotations by the due date, closes it when the response window ends, evaluates the quotations and awards it, after which purchase orders are raised from the winning offer; a request that is no longer needed is cancelled."
    example: "RFQ-2026-0142 issued on 2 March to three suppliers for 500 steel brackets, with responses due by 16 March and awarded to the lowest compliant bid."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-REQUEST-FOR-QUOTATION}
