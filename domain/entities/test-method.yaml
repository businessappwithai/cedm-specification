entity:
  name: TestMethod
  namespace: cedm.domain
  kind: quality_test_definition
  description: A governed reusable procedure for producing quality observations, including method identity, lifecycle, instructions, and applicability.
  ui:
    icon: flask-conical
  identity: {key: testMethodId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: testMethodId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the governed test method., businessMeaning: Identifies one reusable procedure independently of plans and measurements., usage: "Quality planning, laboratory execution, audit, and integration.", relationshipContext: Referenced by quality configurations and test evidence.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: 'The controlled business code identifying the test method, such as TM-HPLC-012.', usage: 'Assigned when the method is authored; unique, and quoted on inspection plans, results and laboratory records to show which procedure was used.', businessMeaning: Human-readable controlled identifier for the procedure., relationshipContext: Remains stable within its governed version.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: The readable name of the test method as quality and laboratory staff know it., usage: Entered by method owners; shown when planning inspections and recording results., businessMeaning: States the procedure understood by quality and laboratory personnel., relationshipContext: Complements the controlled code.}}
    - {name: instructions, type: string, required: false, maxLength: 10000, help: {summary: 'The step-by-step procedure, equipment and acceptance approach that testers follow to produce valid evidence.', usage: 'Written and reviewed under document control; testers follow it exactly, and changes are made through a new version, not silent edits.', businessMeaning: Describes how evidence must be produced., relationshipContext: May be supplemented by controlled external procedures.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
      help:
        summary: Shows whether the test method is being authored, available for use, paused, or withdrawn.
        usage: Moved by quality owners; only active methods may be selected for new inspections, and past results keep the method they used.
        valueSemantics:
          DRAFT: The method is being written and cannot yet be used for governed work.
          ACTIVE: The method is approved and may be selected for new inspections and tests.
          SUSPENDED: Use is paused, for example pending a deviation or recalibration, and may resume.
          RETIRED: The method is withdrawn permanently and kept for history. A final state.
        businessMeaning: Controls whether the procedure may be selected for new governed work.
        relationshipContext: Historical evidence retains the method/version used.
  relationships:
    - {name: qualityPlanCharacteristics, target: QualityPlanCharacteristic, cardinality: 0..*, ownership: reference, help: {summary: Plan-specific requirements using this method., businessMeaning: Shows where the reusable procedure is mandated., usage: Impact analysis and execution., cardinalityMeaning: A method may govern zero or many plan characteristics., context: Plan configuration supplies limits and requiredness.}}
    - {name: measurements, target: QualityMeasurement, cardinality: "0..*", ownership: reference, help: {summary: Historical observations produced using this method., businessMeaning: Links procedure definition to resulting evidence., usage: "Reproducibility, audit, analytics, and investigations.", cardinalityMeaning: A method may produce many measurements., context: Measurement preserves execution evidence.}}
  invariants:
    - {id: TEST-METHOD-001, rule: code must be unique in the governed quality namespace.}
    - {id: TEST-METHOD-002, rule: Only ACTIVE methods may be newly assigned to governed quality execution except through an authorized exception.}
    - {id: TEST-METHOD-003, rule: Suspending or retiring a method triggers impact analysis for active plan characteristics and open inspections.}
    - {id: TEST-METHOD-004, rule: Historical measurements must retain the method identity applicable when executed and must not be silently reinterpreted by later method changes.}
  lifecycle:
    title: Test Method Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Reusable governed procedure for producing quality evidence.
    businessMeaning: TestMethod separates how an observation is produced from what QualityCharacteristic is observed and what QualityPlanCharacteristic criteria apply.
    usage: Quality planning, laboratory testing, incoming inspection, compliance, training, audit, and analytics.
    relationshipContext: QualityPlanCharacteristic selects the method; QualityMeasurement records evidence produced under it.
    lifecycle: Draft → active → suspended/retired under controlled change.
    changePropagation: Method lifecycle or semantic changes revalidate affected open configurations and inspections while completed evidence remains historically stable.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TEST-METHOD}
