entity:
  name: MiningSite
  namespace: cedm.domain
  kind: mining_entity
  description: A geographic site at which mineral or natural-resource extraction activities occur.
  ui:
    icon: table
    recordLabel: [siteCode, name]
  identity:
    key: miningSiteId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: miningSiteId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the mining site record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a mining site store this identifier. The number or code people quote is a separate field.
  - name: siteCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the site.
      usage: Used in production reports and permits.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the site.
      usage: Shown in lists and reports.
      relationshipContext: Usually the mine's public name.
  - name: resourceType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The mineral or resource extracted, such as copper or lithium.
      usage: Decides the production units and reports that apply.
      relationshipContext: The main resource if there are several.
  - name: status
    type: enum
    required: true
    default: EXPLORATION
    values: [EXPLORATION, DEVELOPMENT, ACTIVE, SUSPENDED, CLOSED]
    help:
      summary: The phase of the site's life.
      usage: Changed by site management.
      relationshipContext: Only active sites report production.
      valueSemantics:
        EXPLORATION: The deposit is being explored.
        DEVELOPMENT: The mine is being built.
        ACTIVE: Producing.
        SUSPENDED: Production temporarily stopped.
        CLOSED: Closed for good.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the site is.
      usage: Set when the site is registered.
      cardinalityMeaning: Each site is at one location.
      context: Used for maps and regulatory reporting.
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The company operating the site.
      usage: Set when the site is registered.
      cardinalityMeaning: Each site has one operator.
      context: The operator holds the permits.
  - name: productionRecords
    target: ProductionRecord
    cardinality: 0..*
    ownership: reference
    help:
      summary: Production recorded at the site.
      usage: Listed for production reports.
      cardinalityMeaning: Any number of records.
      context: Each record is for one site.
  lifecycle:
    title: Mining Site Lifecycle
    attribute: status
    states: [EXPLORATION, DEVELOPMENT, ACTIVE, SUSPENDED, CLOSED]
    initial: EXPLORATION
    terminal: [CLOSED]
    transitions:
    - {from: EXPLORATION, to: DEVELOPMENT, action: develop}
    - {from: DEVELOPMENT, to: ACTIVE, action: start_production}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: DEVELOPMENT, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: SUSPENDED, to: CLOSED, action: close}
    - {from: EXPLORATION, to: CLOSED, action: abandon}
  help:
    summary: A mine or deposit the company explores, develops or operates.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization, ProductionRecord. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Mining companies register each site with the resource it holds, follow it from exploration through development to production, and record its production, permits and closure.
    lifecycle: A site is explored, developed, then active while producing; it may be suspended and resumed, and is closed at the end of its life or when exploration is abandoned.
    example: Site CL-ATA-03 'Atacama North', copper, operated by Minera Andina, active since 2019.
    businessMeaning: Production, permits, safety and closure obligations are managed per site.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MINING-SITE
