entity:
  name: SupplierClaimResolution
  namespace: cedm.domain
  kind: supplier_claim_resolution
  description: A controlled record of the agreed outcome of a SupplierClaim, identifying the remedy, approved recovery and the downstream transactions required to implement and evidence that outcome.
  ui:
    icon: factory
  identity: {key: supplierClaimResolutionId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: supplierClaimResolutionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supplier claim resolution record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supplier claim resolution store this identifier. The number or code people quote is a separate field.
  - {name: resolutionNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: Human-facing resolution reference., businessMeaning: Identifies the resolution decision for operational and supplier communication., usage: Used in approvals correspondence reconciliation and audit., relationshipContext: Distinct from the SupplierClaim claimNumber and downstream transaction numbers., workflowRole: Correlates resolution activity., requiredMeaning: Required.}}
  - {name: resolutionDate, type: datetime, required: true, help: {summary: Date and time the resolution was authorized., businessMeaning: Establishes when the agreed remedy became effective., usage: SLA reporting audit and financial control., workflowRole: Anchors downstream execution., requiredMeaning: Required.}}
  - name: resolutionType
    type: enum
    required: true
    values:
    - NO_ACTION
    - REPLACEMENT
    - REPAIR
    - RETURN
    - CREDIT
    - DEBIT_ADJUSTMENT
    - PRICE_ADJUSTMENT
    - CASH_RECOVERY
    - ACCEPTED_EXCEPTION
    help:
      summary: Authorized remedy for the supplier claim.
      businessMeaning: Defines what outcome was agreed without itself executing the remedy.
      usage: Routes downstream workflows and measures recovery outcomes.
      relationshipContext: RETURN may require SupplierReturn; CREDIT may require SupplierCreditNote; DEBIT_ADJUSTMENT may require SupplierDebitNote; CASH_RECOVERY may require Payment.
      workflowRole: Determines required execution evidence.
      requiredMeaning: Required.
      valueSemantics:
        NO_ACTION: The resolution type of the supplier claim resolution is no action; set it when that is what the business means for this record.
        REPLACEMENT: The resolution type of the supplier claim resolution is replacement; set it when that is what the business means for this record.
        REPAIR: The resolution type of the supplier claim resolution is repair; set it when that is what the business means for this record.
        RETURN: The resolution type of the supplier claim resolution is return; set it when that is what the business means for this record.
        CREDIT: The resolution type of the supplier claim resolution is credit; set it when that is what the business means for this record.
        DEBIT_ADJUSTMENT: The resolution type of the supplier claim resolution is debit adjustment; set it when that is what the business means for this record.
        PRICE_ADJUSTMENT: The resolution type of the supplier claim resolution is price adjustment; set it when that is what the business means for this record.
        CASH_RECOVERY: The resolution type of the supplier claim resolution is cash recovery; set it when that is what the business means for this record.
        ACCEPTED_EXCEPTION: The resolution type of the supplier claim resolution is accepted exception; set it when that is what the business means for this record.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - IN_EXECUTION
    - PARTIALLY_EXECUTED
    - EXECUTED
    - FAILED
    - CANCELLED
    help:
      summary: Lifecycle state of the resolution.
      businessMeaning: Separates decision approval from execution and completion.
      usage: Controls downstream work and claim closure.
      relationshipContext: Resolution status does not replace SupplierClaim or downstream transaction statuses.
      workflowRole: Gates execution and confirms whether required consequences completed.
      requiredMeaning: Required.
      valueSemantics:
        DRAFT: The status of the supplier claim resolution is draft; set it when that is what the business means for this record.
        APPROVED: The status of the supplier claim resolution is approved; set it when that is what the business means for this record.
        IN_EXECUTION: The status of the supplier claim resolution is in execution; set it when that is what the business means for this record.
        PARTIALLY_EXECUTED: The status of the supplier claim resolution is partially executed; set it when that is what the business means for this record.
        EXECUTED: The status of the supplier claim resolution is executed; set it when that is what the business means for this record.
        FAILED: The status of the supplier claim resolution is failed; set it when that is what the business means for this record.
        CANCELLED: The status of the supplier claim resolution is cancelled; set it when that is what the business means for this record.
  - {name: approvedAmount, type: Money, required: false, help: {summary: Monetary recovery authorized by the resolution., businessMeaning: Defines the financial amount expected from the agreed remedy., usage: Supplier recovery and reconciliation., relationshipContext: Not itself a credit note debit note or cash receipt; execution requires the appropriate financial transaction., workflowRole: Provides the controlled financial target., optionalMeaning: Optional for non-financial remedies.}}
  relationships:
  - {name: supplierClaim, target: SupplierClaim, cardinality: '1', ownership: reference, help: {summary: Supplier claim being resolved., businessMeaning: Connects the remedy to the case and evidence that established the issue., usage: Claim closure and audit., workflowRole: Supplies authoritative case context.}}
  - {name: supplierReturns, target: SupplierReturn, cardinality: 0..*, ownership: reference, help: {summary: Supplier returns executing a return remedy., businessMeaning: Identifies physical reverse-procurement transactions created by the resolution., usage: Logistics inventory and supplier reconciliation., workflowRole: Provides execution evidence for RETURN resolutions.}, inverseCardinality: 0..*}
  - {name: supplierCreditNotes, target: SupplierCreditNote, cardinality: 0..*, ownership: reference, help: {summary: Supplier credits executing a financial recovery remedy., businessMeaning: Identifies explicit payable reductions resulting from the resolution., usage: Accounts payable and reconciliation., workflowRole: Provides financial execution evidence for CREDIT resolutions.}}
  - {name: supplierDebitNotes, target: SupplierDebitNote, cardinality: 0..*, ownership: reference, help: {summary: Buyer-issued supplier debits executing a financial recovery remedy., businessMeaning: Identifies explicit debit adjustments created from the approved resolution., usage: Accounts payable recovery supplier dispute and reconciliation., workflowRole: Provides financial execution evidence for DEBIT_ADJUSTMENT resolutions.}}
  - {name: payments, target: Payment, cardinality: 0..*, ownership: reference, help: {summary: Cash receipts or other payments implementing a cash-recovery remedy., businessMeaning: Identifies actual money movement received from the supplier., usage: Cash reconciliation and settlement audit., workflowRole: Provides execution evidence for CASH_RECOVERY; Payment remains distinct from non-cash credit or debit application.}, inverseCardinality: 0..*}
  invariants:
  - {id: SUPPLIER-CLAIM-RESOLUTION-001, rule: Every resolution must reference exactly one SupplierClaim.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-002, rule: APPROVED resolution must identify a resolutionType and the evidence required by that remedy.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-003, rule: RETURN resolutions require SupplierReturn execution evidence before EXECUTED unless explicitly excepted.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-004, rule: CREDIT resolutions require posted SupplierCreditNote evidence before EXECUTED unless explicitly excepted.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-005, rule: DEBIT_ADJUSTMENT resolutions require posted SupplierDebitNote evidence before EXECUTED unless explicitly excepted.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-006, rule: CASH_RECOVERY resolutions require actual Payment evidence before EXECUTED.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-007, rule: Resolution approval must not mutate the original PurchaseOrder GoodsReceipt Invoice QualityInspection or SupplierClaim evidence.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-008, rule: Corrections after execution use reversal or compensating workflows in the affected downstream transaction and retain the original resolution history.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-009, rule: Resolution execution must be idempotent and must not create duplicate returns credits debit notes or payments.}
  - {id: SUPPLIER-CLAIM-RESOLUTION-010, rule: "When approvedAmount is present, aggregate authorized financial execution must not exceed it except under explicit correction policy."}
  - {id: SUPPLIER-CLAIM-RESOLUTION-EXE-001, rule: "Approved Amount cannot be negative.", violatedWhen: "approved_amount != null and approved_amount < 0", message: "Approved Amount cannot be negative."}
  lifecycle:
    title: Supplier Claim Resolution Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, IN_EXECUTION, PARTIALLY_EXECUTED, EXECUTED, FAILED, CANCELLED]
    initial: DRAFT
    terminal: [EXECUTED, FAILED, CANCELLED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: IN_EXECUTION, action: mark_in_execution}
    - {from: IN_EXECUTION, to: PARTIALLY_EXECUTED, action: mark_partially_executed}
    - {from: PARTIALLY_EXECUTED, to: EXECUTED, action: mark_executed}
    - {from: APPROVED, to: FAILED, action: fail}
    - {from: IN_EXECUTION, to: FAILED, action: fail}
    - {from: PARTIALLY_EXECUTED, to: FAILED, action: fail}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: IN_EXECUTION, to: CANCELLED, action: cancel}
    - {from: PARTIALLY_EXECUTED, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a supplier claim resolution is stopped"
    description: "When a supplier claim resolution is failed, a high-priority task asks someone to resolve it."
    when: "status == \"FAILED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-CLAIM-RESOLUTION-EXCEPTION-{{id}}"
          name: "Resolve supplier claim resolution {{resolution_number}}"
          description: "Supplier claim resolution {{resolution_number}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a supplier claim resolution is ended"
    description: "When a supplier claim resolution is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-CLAIM-RESOLUTION-FOLLOW-UP-{{id}}"
          name: "Follow up on supplier claim resolution {{resolution_number}}"
          description: "Supplier claim resolution {{resolution_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Converts a supplier claim decision into a controlled auditable execution plan without conflating the case remedy and resulting transactions.
    businessMeaning: SupplierClaim explains the problem; SupplierClaimResolution records the agreed remedy; SupplierReturn SupplierCreditNote SupplierDebitNote and Payment execute distinct physical or financial consequences.
    usage: Supplier dispute management procurement recovery accounts payable quality logistics and audit.
    relationshipContext: The resolution bridges case management and execution while preserving independent transaction histories.
    workflowContext: SupplierClaim accepted → remedy negotiated → SupplierClaimResolution approved → required return/credit/debit/payment executed → evidence reconciled → claim resolved/closed.
    lifecycle: Draft → approved → in execution → partially executed/executed, with failed and cancelled paths.
    changePropagation: Changes to the originating claim or downstream execution evidence require resolution revalidation; completed downstream transactions are corrected through their own compensating workflows.
    example: A quality claim is accepted for three defective units and EUR 300 recovery. The resolution authorizes RETURN plus CREDIT, links the resulting SupplierReturn and SupplierCreditNote, and becomes executed only after both required outcomes reconcile.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-CLAIM-RESOLUTION}
