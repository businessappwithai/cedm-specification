entity:
  name: Farm
  namespace: cedm.domain
  kind: agriculture_entity
  description: A managed agricultural operation consisting of land, facilities, resources, and production activities.
  ui:
    icon: table
  identity:
    key: farmId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: farmId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the farm record associated with this Farm. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Farm records, where applicable.
      relationshipContext: Its meaning is specific to Farm; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for the farm, keeping fields, crops and ownership history attached even if its name or code changes."
  - name: farmCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of farm code for the Farm. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Farm records, where applicable.
      relationshipContext: Its meaning is specific to Farm; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short code agronomists and administrators use to identify the farm in plans, reports and subsidy claims."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Farm records, where applicable.
      relationshipContext: Its meaning is specific to Farm; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name people know the farm by, used in everyday communication, reports and on maps."
  - name: farmType
    type: enum
    required: true
    values:
    - CROP
    - LIVESTOCK
    - MIXED
    - AQUACULTURE
    - OTHER
    help:
      summary: Captures the business meaning of farm type for the Farm. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Farm records, where applicable.
      relationshipContext: Its meaning is specific to Farm; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        CROP: Represents the crop state or classification in the context of Farm.
        LIVESTOCK: Represents the livestock state or classification in the context of Farm.
        MIXED: Represents the mixed state or classification in the context of Farm.
        AQUACULTURE: Represents the aquaculture state or classification in the context of Farm.
        OTHER: Represents the other state or classification in the context of Farm.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the farm grows crops, raises livestock, does both, farms fish or does something else, which decides which activities, records and regulations apply."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Farm records, where applicable.
      relationshipContext: Its meaning is specific to Farm; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Farm.
        ACTIVE: Represents the active state or classification in the context of Farm.
        INACTIVE: Represents the inactive state or classification in the context of Farm.
        RETIRED: Represents the retired state or classification in the context of Farm.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the farm is in production: ACTIVE farms are planned and reported on, PLANNED ones are not yet operating, INACTIVE ones are paused and RETIRED ones have closed."
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Farm to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Farm.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: owner
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Farm to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Farm.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: fields
    target: FarmField
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects Farm to FarmField so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about FarmField records associated with a Farm.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: crops
    target: Crop
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Farm to Crop so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Crop records associated with a Farm.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Farm Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One agricultural operation, with its land, facilities and production, identified by code and type so its fields, crops, owners and activities can be planned and reported together."
    businessMeaning: Farm is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Farm records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Party, FarmField,
      Crop. These relationships provide the context needed to interpret the record rather than treating its fields as isolated
      database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Farm record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "A farm is registered as planned when it is acquired or set up, activated when production begins, its fields and crops are then managed season by season, it may be made inactive while fallow or idle and reactivated, and it is retired when the operation ends."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM
