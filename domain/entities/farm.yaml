entity:
  name: Farm
  namespace: cedm.domain
  kind: agriculture_entity
  description: A managed agricultural operation consisting of land, facilities, resources, and production activities.
  ui:
    icon: table
  identity:
    key: farmId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: farmId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent identity of the farm record, unchanged when its code, name or owners change.
        usage: Generated on registration; fields, crops and production records refer to the farm by this value.
    - name: farmCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code by which the farm is known in plans and reports.
        usage: Unique; assigned at registration.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name by which the farm is known to staff, customers and authorities, such as Greenfield Farm.
        usage: Entered at registration and shown in lists, reports and documents; it may be changed without affecting the farm code.
    - name: farmType
      type: enum
      required: true
      values:
        - CROP
        - LIVESTOCK
        - MIXED
        - AQUACULTURE
        - OTHER
      help:
        valueSemantics:
          CROP: Production is mainly growing crops such as cereals, vegetables or fruit.
          LIVESTOCK: Production is mainly raising animals for meat, milk, eggs or breeding.
          MIXED: Both crops and livestock are produced on the same farm.
          AQUACULTURE: Farms fish or other aquatic species in ponds, tanks or enclosures.
          OTHER: Production that fits none of the listed kinds.
        summary: The main kind of production the farm carries out.
        usage: Chosen at registration; groups farms in reports.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the farm is currently producing, planned, paused, or no longer operating.
        usage: Set by the operator as production starts, pauses or ends; planning and reports use it to include only working farms.
        valueSemantics:
          PLANNED: Established on paper but not yet producing.
          ACTIVE: In production, with fields being worked or animals kept.
          INACTIVE: Temporarily not producing, for example in a fallow period.
          RETIRED: The operation has ended. A final state.
    - name: totalAreaHa
      type: decimal
      required: false
      precision: 12
      scale: 2
      help:
        summary: The total area of the farm, in hectares.
        usage: Used for subsidies and yield reporting.
        relationshipContext: Sum of its fields plus other land.
    - name: isOrganicCertified
      type: boolean
      required: true
      default: false
      help:
        summary: Says whether the farm currently holds an organic certification from a recognised certifying body.
        usage: Ticked by the farm manager once certification is granted and cleared if it lapses; it decides whether produce may be sold and labelled as organic.
        relationshipContext: Read together with the certification date, which shows when the status was granted.
    - name: certificationDate
      type: date
      required: false
      help:
        summary: The date the farm's current organic or quality certification was granted by the certifying body.
        usage: Entered from the certificate; auditors use it to trace produce back to a certified period and to plan renewal. It stays empty for uncertified farms.
        relationshipContext: Empty for uncertified farms.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The land and site of the farm.
        usage: Set at registration.
        cardinalityMeaning: 'Exactly one location: a farm is a place.'
        workflowRole: Supplies address and boundaries.
    - name: owner
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The parties that own the farm.
        usage: Recorded at registration.
        cardinalityMeaning: Any number of owners, including joint owners.
        workflowRole: Identifies who is entitled to the farm's output.
    - name: fields
      target: FarmField
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The fields that make up the farm.
        usage: Added as land is surveyed.
        cardinalityMeaning: Any number of fields.
        workflowRole: Fields are managed as part of the farm.
    - name: crops
      target: Crop
      cardinality: 0..*
      ownership: reference
      help:
        summary: The crops grown on the farm.
        usage: Linked from planting plans.
        cardinalityMeaning: Any number of crops.
        workflowRole: Shows the farm's production mix.
  lifecycle:
    title: Farm Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A managed agricultural operation consisting of land, buildings, resources and production activities.
    businessMeaning: A farm is the unit that plans what to grow or raise and answers for what it produces. Fields, crops and equipment are organised under it.
    usage: Registered when an operation is established; read by agronomy, operations and sales.
    relationshipContext: A farm stands at a Location, is owned by Parties, is divided into FarmFields and grows Crops.
    lifecycle: A farm is planned, goes active when production starts, may be inactive in a fallow period, and is retired when the operation ends.
    example: Greenfield Farm, a mixed crop and livestock operation of 340 hectares.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM
