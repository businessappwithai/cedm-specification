entity:
  name: Farm
  namespace: cedm.domain
  kind: agriculture_entity
  description: A managed agricultural operation consisting of land, facilities, resources, and production activities.
  ui:
    icon: table
    recordLabel: [farmCode, name]
  identity:
    key: farmId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: farmId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the farm record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a farm store this identifier. The number or code people quote is a separate field.
  - name: farmCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the farm, often its official holding number.
      usage: Used on movement, subsidy and traceability records.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the farm.
      usage: Shown wherever the farm is chosen.
      relationshipContext: Identifies it for people.
  - name: farmType
    type: enum
    required: true
    values:
    - CROP
    - LIVESTOCK
    - MIXED
    - AQUACULTURE
    - OTHER
    help:
      summary: What the farm mainly produces.
      usage: Decides which records and regulations apply.
      relationshipContext: Mixed farms keep both crop and livestock records.
      valueSemantics:
        CROP: Arable or horticultural crops.
        LIVESTOCK: Animals.
        MIXED: Both crops and livestock.
        AQUACULTURE: Fish or shellfish.
        OTHER: Any other kind.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the farm is operating.
      usage: Moved on by the farm manager.
      relationshipContext: Retired farms keep their history.
      valueSemantics:
        PLANNED: Not yet operating.
        ACTIVE: Operating.
        INACTIVE: Operations paused.
        RETIRED: Sold or closed.
  - name: totalAreaHa
    type: decimal
    required: false
    precision: 12
    scale: 2
    help:
      summary: The total area of the farm, in hectares.
      usage: Used for subsidies and yield reporting.
      relationshipContext: Sum of its fields plus other land.
  - name: isOrganicCertified
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the farm is certified organic.
      usage: Decides how its produce may be labelled.
      relationshipContext: Read with the certification date.
  - name: certificationDate
    type: date
    required: false
    help:
      summary: When the current organic or quality certification was granted.
      usage: Recorded for traceability.
      relationshipContext: Empty for uncertified farms.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the farm is.
      usage: Set when it is registered.
      cardinalityMeaning: Exactly one.
      context: The farmstead address.
  - name: owner
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Who owns the farm.
      usage: Recorded when it is registered.
      cardinalityMeaning: A farm may have several owners, and an owner several farms.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: fields
    target: FarmField
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The fields of the farm.
      usage: Defined when the farm is set up.
      cardinalityMeaning: Any number; each field belongs to one farm.
      context: Listed under the farm.
  - name: crops
    target: Crop
    cardinality: 0..*
    ownership: reference
    help:
      summary: Crops grown on the farm.
      usage: Listed from the farm.
      cardinalityMeaning: Many crops per farm; a crop is grown on many farms.
      context: A many-to-many relation.
  lifecycle:
    title: Farm Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: PLANNED, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A farm business with its land, buildings and operations.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Party, FarmField, Crop. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Farm managers register their farms with their fields and crops; planting, inputs, harvests and subsidies are recorded per farm and field; buyers and certifiers trace produce back to the farm.
    lifecycle: Planned before operations start, active while farmed, inactive when operations pause, and retired when sold or closed.
    example: Farm FRM-BEA-01 'Ferme des Saules', mixed crop and livestock, 186 ha in the Beauce, owned by the Martin family, organic certified since 2019.
    businessMeaning: Fields, crops, livestock, subsidies and compliance records are all held per farm.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM
