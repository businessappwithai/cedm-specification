entity:
  name: Farm
  namespace: cedm.domain
  kind: agriculture_entity
  description: A managed agricultural operation consisting of land, facilities, resources, and production activities.
  ui:
    icon: table
  identity:
    key: farmId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: farmId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the farm record.
        usage: Generated on registration.
    - name: farmCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code by which the farm is known in plans and reports.
        usage: Unique; assigned at registration.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the farm.
        usage: Shown in lists and on documents.
    - name: farmType
      type: enum
      required: true
      values:
        - CROP
        - LIVESTOCK
        - MIXED
        - AQUACULTURE
        - OTHER
      help:
        summary: The main kind of production the farm carries out.
        usage: Chosen at registration; groups farms in reports.
        valueSemantics:
          CROP: Grows crops.
          LIVESTOCK: Raises animals.
          MIXED: Both crops and livestock.
          AQUACULTURE: Farms fish or other aquatic species.
          OTHER: Any other kind.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the farm is producing.
        usage: Set by the operator.
        valueSemantics:
          PLANNED: Established on paper but not producing.
          ACTIVE: In production.
          INACTIVE: Temporarily not producing.
          RETIRED: Operation ended. A final state.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The land and site of the farm.
        usage: Set at registration.
        cardinalityMeaning: 'Exactly one location: a farm is a place.'
        workflowRole: Supplies address and boundaries.
    - name: owner
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The parties that own the farm.
        usage: Recorded at registration.
        cardinalityMeaning: Any number of owners, including joint owners.
        workflowRole: Identifies who is entitled to the farm's output.
    - name: fields
      target: FarmField
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The fields that make up the farm.
        usage: Added as land is surveyed.
        cardinalityMeaning: Any number of fields.
        workflowRole: Fields are managed as part of the farm.
    - name: crops
      target: Crop
      cardinality: 0..*
      ownership: reference
      help:
        summary: The crops grown on the farm.
        usage: Linked from planting plans.
        cardinalityMeaning: Any number of crops.
        workflowRole: Shows the farm's production mix.
  lifecycle:
    title: Farm Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A managed agricultural operation consisting of land, buildings, resources and production activities.
    businessMeaning: A farm is the unit that plans what to grow or raise and answers for what it produces. Fields, crops and equipment are organised under it.
    usage: Registered when an operation is established; read by agronomy, operations and sales.
    relationshipContext: A farm stands at a Location, is owned by Parties, is divided into FarmFields and grows Crops.
    lifecycle: A farm is planned, goes active when production starts, may be inactive in a fallow period, and is retired when the operation ends.
    example: Greenfield Farm, a mixed crop and livestock operation of 340 hectares.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM
