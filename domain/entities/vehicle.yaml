entity:
  name: Vehicle
  namespace: cedm.domain
  kind: logistics_asset
  description: A vehicle or transport equipment used to execute logistics movements.
  ui:
    icon: car
  identity:
    key: vehicleId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: vehicleId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the vehicle, constant for its life.
        usage: Generated on creation; movements and fuel refer to it.
        relationshipContext: Referenced by movements and trip legs.
    - name: registrationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The registration or licence plate number that identifies the vehicle on public roads and in documents.
        usage: Unique; entered when the vehicle joins the fleet and used on delivery documents, inspections, fines and fuel records.
        relationshipContext: Read with the type.
    - name: vehicleType
      type: enum
      required: true
      values:
        - TRUCK
        - TRACTOR
        - TRAILER
        - FORKLIFT
        - CRANE
        - OTHER
      help:
        summary: The class of vehicle or equipment, such as truck, trailer or forklift.
        usage: Chosen on creation; dispatch uses it to match loads and tasks to suitable vehicles.
        valueSemantics:
          TRUCK: A rigid powered road vehicle that carries goods in its own body.
          TRACTOR: A powered unit that pulls a trailer, carrying no load of its own.
          TRAILER: An unpowered load carrier towed by a tractor unit.
          FORKLIFT: A powered lifting vehicle used in yards and warehouses to move pallets.
          CRANE: Lifting equipment used to raise and move heavy loads such as containers.
          OTHER: Transport equipment that fits none of the listed classes.
        relationshipContext: Read with capacity.
    - name: capacity
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The load the vehicle can carry.
        usage: Must not be negative; dispatch checks loads against it.
        relationshipContext: Compared with the weight of the shipment.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - MAINTENANCE
        - OUT_OF_SERVICE
        - RETIRED
      help:
        summary: Whether the vehicle is available for work, being serviced, out of action or permanently withdrawn.
        usage: Starts as ACTIVE; moved by fleet managers, and dispatch only assigns work to vehicles that are active.
        valueSemantics:
          ACTIVE: In service and available to be assigned to movements.
          MAINTENANCE: Temporarily withdrawn for servicing or repair and expected back.
          OUT_OF_SERVICE: Unavailable for work because of a fault, inspection failure or similar, with no firm return date.
          RETIRED: Permanently removed from the fleet. A final state.
  relationships:
    - name: operator
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The party that operates the vehicle.
        usage: Chosen when operated by a contractor.
        cardinalityMeaning: At most one operator.
        context: Decides who is responsible for it.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place the vehicle is based or currently at.
        usage: Updated as it moves.
        cardinalityMeaning: At most one location.
        context: Used to plan pickups.
    - name: movements
      target: ContainerMovement
      cardinality: 0..*
      ownership: reference
      help:
        summary: The container movements the vehicle carried out.
        usage: Read to see its work.
        cardinalityMeaning: Any number of movements.
        context: Show its usage.
    - {name: drivers, target: Driver, cardinality: "0..*", ownership: reference, help: {summary: Drivers currently or historically assigned to this Vehicle., businessMeaning: Supports operating responsibility without embedding Person identity in Vehicle., usage: "Dispatch, compliance and reporting.", cardinalityMeaning: Zero or many Drivers over vehicle lifecycle., workflowRole: Assignment must validate both Driver and Vehicle eligibility.}}
    - {name: fuelTransactions, target: FuelTransaction, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of fuel purchases are recorded against a vehicle over its life., summary: Fuel or energy transactions recorded for this Vehicle., businessMeaning: Preserves consumption and operating-cost history., usage: "Fleet efficiency, cost, fraud control and audit.", workflowRole: Verified fuel evidence remains historical after Vehicle status changes.}}

  invariants:
    - {id: VEHICLE-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Vehicle Lifecycle
    attribute: status
    states: [ACTIVE, MAINTENANCE, OUT_OF_SERVICE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: OUT_OF_SERVICE, action: mark_out_of_service}
      - {from: OUT_OF_SERVICE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: MAINTENANCE, to: RETIRED, action: retire}
      - {from: OUT_OF_SERVICE, to: RETIRED, action: retire}
  help:
    summary: A vehicle or piece of transport equipment used to carry out logistics movements.
    businessMeaning: Vehicles are the assets that move goods and containers. Recording each with its type, capacity and state lets dispatch know what is available, and lets movements, drivers and fuel be tied to the vehicle.
    usage: Maintained by fleet managers; chosen on movements and trips; read by dispatch.
    relationshipContext: A vehicle may have an operator and a home location, makes movements, and has drivers and fuel purchases.
    lifecycle: A vehicle is active while in service, goes to maintenance and returns, may be out of service, and is retired when disposed of. Retired is final.
    example: Truck LK21 ABC, a 24-tonne curtainsider based at the Leeds depot.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-VEHICLE
