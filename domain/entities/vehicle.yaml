entity:
  name: Vehicle
  namespace: cedm.domain
  kind: logistics_asset
  description: A vehicle or transport equipment used to execute logistics movements.
  ui:
    icon: car
    recordLabel: [registrationNumber]
  identity:
    key: vehicleId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: vehicleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the vehicle record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a vehicle store this identifier. The number or code people quote is a separate field.
  - name: registrationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The licence plate or equipment number.
      usage: Used in dispatch, gate checks and maintenance.
      relationshipContext: Unique.
  - name: vehicleType
    type: enum
    required: true
    values:
    - TRUCK
    - TRACTOR
    - TRAILER
    - FORKLIFT
    - CRANE
    - OTHER
    help:
      summary: The kind of vehicle.
      usage: Decides which movements it can perform.
      relationshipContext: Chosen when registering.
      valueSemantics:
        TRUCK: A rigid lorry.
        TRACTOR: A tractor unit pulling trailers.
        TRAILER: A trailer.
        FORKLIFT: A forklift truck.
        CRANE: A crane.
        OTHER: Any other vehicle.
  - name: capacity
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The load the vehicle can carry or lift.
      usage: Checked when assigning loads.
      relationshipContext: Not negative.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - MAINTENANCE
    - OUT_OF_SERVICE
    - RETIRED
    help:
      summary: Whether the vehicle can be used.
      usage: Changed by fleet managers.
      relationshipContext: Only active vehicles are dispatched.
      valueSemantics:
        ACTIVE: Available.
        MAINTENANCE: Being serviced or repaired.
        OUT_OF_SERVICE: Not usable for another reason.
        RETIRED: Disposed of.
  relationships:
  - name: operator
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company or driver operating the vehicle.
      usage: Set when the vehicle is assigned.
      cardinalityMeaning: At most one operator.
      context: Answers for its use.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the vehicle is now.
      usage: Updated as it moves.
      cardinalityMeaning: At most one location.
      context: Used by dispatchers.
  - name: movements
    target: ContainerMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: Container movements the vehicle performed.
      usage: Listed for utilisation reports.
      cardinalityMeaning: Any number of movements.
      context: Each movement uses at most one vehicle.
    inverseCardinality: '1'
  invariants:
  - {id: VEHICLE-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Vehicle Lifecycle
    attribute: status
    states: [ACTIVE, MAINTENANCE, OUT_OF_SERVICE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
    - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
    - {from: ACTIVE, to: OUT_OF_SERVICE, action: mark_out_of_service}
    - {from: OUT_OF_SERVICE, to: ACTIVE, action: return_to_service}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: MAINTENANCE, to: RETIRED, action: retire}
    - {from: OUT_OF_SERVICE, to: RETIRED, action: retire}
  help:
    summary: Represents a logistics asset called Vehicle within the CEDM business model.
    businessMeaning: Vehicle is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Location, ContainerMovement. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Fleet and yard managers register vehicles with their type and capacity, assign operators, track where they are, take them into maintenance and retire them; dispatchers assign them to movements.
    lifecycle: A vehicle is active while available, goes into maintenance and back, may be taken out of service and returned, and is retired at the end of its life.
    example: Vehicle AB 123 CD, tractor unit, capacity 40 t, operated by Trasporti Rossi, at Genoa port, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-VEHICLE
