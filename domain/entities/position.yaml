  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Position to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Position.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: parentPosition
    target: Position
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Position to Position so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Position records associated with a Position.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: employees
    target: Employee
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Position to Employee so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Employee records associated with a Position.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: '1'
  - {name: job, target: Job, cardinality: 0..1, ownership: reference, help: {summary: Reusable work definition underlying Position., businessMeaning: Separates job classification from organizational seat., usage: Workforce planning and HCM., cardinalityMeaning: Optional for positions not classified through Job., workflowRole: Job retirement prevents incompatible new assignment while preserving history.}}
  invariants:
  - id: POSITION-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: POSITION-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Position Lifecycle
    attribute: status
    states: [OPEN, FILLED, FROZEN, CLOSED, RETIRED]
    initial: OPEN
    terminal: [FILLED, RETIRED]
    transitions:
    - {from: OPEN, to: CLOSED, action: close}
    - {from: CLOSED, to: FILLED, action: mark_filled}
    - {from: OPEN, to: FROZEN, action: mark_frozen}
    - {from: FROZEN, to: OPEN, action: unfreeze}
    - {from: OPEN, to: RETIRED, action: retire}
    - {from: FROZEN, to: RETIRED, action: retire}
    - {from: CLOSED, to: RETIRED, action: retire}
  help:
    summary: Represents a workforce master entity called Position within the CEDM business model.
    businessMeaning: Position is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Position records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Position, Employee. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Position record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
