entity:
  name: Position
  namespace: cedm.domain
  kind: workforce_master_entity
  description: A defined organizational role with responsibilities, reporting structure, and staffing requirements.
  ui:
    icon: briefcase
    recordLabel: [code, title]
  identity:
    key: positionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: positionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the position record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a position store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the position.
      usage: Used in the organisation chart and headcount reports.
      relationshipContext: Unique.
  - name: title
    type: string
    required: true
    maxLength: 200
    help:
      summary: The title of the position.
      usage: Shown on the organisation chart and job adverts.
      relationshipContext: May differ from the job title.
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - OPEN
    - FILLED
    - FROZEN
    - CLOSED
    - RETIRED
    help:
      summary: Whether the position is vacant, held or no longer exists.
      usage: Changed by HR.
      relationshipContext: Only open positions can be recruited for.
      valueSemantics:
        OPEN: Vacant and may be filled.
        FILLED: Held by an employee.
        FROZEN: Vacant and not to be filled for now.
        CLOSED: No longer part of the organisation.
        RETIRED: Withdrawn without being used.
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: The day the position exists from.
      usage: Headcount counts it from this day.
      relationshipContext: Not after the end date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day the position exists.
      usage: Set when the position is closed.
      relationshipContext: Empty while it exists.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The organisation unit the position belongs to.
      usage: Set when the position is created.
      cardinalityMeaning: Each position belongs to one unit.
      context: Budgeted in that unit.
  - name: parentPosition
    target: Position
    cardinality: 0..1
    ownership: reference
    help:
      summary: The position this one reports to.
      usage: Builds the reporting line.
      cardinalityMeaning: At most one manager position.
      context: No cycles.
  - name: employees
    target: Employee
    cardinality: 0..*
    ownership: reference
    help:
      summary: The employees holding the position.
      usage: Linked when someone is appointed.
      cardinalityMeaning: Usually one; shared positions may have several.
      context: Each employee holds at most one position at a time.
    inverseCardinality: '1'
  - {name: job, target: Job, cardinality: 0..1, ownership: reference, help: {summary: Reusable work definition underlying Position., businessMeaning: Separates job classification from organizational seat., usage: Workforce planning and HCM., cardinalityMeaning: Optional for positions not classified through Job., workflowRole: Job retirement prevents incompatible new assignment while preserving history.}}
  invariants:
  - {id: POSITION-001, rule: A position ends on or after the day it starts., violatedWhen: effective_from != null and effective_to != null and effective_to < effective_from, message: The end date cannot be before the start date.}
  lifecycle:
    title: Position Lifecycle
    attribute: status
    states: [OPEN, FILLED, FROZEN, CLOSED, RETIRED]
    initial: OPEN
    terminal: [CLOSED, RETIRED]
    transitions:
    - {from: OPEN, to: FILLED, action: fill}
    - {from: FILLED, to: OPEN, action: vacate}
    - {from: OPEN, to: FROZEN, action: freeze}
    - {from: FROZEN, to: OPEN, action: unfreeze}
    - {from: OPEN, to: CLOSED, action: close}
    - {from: FROZEN, to: CLOSED, action: close}
    - {from: FILLED, to: CLOSED, action: close}
    - {from: OPEN, to: RETIRED, action: retire}
    - {from: FROZEN, to: RETIRED, action: retire}
  help:
    summary: A post in the organisation chart, such as 'Accounts payable specialist', that one or more people fill.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Position, Employee. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: HR and managers define the positions of the organisation chart, with their reporting line and job; recruiters open vacancies for them and fill them with employees; finance plans headcount by position.
    lifecycle: A position is open while vacant, filled when someone holds it and open again when they leave; a vacancy can be frozen and released; the position is closed when no longer needed.
    example: Position FIN-AP-02 'Accounts payable specialist', Finance Lyon, reports to FIN-AP-01, job 'Accountant II', filled by Claire Martin.
    businessMeaning: Positions define the organisation's structure, headcount budget and reporting lines, independent of who holds them.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-POSITION
