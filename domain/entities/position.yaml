  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Position records, where applicable.
      relationshipContext: Its meaning is specific to Position; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: title
    type: string
    required: true
    maxLength: 200
    help:
      summary: Captures the business meaning of title for the Position. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Position records, where applicable.
      relationshipContext: Its meaning is specific to Position; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: status
