entity:
  name: ConstructionProject
  namespace: cedm.domain
  kind: construction_entity
  extends: Project
  description: A project for planning and executing construction or civil engineering work.
  ui:
    icon: folder-kanban
  identity:
    key: constructionProjectId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: constructionProjectId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the construction project record.
        usage: Generated on creation; contracts, assets and progress reports refer to it.
    - name: projectId
      type: reference
      target: Project
      required: true
      unique: true
      immutable: true
      help:
        summary: The general project that this record specialises.
        usage: Set when the construction project is created, linking it to the project's planning, budget and tasks.
    - name: projectType
      type: enum
      required: true
      values:
        - BUILDING
        - INFRASTRUCTURE
        - CIVIL
        - INDUSTRIAL
        - RENOVATION
        - OTHER
      help:
        summary: The kind of construction work.
        usage: Chosen when the project is set up; drives templates, permits and risk checks.
        valueSemantics:
          BUILDING: Construction of buildings such as offices, homes or factories.
          INFRASTRUCTURE: Roads, bridges, utilities and similar public works.
          CIVIL: General civil engineering such as earthworks and drainage.
          INDUSTRIAL: Plant, process facilities and heavy industrial structures.
          RENOVATION: Refurbishment or extension of an existing structure.
          OTHER: Work that fits none of the categories above.
    - name: siteCondition
      type: string
      required: false
      maxLength: 2000
      help:
        summary: A description of the site's physical conditions that affect the work, such as soil, access or contamination.
        usage: Written after surveys; read by designers and contractors when planning and pricing.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - DESIGN
        - PROCUREMENT
        - CONSTRUCTION
        - COMMISSIONING
        - COMPLETED
        - CANCELLED
      help:
        summary: The construction stage the project has reached.
        usage: Advanced by the project manager as each stage completes.
        valueSemantics:
          PLANNED: Approved but design has not begun.
          DESIGN: Design and permitting are under way.
          PROCUREMENT: Contractors and materials are being sourced.
          CONSTRUCTION: Physical work is being carried out on site.
          COMMISSIONING: Building work is done and systems are being tested and handed over.
          COMPLETED: Handed over and closed.
          CANCELLED: Stopped before completion.
  relationships:
    - name: project
      target: Project
      cardinality: '1'
      ownership: reference
      help:
        summary: The general project this construction project belongs to.
        usage: Set at creation; gives access to the project's tasks, budget and team.
        cardinalityMeaning: Exactly one project; the two records describe the same undertaking.
        workflowRole: Keeps construction-specific and general project data consistent.
    - name: site
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The location where the construction takes place.
        usage: Chosen at planning; used for permits, logistics and safety planning.
        cardinalityMeaning: At most one site; a project spread across several sites would be split into several projects.
        workflowRole: Anchors the work to a place for permits and logistics.
    - name: contracts
      target: Contract
      cardinality: 0..*
      ownership: reference
      help:
        summary: The contracts under which the work is carried out.
        usage: Read to see who is responsible for what, and on what terms.
        cardinalityMeaning: Any number, typically one per contractor or supplier.
        workflowRole: Contracts commit contractors and suppliers to the project.
    - name: assets
      target: Asset
      cardinality: 0..*
      ownership: reference
      help:
        summary: The assets the project creates or modifies.
        usage: Linked as the work produces them; read at handover.
        cardinalityMeaning: Any number of assets.
        workflowRole: At completion, the built items become managed assets.
  lifecycle:
    title: Construction Project Lifecycle
    attribute: status
    states: [PLANNED, DESIGN, PROCUREMENT, CONSTRUCTION, COMMISSIONING, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: DESIGN, action: mark_design}
      - {from: DESIGN, to: PROCUREMENT, action: mark_procurement}
      - {from: PROCUREMENT, to: CONSTRUCTION, action: mark_construction}
      - {from: CONSTRUCTION, to: COMMISSIONING, action: mark_commissioning}
      - {from: COMMISSIONING, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: DESIGN, to: CANCELLED, action: cancel}
      - {from: PROCUREMENT, to: CANCELLED, action: cancel}
      - {from: CONSTRUCTION, to: CANCELLED, action: cancel}
      - {from: COMMISSIONING, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a construction project is ended"
      description: "When a construction project is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CONSTRUCTION-PROJECT-FOLLOW-UP-{{id}}"
              name: "Follow up on construction project {{id}}"
              description: "Construction project {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A project to plan and carry out construction or civil engineering work, from design through commissioning.
    businessMeaning: Construction work has distinct stages with different people and contracts. This record adds the construction-specific view, such as project type and site condition, to the general project, so progress and responsibility can be followed stage by stage.
    usage: Created when a construction project is approved; advanced through its stages; read by project managers, contractors and owners.
    relationshipContext: A construction project extends a general Project, takes place at a site Location, is delivered under Contracts and produces Assets.
    lifecycle: A project is planned, designed, procured, built and commissioned, and then completed. It can be cancelled at any stage before completion.
    example: Construction of a distribution warehouse, designed in the first quarter, procured over the summer and handed over after commissioning in the following spring.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONSTRUCTION-PROJECT
