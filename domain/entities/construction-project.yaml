entity:
  name: ConstructionProject
  namespace: cedm.domain
  kind: construction_entity
  extends: Project
  description: A project for planning and executing construction or civil engineering work.
  ui:
    icon: folder-kanban
  identity:
    key: constructionProjectId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: constructionProjectId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the construction project record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a construction project store this identifier. The number or code people quote is a separate field.
  - name: projectId
    type: reference
    target: Project
    required: true
    unique: true
    immutable: true
    help:
      summary: The general project record that holds the schedule, budget and team.
      usage: Linked when the construction project is created.
      relationshipContext: Each construction project extends exactly one project.
  - name: projectType
    type: enum
    required: true
    values:
    - BUILDING
    - INFRASTRUCTURE
    - CIVIL
    - INDUSTRIAL
    - RENOVATION
    - OTHER
    help:
      summary: What kind of construction it is.
      usage: Decides permits, standards and the contract forms used.
      relationshipContext: Read with the site.
      valueSemantics:
        BUILDING: A new building.
        INFRASTRUCTURE: Roads, bridges, utilities and other networks.
        CIVIL: Earthworks and other civil engineering.
        INDUSTRIAL: A plant or industrial installation.
        RENOVATION: Work on an existing structure.
        OTHER: Any other construction.
  - name: siteCondition
    type: string
    required: false
    maxLength: 2000
    help:
      summary: What is known about the site, such as ground conditions or access constraints.
      usage: Read by designers and contractors.
      relationshipContext: Detailed surveys are attached.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - DESIGN
    - PROCUREMENT
    - CONSTRUCTION
    - COMMISSIONING
    - COMPLETED
    - CANCELLED
    help:
      summary: The phase the project is in.
      usage: Moved on at each phase gate.
      relationshipContext: Each phase starts only when the previous one's gate is passed.
      valueSemantics:
        PLANNED: Approved, not yet started.
        DESIGN: Being designed.
        PROCUREMENT: Contracts being tendered and awarded.
        CONSTRUCTION: Being built.
        COMMISSIONING: Being tested and handed over.
        COMPLETED: Handed over.
        CANCELLED: Stopped before completion.
  - name: permitNumber
    type: string
    required: false
    maxLength: 100
    help:
      summary: The number of the building permit.
      usage: Shown on the site board and in inspections.
      relationshipContext: Required before construction starts.
  - name: contractValue
    type: Money
    required: false
    help:
      summary: The total value of the construction contracts.
      usage: Compared with the project budget.
      relationshipContext: Summed from the contracts.
  - name: plannedCompletionDate
    type: date
    required: false
    help:
      summary: When handover is planned.
      usage: Delays are measured against it.
      relationshipContext: Agreed in the main contract.
  relationships:
  - name: project
    target: Project
    cardinality: '1'
    ownership: reference
    help:
      summary: The general project record.
      usage: Linked when the construction project is created.
      cardinalityMeaning: Every construction project extends exactly one project.
      context: Holds the schedule, budget and team.
  - name: site
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the construction takes place.
      usage: Set when the project is created.
      cardinalityMeaning: At most one.
      context: Site safety and inspections refer to it.
  - name: contracts
    target: Contract
    cardinality: 0..*
    ownership: reference
    help:
      summary: The construction contracts let for the project.
      usage: Linked as contracts are awarded.
      cardinalityMeaning: Any number; each contract is for one project.
      context: The contract records its project.
    inverseCardinality: '1'
  - name: assets
    target: Asset
    cardinality: 0..*
    ownership: reference
    help:
      summary: The assets the project creates.
      usage: Linked at handover.
      cardinalityMeaning: Any number; each asset is created by one project.
      context: The asset records the project that built it.
    inverseCardinality: '1'
  lifecycle:
    title: Construction Project Lifecycle
    attribute: status
    states: [PLANNED, DESIGN, PROCUREMENT, CONSTRUCTION, COMMISSIONING, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: DESIGN, action: mark_design}
    - {from: DESIGN, to: PROCUREMENT, action: mark_procurement}
    - {from: PROCUREMENT, to: CONSTRUCTION, action: mark_construction}
    - {from: CONSTRUCTION, to: COMMISSIONING, action: mark_commissioning}
    - {from: COMMISSIONING, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: DESIGN, to: CANCELLED, action: cancel}
    - {from: PROCUREMENT, to: CANCELLED, action: cancel}
    - {from: CONSTRUCTION, to: CANCELLED, action: cancel}
    - {from: COMMISSIONING, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a construction project is ended"
    description: "When a construction project is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CONSTRUCTION-PROJECT-FOLLOW-UP-{{id}}"
          name: "Follow up on construction project {{id}}"
          description: "Construction project {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a construction entity called ConstructionProject within the CEDM business model.
    businessMeaning: ConstructionProject is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Project, Location, Contract, Asset. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Project managers run each construction project through design, procurement, construction and commissioning; contracts, assets and site records hang off it; owners and lenders follow progress by phase.
    lifecycle: Planned, then design, procurement, construction and commissioning in turn, and completed at handover. A project may be cancelled at any stage before completion.
    example: Construction project CP-2024-03, new distribution centre Lyon-Est, building, site at Saint-Priest; construction since 2 May 2024; main contract with BTP Rhône; handover planned March 2025.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONSTRUCTION-PROJECT
