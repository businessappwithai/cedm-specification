entity:
  name: Budget
  namespace: cedm.domain
  kind: financial_plan
  description: A governed financial plan defining approved or proposed monetary limits and targets for an organization, period, scenario, and accounting dimensions.
  ui:
    icon: piggy-bank
  identity: {key: budgetId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: budgetId, type: uuid, required: true, immutable: true, help: {summary: Stable budget identity., businessMeaning: Identifies one financial plan version., usage: "Planning, approval, control and reporting.", relationshipContext: Owns BudgetLines and references planning context.}}
    - {name: code, type: string, required: true, maxLength: 100, help: {summary: Business budget code., businessMeaning: Human/integration reference for plan., usage: Planning and reporting., relationshipContext: Unique within organization/version policy.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, SUBMITTED, APPROVED, ACTIVE, SUPERSEDED, CLOSED]
      help: {summary: Budget governance state., businessMeaning: Controls editability and authoritative planning use., usage: Approval and control., relationshipContext: Actual accounting remains in JournalEntry., valueSemantics: {DRAFT: Editable proposal., SUBMITTED: Awaiting approval., APPROVED: Authorized plan., ACTIVE: Current control baseline., SUPERSEDED: Replaced by later plan., CLOSED: Planning cycle ended.}}
  relationships:
    - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: Organization owning budget., businessMeaning: Defines planning boundary., usage: Planning and reporting., cardinalityMeaning: Exactly one Organization., workflowRole: Accounting dimensions must belong to compatible context.}}
    - {name: fiscalPeriod, target: FiscalPeriod, cardinality: 0..1, ownership: reference, help: {summary: Fiscal period governed by budget., businessMeaning: Aligns plan with accounting time., usage: Budget control and variance., cardinalityMeaning: Optional when budget spans multiple periods represented by lines., workflowRole: Does not open/close accounting period.}}
    - {name: lines, target: BudgetLine, cardinality: 1..*, ownership: aggregate, help: {summary: Detailed planned amounts., businessMeaning: Allocates budget to accounts/dimensions., usage: Control and variance analysis., cardinalityMeaning: One or more lines., workflowRole: Line totals form governed plan.}}
    - {name: scenario, target: Scenario, cardinality: 0..1, ownership: reference, help: {summary: Planning scenario represented., businessMeaning: Distinguishes baseline/upside/downside etc., usage: Comparative planning., cardinalityMeaning: Optional for single-scenario plans., workflowRole: Scenario never changes actual ledger.}}
  invariants:
    - {id: BUDGET-001, rule: APPROVED or ACTIVE Budget requires at least one valid BudgetLine and authorized approval.}
    - {id: BUDGET-002, rule: Budget never creates or rewrites actual JournalEntry amounts.}
    - {id: BUDGET-003, rule: Changes after approval require controlled revision/versioning and preserve prior approved evidence.}
  lifecycle:
    title: Budget Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, APPROVED, ACTIVE, SUPERSEDED, CLOSED]
    initial: DRAFT
    terminal: [CLOSED, SUPERSEDED]
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: APPROVED, action: approve}
      - {from: APPROVED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: DRAFT, to: SUPERSEDED, action: mark_superseded}
      - {from: SUBMITTED, to: SUPERSEDED, action: mark_superseded}
      - {from: APPROVED, to: SUPERSEDED, action: mark_superseded}
      - {from: ACTIVE, to: SUPERSEDED, action: mark_superseded}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a budget is put forward"
      description: "When a budget is submitted, a task asks someone to decide on it."
      when: "status == \"SUBMITTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "BUDGET-APPROVAL-{{id}}"
              name: "Decide on budget {{code}}"
              description: "Budget {{code}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
  help: {summary: Governed financial planning baseline., businessMeaning: Budget records intended/authorized financial amounts while JournalEntry records actual accounting., usage: "Planning, spending control and variance reporting.", relationshipContext: "BudgetLine supplies dimensional detail; FiscalPeriod supplies accounting time; Scenario supplies planning assumptions.", lifecycle: Draft to submitted to approved/active to superseded/closed.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BUDGET}
