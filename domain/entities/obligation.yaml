entity:
  name: Obligation
  namespace: cedm.domain
  kind: legal_obligation
  description: A governed duty owed by a party under law, agreement, policy, order, or other authoritative source.
  ui:
    icon: table
  identity: {key: obligationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: obligationId, type: uuid, required: true, immutable: true, help: {summary: The identity of the obligation., usage: Generated on recording; evidence and tasks refer to it.}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the obligation arose., usage: Set from the source; deadlines and limitation periods run from it.}}
  relationships: []
  invariants:
    - {id: OBLIGATION-001, rule: "Finalized evidence and effective history must be preserved; correction, reassessment, settlement or supersession must be explicit."}
  help:
    summary: A duty owed by a party under law, an agreement, a policy, an order or another authoritative source.
    businessMeaning: Organisations owe things to regulators, customers, partners and each other. Recording each duty, with its source and who owes it, lets the organisation know what it must do and prove that it did.
    usage: Recorded when a duty arises from a law, contract or decision; tracked until it is met; read by compliance, legal and operations.
    relationshipContext: An obligation relates to the party who owes it, the source that imposes it, and the evidence that it was met.
    lifecycle: Finalised evidence and history are preserved; if the obligation is met, waived or replaced, that is recorded explicitly.
    example: The duty to file the annual tax return by 31 July, arising from tax law.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-OBLIGATION}
