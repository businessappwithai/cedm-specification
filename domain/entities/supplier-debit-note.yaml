entity:
  name: SupplierDebitNote
  namespace: cedm.domain
  kind: supplier_financial_adjustment_transaction
  description: A formal buyer-issued financial debit raised against a supplier to increase recoverable supplier exposure for shortages, overcharges, penalties, service failures, damages, tax corrections, or other authorized commercial adjustments. It is separate from the supplier claim, claim resolution, original invoice, physical return, and cash settlement.
  ui:
    icon: factory
  identity: {key: supplierDebitNoteId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: supplierDebitNoteId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supplier debit note record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supplier debit note store this identifier. The number or code people quote is a separate field.
  - name: debitNoteNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: Human-facing supplier debit reference., businessMeaning: Identifies the debit adjustment in supplier correspondence and financial operations., usage: Used for reconciliation supplier statements audit and integrations., relationshipContext: Distinct from supplier claim purchase order invoice and return numbers., workflowRole: Provides operational reference throughout the debit lifecycle., requiredMeaning: Required.}
  - name: debitNoteDate
    type: date
    required: true
    help: {summary: Effective date of the supplier debit adjustment., businessMeaning: Establishes financial chronology and accounting or tax period., usage: Period control reconciliation reporting and supplier communication., relationshipContext: Distinct from claim resolution invoice return and payment dates., workflowRole: Anchors recognition of the adjustment., requiredMeaning: Required.}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - POSTED
    - PARTIALLY_APPLIED
    - FULLY_APPLIED
    - DISPUTED
    - CANCELLED
    - REVERSED
    help:
      summary: Lifecycle state of the supplier debit adjustment.
      businessMeaning: Separates preparation authorization accounting recognition application dispute and reversal.
      usage: Controls posting payable reconciliation and supplier dispute workflows.
      relationshipContext: Status does not alter original Invoice GoodsReceipt SupplierClaim or SupplierClaimResolution evidence.
      workflowRole: POSTED creates financial evidence; application and dispute states track subsequent handling.
      requiredMeaning: Required.
      valueSemantics:
        DRAFT: The status of the supplier debit note is draft; set it when that is what the business means for this record.
        APPROVED: The status of the supplier debit note is approved; set it when that is what the business means for this record.
        POSTED: The status of the supplier debit note is posted; set it when that is what the business means for this record.
        PARTIALLY_APPLIED: The status of the supplier debit note is partially applied; set it when that is what the business means for this record.
        FULLY_APPLIED: The status of the supplier debit note is fully applied; set it when that is what the business means for this record.
        DISPUTED: The status of the supplier debit note is disputed; set it when that is what the business means for this record.
        CANCELLED: The status of the supplier debit note is cancelled; set it when that is what the business means for this record.
        REVERSED: The status of the supplier debit note is reversed; set it when that is what the business means for this record.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    immutableAfterPosting: true
    help: {summary: Currency in which debit amounts are denominated., businessMeaning: Defines the monetary denomination of the adjustment., usage: Accounting reconciliation supplier settlement and reporting., relationshipContext: Cross-currency application requires explicit ExchangeRate evidence., workflowRole: Qualifies all monetary values., requiredMeaning: Required.}
  - name: subtotal
    type: Money
    required: true
    help: {summary: Pre-tax value of the supplier debit adjustment., businessMeaning: Aggregate financial increase before applicable tax., usage: Calculation tax and reconciliation., workflowRole: Feeds totalAmount., requiredMeaning: Required.}
  - name: taxAmount
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Tax component associated with the debit adjustment., businessMeaning: Represents applicable tax added to the adjustment., usage: Tax reporting accounting and reconciliation., workflowRole: Contributes to totalAmount., requiredMeaning: Required including zero.}
  - name: totalAmount
    type: Money
    required: true
    help: {summary: Total supplier debit adjustment., businessMeaning: Financial amount by which supplier-related recoverable exposure is increased., usage: Accounts payable supplier settlement accounting and reconciliation., relationshipContext: "It is an adjustment, not a replacement for the original supplier Invoice.", workflowRole: Determines the maximum amount available for controlled application., requiredMeaning: Required.}
  - name: amountApplied
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Portion of the supplier debit recognized against eligible supplier payable claims., businessMeaning: Tracks how much posted debit has been consumed by active SupplierDebitNoteApplication records., usage: Reconciliation supplier statements and reporting., relationshipContext: SupplierDebitNoteApplication is the explicit settlement evidence; Payment remains separate cash movement., workflowRole: Changes through controlled application or reversal events., requiredMeaning: Required.}
  - name: amountRemaining
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Unapplied portion of the posted supplier debit., businessMeaning: Represents debit value still available for payable application or governed settlement handling., usage: Reconciliation supplier statements and resolution tracking., workflowRole: Determines whether the debit is fully applied., requiredMeaning: Required.}
  relationships:
  - {name: supplier, target: Supplier, cardinality: '1', ownership: reference, help: {summary: Supplier responsible for the financial adjustment., businessMeaning: Identifies the external party whose payable exposure is adjusted., usage: Payables supplier communication and reconciliation., workflowRole: Establishes party context.}}
  - {name: supplierClaim, target: SupplierClaim, cardinality: 0..1, ownership: reference, help: {summary: Supplier claim that provides the commercial or quality case for the debit., businessMeaning: Connects financial adjustment to the case that established the recovery entitlement., usage: Traceability approval and dispute management., workflowRole: Provides supporting evidence without replacing the debit document.}}
  - {name: supplierClaimResolution, target: SupplierClaimResolution, cardinality: 0..1, ownership: reference, help: {summary: Authorized claim resolution that approved this debit remedy., businessMeaning: Connects the posted financial adjustment to the controlled decision that authorized the recovery., usage: Governance approval audit and claim closure., workflowRole: Supplies the execution mandate for DEBIT_ADJUSTMENT or another authorized financial remedy.}}
  - {name: invoices, target: Invoice, cardinality: 0..*, ownership: reference, help: {summary: Supplier invoices whose payable exposure is affected by the debit., businessMeaning: Identifies original financial claims without mutating their historical values., usage: Accounts payable reconciliation and audit., workflowRole: Supplies eligible source claims.}}
  - {name: lines, target: SupplierDebitNoteLine, cardinality: 1..*, ownership: aggregate, help: {summary: Detailed components of the supplier debit., businessMeaning: Explains quantities prices tax and reasons contributing to the adjustment., usage: Calculation supplier dispute audit and reconciliation., workflowRole: Supplies authoritative detail for header totals.}}
  - {name: applications, target: SupplierDebitNoteApplication, cardinality: 0..*, ownership: reference, help: {summary: Explicit applications of this posted supplier debit against eligible supplier invoices., businessMeaning: Records how the debit is consumed against payable claims without changing original invoice history., usage: Accounts payable reconciliation supplier statements and audit., workflowRole: Active applications determine amountApplied and amountRemaining.}}
  - {name: journalEntries, target: JournalEntry, cardinality: 0..*, ownership: reference, help: {summary: Accounting entries recognizing the supplier debit., businessMeaning: Separates accounting recognition from the adjustment document., usage: General ledger AP tax and audit., workflowRole: Posted debit requires balanced accounting treatment.}}
  invariants:
  - {id: SUPPLIER-DEBIT-001, rule: POSTED supplier debit must contain at least one line.}
  - {id: SUPPLIER-DEBIT-002, rule: totalAmount must reconcile with line values tax and rounding evidence.}
  - {id: SUPPLIER-DEBIT-003, rule: amountApplied must not exceed totalAmount under normal application policy.}
  - {id: SUPPLIER-DEBIT-004, rule: amountRemaining must equal totalAmount less active SupplierDebitNoteApplication amounts under configured rounding policy.}
  - {id: SUPPLIER-DEBIT-005, rule: A claim-originated debit must reference sufficient SupplierClaim evidence and the approved recovery entitlement represented by SupplierClaimResolution.}
  - {id: SUPPLIER-DEBIT-006, rule: Original Invoice and InvoiceLine values remain immutable; debit adjustments must be represented by explicit financial evidence.}
  - {id: SUPPLIER-DEBIT-007, rule: POSTED supplier debits are immutable except through explicit reversal or compensating adjustment workflows.}
  - {id: SUPPLIER-DEBIT-008, rule: Posting must be idempotent and must not duplicate accounting recognition on retry.}
  - {id: SUPPLIER-DEBIT-009, rule: "When SupplierClaimResolution is linked, its resolutionType must authorize a debit adjustment and the debit amount must not exceed the approved recovery amount."}
  - {id: SUPPLIER-DEBIT-010, rule: Active SupplierDebitNoteApplication records must reconcile to amountApplied and must not collectively exceed totalAmount.}
  - {id: SUPPLIER-DEBIT-NOTE-EXE-001, rule: "Subtotal cannot be negative.", violatedWhen: "subtotal != null and subtotal < 0", message: "Subtotal cannot be negative."}
  - {id: SUPPLIER-DEBIT-NOTE-EXE-002, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
  - {id: SUPPLIER-DEBIT-NOTE-EXE-003, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Supplier Debit Note Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, POSTED, PARTIALLY_APPLIED, FULLY_APPLIED, DISPUTED, CANCELLED, REVERSED]
    initial: DRAFT
    terminal: [FULLY_APPLIED, CANCELLED, REVERSED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: POSTED, action: post}
    - {from: POSTED, to: PARTIALLY_APPLIED, action: mark_partially_applied}
    - {from: PARTIALLY_APPLIED, to: DISPUTED, action: mark_disputed}
    - {from: DISPUTED, to: FULLY_APPLIED, action: mark_fully_applied}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: POSTED, to: CANCELLED, action: cancel}
    - {from: PARTIALLY_APPLIED, to: CANCELLED, action: cancel}
    - {from: DISPUTED, to: CANCELLED, action: cancel}
    - {from: DISPUTED, to: REVERSED, action: reverse}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a supplier debit note is ended"
    description: "When a supplier debit note is cancelled or reversed, a task asks someone to settle what depended on it."
    when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-DEBIT-NOTE-FOLLOW-UP-{{id}}"
          name: "Follow up on supplier debit note {{debit_note_number}}"
          description: "Supplier debit note {{debit_note_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a supplier debit note is done"
    description: "When a supplier debit note is posted, a task asks someone to confirm the outcome."
    when: "status == \"POSTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLIER-DEBIT-NOTE-COMPLETED-{{id}}"
          name: "Confirm supplier debit note {{debit_note_number}}"
          description: "Supplier debit note {{debit_note_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents a buyer-issued financial debit against a supplier while preserving the original payable claim supplier-claim history resolution decision and application evidence.
    businessMeaning: SupplierClaim explains the issue, SupplierClaimResolution authorizes the remedy, SupplierDebitNote records the financial recovery, SupplierDebitNoteApplication allocates that recovery to payable claims, and JournalEntry provides accounting recognition. Payment remains the separate cash-movement concept.
    usage: Accounts payable procurement recovery supplier disputes tax accounting and audit.
    relationshipContext: SupplierClaim provides the case, SupplierClaimResolution provides authorization, Invoice provides the original payable claim, SupplierDebitNote provides the adjustment, SupplierDebitNoteApplication provides claim-level application, and JournalEntry provides accounting evidence.
    workflowContext: Claim/investigation → recovery approval → SupplierClaimResolution → debit calculation → approval → posting → accounting recognition → SupplierDebitNoteApplication → payable reconciliation or supplier dispute → claim closure/reversal.
    lifecycle: Draft → approved → posted → partially/fully applied, with dispute cancellation and reversal paths.
    changePropagation: Changes to claim resolution invoice or supporting evidence before posting trigger revalidation. Posted adjustments and active applications are corrected by reversal/replacement rather than mutation.
    example: A supplier overcharges by EUR 500. The SupplierClaim is accepted, SupplierClaimResolution authorizes DEBIT_ADJUSTMENT for EUR 500, SupplierDebitNote is posted for EUR 500, and a SupplierDebitNoteApplication applies the debit to the eligible supplier invoice without rewriting the original Invoice.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-DEBIT-NOTE}
