entity:
  name: SupplierDebitNote
  namespace: cedm.domain
  kind: supplier_financial_adjustment_transaction
  description: A formal buyer-issued financial debit raised against a supplier to increase recoverable supplier exposure for shortages, overcharges, penalties, service failures, damages, tax corrections, or other authorized commercial adjustments. It is separate from the supplier claim, original invoice, physical return, and cash settlement.
  identity: {key: supplierDebitNoteId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: supplierDebitNoteId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Immutable identity of the supplier debit note.
      businessMeaning: Identifies one financial debit adjustment independently of its supplier, claim, invoice, lines, application or accounting evidence.
      usage: Used for accounts payable recovery, supplier communication, reconciliation, audit and integration.
      relationshipContext: Distinct from SupplierClaim, Invoice and SupplierCreditNote identities.
      workflowRole: Stable identity across drafting, approval, posting, application and reversal.
      requiredMeaning: Required.
  - name: debitNoteNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Human-facing supplier debit reference.
      businessMeaning: Identifies the debit adjustment in supplier correspondence and financial operations.
      usage: Used for reconciliation, supplier statements, audit and integrations.
      relationshipContext: Distinct from supplier claim, purchase order, invoice and return numbers.
      workflowRole: Provides operational reference throughout the debit lifecycle.
      requiredMeaning: Required.
  - name: debitNoteDate
    type: date
    required: true
    help:
      summary: Effective date of the supplier debit adjustment.
      businessMeaning: Establishes financial chronology and accounting or tax period.
      usage: Period control, reconciliation, reporting and supplier communication.
      relationshipContext: Distinct from claim, invoice, return and payment dates.
      workflowRole: Anchors recognition of the adjustment.
      requiredMeaning: Required.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, APPROVED, POSTED, PARTIALLY_APPLIED, FULLY_APPLIED, DISPUTED, CANCELLED, REVERSED]
    help:
      summary: Lifecycle state of the supplier debit adjustment.
      businessMeaning: Separates preparation, authorization, accounting recognition, application, dispute and reversal.
      usage: Controls posting, payable reconciliation and supplier dispute workflows.
      relationshipContext: Status does not alter the original Invoice, GoodsReceipt, SupplierClaim or SupplierReturn.
      workflowRole: POSTED creates financial evidence; application and dispute states track subsequent handling.
      requiredMeaning: Required.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    immutableAfterPosting: true
    help:
      summary: Currency in which debit amounts are denominated.
      businessMeaning: Defines the monetary denomination of the adjustment.
      usage: Accounting, reconciliation, supplier settlement and reporting.
      relationshipContext: Cross-currency application requires explicit ExchangeRate evidence.
      workflowRole: Qualifies all monetary values.
      requiredMeaning: Required.
  - name: subtotal
    type: Money
    required: true
    help:
      summary: Pre-tax value of the supplier debit adjustment.
      businessMeaning: Aggregate financial increase before applicable tax.
      usage: Calculation, tax and reconciliation.
      workflowRole: Feeds totalAmount.
      requiredMeaning: Required.
  - name: taxAmount
    type: Money
    required: true
    default: {amount: 0}
    help:
      summary: Tax component associated with the debit adjustment.
      businessMeaning: Represents applicable tax added to the adjustment.
      usage: Tax reporting, accounting and reconciliation.
      workflowRole: Contributes to totalAmount.
      requiredMeaning: Required, including zero.
  - name: totalAmount
    type: Money
    required: true
    help:
      summary: Total supplier debit adjustment.
      businessMeaning: Financial amount by which supplier-related recoverable exposure is increased.
      usage: Accounts payable, supplier settlement, accounting and reconciliation.
      relationshipContext: It is an adjustment, not a replacement for the original supplier Invoice.
      workflowRole: Determines the maximum amount available for controlled application.
      requiredMeaning: Required.
  - name: amountApplied
    type: Money
    required: true
    default: {amount: 0}
    help:
      summary: Portion of the debit recognized against eligible supplier payable claims.
      businessMeaning: Tracks how much posted debit has been consumed in payable reconciliation.
      usage: Reconciliation, supplier statements and reporting.
      relationshipContext: Must reconcile with explicit debit application evidence where such an application entity is used.
      workflowRole: Changes through controlled application or reversal events.
      requiredMeaning: Required.
  - name: amountRemaining
    type: Money
    required: true
    default: {amount: 0}
    help:
      summary: Unapplied portion of the posted supplier debit.
      businessMeaning: Represents debit value still requiring payable recognition or settlement handling.
      usage: Reconciliation, supplier statements and resolution tracking.
      workflowRole: Determines whether the debit is fully applied.
      requiredMeaning: Required.
  relationships:
  - name: supplier
    target: Supplier
    cardinality: '1'
    ownership: reference
    help:
      summary: Supplier responsible for the financial adjustment.
      businessMeaning: Identifies the external party whose payable exposure is adjusted.
      usage: Payables, supplier communication and reconciliation.
      workflowRole: Establishes party context.
  - name: supplierClaim
    target: SupplierClaim
    cardinality: 0..1
    ownership: reference
    help:
      summary: Supplier claim that provides the commercial or quality case for the debit.
      businessMeaning: Connects financial adjustment to the case that established the recovery entitlement.
      usage: Traceability, approval and dispute management.
      workflowRole: Provides supporting evidence without replacing the debit document.
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
    help:
      summary: Supplier invoices whose payable exposure is affected by the debit.
      businessMeaning: Identifies original financial claims without mutating their historical values.
      usage: Accounts payable reconciliation and audit.
      workflowRole: Supplies eligible source claims.
  - name: lines
    target: SupplierDebitNoteLine
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: Detailed components of the supplier debit.
      businessMeaning: Explains quantities, prices, tax and reasons contributing to the adjustment.
      usage: Calculation, supplier dispute, audit and reconciliation.
      workflowRole: Supplies authoritative detail for header totals.
  - name: journalEntries
    target: JournalEntry
    cardinality: 0..*
    ownership: reference
    help:
      summary: Accounting entries recognizing the supplier debit.
      businessMeaning: Separates accounting recognition from the adjustment document.
      usage: General ledger, AP, tax and audit.
      workflowRole: Posted debit requires balanced accounting treatment.
  invariants:
  - {id: SUPPLIER-DEBIT-001, rule: POSTED supplier debit must contain at least one line.}
  - {id: SUPPLIER-DEBIT-002, rule: totalAmount must reconcile with line values, tax and rounding evidence.}
  - {id: SUPPLIER-DEBIT-003, rule: amountApplied must not exceed totalAmount under normal application policy.}
  - {id: SUPPLIER-DEBIT-004, rule: amountRemaining must equal totalAmount less active applied amount under configured rounding policy.}
  - {id: SUPPLIER-DEBIT-005, rule: A claim-originated debit must reference sufficient SupplierClaim evidence and the approved recovery entitlement.}
  - {id: SUPPLIER-DEBIT-006, rule: Original Invoice and InvoiceLine values remain immutable; debit adjustments must be represented by explicit financial evidence.}
  - {id: SUPPLIER-DEBIT-007, rule: POSTED supplier debits are immutable except through explicit reversal or compensating adjustment workflows.}
  - {id: SUPPLIER-DEBIT-008, rule: Posting must be idempotent and must not duplicate accounting recognition on retry.}
  help:
    summary: Represents a buyer-issued financial debit against a supplier while preserving the original payable claim and supplier-claim history.
    businessMeaning: SupplierDebitNote is a financial recovery document. SupplierClaim explains the issue, SupplierReturn handles physical reversal when applicable, SupplierCreditNote records supplier-issued credit, and Payment records cash movement.
    usage: Accounts payable, procurement recovery, supplier disputes, tax, accounting and audit.
    relationshipContext: SupplierClaim provides the case, Invoice provides the original payable claim, SupplierDebitNote provides an increase in recoverable adjustment, and JournalEntry provides accounting recognition.
    workflowContext: Claim/investigation → recovery approval → debit calculation → approval → posting → accounting recognition → payable reconciliation or supplier dispute → resolution/reversal. Physical returns and supplier credits remain separate workflows.
    lifecycle: Draft → approved → posted → partially/fully applied, with dispute, cancellation and reversal paths.
    changePropagation: Changes to claim, invoice or supporting evidence before posting trigger revalidation. Posted adjustments are corrected by reversal/replacement rather than mutation.
    example: A supplier overcharges by EUR 500. After investigation, a SupplierClaim is accepted and a SupplierDebitNote for EUR 500 is approved and posted. Accounting records the recovery and the supplier payable is reconciled without rewriting the original Invoice.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-DEBIT-NOTE}
