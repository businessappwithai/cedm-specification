entity:
  name: Yard
  namespace: cedm.domain
  kind: logistics_location
  description: A managed container-yard facility in which equipment is received, stored, positioned, inspected, repaired, dispatched, and transferred through a structured physical layout.
  identity:
    key: yardId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: yardId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable CEDM identity of the managed yard facility.
        businessMeaning: Identifies one operational yard regardless of the containers, blocks, equipment, operators, or activities currently associated with it.
        usage: Used by yard operations, location management, movements, inventory, reporting, access, and integrations to anchor all yard-specific records.
        relationshipContext: YardBlock, Location, and Container relationships use the yard as their operational context; the identity should remain stable across yard configuration changes.
        requiredMeaning: Required because all subordinate yard structures and operational records need an unambiguous facility context.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The operational code used to identify the yard in business processes and integrations.
        businessMeaning: Provides the concise facility identifier used by operators, transport partners, EDI messages, reports, and system searches.
        usage: Used in gate, movement, inventory, shipment, location, and reporting processes where a yard must be selected or communicated.
        relationshipContext: The code identifies the facility, while the hierarchical block/bay/tier/slot structure identifies the exact physical position within it.
        requiredMeaning: Required because operational systems need a stable human-facing yard identifier.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The human-readable name of the yard facility.
        businessMeaning: Identifies the facility in user interfaces, reports, documents, and business communications.
        usage: Used for operational search, dashboards, maps, reports, and documents where a descriptive facility name is preferable to a code.
        relationshipContext: Names the same facility identified by code and yardId; it should not be used as the unique technical identity.
        requiredMeaning: Required so users and business documents can clearly identify the facility.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [PLANNED, ACTIVE, SUSPENDED, CLOSED]
      help:
        summary: The operational lifecycle state of the yard facility.
        businessMeaning: Determines whether the yard is being prepared, accepting normal operations, temporarily restricted, or permanently closed.
        usage: Controls whether new movements, allocations, and operational transactions may be initiated against the yard.
        relationshipContext: Status affects subordinate structures and should be considered before allocating slots or planning container movements into the yard.
        valueSemantics:
          PLANNED: The yard is defined for future operation but is not yet available for normal operational transactions.
          ACTIVE: The yard is available for normal operations subject to capacity, slot, safety, and process constraints.
          SUSPENDED: Normal operations are temporarily restricted, for example because of an incident, maintenance, weather, or regulatory action.
          CLOSED: The facility is no longer available for normal operations and should not receive new operational assignments.
        requiredMeaning: Required because the facility's operational availability must be explicit.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: Associates the yard with its geographic or business location record.
        usage: Used for address, mapping, jurisdiction, routing, regional reporting, and external location integration.
        cardinalityMeaning: Each yard has exactly one primary Location in this model.
        context: Location provides geographic context; Yard provides operational storage and handling semantics.
    - name: blocks
      target: YardBlock
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: Defines the physical and logical subdivisions that organize the yard into manageable storage areas.
        usage: Used to navigate and allocate capacity from facility level down to individual storage positions.
        cardinalityMeaning: A modeled operational yard contains one or more blocks.
        context: Blocks are children of the yard hierarchy and should not be interpreted as independent yards.
    - name: containers
      target: Container
      cardinality: 0..*
      ownership: reference
      help:
        summary: Provides the set of containers currently associated with the yard as an operational facility.
        usage: Used for yard inventory, visibility, capacity, dwell, gate, and operational reporting.
        cardinalityMeaning: A yard may have zero or many containers at a point in time.
        context: The relationship is a facility-level view; precise physical placement is represented by Container.currentSlot and the YardSlot hierarchy.
  invariants:
    - id: YARD-001
      rule: code must be unique within the ERP context.
  help:
    summary: Represents a managed container-yard facility and the operational boundary within which container storage and handling occur.
    businessMeaning: Yard is the facility-level anchor for terminal or depot operations. It provides the context for structured storage capacity, container inventory, movements, gate operations, and yard planning.
    usage: Used to manage facility availability, capacity, physical hierarchy, container visibility, movement planning, operational reporting, and integrations with transport or terminal systems.
    relationshipContext: A Yard is located through Location and contains YardBlocks. The hierarchy Yard → YardBlock → YardBay → YardTier → YardSlot determines physical position, while Container and ContainerMovement represent equipment and movement activity.
    lifecycle: A yard can be planned, activated, temporarily suspended, or closed. Closing or suspending a yard should trigger operational controls preventing inappropriate new allocations or inbound movements.
    example: A depot operates Yard A with several blocks. A truck arrives with a container; the container is received into the yard, assigned to a compatible slot, and later moved to a repair or outbound area while all activity remains associated with Yard A.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-YARD
