  - id: RETAIL-SALE-LINE-001
    rule: quantity must be greater than zero.
  - {id: RETAIL-SALE-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-003, rule: "Discount Amount cannot be negative.", violatedWhen: "discount_amount != null and discount_amount < 0", message: "Discount Amount cannot be negative."}
