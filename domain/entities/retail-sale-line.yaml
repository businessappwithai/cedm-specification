  help:
    summary: "One product or service line on a retail sale or till receipt, with quantity, price, discount and tax, kept so takings, stock and margins can be reconciled item by item."
    businessMeaning: RetailSaleLine is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate RetailSaleLine records.
    relationshipContext: The entity participates in a wider business graph through relationships with RetailSale, Product,
      UnitOfMeasure. These relationships provide the context needed to interpret the record rather than treating its fields
      as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical RetailSaleLine record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "A line is added when an item is scanned or keyed at the till, priced and discounted under current promotions, taxed, and closed with the sale; it then updates stock, sales reporting and any later return of that item."
