entity:
  name: RetailSaleLine
  namespace: cedm.domain
  kind: retail_transaction_line
  description: A product or service line within a retail sale.
  ui:
    icon: list
    recordLabel: [quantity, lineAmount]
  identity:
    key: retailSaleLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: retailSaleLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the retail sale line record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a retail sale line store this identifier. The number or code people quote is a separate field.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How many units were sold.
      usage: Reduces stock at the store.
      relationshipContext: More than zero.
  - name: unitPrice
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: The shelf price per unit at the time of sale.
      usage: Multiplied by the quantity.
      relationshipContext: Not negative.
  - name: discountAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The discount given on the line.
      usage: Deducted from the line amount.
      relationshipContext: Not negative.
  - name: taxAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The tax included in the line.
      usage: Reported for tax returns.
      relationshipContext: Not negative.
  - name: lineAmount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: The amount charged for the line.
      usage: Summed into the sale total.
      relationshipContext: Quantity times unit price, less discount.
  relationships:
  - name: sale
    target: RetailSale
    cardinality: '1'
    ownership: reference
    help:
      summary: The sale the line belongs to.
      usage: Set by the till.
      cardinalityMeaning: Each line belongs to one sale.
      context: Its currency applies.
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product sold.
      usage: Found from the scanned barcode.
      cardinalityMeaning: Each line is for one product.
      context: Stock of the product is reduced.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: 0..1
    ownership: reference
    help:
      summary: The unit the quantity is in, such as piece or kg.
      usage: Defaults to the product's unit.
      cardinalityMeaning: At most one unit.
      context: Weighed goods use kg.
  invariants:
  - id: RETAIL-SALE-LINE-001
    rule: quantity must be greater than zero.
  - {id: RETAIL-SALE-LINE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-003, rule: "Discount Amount cannot be negative.", violatedWhen: "discount_amount != null and discount_amount < 0", message: "Discount Amount cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-004, rule: "Tax Amount cannot be negative.", violatedWhen: "tax_amount != null and tax_amount < 0", message: "Tax Amount cannot be negative."}
  - {id: RETAIL-SALE-LINE-EXE-005, rule: "Line Amount cannot be negative.", violatedWhen: "line_amount != null and line_amount < 0", message: "Line Amount cannot be negative."}
  help:
    summary: One item sold in a retail sale.
    relationshipContext: The entity participates in a wider business graph through relationships with RetailSale, Product, UnitOfMeasure. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: The till adds a line for each item scanned, applying the price, discounts and tax; lines drive stock reduction and sales reporting by product.
    lifecycle: A line has no states of its own; it is completed, voided or refunded with its sale.
    example: 2 × 'Organic milk 1 l' at 1.45 EUR, discount 0.30 EUR, tax 0.10 EUR, line 2.60 EUR.
    businessMeaning: Lines reduce store stock and are the basis of product sales reports.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RETAIL-SALE-LINE
