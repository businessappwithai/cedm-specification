entity:
  name: MeterReading
  namespace: cedm.domain
  kind: utility_transaction
  description: A measured reading recorded from a utility meter at a point in time.
  ui:
    icon: gauge
    recordLabel: [readingAt, readingValue]
  identity:
    key: meterReadingId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: meterReadingId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the meter reading record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a meter reading store this identifier. The number or code people quote is a separate field.
  - name: readingAt
    type: datetime
    required: true
    help:
      summary: When the meter was read.
      usage: Consumption is computed between successive readings.
      relationshipContext: Readings of one meter are ordered by it.
  - name: readingValue
    type: decimal
    required: true
    precision: 24
    scale: 8
    help:
      summary: The value shown by the meter.
      usage: Subtracted from the previous reading to get consumption.
      relationshipContext: Not negative unless the meter records signed values.
  - name: readingType
    type: enum
    required: true
    values:
    - ACTUAL
    - ESTIMATED
    - CORRECTED
    help:
      summary: How the value was obtained.
      usage: Estimated values are replaced when an actual reading arrives.
      relationshipContext: Corrections replace an earlier reading.
      valueSemantics:
        ACTUAL: Read from the meter.
        ESTIMATED: Calculated in the absence of a reading.
        CORRECTED: Replaces an earlier wrong reading.
  - name: quality
    type: enum
    required: false
    values:
    - GOOD
    - SUSPECT
    - INVALID
    help:
      summary: How reliable the reading is.
      usage: Suspect and invalid readings are checked before billing.
      relationshipContext: Set by validation.
      valueSemantics:
        GOOD: Passed validation.
        SUSPECT: Failed a plausibility check; to be reviewed.
        INVALID: Rejected; not used for billing.
  relationships:
  - name: meter
    target: EnergyMeter
    cardinality: '1'
    ownership: reference
    help:
      summary: The meter read.
      usage: Set when the reading is recorded.
      cardinalityMeaning: Each reading is of one meter; a meter has many readings.
      context: The meter's register and multiplier apply.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: '1'
    ownership: reference
    help:
      summary: The unit of the reading, such as kWh or m³.
      usage: Set when the reading is recorded.
      cardinalityMeaning: Each reading has one unit.
      context: Must match the meter's unit.
  invariants:
  - id: METER-READING-001
    rule: readingValue must not be negative unless the meter configuration permits signed values.
  help:
    summary: Represents a utility transaction called MeterReading within the CEDM business model.
    businessMeaning: MeterReading is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with EnergyMeter, UnitOfMeasure. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Meter readers, smart meters and customers submit readings; billing computes consumption from successive readings, and analysts check suspect values before they are billed.
    lifecycle: A reading has no states; a wrong reading is not edited but followed by a corrected one.
    example: Reading of meter EM-0048812 on 31 March 2024 00:00, 18,422.6 kWh, actual, quality good.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-METER-READING
