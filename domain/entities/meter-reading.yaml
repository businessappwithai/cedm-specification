entity:
  name: MeterReading
  namespace: cedm.domain
  kind: utility_transaction
  description: A measured reading recorded from a utility meter at a point in time.
  ui:
    icon: gauge
  identity:
    key: meterReadingId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: meterReadingId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the meter reading record associated with this MeterReading. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MeterReading records, where
        applicable.
      relationshipContext: Its meaning is specific to MeterReading; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one reading, so bills and consumption reports can show exactly which readings they were calculated from."
  - name: readingAt
    type: datetime
    required: true
    help:
      summary: Records when the reading event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MeterReading records, where
        applicable.
      relationshipContext: Its meaning is specific to MeterReading; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The moment the meter was read, which places the reading in sequence with the previous one and decides which billing period its consumption falls into."
  - name: readingValue
    type: decimal
    required: true
    precision: 24
    scale: 8
    help:
      summary: Captures the business meaning of reading value for the MeterReading. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MeterReading records, where
        applicable.
      relationshipContext: Its meaning is specific to MeterReading; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The register value shown on the meter at that moment, in the reading's unit of measure; consumption is the difference between this and the previous reading."
  - name: readingType
    type: enum
    required: true
    values:
    - ACTUAL
    - ESTIMATED
    - CORRECTED
    help:
      summary: Captures the business meaning of reading type for the MeterReading. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MeterReading records, where
        applicable.
      relationshipContext: Its meaning is specific to MeterReading; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTUAL: Represents the actual state or classification in the context of MeterReading.
        ESTIMATED: Represents the estimated state or classification in the context of MeterReading.
        CORRECTED: Represents the corrected state or classification in the context of MeterReading.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the value was ACTUAL from the meter, ESTIMATED because no reading was available, or CORRECTED to replace an earlier mistaken one, which customers and billing teams rely on when disputing a bill."
  - name: quality
    type: enum
    required: false
    values:
    - GOOD
    - SUSPECT
    - INVALID
    help:
      summary: Captures the business meaning of quality for the MeterReading. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MeterReading records, where
        applicable.
      relationshipContext: Its meaning is specific to MeterReading; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        GOOD: Represents the good state or classification in the context of MeterReading.
        SUSPECT: Represents the suspect state or classification in the context of MeterReading.
        INVALID: Represents the invalid state or classification in the context of MeterReading.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Whether the reading passed validation as GOOD, looks doubtful and needs checking as SUSPECT, or must not be used as INVALID; only good readings should drive final bills."
  relationships:
  - name: meter
    target: EnergyMeter
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects MeterReading to EnergyMeter so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about EnergyMeter records associated with a MeterReading.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects MeterReading to UnitOfMeasure so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about UnitOfMeasure records associated with a MeterReading.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: METER-READING-001
    rule: readingValue must not be negative unless the meter configuration permits signed values.
  help:
    summary: "One value read from a utility meter at a specific moment, whether taken on site, estimated or corrected, kept so consumption can be calculated, billed and analysed between successive readings."
    businessMeaning: MeterReading is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate MeterReading records.
    relationshipContext: The entity participates in a wider business graph through relationships with EnergyMeter, UnitOfMeasure.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical MeterReading record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "Captured by a field technician, a customer submission or an automated meter feed for an active meter, validated and flagged for quality, used to calculate consumption since the previous reading for billing and analysis, and superseded by a corrected reading when an error is found rather than being overwritten."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-METER-READING
