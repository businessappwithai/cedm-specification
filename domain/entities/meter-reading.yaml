entity:
  name: MeterReading
  namespace: cedm.domain
  kind: utility_transaction
  description: A measured reading recorded from a utility meter at a point in time.
  ui:
    icon: gauge
  identity:
    key: meterReadingId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: meterReadingId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent identifier of one reading taken from a meter, which never changes after the reading is recorded.
        usage: Generated on creation; billing lines and corrections refer to the reading through this value, so it is never reused.
    - name: readingAt
      type: datetime
      required: true
      help:
        summary: When the reading was taken.
        usage: Entered or imported with the value; consumption is the difference between successive readings.
    - name: readingValue
      type: decimal
      required: true
      precision: 24
      scale: 8
      help:
        summary: The value shown on the meter.
        usage: Entered or imported; not negative unless the meter is configured for signed values.
    - name: readingType
      type: enum
      required: true
      values:
        - ACTUAL
        - ESTIMATED
        - CORRECTED
      help:
        summary: Records whether the value was physically read, estimated by the utility, or entered later to correct an earlier reading.
        usage: Set at entry; billing prefers actual readings, and a corrected reading replaces the value it supersedes in consumption.
        valueSemantics:
          ACTUAL: The value was read directly from the meter by a person or a smart device.
          ESTIMATED: The value was calculated by the utility because the meter could not be read, and awaits a real reading.
          CORRECTED: The value replaces an earlier wrong reading and is used instead of it when consumption is calculated.
    - name: quality
      type: enum
      required: false
      values:
        - GOOD
        - SUSPECT
        - INVALID
      help:
        summary: Indicates how far the reading can be trusted, based on validation checks or the reader's own judgement.
        usage: Set by automatic validation or the reader; billing normally uses only good readings and reviews suspect ones first.
        valueSemantics:
          GOOD: The reading passed validation and can be used for consumption and billing.
          SUSPECT: The reading looks unusual, such as a jump or a fall, and needs review before it is used.
          INVALID: The reading was found to be wrong and is excluded from consumption and billing calculations.
  relationships:
    - name: meter
      target: EnergyMeter
      cardinality: '1'
      ownership: reference
      help:
        summary: The meter the reading was taken from.
        usage: Set at entry.
        cardinalityMeaning: 'Exactly one meter: a reading is a measurement from a particular device.'
        workflowRole: Builds the meter's history.
    - name: unitOfMeasure
      target: UnitOfMeasure
      cardinality: '1'
      ownership: reference
      help:
        summary: The unit of the value.
        usage: Taken from the meter; entered if the reading arrives with its own unit.
        cardinalityMeaning: Exactly one unit.
        workflowRole: Lets values be converted and compared.
  invariants:
    - id: METER-READING-001
      rule: readingValue must not be negative unless the meter configuration permits signed values.
  workflows:
    - name: SuspectReadingRecorded
      title: "Review a meter reading that arrives suspect or invalid"
      description: "When a reading is recorded already marked suspect or invalid by validation, a task asks someone to check it before it reaches billing."
      event: afterCreate
      when: "quality == \"SUSPECT\" or quality == \"INVALID\""
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: review the reading"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "METER-READING-REVIEW-{{id}}"
              name: "Review meter reading {{id}}"
              description: "Meter reading {{id}} was recorded as {{quality}}. Compare it with the meter's earlier readings, then correct it or confirm it before it is billed."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: ReadingMarkedSuspect
      title: "Review a meter reading later marked suspect or invalid"
      description: "When validation or a reviewer marks an existing reading suspect or invalid, a task asks someone to check it before it reaches billing."
      when: "(quality == \"SUSPECT\" or quality == \"INVALID\") and quality != _previous_quality"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: recheck the reading"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "METER-READING-RECHECK-{{id}}"
              name: "Recheck meter reading {{id}}"
              description: "Meter reading {{id}} is now {{quality}}. Compare it with the meter's earlier readings, then correct it or confirm it before it is billed."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: A measured value recorded from a utility meter at a point in time.
    businessMeaning: Bills and consumption figures are computed from readings. Each reading records the value, when it was taken, how it was obtained and whether it can be trusted.
    usage: Entered by meter readers, imported from smart meters, or estimated; read by billing and analysis.
    relationshipContext: A reading belongs to one EnergyMeter and uses a UnitOfMeasure.
    example: The electricity meter at a customer's premises reads 48,213.4 kWh on 1 April at 08:00.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-METER-READING
