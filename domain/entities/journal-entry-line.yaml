entity:
  name: JournalEntryLine
  namespace: cedm.domain
  kind: financial_transaction_line
  description: A debit or credit line within a journal entry.
  ui:
    icon: book-open
    recordLabel: [lineNumber, description]
  identity:
    key: journalEntryLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: journalEntryLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the journal entry line record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a journal entry line store this identifier. The number or code people quote is a separate field.
  - name: lineNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: The position of the line in its entry.
      usage: Orders the lines on screen and in reports.
      relationshipContext: Unique within the entry.
  - name: debitAmount
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 4
    help:
      summary: The amount debited to the account.
      usage: Zero on a credit line.
      relationshipContext: Not negative.
  - name: creditAmount
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 4
    help:
      summary: The amount credited to the account.
      usage: Zero on a debit line.
      relationshipContext: Not negative.
  - name: description
    type: string
    required: false
    maxLength: 500
    help:
      summary: What the line is for.
      usage: Shown in the account's ledger.
      relationshipContext: Defaults to the entry's description.
  relationships:
  - name: journalEntry
    target: JournalEntry
    cardinality: '1'
    ownership: reference
    help:
      summary: The journal entry the line belongs to.
      usage: Set when the line is entered.
      cardinalityMeaning: Each line belongs to one entry; an entry has two or more lines.
      context: The entry's debits and credits must balance.
  - name: account
    target: Account
    cardinality: '1'
    ownership: reference
    help:
      summary: The ledger account the line posts to.
      usage: Chosen when entering the line.
      cardinalityMeaning: Each line posts to one account.
      context: Must be an account that accepts postings.
  invariants:
  - id: JOURNAL-LINE-001
    rule: exactly one of debitAmount and creditAmount must be greater than zero unless zero-value lines are explicitly permitted.
  - id: JOURNAL-LINE-002
    rule: debitAmount and creditAmount must not be negative.
  help:
    summary: One debit or credit of a journal entry to one account.
    relationshipContext: The entity participates in a wider business graph through relationships with JournalEntry, Account. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Accountants enter one line per account a journal entry posts to, with a debit or a credit; ledger balances and trial balances are built from posted lines.
    lifecycle: A line has no states of its own; it is posted, reversed or cancelled with its journal entry.
    example: "Line 2 of entry JE-2024-03-0117: credit 1,200.00 to account 4000 Sales, 'Invoice INV-5521'."
    businessMeaning: Lines are what account balances and financial statements are summed from; together they must balance.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-JOURNAL-ENTRY-LINE
