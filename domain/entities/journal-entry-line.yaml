entity:
  name: JournalEntryLine
  namespace: cedm.domain
  kind: financial_transaction_line
  description: A debit or credit line within a journal entry.
  ui:
    icon: book-open
  identity:
    key: journalEntryLineId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: journalEntryLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the journal entry line record associated with this JournalEntryLine. The identifier connects this
        record to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records,
        where applicable.
      relationshipContext: Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets auditors and reconciliations point to one exact posting within an entry when tracing a balance back to its source."
  - name: lineNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: Captures the business meaning of line number for the JournalEntryLine. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records,
        where applicable.
      relationshipContext: Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Gives the lines a fixed order within the entry so reviewers and auditors can refer to them, such as line 3 of the entry."
  - name: debitAmount
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of debit amount for the JournalEntryLine. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records,
        where applicable.
      relationshipContext: Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The amount added to the account on the debit side; total debits on an entry must equal total credits before it can be posted."
  - name: creditAmount
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of credit amount for the JournalEntryLine. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records,
        where applicable.
      relationshipContext: Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The amount added to the account on the credit side; it balances the debits on the other lines of the same entry."
  - name: description
    type: string
    required: false
    maxLength: 500
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating JournalEntryLine records,
        where applicable.
      relationshipContext: Its meaning is specific to JournalEntryLine; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Explains what the posting is for, such as the supplier or expense involved, so anyone reading the ledger understands the line without opening the source document."
  relationships:
  - name: journalEntry
    target: JournalEntry
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects JournalEntryLine to JournalEntry so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about JournalEntry records associated with a JournalEntryLine.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: account
    target: Account
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects JournalEntryLine to Account so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Account records associated with a JournalEntryLine.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: JOURNAL-LINE-001
    rule: exactly one of debitAmount and creditAmount must be greater than zero unless zero-value lines are explicitly permitted.
  - id: JOURNAL-LINE-002
    rule: debitAmount and creditAmount must not be negative.
  help:
    summary: "One debit or credit posting to a single ledger account within a journal entry; together the lines of an entry must balance so the books stay in agreement."
    businessMeaning: JournalEntryLine is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate JournalEntryLine records.
    relationshipContext: The entity participates in a wider business graph through relationships with JournalEntry, Account.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical JournalEntryLine record represents one identifiable business occurrence or master-data object that
      can be referenced by related CEDM processes.
    workflowContext: "Lines are created when an accountant or an automated posting such as an invoice or payment builds a journal entry, they are reviewed with the entry before it is posted, and once posted they feed account balances, the trial balance and financial statements; corrections are made with reversing entries rather than by editing posted lines."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-JOURNAL-ENTRY-LINE
