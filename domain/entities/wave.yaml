entity:
  name: Wave
  namespace: cedm.domain
  kind: warehouse_orchestration_transaction
  description: A governed grouping of warehouse execution work released together for coordinated picking, putaway, packing, staging, or shipping.
  ui:
    icon: file-text
  identity: {key: waveId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: waveId, type: uuid, required: true, immutable: true, help: {summary: "Uniquely identifies this wave of warehouse work so its picks and putaways stay grouped together.", businessMeaning: Identifies one coordinated work release., usage: WMS planning and execution., relationshipContext: Groups tasks without replacing individual evidence., requiredMeaning: Required.}}
  - {name: waveNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The wave reference that supervisors and operators see on handheld devices and pick lists.", businessMeaning: Operational identifier for grouped work., usage: Warehouse planning and reporting., relationshipContext: Distinct from task and shipment identifiers., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    help: {summary: "Shows whether the wave is planned, released to the floor, in progress, completed or cancelled.", businessMeaning: Controls grouped task release and closure., usage: WMS execution., relationshipContext: Wave completion cannot substitute for task or inventory evidence., valueSemantics: {PLANNED: Work being grouped., RELEASED: Tasks authorized., IN_PROGRESS: Tasks executing., COMPLETED: Included work reconciled., CANCELLED: Remaining work terminated.}, requiredMeaning: Required.}
  relationships:
  - {name: warehouse, target: Warehouse, cardinality: '1', ownership: reference, help: {summary: Warehouse executing wave., businessMeaning: Defines operating facility., usage: Labor/task orchestration., cardinalityMeaning: Exactly one Warehouse., workflowRole: Included tasks must be compatible with warehouse.}}
  - {name: picks, target: Picking, cardinality: 0..*, ownership: reference, help: {summary: Pick tasks grouped in wave., businessMeaning: Coordinates inventory-selection work., usage: Batch/zone/order picking., cardinalityMeaning: Zero or many picks., workflowRole: Each pick retains independent execution evidence.}}
  - {name: putaways, target: Putaway, cardinality: 0..*, ownership: reference, help: {summary: Putaway tasks grouped in wave., businessMeaning: Coordinates storage work., usage: Labor orchestration., cardinalityMeaning: Zero or many tasks., workflowRole: Each task remains independently reconcilable.}}
  invariants:
  - {id: WAVE-001, rule: RELEASED wave must contain at least one executable task.}
  - {id: WAVE-002, rule: Cancelling a wave cannot erase or reverse already posted task or inventory effects.}
  - {id: WAVE-003, rule: COMPLETED requires included released tasks to be terminal or explicitly excepted.}
  lifecycle:
    title: Wave Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RELEASED, action: release}
      - {from: RELEASED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a wave is ended"
      description: "When a wave is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "WAVE-FOLLOW-UP-{{id}}"
              name: "Follow up on wave {{wave_number}}"
              description: "Wave {{wave_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a wave is done"
      description: "When a wave is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "WAVE-COMPLETED-{{id}}"
              name: "Confirm wave {{wave_number}}"
              description: "Wave {{wave_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: "A batch of warehouse work, such as picks for all orders on the 2 pm truck, released to the floor together so picking, packing and shipping happen in a coordinated way."
    businessMeaning: Wave organizes tasks; it does not itself move inventory or fulfill orders.
    usage: Labor planning, batch/zone picking, putaway and shipping-cutoff execution.
    relationshipContext: Warehouse supplies facility; Picking and Putaway supply executable tasks.
    lifecycle: Planned to released to in progress to completed or cancelled.
    example: "Wave W-20261008-03 at the Leeds distribution centre, 148 picks for afternoon carrier collections, released and in progress."
    workflowContext: "A warehouse planner groups orders or tasks into a planned wave, releases it once it holds executable tasks, operators start picking and putting away, and the wave is completed when its tasks are finished or excepted; cancelling it does not undo work already posted and raises a follow-up task."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-WAVE}
