entity:
  name: Wave
  namespace: cedm.domain
  kind: warehouse_orchestration_transaction
  description: A governed grouping of warehouse execution work released together for coordinated picking, putaway, packing, staging, or shipping.
  ui:
    icon: file-text
    recordLabel: [waveNumber]
  identity: {key: waveId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: waveId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the wave record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a wave store this identifier. The number or code people quote is a separate field.
  - name: waveNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the wave.
      businessMeaning: Operational identifier for grouped work.
      usage: Printed on pick lists; operators scan it to start work.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    help:
      summary: Where the wave stands.
      businessMeaning: Controls grouped task release and closure.
      usage: Moved on by release and completion.
      relationshipContext: Only planned waves can be changed.
      valueSemantics:
        PLANNED: Being built.
        RELEASED: Released to the floor.
        IN_PROGRESS: Work has started.
        COMPLETED: All tasks done.
        CANCELLED: Called off.
  - name: waveType
    type: enum
    required: true
    default: PICKING
    values: [PICKING, PUTAWAY, REPLENISHMENT]
    help:
      summary: What kind of work the wave releases.
      usage: Decides which tasks it groups.
      relationshipContext: Most waves are picking waves.
      valueSemantics:
        PICKING: Picking for outbound orders.
        PUTAWAY: Putting away received goods.
        REPLENISHMENT: Moving stock from reserve to picking locations.
  - name: releasedAt
    type: datetime
    required: false
    help:
      summary: When the wave was released to the floor.
      usage: Recorded on release.
      relationshipContext: Present once released.
  - name: plannedCompletionAt
    type: datetime
    required: false
    help:
      summary: When the wave should be finished, usually to meet a carrier cut-off.
      usage: Set when planning the wave.
      relationshipContext: Late waves are flagged.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: When the last task in the wave was finished.
      usage: Recorded on completion.
      relationshipContext: Present once completed.
  - name: taskCount
    type: integer
    required: false
    help:
      summary: How many tasks the wave contains.
      usage: Shown on the wave monitor.
      relationshipContext: Summed from its picks and putaways.
  relationships:
  - name: warehouse
    target: Warehouse
    cardinality: '1'
    ownership: reference
    help:
      summary: The warehouse the wave runs in.
      businessMeaning: Defines operating facility.
      workflowRole: Included tasks must be compatible with warehouse.
      usage: Set when the wave is created.
      cardinalityMeaning: Every wave runs in one warehouse.
      context: Its docks and staff do the work.
  - name: picks
    target: Picking
    cardinality: 0..*
    ownership: reference
    help:
      summary: The picking tasks in the wave.
      businessMeaning: Coordinates inventory-selection work.
      workflowRole: Each pick retains independent execution evidence.
      usage: Added when the wave is built.
      cardinalityMeaning: A wave holds any number of picks; each pick is in one wave.
      context: The pick records its wave.
    inverseCardinality: '1'
  - name: putaways
    target: Putaway
    cardinality: 0..*
    ownership: reference
    help:
      summary: The putaway tasks in the wave.
      businessMeaning: Coordinates storage work.
      workflowRole: Each task remains independently reconcilable.
      usage: Added when the wave is built.
      cardinalityMeaning: A wave holds any number of putaways; each is in one wave.
      context: The putaway records its wave.
    inverseCardinality: '1'
  invariants:
  - {id: WAVE-001, rule: A completed wave records when it finished., violatedWhen: status == "COMPLETED" and completed_at == null, message: Record when the wave was completed.}
  - {id: WAVE-EXE-001, rule: "Task Count cannot be negative.", violatedWhen: "task_count != null and task_count < 0", message: "Task Count cannot be negative."}
  lifecycle:
    title: Wave Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RELEASED, action: release}
    - {from: RELEASED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a wave is ended"
    description: "When a wave is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "WAVE-FOLLOW-UP-{{id}}"
          name: "Follow up on wave {{wave_number}}"
          description: "Wave {{wave_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a wave is done"
    description: "When a wave is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "WAVE-COMPLETED-{{id}}"
          name: "Confirm wave {{wave_number}}"
          description: "Wave {{wave_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Warehouse work-release grouping for coordinated execution.
    businessMeaning: Wave organizes tasks; it does not itself move inventory or fulfill orders.
    usage: Labor planning, batch/zone picking, putaway and shipping-cutoff execution.
    relationshipContext: Warehouse supplies facility; Picking and Putaway supply executable tasks.
    lifecycle: Planned to released to in progress to completed or cancelled.
    example: Wave W-24-0520-03, picking wave, released 20 May 2024 08:00, 142 tasks, planned completion 11:00, completed 10:41.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-WAVE}
