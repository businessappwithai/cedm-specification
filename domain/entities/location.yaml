entity:
  name: Location
  namespace: cedm.domain
  kind: core_master_entity
  description: A physical or logical place at which business resources, activities, inventory, services, or organizational operations are situated.
  ui:
    icon: map-pin
  identity: {key: locationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: locationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the location record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a location store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    unique: true
    help:
      summary: The short code of the location.
      usage: Used on documents, labels and in integrations.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name people use for the location.
      usage: Shown in lists and on documents.
      relationshipContext: Should be unambiguous within the organisation.
  - name: locationType
    type: enum
    required: true
    values: [SITE, WAREHOUSE, STORE, OFFICE, FACTORY, YARD, PORT, DEPOT, VIRTUAL, OTHER]
    help:
      summary: What kind of place the location is.
      usage: Decides which operations may happen there, such as storing stock or selling.
      relationshipContext: Chosen when the location is created.
      valueSemantics:
        SITE: A site grouping other locations.
        WAREHOUSE: A place where stock is stored.
        STORE: A shop serving customers.
        OFFICE: An office.
        FACTORY: A production plant.
        YARD: An outdoor area for vehicles or goods.
        PORT: A sea, river or air port.
        DEPOT: A distribution or vehicle depot.
        VIRTUAL: A logical location with no physical place.
        OTHER: Any other kind.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
    help:
      summary: Whether the location is in use.
      usage: Changed by the location's manager.
      relationshipContext: Closed and retired locations take no new transactions.
      valueSemantics:
        PLANNED: Being set up; not yet in use.
        ACTIVE: In use.
        INACTIVE: Temporarily not in use.
        CLOSED: Shut down; kept for history.
        RETIRED: Withdrawn for good.
  - name: addressId
    type: reference
    target: Address
    required: false
    help:
      summary: The postal address of the location.
      usage: Used for deliveries and documents.
      relationshipContext: Empty for virtual locations.
  - name: parentLocationId
    type: reference
    target: Location
    required: false
    help:
      summary: The location this one is part of.
      usage: Builds the location hierarchy.
      relationshipContext: Never the location itself or one of its own children.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: "The created at of the location: a point in time the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its created at."
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: "The updated at of the location: a point in time the business records on it."
      usage: Entered or maintained when a location is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the location's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: "Required: a location cannot be understood without its updated at."
  relationships:
  - name: parentLocation
    target: Location
    cardinality: 0..1
    ownership: reference
    inverse: childLocations
    help:
      summary: The location this one is part of, such as the site of a warehouse.
      cardinalityMeaning: A location has at most one location in this role.
      usage: Set when the location is placed in the hierarchy.
      context: No cycles.
  - name: childLocations
    target: Location
    cardinality: 0..*
    ownership: reference
    inverse: parentLocation
    help:
      summary: Locations that are part of this one.
      cardinalityMeaning: A location has any number of location in this role.
      usage: Listed on the location.
      context: Each child has this location as its parent.
  - name: address
    target: Address
    cardinality: 0..1
    ownership: reference
    help:
      summary: The postal address of the location.
      cardinalityMeaning: A location has at most one address in this role.
      usage: Set when the location has a physical address.
      context: Shared addresses are allowed.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation that runs the location.
      cardinalityMeaning: A location has at most one organization in this role.
      usage: Set when the location is created.
      context: Its policies apply at the location.
  invariants:
  - id: LOCATION-001
    rule: A Location cannot be its own parent.
  - id: LOCATION-002
    rule: The Location hierarchy must not contain cycles.
  - id: LOCATION-003
    rule: A Location in CLOSED or RETIRED status must not be selected for new operational transactions that require an active physical location unless an explicit exception workflow permits it.
  - id: LOCATION-004
    rule: Changing or retiring a Location must trigger validation of dependent operational entities and workflows that reference it before future use is disabled.
  - id: LOCATION-005
    rule: Historical transactions must retain the Location context effective when the transaction occurred and must not be rewritten merely because the Location master changes.
  - id: LOCATION-006
    rule: Changing parentLocation must preserve hierarchy integrity and must not create a cycle.
  - id: LOCATION-007
    rule: If an operational Location references an Address, the referenced Address must be active and usable when the Location becomes effective unless an explicitly supported historical/legacy exception applies.
  lifecycle:
    title: Location Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: PLANNED, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Core location master with hierarchical, geographic, organizational, and lifecycle context.
    businessMeaning: "Location identifies where business activity or resources occur. It is distinct from Address: Location is the business place; Address describes its geographic/contact representation."
    usage: Supports inventory, warehousing, yard/port operations, shipping, purchasing, sales, tax jurisdiction, service, logistics, and organizational processes.
    relationshipContext: Organization provides operating ownership/context. Address provides geographic representation. Parent/child locations provide operational hierarchy. Dependent entities must react when location status or hierarchy changes.
    workflowContext: Location create → validate hierarchy/address/organization → activate → use in operational transactions → status change/closure → validate dependent resources and prevent incompatible future use → preserve historical transaction context.
    lifecycle: Planned → active → inactive/closed → retired. Closure affects future operational selection; it does not delete historical movements, orders, receipts, shipments, or invoices.
    example: A warehouse is closed. New GoodsReceipts cannot target it, dependent inventory workflows must resolve or block future operations, but historical receipts and stock movements remain associated with the warehouse where they occurred.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-LOCATION}
