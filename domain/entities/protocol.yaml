entity:
  name: Protocol
  namespace: cedm.domain
  kind: research_protocol
  description: A governed scientific procedure definition describing objectives, methods, eligibility, measurements, controls and execution rules for one or more Studies or Experiments.
  ui: {icon: scroll-text}
  identity: {key: protocolId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: protocolId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the research protocol., businessMeaning: Identifies one governed procedure definition independently of executions., usage: "Research planning, study execution, audit and reproducibility.", relationshipContext: Studies and Experiments execute against a Protocol version.}}
    - {name: protocolCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing protocol reference., businessMeaning: Operational identifier for scientific and regulatory traceability., usage: "Search, documents, integrations and audit.", relationshipContext: Distinct from Study and Experiment identifiers.}}
    - {name: title, type: string, required: true, maxLength: 500, help: {summary: Human-readable title of the protocol., businessMeaning: States the research procedure or objective to users., usage: "Planning, review and reporting.", relationshipContext: Detailed methods remain in protocol content or Documents.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, SUSPENDED, RETIRED]
      help: {summary: Lifecycle state controlling use for new research execution., businessMeaning: "Separates preparation, approved use, temporary suspension and retirement.", usage: Research governance and audit., relationshipContext: Historical executions retain the protocol version applied., valueSemantics: {DRAFT: Being prepared., APPROVED: Eligible for governed execution., SUSPENDED: Temporarily unavailable for new execution., RETIRED: Closed to new execution.}}
  relationships:
    - {name: project, target: ResearchProject, cardinality: "0..1", ownership: reference, help: {summary: Research project governing this Protocol., businessMeaning: Supplies program context and accountability., usage: "Portfolio, governance and reporting.", cardinalityMeaning: Optional for reusable protocols., workflowRole: Project state constrains new protocol use.}}
    - {name: studies, target: Study, cardinality: "0..*", ownership: reference, help: {summary: Studies governed by this Protocol., businessMeaning: Connects procedure definition to organized research executions., usage: "Study planning, reproducibility and audit.", cardinalityMeaning: Zero or many Studies., workflowRole: Each Study retains the protocol/version used.}}
    - {name: experiments, target: Experiment, cardinality: "0..*", ownership: reference, help: {summary: Experiments directly governed by this Protocol., businessMeaning: Connects methods to executable scientific work., usage: "Experiment planning, reproducibility and audit.", cardinalityMeaning: Zero or many Experiments., workflowRole: Execution cannot silently switch protocol after evidence is captured.}}
    - {name: documents, target: Document, cardinality: "0..*", ownership: reference, help: {summary: "Documents containing protocol methods, approvals or amendments.", businessMeaning: Preserves rich content and governance evidence outside the entity header., usage: Research governance and audit., cardinalityMeaning: Zero or many Documents., workflowRole: Approved versions and amendments remain traceable.}}
  invariants:
    - {id: PROTOCOL-001, rule: APPROVED Protocol must have sufficient governed method and approval evidence for its intended research use.}
    - {id: PROTOCOL-002, rule: "Protocol amendments must preserve the version applied to existing Studies, Experiments, Assays and observations."}
  lifecycle:
    title: Protocol Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Defines governed scientific methods separately from their executions and results.
    businessMeaning: Protocol states how research should be performed; Study and Experiment represent organized execution; observations and results record evidence.
    usage: Research, laboratories, life sciences, clinical/preclinical operations, reproducibility and audit.
    relationshipContext: ResearchProject may govern the protocol; Studies and Experiments consume it; Documents preserve detailed methods and approvals.
    lifecycle: Draft methods are approved, may suspend, and retire while historical execution remains tied to the applied version.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROTOCOL}
