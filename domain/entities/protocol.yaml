entity:
  name: Protocol
  namespace: cedm.domain
  kind: research_protocol
  description: A governed scientific procedure definition describing objectives, methods, eligibility, measurements, controls and execution rules for one or more Studies or Experiments.
  ui: {icon: scroll-text}
  identity: {key: protocolId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: protocolId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent, system-generated identity of this research protocol, constant across its amendments.', usage: 'Generated on creation and never changed; studies, experiments, assays and audit records refer to the protocol through it for reproducibility.', businessMeaning: Identifies one governed procedure definition independently of executions., relationshipContext: Studies and Experiments execute against a Protocol version.}}
    - {name: protocolCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: 'The code of the protocol, such as PR-117.', usage: 'Unique; quoted in studies, experiments and reports.', businessMeaning: Operational identifier for scientific and regulatory traceability., relationshipContext: Distinct from Study and Experiment identifiers.}}
    - {name: title, type: string, required: true, maxLength: 500, help: {summary: 'The descriptive title of the protocol, naming the scientific procedure it defines.', usage: 'Entered by the protocol author; shown in protocol lists, study plans and reports so scientists can pick the right method.', businessMeaning: States the research procedure or objective to users., relationshipContext: Detailed methods remain in protocol content or Documents.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, SUSPENDED, RETIRED]
      help:
        summary: Whether the protocol is cleared for new research execution, still being written, withdrawn or retired.
        usage: Moved by research governance; only APPROVED protocols can be applied to new studies, and RETIRED is final.
        valueSemantics:
          DRAFT: Being written; not yet approved for use.
          APPROVED: Cleared for use by studies and experiments.
          SUSPENDED: Withdrawn from use for a time, for example pending a review.
          RETIRED: Superseded or no longer used. A final state.
        businessMeaning: "Separates preparation, approved use, temporary suspension and retirement."
        relationshipContext: Historical executions retain the protocol version applied.
  relationships:
    - {name: project, target: ResearchProject, cardinality: "0..1", ownership: reference, help: {summary: Research project governing this Protocol., businessMeaning: Supplies program context and accountability., usage: "Portfolio, governance and reporting.", cardinalityMeaning: Optional for reusable protocols., workflowRole: Project state constrains new protocol use.}}
    - {name: studies, target: Study, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of studies can follow the same protocol., summary: Studies governed by this Protocol., businessMeaning: Connects procedure definition to organized research executions., usage: "Study planning, reproducibility and audit.", workflowRole: Each Study retains the protocol/version used.}}
    - {name: experiments, target: Experiment, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of experiments can be run under the protocol., summary: Experiments directly governed by this Protocol., businessMeaning: Connects methods to executable scientific work., usage: "Experiment planning, reproducibility and audit.", workflowRole: Execution cannot silently switch protocol after evidence is captured.}}
    - {name: documents, target: Document, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: 'Any number of supporting documents, such as method sheets and approvals.', summary: "Documents containing protocol methods, approvals or amendments.", businessMeaning: Preserves rich content and governance evidence outside the entity header., usage: Research governance and audit., workflowRole: Approved versions and amendments remain traceable.}}
  invariants:
    - {id: PROTOCOL-001, rule: APPROVED Protocol must have sufficient governed method and approval evidence for its intended research use.}
    - {id: PROTOCOL-002, rule: "Protocol amendments must preserve the version applied to existing Studies, Experiments, Assays and observations."}
  lifecycle:
    title: Protocol Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A governed scientific procedure that sets out objectives, methods, eligibility, measurements, controls and execution rules for studies and experiments.
    businessMeaning: A protocol fixes how work is to be done so that results are comparable and defensible. Studies and experiments follow an approved protocol, and a change goes through a new approval rather than being made on the day.
    usage: Written by the scientist or study lead; approved by quality or the principal investigator; read by everyone who runs the work.
    relationshipContext: A protocol may belong to a research project and is followed by studies and experiments; documents support it.
    lifecycle: A protocol is drafted, approved, may be suspended and reinstated, and is retired when superseded. Retired is final.
    example: Protocol PR-117 sets out how a cell viability assay is run and read, and is approved before any study uses it.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROTOCOL}
