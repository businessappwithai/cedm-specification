entity:
  name: Project
  namespace: cedm.domain
  kind: project_management_entity
  description: A temporary or ongoing coordinated initiative with defined objectives, scope, resources, and outcomes.
  ui:
    icon: folder-kanban
  identity:
    key: projectId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: projectId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the project record associated with this Project. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets tasks, timesheets, costs and milestones be charged to exactly this project."
  - name: projectCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of project code for the Project. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short code staff enter on timesheets and expenses to charge work to the project."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name people use to talk about the project in plans, reports and meetings."
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Explains the project's purpose and scope so team members and sponsors know what it is meant to deliver."
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - DRAFT
    - PLANNED
    - ACTIVE
    - ON_HOLD
    - COMPLETED
    - CANCELLED
    - CLOSED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Project.
        PLANNED: Represents the planned state or classification in the context of Project.
        ACTIVE: Represents the active state or classification in the context of Project.
        ON_HOLD: Represents the on hold state or classification in the context of Project.
        COMPLETED: Represents the completed state or classification in the context of Project.
        CANCELLED: Represents the cancelled state or classification in the context of Project.
        CLOSED: Represents the closed state or classification in the context of Project.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells managers whether the project is being drafted, planned, under way, on hold, completed, cancelled or closed, which decides whether time and costs can still be charged."
  - name: startDate
    type: date
    required: false
    help:
      summary: The date on which the applicable business period, agreement, service, or lifecycle begins. Related end dates
        must follow the business chronology.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When work on the project is planned to begin, used for scheduling people and phasing budget."
  - name: endDate
    type: date
    required: false
    help:
      summary: The date on which the applicable business period, agreement, service, or lifecycle ends. It is interpreted
        together with the corresponding start date.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the project is due to finish, which deadlines and resource planning are measured against."
  - name: budgetAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of budget amount for the Project. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Project records, where applicable.
      relationshipContext: Its meaning is specific to Project; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The money approved for the project, against which actual costs are compared to spot overspending."
  relationships:
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Project to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Project.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: manager
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Project to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Project.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: tasks
    target: ProjectTask
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects Project to ProjectTask so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about ProjectTask records associated with a Project.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: milestones
    target: Milestone
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects Project to Milestone so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Milestone records associated with a Project.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: resources
    target: ResourceAssignment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects Project to ResourceAssignment so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about ResourceAssignment records associated with a Project.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: phases, target: ProjectPhase, cardinality: "0..*", ownership: aggregate, help: {summary: Governed lifecycle stages of Project., businessMeaning: Groups tasks/milestones into project phases., usage: "Planning, execution and reporting.", cardinalityMeaning: Zero or many phases., workflowRole: Phase lifecycle must reconcile with project lifecycle.}}
  - name: projectCosts
    target: ProjectCost
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Auditable cost attributions belonging to this Project.
      businessMeaning: Separates operational project costing from budget values and general-ledger postings.
      usage: Project control, profitability, billing, budgeting and financial reconciliation.
      cardinalityMeaning: A Project may accumulate zero or many ProjectCost records.
      workflowRole: Project state constrains new cost attribution while posted or reversed historical costs remain immutable evidence.

  invariants:
  - id: PROJECT-001
    rule: endDate must not precede startDate.
  - {id: PROJECT-EXE-001, rule: "Budget Amount cannot be negative.", violatedWhen: "budget_amount != null and budget_amount < 0", message: "Budget Amount cannot be negative."}
  lifecycle:
    title: Project Lifecycle
    attribute: status
    states: [DRAFT, PLANNED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED, CLOSED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: PLANNED, action: plan}
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: COMPLETED, to: CLOSED, action: close}
      - {from: PLANNED, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: PLANNED, action: resume}
      - {from: ACTIVE, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: ACTIVE, action: resume}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: ON_HOLD, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a project is stopped"
      description: "When a project is on hold, a high-priority task asks someone to resolve it."
      when: "status == \"ON_HOLD\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-EXCEPTION-{{id}}"
              name: "Resolve project {{name}}"
              description: "Project {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a project is ended"
      description: "When a project is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-FOLLOW-UP-{{id}}"
              name: "Follow up on project {{name}}"
              description: "Project {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "A piece of planned work with its own objectives, budget, manager and dates, under which tasks, milestones, resources and costs are planned and tracked."
    businessMeaning: Project is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Project records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party,
      ProjectTask, Milestone, ResourceAssignment. These relationships provide the context needed to interpret the record rather
      than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Project record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "A project is drafted with its scope, planned once budget and dates are agreed, made active when work starts, may be put on hold and resumed, is completed when the work is delivered, and closed after final costs are booked; it can be cancelled at any point before completion."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROJECT
