entity:
  name: Project
  namespace: cedm.domain
  kind: project_management_entity
  description: A temporary or ongoing coordinated initiative with defined objectives, scope, resources, and outcomes.
  ui:
    icon: folder-kanban
    recordLabel: [projectCode, name]
  identity:
    key: projectId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: projectId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the project record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a project store this identifier. The number or code people quote is a separate field.
  - name: projectCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the project.
      usage: Booked on timesheets, purchase orders and costs.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the project.
      usage: Shown in portfolios and reports.
      relationshipContext: Names the outcome.
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: The objectives and scope of the project.
      usage: Read by sponsors and the team.
      relationshipContext: Plain language.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - DRAFT
    - PLANNED
    - ACTIVE
    - ON_HOLD
    - COMPLETED
    - CANCELLED
    - CLOSED
    help:
      summary: Where the project stands.
      usage: Changed by the project manager.
      relationshipContext: Costs are booked only to active projects.
      valueSemantics:
        DRAFT: Being proposed.
        PLANNED: Approved and being planned.
        ACTIVE: Work in progress.
        ON_HOLD: Paused.
        COMPLETED: Delivered.
        CANCELLED: Stopped before completion.
        CLOSED: Completed and financially settled.
  - name: startDate
    type: date
    required: false
    help:
      summary: The day the project starts.
      usage: Tasks are scheduled from it.
      relationshipContext: Not after the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The day the project is planned to end.
      usage: Progress is reported against it.
      relationshipContext: Not before the start date.
  - name: budgetAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The money approved for the project.
      usage: Spend is reported against it.
      relationshipContext: Not negative.
  relationships:
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation unit that owns the project.
      usage: Set when proposing.
      cardinalityMeaning: At most one owner.
      context: Pays for the project.
  - name: manager
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person managing the project.
      usage: Assigned when planning.
      cardinalityMeaning: At most one manager.
      context: Answers for progress and budget.
  - name: tasks
    target: ProjectTask
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The work items of the project.
      usage: Planned and tracked by the team.
      cardinalityMeaning: Any number, kept with the project.
      context: Line items of the project.
  - name: milestones
    target: Milestone
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The checkpoints of the project.
      usage: Reported to sponsors.
      cardinalityMeaning: Any number, kept with the project.
      context: Line items of the project.
  - name: resources
    target: ResourceAssignment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: People and equipment assigned to the project.
      usage: Planned by the project manager.
      cardinalityMeaning: Any number, kept with the project.
      context: Line items of the project.
  - name: phases
    target: ProjectPhase
    cardinality: "0..*"
    ownership: aggregate
    help:
      summary: Governed lifecycle stages of Project.
      businessMeaning: Groups tasks/milestones into project phases.
      usage: "Planning, execution and reporting."
      workflowRole: Phase lifecycle must reconcile with project lifecycle.
      cardinalityMeaning: Any number of phases, kept with the project.
  invariants:
  - id: PROJECT-001
    rule: endDate must not precede startDate.
  - {id: PROJECT-EXE-001, rule: "Budget Amount cannot be negative.", violatedWhen: "budget_amount != null and budget_amount < 0", message: "Budget Amount cannot be negative."}
  lifecycle:
    title: Project Lifecycle
    attribute: status
    states: [DRAFT, PLANNED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED, CLOSED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
    - {from: DRAFT, to: PLANNED, action: plan}
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: COMPLETED, to: CLOSED, action: close}
    - {from: PLANNED, to: ON_HOLD, action: hold}
    - {from: ON_HOLD, to: PLANNED, action: resume}
    - {from: ACTIVE, to: ON_HOLD, action: hold}
    - {from: ON_HOLD, to: ACTIVE, action: resume}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: ON_HOLD, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a project is stopped"
    description: "When a project is on hold, a high-priority task asks someone to resolve it."
    when: "status == \"ON_HOLD\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROJECT-EXCEPTION-{{id}}"
          name: "Resolve project {{name}}"
          description: "Project {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a project is ended"
    description: "When a project is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROJECT-FOLLOW-UP-{{id}}"
          name: "Follow up on project {{name}}"
          description: "Project {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A piece of work with objectives, a budget and a schedule, run by a project manager.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, ProjectTask, Milestone, ResourceAssignment. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Project managers plan the project's phases, tasks, milestones and resources, track progress and spend against the budget, and report status to sponsors.
    lifecycle: A project is drafted, planned, then active while work is done; it may be put on hold and resumed, is completed when delivered and closed when its accounts are settled; it may be cancelled before completion.
    example: Project WMS-2024 'New warehouse management system', IT, manager Paolo Ferri, 1 February–31 October 2024, budget 420,000 EUR, active.
    businessMeaning: Projects consume budget and deliver change; tracking them shows whether money is well spent and outcomes are delivered.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROJECT
