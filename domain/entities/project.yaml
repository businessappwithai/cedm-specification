entity:
  name: Project
  namespace: cedm.domain
  kind: project_management_entity
  description: A temporary or ongoing coordinated initiative with defined objectives, scope, resources, and outcomes.
  ui:
    icon: folder-kanban
  identity:
    key: projectId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: projectId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the project, constant for its life.
        usage: Generated on creation; tasks, costs and engagements refer to it.
        relationshipContext: Referenced by every task, milestone, assignment and cost of the project.
    - name: projectCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code people use for the project, such as PRJ-0042.
        usage: Unique; quoted in time booking, cost reports and invoices.
        relationshipContext: Appears wherever work or cost is charged to the project.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A short name that says what the project is for.
        usage: Shown in lists and pickers.
        relationshipContext: Read with the project code to recognise the project.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A longer description of the objectives and scope.
        usage: Written when the project is drafted and kept up to date as scope changes.
        relationshipContext: Read by anyone joining the project to understand its purpose.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - PLANNED
        - ACTIVE
        - ON_HOLD
        - COMPLETED
        - CANCELLED
        - CLOSED
      help:
        summary: Where the project stands in its life.
        usage: Starts as DRAFT; moved by the project manager through planning, delivery and close.
        relationshipContext: Decides whether time and cost may be booked and whether the project is still open.
        valueSemantics:
          DRAFT: Being defined; not yet approved for planning.
          PLANNED: Scope, schedule and budget are agreed; work has not started.
          ACTIVE: Work is under way and time and cost may be booked.
          ON_HOLD: Paused; can be resumed to planned or active.
          COMPLETED: The work is delivered; final costs are still being settled.
          CANCELLED: Stopped before completion. A final state.
          CLOSED: Settled and archived. A final state.
    - name: startDate
      type: date
      required: false
      help:
        summary: The date work on the project starts or started.
        usage: Set when planned; schedules and resource plans are measured from it.
        relationshipContext: Compared with task and phase dates.
    - name: endDate
      type: date
      required: false
      help:
        summary: The date the project is due to end or ended.
        usage: Must not be before the start date; revised when the plan changes.
        relationshipContext: Compared with milestone dates to judge whether delivery is on time.
    - name: budgetAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The total amount approved to spend on the project.
        usage: Set at planning; must not be negative; actual costs are compared with it.
        relationshipContext: Summed against the project's costs to show budget remaining.
  relationships:
    - name: ownerOrganization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that owns and sponsors the project.
        usage: Chosen when the project is created.
        cardinalityMeaning: At most one organisation; empty for a project not yet assigned.
        context: Decides whose budget and reporting the project belongs to.
    - name: manager
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for delivering the project.
        usage: Chosen when the project is planned.
        cardinalityMeaning: At most one manager; a project may be unassigned in draft.
        context: Names who answers for progress, cost and approvals.
    - name: tasks
      target: ProjectTask
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The tasks that make up the project's work.
        usage: Read to see the plan and progress.
        cardinalityMeaning: Any number of tasks, none in a new project.
        context: Tasks belong to the project and are removed with it.
    - name: milestones
      target: Milestone
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The key dates the project must reach.
        usage: Read to review delivery against the plan.
        cardinalityMeaning: Any number of milestones.
        context: Milestones belong to the project and mark its progress.
    - name: resources
      target: ResourceAssignment
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The people and assets assigned to the project.
        usage: Read to see who is committed and for how long.
        cardinalityMeaning: Any number of assignments.
        context: Assignments belong to the project and drive capacity and cost.
    - {name: phases, target: ProjectPhase, cardinality: "0..*", ownership: aggregate, help: {summary: The stages the project is divided into., usage: Read to see the project's structure in order., cardinalityMeaning: 'Any number of phases, none for a simple project.', workflowRole: Groups tasks and milestones into stages that can be reviewed., businessMeaning: Groups tasks/milestones into project phases.}}
    - name: projectCosts
      target: ProjectCost
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The costs charged to the project.
        usage: Read to total spend against budget.
        cardinalityMeaning: Any number of cost records.
        workflowRole: Gives the actual cost side of the budget comparison.
        businessMeaning: Separates operational project costing from budget values and general-ledger postings.
  invariants:
    - id: PROJECT-001
      rule: endDate must not precede startDate.
    - {id: PROJECT-EXE-001, rule: "Budget Amount cannot be negative.", violatedWhen: "budget_amount != null and budget_amount < 0", message: "Budget Amount cannot be negative."}
  lifecycle:
    title: Project Lifecycle
    attribute: status
    states: [DRAFT, PLANNED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED, CLOSED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: PLANNED, action: plan}
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: COMPLETED, to: CLOSED, action: close}
      - {from: PLANNED, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: PLANNED, action: resume}
      - {from: ACTIVE, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: ACTIVE, action: resume}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: ON_HOLD, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a project is stopped"
      description: "When a project is on hold, a high-priority task asks someone to resolve it."
      when: "status == \"ON_HOLD\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-EXCEPTION-{{id}}"
              name: "Resolve project {{name}}"
              description: "Project {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a project is ended"
      description: "When a project is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROJECT-FOLLOW-UP-{{id}}"
              name: "Follow up on project {{name}}"
              description: "Project {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A coordinated piece of work with defined objectives, scope, resources and outcomes, planned and tracked from draft to close.
    businessMeaning: A project is how the organisation organises work that has a start, an end and a budget. It collects tasks, phases, milestones, resource assignments and costs, so progress, spend and delivery can be reviewed in one place and the project closed once everything is settled.
    usage: Created and owned by a project manager; read by delivery teams, finance and management.
    relationshipContext: A project belongs to an owning organisation, has a manager, and contains phases, tasks, milestones, resource assignments and costs.
    lifecycle: A project is drafted, planned, activated, completed and then closed. It may be put on hold and resumed while planned or active, and may be cancelled before completion. Closed and cancelled are final.
    example: Project PRJ-0042, "Warehouse automation", is planned in January, active from March, completed in September and closed after the final cost review.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROJECT
