entity:
  name: Project
  namespace: cedm.domain
  kind: project_management_entity
  description: A temporary or ongoing coordinated initiative with defined objectives, scope, resources, and outcomes.
  identity: {key: projectId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: projectId, type: uuid, required: true, immutable: true}
    - {name: projectCode, type: string, required: true, unique: true, maxLength: 100}
    - {name: name, type: string, required: true, maxLength: 300}
    - {name: description, type: string, required: false, maxLength: 4000}
    - {name: status, type: enum, required: true, default: PLANNED, values: [DRAFT, PLANNED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED, CLOSED]}
    - {name: startDate, type: date, required: false}
    - {name: endDate, type: date, required: false}
    - {name: budgetAmount, type: decimal, required: false, precision: 20, scale: 4}
  relationships:
    - {name: ownerOrganization, target: Organization, cardinality: "0..1", ownership: reference}
    - {name: manager, target: Party, cardinality: "0..1", ownership: reference}
    - {name: tasks, target: ProjectTask, cardinality: "0..*", ownership: aggregate}
    - {name: milestones, target: Milestone, cardinality: "0..*", ownership: aggregate}
    - {name: resources, target: ResourceAssignment, cardinality: "0..*", ownership: aggregate}
  invariants:
    - {id: PROJECT-001, rule: endDate must not precede startDate.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROJECT}
