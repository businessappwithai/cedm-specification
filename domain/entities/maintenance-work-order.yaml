entity:
  name: MaintenanceWorkOrder
  namespace: cedm.domain
  kind: maintenance_transaction
  description: A controlled instruction and execution record for inspecting, maintaining, correcting, or repairing an Asset, including the work required, responsible party, planned timing, and completion outcome.
  ui:
    icon: shopping-cart
  identity: {key: maintenanceWorkOrderId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: maintenanceWorkOrderId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the work order.
        usage: Generated on creation; parts issues and time bookings refer to it.
        relationshipContext: Identifies the work order independently of its business number, Asset, MaintenancePlan, assignee, or RepairEstimate.
    - name: workOrderNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number printed on the job card.
        usage: Allocated on creation; unique; used by technicians and in cost reports.
        relationshipContext: It is a business reference rather than the technical identity and remains the primary operational reference for people.
    - name: workType
      type: enum
      required: true
      values: [INSPECTION, PREVENTIVE, CORRECTIVE, REPAIR, EMERGENCY]
      help:
        summary: The kind of work.
        usage: Chosen on creation; affects priority rules and reporting.
        valueSemantics:
          INSPECTION: A check of condition without repair.
          PREVENTIVE: Planned work to prevent failure.
          CORRECTIVE: Work to correct a defect found earlier.
          REPAIR: Work to repair a failure.
          EMERGENCY: Urgent work to restore a critical asset.
        relationshipContext: Work type describes why maintenance is being performed; Asset identifies what is being maintained and MaintenancePlan explains recurring planned work when applicable.
    - name: status
      type: enum
      required: true
      default: OPEN
      values: [OPEN, PLANNED, ASSIGNED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
      help:
        summary: Where the work stands.
        usage: Moved by planners and technicians.
        valueSemantics:
          OPEN: Requested and waiting to be planned.
          PLANNED: Scheduled for a date.
          ASSIGNED: Given to a technician or crew.
          IN_PROGRESS: Work has started.
          ON_HOLD: Paused, for example waiting for parts.
          COMPLETED: Done. A final state.
          CANCELLED: Withdrawn. A final state.
        relationshipContext: Work-order status describes the maintenance instruction and execution; it does not by itself prove that an Asset is operational, repaired, or returned to service.
    - name: priority
      type: enum
      required: true
      default: NORMAL
      values: [LOW, NORMAL, HIGH, CRITICAL]
      help:
        summary: How urgent the work is.
        usage: Set at request; planners schedule in priority order.
        valueSemantics:
          LOW: Can wait until convenient.
          NORMAL: To be done in the usual course.
          HIGH: To be done soon.
          CRITICAL: Needed at once because of safety or a stopped process.
        relationshipContext: Priority expresses urgency; it is different from workType, which expresses purpose, and from Asset criticality, which expresses the importance of the asset itself.
    - name: requestedAt
      type: datetime
      required: true
      help:
        summary: When the work was requested.
        usage: Set on creation; response times are measured from it.
        relationshipContext: It marks demand for maintenance, not necessarily the time work was scheduled, assigned, or started.
    - name: scheduledAt
      type: datetime
      required: false
      help:
        summary: When the work is due to be done.
        usage: Set when planned.
        relationshipContext: It represents a plan and may differ from the actual execution start recorded elsewhere or inferred from status history.
    - name: completedAt
      type: datetime
      required: false
      help:
        summary: When the work was finished.
        usage: Set on completion; used for downtime and cost.
        relationshipContext: Completion means the work-order scope has been accepted; it does not necessarily mean the Asset has returned to service if a separate commissioning or release process exists.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: What needs to be done.
        usage: Written by the requester or planner and read by the technician.
        relationshipContext: It complements structured workType, Asset, RepairEstimate, and MaintenancePlan information and should not be used as the sole source for critical machine-readable conditions.
  relationships:
    - name: asset
      target: Asset
      cardinality: 0..1
      ownership: reference
      help:
        summary: The asset the work is for.
        usage: Chosen when raised.
        cardinalityMeaning: At most one asset; some work covers a location or a group.
        workflowRole: Adds to the asset's maintenance history.
        context: Asset answers what is being maintained; MaintenanceWorkOrder answers what work is being requested or performed on it.
    - name: maintenancePlan
      target: MaintenancePlan
      cardinality: 0..1
      ownership: reference
      help:
        summary: The plan the work order came from.
        usage: Set for planned maintenance.
        cardinalityMeaning: At most one plan.
        workflowRole: Links recurring work to its policy.
        context: MaintenancePlan defines recurring maintenance policy; the work order represents one executable occurrence of that policy.
    - name: assignee
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person or team responsible for doing the work.
        usage: Assigned by the planner.
        cardinalityMeaning: At most one assignee at a time.
        workflowRole: Gives accountability for execution.
        context: Party supplies identity; its applicable role determines whether it acts as technician, maintenance organization, contractor, or another responsibility type.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the work is done.
        usage: Set when planned.
        cardinalityMeaning: At most one location.
        workflowRole: Helps dispatch.
        context: Location describes where work occurs and is distinct from the Asset being serviced.
    - name: repairEstimate
      target: RepairEstimate
      cardinality: 0..1
      ownership: reference
      help:
        summary: The estimate the work is based on.
        usage: Linked where a quote was approved.
        cardinalityMeaning: At most one estimate.
        workflowRole: Gives the cost baseline.
        context: RepairEstimate evaluates and authorizes the proposed repair decision; MaintenanceWorkOrder executes it. A work order must not be treated as proof that the estimate's predicted amount became actual cost.
    - name: containerMovement
      target: ContainerMovement
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of container movements connected to the repair.
        summary: Links maintenance execution to container movements required to bring a container into repair position, route it between work areas, or return it to operational storage.
        usage: Provides physical execution traceability between maintenance workflow and yard/transport operations.
        context: MaintenanceWorkOrder governs the maintenance activity; ContainerMovement governs physical movement of the container. A movement does not itself mean maintenance has started or completed.
    - {name: serviceOrder, target: ServiceOrder, cardinality: "0..1", ownership: reference, help: {cardinalityMeaning: 'At most one service order, for work done under a customer service agreement.', summary: Service execution order authorizing this maintenance work when maintenance is delivered as a service., businessMeaning: Separates commercial/customer service authorization from technical EAM execution evidence., usage: "Field service, depot repair, costing and audit.", workflowRole: Status changes must reconcile without conflating ServiceOrder and MaintenanceWorkOrder lifecycles.}}

  invariants:
    - {id: MWO-001, rule: COMPLETED status requires completedAt.}
    - {id: MWO-002, rule: completedAt must not precede requestedAt.}
    - {id: MWO-003, rule: IN_PROGRESS requires an identified Asset when the work is asset-specific.}
    - {id: MWO-004, rule: scheduledAt must not precede requestedAt.}
    - {id: MWO-005, rule: "A REPAIR work order created from RepairEstimate must reference an APPROVED, non-CANCELLED estimate with disposition REPAIR."}
    - {id: MWO-006, rule: "A completed REPAIR work order does not by itself change the Asset or Container lifecycle state; the applicable inspection, acceptance, and return-to-service workflow must confirm that transition."}
    - {id: MAINTENANCE-WORK-ORDER-EXE-001, rule: "A maintenance work order that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the maintenance work order is completed."}
  lifecycle:
    states: [OPEN, PLANNED, ASSIGNED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
    initial: OPEN
    terminal:
      - COMPLETED
      - CANCELLED
    transitions:
      - {from: OPEN, to: PLANNED, action: plan}
      - {from: PLANNED, to: ASSIGNED, action: assign}
      - {from: OPEN, to: ASSIGNED, action: assign}
      - {from: ASSIGNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: ASSIGNED, to: ON_HOLD, action: hold}
      - {from: IN_PROGRESS, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: ASSIGNED, action: resume}
      - {from: ON_HOLD, to: IN_PROGRESS, action: resume}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ASSIGNED, to: CANCELLED, action: cancel}
      - {from: ON_HOLD, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
    attribute: status
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a maintenance work order is stopped"
      description: "When a maintenance work order is on hold, a high-priority task asks someone to resolve it."
      when: "status == \"ON_HOLD\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MAINTENANCE-WORK-ORDER-EXCEPTION-{{id}}"
              name: "Resolve maintenance work order {{work_order_number}}"
              description: "Maintenance work order {{work_order_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a maintenance work order is ended"
      description: "When a maintenance work order is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MAINTENANCE-WORK-ORDER-FOLLOW-UP-{{id}}"
              name: "Follow up on maintenance work order {{work_order_number}}"
              description: "Maintenance work order {{work_order_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a maintenance work order is done"
      description: "When a maintenance work order is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MAINTENANCE-WORK-ORDER-COMPLETED-{{id}}"
              name: "Confirm maintenance work order {{work_order_number}}"
              description: "Maintenance work order {{work_order_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: 'A controlled instruction and record for inspecting, maintaining, correcting or repairing an asset: what work is required, who does it, when, and how it was completed.'
    businessMeaning: Maintenance is only effective if it is directed and recorded. The work order is the instruction to a technician and the evidence of what was done, which feeds cost, history and reliability analysis.
    usage: Raised from a request, a plan or a failure; planned and assigned; executed; completed; read by planners, technicians and finance.
    relationshipContext: A work order concerns an Asset, may come from a MaintenancePlan, is assigned to a Party, takes place at a Location, and may be based on a RepairEstimate or relate to a ServiceOrder.
    lifecycle: A work order is opened, planned, assigned and started, and ends completed. It can be put on hold and resumed, or cancelled before completion.
    example: 'Work order 10244: replace the hydraulic hose on forklift FL-07, assigned to a technician, scheduled for Tuesday and completed in two hours.'
    workflowImpact: For a container repair, an approved RepairEstimate with disposition REPAIR may create the MaintenanceWorkOrder. If the container is not already at the repair location, ContainerMovement moves it into the workshop or repair area. Work execution then consumes labor/material resources and produces completion evidence. After acceptance, a subsequent operational workflow may return the container to ACTIVE service and move it to an available YardSlot. None of these downstream facts should be inferred solely from work-order status.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-MAINTENANCE-WORK-ORDER}
