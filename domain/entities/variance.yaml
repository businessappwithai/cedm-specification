entity:
  name: Variance
  namespace: cedm.domain
  kind: financial_analysis
  description: A derived comparison between planned, forecast, or actual financial measures for a defined period and dimensional context.
  ui:
    icon: table
  identity: {key: varianceId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: varianceId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this budget-to-actual comparison, used in reports and commentary.", businessMeaning: Identifies the governed Variance concept independently of labels., usage: "Planning, reporting and integration.", relationshipContext: Referenced by compatible financial planning processes., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, maxLength: 100, help: {summary: "The short reference finance uses to pick out this comparison in reports and reviews.", businessMeaning: Human/integration identifier., usage: Planning and reporting., relationshipContext: Unique within governing context., requiredMeaning: Required.}}
  relationships:
  - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: Governing organization., businessMeaning: Defines management/reporting boundary., usage: Planning and analysis., cardinalityMeaning: Exactly one Organization., workflowRole: References must use compatible organization context.}}
  - {name: budget, target: Budget, cardinality: 0..1, ownership: reference, help: {summary: Budget baseline compared., businessMeaning: Supplies planned value source., usage: Budget-vs-actual analysis., cardinalityMeaning: Optional for forecast-only comparison., workflowRole: Analysis cannot mutate budget.}}
  - {name: forecast, target: Forecast, cardinality: 0..1, ownership: reference, help: {summary: Forecast baseline compared., businessMeaning: Supplies projected value source., usage: Forecast-vs-actual/budget analysis., cardinalityMeaning: Optional., workflowRole: Analysis cannot mutate forecast.}}
  invariants:
  - {id: VARIANCE-001, rule: The record must not directly create or rewrite actual JournalEntry evidence.}
  help: {summary: "A derived comparison between planned, forecast, or actual financial measures for a defined period and dimensional context.", businessMeaning: Provides planning/management semantics separately from actual accounting evidence., usage: "Planning, control, management reporting and analysis.", relationshipContext: "Organization supplies governance; financial transactions remain authoritative for actuals.", workflowContext: "Produced during period-end reporting by comparing actual results with the budget or forecast for an organisation, reviewed by finance and budget owners who explain significant differences, then used to revise forecasts, plan corrective spending and report performance to management.", lifecycle: "Calculated after the period's actuals are available, recalculated if budget, forecast or actual figures change before close, and then kept as the reported comparison for that period; it never changes the underlying ledger.", example: "Variance MKT-Q3 shows the marketing department spent 125,000 against a budget of 100,000 in the third quarter, an unfavourable difference of 25,000 explained by an unplanned trade show."}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-VARIANCE}
