entity:
  name: Variance
  namespace: cedm.domain
  kind: financial_analysis
  description: The difference between two figures for the same measure and period — actual against budget, forecast against budget, this forecast against the last — with its amount, percentage, direction and the explanation management gives.
  ui:
    icon: git-compare
    recordLabel: [code]
  identity: {key: varianceId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: varianceId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the variance record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a variance store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 60
    help:
      summary: The reference of the variance.
      usage: Assigned when it is calculated.
      relationshipContext: Unique.
  - name: measure
    type: string
    required: true
    maxLength: 150
    help:
      summary: What is compared, such as "Travel expenses" or "Revenue".
      usage: Set by the calculation.
      relationshipContext: Usually an account or account group.
  - name: comparisonType
    type: enum
    required: true
    default: ACTUAL_VS_BUDGET
    values: [ACTUAL_VS_BUDGET, ACTUAL_VS_FORECAST, FORECAST_VS_BUDGET, FORECAST_VS_PRIOR]
    help:
      summary: Which two figures are compared.
      usage: Set by the calculation.
      relationshipContext: Decides which figure is the plan.
      valueSemantics:
        ACTUAL_VS_BUDGET: Actual against budget.
        ACTUAL_VS_FORECAST: Actual against the current forecast.
        FORECAST_VS_BUDGET: Forecast against budget.
        FORECAST_VS_PRIOR: This forecast against the previous one.
  - name: periodStart
    type: date
    required: true
    help:
      summary: The first day of the period compared.
      usage: Set by the calculation.
      relationshipContext: Not later than the period end.
  - name: periodEnd
    type: date
    required: true
    help:
      summary: The last day of the period compared.
      usage: Set by the calculation.
      relationshipContext: Not earlier than the period start.
  - name: plannedAmount
    type: Money
    required: true
    help:
      summary: The planned or reference figure.
      usage: From the budget or the earlier forecast.
      relationshipContext: In the variance's currency.
  - name: actualAmount
    type: Money
    required: true
    help:
      summary: The actual or newer figure.
      usage: From the ledger or the newer forecast.
      relationshipContext: In the variance's currency.
  - name: varianceAmount
    type: Money
    required: false
    help:
      summary: Actual minus planned.
      usage: Computed by the calculation.
      relationshipContext: The one amount that may be negative.
  - name: variancePercent
    type: decimal
    required: false
    precision: 9
    scale: 2
    help:
      summary: The variance as a percentage of the planned figure.
      usage: Used to decide whether it needs explaining.
      relationshipContext: Empty when the planned figure is zero.
  - name: isFavourable
    type: boolean
    required: false
    help:
      summary: Whether the difference is good for the business — more revenue or less cost.
      usage: Computed from the measure's nature.
      relationshipContext: Read with the amount.
  - name: explanation
    type: text
    required: false
    help:
      summary: Why the figures differ, in the owner's words.
      usage: Written by the owner; required above the threshold.
      relationshipContext: Read by management.
  - name: status
    type: enum
    required: true
    default: CALCULATED
    values: [CALCULATED, EXPLAINED, REVIEWED, ACCEPTED]
    help:
      summary: Where the variance stands.
      usage: Moved on by the owner and controlling.
      relationshipContext: Only reviewed variances are reported as explained.
      valueSemantics:
        CALCULATED: Computed, waiting for explanation.
        EXPLAINED: The owner has explained it.
        REVIEWED: Controlling has accepted the explanation.
        ACCEPTED: Below the threshold; no explanation needed.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The company or unit compared.
      usage: Set by the calculation.
      cardinalityMeaning: Every variance is for one organization.
      context: Variances roll up the organization hierarchy.
      businessMeaning: The company or unit whose figures are compared.
      workflowRole: Variances of a group's companies roll up into the group's.
  - name: budget
    target: Budget
    cardinality: 0..1
    ownership: reference
    help:
      summary: The budget compared against.
      businessMeaning: Supplies planned value source.
      workflowRole: Analysis cannot mutate budget.
      usage: Set for comparisons with budget.
      cardinalityMeaning: At most one.
      context: The budget line gives the planned figure.
  - name: forecast
    target: Forecast
    cardinality: 0..1
    ownership: reference
    help:
      summary: The forecast compared.
      businessMeaning: Supplies projected value source.
      workflowRole: Analysis cannot mutate forecast.
      usage: Set for comparisons with a forecast.
      cardinalityMeaning: At most one.
      context: The forecast gives one of the figures.
  - name: costCenter
    target: CostCenter
    cardinality: 0..1
    ownership: reference
    help:
      summary: The cost centre compared, when the variance is by cost centre.
      usage: Set by the calculation.
      cardinalityMeaning: At most one.
      context: Its manager explains the variance.
  - name: owner
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person who must explain the variance.
      usage: Usually the cost-centre or budget owner.
      cardinalityMeaning: One per variance.
      context: Receives variances above the threshold.
  - name: currency
    target: Currency
    cardinality: 0..1
    ownership: reference
    help:
      summary: The currency of the amounts.
      usage: The organization's reporting currency.
      cardinalityMeaning: One per variance.
      context: All amounts use it.
  invariants:
  - {id: VARIANCE-001, rule: The period does not end before it starts., violatedWhen: period_end != null and period_start != null and period_end < period_start, message: The period ends before it starts.}
  - {id: VARIANCE-002, rule: An explained or reviewed variance has an explanation., violatedWhen: (status == "EXPLAINED" or status == "REVIEWED") and explanation == null, message: Write the explanation.}
  lifecycle:
    title: Variance Lifecycle
    attribute: status
    states: [CALCULATED, EXPLAINED, REVIEWED, ACCEPTED]
    initial: CALCULATED
    terminal: [REVIEWED, ACCEPTED]
    transitions:
    - {from: CALCULATED, to: EXPLAINED, action: explain}
    - {from: EXPLAINED, to: REVIEWED, action: review}
    - {from: EXPLAINED, to: CALCULATED, action: return}
    - {from: CALCULATED, to: ACCEPTED, action: accept}
  help:
    summary: How far a result differs from plan, and why.
    businessMeaning: Management steers by exceptions. A variance records, for one measure and period, the planned and actual (or forecast) figures, the difference, whether it is favourable, and the owner's explanation, so that significant deviations are explained and acted on rather than just reported.
    usage: Calculated at month end by comparing actuals with budget and forecast; variances above a threshold are sent to their owners for explanation; management reviews the explained variances.
    relationshipContext: A variance compares a Budget (or a Forecast) with actuals for an Organization, optionally for a CostCenter or Account.
    lifecycle: Calculated, then explained by its owner, then reviewed by controlling. Small variances below the threshold are accepted without explanation.
    workflowContext: Month-end reporting, budget control, forecast review.
    example: 'Variance V-2024-06-4100-TRV: cost centre 4100, travel expenses, June 2024: budget 12,000 EUR, actual 18,400 EUR, 6,400 EUR (53%) unfavourable; explanation: customer site visits for the Northwind launch, agreed with the plant director.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-VARIANCE}
