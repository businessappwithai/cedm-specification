entity:
  name: Risk
  namespace: cedm.domain
  kind: governance_entity
  description: A potential event or condition that may affect achievement of business objectives.
  ui:
    icon: alert-triangle
    recordLabel: [code, name]
  identity:
    key: riskId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: riskId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the risk record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a risk store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the risk.
      usage: Used in the risk register and reports.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The risk in a few words.
      usage: Shown in the register.
      relationshipContext: Names the event and its effect.
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: The cause, event and consequences of the risk.
      usage: Read when assessing and treating it.
      relationshipContext: Plain language.
  - name: category
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of risk, such as strategic, operational or financial.
      usage: Groups the register and decides who reviews it.
      relationshipContext: From the organisation's risk categories.
  - name: likelihood
    type: enum
    required: true
    values:
    - RARE
    - UNLIKELY
    - POSSIBLE
    - LIKELY
    - ALMOST_CERTAIN
    help:
      summary: How likely the risk is to happen.
      usage: With impact, gives the risk rating.
      relationshipContext: Assessed before the risk is marked assessed.
      valueSemantics:
        RARE: May happen only in exceptional circumstances.
        UNLIKELY: Could happen but is not expected.
        POSSIBLE: Might happen.
        LIKELY: Will probably happen.
        ALMOST_CERTAIN: Is expected to happen.
  - name: impact
    type: enum
    required: true
    values:
    - INSIGNIFICANT
    - MINOR
    - MODERATE
    - MAJOR
    - SEVERE
    help:
      summary: How serious the consequences would be.
      usage: With likelihood, gives the risk rating.
      relationshipContext: Assessed before the risk is marked assessed.
      valueSemantics:
        INSIGNIFICANT: Negligible effect.
        MINOR: Small, easily absorbed effect.
        MODERATE: Noticeable effect needing management attention.
        MAJOR: Serious effect on objectives.
        SEVERE: Threatens the organisation's objectives or survival.
  - name: status
    type: enum
    required: true
    default: IDENTIFIED
    values:
    - IDENTIFIED
    - ASSESSED
    - MITIGATING
    - ACCEPTED
    - CLOSED
    - MATERIALIZED
    help:
      summary: Where the risk stands.
      usage: Updated by the risk owner.
      relationshipContext: Closed risks stay in the register.
      valueSemantics:
        IDENTIFIED: Recorded; not yet assessed.
        ASSESSED: Likelihood and impact rated.
        MITIGATING: Treatment in progress.
        ACCEPTED: Kept without further treatment.
        CLOSED: No longer applies.
        MATERIALIZED: Has happened.
  relationships:
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person responsible for the risk.
      usage: Assigned when the risk is identified.
      cardinalityMeaning: At most one owner.
      context: Reviews and reports the risk.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation unit the risk belongs to.
      usage: Set when the risk is identified.
      cardinalityMeaning: At most one unit.
      context: Appears in that unit's register.
  - name: controls
    target: Control
    cardinality: 0..*
    ownership: reference
    help:
      summary: Controls that reduce the risk.
      usage: Linked by the risk owner.
      cardinalityMeaning: Any number; a control may address many risks.
      context: Tested by audits.
  - name: treatments
    target: RiskTreatment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Actions planned to reduce the risk.
      usage: Planned and tracked by the risk owner.
      cardinalityMeaning: Any number, kept with the risk.
      context: Line items of the risk.
  invariants:
  - id: RISK-001
    rule: likelihood and impact must be assigned before a risk is ASSESSED.
  lifecycle:
    title: Risk Lifecycle
    attribute: status
    states: [IDENTIFIED, ASSESSED, MITIGATING, ACCEPTED, CLOSED, MATERIALIZED]
    initial: IDENTIFIED
    terminal: [CLOSED]
    transitions:
    - {from: IDENTIFIED, to: ASSESSED, action: assess}
    - {from: ASSESSED, to: MITIGATING, action: mitigate}
    - {from: ASSESSED, to: ACCEPTED, action: accept}
    - {from: MITIGATING, to: ACCEPTED, action: accept}
    - {from: MITIGATING, to: CLOSED, action: close}
    - {from: ACCEPTED, to: CLOSED, action: close}
    - {from: ASSESSED, to: CLOSED, action: close}
    - {from: IDENTIFIED, to: MATERIALIZED, action: materialize}
    - {from: ASSESSED, to: MATERIALIZED, action: materialize}
    - {from: MITIGATING, to: MATERIALIZED, action: materialize}
    - {from: ACCEPTED, to: MATERIALIZED, action: materialize}
    - {from: MATERIALIZED, to: CLOSED, action: close}
  help:
    summary: Something that might happen and would affect the organisation's objectives, recorded so it can be assessed, treated and monitored.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Control, RiskTreatment. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Risk owners record risks with their likelihood and impact, decide how to treat them, link the controls that reduce them, and review them periodically; management reviews the risk register.
    lifecycle: A risk is identified, assessed, then mitigated or accepted; it is closed when it no longer applies, and recorded as materialised if it happens.
    example: Risk R-OPS-014 'Single supplier for lithium cells', operations, likely, major, owner Head of Procurement, mitigating through a second supplier.
    businessMeaning: Managing risks explicitly lets the organisation decide which to reduce, transfer or accept, and shows boards and regulators that it does so.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RISK
