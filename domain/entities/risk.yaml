entity:
  name: Risk
  namespace: cedm.domain
  kind: governance_entity
  description: A potential event or condition that may affect achievement of business objectives.
  ui:
    icon: alert-triangle
  identity:
    key: riskId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: riskId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the risk, constant for its life.
        usage: Generated on creation; controls and treatments refer to it.
        relationshipContext: Referenced by assessments and treatments.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The register code of the risk, such as RSK-021.
        usage: Unique; quoted in reports and audits.
        relationshipContext: Read with the name to identify the risk.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A short phrase naming the potential event, such as supplier insolvency or data centre outage.
        usage: Written by the risk owner when the risk is identified; shown in the risk register and on the heat map.
        relationshipContext: Read by owners and reviewers.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A fuller account of the cause, event and consequence.
        usage: Written when the risk is raised and revised on assessment.
        relationshipContext: Read by the assessor.
    - name: category
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of risk, such as financial, operational or compliance.
        usage: Chosen when raised; the register is grouped by it.
        relationshipContext: Decides which reviewer sees it.
    - name: likelihood
      type: enum
      required: true
      values:
        - RARE
        - UNLIKELY
        - POSSIBLE
        - LIKELY
        - ALMOST_CERTAIN
      help:
        summary: How probable it is that the risk event occurs within the assessment period.
        usage: Chosen at assessment by the risk owner and combined with impact to give the risk rating and its place on the heat map.
        valueSemantics:
          RARE: Expected to occur only in exceptional circumstances.
          UNLIKELY: Could occur but is not expected to.
          POSSIBLE: Might occur at some time.
          LIKELY: Will probably occur, and would not be surprising.
          ALMOST_CERTAIN: Expected to occur in most circumstances.
        relationshipContext: Together with impact gives the risk's exposure.
    - name: impact
      type: enum
      required: true
      values:
        - INSIGNIFICANT
        - MINOR
        - MODERATE
        - MAJOR
        - SEVERE
      help:
        summary: How serious the consequences would be for the business if the risk event occurred.
        usage: Chosen at assessment by the risk owner and combined with likelihood to give the risk rating and its place on the heat map.
        valueSemantics:
          INSIGNIFICANT: Negligible effect that needs no action.
          MINOR: Small effect that is easily absorbed within normal operations.
          MODERATE: Noticeable effect needing management attention to contain.
          MAJOR: Serious effect on the achievement of objectives.
          SEVERE: Threatens the organisation's objectives or survival.
        relationshipContext: Together with likelihood gives the risk's exposure.
    - name: status
      type: enum
      required: true
      default: IDENTIFIED
      values:
        - IDENTIFIED
        - ASSESSED
        - MITIGATING
        - ACCEPTED
        - CLOSED
        - MATERIALIZED
      help:
        summary: Where the risk is in its handling.
        usage: Starts as IDENTIFIED; moved by the owner.
        relationshipContext: Decides whether treatments and reviews are due.
        valueSemantics:
          IDENTIFIED: Recorded, not yet assessed.
          ASSESSED: Likelihood and impact are set.
          MITIGATING: Actions are under way to reduce it.
          ACCEPTED: The remaining exposure is accepted.
          CLOSED: No longer a risk. A final state.
          MATERIALIZED: The risk has occurred. A final state.
  relationships:
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person accountable for managing the risk.
        usage: Chosen when the risk is assessed.
        cardinalityMeaning: At most one owner; empty until assigned.
        context: Names who answers for it.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation the risk affects.
        usage: Chosen when the risk is specific to a unit.
        cardinalityMeaning: At most one organisation.
        context: Groups the risk in the right register.
    - name: controls
      target: Control
      cardinality: 0..*
      ownership: reference
      help:
        summary: The controls that reduce the risk.
        usage: Linked when controls are identified.
        cardinalityMeaning: Any number of controls.
        context: Shows how well the risk is covered.
    - name: treatments
      target: RiskTreatment
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The actions planned to treat the risk.
        usage: Added when a response is decided.
        cardinalityMeaning: Any number of treatments.
        context: Treatments belong to the risk.
  invariants:
    - id: RISK-001
      rule: likelihood and impact must be assigned before a risk is ASSESSED.
  lifecycle:
    title: Risk Lifecycle
    attribute: status
    states: [IDENTIFIED, ASSESSED, MITIGATING, ACCEPTED, CLOSED, MATERIALIZED]
    initial: IDENTIFIED
    terminal:
      - CLOSED
      - MATERIALIZED
    transitions:
      - {from: IDENTIFIED, to: ASSESSED, action: assess}
      - {from: ASSESSED, to: MITIGATING, action: mitigate}
      - {from: ASSESSED, to: ACCEPTED, action: accept}
      - {from: MITIGATING, to: ACCEPTED, action: accept}
      - {from: ACCEPTED, to: CLOSED, action: close}
      - {from: MITIGATING, to: CLOSED, action: close}
      - {from: IDENTIFIED, to: MATERIALIZED, action: materialize}
      - {from: ASSESSED, to: MATERIALIZED, action: materialize}
      - {from: MITIGATING, to: MATERIALIZED, action: materialize}
      - {from: ACCEPTED, to: MATERIALIZED, action: materialize}
  help:
    summary: A potential event or condition that could affect the achievement of business objectives.
    businessMeaning: The risk register lets the organisation name what could go wrong, judge how likely and how serious it is, decide what to do and track it to a close. It supports governance by keeping each risk, its owner and its controls in one place.
    usage: Raised by anyone; assessed and owned by risk or business managers; read by governance and audit.
    relationshipContext: A risk may have an owner and an organisation, is addressed by controls and has treatments.
    lifecycle: A risk is identified, assessed and then mitigated or accepted before it is closed. It may materialise at any point, becoming an incident. Closed and materialised are final.
    example: Risk RSK-021 records that a single supplier provides a critical component; likelihood possible, impact major, mitigated by a second source.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RISK
