entity:
  name: HealthcarePatient
  namespace: cedm.domain
  kind: industry_specialization
  description: A person receiving or eligible to receive healthcare services.
  ui:
    icon: heart-pulse
    recordLabel: [medicalRecordNumber]
  identity:
    key: patientId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: patientId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the healthcare patient record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a healthcare patient store this identifier. The number or code people quote is a separate field.
  - name: partyId
    type: reference
    target: Party
    required: true
    unique: true
    immutable: true
    help:
      summary: The person the patient record belongs to.
      usage: Set at registration.
      relationshipContext: One patient record per person.
  - name: medicalRecordNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number identifying the patient's medical record.
      usage: Printed on wristbands, labels and documents.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - DECEASED
    - MERGED
    help:
      summary: Whether the record is in use.
      usage: Changed by registration and records staff.
      relationshipContext: Deceased and merged records are kept but not used for new care.
      valueSemantics:
        ACTIVE: Receiving care.
        INACTIVE: Not seen recently or transferred elsewhere.
        DECEASED: The patient has died.
        MERGED: A duplicate merged into another record.
  - name: preferredLanguage
    type: locale
    required: false
    help:
      summary: The language the patient prefers to be addressed in.
      usage: Used for letters and to arrange an interpreter.
      relationshipContext: A locale such as it-IT.
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The person who is the patient.
      usage: Set at registration.
      cardinalityMeaning: Exactly one person.
      context: Name, birth date and contact details come from the party.
  - name: encounters
    target: HealthcareEncounter
    cardinality: 0..*
    ownership: reference
    help:
      summary: The patient's visits and stays.
      usage: Listed in the patient's timeline.
      cardinalityMeaning: Any number of encounters.
      context: Each encounter belongs to one patient.
  - name: carePlans
    target: CarePlan
    cardinality: 0..*
    ownership: reference
    help:
      summary: The patient's care plans.
      usage: Opened from the patient record.
      cardinalityMeaning: Any number of care plans.
      context: Each care plan is for one patient.
  - name: allergies
    target: Allergy
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The patient's known allergies.
      usage: Checked before prescribing.
      cardinalityMeaning: Any number, kept with the patient.
      context: Line items of the patient record.
  lifecycle:
    title: Healthcare Patient Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, DECEASED, MERGED]
    initial: ACTIVE
    terminal: [DECEASED, MERGED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: DECEASED, action: record_death}
    - {from: INACTIVE, to: DECEASED, action: record_death}
    - {from: ACTIVE, to: MERGED, action: merge}
    - {from: INACTIVE, to: MERGED, action: merge}
  help:
    summary: Represents a industry specialization called HealthcarePatient within the CEDM business model.
    businessMeaning: HealthcarePatient is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, HealthcareEncounter, CarePlan, Allergy. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Registration staff create the patient record once, linked to the person; clinicians open it to see encounters, care plans and allergies; record managers merge duplicates.
    lifecycle: A patient is active while receiving care and inactive when no longer seen; an active or inactive record becomes deceased on death or merged when found to duplicate another.
    example: Patient MRN 0048812, Maria Costa, preferred language Italian, active, allergy to penicillin.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-PATIENT
