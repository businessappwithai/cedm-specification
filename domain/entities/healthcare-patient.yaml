entity:
  name: HealthcarePatient
  namespace: cedm.domain
  kind: industry_specialization
  description: A person receiving or eligible to receive healthcare services.
  ui:
    icon: heart-pulse
  identity:
    key: patientId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: patientId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the patient record.
        usage: Generated on registration; all clinical records refer to it, so it never changes even if the medical record number is reissued.
    - name: partyId
      type: reference
      target: Party
      required: true
      unique: true
      immutable: true
      help:
        summary: The party record that this patient is.
        usage: Set at registration so the same person is one party across all roles.
    - name: medicalRecordNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number by which the patient's record is known inside the healthcare organisation.
        usage: Allocated at first registration; unique; printed on wristbands and documents and used to find the record.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - DECEASED
        - MERGED
      help:
        valueSemantics:
          ACTIVE: A current patient who receives or is eligible for care.
          INACTIVE: Not currently receiving care; the record is kept and can be reactivated.
          DECEASED: The patient has died; no new care is planned. A final state.
          MERGED: A duplicate record that has been merged into another; use the surviving record. A final state.
        summary: The patient record's standing.
        usage: Set by registration staff and clinical records; new encounters are normally created only for ACTIVE patients.
    - name: preferredLanguage
      type: locale
      required: false
      help:
        summary: The language in which the patient prefers to communicate with the care team.
        usage: Asked at registration; interpreters, letters and portal content follow it.
  relationships:
    - name: party
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The person or party record that is the patient.
        usage: Set at registration and not changed.
        cardinalityMeaning: 'Exactly one party: a patient is a particular person.'
        workflowRole: Keeps identity details in one place across the person's roles.
    - name: encounters
      target: HealthcareEncounter
      cardinality: 0..*
      ownership: reference
      help:
        summary: The encounters in which the patient received care.
        usage: Read to see the patient's history of care.
        cardinalityMeaning: Any number over the patient's life.
        workflowRole: Each encounter adds to the clinical record.
    - name: carePlans
      target: CarePlan
      cardinality: 0..*
      ownership: reference
      help:
        summary: The plans of care drawn up for the patient.
        usage: Read by the care team to coordinate treatment.
        cardinalityMeaning: Any number of plans, one per condition or episode.
        workflowRole: Shared goals and interventions for the patient.
    - name: allergies
      target: Allergy
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The patient's recorded allergies and intolerances.
        usage: Checked whenever a medicine, food or procedure is ordered.
        cardinalityMeaning: Any number, including none.
        workflowRole: A critical safety input to every order.
    - {name: appointments, target: Appointment, cardinality: "0..*", ownership: reference, help: {summary: The appointments booked for the patient., usage: Read by reception and for reminders., cardinalityMeaning: 'Any number of appointments, past and future.', workflowRole: Plan future care and measure attendance., businessMeaning: Preserves planned-care history independently of actual encounters.}}

  lifecycle:
    title: Healthcare Patient Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, DECEASED, MERGED]
    initial: ACTIVE
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: DECEASED, action: record_death}
      - {from: INACTIVE, to: DECEASED, action: record_death}
      - {from: ACTIVE, to: MERGED, action: merge}
      - {from: INACTIVE, to: MERGED, action: merge}
    terminal:
      - DECEASED
      - MERGED
  help:
    summary: A person who receives, or is eligible to receive, healthcare services.
    businessMeaning: 'The patient record is the healthcare view of a person: their medical record number and standing. It is kept separate from the party so that clinical and administrative identity can be managed and protected separately.'
    usage: Created at first registration; updated as the person's standing changes; read by every clinical and administrative process.
    relationshipContext: A patient is a Party and has Encounters, CarePlans, Allergies and Appointments.
    lifecycle: A patient is active, may become inactive when no longer under care, and ends deceased, or merged into another record when duplicates are resolved. A merged record keeps pointing to its survivor.
    example: Patient MRN 00482913, registered at a hospital in 2021 and seen in several encounters since.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-PATIENT
