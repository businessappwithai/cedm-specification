entity:
  name: Crop
  namespace: cedm.domain
  kind: agriculture_master_entity
  description: A crop or cultivated plant category managed within an agricultural operation.
  ui:
    icon: sprout
    recordLabel: [code, name]
  identity:
    key: cropId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: cropId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the crop record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a crop store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the crop.
      usage: Used in planting plans and field records.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name of the crop as the farm knows it.
      usage: Shown in planting and harvest records.
      relationshipContext: Identifies the crop for people.
  - name: cropType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The crop group, such as cereal, oilseed, vegetable or fruit.
      usage: Groups crops in rotation planning and reports.
      relationshipContext: From the farm's list of crop groups.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the crop is grown.
      usage: Changed by the agronomist.
      relationshipContext: Retired crops are not offered for planting.
      valueSemantics:
        ACTIVE: Grown by the operation.
        INACTIVE: Not grown this season.
        RETIRED: No longer grown.
  - name: scientificName
    type: string
    required: false
    maxLength: 150
    help:
      summary: The botanical name, such as Triticum aestivum.
      usage: Used in seed and regulatory records.
      relationshipContext: Genus and species.
  - name: variety
    type: string
    required: false
    maxLength: 100
    help:
      summary: The variety or cultivar grown.
      usage: Recorded for traceability and yield comparison.
      relationshipContext: As on the seed certificate.
  - name: growingDays
    type: integer
    required: false
    help:
      summary: Typical days from sowing to harvest.
      usage: Used to plan sowing and harvest dates.
      relationshipContext: Depends on climate.
  - name: typicalYieldPerHectare
    type: decimal
    required: false
    precision: 10
    scale: 2
    help:
      summary: The usual yield, in tonnes per hectare.
      usage: Used for planning and to judge a season's results.
      relationshipContext: An average over recent seasons.
  relationships:
  - name: farms
    target: Farm
    cardinality: 0..*
    ownership: reference
    help:
      summary: Farms that grow the crop.
      usage: Listed from the crop.
      cardinalityMeaning: Many farms per crop; a farm grows many crops.
      context: A many-to-many relation.
  - name: fields
    target: FarmField
    cardinality: 0..*
    ownership: reference
    help:
      summary: Fields planted with the crop.
      usage: Listed from the crop.
      cardinalityMeaning: Many fields per crop; a field carries different crops over time.
      context: A many-to-many relation.
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: The products the crop is sold as.
      usage: Linked for sales and stock.
      cardinalityMeaning: Many products per crop; a product may come from several crops.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  lifecycle:
    title: Crop Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A plant the farm grows, such as wheat or tomatoes, with the variety and growing characteristics planning relies on.
    relationshipContext: The entity participates in a wider business graph through relationships with Farm, FarmField, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Agronomists maintain the crops the operation grows; fields are planted with them each season; yields, inputs and sales are reported by crop.
    lifecycle: Active while grown; inactive when not grown this season; retired when dropped from the operation. History stays reportable.
    example: Crop WHT-SOFT 'Soft winter wheat', Triticum aestivum, cereal, sown October, harvested July, typical yield 7.5 t/ha.
    businessMeaning: Field planning, input purchases, yield forecasts and sales are organised by crop.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CROP
