entity:
  name: ComplianceRequirement
  namespace: cedm.domain
  kind: governance_requirement
  description: A governed legal, regulatory, contractual, policy, or standards requirement against which enterprise controls and evidence are assessed.
  ui:
    icon: table
  identity: {key: complianceRequirementId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: complianceRequirementId, type: uuid, required: true, immutable: true, help: {summary: The identity of the requirement., usage: Generated on creation; controls and findings refer to the requirement through it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the requirement came into force., usage: Set from the source law or contract; assessments compare evidence to the requirements in force on the assessment date.}}
    - name: reference
      type: string
      required: true
      unique: true
      maxLength: 60
      help:
        summary: The citation of the requirement within its source, such as "GDPR Art. 30(1)" or "ISO 27001 A.5.15".
        usage: Entered when the requirement is recorded; controls and audit findings quote it.
        relationshipContext: Unique across requirements, so the source is part of it.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: A short statement of what the requirement is about.
        usage: Shown in compliance registers, such as "Record of processing activities".
        relationshipContext: Identifies the requirement for people, with the reference.
    - name: requirementText
      type: text
      required: true
      help:
        summary: What the requirement demands, in the words of the source or a faithful summary.
        usage: Read by control owners to design controls that meet it.
        relationshipContext: The source document remains authoritative.
    - name: sourceType
      type: enum
      required: true
      default: REGULATION
      values:
        - LAW
        - REGULATION
        - STANDARD
        - CONTRACT
        - INTERNAL_POLICY
      help:
        summary: What kind of source the requirement comes from.
        usage: Chosen when recording it; regulatory requirements carry legal risk, internal ones do not.
        relationshipContext: Determines who may waive it — nobody inside the company can waive a law.
        valueSemantics:
          LAW: An act of a legislature.
          REGULATION: A rule made by a regulator or under a law.
          STANDARD: A voluntary standard the company has adopted or is certified against.
          CONTRACT: An obligation taken on in a contract with a customer or supplier.
          INTERNAL_POLICY: A rule the company has set for itself.
    - name: sourceName
      type: string
      required: false
      maxLength: 200
      help:
        summary: The name of the law, regulation, standard or contract.
        usage: Such as "Regulation (EU) 2016/679 (GDPR)".
        relationshipContext: Several requirements share one source.
    - name: jurisdiction
      type: string
      required: false
      maxLength: 100
      help:
        summary: Where the requirement applies, such as "European Union" or "State of California".
        usage: Lets the business see which obligations apply to which operations.
        relationshipContext: Empty for standards and contracts that apply wherever the company operates them.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The day the requirement starts to apply.
        usage: Taken from the source; compliance must be in place by then.
        relationshipContext: Must not be later than the end date.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The day the requirement stops applying.
        usage: Set when the source is repealed or replaced.
        relationshipContext: Empty while it applies.
    - name: obligationLevel
      type: enum
      required: true
      default: MANDATORY
      values:
        - MANDATORY
        - RECOMMENDED
        - OPTIONAL
      help:
        valueSemantics:
          MANDATORY: Must be met, so any gap has to be remedied.
          RECOMMENDED: Expected unless there is a documented reason not to.
          OPTIONAL: Good practice the business may choose to follow.
        summary: How binding the requirement is.
        usage: Decides how a gap is treated — a mandatory gap must be remedied, a recommended one may be accepted.
        relationshipContext: Read with the risk rating.
    - name: riskRating
      type: enum
      required: false
      default: MEDIUM
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        valueSemantics:
          LOW: Minor consequences if the requirement is missed.
          MEDIUM: Noticeable penalties or harm.
          HIGH: Heavy penalties, legal action or serious harm.
          CRITICAL: Could stop the business or cause severe harm.
        summary: How serious it would be to fail the requirement.
        usage: Used to prioritize control testing and remediation.
        relationshipContext: Reflects fines, legal exposure and harm to customers.
    - name: status
      type: enum
      required: true
      default: IDENTIFIED
      values:
        - IDENTIFIED
        - ACTIVE
        - NOT_APPLICABLE
        - RETIRED
      help:
        summary: Whether the requirement currently applies to the business.
        usage: Moved on by the compliance team after assessment.
        relationshipContext: Only active requirements need working controls.
        valueSemantics:
          IDENTIFIED: Recorded and being assessed for applicability.
          ACTIVE: Applies to the business and must be met.
          NOT_APPLICABLE: Assessed as not applying, with the reason recorded.
          RETIRED: No longer applies because the source was repealed or replaced.
    - name: applicabilityNote
      type: text
      required: false
      help:
        summary: Why the requirement does or does not apply, and to which parts of the business.
        usage: Written after the applicability assessment; required when marking it not applicable.
        relationshipContext: Regulators may ask for this reasoning.
  relationships:
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person accountable for meeting the requirement.
        usage: Assigned when it becomes active; receives assessment results and gaps.
        cardinalityMeaning: One owner per requirement.
        context: Usually the head of the function the requirement affects.
    - name: policy
      target: Policy
      cardinality: 0..1
      ownership: reference
      help:
        summary: The internal policy that restates the requirement for staff.
        usage: Linked when a policy implements the requirement.
        cardinalityMeaning: At most one policy per requirement.
        context: The policy is how the requirement reaches the people who must follow it.
  invariants:
    - {id: COMPLIANCE-REQUIREMENT-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
    - {id: COMPLIANCE-REQUIREMENT-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  help:
    summary: A legal, regulatory, contractual, policy or standards requirement against which controls and evidence are assessed.
    businessMeaning: Compliance starts from a clear statement of what must be true. Holding each requirement as a record lets controls, evidence and audits point at the exact obligation they satisfy, and show what applied when.
    usage: Entered by compliance officers when a law, standard or contract imposes an obligation; read when controls are designed and when evidence is reviewed.
    relationshipContext: Controls, evidence and audit cases reference the requirement they address.
    lifecycle: Finalised evidence and effective history are preserved. A changed rule is recorded as a superseding requirement, not by silently editing the old one.
    example: The requirement to retain customer payment records for seven years, derived from a financial regulation and assessed through a retention control.
  lifecycle:
    title: Compliance Requirement Lifecycle
    attribute: status
    states:
      - IDENTIFIED
      - ACTIVE
      - NOT_APPLICABLE
      - RETIRED
    initial: IDENTIFIED
    terminal:
      - RETIRED
    transitions:
      - from: IDENTIFIED
        to: ACTIVE
        action: activate
      - from: IDENTIFIED
        to: NOT_APPLICABLE
        action: mark_not_applicable
      - from: NOT_APPLICABLE
        to: ACTIVE
        action: activate
      - from: ACTIVE
        to: RETIRED
        action: retire
      - from: NOT_APPLICABLE
        to: RETIRED
        action: retire
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-COMPLIANCE-REQUIREMENT}
