entity:
  name: ProjectCost
  namespace: cedm.domain
  kind: project_cost_transaction
  description: A governed cost attribution to a Project, preserving operational cost evidence separately from accounting posting while allowing reconciliation to financial records.
  ui: {icon: receipt-text}
  identity: {key: projectCostId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: projectCostId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference that links this project cost to its source document and accounting entry.", businessMeaning: Identifies one cost attribution independently of later posting or correction., usage: "Project control, billing, accounting reconciliation and audit.", relationshipContext: Remains stable across lifecycle transitions and correction evidence., requiredMeaning: Required.}}
    - {name: costNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: "The reference project and finance staff quote when tracing or querying this particular project cost.", businessMeaning: Operational identifier for tracing cost evidence., usage: "Search, approval, reporting, reconciliation and integration.", relationshipContext: Distinct from JournalEntry or Invoice references., requiredMeaning: Required.}}
    - name: costType
      type: enum
      required: true
      values: [LABOR, MATERIAL, EXPENSE, SERVICE, OVERHEAD, OTHER]
      help:
        summary: "Says what kind of cost this is: labour, material, expense, service, overhead or other."
        businessMeaning: Explains the operational source of project cost without replacing accounting classification.
        usage: Project reporting, profitability, budgeting and analysis.
        relationshipContext: Accounting treatment is represented by linked journal evidence when posted.
        valueSemantics:
          LABOR: Employee or contractor effort.
          MATERIAL: Materials or inventory consumed.
          EXPENSE: Reimbursable or operational expense.
          SERVICE: Purchased or internal service cost.
          OVERHEAD: Allocated indirect cost.
          OTHER: Governed cost outside the standard categories.
        requiredMeaning: Required.
    - {name: amount, type: decimal, required: true, precision: 20, scale: 4, help: {summary: "How much money this cost adds to the project's spending, in the cost's currency.", businessMeaning: Operational project cost value before or alongside accounting posting., usage: "Budget control, project margin, billing and reconciliation.", relationshipContext: Currency is supplied by the required Currency relationship., requiredMeaning: Required.}}
    - {name: incurredDate, type: date, required: true, help: {summary: Date on which the project cost was economically incurred., businessMeaning: Establishes project-period attribution independently of accounting posting date., usage: "Project reporting, accrual analysis and budget control.", relationshipContext: May differ from JournalEntry posting date or Invoice date., requiredMeaning: Required.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, POSTED, REVERSED, CANCELLED]
      help:
        summary: "Shows whether the cost is drafted, approved, posted to the accounts, reversed or cancelled."
        businessMeaning: Distinguishes preparation, approval, accounting reconciliation and corrective states.
        usage: Workflow control, project reporting and audit.
        relationshipContext: POSTED normally requires attributable accounting evidence; reversal does not delete the original cost.
        valueSemantics:
          DRAFT: Cost is being prepared.
          APPROVED: Operational attribution has been approved.
          POSTED: Accounting recognition has been reconciled.
          REVERSED: Subsequent governed evidence reversed the economic effect.
          CANCELLED: Draft or unposted cost was cancelled and remains auditable.
        requiredMeaning: Required.
  relationships:
    - {name: project, target: Project, cardinality: "1", ownership: reference, help: {summary: Project receiving the cost attribution., businessMeaning: Establishes the accountable project context., usage: "Project control, margin and reporting.", cardinalityMeaning: Exactly one Project., workflowRole: Project status must permit new cost attribution.}}
    - {name: projectTask, target: ProjectTask, cardinality: "0..1", ownership: reference, help: {summary: Task receiving the cost when task-level costing applies., businessMeaning: Refines project cost to work-breakdown execution., usage: "Task costing, earned value and analysis.", cardinalityMeaning: Optional for project-level cost., workflowRole: Task must belong to the same Project.}}
    - {name: currency, target: Currency, cardinality: "1", ownership: reference, help: {summary: Currency of the amount., businessMeaning: Makes monetary value unambiguous., usage: "Reporting, conversion and accounting reconciliation.", cardinalityMeaning: Exactly one Currency., workflowRole: Conversion policy remains separate from immutable source amount.}}
    - {name: timesheet, target: Timesheet, cardinality: "0..1", ownership: reference, help: {summary: Timesheet evidence when cost represents labor time., businessMeaning: Connects approved time reporting to labor cost attribution., usage: Labor costing and audit., cardinalityMeaning: Optional outside labor-derived cost., workflowRole: Timesheet lifecycle must support the attributed labor evidence.}}
    - {name: invoiceLine, target: InvoiceLine, cardinality: "0..1", ownership: reference, help: {summary: Invoice line serving as commercial source or recharge evidence., businessMeaning: Connects project costing to supplier or customer billing., usage: "Cost recovery, AP/AR reconciliation and audit.", cardinalityMeaning: Optional when not invoice-derived., workflowRole: Amount semantics reconcile under policy rather than requiring identical values.}}
    - {name: journalEntryLine, target: JournalEntryLine, cardinality: "0..1", ownership: reference, help: {summary: Accounting line recognizing this project cost when posted., businessMeaning: Keeps project costing separate from ledger evidence while enabling reconciliation., usage: "Financial accounting and audit.", cardinalityMeaning: Optional before posting or when posting is aggregated., workflowRole: POSTED requires attributable accounting evidence under posting policy.}}
  invariants:
    - {id: PROJECT-COST-001, rule: "amount must not be zero; negative amounts require governed credit, reversal or correction semantics."}
    - {id: PROJECT-COST-002, rule: projectTask must belong to project whenever projectTask is supplied.}
    - {id: PROJECT-COST-003, rule: POSTED cost is historical evidence and cannot be destructively edited; corrections use reversal or follow-up evidence.}
    - {id: PROJECT-COST-004, rule: Repeated posting or import of the same external cost evidence must be idempotent.}
  lifecycle:
    title: Project Cost Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, POSTED, REVERSED, CANCELLED]
    initial: DRAFT
    terminal: [REVERSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: POSTED, action: post}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: POSTED, to: REVERSED, action: reverse}
  help:
    summary: "One cost charged to a project, such as approved timesheet hours, purchased materials or a travel expense, kept so project managers can track spending against budget before and after it reaches the accounts."
    businessMeaning: ProjectCost answers what economic cost belongs to a Project and optionally a ProjectTask. JournalEntryLine remains the accounting record.
    usage: Project accounting, professional services, budgeting, profitability, billing, financial reconciliation and audit.
    relationshipContext: Project is mandatory; ProjectTask, Timesheet and InvoiceLine explain origin; Currency defines monetary semantics; JournalEntryLine provides posting evidence.
    lifecycle: Costs are prepared, approved, posted and retained; posted costs are corrected through reversal evidence rather than destructive history edits.
    example: An approved Timesheet generates a labor ProjectCost and later accounting reconciles it to a JournalEntryLine.
    workflowContext: "A cost is drafted from a timesheet, supplier invoice line or expense against the project and task, the project manager approves it, finance posts it to the accounts and links the journal line, and a posted cost found to be wrong is reversed; a draft or approved cost can be cancelled instead."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROJECT-COST}
