entity:
  name: InsurancePolicy
  namespace: cedm.domain
  kind: insurance_entity
  description: A contract providing defined insurance coverage in exchange for premium obligations.
  ui:
    icon: shield
    recordLabel: [policyNumber, policyType]
  identity:
    key: insurancePolicyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: insurancePolicyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the insurance policy record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a insurance policy store this identifier. The number or code people quote is a separate field.
  - name: policyNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the policy.
      usage: Quoted on claims, invoices and certificates.
      relationshipContext: Unique.
  - name: policyType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The line of insurance, such as home, motor or liability.
      usage: Decides the coverage terms and underwriting rules.
      relationshipContext: From the insurer's products.
  - name: effectiveFrom
    type: date
    required: true
    help:
      summary: The first day of cover.
      usage: Losses before it are not covered.
      relationshipContext: Not after the end of cover.
  - name: effectiveTo
    type: date
    required: true
    help:
      summary: The last day of cover.
      usage: The policy expires after it unless renewed.
      relationshipContext: Not before the start of cover.
  - name: premium
    type: money
    required: false
    help:
      summary: The price of the cover for the term.
      usage: Invoiced to the policyholder.
      relationshipContext: Not negative.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - QUOTED
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    - CANCELLED
    help:
      summary: Whether the policy is in force.
      usage: Changed by policy administration.
      relationshipContext: Only active policies cover new losses.
      valueSemantics:
        QUOTED: Offered; not yet accepted.
        ACTIVE: In force.
        SUSPENDED: Cover temporarily stopped, for example for unpaid premium.
        EXPIRED: Reached the end of its term.
        CANCELLED: Ended early.
  relationships:
  - name: insurer
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The insurance company bearing the risk.
      usage: Set when the policy is quoted.
      cardinalityMeaning: Each policy has one insurer.
      context: Claims are paid by the insurer.
  - name: policyholders
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties who hold the policy.
      usage: Set when quoting.
      cardinalityMeaning: One or more policyholders; a party may hold many policies.
      context: Policyholders pay the premium and may claim.
    inverseCardinality: 0..*
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: The contract the policy is issued under, if any.
      usage: Linked for group or framework policies.
      cardinalityMeaning: At most one contract.
      context: The contract's terms apply.
  - name: claims
    target: InsuranceClaim
    cardinality: 0..*
    ownership: reference
    help:
      summary: Claims made under the policy.
      usage: Listed on the policy.
      cardinalityMeaning: Any number of claims.
      context: Each claim is under one policy.
  invariants:
  - {id: INSURANCE-POLICY-001, rule: Cover ends on or after the day it starts., violatedWhen: effective_to < effective_from, message: The end of cover cannot be before its start.}
  - {id: INSURANCE-POLICY-002, rule: A policy has at least one policyholder.}
  - {id: INSURANCE-POLICY-003, rule: The premium is not negative., violatedWhen: premium != null and premium < 0, message: The premium cannot be negative.}
  - {id: INSURANCE-POLICY-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Insurance Policy Lifecycle
    attribute: status
    states: [QUOTED, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
    initial: QUOTED
    terminal: [EXPIRED, CANCELLED]
    transitions:
    - {from: QUOTED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: SUSPENDED, to: EXPIRED, action: expire}
    - {from: QUOTED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when an insurance policy is ended"
    description: "When an insurance policy is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "INSURANCE-POLICY-FOLLOW-UP-{{id}}"
          name: "Follow up on insurance policy {{policy_number}}"
          description: "Insurance policy {{policy_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: An insurance contract that covers stated risks for a period in return for a premium.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Contract, InsuranceClaim. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Underwriters quote and issue policies with their coverage period and premium; policy administrators suspend, renew or cancel them; claims handlers check coverage against them.
    lifecycle: A policy is quoted, then active once accepted; it may be suspended and reinstated, ends by expiring at the end of its term, or is cancelled.
    example: Policy HOME-778812, home insurance by Allianz for Marco Bianchi, 1 January–31 December 2024, premium 640 EUR a year, active.
    businessMeaning: Policies define what the insurer must pay and what premium it earns; claims are checked against them.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-INSURANCE-POLICY
