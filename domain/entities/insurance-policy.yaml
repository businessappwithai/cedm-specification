entity:
  name: InsurancePolicy
  namespace: cedm.domain
  kind: insurance_entity
  description: A contract providing defined insurance coverage in exchange for premium obligations.
  ui:
    icon: shield
  identity:
    key: insurancePolicyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: insurancePolicyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the insurance policy record associated with this InsurancePolicy. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for the policy, keeping claims, coverages and premiums attached across renewals and endorsements."
  - name: policyNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of policy number for the InsurancePolicy. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The number the policyholder and the insurer's staff quote when asking about cover, paying premiums or making a claim."
  - name: policyType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of policy type for the InsurancePolicy. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The line of insurance, such as motor, home, life or liability, which decides which coverages, rules and claims handling apply."
  - name: effectiveFrom
    type: date
    required: true
    help:
      summary: Captures the business meaning of effective from for the InsurancePolicy. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The first day the insured is covered; a loss before this date is not covered by the policy."
  - name: effectiveTo
    type: date
    required: true
    help:
      summary: Captures the business meaning of effective to for the InsurancePolicy. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The last day of cover, after which claims are not accepted unless the policy is renewed; it cannot be earlier than the start date."
  - name: premium
    type: money
    required: false
    help:
      summary: Captures the business meaning of premium for the InsurancePolicy. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The price the policyholder pays for the cover, which drives premium billing and the insurer's revenue."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - QUOTED
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsurancePolicy records, where
        applicable.
      relationshipContext: Its meaning is specific to InsurancePolicy; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        QUOTED: Represents the quoted state or classification in the context of InsurancePolicy.
        ACTIVE: Represents the active state or classification in the context of InsurancePolicy.
        SUSPENDED: Represents the suspended state or classification in the context of InsurancePolicy.
        EXPIRED: Represents the expired state or classification in the context of InsurancePolicy.
        CANCELLED: Represents the cancelled state or classification in the context of InsurancePolicy.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the policy currently provides cover: only ACTIVE policies pay claims, QUOTED ones are offers not yet taken up, SUSPENDED ones are paused, and EXPIRED or CANCELLED ones have ended."
  relationships:
  - name: insurer
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects InsurancePolicy to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a InsurancePolicy.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: policyholders
    target: Party
    cardinality: 1..*
    ownership: reference
    help:
      summary: Connects InsurancePolicy to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a InsurancePolicy.
      cardinalityMeaning: The declared cardinality 1..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects InsurancePolicy to Contract so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Contract records associated with a InsurancePolicy.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: claims
    target: InsuranceClaim
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects InsurancePolicy to InsuranceClaim so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about InsuranceClaim records associated with a InsurancePolicy.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: coverages, target: Coverage, cardinality: "0..*", ownership: aggregate, help: {summary: Coverage components defining insured benefits and risks under this Policy., businessMeaning: "Separates policy header from specific limits, deductibles and benefit scope.", usage: "Policy administration, underwriting and claims.", cardinalityMeaning: Zero or many Coverage records., workflowRole: Historical claim decisions retain the Coverage terms applied at loss time.}}
  - {name: insuredParties, target: InsuredParty, cardinality: "0..*", ownership: aggregate, help: {summary: Party-policy relationships covered under this Policy., businessMeaning: "Identifies insured, beneficiary or dependent roles without duplicating Party identity.", usage: "Eligibility, servicing and claims.", cardinalityMeaning: Zero or many InsuredParty records., workflowRole: Claim eligibility must reconcile to role and effective coverage.}}
  - {name: premiums, target: Premium, cardinality: "0..*", ownership: aggregate, help: {summary: Premium obligations assessed under this Policy., businessMeaning: Separates policy contract from billing installments and settlement., usage: "Billing, collections and policy servicing.", cardinalityMeaning: Zero or many Premium records., workflowRole: Premium changes use new governed obligations rather than rewriting billed history.}}
  - {name: underwritingEvaluations, target: Underwriting, cardinality: "0..*", ownership: reference, help: {summary: Underwriting decisions supporting issuance or renewal of this Policy., businessMeaning: Preserves risk-decision provenance behind policy terms., usage: "Issuance, renewal, risk governance and audit.", cardinalityMeaning: Zero or many evaluations over policy lifecycle., workflowRole: Issued or renewed terms must reconcile to approved underwriting evidence.}}

  invariants:
  - id: INSURANCE-POLICY-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: INSURANCE-POLICY-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Insurance Policy Lifecycle
    attribute: status
    states: [QUOTED, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
    initial: QUOTED
    terminal: [EXPIRED, CANCELLED]
    transitions:
      - {from: QUOTED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: QUOTED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a insurance policy is ended"
      description: "When a insurance policy is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INSURANCE-POLICY-FOLLOW-UP-{{id}}"
              name: "Follow up on insurance policy {{policy_number}}"
              description: "Insurance policy {{policy_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One insurance policy issued by an insurer to one or more policyholders, recording its type, cover period and premium so coverage, claims and premium billing can be managed against it."
    businessMeaning: InsurancePolicy is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate InsurancePolicy records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party,
      Contract, InsuranceClaim. These relationships provide the context needed to interpret the record rather than treating
      its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical InsurancePolicy record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "A policy starts as a quote, is activated when the policyholder accepts and pays, underwriting and coverages are attached, premiums are billed and claims are made during its term, it may be suspended and resumed, and it ends as expired at the end of the term or cancelled early."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-INSURANCE-POLICY
