entity:
  name: YardBay
  namespace: cedm.domain
  kind: logistics_location
  description: A longitudinal storage lane within a yard block, used to organize a sequence of vertical stack positions for containers.
  identity:
    key: yardBayId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: yardBayId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable identity of the yard bay.
        businessMeaning: Identifies one longitudinal storage lane within a specific yard block.
        usage: Used by yard addressing, capacity planning, movement instructions, and digital-yard visualization.
        relationshipContext: The bay inherits its facility and block context from YardBlock and provides the parent for YardTier positions.
        requiredMeaning: Required because every modeled bay must be uniquely addressable.
    - name: code
      type: string
      required: true
      maxLength: 50
      help:
        summary: The operational code used to identify the bay.
        businessMeaning: Provides the human-facing bay address used by yard operators, equipment systems, and reports.
        usage: Used in move instructions, searches, yard maps, and slot addressing.
        relationshipContext: The code is interpreted within the parent YardBlock and should be unique within that block.
        requiredMeaning: Required for deterministic operational addressing.
    - name: bayNumber
      type: integer
      required: true
      minimum: 1
      help:
        summary: The ordinal bay number within its parent yard block.
        businessMeaning: Defines the bay's position in the block's longitudinal addressing scheme.
        usage: Used for sorting, navigation, slot-code construction, visualization, and move planning.
        relationshipContext: Uniqueness is scoped to the parent block; bayNumber alone is not a globally unique address.
        requiredMeaning: Required to support deterministic bay ordering and addressing.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, BLOCKED, CLOSED]
      help:
        summary: The operational availability of the bay and its subordinate storage positions.
        businessMeaning: Determines whether the bay can normally participate in container placement and retrieval.
        usage: Used to exclude unavailable lanes from allocation and movement planning.
        relationshipContext: Bay status can override the availability of individual tiers and slots beneath it.
        valueSemantics:
          ACTIVE: The bay is available subject to subordinate slot constraints.
          BLOCKED: The bay is temporarily unavailable for normal operations.
          CLOSED: The bay is unavailable for normal operations until explicitly reopened or reconfigured.
        requiredMeaning: Required because bay availability affects all positions beneath it.
  relationships:
    - name: block
      target: YardBlock
      cardinality: '1'
      ownership: reference
      help:
        summary: Places the bay within its parent yard block.
        usage: Used to resolve the bay's facility, addressing scope, capacity, and operating rules.
        cardinalityMeaning: Every bay belongs to exactly one block.
        context: The block provides the scope in which bayNumber and code are interpreted.
    - name: tiers
      target: YardTier
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: Defines the vertical stack levels available within the bay.
        usage: Used to navigate from longitudinal bay position to vertical storage positions and calculate stacking capacity.
        cardinalityMeaning: A modeled bay contains one or more tiers.
        context: Tier numbers are scoped to the bay and together with bay and block identifiers form part of the physical storage address.
  invariants:
    - id: YARD-BAY-001
      rule: bayNumber must be unique within a block.
  help:
    summary: Represents a longitudinal storage lane inside a container-yard block.
    businessMeaning: YardBay provides the second physical addressing level below the block. It organizes a line of stacking positions and is central to yard capacity and movement planning.
    usage: Used for slot generation, capacity analysis, placement strategy, rehandling planning, operator navigation, and digital visualization.
    relationshipContext: YardBay belongs to YardBlock and contains YardTier records. Together with the parent block and child tier, it identifies where a container can be stacked.
    lifecycle: Bay availability changes when the lane is operational, blocked, or closed. Restricting a bay should account for containers already positioned in its tiers.
    example: Block B03 contains Bay 12. Bay 12 has tiers 1 through 5, each providing positions for containers according to the yard's stacking rules.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-YARD-BAY
