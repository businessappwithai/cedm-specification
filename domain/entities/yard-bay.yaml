entity:
  name: YardBay
  namespace: cedm.domain
  kind: logistics_location
  description: A longitudinal storage lane within a YardBlock that groups the vertical stack positions used to store containers and provides an intermediate planning level between the block and an individual YardSlot.
  ui:
    icon: table
  identity:
    key: yardBayId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: yardBayId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the yard bay record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a yard bay store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: The code of the bay, such as A-12.
      businessMeaning: Provides the human-facing bay address used by operators, terminal systems, equipment instructions, maps, reports, and integrations.
      requiredMeaning: Required for deterministic operational addressing.
      usage: Painted on the ground and used in container positions.
      relationshipContext: Unique within its block.
  - name: bayNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: The position of the bay along its block.
      businessMeaning: Represents the bay's longitudinal sequence in the block's physical addressing scheme.
      requiredMeaning: Required to provide deterministic physical ordering.
      usage: Gives crane and straddle carriers their target.
      relationshipContext: Counted from the block's reference end.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, BLOCKED, CLOSED]
    help:
      summary: Whether containers may be placed in the bay.
      businessMeaning: Determines whether the bay can normally participate in container placement, retrieval, relocation, and planning.
      requiredMeaning: Required because bay availability affects all subordinate storage positions.
      usage: Changed when the bay is blocked or closed.
      relationshipContext: Blocked bays are skipped by planning.
      valueSemantics:
        ACTIVE: In use.
        BLOCKED: Temporarily unusable.
        CLOSED: Permanently out of use.
  - name: maxTiers
    type: integer
    required: false
    help:
      summary: How many containers may be stacked in the bay.
      usage: Limits the stack height the planners use.
      relationshipContext: Set by ground strength and equipment reach.
  - name: reeferPlugs
    type: integer
    required: true
    default: 0
    help:
      summary: How many refrigerated-container power points the bay has.
      usage: Reefer containers are placed only where a plug is free.
      relationshipContext: Zero for bays without power.
  relationships:
  - name: block
    target: YardBlock
    cardinality: '1'
    ownership: reference
    help:
      summary: The yard block the bay belongs to.
      usage: Set when the yard layout is defined.
      cardinalityMeaning: Every bay belongs to exactly one block.
      context: The block's handling rules apply to it.
  - name: tiers
    target: YardTier
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The stacking levels of the bay.
      usage: Defined with the yard layout.
      cardinalityMeaning: A bay has at least one tier.
      context: Each tier belongs to one bay.
  invariants:
  - id: YARD-BAY-001
    rule: bayNumber must be unique within its YardBlock.
  - id: YARD-BAY-002
    rule: A BLOCKED or CLOSED bay must not receive new normal container placement allocations unless an explicit exception process permits them.
  - id: YARD-BAY-003
    rule: Changing bay status must not silently remove or invalidate containers already assigned to subordinate slots; required relocation must be represented by explicit ContainerMovement records.
  - id: YARD-BAY-004
    rule: The complete physical address of a container position must be resolved through YardBlock, YardBay, YardTier, and YardSlot rather than bayNumber alone.
  lifecycle:
    title: Yard Bay Lifecycle
    attribute: status
    states: [ACTIVE, BLOCKED, CLOSED]
    initial: ACTIVE
    terminal: [CLOSED]
    transitions:
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: ACTIVE, to: BLOCKED, action: block}
    - {from: BLOCKED, to: ACTIVE, action: unblock}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a yard bay is stopped"
    description: "When a yard bay is blocked, a high-priority task asks someone to resolve it."
    when: "status == \"BLOCKED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "YARD-BAY-EXCEPTION-{{id}}"
          name: "Resolve yard bay {{code}}"
          description: "Yard bay {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  help:
    summary: Represents the longitudinal storage lane between a yard block and the vertical stacking levels used for container storage.
    businessMeaning: YardBay is a physical and operational addressing level. It groups a sequence of vertically stacked positions and provides a useful unit for capacity planning, traffic analysis, container allocation, and rehandling optimization.
    usage: Used by yard management, gate and dispatch operations, storage allocation, capacity planning, digital-twin visualization, equipment routing, and container movement optimization.
    relationshipContext: The physical hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. Yard identifies the facility; YardBlock defines a major storage area; YardBay defines the longitudinal lane; YardTier defines vertical level; YardSlot identifies the atomic physical position. Container records the equipment being stored, while ContainerMovement records changes in its physical position.
    operationalSemantics: A bay is not itself a container position. It is a collection of stack levels and slots. Allocation algorithms can use bay-level characteristics such as distance to gate, crane/equipment access, traffic pattern, container class, expected dwell time, and rehandle risk before selecting a precise slot.
    lifecycle: A bay may be configured, activated, temporarily blocked, or closed. Blocking or closing a bay prevents new normal placements but does not erase current occupancy. Existing containers may require controlled relocation, and each relocation should produce an auditable ContainerMovement event.
    optimizationContext: Bay is a natural optimization unit for balancing yard density, reducing travel distance, minimizing rehandles, grouping containers by destination or dwell profile, and managing equipment workload. A good placement decision evaluates bay-level cost together with tier/slot availability, stack compatibility, container dimensions, weight, hazardous status, reefer requirements, appointment/dispatch timing, and future retrieval priority.
    example: Block B03 contains Bay 12. Bay 12 has five tiers and multiple atomic slots. A container arriving at the depot is evaluated against Bay 12's access, capacity, compatibility, and future retrieval cost before a precise YardSlot is selected. If Bay 12 becomes blocked for maintenance, existing containers remain associated with their slots while new placements are prevented until the block is resolved.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-YARD-BAY
