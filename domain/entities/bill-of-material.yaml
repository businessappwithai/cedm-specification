entity:
  name: BillOfMaterial
  namespace: cedm.domain
  kind: manufacturing_master_entity
  description: A structured definition of components, quantities, and relationships required to produce or assemble a product.
  ui:
    icon: database
  identity:
    key: billOfMaterialId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: billOfMaterialId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the bill of material record associated with this BillOfMaterial. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one product structure version; work orders, costings and component lines point at it, so it stays the same even if the code or dates are edited."
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference engineers and planners use to find and discuss the structure, such as BOM-PUMP-200, and to exchange it with design and planning systems."
  - name: version
    type: string
    required: true
    default: '1.0'
    maxLength: 30
    help:
      summary: Captures the business meaning of version for the BillOfMaterial. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which revision of the product's recipe this is; production and costing must know the exact revision used, so a change in components creates a new version rather than altering an old one."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - OBSOLETE
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of BillOfMaterial.
        ACTIVE: Represents the active state or classification in the context of BillOfMaterial.
        OBSOLETE: Represents the obsolete state or classification in the context of BillOfMaterial.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the structure may be used: DRAFT is still being prepared and cannot drive production, ACTIVE is approved for planning and work orders, and OBSOLETE is kept only for history."
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective from for the BillOfMaterial. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The first date on which planning and production should use this structure, letting engineering release a change in advance of the day it takes effect."
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective to for the BillOfMaterial. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BillOfMaterial records, where
        applicable.
      relationshipContext: Its meaning is specific to BillOfMaterial; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last date the structure applies; after it, planning switches to the next version, while work orders already made against this one keep their history."
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects BillOfMaterial to Product so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Product records associated with a BillOfMaterial.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: components
    target: BOMComponent
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: Connects BillOfMaterial to BOMComponent so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about BOMComponent records associated with a BillOfMaterial.
      cardinalityMeaning: The declared cardinality 1..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: BOM-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: BILL-OF-MATERIAL-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Bill Of Material Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, OBSOLETE]
    initial: DRAFT
    terminal: [OBSOLETE]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: DRAFT, to: OBSOLETE, action: mark_obsolete}
      - {from: ACTIVE, to: OBSOLETE, action: mark_obsolete}
  help:
    summary: "The recipe for making or assembling one product: which components go into it and in what quantities, kept so production, costing and purchasing all work from the same approved structure."
    businessMeaning: BillOfMaterial is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate BillOfMaterial records.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, BOMComponent.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical BillOfMaterial record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "Engineering drafts the structure and its component lines, it is released as ACTIVE for an effective date range, planning and work orders use it to calculate component demand and material issues, and it is made OBSOLETE when a new version replaces it or the product is discontinued."
specification:
