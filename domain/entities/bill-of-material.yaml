entity:
  name: BillOfMaterial
  namespace: cedm.domain
  kind: manufacturing_master_entity
  description: A structured definition of components, quantities, and relationships required to produce or assemble a product.
  ui:
    icon: database
    recordLabel: [code, bomVersion]
  identity:
    key: billOfMaterialId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: billOfMaterialId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the bill of material record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a bill of material store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the bill of materials, usually the product code it builds.
      usage: Production orders and planning refer to it.
      relationshipContext: Unique together with the version.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - OBSOLETE
    help:
      summary: Whether the bill of materials may be used for production.
      usage: Moved on by product engineering.
      relationshipContext: Only active bills are exploded by planning.
      valueSemantics:
        DRAFT: Being designed.
        ACTIVE: Released for production.
        OBSOLETE: Replaced or no longer used.
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: The first day the bill may be used.
      usage: Lets a design change take effect on a planned date.
      relationshipContext: Not later than the effective-to date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day the bill may be used.
      usage: Set when a new version takes over.
      relationshipContext: Empty while in use.
  - name: bomVersion
    type: string
    required: true
    maxLength: 20
    default: 1
    help:
      summary: The version of the bill of materials.
      usage: A new version is created when the design changes; orders keep the version they used.
      relationshipContext: Only one version is active at a time.
  - name: baseQuantity
    type: decimal
    required: true
    precision: 18
    scale: 4
    default: 1
    help:
      summary: The quantity of the product the component quantities are for.
      usage: Usually 1; larger for products made in batches.
      relationshipContext: In the product's unit of measure.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product the bill builds.
      usage: Set when the bill is created.
      cardinalityMeaning: Every bill builds exactly one product.
      context: A product may have several versions over time.
  - name: components
    target: BOMComponent
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The components and quantities needed.
      usage: Defined by product engineering.
      cardinalityMeaning: A bill has at least one component.
      context: Each component line belongs to one bill.
  invariants:
  - id: BOM-001
    rule: effectiveTo must not precede effectiveFrom.
  - {id: BILL-OF-MATERIAL-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Bill Of Material Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, OBSOLETE]
    initial: DRAFT
    terminal: [OBSOLETE]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: DRAFT, to: OBSOLETE, action: mark_obsolete}
    - {from: ACTIVE, to: OBSOLETE, action: mark_obsolete}
  help:
    summary: Represents a manufacturing master entity called BillOfMaterial within the CEDM business model.
    businessMeaning: BillOfMaterial is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, BOMComponent. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Product engineering maintains a bill of materials for each manufactured product; planning explodes it to work out component requirements; production issues components against it; costing rolls it up into the product's standard cost.
    lifecycle: Drafted while engineering designs the product, made active when released for production, and made obsolete when replaced by a new version. Production orders keep the version they were released with.
    example: 'BOM WIDGET-40 version 3: 1 × housing H-40, 2 × bearing 6312, 4 × screw M6×20, 0.05 kg grease; active from 1 March 2024.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BILL-OF-MATERIAL
