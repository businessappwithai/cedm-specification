entity:
  name: BillOfMaterial
  namespace: cedm.domain
  kind: manufacturing_master_entity
  description: A structured definition of components, quantities, and relationships required to produce or assemble a product.
  ui:
    icon: database
  identity:
    key: billOfMaterialId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: billOfMaterialId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the bill, constant across its versions' editing.
        usage: Generated on creation; production orders and cost roll-ups refer to the bill through it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference by which engineering and planning name the bill, such as BOM-1042.
        usage: Entered when the bill is created and used in searches and documents; unique across bills.
    - name: bomVersion
      type: string
      required: true
      default: '1.0'
      maxLength: 30
      help:
        summary: The revision of the bill, for example 2.0, so earlier production can be traced to the recipe that applied.
        usage: Incremented by engineering when the components or quantities change; production records the version used.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - OBSOLETE
      help:
        summary: Whether the bill is still being written, in force for production, or replaced.
        usage: Moved by engineering; planning and production use ACTIVE bills.
        valueSemantics:
          DRAFT: Being prepared; not yet usable for production.
          ACTIVE: Released and in force; planning and production may use it.
          OBSOLETE: Replaced or withdrawn; kept for history and for orders already produced from it.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The first date on which the bill may be used.
        usage: Set at release so a new design can be prepared in advance and take over on a known date.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The last date on which the bill may be used.
        usage: Set when a replacement takes over; must not be earlier than the effective-from date.
  relationships:
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product that this bill describes how to make.
        usage: Chosen when the bill is created; a product can have several bills over time or for alternative ways of making it.
        cardinalityMeaning: 'Exactly one product: a bill is the recipe for a single finished item.'
        workflowRole: Ties the recipe to the finished item that planning and costing are run for.
    - name: components
      target: BOMComponent
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: The component lines that make up the bill.
        usage: Read to explode the bill into material requirements.
        cardinalityMeaning: At least one component; a bill with no components describes nothing.
        workflowRole: Lines are owned by the bill and are released and retired with it.
  invariants:
    - id: BOM-001
      rule: effectiveTo must not precede effectiveFrom.
    - {id: BILL-OF-MATERIAL-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Bill Of Material Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, OBSOLETE]
    initial: DRAFT
    terminal: [OBSOLETE]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: DRAFT, to: OBSOLETE, action: mark_obsolete}
      - {from: ACTIVE, to: OBSOLETE, action: mark_obsolete}
  help:
    summary: 'The recipe for a product: the components and quantities needed to produce or assemble it.'
    businessMeaning: A bill of material turns a product design into something the factory can plan and cost. It says what must be bought or made, and how much, to produce one unit, so material requirements, purchasing and product cost all follow from it.
    usage: Created by engineering when a product is designed and revised when the design or process changes; read by planning, purchasing, production and costing.
    relationshipContext: The bill belongs to one Product and is made up of BOMComponent lines, each naming a component product and its quantity.
    lifecycle: A bill is drafted, becomes active when released for production, and becomes obsolete when replaced. Released bills are not edited; changes are made in a new version.
    example: Bill BOM-1042 version 2.0 for the XR-200 bicycle lists a frame, two wheels, a drivetrain and 24 fasteners, and has been active since 1 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BILL-OF-MATERIAL
