entity:
  name: Experiment
  namespace: cedm.domain
  kind: research_entity
  description: A controlled scientific investigation performed to evaluate a hypothesis, treatment, compound, process, or
    other research question.
  ui:
    icon: table
  identity:
    key: experimentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: experimentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the experiment record associated with this Experiment. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of the experiment, so samples, assays and observations recorded against it remain traceable even if its code or title change."
  - name: experimentCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of experiment code for the Experiment. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference scientists write in lab notebooks and on sample labels, such as EXP-2026-0412, to tie physical work and data back to this experiment."
  - name: title
    type: string
    required: true
    maxLength: 500
    help:
      summary: Captures the business meaning of title for the Experiment. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short descriptive name colleagues use to recognise the experiment in lists, reports and review meetings."
  - name: objective
    type: string
    required: false
    maxLength: 4000
    help:
      summary: Captures the business meaning of objective for the Experiment. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The question or hypothesis the experiment is designed to answer; reviewers judge whether results are conclusive against this statement."
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - RUNNING
    - COMPLETED
    - FAILED
    - CANCELLED
    - ARCHIVED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Experiment.
        RUNNING: Represents the running state or classification in the context of Experiment.
        COMPLETED: Represents the completed state or classification in the context of Experiment.
        FAILED: Represents the failed state or classification in the context of Experiment.
        CANCELLED: Represents the cancelled state or classification in the context of Experiment.
        ARCHIVED: Represents the archived state or classification in the context of Experiment.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Where the experiment stands: PLANNED, RUNNING, then COMPLETED, FAILED or CANCELLED, and ARCHIVED once its completed findings are filed; only completed experiments count as evidence."
  - name: startedAt
    type: datetime
    required: false
    help:
      summary: Records when the started event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When bench or field work actually began, used to reconstruct the timeline of the investigation and to check sample stability windows."
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: Records when the completed event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Experiment records, where
        applicable.
      relationshipContext: Its meaning is specific to Experiment; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the experiment was finished; it is required once the experiment is completed and cannot be earlier than the start."
  relationships:
  - name: compounds
    target: Compound
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Experiment to Compound so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Compound records associated with a Experiment.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: samples
    target: Sample
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Experiment to Sample so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Sample records associated with a Experiment.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: project
    target: Project
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Experiment to Project so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Project records associated with a Experiment.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: protocol, target: Protocol, cardinality: "0..1", ownership: reference, help: {summary: Protocol governing this Experiment., businessMeaning: Supplies reproducible method definition., usage: "Experiment execution and audit.", cardinalityMeaning: Optional when method is governed elsewhere., workflowRole: Applied protocol/version remains historical.}}
  - {name: study, target: Study, cardinality: "0..1", ownership: reference, help: {summary: Study containing this Experiment., businessMeaning: Connects experiment execution to an organized investigation., usage: "Research traceability and reporting.", cardinalityMeaning: Optional for standalone experiments., workflowRole: Study and protocol context must be compatible.}}
  - {name: assays, target: Assay, cardinality: "0..*", ownership: reference, help: {summary: Analytical Assays performed as part of this Experiment., businessMeaning: Connects experimental work to analytical execution., usage: "Laboratory traceability and results interpretation.", cardinalityMeaning: Zero or many Assays., workflowRole: Assay samples and evidence must reconcile to Experiment context.}}
  - {name: observations, target: Observation, cardinality: "0..*", ownership: reference, help: {summary: Primary Observations captured during this Experiment., businessMeaning: Preserves evidence independently of conclusions., usage: "Analysis, reproducibility and audit.", cardinalityMeaning: Zero or many Observations., workflowRole: Observation provenance remains immutable after experiment completion.}}

  invariants:
  - id: EXPERIMENT-001
    rule: completedAt must not precede startedAt.
  - {id: EXPERIMENT-EXE-001, rule: "A experiment that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the experiment is completed."}
  lifecycle:
    title: Experiment Lifecycle
    attribute: status
    states: [PLANNED, RUNNING, COMPLETED, FAILED, CANCELLED, ARCHIVED]
    initial: PLANNED
    terminal: [ARCHIVED, FAILED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RUNNING, action: mark_running}
      - {from: RUNNING, to: COMPLETED, action: complete}
      - {from: COMPLETED, to: ARCHIVED, action: archive}
      - {from: RUNNING, to: FAILED, action: fail}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RUNNING, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a experiment is stopped"
      description: "When a experiment is failed, a high-priority task asks someone to resolve it."
      when: "status == \"FAILED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "EXPERIMENT-EXCEPTION-{{id}}"
              name: "Resolve experiment {{title}}"
              description: "Experiment {{title}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a experiment is ended"
      description: "When a experiment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "EXPERIMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on experiment {{title}}"
              description: "Experiment {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One controlled scientific investigation run to test a hypothesis, compound, treatment or process, recording what was tried, when, and with which samples and assays, so results can be trusted and repeated."
    businessMeaning: Experiment is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Experiment records.
    relationshipContext: The entity participates in a wider business graph through relationships with Compound, Sample, Project.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Experiment record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Planned by a scientist under a project, study or protocol, marked running when work starts, then completed, failed or cancelled; completed experiments feed observations and assay results into analysis and are archived once the findings are reported."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EXPERIMENT
