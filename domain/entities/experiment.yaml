entity:
  name: Experiment
  namespace: cedm.domain
  kind: research_entity
  description: A controlled scientific investigation performed to evaluate a hypothesis, treatment, compound, process, or other research question.
  ui:
    icon: table
    recordLabel: [experimentCode, title]
  identity:
    key: experimentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: experimentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the experiment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a experiment store this identifier. The number or code people quote is a separate field.
  - name: experimentCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the experiment, as written in the lab notebook.
      usage: Used on samples, data files and reports.
      relationshipContext: Unique.
  - name: title
    type: string
    required: true
    maxLength: 500
    help:
      summary: What the experiment tests, in one line.
      usage: Shown in lists and reports.
      relationshipContext: Identifies the experiment for scientists.
  - name: objective
    type: string
    required: false
    maxLength: 4000
    help:
      summary: The question or hypothesis the experiment addresses.
      usage: Written when planning; results are judged against it.
      relationshipContext: Specific enough to say whether it was met.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - RUNNING
    - COMPLETED
    - FAILED
    - CANCELLED
    - ARCHIVED
    help:
      summary: Where the experiment stands.
      usage: Moved on by the scientist.
      relationshipContext: Completed experiments have results.
      valueSemantics:
        PLANNED: Designed; not yet started.
        RUNNING: Being performed.
        COMPLETED: Finished with results.
        FAILED: Could not be completed or gave no usable result.
        CANCELLED: Called off.
        ARCHIVED: Completed and filed after reporting.
  - name: startedAt
    type: datetime
    required: false
    help:
      summary: When the experiment started.
      usage: Recorded when it starts.
      relationshipContext: Not later than its completion.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: When the experiment finished.
      usage: Recorded when it completes or fails.
      relationshipContext: Present once finished.
  - name: method
    type: text
    required: false
    help:
      summary: How the experiment is carried out, or a reference to the protocol.
      usage: Lets the experiment be repeated.
      relationshipContext: Detailed protocols are attached.
  - name: resultSummary
    type: text
    required: false
    help:
      summary: What the experiment showed.
      usage: Written on completion; read in project reviews.
      relationshipContext: Raw data is attached.
  relationships:
  - name: compounds
    target: Compound
    cardinality: 0..*
    ownership: reference
    help:
      summary: Compounds tested in the experiment.
      usage: Linked when planning.
      cardinalityMeaning: Many compounds per experiment; a compound is tested in many experiments.
      context: A many-to-many relation.
  - name: samples
    target: Sample
    cardinality: 0..*
    ownership: reference
    help:
      summary: Samples used in the experiment.
      usage: Linked when performing it.
      cardinalityMeaning: Many samples per experiment; a sample may be used in several.
      context: A many-to-many relation.
  - name: project
    target: Project
    cardinality: 0..1
    ownership: reference
    help:
      summary: The research project the experiment belongs to.
      usage: Set when planning.
      cardinalityMeaning: At most one.
      context: Its budget and goals apply.
  invariants:
  - {id: EXPERIMENT-001, rule: A completed experiment records its result., violatedWhen: status == "COMPLETED" and result_summary == null, message: Summarise the result before completing the experiment.}
  - {id: EXPERIMENT-EXE-001, rule: "An experiment that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the experiment is completed."}
  lifecycle:
    title: Experiment Lifecycle
    attribute: status
    states: [PLANNED, RUNNING, COMPLETED, FAILED, CANCELLED, ARCHIVED]
    initial: PLANNED
    terminal: [ARCHIVED, FAILED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RUNNING, action: mark_running}
    - {from: RUNNING, to: COMPLETED, action: complete}
    - {from: COMPLETED, to: ARCHIVED, action: archive}
    - {from: RUNNING, to: FAILED, action: fail}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RUNNING, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when an experiment is stopped"
    description: "When an experiment is failed, a high-priority task asks someone to resolve it."
    when: "status == \"FAILED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "EXPERIMENT-EXCEPTION-{{id}}"
          name: "Resolve experiment {{title}}"
          description: "Experiment {{title}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when an experiment is ended"
    description: "When an experiment is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "EXPERIMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on experiment {{title}}"
          description: "Experiment {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a research entity called Experiment within the CEDM business model.
    businessMeaning: Experiment is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Compound, Sample, Project. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Scientists plan experiments with their objective and design, record their execution and results, and link the compounds and samples used; project teams review results to decide what to make or test next.
    lifecycle: Planned, running while performed, then completed with results or failed; a planned or running experiment may be cancelled; completed experiments are archived once their results are reported.
    example: Experiment EXP-24-0912 'IC50 of ACM-004512 against kinase X', objective — confirm potency below 10 nM; run 4–6 March 2024; completed, IC50 4.1 nM.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EXPERIMENT
