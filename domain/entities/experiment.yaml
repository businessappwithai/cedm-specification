entity:
  name: Experiment
  namespace: cedm.domain
  kind: research_entity
  description: A controlled scientific investigation performed to evaluate a hypothesis, treatment, compound, process, or other research question.
  ui:
    icon: table
  identity:
    key: experimentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: experimentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The stable identity of the experiment, constant for its whole life.
        usage: Generated on creation; measurements, results and review records refer to it so findings stay traceable to one investigation.
    - name: experimentCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique reference by which the experiment is cited, such as EXP-2026-0312.
        usage: Assigned when planned; written in lab notebooks and reports.
    - name: title
      type: string
      required: true
      maxLength: 500
      help:
        summary: The short title that says what the experiment sets out to test.
        usage: Entered by the researcher when the experiment is planned; shown in lists and reports, so it should name the question under test.
    - name: objective
      type: string
      required: false
      maxLength: 4000
      help:
        summary: What the experiment sets out to find out.
        usage: Written when planned; read when interpreting the results.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - RUNNING
        - COMPLETED
        - FAILED
        - CANCELLED
        - ARCHIVED
      help:
        summary: Whether the experiment is planned, running, finished, failed, stopped or filed away.
        usage: Updated by the researcher as work proceeds; results count only once it is COMPLETED, and failed or cancelled ones are kept.
        valueSemantics:
          PLANNED: Designed and approved but not yet started.
          RUNNING: Under way, with measurements being taken or materials in use.
          COMPLETED: Finished with results recorded and ready for review.
          FAILED: Could not be completed validly, for example through equipment or contamination problems. A final state.
          CANCELLED: Stopped before completion and not to be resumed. A final state.
          ARCHIVED: Closed, reviewed and filed for the record. A final state.
    - name: startedAt
      type: datetime
      required: false
      help:
        summary: The date and time work on the experiment actually began.
        usage: Set by the researcher when the first step starts; not before the plan was approved, and it anchors duration calculations.
    - name: completedAt
      type: datetime
      required: false
      help:
        summary: The date and time the experiment finished and its results were recorded.
        usage: Set at completion; never before the start time, and used to calculate duration and decide when results can be reviewed.
  relationships:
    - name: compounds
      target: Compound
      cardinality: 0..*
      ownership: reference
      help:
        summary: The compounds that are tested in the experiment.
        usage: Linked when the experiment is planned; read to find all evidence about a compound.
        cardinalityMeaning: Any number of compounds; a screening experiment may test many at once.
        workflowRole: Connects results to the substances studied, which is how a compound's evidence accumulates.
    - name: samples
      target: Sample
      cardinality: 0..*
      ownership: reference
      help:
        summary: The physical samples used in the experiment.
        usage: Linked as material is allocated and consumed.
        cardinalityMeaning: Any number of samples, or none for a computational experiment.
        workflowRole: Records which material the results came from, so they can be traced and repeated.
    - name: project
      target: Project
      cardinality: 0..1
      ownership: reference
      help:
        summary: The research project to which the experiment contributes.
        usage: Set at planning so the experiment's cost and results roll up to the project.
        cardinalityMeaning: At most one project; some exploratory experiments are not yet part of one.
        workflowRole: Places the experiment in the programme of work it serves.
    - {name: protocol, target: Protocol, cardinality: "0..1", ownership: reference, help: {cardinalityMeaning: At most one protocol; an exploratory experiment may follow none., summary: Protocol governing this Experiment., businessMeaning: Supplies reproducible method definition., usage: "Experiment execution and audit.", workflowRole: Applied protocol/version remains historical.}}
    - {name: study, target: Study, cardinality: "0..1", ownership: reference, help: {summary: The study that the experiment forms part of., usage: Set where the experiment is run as part of a formal study., cardinalityMeaning: At most one study., workflowRole: Groups experiments that together answer a research question., businessMeaning: Connects experiment execution to an organized investigation.}}
    - {name: assays, target: Assay, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: 'Any number of assays, since one experiment may run several analytical procedures.', summary: Analytical Assays performed as part of this Experiment., businessMeaning: Connects experimental work to analytical execution., usage: "Laboratory traceability and results interpretation.", workflowRole: Assay samples and evidence must reconcile to Experiment context.}}
    - {name: observations, target: Observation, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of observations recorded during the experiment., summary: Primary Observations captured during this Experiment., businessMeaning: Preserves evidence independently of conclusions., usage: "Analysis, reproducibility and audit.", workflowRole: Observation provenance remains immutable after experiment completion.}}

  invariants:
    - id: EXPERIMENT-001
      rule: completedAt must not precede startedAt.
    - {id: EXPERIMENT-EXE-001, rule: "A experiment that is completed states when (completed at).", violatedWhen: "status == \"COMPLETED\" and completed_at == null", message: "Record completed at when the experiment is completed."}
  lifecycle:
    title: Experiment Lifecycle
    attribute: status
    states: [PLANNED, RUNNING, COMPLETED, FAILED, CANCELLED, ARCHIVED]
    initial: PLANNED
    terminal: [ARCHIVED, FAILED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RUNNING, action: mark_running}
      - {from: RUNNING, to: COMPLETED, action: complete}
      - {from: COMPLETED, to: ARCHIVED, action: archive}
      - {from: RUNNING, to: FAILED, action: fail}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RUNNING, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a experiment is stopped"
      description: "When a experiment is failed, a high-priority task asks someone to resolve it."
      when: "status == \"FAILED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "EXPERIMENT-EXCEPTION-{{id}}"
              name: "Resolve experiment {{title}}"
              description: "Experiment {{title}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a experiment is ended"
      description: "When a experiment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "EXPERIMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on experiment {{title}}"
              description: "Experiment {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A controlled scientific investigation performed to test a hypothesis, treatment, compound, process or other research question.
    businessMeaning: An experiment is where evidence comes from. Recording its objective, timing and materials is what lets results be trusted, repeated and challenged.
    usage: Planned by researchers; run; completed or abandoned; read by project teams and reviewers.
    relationshipContext: An experiment studies Compounds and uses Samples, belongs to a Project, may follow a Protocol within a Study, and produces Assays and Observations.
    lifecycle: An experiment is planned, runs, and ends completed, failed or cancelled; completed experiments can be archived. Records are never rewritten.
    example: Dose-response experiment on compound CMP-00417 across six concentrations, run over three days.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EXPERIMENT
