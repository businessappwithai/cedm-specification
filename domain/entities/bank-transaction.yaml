entity:
  name: BankTransaction
  namespace: cedm.domain
  kind: financial_transaction
  description: A monetary transaction recorded against a bank account.
  identity: {key: bankTransactionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: bankTransactionId, type: uuid, required: true, immutable: true}
    - {name: transactionNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: transactionDate, type: datetime, required: true}
    - {name: transactionType, type: enum, required: true, values: [CREDIT, DEBIT, TRANSFER, FEE, INTEREST, REVERSAL, OTHER]}
    - {name: amount, type: decimal, required: true, precision: 20, scale: 4}
    - {name: status, type: enum, required: true, default: POSTED, values: [PENDING, POSTED, REVERSED, FAILED]}
    - {name: reference, type: string, required: false, maxLength: 200}
  relationships:
    - {name: account, target: BankAccount, cardinality: "1", ownership: reference}
    - {name: counterparty, target: Party, cardinality: "0..1", ownership: reference}
  invariants:
    - {id: BANK-TRANSACTION-001, rule: amount must be greater than or equal to zero and transactionType determines debit or credit semantics.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BANK-TRANSACTION}
