entity:
  name: BankTransaction
  namespace: cedm.domain
  kind: financial_transaction
  description: An external or bank-statement financial transaction recorded against a BankAccount and used as evidence for cash movement, reconciliation, settlement, and exception handling.
  identity:
    key: bankTransactionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: bankTransactionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Immutable identity of the bank transaction evidence record.
      usage: Used for statement import, reconciliation, audit, duplicate detection, and integration.
      relationshipContext: Identifies external bank evidence separately from an internal Payment or JournalEntry.
      workflowRole: Provides the stable key used when matching bank activity to internal settlement records.
  - name: transactionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Internal or bank-provided business reference for the transaction.
      usage: Used to search statements, reconcile payments, investigate exceptions, and integrate bank feeds.
      relationshipContext: It is not the CEDM Payment number and must not be assumed to represent an internal payment.
      workflowRole: Supports matching and duplicate detection.
  - name: transactionDate
    type: datetime
    required: true
    help:
      summary: Date and time associated with the bank transaction.
      usage: Supports statement chronology, reconciliation windows, cash reporting, and accounting analysis.
      relationshipContext: May differ from Payment.paymentDate, value date, posting date, or clearing date.
      workflowRole: Establishes external-bank chronology for matching.
  - name: transactionType
    type: enum
    required: true
    values: [CREDIT, DEBIT, TRANSFER, FEE, INTEREST, REVERSAL, OTHER]
    help:
      summary: Classifies the financial movement reported by the bank.
      usage: Supports matching, cash classification, fee handling, and reconciliation.
      relationshipContext: Bank-side classification does not by itself determine the internal accounting meaning.
      workflowRole: Helps determine candidate Payment, fee, transfer, or adjustment matches.
  - name: amount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: Monetary amount reported by the bank.
      usage: Used for matching, reconciliation, cash reporting, and accounting comparison.
      relationshipContext: Must be interpreted with currency and credit/debit direction.
      workflowRole: Candidate settlement evidence must reconcile to the applicable Payment amount, allowing documented bank fees or differences.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    help:
      summary: Currency in which the bank transaction is denominated.
      usage: Required for monetary comparison and reconciliation.
      relationshipContext: May differ from an internal payment or invoice currency and can require an explicit FX treatment.
      workflowRole: Controls whether direct amount matching is possible.
  - name: status
    type: enum
    required: true
    default: POSTED
    values: [PENDING, POSTED, REVERSED, FAILED]
    help:
      summary: Lifecycle state of the bank-reported transaction.
      usage: Controls whether the transaction can be treated as settled evidence.
      relationshipContext: BankTransaction status is independent of Payment status.
      workflowRole: Only appropriate posted bank evidence should normally support Payment.CLEARED.
  - name: reference
    type: string
    required: false
    maxLength: 200
    help:
      summary: Bank-provided remittance or transaction reference used for matching.
      usage: Supports automatic and manual reconciliation.
      relationshipContext: May contain a customer payment number, invoice reference, bank reference, or unstructured remittance information.
      workflowRole: Primary candidate-matching input where available.
  relationships:
  - name: account
    target: BankAccount
    cardinality: '1'
    ownership: reference
    help:
      summary: Identifies the bank account on whose statement the transaction appears.
      usage: Establishes cash-account context and reconciliation scope.
      relationshipContext: BankAccount is the financial account; BankTransaction is one observed movement on it.
      workflowRole: Reconciliation is performed within an account and statement context.
  - name: counterparty
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the bank-reported counterparty when known.
      usage: Supports payment matching and investigation.
      relationshipContext: Counterparty evidence may be incomplete or differ from the internal payer/payee Party.
      workflowRole: Provides a matching signal rather than definitive settlement identity.
  - name: payment
    target: Payment
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the internal Payment matched to this bank transaction.
      usage: Connects external bank evidence to the internal settlement event.
      cardinalityMeaning: Zero while unmatched; one when reconciled under the applicable policy.
      workflowRole: Matching supports Payment.CLEARED but must satisfy amount, currency, account, date, reference, and exception rules.
  invariants:
  - id: BANK-TRANSACTION-001
    rule: amount must be greater than or equal to zero.
  - id: BANK-TRANSACTION-002
    rule: A BankTransaction cannot be treated as proof of an internal Payment unless an explicit reconciliation relationship exists or an approved auto-match rule establishes it.
  - id: BANK-TRANSACTION-003
    rule: Reversed bank transactions must not continue to support a cleared Payment without corresponding reversal handling.
  - id: BANK-TRANSACTION-004
    rule: Duplicate statement records must not create duplicate settlement applications.
  help:
    summary: Represents external bank evidence of a monetary movement and is the authoritative source for bank-side reconciliation, not for the internal business meaning of the payment.
    businessMeaning: BankTransaction is deliberately separate from Payment. Payment records the organization's recognized settlement event; BankTransaction records what the financial institution reported. Reconciliation establishes the relationship between them.
    usage: Used by treasury, accounts receivable, accounts payable, bank-feed integrations, cash management, reconciliation, audit, and accounting.
    relationshipContext: Payment connects the internal settlement event to obligations through PaymentAllocation. BankTransaction connects external bank evidence to Payment. JournalEntry records accounting recognition.
    workflowContext: Bank statement import → validate/deduplicate → match BankTransaction to Payment → reconcile exceptions → mark Payment CLEARED → post/reconcile accounting as required. Unmatched transactions remain exceptions and must not silently alter invoices.
    lifecycle: Pending bank activity may become posted, reversed, or failed. Historical bank evidence is retained; corrections use explicit reconciliation adjustments rather than rewriting the statement record.
    example: A bank statement contains a 10,000 USD credit with a remittance reference. The system matches it to a 10,000 USD customer Payment. After validation, the Payment becomes CLEARED and its PaymentAllocations settle the applicable invoices. The BankTransaction remains independent evidence of the external cash movement.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-BANK-TRANSACTION
