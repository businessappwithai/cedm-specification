entity:
  name: CreditNote
  namespace: cedm.domain
  kind: financial_adjustment_transaction
  description: A formal financial adjustment that reduces a customer's receivable claim or otherwise credits an eligible original Invoice, preserving the original invoice as immutable historical evidence and recording the authorized reason, lines, tax, currency, accounting recognition, application, return linkage, and refund evidence.
  identity: {key: creditNoteId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: creditNoteId
    type: uuid
    required: true
    immutable: true
    help: {summary: Immutable identity of the credit note., businessMeaning: Identifies the financial adjustment independently of its business number, original invoice, return, accounting entry, application or refund., usage: Used for audit, accounting, customer statements, integrations, reconciliation, tax and reversal workflows., relationshipContext: CreditNoteId is the stable system identity; creditNoteNumber is the business-facing reference; the original Invoice remains a separate historical claim., workflowRole: Root reference across preparation, approval, posting, application, reversal, reporting and refund processing., requiredMeaning: Required.}
  - name: creditNoteNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: Business-facing reference assigned to the credit note., businessMeaning: Identifies the adjustment in customer communication, tax documents, statements and finance operations., usage: Used for reconciliation, customer service, reporting, tax and integrations., relationshipContext: Distinct from creditNoteId and original Invoice.invoiceNumber., workflowRole: Provides the human-recognizable adjustment reference throughout its lifecycle., requiredMeaning: Required.}
  - name: creditNoteDate
    type: date
    required: true
    help: {summary: Commercial and accounting date of the credit adjustment., businessMeaning: Establishes the temporal basis for accounting, tax and customer balance treatment., usage: Used for accounting periods, tax reporting, statements and audit., relationshipContext: May differ from CustomerReturn returnDate and refund payment date., workflowRole: Anchors the financial adjustment in the applicable accounting and tax period., requiredMeaning: Required.}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, APPROVED, POSTED, PARTIALLY_APPLIED, FULLY_APPLIED, REFUND_DUE, REFUNDED, CANCELLED, REVERSED]
    help:
      summary: Lifecycle state of the credit adjustment.
      businessMeaning: Indicates preparation, authorization, accounting recognition, application to invoices, customer refund obligation, settlement, cancellation or reversal.
      usage: Controls approval, posting, application, refund and correction workflows.
      relationshipContext: CreditNote status is independent of Invoice, CustomerReturn, Payment and CreditNoteApplication status.
      workflowRole: POSTED establishes the financial adjustment; application reduces eligible outstanding receivable; refund states apply when money must be returned.
      requiredMeaning: Required.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    immutableAfterPosting: true
    help: {summary: Currency in which the credit note is denominated., businessMeaning: Defines the monetary denomination of all credit-note amounts., usage: Used for calculation, tax, accounting, invoice application, customer balance and refund processing., relationshipContext: Must normally match credited Invoice currency; permitted cross-currency application requires explicit ExchangeRate evidence., workflowRole: Establishes monetary basis for adjustment and application., requiredMeaning: Required.}
  - name: reasonCode
    type: string
    required: true
    maxLength: 100
    help: {summary: Controlled business reason for issuing the credit., businessMeaning: Explains why customer exposure is reduced., usage: Used for approval, policy, analytics, tax, audit and customer communication., relationshipContext: Return reason and financial credit reason may differ., workflowRole: Determines applicable approval, calculation, tax and posting policy., requiredMeaning: Required.}
  - name: subtotal
    type: Money
    required: true
    help: {summary: Aggregate credit value before document-level tax and adjustments., businessMeaning: Sum of credit-note line bases after applicable line pricing treatment., usage: Used for tax, reconciliation, accounting and reporting., relationshipContext: Must reconcile with CreditNoteLine amounts and original transaction evidence., workflowRole: Feeds taxable amount and total credit calculation., requiredMeaning: Required.}
  - name: taxAmount
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Tax component reversed or credited by the adjustment., businessMeaning: Represents tax reduction associated with credited transaction., usage: Used for tax reporting, accounting and reconciliation., relationshipContext: Must reconcile with CreditNoteLine tax evidence and original InvoiceLine treatment where applicable., workflowRole: Contributes to total adjustment., requiredMeaning: Required, including zero.}
  - name: totalAmount
    type: Money
    required: true
    help: {summary: Total monetary reduction represented by the credit note., businessMeaning: Amount by which eligible customer exposure is reduced before application or refund settlement., usage: Used for receivable adjustment, statements, tax, accounting, application and refund decisions., relationshipContext: Not itself a cash refund; refund requires a separate Payment event., workflowRole: Maximum amount that can be applied or refunded under policy., requiredMeaning: Required.}
  - name: amountApplied
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Portion of the posted credit note already applied to eligible invoice balances., businessMeaning: Represents non-cash use of the credit to reduce receivable exposure., usage: Used for application status, statements and remaining credit calculation., relationshipContext: Must reconcile with active CreditNoteApplication records., workflowRole: Changes through controlled application or reversal workflows., requiredMeaning: Required as a settlement projection.}
  - name: amountRefunded
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Portion of the credit actually paid back to the customer., businessMeaning: Represents cash settlement of customer credit., usage: Used for refund reconciliation, customer balance and audit., relationshipContext: Must reconcile with refund Payment evidence., workflowRole: Changes only after an authorized refund Payment is posted and linked., requiredMeaning: Required as a refund projection.}
  - name: amountRemaining
    type: Money
    required: true
    default: {amount: 0}
    help: {summary: Unapplied and unrefunded portion of the posted credit., businessMeaning: Represents remaining customer credit exposure available for application or refund., usage: Drives application, refund and reconciliation decisions., relationshipContext: Reconciles totalAmount against active application and refund evidence., workflowRole: Determines whether further application or refund is permitted., requiredMeaning: Required.}
  relationships:
  - name: customer
    target: Customer
    cardinality: '1'
    ownership: reference
    help: {summary: Customer whose financial exposure is reduced., businessMeaning: Identifies party receiving financial benefit., usage: Supports statements, receivables, approval, tax, refund and audit., workflowRole: Provides customer eligibility and settlement context.}
  - name: originalInvoices
    target: Invoice
    cardinality: 1..*
    ownership: reference
    help: {summary: Original financial claims to which the credit relates., businessMeaning: Establishes historical claim basis without modifying invoices., usage: Supports audit, statements, tax, reconciliation and application., cardinalityMeaning: One or more eligible invoices may be referenced., workflowRole: Supplies claim context for credit eligibility.}
  - name: lines
    target: CreditNoteLine
    cardinality: 1..*
    ownership: aggregate
    help: {summary: Detailed credited quantities, values, taxes and source references., businessMeaning: Provides calculation evidence for credit total., usage: Supports return-based credit, pricing corrections, tax adjustments and audit., workflowRole: Lines determine subtotal, tax and total.}
  - name: customerReturns
    target: CustomerReturn
    cardinality: 0..*
    ownership: reference
    help: {summary: Customer returns providing physical or commercial justification., businessMeaning: Links financial adjustment to reverse fulfillment., usage: Supports return-to-credit traceability, approval and audit., workflowRole: Approved return disposition provides eligibility and quantity basis.}
  - name: applications
    target: CreditNoteApplication
    cardinality: 0..*
    ownership: reference
    help: {summary: Explicit applications of this credit note against eligible Invoice claims., businessMeaning: Records exactly how the posted credit is consumed without changing original invoice history., usage: Supports receivable settlement, statements, reconciliation, audit, reversal and remaining-credit calculation., cardinalityMeaning: A credit may be unapplied, partially applied or applied through multiple controlled applications., workflowRole: Active applications drive amountApplied and amountRemaining and may transition the credit to PARTIALLY_APPLIED or FULLY_APPLIED.}
  - name: journalEntries
    target: JournalEntry
    cardinality: 0..*
    ownership: reference
    help: {summary: Accounting entries recognizing the credit note and its reversals., businessMeaning: Separates accounting recognition from the business adjustment document., usage: Supports receivable, revenue, tax and audit accounting., workflowRole: Posted credit requires appropriate accounting recognition.}
  - name: refundPayments
    target: Payment
    cardinality: 0..*
    ownership: reference
    help: {summary: Payments disbursed to settle a refund arising from the credit note., businessMeaning: Connects financial adjustment to actual cash returned., usage: Supports refund execution, bank reconciliation and audit., workflowRole: Refund Payment is separate settlement evidence and never overwrites original payment history.}
  invariants:
  - {id: CREDIT-NOTE-001, rule: totalAmount must reconcile with CreditNoteLine values, tax, rounding and applicable adjustment policy.}
  - {id: CREDIT-NOTE-002, rule: A posted CreditNote must reference at least one eligible original Invoice or explicitly supported source transaction.}
  - {id: CREDIT-NOTE-003, rule: Original Invoice and InvoiceLine history must never be destructively changed to create a credit.}
  - {id: CREDIT-NOTE-004, rule: Return-based credit cannot exceed approved credit supported by eligible CustomerReturnLine evidence and applicable pricing, tax, discount and return policy.}
  - {id: CREDIT-NOTE-005, rule: CreditNote is not itself a cash refund; refund cash requires separate Payment evidence.}
  - {id: CREDIT-NOTE-006, rule: amountApplied plus amountRefunded must not exceed totalAmount except under explicitly authorized correction/reversal policy.}
  - {id: CREDIT-NOTE-007, rule: Posting a CreditNote must generate or link required JournalEntry accounting recognition before financial posting.}
  - {id: CREDIT-NOTE-008, rule: Tax, currency, pricing, discount and rounding treatment must preserve sufficient transaction-time evidence to reproduce the adjustment.}
  - {id: CREDIT-NOTE-009, rule: Reversal or cancellation after posting requires compensating accounting and application/refund workflows; historical evidence is retained.}
  - {id: CREDIT-NOTE-010, rule: Credit-note posting and application must be idempotent and protected against concurrent duplicate financial effects.}
  - {id: CREDIT-NOTE-011, rule: Changes to CustomerReturn, CustomerReturnLine, Invoice, InvoiceLine, Customer, Currency, TaxRule or pricing policy affecting an open credit require controlled revalidation.}
  - {id: CREDIT-NOTE-012, rule: amountApplied must equal the active CreditNoteApplication invoice-side amounts under the applicable currency and rounding policy.}
  help:
    summary: Represents an explicit reduction of a customer's financial claim while preserving original invoice, return, accounting, application and refund evidence.
    businessMeaning: CustomerReturn records reverse fulfillment; CreditNote records the financial adjustment; CreditNoteApplication records how it is consumed; Invoice remains the historical claim; JournalEntry records accounting; Payment records any refund cash.
    usage: Customer returns, accounts receivable, billing corrections, tax adjustments, customer concessions, statements, audit and refunds.
    relationshipContext: CustomerReturnLine provides returned quantity and approved credit basis. InvoiceLine provides original billed evidence. CreditNoteLine captures adjustment detail. CreditNoteApplication connects the adjustment to invoice exposure. JournalEntry records accounting. Payment records refund.
    workflowContext: Return authorized → received/inspected → disposition approved → credit eligibility calculated → CreditNote draft → approval → accounting determination → post → create CreditNoteApplication against open Invoice or establish refund due → refund Payment if required → reconcile → fully applied/refunded. Original Invoice and Payment history remain immutable.
    lifecycle: Draft → approved → posted → partially applied/fully applied or refund due → refunded, with cancellation and reversal paths.
    changePropagation: Changes to return disposition or original invoice evidence trigger revalidation of an unposted credit. Posted credit changes require explicit reversal and replacement. Applications are corrected by reversal/reallocation, and refund payments remain separate evidence.
    example: A customer returns five units with approved credit of USD 590. CreditNote is posted for USD 590. A CreditNoteApplication can consume the credit against an open invoice; if no eligible balance exists, the credit becomes refund due and a separate Payment settles it.