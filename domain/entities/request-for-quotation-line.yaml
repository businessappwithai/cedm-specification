entity:
  name: RequestForQuotationLine
  namespace: cedm.domain
  kind: sourcing_request_line
  description: A line-level sourcing requirement within a RequestForQuotation that preserves traceability to approved internal demand and defines the quantity and requirement suppliers are invited to quote.
  ui:
    icon: list
    recordLabel: [lineNumber, description]
  identity: {key: requestForQuotationLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: requestForQuotationLineId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the request for quotation line record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a request for quotation line store this identifier. The number or code people quote is a separate field.
  - name: lineNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: The number of the line within the request for quotation.
      businessMeaning: Human-facing reference for the requirement.
      usage: Suppliers quote line by line, quoting this number.
      relationshipContext: Unique within the request.
  - name: requestedQuantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How much the buyer asks suppliers to quote for.
      businessMeaning: Defines the sourcing magnitude for this requirement.
      usage: Taken from the requisition or entered by the buyer.
      relationshipContext: In the line's unit of measure.
  - name: description
    type: string
    required: true
    maxLength: 2000
    help:
      summary: What is to be quoted, as suppliers will read it.
      businessMeaning: Communicates what suppliers must price or propose.
      usage: Taken from the product or written by the buyer.
      relationshipContext: Should be specific enough for suppliers to price.
  - name: requiredDate
    type: date
    required: false
    help:
      summary: When the goods or services are needed.
      usage: Suppliers quote their delivery against it.
      relationshipContext: Taken from the requisition.
  - name: specification
    type: text
    required: false
    help:
      summary: The technical or quality requirements suppliers must meet.
      usage: Attached to the request so quotes are comparable.
      relationshipContext: Drawings and documents are attachments.
  - name: targetPrice
    type: Money
    required: false
    help:
      summary: The price the buyer aims for, kept internal.
      usage: Used to judge the quotes.
      relationshipContext: Not shown to suppliers.
  relationships:
  - name: requestForQuotation
    target: RequestForQuotation
    cardinality: "1"
    ownership: reference
    inverse: lines
    help:
      summary: The request the line belongs to.
      businessMeaning: "Supplies invited suppliers, deadlines, and sourcing lifecycle."
      workflowRole: Controls solicitation lifecycle.
      usage: Set when the line is added.
      cardinalityMeaning: Every line belongs to exactly one request.
      context: Listed under the request.
  - name: requisitionLine
    target: PurchaseRequisitionLine
    cardinality: "0..1"
    ownership: reference
    help:
      summary: The requisition line the demand came from.
      businessMeaning: Preserves exact demand provenance.
      workflowRole: "Supplies requested product, quantity, and need context."
      usage: Linked when the request is built from requisitions.
      cardinalityMeaning: At most one.
      context: Keeps the trace from need to purchase.
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product to be quoted.
      businessMeaning: Identifies the requested item when master data exists.
      workflowRole: Must reconcile with originating demand.
      usage: Chosen when the product is known.
      cardinalityMeaning: At most one.
      context: Services may be described without a product.
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: 0..1
    ownership: reference
    help:
      summary: The unit the quantity is in.
      businessMeaning: Makes sourcing quantity comparable.
      workflowRole: Supports compatible quotation and order units.
      usage: Taken from the product or chosen.
      cardinalityMeaning: At most one.
      context: Quotes must use the same unit or be converted.
  - name: supplierQuotationLines
    target: SupplierQuotationLine
    cardinality: 0..*
    ownership: reference
    help:
      summary: The suppliers' answers to this line.
      businessMeaning: Enables line-by-line commercial comparison.
      workflowRole: Accepted response lines may feed PurchaseOrderLine.
      usage: Listed for comparison.
      cardinalityMeaning: Any number; each quotation line answers one request line.
      context: The quotation line records the request line.
  invariants:
  - {id: RFQ-LINE-001, rule: requestedQuantity must be greater than zero.}
  - {id: RFQ-LINE-002, rule: lineNumber must be unique within RequestForQuotation.}
  - {id: RFQ-LINE-003, rule: "When requisitionLine is present, product, unit and sourced quantity must reconcile with eligible approved demand and any prior sourcing allocations."}
  - {id: RFQ-LINE-004, rule: RFQ line changes after issue require controlled amendment and revalidation of affected supplier responses.}
  - {id: REQUEST-FOR-QUOTATION-LINE-EXE-001, rule: "Requested Quantity cannot be negative.", violatedWhen: "requested_quantity != null and requested_quantity < 0", message: "Requested Quantity cannot be negative."}
  help:
    summary: Line-level bridge from approved procurement demand to comparable supplier offers.
    businessMeaning: The RFQ header controls the sourcing event; this line defines exactly what is being sourced.
    usage: Strategic sourcing, competitive bids, services procurement, award allocation, and audit.
    relationshipContext: PurchaseRequisitionLine supplies demand; SupplierQuotationLine supplies responses; PurchaseOrderLine executes awarded commitment.
    lifecycle: Prepared with RFQ, issued for response, closed/awarded with sourcing event, retained historically.
    changePropagation: Issued-line changes revalidate supplier responses and downstream awards without rewriting historical submissions.
    example: 'Line 1 of RFQ-24-0091: 5,000 battery packs BP-18V to specification SP-BP-03, required by 1 September 2024, target price 21.50 EUR.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-REQUEST-FOR-QUOTATION-LINE}
