entity:
  name: RequestForQuotationLine
  namespace: cedm.domain
  kind: sourcing_request_line
  description: A line-level sourcing requirement within a RequestForQuotation that preserves traceability to approved internal demand and defines the quantity and requirement suppliers are invited to quote.
  identity: {key: requestForQuotationLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: requestForQuotationLineId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of one RFQ requirement line., businessMeaning: Identifies the sourced requirement independently of demand and supplier responses., usage: Sourcing comparison, award, conversion, and audit., relationshipContext: Bridges requisition demand to supplier quotation lines., requiredMeaning: Required.}}
  - {name: lineNumber, type: integer, required: true, minimum: 1, help: {summary: Business sequence within the RFQ., businessMeaning: Human-facing reference for the requirement., usage: Supplier communication, response matching, and audit., relationshipContext: Unique within the parent RFQ., requiredMeaning: Required.}}
  - {name: requestedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Quantity suppliers are requested to quote., businessMeaning: Defines the sourcing magnitude for this requirement., usage: Bid comparison and award allocation., relationshipContext: Must reconcile with originating requisition demand and UOM., requiredMeaning: Required.}}
  - {name: description, type: string, required: true, maxLength: 2000, help: {summary: Sourcing description and requirement detail., businessMeaning: Communicates what suppliers must price or propose., usage: Solicitation and comparison., relationshipContext: Supplements Product and originating demand., requiredMeaning: Required.}}
  relationships:
  - {name: requestForQuotation, target: RequestForQuotation, cardinality: '1', ownership: reference, inverse: lines, help: {summary: Parent sourcing solicitation., businessMeaning: Supplies invited suppliers, deadlines, and sourcing lifecycle., usage: RFQ execution and audit., cardinalityMeaning: Exactly one parent RFQ., workflowRole: Controls solicitation lifecycle.}}
  - {name: requisitionLine, target: PurchaseRequisitionLine, cardinality: 0..1, ownership: reference, help: {summary: Approved internal demand being sourced., businessMeaning: Preserves exact demand provenance., usage: Demand reconciliation and audit., cardinalityMeaning: Optional only for authorized sourcing not originating from a requisition line., workflowRole: Supplies requested product, quantity, and need context.}}
  - {name: product, target: Product, cardinality: 0..1, ownership: reference, help: {summary: Standardized product being sourced., businessMeaning: Identifies the requested item when master data exists., usage: Supplier comparison and order conversion., cardinalityMeaning: Optional for free-text services., workflowRole: Must reconcile with originating demand.}}
  - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: 0..1, ownership: reference, help: {summary: Unit qualifying requestedQuantity., businessMeaning: Makes sourcing quantity comparable., usage: Quote normalization and conversion., cardinalityMeaning: Optional only when quantity semantics are otherwise unambiguous., workflowRole: Supports compatible quotation and order units.}}
  - {name: supplierQuotationLines, target: SupplierQuotationLine, cardinality: 0..*, ownership: reference, help: {summary: Supplier responses to this exact requirement., businessMeaning: Enables line-by-line commercial comparison., usage: Award analysis and audit., cardinalityMeaning: Zero or many supplier responses., workflowRole: Accepted response lines may feed PurchaseOrderLine.}}
  invariants:
  - {id: RFQ-LINE-001, rule: requestedQuantity must be greater than zero.}
  - {id: RFQ-LINE-002, rule: lineNumber must be unique within RequestForQuotation.}
  - {id: RFQ-LINE-003, rule: When requisitionLine is present, product, unit and sourced quantity must reconcile with eligible approved demand and any prior sourcing allocations.}
  - {id: RFQ-LINE-004, rule: RFQ line changes after issue require controlled amendment and revalidation of affected supplier responses.}
  help:
    summary: Line-level bridge from approved procurement demand to comparable supplier offers.
    businessMeaning: The RFQ header controls the sourcing event; this line defines exactly what is being sourced.
    usage: Strategic sourcing, competitive bids, services procurement, award allocation, and audit.
    relationshipContext: PurchaseRequisitionLine supplies demand; SupplierQuotationLine supplies responses; PurchaseOrderLine executes awarded commitment.
    lifecycle: Prepared with RFQ, issued for response, closed/awarded with sourcing event, retained historically.
    changePropagation: Issued-line changes revalidate supplier responses and downstream awards without rewriting historical submissions.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-REQUEST-FOR-QUOTATION-LINE}
