entity:
  name: Ledger
  namespace: cedm.domain
  kind: accounting_master
  description: A governed accounting book defining the scope in which journal entries are recorded and reported.
  identity: {key: ledgerId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: ledgerId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of Ledger., businessMeaning: Identifies one governed Ledger record., usage: Enterprise processing, integration, reporting and audit., relationshipContext: Referenced by compatible domain workflows., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: Governed lifecycle state., businessMeaning: Indicates usability/execution state of Ledger., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships:
  - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: Organization owning accounting book., businessMeaning: Defines legal/management accounting boundary., usage: Posting and reporting., cardinalityMeaning: Exactly one Organization., workflowRole: Journal entries must use compatible organization context.}}
  - {name: journalEntries, target: JournalEntry, cardinality: 0..*, ownership: reference, help: {summary: Journal entries posted to ledger., businessMeaning: Supplies accounting evidence contained by book., usage: General ledger and reporting., cardinalityMeaning: Zero or many entries., workflowRole: Posted entries remain immutable.}}
  invariants:
  - {id: LEDGER-001, rule: This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity.}
  help:
    summary: A governed accounting book defining the scope in which journal entries are recorded and reported.
    purpose: Provide canonical enterprise semantics for Ledger while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: A governed accounting book defining the scope in which journal entries are recorded and reported.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-LEDGER}
