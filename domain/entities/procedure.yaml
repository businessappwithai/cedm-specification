entity:
  name: Procedure
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical procedure performed or planned as part of healthcare delivery.
  ui:
    icon: table
  identity:
    key: procedureId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: procedureId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the procedure record associated with this Procedure. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets the encounter, patient record and billing refer to this exact procedure."
  - name: codeSystem
    type: string
    required: true
    maxLength: 50
    help:
      summary: Captures the business meaning of code system for the Procedure. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Says which coding scheme the code comes from, such as CPT, ICD-10-PCS or SNOMED CT, so the code is read correctly by billing and reporting."
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The standard code for the procedure within that coding scheme, used for claims, statistics and clinical decision support."
  - name: description
    type: string
    required: true
    maxLength: 1000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The plain-language name of the procedure that clinicians and patients understand, such as Laparoscopic appendectomy."
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Procedure.
        IN_PROGRESS: Represents the in progress state or classification in the context of Procedure.
        COMPLETED: Represents the completed state or classification in the context of Procedure.
        CANCELLED: Represents the cancelled state or classification in the context of Procedure.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the procedure is planned, under way, completed or cancelled."
  - name: performedAt
    type: datetime
    required: false
    help:
      summary: Records when the performed event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Procedure records, where applicable.
      relationshipContext: Its meaning is specific to Procedure; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the procedure was actually carried out, which matters for the clinical timeline, follow-up care and billing."
  relationships:
  - name: encounter
    target: HealthcareEncounter
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Procedure to HealthcareEncounter so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareEncounter records associated with a Procedure.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Procedure to HealthcarePatient so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcarePatient records associated with a Procedure.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: performer
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Procedure to HealthcareProvider so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareProvider records associated with a Procedure.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Procedure Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a procedure is ended"
      description: "When a procedure is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCEDURE-FOLLOW-UP-{{id}}"
              name: "Follow up on procedure {{code}}"
              description: "Procedure {{code}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "A clinical procedure, such as an appendectomy or an MRI scan, planned or performed for a patient during an encounter, kept as part of the medical record and for billing and quality reporting."
    businessMeaning: Procedure is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Procedure records.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcareEncounter,
      HealthcarePatient, HealthcareProvider. These relationships provide the context needed to interpret the record rather
      than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Procedure record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "A procedure is planned during an encounter, started when the clinician begins, and completed with the time it was performed, or cancelled if it does not go ahead, which raises a follow-up task; completed procedures feed billing and clinical reporting."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROCEDURE
