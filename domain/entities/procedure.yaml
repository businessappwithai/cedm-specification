entity:
  name: Procedure
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical procedure performed or planned as part of healthcare delivery.
  ui:
    icon: table
    recordLabel: [code, description]
  identity:
    key: procedureId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: procedureId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the procedure record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a procedure store this identifier. The number or code people quote is a separate field.
  - name: codeSystem
    type: string
    required: true
    maxLength: 50
    help:
      summary: The coding system the code belongs to, such as CPT, ICD-10-PCS or SNOMED CT.
      usage: Decides how the code is read for billing and reporting.
      relationshipContext: As required by the payer or regulator.
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: The code of the procedure in its coding system.
      usage: Used on claims and in statistics.
      relationshipContext: Must exist in the coding system.
  - name: description
    type: string
    required: true
    maxLength: 1000
    help:
      summary: The procedure in words.
      usage: Shown to clinicians and on the patient's record.
      relationshipContext: Matches the code.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the procedure stands.
      usage: Updated by the clinical team.
      relationshipContext: Only completed procedures are billed.
      valueSemantics:
        PLANNED: Scheduled.
        IN_PROGRESS: Being performed.
        COMPLETED: Performed.
        CANCELLED: Not performed.
  - name: performedAt
    type: datetime
    required: false
    help:
      summary: When the procedure was performed.
      usage: Recorded on completion.
      relationshipContext: Within the encounter's period.
  relationships:
  - name: encounter
    target: HealthcareEncounter
    cardinality: '1'
    ownership: reference
    help:
      summary: The encounter during which the procedure is performed.
      usage: Set when the procedure is planned.
      cardinalityMeaning: Each procedure belongs to one encounter.
      context: Listed on the encounter.
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient the procedure is performed on.
      usage: Set from the encounter.
      cardinalityMeaning: Each procedure is for one patient.
      context: Must be the encounter's patient.
  - name: performer
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: The provider who performs the procedure.
      usage: Set when assigned.
      cardinalityMeaning: At most one responsible performer.
      context: Credited on claims.
  lifecycle:
    title: Procedure Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a procedure is ended"
    description: "When a procedure is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROCEDURE-FOLLOW-UP-{{id}}"
          name: "Follow up on procedure {{code}}"
          description: "Procedure {{code}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A clinical procedure performed or planned for a patient, recorded with its code.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcareEncounter, HealthcarePatient, HealthcareProvider. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Clinicians plan and record the procedures they perform during an encounter, coded for billing and statistics; the patient's record lists them in order.
    lifecycle: A procedure is planned, in progress while performed, then completed; a planned or ongoing procedure may be cancelled.
    example: Procedure CPT 45378 'Diagnostic colonoscopy' for patient MRN 0048812, performed by Dr. L. Neri on 20 May 2024 at 10:15, completed.
    businessMeaning: Procedures are billed, audited and reported; the patient record shows what was done and by whom.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROCEDURE
