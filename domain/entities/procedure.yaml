entity:
  name: Procedure
  namespace: cedm.domain
  kind: healthcare_clinical_entity
  description: A clinical procedure performed or planned as part of healthcare delivery.
  ui:
    icon: table
  identity:
    key: procedureId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: procedureId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the procedure record.
        usage: Generated on creation.
    - name: codeSystem
      type: string
      required: true
      maxLength: 50
      help:
        summary: The coding system that the procedure code is from, such as CPT or SNOMED CT.
        usage: Chosen with the code; both are needed to interpret it.
    - name: code
      type: string
      required: true
      maxLength: 50
      help:
        summary: The code that identifies the procedure.
        usage: Selected by the clinician; used for billing and statistics.
    - name: description
      type: string
      required: true
      maxLength: 1000
      help:
        summary: A plain-language description of the procedure.
        usage: Entered or filled from the coding system.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the procedure stands.
        usage: Updated by the care team.
        valueSemantics:
          PLANNED: Scheduled but not yet started.
          IN_PROGRESS: Being performed.
          COMPLETED: Done. A final state.
          CANCELLED: Not carried out. A final state.
    - name: performedAt
      type: datetime
      required: false
      help:
        summary: When the procedure was performed.
        usage: Recorded when it takes place.
  relationships:
    - name: encounter
      target: HealthcareEncounter
      cardinality: '1'
      ownership: reference
      help:
        summary: The encounter during which the procedure took place.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one encounter: a procedure happens during one episode of care.'
        workflowRole: Places the procedure in the clinical timeline.
    - name: patient
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: "Exactly one patient: a procedure is performed on a specific person, and it must be on that person's record."
        summary: The patient on whom the procedure is performed.
        usage: Set at creation.
        workflowRole: Adds it to the patient's record.
    - name: performer
      target: HealthcareProvider
      cardinality: 0..1
      ownership: reference
      help:
        summary: The provider who performed or will perform the procedure.
        usage: Set when assigned.
        cardinalityMeaning: At most one performer recorded here; the team may be recorded elsewhere.
        workflowRole: Identifies who is responsible for the procedure.
  lifecycle:
    title: Procedure Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a procedure is ended"
      description: "When a procedure is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCEDURE-FOLLOW-UP-{{id}}"
              name: "Follow up on procedure {{code}}"
              description: "Procedure {{code}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A clinical procedure that is planned or performed as part of healthcare delivery.
    businessMeaning: Procedures are the interventions that change a patient's condition, from a blood draw to an operation. Recording them, with codes and times, supports care continuity, billing and quality review.
    usage: Planned during an encounter; recorded when performed; read by clinicians, coders and billing.
    relationshipContext: A procedure is part of a HealthcareEncounter, is for a HealthcarePatient and is carried out by a HealthcareProvider.
    lifecycle: A procedure is planned, in progress while performed, and completed; it can be cancelled before it happens.
    example: Appendectomy, coded in the procedure coding system and performed on 12 May during an inpatient stay.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROCEDURE
