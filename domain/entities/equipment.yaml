entity:
  name: Equipment
  namespace: cedm.domain
  kind: maintenance_asset_role
  description: A governed maintainable equipment identity linked to an Asset where financial capitalization and operational maintenance identities overlap.
  ui:
    icon: wrench
  identity: {key: equipmentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: equipmentId, type: uuid, required: true, immutable: true, help: {summary: "The identity of the equipment record, independent of the asset's financial number.", usage: Generated on creation; work orders and meters refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: 'When the equipment record took effect, usually when it was put into service.', usage: Set at registration; maintenance history is counted from it.}}
    - name: equipmentNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The tag of the equipment on site, such as P-101.
        usage: Painted or labelled on the equipment; work orders use it.
        relationshipContext: Unique.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: A description of the equipment and its function, such as "Feed pump line 1".
        usage: Shown on work orders and lists.
        relationshipContext: Identifies it for people, with the tag.
    - name: equipmentType
      type: string
      required: false
      maxLength: 100
      help:
        summary: The kind of equipment, such as "Centrifugal pump".
        usage: Decides which maintenance plans and inspection checklists apply.
        relationshipContext: Follows the site's equipment classes.
    - name: manufacturerName
      type: string
      required: false
      maxLength: 150
      help:
        summary: The name of the company that made the equipment.
        usage: Used when ordering spare parts and arranging manufacturer service.
        relationshipContext: The manufacturer's organisation record may also be linked.
    - name: model
      type: string
      required: false
      maxLength: 150
      help:
        summary: The manufacturer's model designation for the equipment.
        usage: Used to order parts and find the right manuals and service instructions.
        relationshipContext: Copied as it appears on the nameplate.
    - name: serialNumber
      type: string
      required: false
      maxLength: 100
      help:
        summary: The manufacturer's serial number for this individual unit.
        usage: Quoted for warranty claims and checked against recall notices.
        relationshipContext: Copied as it appears on the nameplate.
    - name: installationDate
      type: date
      required: false
      help:
        summary: The day the equipment was installed at its location.
        usage: Starts its operating history and its warranty period.
        relationshipContext: Not in the future.
    - name: criticality
      type: enum
      required: true
      default: B
      values:
        - A
        - B
        - C
      help:
        summary: How important the equipment is to safety and production.
        usage: Decides maintenance priority and how many spares are kept.
        relationshipContext: Set by a criticality assessment.
        valueSemantics:
          A: Critical — its failure stops production or creates a safety or environmental risk.
          B: Important — its failure reduces output or quality.
          C: Minor — its failure has little effect.
    - name: operatingStatus
      type: enum
      required: true
      default: IN_OPERATION
      values:
        - IN_OPERATION
        - DOWN
        - STANDBY
        - DECOMMISSIONED
      help:
        summary: Whether the equipment is currently running.
        usage: Updated by operations and maintenance whenever the equipment starts, stops or is retired.
        relationshipContext: Downtime is measured from changes of this status.
        valueSemantics:
          IN_OPERATION: Running as intended and producing or serving normally.
          DOWN: Not running because of a failure or maintenance.
          STANDBY: Available but not running.
          DECOMMISSIONED: Permanently out of service.
    - name: warrantyEndDate
      type: date
      required: false
      help:
        summary: The last day of the manufacturer's warranty.
        usage: Repairs before it are claimed from the manufacturer.
        relationshipContext: Empty when there is no warranty.
  relationships:
    - {name: asset, target: Asset, cardinality: "0..1", ownership: reference, help: {summary: The fixed asset that represents the same machine in the financial records., usage: Set where the machine is capitalised., cardinalityMeaning: At most one asset; consumable or leased equipment may have none., workflowRole: Keeps maintenance and financial records of the same machine consistent., businessMeaning: Connects maintainable object to capitalization identity when applicable.}}
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the equipment is installed.
        usage: Recorded at installation and updated when it moves.
        cardinalityMeaning: One per equipment.
        context: Technicians are sent here.
    - name: parentEquipment
      target: Equipment
      cardinality: 0..1
      ownership: reference
      help:
        summary: The larger equipment it is part of.
        usage: Builds the equipment hierarchy, such as a motor inside a pump set.
        cardinalityMeaning: At most one parent.
        context: Cannot be itself.
    - name: manufacturer
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The manufacturer's organization record.
        usage: Linked for service contracts and recalls.
        cardinalityMeaning: At most one.
        context: The name is also copied onto the equipment.
  invariants:
    - {id: EQUIPMENT-001, rule: Finalized lifecycle or financial evidence must be corrected by explicit compensating or superseding records rather than silent history rewrite.}
  help:
    summary: A maintainable piece of equipment, linked to an asset where the financial record and the maintenance record describe the same thing.
    businessMeaning: The finance team sees a capitalised asset; the maintenance team sees a machine with a service history. Equipment is the maintenance identity of that machine, so work orders and meters attach to it while the asset keeps the financial view.
    usage: Created when a machine needs maintenance tracking; read by maintenance planners and technicians.
    relationshipContext: Equipment may be linked to an Asset; maintenance work orders and meters refer to the equipment.
    lifecycle: Finalised financial and lifecycle evidence is corrected by compensating records, not by editing.
    example: A packaging line filler, tracked as equipment E-0071 and linked to its fixed-asset record.
    commonExamples: Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
  lifecycle:
    title: Equipment Lifecycle
    attribute: operatingStatus
    states:
      - IN_OPERATION
      - DOWN
      - STANDBY
      - DECOMMISSIONED
    initial: IN_OPERATION
    terminal:
      - DECOMMISSIONED
    transitions:
      - from: IN_OPERATION
        to: DOWN
        action: stop
      - from: DOWN
        to: IN_OPERATION
        action: restart
      - from: IN_OPERATION
        to: STANDBY
        action: stand_by
      - from: STANDBY
        to: IN_OPERATION
        action: start
      - from: STANDBY
        to: DOWN
        action: stop
      - from: IN_OPERATION
        to: DECOMMISSIONED
        action: decommission
      - from: DOWN
        to: DECOMMISSIONED
        action: decommission
      - from: STANDBY
        to: DECOMMISSIONED
        action: decommission
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-EQUIPMENT}
