entity:
  name: GoodsReceiptLine
  namespace: cedm.domain
  kind: transaction_line
  description: A line-level receiving event that records received, accepted, rejected and pending quantities for a PurchaseOrderLine, preserving the exact evidence used for fulfillment, inventory posting, quality decisions and invoice matching.
  identity: {key: goodsReceiptLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: goodsReceiptLineId, type: uuid, required: true, immutable: true}
  - {name: lineNumber, type: integer, required: true, minimum: 1}
  - {name: receivedQuantity, type: decimal, required: true, precision: 20, scale: 6}
  - {name: acceptedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: rejectedQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - {name: pendingInspectionQuantity, type: decimal, required: true, default: 0, precision: 20, scale: 6}
  - name: unitPrice
    type: Money
    required: false
    help:
      summary: Procurement price basis applicable to the received quantity when captured at receipt time.
      usage: Supports receipt valuation, accruals and invoice matching.
      relationshipContext: Normally inherited from PurchaseOrderLine.unitPrice but may reflect an authorized receipt-specific adjustment.
      workflowRole: Provides financial context without replacing the PurchaseOrderLine commercial commitment.
  - {name: notes, type: string, required: false, maxLength: 2000}
  relationships:
  - name: goodsReceipt
    target: GoodsReceipt
    cardinality: '1'
    ownership: reference
  - name: purchaseOrderLine
    target: PurchaseOrderLine
    cardinality: '1'
    ownership: reference
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: '1'
    ownership: reference
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
  - name: invoiceLines
    target: InvoiceLine
    cardinality: 0..*
    ownership: reference
  invariants:
  - {id: GOODS-RECEIPT-LINE-001, rule: receivedQuantity must be greater than or equal to zero.}
  - {id: GOODS-RECEIPT-LINE-002, rule: acceptedQuantity + rejectedQuantity + pendingInspectionQuantity must equal receivedQuantity unless an explicit disposition adjustment policy exists.}
  - {id: GOODS-RECEIPT-LINE-003, rule: acceptedQuantity must not exceed the outstanding permitted quantity of the referenced PurchaseOrderLine unless an authorized over-receipt tolerance applies.}
  - {id: GOODS-RECEIPT-LINE-004, rule: product must agree with PurchaseOrderLine.product unless an authorized substitution workflow exists.}
  - {id: GOODS-RECEIPT-LINE-005, rule: received, accepted, rejected and pending quantities must use compatible UnitOfMeasure semantics with the PurchaseOrderLine; conversion must be explicit and auditable when units differ.}
  - {id: GOODS-RECEIPT-LINE-006, rule: rejectedQuantity and pendingInspectionQuantity must not be posted as unrestricted accepted inventory.}
  - {id: GOODS-RECEIPT-LINE-007, rule: Only acceptedQuantity may create normal receipt InventoryMovement events.}
  - {id: GOODS-RECEIPT-LINE-008, rule: An accepted quantity may be posted to inventory only once; duplicate InventoryMovement posting for the same receipt disposition is prohibited by idempotency and reconciliation controls.}
  - {id: GOODS-RECEIPT-LINE-009, rule: Posting accepted quantity must update the related PurchaseOrderLine fulfillment state and InventoryBalance through the authoritative receipt-to-movement workflow.}
  - {id: GOODS-RECEIPT-LINE-010, rule: InvoiceLine matching must use acceptedQuantity and applicable price/quantity tolerances; receivedQuantity alone cannot establish MATCHED status.}
  - {id: GOODS-RECEIPT-LINE-011, rule: Corrections to posted receipt quantities require explicit reversal, return, rejection or adjustment workflows and must not destructively rewrite the original receipt evidence.}
  - {id: GOODS-RECEIPT-LINE-012, rule: Changes to Product, UnitOfMeasure, PurchaseOrderLine, InventoryLocation or Supplier status that affect an open receipt must trigger controlled revalidation before receipt posting continues.}
  help:
    summary: Provides the line-level bridge between what was ordered, what arrived, what was accepted, what entered inventory and what can legitimately support a supplier invoice.
    businessMeaning: GoodsReceiptLine is the actual receipt result. PurchaseOrderLine is the commitment. InventoryMovement is the stock consequence. InvoiceLine is the financial claim.
    usage: Receiving, quality, procurement, inventory, supplier management, accounts payable, invoice matching, returns and audit.
    relationshipContext: The PurchaseOrderLine defines ordered product/quantity/price. UnitOfMeasure defines quantity semantics. Accepted receipt creates inventory and fulfillment consequences. Invoice matching relies on accepted evidence.
    workflowContext: PurchaseOrderLine → GoodsReceiptLine → inspection/disposition → accepted/rejected/pending → accepted InventoryMovement → InventoryBalance and PO fulfillment; separately PurchaseOrderLine → InvoiceLine → three-way matching. Master-data changes trigger open-receipt validation.
    lifecycle: Draft → recorded → inspected/dispositioned → accepted/rejected/partially accepted → posted to inventory → retained as historical evidence. Corrections use controlled compensating events.
    idempotency: Receipt posting must use a stable receipt-line/disposition identity so retries cannot create duplicate inventory movements or double-increment accepted fulfillment.
    example: A PO orders 100 units. Receipt records 96 received: 94 accepted, 2 rejected, 0 pending. Exactly 94 units create normal inventory receipt movement and increase accepted PO fulfillment by 94. An invoice for 96 cannot become MATCHED unless an explicit tolerance/exception policy allows it.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-GOODS-RECEIPT-LINE}
