entity:
  name: Practitioner
  namespace: cedm.domain
  kind: healthcare_practitioner
  description: A governed healthcare professional role held by a Person who is authorized to deliver, order, supervise or document healthcare services within defined provider and credential contexts.
  ui: {icon: stethoscope}
  identity: {key: practitionerId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: practitionerId, type: uuid, required: true, immutable: true, help: {summary: "The identity of the practitioner role, independent of the person's other roles.", usage: 'Generated on registration; orders, appointments and encounters refer to it.', businessMeaning: Identifies one governed professional healthcare role independently of the underlying Person identity., relationshipContext: Person supplies human identity while Practitioner supplies professional service role.}}
    - {name: practitionerCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: The code by which the practitioner is known in the healthcare organisation., usage: 'Assigned at credentialing; unique; used on orders, schedules and prescriptions.', businessMeaning: Operational identifier used by healthcare workflows and integrations., relationshipContext: Distinct from professional license numbers and Person identity.}}
    - {name: licenseNumber, type: string, required: false, maxLength: 200, help: {summary: The professional licence number issued by the licensing body., usage: Entered at credentialing from the licence; checked against its expiry before the practitioner is scheduled., businessMeaning: Supports evidence that the practitioner is authorized under an external credentialing regime., relationshipContext: Jurisdiction and credential type may require additional governed context outside this baseline entity.}}
    - {name: specialty, type: string, required: false, maxLength: 200, help: {summary: "The practitioner's clinical specialty, such as cardiology or paediatrics.", usage: Entered at credentialing; used to route referrals and choose the right clinician for an appointment., businessMeaning: Describes the practitioner's service domain for scheduling and routing., relationshipContext: Does not replace formal credential or privilege evidence.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
      help:
        summary: Whether the practitioner is cleared to work.
        usage: Set by credentialing staff; only ACTIVE practitioners can be scheduled or place orders.
        valueSemantics:
          DRAFT: Being credentialed; not yet cleared.
          ACTIVE: Cleared to practise.
          SUSPENDED: Barred while a licence or conduct matter is reviewed.
          INACTIVE: Not currently practising here but may return.
          RETIRED: No longer a practitioner here. A final state.
        businessMeaning: Distinguishes preparation, active practice, temporary restriction, inactivity and retirement.
        relationshipContext: Historical encounters remain attributable after status changes.
  relationships:
    - {name: person, target: Person, cardinality: "1", ownership: reference, help: {summary: The individual who holds the practitioner role., usage: Set at credentialing and not changed., cardinalityMeaning: 'Exactly one person: the professional role is held by a specific individual.', workflowRole: Keeps the person's identity in one place across all their roles., businessMeaning: Separates common human identity from healthcare professional role.}}
    - {name: providers, target: HealthcareProvider, cardinality: "0..*", ownership: reference, help: {summary: The healthcare providers the practitioner works for or through., usage: Linked when privileges are granted., cardinalityMeaning: 'Any number of providers, as practitioners often work at several.', workflowRole: Determines where the practitioner may be scheduled., businessMeaning: Supplies organizational care-delivery context.}}
    - {name: appointments, target: Appointment, cardinality: "0..*", ownership: reference, help: {summary: The appointments booked with the practitioner., usage: Read for the practitioner's schedule., cardinalityMeaning: 'Any number of appointments, past and future.', workflowRole: Show the practitioner's workload., businessMeaning: Provides scheduled-care workload independently of actual encounter history.}}
    - {name: encounters, target: HealthcareEncounter, cardinality: "0..*", ownership: reference, help: {summary: The encounters in which the practitioner took part., usage: Read for clinical history and workload., cardinalityMeaning: Any number of encounters over the practitioner's service., workflowRole: Record who delivered care., businessMeaning: Preserves actual care-delivery attribution.}}
  invariants:
    - {id: PRACTITIONER-001, rule: ACTIVE practitioner participation requires applicable credential and affiliation eligibility under organization policy.}
    - {id: PRACTITIONER-002, rule: "SUSPENDED, INACTIVE or RETIRED status prevents ordinary new appointments or encounters except explicitly governed exceptions."}
    - {id: PRACTITIONER-003, rule: Historical appointment and encounter attribution must not be rewritten merely because practitioner affiliation or credentials later change.}
  lifecycle:
    title: Practitioner Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents the professional healthcare role of a Person.
    businessMeaning: Practitioner identifies who is professionally authorized to deliver care; HealthcareProvider supplies organizational context; Appointment schedules intended care and HealthcareEncounter records actual care.
    usage: Healthcare scheduling, provider directories, encounters, credentialing, reporting and audit.
    relationshipContext: Person is mandatory, provider affiliations define care settings, appointments represent scheduled commitments and encounters preserve actual participation.
    lifecycle: Practitioner roles become active after setup, may suspend or become inactive, and eventually retire while historical care evidence remains attributable.
    example: A physician Person holds one Practitioner record, is affiliated with two HealthcareProviders, has scheduled Appointments and is later referenced by completed HealthcareEncounters.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRACTITIONER}
