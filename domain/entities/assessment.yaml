entity:
  name: Assessment
  namespace: cedm.domain
  kind: education_assessment
  description: A governed education evaluation activity used to measure learner performance against defined course or class expectations, distinct from the Grade that records an individual learner outcome.
  ui: {icon: clipboard-list}
  identity: {key: assessmentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: assessmentId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the assessment definition or event., businessMeaning: Identifies one evaluated learning activity independently of individual learner grades., usage: "Assessment planning, gradebook, reporting and audit.", relationshipContext: Grade records student-specific outcomes against this Assessment.}}
    - {name: assessmentCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: "The educators' reference for this assessment, such as MATH101-MID-2026, used in the gradebook and in integrations.", businessMeaning: Operational identifier used by educators and integrations., usage: "Search, gradebook and reporting.", relationshipContext: Distinct from Class and Course identifiers.}}
    - {name: title, type: string, required: true, maxLength: 300, help: {summary: 'The name learners and educators see for the assessment, such as Midterm Exam or Lab Report 2.', businessMeaning: Describes the evaluated activity to learners and educators., usage: "Portals, schedules and reports.", relationshipContext: Assessment type and Class supply further context.}}
    - name: assessmentType
      type: enum
      required: true
      values: [QUIZ, EXAM, ASSIGNMENT, PROJECT, PRACTICAL, ORAL, OTHER]
      help:
        summary: Business category of the evaluated learning activity.
        businessMeaning: Supports policy, weighting and reporting without embedding every pedagogy rule.
        usage: Gradebook, planning and analytics.
        relationshipContext: Max score and grading policy may vary by type.
        valueSemantics: {QUIZ: Short-form evaluation., EXAM: Formal examination., ASSIGNMENT: Submitted coursework., PROJECT: Project-based evaluation., PRACTICAL: Practical or laboratory evaluation., ORAL: Oral evaluation., OTHER: Another governed assessment type.}
    - {name: maxScore, type: decimal, required: false, precision: 12, scale: 4, help: {summary: Maximum raw score when numeric scoring applies., businessMeaning: Defines the scoring scale for learner Grade values., usage: "Grade calculation and reporting.", relationshipContext: Optional for rubric or categorical assessments.}}
    - {name: dueAt, type: datetime, required: false, help: {summary: Planned submission or assessment deadline., businessMeaning: Establishes timing expectation., usage: "Scheduling, learner communication and late-policy evaluation.", relationshipContext: Must be compatible with Class delivery period under policy.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, PUBLISHED, CLOSED, CANCELLED]
      help:
        summary: Whether learners can see the assessment and whether grades may still be entered against it.
        valueSemantics:
          DRAFT: Being prepared by the educator; not visible to learners and not gradeable.
          PUBLISHED: Active for eligible learners.
          CLOSED: Assessment is complete for ordinary new grading.
          CANCELLED: Assessment was cancelled.
        businessMeaning: Controls learner visibility and grading eligibility.
        usage: "Assessment workflow and reporting."
        relationshipContext: Grades against CLOSED assessments remain historical.
  relationships:
    - {name: course, target: EducationCourse, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Exactly one course; an assessment always measures the learning expectations of a single course., summary: Course whose learning expectations are evaluated., businessMeaning: Supplies curriculum context., usage: "Assessment planning and reporting.", workflowRole: Course lifecycle constrains new assessments.}}
    - {name: class, target: Class, cardinality: "0..1", ownership: reference, help: {summary: Specific Class for which this assessment is administered., businessMeaning: Scopes assessment to one delivery instance where applicable., usage: "Gradebook and learner eligibility.", cardinalityMeaning: Optional for course-wide or reusable assessments., workflowRole: Class must deliver the same course.}}
    - {name: grades, target: Grade, cardinality: "0..*", ownership: aggregate, help: {usage: Read to see every learner's result for this assessment and to compute averages and distributions., cardinalityMeaning: 'Any number, normally one per enrolled learner once grading starts.', summary: Student-specific outcomes recorded against this Assessment., businessMeaning: Separates evaluation definition from individual learner result., workflowRole: Grade student eligibility and score rules must reconcile to Assessment.}}
  invariants:
    - {id: ASSESSMENT-001, rule: maxScore must be positive when supplied.}
    - {id: ASSESSMENT-002, rule: If Class is supplied it must deliver the referenced EducationCourse.}
    - {id: ASSESSMENT-003, rule: CLOSED or CANCELLED assessment history is not destructively rewritten; corrections preserve learner-grade audit evidence.}
  lifecycle:
    title: Assessment Lifecycle
    attribute: status
    states: [DRAFT, PUBLISHED, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: PUBLISHED, action: publish}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: PUBLISHED, to: CLOSED, action: close}
      - {from: PUBLISHED, to: CANCELLED, action: cancel}
  help:
    summary: Defines an education evaluation activity separately from student-specific results.
    businessMeaning: Assessment says what is evaluated; Grade records how one EducationStudent performed.
    usage: Schools, universities, training programs, gradebooks, learner portals and analytics.
    relationshipContext: EducationCourse is mandatory, Class optionally scopes delivery, and Grades preserve individual outcomes.
    lifecycle: Assessments are drafted, published and then closed or cancelled while outcomes remain auditable.
    example: A final exam Assessment for a Class has a max score of 100 and produces one Grade per participating student.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ASSESSMENT}
