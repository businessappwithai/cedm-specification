entity:
  name: Employment
  namespace: cedm.domain
  kind: workforce_relationship
  description: A time-bounded employment relationship between a person and an organization.
  ui:
    icon: table
  identity:
    key: employmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: employmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the employment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a employment store this identifier. The number or code people quote is a separate field.
  - name: employmentType
    type: enum
    required: true
    values:
    - FULL_TIME
    - PART_TIME
    - CONTRACT
    - TEMPORARY
    - INTERN
    - OTHER
    help:
      summary: The kind of employment contract.
      usage: Decides the rules for hours, benefits and notice.
      relationshipContext: Read with the dates.
      valueSemantics:
        FULL_TIME: A full-time contract.
        PART_TIME: A part-time contract.
        CONTRACT: A fixed-term or project contract.
        TEMPORARY: Temporary work, for example through an agency.
        INTERN: An internship or apprenticeship.
        OTHER: Any other kind.
  - name: startDate
    type: date
    required: true
    help:
      summary: The first day of the employment.
      usage: Starts pay and benefits.
      relationshipContext: Not later than the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The last day of the employment.
      usage: Set for fixed-term contracts and when employment ends.
      relationshipContext: Empty for open-ended contracts still in force.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - SUSPENDED
    - TERMINATED
    help:
      summary: Where the employment stands.
      usage: Moved on by HR.
      relationshipContext: Only active employments are paid.
      valueSemantics:
        PENDING: Agreed; not yet started.
        ACTIVE: In force.
        SUSPENDED: Temporarily suspended.
        TERMINATED: Ended.
  - name: weeklyHours
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The contracted working hours per week.
      usage: Used for pay, leave and capacity.
      relationshipContext: Full-time hours depend on the country.
  - name: payBasis
    type: enum
    required: true
    default: SALARIED
    values: [SALARIED, HOURLY, COMMISSION]
    help:
      summary: How the employee is paid.
      usage: Decides how payroll computes pay.
      relationshipContext: Hourly employees need time records.
      valueSemantics:
        SALARIED: A fixed salary per period.
        HOURLY: Paid for hours worked.
        COMMISSION: Paid mainly on sales.
  - name: noticePeriodDays
    type: integer
    required: false
    help:
      summary: The notice either side must give to end the employment.
      usage: Used when a resignation or dismissal is recorded.
      relationshipContext: From the contract or law.
  relationships:
  - name: employee
    target: Employee
    cardinality: '1'
    ownership: reference
    help:
      summary: The employee the contract is with.
      usage: Set when recording it.
      cardinalityMeaning: Every employment belongs to exactly one employee.
      context: An employee may have several employments over time.
  - name: employer
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The company that employs the person under this contract.
      usage: Set when recording it.
      cardinalityMeaning: Exactly one.
      context: The legal employer.
  - name: position
    target: Position
    cardinality: 0..1
    ownership: reference
    help:
      summary: The position the person fills.
      usage: Set when recording it and changed on moves.
      cardinalityMeaning: At most one.
      context: The position's job and department apply.
  invariants:
  - {id: EMPLOYMENT-001, rule: The employment does not end before it starts., violatedWhen: end_date != null and start_date != null and end_date < start_date, message: The end date is earlier than the start date.}
  lifecycle:
    title: Employment Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    initial: PENDING
    terminal: [TERMINATED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: TERMINATED, action: terminate}
    - {from: SUSPENDED, to: TERMINATED, action: terminate}
  help:
    summary: Represents a workforce relationship called Employment within the CEDM business model.
    businessMeaning: Employment is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Employee, Organization, Position. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: HR records each employment contract a person has with a company — its type, dates, position, hours and pay basis — so that payroll, leave and reporting use the terms that applied at any date.
    lifecycle: Pending until the start date, active while in force, suspended during an approved suspension, and terminated at its end.
    example: 'Employment of Maria Lopez with ACME France: full-time, permanent, from 1 April 2024, position AP Clerk (POS-1210), 35 hours a week, monthly salary.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMPLOYMENT
