entity:
  name: Employment
  namespace: cedm.domain
  kind: workforce_relationship
  description: A time-bounded employment relationship between a person and an organization.
  ui:
    icon: table
  identity:
    key: employmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: employmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: Identifies the employment record associated with this Employment. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employment records, where applicable.
        relationshipContext: Its meaning is specific to Employment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: employmentType
      type: enum
      required: true
      values:
        - FULL_TIME
        - PART_TIME
        - CONTRACT
        - TEMPORARY
        - INTERN
        - OTHER
      help:
        summary: Captures the business meaning of employment type for the Employment. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employment records, where applicable.
        relationshipContext: Its meaning is specific to Employment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          FULL_TIME: Represents the full time state or classification in the context of Employment.
          PART_TIME: Represents the part time state or classification in the context of Employment.
          CONTRACT: Represents the contract state or classification in the context of Employment.
          TEMPORARY: Represents the temporary state or classification in the context of Employment.
          INTERN: Represents the intern state or classification in the context of Employment.
          OTHER: Represents the other state or classification in the context of Employment.
    - name: startDate
      type: date
      required: true
      help:
        summary: The date on which the applicable business period, agreement, service, or lifecycle begins. Related end dates must follow the business chronology.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employment records, where applicable.
        relationshipContext: Its meaning is specific to Employment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: endDate
      type: date
      required: false
      help:
        summary: The date on which the applicable business period, agreement, service, or lifecycle ends. It is interpreted together with the corresponding start date.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employment records, where applicable.
        relationshipContext: Its meaning is specific to Employment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PENDING
        - ACTIVE
        - SUSPENDED
        - TERMINATED
      help:
        summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employment records, where applicable.
        relationshipContext: Its meaning is specific to Employment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          PENDING: Represents the pending state or classification in the context of Employment.
          ACTIVE: Represents the active state or classification in the context of Employment.
          SUSPENDED: Represents the suspended state or classification in the context of Employment.
          TERMINATED: Represents the terminated state or classification in the context of Employment.
  relationships:
    - name: employee
      target: Employee
      cardinality: '1'
      ownership: reference
      help:
        summary: Connects Employment to Employee so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Employee records associated with a Employment.
        cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: employer
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: Connects Employment to Organization so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Organization records associated with a Employment.
        cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: position
      target: Position
      cardinality: 0..1
      ownership: reference
      help:
        summary: Connects Employment to Position so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Position records associated with a Employment.
        cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: compensationHistory
      target: Compensation
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: Effective-dated compensation arrangements for this Employment.
        businessMeaning: Preserves remuneration history without overwriting terms used by earlier payroll periods.
        usage: HCM, payroll, workforce planning, budgeting and audit.
        cardinalityMeaning: An Employment may have zero or many compensation records over time.
        workflowRole: Active terms must be temporally compatible with Employment and overlapping terms require governed policy.
    - name: leaveRequests
      target: LeaveRequest
      cardinality: 0..*
      ownership: reference
      help:
        summary: Leave requests governed by this Employment context.
        businessMeaning: Supplies employer and effective-policy context for absence authorization.
        usage: Leave administration, scheduling, payroll and audit.
        cardinalityMeaning: Zero or many requests may occur during an Employment.
        workflowRole: Requested dates must overlap eligible Employment unless an explicit exception applies.
    - name: attendanceRecords
      target: Attendance
      cardinality: 0..*
      ownership: reference
      help:
        summary: Attendance evidence recorded under this Employment.
        businessMeaning: Connects timekeeping evidence to the applicable employer relationship.
        usage: Timekeeping, payroll, scheduling and audit.
        cardinalityMeaning: Zero or many attendance records may occur during an Employment.
        workflowRole: Attendance dates must reconcile with the effective Employment period.

  invariants:
    - id: EMPLOYMENT-001
      rule: endDate must not precede startDate.
  lifecycle:
    title: Employment Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    initial: PENDING
    terminal: [TERMINATED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
  help:
    summary: Represents a workforce relationship called Employment within the CEDM business model.
    businessMeaning: Employment is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Employment records.
    relationshipContext: The entity participates in a wider business graph through relationships with Employee, Organization, Position. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Employment record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMPLOYMENT
