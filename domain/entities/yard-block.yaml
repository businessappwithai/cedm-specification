entity:
  name: YardBlock
  namespace: cedm.domain
  kind: logistics_location
  description: A major operational subdivision of a container yard used to organize storage capacity and group bays with common operational characteristics.
  identity:
    key: yardBlockId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: yardBlockId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable identity of the yard block.
        businessMeaning: Identifies one storage-area subdivision within a specific yard and remains stable even when its capacity or operating rules change.
        usage: Used by yard allocation, planning, reporting, navigation, and movement processes to address a storage area above bay level.
        relationshipContext: The block belongs to one Yard and contains YardBays; its identity is therefore meaningful only within the facility hierarchy.
        requiredMeaning: Required because every operational storage subdivision must be uniquely addressable.
    - name: code
      type: string
      required: true
      maxLength: 50
      help:
        summary: The operational identifier used by people and systems to address the block.
        businessMeaning: Provides the short block designation used on yard maps, equipment instructions, dashboards, and operational messages.
        usage: Used for navigation, slot addressing, capacity reporting, move planning, and integration.
        relationshipContext: The code is interpreted within its parent Yard and should be unique within that yard rather than globally.
        requiredMeaning: Required to provide a usable operational address for the block.
    - name: name
      type: string
      required: false
      maxLength: 150
      help:
        summary: A descriptive name for the block used in user-facing operations and reporting.
        businessMeaning: Allows a block to be described by operational purpose, physical area, or local terminology in addition to its code.
        usage: Used in maps, dashboards, reports, and operator interfaces.
        relationshipContext: Names the block identified by code and yardBlockId; it does not replace the hierarchical identity.
        optionalMeaning: Optional because the code may be sufficient for operational addressing.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, BLOCKED, CLOSED]
      help:
        summary: The operational availability of the block for storage activity.
        businessMeaning: Determines whether its bays can normally be used for container placement or whether the entire subdivision is restricted.
        usage: Used by allocation and planning algorithms to exclude unavailable storage areas.
        relationshipContext: A BLOCKED or CLOSED block can constrain the availability of all subordinate bays and slots regardless of their individual status.
        valueSemantics:
          ACTIVE: Bays and subordinate positions may be used subject to their own constraints.
          BLOCKED: The block is temporarily unavailable for normal placement or movement.
          CLOSED: The block is permanently or administratively unavailable for normal operations.
        requiredMeaning: Required because block availability affects all subordinate storage positions.
  relationships:
    - name: yard
      target: Yard
      cardinality: '1'
      ownership: reference
      help:
        summary: Places the block within its parent yard facility.
        usage: Used to resolve the facility context, capacity, operating rules, and geographic hierarchy of the block.
        cardinalityMeaning: Every block belongs to exactly one yard.
        context: The parent yard determines the facility in which the block physically exists.
    - name: bays
      target: YardBay
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: Defines the bays that subdivide the block into longitudinal storage positions.
        usage: Used to navigate from block-level planning to bay-level and slot-level placement.
        cardinalityMeaning: A modeled operational block contains one or more bays.
        context: Bay numbering is interpreted within this block; the block provides the parent context for uniqueness.
  invariants:
    - id: YARD-BLOCK-001
      rule: code must be unique within a yard.
  help:
    summary: Represents a major storage subdivision within a container yard.
    businessMeaning: YardBlock organizes physical capacity into a manageable operational area, commonly grouping bays that share layout, equipment, or handling characteristics.
    usage: Used for yard zoning, capacity management, placement strategy, navigation, reporting, and movement optimization.
    relationshipContext: YardBlock sits between Yard and YardBay in the physical hierarchy. A block inherits facility context from its Yard and provides the scope in which bay codes are interpreted.
    lifecycle: Blocks can be active, temporarily blocked, or closed. Changes should account for containers already occupying subordinate slots and should not strand active inventory without a relocation or exception process.
    example: A depot yard contains Block B03 dedicated to export dry containers. B03 contains several bays, each containing tiers and atomic slots where containers are positioned.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-YARD-BLOCK
