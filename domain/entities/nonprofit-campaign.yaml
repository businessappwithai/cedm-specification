entity:
  name: NonprofitCampaign
  namespace: cedm.domain
  kind: nonprofit_entity
  description: A fundraising or public-interest campaign organized to achieve a defined funding or participation objective.
  ui:
    icon: megaphone
    recordLabel: [campaignCode, name]
  identity:
    key: campaignId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: campaignId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the nonprofit campaign record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a nonprofit campaign store this identifier. The number or code people quote is a separate field.
  - name: campaignCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the campaign.
      usage: Printed on appeals so gifts can be attributed.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the campaign.
      usage: Shown to donors and in reports.
      relationshipContext: As used in public communication.
  - name: objective
    type: string
    required: false
    maxLength: 2000
    help:
      summary: What the campaign aims to achieve.
      usage: Communicated to donors; results are judged against it.
      relationshipContext: Specific and measurable where possible.
  - name: targetAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The amount the campaign aims to raise.
      usage: Progress is reported against it.
      relationshipContext: Not negative.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - ACTIVE
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the campaign stands.
      usage: Changed by the campaign manager.
      relationshipContext: Gifts are attributed only to active campaigns.
      valueSemantics:
        PLANNED: Being prepared.
        ACTIVE: Running.
        COMPLETED: Finished.
        CANCELLED: Called off.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The organisation running the campaign.
      usage: Set when planning.
      cardinalityMeaning: Each campaign is run by one organisation.
      context: Gifts go to it.
  - name: donors
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties who gave to the campaign.
      usage: Added as gifts arrive.
      cardinalityMeaning: Any number of donors; a donor may give to many campaigns.
      context: Used for thanks and future appeals.
    inverseCardinality: 0..*
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Appeals, reports and other campaign documents.
      usage: Attached by the campaign team.
      cardinalityMeaning: Any number of documents.
      context: Kept with the campaign.
    inverseCardinality: 0..*
  invariants:
  - {id: NONPROFIT-CAMPAIGN-EXE-001, rule: "Target Amount cannot be negative.", violatedWhen: "target_amount != null and target_amount < 0", message: "Target Amount cannot be negative."}
  lifecycle:
    title: Nonprofit Campaign Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a nonprofit campaign is ended"
    description: "When a nonprofit campaign is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "NONPROFIT-CAMPAIGN-FOLLOW-UP-{{id}}"
          name: "Follow up on nonprofit campaign {{name}}"
          description: "Nonprofit campaign {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a nonprofit entity called NonprofitCampaign within the CEDM business model.
    businessMeaning: NonprofitCampaign is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Fundraising staff plan campaigns with an objective and target, record the donors who give, and report progress to the board and donors.
    lifecycle: A campaign is planned, active while it runs, then completed; a planned or running campaign may be cancelled.
    example: Campaign WIN-2024 'Winter shelter appeal', Helping Hands Foundation, target 250,000 EUR, active, 1,840 donors.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-NONPROFIT-CAMPAIGN
