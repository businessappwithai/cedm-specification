entity:
  name: CustomsDeclaration
  namespace: cedm.domain
  kind: trade_entity
  description: A declaration of goods and trade information submitted to a customs authority.
  ui:
    icon: table
  identity:
    key: customsDeclarationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: customsDeclarationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the declaration record.
        usage: Generated on creation; documents, duty payments and shipment events refer to it.
    - name: declarationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number of the declaration, as allocated by the customs system.
        usage: Entered or received on submission; unique; quoted in all correspondence with the authority.
    - name: declarationType
      type: enum
      required: true
      values:
        - IMPORT
        - EXPORT
        - TRANSIT
        - TEMPORARY_IMPORT
        - OTHER
      help:
        summary: What kind of movement the declaration covers.
        usage: Chosen when the declaration is prepared; decides the procedure, duties and documents required.
        valueSemantics:
          IMPORT: Goods entering the customs territory for free circulation.
          EXPORT: Goods leaving the customs territory.
          TRANSIT: Goods passing through the territory under customs control without being released into it.
          TEMPORARY_IMPORT: Goods entering for a limited time and expected to leave again, such as trade-fair exhibits.
          OTHER: Any procedure not listed above.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - SUBMITTED
        - ACCEPTED
        - UNDER_INSPECTION
        - CLEARED
        - REJECTED
        - CANCELLED
      help:
        summary: Where the declaration stands with the authority.
        usage: Updated as the authority responds; goods are released only when the declaration is CLEARED.
        valueSemantics:
          DRAFT: Being prepared by the declarant; not yet submitted.
          SUBMITTED: Sent to the authority and awaiting acceptance.
          ACCEPTED: Accepted for processing by the authority.
          UNDER_INSPECTION: Selected for physical or document inspection; goods are held.
          CLEARED: Approved; goods are released. A final state.
          REJECTED: Refused by the authority; it must be corrected and resubmitted as a new declaration. A final state.
          CANCELLED: Withdrawn by the declarant. A final state.
    - name: declaredValue
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The customs value of the goods, on which duties and taxes are calculated.
        usage: Entered from the commercial invoice and adjusted by customs rules; zero or more.
    - name: currencyId
      type: reference
      target: Currency
      required: false
      help:
        summary: The currency in which the declared value is stated.
        usage: Taken from the invoice; the authority converts it using its own rates.
    - name: declarationDate
      type: date
      required: true
      help:
        summary: The date the declaration was made.
        usage: Entered on submission; duty rates and rules in force on this date apply.
  relationships:
    - name: declarant
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party that makes the declaration.
        usage: Chosen when it is prepared, usually the importer, exporter or their broker.
        cardinalityMeaning: Exactly one declarant, who is legally responsible for the accuracy of the declaration.
        workflowRole: Establishes who answers to the authority.
    - name: authority
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The customs authority to which the declaration is made.
        usage: Chosen according to where the goods cross the border.
        cardinalityMeaning: Exactly one authority.
        workflowRole: Determines the rules and procedures that apply.
    - name: shipment
      target: Shipment
      cardinality: 0..1
      ownership: reference
      help:
        summary: The shipment whose goods are declared.
        usage: Linked so that the shipment's movement waits on clearance.
        cardinalityMeaning: At most one shipment; a declaration may also cover goods not yet shipped.
        workflowRole: Clearance releases the shipment to continue.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The supporting documents submitted with the declaration.
        usage: Attached before submission; read by the authority and in later audits.
        cardinalityMeaning: Any number, such as invoices, packing lists and certificates of origin.
        workflowRole: Provide the evidence for the declared facts.
  invariants:
    - id: CUSTOMS-001
      rule: declaredValue must be zero or greater when supplied.
  lifecycle:
    title: Customs Declaration Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, UNDER_INSPECTION, CLEARED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal: [CLEARED, REJECTED, CANCELLED]
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: ACCEPTED, action: accept}
      - {from: ACCEPTED, to: UNDER_INSPECTION, action: mark_under_inspection}
      - {from: UNDER_INSPECTION, to: CLEARED, action: mark_cleared}
      - {from: DRAFT, to: REJECTED, action: reject}
      - {from: SUBMITTED, to: REJECTED, action: reject}
      - {from: ACCEPTED, to: REJECTED, action: reject}
      - {from: UNDER_INSPECTION, to: REJECTED, action: reject}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: SUBMITTED, to: CANCELLED, action: cancel}
      - {from: ACCEPTED, to: CANCELLED, action: cancel}
      - {from: UNDER_INSPECTION, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a customs declaration is put forward"
      description: "When a customs declaration is submitted, a task asks someone to decide on it."
      when: "status == \"SUBMITTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CUSTOMS-DECLARATION-APPROVAL-{{id}}"
              name: "Decide on customs declaration {{declaration_number}}"
              description: "Customs declaration {{declaration_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a customs declaration is ended"
      description: "When a customs declaration is rejected or cancelled, a task asks someone to settle what depended on it."
      when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CUSTOMS-DECLARATION-FOLLOW-UP-{{id}}"
              name: "Follow up on customs declaration {{declaration_number}}"
              description: "Customs declaration {{declaration_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A declaration of goods and trade information submitted to a customs authority so that the goods may cross a border.
    businessMeaning: Crossing a border legally requires telling customs what is moving, what it is worth and why. The declaration is that statement; its outcome decides whether goods are released, inspected or held, and it is the evidence for duties and audits.
    usage: Prepared by the declarant before goods arrive or leave; submitted to the authority; tracked until cleared; read by logistics, finance and compliance.
    relationshipContext: A declaration is made by a Party (the declarant) to an Organization acting as the authority, may relate to a Shipment and is supported by Documents such as invoices and certificates.
    lifecycle: A declaration is drafted, submitted and accepted, may be selected for inspection, and ends cleared, rejected or cancelled. Clearance releases the goods.
    example: Import declaration CD-2026-88412 for a container of electronics from Shenzhen, accepted on arrival and cleared after document checks.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CUSTOMS-DECLARATION
