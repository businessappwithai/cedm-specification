entity:
  name: CustomsDeclaration
  namespace: cedm.domain
  kind: trade_entity
  description: A declaration of goods and trade information submitted to a customs authority.
  ui:
    icon: table
    recordLabel: [declarationNumber]
  identity:
    key: customsDeclarationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: customsDeclarationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the customs declaration record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a customs declaration store this identifier. The number or code people quote is a separate field.
  - name: declarationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number customs assigned to the declaration (the movement reference).
      usage: Quoted to carriers and in any customs enquiry.
      relationshipContext: Unique.
  - name: declarationType
    type: enum
    required: true
    values:
    - IMPORT
    - EXPORT
    - TRANSIT
    - TEMPORARY_IMPORT
    - OTHER
    help:
      summary: What movement of goods the declaration covers.
      usage: Decides which data and duties apply.
      relationshipContext: Read with the customs procedure.
      valueSemantics:
        IMPORT: Goods entering the customs territory.
        EXPORT: Goods leaving the customs territory.
        TRANSIT: Goods passing through under customs control.
        TEMPORARY_IMPORT: Goods brought in for a limited time and re-exported, such as exhibition goods.
        OTHER: Any other procedure.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - ACCEPTED
    - UNDER_INSPECTION
    - CLEARED
    - REJECTED
    - CANCELLED
    help:
      summary: Where the declaration is with customs.
      usage: Moved on by customs responses.
      relationshipContext: Goods may move only once the declaration is cleared.
      valueSemantics:
        DRAFT: Being prepared.
        SUBMITTED: Sent to customs.
        ACCEPTED: Accepted by customs; a movement reference was issued.
        UNDER_INSPECTION: Held for a documentary or physical check.
        CLEARED: Goods released.
        REJECTED: Refused by customs.
        CANCELLED: Withdrawn.
  - name: declaredValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The customs value of the goods.
      usage: Duties and import VAT are computed from it.
      relationshipContext: In the declaration's currency.
  - name: currencyId
    type: reference
    target: Currency
    required: false
    help:
      summary: The currency of the declared value.
      usage: Set from the commercial invoice.
      relationshipContext: Converted at the customs exchange rate.
  - name: declarationDate
    type: date
    required: true
    help:
      summary: The day the declaration was lodged.
      usage: Decides the duty rates and exchange rate that apply.
      relationshipContext: Not in the future.
  - name: customsProcedureCode
    type: string
    required: false
    maxLength: 10
    help:
      summary: The customs procedure code, such as 4000 for release for free circulation.
      usage: Decides the treatment of the goods.
      relationshipContext: From the customs tariff.
  - name: dutyAmount
    type: Money
    required: false
    help:
      summary: The duty and taxes assessed.
      usage: Paid to customs and booked to landed cost.
      relationshipContext: In the local currency.
  relationships:
  - name: declarant
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Who lodged the declaration — the importer or exporter, or their broker.
      usage: Set when preparing it.
      cardinalityMeaning: Every declaration has exactly one declarant.
      context: Responsible to customs for its accuracy.
  - name: authority
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The customs office the declaration is lodged with.
      usage: Set when preparing it.
      cardinalityMeaning: Exactly one.
      context: Its decisions move the status.
  - name: shipment
    target: Shipment
    cardinality: 0..1
    ownership: reference
    help:
      summary: The shipment the declaration covers.
      usage: Linked when preparing it.
      cardinalityMeaning: At most one.
      context: The shipment waits for clearance.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Supporting documents, such as the commercial invoice and certificates of origin.
      usage: Attached when preparing the declaration.
      cardinalityMeaning: Many documents per declaration; a document may support several.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  invariants:
  - id: CUSTOMS-001
    rule: declaredValue must be zero or greater when supplied.
  - {id: CUSTOMS-DECLARATION-EXE-001, rule: "Duty Amount cannot be negative.", violatedWhen: "duty_amount != null and duty_amount < 0", message: "Duty Amount cannot be negative."}
  lifecycle:
    title: Customs Declaration Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, UNDER_INSPECTION, CLEARED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal: [CLEARED, REJECTED, CANCELLED]
    transitions:
    - {from: DRAFT, to: SUBMITTED, action: submit}
    - {from: SUBMITTED, to: ACCEPTED, action: accept}
    - {from: ACCEPTED, to: UNDER_INSPECTION, action: mark_under_inspection}
    - {from: UNDER_INSPECTION, to: CLEARED, action: mark_cleared}
    - {from: DRAFT, to: REJECTED, action: reject}
    - {from: SUBMITTED, to: REJECTED, action: reject}
    - {from: ACCEPTED, to: REJECTED, action: reject}
    - {from: UNDER_INSPECTION, to: REJECTED, action: reject}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: SUBMITTED, to: CANCELLED, action: cancel}
    - {from: ACCEPTED, to: CANCELLED, action: cancel}
    - {from: UNDER_INSPECTION, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a customs declaration is put forward"
    description: "When a customs declaration is submitted, a task asks someone to decide on it."
    when: "status == \"SUBMITTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CUSTOMS-DECLARATION-APPROVAL-{{id}}"
          name: "Decide on customs declaration {{declaration_number}}"
          description: "Customs declaration {{declaration_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a customs declaration is ended"
    description: "When a customs declaration is rejected or cancelled, a task asks someone to settle what depended on it."
    when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CUSTOMS-DECLARATION-FOLLOW-UP-{{id}}"
          name: "Follow up on customs declaration {{declaration_number}}"
          description: "Customs declaration {{declaration_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a trade entity called CustomsDeclaration within the CEDM business model.
    businessMeaning: CustomsDeclaration is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Shipment, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Trade compliance or the appointed customs broker prepares the declaration for each import or export movement, submits it electronically, answers queries and inspections, and records clearance; duties paid and the movement reference are kept for audit.
    lifecycle: Drafted, submitted to customs, accepted with a movement reference, possibly held for inspection, and cleared when the goods are released. Customs may reject it; a draft may be cancelled.
    example: Export declaration 24FR000123456789A1 for shipment SH-55120, goods value 186,400 EUR, declared by ACME France via broker, submitted 11 March, cleared 11 March 15:20.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CUSTOMS-DECLARATION
