entity:
  name: DataQualityAssessment
  namespace: cedm.domain
  kind: data_governance_entity
  description: A measurement of a dataset's quality on stated dimensions — completeness, validity, uniqueness, timeliness — with the scores, the rules applied, the issues found and whether it meets its targets.
  ui:
    icon: badge-check
    recordLabel: [dataQualityAssessmentCode]
  identity:
    key: dataQualityAssessmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: dataQualityAssessmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the data quality assessment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a data quality assessment store this identifier. The number or code people quote is a separate field.
  - name: dataQualityAssessmentCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: The reference of the assessment.
      usage: Assigned when it is planned.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RUNNING, COMPLETED, CANCELLED]
    help:
      summary: Where the assessment stands.
      usage: Moved on by the data steward.
      relationshipContext: Completed assessments are not changed.
      valueSemantics:
        PLANNED: Scheduled, not yet run.
        RUNNING: Rules are executing.
        COMPLETED: Finished, with scores.
        CANCELLED: Abandoned.
  - name: assessedAt
    type: datetime
    required: false
    help:
      summary: When the assessment ran.
      usage: Recorded on completion; trends are plotted by it.
      relationshipContext: Present once completed.
  - name: recordsAssessed
    type: integer
    required: false
    help:
      summary: How many records were checked.
      usage: Recorded on completion.
      relationshipContext: Scores are percentages of it.
  - name: completenessPercent
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The share of required values present.
      usage: Measured by the completeness rules.
      relationshipContext: Between 0 and 100.
  - name: validityPercent
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The share of values that meet their format and domain rules.
      usage: Measured by the validity rules.
      relationshipContext: Between 0 and 100.
  - name: uniquenessPercent
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The share of records that are not duplicates.
      usage: Measured by the matching rules.
      relationshipContext: Between 0 and 100.
  - name: timelinessPercent
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The share of records updated within the expected time.
      usage: Measured by the freshness rules.
      relationshipContext: Between 0 and 100.
  - name: overallScore
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The combined quality score.
      usage: Weighted from the dimension scores; shown in data catalogs.
      relationshipContext: Between 0 and 100.
  - name: meetsTarget
    type: boolean
    required: false
    help:
      summary: Whether every dimension met its target.
      usage: Decides whether issues are raised.
      relationshipContext: Present once completed.
  - name: issuesSummary
    type: text
    required: false
    help:
      summary: What was wrong, in summary.
      usage: Read by the data owner.
      relationshipContext: Detailed issue lists are attached.
  relationships:
  - name: dataset
    target: Dataset
    cardinality: '1'
    ownership: reference
    help:
      summary: The dataset assessed.
      usage: Chosen when planning the assessment.
      cardinalityMeaning: Every assessment is of exactly one dataset.
      context: Listed among the dataset's quality assessments.
  - name: steward
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: The data steward who ran the assessment.
      usage: Recorded when planning it.
      cardinalityMeaning: One per assessment.
      context: Follows up issues with the owner.
  invariants:
  - {id: DATA-QUALITY-ASSESSMENT-001, rule: A completed assessment records when it ran., violatedWhen: status == "COMPLETED" and assessed_at == null, message: Record when the assessment ran.}
  - {id: DATA-QUALITY-ASSESSMENT-EXE-001, rule: "Completeness Percent is a percentage between 0 and 100.", violatedWhen: "completeness_percent != null and (completeness_percent < 0 or completeness_percent > 100)", message: "Completeness Percent must be between 0 and 100."}
  - {id: DATA-QUALITY-ASSESSMENT-EXE-002, rule: "Validity Percent is a percentage between 0 and 100.", violatedWhen: "validity_percent != null and (validity_percent < 0 or validity_percent > 100)", message: "Validity Percent must be between 0 and 100."}
  - {id: DATA-QUALITY-ASSESSMENT-EXE-003, rule: "Uniqueness Percent is a percentage between 0 and 100.", violatedWhen: "uniqueness_percent != null and (uniqueness_percent < 0 or uniqueness_percent > 100)", message: "Uniqueness Percent must be between 0 and 100."}
  - {id: DATA-QUALITY-ASSESSMENT-EXE-004, rule: "Timeliness Percent is a percentage between 0 and 100.", violatedWhen: "timeliness_percent != null and (timeliness_percent < 0 or timeliness_percent > 100)", message: "Timeliness Percent must be between 0 and 100."}
  lifecycle:
    title: Data Quality Assessment Lifecycle
    attribute: status
    states: [PLANNED, RUNNING, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RUNNING, action: start}
    - {from: RUNNING, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RUNNING, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a data quality assessment is ended"
      description: "When a data quality assessment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "DATA-QUALITY-ASSESSMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on data quality assessment {{id}}"
              description: "Data quality assessment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: How good a dataset was found to be on a given date, against stated targets.
    businessMeaning: Decisions, reports and AI models are only as good as their data. Measuring a dataset's quality regularly against agreed rules and targets, and recording the scores and issues, tells data owners what to fix and tells consumers whether they can rely on the data.
    usage: Data stewards run assessments on a schedule or after loads; scores below target raise issues for the data owner; trends show whether quality is improving.
    relationshipContext: An assessment is of one Dataset and is listed among its quality assessments. Issues it finds may become Tasks for the owner.
    lifecycle: Planned, running while the rules execute, and completed with its scores; superseded by the next assessment for trends. An assessment can be cancelled before it completes.
    workflowContext: Data governance, data-quality monitoring, AI model validation, regulatory data quality.
    example: "Assessment DQA-2024-05-CUST of dataset 'Customer master': completeness 97.2% (target 98%), validity 99.1%, uniqueness 99.8%, timeliness 100%; 412 records missing tax numbers; below target."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DATA-QUALITY-ASSESSMENT
