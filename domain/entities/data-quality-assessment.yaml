entity:
  name: DataQualityAssessment
  namespace: cedm.domain
  kind: data_governance_entity
  description: A governed assessment of Dataset quality across completeness, validity, consistency, timeliness, and other declared dimensions.
  ui:
    icon: badge-check
  identity:
    key: dataQualityAssessmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: dataQualityAssessmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the assessment.
        usage: Generated on creation; findings and remediation tasks refer to it.
        relationshipContext: Connects this record to its governing Dataset context and downstream evidence.
    - name: dataQualityAssessmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The unique reference for the assessment, such as DQA-2026-031.
        usage: Used to cite the assessment in reports and approvals.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: How far the assessment has progressed from planning through checking to a recorded result.
        usage: Moved by the assessor as work proceeds; only a completed assessment is relied on when judging whether the dataset can be used.
        valueSemantics:
          DRAFT: Being planned; the criteria and scope are not yet fixed.
          ACTIVE: Checks are running and results are being collected.
          COMPLETED: Finished with results recorded for the dataset. A final state.
          CANCELLED: Abandoned before completion, so no result stands. A final state.
        relationshipContext: Status changes can affect related Dataset workflows but never erase historical evidence.
    - name: assessedAt
      type: datetime
      required: false
      help:
        summary: The date and time at which the assessment ran against the dataset.
        usage: Recorded when the assessment completes; quality trends for the dataset are plotted along it.
        relationshipContext: Present once the assessment has completed.
    - name: recordsAssessed
      type: integer
      required: false
      help:
        summary: The number of records in the dataset that were examined during this assessment.
        usage: Filled in when the run completes, so readers know how much data each score is based on.
        relationshipContext: The percentage scores are measured against this count.
    - name: completenessPercent
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The percentage of required values that were actually present in the records checked.
        usage: Calculated by the completeness rules of the assessment and shown beside the other quality dimensions.
        relationshipContext: A value between 0 and 100.
    - name: validityPercent
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The share of values that meet their format and domain rules.
        usage: Measured by the validity rules.
        relationshipContext: Between 0 and 100.
    - name: uniquenessPercent
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The percentage of records checked that were not duplicates of another record.
        usage: Calculated by the matching rules of the assessment; a low figure points to records that need merging.
        relationshipContext: A value between 0 and 100.
    - name: timelinessPercent
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The share of records updated within the expected time.
        usage: Measured by the freshness rules.
        relationshipContext: Between 0 and 100.
    - name: overallScore
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The single combined quality score for the dataset in this assessment.
        usage: Weighted from the individual dimension scores and shown in data catalogues so consumers can judge trust at a glance.
        relationshipContext: A value between 0 and 100.
    - name: meetsTarget
      type: boolean
      required: false
      help:
        summary: Whether every quality dimension reached the target set for the dataset.
        usage: Worked out when the assessment completes; a false result causes data quality issues to be raised.
        relationshipContext: Present once the assessment has completed.
    - name: issuesSummary
      type: text
      required: false
      help:
        summary: A short narrative of what was wrong with the data in this assessment.
        usage: Written for the data owner, who reads it to decide what to clean up first.
        relationshipContext: Detailed lists of failing records are attached separately.
  relationships:
    - name: context
      target: Dataset
      cardinality: '1'
      ownership: reference
      help:
        summary: The dataset that is being assessed.
        usage: Set when the assessment is created and not changed.
        cardinalityMeaning: 'Exactly one dataset: an assessment always judges a specific collection of data.'
        workflowRole: Attaches the findings to the data they describe.
    - name: dataset
      target: Dataset
      cardinality: "1"
      ownership: reference
      help:
        summary: The dataset assessed.
        usage: Chosen when planning the assessment.
        cardinalityMeaning: Every assessment is of exactly one dataset.
        context: Listed among the dataset's quality assessments.
    - name: steward
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The data steward who ran the assessment.
        usage: Recorded when planning it.
        cardinalityMeaning: One per assessment.
        context: Follows up issues with the owner.
  invariants:
    - id: DATA-QUALITY-ASSESSMENT-001
      rule: The governing Dataset relationship is required and must reference a valid record.
    - id: DATA-QUALITY-ASSESSMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: DATA-QUALITY-ASSESSMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
    - {id: DATA-QUALITY-ASSESSMENT-EXE-001, rule: "Completeness Percent is a percentage between 0 and 100.", violatedWhen: "completeness_percent != null and (completeness_percent < 0 or completeness_percent > 100)", message: "Completeness Percent must be between 0 and 100."}
    - {id: DATA-QUALITY-ASSESSMENT-EXE-002, rule: "Validity Percent is a percentage between 0 and 100.", violatedWhen: "validity_percent != null and (validity_percent < 0 or validity_percent > 100)", message: "Validity Percent must be between 0 and 100."}
    - {id: DATA-QUALITY-ASSESSMENT-EXE-003, rule: "Uniqueness Percent is a percentage between 0 and 100.", violatedWhen: "uniqueness_percent != null and (uniqueness_percent < 0 or uniqueness_percent > 100)", message: "Uniqueness Percent must be between 0 and 100."}
    - {id: DATA-QUALITY-ASSESSMENT-EXE-004, rule: "Timeliness Percent is a percentage between 0 and 100.", violatedWhen: "timeliness_percent != null and (timeliness_percent < 0 or timeliness_percent > 100)", message: "Timeliness Percent must be between 0 and 100."}
  lifecycle:
    title: Data Quality Assessment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a data quality assessment is ended"
      description: "When a data quality assessment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "DATA-QUALITY-ASSESSMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on data quality assessment {{id}}"
              description: "Data quality assessment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An assessment of how good a dataset is, across dimensions such as completeness, validity, consistency and timeliness.
    businessMeaning: Data is only as useful as it is trustworthy. A quality assessment records how a dataset was measured and what was found, so analysts and AI teams know whether they can rely on it.
    usage: Run on a schedule or before important use of a dataset; read by data owners, analysts and governance reviewers.
    relationshipContext: Each assessment concerns one Dataset; a dataset gathers many assessments over time.
    lifecycle: An assessment is drafted, active while checks run, completed when results are recorded, or cancelled if abandoned. Completed assessments are kept; a repeat is a new assessment.
    example: A completeness and validity assessment of the customer dataset, run before it feeds a churn model.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DATA-QUALITY-ASSESSMENT
