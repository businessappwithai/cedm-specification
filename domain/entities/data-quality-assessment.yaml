entity:
  name: DataQualityAssessment
  namespace: cedm.domain
  kind: data_governance_entity
  description: A governed assessment of Dataset quality across completeness, validity, consistency, timeliness, and other declared dimensions.
  ui:
    icon: badge-check
  identity:
    key: dataQualityAssessmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: dataQualityAssessmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: Stable identity of the DataQualityAssessment record.
        businessMeaning: Identifies one governed DataQualityAssessment independently of related records and later lifecycle changes.
        usage: Referencing, workflow execution, reporting, audit, and integration.
        relationshipContext: Connects this record to its governing Dataset context and downstream evidence.
    - name: dataQualityAssessmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: Human-readable business reference for the DataQualityAssessment.
        businessMeaning: Provides an operational identifier for searching, documents, reports, and integrations.
        usage: Creation, review, search, workflow, reporting, and audit.
        relationshipContext: Distinct from the immutable UUID identity and scoped to the governed business context.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Lifecycle state of the DataQualityAssessment.
        businessMeaning: Controls whether the record is being prepared, operationally active, historically complete, or cancelled.
        usage: Workflow gating, governance, reporting, and audit.
        relationshipContext: Status changes can affect related Dataset workflows but never erase historical evidence.
        valueSemantics:
          DRAFT: Record is being prepared and is not yet normally effective.
          ACTIVE: Record is effective for its governed business purpose.
          COMPLETED: Governed work or assessment is complete and retained as historical evidence.
          CANCELLED: Record was cancelled through controlled workflow and remains auditable.
  relationships:
    - name: context
      target: Dataset
      cardinality: '1'
      ownership: reference
      help:
        summary: Governing Dataset associated with this DataQualityAssessment.
        businessMeaning: Supplies the business context needed to interpret and validate the record.
        usage: Workflow navigation, validation, traceability, reporting, and audit.
        cardinalityMeaning: Every DataQualityAssessment belongs to exactly one governing Dataset in this baseline model.
        context: Changes to the governing record require revalidation of open dependent records while completed evidence remains historical.
  invariants:
    - id: DATA-QUALITY-ASSESSMENT-001
      rule: The governing Dataset relationship is required and must reference a valid record.
    - id: DATA-QUALITY-ASSESSMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: DATA-QUALITY-ASSESSMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Data Quality Assessment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a data quality assessment is ended"
      description: "When a data quality assessment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "DATA-QUALITY-ASSESSMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on data quality assessment {{id}}"
              description: "Data quality assessment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents DataQualityAssessment as a first-class governed CEDM business concept.
    businessMeaning: A governed assessment of Dataset quality across completeness, validity, consistency, timeliness, and other declared dimensions.
    usage: Domain workflows, validation, reporting, audit, integration, and cross-entity traceability.
    relationshipContext: Dataset supplies the primary governing context; dependent workflows consume this record without silently mutating historical evidence.
    lifecycle: Draft → active → completed, with controlled cancellation and correction paths.
    changePropagation: Material changes revalidate open dependent workflows and preserve completed historical evidence.
    example: A DataQualityAssessment is created for a valid Dataset, progresses through its governed lifecycle, and remains traceable after completion.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DATA-QUALITY-ASSESSMENT
