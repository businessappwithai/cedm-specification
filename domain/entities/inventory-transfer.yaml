entity:
  name: InventoryTransfer
  namespace: cedm.domain
  kind: inventory_control_transaction
  description: A governed authorization to relocate inventory between InventoryLocations, with actual stock effects represented by attributable InventoryMovement transfer events.
  ui:
    icon: boxes
  identity: {key: inventoryTransferId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: inventoryTransferId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the inventory transfer record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a inventory transfer store this identifier. The number or code people quote is a separate field.
  - name: transferNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the transfer.
      businessMeaning: Operational identifier for relocation work.
      usage: Printed on the transfer document.
      relationshipContext: Unique.
  - name: requestedQuantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How much stock is to be moved.
      businessMeaning: Defines transfer demand.
      usage: Entered when the transfer is requested.
      relationshipContext: In the product's stock unit.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    help:
      summary: Where the transfer stands.
      businessMeaning: Controls warehouse execution eligibility.
      usage: Moved on by release and completion.
      relationshipContext: Stock changes location on completion.
      valueSemantics:
        PLANNED: Requested, not yet released.
        RELEASED: Released to the warehouse.
        IN_PROGRESS: Being moved.
        COMPLETED: Moved and confirmed.
        CANCELLED: Called off.
  - name: movedQuantity
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: How much was actually moved.
      usage: Confirmed when the transfer is completed.
      relationshipContext: Less than requested means a partial transfer.
  - name: reason
    type: string
    required: false
    maxLength: 300
    help:
      summary: Why the stock is moved, such as replenishment or consolidation.
      usage: Recorded when requesting the transfer.
      relationshipContext: Free text.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: When the transfer was completed.
      usage: Recorded on completion.
      relationshipContext: Present once completed.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product moved.
      businessMeaning: Defines inventory item affected.
      workflowRole: All movements must match.
      usage: Set when requesting the transfer.
      cardinalityMeaning: Exactly one.
      context: Its stock moves between the two locations.
  - name: sourceLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the stock is taken from.
      businessMeaning: Defines transfer origin.
      workflowRole: Must differ from target and hold eligible stock.
      usage: Set when requesting the transfer.
      cardinalityMeaning: Exactly one.
      context: Must hold enough stock.
  - name: targetLocation
    target: InventoryLocation
    cardinality: "1"
    ownership: reference
    help:
      summary: Where the stock goes.
      businessMeaning: Defines transfer destination.
      workflowRole: Must be eligible for product/status.
      usage: Set when requesting the transfer.
      cardinalityMeaning: Exactly one.
      context: Different from the source.
  - name: lot
    target: Lot
    cardinality: 0..1
    ownership: reference
    help:
      summary: The lot moved, for lot-tracked products.
      businessMeaning: Preserves batch identity across relocation.
      workflowRole: Source/target stock remains same lot.
      usage: Chosen when requesting.
      cardinalityMeaning: At most one.
      context: Lot identity is kept through the move.
  - name: serialNumbers
    target: SerialNumber
    cardinality: 0..*
    ownership: reference
    help:
      summary: The serial numbers moved.
      businessMeaning: Preserves unit custody.
      workflowRole: Serial custody moves atomically.
      usage: Scanned during the move.
      cardinalityMeaning: Any number.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: The stock movements that carry out the transfer.
      businessMeaning: InventoryMovement remains authoritative ledger.
      workflowRole: Completed quantity must reconcile exactly and retries be idempotent.
      usage: Created on completion.
      cardinalityMeaning: Any number; each movement belongs to one transfer.
      context: The movement records its transfer.
  invariants:
  - {id: INVENTORY-TRANSFER-001, rule: A completed transfer records when it finished., violatedWhen: status == "COMPLETED" and completed_at == null, message: Record when the transfer was completed.}
  - {id: INVENTORY-TRANSFER-EXE-001, rule: "Requested Quantity cannot be negative.", violatedWhen: "requested_quantity != null and requested_quantity < 0", message: "Requested Quantity cannot be negative."}
  - {id: INVENTORY-TRANSFER-EXE-002, rule: "Moved Quantity cannot be negative.", violatedWhen: "moved_quantity != null and moved_quantity < 0", message: "Moved Quantity cannot be negative."}
  lifecycle:
    title: Inventory Transfer Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RELEASED, action: release}
    - {from: RELEASED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when an inventory transfer is ended"
    description: "When an inventory transfer is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "INVENTORY-TRANSFER-FOLLOW-UP-{{id}}"
          name: "Follow up on inventory transfer {{transfer_number}}"
          description: "Inventory transfer {{transfer_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when an inventory transfer is done"
    description: "When an inventory transfer is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "INVENTORY-TRANSFER-COMPLETED-{{id}}"
          name: "Confirm inventory transfer {{transfer_number}}"
          description: "Inventory transfer {{transfer_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Warehouse/inventory relocation authorization separated from stock ledger events.
    businessMeaning: InventoryTransfer explains why and where stock should move; InventoryMovement records what stock actually changed location.
    usage: Putaway, replenishment, staging, inter-bin relocation and controlled warehouse transfers.
    relationshipContext: Product/Lot/Serial identify stock; InventoryLocation supplies origin/destination; InventoryMovement provides authoritative physical effect.
    lifecycle: Planned → released → in progress → completed or cancelled.
    changePropagation: Release reserves/validates eligible stock where policy requires; execution updates balances only through movements.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-TRANSFER}
