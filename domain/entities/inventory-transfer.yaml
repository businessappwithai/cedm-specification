entity:
  name: InventoryTransfer
  namespace: cedm.domain
  kind: inventory_control_transaction
  description: A governed authorization to relocate inventory between InventoryLocations, with actual stock effects represented by attributable InventoryMovement transfer events.
  ui:
    icon: boxes
  identity: {key: inventoryTransferId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: inventoryTransferId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference linking this relocation instruction to the stock movements posted for it.", businessMeaning: Identifies one governed relocation independently of stock postings., usage: "Warehouse transfer, staging, replenishment and audit.", relationshipContext: Groups attributable InventoryMovement events., requiredMeaning: Required.}}
  - {name: transferNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The transfer number warehouse staff see on work lists and scan when moving the goods.", businessMeaning: Operational identifier for relocation work., usage: Warehouse execution and reconciliation., relationshipContext: Distinct from movement numbers., requiredMeaning: Required.}}
  - {name: requestedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: "How much of the product has been authorised to move from the source to the destination location.", businessMeaning: Defines transfer demand., usage: Execution and variance reconciliation., relationshipContext: Interpreted with Product and traceability identities., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    help: {summary: "Shows whether the move is planned, released to the floor, under way, completed or cancelled.", businessMeaning: Controls warehouse execution eligibility., usage: Transfer orchestration and audit., relationshipContext: Posted movements remain immutable regardless of header state., valueSemantics: {PLANNED: Prepared but not executable., RELEASED: Authorized., IN_PROGRESS: Physical relocation underway., COMPLETED: Authorized quantity reconciled., CANCELLED: Remaining work terminated.}, requiredMeaning: Required.}
  relationships:
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product being relocated., businessMeaning: Defines inventory item affected., usage: Validation and reconciliation., cardinalityMeaning: Exactly one Product., workflowRole: All movements must match.}}
  - {name: sourceLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: Location inventory leaves., businessMeaning: Defines transfer origin., usage: Availability and warehouse execution., cardinalityMeaning: Exactly one source., workflowRole: Must differ from target and hold eligible stock.}}
  - {name: targetLocation, target: InventoryLocation, cardinality: "1", ownership: reference, help: {summary: Location inventory enters., businessMeaning: Defines transfer destination., usage: "Putaway, replenishment and staging.", cardinalityMeaning: Exactly one target., workflowRole: Must be eligible for product/status.}}
  - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {summary: Lot being transferred., businessMeaning: Preserves batch identity across relocation., usage: Traceability and FEFO., cardinalityMeaning: Required under lot-control policy., workflowRole: Source/target stock remains same lot.}}
  - {name: serialNumbers, target: SerialNumber, cardinality: 0..*, ownership: reference, help: {summary: Serialized units relocated., businessMeaning: Preserves unit custody., usage: Scanning and audit., cardinalityMeaning: Required under serialization policy., workflowRole: Serial custody moves atomically.}}
  - {name: inventoryMovements, target: InventoryMovement, cardinality: 0..*, ownership: reference, help: {summary: Posted stock events executing transfer., businessMeaning: InventoryMovement remains authoritative ledger., usage: Balance reconciliation and audit., cardinalityMeaning: One or more movements may represent execution/reversal., workflowRole: Completed quantity must reconcile exactly and retries be idempotent.}}
  invariants:
  - {id: INVENTORY-TRANSFER-001, rule: requestedQuantity must be greater than zero and sourceLocation must differ from targetLocation.}
  - {id: INVENTORY-TRANSFER-002, rule: Execution requires eligible available source stock and compatible target location.}
  - {id: INVENTORY-TRANSFER-003, rule: COMPLETED requires posted transfer movement quantity to reconcile to governed executed quantity.}
  - {id: INVENTORY-TRANSFER-004, rule: Posted transfers are corrected through reversal/compensating movement rather than history rewrite.}
  - {id: INVENTORY-TRANSFER-EXE-001, rule: "Requested Quantity cannot be negative.", violatedWhen: "requested_quantity != null and requested_quantity < 0", message: "Requested Quantity cannot be negative."}
  lifecycle:
    title: Inventory Transfer Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RELEASED, action: release}
      - {from: RELEASED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a inventory transfer is ended"
      description: "When a inventory transfer is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INVENTORY-TRANSFER-FOLLOW-UP-{{id}}"
              name: "Follow up on inventory transfer {{transfer_number}}"
              description: "Inventory transfer {{transfer_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a inventory transfer is done"
      description: "When a inventory transfer is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INVENTORY-TRANSFER-COMPLETED-{{id}}"
              name: "Confirm inventory transfer {{transfer_number}}"
              description: "Inventory transfer {{transfer_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: "An authorised instruction to move a quantity of a product from one stock location to another, such as from the bulk reserve to a pick face, tracked until the actual stock movements are posted."
    businessMeaning: InventoryTransfer explains why and where stock should move; InventoryMovement records what stock actually changed location.
    usage: Putaway, replenishment, staging, inter-bin relocation and controlled warehouse transfers.
    relationshipContext: Product/Lot/Serial identify stock; InventoryLocation supplies origin/destination; InventoryMovement provides authoritative physical effect.
    lifecycle: Planned → released → in progress → completed or cancelled.
    changePropagation: Release reserves/validates eligible stock where policy requires; execution updates balances only through movements.
    workflowContext: "Inventory planners or replenishment rules create the transfer as planned, a supervisor releases it to the warehouse floor, operators start moving the goods and the stock movements are posted, and the transfer completes when posted quantities match; it can be cancelled at any point before completion."
    example: "Transfer TR-2026-0418 moves 240 cases of bottled water, lot L-0912, from reserve rack R-14 to pick face A-03, released at 07:30 and completed by 09:10."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-TRANSFER}
