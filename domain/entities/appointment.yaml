entity:
  name: Appointment
  namespace: cedm.domain
  kind: healthcare_appointment
  description: A governed scheduled commitment for a HealthcarePatient to receive a healthcare service at a planned time, provider, practitioner or location, distinct from the HealthcareEncounter that records what actually occurred.
  ui: {icon: calendar-clock}
  identity: {key: appointmentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: appointmentId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the booking itself, separate from the encounter that records the care when the patient is seen.', businessMeaning: Identifies one scheduled healthcare commitment independently of encounter execution., usage: "Scheduling, reminders, patient service, reporting and audit.", relationshipContext: HealthcareEncounter may later record actual care but does not replace Appointment identity.}}
    - {name: appointmentNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: 'The scheduling reference given to the appointment, used in reminders and check-in.', businessMeaning: Operational identifier for scheduling and communication., usage: "Search, reminders, check-in and integration.", relationshipContext: Distinct from patient and encounter identifiers.}}
    - {name: appointmentType, type: string, required: true, maxLength: 120, help: {summary: 'The kind of healthcare service the visit is booked for, such as a follow-up consultation, vaccination or imaging slot.', usage: 'Chosen by the scheduler when booking; drives how long a slot is held, which resources it needs and how capacity is reported.', businessMeaning: "Supports routing, duration, resource and preparation policies.", relationshipContext: Does not itself prove what service was actually delivered.}}
    - {name: scheduledStartAt, type: datetime, required: true, help: {summary: "The date and time at which the patient is expected to be seen, in the clinic's planning calendar.", usage: Entered when the appointment is booked and changed on rescheduling; reminders fire from it and lateness is measured against it., businessMeaning: Establishes when the scheduled service is intended to begin., relationshipContext: Must precede scheduledEndAt when an end is supplied.}}
    - {name: scheduledEndAt, type: datetime, required: false, help: {summary: 'The planned end of the slot, giving the time the practitioner and room are held.', usage: Optional; when given it must fall after the start. Capacity planning uses it to detect overlapping bookings for the same resource., businessMeaning: Supports resource-capacity and duration planning., relationshipContext: Must follow scheduledStartAt.}}
    - name: status
      type: enum
      required: true
      default: SCHEDULED
      values: [SCHEDULED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
      help:
        summary: Where the booking stands, from being scheduled through attendance to closure as completed, cancelled or missed.
        usage: Moved by front-desk staff and clinicians as the patient confirms, arrives and is seen; reminders and capacity reports filter on it.
        valueSemantics:
          SCHEDULED: Appointment is booked but not yet confirmed by the patient or provider.
          CONFIRMED: Patient or provider confirmation has been recorded.
          CHECKED_IN: Patient arrival or equivalent readiness has been recorded.
          COMPLETED: Scheduled service concluded and any required encounter evidence is reconciled. A final state.
          CANCELLED: The appointment was cancelled by the patient or provider before it took place. A final state.
          NO_SHOW: Patient did not attend according to policy. A final state.
        businessMeaning: Distinguishes planned, confirmed, arrived and final scheduling outcomes.
        relationshipContext: COMPLETED normally reconciles to encounter evidence when care occurred.
  relationships:
    - {name: patient, target: HealthcarePatient, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Exactly one patient; an appointment cannot exist without the person it is for., summary: Patient for whom the appointment is scheduled., businessMeaning: Establishes the recipient of intended care., usage: "Scheduling, reminders and patient history.", workflowRole: Patient status and scheduling policy constrain new appointments.}}
    - {name: practitioner, target: Practitioner, cardinality: "0..1", ownership: reference, help: {summary: Practitioner scheduled to deliver or supervise care., businessMeaning: Supplies professional resource commitment., usage: "Scheduling, capacity and reporting.", cardinalityMeaning: Optional before assignment or for resource-pool appointments., workflowRole: Practitioner must be eligible when assigned.}}
    - {name: provider, target: HealthcareProvider, cardinality: "0..1", ownership: reference, help: {summary: Healthcare provider organization or service context for the appointment., businessMeaning: Supplies organizational delivery context., usage: "Scheduling, reporting and operational routing.", cardinalityMeaning: Optional where practitioner or location fully determines context., workflowRole: Provider eligibility must agree with assigned practitioner where applicable.}}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Planned physical or virtual service location., businessMeaning: Defines where scheduled care is expected to occur., usage: "Scheduling, navigation and resource planning.", cardinalityMeaning: Optional for unsited or virtual appointments represented elsewhere., workflowRole: Location availability must be validated under scheduling policy.}}
    - {name: encounter, target: HealthcareEncounter, cardinality: "0..1", ownership: reference, help: {summary: Actual healthcare encounter arising from this appointment., businessMeaning: Separates scheduled intent from delivered care evidence., usage: "Scheduling reconciliation, clinical operations and audit.", cardinalityMeaning: Optional before care or for cancelled/no-show appointments., workflowRole: COMPLETED should reconcile to applicable encounter evidence when care was delivered.}}
  invariants:
    - {id: APPOINTMENT-001, rule: scheduledEndAt must be after scheduledStartAt when supplied.}
    - {id: APPOINTMENT-002, rule: Assigned Practitioner and HealthcareProvider must be mutually eligible under applicable affiliation and credential policy.}
    - {id: APPOINTMENT-003, rule: CANCELLED and NO_SHOW appointments do not imply a completed HealthcareEncounter.}
    - {id: APPOINTMENT-004, rule: Historical scheduling outcomes are not destructively rewritten; rescheduling or corrections preserve auditable chronology.}
    - {id: APPOINTMENT-EXE-001, rule: "Scheduled End At must not be earlier than scheduled start at.", violatedWhen: "scheduled_start_at != null and scheduled_end_at != null and scheduled_end_at < scheduled_start_at", message: "Scheduled End At cannot be earlier than scheduled start at."}
  lifecycle:
    title: Appointment Lifecycle
    attribute: status
    states: [SCHEDULED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
    initial: SCHEDULED
    terminal: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - {from: SCHEDULED, to: CONFIRMED, action: confirm}
      - {from: SCHEDULED, to: CHECKED_IN, action: check_in}
      - {from: CONFIRMED, to: CHECKED_IN, action: check_in}
      - {from: CHECKED_IN, to: COMPLETED, action: complete}
      - {from: SCHEDULED, to: CANCELLED, action: cancel}
      - {from: CONFIRMED, to: CANCELLED, action: cancel}
      - {from: SCHEDULED, to: NO_SHOW, action: mark_no_show}
      - {from: CONFIRMED, to: NO_SHOW, action: mark_no_show}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a appointment is ended"
      description: "When a appointment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "APPOINTMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on appointment {{appointment_number}}"
              description: "Appointment {{appointment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents scheduled healthcare intent independently of actual care delivery.
    businessMeaning: Appointment answers when care is planned; HealthcareEncounter records what actually occurred. Keeping them separate supports cancellations, no-shows, rescheduling and audit.
    usage: Patient scheduling, provider capacity, reminders, check-in, operational planning, reporting and integration.
    relationshipContext: HealthcarePatient is mandatory; Practitioner, HealthcareProvider and Location define planned resources; HealthcareEncounter supplies actual-care reconciliation.
    lifecycle: Appointments are scheduled, may be confirmed and checked in, and finish as completed, cancelled or no-show.
    example: A patient schedules a cardiology visit with a Practitioner; after check-in, an Encounter is created and linked when the visit occurs.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-APPOINTMENT}
