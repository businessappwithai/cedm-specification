entity:
  name: Appointment
  namespace: cedm.domain
  kind: healthcare_appointment
  description: A governed scheduled commitment for a HealthcarePatient to receive a healthcare service at a planned time, provider, practitioner or location, distinct from the HealthcareEncounter that records what actually occurred.
  ui: {icon: calendar-clock}
  identity: {key: appointmentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: appointmentId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this booking, kept unchanged through confirmation, rescheduling and the visit itself.", businessMeaning: Identifies one scheduled healthcare commitment independently of encounter execution., usage: "Scheduling, reminders, patient service, reporting and audit.", relationshipContext: HealthcareEncounter may later record actual care but does not replace Appointment identity., requiredMeaning: Required.}}
    - {name: appointmentNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: "The booking reference quoted to the patient and front desk when confirming, changing or checking in.", businessMeaning: Operational identifier for scheduling and communication., usage: "Search, reminders, check-in and integration.", relationshipContext: Distinct from patient and encounter identifiers., requiredMeaning: Required.}}
    - {name: appointmentType, type: string, required: true, maxLength: 120, help: {summary: "The kind of visit booked, such as a new consultation, follow-up or vaccination, which sets duration and preparation.", businessMeaning: "Supports routing, duration, resource and preparation policies.", usage: "Scheduling, capacity planning and reporting.", relationshipContext: Does not itself prove what service was actually delivered., requiredMeaning: Required.}}
    - {name: scheduledStartAt, type: datetime, required: true, help: {summary: "The date and time the patient is expected to be seen, used for reminders and lateness.", businessMeaning: Establishes when the scheduled service is intended to begin., usage: "Scheduling, reminders, capacity and lateness measurement.", relationshipContext: Must precede scheduledEndAt when an end is supplied., requiredMeaning: Required.}}
    - {name: scheduledEndAt, type: datetime, required: false, help: {summary: "The date and time the booked slot is planned to finish, freeing the practitioner and room for the next patient.", businessMeaning: Supports resource-capacity and duration planning., usage: "Scheduling and capacity management.", relationshipContext: Must follow scheduledStartAt., optionalMeaning: Optional when duration is not fixed at scheduling time.}}
    - name: status
      type: enum
      required: true
      default: SCHEDULED
      values: [SCHEDULED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
      help:
        summary: "Shows whether the booking is scheduled, confirmed, checked in, completed, cancelled or a no-show by the patient."
        businessMeaning: Distinguishes planned, confirmed, arrived and final scheduling outcomes.
        usage: Scheduling, reminders, check-in, operations and reporting.
        relationshipContext: COMPLETED normally reconciles to encounter evidence when care occurred.
        valueSemantics:
          SCHEDULED: Appointment is booked but not yet confirmed.
          CONFIRMED: Patient or provider confirmation has been recorded.
          CHECKED_IN: Patient arrival or equivalent readiness has been recorded.
          COMPLETED: Scheduled service concluded and any required encounter evidence is reconciled.
          CANCELLED: Appointment was cancelled through governed workflow.
          NO_SHOW: Patient did not attend according to policy.
        requiredMeaning: Required.
  relationships:
    - {name: patient, target: HealthcarePatient, cardinality: "1", ownership: reference, help: {summary: Patient for whom the appointment is scheduled., businessMeaning: Establishes the recipient of intended care., usage: "Scheduling, reminders and patient history.", cardinalityMeaning: Exactly one HealthcarePatient., workflowRole: Patient status and scheduling policy constrain new appointments.}}
    - {name: practitioner, target: Practitioner, cardinality: "0..1", ownership: reference, help: {summary: Practitioner scheduled to deliver or supervise care., businessMeaning: Supplies professional resource commitment., usage: "Scheduling, capacity and reporting.", cardinalityMeaning: Optional before assignment or for resource-pool appointments., workflowRole: Practitioner must be eligible when assigned.}}
    - {name: provider, target: HealthcareProvider, cardinality: "0..1", ownership: reference, help: {summary: Healthcare provider organization or service context for the appointment., businessMeaning: Supplies organizational delivery context., usage: "Scheduling, reporting and operational routing.", cardinalityMeaning: Optional where practitioner or location fully determines context., workflowRole: Provider eligibility must agree with assigned practitioner where applicable.}}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Planned physical or virtual service location., businessMeaning: Defines where scheduled care is expected to occur., usage: "Scheduling, navigation and resource planning.", cardinalityMeaning: Optional for unsited or virtual appointments represented elsewhere., workflowRole: Location availability must be validated under scheduling policy.}}
    - {name: encounter, target: HealthcareEncounter, cardinality: "0..1", ownership: reference, help: {summary: Actual healthcare encounter arising from this appointment., businessMeaning: Separates scheduled intent from delivered care evidence., usage: "Scheduling reconciliation, clinical operations and audit.", cardinalityMeaning: Optional before care or for cancelled/no-show appointments., workflowRole: COMPLETED should reconcile to applicable encounter evidence when care was delivered.}}
  invariants:
    - {id: APPOINTMENT-001, rule: scheduledEndAt must be after scheduledStartAt when supplied.}
    - {id: APPOINTMENT-002, rule: Assigned Practitioner and HealthcareProvider must be mutually eligible under applicable affiliation and credential policy.}
    - {id: APPOINTMENT-003, rule: CANCELLED and NO_SHOW appointments do not imply a completed HealthcareEncounter.}
    - {id: APPOINTMENT-004, rule: Historical scheduling outcomes are not destructively rewritten; rescheduling or corrections preserve auditable chronology.}
  lifecycle:
    title: Appointment Lifecycle
    attribute: status
    states: [SCHEDULED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
    initial: SCHEDULED
    terminal: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - {from: SCHEDULED, to: CONFIRMED, action: confirm}
      - {from: SCHEDULED, to: CHECKED_IN, action: check_in}
      - {from: CONFIRMED, to: CHECKED_IN, action: check_in}
      - {from: CHECKED_IN, to: COMPLETED, action: complete}
      - {from: SCHEDULED, to: CANCELLED, action: cancel}
      - {from: CONFIRMED, to: CANCELLED, action: cancel}
      - {from: SCHEDULED, to: NO_SHOW, action: mark_no_show}
      - {from: CONFIRMED, to: NO_SHOW, action: mark_no_show}
  help:
    summary: "One booked slot for a patient to receive a healthcare service at a planned time, with a chosen practitioner, provider or location, kept so clinics can plan capacity, send reminders and track attendance."
    businessMeaning: Appointment answers when care is planned; HealthcareEncounter records what actually occurred. Keeping them separate supports cancellations, no-shows, rescheduling and audit.
    usage: Patient scheduling, provider capacity, reminders, check-in, operational planning, reporting and integration.
    relationshipContext: HealthcarePatient is mandatory; Practitioner, HealthcareProvider and Location define planned resources; HealthcareEncounter supplies actual-care reconciliation.
    lifecycle: Appointments are scheduled, may be confirmed and checked in, and finish as completed, cancelled or no-show.
    example: A patient schedules a cardiology visit with a Practitioner; after check-in, an Encounter is created and linked when the visit occurs.
    workflowContext: "Booked by scheduling staff or the patient, then confirmed and reminded, checked in when the patient arrives, and completed once the visit is linked to the encounter that recorded the care; cancellations and no-shows close it instead and feed capacity and attendance reporting."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-APPOINTMENT}
