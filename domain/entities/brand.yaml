entity:
  name: Brand
  namespace: cedm.domain
  kind: product_reference_master
  description: A governed commercial or manufacturer brand identity associated with Products and ProductVariants for catalog, sourcing, sales, service, and reporting.
  ui:
    icon: list
  identity: {key: brandId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: brandId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the brand record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a brand store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The short code of the brand.
      businessMeaning: Stable business/integration identifier.
      usage: Used in product data and reports.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The brand name as shown to customers.
      businessMeaning: Customer/supplier-facing market identity.
      usage: Shown in catalogues and on product pages.
      relationshipContext: Identifies the brand.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, RETIRED]
    help:
      summary: Whether the brand is in use.
      businessMeaning: Controls future assignment/use.
      usage: Changed by the category manager.
      relationshipContext: Retired brands are not offered on new products.
      valueSemantics:
        ACTIVE: In use.
        INACTIVE: Temporarily not used.
        RETIRED: No longer used.
  - name: description
    type: text
    required: false
    help:
      summary: What the brand stands for.
      usage: Used in catalogues and marketing.
      relationshipContext: Free text.
  - name: isOwnBrand
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the brand belongs to the business (a private label).
      usage: Own brands carry different margins and sourcing rules.
      relationshipContext: Third-party brands are supplied by their owners.
  - name: websiteUrl
    type: string
    required: false
    maxLength: 300
    help:
      summary: The brand's website.
      usage: Linked from product pages.
      relationshipContext: Linked from product pages so shoppers can read more about the brand.
  relationships:
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: The products sold under the brand.
      businessMeaning: Connects product portfolio to market identity.
      workflowRole: Brand lifecycle affects future assignments but not historical evidence.
      usage: Listed from the brand.
      cardinalityMeaning: A brand has any number of products; each product has one brand.
      context: The product records its brand.
  - name: variants
    target: ProductVariant
    cardinality: 0..*
    ownership: reference
    help:
      summary: Variants sold under the brand when it differs from the product's.
      businessMeaning: Supports variant-specific brand assignment.
      workflowRole: Variant may inherit brand from parent Product when policy allows.
      usage: Listed from the brand.
      cardinalityMeaning: Any number of variants.
      context: The variant records its brand.
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company that owns the brand.
      usage: Recorded for licensing and sourcing.
      cardinalityMeaning: One owner per brand.
      context: Our own company for own brands.
  invariants:
  - {id: BRAND-001, rule: code must be unique.}
  - {id: BRAND-002, rule: RETIRED brand must not be newly assigned without governed reinstatement or migration.}
  - {id: BRAND-003, rule: Brand rename/status changes must preserve historical transaction and catalog evidence where point-in-time reproduction is required.}
  lifecycle:
    title: Brand Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Governed product brand reference master.
    businessMeaning: Brand describes commercial/manufacturer identity; it is distinct from ProductCategory taxonomy and Product identity.
    usage: PIM, catalog, sourcing, sales, e-commerce, service and analytics.
    relationshipContext: Products and variants reference Brand; category remains independent classification.
    lifecycle: Active → inactive → active or retired.
    changePropagation: Lifecycle/name changes update future catalog/master usage while preserving historical references.
    example: Brand ACME-PRO 'Acme Professional', own brand, www.acme-pro.example, active.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BRAND}
