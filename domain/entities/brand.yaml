entity:
  name: Brand
  namespace: cedm.domain
  kind: product_reference_master
  description: A governed commercial or manufacturer brand identity associated with Products and ProductVariants for catalog, sourcing, sales, service, and reporting.
  ui:
    icon: list
  identity: {key: brandId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: brandId, type: uuid, required: true, immutable: true, help: {summary: Stable brand identity., businessMeaning: Identifies the brand independently of display-name changes., usage: "PIM, catalog, commerce and reporting.", relationshipContext: Referenced by Products/Variants.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: Governed brand code., businessMeaning: Stable business/integration identifier., usage: Catalog and integration., relationshipContext: Unique in brand master.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: Brand display name., businessMeaning: Customer/supplier-facing market identity., usage: "Catalog, documents, search and reporting.", relationshipContext: Presentation can change without changing brand identity.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, INACTIVE, RETIRED]
      help: {summary: Brand lifecycle state., businessMeaning: Controls future assignment/use., usage: Master-data governance., relationshipContext: Historical product/transaction references remain valid., valueSemantics: {ACTIVE: Eligible for new assignment., INACTIVE: Temporarily unavailable for new assignment., RETIRED: Permanently unavailable for new assignment.}}
  relationships:
    - {name: products, target: Product, cardinality: 0..*, ownership: reference, help: {summary: Products marketed/manufactured under brand., businessMeaning: Connects product portfolio to market identity., usage: Catalog and reporting., cardinalityMeaning: Zero or many Products., workflowRole: Brand lifecycle affects future assignments but not historical evidence.}}
    - {name: variants, target: ProductVariant, cardinality: 0..*, ownership: reference, help: {summary: Variants explicitly associated with brand., businessMeaning: Supports variant-specific brand assignment., usage: Catalog and commerce., cardinalityMeaning: Zero or many variants., workflowRole: Variant may inherit brand from parent Product when policy allows.}}
  invariants:
    - {id: BRAND-001, rule: code must be unique.}
    - {id: BRAND-002, rule: RETIRED brand must not be newly assigned without governed reinstatement or migration.}
    - {id: BRAND-003, rule: Brand rename/status changes must preserve historical transaction and catalog evidence where point-in-time reproduction is required.}
  lifecycle:
    title: Brand Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Governed product brand reference master.
    businessMeaning: Brand describes commercial/manufacturer identity; it is distinct from ProductCategory taxonomy and Product identity.
    usage: PIM, catalog, sourcing, sales, e-commerce, service and analytics.
    relationshipContext: Products and variants reference Brand; category remains independent classification.
    lifecycle: Active → inactive → active or retired.
    changePropagation: Lifecycle/name changes update future catalog/master usage while preserving historical references.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BRAND}
