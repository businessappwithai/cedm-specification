entity:
  name: TelecomSubscription
  namespace: cedm.domain
  kind: telecommunications_entity
  description: A customer's subscription to a telecommunications service or plan.
  ui:
    icon: repeat
    recordLabel: [subscriptionNumber]
  identity:
    key: telecomSubscriptionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: telecomSubscriptionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the telecom subscription record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a telecom subscription store this identifier. The number or code people quote is a separate field.
  - name: subscriptionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the subscription.
      usage: Quoted on bills and in care calls.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACTIVE, SUSPENDED, CANCELLED, EXPIRED]
    help:
      summary: Where the subscription stands.
      usage: Changed by care agents and billing.
      relationshipContext: Only active subscriptions are billed.
      valueSemantics:
        PENDING: Signed; not yet started.
        ACTIVE: Running and billed.
        SUSPENDED: Temporarily not billed or used.
        CANCELLED: Ended by a party.
        EXPIRED: Reached the end of its term.
  - name: startDate
    type: date
    required: true
    help:
      summary: The first day of the subscription.
      usage: Billing starts from it.
      relationshipContext: Not after the end.
  - name: endDate
    type: date
    required: false
    help:
      summary: The last day of the subscription term.
      usage: The subscription expires after it unless renewed.
      relationshipContext: Empty for open-ended subscriptions.
  relationships:
  - name: customer
    target: Customer
    cardinality: '1'
    ownership: reference
    help:
      summary: The subscriber.
      usage: Set when signing up.
      cardinalityMeaning: Each subscription belongs to one customer.
      context: Billed to the customer.
  - name: service
    target: TelecomService
    cardinality: '1'
    ownership: reference
    help:
      summary: The service the plan applies to.
      usage: Set when signing up.
      cardinalityMeaning: Each subscription is for one service.
      context: A service may have successive subscriptions.
  - name: plan
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The tariff plan subscribed to.
      usage: Chosen when signing up.
      cardinalityMeaning: At most one plan.
      context: Its fees and allowances apply.
  - name: device
    target: Asset
    cardinality: 0..1
    ownership: reference
    help:
      summary: The device supplied with the subscription, if any.
      usage: Recorded when a device is sold or lent with the plan.
      cardinalityMeaning: At most one device.
      context: Returned or paid off at the end.
  invariants:
  - id: TELECOM-SUBSCRIPTION-001
    rule: endDate must not precede startDate.
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a telecom subscription is ended"
    description: "When a telecom subscription is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "TELECOM-SUBSCRIPTION-FOLLOW-UP-{{id}}"
          name: "Follow up on telecom subscription {{subscription_number}}"
          description: "Telecom subscription {{subscription_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  lifecycle:
    title: Telecom Subscription Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, CANCELLED, EXPIRED]
    initial: PENDING
    terminal: [CANCELLED, EXPIRED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: PENDING, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: SUSPENDED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: SUSPENDED, to: EXPIRED, action: expire}
  help:
    summary: A customer's sign-up to a tariff plan on a service for a period.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, TelecomService, Product, Vehicle. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Sales and care agents sign customers up to a plan for a service, change or suspend it, and end it; billing charges the plan's recurring fees for each active subscription.
    lifecycle: A subscription is pending until it starts, active while billed, may be suspended and resumed, and ends by being cancelled or expiring at the end of its term.
    example: Subscription SUB-2024-0081234, 'Unlimited 5G 24 months' on line +39 347 123 4567 for Bianchi Marco, 1 March 2024–28 February 2026, active.
    businessMeaning: Subscriptions determine recurring revenue and what the customer is entitled to.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TELECOM-SUBSCRIPTION
