entity:
  name: TelecomSubscription
  namespace: cedm.domain
  kind: telecommunications_entity
  description: A customer's subscription to a telecommunications service or plan.
  ui:
    icon: repeat
  identity:
    key: telecomSubscriptionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: telecomSubscriptionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the subscription, constant for its life.
        usage: Generated on creation; billing refers to it.
        relationshipContext: Referenced by recurring charges and usage.
    - name: subscriptionNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number of the subscription, such as TS-00418.
        usage: Unique; quoted on bills and support calls.
        relationshipContext: Read with the service number.
    - name: status
      type: enum
      required: true
      default: PENDING
      values:
        - PENDING
        - ACTIVE
        - SUSPENDED
        - CANCELLED
        - EXPIRED
      help:
        summary: Where the subscription is in its term, from ordering through service to its end.
        usage: Moved by activation, billing and the customer; only active subscriptions are billed, and cancelled or expired ones are closed.
        valueSemantics:
          PENDING: The subscription has been ordered but has not yet started.
          ACTIVE: The subscription is running and being billed.
          SUSPENDED: The subscription is paused, for example for non-payment.
          CANCELLED: The subscription ended early at the customer's or provider's request. A final state.
          EXPIRED: The subscription ran to the end of its term. A final state.
    - name: startDate
      type: date
      required: true
      help:
        summary: The date on which the subscription's service and billing begin.
        usage: Set when the subscription is ordered or activated; billing runs from it, and it must not be later than the end date.
        relationshipContext: Not later than the end date.
    - name: endDate
      type: date
      required: false
      help:
        summary: The date the subscription ends.
        usage: Must not be before the start date; set for fixed terms.
        relationshipContext: Gives the term.
  relationships:
    - name: customer
      target: Customer
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A subscription is held by a single customer, who receives the bill.
        summary: The customer who holds the subscription.
        usage: Chosen when it is created.
        context: Decides who is billed.
    - name: service
      target: TelecomService
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A subscription provides one telecom service; a second line is a second subscription.
        summary: The telecom service the subscription provides.
        usage: Chosen when it is created.
        context: Ties billing to the service delivered.
    - name: plan
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        summary: The plan or product the subscription follows.
        usage: Chosen when it is created.
        cardinalityMeaning: At most one plan.
        context: Sets the price and allowances.
    - name: device
      target: Vehicle
      cardinality: 0..1
      ownership: reference
      help:
        summary: The device supplied with the subscription.
        usage: Chosen when a device is included.
        cardinalityMeaning: At most one device.
        context: Tracks equipment given to the customer.
  invariants:
    - id: TELECOM-SUBSCRIPTION-001
      rule: endDate must not precede startDate.
    - {id: TELECOM-SUBSCRIPTION-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Telecom Subscription Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, CANCELLED, EXPIRED]
    initial: PENDING
    terminal: [CANCELLED, EXPIRED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a telecom subscription is ended"
      description: "When a telecom subscription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TELECOM-SUBSCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on telecom subscription {{subscription_number}}"
              description: "Telecom subscription {{subscription_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A customer's subscription to a telecommunications service or plan.
    businessMeaning: The subscription is the agreement under which a service is provided for a period. It links the customer, the service and the plan, and drives recurring billing and the dates on which the arrangement starts, lapses or ends.
    usage: Created when a customer signs up; read by billing, support and retention.
    relationshipContext: A subscription is for one customer and one service, may follow a plan and may include a device.
    lifecycle: A subscription is pending until it starts, active while it runs, may be suspended and resumed, and ends cancelled or expired. Cancelled and expired are final.
    example: Subscription TS-00418 gives a customer a 5G data plan with a handset for 24 months from 1 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TELECOM-SUBSCRIPTION
