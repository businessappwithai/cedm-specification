entity:
  name: MaintenancePlan
  namespace: cedm.domain
  kind: maintenance_definition
  description: A preventive or condition-based maintenance schedule and policy.
  ui:
    icon: wrench
    recordLabel: [code, name]
  identity:
    key: maintenancePlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: maintenancePlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the maintenance plan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a maintenance plan store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the plan.
      usage: Quoted on the work orders it generates.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What the plan covers, in a few words.
      usage: Shown in planning lists.
      relationshipContext: Names the asset type and the work.
  - name: maintenanceType
    type: enum
    required: true
    values:
    - PREVENTIVE
    - CONDITION_BASED
    - PREDICTIVE
    - INSPECTION
    help:
      summary: The strategy the plan follows.
      usage: Decides whether work is triggered by time, usage or condition.
      relationshipContext: Chosen when defining the plan.
      valueSemantics:
        PREVENTIVE: At fixed intervals of time or usage.
        CONDITION_BASED: When a measured condition crosses a limit.
        PREDICTIVE: When analysis predicts a failure.
        INSPECTION: A recurring inspection rather than repair work.
  - name: frequencyValue
    type: decimal
    required: false
    precision: 12
    scale: 4
    help:
      summary: How many frequency units lie between occurrences.
      usage: With the unit, decides when the next work is due.
      relationshipContext: More than zero when given.
  - name: frequencyUnit
    type: enum
    required: false
    values:
    - HOURS
    - DAYS
    - WEEKS
    - MONTHS
    - MILES
    - CYCLES
    - OTHER
    help:
      summary: The unit the frequency is counted in.
      usage: Time units use the calendar; usage units use meter readings.
      relationshipContext: Required with a frequency value.
      valueSemantics:
        HOURS: Operating hours.
        DAYS: Calendar days.
        WEEKS: Calendar weeks.
        MONTHS: Calendar months.
        MILES: Distance travelled.
        CYCLES: Operating cycles.
        OTHER: Any other unit.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the plan generates work.
      usage: Changed by maintenance planners.
      relationshipContext: Only active plans generate work orders.
      valueSemantics:
        DRAFT: Being defined.
        ACTIVE: Generating work.
        SUSPENDED: Temporarily not generating work.
        RETIRED: No longer used.
  relationships:
  - name: assets
    target: Asset
    cardinality: 0..*
    ownership: reference
    help:
      summary: The assets the plan applies to.
      usage: Linked when the plan is set up.
      cardinalityMeaning: Any number of assets; an asset may follow several plans.
      context: Work orders are generated per asset.
    inverseCardinality: 0..*
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: Product models the plan applies to.
      usage: Linked so new assets of these models follow the plan.
      cardinalityMeaning: Any number of products.
      context: Used as a template for new assets.
    inverseCardinality: 0..*
  invariants:
  - id: MAINT-PLAN-001
    rule: frequencyValue must be positive when supplied.
  lifecycle:
    title: Maintenance Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Represents a maintenance definition called MaintenancePlan within the CEDM business model.
    businessMeaning: MaintenancePlan is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Asset, Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Maintenance planners define recurring work for assets — what is done and how often — and the system generates work orders when a plan comes due; reliability engineers adjust plans from results.
    lifecycle: A plan is drafted, active while it generates work, may be suspended and resumed, and is retired when no longer needed.
    example: Plan PM-CMP-500H 'Compressor 500-hour service', preventive, every 500 hours, for compressors C-101 to C-104, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MAINTENANCE-PLAN
