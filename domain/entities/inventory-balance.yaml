entity:
  name: InventoryBalance
  namespace: cedm.domain
  kind: inventory_state_entity
  description: The current stock-state projection for a Product at an InventoryLocation, derived from posted InventoryMovement and reservation workflows. It is not an independently editable inventory ledger.
  identity:
    key: inventoryBalanceId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: inventoryBalanceId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Immutable identity of the inventory state projection.
      usage: Used to reference and reconcile current stock state independently of movement events.
      relationshipContext: Identifies one Product/location state projection rather than a Product or location itself.
      workflowRole: Provides the current state consumed by allocation, fulfillment, replenishment and inventory control.
  - name: quantityOnHand
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: Physical quantity currently recorded as present at the location.
      usage: Stock visibility, replenishment, counting, fulfillment and inventory control.
      relationshipContext: Represents physical stock and is distinct from reserved and available quantities.
      workflowRole: Derived from posted receipt, issue, transfer, return and adjustment movements.
  - name: quantityReserved
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: Portion of on-hand stock committed to approved demand.
      usage: Allocation and fulfillment planning.
      relationshipContext: Reservations normally do not change physical on-hand quantity.
      workflowRole: Derived from active reservation/release workflows and adjusted when fulfillment consumes or releases a reservation.
  - name: quantityAvailable
    type: decimal
    required: true
    default: 0
    precision: 20
    scale: 6
    help:
      summary: Quantity eligible for new allocation after reservations and applicable restrictions.
      usage: Availability checks, fulfillment, replenishment and planning.
      relationshipContext: Normally equals on-hand minus reserved before additional restrictions.
      workflowRole: Must be recalculated atomically with reservation and movement state changes.
  - name: lastUpdatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: Timestamp of the latest material projection update.
      usage: Concurrency, synchronization, cache freshness, audit and integration.
      relationshipContext: Does not replace movement or reservation event timestamps.
      workflowRole: Supports stale-state detection during allocation and issue processing.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
  - name: inventoryLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: Posted inventory events contributing to the balance projection.
      workflowRole: Supplies the historical event stream against which the balance must reconcile.
  invariants:
  - {id: INVENTORY-BALANCE-001, rule: quantityOnHand, quantityReserved, and quantityAvailable must not be negative unless an explicitly authorized policy permits it.}
  - {id: INVENTORY-BALANCE-002, rule: quantityReserved must not normally exceed quantityOnHand.}
  - {id: INVENTORY-BALANCE-003, rule: quantityAvailable normally equals quantityOnHand minus quantityReserved before additional availability restrictions.}
  - {id: INVENTORY-BALANCE-004, rule: InventoryBalance is a derived projection and must not be used as an independent source of historical inventory truth.}
  - {id: INVENTORY-BALANCE-005, rule: Every material balance change must be attributable to a posted InventoryMovement, reservation/release event, or approved reconciliation workflow.}
  - {id: INVENTORY-BALANCE-006, rule: Reservation and release operations must update reserved and available quantities atomically with their authorization/event and concurrency control.}
  - {id: INVENTORY-BALANCE-007, rule: Product or UnitOfMeasure master changes must not directly rewrite historical inventory quantities; affected future operations require validation of measurement and product eligibility.}
  - {id: INVENTORY-BALANCE-008, rule: InventoryLocation status or hierarchy changes must trigger validation of affected future movements, reservations, transfers and fulfillment workflows before the location becomes unavailable.}
  - {id: INVENTORY-BALANCE-009, rule: A posted inventory correction must be represented by an adjustment/reversal event and must not directly overwrite quantityOnHand history.}
  help:
    summary: Current inventory state projection maintained from authoritative inventory events and reservation workflows.
    businessMeaning: InventoryBalance answers the current operational question of what is on hand, reserved and available. InventoryMovement remains the historical ledger; reservation events explain commitment state.
    usage: Inventory control, warehouse management, order fulfillment, purchasing, maintenance, replenishment, planning and availability.
    relationshipContext: Product defines the stocked item, UnitOfMeasure defines quantity semantics, InventoryLocation defines where stock is held, InventoryMovement records physical/logical stock events, and reservation workflows govern committed quantity.
    workflowContext: Source transaction → authorization → posted inventory event → InventoryBalance projection. Reservations update commitment state without physical movement. Product/UOM/Location changes trigger dependent-workflow validation rather than direct balance mutation.
    concurrency: Allocation and issue must protect against concurrent consumption of the same available quantity using transactional locking, optimistic concurrency or equivalent controls.
    lifecycle: Created when a Product/location combination becomes inventory-relevant → continuously projected from events → reconciled through controlled stock counts/adjustments → retained at zero when history remains relevant.
    example: 100 units are received, 20 are reserved, and 3 are issued. The projection becomes 97 on-hand and, depending on the reservation workflow, 17 reserved and 80 available. If the product UOM conversion later changes, existing stock is not silently reinterpreted; a controlled conversion/reconciliation workflow is required.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-BALANCE}
