entity:
  name: ProfitCenter
  namespace: cedm.domain
  kind: management_accounting_dimension
  description: A governed responsibility center used to analyze revenue, cost, and profitability independently of legal-account identity.
  ui:
    icon: table
  identity: {key: profitCenterId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: profitCenterId, type: uuid, required: true, immutable: true, help: {summary: "The fixed reference for this profit center that revenue and cost entries are tagged with.", businessMeaning: Identifies the governed ProfitCenter concept independently of labels., usage: "Planning, reporting and integration.", relationshipContext: Referenced by compatible financial planning processes., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, maxLength: 100, help: {summary: "The short code finance uses to tag postings and run reports for this profit center.", businessMeaning: Human/integration identifier., usage: Planning and reporting., relationshipContext: Unique within governing context., requiredMeaning: Required.}}
  relationships:
  - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: Governing organization., businessMeaning: Defines management/reporting boundary., usage: Planning and analysis., cardinalityMeaning: Exactly one Organization., workflowRole: References must use compatible organization context.}}
  invariants:
  - {id: PROFITCENTER-001, rule: The record must not directly create or rewrite actual JournalEntry evidence.}
  help: {summary: "A governed responsibility center used to analyze revenue, cost, and profitability independently of legal-account identity.", businessMeaning: Provides planning/management semantics separately from actual accounting evidence., usage: "Planning, control, management reporting and analysis.", relationshipContext: "Organization supplies governance; financial transactions remain authoritative for actuals.", workflowContext: "Controlling sets up a profit center for a business unit or product line, revenue and cost postings are tagged with it during normal operations, management reporting then reads profitability by profit center, and it is closed to new postings when the business area is reorganized.", lifecycle: "A profit center is created and approved by controlling, stays in use for tagging revenue and cost for as long as the business area exists, and is then closed to new postings while its history remains available for reporting.", example: "Profit center PC-RET-EU for the European retail business of Example Holdings, collecting store revenue and costs across all European legal entities."}
