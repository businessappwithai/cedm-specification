entity:
  name: TaxCode
  namespace: cedm.domain
  kind: tax_reference
  description: A governed tax classification code used to select applicable tax rules, rates, jurisdictions, registrations, and reporting treatment.
  ui:
    icon: percent
  identity: {key: taxCodeId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: taxCodeId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the tax code, constant when it is renamed.', businessMeaning: Lets transactions point at the code without depending on its label., usage: Generated on creation; tax lines refer to it., relationshipContext: Referenced by every transaction taxed under the code.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the tax code can be used on new transactions.
        businessMeaning: Keeps retired codes from being chosen while history stays intact.
        usage: Starts as DRAFT; set by tax staff.
        relationshipContext: Only active codes are offered on documents.
        valueSemantics:
          DRAFT: Being defined; not yet usable.
          ACTIVE: In use on transactions.
          COMPLETED: No longer used on new transactions. A final state.
          CANCELLED: Withdrawn before use. A final state.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 30
      help:
        summary: The short code entered on transactions, such as FR-VAT-S.
        usage: Chosen on order and invoice lines, or defaulted from the product and party.
        relationshipContext: Unique.
    - name: name
      type: string
      required: true
      maxLength: 150
      help:
        summary: The name of the code, such as "France VAT standard".
        usage: Shown where the code is chosen and on tax reports.
        relationshipContext: Identifies the code for people.
    - name: taxType
      type: enum
      required: true
      default: VAT
      values:
        - VAT
        - GST
        - SALES_TAX
        - USE_TAX
        - WITHHOLDING
        - EXCISE
      help:
        summary: Which tax this code belongs to, such as VAT, sales tax or withholding.
        usage: Chosen by tax staff when the code is set up; it decides which return the taxed transactions appear on and which rates are looked up.
        relationshipContext: Read together with the category, which says how that tax is treated on the line.
        valueSemantics:
          VAT: Value-added tax charged at each stage of supply and reclaimed on purchases.
          GST: Goods and services tax, the value-added style tax used in countries such as Australia, India and Canada.
          SALES_TAX: Tax charged to the buyer at the point of sale and remitted by the seller.
          USE_TAX: Tax the buyer owes directly on purchases where no sales tax was charged by the supplier.
          WITHHOLDING: Tax deducted from a payment to a supplier or employee and paid over to the authority.
          EXCISE: Duty charged on specific goods such as fuel, alcohol or tobacco.
    - name: category
      type: enum
      required: true
      default: STANDARD
      values:
        - STANDARD
        - REDUCED
        - ZERO_RATED
        - EXEMPT
        - REVERSE_CHARGE
        - OUT_OF_SCOPE
      help:
        summary: How the transaction is treated under the tax.
        usage: Decides the rate and the reporting.
        relationshipContext: Exempt and zero-rated are reported differently even though both charge no tax.
        valueSemantics:
          STANDARD: Taxed at the standard rate.
          REDUCED: Taxed at a reduced rate.
          ZERO_RATED: Taxable at 0%; input tax remains recoverable.
          EXEMPT: Outside the tax's charge; input tax is usually not recoverable.
          REVERSE_CHARGE: The buyer accounts for the tax instead of the seller.
          OUT_OF_SCOPE: Not within the tax at all.
    - name: returnBox
      type: string
      required: false
      maxLength: 20
      help:
        summary: The box or line of the tax return the transactions are reported in.
        usage: Used to prepare the return.
        relationshipContext: Taken from the authority's return form.
    - name: description
      type: text
      required: false
      help:
        summary: Explains when this code should be chosen, including the kind of goods, services or customers it covers.
        usage: Read by whoever codes an order or invoice line to pick the right treatment.
        relationshipContext: For exempt and zero-rated codes it should cite the legal basis, so an auditor can see why no tax was charged.
  relationships:
    - {name: organization, target: Organization, cardinality: 0..1, ownership: reference, help: {summary: The organisation the code is set up for., usage: Chosen when the code is company specific., cardinalityMeaning: At most one organisation; empty means it applies to all., workflowRole: Decides which company's returns the code feeds.}}
    - name: jurisdiction
      target: TaxJurisdiction
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the tax applies.
        usage: Set when the code is created.
        cardinalityMeaning: One per code.
        context: Its authority receives the return.
  invariants:
    - {id: TAX-CODE-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Tax Code Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a tax code is ended"
      description: "When a tax code is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TAX-CODE-FOLLOW-UP-{{id}}"
              name: "Follow up on tax code {{id}}"
              description: "Tax code {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A tax classification code used to choose the tax rules, rates, registrations and reporting treatment that apply.
    businessMeaning: A tax code lets a product, service or transaction be given its tax treatment by name instead of retyping rules. It keeps tax decisions consistent and makes it clear why a given rate was charged.
    usage: Maintained by tax or finance; chosen on products, lines and accounts; read by tax calculation and returns.
    relationshipContext: A tax code may belong to an organisation and is used with jurisdictions and rates.
    lifecycle: A tax code is drafted, active while it is used, and completed when no longer used. It may be cancelled before use. Completed and cancelled are final; past transactions keep it.
    example: Code "STD-20" marks goods taxed at the standard rate of twenty percent.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TAX-CODE}
