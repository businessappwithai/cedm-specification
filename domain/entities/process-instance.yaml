entity:
  name: ProcessInstance
  namespace: cedm.domain
  kind: workflow_transaction
  description: A governed execution instance of a ProcessDefinition preserving the effective process version, business context, state, and audit history.
  ui:
    icon: file-text
  identity: {key: processInstanceId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: processInstanceId, type: uuid, required: true, immutable: true, help: {summary: The identity of the process instance., usage: Generated when the process starts; tasks and audit entries refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where this one run of a business process stands, from created through running to finished or stopped.
        usage: Moved by the workflow engine and by users who start or cancel the run; completed and cancelled runs are final and keep their history.
        valueSemantics:
          PENDING: Created but not yet running.
          ACTIVE: Running; steps are being executed.
          COMPLETED: Finished. A final state.
          CANCELLED: Stopped before it finished. A final state.
  relationships: []
  invariants:
    - {id: PROCESS-INSTANCE-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Process Instance Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a process instance is ended"
      description: "When a process instance is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-FOLLOW-UP-{{id}}"
              name: "Follow up on process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a process instance is done"
      description: "When a process instance is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROCESS-INSTANCE-COMPLETED-{{id}}"
              name: "Confirm process instance {{id}}"
              description: "Process instance {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: One execution of a process definition, keeping the process version that applied, the business context, the state and the audit history.
    businessMeaning: Each time a business process runs, such as one purchase approval, the instance records how far it has got and what happened, so work can be tracked, resumed and audited.
    usage: Created when a process starts; updated as steps complete; read by workers, managers and auditors.
    relationshipContext: An instance runs a ProcessDefinition, and works on the records it was started for.
    lifecycle: An instance is pending when created, active while running, and ends completed or cancelled. State changes keep auditable history and cannot duplicate effects.
    example: The approval of purchase request PR-4417, started on Monday and completed after two approvals on Wednesday.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-INSTANCE}
