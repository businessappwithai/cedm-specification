entity:
  name: Message
  namespace: cedm.domain
  kind: integration_message
  description: A governed integration message envelope preserving payload identity, direction, correlation, processing state, and delivery evidence.
  ui:
    icon: table
  identity: {key: messageId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: messageId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the message, used to detect duplicates.', usage: Generated or taken from the sender; processing uses it to be idempotent.}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: When the message was created or received., usage: Set by the integration layer; used to order messages and to measure latency.}}
  relationships: []
  invariants:
    - {id: MESSAGE-001, rule: Delivery retries and corrections must preserve auditable evidence and must not duplicate downstream business effects.}
  help:
    summary: An integration message envelope that keeps the payload identity, direction, correlation, processing state and delivery evidence of a message exchanged with another system.
    businessMeaning: Systems exchange messages, and things go wrong. Keeping each message as a record lets operators see what was sent or received, whether it was processed and what happened on delivery, and replay it safely.
    usage: Written when a message is sent or received; updated as it is processed; read by integration operators and in incident reviews.
    relationshipContext: A message is delivered to IntegrationEndpoints through DeliveryAttempts.
    lifecycle: Delivery retries and corrections keep auditable evidence and never duplicate downstream business effects.
    example: An order-confirmation message received from a partner's system and processed once.
    whenUsed: Used for event publication, message exchange, delivery, retry, reconciliation, integration operations, and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-MESSAGE}
