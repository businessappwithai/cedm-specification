entity:
  name: BillingCycle
  namespace: cedm.domain
  kind: billing_control
  description: A governed recurring billing interval and cutoff definition used to determine charge-generation periods.
  ui:
    icon: table
  identity: {key: billingCycleId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: billingCycleId, type: uuid, required: true, immutable: true, help: {summary: "The permanent identity of this billing interval, which subscriptions and generated charges refer to when they are billed.", businessMeaning: Identifies one governed BillingCycle record., usage: "Enterprise processing, integration, reporting and audit.", relationshipContext: Referenced by compatible domain workflows., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: "Shows whether the billing cycle is still a draft, active for charge generation, completed after its run, or cancelled.", businessMeaning: Indicates usability/execution state of BillingCycle., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships: []
  invariants:
  - {id: BILLING-CYCLE-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Billing Cycle Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a billing cycle is ended"
      description: "When a billing cycle is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "BILLING-CYCLE-FOLLOW-UP-{{id}}"
              name: "Follow up on billing cycle {{id}}"
              description: "Billing cycle {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One recurring billing interval with its cutoff dates, which decides which charges fall into which billing run and when customers are invoiced for recurring services."
    purpose: Provide canonical enterprise semantics for BillingCycle while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: A governed recurring billing interval and cutoff definition used to determine charge-generation periods.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BILLING-CYCLE}
