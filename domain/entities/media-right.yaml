entity:
  name: MediaRight
  namespace: cedm.domain
  kind: media_legal_entity
  description: A right, license, restriction, or usage entitlement associated with media content.
  ui:
    icon: image
    recordLabel: [rightType, territory]
  identity:
    key: mediaRightId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: mediaRightId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the media right record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a media right store this identifier. The number or code people quote is a separate field.
  - name: rightType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The use the right covers, such as streaming, broadcast or print.
      usage: Checked against the intended use.
      relationshipContext: From the rights types the business deals in.
  - name: territory
    type: string
    required: false
    maxLength: 200
    help:
      summary: Where the right applies.
      usage: Checked against the market of publication.
      relationshipContext: Empty means worldwide.
  - name: validFrom
    type: date
    required: false
    help:
      summary: The first day the right applies.
      usage: Use before it is not allowed.
      relationshipContext: Not after the end date.
  - name: validTo
    type: date
    required: false
    help:
      summary: The last day the right applies.
      usage: The right expires after it.
      relationshipContext: Empty for perpetual rights.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - EXPIRED
    - REVOKED
    help:
      summary: Whether the right may be exercised.
      usage: Changed by rights managers or on expiry.
      relationshipContext: Only active rights permit use.
      valueSemantics:
        PENDING: Under negotiation.
        ACTIVE: In force.
        EXPIRED: Past its validity.
        REVOKED: Withdrawn.
  relationships:
  - name: content
    target: MediaContent
    cardinality: '1'
    ownership: reference
    help:
      summary: The work the right is in.
      usage: Set when recording the right.
      cardinalityMeaning: Each right concerns one work.
      context: Part of the work's rights record.
  - name: holder
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The party holding the right.
      usage: Set when recording the right.
      cardinalityMeaning: Each right has one holder.
      context: Only the holder may exercise it.
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: The contract granting the right.
      usage: Linked once signed.
      cardinalityMeaning: At most one contract.
      context: Its terms govern the right.
  invariants:
  - {id: MEDIA-RIGHT-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Media Right Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, EXPIRED, REVOKED]
    initial: PENDING
    terminal: [EXPIRED, REVOKED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: PENDING, to: REVOKED, action: revoke}
    - {from: ACTIVE, to: REVOKED, action: revoke}
  help:
    summary: A right to use media content in a way, territory and period.
    relationshipContext: The entity participates in a wider business graph through relationships with MediaContent, Party, Contract. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Rights managers record each licence or restriction on a work — what use, where and for how long — and check it before content is published or sold.
    lifecycle: A right is pending until the deal is concluded, active during its validity, and ends by expiring or being revoked.
    example: Streaming right for 'Rivers of the Alps' held by StreamCo, territory EU, 1 June 2024–31 May 2026, active.
    businessMeaning: Using content without a valid right is infringement; rights also decide revenue from licensing.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-RIGHT
