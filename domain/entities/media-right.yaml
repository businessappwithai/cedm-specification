entity:
  name: MediaRight
  namespace: cedm.domain
  kind: media_legal_entity
  description: A right, license, restriction, or usage entitlement associated with media content.
  ui:
    icon: image
  identity:
    key: mediaRightId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: mediaRightId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the right.
        usage: Generated on creation; publications and royalty statements refer to it.
    - name: rightType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of right granted, such as streaming, broadcast, print or merchandise.
        usage: Entered from the licence; publication in a medium requires a matching active right.
    - name: territory
      type: string
      required: false
      maxLength: 200
      help:
        summary: The territory in which the right applies.
        usage: Entered from the licence; publication outside it is not permitted.
    - name: validFrom
      type: date
      required: false
      help:
        summary: The first date on which the right applies.
        usage: Entered from the licence.
    - name: validTo
      type: date
      required: false
      help:
        summary: The last date on which the right applies.
        usage: Entered from the licence; not before the start date.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PENDING
        - ACTIVE
        - EXPIRED
        - REVOKED
      help:
        summary: Whether the right is currently in effect.
        usage: Moved by licensing staff or expiry processing; only ACTIVE rights permit use.
        valueSemantics:
          PENDING: Agreed but not yet in effect.
          ACTIVE: In effect.
          EXPIRED: Its period has ended. A final state.
          REVOKED: Withdrawn before its period ended. A final state.
  relationships:
    - name: content
      target: MediaContent
      cardinality: '1'
      ownership: reference
      help:
        summary: The work the right applies to.
        usage: Set when the right is recorded.
        cardinalityMeaning: 'Exactly one work: a right is a permission over a specific work.'
        workflowRole: Decides what may be done with that work.
    - name: holder
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party that holds the right.
        usage: Set when the right is recorded.
        cardinalityMeaning: 'Exactly one holder: the right belongs to a specific licensee or licensor.'
        workflowRole: Identifies who may exercise, or who has granted, the right.
    - name: contract
      target: Contract
      cardinality: 0..1
      ownership: reference
      help:
        summary: The contract that grants the right.
        usage: Linked where a written agreement exists.
        cardinalityMeaning: At most one contract.
        workflowRole: Provides the legal basis for the right.
  invariants:
    - {id: MEDIA-RIGHT-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Media Right Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, EXPIRED, REVOKED]
    initial: PENDING
    terminal: [EXPIRED, REVOKED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: PENDING, to: REVOKED, action: revoke}
      - {from: ACTIVE, to: REVOKED, action: revoke}
  help:
    summary: A right, licence, restriction or usage entitlement that applies to media content.
    businessMeaning: Content may be used only as far as rights allow. Each right states what is permitted, where and for how long, so publication and licensing decisions can be checked.
    usage: Recorded when a licence is acquired or granted; checked before content is published; read by licensing and legal.
    relationshipContext: A right is for one MediaContent, held by a Party, and may rest on a Contract.
    lifecycle: A right is pending until it takes effect, active during its period, and ends expired or revoked.
    example: A licence to stream a documentary in Europe from 1 January for two years.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-RIGHT
