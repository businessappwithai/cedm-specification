entity:
  name: MediaRight
  namespace: cedm.domain
  kind: media_legal_entity
  description: A right, license, restriction, or usage entitlement associated with media content.
  ui:
    icon: image
  identity:
    key: mediaRightId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: mediaRightId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the media right record associated with this MediaRight. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets schedules, distribution deals and royalty reports point at exactly this licence for the content."
  - name: rightType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of right type for the MediaRight. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "What use is permitted or restricted, such as broadcast, streaming or theatrical, which decides where the content may be shown."
  - name: territory
    type: string
    required: false
    maxLength: 200
    help:
      summary: Captures the business meaning of territory for the MediaRight. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The countries or regions where the right applies, so content is not offered where the business is not licensed."
  - name: validFrom
    type: date
    required: false
    help:
      summary: Captures the business meaning of valid from for the MediaRight. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The first date the content may be used under this right; publishing earlier would breach the licence."
  - name: validTo
    type: date
    required: false
    help:
      summary: Captures the business meaning of valid to for the MediaRight. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last date the content may be used under this right, after which it must be withdrawn or relicensed."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - EXPIRED
    - REVOKED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaRight records, where
        applicable.
      relationshipContext: Its meaning is specific to MediaRight; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PENDING: Represents the pending state or classification in the context of MediaRight.
        ACTIVE: Represents the active state or classification in the context of MediaRight.
        EXPIRED: Represents the expired state or classification in the context of MediaRight.
        REVOKED: Represents the revoked state or classification in the context of MediaRight.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Pending rights are not yet usable, active rights permit use, and expired or revoked rights mean the content must not be used under them."
  relationships:
  - name: content
    target: MediaContent
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects MediaRight to MediaContent so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MediaContent records associated with a MediaRight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: holder
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects MediaRight to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a MediaRight.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects MediaRight to Contract so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Contract records associated with a MediaRight.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - {id: MEDIA-RIGHT-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Media Right Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, EXPIRED, REVOKED]
    initial: PENDING
    terminal: [EXPIRED, REVOKED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: PENDING, to: REVOKED, action: revoke}
      - {from: ACTIVE, to: REVOKED, action: revoke}
  help:
    summary: "A licence or restriction stating who may use a piece of media content, in what way, in which territory and for which dates, so content is only used where the business holds the right."
    businessMeaning: MediaRight is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate MediaRight records.
    relationshipContext: The entity participates in a wider business graph through relationships with MediaContent, Party,
      Contract. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical MediaRight record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Rights staff record the right when a licence contract is agreed, it becomes active from its start date, scheduling and distribution check it before content is published, and it expires at the end date or is revoked if the agreement is terminated."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-RIGHT
