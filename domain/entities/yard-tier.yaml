entity:
  name: YardTier
  namespace: cedm.domain
  kind: logistics_location
  description: A vertical stacking level within a YardBay that establishes stack height, access dependencies, and the vertical context for one or more atomic container storage positions.
  ui:
    icon: table
  identity:
    key: yardTierId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: yardTierId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the yard tier record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a yard tier store this identifier. The number or code people quote is a separate field.
  - name: tierNumber
    type: integer
    required: true
    minimum: 1
    help:
      summary: The stacking level, counted from the ground — 1 is the bottom container.
      businessMeaning: Expresses how high the tier is in the stack according to the yard's numbering convention, normally with 1 as the lowest level.
      requiredMeaning: Required because vertical position is fundamental to container stacking.
      usage: Tells the crane operator how high the slot is.
      relationshipContext: Containers above must be moved to reach a lower tier.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, BLOCKED, CLOSED]
    help:
      summary: Whether containers may be placed at this tier.
      businessMeaning: Determines whether subordinate positions can normally be used for placement, retrieval, or relocation.
      requiredMeaning: Required because a tier-level restriction propagates to its subordinate positions.
      usage: Changed when the tier is blocked or closed.
      relationshipContext: Closed tiers stay in the layout for history.
      valueSemantics:
        ACTIVE: Containers may be placed here.
        BLOCKED: Temporarily unusable, such as during equipment work nearby.
        CLOSED: Permanently out of use.
  - name: maxWeightKg
    type: decimal
    required: false
    precision: 10
    scale: 1
    help:
      summary: The heaviest container allowed at this tier, in kilograms.
      usage: Heavier boxes go lower; checked when planning a stack.
      relationshipContext: Lower tiers usually allow more.
  relationships:
  - name: bay
    target: YardBay
    cardinality: '1'
    ownership: reference
    help:
      summary: The yard bay the tier belongs to.
      usage: Set when the yard layout is defined.
      cardinalityMeaning: Every tier belongs to exactly one bay.
      context: A bay has one tier per stacking level.
  - name: slots
    target: YardSlot
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The container slots at this tier.
      usage: Defined with the yard layout.
      cardinalityMeaning: A tier has at least one slot.
      context: Each slot holds one container.
  invariants:
  - id: YARD-TIER-001
    rule: tierNumber must be unique within its YardBay.
  - id: YARD-TIER-002
    rule: tierNumber must not exceed the maximum permitted stacking height configured for the parent YardBay, unless the yard explicitly supports dynamic height configuration.
  - id: YARD-TIER-003
    rule: BLOCKED or CLOSED tiers must not receive new normal placement allocations unless an explicit operational exception permits them.
  lifecycle:
    title: Yard Tier Lifecycle
    attribute: status
    states: [ACTIVE, BLOCKED, CLOSED]
    initial: ACTIVE
    terminal: [CLOSED]
    transitions:
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: ACTIVE, to: BLOCKED, action: block}
    - {from: BLOCKED, to: ACTIVE, action: unblock}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a yard tier is stopped"
    description: "When a yard tier is blocked, a high-priority task asks someone to resolve it."
    when: "status == \"BLOCKED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "YARD-TIER-EXCEPTION-{{id}}"
          name: "Resolve yard tier {{id}}"
          description: "Yard tier {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  help:
    summary: Represents one vertical level in a container stack and provides the model's explicit representation of stacking height and access dependency.
    businessMeaning: YardTier answers the question "how high in this bay is the position?" It is essential for calculating stack height, determining whether equipment can reach a container, and understanding whether retrieving one container requires moving containers above it.
    usage: Used by yard allocation, crane planning, stacking validation, rehandle optimization, safety controls, capacity planning, digital-twin visualization, and operational reporting.
    relationshipContext: The physical hierarchy is Yard → YardBlock → YardBay → YardTier → YardSlot. YardTier should not be treated as the final location of a container; YardSlot is the atomic position. Container.currentSlot points to the exact position, while ContainerMovement records changes between positions.
    operationalSemantics: A higher tier generally implies greater retrieval dependency because containers beneath it can obstruct direct access. Placement algorithms therefore consider tier height together with container weight, allowable stacking, equipment reach, dwell time, expected retrieval order, hazardous/reefer rules, and rehandle cost. A tier can be structurally valid but operationally unusable because of equipment or safety restrictions.
    lifecycle: A tier can be active, temporarily blocked, or closed. Changing its status must not erase existing occupancy. If containers must be relocated, those relocations are explicit ContainerMovement events and the resulting slot state is updated separately.
    example: Bay B03-12 has tiers 1 through 5. A container at Tier 4 is above three lower stack positions. If the Tier 1 container is needed urgently, the yard optimizer may calculate one or more rehandles before retrieval. The tier model therefore directly contributes to movement cost and yard optimization.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-YARD-TIER
