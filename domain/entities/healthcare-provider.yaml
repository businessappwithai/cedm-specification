entity:
  name: HealthcareProvider
  namespace: cedm.domain
  kind: healthcare_party_role
  description: A person or organization authorized to provide healthcare services.
  ui:
    icon: database
  identity:
    key: providerId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: providerId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the healthcare provider record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a healthcare provider store this identifier. The number or code people quote is a separate field.
  - name: partyId
    type: reference
    target: Party
    required: true
    help:
      summary: Identifies the related Party associated with this HealthcareProvider. It provides the link needed to navigate from this record to the related business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records, where applicable.
      relationshipContext: This field connects HealthcareProvider to Party. The reference establishes business context between the two entities and lets processes navigate from this record to the related Party.
  - name: providerNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of provider number for the HealthcareProvider. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: providerType
    type: enum
    required: true
    values:
    - PHYSICIAN
    - NURSE
    - CLINIC
    - HOSPITAL
    - LABORATORY
    - PHARMACY
    - OTHER
    help:
      summary: Captures the business meaning of provider type for the HealthcareProvider. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PHYSICIAN: Represents the physician state or classification in the context of HealthcareProvider.
        NURSE: Represents the nurse state or classification in the context of HealthcareProvider.
        CLINIC: Represents the clinic state or classification in the context of HealthcareProvider.
        HOSPITAL: Represents the hospital state or classification in the context of HealthcareProvider.
        LABORATORY: Represents the laboratory state or classification in the context of HealthcareProvider.
        PHARMACY: Represents the pharmacy state or classification in the context of HealthcareProvider.
        OTHER: Represents the other state or classification in the context of HealthcareProvider.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of HealthcareProvider.
        INACTIVE: Represents the inactive state or classification in the context of HealthcareProvider.
        SUSPENDED: Represents the suspended state or classification in the context of HealthcareProvider.
        RETIRED: Represents the retired state or classification in the context of HealthcareProvider.
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects HealthcareProvider to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects HealthcareProvider to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: encounters
    target: HealthcareEncounter
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects HealthcareProvider to HealthcareEncounter so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareEncounter records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  lifecycle:
    title: Healthcare Provider Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, SUSPENDED, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Represents a healthcare party role called HealthcareProvider within the CEDM business model.
    businessMeaning: HealthcareProvider is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate HealthcareProvider records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, HealthcareEncounter. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical HealthcareProvider record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
