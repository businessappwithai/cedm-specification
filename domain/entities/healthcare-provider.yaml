entity:
  name: HealthcareProvider
  namespace: cedm.domain
  kind: healthcare_party_role
  description: A person or organization authorized to provide healthcare services.
  ui:
    icon: database
  identity:
    key: providerId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: providerId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the provider record associated with this HealthcareProvider. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records,
        where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of the provider in this system, so appointments, encounters and practitioner affiliations stay linked to the same provider over time."
  - name: partyId
    type: reference
    target: Party
    required: true
    help:
      summary: Identifies the related Party associated with this HealthcareProvider. It provides the link needed to navigate
        from this record to the related business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records,
        where applicable.
      relationshipContext: This field connects HealthcareProvider to Party. The reference establishes business context between
        the two entities and lets processes navigate from this record to the related Party.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Links the provider to the person or organisation behind it, holding name, address and contact details once, so a clinician can also be a patient or an employee without duplicate records."
  - name: providerNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of provider number for the HealthcareProvider. It is interpreted together with
        the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records,
        where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The registration or practice number used on referrals, claims and correspondence to identify the provider, often issued by a licensing body or payer."
  - name: providerType
    type: enum
    required: true
    values:
    - PHYSICIAN
    - NURSE
    - CLINIC
    - HOSPITAL
    - LABORATORY
    - PHARMACY
    - OTHER
    help:
      summary: Captures the business meaning of provider type for the HealthcareProvider. It is interpreted together with
        the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records,
        where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PHYSICIAN: Represents the physician state or classification in the context of HealthcareProvider.
        NURSE: Represents the nurse state or classification in the context of HealthcareProvider.
        CLINIC: Represents the clinic state or classification in the context of HealthcareProvider.
        HOSPITAL: Represents the hospital state or classification in the context of HealthcareProvider.
        LABORATORY: Represents the laboratory state or classification in the context of HealthcareProvider.
        PHARMACY: Represents the pharmacy state or classification in the context of HealthcareProvider.
        OTHER: Represents the other state or classification in the context of HealthcareProvider.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "What kind of provider this is, such as a PHYSICIAN, HOSPITAL or PHARMACY, which decides the services it may offer, how it is scheduled and how its claims are handled."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareProvider records,
        where applicable.
      relationshipContext: Its meaning is specific to HealthcareProvider; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of HealthcareProvider.
        INACTIVE: Represents the inactive state or classification in the context of HealthcareProvider.
        SUSPENDED: Represents the suspended state or classification in the context of HealthcareProvider.
        RETIRED: Represents the retired state or classification in the context of HealthcareProvider.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the provider may currently deliver care: ACTIVE can be booked, INACTIVE is temporarily not offering services, SUSPENDED is barred pending review, and RETIRED remains only for history."
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects HealthcareProvider to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects HealthcareProvider to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: encounters
    target: HealthcareEncounter
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects HealthcareProvider to HealthcareEncounter so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareEncounter records associated with a HealthcareProvider.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: practitioners, target: Practitioner, cardinality: "0..*", ownership: reference, help: {summary: Practitioners affiliated with this healthcare provider., businessMeaning: Connects organizational delivery context to professional roles., usage: "Credentialing, scheduling and provider directories.", cardinalityMeaning: Zero or many practitioners., workflowRole: Affiliation and practitioner eligibility constrain new care assignments.}}
  - {name: appointments, target: Appointment, cardinality: "0..*", ownership: reference, help: {summary: Appointments scheduled under this provider context., businessMeaning: Provides planned service workload distinct from completed encounters., usage: "Scheduling, capacity and reporting.", cardinalityMeaning: Zero or many appointments., workflowRole: Scheduled resources must remain eligible under provider policy.}}

  lifecycle:
    title: Healthcare Provider Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, SUSPENDED, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: "A doctor, nurse, clinic, hospital, laboratory or pharmacy authorised to deliver care, kept so appointments, encounters and practitioners are tied to an accountable, approved source of healthcare services."
    businessMeaning: HealthcareProvider is a business concept with its own identity and lifecycle. It captures information
      that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate HealthcareProvider records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization,
      HealthcareEncounter. These relationships provide the context needed to interpret the record rather than treating its
      fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical HealthcareProvider record represents one identifiable business occurrence or master-data object that
      can be referenced by related CEDM processes.
    workflowContext: "Registered by credentialing or provider-relations staff once licences are checked, used when booking appointments, recording encounters and affiliating practitioners, made inactive or suspended when credentials lapse or are under review, and retired when the provider no longer delivers services."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-PROVIDER
