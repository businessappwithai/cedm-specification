entity:
  name: HealthcareProvider
  namespace: cedm.domain
  kind: healthcare_party_role
  description: A person or organization authorized to provide healthcare services.
  ui:
    icon: database
    recordLabel: [providerNumber]
  identity:
    key: providerId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: providerId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the healthcare provider record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a healthcare provider store this identifier. The number or code people quote is a separate field.
  - name: partyId
    type: reference
    target: Party
    required: true
    help:
      summary: The person or organisation who is the provider.
      usage: Set when the provider is registered.
      relationshipContext: Names and contact details come from the party.
  - name: providerNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The provider's licence or registry number.
      usage: Quoted on claims and prescriptions.
      relationshipContext: Unique.
  - name: providerType
    type: enum
    required: true
    values:
    - PHYSICIAN
    - NURSE
    - CLINIC
    - HOSPITAL
    - LABORATORY
    - PHARMACY
    - OTHER
    help:
      summary: What kind of provider this is.
      usage: Decides which services they may provide and how they are billed.
      relationshipContext: Chosen at registration.
      valueSemantics:
        PHYSICIAN: A medical doctor.
        NURSE: A nurse or nurse practitioner.
        CLINIC: An outpatient clinic.
        HOSPITAL: A hospital.
        LABORATORY: A diagnostic laboratory.
        PHARMACY: A pharmacy.
        OTHER: Any other provider.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the provider may currently provide care.
      usage: Changed by credentialing staff.
      relationshipContext: Only active providers can be booked.
      valueSemantics:
        ACTIVE: Authorised and practising.
        INACTIVE: Temporarily not practising.
        SUSPENDED: Not allowed to practise pending review.
        RETIRED: Has stopped practising for good.
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The person or organisation who is the provider.
      usage: Set at registration.
      context: The party's details are used on documents.
      cardinalityMeaning: Each provider record stands for one party.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation the provider works for or belongs to.
      usage: Set when the provider is affiliated.
      cardinalityMeaning: At most one organisation.
      context: Used for billing and scheduling.
  - name: encounters
    target: HealthcareEncounter
    cardinality: 0..*
    ownership: reference
    help:
      summary: Encounters the provider is responsible for.
      usage: Listed in the provider's schedule.
      cardinalityMeaning: Any number of encounters.
      context: Each encounter has at most one responsible provider.
  lifecycle:
    title: Healthcare Provider Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, SUSPENDED, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A clinician or care organisation registered to provide healthcare.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, HealthcareEncounter. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Credentialing staff register clinicians and facilities with their licence number and type; schedulers book encounters with them and billing quotes their number on claims.
    lifecycle: A provider is active while authorised to practise, inactive when temporarily not practising, suspended while their licence is under review, and retired when they stop for good.
    example: Provider NPI 1234567893, Dr. Anna Rossi, physician, at St. Mary's Clinic, active.
    businessMeaning: Only credentialed providers may treat patients and be paid; scheduling and claims refer to the provider.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-PROVIDER
