entity:
  name: Account
  namespace: cedm.domain
  kind: financial_master_entity
  description: A financial ledger account used to classify and record monetary activity.
  ui:
    icon: landmark
    recordLabel: [code, name]
  identity:
    key: accountId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: accountId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the account record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a account store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The account number in the chart of accounts, such as 6251.
      usage: Entered on journal lines and used in every financial report.
      relationshipContext: Unique within the chart of accounts; the hierarchy usually follows its digits.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the account, such as "Travel and subsistence".
      usage: Shown in reports and wherever an account is chosen.
      relationshipContext: Identifies the account for people, with its number.
  - name: accountType
    type: enum
    required: true
    values:
    - ASSET
    - LIABILITY
    - EQUITY
    - REVENUE
    - EXPENSE
    - CONTRA
    help:
      summary: Which part of the financial statements the account belongs to.
      usage: Decides whether balances carry forward to the next year (balance-sheet accounts) or are closed to retained earnings (income-statement accounts).
      relationshipContext: Must agree with the parent account's type.
      valueSemantics:
        ASSET: What the company owns or is owed, such as cash, receivables and equipment.
        LIABILITY: What the company owes, such as payables and loans.
        EQUITY: The owners' interest, such as share capital and retained earnings.
        REVENUE: Income from sales and other activities.
        EXPENSE: Costs of running the business.
        CONTRA: An account that offsets another, such as accumulated depreciation against an asset.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether postings may be made to the account.
      usage: Changed by finance when the chart of accounts changes.
      relationshipContext: Inactive and retired accounts are refused on new postings.
      valueSemantics:
        ACTIVE: Open for postings.
        INACTIVE: Temporarily closed for postings.
        RETIRED: No longer used; kept for its history.
  - name: currencyId
    type: reference
    target: Currency
    required: false
    help:
      summary: The only currency the account may be posted in, for accounts kept in one currency.
      usage: Set for bank and foreign-currency accounts; empty when any currency may be posted.
      relationshipContext: Postings in another currency are refused.
  - name: isPostingAccount
    type: boolean
    required: true
    default: true
    help:
      summary: Whether journal lines may post directly to the account, or it only sums its children.
      usage: Summary accounts in the hierarchy are not posting accounts.
      relationshipContext: A posting account has no children.
  relationships:
  - name: parentAccount
    target: Account
    cardinality: 0..1
    ownership: reference
    help:
      summary: The summary account this account rolls up into.
      usage: Builds the hierarchy that reports sum along.
      cardinalityMeaning: At most one parent.
      context: Cannot be the account itself or one of its descendants.
  - name: childAccounts
    target: Account
    cardinality: 0..*
    ownership: reference
    help:
      summary: The accounts that roll up into this one.
      usage: Listed from the parent.
      cardinalityMeaning: Any number of children.
      context: Each child names this account as its parent.
    inverse: parentAccount
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company whose chart of accounts the account belongs to.
      usage: Set when the account is created; empty for a group-wide chart.
      cardinalityMeaning: At most one.
      context: Postings must come from the same company.
  invariants:
  - id: ACCOUNT-001
    rule: account code must be unique within its chart-of-accounts context.
  - id: ACCOUNT-002
    rule: account hierarchy must not contain cycles.
  lifecycle:
    title: Account Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents a financial master entity called Account within the CEDM business model.
    businessMeaning: Account is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Account, Account, Organization. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Finance maintains the chart of accounts; every journal entry line posts to an account; trial balances, financial statements and management reports are built by summing accounts up their hierarchy.
    lifecycle: An account is active while postings may be made to it; made inactive to stop new postings temporarily; retired when the chart changes. Accounts with postings are never deleted, so history stays reportable.
    example: Account 6251 'Travel and subsistence', expense, child of 625 'Travel', company ACME France, posting in EUR.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ACCOUNT
