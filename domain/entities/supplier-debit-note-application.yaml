entity:
  name: SupplierDebitNoteApplication
  namespace: cedm.domain
  kind: financial_settlement_adjustment
  description: An explicit application of a posted SupplierDebitNote against one eligible supplier Invoice payable claim. It records how a buyer-issued debit reduces the remaining payable exposure without mutating the original invoice history.
  ui:
    icon: factory
  identity: {key: supplierDebitNoteApplicationId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: supplierDebitNoteApplicationId
      type: uuid
      required: true
      immutable: true
      help: {summary: Immutable identity of the supplier debit application., businessMeaning: Identifies one application of a supplier debit to a payable claim., usage: "Used for reconciliation, audit, supplier statements and integration.", relationshipContext: "Distinct from SupplierDebitNote, Invoice and Payment identities.", workflowRole: "Stable identity across creation, activation, reversal and cancellation."}
    - name: supplierDebitAmount
      type: Money
      required: true
      help: {summary: Amount of the supplier debit consumed by this application in debit-note currency., businessMeaning: Defines the portion of the posted debit allocated to this payable claim., usage: Reconciliation and remaining-amount calculation., relationshipContext: May differ from invoiceAmount when currencies differ and an ExchangeRate is used., workflowRole: Reduces the unapplied supplier debit balance.}
    - name: invoiceAmount
      type: Money
      required: true
      help: {summary: Amount of payable exposure reduced on the target invoice., businessMeaning: Records the invoice-currency effect of the debit application., usage: Accounts payable reconciliation and audit., relationshipContext: Must reconcile to supplierDebitAmount using the recorded exchange rate when currencies differ., workflowRole: Reduces invoice payable exposure without changing original invoice totals.}
    - name: exchangeRateId
      type: reference
      target: ExchangeRate
      required: false
      immutable: true
      help: {summary: Exchange-rate evidence used when debit and invoice currencies differ., businessMeaning: Provides reproducible conversion between application currencies., usage: "Accounting, tax, reconciliation and audit.", relationshipContext: Required for cross-currency application under policy., workflowRole: Determines the conversion used for invoiceAmount.}
    - name: appliedAt
      type: datetime
      required: true
      immutable: true
      help:
        summary: The date and time the debit became effective against the target invoice.
        usage: Set when the application is activated and not changed; it decides the accounting period and appears on supplier statements.
        businessMeaning: Establishes settlement chronology.
        workflowRole: Anchors the application event.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - REVERSED
        - CANCELLED
      help:
        summary: Whether this application of a supplier debit is being prepared, in force, reversed or cancelled.
        usage: Starts as DRAFT; payables staff activate it to reduce the invoice, which also changes the debit's remaining balance.
        valueSemantics:
          DRAFT: Prepared and not yet applied.
          ACTIVE: Applied against the invoice, reducing what is payable.
          REVERSED: Undone by a reversing application. A final state.
          CANCELLED: Withdrawn before it was applied. A final state.
        businessMeaning: Separates preparation from effective application and later reversal.
        relationshipContext: Application status does not replace SupplierDebitNote or Invoice status.
        workflowRole: ACTIVE contributes to settlement projections; REVERSED removes its active effect through compensating evidence.
    - name: reversalOfApplicationId
      type: reference
      target: SupplierDebitNoteApplication
      required: false
      immutable: true
      help:
        summary: Points to the earlier application of supplier debit that this record undoes.
        usage: Set only on a correcting record; the original application is left unchanged so the audit trail stays complete.
        businessMeaning: Provides explicit lineage for a corrective reversal.
        relationshipContext: Reversal is a new event and does not mutate the original application.
        workflowRole: Links compensating evidence to the prior application.
  relationships:
    - {name: supplierDebitNote, target: SupplierDebitNote, cardinality: '1', ownership: reference, help: {summary: Posted supplier debit being applied., businessMeaning: Identifies the source financial adjustment., usage: Remaining-balance and audit reconciliation., workflowRole: Supplies available debit amount and supplier context.}}
    - {name: invoice, target: Invoice, cardinality: "1", ownership: reference, help: {summary: Supplier payable invoice receiving the debit application., businessMeaning: Identifies the eligible original payable claim whose outstanding exposure is reduced., usage: "Accounts payable, reconciliation and supplier statements.", workflowRole: Supplies target claim and currency context.}}
    - {name: exchangeRate, target: ExchangeRate, cardinality: 0..1, ownership: reference, help: {summary: Exchange-rate evidence for cross-currency application., businessMeaning: Supports reproducible conversion between source debit and target invoice currencies., usage: Accounting and audit., workflowRole: Qualifies invoiceAmount when currencies differ.}}
  invariants:
    - {id: SUPPLIER-DEBIT-APPLICATION-001, rule: supplierDebitAmount and invoiceAmount must be greater than zero.}
    - {id: SUPPLIER-DEBIT-APPLICATION-002, rule: Source SupplierDebitNote must be POSTED and must have sufficient unapplied amount for the active application.}
    - {id: SUPPLIER-DEBIT-APPLICATION-003, rule: Target Invoice must be an eligible PURCHASE payable claim and the application must not reduce exposure below the governing zero or credit-balance policy.}
    - {id: SUPPLIER-DEBIT-APPLICATION-004, rule: "When SupplierDebitNote.currencyId differs from Invoice.currencyId, exchangeRateId is required and the converted amounts must reconcile under configured rounding policy."}
    - {id: SUPPLIER-DEBIT-APPLICATION-005, rule: ACTIVE applications are the authoritative evidence for SupplierDebitNote.amountApplied and the corresponding payable exposure projection.}
    - {id: SUPPLIER-DEBIT-APPLICATION-006, rule: REVERSED or CANCELLED applications must not remain active in settlement projections.}
    - {id: SUPPLIER-DEBIT-APPLICATION-007, rule: Original Invoice and InvoiceLine values remain immutable; correction uses explicit reversal and compensating application evidence.}
    - {id: SUPPLIER-DEBIT-APPLICATION-008, rule: Application creation and activation must be idempotent so retries cannot duplicate payable reduction.}
    - {id: SUPPLIER-DEBIT-NOTE-APPLICATION-EXE-001, rule: "Invoice Amount cannot be negative.", violatedWhen: "invoice_amount != null and invoice_amount < 0", message: "Invoice Amount cannot be negative."}
  lifecycle:
    title: Supplier Debit Note Application Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, REVERSED, CANCELLED]
    initial: DRAFT
    terminal: [REVERSED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: REVERSED, action: reverse}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a supplier debit note application is ended"
      description: "When a supplier debit note application is cancelled or reversed, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUPPLIER-DEBIT-NOTE-APPLICATION-FOLLOW-UP-{{id}}"
              name: "Follow up on supplier debit note application {{id}}"
              description: "Supplier debit note application {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Records the controlled application of a posted SupplierDebitNote against a specific supplier invoice payable claim.
    businessMeaning: SupplierDebitNote establishes the financial adjustment; this entity records where that adjustment is consumed. It is not a Payment and does not rewrite the original Invoice.
    usage: Accounts payable, supplier statements, reconciliation, audit, dispute resolution and financial integration.
    relationshipContext: SupplierDebitNote is the source adjustment, Invoice is the target payable claim, ExchangeRate provides cross-currency evidence, and JournalEntry records accounting recognition separately.
    workflowContext: SupplierClaim/SupplierClaimResolution authorize recovery → SupplierDebitNote approved and posted → eligible Invoice selected → application validated → ACTIVE application → payable exposure reduced → debit remaining reconciled. Corrections use reversal.
    lifecycle: Draft → active, with reversed or cancelled paths.
    changePropagation: Changes to source debit posting, invoice eligibility, currency or exchange-rate evidence require application revalidation; active applications are corrected through reversal rather than mutation.
    example: A posted EUR 500 SupplierDebitNote is applied against a EUR 500 supplier invoice. The application records EUR 500 debit amount and invoice amount, becomes ACTIVE, and reduces the payable exposure while preserving the original invoice history.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-DEBIT-NOTE-APPLICATION}
