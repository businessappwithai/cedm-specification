entity:
  name: Opportunity
  namespace: cedm.domain
  kind: crm_entity
  description: A qualified potential commercial transaction.
  ui:
    icon: trending-up
    recordLabel: [opportunityNumber, name]
  identity:
    key: opportunityId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: opportunityId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the opportunity record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a opportunity store this identifier. The number or code people quote is a separate field.
  - name: opportunityNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the opportunity.
      usage: Used in sales meetings and forecasts.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What is being sold, to whom, in a few words.
      usage: Shown in the pipeline.
      relationshipContext: Names the customer's need.
  - name: stage
    type: enum
    required: true
    default: QUALIFICATION
    values: [QUALIFICATION, DISCOVERY, PROPOSAL, NEGOTIATION, WON, LOST]
    help:
      summary: The step of the sales process the opportunity has reached.
      usage: Moved on by the salesperson; drives the forecast.
      relationshipContext: Won and lost are final.
      valueSemantics:
        QUALIFICATION: Checking need, budget and timing.
        DISCOVERY: Understanding requirements.
        PROPOSAL: An offer has been made.
        NEGOTIATION: Terms are being agreed.
        WON: The customer ordered.
        LOST: The customer did not order.
  - name: probability
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The chance of winning, in percent.
      usage: Weights the expected value in the forecast.
      relationshipContext: Between 0 and 100.
  - name: expectedValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The revenue expected if won.
      usage: Summed in the pipeline and forecast.
      relationshipContext: Not negative.
  - name: expectedCloseDate
    type: date
    required: false
    help:
      summary: When the decision is expected.
      usage: Places the opportunity in a forecast period.
      relationshipContext: Updated as the deal progresses.
  relationships:
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer the opportunity is with.
      usage: Set when qualifying.
      cardinalityMeaning: At most one customer.
      context: Prospects become customers when they first order.
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The salesperson responsible.
      usage: Assigned when the opportunity is created.
      cardinalityMeaning: At most one owner.
      context: Credited in sales reports.
  - name: lead
    target: Lead
    cardinality: 0..1
    ownership: reference
    help:
      summary: The lead the opportunity came from.
      usage: Set when a lead is converted.
      cardinalityMeaning: At most one lead.
      context: Used to measure lead conversion.
  - name: salesOrder
    target: SalesOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: The order placed when the opportunity was won.
      usage: Linked on winning.
      cardinalityMeaning: At most one order.
      context: Present for won opportunities.
  invariants:
  - id: OPPORTUNITY-001
    rule: probability must be between 0 and 100 when supplied.
  lifecycle:
    title: Opportunity Lifecycle
    attribute: stage
    states: [QUALIFICATION, DISCOVERY, PROPOSAL, NEGOTIATION, WON, LOST]
    initial: QUALIFICATION
    terminal: [WON, LOST]
    transitions:
    - {from: QUALIFICATION, to: DISCOVERY, action: discover}
    - {from: DISCOVERY, to: PROPOSAL, action: propose}
    - {from: PROPOSAL, to: NEGOTIATION, action: negotiate}
    - {from: NEGOTIATION, to: PROPOSAL, action: revise_proposal}
    - {from: PROPOSAL, to: WON, action: win}
    - {from: NEGOTIATION, to: WON, action: win}
    - {from: QUALIFICATION, to: LOST, action: lose}
    - {from: DISCOVERY, to: LOST, action: lose}
    - {from: PROPOSAL, to: LOST, action: lose}
    - {from: NEGOTIATION, to: LOST, action: lose}
  help:
    summary: A qualified chance to sell, with an estimated value, probability and closing date.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, Party, Lead, SalesOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Salespeople work each opportunity through the stages of the sales process, estimating its value, probability and closing date; managers forecast revenue from the pipeline; a won opportunity becomes a sales order.
    lifecycle: An opportunity moves from qualification through discovery and proposal to negotiation, may go back from negotiation to proposal, and ends won or lost.
    example: Opportunity OP-3301 'Warehouse automation for Bauer GmbH', negotiation, 180,000 EUR, 60 %, expected close 30 June 2024, owner Lisa Weber.
    businessMeaning: The opportunity pipeline is the basis for sales forecasts and for deciding where salespeople spend their time.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-OPPORTUNITY
