entity:
  name: Opportunity
  namespace: cedm.domain
  kind: crm_entity
  description: A qualified potential commercial transaction.
  ui:
    icon: trending-up
  identity:
    key: opportunityId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: opportunityId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the opportunity.
        usage: Generated on creation; activities and quotes refer to it.
    - name: opportunityNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number of the opportunity.
        usage: Allocated on creation; unique.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A descriptive name, such as Retail Co - Platform renewal.
        usage: Entered by the salesperson; shown in pipeline views.
    - name: stage
      type: enum
      required: true
      values:
        - QUALIFICATION
        - DISCOVERY
        - PROPOSAL
        - NEGOTIATION
        - WON
        - LOST
      help:
        summary: How far the opportunity has progressed.
        usage: Moved by the salesperson as the deal advances; stage drives the default probability.
        valueSemantics:
          QUALIFICATION: Checking that the buyer has need, budget and authority.
          DISCOVERY: Understanding the buyer's requirements in detail.
          PROPOSAL: A proposal or quote has been sent.
          NEGOTIATION: Terms and price are being negotiated.
          WON: The buyer has agreed to buy. A final state.
          LOST: The deal was lost to a competitor or abandoned. A final state.
    - name: probability
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The estimated chance of winning, as a percentage from 0 to 100.
        usage: Set by the salesperson or defaulted from the stage; weighted forecasts multiply value by it.
    - name: expectedValue
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The expected value of the deal if won.
        usage: Estimated by the salesperson and refined as the proposal firms up.
    - name: expectedCloseDate
      type: date
      required: false
      help:
        summary: The date by which the deal is expected to be decided.
        usage: Set by the salesperson; pipeline reports bucket opportunities by it.
  relationships:
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: The customer who may buy.
        usage: Set when the buyer is known.
        cardinalityMeaning: At most one customer; early opportunities may not yet be linked to one.
        workflowRole: Connects the pipeline to the account.
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The salesperson responsible.
        usage: Assigned by sales management.
        cardinalityMeaning: At most one owner.
        workflowRole: Gives accountability for the deal.
    - name: lead
      target: Lead
      cardinality: 0..1
      ownership: reference
      help:
        summary: The lead the opportunity was created from.
        usage: Set on conversion.
        cardinalityMeaning: At most one lead.
        workflowRole: Measures how well leads convert.
    - name: salesOrder
      target: SalesOrder
      cardinality: 0..1
      ownership: reference
      help:
        summary: The sales order placed when the opportunity is won.
        usage: Linked on winning.
        cardinalityMeaning: At most one sales order.
        workflowRole: Connects forecast to actual revenue.
  invariants:
    - id: OPPORTUNITY-001
      rule: probability must be between 0 and 100 when supplied.
  lifecycle:
    title: Opportunity Lifecycle
    attribute: stage
    states: [QUALIFICATION, DISCOVERY, PROPOSAL, NEGOTIATION, WON, LOST]
    initial: QUALIFICATION
    terminal:
      - WON
      - LOST
    transitions:
      - {from: QUALIFICATION, to: DISCOVERY, action: advance}
      - {from: DISCOVERY, to: PROPOSAL, action: advance}
      - {from: PROPOSAL, to: NEGOTIATION, action: advance}
      - {from: NEGOTIATION, to: PROPOSAL, action: revise_proposal}
      - {from: PROPOSAL, to: WON, action: win}
      - {from: NEGOTIATION, to: WON, action: win}
      - {from: QUALIFICATION, to: LOST, action: lose}
      - {from: DISCOVERY, to: LOST, action: lose}
      - {from: PROPOSAL, to: LOST, action: lose}
      - {from: NEGOTIATION, to: LOST, action: lose}
  help:
    summary: A qualified potential commercial transaction that the sales team is working to win.
    businessMeaning: The sales pipeline is made of opportunities. Each one records who might buy, how likely it is and what it is worth, so the team can focus effort and forecast revenue.
    usage: Created when a lead is qualified; advanced through stages; won or lost; read by sales managers for forecasting.
    relationshipContext: An opportunity is for a Customer, owned by a Party (the salesperson), may come from a Lead and may end in a SalesOrder.
    lifecycle: An opportunity moves through qualification, discovery, proposal and negotiation and ends won or lost. A proposal may be revised during negotiation.
    example: A 120,000 software contract with a retailer, in negotiation with 60% probability and an expected close at the end of the quarter.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-OPPORTUNITY
