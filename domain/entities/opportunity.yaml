entity:
  name: Opportunity
  namespace: cedm.domain
  kind: crm_entity
  description: A qualified potential commercial transaction.
  ui:
    icon: trending-up
  identity:
    key: opportunityId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: opportunityId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the opportunity record associated with this Opportunity. The identifier connects this record to
        the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one potential deal, so activities, quotes and the eventual sales order all trace back to the same opportunity."
  - name: opportunityNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of opportunity number for the Opportunity. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The deal reference sales staff quote in meetings, quotes and pipeline reports, such as OPP-2026-0871."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short title the sales team uses for the deal, such as Acme Corp - 500 seat renewal, shown in pipeline views and forecasts."
  - name: stage
    type: enum
    required: true
    values:
    - QUALIFICATION
    - DISCOVERY
    - PROPOSAL
    - NEGOTIATION
    - WON
    - LOST
    help:
      summary: Captures the business meaning of stage for the Opportunity. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        QUALIFICATION: Represents the qualification state or classification in the context of Opportunity.
        DISCOVERY: Represents the discovery state or classification in the context of Opportunity.
        PROPOSAL: Represents the proposal state or classification in the context of Opportunity.
        NEGOTIATION: Represents the negotiation state or classification in the context of Opportunity.
        WON: Represents the won state or classification in the context of Opportunity.
        LOST: Represents the lost state or classification in the context of Opportunity.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "How far the deal has progressed, from QUALIFICATION through DISCOVERY, PROPOSAL and NEGOTIATION to WON or LOST, which drives pipeline reporting and what the sales owner should do next."
  - name: probability
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: Captures the business meaning of probability for the Opportunity. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The estimated chance, as a percentage, that the deal will be won; multiplied by the expected value it gives the weighted figure used in revenue forecasts."
  - name: expectedValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of expected value for the Opportunity. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The revenue the deal is expected to bring if won, which sales managers sum across the pipeline to forecast bookings and set priorities."
  - name: expectedCloseDate
    type: date
    required: false
    help:
      summary: Records the business date associated with the expected close. It is used in chronology, eligibility, scheduling,
        reporting, and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Opportunity records, where
        applicable.
      relationshipContext: Its meaning is specific to Opportunity; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The date the sales owner expects the deal to be decided, which places it in a forecast period and flags it as overdue when that date passes."
  relationships:
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Opportunity to Customer so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Customer records associated with a Opportunity.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Opportunity to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Opportunity.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: lead
    target: Lead
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Opportunity to Lead so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Lead records associated with a Opportunity.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: salesOrder
    target: SalesOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Opportunity to SalesOrder so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about SalesOrder records associated with a Opportunity.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: OPPORTUNITY-001
    rule: probability must be between 0 and 100 when supplied.
  lifecycle:
    title: Opportunity Lifecycle
    attribute: stage
    states: [QUALIFICATION, DISCOVERY, PROPOSAL, NEGOTIATION, WON, LOST]
    initial: QUALIFICATION
    terminal: [LOST]
    transitions:
      - {from: QUALIFICATION, to: DISCOVERY, action: mark_discovery}
      - {from: DISCOVERY, to: PROPOSAL, action: mark_proposal}
      - {from: PROPOSAL, to: WON, action: mark_won}
      - {from: DISCOVERY, to: NEGOTIATION, action: mark_negotiation}
      - {from: NEGOTIATION, to: DISCOVERY, action: resume}
      - {from: PROPOSAL, to: NEGOTIATION, action: mark_negotiation}
      - {from: NEGOTIATION, to: PROPOSAL, action: resume}
      - {from: WON, to: NEGOTIATION, action: mark_negotiation}
      - {from: NEGOTIATION, to: WON, action: resume}
      - {from: DISCOVERY, to: LOST, action: mark_lost}
      - {from: PROPOSAL, to: LOST, action: mark_lost}
      - {from: WON, to: LOST, action: mark_lost}
      - {from: NEGOTIATION, to: LOST, action: mark_lost}
  help:
    summary: "One qualified chance to win business from a customer, tracked with its sales stage, expected value, probability and close date so sales teams can manage the pipeline and forecast revenue."
    businessMeaning: Opportunity is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Opportunity records.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, Party, Lead,
      SalesOrder. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Opportunity record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Created when a lead is qualified, assigned to a sales owner, moved through discovery, proposal and negotiation as the deal develops, with probability and expected value updated along the way, and finally marked won, which leads to a sales order, or lost, which is kept for win-loss analysis."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-OPPORTUNITY
