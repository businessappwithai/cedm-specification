entity:
  name: Organization
  namespace: cedm.domain
  kind: party_specialization
  extends: Party
  description: Legal, commercial, governmental, nonprofit, or other organized body represented as a specialization of Party. Organization provides intrinsic organizational identity; business participation is represented through PartyRole and specialized roles such as Customer or Supplier.
  identity: {key: organizationId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: organizationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the Organization specialization.
      usage: Used to navigate organizational identity details from the underlying Party.
      relationshipContext: Party.partyId remains the canonical party identity; organizationId identifies the specialization record.
      workflowRole: Provides stable reference for organization-specific information.
      requiredMeaning: Required for specialization traceability.
  - name: partyId
    type: reference
    target: Party
    required: true
    unique: true
    immutable: true
    help:
      summary: Canonical Party identity represented by this Organization specialization.
      usage: Connects organizational details to the shared Party identity used by all roles and transactions.
      relationshipContext: One Party may have exactly one Organization specialization when partyType is ORGANIZATION.
      workflowRole: Ensures Customer, Supplier, Owner, and other roles resolve to the same underlying organization.
      requiredMeaning: Required to prevent duplicate party identity.
  - name: code
    type: string
    required: true
    maxLength: 50
    help:
      summary: Business code for the organization within its governed business context.
      usage: Used for operations, reporting, integrations, and organizational selection.
      relationshipContext: Code is not the canonical Party identity and uniqueness is governed by organization scope.
      workflowRole: Provides operational reference for organization hierarchy and business context.
      requiredMeaning: Required where the organization participates in governed operational processes.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: Common organizational name used in business operations.
      usage: Used in search, forms, reports, documents, and transactions.
      relationshipContext: LegalName may differ and provides formal legal identity.
      workflowRole: Provides human-readable organizational identification.
      requiredMeaning: Required for operational recognition.
  - name: organizationType
    type: enum
    required: true
    values: [ENTERPRISE, COMPANY, BUSINESS_UNIT, DIVISION, DEPARTMENT, BRANCH, SUBSIDIARY, OTHER]
    help:
      summary: Classifies the organizational structure represented by the specialization.
      usage: Used for hierarchy, authorization, reporting, transaction scope, and organizational configuration.
      relationshipContext: Organization type describes structure, not commercial role. Customer/Supplier behavior belongs to PartyRole specializations.
      workflowRole: Controls applicable organizational hierarchy and operating-context rules.
      requiredMeaning: Required for organizational interpretation.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    help:
      summary: Lifecycle of the organizational specialization.
      usage: Controls whether the organization can normally be selected as an organizational context.
      relationshipContext: Organization status does not replace Party.status or PartyRole.status; all applicable states must permit new activity.
      workflowRole: Governs organizational use while preserving historical relationships.
      requiredMeaning: Required for eligibility checks.
  - name: legalName
    type: string
    required: false
    maxLength: 300
    help:
      summary: Formal legal name of the organization.
      usage: Used for contracts, invoices, tax, regulatory reporting, and legal documentation.
      relationshipContext: LegalName is distinct from the operational name.
      workflowRole: Supplies legal presentation and compliance context.
      optionalMeaning: Optional when the organization is not a legal entity or the information is not yet known.
  - name: registrationNumber
    type: string
    required: false
    maxLength: 100
    help:
      summary: Registration identifier assigned by a competent authority.
      usage: Used for legal verification, compliance, tax, and integrations.
      relationshipContext: Registration number identifies the organization in an external legal system, not in CEDM.
      workflowRole: Supports identity verification and compliance controls.
      optionalMeaning: Optional for organizational units without separate registration.
  - name: taxIdentifier
    type: string
    required: false
    maxLength: 100
    help:
      summary: Tax identifier applicable to the organization in a relevant jurisdiction.
      usage: Used for tax determination, invoices, reporting, and compliance.
      relationshipContext: Tax identity may vary by jurisdiction and should not replace Party identity.
      workflowRole: Supports tax-rule applicability and statutory reporting.
      optionalMeaning: Optional when no tax identifier applies or is known.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help: {summary: CEDM creation timestamp, usage: audit and synchronization, relationshipContext: record lifecycle only, requiredMeaning: required for traceability.}
  - name: createdBy
    type: reference
    target: Party
    required: false
    systemManaged: true
    help: {summary: Actor that created the record, usage: audit, relationshipContext: actor not subject, optionalMeaning: optional when source cannot identify actor.}
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help: {summary: Latest CEDM modification timestamp, usage: synchronization and audit, relationshipContext: record modification only, requiredMeaning: required for change tracking.}
  - name: updatedBy
    type: reference
    target: Party
    required: false
    systemManaged: true
    help: {summary: Actor responsible for latest modification, usage: audit, relationshipContext: actor not subject, optionalMeaning: optional when unavailable.}
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    inverse: organization
    help:
      summary: Canonical Party represented by this Organization specialization.
      usage: Provides shared identity for all PartyRoles.
      cardinalityMeaning: Exactly one Party is represented.
      workflowRole: Connects intrinsic organization identity to commercial and operational roles.
  - name: parentOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Immediate parent organizational unit.
      usage: Supports enterprise hierarchy and organizational scope.
      cardinalityMeaning: Zero or one immediate parent.
      workflowRole: Determines inherited organizational context where explicitly supported.
  - name: childOrganizations
    target: Organization
    cardinality: 0..*
    ownership: reference
    inverse: parentOrganization
    help:
      summary: Immediate child organizational units.
      usage: Supports hierarchy navigation and organizational reporting.
      cardinalityMeaning: Zero or many children.
      workflowRole: Maintains the organizational graph.
  - name: addresses
    target: Address
    cardinality: 0..*
    ownership: reference
    help: {summary: Organization addresses, usage: billing/service/legal/contact processes, cardinalityMeaning: zero or many, workflowRole: supplies location context.}
  - name: locations
    target: Location
    cardinality: 0..*
    ownership: reference
    help: {summary: Organization operating locations, usage: logistics/service/organizational processes, cardinalityMeaning: zero or many, workflowRole: supplies operational location context.}
  invariants:
  - {id: ORG-001, rule: partyType must equal ORGANIZATION for the referenced Party.}
  - {id: ORG-002, rule: An Organization cannot be its own parent.}
  - {id: ORG-003, rule: The organizational hierarchy must not contain cycles.}
  - {id: ORG-004, rule: One Party cannot have multiple Organization specializations.}
  - {id: ORG-005, rule: Organization status alone must not authorize a transaction; Party and applicable PartyRole eligibility must also permit it.}
  - {id: ORG-006, rule: Organizational hierarchy or master-data changes must not rewrite historical transaction organizational context.}
  lifecycle: {states: [DRAFT, ACTIVE, INACTIVE, RETIRED]}
  audit: {enabled: true, trackCreatedBy: true, trackCreatedAt: true, trackUpdatedBy: true, trackUpdatedAt: true}
  tags: [organization, party, specialization, hierarchy, master-data]
  help:
    summary: Organization is the organizational specialization of Party, not an independent party identity or business role.
    businessMeaning: Party identifies who the organization is; Organization describes intrinsic organizational structure; PartyRole describes how it participates; Customer and Supplier provide commercial behavior.
    usage: Used across sales, procurement, finance, logistics, contracts, compliance, HR, and enterprise hierarchy.
    relationshipContext: Party → Organization provides identity specialization. Party → PartyRole provides participation. Customer/Supplier must not create duplicate Party identities.
    workflowContext: Create/maintain Party → create Organization specialization → establish organizational hierarchy → assign PartyRole → apply specialized commercial qualification → permit transactions. Master-data changes affect future eligibility and presentation while historical transactions retain their original context.
    lifecycle: Organization follows its own master-data lifecycle while remaining subordinate to Party identity consistency. Retirement does not delete historical transactions or roles.
    example: One company exists as one Party and one Organization specialization, while holding CUSTOMER and SUPPLIER PartyRoles with separate commercial controls.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-ORGANIZATION}
