# CEDM Domain Entity: ContainerMovement
entity:
  name: ContainerMovement
  namespace: cedm.domain
  kind: logistics_transaction
  description: A planned or executed movement of a container between locations or yard positions.
  identity: {key: containerMovementId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: containerMovementId, type: uuid, required: true, immutable: true}
    - {name: movementNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: movementType, type: enum, required: true, values: [RECEIVE, STACK, RESTACK, UNSTACK, TRANSFER, GATE_OUT, GATE_IN, LOAD, DISCHARGE, INSPECTION, REPAIR_MOVE]}
    - {name: status, type: enum, required: true, default: PLANNED, values: [PLANNED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED]}
    - {name: plannedAt, type: datetime, required: false}
    - {name: startedAt, type: datetime, required: false}
    - {name: completedAt, type: datetime, required: false}
    - {name: priority, type: enum, required: true, default: NORMAL, values: [LOW, NORMAL, HIGH, CRITICAL]}
  relationships:
    - {name: container, target: Container, cardinality: "1", ownership: reference}
    - {name: sourceSlot, target: YardSlot, cardinality: "0..1", ownership: reference}
    - {name: targetSlot, target: YardSlot, cardinality: "0..1", ownership: reference}
    - {name: assignedTo, target: Party, cardinality: "0..1", ownership: reference}
    - {name: relatedTransaction, target: BusinessTransaction, cardinality: "0..1", ownership: reference}
  invariants:
    - {id: CONTAINER-MOVEMENT-001, rule: COMPLETED movement requires completedAt.}
    - {id: CONTAINER-MOVEMENT-002, rule: source and target positions must be compatible with the movementType.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CONTAINER-MOVEMENT}
