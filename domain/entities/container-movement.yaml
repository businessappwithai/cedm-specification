entity:
  name: ContainerMovement
  namespace: cedm.domain
  kind: logistics_transaction
  description: A traceable operational instruction or event that moves a specific shipping container between physical positions or transport states within a depot, terminal, port, workshop, or other logistics network.
  identity: {key: containerMovementId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: containerMovementId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable identity of one container movement instruction or event.
        usage: Used to trace the movement through planning, dispatch, execution, completion, audit, integrations, and operational reporting.
        relationshipContext: Identifies the movement itself, while container identifies the equipment being moved and sourceSlot/targetSlot identify its physical positions.
        requiredMeaning: Required because every movement must be independently traceable.
    - name: movementNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The human-facing operational reference assigned to the container movement.
        usage: Used by yard planners, equipment operators, gate teams, dispatchers, supervisors, and external systems when referring to a specific move.
        relationshipContext: It is the operational reference for the movement and is distinct from the container's equipment number and the movement's technical identity.
        requiredMeaning: Required so personnel and integrations can refer to the same movement unambiguously.
    - name: movementType
      type: enum
      required: true
      values: [RECEIVE, STACK, RESTACK, UNSTACK, TRANSFER, GATE_OUT, GATE_IN, LOAD, DISCHARGE, INSPECTION, REPAIR_MOVE]
      help:
        summary: Identifies the operational purpose and physical meaning of the container move.
        usage: Determines required locations, equipment, workflow steps, movement validation, yard capacity effects, and operational reporting.
        relationshipContext: Movement type explains why the container is being moved; the Container, Shipment, gate transaction, inspection, or repair process supplies the broader business context.
        valueSemantics:
          RECEIVE: Brings a container into the controlled facility or receiving process and establishes its initial operational location or status.
          STACK: Places a container into an available yard position, normally establishing or changing its occupied YardSlot.
          RESTACK: Moves a container from one yard position to another to improve access, safety, capacity, or operational efficiency without changing its broader custody purpose.
          UNSTACK: Removes a container from its current stacked position, normally to make it accessible for another movement or operation.
          TRANSFER: Moves a container between controlled operational areas or locations while maintaining the intended custody or logistics flow.
          GATE_OUT: Moves a container out through a facility gate as part of a release, delivery, interchange, or outbound transport process.
          GATE_IN: Records the operational movement of a container through an inbound gate into the facility.
          LOAD: Places a container onto a vessel, truck, rail service, or other transport asset as part of transport execution.
          DISCHARGE: Removes a container from a vessel or other transport asset into the receiving operational flow.
          INSPECTION: Positions the container for inspection, survey, verification, or examination without necessarily changing its commercial ownership.
          REPAIR_MOVE: Moves the container to or from a repair/workshop area so maintenance activity can be performed.
        requiredMeaning: Required because the movement's physical and business consequences depend on its purpose.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED]
      help:
        summary: The execution lifecycle of the movement.
        usage: Controls dispatch, equipment assignment, operator execution, exception handling, completion, and operational dashboards.
        relationshipContext: Movement status describes execution of the move; it must not be used by itself to infer the container's overall commercial or inventory lifecycle.
        valueSemantics:
          PLANNED: The movement is required or scheduled but no execution resource has necessarily been assigned.
          ASSIGNED: The movement has been allocated to an operator, vehicle, crane, tractor, or other execution resource.
          IN_PROGRESS: Physical execution of the movement has started.
          COMPLETED: The intended movement has been physically completed and the resulting position or transport state has been confirmed.
          CANCELLED: The movement will not be executed under the current instruction.
          FAILED: Execution was attempted or initiated but could not be completed successfully and requires exception handling.
        requiredMeaning: Required because yard and transport operations need a controlled execution state.
    - name: plannedAt
      type: datetime
      required: false
      help:
        summary: The planned date and time at which execution of the movement is expected to occur.
        usage: Used for yard sequencing, crane/tractor scheduling, appointment coordination, congestion management, and operational planning.
        relationshipContext: It represents the plan, not proof that the container was physically moved.
        optionalMeaning: Optional while the movement is created without a committed execution time.
    - name: startedAt
      type: datetime
      required: false
      help:
        summary: The actual date and time at which physical execution of the movement began.
        usage: Used for productivity measurement, equipment utilization, turnaround analysis, delay analysis, and operational audit.
        relationshipContext: It should normally be populated when status becomes IN_PROGRESS and should not be confused with plannedAt.
        optionalMeaning: Optional before execution starts or when execution timestamps are supplied by an external system.
    - name: completedAt
      type: datetime
      required: false
      help:
        summary: The actual date and time at which the intended container movement was confirmed complete.
        usage: Used to establish the container's new physical position, measure move duration, update yard state, and support operational reporting.
        relationshipContext: Completion should correspond to the resulting targetSlot or transport state appropriate to movementType.
        optionalMeaning: Optional until the movement reaches a completed state.
    - name: priority
      type: enum
      required: true
      default: NORMAL
      values: [LOW, NORMAL, HIGH, CRITICAL]
      help:
        summary: Indicates the operational urgency with which the movement should be scheduled relative to competing moves.
        usage: Used by yard planning, dispatch, sequencing, exception management, and optimization algorithms.
        relationshipContext: Priority affects scheduling preference; it does not change the physical meaning of movementType or the business importance of the Container itself.
        valueSemantics:
          LOW: The move can normally wait behind higher-priority operational work.
          NORMAL: The move follows ordinary yard sequencing and service rules.
          HIGH: The move should receive preferential scheduling because delay may affect downstream operations.
          CRITICAL: The move requires immediate or protected execution because delay can materially disrupt safety, vessel operations, gate commitments, customer commitments, or another critical process.
        requiredMeaning: Required so competing movements can be sequenced consistently.
  relationships:
    - name: container
      target: Container
      cardinality: '1'
      ownership: reference
      help:
        summary: Identifies the physical shipping container that is the subject of the movement.
        usage: Connects movement execution to container identity, size/type, ownership or lease context, condition, status, and current position.
        cardinalityMeaning: Exactly one Container is moved by a ContainerMovement.
        context: Container is the equipment master/current-state object; ContainerMovement is the event or instruction that changes its operational position or transport state.
    - name: sourceSlot
      target: YardSlot
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the YardSlot from which the container is physically removed.
        usage: Used for move validation, yard occupancy updates, travel planning, stack dependency checks, and movement history.
        cardinalityMeaning: Zero or one source slot is recorded because some moves begin outside a yard slot, such as gate-in, discharge, or external transfer.
        context: When present, sourceSlot represents the container's physical position immediately before the move, not merely its general yard or facility.
    - name: targetSlot
      target: YardSlot
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the YardSlot into which the container is intended to be placed or has been placed.
        usage: Used for slot reservation, yard occupancy, stacking validation, route planning, and confirmation of the container's new position.
        cardinalityMeaning: Zero or one target slot is recorded because movements such as gate-out, load, or external transfer may leave the controlled yard without a target YardSlot.
        context: When present, targetSlot represents the intended or resulting physical position and must be compatible with container dimensions, stack rules, and slot availability.
    - name: assignedTo
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the person, operator organization, contractor, or other party responsible for executing the movement when such responsibility is explicitly modeled.
        usage: Used for dispatch, accountability, operator workload, contractor management, safety, and performance reporting.
        cardinalityMeaning: Zero or one party may be assigned because responsibility may instead be represented by an equipment assignment or external execution system.
        context: Party identifies who is responsible; a more specialized workforce or equipment assignment model can provide the execution details without duplicating party identity.
    - name: relatedTransaction
      target: BusinessTransaction
      cardinality: 0..1
      ownership: reference
      help:
        summary: Links the movement to the business transaction or operational process that created or justified the move.
        usage: Provides traceability from a physical move back to a gate transaction, shipment, order, inspection, repair, discharge, delivery, or other business event.
        cardinalityMeaning: Zero or one originating transaction may be recorded because some yard moves are internal optimization or safety moves without a separate source transaction.
        context: This relationship separates the physical execution event from the business reason for it.
  invariants:
    - {id: CONTAINER-MOVEMENT-001, rule: COMPLETED movement requires completedAt.}
    - {id: CONTAINER-MOVEMENT-002, rule: sourceSlot and targetSlot must not be the same when both are present.}
    - {id: CONTAINER-MOVEMENT-003, rule: STACK, RESTACK, and TRANSFER movements requiring a yard destination must have a targetSlot before execution.}
    - {id: CONTAINER-MOVEMENT-004, rule: a completed movement must result in a container position or transport state consistent with movementType.}
    - {id: CONTAINER-MOVEMENT-005, rule: movement history must not be overwritten to correct a completed event; corrective activity must be represented by a subsequent authorized movement or reversal according to process rules.}
  help:
    summary: Represents one traceable physical or operational movement of a shipping container.
    businessMeaning: ContainerMovement is the execution-level event that connects a container's physical location and transport state to yard operations, equipment execution, and the business process that caused the move. It is deliberately separate from Container, which represents the equipment, and YardSlot, which represents a physical storage position.
    usage: Used by yard management, terminal operations, depot operations, gate management, vessel operations, repair operations, dispatch, equipment optimization, safety controls, and operational analytics.
    relationshipContext: Container identifies what is moved. sourceSlot and targetSlot describe where it moves within the yard. relatedTransaction explains why the move is required. assignedTo identifies responsibility where appropriate. A completed movement may update the current position of Container and occupancy of YardSlot, while the movement itself remains historical evidence of what happened.
    lifecycle: A movement begins as planned work, may be assigned to an execution resource, enters progress when physical handling starts, and completes when the resulting container position or transport state is confirmed. Cancellation prevents execution. Failure records an unsuccessful execution requiring recovery or replanning. Completed movements should remain immutable historical events.
    example: A loaded 40-foot container currently occupying B12-08-02 is required for an outbound truck. A GATE_OUT movement is created with the container, source slot, planned execution time, and priority. Once the container leaves the depot, the movement becomes COMPLETED and the container's current yard position is cleared. The movement remains available for audit and operational history.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-CONTAINER-MOVEMENT}
