entity:
  name: EducationCourse
  namespace: cedm.domain
  kind: education_entity
  description: A defined course or learning unit offered by an educational institution or program.
  ui:
    icon: graduation-cap
  identity:
    key: courseId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: courseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the course record associated with this EducationCourse. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationCourse records, where
        applicable.
      relationshipContext: Its meaning is specific to EducationCourse; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for the course, keeping enrolments, classes and assessments tied to it even if the code or name changes."
  - name: courseCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of course code for the EducationCourse. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationCourse records, where
        applicable.
      relationshipContext: Its meaning is specific to EducationCourse; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The catalogue code students and staff use to find and register for the course, and that appears on transcripts."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationCourse records, where
        applicable.
      relationshipContext: Its meaning is specific to EducationCourse; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The course title shown in the catalogue, timetables and transcripts, telling students what the course is about."
  - name: credits
    type: decimal
    required: false
    precision: 8
    scale: 2
    help:
      summary: Captures the business meaning of credits for the EducationCourse. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationCourse records, where
        applicable.
      relationshipContext: Its meaning is specific to EducationCourse; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How much the course counts toward a qualification, which students rely on to plan their study load and registrars use to check programme completion."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EducationCourse records, where
        applicable.
      relationshipContext: Its meaning is specific to EducationCourse; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of EducationCourse.
        ACTIVE: Represents the active state or classification in the context of EducationCourse.
        INACTIVE: Represents the inactive state or classification in the context of EducationCourse.
        RETIRED: Represents the retired state or classification in the context of EducationCourse.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the course can be offered: only ACTIVE courses take new classes and enrolments, DRAFT ones are still being designed, INACTIVE ones are paused and RETIRED ones are withdrawn for good."
  relationships:
  - name: program
    target: EducationProgram
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects EducationCourse to EducationProgram so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about EducationProgram records associated with a EducationCourse.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: instructors
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects EducationCourse to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a EducationCourse.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: enrollments
    target: Enrollment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects EducationCourse to Enrollment so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Enrollment records associated with a EducationCourse.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: classes, target: Class, cardinality: "0..*", ownership: aggregate, help: {summary: Scheduled delivery instances of this Course., businessMeaning: Separates reusable curriculum from term/section execution., usage: "Scheduling, enrollment and reporting.", cardinalityMeaning: Zero or many Classes., workflowRole: Course lifecycle constrains new Class creation without rewriting completed offerings.}}
  - {name: assessments, target: Assessment, cardinality: "0..*", ownership: reference, help: {summary: Assessments evaluating learning under this Course., businessMeaning: Connects curriculum expectations to governed evaluation activities., usage: "Assessment planning, gradebook and analytics.", cardinalityMeaning: Zero or many Assessments., workflowRole: Assessment scope must remain compatible with Course and optional Class.}}

  lifecycle:
    title: Education Course Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One course or learning unit an institution offers, with its code, name and credit value, kept so programmes, classes, enrolments and assessments can all refer to the same course definition."
    businessMeaning: EducationCourse is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate EducationCourse records.
    relationshipContext: The entity participates in a wider business graph through relationships with EducationProgram, Party,
      Enrollment. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical EducationCourse record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "Curriculum staff draft the course and activate it once approved, schedulers then create classes for it, students enrol and are assessed, and the course is deactivated when not offered for a term, reactivated later, or retired when withdrawn from the catalogue."
specification:
  version: 0.1.0
