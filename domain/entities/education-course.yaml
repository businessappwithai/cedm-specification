entity:
  name: EducationCourse
  namespace: cedm.domain
  kind: education_entity
  description: A defined course or learning unit offered by an educational institution or program.
  ui:
    icon: graduation-cap
    recordLabel: [courseCode, name]
  identity:
    key: courseId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: courseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the education course record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a education course store this identifier. The number or code people quote is a separate field.
  - name: courseCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the course, such as CS-201.
      usage: Used in timetables, transcripts and enrolments.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The title of the course.
      usage: Shown in the catalogue and on transcripts.
      relationshipContext: Identifies the course for students.
  - name: credits
    type: decimal
    required: false
    precision: 8
    scale: 2
    help:
      summary: The credits a student earns by passing the course.
      usage: Summed towards the programme's requirements.
      relationshipContext: In the institution's credit system, such as ECTS.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the course is offered.
      usage: Moved on by the academic department.
      relationshipContext: Only active courses take enrolments.
      valueSemantics:
        DRAFT: Being designed.
        ACTIVE: Offered.
        INACTIVE: Not offered this term.
        RETIRED: Withdrawn from the catalogue.
  - name: level
    type: integer
    required: false
    help:
      summary: The level of study the course is taught at, such as 1 for first year.
      usage: Used to check prerequisites and programme structure.
      relationshipContext: From the institution's level scheme.
  - name: description
    type: text
    required: false
    help:
      summary: What the course covers and its learning outcomes.
      usage: Published in the catalogue.
      relationshipContext: Free text.
  - name: prerequisites
    type: string
    required: false
    maxLength: 300
    help:
      summary: Courses a student must have passed first.
      usage: Checked when students enrol.
      relationshipContext: Listed by course code.
  relationships:
  - name: program
    target: EducationProgram
    cardinality: 0..1
    ownership: reference
    help:
      summary: The programme the course belongs to.
      usage: Set by the academic department.
      cardinalityMeaning: At most one owning programme; other programmes may also include it.
      context: The owning programme answers for the course.
  - name: instructors
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Who teaches the course.
      usage: Assigned each term.
      cardinalityMeaning: Many instructors per course; an instructor teaches many courses.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: enrollments
    target: Enrollment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Students' enrolments on the course.
      usage: Listed from the course.
      cardinalityMeaning: Any number; each enrolment is on one course.
      context: The enrolment records its course.
    inverseCardinality: '1'
  lifecycle:
    title: Education Course Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A course a school or university offers, such as 'Introduction to Statistics', with its credits and level.
    relationshipContext: The entity participates in a wider business graph through relationships with EducationProgram, Party, Enrollment. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Academic departments define courses with their credits, level and instructors; programmes are built from them; timetabling schedules them each term; students enrol on them and receive their grades.
    lifecycle: Drafted while designed, active while offered, inactive in terms it is not taught, and retired when withdrawn from the catalogue.
    example: Course CS-201 'Data structures', 6 ECTS credits, level 2, taught by Dr Kim, part of the BSc Computer Science, offered every autumn term.
    businessMeaning: Courses are what students enrol in and what timetables, teaching loads and transcripts are built from.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EDUCATION-COURSE
