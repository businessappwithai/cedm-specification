entity:
  name: EducationCourse
  namespace: cedm.domain
  kind: education_entity
  description: A defined course or learning unit offered by an educational institution or program.
  ui:
    icon: graduation-cap
  identity:
    key: courseId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: courseId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the course, independent of how it is scheduled each term.
        usage: Generated on creation; classes, enrolments and assessments refer to it.
    - name: courseCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the course in the catalogue, such as MATH101.
        usage: Assigned by the registrar; unique; used on timetables and transcripts.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The title of the course.
        usage: Shown in catalogues, timetables and transcripts.
    - name: credits
      type: decimal
      required: false
      precision: 8
      scale: 2
      help:
        summary: The credit value the course carries towards a qualification.
        usage: Set when the course is designed; summed to check a student's progress to a degree.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the course is offered.
        usage: Set by the registrar; only ACTIVE courses can be scheduled into classes.
        valueSemantics:
          DRAFT: Being designed; not yet offered.
          ACTIVE: Offered and open to scheduling.
          INACTIVE: Not currently offered but may return.
          RETIRED: Withdrawn permanently; kept for transcripts.
  relationships:
    - name: program
      target: EducationProgram
      cardinality: 0..1
      ownership: reference
      help:
        summary: The program that includes the course.
        usage: Chosen when the course is placed in a curriculum.
        cardinalityMeaning: At most one program; a course may stand alone, for example an elective.
        workflowRole: Places the course in a path to a qualification.
    - name: instructors
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The people who teach the course.
        usage: Assigned by the department.
        cardinalityMeaning: Any number of instructors.
        workflowRole: Defines who may be scheduled to teach it.
    - name: enrollments
      target: Enrollment
      cardinality: 0..*
      ownership: reference
      help:
        summary: The enrolments of students in the course.
        usage: Read for rosters and completion statistics.
        cardinalityMeaning: Any number, accumulating over terms.
        workflowRole: Shows who has taken or is taking the course.
    - {name: classes, target: Class, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: 'Any number of classes, one for each scheduled offering of the course.', summary: Scheduled delivery instances of this Course., businessMeaning: Separates reusable curriculum from term/section execution., usage: "Scheduling, enrollment and reporting.", workflowRole: Course lifecycle constrains new Class creation without rewriting completed offerings.}}
    - {name: assessments, target: Assessment, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of assessments across the course's offerings., summary: Assessments evaluating learning under this Course., businessMeaning: Connects curriculum expectations to governed evaluation activities., usage: "Assessment planning, gradebook and analytics.", workflowRole: Assessment scope must remain compatible with Course and optional Class.}}

  lifecycle:
    title: Education Course Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A defined course or unit of learning offered by an educational institution or as part of a program.
    businessMeaning: "The course is the lasting description of what is taught and what it is worth. Each term's teaching is a separate class, so the course holds what stays the same: code, title, credits and place in a curriculum."
    usage: Designed by academic staff and approved by the registrar; scheduled into classes each term; read by students, advisers and timetablers.
    relationshipContext: A course may belong to an EducationProgram, is taught by Parties as instructors, is scheduled as Classes, is taken through Enrollments and is evaluated by Assessments.
    lifecycle: A course is drafted, becomes active when approved, can be made inactive between offerings and is retired when withdrawn. Retired courses stay on transcripts.
    example: MATH101 Calculus I, worth 6 credits, offered every autumn and part of the engineering degree program.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EDUCATION-COURSE
