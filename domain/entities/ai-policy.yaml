entity:
  name: AIPolicy
  namespace: cedm.domain
  kind: ai_governance_entity
  description: A governed policy defining constraints, approvals, controls, and permitted use for AI models and predictions.
  ui:
    icon: shield
  identity:
    key: aIPolicyId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: aIPolicyId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the policy.
        usage: Generated on creation; models and audit trails refer to the policy through it.
        relationshipContext: Connects this record to its governing AIModel context and downstream evidence.
    - name: aIPolicyCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The unique business reference of the policy, such as POL-AI-007.
        usage: Used when citing the policy in approvals, reviews and audits.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        valueSemantics:
          DRAFT: Being written and reviewed; not yet enforceable.
          ACTIVE: Adopted and enforced for the model it governs.
          COMPLETED: Superseded or run its course; no longer enforced for new decisions but kept as the record of past ones. A final state.
          CANCELLED: Withdrawn before it was adopted, so it never governed any model decision. A final state.
        summary: Where the policy stands, from drafting to adoption and closure.
        usage: Moved by the governance function; only ACTIVE policies are enforced when a model is approved or deployed.
        relationshipContext: Status changes can affect related AIModel workflows but never erase historical evidence.
  relationships:
    - name: context
      target: AIModel
      cardinality: '1'
      ownership: reference
      help:
        summary: The AI model this policy governs.
        usage: Chosen when the policy is created; its controls apply to that model and its predictions.
        cardinalityMeaning: Exactly one model per policy; a model may be governed by one policy at a time through its policy link.
        workflowRole: Ties the controls to the thing they constrain so approval and deployment can check them.
  invariants:
    - id: AIPOLICY-001
      rule: The governing AIModel relationship is required and must reference a valid record.
    - id: AIPOLICY-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: AIPOLICY-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: AI Policy Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a ai policy is ended"
      description: "When a ai policy is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "AI-POLICY-FOLLOW-UP-{{id}}"
              name: "Follow up on ai policy {{id}}"
              description: "Ai policy {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A governed policy that sets the constraints, approvals, controls and permitted uses for an AI model and its predictions.
    businessMeaning: A policy turns an organisation's rules for AI, such as human oversight, data limits and approval levels, into a record that can be attached to a model and checked.
    usage: Created by the AI governance function when rules for a type of model are agreed; reviewed whenever the model, its risk or the regulation changes; read by approvers and auditors.
    relationshipContext: Each policy is tied to the AIModel it governs; the model's approval and deployment checks consult it.
    lifecycle: A policy is drafted, becomes active when adopted, is completed when it has run its course or been replaced, and may be cancelled before it takes effect. A completed policy stays on record for past decisions.
    example: A policy requiring human review of every rejected loan application scored by the credit-scoring model, adopted for the 2026 financial year.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AIPOLICY
