entity:
  name: Agreement
  namespace: cedm.domain
  kind: legal_agreement
  description: A governed agreement between parties defining rights, duties, commitments, or terms, with Contract available for commercial contract specialization.
  ui:
    icon: file-check
  identity: {key: agreementId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: agreementId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of the agreement., usage: 'Generated on creation; contracts, obligations and documents refer to the agreement through it.'}}
    - {name: occurredAt, type: datetime, required: false, help: {summary: The date and time at which the agreement was concluded or took effect., usage: Set when the agreement is recorded; used to place it in the sequence of events and to compute periods that run from it.}}
  relationships: []
  invariants:
    - {id: AGREEMENT-001, rule: "Finalized evidence and effective history must be preserved; correction, reassessment, settlement or supersession must be explicit."}
  help:
    summary: A governed agreement between parties that fixes rights, duties, commitments or terms, of which a commercial contract is a specialisation.
    businessMeaning: 'An agreement is the record that two or more parties have committed to something. It is the parent concept behind contracts, service terms and similar understandings, so it holds what they share: who is bound, when, and what happened to the agreement over time.'
    usage: Created when terms are agreed or proposed; consulted when someone needs to know what was promised, whether it is in force, and what changed since.
    relationshipContext: Contract specialises Agreement for commercial terms; parties, documents and obligations hang off the more specific records.
    lifecycle: Finalised evidence and effective history are preserved. Changes, settlements and replacements are recorded as explicit events, never by silently editing what was agreed.
    example: A framework supply agreement between a manufacturer and a distributor, later amended twice and finally superseded by a new agreement.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-AGREEMENT}
