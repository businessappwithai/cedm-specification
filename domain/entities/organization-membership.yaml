entity:
  name: OrganizationMembership
  namespace: cedm.domain
  kind: iam_membership
  description: A governed relationship connecting a User or Party to an Organization with membership status and role context.
  ui:
    icon: building-2
  identity: {key: organizationMembershipId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: organizationMembershipId, type: uuid, required: true, immutable: true, help: {summary: The identity of the membership., usage: Generated on creation; role assignments and audit entries refer to it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the person currently belongs to the organisation.
        usage: Moved by administrators or the invitation process; access based on membership applies only while ACTIVE.
        valueSemantics:
          PENDING: Offered or requested, not yet effective.
          ACTIVE: In force; the person belongs to the organisation.
          COMPLETED: Ended normally. A final state.
          CANCELLED: Withdrawn before it took effect. A final state.
    - name: membershipRole
      type: string
      required: true
      maxLength: 100
      help:
        summary: The capacity in which the person belongs, such as "Accounts payable clerk" or "Board member".
        usage: Shown in organization charts and member lists.
        relationshipContext: Access rights come from access grants, not from this text.
    - name: membershipType
      type: enum
      required: true
      default: EMPLOYEE
      values:
        - EMPLOYEE
        - CONTRACTOR
        - PARTNER_USER
        - BOARD_MEMBER
        - VOLUNTEER
      help:
        summary: The kind of membership.
        usage: Chosen when recording it; it decides which processes apply, such as payroll.
        relationshipContext: External members see only what is shared with them.
        valueSemantics:
          EMPLOYEE: An employee of the organization.
          CONTRACTOR: Someone working for the organization under contract.
          PARTNER_USER: A person from a customer, supplier or partner given access.
          BOARD_MEMBER: A director or member of a governing body.
          VOLUNTEER: An unpaid member, such as a volunteer.
    - name: isPrimary
      type: boolean
      required: true
      default: false
      help:
        summary: Whether this is the person's main membership.
        usage: The primary membership decides the person's home unit in reports and approvals.
        relationshipContext: A person has at most one primary membership at a time.
    - name: startDate
      type: date
      required: true
      help:
        summary: The day the person or party officially became a member of the organisation.
        usage: Recorded when they join; it is used for access rights, headcount reports and membership history.
        relationshipContext: It cannot be later than the end date.
    - name: endDate
      type: date
      required: false
      help:
        summary: The day the membership stops, after which the person is no longer part of the organisation.
        usage: Recorded when the member leaves and left empty while the membership is open-ended.
        relationshipContext: Access tied to the membership should end with this date.
  relationships:
    - name: person
      target: Person
      cardinality: "1"
      ownership: reference
      help:
        summary: The person who is a member.
        usage: Chosen when recording the membership.
        cardinalityMeaning: Every membership is for exactly one person.
        context: The person's memberships make up their place in the organization.
    - name: organization
      target: Organization
      cardinality: "1"
      ownership: reference
      help:
        summary: The organization or unit the person belongs to.
        usage: Chosen when recording the membership.
        cardinalityMeaning: Every membership is in exactly one organization.
        context: The organization's member list is drawn from its active memberships.
    - name: user
      target: User
      cardinality: 0..1
      ownership: reference
      help:
        summary: The user account the person uses in this organization.
        usage: Linked when the membership gives access to the application.
        cardinalityMeaning: At most one account per membership.
        context: Ending the membership should lead to disabling or re-scoping the account.
  invariants:
    - {id: ORGANIZATION-MEMBERSHIP-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
    - {id: ORGANIZATION-MEMBERSHIP-EXE-001, rule: "End Date must not be earlier than start date.", violatedWhen: "start_date != null and end_date != null and end_date < start_date", message: "End Date cannot be earlier than start date."}
  lifecycle:
    title: Organization Membership Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a organization membership is ended"
      description: "When a organization membership is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ORGANIZATION-MEMBERSHIP-FOLLOW-UP-{{id}}"
              name: "Follow up on organization membership {{id}}"
              description: "Organization membership {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A relationship that connects a user or party to an organisation, with its membership status and role context.
    businessMeaning: 'People belong to organisations in different ways: as staff, partners, members or contractors. The membership says that a person belongs, in what capacity and whether it is current, which access and responsibilities are then based on.'
    usage: Created when someone is invited or added; activated on acceptance; ended when they leave; read by access control and administration.
    relationshipContext: A membership links a User or Party to an Organization.
    lifecycle: A membership is pending until accepted, active while in force, completed when it ends normally and cancelled if withdrawn before it began. State changes keep auditable history and do not duplicate effects.
    example: A consultant added to a client organisation for the duration of a project.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ORGANIZATION-MEMBERSHIP}
