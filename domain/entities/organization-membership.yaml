entity:
  name: OrganizationMembership
  namespace: cedm.domain
  kind: iam_membership
  description: A person's membership of an organization or unit — employee, contractor, partner user, board member — with their role in it and the period it covers.
  ui:
    icon: users
    recordLabel: [membershipRole]
  identity: {key: organizationMembershipId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: organizationMembershipId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the organization membership record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a organization membership store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACTIVE, SUSPENDED, ENDED]
    help:
      summary: Whether the membership is in effect.
      usage: Moved on as the person joins, is absent or leaves.
      relationshipContext: Only active memberships count for routing and access.
      valueSemantics:
        PENDING: Recorded but not yet started.
        ACTIVE: In effect.
        SUSPENDED: Temporarily not in effect, such as during a leave of absence.
        ENDED: Over.
  - name: membershipRole
    type: string
    required: true
    maxLength: 100
    help:
      summary: The capacity in which the person belongs, such as "Accounts payable clerk" or "Board member".
      usage: Shown in organization charts and member lists.
      relationshipContext: Access rights come from access grants, not from this text.
  - name: membershipType
    type: enum
    required: true
    default: EMPLOYEE
    values: [EMPLOYEE, CONTRACTOR, PARTNER_USER, BOARD_MEMBER, VOLUNTEER]
    help:
      summary: The kind of membership.
      usage: Chosen when recording it; it decides which processes apply, such as payroll.
      relationshipContext: External members see only what is shared with them.
      valueSemantics:
        EMPLOYEE: An employee of the organization.
        CONTRACTOR: Someone working for the organization under contract.
        PARTNER_USER: A person from a customer, supplier or partner given access.
        BOARD_MEMBER: A director or member of a governing body.
        VOLUNTEER: An unpaid member, such as a volunteer.
  - name: isPrimary
    type: boolean
    required: true
    default: false
    help:
      summary: Whether this is the person's main membership.
      usage: The primary membership decides the person's home unit in reports and approvals.
      relationshipContext: A person has at most one primary membership at a time.
  - name: startDate
    type: date
    required: true
    help:
      summary: The day the membership begins.
      usage: Recorded when the person joins.
      relationshipContext: Not later than the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The day the membership ends.
      usage: Recorded when the person leaves; empty while open-ended.
      relationshipContext: Access tied to the membership should end with it.
  relationships:
  - name: person
    target: Person
    cardinality: '1'
    ownership: reference
    help:
      summary: The person who is a member.
      usage: Chosen when recording the membership.
      cardinalityMeaning: Every membership is for exactly one person.
      context: The person's memberships make up their place in the organization.
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The organization or unit the person belongs to.
      usage: Chosen when recording the membership.
      cardinalityMeaning: Every membership is in exactly one organization.
      context: The organization's member list is drawn from its active memberships.
  - name: user
    target: User
    cardinality: 0..1
    ownership: reference
    help:
      summary: The user account the person uses in this organization.
      usage: Linked when the membership gives access to the application.
      cardinalityMeaning: At most one account per membership.
      context: Ending the membership should lead to disabling or re-scoping the account.
  invariants:
  - {id: ORGANIZATION-MEMBERSHIP-001, rule: The membership does not end before it starts., violatedWhen: end_date != null and start_date != null and end_date < start_date, message: The end date is earlier than the start date.}
  - {id: ORGANIZATION-MEMBERSHIP-002, rule: An ended membership records when it ended., violatedWhen: status == "ENDED" and end_date == null, message: Give the date the membership ended.}
  lifecycle:
    title: Organization Membership Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, SUSPENDED, ENDED]
    initial: PENDING
    terminal: [ENDED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: start}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: ENDED, action: end}
    - {from: SUSPENDED, to: ENDED, action: end}
    - {from: PENDING, to: ENDED, action: end}
  help:
    summary: The fact that a person belongs to an organization, in what capacity, and since when.
    businessMeaning: People act on behalf of organizations — staff of a department, users at a customer, members of a board. Knowing who belongs to which organization, in what role and for which period, is what lets the business route work, grant access by membership and show who could act for whom at a given date.
    usage: HR and administrators record memberships when someone joins a unit or a partner organization's users are onboarded, and end them when they leave. Access rules and organization charts read current memberships.
    relationshipContext: A membership connects a Person, or a User account, to an Organization. A person may hold memberships in several organizations at once, one of which is usually primary.
    lifecycle: Pending until it starts, active while it lasts, ended when the person leaves, and suspended for temporary absences such as a leave of absence.
    workflowContext: Joiner-mover-leaver, partner portal onboarding, organization charts, approval routing by unit.
    example: Maria Lopez — member of Finance Department, ACME France, role 'Accounts payable clerk', primary membership, from 1 April 2024.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ORGANIZATION-MEMBERSHIP}
