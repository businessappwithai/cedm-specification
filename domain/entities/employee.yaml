entity:
  name: Employee
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A person engaged by an organization as an employee.
  ui:
    icon: user-check
  identity:
    key: employeeId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: employeeId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the employee record associated with this Employee. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: Its meaning is specific to Employee; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets attendance, leave, payroll and reporting all point at the same employee record without depending on names that may change."
  - name: partyRoleId
    type: reference
    target: PartyRole
    required: true
    unique: true
    immutable: true
    help:
      summary: Identifies the related PartyRole associated with this Employee. It provides the link needed to navigate from
        this record to the related business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: This field connects Employee to PartyRole. The reference establishes business context between the
        two entities and lets processes navigate from this record to the related PartyRole.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Connects the employee to the underlying person, so the same individual can also be recognised as a customer, contact or contractor without duplicate records."
  - name: employeeNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of employee number for the Employee. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: Its meaning is specific to Employee; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The staff number printed on payslips and badges and quoted to HR, which people use to identify an employee unambiguously."
  - name: hireDate
    type: date
    required: false
    help:
      summary: Records the business date associated with the hire. It is used in chronology, eligibility, scheduling, reporting,
        and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: Its meaning is specific to Employee; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The day employment started, which drives length-of-service calculations, probation periods, leave entitlement and first pay."
  - name: terminationDate
    type: date
    required: false
    help:
      summary: Records the business date associated with the termination. It is used in chronology, eligibility, scheduling,
        reporting, and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: Its meaning is specific to Employee; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last day of employment, used to stop pay, calculate final settlements and remove access."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - ON_LEAVE
    - TERMINATED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Employee records, where applicable.
      relationshipContext: Its meaning is specific to Employee; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of Employee.
        ON_LEAVE: Represents the on leave state or classification in the context of Employee.
        TERMINATED: Represents the terminated state or classification in the context of Employee.
        RETIRED: Represents the retired state or classification in the context of Employee.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells HR and payroll whether the person is working, on leave, or has left through termination or retirement, which decides whether they are paid and scheduled."
  relationships:
  - name: person
    target: Person
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Employee to Person so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Person records associated with a Employee.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Employee to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Employee.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: leaveRequests
    target: LeaveRequest
    cardinality: 0..*
    ownership: reference
    help:
      summary: Leave requests submitted for this Employee.
      businessMeaning: Preserves absence authorization history independently of actual attendance evidence.
      usage: Employee self-service, HR, scheduling, payroll and audit.
      cardinalityMeaning: An Employee may have zero or many leave requests.
      workflowRole: Requests are evaluated under applicable Employment and leave policy.
  - name: attendanceRecords
    target: Attendance
    cardinality: 0..*
    ownership: reference
    help:
      summary: Attendance evidence recorded for this Employee.
      businessMeaning: Captures actual work or absence separately from authorization and payroll calculation.
      usage: Timekeeping, workforce analytics, scheduling, payroll and audit.
      cardinalityMeaning: An Employee may have zero or many attendance records.
      workflowRole: Approved attendance can become payroll input while corrections remain explicit evidence.

  invariants:
  - id: EMPLOYEE-001
    rule: partyRole.roleType must equal EMPLOYEE.
  - id: EMPLOYEE-002
    rule: terminationDate must not precede hireDate.
  lifecycle:
    title: Employee Lifecycle
    attribute: status
    states: [ACTIVE, ON_LEAVE, TERMINATED, RETIRED]
    initial: ACTIVE
    terminal: [TERMINATED, RETIRED]
    transitions:
      - {from: ACTIVE, to: ON_LEAVE, action: mark_on_leave}
      - {from: ON_LEAVE, to: ACTIVE, action: return_from_leave}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: ON_LEAVE, to: TERMINATED, action: terminate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: ON_LEAVE, to: RETIRED, action: retire}
  help:
    summary: "A person employed by the organization, holding the employee number, hire and termination dates and employment status that HR, payroll and managers rely on."
    businessMeaning: Employee is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Employee records.
    relationshipContext: The entity participates in a wider business graph through relationships with Person, Organization.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Employee record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "HR creates the employee record when a hire is confirmed, it is used daily for attendance, leave requests and payroll, status changes when the person goes on or returns from leave, and the record is marked terminated or retired when employment ends while history is kept."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMPLOYEE
