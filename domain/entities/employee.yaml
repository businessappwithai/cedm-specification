entity:
  name: Employee
  namespace: cedm.domain
  kind: party_role_specialization
  extends: PartyRole
  description: A person engaged by an organization as an employee.
  ui:
    icon: user-check
    recordLabel: [employeeNumber]
  identity:
    key: employeeId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: employeeId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the employee record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a employee store this identifier. The number or code people quote is a separate field.
  - name: partyRoleId
    type: reference
    target: PartyRole
    required: true
    unique: true
    immutable: true
    help:
      summary: The party-role record that makes the person an employee.
      usage: Created with the employee.
      relationshipContext: Links the employee to the person's party.
  - name: employeeNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The employee's number, used on payslips and in HR records.
      usage: Assigned on hiring.
      relationshipContext: Unique and never reused.
  - name: hireDate
    type: date
    required: false
    help:
      summary: The first day of employment.
      usage: Starts pay, benefits and seniority.
      relationshipContext: Not later than the termination date.
  - name: terminationDate
    type: date
    required: false
    help:
      summary: The last day of employment.
      usage: Recorded when the person leaves; ends pay and access.
      relationshipContext: Empty while employed.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - ON_LEAVE
    - TERMINATED
    - RETIRED
    help:
      summary: Whether the person is currently employed.
      usage: Moved on by HR.
      relationshipContext: Access should end when employment does.
      valueSemantics:
        ACTIVE: Employed and working.
        ON_LEAVE: Employed but on extended leave.
        TERMINATED: Employment ended.
        RETIRED: Left on retirement.
  - name: jobTitle
    type: string
    required: false
    maxLength: 150
    help:
      summary: The employee's job title.
      usage: Shown in directories and on documents.
      relationshipContext: Usually the title of their position.
  - name: workEmail
    type: email
    required: false
    help:
      summary: The employee's work email address.
      usage: Used for notifications and directories.
      relationshipContext: Usually also their user name.
  relationships:
  - name: person
    target: Person
    cardinality: '1'
    ownership: reference
    help:
      summary: The person who is employed.
      usage: Linked on hiring.
      cardinalityMeaning: Every employee is exactly one person.
      context: Personal details live on the person.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company that employs the person.
      usage: Set on hiring.
      cardinalityMeaning: At most one.
      context: The legal employer for payroll.
  invariants:
  - {id: EMPLOYEE-001, rule: Employment does not end before it starts., violatedWhen: termination_date != null and hire_date != null and termination_date < hire_date, message: The termination date is earlier than the hire date.}
  lifecycle:
    title: Employee Lifecycle
    attribute: status
    states: [ACTIVE, ON_LEAVE, TERMINATED, RETIRED]
    initial: ACTIVE
    terminal: [TERMINATED, RETIRED]
    transitions:
    - {from: ACTIVE, to: ON_LEAVE, action: mark_on_leave}
    - {from: ON_LEAVE, to: ACTIVE, action: return_from_leave}
    - {from: ACTIVE, to: TERMINATED, action: terminate}
    - {from: ON_LEAVE, to: TERMINATED, action: terminate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: ON_LEAVE, to: RETIRED, action: retire}
  help:
    summary: Represents a party role specialization called Employee within the CEDM business model.
    businessMeaning: Employee is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Person, Organization. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: HR creates an employee record when someone is hired, keeps it current through changes, and closes it when they leave; payroll, time, access and organization charts all read it.
    lifecycle: Active while employed; on leave during long absences; terminated when employment ends; retired when they leave on retirement. Records are kept after leaving as the law requires.
    example: Employee 004812, Maria Lopez, hired 1 April 2024 by ACME France, Accounts Payable department, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EMPLOYEE
