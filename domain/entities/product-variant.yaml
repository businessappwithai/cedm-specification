entity:
  name: ProductVariant
  namespace: cedm.domain
  kind: product_master_entity
  description: A sellable, purchasable, manufacturable, or stockable variation of a parent Product distinguished by governed option or attribute values while retaining the parent product family identity.
  ui:
    icon: package
    recordLabel: [code]
  identity: {key: productVariantId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: productVariantId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the product variant record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a product variant store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the variant, such as TSHIRT-RED-M.
      businessMeaning: Human/integration identifier for the configuration.
      usage: Used in orders and stock records.
      relationshipContext: Unique.
  - name: sku
    type: string
    required: false
    maxLength: 100
    help:
      summary: The stock-keeping unit used in the warehouse and shop.
      businessMeaning: Operational inventory/commercial identifier where variants are stocked separately.
      optionalMeaning: Optional for non-stocked variants.
      usage: Scanned and searched in store and warehouse systems.
      relationshipContext: Often equal to the code.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED, RETIRED]
    help:
      summary: Whether the variant may be sold.
      businessMeaning: Controls future eligibility of this configuration.
      usage: Moved on by the product manager.
      relationshipContext: Blocked variants cannot be ordered.
      valueSemantics:
        DRAFT: Being set up.
        ACTIVE: On sale.
        BLOCKED: Temporarily barred.
        DISCONTINUED: No longer replenished.
        RETIRED: No longer used.
  - name: name
    type: string
    required: false
    maxLength: 200
    help:
      summary: The name of the variant, such as "T-shirt, red, M".
      usage: Shown on product pages and order lines.
      relationshipContext: Usually the product name plus the options.
  - name: optionValues
    type: string
    required: false
    maxLength: 300
    help:
      summary: The options that distinguish the variant, such as "Colour=Red; Size=M".
      usage: Shown to shoppers and used to filter.
      relationshipContext: Each combination of options is one variant.
  - name: gtin
    type: string
    required: false
    maxLength: 14
    help:
      summary: The barcode number of the variant.
      usage: Scanned in stores and warehouses.
      relationshipContext: Each variant has its own GTIN.
  - name: priceAdjustment
    type: Money
    required: false
    help:
      summary: How much the variant's price differs from the product's base price.
      usage: Added to the base price; zero when the variant costs the same.
      relationshipContext: In the product's price currency.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    inverse: variants
    help:
      summary: The product the variant belongs to.
      businessMeaning: Supplies shared identity and semantics.
      workflowRole: Parent restrictions propagate to variant eligibility.
      usage: Set when the variant is created.
      cardinalityMeaning: Every variant belongs to exactly one product.
      context: Inherits the product's description and category.
  - name: brand
    target: Brand
    cardinality: 0..1
    ownership: reference
    help:
      summary: The brand of the variant when it differs from the product's.
      businessMeaning: Provides market identity.
      workflowRole: Brand retirement affects future presentation/eligibility policy.
      usage: Set for co-branded or licensed variants.
      cardinalityMeaning: At most one.
      context: Usually empty.
  invariants:
  - {id: PRODUCT-VARIANT-001, rule: code must be unique and variant must reference exactly one Product.}
  - {id: PRODUCT-VARIANT-002, rule: ACTIVE variant cannot override a parent Product restriction that prohibits new use.}
  - {id: PRODUCT-VARIANT-003, rule: Variant attribute configuration must be unique within its parent product family under the applicable option model.}
  - {id: PRODUCT-VARIANT-004, rule: Variant master changes must not rewrite historical transaction evidence.}
  lifecycle:
    title: Product Variant Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED, RETIRED]
    initial: DRAFT
    terminal: [DISCONTINUED, RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: BLOCKED, action: block}
    - {from: BLOCKED, to: ACTIVE, action: unblock}
    - {from: DRAFT, to: DISCONTINUED, action: discontinue}
    - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
    - {from: BLOCKED, to: DISCONTINUED, action: discontinue}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: BLOCKED, to: RETIRED, action: retire}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a product variant is stopped"
    description: "When a product variant is blocked, a high-priority task asks someone to resolve it."
    when: "status == \"BLOCKED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PRODUCT-VARIANT-EXCEPTION-{{id}}"
          name: "Resolve product variant {{code}}"
          description: "Product variant {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  help:
    summary: Governed product-family variation for configuration-specific commercial and operational use.
    businessMeaning: Product defines the family/item concept; ProductVariant identifies a specific option combination such as size, color, grade or pack configuration.
    usage: PIM, catalog, e-commerce, sales, procurement, inventory and manufacturing.
    relationshipContext: Variant inherits/shared semantics from Product while allowing configuration-specific identity and SKU.
    lifecycle: Draft → active → blocked/discontinued → retired.
    changePropagation: Status/configuration changes revalidate open variant-specific demand and supply while preserving historical transactions.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCT-VARIANT}
