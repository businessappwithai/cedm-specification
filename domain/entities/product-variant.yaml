entity:
  name: ProductVariant
  namespace: cedm.domain
  kind: product_master_entity
  description: A sellable, purchasable, manufacturable, or stockable variation of a parent Product distinguished by governed option or attribute values while retaining the parent product family identity.
  ui:
    icon: package
  identity: {key: productVariantId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: productVariantId, type: uuid, required: true, immutable: true, help: {summary: The identity of the variant., usage: Generated on creation; stock and order lines refer to it., businessMeaning: Identifies one governed product configuration independently of its SKU., relationshipContext: Belongs to exactly one parent Product.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: The code of the variant., usage: Unique; assigned by product management., businessMeaning: Human/integration identifier for the configuration., relationshipContext: Distinct from parent Product code.}}
    - {name: sku, type: string, required: false, maxLength: 100, help: {summary: The stock-keeping unit of the variant., usage: Printed on labels and scanned in the warehouse., businessMeaning: Operational inventory/commercial identifier where variants are stocked separately., relationshipContext: Does not replace immutable variant identity.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED, RETIRED]
      help:
        summary: Whether the variant can be traded.
        usage: Set by product management; only ACTIVE variants can be ordered.
        valueSemantics:
          DRAFT: Being set up.
          ACTIVE: Available for trading.
          BLOCKED: Temporarily barred from trading.
          DISCONTINUED: Being phased out. A final state.
          RETIRED: Removed from the catalogue. A final state.
        businessMeaning: Controls future eligibility of this configuration.
        relationshipContext: Parent Product restrictions also apply.
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, inverse: variants, help: {summary: The parent product., usage: Set on creation., cardinalityMeaning: 'Exactly one product: a variant is a variation of a single product family.', workflowRole: "Passes the family's definition, category and rules down to the variant.", businessMeaning: Supplies shared identity and semantics.}}
    - {name: brand, target: Brand, cardinality: 0..1, ownership: reference, help: {summary: "The brand of the variant, when it differs from the product's.", usage: Set where a variant is sold under a different brand., cardinalityMeaning: At most one brand., workflowRole: Allows variant-level branding., businessMeaning: Provides market identity.}}
  invariants:
    - {id: PRODUCT-VARIANT-001, rule: code must be unique and variant must reference exactly one Product.}
    - {id: PRODUCT-VARIANT-002, rule: ACTIVE variant cannot override a parent Product restriction that prohibits new use.}
    - {id: PRODUCT-VARIANT-003, rule: Variant attribute configuration must be unique within its parent product family under the applicable option model.}
    - {id: PRODUCT-VARIANT-004, rule: Variant master changes must not rewrite historical transaction evidence.}
  lifecycle:
    title: Product Variant Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, BLOCKED, DISCONTINUED, RETIRED]
    initial: DRAFT
    terminal: [DISCONTINUED, RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: BLOCKED, action: block}
      - {from: BLOCKED, to: ACTIVE, action: unblock}
      - {from: DRAFT, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
      - {from: BLOCKED, to: DISCONTINUED, action: discontinue}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: BLOCKED, to: RETIRED, action: retire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a product variant is stopped"
      description: "When a product variant is blocked, a high-priority task asks someone to resolve it."
      when: "status == \"BLOCKED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRODUCT-VARIANT-EXCEPTION-{{id}}"
              name: "Resolve product variant {{code}}"
              description: "Product variant {{code}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: A variation of a product, such as a size or colour, that can be bought, sold, made or stocked on its own while belonging to its parent product family.
    businessMeaning: Shoppers choose a size and colour, and warehouses stock them separately, but they are still one product. A variant holds that distinction without duplicating the parent's description, category and rules.
    usage: Created by product management for each combination of options; chosen on orders and stock; read by merchandisers and the warehouse.
    relationshipContext: A variant belongs to one Product and may carry its own Brand.
    lifecycle: A variant is drafted, becomes active, can be blocked, and ends discontinued or retired. Parent product rules still apply.
    example: The "Blue, size M" variant of a cotton t-shirt, with its own SKU.
    changePropagation: Status/configuration changes revalidate open variant-specific demand and supply while preserving historical transactions.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCT-VARIANT}
