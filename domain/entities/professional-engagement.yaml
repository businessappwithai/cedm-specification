entity:
  name: ProfessionalEngagement
  namespace: cedm.domain
  kind: professional_services_entity
  description: A client engagement under which professional services are planned, delivered, measured, and billed.
  ui:
    icon: table
    recordLabel: [engagementNumber, name]
  identity:
    key: engagementId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: engagementId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the professional engagement record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a professional engagement store this identifier. The number or code people quote is a separate field.
  - name: engagementNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the engagement.
      usage: Booked on timesheets and invoices.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What the engagement delivers, for whom.
      usage: Shown in staffing and billing lists.
      relationshipContext: Names the client and the work.
  - name: status
    type: enum
    required: true
    default: PROPOSED
    values:
    - PROPOSED
    - ACTIVE
    - ON_HOLD
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the engagement stands.
      usage: Changed by the engagement manager.
      relationshipContext: Time is booked only to active engagements.
      valueSemantics:
        PROPOSED: Offered; not yet accepted.
        ACTIVE: Work in progress.
        ON_HOLD: Paused.
        COMPLETED: Delivered.
        CANCELLED: Called off.
  - name: startDate
    type: date
    required: false
    help:
      summary: The day work starts.
      usage: Staffing is planned from it.
      relationshipContext: Not after the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The day work is planned to end.
      usage: Used for staffing and forecasts.
      relationshipContext: Not before the start date.
  relationships:
  - name: client
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The client the work is for.
      usage: Set when proposing.
      cardinalityMeaning: Each engagement has one client.
      context: Invoices go to the client.
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: The contract the engagement is performed under.
      usage: Linked once signed.
      cardinalityMeaning: At most one contract.
      context: Its rates and terms apply.
  - name: project
    target: Project
    cardinality: 0..1
    ownership: reference
    help:
      summary: The project used to plan the engagement's work.
      usage: Linked when work is planned as a project.
      cardinalityMeaning: At most one project.
      context: Tasks and milestones live there.
  - name: timesheets
    target: Timesheet
    cardinality: 0..*
    ownership: reference
    help:
      summary: Time booked to the engagement.
      usage: Billed and used for profitability.
      cardinalityMeaning: Any number of timesheets.
      context: Booked by the staff working on it.
  invariants:
  - id: ENGAGEMENT-001
    rule: endDate must not precede startDate.
  lifecycle:
    title: Professional Engagement Lifecycle
    attribute: status
    states: [PROPOSED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED]
    initial: PROPOSED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PROPOSED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: ACTIVE, to: ON_HOLD, action: hold}
    - {from: ON_HOLD, to: ACTIVE, action: resume}
    - {from: PROPOSED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: ON_HOLD, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a professional engagement is put forward"
    description: "When a professional engagement is proposed, a task asks someone to decide on it."
    when: "status == \"PROPOSED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROFESSIONAL-ENGAGEMENT-APPROVAL-{{id}}"
          name: "Decide on professional engagement {{name}}"
          description: "Professional engagement {{name}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: ExceptionRaised
    title: "Raise a task when a professional engagement is stopped"
    description: "When a professional engagement is on hold, a high-priority task asks someone to resolve it."
    when: "status == \"ON_HOLD\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROFESSIONAL-ENGAGEMENT-EXCEPTION-{{id}}"
          name: "Resolve professional engagement {{name}}"
          description: "Professional engagement {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a professional engagement is ended"
    description: "When a professional engagement is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROFESSIONAL-ENGAGEMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on professional engagement {{name}}"
          description: "Professional engagement {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a professional services entity called ProfessionalEngagement within the CEDM business model.
    businessMeaning: ProfessionalEngagement is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Contract, Project, Timesheet. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Partners and engagement managers set up each client engagement, staff it, track time against it, and bill it under the contract; finance reports profitability per engagement.
    lifecycle: An engagement is proposed, active while work is done, may be put on hold and resumed, and is completed when the work is delivered; a proposal or engagement can be cancelled.
    example: Engagement ENG-24-118 'ERP selection for Novara Foods', client Novara Foods SpA, 1 March–30 June 2024, time and materials, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROFESSIONAL-ENGAGEMENT
