entity:
  name: ProfessionalEngagement
  namespace: cedm.domain
  kind: professional_services_entity
  description: A client engagement under which professional services are planned, delivered, measured, and billed.
  ui:
    icon: table
  identity:
    key: engagementId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: engagementId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the engagement, constant for its life.
        usage: Generated on creation; timesheets and invoices refer to it.
    - name: engagementNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number the business uses for the engagement, such as ENG-2026-014.
        usage: Unique; quoted in correspondence and invoices.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A short name for the engagement as people recognise it.
        usage: Shown in lists and picks; usually names the client and scope.
    - name: status
      type: enum
      required: true
      default: PROPOSED
      values:
        - PROPOSED
        - ACTIVE
        - ON_HOLD
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the engagement stands.
        usage: Starts as PROPOSED; changed by the engagement manager as the work progresses.
        valueSemantics:
          PROPOSED: Offered to the client but not yet agreed.
          ACTIVE: Agreed and in delivery; time may be booked.
          ON_HOLD: Paused; no new time is expected until resumed.
          COMPLETED: All work is delivered. A final state.
          CANCELLED: Stopped before completion. A final state.
    - name: startDate
      type: date
      required: false
      help:
        summary: The date work on the engagement starts.
        usage: Set when the engagement is agreed; planning and billing periods begin from it.
    - name: endDate
      type: date
      required: false
      help:
        summary: The date work on the engagement is due to end.
        usage: Must not be before the start date; updated if the scope changes.
  relationships:
    - name: client
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The party the services are delivered to and billed.
        usage: Chosen when the engagement is created.
        cardinalityMeaning: Exactly one client.
        context: Decides who is invoiced.
    - name: contract
      target: Contract
      cardinality: 0..1
      ownership: reference
      help:
        summary: The contract that governs the terms of the engagement.
        usage: Chosen once a contract exists.
        cardinalityMeaning: At most one contract; empty while still a proposal.
        context: Supplies rates and terms for billing.
    - name: project
      target: Project
      cardinality: 0..1
      ownership: reference
      help:
        summary: The project used to plan and track the delivery work.
        usage: Chosen when delivery is organised as a project.
        cardinalityMeaning: At most one project; empty if no project is set up.
        context: Connects commercial terms to the work plan.
    - name: timesheets
      target: Timesheet
      cardinality: 0..*
      ownership: reference
      help:
        summary: The timesheets booked against this engagement.
        usage: Read to total the hours worked and billed.
        cardinalityMeaning: Any number of timesheets, none at the start.
        context: Time worked is what is measured and billed.
  invariants:
    - id: ENGAGEMENT-001
      rule: endDate must not precede startDate.
  lifecycle:
    title: Professional Engagement Lifecycle
    attribute: status
    states: [PROPOSED, ACTIVE, ON_HOLD, COMPLETED, CANCELLED]
    initial: PROPOSED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PROPOSED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: ACTIVE, to: ON_HOLD, action: hold}
      - {from: ON_HOLD, to: ACTIVE, action: resume}
      - {from: PROPOSED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: ON_HOLD, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a professional engagement is put forward"
      description: "When a professional engagement is proposed, a task asks someone to decide on it."
      when: "status == \"PROPOSED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROFESSIONAL-ENGAGEMENT-APPROVAL-{{id}}"
              name: "Decide on professional engagement {{name}}"
              description: "Professional engagement {{name}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: ExceptionRaised
      title: "Raise a task when a professional engagement is stopped"
      description: "When a professional engagement is on hold, a high-priority task asks someone to resolve it."
      when: "status == \"ON_HOLD\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROFESSIONAL-ENGAGEMENT-EXCEPTION-{{id}}"
              name: "Resolve professional engagement {{name}}"
              description: "Professional engagement {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a professional engagement is ended"
      description: "When a professional engagement is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PROFESSIONAL-ENGAGEMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on professional engagement {{name}}"
              description: "Professional engagement {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A client engagement under which professional services are planned, delivered, measured and billed.
    businessMeaning: An engagement is the commercial frame for a piece of service work. It names the client, the contract that governs it and the project that runs it, and it collects the timesheets that become billable time, so work can be tracked from proposal to completion.
    usage: Created by the account or engagement manager; read by delivery, finance and billing.
    relationshipContext: An engagement is for one client, may rest on a contract and a project, and gathers the timesheets booked against it.
    lifecycle: An engagement is proposed, becomes active when agreed, may be put on hold and resumed, and ends completed or cancelled. Completed and cancelled are final.
    example: Engagement ENG-2026-014 for Northwind is proposed in January, active from February and completed in June.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PROFESSIONAL-ENGAGEMENT
