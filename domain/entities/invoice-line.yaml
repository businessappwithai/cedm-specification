entity:
  name: InvoiceLine
  namespace: cedm.domain
  kind: financial_transaction_line
  description: A billed product, service, quantity, tax, credit, debit, or adjustment line on an Invoice, retaining immutable transaction-time monetary, pricing, tax, unit, and matching evidence needed to reproduce the financial claim.
  identity: {key: invoiceLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: invoiceLineId, type: uuid, required: true, immutable: true}
  - {name: lineNumber, type: integer, required: true, minimum: 1}
  - {name: quantity, type: decimal, required: false, precision: 20, scale: 6}
  - name: unitPrice
    type: Money
    required: false
    help:
      summary: Transaction-time billed price per unit.
      businessMeaning: Captures the price actually used to value the invoice line, not today's master price.
      usage: Supports invoice calculation, audit, price variance, and settlement.
      workflowRole: Provides authoritative historical pricing evidence for the invoice line.
  - {name: grossAmount, type: Money, required: true}
  - {name: discountAmount, type: Money, required: true, default: 0}
  - {name: taxableAmount, type: Money, required: true}
  - {name: taxAmount, type: Money, required: true, default: 0}
  - {name: netAmount, type: Money, required: true}
  - name: pricingEvidence
    type: object
    required: false
    help:
      summary: Snapshot of material pricing inputs used to determine the invoice line amount.
      businessMeaning: Preserves source, effective date, and approved commercial context needed to reproduce pricing even when master data changes.
      usage: Supports audit, dispute resolution, recalculation, and integration.
      workflowRole: Links the invoice result to the effective transaction price without making the posted invoice depend on mutable pricing master data.
  - name: discountEvidence
    type: object
    required: false
    help:
      summary: Snapshot of the discount policy inputs and result used on the invoice line.
      businessMeaning: Preserves the applied discount rule/version, method, base, rate or fixed amount, and resulting discount.
      usage: Supports audit and prevents later DiscountRule changes from altering historical calculations.
      workflowRole: Provides reproducible discount calculation evidence.
  - name: taxEvidence
    type: object
    required: false
    help:
      summary: Snapshot of the tax determination inputs and result used on the invoice line.
      businessMeaning: Preserves tax rule/version, jurisdiction, rate, taxable base, rounding and calculated tax.
      usage: Supports tax audit, compliance, dispute resolution, and historical reproducibility.
      workflowRole: Prevents later TaxRule changes from rewriting posted invoice tax.
  - {name: description, type: string, required: false, maxLength: 1000}
  - name: matchingStatus
    type: enum
    required: true
    default: NOT_APPLICABLE
    values: [NOT_APPLICABLE, UNMATCHED, MATCHED, PARTIALLY_MATCHED, EXCEPTION, WAIVED]
  relationships:
  - name: invoice
    target: Invoice
    cardinality: '1'
    ownership: reference
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
  - name: unitOfMeasure
    target: UnitOfMeasure
    cardinality: 0..1
    ownership: reference
  - name: purchaseOrderLine
    target: PurchaseOrderLine
    cardinality: 0..1
    ownership: reference
  - name: goodsReceiptLines
    target: GoodsReceiptLine
    cardinality: 0..*
    ownership: reference
  - name: discountRule
    target: DiscountRule
    cardinality: 0..1
    ownership: reference
  - name: taxRule
    target: TaxRule
    cardinality: 0..*
    ownership: reference
  invariants:
  - {id: INVOICE-LINE-001, rule: lineNumber must be unique within the invoice.}
  - {id: INVOICE-LINE-002, rule: quantity must be greater than zero when supplied.}
  - {id: INVOICE-LINE-003, rule: All monetary calculation components must use the invoice currency unless an explicitly governed multi-currency calculation exists.}
  - {id: INVOICE-LINE-004, rule: grossAmount, discountAmount, taxableAmount, taxAmount and netAmount must reconcile according to the invoice calculation and rounding policy.}
  - {id: INVOICE-LINE-005, rule: If a DiscountRule is used, discountEvidence must preserve the material rule/version inputs and calculated result required for reproducibility.}
  - {id: INVOICE-LINE-006, rule: If a TaxRule is used, taxEvidence must preserve the material rule/version, jurisdiction, rate, taxable base and calculated result required for reproducibility.}
  - {id: INVOICE-LINE-007, rule: Changes to Product, UnitOfMeasure, DiscountRule, TaxRule, Currency or pricing policy must not silently rewrite an issued or posted InvoiceLine.}
  - {id: INVOICE-LINE-008, rule: A purchase invoice line requiring three-way matching may become MATCHED only when applicable PurchaseOrderLine and accepted GoodsReceiptLine evidence satisfy configured quantity and price tolerances.}
  - {id: INVOICE-LINE-009, rule: EXCEPTION or WAIVED matching requires auditable reason and authorization according to policy.}
  - {id: INVOICE-LINE-010, rule: Posted InvoiceLine corrections require controlled credit/debit/adjustment workflows rather than destructive mutation of historical financial evidence.}
  help:
    summary: Represents one financial claim line with reproducible price, discount, tax, quantity and procurement-matching evidence.
    businessMeaning: InvoiceLine is the historical financial result. Current Product, DiscountRule, TaxRule, UOM and pricing master data are inputs to future calculations, not live dependencies of a posted line.
    usage: Billing, accounts payable, accounts receivable, procurement matching, tax, accounting, audit and settlement.
    relationshipContext: Invoice provides financial claim context; Product/UOM identify and measure the billed item; DiscountRule and TaxRule explain policy; pricingEvidence, discountEvidence and taxEvidence preserve transaction-time results; PO/receipt relationships support three-way matching.
    workflowContext: Determine transaction price → calculate gross → resolve discount → calculate taxable base → resolve tax → calculate tax → calculate net → snapshot all material evidence → matching/approval → post. Subsequent master-data changes affect future transactions or controlled corrections only.
    lifecycle: Draft → calculated → matched/exception → approved → posted. After posting, historical calculation evidence is immutable and corrections use explicit financial documents or adjustments.
    changePropagation: Changes to Product/UOM/pricing/discount/tax masters require validation of future and open transactions but never silently modify posted InvoiceLines. Changes to procurement commitments or receipts can change matching status through a controlled reconciliation workflow without rewriting the invoice calculation.
    example: An invoice line is priced at USD 125, discounted by a captured 10% rule, taxed using a captured 18% rule, and linked to accepted receipts. If the product price or tax rate later changes, the posted line remains reproducible from its snapshots.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-INVOICE-LINE}
