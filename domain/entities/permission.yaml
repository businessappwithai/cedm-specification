entity:
  name: Permission
  namespace: cedm.domain
  kind: authorization_entity
  description: A fine-grained authorization capability governing an operation on a resource.
  ui:
    icon: key
  identity:
    key: permissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: permissionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent identifier of the permission, which never changes even if its code or description is edited.
        usage: Generated on creation; roles and access checks refer to the permission through this value.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 200
      help:
        summary: The unique code of the permission, such as purchase_order:approve, combining the resource and the operation.
        usage: Defined by security administrators and kept unique; programs and access checks look the permission up by this code.
    - name: resource
      type: string
      required: true
      maxLength: 200
      help:
        summary: The kind of thing the permission governs, such as purchase_order or customer.
        usage: Entered at definition; the check is made against this resource.
    - name: action
      type: enum
      required: true
      values:
        - CREATE
        - READ
        - UPDATE
        - DELETE
        - EXECUTE
        - APPROVE
        - EXPORT
        - ADMINISTER
      help:
        summary: The kind of operation on the resource that this permission allows its holder to perform.
        usage: Chosen when the permission is defined; together with the resource it forms the capability checked at each protected step.
        valueSemantics:
          CREATE: The holder may create new records of the resource.
          READ: The holder may view records of the resource without changing them.
          UPDATE: The holder may change existing records of the resource.
          DELETE: The holder may remove records of the resource.
          EXECUTE: The holder may run an operation or process on the resource, such as starting a job.
          APPROVE: The holder may approve records of the resource that are waiting for a decision.
          EXPORT: The holder may extract records of the resource out of the system, for example to a file.
          ADMINISTER: The holder may configure the resource and manage who else may use it.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Shows whether the permission can currently be granted to roles and is honoured in access checks.
        usage: Set by security administrators; inactive permissions are suspended and retired ones are removed from use.
        valueSemantics:
          ACTIVE: The permission can be added to roles and is honoured whenever access is checked.
          INACTIVE: The permission is suspended and cannot be newly granted, but may be switched back on.
          RETIRED: The permission has been withdrawn permanently and is no longer granted or checked. A final state.
  relationships:
    - name: roles
      target: Role
      cardinality: 0..*
      ownership: reference
      help:
        summary: The roles that include the permission.
        usage: Read to see who can do what.
        cardinalityMeaning: Any number of roles.
        workflowRole: Shows how widely a capability is granted.
  lifecycle:
    title: Permission Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A fine-grained authorisation that allows an operation on a resource.
    businessMeaning: Access control is built from small permissions, such as "approve invoices" or "export customers". Defining each one explicitly lets roles be composed from them and reviewed.
    usage: Defined by security administrators; added to roles; checked at each protected operation.
    relationshipContext: Permissions are granted through Roles.
    lifecycle: A permission is active while in use, can be made inactive, and is retired when no longer needed. Roles that held it keep the history.
    example: The permission to APPROVE the resource "purchase_order", granted to the Purchasing Manager role.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PERMISSION
