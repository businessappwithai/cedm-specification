entity:
  name: Permission
  namespace: cedm.domain
  kind: authorization_entity
  description: A fine-grained authorization capability governing an operation on a resource.
  ui:
    icon: key
    recordLabel: [code]
  identity:
    key: permissionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: permissionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the permission record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a permission store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 200
    help:
      summary: The code of the permission, usually resource and action.
      usage: Referred to by roles and in access checks.
      relationshipContext: Unique.
  - name: resource
    type: string
    required: true
    maxLength: 200
    help:
      summary: The thing the permission controls, such as an entity or a screen.
      usage: Matched against the resource being accessed.
      relationshipContext: Named as the application names it.
  - name: action
    type: enum
    required: true
    values:
    - CREATE
    - READ
    - UPDATE
    - DELETE
    - EXECUTE
    - APPROVE
    - EXPORT
    - ADMINISTER
    help:
      summary: The operation the permission allows.
      usage: Matched against the operation requested.
      relationshipContext: One action per permission.
      valueSemantics:
        CREATE: Add new records.
        READ: View records.
        UPDATE: Change records.
        DELETE: Remove records.
        EXECUTE: Run a process or function.
        APPROVE: Approve records.
        EXPORT: Export data.
        ADMINISTER: Configure the resource.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the permission can be granted.
      usage: Changed by security administrators.
      relationshipContext: Inactive permissions grant nothing.
      valueSemantics:
        ACTIVE: Grants access.
        INACTIVE: Temporarily grants nothing.
        RETIRED: No longer used.
  relationships:
  - name: roles
    target: Role
    cardinality: 0..*
    ownership: reference
    help:
      summary: The roles that hold the permission.
      usage: Managed when roles are defined.
      cardinalityMeaning: Any number of roles; a role holds many permissions.
      context: Users get permissions through their roles.
  lifecycle:
    title: Permission Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents a authorization entity called Permission within the CEDM business model.
    businessMeaning: Permission is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Role. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Security administrators define the operations that can be granted on each resource and group them into roles; the application checks a user's permissions before letting them act.
    lifecycle: A permission is active while it can be granted, inactive when temporarily withdrawn, and retired when the operation no longer exists.
    example: Permission INVOICE.APPROVE, resource Invoice, action approve, granted to the role Finance Manager.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PERMISSION
