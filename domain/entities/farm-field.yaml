entity:
  name: FarmField
  namespace: cedm.domain
  kind: agriculture_entity
  description: A defined agricultural land area managed as a production unit.
  ui:
    icon: table
  identity:
    key: farmFieldId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: farmFieldId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the farm field record associated with this FarmField. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: Its meaning is specific to FarmField; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets crops and field operations be recorded against exactly this piece of land."
  - name: fieldCode
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of field code for the FarmField. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: Its meaning is specific to FarmField; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name or code farm staff use on maps and work orders to say which field to work, such as North-12."
  - name: area
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: Captures the business meaning of area for the FarmField. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: Its meaning is specific to FarmField; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How large the field is, used to calculate seed, fertiliser and spray rates and to compare yields per area."
  - name: areaUnit
    type: reference
    target: UnitOfMeasure
    required: false
    help:
      summary: Identifies the related UnitOfMeasure associated with this FarmField. It provides the link needed to navigate
        from this record to the related business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: This field connects FarmField to UnitOfMeasure. The reference establishes business context between
        the two entities and lets processes navigate from this record to the related UnitOfMeasure.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Says whether the area is in hectares, acres or another unit, so quantities per area are calculated correctly."
  - name: soilType
    type: string
    required: false
    maxLength: 100
    help:
      summary: Captures the business meaning of soil type for the FarmField. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: Its meaning is specific to FarmField; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Describes the soil, such as clay loam or sandy, which guides crop choice, irrigation and fertiliser planning."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - FALLOW
    - INACTIVE
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating FarmField records, where applicable.
      relationshipContext: Its meaning is specific to FarmField; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of FarmField.
        FALLOW: Represents the fallow state or classification in the context of FarmField.
        INACTIVE: Represents the inactive state or classification in the context of FarmField.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the field is being cropped (active), deliberately rested (fallow) or out of production (inactive)."
  relationships:
  - name: farm
    target: Farm
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects FarmField to Farm so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Farm records associated with a FarmField.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: crops
    target: Crop
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects FarmField to Crop so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Crop records associated with a FarmField.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Farm Field Lifecycle
    attribute: status
    states: [ACTIVE, FALLOW, INACTIVE]
    initial: ACTIVE
    transitions:
      - {from: ACTIVE, to: FALLOW, action: mark_fallow}
      - {from: FALLOW, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: FALLOW, action: reactivate}
  help:
    summary: "A specific piece of farmland managed as one production unit, with its size and soil type, kept so crops, inputs and yields can be planned and recorded field by field."
    businessMeaning: FarmField is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate FarmField records.
    relationshipContext: The entity participates in a wider business graph through relationships with Farm, Crop. These relationships
      provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical FarmField record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "A field is set up under its farm as active, has crops planned, planted and harvested on it season by season, may be left fallow to rest the soil, and is made inactive when it is no longer farmed, from which it can return to fallow."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM-FIELD
