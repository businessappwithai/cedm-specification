entity:
  name: FarmField
  namespace: cedm.domain
  kind: agriculture_entity
  description: A defined agricultural land area managed as a production unit.
  ui:
    icon: table
    recordLabel: [fieldCode]
  identity:
    key: farmFieldId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: farmFieldId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the farm field record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a farm field store this identifier. The number or code people quote is a separate field.
  - name: fieldCode
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the field within its farm.
      usage: Used on planting and harvest records.
      relationshipContext: Unique within the farm.
  - name: area
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: The area of the field.
      usage: Used for input rates and yield per hectare.
      relationshipContext: In the area unit given.
  - name: areaUnit
    type: reference
    target: UnitOfMeasure
    required: false
    help:
      summary: The unit of the area, usually hectares.
      usage: Set when the field is defined.
      relationshipContext: Converted for reports.
  - name: soilType
    type: string
    required: false
    maxLength: 100
    help:
      summary: The soil of the field, such as loamy clay.
      usage: Guides crop choice and fertilisation.
      relationshipContext: From a soil survey where available.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - FALLOW
    - INACTIVE
    help:
      summary: Whether the field is being cropped.
      usage: Changed each season.
      relationshipContext: Fallow fields are rested deliberately.
      valueSemantics:
        ACTIVE: Cropped this season.
        FALLOW: Rested this season.
        INACTIVE: Taken out of farming.
  relationships:
  - name: farm
    target: Farm
    cardinality: '1'
    ownership: reference
    help:
      summary: The farm the field belongs to.
      usage: Set when the field is defined.
      cardinalityMeaning: Every field belongs to exactly one farm.
      context: Listed under the farm.
  - name: crops
    target: Crop
    cardinality: 0..*
    ownership: reference
    help:
      summary: Crops grown on the field over time.
      usage: Recorded each season.
      cardinalityMeaning: A field carries many crops over the years; a crop is grown on many fields.
      context: A many-to-many relation.
  lifecycle:
    title: Farm Field Lifecycle
    attribute: status
    states: [ACTIVE, FALLOW, INACTIVE]
    initial: ACTIVE
    terminal: [INACTIVE]
    transitions:
    - {from: ACTIVE, to: FALLOW, action: rest}
    - {from: FALLOW, to: ACTIVE, action: cultivate}
    - {from: ACTIVE, to: INACTIVE, action: retire}
    - {from: FALLOW, to: INACTIVE, action: retire}
  help:
    summary: One field of a farm, farmed as a unit.
    relationshipContext: The entity participates in a wider business graph through relationships with Farm, Crop. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: Fields are where crops are planted, inputs applied and yields measured. Recording each field with its area, soil and status lets the farm plan rotations, comply with input regulations and compare yields.
    usage: Defined when a farm is set up; planting, spraying and harvest records name the field; rotations are planned per field.
    lifecycle: Active while cropped; fallow while rested; inactive when taken out of farming. A fallow field returns to cultivation.
    example: Field F-07 of Ferme des Saules, 12.4 ha, loamy clay, winter wheat 2024, previous crop rapeseed.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FARM-FIELD
