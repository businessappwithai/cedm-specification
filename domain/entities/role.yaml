entity:
  name: Role
  namespace: cedm.domain
  kind: authorization_entity
  description: A named set of permissions or responsibilities assignable to users or service principals.
  ui:
    icon: shield
    recordLabel: [code, name]
  identity:
    key: roleId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: roleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the role record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a role store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the role.
      usage: Used in access reviews and integrations.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name of the role.
      usage: Shown when granting roles.
      relationshipContext: Names a job or responsibility.
  - name: description
    type: string
    required: false
    maxLength: 2000
    help:
      summary: What the role is for and who should hold it.
      usage: Read by those granting and reviewing roles.
      relationshipContext: Plain language.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the role can be granted.
      usage: Changed by security administrators.
      relationshipContext: Inactive roles grant nothing.
      valueSemantics:
        DRAFT: Being defined.
        ACTIVE: In use.
        INACTIVE: Temporarily grants nothing.
        RETIRED: No longer used.
  relationships:
  - name: permissions
    target: Permission
    cardinality: 0..*
    ownership: reference
    help:
      summary: The permissions the role grants.
      usage: Chosen when defining the role.
      cardinalityMeaning: Any number; a permission may be in many roles.
      context: Holders get all of them.
  - name: users
    target: User
    cardinality: 0..*
    ownership: reference
    help:
      summary: The users holding the role.
      usage: Granted by administrators.
      cardinalityMeaning: Any number; a user may hold many roles.
      context: Reviewed periodically.
  lifecycle:
    title: Role Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A named bundle of permissions granted to users, such as 'Finance manager'.
    relationshipContext: The entity participates in a wider business graph through relationships with Permission, User. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Security administrators define roles that bundle permissions for a job, grant them to users, and review who holds which role; the application decides what a user may do from their roles.
    lifecycle: A role is drafted, active while it can be granted, may be made inactive and reactivated, and is retired when no longer used.
    example: "Role FIN_MGR 'Finance manager': approve invoices, approve payments, read the ledger; held by 4 users."
    businessMeaning: Roles make access manageable and reviewable; users get exactly the permissions their job needs.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ROLE
