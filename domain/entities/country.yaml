entity:
  name: Country
  namespace: cedm.domain
  kind: reference_data
  description: "A country or territory from the ISO 3166-1 registry, used consistently for addresses, tax, trade, localization, compliance and reporting."
  ui:
    icon: globe
  referenceData: reference-data/country.yaml
  identity: {key: countryId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: countryId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the country record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a country store this identifier. The number or code people quote is a separate field.
  - {name: code, type: string, required: true, unique: true, maxLength: 2, help: {summary: "The two-letter ISO 3166-1 code, such as US or DE.", usage: "Search, integration and reporting; stored on nothing else, because records point at the country itself.", relationshipContext: "Unique; a state or province and a city belong to a country through it."}}
  - {name: alpha3, type: string, maxLength: 3, required: false, help: {summary: "The three-letter ISO 3166-1 code, such as USA or DEU.", usage: "Trade and customs documents, which use the long form.", relationshipContext: "Unique among countries."}}
  - {name: numericCode, type: string, maxLength: 3, required: false, help: {summary: "The three-digit ISO 3166-1 numeric code, such as 840.", usage: "Banking and statistical exchange formats.", relationshipContext: "Unique among countries."}}
  - {name: name, type: string, required: true, maxLength: 300, help: {summary: "The country's short name in English.", usage: "Shown in lists, on addresses and on reports.", relationshipContext: "Does not replace the code as the stable key."}}
  - {name: phoneCode, type: string, maxLength: 20, required: false, help: {summary: "The international dialling prefix, without the plus sign.", usage: "Validating and formatting telephone numbers.", relationshipContext: "Belongs to the country; several countries can share a prefix."}}
  relationships:
  - {name: currency, target: Currency, cardinality: "0..1", ownership: reference, help: {summary: "The currency the country mainly uses.", usage: "Chosen from the currency list; used to suggest a currency on records for the country.", cardinalityMeaning: "A country has at most one main currency; a currency can be the main one of many countries.", context: "Lets a default currency follow the country chosen on an address."}}
  - {name: states, target: StateProvince, cardinality: "0..*", ownership: reference, help: {summary: "The states, provinces and equivalent divisions of the country.", usage: "Read when a state is chosen: only the divisions of the country selected are offered.", cardinalityMeaning: "A country has any number of states or provinces, and some have none.", context: "The first level of the geography below a country."}}
  - {name: cities, target: City, cardinality: "0..*", ownership: reference, help: {summary: "The cities of the country the list knows.", usage: "Read when a city is chosen on an address.", cardinalityMeaning: "A country has any number of cities.", context: "Cities belong to a country, and to a state or province where the registry says which."}}
  invariants:
  - {id: COUNTRY-001, rule: Code and identity semantics must remain stable within the governing context and historical references must not be silently repointed.}
  help:
    summary: "A country or territory from the ISO 3166-1 registry, used consistently for addresses, tax, trade, localization, compliance and reporting."
    howItRelates: "Referenced by addresses, parties, products and documents; related entities narrow each other (a city belongs to a state or province, which belongs to a country)."
    commonExamples: "A shipping address in a named city, state and country."
    businessMeaning: Countries decide which laws, taxes, currencies and formats apply. A shared ISO 3166 list makes every address, party, tax rule and report name a country the same way.
    usage: The list comes from the ISO standard and is not edited by users; records choose their country from it.
    lifecycle: Reference data. A country is retired only when the standard withdraws it; records that name it keep it.
    workflowContext: Address capture, party onboarding, tax and trade determination, sanctions screening, reporting by country.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-COUNTRY}
