entity:
  name: TaxRate
  namespace: cedm.domain
  kind: tax_reference
  description: The rate of a tax code in a jurisdiction for a period — a percentage, or a fixed amount per unit — with the dates it is valid between.
  ui:
    icon: percent
    recordLabel: [taxCodeLabel, ratePercent]
  identity: {key: taxRateId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: taxRateId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the tax rate record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a tax rate store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: SCHEDULED
    values: [SCHEDULED, ACTIVE, EXPIRED]
    help:
      summary: Whether the rate is in force.
      usage: Moved on by its dates.
      relationshipContext: Determination uses the rate valid on the tax date, whatever today's status.
      valueSemantics:
        SCHEDULED: Will apply from a future date.
        ACTIVE: In force.
        EXPIRED: Replaced; kept for past transactions.
  - name: taxCodeLabel
    type: string
    required: false
    maxLength: 60
    help:
      summary: The code and jurisdiction the rate is for, as shown on screens.
      usage: Filled from the tax code for display in rate lists.
      relationshipContext: The tax code relationship is authoritative.
  - name: rateType
    type: enum
    required: true
    default: PERCENT
    values: [PERCENT, PER_UNIT]
    help:
      summary: Whether the tax is a percentage or an amount per unit.
      usage: Decides how the tax is computed.
      relationshipContext: Excise duties are often per unit.
      valueSemantics:
        PERCENT: A percentage of the taxable amount.
        PER_UNIT: A fixed amount per unit of quantity.
  - name: ratePercent
    type: decimal
    required: false
    precision: 9
    scale: 5
    help:
      summary: The rate as a percentage, such as 20.
      usage: Applied to the taxable amount.
      relationshipContext: Used when the rate type is percent.
  - name: amountPerUnit
    type: Money
    required: false
    help:
      summary: The tax per unit of quantity.
      usage: Applied to the line's quantity.
      relationshipContext: Used when the rate type is per unit.
  - name: validFrom
    type: date
    required: true
    help:
      summary: The first day the rate applies.
      usage: Set from the law.
      relationshipContext: Not later than the valid-to date.
  - name: validTo
    type: date
    required: false
    help:
      summary: The last day the rate applies.
      usage: Set when a new rate replaces it.
      relationshipContext: Rates of one code and jurisdiction do not overlap.
  relationships:
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company the rate is maintained for, when rates differ by company.
      usage: Usually empty; rates are set by law.
      cardinalityMeaning: At most one.
      context: Special rates under a company ruling name the company.
  - name: taxCode
    target: TaxCode
    cardinality: '1'
    ownership: reference
    help:
      summary: The tax code the rate belongs to.
      usage: Chosen when adding the rate.
      cardinalityMeaning: Every rate belongs to exactly one code.
      context: A code has one rate per period and jurisdiction.
  - name: jurisdiction
    target: TaxJurisdiction
    cardinality: 0..1
    ownership: reference
    help:
      summary: The jurisdiction the rate applies in.
      usage: Usually the code's jurisdiction.
      cardinalityMeaning: One per rate.
      context: Combined rates are separate rates per jurisdiction.
  invariants:
  - {id: TAX-RATE-001, rule: The rate does not end before it starts., violatedWhen: valid_to != null and valid_from != null and valid_to < valid_from, message: The valid-to date is earlier than the valid-from date.}
  - {id: TAX-RATE-002, rule: A percentage rate states its percentage., violatedWhen: rate_type == "PERCENT" and rate_percent == null, message: Give the rate as a percentage.}
  - {id: TAX-RATE-003, rule: A per-unit rate states the amount per unit., violatedWhen: rate_type == "PER_UNIT" and amount_per_unit == null, message: Give the tax per unit.}
  - {id: TAX-RATE-EXE-001, rule: "Rate Percent is a percentage between 0 and 100.", violatedWhen: "rate_percent != null and (rate_percent < 0 or rate_percent > 100)", message: "Rate Percent must be between 0 and 100."}
  lifecycle:
    title: Tax Rate Lifecycle
    attribute: status
    states: [SCHEDULED, ACTIVE, EXPIRED]
    initial: SCHEDULED
    terminal: [EXPIRED]
    transitions:
    - {from: SCHEDULED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: EXPIRED, action: expire}
  help:
    summary: How much tax a code charges, where, and from when to when.
    businessMeaning: Tax rates change by law on fixed dates. Keeping each rate with its validity dates lets every transaction be taxed at the rate in force on its tax point, including invoices issued after a change for supplies made before it, and keeps a history auditors can check.
    usage: The tax team adds a new rate when the law changes, ending the old one the day before. Tax determination picks the rate of the line's tax code and jurisdiction valid on the tax date.
    relationshipContext: A rate belongs to one TaxCode in one TaxJurisdiction. TaxTransactions record the rate applied.
    lifecycle: Scheduled before its start date, active while valid, and expired after its end date.
    workflowContext: Tax determination, rate-change implementation, tax audit.
    example: 'Rate of FR-VAT-S in France: 20.000% from 4 January 2014, no end date; earlier rate 19.6% from 1 April 2000 to 3 January 2014.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TAX-RATE}
