entity:
  name: GovernmentCase
  namespace: cedm.domain
  kind: public_sector_entity
  description: A government case representing an application, request, investigation, benefit, permit, or public-service matter.
  ui:
    icon: briefcase
    recordLabel: [caseNumber, caseType]
  identity:
    key: governmentCaseId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: governmentCaseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the government case record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a government case store this identifier. The number or code people quote is a separate field.
  - name: caseNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number the agency gives the case.
      usage: Quoted in correspondence with the applicant.
      relationshipContext: Unique.
  - name: caseType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of matter, such as a permit, benefit claim or inspection.
      usage: Decides which procedure and deadlines apply.
      relationshipContext: Taken from the agency's list of services.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, OPEN, UNDER_REVIEW, APPROVED, DENIED, CLOSED, CANCELLED]
    help:
      summary: Where the case stands in its procedure.
      usage: Moved on by caseworkers.
      relationshipContext: Decided cases are approved or denied.
      valueSemantics:
        DRAFT: Being prepared; not submitted.
        OPEN: Submitted and registered.
        UNDER_REVIEW: Being examined by a caseworker.
        APPROVED: Decided in the applicant's favour.
        DENIED: Refused.
        CLOSED: Approved and completed.
        CANCELLED: Withdrawn before a decision.
  - name: openedAt
    type: datetime
    required: true
    help:
      summary: When the case was opened.
      usage: Starts the statutory processing time.
      relationshipContext: Not after its closure.
  - name: closedAt
    type: datetime
    required: false
    help:
      summary: When the case was closed.
      usage: Recorded on closure; used for processing-time statistics.
      relationshipContext: Present once closed.
  relationships:
  - name: applicant
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person or organisation the case is about or who applied.
      usage: Set when the case is opened.
      cardinalityMeaning: At most one applicant per case; a party may have many cases.
      context: Correspondence is addressed to the applicant.
  - name: agency
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The agency handling the case.
      usage: Set when the case is opened.
      context: The agency's procedures and deadlines apply.
      cardinalityMeaning: Each case is handled by one agency; an agency handles many cases.
  - name: tasks
    target: Task
    cardinality: 0..*
    ownership: reference
    help:
      summary: Work items to process the case.
      usage: Created as the case moves through its procedure.
      cardinalityMeaning: Any number of tasks.
      context: Assigned to caseworkers.
    inverseCardinality: '1'
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Documents filed with or produced for the case.
      usage: Attached by applicants and caseworkers.
      cardinalityMeaning: Any number of documents.
      context: Form the case file.
    inverseCardinality: 0..*
  invariants:
  - id: GOV-CASE-001
    rule: closedAt must not precede openedAt.
  - {id: GOVERNMENT-CASE-EXE-001, rule: "A government case that is closed states when (closed at).", violatedWhen: "status == \"CLOSED\" and closed_at == null", message: "Record closed at when the government case is closed."}
  lifecycle:
    title: Government Case Lifecycle
    attribute: status
    states: [DRAFT, OPEN, UNDER_REVIEW, APPROVED, DENIED, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [DENIED, CLOSED, CANCELLED]
    transitions:
    - {from: DRAFT, to: OPEN, action: submit}
    - {from: OPEN, to: UNDER_REVIEW, action: review}
    - {from: UNDER_REVIEW, to: APPROVED, action: approve}
    - {from: UNDER_REVIEW, to: DENIED, action: deny}
    - {from: APPROVED, to: CLOSED, action: close}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: OPEN, to: CANCELLED, action: cancel}
    - {from: UNDER_REVIEW, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a government case is put forward"
    description: "When a government case is under review, a task asks someone to decide on it."
    when: "status == \"UNDER_REVIEW\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "GOVERNMENT-CASE-APPROVAL-{{id}}"
          name: "Decide on government case {{case_number}}"
          description: "Government case {{case_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a government case is ended"
    description: "When a government case is cancelled or denied, a task asks someone to settle what depended on it."
    when: "(status == \"CANCELLED\" or status == \"DENIED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "GOVERNMENT-CASE-FOLLOW-UP-{{id}}"
          name: "Follow up on government case {{case_number}}"
          description: "Government case {{case_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A matter a public agency handles for a citizen or business, such as a permit application or benefit claim.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Task, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Caseworkers open a case for each application, request or investigation, attach its documents, assign tasks, and record the decision; supervisors monitor caseloads and processing times.
    lifecycle: A case is drafted, opened when submitted, put under review, and then approved or denied; an approved case is closed when the service is delivered; a case not yet decided may be cancelled.
    example: Case BP-2024-00317, building permit application by Jane Doe at the Planning Department, opened 3 April 2024, approved 21 May 2024, closed 30 May 2024.
    businessMeaning: Cases are how public services are delivered and measured; deadlines, decisions and appeals are tracked per case.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-GOVERNMENT-CASE
