entity:
  name: AIModel
  namespace: cedm.domain
  kind: ai_entity
  description: A machine-learning or artificial-intelligence model used to produce predictions, classifications, recommendations, generations, or decisions.
  ui:
    icon: brain
    recordLabel: [code, modelVersion]
  identity:
    key: aiModelId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aiModelId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the ai model record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a ai model store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the model, the same across its versions, such as CS.
      usage: Used in the model inventory, in predictions and in monitoring.
      relationshipContext: Unique together with the version.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the model, such as "Consumer credit scoring".
      usage: Shown in the model inventory.
      relationshipContext: Identifies the model for people.
  - name: modelType
    type: enum
    required: true
    values:
    - CLASSIFICATION
    - REGRESSION
    - FORECASTING
    - RECOMMENDATION
    - GENERATION
    - EMBEDDING
    - ANOMALY_DETECTION
    - OTHER
    help:
      summary: What kind of output the model produces.
      usage: Decides which evaluation metrics apply.
      relationshipContext: Read with the purpose.
      valueSemantics:
        CLASSIFICATION: Assigns inputs to categories, such as approve or decline.
        REGRESSION: Predicts a number, such as a price.
        FORECASTING: Predicts future values of a series, such as demand.
        RECOMMENDATION: Suggests items, such as products to offer.
        GENERATION: Produces text, images or other content.
        EMBEDDING: Turns inputs into vectors for search or similarity.
        ANOMALY_DETECTION: Flags unusual inputs, such as possible fraud.
        OTHER: Any other kind of model.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - TRAINING
    - VALIDATION
    - APPROVED
    - DEPLOYED
    - SUSPENDED
    - RETIRED
    help:
      summary: Where the model is in its life.
      usage: Moved on by the data-science team and the governance board.
      relationshipContext: Only deployed models may serve predictions.
      valueSemantics:
        DRAFT: Being designed.
        TRAINING: Being trained.
        VALIDATION: Being evaluated against its acceptance criteria.
        APPROVED: Approved for deployment by governance.
        DEPLOYED: Serving predictions.
        SUSPENDED: Stopped because of a problem; predictions are not used.
        RETIRED: Replaced or no longer needed.
  - name: purpose
    type: string
    required: false
    maxLength: 4000
    help:
      summary: What the model is used for, in business terms.
      usage: Written when the model is registered; read by reviewers.
      relationshipContext: Decides the risk level and the applicable policy.
  - name: riskLevel
    type: enum
    required: false
    values:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
    help:
      summary: How much harm a wrong or unfair output could do.
      usage: Decides the depth of evaluation and oversight.
      relationshipContext: High and critical models need human oversight.
      valueSemantics:
        LOW: Little harm possible, such as internal search ranking.
        MEDIUM: Some harm possible, such as marketing recommendations.
        HIGH: Significant harm possible, such as credit or hiring decisions.
        CRITICAL: Severe harm possible, such as safety-related decisions.
  - name: modelVersion
    type: string
    required: true
    maxLength: 30
    help:
      summary: The version of the model, such as 4.2.
      usage: Increased with each retraining or change; predictions record the version that made them.
      relationshipContext: Each version is evaluated and approved separately.
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization accountable for the model.
      usage: Set when the model is registered.
      cardinalityMeaning: At most one.
      context: Usually the business unit using it.
  - name: evaluations
    target: AIEvaluation
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The tests the model has been put through.
      usage: Recorded by the data-science team.
      cardinalityMeaning: Any number of evaluations; each tests one model.
      context: Deployment requires a passed evaluation.
  - name: predictions
    target: AIPrediction
    cardinality: 0..*
    ownership: reference
    help:
      summary: The outputs the model has produced.
      usage: Recorded by the serving platform.
      cardinalityMeaning: Any number; each prediction is made by one model.
      context: The prediction records its model.
  - name: policy
    target: AIPolicy
    cardinality: 0..1
    ownership: reference
    help:
      summary: The AI policy that governs the model.
      usage: Assigned when the model is registered, from its risk level.
      cardinalityMeaning: At most one.
      context: Its requirements decide what evidence approval needs.
  invariants:
  - id: AI-MODEL-001
    rule: a DEPLOYED model must have an APPROVED lifecycle state transition and a valid evaluation record.
  lifecycle:
    title: AI Model Lifecycle
    attribute: status
    states: [DRAFT, TRAINING, VALIDATION, APPROVED, DEPLOYED, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: TRAINING, action: mark_training}
    - {from: TRAINING, to: VALIDATION, action: mark_validation}
    - {from: VALIDATION, to: APPROVED, action: approve}
    - {from: APPROVED, to: DEPLOYED, action: mark_deployed}
    - {from: TRAINING, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: TRAINING, action: resume}
    - {from: VALIDATION, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: VALIDATION, action: resume}
    - {from: APPROVED, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: APPROVED, action: resume}
    - {from: DEPLOYED, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: DEPLOYED, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: TRAINING, to: RETIRED, action: retire}
    - {from: VALIDATION, to: RETIRED, action: retire}
    - {from: APPROVED, to: RETIRED, action: retire}
    - {from: DEPLOYED, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A trained model the organisation uses to predict, classify, recommend or generate, registered with its purpose, version and owner.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, AIEvaluation, AIPrediction, AIPolicy. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Data-science teams register each model when development starts, record its evaluations, have it approved under the applicable AI policy and deploy it; operations watches its predictions; risk and compliance review the inventory of models by risk level.
    lifecycle: Draft while designed, in training, in validation while evaluated, approved by the governance board, deployed for use, suspended if it misbehaves, and retired when replaced. A model reaches deployment only through approval.
    example: Model CS-v4 'Consumer credit scoring', classification, version 4.2, risk high, governed by policy AIP-02, approved 14 May 2024, deployed 20 May.
    businessMeaning: Models make or shape business decisions, so the organisation must know which model produced a result, whether it was approved for that use, and when it must be retrained or withdrawn.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-MODEL
