entity:
  name: AIModel
  namespace: cedm.domain
  kind: ai_entity
  description: A machine-learning or artificial-intelligence model used to produce predictions, classifications, recommendations, generations, or decisions.
  ui:
    icon: brain
  identity:
    key: aiModelId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: aiModelId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the model record.
        usage: Generated on registration; predictions, evaluations and policies hold this identity, so renaming or re-versioning the model does not break them.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique business code of the model, such as CHURN-PRED.
        usage: Chosen on registration and used in pipelines, dashboards and audit queries; it stays the same across versions of the same model.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The descriptive name people use for the model.
        usage: Shown in the register and in reviews; can be reworded without affecting identity.
    - name: modelType
      type: enum
      required: true
      values:
        - CLASSIFICATION
        - REGRESSION
        - FORECASTING
        - RECOMMENDATION
        - GENERATION
        - EMBEDDING
        - ANOMALY_DETECTION
        - OTHER
      help:
        summary: The kind of task the model performs.
        usage: Set at registration and used to choose evaluation criteria and monitoring; an unusual model is recorded as OTHER with a description in its purpose.
        valueSemantics:
          CLASSIFICATION: Assigns an input to one of a set of categories, such as fraud or not fraud.
          REGRESSION: Predicts a continuous number, such as expected claim cost.
          FORECASTING: Predicts a value over future time periods, such as demand next month.
          RECOMMENDATION: Ranks or suggests items for a person or case, such as products to offer.
          GENERATION: Produces new content such as text, images or code.
          EMBEDDING: Turns content into numeric vectors for similarity search and retrieval.
          ANOMALY_DETECTION: Flags unusual cases that deviate from normal patterns, such as suspicious transactions.
          OTHER: Any model task not listed above; describe it in the purpose.
    - name: modelVersion
      type: string
      required: true
      maxLength: 50
      help:
        summary: The version label of this model build, such as 3.2.0.
        usage: Updated whenever the model is retrained or changed in a way that could alter its outputs; predictions record the version that produced them so results stay reproducible.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - TRAINING
        - VALIDATION
        - APPROVED
        - DEPLOYED
        - SUSPENDED
        - RETIRED
      help:
        summary: The model's position in its governance lifecycle.
        usage: Moved forward by the teams responsible at each stage; only APPROVED models may be deployed, and only DEPLOYED models should serve live predictions.
        valueSemantics:
          DRAFT: Registered but not yet in training; scope and purpose are still being defined.
          TRAINING: Being trained or retrained on data.
          VALIDATION: Trained and being evaluated against criteria before any approval decision.
          APPROVED: Cleared by governance for deployment; evaluation evidence is on record.
          DEPLOYED: Live and serving predictions in production.
          SUSPENDED: Temporarily halted, for example after a drift or incident finding, and able to resume at its previous stage.
          RETIRED: Permanently withdrawn; kept for audit of past predictions.
    - name: purpose
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A plain-language statement of what the model is for and what decisions it supports.
        usage: Written at registration and reviewed with every approval; it limits the model to its intended use and is the reference when judging whether a new use needs fresh assessment.
    - name: riskLevel
      type: enum
      required: false
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        summary: The governance risk rating of the model, based on the impact of a wrong or biased output.
        usage: Assessed during validation and drives how strict the policy, review and monitoring requirements are; high-impact uses are rated HIGH or CRITICAL.
        valueSemantics:
          LOW: Errors have minimal impact and are easily corrected; light-touch review applies.
          MEDIUM: Errors cause moderate harm or cost; standard review and monitoring apply.
          HIGH: Errors could materially harm people or the business; enhanced review and human oversight apply.
          CRITICAL: Errors could cause severe or irreversible harm; the strictest controls and executive approval apply.
  relationships:
    - name: owner
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation accountable for the model.
        usage: Set at registration so reviewers and incident responders know whom to contact and who answers for the model's behaviour.
        cardinalityMeaning: At most one owner; a model with no owner recorded is an open governance gap rather than a valid long-term state.
        workflowRole: Anchors accountability; approvals and suspensions are directed to the owner.
    - name: evaluations
      target: AIEvaluation
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The evaluations run against this model.
        usage: Read when deciding approval or deployment and when reviewing the model's history of testing.
        cardinalityMeaning: Any number, one per assessment; a new model has none.
        workflowRole: A DEPLOYED model must have at least one completed evaluation on record.
    - name: predictions
      target: AIPrediction
      cardinality: 0..*
      ownership: reference
      help:
        summary: The predictions this model has produced.
        usage: Used to monitor behaviour, investigate disputed outputs and measure drift; they are produced in volume by runtime systems.
        cardinalityMeaning: Any number, typically a very large number.
        workflowRole: Each prediction records the model version, so outputs can be traced to the exact model that made them.
    - name: policy
      target: AIPolicy
      cardinality: 0..1
      ownership: reference
      help:
        summary: The AI policy that governs how this model may be used.
        usage: Chosen at registration to set approvals, controls and permitted use; changing it triggers review.
        cardinalityMeaning: At most one governing policy; models without one fall back to general organisational rules.
        workflowRole: The policy's controls are checked at approval and deployment.
  invariants:
    - id: AI-MODEL-001
      rule: a DEPLOYED model must have an APPROVED lifecycle state transition and a valid evaluation record.
  lifecycle:
    title: AI Model Lifecycle
    attribute: status
    states: [DRAFT, TRAINING, VALIDATION, APPROVED, DEPLOYED, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: TRAINING, action: mark_training}
      - {from: TRAINING, to: VALIDATION, action: mark_validation}
      - {from: VALIDATION, to: APPROVED, action: approve}
      - {from: APPROVED, to: DEPLOYED, action: mark_deployed}
      - {from: TRAINING, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: TRAINING, action: resume}
      - {from: VALIDATION, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: VALIDATION, action: resume}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: DEPLOYED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: DEPLOYED, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: TRAINING, to: RETIRED, action: retire}
      - {from: VALIDATION, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: DEPLOYED, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A machine-learning or other AI model registered for use, with its type, version, risk level and approval status.
    businessMeaning: The model register is how an organisation knows which automated decision-makers it runs, what each is for, how risky it is and whether it has been approved. Without it, models in production cannot be governed or audited.
    usage: A record is created when a model enters development and updated as it is trained, validated, approved, deployed, suspended and retired; governance, operations and auditors read it.
    relationshipContext: A model is owned by an Organization, governed by an AIPolicy, assessed through AIEvaluations and produces AIPredictions; those links are what make it traceable end to end.
    lifecycle: A model moves from draft through training and validation to approval and deployment. It can be suspended and resumed at any stage after training, and is retired for good at the end of its life. Deployment requires approval and a completed evaluation.
    example: Churn Predictor v3.2 is a classification model owned by the Retail Analytics team; it passed validation, was approved by the AI governance board and is deployed.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-MODEL
