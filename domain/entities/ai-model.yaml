entity:
  name: AIModel
  namespace: cedm.domain
  kind: ai_entity
  description: A machine-learning or artificial-intelligence model used to produce predictions, classifications, recommendations,
    generations, or decisions.
  ui:
    icon: brain
  identity:
    key: aiModelId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aiModelId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the ai model record associated with this AIModel. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one model; every evaluation and prediction it produced points at this value, so a decision made by the model can always be traced back to exactly which model made it."
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The short reference data scientists, risk reviewers and integrations use for the model, such as CHURN-CLS, so it can be named consistently in deployment pipelines, audit findings and reports."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The plain name business owners recognise the model by, such as Customer Churn Classifier, shown in model inventories, approval requests and reports on model performance."
  - name: modelType
    type: enum
    required: true
    values:
    - CLASSIFICATION
    - REGRESSION
    - FORECASTING
    - RECOMMENDATION
    - GENERATION
    - EMBEDDING
    - ANOMALY_DETECTION
    - OTHER
    help:
      summary: Captures the business meaning of model type for the AIModel. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        CLASSIFICATION: Represents the classification state or classification in the context of AIModel.
        REGRESSION: Represents the regression state or classification in the context of AIModel.
        FORECASTING: Represents the forecasting state or classification in the context of AIModel.
        RECOMMENDATION: Represents the recommendation state or classification in the context of AIModel.
        GENERATION: Represents the generation state or classification in the context of AIModel.
        EMBEDDING: Represents the embedding state or classification in the context of AIModel.
        ANOMALY_DETECTION: Represents the anomaly detection state or classification in the context of AIModel.
        OTHER: Represents the other state or classification in the context of AIModel.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "What kind of answer the model gives, such as a classification, a forecast, a recommendation or generated content, which tells reviewers which evaluation measures and controls apply to it."
  - name: version
    type: string
    required: true
    maxLength: 50
    help:
      summary: Captures the business meaning of version for the AIModel. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which release of the model this record describes, such as 2.3.0, so evaluations, approvals and predictions can be tied to the exact trained version rather than to the model in general."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - TRAINING
    - VALIDATION
    - APPROVED
    - DEPLOYED
    - SUSPENDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of AIModel.
        TRAINING: Represents the training state or classification in the context of AIModel.
        VALIDATION: Represents the validation state or classification in the context of AIModel.
        APPROVED: Represents the approved state or classification in the context of AIModel.
        DEPLOYED: Represents the deployed state or classification in the context of AIModel.
        SUSPENDED: Represents the suspended state or classification in the context of AIModel.
        RETIRED: Represents the retired state or classification in the context of AIModel.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Where the model stands in its governed life: DRAFT and TRAINING models are still being built, VALIDATION models are under review, APPROVED models may be deployed, DEPLOYED models are producing results, SUSPENDED models are stopped pending investigation, and RETIRED models are no longer used."
  - name: purpose
    type: string
    required: false
    maxLength: 4000
    help:
      summary: Captures the business meaning of purpose for the AIModel. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The business decision or task the model supports, such as flagging invoices likely to be paid late, which reviewers use to judge whether its use is appropriate and proportionate to its risk."
  - name: riskLevel
    type: enum
    required: false
    values:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
    help:
      summary: Captures the business meaning of risk level for the AIModel. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating AIModel records, where applicable.
      relationshipContext: Its meaning is specific to AIModel; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        LOW: Represents the low state or classification in the context of AIModel.
        MEDIUM: Represents the medium state or classification in the context of AIModel.
        HIGH: Represents the high state or classification in the context of AIModel.
        CRITICAL: Represents the critical state or classification in the context of AIModel.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How much harm a wrong or biased result could cause, from LOW to CRITICAL; higher levels demand stricter validation, human oversight and approval before the model may be deployed."
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects AIModel to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a AIModel.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: evaluations
    target: AIEvaluation
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects AIModel to AIEvaluation so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about AIEvaluation records associated with a AIModel.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: predictions
    target: AIPrediction
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects AIModel to AIPrediction so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about AIPrediction records associated with a AIModel.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: policy
    target: AIPolicy
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects AIModel to AIPolicy so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about AIPolicy records associated with a AIModel.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: AI-MODEL-001
    rule: a DEPLOYED model must have an APPROVED lifecycle state transition and a valid evaluation record.
  lifecycle:
    title: AI Model Lifecycle
    attribute: status
    states: [DRAFT, TRAINING, VALIDATION, APPROVED, DEPLOYED, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: TRAINING, action: mark_training}
      - {from: TRAINING, to: VALIDATION, action: mark_validation}
      - {from: VALIDATION, to: APPROVED, action: approve}
      - {from: APPROVED, to: DEPLOYED, action: mark_deployed}
      - {from: TRAINING, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: TRAINING, action: resume}
      - {from: VALIDATION, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: VALIDATION, action: resume}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: DEPLOYED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: DEPLOYED, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: TRAINING, to: RETIRED, action: retire}
      - {from: VALIDATION, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: DEPLOYED, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: "One machine-learning or AI model the organisation trains, validates and runs to produce predictions, classifications, recommendations or generated content, kept so its purpose, risk and approval are governed before and while it is used."
    businessMeaning: AIModel is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate AIModel records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, AIEvaluation,
      AIPrediction, AIPolicy. These relationships provide the context needed to interpret the record rather than treating
      its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical AIModel record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Registered as a draft when a team proposes a model, moved through training and validation while evaluations are recorded, approved under the applicable AI policy, deployed to produce predictions, suspended if it misbehaves, and finally retired while its evaluations and predictions remain traceable to it."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AI-MODEL
