entity:
  name: City
  namespace: cedm.domain
  kind: reference_data
  description: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province."
  ui:
    icon: building-2
  referenceData: reference-data/city.yaml
  identity: {key: cityId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: cityId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the city record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a city store this identifier. The number or code people quote is a separate field.
  - {name: code, type: string, required: true, unique: true, maxLength: 80, help: {summary: "The city's code: its country code and its name in capitals, such as FR-PARIS.", usage: "Quoted beside the name in lists; integration with other systems.", relationshipContext: "Unique; the country prefix keeps cities of one name in different countries apart."}}
  - {name: name, type: string, required: true, maxLength: 200, help: {summary: "The city's name in English.", usage: "Shown in lists and on addresses.", relationshipContext: "Not unique: two countries can have a city of one name."}}
  - {name: population, type: integer, required: false, help: {summary: "The registry's population figure.", usage: "Ordering and sizing; not a current census count.", relationshipContext: "Describes the city only."}}
  - {name: latitude, type: decimal, required: false, help: {summary: "Latitude in degrees, north positive.", usage: "Maps and distance.", relationshipContext: "Describes the city only."}}
  - {name: longitude, type: decimal, required: false, help: {summary: "Longitude in degrees, east positive.", usage: "Maps and distance.", relationshipContext: "Describes the city only."}}
  - {name: timezone, type: string, maxLength: 64, required: false, help: {summary: "The IANA time zone the city keeps, such as Europe/Paris.", usage: "Showing local times for the city.", relationshipContext: "Describes the city only."}}
  - {name: isCapital, type: boolean, required: false, help: {summary: "Whether the city is its country's capital.", usage: "Highlighting the capital in lists.", relationshipContext: "At most one capital per country in this list."}}
  relationships:
  - {name: country, target: Country, cardinality: "1", ownership: reference, help: {summary: "The country the city is in.", usage: "Chosen first; the cities offered are those of that country.", cardinalityMeaning: "Every city belongs to exactly one country.", context: "A city is narrowed by its country, and by its state where it has one."}}
  - {name: stateProvince, target: StateProvince, cardinality: "0..1", ownership: reference, narrowedBy: [country], help: {summary: "The state or province the city is in, where the registry says which.", usage: "Chosen after the country; narrows the cities offered.", cardinalityMeaning: "A city has at most one state or province; outside the United States and Canada the list leaves it empty.", context: "The state of a city must be a division of the city's own country."}}
  invariants:
  - {id: CITY-001, rule: "A city belongs to one country, and its state or province, where stated, is a division of that country."}
  help:
    summary: "A city: every national capital and every city of 750 thousand or more, from GeoNames, linked to its country and, for the United States and Canada, to its state or province."
    howItRelates: "Referenced by addresses, parties, products and documents; related entities narrow each other (a city belongs to a state or province, which belongs to a country)."
    commonExamples: "A shipping address in a named city, state and country."
    businessMeaning: A shared list of cities lets every address, site and report name a place the same way, so that deliveries, tax rules and statistics by city agree across the business.
    usage: The list comes from GeoNames and is extended by an administrator when an address needs a city it does not hold; records choose their city from it.
    lifecycle: Reference data. A city that is no longer used is retired rather than deleted, so addresses that name it keep their meaning.
    workflowContext: Address capture, party onboarding, delivery routing, local tax determination and reporting by place.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-CITY}
