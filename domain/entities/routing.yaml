entity:
  name: Routing
  namespace: cedm.domain
  kind: manufacturing_process_master
  description: A versioned manufacturing process definition sequencing the operations required to produce or transform a Product.
  ui:
    icon: database
    recordLabel: [code, routingVersion]
  identity: {key: routingId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: routingId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the routing record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a routing store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the routing, usually the product code it makes.
      businessMeaning: Human-recognizable process identifier.
      usage: Chosen when the routing is created; production orders refer to it.
      relationshipContext: Unique together with the version.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, SUSPENDED, OBSOLETE]
    help:
      summary: Whether the routing may be used for production.
      businessMeaning: Controls eligibility for new production release.
      usage: Moved on by production engineering.
      relationshipContext: Only active routings are used for new orders.
      valueSemantics:
        DRAFT: Being written.
        ACTIVE: Used for production.
        SUSPENDED: Temporarily not used.
        OBSOLETE: Replaced or no longer used.
  - name: routingVersion
    type: string
    required: true
    maxLength: 20
    default: 1
    help:
      summary: The version of the routing.
      usage: A new version is created when the process changes; orders keep the version they were released with.
      relationshipContext: Only one version of a routing is active at a time.
  - name: description
    type: text
    required: false
    help:
      summary: What the routing makes and anything particular about it.
      usage: Read by production engineers.
      relationshipContext: Free text.
  - name: lotSizeFrom
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: The smallest order quantity the routing is meant for.
      usage: Lets different routings be used for small and large lots.
      relationshipContext: Empty for any quantity.
  - name: lotSizeTo
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: The largest order quantity the routing is meant for.
      usage: Read with the lower limit.
      relationshipContext: Not lower than the lower limit.
  - name: validFrom
    type: date
    required: false
    help:
      summary: The first day the routing may be used.
      usage: Set when it is released.
      relationshipContext: Not later than the valid-to date.
  - name: validTo
    type: date
    required: false
    help:
      summary: The last day the routing may be used.
      usage: Set when it is replaced.
      relationshipContext: Empty while in use.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product the routing makes.
      businessMeaning: Associates process definition with manufactured item.
      workflowRole: Must match work-order output.
      usage: Set when the routing is created.
      cardinalityMeaning: Every routing makes exactly one product.
      context: A product may have several routings for different lot sizes or plants.
  - name: operations
    target: Operation
    cardinality: "1..*"
    ownership: aggregate
    help:
      summary: The steps of the routing, in order.
      businessMeaning: Defines how production is performed.
      workflowRole: Operations are instantiated/executed under ManufacturingWorkOrder.
      usage: Defined by production engineering.
      cardinalityMeaning: A routing has at least one operation.
      context: Production orders copy them as their operations.
  invariants:
  - {id: ROUTING-001, rule: The upper lot size is not below the lower one., violatedWhen: lot_size_to != null and lot_size_from != null and lot_size_to < lot_size_from, message: The upper lot size is lower than the lower one.}
  - {id: ROUTING-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Routing Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, OBSOLETE]
    initial: DRAFT
    terminal: [OBSOLETE]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: OBSOLETE, action: mark_obsolete}
    - {from: ACTIVE, to: OBSOLETE, action: mark_obsolete}
    - {from: SUSPENDED, to: OBSOLETE, action: mark_obsolete}
  help:
    summary: Versioned definition of manufacturing process sequence.
    businessMeaning: BillOfMaterial defines what materials are required; Routing defines how the output is produced.
    usage: MRP, scheduling, costing, shop-floor execution, quality, and traceability.
    relationshipContext: Product is the output; Operations define steps; WorkCenters provide capacity; ManufacturingWorkOrder executes a selected version.
    lifecycle: Draft → active → suspended/obsolete with versioned replacement.
    changePropagation: Routing changes revalidate planned/unreleased work; released/completed work retains historical version.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-ROUTING}
