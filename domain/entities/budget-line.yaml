entity:
  name: BudgetLine
  namespace: cedm.domain
  kind: financial_plan_line
  description: A dimensional allocation of planned money within a Budget.
  ui:
    icon: piggy-bank
  identity: {key: budgetLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: budgetLineId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference for this one budget allocation, used by variance reports and revisions to point at it.", businessMeaning: Identifies one dimensional allocation., usage: Budget control and variance., relationshipContext: Belongs to Budget., requiredMeaning: Required.}}
  - {name: amount, type: Money, required: true, help: {summary: "The planned spending or income target allocated to this combination of account and responsibility centre; it cannot be negative.", businessMeaning: Financial target/limit for dimensions., usage: Planning and variance., relationshipContext: Not an actual ledger balance., requiredMeaning: Required.}}
  relationships:
  - {name: budget, target: Budget, cardinality: '1', ownership: reference, inverse: lines, help: {summary: Parent financial plan., businessMeaning: Supplies governance/version context., usage: Planning., cardinalityMeaning: Exactly one Budget., workflowRole: Line lifecycle follows budget governance.}}
  - {name: account, target: Account, cardinality: 0..1, ownership: reference, help: {summary: Financial account dimension., businessMeaning: Classifies planned amount., usage: Budget-vs-actual., cardinalityMeaning: Optional under non-account planning., workflowRole: Actuals derive from accounting not line mutation.}}
  - {name: costCenter, target: CostCenter, cardinality: 0..1, ownership: reference, help: {summary: Cost responsibility dimension., businessMeaning: Allocates plan to cost center., usage: Expense control., cardinalityMeaning: Optional., workflowRole: Must be eligible for budget period.}}
  - {name: profitCenter, target: ProfitCenter, cardinality: 0..1, ownership: reference, help: {summary: Profit responsibility dimension., businessMeaning: Allocates plan to profit center., usage: Management reporting., cardinalityMeaning: Optional., workflowRole: Must be eligible for budget period.}}
  invariants:
  - {id: BUDGET-LINE-001, rule: Line dimensions must form a valid unique planning intersection under Budget policy.}
  - {id: BUDGET-LINE-002, rule: Approved line correction uses governed budget revision and does not alter actual accounting.}
  - {id: BUDGET-LINE-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  help: {summary: "One planned amount of money in a budget, allocated to a specific combination of account, cost centre and profit centre, so spending and results can later be compared against the plan.", businessMeaning: Defines planned money at an account/responsibility intersection., usage: Budgeting and variance analysis., relationshipContext: Budget governs; Account/CostCenter/ProfitCenter classify., workflowContext: "Created by budget owners while the parent budget is being drafted, adjusted during review and submission, frozen when the budget is approved, and afterwards read by budget-versus-actual and variance reports; once approved it changes only through a governed budget revision, never by editing actual accounting.", example: "FY2027 Operating Budget, account 6200 Travel, cost centre CC-410 Field Sales: 85,000.00 EUR.", lifecycle: "A line has no status of its own and follows its budget: it is freely editable while the budget is DRAFT, locked once the budget is SUBMITTED and APPROVED, used for control while the budget is ACTIVE, and kept unchanged as history when the budget is SUPERSEDED or CLOSED."}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BUDGET-LINE}
