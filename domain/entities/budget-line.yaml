entity:
  name: BudgetLine
  namespace: cedm.domain
  kind: financial_plan_line
  description: A dimensional allocation of planned money within a Budget.
  ui:
    icon: piggy-bank
  identity: {key: budgetLineId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: budgetLineId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of one allocation within a budget., usage: Generated on creation; variance reports and revisions refer to the line through it., businessMeaning: Identifies one dimensional allocation., relationshipContext: Belongs to Budget.}}
    - {name: amount, type: Money, required: true, help: {summary: 'The money planned for this combination of account, cost centre and profit centre in the budget period.', usage: 'Entered by the budget owner; never negative, and compared with actual postings to show overspend or underspend.', businessMeaning: Financial target/limit for dimensions., relationshipContext: Not an actual ledger balance.}}
    - name: lineNumber
      type: integer
      required: true
      help:
        summary: The number of the line within the budget.
        usage: Assigned in order as lines are added.
        relationshipContext: Unique within the budget.
    - name: description
      type: string
      required: false
      maxLength: 300
      help:
        summary: A short statement of what the budgeted amount is intended to pay for.
        usage: Written by the budget owner and shown in budget reports and variance reviews.
        relationshipContext: Should be specific enough for an approver to judge the amount.
    - name: periodStart
      type: date
      required: false
      help:
        summary: The first day the amount covers.
        usage: Usually the start of the budget year or a month in it.
        relationshipContext: Within the budget's period.
    - name: periodEnd
      type: date
      required: false
      help:
        summary: The last day the amount covers.
        usage: Usually the end of the budget year or of a month.
        relationshipContext: Not earlier than the period start.
    - name: quantity
      type: decimal
      required: false
      precision: 18
      scale: 4
      help:
        summary: A quantity the amount is based on, such as trips, hours or units.
        usage: Entered when the amount is built up from a quantity and a rate.
        relationshipContext: Optional; explains the amount.
    - name: basisOfEstimate
      type: text
      required: false
      help:
        summary: How the amount was arrived at.
        usage: Written by the budget owner; read by reviewers.
        relationshipContext: Free text.
  relationships:
    - {name: budget, target: Budget, cardinality: '1', ownership: reference, inverse: lines, help: {cardinalityMeaning: Exactly one budget; a line cannot exist outside the plan that contains it., summary: Parent financial plan., businessMeaning: Supplies governance/version context., usage: Planning., workflowRole: Line lifecycle follows budget governance.}}
    - {name: account, target: Account, cardinality: 0..1, ownership: reference, help: {summary: Financial account dimension., businessMeaning: Classifies planned amount., usage: Budget-vs-actual., cardinalityMeaning: Optional under non-account planning., workflowRole: Actuals derive from accounting not line mutation.}}
    - {name: costCenter, target: CostCenter, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one cost centre; a line may be planned by account alone., summary: Cost responsibility dimension., businessMeaning: Allocates plan to cost center., usage: Expense control., workflowRole: Must be eligible for budget period.}}
    - {name: profitCenter, target: ProfitCenter, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: At most one profit centre; used when the plan is organised by profit responsibility., summary: Profit responsibility dimension., businessMeaning: Allocates plan to profit center., usage: Management reporting., workflowRole: Must be eligible for budget period.}}
  invariants:
    - {id: BUDGET-LINE-001, rule: Line dimensions must form a valid unique planning intersection under Budget policy.}
    - {id: BUDGET-LINE-002, rule: Approved line correction uses governed budget revision and does not alter actual accounting.}
    - {id: BUDGET-LINE-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  help:
    summary: Detailed dimensional budget allocation.
    businessMeaning: Defines planned money at an account/responsibility intersection.
    usage: Budgeting and variance analysis.
    relationshipContext: Budget governs; Account/CostCenter/ProfitCenter classify.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-BUDGET-LINE}
