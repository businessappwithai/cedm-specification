entity:
  name: CostCenter
  namespace: cedm.domain
  kind: management_accounting_dimension
  description: A governed responsibility center used to assign and analyze costs independently of legal-account identity.
  ui:
    icon: calculator
  identity: {key: costCenterId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: costCenterId, type: uuid, required: true, immutable: true, help: {summary: "The internal key that links postings, budgets and reports to this one cost centre.", businessMeaning: Identifies the governed CostCenter concept independently of labels., usage: "Planning, reporting and integration.", relationshipContext: Referenced by compatible financial planning processes., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, maxLength: 100, help: {summary: "The short code people enter on invoices, expense claims and journals to charge costs to this centre.", businessMeaning: Human/integration identifier., usage: Planning and reporting., relationshipContext: Unique within governing context., requiredMeaning: Required.}}
  relationships:
  - {name: organization, target: Organization, cardinality: '1', ownership: reference, help: {summary: Governing organization., businessMeaning: Defines management/reporting boundary., usage: Planning and analysis., cardinalityMeaning: Exactly one Organization., workflowRole: References must use compatible organization context.}}
  invariants:
  - {id: COSTCENTER-001, rule: The record must not directly create or rewrite actual JournalEntry evidence.}
  help: {summary: "A department, team or function that the organization charges costs to, so managers can see and control what their area spends regardless of which ledger account is used.", businessMeaning: Provides planning/management semantics separately from actual accounting evidence., usage: "Planning, control, management reporting and analysis.", relationshipContext: "Organization supplies governance; financial transactions remain authoritative for actuals.", workflowContext: "Finance sets up the cost centre when a new department or responsibility area is created; purchases, payroll and journal entries are then coded to it as they are posted, budgets are set against it, and management reports compare its actual spending with budget each period.", lifecycle: "A cost centre is opened when the responsibility area is created and stays in use while costs are charged to it; when a reorganization ends that area it is closed to new postings but kept so past costs remain reportable.", example: "Cost centre CC-4100 Customer Support, belonging to the UK trading company, to which support staff salaries and helpdesk software are charged."}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-COST-CENTER}
