entity:
  name: Lot
  namespace: cedm.domain
  kind: inventory_traceability_master
  description: A governed batch or lot identity grouping a quantity of one Product with common production, receipt, quality, expiry, or provenance characteristics for inventory traceability.
  ui:
    icon: database
  identity: {key: lotId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: lotId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the lot record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a lot store this identifier. The number or code people quote is a separate field.
  - {name: lotNumber, type: string, required: true, maxLength: 150, help: {summary: Business-facing lot or batch identifier., businessMeaning: Traceability code used operationally and externally., usage: "Receiving, labels, picking, quality, recall, and certificates.", relationshipContext: Uniqueness is governed with Product and organizational policy.}}
  - {name: manufacturedAt, type: datetime, required: false, help: {summary: Time the lot was manufactured or produced., businessMeaning: Anchors production age and provenance., usage: "Shelf-life, quality, genealogy, and recall.", relationshipContext: Distinct from receipt date., optionalMeaning: Optional when unknown or not applicable.}}
  - {name: expiresAt, type: datetime, required: false, help: {summary: Expiry or use-by time for the lot., businessMeaning: Controls eligibility where shelf life applies., usage: "FEFO allocation, quarantine, disposal, and compliance.", relationshipContext: Does not itself post inventory movement., optionalMeaning: Optional for non-expiring products.}}
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, HOLD, QUARANTINED, RELEASED, EXPIRED, REJECTED, CONSUMED, CLOSED]
    help: {summary: Governed usability state of the lot., businessMeaning: Controls allocation and operational eligibility while preserving stock history., usage: "Quality release, warehouse allocation, production, recall, and disposition.", relationshipContext: Status restrictions affect availability but do not rewrite movement history., valueSemantics: {ACTIVE: Operationally recognized., HOLD: Temporarily restricted., QUARANTINED: Segregated pending decision., RELEASED: Approved for governed use., EXPIRED: Past governed shelf life., REJECTED: Not approved for intended use., CONSUMED: Quantity fully consumed under tracked processes., CLOSED: Traceability lifecycle closed.}}
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: Product represented by this lot.
      businessMeaning: Defines item identity for all lot quantities.
      usage: Inventory and quality validation.
      workflowRole: Movements and balances must use the same product.
      cardinalityMeaning: Every lot is of exactly one product.
  - {name: inventoryBalances, target: InventoryBalance, cardinality: "0..*", ownership: reference, help: {summary: Current stock projections segmented by this lot., businessMeaning: Shows where lot quantity is currently held., usage: "Availability, allocation, recall, and reconciliation.", cardinalityMeaning: A lot may exist across many locations., workflowRole: Derived from lot-attributed inventory events.}}
  - {name: inventoryMovements, target: InventoryMovement, cardinality: "0..*", ownership: reference, help: {summary: Inventory events carrying this lot identity., businessMeaning: Historical ledger for lot quantity movement., usage: "Genealogy, recall, reconciliation, and audit.", cardinalityMeaning: Many events may affect a lot., workflowRole: Authoritative physical quantity history.}}
  invariants:
  - {id: LOT-001, rule: lotNumber must be unique for Product within the applicable traceability namespace.}
  - {id: LOT-002, rule: expiresAt must not precede manufacturedAt when both are known.}
  - {id: LOT-003, rule: "HOLD, QUARANTINED, EXPIRED, or REJECTED lots must not enter unrestricted allocation without an authorized release or exception."}
  - {id: LOT-004, rule: Lot identity and provenance referenced by posted inventory or quality evidence are immutable; correction uses controlled genealogy or compensating records.}
  - {id: LOT-005, rule: Lot quantity across balances must reconcile to posted lot-attributed InventoryMovement events.}
  lifecycle:
    title: Lot Lifecycle
    attribute: status
    states: [ACTIVE, HOLD, QUARANTINED, RELEASED, EXPIRED, REJECTED, CONSUMED, CLOSED]
    initial: ACTIVE
    terminal: [CONSUMED, EXPIRED, REJECTED]
    transitions:
    - {from: ACTIVE, to: HOLD, action: mark_hold}
    - {from: HOLD, to: RELEASED, action: release}
    - {from: RELEASED, to: CLOSED, action: close}
    - {from: CLOSED, to: CONSUMED, action: consume}
    - {from: HOLD, to: QUARANTINED, action: quarantine}
    - {from: QUARANTINED, to: HOLD, action: release}
    - {from: RELEASED, to: QUARANTINED, action: quarantine}
    - {from: QUARANTINED, to: RELEASED, action: release}
    - {from: HOLD, to: EXPIRED, action: expire}
    - {from: RELEASED, to: EXPIRED, action: expire}
    - {from: QUARANTINED, to: EXPIRED, action: expire}
    - {from: ACTIVE, to: REJECTED, action: reject}
    - {from: HOLD, to: REJECTED, action: reject}
    - {from: RELEASED, to: REJECTED, action: reject}
    - {from: QUARANTINED, to: REJECTED, action: reject}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a lot is stopped"
    description: "When a lot is quarantined, a high-priority task asks someone to resolve it."
    when: "status == \"QUARANTINED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "LOT-EXCEPTION-{{id}}"
          name: "Resolve lot {{lot_number}}"
          description: "Lot {{lot_number}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a lot is ended"
    description: "When a lot is rejected, a task asks someone to settle what depended on it."
    when: "status == \"REJECTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "LOT-FOLLOW-UP-{{id}}"
          name: "Follow up on lot {{lot_number}}"
          description: "Lot {{lot_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Batch-level inventory identity for end-to-end genealogy and recall.
    businessMeaning: Product identifies what an item is; Lot identifies which production or receipt batch a quantity belongs to.
    usage: Inventory, WMS, manufacturing, quality, procurement, sales fulfillment, expiry management, recall, and regulatory traceability.
    relationshipContext: Lot follows Product quantities through InventoryMovement and InventoryBalance and may later connect to receipt, production, shipment, inspection, and certificate evidence.
    lifecycle: Created/received → active or quarantined → released/held → consumed/expired/rejected → closed.
    changePropagation: Status, expiry, or quality changes immediately revalidate availability, reservations, picking, shipment, production consumption, and disposition without altering historical movements.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-LOT}
