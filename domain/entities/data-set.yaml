entity:
  name: Dataset
  namespace: cedm.domain
  kind: data_entity
  description: A governed collection of structured or unstructured data used for operations, analytics, reporting, research, or AI.
  ui:
    icon: table
    recordLabel: [code, name]
  identity:
    key: datasetId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: datasetId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the dataset record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a dataset store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the dataset in the catalogue.
      usage: Used by pipelines and requests to refer to it.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the dataset.
      usage: Shown in the data catalogue.
      relationshipContext: Identifies it for people.
  - name: classification
    type: enum
    required: true
    values:
    - PUBLIC
    - INTERNAL
    - CONFIDENTIAL
    - RESTRICTED
    - SENSITIVE
    help:
      summary: How sensitive the data is.
      usage: Decides who may access it and how it must be protected.
      relationshipContext: Personal data is at least confidential.
      valueSemantics:
        PUBLIC: May be published.
        INTERNAL: For staff only.
        CONFIDENTIAL: For people who need it for their work.
        RESTRICTED: For named people only.
        SENSITIVE: Special-category or highly sensitive data with extra legal protection.
  - name: format
    type: string
    required: false
    maxLength: 100
    help:
      summary: The format the data is held in, such as Parquet, CSV or a database table.
      usage: Tells consumers how to read it.
      relationshipContext: Free text.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - ARCHIVED
    - RETIRED
    help:
      summary: Whether the dataset is available for use.
      usage: Moved on by the data owner.
      relationshipContext: Only active datasets may be requested.
      valueSemantics:
        DRAFT: Being prepared.
        ACTIVE: Published and in use.
        ARCHIVED: Kept for history; not refreshed.
        RETIRED: Deleted under the retention policy.
  - name: ownerOrganizationId
    type: reference
    target: Organization
    required: false
    help:
      summary: The organization that owns the dataset.
      usage: Set when the dataset is registered.
      relationshipContext: Its data owner approves access requests.
  - name: description
    type: text
    required: false
    help:
      summary: What the data contains and where it comes from.
      usage: Read by people deciding whether it suits their purpose.
      relationshipContext: Free text.
  - name: recordCount
    type: integer
    required: false
    help:
      summary: How many records the dataset holds.
      usage: Updated on refresh.
      relationshipContext: Approximate for very large datasets.
  - name: refreshFrequency
    type: string
    required: false
    maxLength: 50
    help:
      summary: How often the data is refreshed, such as daily or monthly.
      usage: Tells consumers how current it is.
      relationshipContext: Free text.
  - name: containsPersonalData
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the dataset contains personal data.
      usage: Decides data-protection obligations.
      relationshipContext: Set by the data owner.
  relationships:
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization that owns the dataset.
      usage: Set when it is registered.
      cardinalityMeaning: At most one.
      context: Its data owner answers for the data.
  - name: qualityAssessments
    target: DataQualityAssessment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The quality assessments of the dataset.
      usage: Run by data stewards.
      cardinalityMeaning: Any number; each assessment is of one dataset.
      context: Listed under the dataset.
  - name: aiModels
    target: AIModel
    cardinality: 0..*
    ownership: reference
    help:
      summary: AI models trained or evaluated on the dataset.
      usage: Linked by the data-science team.
      cardinalityMeaning: Many models per dataset; a model uses many datasets.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  lifecycle:
    title: Dataset Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, ARCHIVED, RETIRED]
    initial: DRAFT
    terminal: [ARCHIVED, RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: ARCHIVED, action: archive}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
  invariants:
  - {id: DATASET-EXE-001, rule: "Record Count cannot be negative.", violatedWhen: "record_count != null and record_count < 0", message: "Record Count cannot be negative."}
  help:
    summary: Represents a data entity called Dataset within the CEDM business model.
    businessMeaning: Dataset is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, DataQualityAssessment, AIModel. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Data owners register datasets in the catalogue with their classification, owner and format; consumers find and request them there; quality is assessed regularly; AI teams record which datasets trained which models.
    lifecycle: Drafted while being prepared, active while published for use, archived when kept only for history, and retired when deleted under the retention policy.
    example: Dataset CUST-MASTER 'Customer master', confidential, Parquet, owner Sales Operations, 412,000 records refreshed daily, used to train churn model CHN-v2.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DATASET
