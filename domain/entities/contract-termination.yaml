entity:
  name: ContractTermination
  namespace: cedm.domain
  kind: contract_lifecycle
  description: A governed event ending a Contract or selected obligations under authorized termination terms.
  ui:
    icon: file-check
  identity: {key: contractTerminationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: contractTerminationId, type: uuid, required: true, immutable: true, help: {summary: The identity of the termination., usage: Generated on creation; settlement and wind-down tasks refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: 'The date and time from which the contract, or the named obligations, ceases to apply.', usage: Taken from the notice or agreement; later charges and obligations stop at this moment.}}
  relationships:
    - {name: contract, target: Contract, cardinality: '1', ownership: reference, help: {summary: The contract being ended., usage: Set when the termination is recorded., cardinalityMeaning: Exactly one contract., workflowRole: Closes the contract's period of effect.}}
  invariants:
    - {id: CONTRACT-TERMINATION-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An event that ends a contract, or selected obligations under it, according to its termination terms.
    businessMeaning: 'Ending a contract has consequences: obligations stop, notices are given, final settlements are made. Recording the termination states when and how it ended, which is what disputes and wind-down tasks rely on.'
    usage: Created when notice is given or the contract ends by agreement; read by contract managers, finance and legal.
    relationshipContext: Each termination belongs to one Contract.
    lifecycle: Executed terminations are evidence; they are not edited. A wrongly recorded termination is corrected by an explicit follow-up record.
    example: The customer terminates a service contract with 90 days' notice, effective 31 October.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CONTRACT-TERMINATION}
