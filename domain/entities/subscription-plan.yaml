entity:
  name: SubscriptionPlan
  namespace: cedm.domain
  kind: subscription_master
  description: A governed reusable commercial plan defining recurring, usage, entitlement, pricing, and billing terms for subscriptions.
  ui:
    icon: repeat
  identity: {key: subscriptionPlanId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: subscriptionPlanId, type: uuid, required: true, immutable: true, help: {summary: "The permanent identity of this commercial plan, which every subscription sold on it refers to.", businessMeaning: Identifies one governed SubscriptionPlan record., usage: "Enterprise processing, integration, reporting and audit.", relationshipContext: Referenced by compatible domain workflows., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: "Shows whether the plan is a draft, active for new sales, completed and closed, or cancelled before launch.", businessMeaning: Indicates usability/execution state of SubscriptionPlan., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships: []
  invariants:
  - {id: SUBSCRIPTION-PLAN-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Subscription Plan Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a subscription plan is ended"
      description: "When a subscription plan is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUBSCRIPTION-PLAN-FOLLOW-UP-{{id}}"
              name: "Follow up on subscription plan {{id}}"
              description: "Subscription plan {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A governed reusable commercial plan defining recurring, usage, entitlement, pricing, and billing terms for subscriptions.
    purpose: Provide canonical enterprise semantics for SubscriptionPlan while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: A governed reusable commercial plan defining recurring, usage, entitlement, pricing, and billing terms for subscriptions.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SUBSCRIPTION-PLAN}
