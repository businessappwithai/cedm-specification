entity:
  name: VehicleModel
  namespace: cedm.domain
  kind: automotive_master_entity
  description: A manufacturer-defined model and configuration family for vehicles.
  ui:
    icon: car
    recordLabel: [modelCode, modelName]
  identity:
    key: vehicleModelId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: vehicleModelId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the vehicle model record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a vehicle model store this identifier. The number or code people quote is a separate field.
  - name: manufacturer
    type: string
    required: true
    maxLength: 200
    help:
      summary: The maker of the model.
      usage: Shown with the model name.
      relationshipContext: As the manufacturer names itself.
  - name: modelName
    type: string
    required: true
    maxLength: 200
    help:
      summary: The commercial name of the model.
      usage: Shown to customers.
      relationshipContext: Without the year.
  - name: modelCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the model and year.
      usage: Used for parts, pricing and registrations.
      relationshipContext: Unique.
  - name: modelYear
    type: integer
    required: false
    help:
      summary: The model year.
      usage: Distinguishes versions of the same model.
      relationshipContext: Four digits.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - DISCONTINUED
    help:
      summary: Whether the model is offered.
      usage: Changed by product management.
      relationshipContext: Only active models are ordered.
      valueSemantics:
        PLANNED: Not launched yet.
        ACTIVE: Produced and sold.
        DISCONTINUED: No longer produced.
  relationships:
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The product the model is sold as.
      usage: Linked for pricing and ordering.
      cardinalityMeaning: At most one product.
      context: Its price list applies.
  - name: vehicles
    target: Vehicle
    cardinality: 0..*
    ownership: reference
    help:
      summary: Vehicles of this model.
      usage: Listed for recalls and service campaigns.
      cardinalityMeaning: Any number of vehicles.
      context: Each vehicle is of at most one model.
    inverseCardinality: '1'
  lifecycle:
    title: Vehicle Model Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, DISCONTINUED]
    initial: PLANNED
    terminal: [DISCONTINUED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: PLANNED, to: DISCONTINUED, action: discontinue}
    - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
  help:
    summary: Represents a automotive master entity called VehicleModel within the CEDM business model.
    businessMeaning: VehicleModel is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Vehicle. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Product and sales teams maintain the models a manufacturer offers, by model year; vehicles, parts and service plans refer to the model.
    lifecycle: A model is planned before launch, active while produced and sold, and discontinued when production ends.
    example: Model AX3-2024 'Axia 3 Hatchback', manufacturer Axia Motors, model year 2024, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-VEHICLE-MODEL
