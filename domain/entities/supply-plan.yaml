entity:
  name: SupplyPlan
  namespace: cedm.domain
  kind: supply_chain_entity
  description: A plan describing expected demand, supply, inventory, and replenishment actions over a planning horizon.
  ui:
    icon: table
  identity:
    key: supplyPlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: supplyPlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supply plan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supply plan store this identifier. The number or code people quote is a separate field.
  - name: planNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of plan number for the SupplyPlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating SupplyPlan records, where applicable.
      relationshipContext: Its meaning is specific to SupplyPlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: planningStart
    type: date
    required: true
    help:
      summary: Captures the business meaning of planning start for the SupplyPlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating SupplyPlan records, where applicable.
      relationshipContext: Its meaning is specific to SupplyPlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: planningEnd
    type: date
    required: true
    help:
      summary: Captures the business meaning of planning end for the SupplyPlan. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating SupplyPlan records, where applicable.
      relationshipContext: Its meaning is specific to SupplyPlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - ACTIVE
    - CLOSED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating SupplyPlan records, where applicable.
      relationshipContext: Its meaning is specific to SupplyPlan; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of SupplyPlan.
        APPROVED: Represents the approved state or classification in the context of SupplyPlan.
        ACTIVE: Represents the active state or classification in the context of SupplyPlan.
        CLOSED: Represents the closed state or classification in the context of SupplyPlan.
        CANCELLED: Represents the cancelled state or classification in the context of SupplyPlan.
  relationships:
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects SupplyPlan to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a SupplyPlan.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects SupplyPlan to Product so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Product records associated with a SupplyPlan.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: 0..*
  - name: locations
    target: Location
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects SupplyPlan to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a SupplyPlan.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: 0..*
  invariants:
  - id: SUPPLY-PLAN-001
    rule: planningEnd must not precede planningStart.
  - {id: SUPPLY-PLAN-EXE-001, rule: "Planning End must not be earlier than planning start.", violatedWhen: "planning_start != null and planning_end != null and planning_end < planning_start", message: "Planning End cannot be earlier than planning start."}
  lifecycle:
    title: Supply Plan Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a supply plan is ended"
    description: "When a supply plan is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLY-PLAN-FOLLOW-UP-{{id}}"
          name: "Follow up on supply plan {{plan_number}}"
          description: "Supply plan {{plan_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a supply chain entity called SupplyPlan within the CEDM business model.
    businessMeaning: SupplyPlan is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate SupplyPlan records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Product, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical SupplyPlan record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLY-PLAN
