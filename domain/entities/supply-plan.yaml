entity:
  name: SupplyPlan
  namespace: cedm.domain
  kind: supply_chain_entity
  description: A plan describing expected demand, supply, inventory, and replenishment actions over a planning horizon.
  ui:
    icon: table
    recordLabel: [planNumber]
  identity:
    key: supplyPlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: supplyPlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the supply plan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a supply plan store this identifier. The number or code people quote is a separate field.
  - name: planNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the plan.
      usage: Quoted on the orders it releases.
      relationshipContext: Unique.
  - name: planningStart
    type: date
    required: true
    help:
      summary: The first day the plan covers.
      usage: Demand and supply are planned from it.
      relationshipContext: Not after the end.
  - name: planningEnd
    type: date
    required: true
    help:
      summary: The last day the plan covers.
      usage: Ends the horizon.
      relationshipContext: Not before the start.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - ACTIVE
    - CLOSED
    - CANCELLED
    help:
      summary: Where the plan stands.
      usage: Moved on by the planner.
      relationshipContext: Only active plans release orders.
      valueSemantics:
        DRAFT: Being built.
        APPROVED: Approved; not yet in force.
        ACTIVE: Driving replenishment.
        CLOSED: Its horizon has passed.
        CANCELLED: Withdrawn.
  relationships:
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation the plan is for.
      usage: Set when the plan is created.
      cardinalityMeaning: At most one organisation.
      context: Its sites and products are planned.
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: The products the plan covers.
      usage: Chosen when the plan is built.
      cardinalityMeaning: Any number; a product may appear in many plans.
      context: Planned quantities are in the plan's lines.
    inverseCardinality: 0..*
  - name: locations
    target: Location
    cardinality: 0..*
    ownership: reference
    help:
      summary: The locations the plan covers.
      usage: Chosen when the plan is built.
      cardinalityMeaning: Any number; a location may appear in many plans.
      context: Stock targets are set per location.
    inverseCardinality: 0..*
  invariants:
  - {id: SUPPLY-PLAN-001, rule: A plan ends on or after the day it starts., violatedWhen: planning_end < planning_start, message: The planning end cannot be before its start.}
  - {id: SUPPLY-PLAN-EXE-001, rule: "Planning End must not be earlier than planning start.", violatedWhen: "planning_start != null and planning_end != null and planning_end < planning_start", message: "Planning End cannot be earlier than planning start."}
  lifecycle:
    title: Supply Plan Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, CLOSED, CANCELLED]
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a supply plan is ended"
    description: "When a supply plan is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SUPPLY-PLAN-FOLLOW-UP-{{id}}"
          name: "Follow up on supply plan {{plan_number}}"
          description: "Supply plan {{plan_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A plan that balances expected demand with supply and stock for a period.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Product, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Supply planners build plans that balance forecast demand with supply and stock for each product and location over a horizon, have them approved, and release the replenishment actions they contain.
    lifecycle: A plan is drafted, approved, active while it drives replenishment, and closed at the end of its horizon; a plan may be cancelled before it closes.
    example: Supply plan SP-2024-W23, Europe, 3 June–1 September 2024, 412 products at 6 warehouses, active.
    businessMeaning: Supply plans decide what to buy, make and move; good plans avoid both stock-outs and excess stock.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SUPPLY-PLAN
