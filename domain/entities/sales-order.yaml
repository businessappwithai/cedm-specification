entity:
  name: SalesOrder
  namespace: cedm.domain
  kind: commercial_transaction
  description: A formal customer commitment for specified products or services, establishing what is requested, for whom, under which commercial terms, and for what fulfillment requirements; it is the commercial source for allocation, shipment, invoicing, and revenue processes.
  ui:
    icon: shopping-cart
  identity: {key: salesOrderId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: salesOrderId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the sales order record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a sales order store this identifier. The number or code people quote is a separate field.
  - name: orderNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the order.
      usage: Quoted on confirmations, delivery notes and invoices.
      relationshipContext: Unique.
  - name: orderDate
    type: datetime
    required: true
    help:
      summary: When the customer placed the order.
      usage: Used for prices, terms and sales reporting.
      relationshipContext: Set when the order is entered.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, CONFIRMED, ALLOCATED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]
    help:
      summary: Order-level lifecycle state controlling commercial and fulfillment permissions.
      usage: Drives confirmation, allocation, fulfillment, shipment readiness and cancellation.
      relationshipContext: Summarizes downstream evidence; it is not an independent source of fulfillment quantity.
      workflowRole: Status transitions are validated against line, reservation, shipment and fulfillment evidence.
      valueSemantics:
        DRAFT: Being entered.
        CONFIRMED: Accepted and confirmed to the customer.
        ALLOCATED: Stock reserved for its lines.
        PARTIALLY_FULFILLED: Part shipped or delivered.
        FULFILLED: Completely shipped or delivered.
        CANCELLED: Cancelled before completion.
  - name: currencyId
    type: reference
    target: Currency
    required: false
    help:
      summary: The currency the order is priced in.
      usage: All lines and invoices use it.
      relationshipContext: Usually the customer's currency.
  - name: requestedDeliveryDate
    type: date
    required: false
    help:
      summary: The day the customer wants delivery.
      usage: Used to plan picking and transport.
      relationshipContext: Not before the order date.
  - name: totalAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The total value of the order.
      usage: Summed from the lines; checked against credit limits.
      relationshipContext: Not negative.
  relationships:
  - name: customer
    target: Customer
    cardinality: '1'
    ownership: reference
    help:
      summary: The customer who placed the order.
      usage: Chosen when entering the order.
      context: The customer's terms, prices and credit limit apply.
      cardinalityMeaning: Each order is placed by one customer; a customer places many orders.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The selling organisation.
      usage: Set from the user's company.
      context: Books the revenue.
      cardinalityMeaning: At most one selling organisation.
  - name: lines
    target: SalesOrderLine
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The products and services ordered.
      cardinalityMeaning: A sales order has at least one sales order line in this role.
      usage: Entered with the order.
      context: A confirmed order has at least one line.
  - name: deliveryLocation
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the goods are delivered.
      usage: Defaults to the customer's delivery address.
      context: Used to plan transport and tax.
      cardinalityMeaning: At most one delivery place per order.
  - name: shipments
    target: Shipment
    cardinality: 0..*
    ownership: reference
    help:
      summary: Shipments that deliver the order.
      usage: Created when the order is picked and shipped.
      context: Fulfilment is counted from them.
      cardinalityMeaning: Any number of shipments; an order may be delivered in parts.
  - name: invoices
    target: Invoice
    cardinality: 0..*
    ownership: reference
    help:
      summary: Invoices that bill the order.
      usage: Created when the order is billed.
      context: Billing follows the order's terms.
      cardinalityMeaning: Any number of invoices; an order may be billed in parts.
  invariants:
  - {id: SALES-ORDER-001, rule: orderNumber must be unique within its business numbering context.}
  - {id: SALES-ORDER-002, rule: A CONFIRMED or later order must contain at least one SalesOrderLine.}
  - {id: SALES-ORDER-003, rule: totalAmount must reconcile with applicable line amounts and adjustments.}
  - {id: SALES-ORDER-004, rule: CANCELLED orders must not create new allocation or fulfillment commitments.}
  - {id: SALES-ORDER-005, rule: FULFILLED status requires all executable line quantities to have accepted fulfillment evidence according to the applicable workflow.}
  - {id: SALES-ORDER-006, rule: "CONFIRMED status requires required customer, currency, product, UOM, pricing, tax and delivery context to pass validation before fulfillment work can begin."}
  - {id: SALES-ORDER-007, rule: ALLOCATED status requires active reservation/allocation evidence for the executable quantities according to fulfillment policy; order status cannot create reservations implicitly without the allocation workflow.}
  - {id: SALES-ORDER-008, rule: "PARTIALLY_FULFILLED and FULFILLED must be derived from accepted fulfillment evidence on SalesOrderLine, not merely Shipment status or invoice creation."}
  - {id: SALES-ORDER-009, rule: A Shipment linked to this order may contribute fulfillment evidence only through validated shipment execution and corresponding fulfillment/inventory workflows; Shipment delivery alone cannot directly overwrite order quantities.}
  - {id: SALES-ORDER-010, rule: "Cancelling an order with active reservations, open shipments, or downstream fulfillment requires controlled release/cancellation/reconciliation of those dependent workflows before remaining demand is terminated."}
  - {id: SALES-ORDER-011, rule: "Cancellation must not erase accepted shipment, inventory, invoice or payment history; any already-posted effects require their own compensating workflows."}
  - {id: SALES-ORDER-012, rule: "Changes to Customer, Product, UOM, Price, DiscountRule, TaxRule, Currency, DeliveryLocation or requested delivery date that affect an executable order require controlled revalidation and, where applicable, repricing/reallocation/rescheduling workflows."}
  - {id: SALES-ORDER-013, rule: Invoice creation does not make an order FULFILLED and shipment delivery does not make an invoice PAID; each lifecycle is governed by its authoritative evidence.}
  - {id: SALES-ORDER-014, rule: Order-level derived totals and status must be recalculated atomically or through an idempotent recoverable workflow whenever a dependent line/reservation/fulfillment event changes.}
  - {id: SALES-ORDER-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Sales Order Lifecycle
    attribute: status
    states: [DRAFT, CONFIRMED, ALLOCATED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]
    initial: DRAFT
    terminal: [FULFILLED, CANCELLED]
    transitions:
    - {from: DRAFT, to: CONFIRMED, action: confirm}
    - {from: CONFIRMED, to: ALLOCATED, action: allocate}
    - {from: ALLOCATED, to: PARTIALLY_FULFILLED, action: fulfil_in_part}
    - {from: ALLOCATED, to: FULFILLED, action: fulfil}
    - {from: PARTIALLY_FULFILLED, to: FULFILLED, action: fulfil}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: CONFIRMED, to: CANCELLED, action: cancel}
    - {from: ALLOCATED, to: CANCELLED, action: cancel}
    - {from: PARTIALLY_FULFILLED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a sales order is ended"
    description: "When a sales order is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SALES-ORDER-FOLLOW-UP-{{id}}"
          name: "Follow up on sales order {{order_number}}"
          description: "Sales order {{order_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a sales order is done"
    description: "When a sales order is fulfilled, a task asks someone to confirm the outcome."
    when: "status == \"FULFILLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SALES-ORDER-COMPLETED-{{id}}"
          name: "Confirm sales order {{order_number}}"
          description: "Sales order {{order_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents the commercial customer commitment from which fulfillment and financial processes derive work.
    businessMeaning: SalesOrder establishes accepted demand; it does not itself move inventory, prove shipment, or prove payment.
    usage: Order management, allocation, inventory, warehouse execution, transportation, invoicing, customer service and revenue processes.
    relationshipContext: Customer supplies commercial context, SalesOrderLine supplies demand detail, InventoryReservation supplies committed stock, InventoryMovement supplies stock execution, Shipment supplies transport evidence, and Invoice supplies financial claim evidence.
    workflowContext: Confirmed order → validation → availability check → reservation/allocation → pick/issue → Shipment → delivery/acceptance evidence → SalesOrderLine fulfillment → order status. Invoice is generated according to billing policy and remains independent evidence. Cancellation releases remaining reservations and stops new work while preserving historical downstream effects.
    lifecycle: Draft → confirmed → allocated → partially fulfilled → fulfilled, with cancellation of remaining demand and controlled exception/recovery paths.
    propagation: Entity changes must propagate through affected dependent workflows rather than directly mutating derived states. Line fulfillment changes recalculate order status; reservation changes affect allocation state; shipment events contribute fulfillment evidence; billing changes do not independently determine fulfillment.
    concurrency: Allocation, fulfillment, cancellation and status transitions require concurrency control and idempotency to prevent double reservation, double fulfillment or contradictory terminal states.
    example: An order for 20 units reserves 20, ships 12, and becomes PARTIALLY_FULFILLED from accepted fulfillment evidence. The remaining 8 stay executable. A cancellation then releases the remaining reservation and terminates the open demand without reversing the already accepted 12-unit fulfillment.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SALES-ORDER}
