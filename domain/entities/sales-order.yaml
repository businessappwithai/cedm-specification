entity:
  name: SalesOrder
  namespace: cedm.domain
  kind: commercial_transaction
  description: A formal customer commitment for specified products or services, establishing what is requested, for whom, under which commercial terms, and for what fulfillment requirements; it is the commercial source for allocation, shipment, invoicing, and revenue processes.
  identity: {key: salesOrderId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: salesOrderId
      type: uuid
      required: true
      immutable: true
      help: {summary: The immutable CEDM identity of the sales order., usage: Used by fulfillment, allocation, shipment, billing, integration, and audit processes., relationshipContext: Identifies the order independently of customer and line records., workflowRole: Provides the stable root reference across confirmation, allocation, fulfillment, shipment, invoicing, and closure., requiredMeaning: Every order must remain uniquely identifiable.}
    - name: orderNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help: {summary: The business-facing order reference., usage: Used for searching, documents, customer communication, and reconciliation., relationshipContext: Distinct from salesOrderId and external references., workflowRole: Used to correlate operational work and customer-facing documents., requiredMeaning: Every executable order needs a recognizable reference.}
    - name: orderDate
      type: datetime
      required: true
      help: {summary: The time at which the order entered the recognized commercial process., usage: Drives chronology, reporting, eligibility, and audit., relationshipContext: Distinct from requested delivery and actual shipment dates., workflowRole: Establishes the beginning of the order lifecycle., requiredMeaning: Required for commercial chronology.}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, CONFIRMED, ALLOCATED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]
      help:
        summary: The order-level lifecycle state controlling commercial and fulfillment permissions.
        usage: Drives allocation, fulfillment, shipment readiness, cancellation, and closure decisions.
        relationshipContext: Order status summarizes the aggregate commitment; SalesOrderLine and Shipment provide detailed fulfillment evidence.
        workflowRole: CONFIRMED enables fulfillment; ALLOCATED indicates supply/capacity commitment; PARTIALLY_FULFILLED and FULFILLED are derived from downstream fulfillment; CANCELLED terminates remaining demand.
        valueSemantics:
          DRAFT: Editable demand not yet accepted as an executable commitment.
          CONFIRMED: Accepted commitment eligible for fulfillment.
          ALLOCATED: Required inventory or capacity has been assigned.
          PARTIALLY_FULFILLED: Some required quantities have been fulfilled while open quantities remain.
          FULFILLED: All required commitments are fulfilled and no remaining executable quantity exists.
          CANCELLED: Remaining unfulfilled commitment is terminated.
        requiredMeaning: Every order must have a known lifecycle state.
    - name: currencyId
      type: reference
      target: Currency
      required: false
      help: {summary: Identifies the currency for order monetary values., usage: Interprets prices, totals, invoices, credit, and reporting., relationshipContext: References common Currency metadata., workflowRole: Must be resolved before an executable priced order is invoiced., optionalMeaning: May be absent while commercial denomination is unresolved.}
    - name: requestedDeliveryDate
      type: date
      required: false
      help: {summary: The customer's requested fulfillment date., usage: Supports availability, allocation, shipment scheduling, and service analysis., relationshipContext: A request rather than an actual event or carrier promise., workflowRole: Feeds fulfillment priority and transport planning., optionalMeaning: Optional when no requested date exists.}
    - name: totalAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help: {summary: The calculated commercial value of the order., usage: Supports credit, financial reporting, invoicing, and reconciliation., relationshipContext: Must reconcile with SalesOrderLine values and currency., workflowRole: Becomes source context for invoicing and financial controls., optionalMeaning: May be absent while pricing is incomplete.}
  relationships:
    - name: customer
      target: Customer
      cardinality: '1'
      ownership: reference
      help: {summary: Identifies the customer for whose account the order is placed., usage: Provides commercial, credit, billing, service, and fulfillment context., cardinalityMeaning: Exactly one customer for an executable order., context: Customer is the commercial role while Party is the underlying party identity.}
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help: {summary: Identifies the selling organization., usage: Supports legal, tax, pricing, inventory, fulfillment, and financial context., cardinalityMeaning: Optional when inherited or unresolved., workflowRole: Determines organizational responsibility for fulfillment and billing.}
    - name: lines
      target: SalesOrderLine
      cardinality: 1..*
      ownership: aggregate
      help: {summary: Contains the product or service commitments., usage: Drives allocation, fulfillment, shipment, and invoicing., cardinalityMeaning: An executable order requires at least one line., workflowRole: Line quantities establish the demand against which allocation and fulfillment are measured.}
    - name: deliveryLocation
      target: Location
      cardinality: 0..1
      ownership: reference
      help: {summary: Identifies the intended operational delivery endpoint., usage: Supports allocation, routing, shipment, and delivery planning., cardinalityMeaning: Optional until delivery is resolved., workflowRole: Supplies destination context to Shipment and fulfillment processes.}
    - name: shipments
      target: Shipment
      cardinality: 0..*
      ownership: reference
      help: {summary: Links physical shipment executions that fulfill this order., usage: Supports order-to-shipment traceability and fulfillment progress., cardinalityMeaning: An order may have multiple shipments due to partial, split, consolidated, or staged fulfillment., workflowRole: Shipment completion contributes evidence toward line and order fulfillment status.}
    - name: invoices
      target: Invoice
      cardinality: 0..*
      ownership: reference
      help: {summary: Links financial claims generated from the order or its fulfilled commitments., usage: Supports billing and order-to-cash reconciliation., cardinalityMeaning: An order may produce multiple invoices or none depending on billing policy., workflowRole: Invoicing must not be treated as proof of physical shipment or delivery.}
  invariants:
    - {id: SALES-ORDER-001, rule: orderNumber must be unique within its business numbering context.}
    - {id: SALES-ORDER-002, rule: A CONFIRMED or later order must contain at least one SalesOrderLine.}
    - {id: SALES-ORDER-003, rule: totalAmount must reconcile with applicable line amounts and adjustments.}
    - {id: SALES-ORDER-004, rule: CANCELLED orders must not create new allocation or fulfillment commitments.}
    - {id: SALES-ORDER-005, rule: FULFILLED status requires all executable line quantities to have accepted fulfillment evidence according to the applicable workflow.}
  lifecycle: {states: [DRAFT, CONFIRMED, ALLOCATED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]}
  help:
    summary: Represents the commercial customer commitment from which fulfillment and financial processes derive work.
    businessMeaning: SalesOrder establishes accepted demand; it does not itself move inventory, prove shipment, or prove payment.
    usage: Used by order management, allocation, inventory, warehouse execution, transportation, invoicing, customer service, and revenue processes.
    relationshipContext: Customer supplies commercial context, SalesOrderLine supplies demand detail, InventoryBalance/InventoryMovement supply stock execution, Shipment supplies physical transport evidence, and Invoice supplies financial claim evidence.
    workflowContext: Confirmed order → availability check → reservation/allocation → pick/issue → Shipment → delivery evidence → order fulfillment. Invoice may be generated according to billing policy and is independent evidence from shipment. Cancellation terminates remaining demand but must not erase historical fulfillment.
    lifecycle: Draft is editable. Confirmation creates an executable commitment. Allocation reserves supply/capacity. Partial fulfillment reflects accepted downstream fulfillment. Fulfillment closes the remaining commitment. Cancellation terminates open demand.
    example: A customer orders 20 containers. After confirmation, 12 are allocated and shipped first, making the order PARTIALLY_FULFILLED. A second shipment fulfills the remaining 8, after which the order becomes FULFILLED. Invoices may be issued per shipment or according to another billing policy.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-SALES-ORDER}
