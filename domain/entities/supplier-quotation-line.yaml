entity:
  name: SupplierQuotationLine
  namespace: cedm.domain
  kind: sourcing_response_line
  description: A supplier's line-level commercial offer for one RequestForQuotationLine, preserving offered quantity, price, delivery and award evidence before purchase commitment.
  ui:
    icon: factory
  identity: {key: supplierQuotationLineId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: supplierQuotationLineId, type: uuid, required: true, immutable: true, help: {summary: "The internal key that purchase order lines use to trace back to the offer they came from.", businessMeaning: Identifies one commercial response independently of header and order conversion., usage: "Comparison, negotiation, award, and audit.", relationshipContext: Connects an RFQ requirement to resulting order lines., requiredMeaning: Required.}}
  - {name: lineNumber, type: integer, required: true, minimum: 1, help: {summary: "The position of this offer on the supplier's quotation, matching how the supplier numbered it.", businessMeaning: Human-facing offer-line reference., usage: Comparison and supplier communication., relationshipContext: Unique within SupplierQuotation., requiredMeaning: Required.}}
  - {name: offeredQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: "How much of the requested item the supplier is offering to deliver.", businessMeaning: States supply coverage for the RFQ requirement., usage: Award allocation and order conversion., relationshipContext: Interpreted using UnitOfMeasure., requiredMeaning: Required.}}
  - {name: unitPrice, type: Money, required: true, help: {summary: "The price the supplier quotes for each unit, used to compare offers and set the order price.", businessMeaning: Preserves the supplier's commercial offer for comparison and later verification., usage: "Bid analysis, negotiation, award, and purchase-order pricing.", relationshipContext: Historical offer evidence rather than mutable supplier master pricing., requiredMeaning: Required.}}
  - {name: promisedDate, type: date, required: false, help: {summary: "The date the supplier promises to deliver the offered quantity by.", businessMeaning: Records the delivery promise used during award evaluation., usage: Lead-time comparison and order conversion., relationshipContext: Distinct from actual receipt date., optionalMeaning: Optional when no date is offered.}}
  - name: awardStatus
    type: enum
    required: true
    default: PENDING
    values: [PENDING, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]
    help: {summary: "Shows whether the offer is still pending, was accepted in full, accepted in part, or rejected.", businessMeaning: Records whether and to what extent this response was selected., usage: Award workflow and split sourcing., relationshipContext: Selection authorizes conversion but does not itself create a PurchaseOrderLine., valueSemantics: {PENDING: Not yet decided., ACCEPTED: Selected for the governed quantity., PARTIALLY_ACCEPTED: Selected for part of offered quantity., REJECTED: Not selected.}, requiredMeaning: Required.}
  relationships:
  - {name: supplierQuotation, target: SupplierQuotation, cardinality: "1", ownership: reference, inverse: lines, help: {summary: Parent supplier offer., businessMeaning: "Supplies supplier, validity, and response lifecycle.", usage: Sourcing governance and audit., cardinalityMeaning: Exactly one parent quotation., workflowRole: Controls offer eligibility.}}
  - {name: requestForQuotationLine, target: RequestForQuotationLine, cardinality: '1', ownership: reference, help: {summary: Exact sourcing requirement answered., businessMeaning: Enables like-for-like line comparison., usage: Award analysis and traceability., cardinalityMeaning: Exactly one RFQ line is answered., workflowRole: Supplies requested product and quantity context.}}
  - {name: product, target: Product, cardinality: 0..1, ownership: reference, help: {summary: Product offered., businessMeaning: Confirms or proposes the item satisfying the requirement., usage: Technical/commercial comparison., cardinalityMeaning: Optional for service/free-text requirements., workflowRole: Must satisfy approved substitution policy.}}
  - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: 0..1, ownership: reference, help: {summary: Unit qualifying offered quantity and price., businessMeaning: Makes offer quantities commercially comparable., usage: Normalization and order conversion., cardinalityMeaning: Optional only where unambiguous., workflowRole: Conversion must use governed UOM rules.}}
  - {name: purchaseOrderLines, target: PurchaseOrderLine, cardinality: 0..*, ownership: reference, help: {summary: Purchase commitments created from this awarded offer line., businessMeaning: Preserves offer-to-order-line provenance., usage: Commercial verification and audit., cardinalityMeaning: Split awards may produce multiple order lines., workflowRole: PurchaseOrderLine executes approved commitment.}}
  invariants:
  - {id: SUPPLIER-QUOTATION-LINE-001, rule: offeredQuantity must be greater than zero.}
  - {id: SUPPLIER-QUOTATION-LINE-002, rule: lineNumber must be unique within SupplierQuotation.}
  - {id: SUPPLIER-QUOTATION-LINE-003, rule: Product and UOM must be compatible with RequestForQuotationLine or governed substitution/conversion evidence must exist.}
  - {id: SUPPLIER-QUOTATION-LINE-004, rule: Accepted quantity across resulting PurchaseOrderLines must not exceed the governed awarded quantity except by authorized amendment.}
  - {id: SUPPLIER-QUOTATION-LINE-005, rule: "Historical offered price, quantity and delivery promise must not be silently rewritten after evaluation."}
  - {id: SUPPLIER-QUOTATION-LINE-EXE-001, rule: "Offered Quantity cannot be negative.", violatedWhen: "offered_quantity != null and offered_quantity < 0", message: "Offered Quantity cannot be negative."}
  - {id: SUPPLIER-QUOTATION-LINE-EXE-002, rule: "Unit Price cannot be negative.", violatedWhen: "unit_price != null and unit_price < 0", message: "Unit Price cannot be negative."}
  help:
    summary: "One priced offer from a supplier answering a single requested item, stating how much they can supply, at what unit price and by when, and whether it was awarded."
    businessMeaning: SupplierQuotationLine is commercial evidence, while PurchaseOrderLine is the binding procurement commitment.
    usage: Bid comparison, negotiation, split award, purchase-order generation, compliance, and audit.
    relationshipContext: Answers RequestForQuotationLine and may produce one or more PurchaseOrderLines.
    lifecycle: Received → evaluated → accepted/partially accepted/rejected → retained as sourcing evidence.
    changePropagation: Offer or award changes revalidate downstream unissued commitments; issued commitments require controlled amendments.
    workflowContext: "The buyer records the line when the supplier's quotation arrives, compares it with other suppliers' offers for the same requested item, marks it accepted, partly accepted or rejected when awarding, and accepted offers are turned into purchase order lines."
    example: "Line 2 of Medisupply quotation SQ-8812: 500 boxes of nitrile gloves at 6.40 GBP per box, promised for 14 November 2026, accepted."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SUPPLIER-QUOTATION-LINE}
