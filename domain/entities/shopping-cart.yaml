entity:
  name: ShoppingCart
  namespace: cedm.domain
  kind: ecommerce_entity
  description: A temporary collection of products selected by a customer or shopper before checkout.
  ui:
    icon: table
  identity:
    key: shoppingCartId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: shoppingCartId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the shopping cart record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a shopping cart store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - CHECKED_OUT
    - ABANDONED
    - EXPIRED
    help:
      summary: Where the cart stands.
      usage: Moved on by checkout and by inactivity.
      relationshipContext: Only active carts accept changes.
      valueSemantics:
        ACTIVE: The shopper is adding or changing items.
        CHECKED_OUT: Turned into an order.
        ABANDONED: Left without checkout for longer than the inactivity period.
        EXPIRED: Too old to recover; kept only for analysis.
  - name: createdAt
    type: datetime
    required: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating ShoppingCart records, where applicable.
      relationshipContext: Its meaning is specific to ShoppingCart; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: expiresAt
    type: datetime
    required: false
    help:
      summary: When the cart will expire if nothing happens.
      usage: Set from the shop's retention policy and moved on by activity.
      relationshipContext: Expired carts can no longer be checked out.
  - name: sessionReference
    type: string
    required: false
    maxLength: 100
    help:
      summary: The shop session the cart belongs to, for shoppers not signed in.
      usage: Lets a guest find their cart again.
      relationshipContext: Replaced by the customer once they sign in.
  - name: lastActivityAt
    type: datetime
    required: false
    help:
      summary: When the shopper last changed the cart.
      usage: Abandonment is measured from it.
      relationshipContext: Updated on every change.
  - name: totalAmount
    type: Money
    required: false
    help:
      summary: The total of the cart's lines.
      usage: Shown to the shopper and used in abandoned-cart reports.
      relationshipContext: Recalculated at checkout.
  relationships:
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer who owns the cart, once signed in.
      usage: Set when the shopper signs in.
      cardinalityMeaning: At most one customer per cart.
      context: Guests' carts have none until they sign in.
  - name: lines
    target: ShoppingCartLine
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The products in the cart.
      usage: Added and changed by the shopper.
      cardinalityMeaning: A cart may be empty or hold many lines.
      context: Each line belongs to one cart.
  - name: salesOrder
    target: SalesOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: The order the cart became at checkout.
      usage: Set at checkout.
      cardinalityMeaning: At most one.
      context: Present once checked out.
  invariants:
  - id: CART-001
    rule: a CHECKED_OUT cart cannot be modified.
  - {id: SHOPPING-CART-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Shopping Cart Lifecycle
    attribute: status
    states: [ACTIVE, CHECKED_OUT, ABANDONED, EXPIRED]
    initial: ACTIVE
    terminal: [CHECKED_OUT, EXPIRED]
    transitions:
    - {from: ACTIVE, to: CHECKED_OUT, action: check_out}
    - {from: ACTIVE, to: ABANDONED, action: abandon}
    - {from: ABANDONED, to: ACTIVE, action: reactivate}
    - {from: ABANDONED, to: EXPIRED, action: expire}
    - {from: ACTIVE, to: EXPIRED, action: expire}
  help:
    summary: Represents a ecommerce entity called ShoppingCart within the CEDM business model.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, ShoppingCartLine. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: A cart holds what a shopper intends to buy before they commit. Keeping carts lets shoppers come back to them, lets the shop recover abandoned carts with a reminder, and shows which products are considered but not bought.
    usage: Created when a shopper adds a first product; updated as they shop; converted into an order at checkout; marked abandoned after inactivity and expired after the retention period.
    lifecycle: Active while the shopper is shopping; checked out when it becomes an order; abandoned after a period without activity (and reactivated if the shopper returns); expired when it is too old to recover.
    example: Cart for guest session 7f21…, 3 lines, 84.90 EUR, last activity 2 June 21:14; abandoned 3 June; reminder email sent; checked out 4 June as order WEB-2024-55120.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SHOPPING-CART
