entity:
  name: Timesheet
  namespace: cedm.domain
  kind: professional_services_transaction
  description: A governed record of time reported for work performed by a person against an engagement, project, task, or other accountable context.
  ui:
    icon: clock
  identity:
    key: timesheetId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: timesheetId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent identifier of the timesheet, unchanged however its hours or status are edited.
        usage: Generated by the system on creation; project costs and invoice lines point back to it to show which time record they came from.
        businessMeaning: Lets costs and invoices point at the exact time record they came from.
        relationshipContext: Referenced by project costs.
    - name: timesheetCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The code of the timesheet, such as TS-2026-0311.
        businessMeaning: Gives approvers and billing a reference to quote.
        usage: Unique; used on approvals and invoices.
        relationshipContext: Read with the engagement.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the timesheet is in approval.
        businessMeaning: Shows whether time can still be changed and whether it can be billed.
        usage: Starts as DRAFT; moved by the person and the approver.
        relationshipContext: Only completed timesheets feed billing.
        valueSemantics:
          DRAFT: Being entered; can be changed.
          ACTIVE: Submitted and awaiting approval.
          COMPLETED: Approved and used for billing and cost. A final state.
          CANCELLED: Discarded. A final state.
  relationships:
    - name: context
      target: ProfessionalEngagement
      cardinality: '1'
      ownership: reference
      help:
        summary: The engagement the time is booked against.
        usage: Chosen when the timesheet is created.
        cardinalityMeaning: Exactly one engagement; time for two engagements is booked on two timesheets.
        context: Decides which client is billed and which budget carries the cost.
    - name: projectCosts
      target: ProjectCost
      cardinality: 0..*
      ownership: reference
      help:
        summary: Labor cost evidence derived from or reconciled to this Timesheet.
        businessMeaning: Keeps reported time separate from monetary cost attribution while preserving provenance.
        usage: Labor costing, project profitability, billing and audit.
        cardinalityMeaning: Zero or many ProjectCost records may derive from a Timesheet under governed allocation policy.
        workflowRole: Cost generation must be idempotent and based on eligible approved or completed time evidence.

  invariants:
    - id: TIMESHEET-001
      rule: The governing ProfessionalEngagement relationship is required and must reference a valid record.
    - id: TIMESHEET-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: TIMESHEET-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Timesheet Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a timesheet is ended"
      description: "When a timesheet is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TIMESHEET-FOLLOW-UP-{{id}}"
              name: "Follow up on timesheet {{id}}"
              description: "Timesheet {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a timesheet is done"
      description: "When a timesheet is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TIMESHEET-COMPLETED-{{id}}"
              name: "Confirm timesheet {{id}}"
              description: "Timesheet {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A record of time reported for work done by a person against an engagement or other accountable context.
    businessMeaning: A timesheet is how worked time becomes billable and costed. It ties hours to an engagement, can be reviewed before it is accepted, and is the source of labour cost and billing.
    usage: Entered by the person who did the work; approved by a manager; read by billing and project cost.
    relationshipContext: A timesheet is booked against one engagement and gives rise to project costs.
    lifecycle: A timesheet is drafted, active once submitted for approval and completed once approved and used. It may be cancelled before that. Completed and cancelled are final.
    example: Timesheet TS-2026-0311 records 38 hours on engagement ENG-2026-014 for the week of 9 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TIMESHEET
