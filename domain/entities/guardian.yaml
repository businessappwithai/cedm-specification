entity:
  name: Guardian
  namespace: cedm.domain
  kind: education_guardian_role
  description: A governed relationship role held by a Party who is authorized or expected to act for, support, receive communications about, or hold responsibility for one or more EducationStudents.
  ui: {icon: users-round}
  identity: {key: guardianId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: guardianId, type: uuid, required: true, immutable: true, help: {summary: "The permanent identity of this guardian role, which student records and consents point to.", businessMeaning: Identifies one governed education guardian relationship independently of the underlying Party., usage: "Student administration, communication, consent, billing and audit.", relationshipContext: Party supplies common identity; Guardian supplies education-specific responsibility., requiredMeaning: Required.}}
    - {name: guardianCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: "The reference school staff use for this guardian, such as G-20418, on forms and correspondence.", businessMeaning: Operational identifier used in education administration., usage: "Search, communication and integration.", relationshipContext: Distinct from Party identifiers., requiredMeaning: Required.}}
    - name: relationshipType
      type: enum
      required: true
      values: [PARENT, LEGAL_GUARDIAN, CAREGIVER, SPONSOR, OTHER]
      help:
        summary: Education relationship of the guardian to supported students.
        businessMeaning: Guides communication, authorization and responsibility policy.
        usage: Student administration, consent and reporting.
        relationshipContext: Does not replace legal evidence required by local policy.
        valueSemantics:
          PARENT: Parent relationship.
          LEGAL_GUARDIAN: Legally recognized guardian relationship.
          CAREGIVER: Caregiver relationship recognized by policy.
          SPONSOR: Financial or administrative sponsor relationship.
          OTHER: Another governed guardian relationship.
        requiredMeaning: Required.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, INACTIVE]
      help: {summary: Whether the guardian role is currently active for ordinary education processes., businessMeaning: Controls current use without deleting historical communications or authorizations., usage: "Student administration and audit.", relationshipContext: Student-specific relationship validity may be narrower than overall guardian status., valueSemantics: {ACTIVE: Role may be used under applicable policy., INACTIVE: Role is no longer ordinarily used for new actions.}, requiredMeaning: Required.}
  relationships:
    - {name: party, target: Party, cardinality: "1", ownership: reference, help: {summary: Party holding the guardian role., businessMeaning: Reuses common identity and contact data without duplication., usage: "Communication, authorization and audit.", cardinalityMeaning: Exactly one Party., workflowRole: Party identity changes do not rewrite historical guardian evidence.}}
    - {name: students, target: EducationStudent, cardinality: "1..*", ownership: reference, help: {summary: Students for whom this guardian relationship applies., businessMeaning: Establishes education responsibility or communication scope., usage: "Student administration, consent, billing and communication.", cardinalityMeaning: One or more students are associated with a Guardian role., workflowRole: Student-specific authority must be evaluated according to current policy.}}
  invariants:
    - {id: GUARDIAN-001, rule: A Guardian must reference a valid Party and at least one EducationStudent.}
    - {id: GUARDIAN-002, rule: "Historical consent, communication or financial evidence is not rewritten merely because guardian status later becomes INACTIVE."}
  help:
    summary: "One person's role as guardian of one or more students, recording that they may act for, be contacted about or hold responsibility for those students without duplicating the person's own identity details."
    businessMeaning: Guardian defines responsibility and communication context for students; EducationStudent remains the learner identity.
    usage: Student information systems, school communication, consent, billing, emergency contact workflows and audit.
    relationshipContext: Party is mandatory and one Guardian may support multiple EducationStudents.
    lifecycle: Guardian role is active or inactive while historical evidence remains attributable.
    example: One parent Party has a Guardian role for two students and receives authorized school communications for each.
    workflowContext: "Created during student enrolment or when family circumstances change, linked to each student the person is responsible for, used by school administration for consent, communications, pick-up authorisation and billing, and made inactive when the relationship ends while past consents and communications remain attributable."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-GUARDIAN}
