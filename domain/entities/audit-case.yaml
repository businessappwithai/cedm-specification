    whenUsed: Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable.
    howItRelates: Connects authoritative business records to controlled lifecycle, evidence, findings, and downstream remediation without replacing source transactions.
    lifecycleUsage: Created under governance, reviewed or finalized where applicable, and retained or superseded with history preserved.
    commonProcesses: Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation.
    commonExamples: Enterprise agreements, controlled records, audit evidence, compliance findings, and lifecycle changes.
