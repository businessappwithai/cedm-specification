entity:
  name: ProjectPhase
  namespace: cedm.domain
  kind: project_structure
  description: A governed stage of a Project used to group milestones, tasks, resources, costs, and delivery controls within a defined portion of the project lifecycle.
  ui:
    icon: folder-kanban
    recordLabel: [name]
  identity: {key: projectPhaseId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: projectPhaseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the project phase record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a project phase store this identifier. The number or code people quote is a separate field.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name of the phase, such as "Design" or "Commissioning".
      businessMeaning: Communicates project stage.
      usage: Shown on the project plan.
      relationshipContext: Unique within its project.
  - name: status
    type: enum
    required: true
    values: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    help:
      summary: Where the phase stands.
      businessMeaning: Controls phase execution.
      usage: Moved on by the project manager.
      relationshipContext: A phase is completed only when its gate criteria are met.
      valueSemantics:
        PLANNED: Not yet started.
        ACTIVE: In progress.
        COMPLETED: Finished and passed its gate.
        CANCELLED: Dropped from the project.
  - name: sequence
    type: integer
    required: true
    help:
      summary: The order of the phase in the project.
      usage: Phases are shown and run in this order.
      relationshipContext: Unique within the project.
  - name: plannedStart
    type: date
    required: false
    help:
      summary: When the phase is planned to start.
      usage: Set in the project plan.
      relationshipContext: Not later than the planned end.
  - name: plannedEnd
    type: date
    required: false
    help:
      summary: When the phase is planned to end.
      usage: Set in the project plan.
      relationshipContext: Delays are measured against it.
  - name: actualStart
    type: date
    required: false
    help:
      summary: When the phase actually started.
      usage: Recorded when it starts.
      relationshipContext: Present once active.
  - name: actualEnd
    type: date
    required: false
    help:
      summary: When the phase actually finished.
      usage: Recorded when it is completed.
      relationshipContext: Present once completed.
  - name: budget
    type: Money
    required: false
    help:
      summary: The budget for the phase.
      usage: Compared with the cost booked to its tasks.
      relationshipContext: In the project currency.
  - name: gateCriteria
    type: text
    required: false
    help:
      summary: What must be true to close the phase and move on.
      usage: Checked at the phase gate review.
      relationshipContext: Such as signed-off designs or passed tests.
  relationships:
  - name: project
    target: Project
    cardinality: '1'
    ownership: reference
    help:
      summary: The project the phase belongs to.
      businessMeaning: Supplies overall scope/governance.
      workflowRole: Phase cannot outlive incompatible project state.
      usage: Set when the phase is created.
      cardinalityMeaning: Every phase belongs to exactly one project.
      context: The project's plan lists its phases.
  - name: tasks
    target: ProjectTask
    cardinality: 0..*
    ownership: reference
    help:
      summary: The tasks in the phase.
      businessMeaning: Supplies executable work.
      workflowRole: Completion requires task reconciliation.
      usage: Grouped under the phase in the plan.
      cardinalityMeaning: A phase holds any number of tasks; each task is in one phase.
      context: The task records its phase.
    inverseCardinality: '1'
  - name: milestones
    target: Milestone
    cardinality: 0..*
    ownership: reference
    help:
      summary: The milestones that mark progress in the phase.
      businessMeaning: Supplies delivery checkpoints.
      workflowRole: Milestone evidence supports phase completion.
      usage: Shown on the plan.
      cardinalityMeaning: A phase has any number of milestones; each is in one phase.
      context: The milestone records its phase.
    inverseCardinality: '1'
  invariants:
  - {id: PROJECT-PHASE-001, rule: The planned end is not before the planned start., violatedWhen: planned_end != null and planned_start != null and planned_end < planned_start, message: The planned end is earlier than the planned start.}
  - {id: PROJECT-PHASE-EXE-001, rule: "Actual End must not be earlier than actual start.", violatedWhen: "actual_start != null and actual_end != null and actual_end < actual_start", message: "Actual End cannot be earlier than actual start."}
  lifecycle:
    title: Project Phase Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a project phase is ended"
    description: "When a project phase is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PROJECT-PHASE-FOLLOW-UP-{{id}}"
          name: "Follow up on project phase {{name}}"
          description: "Project phase {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Governed project lifecycle stage.
    businessMeaning: Groups project execution into manageable stages without replacing tasks or milestones.
    usage: "Project planning, delivery, resources and costing."
    relationshipContext: "Project owns context; ProjectTask and Milestone provide execution evidence."
    example: Phase 2 'Build and test' of project WMS-2024, 1 April–31 August 2024, budget 210,000 EUR, active.
    lifecycle: A phase is planned, active while its work is done, and completed; a planned or active phase may be cancelled.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROJECT-PHASE}
