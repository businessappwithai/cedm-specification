entity:
  name: HandlingUnit
  namespace: cedm.domain
  kind: warehouse_logistics_master
  description: A uniquely identifiable physical logistics unit such as pallet, carton, tote, cage, or containerized package that groups inventory for warehouse and shipment handling.
  ui:
    icon: database
  identity: {key: handlingUnitId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: handlingUnitId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identity of the handling unit, kept as it moves between locations and shipments.', usage: 'Generated on creation; inventory, picking, packing and shipment records refer to the unit by this value.', businessMeaning: Identifies one physical logistics unit independently of label changes., relationshipContext: May contain product/lot/serial inventory and nested handling units.}}
    - {name: handlingUnitNumber, type: string, required: true, unique: true, maxLength: 150, help: {summary: "The scannable number on the unit's label, such as a pallet licence plate, by which warehouse staff identify it.", usage: 'Unique; printed on the label at creation and scanned during putaway, picking, staging and loading.', businessMeaning: Label/barcode identifier used in physical execution., relationshipContext: Distinct from Shipment or inventory movement number.}}
    - name: type
      type: enum
      required: true
      values: [PALLET, CARTON, TOTE, CAGE, DRUM, PACKAGE, OTHER]
      help:
        summary: The physical form of the unit, such as a pallet or carton, which fixes its size and handling equipment.
        usage: Chosen when the unit is created; capacity, equipment, packing and carrier planning read it.
        valueSemantics:
          PALLET: A palletised load moved by forklift or pallet truck.
          CARTON: A cardboard box or case holding items for storage or shipment.
          TOTE: A reusable bin or tote used for picking and internal movement.
          CAGE: A roll cage or similar wheeled frame used to move mixed goods.
          DRUM: A cylindrical drum or barrel holding liquids or bulk material.
          PACKAGE: A general parcel that is none of the other forms.
          OTHER: A governed unit type not covered by the listed forms.
        businessMeaning: Describes packaging/handling form.
        relationshipContext: Does not determine contents by itself.
    - name: grossWeightKg
      type: decimal
      required: false
      precision: 12
      scale: 3
      help:
        summary: The weight of the unit with its contents, in kilograms.
        usage: Weighed or computed at packing; used for loading and freight.
        relationshipContext: Includes packaging.
    - name: lengthCm
      type: decimal
      required: false
      precision: 8
      scale: 1
      help:
        summary: The length of the unit, in centimetres.
        usage: Used for loading plans and volumetric freight.
        relationshipContext: Measured or taken from the packaging type.
    - name: widthCm
      type: decimal
      required: false
      precision: 8
      scale: 1
      help:
        summary: The width of the unit, in centimetres.
        usage: Used for loading plans and volumetric freight.
        relationshipContext: Measured or taken from the packaging type.
    - name: heightCm
      type: decimal
      required: false
      precision: 8
      scale: 1
      help:
        summary: The height of the packed unit, in centimetres, including any pallet base.
        usage: Measured at packing or taken from the packaging type; used for loading plans, stacking limits and carrier quotes.
        relationshipContext: Measured or taken from the packaging type.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - CLOSED
        - SHIPPED
        - RECEIVED
        - DISMANTLED
      help:
        valueSemantics:
          OPEN: Still being filled; goods can be added.
          CLOSED: Packed and labelled, and not to be reopened without unpacking.
          SHIPPED: Has left the warehouse on its way to the destination.
          RECEIVED: Arrived at its destination and was booked in.
          DISMANTLED: Unpacked, so its contents are loose again.
        summary: Where the unit is in its use.
        usage: Moved on by packing, shipping and receiving.
        relationshipContext: A closed unit is not repacked without unpacking it.
  relationships:
    - {name: inventoryLocation, target: InventoryLocation, cardinality: "0..1", ownership: reference, help: {summary: Current warehouse location when stored., businessMeaning: Provides operational custody position., usage: "Putaway, picking and count.", cardinalityMeaning: Optional while in transit/shipped., workflowRole: Changes must reconcile to execution evidence.}}
    - {name: shipment, target: Shipment, cardinality: "0..1", ownership: reference, help: {summary: Shipment carrying the handling unit when dispatched., businessMeaning: Connects package identity to transport., usage: "Packing, loading, tracking and delivery.", cardinalityMeaning: Optional before shipment assignment., workflowRole: Shipment execution controls transit state.}}
    - {name: parentHandlingUnit, target: HandlingUnit, cardinality: 0..1, ownership: reference, help: {summary: Outer handling unit containing this unit., businessMeaning: Supports pallet/carton/tote nesting., usage: Packing and logistics hierarchy., cardinalityMeaning: At most one parent., workflowRole: Nesting must remain acyclic.}}
  invariants:
    - {id: HANDLING-UNIT-001, rule: A HandlingUnit hierarchy must be acyclic.}
    - {id: HANDLING-UNIT-002, rule: A HandlingUnit cannot simultaneously be stored at a warehouse location and confirmed as externally dispatched without governed transition evidence.}
  help:
    summary: Physical logistics identity for grouping and moving inventory.
    businessMeaning: HandlingUnit represents the package/pallet/tote being handled; InventoryMovement remains authoritative for stock quantity/location.
    usage: Receiving, putaway, replenishment, picking, packing, staging, loading, shipment and tracking.
    relationshipContext: Can occupy InventoryLocation, nest inside another HandlingUnit and join Shipment.
    lifecycle: Created/received → stored/moved → picked/packed → staged/shipped → unpacked/closed or reused.
    changePropagation: Location/shipment/nesting changes must reconcile with warehouse execution and cannot silently move underlying stock.
  lifecycle:
    title: Handling Unit Lifecycle
    attribute: status
    states:
      - OPEN
      - CLOSED
      - SHIPPED
      - RECEIVED
      - DISMANTLED
    initial: OPEN
    terminal:
      - DISMANTLED
    transitions:
      - from: OPEN
        to: CLOSED
        action: close
      - from: CLOSED
        to: OPEN
        action: reopen
      - from: CLOSED
        to: SHIPPED
        action: ship
      - from: SHIPPED
        to: RECEIVED
        action: receive
      - from: RECEIVED
        to: DISMANTLED
        action: dismantle
      - from: CLOSED
        to: DISMANTLED
        action: dismantle
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-HANDLING-UNIT}
