entity:
  name: Quotation
  namespace: cedm.domain
  kind: commercial_transaction
  description: A commercial offer specifying products, services, quantities, prices, terms, and validity.
  ui:
    icon: file-text
  identity:
    key: quotationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: quotationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the quotation, constant for its life.
        usage: Generated on creation; its lines and any resulting order refer to it.
        relationshipContext: Referenced by the quotation lines and the sales order made from it.
    - name: quotationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number printed on the quotation, such as Q-2026-0415.
        usage: Unique; quoted by the customer when accepting.
        relationshipContext: Read by sales and order entry to find the offer.
    - name: quotationDate
      type: date
      required: true
      help:
        usage: Set to the issue date; the validity period is measured from it.
        relationshipContext: Compared with the validity date.
        summary: Records the business date associated with the quotation. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
    - name: validUntil
      type: date
      required: false
      help:
        summary: The last date on which the customer may accept the offer.
        usage: Must not be before the quotation date; expired offers can no longer be accepted.
        relationshipContext: Drives expiry.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - SUBMITTED
        - ACCEPTED
        - REJECTED
        - EXPIRED
        - CANCELLED
      help:
        summary: Where the quotation stands with the customer.
        usage: Starts as DRAFT; moved by sales and by the customer's reply.
        relationshipContext: Only submitted quotations can be accepted.
        valueSemantics:
          DRAFT: Being prepared; the customer has not seen it.
          SUBMITTED: Sent to the customer and awaiting a reply.
          ACCEPTED: The customer accepted the offer. A final state.
          REJECTED: The customer declined it. A final state.
          EXPIRED: The validity date passed without a reply. A final state.
          CANCELLED: Withdrawn by the seller. A final state.
    - name: currencyId
      type: reference
      target: Currency
      required: true
      help:
        summary: The currency the offer is made in.
        usage: Chosen when the quotation is created; all line amounts are in it.
        relationshipContext: Read with the total to state the offer's value.
    - name: totalAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: The total value of the offer, the sum of its lines less discounts.
        usage: Calculated; must not be negative.
        relationshipContext: Compared with the opportunity's expected value.
  relationships:
    - name: customer
      target: Customer
      cardinality: '1'
      ownership: reference
      help:
        summary: The customer the offer is made to.
        usage: Chosen when the quotation is created.
        cardinalityMeaning: Exactly one customer; an offer is addressed to a single customer.
        context: Decides who may accept it and who is invoiced afterwards.
    - name: opportunity
      target: Opportunity
      cardinality: 0..1
      ownership: reference
      help:
        summary: The sales opportunity the quotation was prepared for.
        usage: Chosen when the offer follows a tracked opportunity.
        cardinalityMeaning: At most one opportunity; empty for an unsolicited offer.
        context: Lets the pipeline show which quotes belong to which deal.
    - name: lines
      target: QuotationLine
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: The items offered.
        usage: Edited while drafting; read by the customer and by order entry.
        cardinalityMeaning: At least one line; a quotation with no lines offers nothing.
        context: The lines belong to the quotation and go with it.
    - name: paymentTerms
      target: PaymentTerm
      cardinality: 0..1
      ownership: reference
      help:
        summary: The payment terms offered with the quote.
        usage: Chosen from the standard terms.
        cardinalityMeaning: At most one set of terms; empty uses the customer's default.
        context: Carried to the order and invoice if accepted.
  invariants:
    - id: QUOTATION-001
      rule: validUntil must not precede quotationDate.
    - {id: QUOTATION-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Quotation Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    initial: DRAFT
    terminal:
      - ACCEPTED
      - REJECTED
      - EXPIRED
      - CANCELLED
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: ACCEPTED, action: accept}
      - {from: SUBMITTED, to: REJECTED, action: reject}
      - {from: SUBMITTED, to: EXPIRED, action: expire}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: SUBMITTED, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a quotation is put forward"
      description: "When a quotation is submitted, a task asks someone to decide on it."
      when: "status == \"SUBMITTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "QUOTATION-APPROVAL-{{id}}"
              name: "Decide on quotation {{quotation_number}}"
              description: "Quotation {{quotation_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a quotation is ended"
      description: "When a quotation is rejected or cancelled, a task asks someone to settle what depended on it."
      when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "QUOTATION-FOLLOW-UP-{{id}}"
              name: "Follow up on quotation {{quotation_number}}"
              description: "Quotation {{quotation_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A commercial offer to a customer that specifies products or services, quantities, prices, terms and how long it is valid.
    businessMeaning: A quotation lets the business commit to a price before an order exists. The customer can accept it within its validity, and the accepted lines carry over to the order so the agreed price and terms are not retyped or disputed later.
    usage: Prepared by sales; submitted to the customer; read by sales managers, finance and order entry.
    relationshipContext: A quotation is for one customer, may come from an opportunity, has one or more lines and may name payment terms.
    lifecycle: A quotation is drafted and submitted. The customer accepts it, rejects it or lets it expire, or sales cancels it. Accepted, rejected, expired and cancelled are final.
    example: Quotation Q-2026-0415 offers a customer 40 units at 18.50 each, valid until 30 November, and is accepted on 12 November.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-QUOTATION
