entity:
  name: Quotation
  namespace: cedm.domain
  kind: commercial_transaction
  description: A commercial offer specifying products, services, quantities, prices, terms, and validity.
  ui:
    icon: file-text
    recordLabel: [quotationNumber]
  identity:
    key: quotationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: quotationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the quotation record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a quotation store this identifier. The number or code people quote is a separate field.
  - name: quotationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the quotation.
      usage: Quoted by the customer when ordering.
      relationshipContext: Unique.
  - name: quotationDate
    type: date
    required: true
    help:
      summary: The date the quotation was issued.
      usage: Printed on the quotation; validity runs from it.
      relationshipContext: Not after the validity date.
  - name: validUntil
    type: date
    required: false
    help:
      summary: The last day the offer can be accepted.
      usage: The quotation expires after it.
      relationshipContext: Not before the quotation date.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - ACCEPTED
    - REJECTED
    - EXPIRED
    - CANCELLED
    help:
      summary: Where the quotation stands.
      usage: Moved on by the salesperson.
      relationshipContext: Only accepted quotations become orders.
      valueSemantics:
        DRAFT: Being prepared.
        SUBMITTED: Sent to the customer.
        ACCEPTED: Accepted by the customer.
        REJECTED: Declined by the customer.
        EXPIRED: Not accepted in time.
        CANCELLED: Withdrawn by the seller.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    help:
      summary: The currency the prices are in.
      usage: All lines use it.
      relationshipContext: Usually the customer's currency.
  - name: totalAmount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: The total value of the quotation.
      usage: Summed from the lines; shown in the pipeline.
      relationshipContext: Not negative.
  relationships:
  - name: customer
    target: Customer
    cardinality: '1'
    ownership: reference
    help:
      summary: The customer the offer is made to.
      usage: Set when drafting.
      cardinalityMeaning: Each quotation is for one customer.
      context: The customer's terms and prices apply.
  - name: opportunity
    target: Opportunity
    cardinality: 0..1
    ownership: reference
    help:
      summary: The opportunity the quotation is part of.
      usage: Linked when the quotation comes from a tracked deal.
      cardinalityMeaning: At most one opportunity.
      context: Moves the opportunity to proposal.
  - name: lines
    target: QuotationLine
    cardinality: 1..*
    ownership: aggregate
    help:
      summary: The products and services offered.
      usage: Entered when drafting.
      cardinalityMeaning: At least one line, kept with the quotation.
      context: Line items of the quotation.
  - name: paymentTerms
    target: PaymentTerm
    cardinality: 0..1
    ownership: reference
    help:
      summary: The payment terms offered.
      usage: Default from the customer.
      cardinalityMeaning: At most one set of terms.
      context: Carried to the order.
  invariants:
  - id: QUOTATION-001
    rule: validUntil must not precede quotationDate.
  - {id: QUOTATION-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Quotation Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    initial: DRAFT
    terminal: [ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    transitions:
    - {from: DRAFT, to: SUBMITTED, action: submit}
    - {from: SUBMITTED, to: ACCEPTED, action: accept}
    - {from: SUBMITTED, to: REJECTED, action: reject}
    - {from: SUBMITTED, to: EXPIRED, action: expire}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: SUBMITTED, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a quotation is put forward"
    description: "When a quotation is submitted, a task asks someone to decide on it."
    when: "status == \"SUBMITTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "QUOTATION-APPROVAL-{{id}}"
          name: "Decide on quotation {{quotation_number}}"
          description: "Quotation {{quotation_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a quotation is ended"
    description: "When a quotation is rejected or cancelled, a task asks someone to settle what depended on it."
    when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "QUOTATION-FOLLOW-UP-{{id}}"
          name: "Follow up on quotation {{quotation_number}}"
          description: "Quotation {{quotation_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A priced offer to a customer, valid until a date.
    relationshipContext: The entity participates in a wider business graph through relationships with Customer, Opportunity, QuotationLine, PaymentTerm. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Salespeople prepare quotations from the price list and the customer's terms, send them, and follow them up; an accepted quotation becomes a sales order with the same prices.
    lifecycle: A quotation is drafted, submitted to the customer, then accepted, rejected, or expires at the end of its validity; a draft or submitted quotation can be cancelled.
    example: Quotation Q-2024-0457 to Bauer GmbH, 2 April 2024, valid until 2 May 2024, 3 lines, 182,400 EUR, net 30 days, accepted.
    businessMeaning: Quotations commit the seller to prices if accepted and become sales orders; they also show what is in the pipeline.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-QUOTATION
