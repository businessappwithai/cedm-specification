entity:
  name: FuelTransaction
  namespace: cedm.domain
  kind: fleet_fuel_transaction
  description: A governed fleet transaction recording fuel or energy supplied to a Vehicle, with quantity, cost, location, driver and odometer or meter context for operational and financial control.
  ui: {icon: fuel}
  identity: {key: fuelTransactionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: fuelTransactionId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the fuel transaction, separate from the card or receipt number.', usage: Generated when the fill-up is recorded; verification and payment refer to it., businessMeaning: Identifies one refueling or energy-supply event independently of payment evidence., relationshipContext: Vehicle and quantity define operating evidence; Payment may provide financial settlement.}}
    - {name: transactionNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: The reference of the fill-up as printed on the receipt or fuel-card statement., usage: 'Entered or imported with the transaction; unique, which prevents the same fill-up being recorded twice.', businessMeaning: Operational identifier for reconciliation and integration., relationshipContext: Distinct from Payment and supplier invoice identifiers.}}
    - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: "The amount of fuel or energy supplied to the vehicle in this fill, stated in the transaction's unit of measure.", usage: 'Taken from the pump receipt or fuel-card feed; must be positive, and consumption and efficiency reports divide distance by it.', businessMeaning: Primary consumption evidence used for efficiency and cost analysis., relationshipContext: UnitOfMeasure defines quantity semantics.}}
    - {name: totalAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: "The total price paid for the fuel or energy supplied, in the transaction's currency.", usage: Taken from the receipt or card statement and must not be negative; fleet cost allocation and payment reconciliation read it., businessMeaning: Operating cost attributable to the refueling event., relationshipContext: Currency defines denomination.}}
    - {name: occurredAt, type: datetime, required: true, help: {summary: The date and time at which the vehicle was actually fuelled., usage: 'Captured from the pump or card feed rather than the entry time; efficiency, route and fraud checks compare it with vehicle movements.', businessMeaning: Establishes consumption chronology., relationshipContext: Must remain attributable to vehicle/driver state at the event time.}}
    - {name: odometerOrMeterReading, type: decimal, required: false, precision: 20, scale: 6, help: {summary: The vehicle's odometer or usage-meter reading taken at the time of fuelling., usage: Entered by the driver or read from telematics; consumption per distance and maintenance schedules depend on consecutive readings., businessMeaning: Enables fuel efficiency and anomaly analysis., relationshipContext: Unit/measurement type follows fleet policy.}}
    - name: status
      type: enum
      required: true
      default: RECORDED
      values: [RECORDED, VERIFIED, REVERSED]
      help:
        summary: Whether the fuel transaction has been checked against its evidence.
        usage: Set by fleet administration after comparing it with the receipt and vehicle data.
        valueSemantics:
          RECORDED: Captured, not yet checked.
          VERIFIED: Checked against the receipt and vehicle; costs may be allocated. A final state.
          REVERSED: Cancelled because it was wrong or duplicated; the original stays on record. A final state.
        businessMeaning: "Distinguishes captured, verified and explicitly reversed evidence."
        relationshipContext: Reversal preserves the original event rather than deleting it.
  relationships:
    - {name: vehicle, target: Vehicle, cardinality: "1", ownership: reference, help: {cardinalityMeaning: 'Exactly one vehicle: fuel is always put into a particular vehicle, which is what makes consumption trackable.', summary: Vehicle receiving the fuel or energy., businessMeaning: Establishes asset-level consumption and cost attribution., usage: "Fleet efficiency, maintenance and reporting.", workflowRole: Vehicle must be eligible at event time.}}
    - {name: driver, target: Driver, cardinality: "0..1", ownership: reference, help: {summary: Driver performing or responsible for the fueling event., businessMeaning: Supports accountability and fraud control., usage: "Fleet operations and audit.", cardinalityMeaning: Optional for unattended or centrally managed fueling., workflowRole: Driver eligibility is evaluated at transaction time.}}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Location where fueling occurred., businessMeaning: Supplies station/depot context., usage: "Cost comparison, route analysis and audit.", cardinalityMeaning: Optional when unavailable., workflowRole: Historical location remains tied to event.}}
    - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: "1", ownership: reference, help: {cardinalityMeaning: 'Exactly one unit, such as litres or kilowatt-hours, so the quantity has a meaning.', summary: Unit of fuel or energy quantity., businessMeaning: Makes consumption value unambiguous., usage: "Efficiency, reporting and integration.", workflowRole: Unit does not change after verification.}}
    - {name: currency, target: Currency, cardinality: "0..1", ownership: reference, help: {summary: Currency of totalAmount., businessMeaning: Makes financial cost unambiguous., usage: "Accounting and reporting.", cardinalityMeaning: Optional when no amount is recorded., workflowRole: Required when monetary amount is present under policy.}}
    - {name: payment, target: Payment, cardinality: "0..1", ownership: reference, help: {summary: Payment settling the fueling transaction when directly attributable., businessMeaning: Separates consumption event from cash movement., usage: "Fleet-card and accounting reconciliation.", cardinalityMeaning: Optional for invoiced or centrally settled fuel., workflowRole: Payment amount/currency must reconcile when linked.}}
  invariants:
    - {id: FUEL-001, rule: quantity must be positive.}
    - {id: FUEL-002, rule: totalAmount must be non-negative when supplied.}
    - {id: FUEL-003, rule: VERIFIED transaction is immutable evidence; corrections use reversal or follow-up transaction.}
    - {id: FUEL-004, rule: Import retries must be idempotent for the same external fuel-card or station transaction identity.}
  lifecycle:
    title: Fuel Transaction Lifecycle
    attribute: status
    states: [RECORDED, VERIFIED, REVERSED]
    initial: RECORDED
    terminal: [VERIFIED, REVERSED]
    transitions:
      - {from: RECORDED, to: VERIFIED, action: verify}
      - {from: RECORDED, to: REVERSED, action: reverse}
  help:
    summary: Preserves vehicle fuel/energy consumption and cost evidence.
    businessMeaning: FuelTransaction records the fleet event; Payment records settlement; Vehicle/Driver/Location provide operational attribution.
    usage: Fleet management, fuel cards, efficiency analytics, accounting, fraud control and audit.
    relationshipContext: Vehicle and UOM are mandatory; Driver, Location, Currency and Payment add accountability and reconciliation.
    lifecycle: Fuel transaction is recorded, then verified or reversed with history retained.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FUEL-TRANSACTION}
