entity:
  name: FuelTransaction
  namespace: cedm.domain
  kind: fleet_fuel_transaction
  description: A governed fleet transaction recording fuel or energy supplied to a Vehicle, with quantity, cost, location, driver and odometer or meter context for operational and financial control.
  ui: {icon: fuel}
  identity: {key: fuelTransactionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: fuelTransactionId, type: uuid, required: true, immutable: true, help: {summary: "The fixed reference for this fill-up, used when verifying, paying or reversing it.", businessMeaning: Identifies one refueling or energy-supply event independently of payment evidence., usage: "Fleet cost, efficiency, fraud control, accounting and audit.", relationshipContext: Vehicle and quantity define operating evidence; Payment may provide financial settlement., requiredMeaning: Required.}}
    - {name: transactionNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: "The number from the fuel card statement or receipt that identifies this fill-up.", businessMeaning: Operational identifier for reconciliation and integration., usage: "Search, card import and reporting.", relationshipContext: Distinct from Payment and supplier invoice identifiers., requiredMeaning: Required.}}
    - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: "How much fuel or energy was put into the vehicle, in the stated unit.", businessMeaning: Primary consumption evidence used for efficiency and cost analysis., usage: "Fleet analytics, inventory and audit.", relationshipContext: UnitOfMeasure defines quantity semantics., requiredMeaning: Required.}}
    - {name: totalAmount, type: decimal, required: false, precision: 20, scale: 4, help: {summary: "The total price charged for this fill-up, which feeds the vehicle's running costs.", businessMeaning: Operating cost attributable to the refueling event., usage: "Fleet cost, accounting and reconciliation.", relationshipContext: Currency defines denomination., optionalMeaning: Optional when price is unavailable or settled externally.}}
    - {name: occurredAt, type: datetime, required: true, help: {summary: "The date and time the vehicle was actually fuelled or charged at the station.", businessMeaning: Establishes consumption chronology., usage: "Efficiency, route and audit analysis.", relationshipContext: Must remain attributable to vehicle/driver state at the event time., requiredMeaning: Required.}}
    - {name: odometerOrMeterReading, type: decimal, required: false, precision: 20, scale: 6, help: {summary: Vehicle distance or usage reading captured with fueling., businessMeaning: Enables fuel efficiency and anomaly analysis., usage: "Fleet analytics and maintenance.", relationshipContext: Unit/measurement type follows fleet policy., optionalMeaning: Optional when unavailable.}}
    - name: status
      type: enum
      required: true
      default: RECORDED
      values: [RECORDED, VERIFIED, REVERSED]
      help: {summary: "Shows whether this fill-up is only recorded, has been verified, or was reversed as wrong.", businessMeaning: "Distinguishes captured, verified and explicitly reversed evidence.", usage: Reconciliation and audit., relationshipContext: Reversal preserves the original event rather than deleting it., valueSemantics: {RECORDED: Transaction was captured., VERIFIED: Transaction passed applicable checks., REVERSED: Economic/operational effect was explicitly reversed.}, requiredMeaning: Required.}
  relationships:
    - {name: vehicle, target: Vehicle, cardinality: "1", ownership: reference, help: {summary: Vehicle receiving the fuel or energy., businessMeaning: Establishes asset-level consumption and cost attribution., usage: "Fleet efficiency, maintenance and reporting.", cardinalityMeaning: Exactly one Vehicle., workflowRole: Vehicle must be eligible at event time.}}
    - {name: driver, target: Driver, cardinality: "0..1", ownership: reference, help: {summary: Driver performing or responsible for the fueling event., businessMeaning: Supports accountability and fraud control., usage: "Fleet operations and audit.", cardinalityMeaning: Optional for unattended or centrally managed fueling., workflowRole: Driver eligibility is evaluated at transaction time.}}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Location where fueling occurred., businessMeaning: Supplies station/depot context., usage: "Cost comparison, route analysis and audit.", cardinalityMeaning: Optional when unavailable., workflowRole: Historical location remains tied to event.}}
    - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: "1", ownership: reference, help: {summary: Unit of fuel or energy quantity., businessMeaning: Makes consumption value unambiguous., usage: "Efficiency, reporting and integration.", cardinalityMeaning: Exactly one UnitOfMeasure., workflowRole: Unit does not change after verification.}}
    - {name: currency, target: Currency, cardinality: "0..1", ownership: reference, help: {summary: Currency of totalAmount., businessMeaning: Makes financial cost unambiguous., usage: "Accounting and reporting.", cardinalityMeaning: Optional when no amount is recorded., workflowRole: Required when monetary amount is present under policy.}}
    - {name: payment, target: Payment, cardinality: "0..1", ownership: reference, help: {summary: Payment settling the fueling transaction when directly attributable., businessMeaning: Separates consumption event from cash movement., usage: "Fleet-card and accounting reconciliation.", cardinalityMeaning: Optional for invoiced or centrally settled fuel., workflowRole: Payment amount/currency must reconcile when linked.}}
  invariants:
    - {id: FUEL-001, rule: quantity must be positive.}
    - {id: FUEL-002, rule: totalAmount must be non-negative when supplied.}
    - {id: FUEL-003, rule: VERIFIED transaction is immutable evidence; corrections use reversal or follow-up transaction.}
    - {id: FUEL-004, rule: Import retries must be idempotent for the same external fuel-card or station transaction identity.}
  lifecycle:
    title: Fuel Transaction Lifecycle
    attribute: status
    states: [RECORDED, VERIFIED, REVERSED]
    initial: RECORDED
    terminal: [VERIFIED, REVERSED]
    transitions:
      - {from: RECORDED, to: VERIFIED, action: verify}
      - {from: RECORDED, to: REVERSED, action: reverse}
  help:
    summary: "One fill-up or energy charge supplied to a fleet vehicle, recording how much was taken, what it cost, where and when, and by which driver, for fuel cost control and fraud checks."
    businessMeaning: FuelTransaction records the fleet event; Payment records settlement; Vehicle/Driver/Location provide operational attribution.
    usage: Fleet management, fuel cards, efficiency analytics, accounting, fraud control and audit.
    relationshipContext: Vehicle and UOM are mandatory; Driver, Location, Currency and Payment add accountability and reconciliation.
    lifecycle: Fuel transaction is recorded, then verified or reversed with history retained.
    workflowContext: "The transaction is recorded from a fuel card feed or a driver's entry, fleet administrators verify it against the vehicle, driver and odometer reading, and verified transactions feed cost reporting and payment; an incorrect one is reversed rather than edited."
    example: "Transaction FT-2026-004512: 62.5 litres of diesel for van KX-21-PLM at a highway station on 3 March 2026 at 07:42, costing 98.13 EUR, odometer 84,210 km, status VERIFIED."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FUEL-TRANSACTION}
