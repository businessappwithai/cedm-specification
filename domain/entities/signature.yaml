entity:
  name: Signature
  namespace: cedm.domain
  kind: document_signature
  description: The record that a named person signed a specific document version — electronically or on paper — with when, how, in what capacity, and the evidence that proves it.
  ui:
    icon: pen-tool
    recordLabel: [signatoryName, signedAt]
  identity: {key: signatureId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: signatureId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the signature record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a signature store this identifier. The number or code people quote is a separate field.
  - name: signatoryName
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name of the person who signs, as on the signature.
      usage: Recorded when the signature is requested; kept even if the person's record changes later.
      relationshipContext: Must match the identity the signing method verified.
  - name: signatoryCapacity
    type: string
    required: false
    maxLength: 150
    help:
      summary: The capacity in which the person signs, such as "Managing Director" or "Witness".
      usage: Printed under the signature and checked against the person's authority to sign.
      relationshipContext: Signing for a company needs the authority to bind it.
  - name: sequence
    type: integer
    required: true
    default: 1
    help:
      summary: The order in which this signer signs, when there are several.
      usage: Signers are asked in order; the next is asked only after the previous has signed.
      relationshipContext: Signers with the same number may sign in any order.
  - name: method
    type: enum
    required: true
    default: ELECTRONIC
    values: [WET_INK, ELECTRONIC, ADVANCED_ELECTRONIC, QUALIFIED_ELECTRONIC]
    help:
      summary: How the signature is given.
      usage: Chosen when requesting it; it decides how strong the evidence is in law.
      relationshipContext: Some documents require a qualified electronic signature or a wet signature.
      valueSemantics:
        WET_INK: Signed by hand on paper; the scan is the evidence.
        ELECTRONIC: A simple electronic signature through an e-signature service.
        ADVANCED_ELECTRONIC: An advanced electronic signature uniquely linked to the signer.
        QUALIFIED_ELECTRONIC: A qualified electronic signature with the legal effect of a handwritten one.
  - name: documentHash
    type: string
    required: false
    maxLength: 128
    help:
      summary: The fingerprint (SHA-256) of the exact document version signed.
      usage: Recorded at signature; recomputing it shows whether the document has changed since.
      relationshipContext: A change of one character changes the fingerprint.
  - name: requestedAt
    type: datetime
    required: true
    help:
      summary: When the signature was asked for.
      usage: Recorded when the document is sent.
      relationshipContext: Requests expire after the configured period.
  - name: signedAt
    type: datetime
    required: false
    help:
      summary: When the person signed.
      usage: Recorded from the signing service or the dated paper signature.
      relationshipContext: Present once signed.
  - name: evidenceReference
    type: string
    required: false
    maxLength: 200
    help:
      summary: The identifier of the signing service's evidence (audit trail, certificate) for the signature.
      usage: Kept to prove the signature if it is ever disputed.
      relationshipContext: Issued by the e-signature provider.
  - name: declineReason
    type: string
    required: false
    maxLength: 500
    help:
      summary: Why the signer declined.
      usage: Recorded when they decline, so the document can be corrected.
      relationshipContext: Present only on declined signatures.
  - name: status
    type: enum
    required: true
    default: REQUESTED
    values: [REQUESTED, SIGNED, DECLINED, EXPIRED, REVOKED]
    help:
      summary: Whether the signature has been given.
      usage: Moved on by the signer or the signing service.
      relationshipContext: Only signed signatures count towards execution of the document.
      valueSemantics:
        REQUESTED: Sent to the signer; not yet acted on.
        SIGNED: Signed.
        DECLINED: The signer refused to sign.
        EXPIRED: Not acted on in time.
        REVOKED: Withdrawn by the sender.
  relationships:
  - name: document
    target: Document
    cardinality: '1'
    ownership: reference
    help:
      summary: The document signed.
      usage: Set when the signature is requested.
      cardinalityMeaning: Every signature is on exactly one document.
      context: The document is executed once every required signature is signed.
  - name: signatory
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person who signs.
      usage: Chosen when requesting the signature.
      cardinalityMeaning: One per signature.
      context: Their name is also copied onto the signature.
  - name: onBehalfOf
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization the person signs for.
      usage: Set when the person signs as a representative.
      cardinalityMeaning: At most one.
      context: The person must have authority to bind it.
  invariants:
  - {id: SIGNATURE-001, rule: 'A signature, once given, is never changed; a re-signature is a new signature.'}
  - {id: SIGNATURE-002, rule: A signed signature records when it was signed., violatedWhen: status == "SIGNED" and signed_at == null, message: Record when the document was signed.}
  - {id: SIGNATURE-003, rule: A signature is not given before it was requested., violatedWhen: signed_at != null and requested_at != null and signed_at < requested_at, message: The signature is earlier than the request.}
  lifecycle:
    title: Signature Lifecycle
    attribute: status
    states: [REQUESTED, SIGNED, DECLINED, EXPIRED, REVOKED]
    initial: REQUESTED
    terminal: [SIGNED, DECLINED, EXPIRED, REVOKED]
    transitions:
    - {from: REQUESTED, to: SIGNED, action: sign}
    - {from: REQUESTED, to: DECLINED, action: decline}
    - {from: REQUESTED, to: EXPIRED, action: expire}
    - {from: REQUESTED, to: REVOKED, action: revoke}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a signature is put forward"
    description: "When a signature is requested, a task asks someone to decide on it."
    when: "status == \"REQUESTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "SIGNATURE-APPROVAL-{{id}}"
          name: "Decide on signature {{id}}"
          description: "Signature {{id}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: One person's signature on one document, with the proof that it was given.
    businessMeaning: A signature binds a person or the company they represent to a document. It is only worth something if it can later be shown who signed which version, when, in what capacity, by what method and that the document has not changed since. The signature record keeps exactly that evidence.
    usage: Created when a document is sent for signature and completed when the signer signs or declines. Contract managers follow outstanding signatures; legal and auditors rely on completed ones as proof.
    relationshipContext: A signature is on one Document (in one version, fixed by its content hash) and is given by a Person, possibly on behalf of an Organization. A document needing several signatures has one signature record per signer, ordered by their sequence.
    lifecycle: Requested when the document is sent, then signed or declined by the signer. A request may expire if not acted on, or be revoked by the sender. A signed signature is final.
    workflowContext: Contract execution, approvals with wet or electronic signatures, HR documents, delivery acknowledgements.
    example: Signature by Jean Martin, Managing Director, for ACME France SAS, on 'MSA – Contoso – v4' (SHA-256 9b1e…), qualified electronic signature via the e-signature provider, signed 12 February 2024 15:22 CET, sequence 2 of 2.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SIGNATURE}
