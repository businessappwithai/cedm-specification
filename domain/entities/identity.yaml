entity:
  name: Identity
  namespace: cedm.domain
  kind: security_identity_entity
  description: An authentication identity or credential-bearing representation associated with a user or principal.
  ui:
    icon: table
    recordLabel: [identityType, externalSubject]
  identity:
    key: identityId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: identityId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the identity record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a identity store this identifier. The number or code people quote is a separate field.
  - name: identityType
    type: enum
    required: true
    values:
    - PASSWORD
    - SSO
    - OAUTH
    - API_KEY
    - CERTIFICATE
    - BIOMETRIC
    - OTHER
    help:
      summary: How the user authenticates with this identity.
      usage: Decides how sign-in is verified.
      relationshipContext: A user may hold several identities of different types.
      valueSemantics:
        PASSWORD: A user name and password.
        SSO: Single sign-on through the organisation's identity provider.
        OAUTH: An account at an external OAuth provider.
        API_KEY: A key used by a program.
        CERTIFICATE: A client certificate.
        BIOMETRIC: A fingerprint, face or other biometric.
        OTHER: Any other method.
  - name: externalSubject
    type: string
    required: false
    maxLength: 500
    help:
      summary: The user's identifier at the external provider.
      usage: Matched on sign-in to find the user.
      relationshipContext: Empty for passwords and API keys.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - SUSPENDED
    - REVOKED
    - EXPIRED
    help:
      summary: Whether the identity can be used.
      usage: Changed by security administrators or on expiry.
      relationshipContext: Only active identities can sign in.
      valueSemantics:
        ACTIVE: Can be used.
        SUSPENDED: Temporarily blocked.
        REVOKED: Withdrawn for good.
        EXPIRED: Past its validity.
  - name: issuedAt
    type: datetime
    required: false
    help:
      summary: When the identity or credential was issued.
      usage: Shown in access reviews.
      relationshipContext: Not after its expiry.
  - name: expiresAt
    type: datetime
    required: false
    help:
      summary: When the identity stops being valid.
      usage: Sign-in is refused after it.
      relationshipContext: Empty for identities that do not expire.
  relationships:
  - name: user
    target: User
    cardinality: '1'
    ownership: reference
    help:
      summary: The user the identity belongs to.
      usage: Set when the identity is registered.
      cardinalityMeaning: Each identity belongs to one user; a user may have several.
      context: Signing in with it signs in as the user.
  invariants:
  - id: IDENTITY-001
    rule: expiresAt must not precede issuedAt.
  lifecycle:
    title: Identity Lifecycle
    attribute: status
    states: [ACTIVE, SUSPENDED, REVOKED, EXPIRED]
    initial: ACTIVE
    terminal: [REVOKED, EXPIRED]
    transitions:
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: REVOKED, action: revoke}
    - {from: SUSPENDED, to: REVOKED, action: revoke}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: SUSPENDED, to: EXPIRED, action: expire}
  help:
    summary: Represents a security identity entity called Identity within the CEDM business model.
    businessMeaning: Identity is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with User. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Security administrators register how each user signs in — a password, a single sign-on account, an API key or a certificate — and suspend or revoke it when access must stop.
    lifecycle: An identity is active while it may be used to sign in; it can be suspended and reactivated, and ends when revoked or when it expires.
    example: SSO identity for user jdoe, subject 00u1a2b3c4 at the company identity provider, issued 2 January 2024, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-IDENTITY
