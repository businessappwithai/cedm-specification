entity:
  name: Contract
  namespace: cedm.domain
  kind: legal_commercial_entity
  description: A legally or commercially binding agreement between parties defining rights, obligations, terms, and conditions.
  ui:
    icon: file-check
  identity:
    key: contractId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: contractId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the contract record associated with this Contract. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for the agreement, so obligations, documents and service contracts stay attached to it through renewals and amendments."
  - name: contractNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of contract number for the Contract. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The number legal, procurement and sales staff quote when referring to the agreement in correspondence, invoices and disputes."
  - name: title
    type: string
    required: true
    maxLength: 300
    help:
      summary: Captures the business meaning of title for the Contract. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "A short descriptive name that tells people at a glance what the agreement covers, such as the supply of packaging materials for 2026."
  - name: contractType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of contract type for the Contract. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The kind of agreement, such as supply, service, lease or licence, which decides which templates, approvals and obligations apply."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - NEGOTIATION
    - APPROVAL
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    - TERMINATED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Contract.
        NEGOTIATION: Represents the negotiation state or classification in the context of Contract.
        APPROVAL: Represents the approval state or classification in the context of Contract.
        ACTIVE: Represents the active state or classification in the context of Contract.
        SUSPENDED: Represents the suspended state or classification in the context of Contract.
        EXPIRED: Represents the expired state or classification in the context of Contract.
        TERMINATED: Represents the terminated state or classification in the context of Contract.
        CANCELLED: Represents the cancelled state or classification in the context of Contract.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows where the agreement stands, from DRAFT and NEGOTIATION through APPROVAL to ACTIVE or SUSPENDED, and whether it ended by EXPIRED, TERMINATED or CANCELLED; only an ACTIVE contract binds the parties now."
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective from for the Contract. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The first day the parties' rights and obligations apply; work or deliveries before this date are not covered by the agreement."
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective to for the Contract. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last day the agreement applies, used to plan renewals and to stop billing or service after the term; it cannot be earlier than the start date."
  - name: signedAt
    type: datetime
    required: false
    help:
      summary: Records when the signed event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the agreement was signed, which is the evidence that the parties accepted it and often starts notice or cooling-off periods."
  - name: autoRenew
    type: boolean
    required: true
    default: false
    help:
      summary: Captures the business meaning of auto renew for the Contract. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Contract records, where applicable.
      relationshipContext: Its meaning is specific to Contract; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Says whether the agreement continues automatically into a new term unless someone gives notice, so contract owners know whether they must act before the end date."
  relationships:
  - name: parties
    target: Party
    cardinality: 2..*
    ownership: reference
    help:
      summary: Connects Contract to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Contract.
      cardinalityMeaning: The declared cardinality 2..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Contract to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Contract.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: document
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Contract to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a Contract.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: obligations
    target: ContractObligation
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects Contract to ContractObligation so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about ContractObligation records associated with a Contract.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: serviceContracts, target: ServiceContract, cardinality: "0..*", ownership: aggregate, help: {summary: Operational service-coverage specializations of this Contract., businessMeaning: Keeps legal/commercial agreement semantics in Contract while allowing service-specific administration., usage: "Service entitlement, SLA, renewals and audit.", cardinalityMeaning: Zero or many service specializations may exist under a Contract., workflowRole: ServiceContract terms must remain compatible with Contract lifecycle and amendments.}}

  invariants:
  - id: CONTRACT-001
    rule: effectiveTo must not precede effectiveFrom.
  - id: CONTRACT-002
    rule: an ACTIVE contract must have at least two parties.
  - {id: CONTRACT-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Contract Lifecycle
    attribute: status
    states: [DRAFT, NEGOTIATION, APPROVAL, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED, CANCELLED]
    transitions:
      - {from: DRAFT, to: APPROVAL, action: mark_approval}
      - {from: APPROVAL, to: ACTIVE, action: activate}
      - {from: APPROVAL, to: NEGOTIATION, action: mark_negotiation}
      - {from: NEGOTIATION, to: APPROVAL, action: resume}
      - {from: ACTIVE, to: NEGOTIATION, action: mark_negotiation}
      - {from: NEGOTIATION, to: ACTIVE, action: resume}
      - {from: APPROVAL, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVAL, action: resume}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: APPROVAL, to: EXPIRED, action: expire}
      - {from: ACTIVE, to: EXPIRED, action: expire}
      - {from: NEGOTIATION, to: EXPIRED, action: expire}
      - {from: SUSPENDED, to: EXPIRED, action: expire}
      - {from: APPROVAL, to: TERMINATED, action: terminate}
      - {from: ACTIVE, to: TERMINATED, action: terminate}
      - {from: NEGOTIATION, to: TERMINATED, action: terminate}
      - {from: SUSPENDED, to: TERMINATED, action: terminate}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: APPROVAL, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: NEGOTIATION, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a contract is ended"
      description: "When a contract is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CONTRACT-FOLLOW-UP-{{id}}"
              name: "Follow up on contract {{title}}"
              description: "Contract {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One binding agreement between two or more parties, recording its type, term, signature and renewal so the organization knows what it has committed to and when the commitment applies."
    businessMeaning: Contract is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Contract records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization,
      Document, ContractObligation. These relationships provide the context needed to interpret the record rather than treating
      its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Contract record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "The contract is drafted, negotiated with the counterparties, sent for internal approval, signed and activated, may be suspended during disputes, and ends by expiring at its end date, being terminated early or being cancelled before it took effect; obligations and service contracts hang off it throughout."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTRACT
