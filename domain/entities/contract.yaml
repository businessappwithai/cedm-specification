entity:
  name: Contract
  namespace: cedm.domain
  kind: legal_commercial_entity
  description: A legally or commercially binding agreement between parties defining rights, obligations, terms, and conditions.
  ui:
    icon: file-check
    recordLabel: [contractNumber, title]
  identity:
    key: contractId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: contractId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the contract record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a contract store this identifier. The number or code people quote is a separate field.
  - name: contractNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the contract.
      usage: Quoted on orders, invoices and correspondence under the contract.
      relationshipContext: Unique.
  - name: title
    type: string
    required: true
    maxLength: 300
    help:
      summary: What the contract is about, in a few words.
      usage: Shown in contract lists.
      relationshipContext: Identifies the contract for people.
  - name: contractType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of contract, such as "Purchase framework", "Sales agreement" or "Service contract".
      usage: Decides the templates, approvals and reviews that apply.
      relationshipContext: From the legal team's list of contract types.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - NEGOTIATION
    - APPROVAL
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    - TERMINATED
    - CANCELLED
    help:
      summary: Where the contract is in its life.
      usage: Moved on by approval, signature and termination.
      relationshipContext: Only active contracts govern new orders.
      valueSemantics:
        DRAFT: Being written.
        NEGOTIATION: Being negotiated with the other party.
        APPROVAL: Waiting for internal approval.
        ACTIVE: Signed and in force.
        SUSPENDED: Paused, for example during a dispute.
        EXPIRED: Reached the end of its term.
        TERMINATED: Ended early.
        CANCELLED: Abandoned before it took effect.
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: The first day the contract applies.
      usage: Orders before it are not governed by the contract.
      relationshipContext: Not later than the effective-to date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day of the contract's term.
      usage: Drives renewal reminders.
      relationshipContext: Empty for contracts without a fixed end.
  - name: signedAt
    type: datetime
    required: false
    help:
      summary: When the last party signed.
      usage: Recorded on signature.
      relationshipContext: Required before the contract becomes active.
  - name: autoRenew
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the contract renews by itself at the end of its term.
      usage: Taken from the renewal clause.
      relationshipContext: Notice must be given before the end of the term to stop it.
  relationships:
  - name: parties
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties bound by the contract.
      cardinalityMeaning: The declared cardinality 2..* expresses how many related records may participate in the relationship.
      usage: Added when the contract is drafted.
      context: A many-to-many relation; an active contract has at least two parties.
    inverseCardinality: 0..*
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The part of our organization that owns the contract.
      usage: Set when the contract is drafted.
      cardinalityMeaning: At most one.
      context: Its manager approves changes.
  - name: document
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: The signed contract document.
      usage: Linked on signature.
      cardinalityMeaning: At most one.
      context: The authoritative text.
  - name: obligations
    target: ContractObligation
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The obligations the contract creates.
      usage: Recorded after signature so they can be tracked.
      cardinalityMeaning: Any number; each obligation arises from one contract.
      context: Listed under the contract.
  - name: lines
    target: ContractLine
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The products, services and prices the contract covers, one per line.
      usage: Entered when the contract is drafted and changed only through amendments once it is signed.
      cardinalityMeaning: A contract may have any number of lines; a framework contract may have none.
      context: Orders placed under the contract take their prices from its lines.
  - name: clauses
    target: ContractClause
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The individual terms of the contract, such as liability, termination or confidentiality.
      usage: Recorded so that particular terms can be found and compared across contracts.
      cardinalityMeaning: A contract may have any number of clauses recorded.
      context: The signed document remains the authoritative text.
  invariants:
  - id: CONTRACT-001
    rule: effectiveTo must not precede effectiveFrom.
  - id: CONTRACT-002
    rule: an ACTIVE contract must have at least two parties.
  - {id: CONTRACT-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Contract Lifecycle
    attribute: status
    states: [DRAFT, NEGOTIATION, APPROVAL, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED, CANCELLED]
    transitions:
    - {from: DRAFT, to: APPROVAL, action: mark_approval}
    - {from: APPROVAL, to: ACTIVE, action: activate}
    - {from: APPROVAL, to: NEGOTIATION, action: mark_negotiation}
    - {from: NEGOTIATION, to: APPROVAL, action: resume}
    - {from: ACTIVE, to: NEGOTIATION, action: mark_negotiation}
    - {from: NEGOTIATION, to: ACTIVE, action: resume}
    - {from: APPROVAL, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: APPROVAL, action: resume}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: APPROVAL, to: EXPIRED, action: expire}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: NEGOTIATION, to: EXPIRED, action: expire}
    - {from: SUSPENDED, to: EXPIRED, action: expire}
    - {from: APPROVAL, to: TERMINATED, action: terminate}
    - {from: ACTIVE, to: TERMINATED, action: terminate}
    - {from: NEGOTIATION, to: TERMINATED, action: terminate}
    - {from: SUSPENDED, to: TERMINATED, action: terminate}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVAL, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: NEGOTIATION, to: CANCELLED, action: cancel}
    - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a contract is ended"
    description: "When a contract is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "CONTRACT-FOLLOW-UP-{{id}}"
          name: "Follow up on contract {{title}}"
          description: "Contract {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A signed agreement between parties that sets out who must do what, for what price and for how long.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Document, ContractObligation. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Sales, procurement and legal draft contracts, negotiate and approve them, record signature and dates, and manage them through renewal or termination. Orders, invoices and obligations refer to the contract that governs them.
    lifecycle: Drafted, sent for approval, negotiated with the other party as needed, and active once signed and effective. It may be suspended, and it ends by expiring at the end of its term, by termination, or by cancellation before it takes effect.
    example: Contract C-2022-0145, 'Supply of bearings 2023–2025', purchase contract with SKF France, effective 1 January 2023 to 31 December 2025, auto-renew off, signed 12 December 2022, active.
    businessMeaning: Contracts create rights and obligations the organisation must honour and enforce; renewals, prices, penalties and disputes all depend on them.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTRACT
