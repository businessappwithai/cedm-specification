entity:
  name: Packing
  namespace: cedm.domain
  kind: warehouse_execution_transaction
  description: A governed warehouse task grouping picked goods into HandlingUnits and preparing them for shipment while preserving line, lot, serial, quantity, and package traceability.
  ui:
    icon: file-text
  identity: {key: packingId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: packingId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the packing record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a packing store this identifier. The number or code people quote is a separate field.
  - name: packedQuantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How many units were packed into the handling unit.
      businessMeaning: Measures goods prepared for transport.
      usage: Counted or scanned at the packing station.
      relationshipContext: Compared with the picked quantity; a difference is an exception.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, IN_PROGRESS, PACKED, CANCELLED, EXCEPTION]
    help:
      summary: Where the packing task stands.
      businessMeaning: Controls packaging workflow.
      usage: Moved on at the packing station.
      relationshipContext: Only packed units can be shipped.
      valueSemantics:
        PLANNED: Waiting to be packed.
        IN_PROGRESS: Being packed.
        PACKED: Packed and labelled.
        CANCELLED: No longer needed.
        EXCEPTION: Stopped by a problem a supervisor must resolve.
  - name: packingNumber
    type: string
    required: true
    unique: true
    maxLength: 40
    help:
      summary: The reference of the packing task.
      usage: Printed on the packing slip and scanned at the packing station.
      relationshipContext: Unique.
  - name: packedAt
    type: datetime
    required: false
    help:
      summary: When packing was finished.
      usage: Recorded when the unit is closed.
      relationshipContext: Present once packed.
  - name: exceptionReason
    type: string
    required: false
    maxLength: 300
    help:
      summary: What went wrong, such as missing items or damage found.
      usage: Written when the task goes into exception.
      relationshipContext: Read by the supervisor who resolves it.
  relationships:
  - name: picking
    target: Picking
    cardinality: 0..1
    ownership: reference
    help:
      summary: The pick that supplied the goods.
      businessMeaning: Preserves pick-to-pack provenance.
      workflowRole: Packed quantity cannot exceed eligible picked quantity.
      usage: Linked when picked goods arrive at packing.
      cardinalityMeaning: At most one pick.
      context: The packed quantity should equal the picked quantity.
  - name: handlingUnit
    target: HandlingUnit
    cardinality: "1"
    ownership: reference
    help:
      summary: The carton or pallet the goods are packed into.
      businessMeaning: Establishes physical logistics identity.
      workflowRole: Contents/custody remain traceable.
      usage: Created or scanned at the packing station.
      cardinalityMeaning: Every packing task fills exactly one handling unit.
      context: The unit's label is printed at packing.
  - name: shipment
    target: Shipment
    cardinality: 0..1
    ownership: reference
    help:
      summary: The shipment the packed unit will travel on.
      businessMeaning: Connects warehouse packaging to transport.
      workflowRole: Packing does not dispatch shipment.
      usage: Set from the order being packed.
      cardinalityMeaning: At most one.
      context: Lets the unit be loaded on the right vehicle.
  - name: shipmentLine
    target: ShipmentLine
    cardinality: 0..1
    ownership: reference
    help:
      summary: The shipment line the goods fulfil.
      businessMeaning: Preserves line-level fulfillment provenance.
      workflowRole: Product/UOM/quantity must reconcile.
      usage: Set from the order line being packed.
      cardinalityMeaning: At most one.
      context: Lets the packing slip list line by line.
  invariants:
  - {id: PACKING-001, rule: An exception says what went wrong., violatedWhen: status == "EXCEPTION" and exception_reason == null, message: Describe the exception.}
  - {id: PACKING-EXE-001, rule: "Packed Quantity cannot be negative.", violatedWhen: "packed_quantity != null and packed_quantity < 0", message: "Packed Quantity cannot be negative."}
  lifecycle:
    title: Packing Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, PACKED, CANCELLED, EXCEPTION]
    initial: PLANNED
    terminal: [CANCELLED]
    transitions:
    - {from: PLANNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: PACKED, action: mark_packed}
    - {from: IN_PROGRESS, to: EXCEPTION, action: mark_exception}
    - {from: EXCEPTION, to: IN_PROGRESS, action: resolve_exception}
    - {from: PACKED, to: EXCEPTION, action: mark_exception}
    - {from: EXCEPTION, to: PACKED, action: resolve_exception}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
    - {from: PACKED, to: CANCELLED, action: cancel}
    - {from: EXCEPTION, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a packing is stopped"
    description: "When a packing is exception, a high-priority task asks someone to resolve it."
    when: "status == \"EXCEPTION\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PACKING-EXCEPTION-{{id}}"
          name: "Resolve packing {{id}}"
          description: "Packing {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a packing is ended"
    description: "When a packing is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PACKING-FOLLOW-UP-{{id}}"
          name: "Follow up on packing {{id}}"
          description: "Packing {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Warehouse packaging execution between picking and shipping.
    businessMeaning: Packing establishes physical package composition/readiness; Shipment and InventoryMovement separately govern transport and stock effects.
    usage: Fulfillment, package labeling, staging, carrier handoff and traceability.
    relationshipContext: Picking supplies goods; HandlingUnit identifies package; Shipment/ShipmentLine supply transport context.
    lifecycle: Planned → in progress → packed, cancelled or exception.
    example: 'Packing PK-24-5521: 6 units packed into carton SSCC …0123 for shipment SH-88412, 20 May 2024 10:12, completed.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PACKING}
