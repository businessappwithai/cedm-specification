entity:
  name: HealthcareEncounter
  namespace: cedm.domain
  kind: healthcare_transaction
  description: A recorded interaction between a patient and healthcare provider or facility for evaluation, treatment, or service.
  ui:
    icon: file-text
    recordLabel: [encounterType, startAt]
  identity:
    key: encounterId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: encounterId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the healthcare encounter record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a healthcare encounter store this identifier. The number or code people quote is a separate field.
  - name: encounterType
    type: enum
    required: true
    values:
    - OUTPATIENT
    - INPATIENT
    - EMERGENCY
    - VIRTUAL
    - HOME_CARE
    - OTHER
    help:
      summary: The setting of the encounter.
      usage: Decides the forms, billing rules and reports that apply.
      relationshipContext: Chosen when the encounter is scheduled.
      valueSemantics:
        OUTPATIENT: A visit without admission.
        INPATIENT: A stay after admission.
        EMERGENCY: A visit to an emergency department.
        VIRTUAL: A remote consultation.
        HOME_CARE: Care given at the patient's home.
        OTHER: Any other setting.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the encounter stands.
      usage: Updated as the patient is seen.
      relationshipContext: Only completed encounters are billed.
      valueSemantics:
        PLANNED: Scheduled.
        IN_PROGRESS: The patient is being seen.
        COMPLETED: Finished and documented.
        CANCELLED: Did not take place.
  - name: startAt
    type: datetime
    required: true
    help:
      summary: When the encounter began or is scheduled to begin.
      usage: Used for scheduling and the patient's timeline.
      relationshipContext: Not after its end.
  - name: endAt
    type: datetime
    required: false
    help:
      summary: When the encounter ended.
      usage: Recorded on completion; length of stay is computed from it.
      relationshipContext: Present once completed.
  - name: reason
    type: string
    required: false
    maxLength: 2000
    help:
      summary: Why the patient is seen, in brief.
      usage: Recorded at booking or arrival.
      relationshipContext: Diagnoses are recorded separately.
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient seen.
      usage: Set when the encounter is created.
      context: The encounter appears in the patient's record.
      cardinalityMeaning: Each encounter is for one patient; a patient has many encounters.
  - name: provider
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: The clinician or service responsible for the encounter.
      usage: Set when scheduling.
      cardinalityMeaning: At most one responsible provider.
      context: Orders and diagnoses are attributed to them.
  - name: diagnoses
    target: Diagnosis
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Diagnoses recorded during the encounter.
      usage: Entered by the clinician.
      cardinalityMeaning: Any number, kept with the encounter.
      context: Line items of the encounter.
  - name: procedures
    target: Procedure
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Procedures performed during the encounter.
      usage: Entered by the clinician.
      cardinalityMeaning: Any number, kept with the encounter.
      context: Line items of the encounter.
  - name: orders
    target: HealthcareOrder
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Tests, medications and referrals ordered.
      usage: Placed by the clinician.
      cardinalityMeaning: Any number, kept with the encounter.
      context: Line items of the encounter.
  invariants:
  - id: ENCOUNTER-001
    rule: endAt must not precede startAt.
  lifecycle:
    title: Healthcare Encounter Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a healthcare encounter is ended"
    description: "When a healthcare encounter is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HEALTHCARE-ENCOUNTER-FOLLOW-UP-{{id}}"
          name: "Follow up on healthcare encounter {{id}}"
          description: "Healthcare encounter {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a healthcare encounter is done"
    description: "When a healthcare encounter is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HEALTHCARE-ENCOUNTER-COMPLETED-{{id}}"
          name: "Confirm healthcare encounter {{id}}"
          description: "Healthcare encounter {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents a healthcare transaction called HealthcareEncounter within the CEDM business model.
    businessMeaning: HealthcareEncounter is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcarePatient, HealthcareProvider, Diagnosis, Procedure, HealthcareOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Clinicians and administrative staff schedule encounters, record what happened during them, and attach diagnoses, procedures and orders; billing and reporting are built from completed encounters.
    lifecycle: An encounter is planned, in progress while the patient is seen, then completed; a planned or ongoing encounter may be cancelled.
    example: Outpatient encounter for patient MRN 0048812 with Dr. A. Rossi, 14 May 2024 09:30–09:50, reason 'persistent cough', diagnosis J20.9 recorded.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-ENCOUNTER
