entity:
  name: HealthcareEncounter
  namespace: cedm.domain
  kind: healthcare_transaction
  description: A recorded interaction between a patient and healthcare provider or facility for evaluation, treatment, or service.
  ui:
    icon: file-text
  identity:
    key: encounterId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: encounterId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the healthcare encounter record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a healthcare encounter store this identifier. The number or code people quote is a separate field.
  - name: encounterType
    type: enum
    required: true
    values:
    - OUTPATIENT
    - INPATIENT
    - EMERGENCY
    - VIRTUAL
    - HOME_CARE
    - OTHER
    help:
      summary: Captures the business meaning of encounter type for the HealthcareEncounter. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareEncounter records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareEncounter; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        OUTPATIENT: Represents the outpatient state or classification in the context of HealthcareEncounter.
        INPATIENT: Represents the inpatient state or classification in the context of HealthcareEncounter.
        EMERGENCY: Represents the emergency state or classification in the context of HealthcareEncounter.
        VIRTUAL: Represents the virtual state or classification in the context of HealthcareEncounter.
        HOME_CARE: Represents the home care state or classification in the context of HealthcareEncounter.
        OTHER: Represents the other state or classification in the context of HealthcareEncounter.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareEncounter records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareEncounter; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of HealthcareEncounter.
        IN_PROGRESS: Represents the in progress state or classification in the context of HealthcareEncounter.
        COMPLETED: Represents the completed state or classification in the context of HealthcareEncounter.
        CANCELLED: Represents the cancelled state or classification in the context of HealthcareEncounter.
  - name: startAt
    type: datetime
    required: true
    help:
      summary: Records when the start event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareEncounter records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareEncounter; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: endAt
    type: datetime
    required: false
    help:
      summary: Records when the end event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareEncounter records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareEncounter; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: reason
    type: string
    required: false
    maxLength: 2000
    help:
      summary: Captures the business meaning of reason for the HealthcareEncounter. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HealthcareEncounter records, where applicable.
      relationshipContext: Its meaning is specific to HealthcareEncounter; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects HealthcareEncounter to HealthcarePatient so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcarePatient records associated with a HealthcareEncounter.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: provider
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects HealthcareEncounter to HealthcareProvider so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareProvider records associated with a HealthcareEncounter.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: diagnoses
    target: Diagnosis
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects HealthcareEncounter to Diagnosis so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Diagnosis records associated with a HealthcareEncounter.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: procedures
    target: Procedure
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects HealthcareEncounter to Procedure so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Procedure records associated with a HealthcareEncounter.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: orders
    target: HealthcareOrder
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects HealthcareEncounter to HealthcareOrder so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareOrder records associated with a HealthcareEncounter.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  invariants:
  - id: ENCOUNTER-001
    rule: endAt must not precede startAt.
  lifecycle:
    title: Healthcare Encounter Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a healthcare encounter is ended"
    description: "When a healthcare encounter is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HEALTHCARE-ENCOUNTER-FOLLOW-UP-{{id}}"
          name: "Follow up on healthcare encounter {{id}}"
          description: "Healthcare encounter {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a healthcare encounter is done"
    description: "When a healthcare encounter is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HEALTHCARE-ENCOUNTER-COMPLETED-{{id}}"
          name: "Confirm healthcare encounter {{id}}"
          description: "Healthcare encounter {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents a healthcare transaction called HealthcareEncounter within the CEDM business model.
    businessMeaning: HealthcareEncounter is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate HealthcareEncounter records.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcarePatient, HealthcareProvider, Diagnosis, Procedure, HealthcareOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical HealthcareEncounter record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HEALTHCARE-ENCOUNTER
