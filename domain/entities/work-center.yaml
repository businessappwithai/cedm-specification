entity:
  name: WorkCenter
  namespace: cedm.domain
  kind: manufacturing_resource_master
  description: A governed manufacturing capacity resource or resource group where production operations are scheduled and executed.
  ui:
    icon: database
  identity: {key: workCenterId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: workCenterId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identifier of the work center, unchanged if its code or name is revised.', usage: 'Generated on creation; routing operations, schedules, shop-floor reports and costing refer to it.', businessMeaning: Identifies the capacity resource independently of location or routing., relationshipContext: Referenced by routing and production operations.}}
    - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: The short code planners and shop-floor staff use to name the work center., usage: 'Unique; used in routings, scheduling, dispatch lists and integrations, so changes need coordinating with those users.', businessMeaning: Operational identifier used in manufacturing plans and execution., relationshipContext: Unique within its manufacturing context.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: 'A descriptive name saying what the work center is, such as Assembly Line 2.', usage: 'Entered by manufacturing engineers; shown in planning screens, schedules and reports beside the code.', businessMeaning: Communicates the resource function to planners and operators., relationshipContext: Complements the stable code.}}
    - {name: capacityPerHour, type: decimal, required: false, precision: 20, scale: 6, help: {summary: The nominal quantity the work center can process or produce in one hour., usage: Optional; the scheduler divides required quantity by it to test whether a schedule is feasible and to estimate duration., businessMeaning: Planning assumption for finite or rough-cut scheduling., relationshipContext: Actual execution is captured separately.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, INACTIVE, MAINTENANCE, RETIRED]
      help:
        summary: Whether the work center can currently be scheduled, is idle, under maintenance or retired.
        usage: Starts as ACTIVE; maintenance and planning staff move it, and scheduling only loads active work centers.
        valueSemantics:
          ACTIVE: Available and eligible to be scheduled for production.
          INACTIVE: Not currently used but can be reactivated.
          MAINTENANCE: Out of production for servicing, with its capacity unavailable.
          RETIRED: Permanently removed from use. A final state.
        businessMeaning: Controls whether new work may be scheduled or executed.
        relationshipContext: Existing historical operations remain valid.
  relationships:
    - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Physical or organizational location of the resource., businessMeaning: Places manufacturing capacity within the operating network., usage: "Scheduling, material staging, and reporting.", cardinalityMeaning: Optional for virtual or pooled resources., workflowRole: Location eligibility constrains execution.}}
    - {name: routingOperations, target: Operation, cardinality: 0..*, ownership: reference, help: {summary: Standard operations assigned to this resource., businessMeaning: Defines where process steps are normally performed., usage: Routing and capacity planning., cardinalityMeaning: Many operation definitions may use a work center., workflowRole: Routing assignment feeds production execution.}}
  invariants:
    - {id: WORK-CENTER-001, rule: capacityPerHour must be greater than zero when specified.}
    - {id: WORK-CENTER-002, rule: "INACTIVE, MAINTENANCE, or RETIRED work centers cannot receive new execution without an authorized exception."}
  lifecycle:
    title: Work Center Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, MAINTENANCE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
      - {from: MAINTENANCE, to: RETIRED, action: retire}
  help:
    summary: Manufacturing capacity resource used by routing and execution.
    businessMeaning: WorkCenter represents where or by which resource an Operation is performed.
    usage: Manufacturing planning, scheduling, dispatch, costing, maintenance coordination, and analytics.
    relationshipContext: Operation defines work; Routing sequences work; ManufacturingWorkOrder executes it.
    lifecycle: Active → temporarily unavailable/maintenance → active or retired.
    changePropagation: Capacity/status changes revalidate affected schedules and unreleased work without rewriting completed execution.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-WORK-CENTER}
