entity:
  name: MediaContent
  namespace: cedm.domain
  kind: media_entity
  description: A digital or physical media work managed for creation, licensing, publication, or distribution.
  ui:
    icon: image
    recordLabel: [contentCode, title]
  identity:
    key: mediaContentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: mediaContentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the media content record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a media content store this identifier. The number or code people quote is a separate field.
  - name: contentCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the work.
      usage: Used in rights deals and distribution.
      relationshipContext: Unique.
  - name: title
    type: string
    required: true
    maxLength: 500
    help:
      summary: The title of the work.
      usage: Shown to audiences and in catalogues.
      relationshipContext: May differ by market.
  - name: contentType
    type: enum
    required: true
    values:
    - VIDEO
    - AUDIO
    - IMAGE
    - ARTICLE
    - BOOK
    - PODCAST
    - GAME
    - OTHER
    help:
      summary: What kind of work it is.
      usage: Decides which channels and formats apply.
      relationshipContext: Chosen when registering.
      valueSemantics:
        VIDEO: A film, episode or clip.
        AUDIO: A song, recording or sound work.
        IMAGE: A photograph or illustration.
        ARTICLE: A written article.
        BOOK: A book.
        PODCAST: A podcast episode or series.
        GAME: A game.
        OTHER: Any other work.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - PRODUCED
    - PUBLISHED
    - ARCHIVED
    - RETIRED
    help:
      summary: Where the work stands.
      usage: Moved on by editors.
      relationshipContext: Only published content is available to audiences.
      valueSemantics:
        DRAFT: In development.
        PRODUCED: Finished, not yet released.
        PUBLISHED: Available to audiences.
        ARCHIVED: Taken down but kept.
        RETIRED: Withdrawn for good.
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation that owns the work.
      usage: Set when registering.
      cardinalityMeaning: At most one owner.
      context: Licences are granted by the owner.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Files and documents for the work, such as scripts and masters.
      usage: Attached during production.
      cardinalityMeaning: Any number of documents.
      context: Kept with the work.
    inverseCardinality: 0..*
  - name: rights
    target: MediaRight
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The rights, licences and restrictions on the work.
      usage: Recorded by rights managers.
      cardinalityMeaning: Any number, kept with the content.
      context: Checked before publishing to a territory or channel.
  lifecycle:
    title: Media Content Lifecycle
    attribute: status
    states: [DRAFT, PRODUCED, PUBLISHED, ARCHIVED, RETIRED]
    initial: DRAFT
    terminal: [ARCHIVED, RETIRED]
    transitions:
    - {from: DRAFT, to: PRODUCED, action: mark_produced}
    - {from: PRODUCED, to: PUBLISHED, action: publish}
    - {from: PUBLISHED, to: ARCHIVED, action: archive}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: PRODUCED, to: RETIRED, action: retire}
    - {from: PUBLISHED, to: RETIRED, action: retire}
  help:
    summary: A film, song, article or other work the business produces, licenses or publishes.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Document, MediaRight. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Editors and producers register each work, attach its files and documents, record the rights held in it, and publish it to channels; rights managers check what may be used where.
    lifecycle: Content is drafted, produced when finished, then published; published content is archived when taken down, and content can be retired at any stage before.
    example: Content DOC-2024-031 'Rivers of the Alps', video documentary owned by Alpine Media, produced, published 12 May 2024, streaming rights for EU.
    businessMeaning: Content is the media business's product; its rights and publication decide where and how it earns revenue.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-CONTENT
