entity:
  name: MediaContent
  namespace: cedm.domain
  kind: media_entity
  description: A digital or physical media work managed for creation, licensing, publication, or distribution.
  ui:
    icon: image
  identity:
    key: mediaContentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: mediaContentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the media content record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a media content store this identifier. The number or code people quote is a separate field.
  - name: contentCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of content code for the MediaContent. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaContent records, where applicable.
      relationshipContext: Its meaning is specific to MediaContent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: title
    type: string
    required: true
    maxLength: 500
    help:
      summary: Captures the business meaning of title for the MediaContent. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaContent records, where applicable.
      relationshipContext: Its meaning is specific to MediaContent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: contentType
    type: enum
    required: true
    values:
    - VIDEO
    - AUDIO
    - IMAGE
    - ARTICLE
    - BOOK
    - PODCAST
    - GAME
    - OTHER
    help:
      summary: Captures the business meaning of content type for the MediaContent. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaContent records, where applicable.
      relationshipContext: Its meaning is specific to MediaContent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        VIDEO: Represents the video state or classification in the context of MediaContent.
        AUDIO: Represents the audio state or classification in the context of MediaContent.
        IMAGE: Represents the image state or classification in the context of MediaContent.
        ARTICLE: Represents the article state or classification in the context of MediaContent.
        BOOK: Represents the book state or classification in the context of MediaContent.
        PODCAST: Represents the podcast state or classification in the context of MediaContent.
        GAME: Represents the game state or classification in the context of MediaContent.
        OTHER: Represents the other state or classification in the context of MediaContent.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - PRODUCED
    - PUBLISHED
    - ARCHIVED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating MediaContent records, where applicable.
      relationshipContext: Its meaning is specific to MediaContent; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of MediaContent.
        PRODUCED: Represents the produced state or classification in the context of MediaContent.
        PUBLISHED: Represents the published state or classification in the context of MediaContent.
        ARCHIVED: Represents the archived state or classification in the context of MediaContent.
        RETIRED: Represents the retired state or classification in the context of MediaContent.
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects MediaContent to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a MediaContent.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects MediaContent to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a MediaContent.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: 0..*
  - name: rights
    target: MediaRight
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Connects MediaContent to MediaRight so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MediaRight records associated with a MediaContent.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  lifecycle:
    title: Media Content Lifecycle
    attribute: status
    states: [DRAFT, PRODUCED, PUBLISHED, ARCHIVED, RETIRED]
    initial: DRAFT
    terminal: [ARCHIVED, RETIRED]
    transitions:
    - {from: DRAFT, to: PRODUCED, action: mark_produced}
    - {from: PRODUCED, to: PUBLISHED, action: publish}
    - {from: PUBLISHED, to: ARCHIVED, action: archive}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: PRODUCED, to: RETIRED, action: retire}
    - {from: PUBLISHED, to: RETIRED, action: retire}
  help:
    summary: Represents a media entity called MediaContent within the CEDM business model.
    businessMeaning: MediaContent is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate MediaContent records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Document, MediaRight. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical MediaContent record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDIA-CONTENT
