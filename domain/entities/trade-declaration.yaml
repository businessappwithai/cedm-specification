entity:
  name: TradeDeclaration
  namespace: cedm.domain
  kind: international_trade_entity
  description: A formal customs or trade declaration describing goods crossing a jurisdictional border.
  ui:
    icon: table
  identity:
    key: tradeDeclarationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: tradeDeclarationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the declaration, constant for its life.
        usage: Generated on creation; documents and duties refer to it.
        relationshipContext: Referenced by shipments and duty records.
    - name: declarationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number of the declaration, such as the customs reference.
        usage: Unique; quoted to customs.
        relationshipContext: Read with the type.
    - name: declarationType
      type: enum
      required: true
      values:
        - IMPORT
        - EXPORT
        - TRANSIT
        - RE_EXPORT
        - OTHER
      help:
        summary: The kind of crossing declared.
        usage: Chosen when created; decides the forms and duties.
        relationshipContext: Read with the importer and exporter.
        valueSemantics:
          IMPORT: Goods entering the country.
          EXPORT: Goods leaving the country.
          TRANSIT: Goods passing through under customs control.
          RE_EXPORT: Imported goods leaving again.
          OTHER: A declaration of another kind.
    - name: declarationDate
      type: date
      required: true
      help:
        usage: Set when the declaration is made; duty rates are taken as at this date.
        relationshipContext: Compared with the release date.
        summary: Records the business date associated with the declaration. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - SUBMITTED
        - ACCEPTED
        - UNDER_REVIEW
        - RELEASED
        - REJECTED
        - CANCELLED
      help:
        summary: Where the declaration is with customs.
        usage: Starts as DRAFT; moved as it is submitted and answered.
        relationshipContext: Goods cannot move until it is released.
        valueSemantics:
          DRAFT: Being prepared; not yet sent.
          SUBMITTED: Filed with customs.
          ACCEPTED: Accepted by customs for processing.
          UNDER_REVIEW: Customs is checking it.
          RELEASED: Goods may proceed. A final state.
          REJECTED: Refused by customs. A final state.
          CANCELLED: Withdrawn by the declarant. A final state.
    - name: customsValue
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The value of the goods declared to customs.
        usage: Entered from the invoice; duties are based on it.
        relationshipContext: Compared with the invoice total.
  relationships:
    - name: importer
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The party importing the goods.
        usage: Chosen for imports.
        cardinalityMeaning: At most one importer.
        context: Who is liable for duties.
    - name: exporter
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The party exporting the goods.
        usage: Chosen for exports.
        cardinalityMeaning: At most one exporter.
        context: Who must declare the goods leaving.
    - name: shipment
      target: Shipment
      cardinality: 0..1
      ownership: reference
      help:
        summary: The shipment the declaration covers.
        usage: Chosen when the declaration is for a shipment.
        cardinalityMeaning: At most one shipment.
        context: Links the legal filing to the movement.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents supporting the declaration.
        usage: Attached before filing.
        cardinalityMeaning: Any number of documents.
        context: Provide evidence to customs.
  lifecycle:
    title: Trade Declaration Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, UNDER_REVIEW, RELEASED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal:
      - RELEASED
      - REJECTED
      - CANCELLED
    transitions:
      - {from: DRAFT, to: SUBMITTED, action: submit}
      - {from: SUBMITTED, to: ACCEPTED, action: accept}
      - {from: SUBMITTED, to: UNDER_REVIEW, action: review}
      - {from: SUBMITTED, to: REJECTED, action: reject}
      - {from: ACCEPTED, to: UNDER_REVIEW, action: review}
      - {from: ACCEPTED, to: RELEASED, action: release}
      - {from: UNDER_REVIEW, to: RELEASED, action: release}
      - {from: UNDER_REVIEW, to: REJECTED, action: reject}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: SUBMITTED, to: CANCELLED, action: cancel}
      - {from: ACCEPTED, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a trade declaration is put forward"
      description: "When a trade declaration is submitted or under review, a task asks someone to decide on it."
      when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRADE-DECLARATION-APPROVAL-{{id}}"
              name: "Decide on trade declaration {{declaration_number}}"
              description: "Trade declaration {{declaration_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a trade declaration is ended"
      description: "When a trade declaration is rejected or cancelled, a task asks someone to settle what depended on it."
      when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRADE-DECLARATION-FOLLOW-UP-{{id}}"
              name: "Follow up on trade declaration {{declaration_number}}"
              description: "Trade declaration {{declaration_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A formal customs or trade declaration describing goods crossing a border.
    businessMeaning: A trade declaration tells the customs authority what is being imported, exported or moved in transit, with the value and the parties. It is the legal record that lets goods be released and duties be worked out.
    usage: Prepared by trade compliance or a broker; submitted to customs; read by logistics and finance.
    relationshipContext: A declaration may name an importer and an exporter, relates to a shipment and has supporting documents.
    lifecycle: A declaration is drafted and submitted, accepted or reviewed by customs, then released. It may be rejected or cancelled. Released, rejected and cancelled are final.
    example: An import declaration for a shipment of machine parts is submitted on 3 March and released on 5 March.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRADE-DECLARATION
