entity:
  name: TradeDeclaration
  namespace: cedm.domain
  kind: international_trade_entity
  description: A formal customs or trade declaration describing goods crossing a jurisdictional border.
  ui:
    icon: table
  identity:
    key: tradeDeclarationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tradeDeclarationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the trade declaration record associated with this TradeDeclaration. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: declarationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of declaration number for the TradeDeclaration. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: declarationType
    type: enum
    required: true
    values:
    - IMPORT
    - EXPORT
    - TRANSIT
    - RE_EXPORT
    - OTHER
    help:
      summary: Captures the business meaning of declaration type for the TradeDeclaration. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        IMPORT: Represents the import state or classification in the context of TradeDeclaration.
        EXPORT: Represents the export state or classification in the context of TradeDeclaration.
        TRANSIT: Represents the transit state or classification in the context of TradeDeclaration.
        RE_EXPORT: Represents the re export state or classification in the context of TradeDeclaration.
        OTHER: Represents the other state or classification in the context of TradeDeclaration.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: declarationDate
    type: date
    required: true
    help:
      summary: Records the business date associated with the declaration. It is used in chronology, eligibility, scheduling, reporting, and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - ACCEPTED
    - UNDER_REVIEW
    - RELEASED
    - REJECTED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of TradeDeclaration.
        SUBMITTED: Represents the submitted state or classification in the context of TradeDeclaration.
        ACCEPTED: Represents the accepted state or classification in the context of TradeDeclaration.
        UNDER_REVIEW: Represents the under review state or classification in the context of TradeDeclaration.
        RELEASED: Represents the released state or classification in the context of TradeDeclaration.
        REJECTED: Represents the rejected state or classification in the context of TradeDeclaration.
        CANCELLED: Represents the cancelled state or classification in the context of TradeDeclaration.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: customsValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of customs value for the TradeDeclaration. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating TradeDeclaration records, where applicable.
      relationshipContext: Its meaning is specific to TradeDeclaration; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  relationships:
  - name: importer
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects TradeDeclaration to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a TradeDeclaration.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: exporter
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects TradeDeclaration to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a TradeDeclaration.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: shipment
    target: Shipment
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects TradeDeclaration to Shipment so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Shipment records associated with a TradeDeclaration.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects TradeDeclaration to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a TradeDeclaration.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: 0..*
  lifecycle:
    title: Trade Declaration Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, UNDER_REVIEW, RELEASED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal: [REJECTED, CANCELLED]
    transitions:
    - {from: DRAFT, to: SUBMITTED, action: submit}
    - {from: SUBMITTED, to: ACCEPTED, action: accept}
    - {from: ACCEPTED, to: UNDER_REVIEW, action: review}
    - {from: UNDER_REVIEW, to: RELEASED, action: release}
    - {from: DRAFT, to: REJECTED, action: reject}
    - {from: SUBMITTED, to: REJECTED, action: reject}
    - {from: ACCEPTED, to: REJECTED, action: reject}
    - {from: UNDER_REVIEW, to: REJECTED, action: reject}
    - {from: RELEASED, to: REJECTED, action: reject}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: SUBMITTED, to: CANCELLED, action: cancel}
    - {from: ACCEPTED, to: CANCELLED, action: cancel}
    - {from: UNDER_REVIEW, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a trade declaration is put forward"
    description: "When a trade declaration is submitted or under review, a task asks someone to decide on it."
    when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "TRADE-DECLARATION-APPROVAL-{{id}}"
          name: "Decide on trade declaration {{declaration_number}}"
          description: "Trade declaration {{declaration_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a trade declaration is ended"
    description: "When a trade declaration is rejected or cancelled, a task asks someone to settle what depended on it."
    when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "TRADE-DECLARATION-FOLLOW-UP-{{id}}"
          name: "Follow up on trade declaration {{declaration_number}}"
          description: "Trade declaration {{declaration_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a international trade entity called TradeDeclaration within the CEDM business model.
    businessMeaning: TradeDeclaration is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate TradeDeclaration records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Party, Shipment, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical TradeDeclaration record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
