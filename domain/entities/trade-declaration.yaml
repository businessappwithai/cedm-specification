entity:
  name: TradeDeclaration
  namespace: cedm.domain
  kind: international_trade_entity
  description: A formal customs or trade declaration describing goods crossing a jurisdictional border.
  identity: {key: tradeDeclarationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: tradeDeclarationId, type: uuid, required: true, immutable: true}
    - {name: declarationNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: declarationType, type: enum, required: true, values: [IMPORT, EXPORT, TRANSIT, RE_EXPORT, OTHER]}
    - {name: declarationDate, type: date, required: true}
    - {name: status, type: enum, required: true, default: DRAFT, values: [DRAFT, SUBMITTED, ACCEPTED, UNDER_REVIEW, RELEASED, REJECTED, CANCELLED]}
    - {name: customsValue, type: decimal, required: false, precision: 20, scale: 4}
  relationships:
    - {name: importer, target: Party, cardinality: "0..1", ownership: reference}
    - {name: exporter, target: Party, cardinality: "0..1", ownership: reference}
    - {name: shipment, target: Shipment, cardinality: "0..1", ownership: reference}
    - {name: documents, target: Document, cardinality: "0..*", ownership: reference}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-TRADE-DECLARATION}
