entity:
  name: TradeDeclaration
  namespace: cedm.domain
  kind: international_trade_entity
  description: A formal customs or trade declaration describing goods crossing a jurisdictional border.
  ui:
    icon: table
    recordLabel: [declarationNumber]
  identity:
    key: tradeDeclarationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tradeDeclarationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the trade declaration record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a trade declaration store this identifier. The number or code people quote is a separate field.
  - name: declarationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number customs gives the declaration.
      usage: Quoted on transport and accounting documents.
      relationshipContext: Unique.
  - name: declarationType
    type: enum
    required: true
    values:
    - IMPORT
    - EXPORT
    - TRANSIT
    - RE_EXPORT
    - OTHER
    help:
      summary: The customs procedure declared.
      usage: Decides the duties and formalities.
      relationshipContext: Chosen when preparing.
      valueSemantics:
        IMPORT: Goods entering the territory.
        EXPORT: Goods leaving the territory.
        TRANSIT: Goods passing through.
        RE_EXPORT: Imported goods leaving again.
        OTHER: Any other procedure.
  - name: declarationDate
    type: date
    required: true
    help:
      summary: The date of the declaration.
      usage: Decides the rates and rules that apply.
      relationshipContext: Set when submitted.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - SUBMITTED
    - ACCEPTED
    - UNDER_REVIEW
    - RELEASED
    - REJECTED
    - CANCELLED
    help:
      summary: Where the declaration stands with customs.
      usage: Updated from customs messages.
      relationshipContext: Only released goods may move on.
      valueSemantics:
        DRAFT: Being prepared.
        SUBMITTED: Sent to customs.
        ACCEPTED: Registered by customs.
        UNDER_REVIEW: Selected for a check.
        RELEASED: Goods released.
        REJECTED: Refused by customs.
        CANCELLED: Withdrawn.
  - name: customsValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The value of the goods for customs.
      usage: Duties are computed on it.
      relationshipContext: Not negative.
  relationships:
  - name: importer
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The party importing the goods.
      usage: Set for imports.
      cardinalityMeaning: At most one importer.
      context: Owes the import duties.
  - name: exporter
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The party exporting the goods.
      usage: Set for exports.
      cardinalityMeaning: At most one exporter.
      context: Responsible for export formalities.
  - name: shipment
    target: Shipment
    cardinality: 0..1
    ownership: reference
    help:
      summary: The shipment the declaration covers.
      usage: Linked when preparing.
      cardinalityMeaning: At most one shipment.
      context: Released shipments may move on.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Supporting documents such as invoices and certificates of origin.
      usage: Attached when preparing.
      cardinalityMeaning: Any number of documents.
      context: Kept for customs audits.
    inverseCardinality: 0..*
  lifecycle:
    title: Trade Declaration Lifecycle
    attribute: status
    states: [DRAFT, SUBMITTED, ACCEPTED, UNDER_REVIEW, RELEASED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal: [RELEASED, REJECTED, CANCELLED]
    transitions:
    - {from: DRAFT, to: SUBMITTED, action: submit}
    - {from: SUBMITTED, to: ACCEPTED, action: accept}
    - {from: SUBMITTED, to: REJECTED, action: reject}
    - {from: ACCEPTED, to: UNDER_REVIEW, action: review}
    - {from: ACCEPTED, to: RELEASED, action: release}
    - {from: UNDER_REVIEW, to: RELEASED, action: release}
    - {from: UNDER_REVIEW, to: REJECTED, action: reject}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: SUBMITTED, to: CANCELLED, action: cancel}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a trade declaration is put forward"
      description: "When a trade declaration is submitted or under review, a task asks someone to decide on it."
      when: "(status == \"SUBMITTED\" or status == \"UNDER_REVIEW\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRADE-DECLARATION-APPROVAL-{{id}}"
              name: "Decide on trade declaration {{declaration_number}}"
              description: "Trade declaration {{declaration_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a trade declaration is ended"
      description: "When a trade declaration is rejected or cancelled, a task asks someone to settle what depended on it."
      when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRADE-DECLARATION-FOLLOW-UP-{{id}}"
              name: "Follow up on trade declaration {{declaration_number}}"
              description: "Trade declaration {{declaration_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a international trade entity called TradeDeclaration within the CEDM business model.
    businessMeaning: TradeDeclaration is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Party, Shipment, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Customs brokers and trade compliance staff prepare declarations for goods crossing a border, submit them to customs, answer checks, and record the release; finance uses them for duties and VAT.
    lifecycle: A declaration is drafted, submitted, accepted by customs, possibly reviewed, and ends released or rejected; a draft or submitted declaration may be cancelled.
    example: Declaration 24IT00012345678901, import into Italy for shipment SH-88412, customs value 48,200 EUR, released 6 May 2024.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRADE-DECLARATION
