entity:
  name: Result
  namespace: cedm.domain
  kind: research_result
  description: A governed interpreted, calculated or summarized scientific output derived from Observations, Assays, Experiments or a Study, with explicit provenance and finalization.
  ui: {icon: chart-no-axes-column}
  identity: {key: resultId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: resultId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the Result., businessMeaning: Identifies one derived scientific output independently of source evidence and presentation., usage: "Analysis, reporting, decisions and audit.", relationshipContext: Provenance relationships identify source Observations or execution context., requiredMeaning: Required.}}
    - {name: resultCode, type: string, required: true, maxLength: 120, help: {summary: Business reference for the Result., businessMeaning: Supports operational identification and integration., usage: "Search, reporting and data exchange.", relationshipContext: May be unique within a Study or Assay under domain policy., requiredMeaning: Required.}}
    - {name: resultType, type: string, required: true, maxLength: 160, help: {summary: Classification of the derived output., businessMeaning: Describes analytical or interpretive semantics., usage: "Analysis and reporting.", relationshipContext: Source observations and method define how the result can be interpreted., requiredMeaning: Required.}}
    - {name: value, type: string, required: true, maxLength: 4000, help: {summary: Derived or interpreted result value., businessMeaning: Captures the governed scientific output., usage: "Reporting, decisions and integration.", relationshipContext: Quantitative results may additionally use UnitOfMeasure., requiredMeaning: Required.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, FINAL, INVALIDATED]
      help: {summary: Governance state of the Result., businessMeaning: Separates provisional analysis from finalized or invalidated output., usage: "Scientific review and audit.", relationshipContext: FINAL results preserve source provenance., valueSemantics: {DRAFT: Result is provisional., FINAL: Result is approved/finalized., INVALIDATED: Result is retained but no longer considered valid.}, requiredMeaning: Required.}
  relationships:
    - {name: study, target: Study, cardinality: "0..1", ownership: reference, help: {summary: Study to which the Result belongs., businessMeaning: Supplies investigation context., usage: "Reporting and research traceability.", cardinalityMeaning: Optional for standalone analysis., workflowRole: Study closure does not erase finalized Results.}}
    - {name: assay, target: Assay, cardinality: "0..1", ownership: reference, help: {summary: Assay contributing directly to the Result., businessMeaning: Preserves analytical execution provenance., usage: "Laboratory interpretation and audit.", cardinalityMeaning: Optional when derived at Study or Experiment level., workflowRole: Result must reconcile to source Assay evidence.}}
    - {name: observations, target: Observation, cardinality: "1..*", ownership: reference, help: {summary: Primary observations supporting the Result., businessMeaning: Provides evidence lineage from interpretation back to source measurements., usage: "Reproducibility, validation and audit.", cardinalityMeaning: One or more Observations in this baseline., workflowRole: Source invalidation requires impact assessment on Result validity.}}
    - {name: unitOfMeasure, target: UnitOfMeasure, cardinality: "0..1", ownership: reference, help: {summary: Unit for quantitative Result values., businessMeaning: Makes numerical output interpretable., usage: "Analysis and integration.", cardinalityMeaning: Optional for qualitative or structured values., workflowRole: Unit remains historical with finalized Result.}}
  invariants:
    - {id: RESULT-001, rule: Every Result must remain traceable to one or more source Observations.}
    - {id: RESULT-002, rule: FINAL Result is immutable derived evidence; later recalculation creates a new Result or explicit invalidation/correction trail.}
  lifecycle:
    title: Result Lifecycle
    attribute: status
    states: [DRAFT, FINAL, INVALIDATED]
    initial: DRAFT
    terminal: [FINAL, INVALIDATED]
    transitions:
      - {from: DRAFT, to: FINAL, action: finalize}
      - {from: DRAFT, to: INVALIDATED, action: invalidate}
  help:
    summary: Captures derived scientific output separately from primary observations.
    businessMeaning: Observation is source evidence; Result is an interpretation, calculation or summary whose lineage must remain reproducible.
    usage: Research, laboratories, life sciences, reporting, analytics, decisions and audit.
    relationshipContext: Observations are mandatory sources; Study and Assay provide execution context; UnitOfMeasure supports quantitative semantics.
    lifecycle: Result is drafted and then finalized or invalidated, with final evidence immutable.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-RESULT}
