entity:
  name: Store
  namespace: cedm.domain
  kind: retail_entity
  description: A retail location through which products or services are offered to customers.
  ui:
    icon: table
  identity:
    key: storeId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: storeId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the store, constant when it is renamed.
        usage: Generated on creation; sales and stock refer to it.
    - name: storeCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The short code of the store, such as ST-001.
        usage: Unique; shown on receipts and reports.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the store as customers and staff know it.
        usage: Shown in lists and on receipts.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - CLOSED
        - RETIRED
      help:
        summary: Whether the store is trading.
        usage: Starts as PLANNED; moved by retail operations.
        valueSemantics:
          PLANNED: Intended; not yet open.
          ACTIVE: Open and trading.
          CLOSED: Stopped trading. A final state.
          RETIRED: Removed from the network. A final state.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A store stands at one location, which gives its address; a second site is a second store.
        summary: The place where the store stands.
        usage: Chosen when it is created.
        context: Gives the address.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The company that runs the store.
        usage: Chosen when several companies trade.
        cardinalityMeaning: At most one organisation.
        context: Decides whose accounts record the sales.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products the store offers.
        usage: Maintained as the range changes.
        cardinalityMeaning: Any number of products.
        context: Decides what can be sold there.
  lifecycle:
    title: Store Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: A retail location through which the business sells products or services to customers.
    businessMeaning: A store is where sales happen and stock is held. Recording it lets sales, takings and stock be reported by outlet and lets the business open, close and retire locations in an orderly way.
    usage: Set up by retail operations; chosen on sales and stock records; read by store management and finance.
    relationshipContext: A store stands at one location, may belong to an organisation and ranges products.
    lifecycle: A store is planned, becomes active when it opens and is closed or retired when it stops trading. Closed and retired are final.
    example: The "Central" store, code ST-001, opens in March and trades from the high street premises.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-STORE
