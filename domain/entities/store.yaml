entity:
  name: Store
  namespace: cedm.domain
  kind: retail_entity
  description: A retail location through which products or services are offered to customers.
  ui:
    icon: table
  identity:
    key: storeId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: storeId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the store record associated with this Store. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Store records, where applicable.
      relationshipContext: Its meaning is specific to Store; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Keeps sales, stock and product ranges tied to the same store even if its name, code or owning organisation changes."
  - name: storeCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of store code for the Store. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Store records, where applicable.
      relationshipContext: Its meaning is specific to Store; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The store number used on tills, receipts, deliveries and sales reports, such as STR-0142, so staff and systems refer to the same outlet."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Store records, where applicable.
      relationshipContext: Its meaning is specific to Store; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The name customers and staff know the store by, such as 'Downtown Flagship', shown in store finders, reports and rotas."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - CLOSED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Store records, where applicable.
      relationshipContext: Its meaning is specific to Store; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Store.
        ACTIVE: Represents the active state or classification in the context of Store.
        CLOSED: Represents the closed state or classification in the context of Store.
        RETIRED: Represents the retired state or classification in the context of Store.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the store is still being planned, open and trading, closed, or retired; only active stores take sales and receive replenishment."
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Store to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Store.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Store to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Store.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Store to Product so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Product records associated with a Store.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Store Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: "A retail shop or outlet where the business sells products or services to customers, such as a high-street branch or a mall kiosk, kept to manage its location, range and trading status."
    businessMeaning: Store is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Store records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization,
      Product. These relationships provide the context needed to interpret the record rather than treating its fields as isolated
      database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Store record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Retail property or expansion teams plan the store at a location, operations activates it on opening day and assigns the products it carries, sales and stock processes run against it while it trades, and it is closed when it stops trading or retired if the plan is abandoned, with history kept for reporting."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-STORE
