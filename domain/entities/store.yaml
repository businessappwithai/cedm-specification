entity:
  name: Store
  namespace: cedm.domain
  kind: retail_entity
  description: A retail location through which products or services are offered to customers.
  ui:
    icon: table
  identity:
    key: storeId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: storeId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the store, constant when it is renamed.
        usage: Generated on creation; sales and stock refer to it.
    - name: storeCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The short code of the store, such as ST-001.
        usage: Unique; shown on receipts and reports.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the store as customers and staff know it.
        usage: Shown in lists and on receipts.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - CLOSED
        - RETIRED
      help:
        summary: Whether the store is being prepared, trading, shut or permanently withdrawn.
        usage: Starts as PLANNED; retail operations move it to ACTIVE on opening and to CLOSED or RETIRED, which decides whether it can take sales.
        valueSemantics:
          PLANNED: The store is being set up and is not yet open for trade.
          ACTIVE: The store is open and trading, and can take sales and hold stock.
          CLOSED: The store has stopped trading, temporarily or for good, and takes no new sales. A final state.
          RETIRED: The store has been permanently withdrawn from the network and kept only for history. A final state.
    - name: storeFormat
      type: enum
      required: true
      default: STANDARD
      values:
        - FLAGSHIP
        - STANDARD
        - EXPRESS
        - OUTLET
        - POP_UP
      help:
        summary: The type of outlet the store is, which shapes its range and size.
        usage: Chosen when the store is set up; it decides the product range and staffing model.
        relationshipContext: Read with its floor area.
        valueSemantics:
          FLAGSHIP: A large showcase store.
          STANDARD: A regular store with the normal range.
          EXPRESS: A small convenience store.
          OUTLET: A store selling discounted stock.
          POP_UP: A temporary store open for a short period.
    - name: openingDate
      type: date
      required: false
      help:
        summary: The day the store first opened its doors to customers.
        usage: Used to compare like-for-like sales between stores of similar age.
        relationshipContext: Not later than the closing date.
    - name: closingDate
      type: date
      required: false
      help:
        summary: The day the store stopped trading.
        usage: Recorded when the store closes, so later sales and stock are no longer expected there.
        relationshipContext: Present only for closed stores.
    - name: floorAreaM2
      type: decimal
      required: false
      precision: 10
      scale: 2
      help:
        summary: The area of the store open to customers, in square metres.
        usage: Used to report sales per square metre and to compare store productivity.
        relationshipContext: Excludes stockrooms and staff areas.
    - name: openingHours
      type: string
      required: false
      maxLength: 300
      help:
        summary: The days and times at which customers can visit the store.
        usage: Typed in by store administration and shown to shoppers on the store locator.
        relationshipContext: Written in plain text, such as Mon-Sat 09:30-19:30.
    - name: phone
      type: string
      required: false
      maxLength: 40
      help:
        summary: The telephone number customers can call to reach the store directly.
        usage: Entered by store administration and shown on the store locator and receipts.
        relationshipContext: Written in international format.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A store stands at one location, which gives its address; a second site is a second store.
        summary: The place where the store stands.
        usage: Chosen when it is created.
        context: Gives the address.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The company that runs the store.
        usage: Chosen when several companies trade.
        cardinalityMeaning: At most one organisation.
        context: Decides whose accounts record the sales.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products the store offers.
        usage: Maintained as the range changes.
        cardinalityMeaning: Any number of products.
        context: Decides what can be sold there.
    - name: manager
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for running the store day to day.
        usage: Chosen when the store is set up and changed when management changes.
        cardinalityMeaning: At most one manager at a time.
        workflowRole: Receives the store's reports and is accountable for its results.
        context: Accountable for its results.
  lifecycle:
    title: Store Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, CLOSED, RETIRED]
    initial: PLANNED
    terminal: [CLOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
  help:
    summary: A retail location through which the business sells products or services to customers.
    businessMeaning: A store is where sales happen and stock is held. Recording it lets sales, takings and stock be reported by outlet and lets the business open, close and retire locations in an orderly way.
    usage: Set up by retail operations; chosen on sales and stock records; read by store management and finance.
    relationshipContext: A store stands at one location, may belong to an organisation and ranges products.
    lifecycle: A store is planned, becomes active when it opens and is closed or retired when it stops trading. Closed and retired are final.
    example: The "Central" store, code ST-001, opens in March and trades from the high street premises.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-STORE
