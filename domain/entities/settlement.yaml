entity:
  name: Settlement
  namespace: cedm.domain
  kind: insurance_claim_settlement
  description: A governed transaction that discharges approved insurance claim liability through payment, service, recovery, offset or another recognized settlement method.
  ui: {icon: heart-handshake}
  identity: {key: settlementId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: settlementId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of one claim settlement transaction, assigned once and never changed.', usage: 'Generated on creation; payments, reconciliation reports and audit entries refer to it even if the settlement number is corrected.', businessMeaning: Identifies one discharge of insurance liability independently of claim approval and payment execution., relationshipContext: InsuranceClaim supplies liability context while Payment may provide financial execution evidence.}}
    - {name: settlementNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: 'The business reference of the settlement, such as STL-3041, used by claims finance to find it.', usage: Assigned when the settlement is drafted; unique; quoted in correspondence with the claimant and in integrations with accounting., businessMeaning: Operational identifier for claims finance and reconciliation., relationshipContext: Distinct from claim and payment numbers.}}
    - {name: amount, type: decimal, required: true, precision: 20, scale: 4, help: {summary: 'The monetary liability this settlement discharges, stated in the settlement currency.', usage: Entered by the claims handler from the approved claim lines; it must not exceed approved liability and is reported against reserves., relationshipContext: Compared with the approved claim amount and the payment made., businessMeaning: Represents settlement value attributable to the claim.}}
    - name: method
      type: enum
      required: true
      values: [PAYMENT, SERVICE, OFFSET, RECOVERY, OTHER]
      help:
        summary: 'How the approved claim liability is discharged: by payment, service, offset, recovery or another agreed route.'
        usage: Chosen when the settlement is drafted; decides whether a Payment is expected and how accounting records the discharge.
        valueSemantics:
          PAYMENT: Liability is discharged by a cash payment to the claimant, which should be linked to a Payment.
          SERVICE: Liability is discharged by providing a service, such as a repair or replacement, instead of money.
          OFFSET: Liability is discharged by netting it against an amount the claimant owes, with no cash movement.
          RECOVERY: Liability is discharged through recovery from a third party, such as a subrogation or salvage recovery.
          OTHER: Liability is discharged by a method not listed here, with the arrangement described in the claim notes.
        businessMeaning: Distinguishes cash payment from non-cash or recovery settlement semantics.
        relationshipContext: Payment relationship is expected when method is PAYMENT under policy.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, EXECUTED, VOID]
      help:
        summary: Where the settlement stands between preparation, approval, execution and voiding.
        usage: Starts as DRAFT; claims finance approves and then executes it, and an executed settlement must reconcile to its payment or service evidence.
        valueSemantics:
          DRAFT: Being prepared; nothing is committed.
          APPROVED: Approved and ready to be carried out.
          EXECUTED: Paid or otherwise discharged. A final state.
          VOID: Cancelled and of no effect. A final state.
        businessMeaning: "Separates preparation, approval, execution and voiding."
        relationshipContext: EXECUTED must reconcile to payment/service evidence where applicable.
  relationships:
    - {name: claim, target: InsuranceClaim, cardinality: "1", ownership: reference, help: {cardinalityMeaning: A settlement discharges one insurance claim; separate claims are settled separately., summary: InsuranceClaim whose liability is settled., businessMeaning: Supplies approved claim context., usage: "Claims payment and reconciliation.", workflowRole: Settlement must not exceed approved liability except governed adjustments.}}
    - {name: claimLines, target: ClaimLine, cardinality: "1..*", ownership: reference, help: {cardinalityMeaning: At least one claim line is settled; each line is covered by the settlement., summary: Claim lines to which settlement is allocated., businessMeaning: Preserves line-level liability discharge traceability., usage: "Claims accounting and audit.", workflowRole: Lines must belong to the same Claim and be eligible for settlement.}}
    - {name: currency, target: Currency, cardinality: "1", ownership: reference, help: {cardinalityMeaning: The amount is in exactly one currency., summary: Currency of the settlement amount., businessMeaning: Makes financial value unambiguous., usage: "Claims finance and reporting.", workflowRole: Conversion and accounting policy remain separately governed.}}
    - {name: payment, target: Payment, cardinality: "0..1", ownership: reference, help: {summary: Payment transaction executing the settlement when method is PAYMENT., businessMeaning: Separates insurance liability discharge authorization from cash movement evidence., usage: "Reconciliation and accounting.", cardinalityMeaning: Optional for non-payment settlement methods., workflowRole: EXECUTED PAYMENT settlements must reconcile to attributable Payment evidence.}}
  invariants:
    - {id: SETTLEMENT-001, rule: amount must be positive.}
    - {id: SETTLEMENT-002, rule: All ClaimLines must belong to the referenced InsuranceClaim.}
    - {id: SETTLEMENT-003, rule: EXECUTED settlement is immutable historical evidence; corrections use reversal or follow-up settlement/payment evidence.}
    - {id: SETTLEMENT-004, rule: Execution retries must be idempotent to prevent duplicate claim payment.}
  lifecycle:
    title: Settlement Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, EXECUTED, VOID]
    initial: DRAFT
    terminal: [EXECUTED, VOID]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: DRAFT, to: VOID, action: void}
      - {from: APPROVED, to: EXECUTED, action: execute}
      - {from: APPROVED, to: VOID, action: void}
  help:
    summary: Records the governed discharge of approved insurance claim liability.
    businessMeaning: ClaimLine determines approved liability; Settlement allocates/discharges it; Payment records cash movement when applicable.
    usage: Insurance claims, payments, recoveries, reconciliation, accounting and audit.
    relationshipContext: Claim and ClaimLines are mandatory, Currency defines value, and Payment supplies execution evidence for monetary settlement.
    lifecycle: Settlement is drafted, approved and executed or voided, with executed transactions immutable.
    example: Two approved ClaimLines totaling 4,000 are paid through one Settlement linked to the resulting Payment transaction.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SETTLEMENT}
