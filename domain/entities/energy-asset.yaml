      required: true
      maxLength: 100
      help:
        summary: Captures the business meaning of asset type for the EnergyAsset. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where applicable.
