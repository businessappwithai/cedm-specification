    - name: capacity
      type: decimal
      required: false
      precision: 20
      scale: 6
      help:
        summary: Captures the business meaning of capacity for the EnergyAsset. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where applicable.
        relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - MAINTENANCE
        - DECOMMISSIONED
      help:
        summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where applicable.
        relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          PLANNED: Represents the planned state or classification in the context of EnergyAsset.
          ACTIVE: Represents the active state or classification in the context of EnergyAsset.
          MAINTENANCE: Represents the maintenance state or classification in the context of EnergyAsset.
          DECOMMISSIONED: Represents the decommissioned state or classification in the context of EnergyAsset.
  relationships:
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Connects EnergyAsset to Location so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Location records associated with a EnergyAsset.
        cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
