entity:
  name: EnergyAsset
  namespace: cedm.domain
  kind: energy_entity
  description: A physical asset used to generate, transmit, distribute, store, or consume energy.
  ui:
    icon: box
    recordLabel: [assetCode]
  identity:
    key: energyAssetId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: energyAssetId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the energy asset record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a energy asset store this identifier. The number or code people quote is a separate field.
  - name: assetCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the energy asset.
      usage: Used in operations, metering and maintenance.
      relationshipContext: Unique.
  - name: assetType
    type: string
    required: true
    maxLength: 100
    help:
      summary: What kind of asset it is, such as wind turbine, solar array, battery, transformer or boiler.
      usage: Decides its maintenance programme and reporting.
      relationshipContext: From the operator's asset classes.
  - name: capacity
    type: decimal
    required: false
    precision: 20
    scale: 6
    help:
      summary: The rated capacity of the asset.
      usage: Used in capacity planning and availability reports.
      relationshipContext: In the unit stated with it, such as kW or kWh.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - MAINTENANCE
    - DECOMMISSIONED
    help:
      summary: Whether the asset is in service.
      usage: Moved on by operations.
      relationshipContext: Only active assets count towards available capacity.
      valueSemantics:
        PLANNED: Being built or commissioned.
        ACTIVE: In service.
        MAINTENANCE: Out of service for maintenance.
        DECOMMISSIONED: Permanently out of service.
  - name: capacityUnit
    type: string
    required: false
    maxLength: 10
    help:
      summary: The unit of the capacity, such as kW, MW or kWh.
      usage: Read with the capacity.
      relationshipContext: Power for generators, energy for storage.
  - name: commissionedDate
    type: date
    required: false
    help:
      summary: When the asset went into service.
      usage: Starts its operating history.
      relationshipContext: Not in the future.
  - name: fuelType
    type: string
    required: false
    maxLength: 50
    help:
      summary: The energy source, such as solar, wind, gas or grid electricity.
      usage: Used in emission and renewable-share reporting.
      relationshipContext: Free text from the operator's list.
  relationships:
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the asset is installed.
      usage: Set when the asset is registered.
      cardinalityMeaning: At most one.
      context: Used for site reports.
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The organization that owns or operates the asset.
      usage: Set when the asset is registered.
      cardinalityMeaning: Exactly one.
      context: Its output is reported for this organization.
  - name: maintenanceWorkOrders
    target: MaintenanceWorkOrder
    cardinality: 0..*
    ownership: reference
    help:
      summary: Maintenance done or planned on the asset.
      usage: Listed from the asset.
      cardinalityMeaning: Any number; each work order is for one asset.
      context: The work order records its asset.
    inverseCardinality: '1'
  invariants:
  - {id: ENERGY-ASSET-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Energy Asset Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, DECOMMISSIONED]
    initial: PLANNED
    terminal: [DECOMMISSIONED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
    - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
    - {from: PLANNED, to: DECOMMISSIONED, action: mark_decommissioned}
    - {from: ACTIVE, to: DECOMMISSIONED, action: mark_decommissioned}
    - {from: MAINTENANCE, to: DECOMMISSIONED, action: mark_decommissioned}
  help:
    summary: A plant or piece of equipment that produces, stores, carries or uses energy, such as a turbine or a battery.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization, MaintenanceWorkOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Energy companies and large consumers register their generation, storage, network and consuming assets with their capacity; operations follow their availability and output; maintenance is planned against them.
    lifecycle: Planned before commissioning, active while in service, in maintenance during outages, and decommissioned at end of life.
    example: Asset PV-LYO-01, rooftop solar array, 850 kWp, Plant Lyon roof, commissioned June 2022, active.
    businessMeaning: Energy assets are capital-intensive and regulated; operating, maintaining and reporting on them is the core of an energy business.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-ASSET
