  invariants:
    - {id: ENERGY-ASSET-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Energy Asset Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, DECOMMISSIONED]
    initial: PLANNED
    terminal: [DECOMMISSIONED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: PLANNED, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: ACTIVE, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: MAINTENANCE, to: DECOMMISSIONED, action: mark_decommissioned}
