entity:
  name: EnergyAsset
  namespace: cedm.domain
  kind: energy_entity
  description: A physical asset used to generate, transmit, distribute, store, or consume energy.
  ui:
    icon: box
  identity:
    key: energyAssetId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: energyAssetId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the energy asset.
        usage: Generated on registration; work orders and readings refer to the asset through it.
    - name: assetCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The asset tag by which engineers and systems refer to the equipment, such as TX-0412.
        usage: Assigned at registration; unique; printed on the equipment and used in work orders.
    - name: assetType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of plant, such as transformer, turbine, battery store or substation.
        usage: Chosen at registration; groups assets for maintenance programmes and reporting.
    - name: capacity
      type: decimal
      required: false
      precision: 20
      scale: 6
      help:
        summary: The rated capacity of the asset, in the unit conventional for its type (for example MW or MWh).
        usage: Entered from the nameplate or commissioning test; used for capacity planning. Not negative.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - MAINTENANCE
        - DECOMMISSIONED
      help:
        summary: Whether the asset is available to operate.
        usage: Set by operations and maintenance; planners count only ACTIVE assets as available.
        valueSemantics:
          PLANNED: Approved but not yet built or commissioned.
          ACTIVE: In service and operating.
          MAINTENANCE: Out of service while maintenance or repair is carried out.
          DECOMMISSIONED: Permanently retired from service. A final state.
  relationships:
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The site where the asset stands.
        usage: Set at registration; updated if the asset is relocated.
        cardinalityMeaning: At most one location; mobile or not-yet-sited assets may have none.
        workflowRole: Lets crews and planners find the equipment.
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation that owns or operates the asset.
        usage: Set at registration.
        cardinalityMeaning: Exactly one organisation, because every asset must have an accountable operator.
        workflowRole: Establishes who is responsible for operating and maintaining the equipment.
    - name: maintenanceWorkOrders
      target: MaintenanceWorkOrder
      cardinality: 0..*
      ownership: reference
      help:
        summary: The maintenance work orders raised against the asset.
        usage: Read to see the asset's maintenance history and open work.
        cardinalityMeaning: Any number over the asset's life.
        workflowRole: Open work orders may restrict whether the asset can return to service.
  invariants:
    - {id: ENERGY-ASSET-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Energy Asset Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, DECOMMISSIONED]
    initial: PLANNED
    terminal: [DECOMMISSIONED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: PLANNED, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: ACTIVE, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: MAINTENANCE, to: DECOMMISSIONED, action: mark_decommissioned}
  help:
    summary: A physical asset used to generate, transmit, distribute, store or consume energy.
    businessMeaning: Energy businesses run on physical plant. Each asset record carries its type and capacity, so planners know what is available and maintenance work can be tracked against the equipment it concerns.
    usage: Registered when plant is planned or commissioned; updated through maintenance and outages; read by operations, asset management and regulators.
    relationshipContext: An asset belongs to an Organization, stands at a Location and is the subject of MaintenanceWorkOrders.
    lifecycle: An asset is planned, goes active when commissioned, moves to maintenance when taken out of service for work, and is eventually decommissioned for good.
    example: A 50 MW solar array at the Almeria site, commissioned in 2024 and under annual maintenance each spring.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-ASSET
