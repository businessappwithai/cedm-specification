entity:
  name: EnergyAsset
  namespace: cedm.domain
  kind: energy_entity
  description: A physical asset used to generate, transmit, distribute, store, or consume energy.
  ui:
    icon: box
  identity:
    key: energyAssetId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: energyAssetId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the energy asset record associated with this EnergyAsset. The identifier connects this record to
        the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of the asset, so maintenance work orders, readings and performance history stay attached to the same equipment through moves and renaming."
  - name: assetCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of asset code for the EnergyAsset. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The tag engineers see on the equipment and in drawings, such as WTG-07 or TX-SUB3-02, used in the field and in work orders to identify exactly which unit is meant."
  - name: assetType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of asset type for the EnergyAsset. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "What kind of equipment this is, such as wind turbine, solar inverter or battery storage, which decides its maintenance regime and how its capacity is reported."
  - name: capacity
    type: decimal
    required: false
    precision: 20
    scale: 6
    help:
      summary: Captures the business meaning of capacity for the EnergyAsset. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The rated output or storage the asset can deliver, used in capacity planning, grid commitments and performance comparisons; it cannot be negative."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - MAINTENANCE
    - DECOMMISSIONED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating EnergyAsset records, where
        applicable.
      relationshipContext: Its meaning is specific to EnergyAsset; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of EnergyAsset.
        ACTIVE: Represents the active state or classification in the context of EnergyAsset.
        MAINTENANCE: Represents the maintenance state or classification in the context of EnergyAsset.
        DECOMMISSIONED: Represents the decommissioned state or classification in the context of EnergyAsset.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the asset is still PLANNED, ACTIVE and available to the network, out of service for MAINTENANCE, or permanently DECOMMISSIONED; dispatch and planning count only active assets."
  relationships:
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects EnergyAsset to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a EnergyAsset.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects EnergyAsset to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a EnergyAsset.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: maintenanceWorkOrders
    target: MaintenanceWorkOrder
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects EnergyAsset to MaintenanceWorkOrder so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MaintenanceWorkOrder records associated with a EnergyAsset.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - {id: ENERGY-ASSET-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  lifecycle:
    title: Energy Asset Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, DECOMMISSIONED]
    initial: PLANNED
    terminal: [DECOMMISSIONED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: PLANNED, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: ACTIVE, to: DECOMMISSIONED, action: mark_decommissioned}
      - {from: MAINTENANCE, to: DECOMMISSIONED, action: mark_decommissioned}
  help:
    summary: "A physical piece of energy equipment, such as a turbine, transformer, battery or meter, that the organisation generates, transmits, stores or uses energy with and must operate and maintain."
    businessMeaning: EnergyAsset is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate EnergyAsset records.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization,
      MaintenanceWorkOrder. These relationships provide the context needed to interpret the record rather than treating its
      fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical EnergyAsset record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Registered as planned during project development, activated at commissioning, moved into maintenance and back while work orders are carried out, and decommissioned at end of life; operations, maintenance planning and capacity reporting read it throughout."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENERGY-ASSET
