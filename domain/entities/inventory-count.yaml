entity:
  name: InventoryCount
  namespace: cedm.domain
  kind: inventory_observation_transaction
  description: A governed physical or system-assisted observation of inventory quantity at an InventoryLocation used to reconcile recorded stock without directly changing the inventory ledger.
  ui:
    icon: boxes
  identity: {key: inventoryCountId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: inventoryCountId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of count observation., businessMeaning: Identifies one count evidence record., usage: "Cycle count, stocktake, reconciliation and audit.", relationshipContext: May cause InventoryAdjustment after approval., requiredMeaning: Required.}}
  - {name: countNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: Human-facing count reference., businessMeaning: Operational identifier for count activity., usage: Warehouse execution and audit., relationshipContext: Distinct from adjustment reference., requiredMeaning: Required.}}
  - {name: countedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Quantity physically/systematically observed., businessMeaning: Evidence of stock reality at count time., usage: Variance calculation and approval., relationshipContext: Does not itself alter InventoryBalance., requiredMeaning: Required.}}
  - {name: countedAt, type: datetime, required: true, help: {summary: Effective observation time., businessMeaning: Anchors the count against ledger chronology., usage: Cutoff and reconciliation., relationshipContext: Movements around count time require controlled cutoff treatment., requiredMeaning: Required.}}
  relationships:
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product counted., businessMeaning: Identifies observed item., usage: Reconciliation., cardinalityMeaning: Exactly one Product., workflowRole: Must match stock context.}}
  - {name: inventoryLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: Location counted., businessMeaning: Defines physical/accountable stock scope., usage: Cycle counting and stocktake., cardinalityMeaning: Exactly one location., workflowRole: Ledger cutoff uses this location.}}
  - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {summary: Lot counted where applicable., businessMeaning: Preserves batch-specific observation., usage: Traceability and reconciliation., cardinalityMeaning: Required under lot-controlled count scope., workflowRole: Variance is lot-specific.}}
  - {name: serialNumbers, target: SerialNumber, cardinality: 0..*, ownership: reference, help: {summary: Serialized units observed., businessMeaning: Provides unit-level count evidence., usage: Custody reconciliation., cardinalityMeaning: Required according to serialization policy., workflowRole: Serial presence must reconcile with quantity.}, inverseCardinality: 0..*}
  - {name: adjustments, target: InventoryAdjustment, cardinality: 0..*, ownership: reference, help: {summary: Approved corrections arising from this count., businessMeaning: Separates observation from ledger correction., usage: Audit and variance resolution., cardinalityMeaning: A count may require no adjustment or multiple governed corrections., workflowRole: Adjustment must be approved before posting.}}
  invariants:
  - {id: INVENTORY-COUNT-001, rule: countedQuantity must not be negative.}
  - {id: INVENTORY-COUNT-002, rule: InventoryCount is observational and must never directly change stock balances.}
  - {id: INVENTORY-COUNT-003, rule: Count variance must use a governed ledger cutoff and account for movements around countedAt.}
  - {id: INVENTORY-COUNT-004, rule: Approved discrepancy correction must occur through InventoryAdjustment and InventoryMovement.}
  - {id: INVENTORY-COUNT-EXE-001, rule: "Counted Quantity cannot be negative.", violatedWhen: "counted_quantity != null and counted_quantity < 0", message: "Counted Quantity cannot be negative."}
  help:
    summary: Physical inventory observation used for controlled reconciliation.
    businessMeaning: A count states what was observed; it does not rewrite what the ledger says happened.
    usage: Cycle count, annual stocktake, serial verification and inventory-control audit.
    relationshipContext: Product/location/lot/serial define count scope; InventoryAdjustment resolves approved variance.
    lifecycle: Planned/performed → reviewed → reconciled → closed; evidence retained.
    changePropagation: Approved variance may create adjustments; observations themselves never post inventory.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-COUNT}
