entity:
  name: InventoryCount
  namespace: cedm.domain
  kind: inventory_observation_transaction
  description: A governed physical or system-assisted observation of inventory quantity at an InventoryLocation used to reconcile recorded stock without directly changing the inventory ledger.
  ui:
    icon: boxes
  identity: {key: inventoryCountId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: inventoryCountId, type: uuid, required: true, immutable: true, help: {summary: The identity of the count record., usage: Generated when the count is entered; adjustments refer to it., businessMeaning: Identifies one count evidence record., relationshipContext: May cause InventoryAdjustment after approval.}}
    - {name: countNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: The document number of the count., usage: Allocated from a number series; unique; printed on count sheets., businessMeaning: Operational identifier for count activity., relationshipContext: Distinct from adjustment reference.}}
    - {name: countedQuantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: The quantity actually found on the shelf., usage: Entered by the counter; compared with the system quantity to find the variance., businessMeaning: Evidence of stock reality at count time., relationshipContext: Does not itself alter InventoryBalance.}}
    - {name: countedAt, type: datetime, required: true, help: {summary: When the count was made., usage: Entered with the count; the system quantity at that time is the comparison., businessMeaning: Anchors the count against ledger chronology., relationshipContext: Movements around count time require controlled cutoff treatment.}}
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The product that was counted., usage: Set when the count is entered., cardinalityMeaning: 'Exactly one product: each count line observes one item.', workflowRole: Identifies which balance the count tests., businessMeaning: Identifies observed item.}}
    - {name: inventoryLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: The location where the count was made., usage: Set when the count is entered., cardinalityMeaning: Exactly one location., workflowRole: Identifies which balance the count tests., businessMeaning: Defines physical/accountable stock scope.}}
    - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {summary: Lot counted where applicable., businessMeaning: Preserves batch-specific observation., usage: Traceability and reconciliation., cardinalityMeaning: Required under lot-controlled count scope., workflowRole: Variance is lot-specific.}}
    - {name: serialNumbers, target: SerialNumber, cardinality: 0..*, ownership: reference, help: {summary: The serial numbers found during the count., usage: Entered for serialised products., cardinalityMeaning: 'Any number, one for each serialised unit found.', workflowRole: Verify that each tracked unit is where the records say., businessMeaning: Provides unit-level count evidence.}}
    - {name: adjustments, target: InventoryAdjustment, cardinality: 0..*, ownership: reference, help: {summary: Approved corrections arising from this count., businessMeaning: Separates observation from ledger correction., usage: Audit and variance resolution., cardinalityMeaning: A count may require no adjustment or multiple governed corrections., workflowRole: Adjustment must be approved before posting.}}
  invariants:
    - {id: INVENTORY-COUNT-001, rule: countedQuantity must not be negative.}
    - {id: INVENTORY-COUNT-002, rule: InventoryCount is observational and must never directly change stock balances.}
    - {id: INVENTORY-COUNT-003, rule: Count variance must use a governed ledger cutoff and account for movements around countedAt.}
    - {id: INVENTORY-COUNT-004, rule: Approved discrepancy correction must occur through InventoryAdjustment and InventoryMovement.}
    - {id: INVENTORY-COUNT-EXE-001, rule: "Counted Quantity cannot be negative.", violatedWhen: "counted_quantity != null and counted_quantity < 0", message: "Counted Quantity cannot be negative."}
  help:
    summary: Physical inventory observation used for controlled reconciliation.
    businessMeaning: A count states what was observed; it does not rewrite what the ledger says happened.
    usage: Cycle count, annual stocktake, serial verification and inventory-control audit.
    relationshipContext: Product/location/lot/serial define count scope; InventoryAdjustment resolves approved variance.
    lifecycle: Planned/performed → reviewed → reconciled → closed; evidence retained.
    changePropagation: Approved variance may create adjustments; observations themselves never post inventory.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-COUNT}
