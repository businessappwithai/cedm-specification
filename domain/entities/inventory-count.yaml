entity:
  name: InventoryCount
  namespace: cedm.domain
  kind: inventory_observation_transaction
  description: A governed physical or system-assisted observation of inventory quantity at an InventoryLocation used to reconcile recorded stock without directly changing the inventory ledger.
  ui:
    icon: boxes
  identity: {key: inventoryCountId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: inventoryCountId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the inventory count record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a inventory count store this identifier. The number or code people quote is a separate field.
  - name: countNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the count.
      businessMeaning: Operational identifier for count activity.
      usage: Assigned when the count is planned.
      relationshipContext: Unique.
  - name: countedQuantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How many units were found.
      businessMeaning: Evidence of stock reality at count time.
      usage: Entered or scanned by the counter.
      relationshipContext: Compared with the system quantity.
  - name: countedAt
    type: datetime
    required: true
    help:
      summary: When the count was made.
      businessMeaning: Anchors the count against ledger chronology.
      usage: Recorded by the counter.
      relationshipContext: Movements after this time are excluded from the comparison.
  - name: systemQuantity
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: How many units the system expected at the time of the count.
      usage: Snapshot taken when counting starts.
      relationshipContext: The difference becomes an adjustment.
  - name: difference
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: Counted minus system quantity.
      usage: Shown for review; large differences are recounted.
      relationshipContext: May be negative.
  - name: countType
    type: enum
    required: true
    default: CYCLE
    values: [CYCLE, ANNUAL, SPOT]
    help:
      summary: Why the count was made.
      usage: Decides who counts and when.
      relationshipContext: Annual counts freeze movements.
      valueSemantics:
        CYCLE: A routine count of some locations.
        ANNUAL: The full year-end count.
        SPOT: An unplanned count after a problem.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, COUNTED, RECOUNT, APPROVED]
    help:
      summary: Where the count stands.
      usage: Moved on by the counter and the supervisor.
      relationshipContext: Differences are adjusted only from approved counts.
      valueSemantics:
        PLANNED: Scheduled.
        COUNTED: Counted; difference to review.
        RECOUNT: A recount was ordered.
        APPROVED: Accepted; any difference is adjusted.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product counted.
      businessMeaning: Identifies observed item.
      workflowRole: Must match stock context.
      usage: Set when planning the count.
      cardinalityMeaning: Exactly one.
      context: Counts are per product and location.
  - name: inventoryLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: The location counted.
      businessMeaning: Defines physical/accountable stock scope.
      workflowRole: Ledger cutoff uses this location.
      usage: Set when planning the count.
      cardinalityMeaning: Exactly one.
      context: Movements there are frozen during the count.
  - name: lot
    target: Lot
    cardinality: 0..1
    ownership: reference
    help:
      summary: The lot counted, for lot-tracked products.
      businessMeaning: Preserves batch-specific observation.
      workflowRole: Variance is lot-specific.
      usage: Entered by the counter.
      cardinalityMeaning: At most one.
      context: Each lot is counted separately.
  - name: serialNumbers
    target: SerialNumber
    cardinality: 0..*
    ownership: reference
    help:
      summary: The serial numbers found.
      businessMeaning: Provides unit-level count evidence.
      workflowRole: Serial presence must reconcile with quantity.
      usage: Scanned by the counter.
      cardinalityMeaning: Any number.
      context: A many-to-many relation; units appear in many counts over time.
    inverseCardinality: 0..*
  - name: adjustments
    target: InventoryAdjustment
    cardinality: 0..*
    ownership: reference
    help:
      summary: The adjustments posted from the count.
      businessMeaning: Separates observation from ledger correction.
      workflowRole: Adjustment must be approved before posting.
      usage: Created when the count is approved.
      cardinalityMeaning: Any number; each adjustment rests on one count.
      context: The adjustment records its count.
  invariants:
  - {id: INVENTORY-COUNT-001, rule: countedQuantity must not be negative.}
  - {id: INVENTORY-COUNT-002, rule: InventoryCount is observational and must never directly change stock balances.}
  - {id: INVENTORY-COUNT-003, rule: Count variance must use a governed ledger cutoff and account for movements around countedAt.}
  - {id: INVENTORY-COUNT-004, rule: Approved discrepancy correction must occur through InventoryAdjustment and InventoryMovement.}
  - {id: INVENTORY-COUNT-EXE-001, rule: "Counted Quantity cannot be negative.", violatedWhen: "counted_quantity != null and counted_quantity < 0", message: "Counted Quantity cannot be negative."}
  lifecycle:
    title: Inventory Count Lifecycle
    attribute: status
    states: [PLANNED, COUNTED, RECOUNT, APPROVED]
    initial: PLANNED
    terminal: [APPROVED]
    transitions:
    - {from: PLANNED, to: COUNTED, action: count}
    - {from: COUNTED, to: RECOUNT, action: order_recount}
    - {from: RECOUNT, to: COUNTED, action: count}
    - {from: COUNTED, to: APPROVED, action: approve}
  help:
    summary: Physical inventory observation used for controlled reconciliation.
    businessMeaning: A count states what was observed; it does not rewrite what the ledger says happened.
    usage: Cycle count, annual stocktake, serial verification and inventory-control audit.
    relationshipContext: Product/location/lot/serial define count scope; InventoryAdjustment resolves approved variance.
    lifecycle: Planned/performed → reviewed → reconciled → closed; evidence retained.
    changePropagation: Approved variance may create adjustments; observations themselves never post inventory.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-COUNT}
