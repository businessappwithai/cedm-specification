entity:
  name: Money
  namespace: cedm.domain
  kind: value_object
  description: A monetary value consisting of an amount and its Currency, with explicit semantic context for pricing, taxation, discounting, invoicing, payment, banking, and accounting.
  ui:
    icon: table
  identity:
    key:
    type: value_object
    generated: false
    immutable: true
  attributes:
  - name: amount
    type: decimal
    required: true
    precision: 24
    scale: 6
    help:
      summary: The numeric amount.
      businessMeaning: Represents the magnitude of a financial amount but has no complete meaning without currency and amount semantics.
      workflowRole: Carries the numeric component of financial facts through pricing, ordering, billing, settlement, banking, and accounting workflows.
      requiredMeaning: Required because a Money value without an amount is incomplete.
      usage: Entered or computed by the record that holds it.
      relationshipContext: Interpreted in the currency.
  - name: currencyId
    type: reference
    target: Currency
    required: true
    immutable: true
    help:
      summary: The currency of the amount.
      businessMeaning: Supplies the monetary denomination required to interpret amount.
      workflowRole: Ensures amounts from Product pricing, SalesOrder, Invoice, Payment, BankTransaction, and JournalEntry can be compared only when currency-compatible or explicitly converted.
      requiredMeaning: Required because amount without currency is financially ambiguous.
      usage: Taken from the record's currency.
      relationshipContext: Amounts in different currencies are converted before they are added.
  - name: scalePolicy
    type: enum
    required: false
    values: [CURRENCY_STANDARD, TRANSACTION_DEFINED, ACCOUNTING_DEFINED]
    help:
      summary: How many decimals the amount keeps.
      workflowRole: Prevents silent precision changes during pricing, tax, allocation, conversion, and posting.
      optionalMeaning: Optional when the consuming process has an unambiguous global precision policy.
      usage: Set by the kind of record holding the amount.
      relationshipContext: Rounding follows it.
      valueSemantics:
        CURRENCY_STANDARD: The currency's own number of decimals.
        TRANSACTION_DEFINED: The decimals the transaction states, such as for unit prices.
        ACCOUNTING_DEFINED: The decimals the accounting policy sets.
  invariants:
  - id: MONEY-001
    rule: currencyId is required for every Money value.
  - id: MONEY-002
    rule: Monetary arithmetic across different currencies requires an explicit approved exchange-rate/conversion context.
  - id: MONEY-003
    rule: Money values representing different business semantics must not be combined merely because they share the same currency; for example tax, discount, gross, net, paid, and outstanding amounts remain distinct facts.
  - id: MONEY-004
    rule: Rounding must be explicit and reproducible at the calculation boundary defined by the consuming transaction or accounting policy.
  - id: MONEY-005
    rule: Historical Money values must preserve their original currency and recorded amount even if Currency master data is later retired or its display metadata changes.
  - {id: MONEY-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  help:
    summary: An amount together with its currency.
    workflowContext: Product reference price → SalesOrder/PurchaseOrder amounts → tax/discount calculation → Invoice totals → Payment → PaymentAllocation → BankTransaction → JournalEntry. Currency conversion, where required, is a separate controlled operation and must be traceable.
    lifecycle: Money is immutable as a value within a business fact. A correction creates a new value or reversal event rather than mutating historical financial evidence.
    businessMeaning: An amount without its currency is meaningless. Money keeps the two together so that every price, total and balance can be added, converted and rounded correctly.
    usage: Used inside other records wherever an amount appears.
    relationshipContext: Holds the Currency the amount is in; its scale policy says how many decimals are kept.
    example: 1,250.00 EUR; 980 JPY (no decimals).
  relationships: []
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-MONEY
