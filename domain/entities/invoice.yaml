# CEDM Domain Entity: Invoice
entity:
  name: Invoice
  namespace: cedm.domain
  kind: financial_commercial_transaction
  description: A commercial document requesting or recording payment for supplied goods or services.
  identity: {key: invoiceId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: invoiceId, type: uuid, required: true, immutable: true}
    - {name: invoiceNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: invoiceDate, type: date, required: true}
    - {name: dueDate, type: date, required: false}
    - {name: invoiceType, type: enum, required: true, values: [SALES, PURCHASE, CREDIT_NOTE, DEBIT_NOTE]}
    - {name: status, type: enum, required: true, default: DRAFT, values: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED, VOID]}
    - {name: currencyId, type: reference, target: Currency, required: true}
    - {name: subtotal, type: decimal, required: true, precision: 20, scale: 4}
    - {name: taxAmount, type: decimal, required: true, precision: 20, scale: 4}
    - {name: totalAmount, type: decimal, required: true, precision: 20, scale: 4}
  relationships:
    - {name: customer, target: Customer, cardinality: "0..1", ownership: reference}
    - {name: supplier, target: Supplier, cardinality: "0..1", ownership: reference}
    - {name: lines, target: InvoiceLine, cardinality: "1..*", ownership: aggregate}
    - {name: paymentTerms, target: PaymentTerm, cardinality: "0..1", ownership: reference}
    - {name: salesOrder, target: SalesOrder, cardinality: "0..1", ownership: reference}
    - {name: purchaseOrder, target: PurchaseOrder, cardinality: "0..1", ownership: reference}
  invariants:
    - {id: INVOICE-001, rule: totalAmount equals subtotal plus tax and applicable adjustments according to invoice policy.}
    - {id: INVOICE-002, rule: dueDate must not precede invoiceDate.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVOICE}
