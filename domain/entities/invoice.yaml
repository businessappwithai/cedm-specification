entity:
  name: Invoice
  namespace: cedm.domain
  kind: financial_commercial_transaction
  description: A formal commercial document that records an amount owed for supplied goods or services and establishes the financial claim to be settled under defined payment terms.
  identity: {key: invoiceId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: invoiceId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable system identity of the invoice record.
        usage: Used for financial integrations, audit, payment allocation, reconciliation, reporting, and lifecycle navigation.
        relationshipContext: Identifies the financial claim independently of invoiceNumber, source orders, receipts, and payments.
    - name: invoiceNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The business-facing reference assigned to the invoice.
        usage: Used by suppliers, customers, accounts payable, accounts receivable, tax processes, and reconciliation.
        relationshipContext: Distinct from invoiceId and source order numbers.
    - name: invoiceDate
      type: date
      required: true
      help:
        summary: The accounting and commercial date assigned to the invoice.
        usage: Used for accounting periods, tax, aging, reporting, and reconciliation.
    - name: dueDate
      type: date
      required: false
      help:
        summary: The contractual or calculated date by which the claim is expected to be settled.
        usage: Drives aging, collections, cash forecasting, and supplier payment planning.
        relationshipContext: Normally interpreted with PaymentTerm.
    - name: invoiceType
      type: enum
      required: true
      values: [SALES, PURCHASE, CREDIT_NOTE, DEBIT_NOTE]
      help:
        summary: Identifies the commercial direction and accounting nature of the document.
        usage: Determines receivable/payable processing and adjustment behavior.
        relationshipContext: Must agree with Customer/Supplier and relevant source transaction.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED, VOID]
      help:
        summary: The lifecycle state of the financial claim.
        usage: Controls issuance, settlement, aging, cancellation, and reporting.
        relationshipContext: Payment records provide settlement evidence; invoice status must not be inferred from a single payment event.
    - name: currencyId
      type: reference
      target: Currency
      required: true
      help:
        summary: The currency denomination of invoice amounts.
        usage: Used for accounting, payment, tax, reconciliation, and reporting.
    - name: subtotal
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: Aggregate invoice-line value before tax and document-level adjustments.
        usage: Used for tax, accounting, and reconciliation.
    - name: taxAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: Aggregate tax applied under applicable rules.
        usage: Used for tax reporting, accounting, and total calculation.
    - name: totalAmount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: Total financial claim after line values, tax, credits, and debits.
        usage: Used for settlement, aging, reporting, and reconciliation.
        relationshipContext: Represents the claim, not the amount already paid.
  relationships:
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: Customer associated with a sales invoice.
        usage: Supports receivables, statements, collections, and tax documentation.
    - name: supplier
      target: Supplier
      cardinality: 0..1
      ownership: reference
      help:
        summary: Supplier associated with a purchase invoice.
        usage: Supports payables, supplier statements, and procurement reconciliation.
    - name: lines
      target: InvoiceLine
      cardinality: 1..*
      ownership: aggregate
      help:
        summary: Detailed billed goods, services, credits, or adjustments.
        usage: Provides the commercial detail from which invoice totals and matching are validated.
    - name: paymentTerms
      target: PaymentTerm
      cardinality: 0..1
      ownership: reference
      help:
        summary: Rules governing expected settlement timing and conditions.
        usage: Supports due-date calculation and payment workflows.
    - name: salesOrder
      target: SalesOrder
      cardinality: 0..1
      ownership: reference
      help:
        summary: Sales order from which a sales invoice may originate.
        usage: Supports order-to-cash traceability and billing reconciliation.
        context: SalesOrder is the commercial commitment; Invoice is the financial claim.
    - name: purchaseOrder
      target: PurchaseOrder
      cardinality: 0..1
      ownership: reference
      help:
        summary: Purchase order against which a supplier invoice is evaluated.
        usage: Supports procurement reconciliation and three-way matching.
        context: PurchaseOrder represents commitment; GoodsReceipt represents fulfillment; Invoice represents the financial claim.
    - name: goodsReceipts
      target: GoodsReceipt
      cardinality: 0..*
      ownership: reference
      help:
        summary: GoodsReceipt evidence used to validate invoiced supplier quantities and acceptance.
        usage: Supports three-way matching among PurchaseOrder, GoodsReceipt, and Invoice.
        cardinalityMeaning: Multiple receipts may support one invoice when billing covers multiple deliveries.
        context: Receipt evidence must remain separate from the financial claim.
  invariants:
    - {id: INVOICE-001, rule: totalAmount must reconcile with subtotal, taxAmount, and applicable document-level adjustments.}
    - {id: INVOICE-002, rule: dueDate must not precede invoiceDate.}
    - {id: INVOICE-003, rule: an ISSUED invoice must have at least one InvoiceLine.}
    - {id: INVOICE-004, rule: an invoice should have either a Customer or Supplier relationship consistent with invoiceType.}
    - {id: INVOICE-005, rule: A PURCHASE invoice linked to a PurchaseOrder must use applicable accepted GoodsReceipt evidence when three-way matching is required by procurement policy.}
  help:
    summary: Represents a formal financial claim for supplied goods or services and its controlled settlement lifecycle.
    businessMeaning: Invoice bridges commercial activity and financial settlement. It records the claim; it does not prove that ordered goods were received.
    usage: Used by order-to-cash, procure-to-pay, accounting, tax, collections, payments, reconciliation, and audit.
    relationshipContext: For procure-to-pay, PurchaseOrder defines commitment, GoodsReceipt defines actual accepted fulfillment, Invoice defines the supplier claim, and Payment defines settlement. These facts must remain separate so partial deliveries, rejected quantities, advances, and discrepancies are representable.
    lifecycle: Draft preparation precedes issuance. Issued claims can become partially paid, paid, overdue, cancelled, or void according to accounting controls.
    example: A supplier invoices 96 parts against an order for 100. Receiving accepted 94. Accounts payable compares the invoice with the PurchaseOrder and GoodsReceipt before approving the payable, and any discrepancy remains explicit rather than being hidden by invoice status.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-INVOICE}
