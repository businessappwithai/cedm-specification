entity:
  name: Operation
  namespace: cedm.domain
  kind: manufacturing_operation_definition
  description: A sequenced manufacturing process step defining work, resource assignment, standard time, and optional quality requirements within a Routing.
  ui:
    icon: settings
  identity: {key: operationId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: operationId, type: uuid, required: true, immutable: true, help: {summary: The identity of the operation., usage: Generated on creation; work orders and time bookings refer to it., businessMeaning: Identifies one governed process step., relationshipContext: Belongs to one Routing and normally uses a WorkCenter.}}
    - {name: sequence, type: integer, required: true, minimum: 1, help: {summary: The position of the operation in the routing., usage: 'Set by the process engineer, usually in steps of ten so steps can be inserted later.', businessMeaning: Defines process precedence., relationshipContext: Unique within Routing.}}
    - {name: name, type: string, required: true, maxLength: 300, help: {summary: 'The name of the operation, such as Weld frame.', usage: Shown on shop-floor instructions and in reports., businessMeaning: Communicates operation purpose., relationshipContext: Interpreted within Routing.}}
    - {name: standardMinutes, type: decimal, required: false, precision: 12, scale: 3, help: {summary: The standard time allowed for the operation., usage: Set from time studies; planning uses it for capacity and costing for labour and machine cost., businessMeaning: Planning/costing expectation rather than actual elapsed time., relationshipContext: Actual execution may differ.}}
  relationships:
    - {name: routing, target: Routing, cardinality: '1', ownership: reference, inverse: operations, help: {summary: The routing the operation is a step of., usage: Set when the operation is created., cardinalityMeaning: 'Exactly one routing: a step has no meaning outside the process it belongs to.', workflowRole: Operations are released and retired with their routing., businessMeaning: Supplies product/process context.}}
    - {name: workCenter, target: WorkCenter, cardinality: 0..1, ownership: reference, help: {summary: The work centre where the operation is carried out., usage: Chosen when the routing is designed., cardinalityMeaning: At most one work centre; an operation may be assigned later., workflowRole: Determines the capacity the operation loads., businessMeaning: Defines where/by whom work is normally executed.}}
    - {name: qualityPlan, target: QualityPlan, cardinality: 0..1, ownership: reference, help: {summary: The quality plan that applies to the operation., usage: Linked where the step needs inspection., cardinalityMeaning: At most one plan., workflowRole: Triggers inspections at the step., businessMeaning: Embeds inspection/control into production routing.}}
  invariants:
    - {id: OPERATION-001, rule: sequence must be unique within Routing.}
    - {id: OPERATION-002, rule: standardMinutes must be greater than zero when specified.}
    - {id: OPERATION-003, rule: Required quality evidence must complete before governed operation completion or downstream release.}
  help:
    summary: A sequenced step in a manufacturing routing that defines the work, the resource that does it, its standard time and any quality requirements.
    businessMeaning: Production planning breaks a product's manufacture into steps. Each operation says what is done, where and how long it should take, which gives planners their capacity needs and costing its labour and machine time.
    usage: Defined by process engineers when a routing is designed or revised; read by planners, shop-floor systems and costing.
    relationshipContext: An operation belongs to one Routing, runs at a WorkCenter and may require a QualityPlan.
    lifecycle: 'Operations follow the lifecycle of their routing: edited in draft, fixed once released, and retired with it.'
    example: 'Operation 30 of the bicycle routing: weld the frame at work centre WC-WELD, standard time 18 minutes.'
    changePropagation: Definition/resource/quality changes affect future or unreleased work and trigger impact analysis for active work.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-OPERATION}
