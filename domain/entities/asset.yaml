entity:
  name: Asset
  namespace: cedm.domain
  kind: asset_master_entity
  description: A uniquely identifiable durable resource that an organization owns, leases, controls, or operates and manages as a business resource throughout an operational lifecycle.
  ui:
    icon: box
  identity:
    key: assetId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: assetId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable system identity of the asset master record.
        usage: Used to connect maintenance, depreciation, movements, ownership, location, and other lifecycle records to the same physical or accountable asset.
        relationshipContext: assetId identifies the asset itself; assetNumber and serialNumber are business-facing or manufacturer identifiers and must not replace the stable CEDM identity.
    - name: assetNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The organization-assigned business identifier used to recognize an asset in operational and financial processes.
        usage: Used by asset managers, maintenance teams, finance, warehouse operations, reports, documents, and users when referring to the asset.
        relationshipContext: It is the organization's business reference, while serialNumber may identify the manufacturer's physical equipment identity and assetId remains the immutable CEDM identity.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: A human-readable description of the asset used to identify it in lists, forms, reports, and operational communication.
        usage: Supports search, maintenance screens, asset registers, reporting, and user recognition when an asset number alone is insufficient.
        relationshipContext: The name describes this asset instance and should not be confused with Product.name, which describes a reusable product definition or asset type.
    - name: assetType
      type: string
      required: true
      maxLength: 100
      help:
        summary: Classifies the kind of durable resource represented by the asset, such as container, vehicle, machine, building equipment, or other capital-controlled resource.
        usage: Drives asset policies, maintenance programs, depreciation treatment, reporting, authorization, and lifecycle rules.
        relationshipContext: assetType classifies the asset instance; Product can provide the standardized model or product definition from which the asset originated.
    - name: acquisitionDate
      type: date
      required: false
      help:
        summary: The business date on which the organization acquired or otherwise recognized control of the asset.
        usage: Used for capitalization, depreciation start rules, asset aging, warranty analysis, lifecycle reporting, and ownership history.
        relationshipContext: AcquisitionDate concerns the organization's acquisition event and is distinct from manufacture date, commissioning date, or first operational use.
    - name: acquisitionCost
      type: money
      required: false
      help:
        summary: The capitalized or recognized cost associated with acquiring the asset under the organization's accounting policy.
        usage: Used as an input to capitalization, depreciation, book-value calculations, asset valuation, and financial reporting.
        relationshipContext: Acquisition cost is an accounting/business value and should not be confused with Product price, repair cost, sale price, or current market value.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [PLANNED, ACTIVE, UNDER_MAINTENANCE, HELD, DISPOSED, RETIRED]
      help:
        summary: The lifecycle state describing whether the asset is planned, operational, temporarily unavailable, disposed, or retired.
        usage: Controls operational availability, maintenance eligibility, reporting, depreciation policy, and downstream business actions.
        relationshipContext: Asset status describes the asset's lifecycle, while MaintenanceWorkOrder status describes a particular maintenance activity. An asset can be UNDER_MAINTENANCE while a work order is IN_PROGRESS.
        valueSemantics:
          PLANNED: The asset is expected to enter service or be recognized operationally but is not yet active.
          ACTIVE: The asset is available for its intended business use subject to normal operational constraints.
          UNDER_MAINTENANCE: The asset is temporarily undergoing maintenance and may be unavailable or restricted from normal use.
          HELD: The asset is intentionally retained but is not currently available for normal productive use, often pending inspection, disposition, or another decision.
          DISPOSED: The organization has completed the disposition process and no longer treats the asset as an active managed resource.
          RETIRED: The asset has been withdrawn from operational use, while historical records may remain available for audit and analysis.
    - name: serialNumber
      type: string
      required: false
      maxLength: 200
      help:
        summary: The manufacturer or industry identifier permanently associated with the physical equipment when such an identifier exists.
        usage: Used for equipment traceability, warranty, maintenance history, inspections, recalls, regulatory reporting, and physical identification.
        relationshipContext: SerialNumber identifies physical equipment supplied by a manufacturer; it is different from the organization's assetNumber and CEDM assetId.
  relationships:
    - name: owner
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the organization that legally or commercially owns the asset when ownership is relevant to the asset model.
        usage: Used for ownership reporting, financial accountability, insurance, maintenance responsibility, leasing, and disposition.
        cardinalityMeaning: Zero or one owner may be recorded because ownership may be external, shared, represented by a separate agreement, or maintained in another system.
        context: Owner is an organizational relationship; it is distinct from the Party that currently possesses, leases, operates, or maintains the asset.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the current operational location at which the asset is recorded or physically situated.
        usage: Used for maintenance dispatch, inventory visibility, asset tracking, utilization, inspections, and operational planning.
        cardinalityMeaning: Zero or one current location may be recorded when the asset is mobile, in transit, or its location is maintained through a separate movement system.
        context: Location is current state; historical movements should be preserved through movement/event entities rather than inferred from a changing location field.
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the standardized product or equipment model from which the asset instance was created or classified.
        usage: Used for technical specifications, spare-parts planning, maintenance standards, procurement, fleet classification, and analytics.
        cardinalityMeaning: Zero or one Product may be linked because not every managed asset has a corresponding product-master definition.
        context: Product represents the reusable definition or model; Asset represents the individually managed instance.
    - name: maintenanceWorkOrders
      target: MaintenanceWorkOrder
      cardinality: 0..*
      ownership: reference
      help:
        summary: Associates the asset with the maintenance activities performed or planned against it.
        usage: Used for maintenance history, preventive scheduling, repair execution, downtime analysis, labor tracking, and cost analysis.
        cardinalityMeaning: An asset can have zero or many work orders over its lifecycle.
        context: Each MaintenanceWorkOrder represents a particular maintenance demand or execution; the Asset remains the long-lived object being maintained.
    - name: depreciation
      target: AssetDepreciation
      cardinality: 0..*
      ownership: reference
      help:
        summary: Associates the asset with financial depreciation records or schedules used to determine book value over time.
        usage: Used for financial reporting, asset valuation, period close, disposal accounting, and book-value analysis.
        cardinalityMeaning: An asset can have zero or many depreciation records because schedules may be period-based, revised, or maintained for different accounting contexts.
        context: AssetDepreciation represents financial measurement of the asset and must not be confused with physical condition or market value.
    - name: meters
      target: Meter
      cardinality: 0..*
      ownership: reference
      help:
        summary: Measuring points associated with this Asset.
        businessMeaning: Connects durable asset identity to usage and condition measurement without embedding reading history in Asset.
        usage: Preventive maintenance, condition monitoring, reliability, utilization and audit.
        cardinalityMeaning: An Asset may have zero or many meters over its lifecycle.
        workflowRole: Asset lifecycle constrains future meter use while historical readings and decisions remain attributable.

    - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number over the asset's life; every service visit or repair performed on it adds one., summary: Service execution orders performed against this Asset., businessMeaning: Adds commercial/service execution history alongside technical maintenance history., usage: "Field service, warranty-like coverage, billing and audit.", workflowRole: Asset lifecycle constrains new execution while completed orders remain historical.}}
    - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: reference, help: {summary: Service entitlements covering this Asset., businessMeaning: Defines asset-specific service rights without embedding contract terms in Asset., usage: "Coverage validation and service history.", cardinalityMeaning: Zero or many entitlements over the asset lifecycle., workflowRole: Effective scope is evaluated at service authorization time.}}

  invariants:
    - id: ASSET-001
      rule: assetNumber must be unique among active managed assets.
    - id: ASSET-002
      rule: acquisitionCost must not be negative when supplied.
    - id: ASSET-003
      rule: DISPOSED assets must not be treated as available for new operational assignments unless an explicit reinstatement process exists.
    - id: ASSET-004
      rule: Retired or disposed assets retain historical maintenance, movement, and financial records for audit according to retention policy.
    - {id: ASSET-EXE-001, rule: "Acquisition Cost cannot be negative.", violatedWhen: "acquisition_cost != null and acquisition_cost < 0", message: "Acquisition Cost cannot be negative."}
  lifecycle:
    title: Asset Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, UNDER_MAINTENANCE, HELD, DISPOSED, RETIRED]
    initial: PLANNED
    terminal: [DISPOSED, RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: UNDER_MAINTENANCE, action: mark_under_maintenance}
      - {from: UNDER_MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: HELD, action: mark_held}
      - {from: HELD, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: DISPOSED, action: mark_disposed}
      - {from: UNDER_MAINTENANCE, to: DISPOSED, action: mark_disposed}
      - {from: HELD, to: DISPOSED, action: mark_disposed}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: UNDER_MAINTENANCE, to: RETIRED, action: retire}
      - {from: HELD, to: RETIRED, action: retire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a asset is stopped"
      description: "When a asset is held, a high-priority task asks someone to resolve it."
      when: "status == \"HELD\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ASSET-EXCEPTION-{{id}}"
              name: "Resolve asset {{name}}"
              description: "Asset {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: Represents the long-lived business object for a durable resource whose identity, ownership, location, maintenance, financial treatment, and lifecycle must be managed over time.
    businessMeaning: Asset is the instance-level concept used when an organization must manage a specific physical or accountable resource rather than merely a product type. A container, vehicle, machine, aircraft, or facility equipment item can be represented as an Asset when individual lifecycle and accountability matter.
    usage: Used across asset management, maintenance, finance, depreciation, inventory, logistics, leasing, insurance, compliance, and operational planning.
    relationshipContext: Product describes what the asset is as a standardized model. Asset identifies the individual resource. Location describes current operational placement. MaintenanceWorkOrder records maintenance activity. AssetDepreciation records financial measurement. Organization identifies ownership when applicable. Historical movements and transactions should preserve changes rather than overwriting the asset's identity.
    lifecycle: An asset may be planned before entering service, active during productive use, under maintenance while temporarily unavailable, held pending a business decision, disposed when ownership/control has ended, or retired when operational use has ceased. Lifecycle state should not erase history; it changes how current processes may act on the asset.
    example: A shipping container is acquired and assigned an assetNumber and serial/equipment identity. It is linked to a Product model, located at a depot, receives MaintenanceWorkOrder records during its service life, and has AssetDepreciation records for financial reporting. When its repair economics no longer justify continued use, a RepairEstimate may recommend SALE or SCRAP; the resulting disposition changes the asset lifecycle while preserving its historical record.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-ASSET
