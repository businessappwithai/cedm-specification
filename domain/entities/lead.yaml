entity:
  name: Lead
  namespace: cedm.domain
  kind: crm_entity
  description: A prospective customer or business opportunity before qualification.
  ui:
    icon: target
    recordLabel: [leadNumber]
  identity:
    key: leadId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: leadId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the lead record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a lead store this identifier. The number or code people quote is a separate field.
  - name: leadNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the lead.
      usage: Used to refer to the lead in sales meetings.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: NEW
    values:
    - NEW
    - QUALIFYING
    - QUALIFIED
    - DISQUALIFIED
    - CONVERTED
    - LOST
    help:
      summary: Where the lead stands in qualification.
      usage: Moved on by the lead owner.
      relationshipContext: Only qualified leads are converted.
      valueSemantics:
        NEW: Captured; not yet worked.
        QUALIFYING: Being contacted and assessed.
        QUALIFIED: Has a real need, budget and timing.
        DISQUALIFIED: Not a fit.
        CONVERTED: Turned into an opportunity.
        LOST: Went elsewhere or stopped responding.
  - name: source
    type: string
    required: false
    maxLength: 100
    help:
      summary: Where the lead came from, such as a campaign, event or website form.
      usage: Used to measure which channels bring business.
      relationshipContext: Recorded when the lead is captured.
  - name: estimatedValue
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The business the lead may bring, as first estimated.
      usage: Helps prioritise leads.
      relationshipContext: Not negative.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Lead records, where applicable.
      relationshipContext: Its meaning is specific to Lead; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  relationships:
  - name: party
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person or organisation the lead is about.
      usage: Set when the lead is captured, if known.
      cardinalityMeaning: At most one party.
      context: Contact details come from it.
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The existing customer the lead belongs to, if any.
      usage: Set when the lead comes from a customer.
      cardinalityMeaning: At most one customer.
      context: Account managers are informed.
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The salesperson working the lead.
      usage: Assigned when the lead is distributed.
      cardinalityMeaning: At most one owner.
      context: Follow-up tasks go to them.
  - name: opportunity
    target: Opportunity
    cardinality: 0..1
    ownership: reference
    help:
      summary: The opportunity the lead was converted into.
      usage: Set on conversion.
      cardinalityMeaning: At most one opportunity.
      context: Win rates are measured from leads to won opportunities.
  lifecycle:
    title: Lead Lifecycle
    attribute: status
    states: [NEW, QUALIFYING, QUALIFIED, DISQUALIFIED, CONVERTED, LOST]
    initial: NEW
    terminal: [DISQUALIFIED, CONVERTED, LOST]
    transitions:
    - {from: NEW, to: QUALIFYING, action: start_qualifying}
    - {from: QUALIFYING, to: QUALIFIED, action: qualify}
    - {from: QUALIFYING, to: DISQUALIFIED, action: disqualify}
    - {from: NEW, to: DISQUALIFIED, action: disqualify}
    - {from: QUALIFIED, to: CONVERTED, action: convert}
    - {from: QUALIFYING, to: LOST, action: mark_lost}
    - {from: QUALIFIED, to: LOST, action: mark_lost}
  help:
    summary: Represents a crm entity called Lead within the CEDM business model.
    businessMeaning: Lead is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Customer, Party, Opportunity. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Marketing and sales staff capture leads from campaigns, events and enquiries, qualify them, and convert qualified leads into opportunities or drop them.
    lifecycle: A lead is new until someone works on it, qualifying while contact is made, then qualified or disqualified; a qualified lead is converted into an opportunity or lost.
    example: Lead LD-2024-1188 from the Hannover trade fair, Bauer GmbH, estimated value 45,000 EUR, owner Lisa Weber, qualified and converted to opportunity OP-3301.
  invariants:
  - {id: LEAD-001, rule: A converted lead names its opportunity., violatedWhen: status == "CONVERTED" and opportunity_id == null, message: Link the opportunity before marking the lead converted.}
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-LEAD
