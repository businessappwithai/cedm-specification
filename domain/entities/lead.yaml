entity:
  name: Lead
  namespace: cedm.domain
  kind: crm_entity
  description: A prospective customer or business opportunity before qualification.
  ui:
    icon: target
  identity:
    key: leadId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: leadId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the lead.
        usage: Generated on creation; activities and conversion refer to it.
    - name: leadNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number that identifies this prospective customer or opportunity before it has been qualified.
        usage: Allocated by the system when the lead is created; unique, never reused, and quoted by sales staff in follow-up and reports.
    - name: status
      type: enum
      required: true
      default: NEW
      values:
        - NEW
        - QUALIFYING
        - QUALIFIED
        - DISQUALIFIED
        - CONVERTED
        - LOST
      help:
        summary: How far the sales team has worked the lead, from first contact to conversion or loss.
        usage: Moved by sales as it is qualified; a qualified lead can be converted into an opportunity, while disqualified, converted and lost leads are not worked again.
        valueSemantics:
          NEW: Captured but not yet worked.
          QUALIFYING: Being assessed for fit and interest.
          QUALIFIED: Confirmed as a genuine prospect.
          DISQUALIFIED: Judged not to be a fit. A final state.
          CONVERTED: Turned into a customer and opportunity. A final state.
          LOST: The prospect went elsewhere or stopped responding. A final state.
    - name: source
      type: string
      required: false
      maxLength: 100
      help:
        summary: Where the lead came from, such as web, event or referral.
        usage: Chosen at capture; used to measure which channels produce customers.
    - name: estimatedValue
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The potential revenue sales expects if the lead becomes a customer, in the lead's currency.
        usage: Estimated by the salesperson and revised as the lead is qualified; sales managers use it to prioritise effort and forecast the pipeline.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the lead was captured.
        usage: Set by the system; used to measure response time.
  relationships:
    - name: party
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person or organisation the lead is about.
        usage: Linked once the prospect is identified.
        cardinalityMeaning: At most one party; a lead may be captured before the prospect is identified.
        workflowRole: Keeps contact details in one place.
    - name: customer
      target: Customer
      cardinality: 0..1
      ownership: reference
      help:
        summary: The customer record, once the lead has become one.
        usage: Set on conversion.
        cardinalityMeaning: At most one customer.
        workflowRole: Records the outcome of conversion.
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The salesperson responsible for the lead.
        usage: Assigned by sales management.
        cardinalityMeaning: At most one owner; unassigned leads wait in a queue.
        workflowRole: Gives accountability for follow-up.
    - name: opportunity
      target: Opportunity
      cardinality: 0..1
      ownership: reference
      help:
        summary: The opportunity created from the lead.
        usage: Set on conversion.
        cardinalityMeaning: At most one opportunity.
        workflowRole: Links pipeline to the leads that created it.
  lifecycle:
    title: Lead Lifecycle
    attribute: status
    states: [NEW, QUALIFYING, QUALIFIED, DISQUALIFIED, CONVERTED, LOST]
    initial: NEW
    terminal:
      - DISQUALIFIED
      - CONVERTED
      - LOST
    transitions:
      - {from: NEW, to: QUALIFYING, action: start_qualifying}
      - {from: NEW, to: DISQUALIFIED, action: disqualify}
      - {from: NEW, to: LOST, action: mark_lost}
      - {from: QUALIFYING, to: QUALIFIED, action: qualify}
      - {from: QUALIFYING, to: DISQUALIFIED, action: disqualify}
      - {from: QUALIFYING, to: LOST, action: mark_lost}
      - {from: QUALIFIED, to: CONVERTED, action: convert}
      - {from: QUALIFIED, to: DISQUALIFIED, action: disqualify}
      - {from: QUALIFIED, to: LOST, action: mark_lost}
  help:
    summary: A prospective customer or business opportunity before it has been qualified.
    businessMeaning: Sales teams cannot chase every enquiry equally. A lead records a possible customer and where it came from, so the team can decide which are worth pursuing and measure how well each source performs.
    usage: Created from forms, events, referrals or imports; qualified by sales; converted into a customer and opportunity or discarded; read by sales managers.
    relationshipContext: A lead may identify a Party or Customer, is owned by a Party (the salesperson), and may become an Opportunity.
    lifecycle: A lead is new, goes through qualification, and ends qualified and converted into an opportunity, or disqualified or lost.
    example: A visitor who downloads a whitepaper is recorded as a lead from the website source, qualified by a call and converted to an opportunity.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-LEAD
