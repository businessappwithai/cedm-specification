entity:
  name: TaxRule
  namespace: cedm.domain
  kind: financial_policy_entity
  description: A reusable tax determination rule defining the tax treatment, rate, and applicability context for qualifying goods, services, parties, locations, and transactions.
  identity: {key: taxRuleId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: taxRuleId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the tax policy rule.
      usage: Referenced by pricing, order, invoice, tax determination, and compliance workflows.
      relationshipContext: Identifies the policy, not a tax amount generated by a transaction.
      workflowRole: Provides auditable policy context for tax calculation.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Business identifier for the tax rule.
      usage: Used in configuration, tax determination, invoicing, reporting, and integrations.
      relationshipContext: Identifies the rule rather than the calculated tax result.
      workflowRole: Allows a transaction to resolve the applicable tax treatment.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: Human-readable tax-rule name.
      usage: Used in tax configuration, transaction review, reporting, and compliance workflows.
      relationshipContext: Describes the reusable tax policy.
      workflowRole: Makes tax selection and review understandable.
  - name: rate
    type: decimal
    required: true
    precision: 12
    scale: 8
    minimum: 0
    help:
      summary: Tax rate applied to the eligible taxable base under this rule.
      usage: Used by tax calculation to derive tax amount.
      relationshipContext: Rate applies only after the taxable base and jurisdiction/applicability have been determined.
      workflowRole: Converts taxable amount into calculated tax according to policy.
  - name: jurisdictionCode
    type: string
    required: false
    maxLength: 100
    help:
      summary: Identifier for the tax jurisdiction or authority to which the rule applies.
      usage: Used for tax determination, reporting, filing, and audit.
      relationshipContext: Jurisdiction is applicability context and is not itself a tax rate.
      workflowRole: Helps determine which tax rule applies to a transaction.
  - name: taxType
    type: enum
    required: true
    values: [SALES, VAT, GST, USE, WITHHOLDING, OTHER]
    help:
      summary: Classification of the tax imposed or withheld by the rule.
      usage: Supports calculation, reporting, accounting, and statutory compliance.
      relationshipContext: Tax type determines how the resulting tax is interpreted; it does not replace jurisdiction-specific rules.
      workflowRole: Guides tax calculation and accounting treatment.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    help:
      summary: Controls whether the rule may be used for new tax determination.
      usage: Used by tax engines and transaction validation.
      relationshipContext: Retiring a rule must not rewrite tax already calculated and recorded on historical transactions.
      workflowRole: Controls future tax determination while preserving historical evidence.
  relationships:
  - name: jurisdiction
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Optional location reference representing the tax jurisdiction context.
      usage: Supports geographic tax determination and reporting.
      cardinalityMeaning: A rule may be associated with one primary jurisdiction reference.
      workflowRole: Provides location context for selecting tax treatment.
  invariants:
  - id: TAX-RULE-001
    rule: rate must be zero or greater.
  - id: TAX-RULE-002
    rule: TaxRule status changes must not rewrite historical tax amounts or tax determinations.
  - id: TAX-RULE-003
    rule: A transaction tax amount must retain the TaxRule or equivalent determination evidence used to calculate it.
  help:
    summary: Defines reusable tax policy used to determine tax treatment and calculate tax amounts.
    businessMeaning: TaxRule is policy; TaxLine or equivalent transaction evidence is the resulting tax calculation.
    usage: Supports sales, procurement, invoicing, tax reporting, accounting, and compliance.
    relationshipContext: Discount determination normally establishes the post-discount base. TaxRule determines the applicable taxable treatment. InvoiceLine/TaxLine records the resulting transaction tax.
    workflowContext: Gross amount → discount → taxable base → TaxRule selection → tax calculation → tax amount → invoice total → accounting/tax reporting. Applicability must be determined before calculation.
    lifecycle: Rules are created, activated, changed for future periods, and retired. Historical tax calculations remain immutable evidence of the rule/treatment used.
    example: A taxable invoice line has a post-discount taxable base of USD 900 and an applicable 18% GST rule. The resulting tax is USD 162; the historical transaction retains the tax determination even if the rule later changes.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-TAX-RULE}
