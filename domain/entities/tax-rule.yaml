entity:
  name: TaxRule
  namespace: cedm.domain
  kind: financial_policy_entity
  description: A reusable, effective-dated tax determination policy defining tax treatment, rate, jurisdiction and applicability for qualifying goods, services, parties and transactions. The rule is policy; calculated transaction tax is separate evidence.
  ui:
    icon: percent
  identity: {key: taxRuleId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: taxRuleId
      type: uuid
      required: true
      immutable: true
      help:
        summary: 'The tax rule id of the tax rule: an identifier the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: 'The code of the tax rule: a value the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: 'The name of the tax rule: a value the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: rate
      type: decimal
      required: true
      precision: 12
      scale: 8
      minimum: 0
      help:
        summary: 'The rate of the tax rule: a number the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: jurisdictionCode
      type: string
      required: false
      maxLength: 100
      help:
        summary: 'The jurisdiction code of the tax rule: a value the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: taxType
      type: enum
      required: true
      values:
        - SALES
        - VAT
        - GST
        - USE
        - WITHHOLDING
        - OTHER
      help:
        summary: 'The tax type of the tax rule: a value the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
        valueSemantics:
          SALES: The tax type of the tax rule is sales; set it when that is what the business means for this record.
          VAT: The tax type of the tax rule is vat; set it when that is what the business means for this record.
          GST: The tax type of the tax rule is gst; set it when that is what the business means for this record.
          USE: The tax type of the tax rule is use; set it when that is what the business means for this record.
          WITHHOLDING: The tax type of the tax rule is withholding; set it when that is what the business means for this record.
          OTHER: The tax type of the tax rule is other; set it when that is what the business means for this record.
    - name: validFrom
      type: datetime
      required: false
      help:
        summary: 'The valid from of the tax rule: a point in time the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: validTo
      type: datetime
      required: false
      help:
        summary: 'The valid to of the tax rule: a point in time the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: 'The status of the tax rule: a value the business records on it.'
        usage: Entered or maintained when a tax rule is created or changed; shown on its form and available to search and reports.
        relationshipContext: Read together with the tax rule's other fields and its relationships; it is not meaningful on its own.
        valueSemantics:
          DRAFT: The status of the tax rule is draft; set it when that is what the business means for this record.
          ACTIVE: The status of the tax rule is active; set it when that is what the business means for this record.
          INACTIVE: The status of the tax rule is inactive; set it when that is what the business means for this record.
          RETIRED: The status of the tax rule is retired; set it when that is what the business means for this record.
  relationships:
    - name: jurisdiction
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Links a tax rule to location, the jurisdiction it relates to.
        usage: Chosen from the existing location records when the tax rule is created or edited.
        cardinalityMeaning: A tax rule has at most one location in this role.
        context: Lets the tax rule be found from, and reported with, its location.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: Links a tax rule to product, the products it relates to.
        usage: Chosen from the existing product records when the tax rule is created or edited.
        cardinalityMeaning: A tax rule has any number of product in this role.
        context: Lets the tax rule be found from, and reported with, its product.
    - name: customers
      target: Customer
      cardinality: 0..*
      ownership: reference
      help:
        summary: Links a tax rule to customer, the customers it relates to.
        usage: Chosen from the existing customer records when the tax rule is created or edited.
        cardinalityMeaning: A tax rule has any number of customer in this role.
        context: Lets the tax rule be found from, and reported with, its customer.
    - name: organizations
      target: Organization
      cardinality: 0..*
      ownership: reference
      help:
        summary: Links a tax rule to organization, the organizations it relates to.
        usage: Chosen from the existing organization records when the tax rule is created or edited.
        cardinalityMeaning: A tax rule has any number of organization in this role.
        context: Lets the tax rule be found from, and reported with, its organization.
  invariants:
    - {id: TAX-RULE-001, rule: rate must be zero or greater.}
    - {id: TAX-RULE-002, rule: validTo must not be earlier than validFrom when both are supplied.}
    - {id: TAX-RULE-003, rule: "ACTIVE applicability requires validity period and all configured jurisdiction, product, customer and organizational conditions to permit use."}
    - {id: TAX-RULE-004, rule: "Changing rate, taxType, jurisdiction, validity, scope or status is a controlled policy change and must identify affected open quotations/orders before becoming effective."}
    - {id: TAX-RULE-005, rule: A transaction tax amount must retain the TaxRule or equivalent determination evidence used to calculate it.}
    - {id: TAX-RULE-006, rule: Historical tax amounts and tax determinations must not be rewritten when the master TaxRule changes or retires.}
    - {id: TAX-RULE-007, rule: "Tax applicability must be determined from the effective transaction context, including date, product/service, customer/party, locations and jurisdiction, before tax calculation."}
    - {id: TAX-RULE-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Tax Rule Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Defines reusable tax policy used to determine tax treatment and calculate tax amounts.
    businessMeaning: TaxRule is policy; transaction tax evidence records what tax was actually determined and charged.
    usage: Sales, procurement, invoicing, tax reporting, accounting and compliance.
    relationshipContext: Discount determination normally establishes the post-discount base. Product, Customer, Organization, Location, transaction date and jurisdiction determine TaxRule applicability. InvoiceLine or TaxLine records the resulting tax.
    workflowContext: Gross amount → discount → taxable base → resolve effective TaxRule → calculate tax → round → snapshot tax evidence → invoice total → accounting/tax reporting. Policy changes trigger revalidation of eligible open transactions, not retroactive mutation.
    lifecycle: Draft → active for an effective period → inactive/retired. Future transactions respect lifecycle; historical tax calculations remain reproducible.
    changePropagation: Rate changes affect future determination and eligible open transactions; jurisdiction/scope changes trigger affected transaction validation; status changes prevent future selection; issued tax evidence remains unchanged.
    example: A taxable USD 900 post-discount base is subject to an 18% GST rule, producing USD 162 tax. If the rule later changes to 20%, the existing issued invoice retains USD 162 unless a legally authorized correction process creates a new tax document.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-TAX-RULE}
