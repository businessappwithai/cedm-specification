entity:
  name: TaxRule
  namespace: cedm.domain
  kind: financial_policy_entity
  description: A reusable, effective-dated tax determination policy defining tax treatment, rate, jurisdiction and applicability for qualifying goods, services, parties and transactions. The rule is policy; calculated transaction tax is separate evidence.
  ui:
    icon: percent
  identity: {key: taxRuleId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: taxRuleId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the rule, constant when it is renamed.
        usage: Generated on creation; tax lines refer to it.
        relationshipContext: Referenced by every tax line it produced.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the rule, such as UK-VAT-STD.
        usage: Unique; used in imports and reports.
        relationshipContext: Read with the name.
    - name: name
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name of the rule.
        usage: Shown when a tax treatment is chosen.
        relationshipContext: Read by tax staff.
    - name: rate
      type: decimal
      required: true
      precision: 12
      scale: 8
      minimum: 0
      help:
        summary: The rate applied, as a fraction of the taxable amount.
        usage: Entered by tax staff; applied to the taxable amount.
        relationshipContext: Read with the tax type.
    - name: jurisdictionCode
      type: string
      required: false
      maxLength: 100
      help:
        summary: The code of the jurisdiction the rule applies in.
        usage: Entered to narrow the rule to a place.
        relationshipContext: Matched to the transaction's place.
    - name: taxType
      type: enum
      required: true
      values:
        - SALES
        - VAT
        - GST
        - USE
        - WITHHOLDING
        - OTHER
      help:
        summary: The kind of tax the rule works out.
        usage: Chosen when the rule is created; returns are grouped by it.
        relationshipContext: Decides which return the amount goes to.
        valueSemantics:
          SALES: A sales tax charged at the point of sale.
          VAT: Value added tax charged at each stage.
          GST: Goods and services tax.
          USE: A tax on use of goods bought without sales tax.
          WITHHOLDING: Tax held back from a payment.
          OTHER: A tax of another kind.
    - name: validFrom
      type: datetime
      required: false
      help:
        summary: The date and time the rule takes effect.
        usage: Set when the rule is created.
        relationshipContext: Compared with the transaction date.
    - name: validTo
      type: datetime
      required: false
      help:
        summary: The date and time the rule stops applying.
        usage: Set when the rule is superseded.
        relationshipContext: Compared with the transaction date.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the rule is in use.
        usage: Starts as DRAFT; set by tax staff.
        valueSemantics:
          DRAFT: Being defined; not applied.
          ACTIVE: In force and applied.
          INACTIVE: Not applied for the time being.
          RETIRED: Replaced or withdrawn. A final state.
  relationships:
    - name: jurisdiction
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place the rule applies in.
        usage: Chosen when the rule is place specific.
        cardinalityMeaning: At most one location.
        context: Limits the rule to transactions there.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products the rule applies to.
        usage: Chosen to narrow the rule.
        cardinalityMeaning: Any number of products; none means all.
        context: Decides which goods the rule taxes.
    - name: customers
      target: Customer
      cardinality: 0..*
      ownership: reference
      help:
        summary: The customers the rule applies to.
        usage: Chosen when treatment depends on the customer.
        cardinalityMeaning: Any number of customers.
        context: Allows exemptions for particular customers.
    - name: organizations
      target: Organization
      cardinality: 0..*
      ownership: reference
      help:
        summary: The selling organisations the rule applies to.
        usage: Chosen when only some companies use it.
        cardinalityMeaning: Any number of organisations.
        context: Limits the rule to certain companies.
  invariants:
    - {id: TAX-RULE-001, rule: rate must be zero or greater.}
    - {id: TAX-RULE-002, rule: validTo must not be earlier than validFrom when both are supplied.}
    - {id: TAX-RULE-003, rule: "ACTIVE applicability requires validity period and all configured jurisdiction, product, customer and organizational conditions to permit use."}
    - {id: TAX-RULE-004, rule: "Changing rate, taxType, jurisdiction, validity, scope or status is a controlled policy change and must identify affected open quotations/orders before becoming effective."}
    - {id: TAX-RULE-005, rule: A transaction tax amount must retain the TaxRule or equivalent determination evidence used to calculate it.}
    - {id: TAX-RULE-006, rule: Historical tax amounts and tax determinations must not be rewritten when the master TaxRule changes or retires.}
    - {id: TAX-RULE-007, rule: "Tax applicability must be determined from the effective transaction context, including date, product/service, customer/party, locations and jurisdiction, before tax calculation."}
    - {id: TAX-RULE-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Tax Rule Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A reusable tax determination policy that sets the treatment, rate, jurisdiction and applicability for qualifying goods, services, parties and transactions.
    businessMeaning: Tax rules say what tax applies to what. Keeping them as dated policy lets the business change treatment on a given date without editing past transactions, and lets tax be explained from the rule that produced it.
    usage: Maintained by tax staff; read by pricing and invoicing when working out tax.
    relationshipContext: A rule may name a jurisdiction and the products, customers and organisations it applies to.
    lifecycle: A rule is drafted, active while in force, may be set inactive and back, and is retired when replaced. Retired is final.
    example: Rule "UK standard VAT" applies twenty percent to standard-rated goods sold to UK customers from 1 January 2011.
    workflowContext: Gross amount → discount → taxable base → resolve effective TaxRule → calculate tax → round → snapshot tax evidence → invoice total → accounting/tax reporting. Policy changes trigger revalidation of eligible open transactions, not retroactive mutation.
    changePropagation: Rate changes affect future determination and eligible open transactions; jurisdiction/scope changes trigger affected transaction validation; status changes prevent future selection; issued tax evidence remains unchanged.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-TAX-RULE}
