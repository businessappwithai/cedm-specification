entity:
  name: CorrectiveActionVerification
  namespace: cedm.domain
  kind: quality_verification_transaction
  description: A controlled verification record that determines whether an implemented CorrectiveAction or PreventiveAction achieved its intended result and whether the associated quality issue can progress toward closure.
  ui:
    icon: file-text
  identity: {key: correctiveActionVerificationId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: correctiveActionVerificationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the verification record.
        businessMeaning: Identifies one independent verification event assessing an implemented corrective or preventive action.
        usage: Quality assurance CAPA audit supplier performance and closure evidence.
        relationshipContext: Distinct from CorrectiveAction and Nonconformance identities.
        workflowRole: Provides traceable evidence for a completion decision.
    - name: verificationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The unique reference number that quality staff and suppliers quote for this effectiveness check.
        usage: Assigned when the verification is raised; used in approvals, audit trails and supplier correspondence.
        businessMeaning: Identifies the verification event for quality operations and audit.
        relationshipContext: Distinct from actionNumber and nonconformance number.
        workflowRole: Correlates verification evidence throughout closure.
    - name: verificationDate
      type: datetime
      required: true
      help: {summary: Date and time effectiveness verification was performed., businessMeaning: Establishes when evidence was evaluated against the intended outcome., usage: Audit SLA quality reporting and closure chronology., workflowRole: Anchors the verification event.}
    - name: result
      type: enum
      required: true
      values:
        - EFFECTIVE
        - PARTIALLY_EFFECTIVE
        - INEFFECTIVE
        - NOT_VERIFIABLE
      help:
        summary: The verifier's conclusion on whether the action achieved its intended result.
        usage: Recorded when verification completes; an effective result can support closing the action, while other results force further work or an exception.
        valueSemantics:
          EFFECTIVE: The action achieved its intended result and the problem has not recurred.
          PARTIALLY_EFFECTIVE: The action helped but did not fully remove the problem; further action is needed.
          INEFFECTIVE: The action did not work and the problem persists or has returned.
          NOT_VERIFIABLE: Effectiveness cannot be established, for example because there is not yet enough evidence.
        businessMeaning: States whether the action achieved its intended quality outcome.
        relationshipContext: Does not rewrite original Nonconformance or CorrectiveAction evidence.
        workflowRole: Determines whether action may be completed or must be reopened.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - IN_PROGRESS
        - COMPLETED
        - REOPENED
        - CANCELLED
      help:
        summary: Where the verification is, from being raised through the check to completion, reopening or cancellation.
        usage: Moved by the independent verifier; a verification can only complete once a result and findings are recorded.
        valueSemantics:
          OPEN: Raised but not started.
          IN_PROGRESS: The verification is being carried out.
          COMPLETED: Finished with a result and findings recorded. A final state.
          REOPENED: Reopened because new evidence or a recurrence needs further verification.
          CANCELLED: Withdrawn and not carried out. A final state.
        businessMeaning: Separates preparation evaluation completion and follow-up.
        workflowRole: COMPLETED records final verification evidence; REOPENED signals additional action is required.
    - name: findings
      type: string
      required: true
      maxLength: 4000
      help: {summary: Evidence and observations supporting the verification result., businessMeaning: Explains what was checked and why the result was reached., usage: Audit quality review supplier improvement and recurrence analysis., workflowRole: Supports effectiveness decision.}
    - name: verifiedBy
      type: reference
      target: Party
      required: true
      help: {summary: Party accountable for performing or approving effectiveness verification., businessMeaning: Establishes accountability for the verification decision., usage: Audit trail quality governance and segregation of duties., workflowRole: Provides verification authority.}
  relationships:
    - name: correctiveAction
      target: CorrectiveAction
      cardinality: '1'
      ownership: reference
      help: {summary: Corrective action being evaluated., businessMeaning: Connects verification evidence to the action whose implementation is assessed., usage: CAPA closure audit and quality reporting., workflowRole: Verification result controls whether action can be completed.}
    - name: nonconformance
      target: Nonconformance
      cardinality: 0..1
      ownership: reference
      help: {summary: Nonconformance for which the action was established., businessMeaning: Connects effectiveness evidence to the original quality deviation., usage: Issue closure and recurrence analysis., workflowRole: Provides context for determining whether the underlying issue is controlled.}
  invariants:
    - {id: CORRECTIVE-ACTION-VERIFICATION-001, rule: A COMPLETED verification must have a result and findings.}
    - {id: CORRECTIVE-ACTION-VERIFICATION-002, rule: EFFECTIVE verification may support CorrectiveAction completion only when all required implementation evidence exists.}
    - {id: CORRECTIVE-ACTION-VERIFICATION-003, rule: INEFFECTIVE or NOT_VERIFIABLE verification must not silently complete the associated CorrectiveAction; additional action or explicit exception is required.}
    - {id: CORRECTIVE-ACTION-VERIFICATION-004, rule: Verification evidence must not mutate historical Nonconformance or completed CorrectiveAction records.}
    - {id: CORRECTIVE-ACTION-VERIFICATION-005, rule: Verification must be idempotent and duplicate completion evidence must not create conflicting effectiveness decisions.}
  lifecycle:
    title: Corrective Action Verification Lifecycle
    attribute: status
    states: [OPEN, IN_PROGRESS, COMPLETED, REOPENED, CANCELLED]
    initial: OPEN
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: OPEN, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: REOPENED, action: mark_reopened}
      - {from: REOPENED, to: COMPLETED, action: complete}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: REOPENED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a corrective action verification is ended"
      description: "When a corrective action verification is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CORRECTIVE-ACTION-VERIFICATION-FOLLOW-UP-{{id}}"
              name: "Follow up on corrective action verification {{verification_number}}"
              description: "Corrective action verification {{verification_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a corrective action verification is done"
      description: "When a corrective action verification is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CORRECTIVE-ACTION-VERIFICATION-COMPLETED-{{id}}"
              name: "Confirm corrective action verification {{verification_number}}"
              description: "Corrective action verification {{verification_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Provides independent auditable evidence that a corrective or preventive action achieved its intended result.
    businessMeaning: CorrectiveAction records what was done; CorrectiveActionVerification records whether it worked; Nonconformance records the original quality problem.
    usage: CAPA supplier quality compliance audit recurrence prevention and issue closure.
    relationshipContext: Verification closes the evidence loop between Nonconformance and CorrectiveAction without conflating implementation with effectiveness.
    workflowContext: Nonconformance → CorrectiveAction → implementation → effectiveness verification → effective closure or ineffective/reopened action → Nonconformance closure when all required evidence is satisfied.
    lifecycle: Open → in progress → completed, with reopened or cancelled paths.
    changePropagation: Ineffective verification reopens or creates additional CorrectiveAction work according to policy; it must not silently close the underlying Nonconformance.
    example: A supplier defect causes a corrective action requiring a packaging-process change. After implementation, verification evaluates subsequent lots, records EFFECTIVE, and provides evidence needed to complete the action and eventually close the nonconformance.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CORRECTIVE-ACTION-VERIFICATION}
