entity:
  name: Allergy
  namespace: cedm.domain
  kind: healthcare_entity
  description: A patient's allergy or intolerance — the substance, the reaction it causes, how severe it is, how certain, and when it was recorded — checked before medicines are prescribed or given.
  ui:
    icon: alert-triangle
    recordLabel: [allergyCode, substance]
  identity:
    key: allergyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: allergyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the allergy record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a allergy store this identifier. The number or code people quote is a separate field.
  - name: allergyCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: The reference of the allergy record.
      usage: Assigned when it is recorded.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, ENTERED_IN_ERROR]
    help:
      summary: Whether the allergy is still considered.
      usage: Changed by a clinician.
      relationshipContext: Inactive allergies stay in the history.
      valueSemantics:
        ACTIVE: Applies; checked at every order.
        INACTIVE: No longer applies.
        ENTERED_IN_ERROR: Recorded by mistake.
  - name: substance
    type: string
    required: true
    maxLength: 200
    help:
      summary: What the patient reacts to, such as penicillin or peanuts.
      usage: Entered by the clinician; medication checks match against it.
      relationshipContext: Coded substances match more reliably than free text.
  - name: category
    type: enum
    required: true
    default: MEDICATION
    values: [MEDICATION, FOOD, ENVIRONMENT, BIOLOGIC]
    help:
      summary: What kind of substance it is.
      usage: Decides which checks apply.
      relationshipContext: Medication allergies are checked at every prescription.
      valueSemantics:
        MEDICATION: A medicine or its ingredient.
        FOOD: A food.
        ENVIRONMENT: Pollen, dust, animals or other environmental substances.
        BIOLOGIC: A vaccine, blood product or other biologic.
  - name: allergyType
    type: enum
    required: true
    default: ALLERGY
    values: [ALLERGY, INTOLERANCE]
    help:
      summary: Whether the reaction is an immune allergy or an intolerance.
      usage: Intolerances may allow the substance with care.
      relationshipContext: Recorded by the clinician.
      valueSemantics:
        ALLERGY: An immune reaction.
        INTOLERANCE: A non-immune reaction, such as stomach upset.
  - name: reaction
    type: string
    required: false
    maxLength: 300
    help:
      summary: What happens when the patient is exposed.
      usage: Read by whoever considers giving the substance.
      relationshipContext: Such as rash, swelling or anaphylaxis.
  - name: severity
    type: enum
    required: true
    default: MODERATE
    values: [MILD, MODERATE, SEVERE]
    help:
      summary: How severe the reaction is.
      usage: Decides how strongly the system warns.
      relationshipContext: Severe reactions block the order unless overridden.
      valueSemantics:
        MILD: Uncomfortable but not dangerous.
        MODERATE: Needs treatment.
        SEVERE: Life-threatening.
  - name: verification
    type: enum
    required: true
    default: UNCONFIRMED
    values: [UNCONFIRMED, CONFIRMED, REFUTED]
    help:
      summary: How certain the allergy is.
      usage: Updated when tests or history confirm or refute it.
      relationshipContext: Unconfirmed allergies still trigger warnings.
      valueSemantics:
        UNCONFIRMED: Reported but not confirmed.
        CONFIRMED: Confirmed by testing or clear history.
        REFUTED: Shown not to be an allergy.
  - name: onsetDate
    type: date
    required: false
    help:
      summary: When the reaction was first seen.
      usage: Entered if known.
      relationshipContext: Approximate dates are acceptable.
  - name: recordedDate
    type: date
    required: true
    help:
      summary: When the allergy was recorded.
      usage: Set when recording.
      relationshipContext: Not in the future.
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient with the allergy.
      usage: Set when recording it.
      cardinalityMeaning: Every allergy belongs to exactly one patient.
      context: Listed among the patient's allergies.
  - name: recordedBy
    target: HealthcareProvider
    cardinality: 0..1
    ownership: reference
    help:
      summary: The clinician who recorded it.
      usage: Recorded with the allergy.
      cardinalityMeaning: One per allergy.
      context: Accountable for its accuracy.
  invariants:
  - {id: ALLERGY-001, rule: An allergy is never deleted; one recorded by mistake is marked entered in error.}
  lifecycle:
    title: Allergy Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, ENTERED_IN_ERROR]
    initial: ACTIVE
    terminal: [ENTERED_IN_ERROR]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: ENTERED_IN_ERROR, action: mark_error}
    - {from: INACTIVE, to: ENTERED_IN_ERROR, action: mark_error}
  help:
    summary: A substance a patient reacts to, and how badly.
    businessMeaning: Giving a patient a drug they are allergic to can kill them. Recording each allergy with its substance, reaction, severity and certainty lets prescribing and administration check every medicine against the patient's allergies and warn before harm is done.
    usage: Recorded by clinicians when a patient reports or shows a reaction; reviewed at each encounter; checked automatically when medicines are ordered.
    relationshipContext: An allergy belongs to one HealthcarePatient and is listed among their allergies. Prescriptions and medication orders are checked against it.
    lifecycle: Active while it applies; inactive if the patient no longer reacts; entered in error if recorded by mistake. A suspected allergy may be confirmed or refuted.
    workflowContext: Patient intake, medication ordering and administration, clinical decision support.
    example: 'Allergy to penicillin: reaction urticaria and facial swelling, severity severe, confirmed, recorded 12 March 2019 by Dr Martin.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ALLERGY
