entity:
  name: Allergy
  namespace: cedm.domain
  kind: healthcare_entity
  description: A governed patient allergy or intolerance record used to support clinical safety and treatment decisions.
  ui:
    icon: table
  identity:
    key: allergyId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: allergyId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the allergy record.
        usage: Generated on creation; alerts and clinical notes refer to the allergy through it.
        relationshipContext: Connects this record to its governing HealthcarePatient context and downstream evidence.
    - name: allergyCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The unique business reference for this allergy entry.
        usage: Used when a clinician or system needs to cite the exact entry, for example in an alert or an amendment.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: How far the allergy record has been verified and whether it still applies.
        usage: Moved by clinicians; safety checks should consider ACTIVE entries.
        valueSemantics:
          DRAFT: Recorded but not yet verified.
          ACTIVE: Confirmed and in force; safety checks must take it into account.
          COMPLETED: No longer applies, for example outgrown or disproved; kept for history.
          CANCELLED: Entered in error and withdrawn; kept for audit.
        relationshipContext: Status changes can affect related HealthcarePatient workflows but never erase historical evidence.
  relationships:
    - name: context
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        summary: The patient this allergy belongs to.
        usage: Set on creation and not changed, so the entry cannot drift to another patient.
        cardinalityMeaning: Exactly one patient; a patient may have many allergies.
        workflowRole: Attaches the safety fact to the patient's care record.
  invariants:
    - id: ALLERGY-001
      rule: The governing HealthcarePatient relationship is required and must reference a valid record.
    - id: ALLERGY-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: ALLERGY-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Allergy Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a allergy is ended"
      description: "When a allergy is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ALLERGY-FOLLOW-UP-{{id}}"
              name: "Follow up on allergy {{id}}"
              description: "Allergy {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A recorded allergy or intolerance of a patient, kept to support clinical safety and treatment decisions.
    businessMeaning: Allergies are one of the most important safety facts about a patient. Prescribing, procedures and diet all check them, so the record must be findable, accurate and never silently lost.
    usage: Entered by clinicians at registration or when a reaction is reported; checked whenever a medicine, food or procedure is ordered.
    relationshipContext: Each allergy belongs to one HealthcarePatient, whose full clinical record it informs.
    lifecycle: An allergy starts as a draft while being verified, is active once confirmed, and is completed when resolved or disproved or cancelled if recorded in error. Entries are corrected by amendment, never by deleting history.
    example: Penicillin allergy with a skin rash, recorded by the admitting nurse and confirmed by the physician.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ALLERGY
