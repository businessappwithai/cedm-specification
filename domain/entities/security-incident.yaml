entity:
  name: SecurityIncident
  namespace: cedm.domain
  kind: security_entity
  description: A recorded event or condition that may compromise confidentiality, integrity, availability, safety, or security.
  ui:
    icon: table
  identity:
    key: securityIncidentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: securityIncidentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the incident, constant for its life.
        usage: Generated on creation; actions and reports refer to it.
        relationshipContext: Referenced by investigation work.
    - name: incidentNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number of the incident, such as SI-2026-018.
        usage: Unique; quoted in reports and to regulators.
        relationshipContext: Read with the type and severity.
    - name: incidentType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of incident, such as phishing or data loss.
        usage: Entered when raised; reports group by it.
        relationshipContext: Decides which response procedure applies.
    - name: severity
      type: enum
      required: true
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        summary: How serious the incident is.
        usage: Set at triage and revised as facts emerge.
        relationshipContext: Decides priority and who is told.
        valueSemantics:
          LOW: Minor, with no real harm.
          MEDIUM: Limited harm that needs follow-up.
          HIGH: Serious harm or exposure.
          CRITICAL: Severe harm needing immediate action.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - INVESTIGATING
        - CONTAINED
        - RESOLVED
        - CLOSED
      help:
        summary: Where the incident is in its handling.
        usage: Starts as OPEN; moved by the investigator.
        relationshipContext: Decides whether response work is still due.
        valueSemantics:
          OPEN: Reported and not yet being worked.
          INVESTIGATING: Being investigated.
          CONTAINED: The spread has been stopped; cause still to be dealt with.
          RESOLVED: The cause is dealt with.
          CLOSED: Reviewed and finished. A final state.
    - name: detectedAt
      type: datetime
      required: true
      help:
        usage: Entered from the report; response times are measured from it.
        relationshipContext: Compared with the resolution time.
        summary: Records when the detected event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: resolvedAt
      type: datetime
      required: false
      help:
        usage: Set when resolved; must not be before detection.
        relationshipContext: Gives the time to resolve.
        summary: Records when the resolved event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
  relationships:
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation affected by the incident.
        usage: Chosen when raised.
        cardinalityMeaning: Exactly one organisation.
        context: Decides who handles and is accountable.
    - name: reporter
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person who reported the incident.
        usage: Chosen when raised.
        cardinalityMeaning: At most one reporter; empty if automatic.
        context: Who to ask for more information.
    - name: investigator
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The person responsible for investigating.
        usage: Assigned at triage.
        cardinalityMeaning: At most one investigator.
        context: Owns the response.
    - name: relatedRisk
      target: Risk
      cardinality: 0..1
      ownership: reference
      help:
        summary: The risk in the register that the incident relates to.
        usage: Linked when an incident shows a risk has occurred.
        cardinalityMeaning: At most one risk.
        context: Allows the register to be updated.
  invariants:
    - id: SECURITY-INCIDENT-001
      rule: resolvedAt must not precede detectedAt.
  lifecycle:
    title: Security Incident Lifecycle
    attribute: status
    states: [OPEN, INVESTIGATING, CONTAINED, RESOLVED, CLOSED]
    initial: OPEN
    terminal:
      - CLOSED
    transitions:
      - {from: OPEN, to: INVESTIGATING, action: investigate}
      - {from: INVESTIGATING, to: CONTAINED, action: contain}
      - {from: CONTAINED, to: INVESTIGATING, action: reopen}
      - {from: INVESTIGATING, to: RESOLVED, action: resolve}
      - {from: CONTAINED, to: RESOLVED, action: resolve}
      - {from: RESOLVED, to: CLOSED, action: close}
  help:
    summary: A recorded event or condition that may compromise confidentiality, integrity, availability, safety or security.
    businessMeaning: An incident record is how the organisation notices, investigates and closes a security event. It keeps who found it, who handled it, how serious it was and when it was contained or resolved, so response can be reviewed and repeated problems seen.
    usage: Raised by whoever detects the event; investigated by security staff; read by management and auditors.
    relationshipContext: An incident belongs to an organisation, may name a reporter and investigator, and may relate to a recorded risk.
    lifecycle: An incident is opened and investigated, may be contained and re-investigated, then resolved and closed. Closed is final.
    example: Incident SI-2026-018 records phishing emails reported by finance staff, contained by blocking the sender and resolved after passwords were reset.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SECURITY-INCIDENT
