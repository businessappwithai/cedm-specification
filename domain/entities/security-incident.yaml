entity:
  name: SecurityIncident
  namespace: cedm.domain
  kind: security_entity
  description: A recorded event or condition that may compromise confidentiality, integrity, availability, safety, or security.
  ui:
    icon: table
    recordLabel: [incidentNumber, incidentType]
  identity:
    key: securityIncidentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: securityIncidentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the security incident record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a security incident store this identifier. The number or code people quote is a separate field.
  - name: incidentNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the incident.
      usage: Quoted in all communication about it.
      relationshipContext: Unique.
  - name: incidentType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of incident, such as phishing, malware or data loss.
      usage: Decides the response playbook.
      relationshipContext: From the organisation's incident categories.
  - name: severity
    type: enum
    required: true
    values:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
    help:
      summary: How serious the incident is.
      usage: Decides response times and escalation.
      relationshipContext: May be raised as the investigation proceeds.
      valueSemantics:
        LOW: Little or no effect.
        MEDIUM: Limited effect on a few users or systems.
        HIGH: Significant effect or data at risk.
        CRITICAL: Major effect, data breached or services down.
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - OPEN
    - INVESTIGATING
    - CONTAINED
    - RESOLVED
    - CLOSED
    help:
      summary: Where the response stands.
      usage: Moved on by the security team.
      relationshipContext: Closed incidents have a resolution.
      valueSemantics:
        OPEN: Reported.
        INVESTIGATING: Being analysed.
        CONTAINED: The damage has been stopped.
        RESOLVED: The cause has been removed.
        CLOSED: Reviewed and closed.
  - name: detectedAt
    type: datetime
    required: true
    help:
      summary: When the incident was detected.
      usage: Starts response-time measures.
      relationshipContext: Not after its resolution.
  - name: resolvedAt
    type: datetime
    required: false
    help:
      summary: When the incident was resolved.
      usage: Used to measure time to resolve.
      relationshipContext: Not before detection.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The organisation affected.
      usage: Set when the incident is reported.
      cardinalityMeaning: Each incident concerns one organisation.
      context: Its response procedures apply.
  - name: reporter
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who reported the incident.
      usage: Set when reported.
      cardinalityMeaning: At most one reporter.
      context: Kept informed of progress.
  - name: investigator
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who investigates the incident.
      usage: Assigned at triage.
      cardinalityMeaning: At most one lead investigator.
      context: Answers for the response.
  - name: relatedRisk
    target: Risk
    cardinality: 0..1
    ownership: reference
    help:
      summary: The risk the incident realises.
      usage: Linked by risk managers.
      cardinalityMeaning: At most one risk.
      context: May mark the risk as materialised.
  invariants:
  - id: SECURITY-INCIDENT-001
    rule: resolvedAt must not precede detectedAt.
  lifecycle:
    title: Security Incident Lifecycle
    attribute: status
    states: [OPEN, INVESTIGATING, CONTAINED, RESOLVED, CLOSED]
    initial: OPEN
    terminal: [CLOSED]
    transitions:
    - {from: OPEN, to: INVESTIGATING, action: investigate}
    - {from: INVESTIGATING, to: CONTAINED, action: contain}
    - {from: CONTAINED, to: INVESTIGATING, action: reopen_investigation}
    - {from: INVESTIGATING, to: RESOLVED, action: resolve}
    - {from: CONTAINED, to: RESOLVED, action: resolve}
    - {from: RESOLVED, to: CLOSED, action: close}
  help:
    summary: Represents a security entity called SecurityIncident within the CEDM business model.
    businessMeaning: SecurityIncident is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Party, Risk. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Staff and monitoring tools report incidents; the security team triages them by severity, investigates, contains the damage, resolves the cause and closes them with lessons learned; management reviews incident trends.
    lifecycle: An incident is opened, investigated, contained when the damage is stopped, then resolved and closed; containment may reopen the investigation.
    example: Incident SEC-2024-0091, phishing leading to a compromised mailbox, high, detected 3 April 2024 08:12, contained 09:40, resolved 5 April.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SECURITY-INCIDENT
