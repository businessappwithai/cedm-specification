entity:
  name: ProductionRecord
  namespace: cedm.domain
  kind: industrial_transaction
  description: A recorded quantity of output produced or extracted by an operational process.
  ui:
    icon: package
  identity:
    key: productionRecordId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: productionRecordId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the production record, constant for its life.
        usage: Generated on creation; other records refer to it.
        relationshipContext: Referenced by anything that reports or verifies this output.
    - name: productionDate
      type: datetime
      required: true
      help:
        summary: The date and time the output was produced.
        usage: Entered with the record; used to place output in a shift, day or period.
        relationshipContext: Compared with the planned schedule of the work order or site.
    - name: quantity
      type: decimal
      required: true
      precision: 20
      scale: 6
      help:
        summary: The amount produced, in the product's unit of measure.
        usage: Must be greater than zero; entered when output is reported and summed in reports.
        relationshipContext: Totals by product, site and period form production figures.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - RECORDED
        - VERIFIED
        - REJECTED
      help:
        summary: Where the record is in its review.
        usage: Starts as PLANNED; moves to RECORDED when output is reported, then VERIFIED or REJECTED.
        relationshipContext: Only verified records should feed official output figures.
        valueSemantics:
          PLANNED: Output is expected but not yet reported.
          RECORDED: Output has been reported and awaits verification.
          VERIFIED: A supervisor has confirmed the figure. A final state.
          REJECTED: The figure was found wrong or the run cancelled. A final state.
  relationships:
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product that was produced.
        usage: Chosen when the record is entered; used to total output by product.
        cardinalityMeaning: Exactly one product per record.
        context: Output is always about one product, so figures can be added up by product.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The location where the output was produced or stored.
        usage: Chosen when output is attributed to a place.
        cardinalityMeaning: At most one location; empty if unplaced.
        context: Lets output be reported by place when no mining site applies.
    - name: miningSite
      target: MiningSite
      cardinality: 0..1
      ownership: reference
      help:
        summary: The mining site that produced the output.
        usage: Chosen for extractive operations.
        cardinalityMeaning: At most one site; empty for other kinds of production.
        context: Gives site level yield for mining operations.
    - name: workOrder
      target: ManufacturingWorkOrder
      cardinality: 0..1
      ownership: reference
      help:
        summary: The manufacturing work order the output belongs to.
        usage: Chosen when output comes from a manufacturing job.
        cardinalityMeaning: At most one work order; empty for output outside a job.
        context: Ties reported output to the job that is meant to produce it.
  invariants:
    - id: PRODUCTION-001
      rule: quantity must be greater than zero.
    - {id: PRODUCTION-RECORD-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Production Record Lifecycle
    attribute: status
    states: [PLANNED, RECORDED, VERIFIED, REJECTED]
    initial: PLANNED
    terminal:
      - VERIFIED
      - REJECTED
    transitions:
      - {from: PLANNED, to: RECORDED, action: record}
      - {from: RECORDED, to: VERIFIED, action: verify}
      - {from: RECORDED, to: REJECTED, action: reject}
      - {from: PLANNED, to: REJECTED, action: reject}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a production record is ended"
      description: "When a production record is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRODUCTION-RECORD-FOLLOW-UP-{{id}}"
              name: "Follow up on production record {{id}}"
              description: "Production record {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A recorded quantity of output produced or extracted by an operational process, such as a shift's output at a site.
    businessMeaning: A production record is the operation's own account of what it produced, when and where. It lets management track output against plan, verify it before it is relied on, and reject figures that prove wrong, without yet being an accounting entry.
    usage: Entered by site or production staff; verified by a supervisor; read by planning, reporting and yield analysis.
    relationshipContext: A record names the product produced and may name the location, mining site or work order that produced it.
    lifecycle: A record is planned, recorded when output is reported, then verified or rejected. A planned record may also be rejected if the run is cancelled. Verified and rejected are final.
    example: On 3 March the north pit records 1,850 tonnes of iron ore, which the shift supervisor verifies the next morning.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PRODUCTION-RECORD
