entity:
  name: ProductionRecord
  namespace: cedm.domain
  kind: industrial_transaction
  description: A recorded quantity of output produced or extracted by an operational process.
  ui:
    icon: package
  identity:
    key: productionRecordId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: productionRecordId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the production record record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a production record store this identifier. The number or code people quote is a separate field.
  - name: productionDate
    type: datetime
    required: true
    help:
      summary: When the output was produced.
      usage: Used to assign output to the right shift and period.
      relationshipContext: Not in the future.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How much was produced.
      usage: Reported by the operator or the machine.
      relationshipContext: In the product's unit of measure.
  - name: status
    type: enum
    required: true
    default: RECORDED
    values: [RECORDED, VERIFIED, REJECTED]
    help:
      summary: Whether the record has been checked.
      usage: Moved on by the supervisor.
      relationshipContext: Only verified records feed reports.
      valueSemantics:
        RECORDED: Reported, not yet checked.
        VERIFIED: Checked and accepted.
        REJECTED: Found wrong; replaced by a corrected record.
  - name: scrapQuantity
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: How much was produced but scrapped.
      usage: Used for yield measures.
      relationshipContext: Not counted in the good quantity.
  - name: shift
    type: string
    required: false
    maxLength: 20
    help:
      summary: The shift the output was produced on.
      usage: Used for shift comparisons.
      relationshipContext: Such as "Night".
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product made or extracted.
      usage: Set when recording.
      cardinalityMeaning: Exactly one.
      context: Stock of it is received from the record.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the output was produced.
      usage: Set when recording.
      cardinalityMeaning: At most one.
      context: The plant or site.
  - name: miningSite
    target: MiningSite
    cardinality: 0..1
    ownership: reference
    help:
      summary: The mine or quarry the output came from, for extraction.
      usage: Set in mining.
      cardinalityMeaning: At most one.
      context: Royalties are computed per site.
  - name: workOrder
    target: ManufacturingWorkOrder
    cardinality: 0..1
    ownership: reference
    help:
      summary: The production order the output belongs to.
      usage: Set when production runs against an order.
      cardinalityMeaning: At most one.
      context: The order's produced quantity is summed from its records.
  invariants:
  - id: PRODUCTION-001
    rule: quantity must be greater than zero.
  - {id: PRODUCTION-RECORD-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Production Record Lifecycle
    attribute: status
    states: [RECORDED, VERIFIED, REJECTED]
    initial: RECORDED
    terminal: [REJECTED]
    transitions:
    - {from: RECORDED, to: VERIFIED, action: verify}
    - {from: RECORDED, to: REJECTED, action: reject}
    - {from: VERIFIED, to: REJECTED, action: reject}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a production record is ended"
    description: "When a production record is rejected, a task asks someone to settle what depended on it."
    when: "status == \"REJECTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PRODUCTION-RECORD-FOLLOW-UP-{{id}}"
          name: "Follow up on production record {{id}}"
          description: "Production record {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: The quantity a site produced in a period, recorded for operations and reporting.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Location, MiningSite, ManufacturingWorkOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: Production records state what was actually made or extracted, when and where. They are the basis for stock receipts, yield and efficiency measures, royalties in extractive industries, and reconciliation with planned output.
    usage: Entered by operators or captured from machines at the end of a shift or batch; verified by supervisors; rejected records are corrected by new ones.
    lifecycle: Recorded when the output is reported, verified by a supervisor, or rejected if wrong; a verified record found wrong later is rejected and replaced.
    example: 'Production on 4 June 2024, night shift, line 2: 18,400 units of WIDGET-40 against work order MO-24-0412; verified by the shift supervisor.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PRODUCTION-RECORD
