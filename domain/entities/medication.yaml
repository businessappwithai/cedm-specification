entity:
  name: Medication
  namespace: cedm.domain
  kind: healthcare_pharmaceutical_entity
  description: A medicinal product or therapeutic substance used or prescribed for a patient.
  ui:
    icon: table
  identity:
    key: medicationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: medicationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the medication record associated with this Medication. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Keeps every prescription linked to exactly the medication that was ordered, which is essential for patient safety and dispensing records."
  - name: productId
    type: reference
    target: Product
    required: false
    help:
      summary: Identifies the related Product associated with this Medication. It provides the link needed to navigate from
        this record to the related business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: This field connects Medication to Product. The reference establishes business context between the
        two entities and lets processes navigate from this record to the related Product.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Connects the medication to the stocked product so the pharmacy can check inventory, purchase it and charge for it."
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The drug code, often from a national formulary or coding system, that prescribing, dispensing and claims systems use to identify the medication exactly."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The drug name prescribers search for and patients see on labels, usually the generic name with an optional brand name."
  - name: strength
    type: string
    required: false
    maxLength: 100
    help:
      summary: Captures the business meaning of strength for the Medication. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The amount of active ingredient per unit, such as 500 mg; prescribers must choose the right strength to dose the patient correctly."
  - name: form
    type: string
    required: false
    maxLength: 100
    help:
      summary: Captures the business meaning of form for the Medication. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How the medication is given or supplied, such as tablet, capsule, syrup or injection, which affects dosing instructions and patient suitability."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Medication records, where
        applicable.
      relationshipContext: Its meaning is specific to Medication; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        ACTIVE: Represents the active state or classification in the context of Medication.
        INACTIVE: Represents the inactive state or classification in the context of Medication.
        RETIRED: Represents the retired state or classification in the context of Medication.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the medication can currently be prescribed, is temporarily inactive, or has been retired, which prevents ordering of withdrawn drugs."
  relationships:
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Medication to Product so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Product records associated with a Medication.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: prescriptions
    target: Prescription
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Medication to Prescription so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Prescription records associated with a Medication.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Medication Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: "One medicinal product with its name, strength and dosage form, such as amoxicillin 500 mg capsules, that clinicians can prescribe and the pharmacy can dispense."
    businessMeaning: Medication is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Medication records.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Prescription.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Medication record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Pharmacy staff add the medication to the formulary and make it active so prescribers can select it, prescriptions reference it as they are written and dispensed, and it is made inactive when temporarily unavailable or retired when withdrawn, while past prescriptions keep pointing to it."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDICATION
