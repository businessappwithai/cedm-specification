entity:
  name: Medication
  namespace: cedm.domain
  kind: healthcare_pharmaceutical_entity
  description: A medicinal product or therapeutic substance used or prescribed for a patient.
  ui:
    icon: table
  identity:
    key: medicationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: medicationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the medication record.
        usage: Generated on creation; prescriptions refer to it.
    - name: productId
      type: reference
      target: Product
      required: false
      help:
        summary: The catalogue product that supplies this medication.
        usage: Set where the pharmacy stocks and buys the medication as a product.
    - name: code
      type: string
      required: true
      maxLength: 100
      help:
        summary: The formulary code of the medication.
        usage: Assigned by pharmacy; may be a national drug code; used in prescribing and dispensing systems.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the medication, normally its generic name.
        usage: Shown to prescribers and on labels.
    - name: strength
      type: string
      required: false
      maxLength: 100
      help:
        summary: The amount of active substance per unit, for example 500 mg.
        usage: Entered from the product label; prescribers choose a dose relative to it.
    - name: form
      type: string
      required: false
      maxLength: 100
      help:
        summary: The physical form of the medication, such as tablet, capsule, solution or injection.
        usage: Entered from the product label; decides how it can be administered.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - RETIRED
      help:
        summary: Whether the medication can be prescribed.
        usage: Set by pharmacy; only ACTIVE medications appear in prescribing lists.
        valueSemantics:
          ACTIVE: Available for prescribing.
          INACTIVE: Temporarily withheld, for example during a shortage; it can return.
          RETIRED: Withdrawn from use. A final state.
  relationships:
    - name: product
      target: Product
      cardinality: 0..1
      ownership: reference
      help:
        summary: The catalogue product that corresponds to the medication.
        usage: Linked to connect prescribing to purchasing and stock.
        cardinalityMeaning: At most one product; a medication that is compounded on demand has no stock product.
        workflowRole: Lets stock and cost follow the prescription.
    - name: prescriptions
      target: Prescription
      cardinality: 0..*
      ownership: reference
      help:
        summary: The prescriptions that name this medication.
        usage: Read to analyse use and check for safety alerts.
        cardinalityMeaning: Any number, accumulating as the drug is prescribed.
        workflowRole: Shows how the medication is used.
  lifecycle:
    title: Medication Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A medicinal product or therapeutic substance that can be prescribed or given to a patient.
    businessMeaning: 'Safe prescribing needs an exact definition of the drug: what it is, how strong it is and in what form. The medication record is that definition, shared by every prescription, so a dose cannot be mistaken for a different product.'
    usage: Maintained by pharmacy; chosen by prescribers when writing prescriptions; read by pharmacists and nurses at dispensing and administration.
    relationshipContext: A medication may be linked to a catalogue Product for purchasing and stock, and is prescribed through Prescriptions.
    lifecycle: A medication is active while it can be prescribed, inactive while temporarily withheld, and retired when withdrawn from use. Past prescriptions keep their reference.
    example: Amoxicillin 500 mg capsules, an antibiotic stocked by the hospital pharmacy.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDICATION
