entity:
  name: Medication
  namespace: cedm.domain
  kind: healthcare_pharmaceutical_entity
  description: A medicinal product or therapeutic substance used or prescribed for a patient.
  ui:
    icon: table
    recordLabel: [code, name]
  identity:
    key: medicationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: medicationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the medication record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a medication store this identifier. The number or code people quote is a separate field.
  - name: productId
    type: reference
    target: Product
    required: false
    help:
      summary: The stocked product the medication is supplied as.
      usage: Links prescriptions to pharmacy stock.
      relationshipContext: Empty for medications not stocked.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the medication, such as a national drug code.
      usage: Used on prescriptions and in drug-interaction checks.
      relationshipContext: Unique together with strength and form.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the medication, usually the active substance.
      usage: Shown to prescribers and on labels.
      relationshipContext: Generic names are preferred.
  - name: strength
    type: string
    required: false
    maxLength: 100
    help:
      summary: The amount of active substance per unit, such as 500 mg.
      usage: Shown on prescriptions and labels.
      relationshipContext: Includes the unit.
  - name: form
    type: string
    required: false
    maxLength: 100
    help:
      summary: The dosage form, such as tablet, capsule or solution.
      usage: Decides how doses are given.
      relationshipContext: As on the packaging.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the medication may be prescribed.
      usage: Changed by the pharmacy.
      relationshipContext: Retired medications cannot be prescribed.
      valueSemantics:
        ACTIVE: May be prescribed.
        INACTIVE: Temporarily unavailable.
        RETIRED: Withdrawn.
  relationships:
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help:
      summary: The stocked product the medication is supplied as.
      usage: Linked by the pharmacy.
      cardinalityMeaning: At most one product.
      context: Stock and price come from it.
  - name: prescriptions
    target: Prescription
    cardinality: 0..*
    ownership: reference
    help:
      summary: Prescriptions for the medication.
      usage: Listed for safety reviews and recalls.
      cardinalityMeaning: Any number of prescriptions.
      context: Each prescription is for one medication.
  lifecycle:
    title: Medication Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents a healthcare pharmaceutical entity called Medication within the CEDM business model.
    businessMeaning: Medication is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Prescription. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Pharmacists maintain the medications the organisation prescribes and dispenses, with strength and form; prescribers pick from this list, and pharmacy stock is linked through the product.
    lifecycle: A medication is active while it may be prescribed, inactive when temporarily unavailable, and retired when withdrawn.
    example: Medication AMOX-500-CAP 'Amoxicillin', 500 mg, capsule, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MEDICATION
