entity:
  name: ProductAttribute
  namespace: cedm.domain
  kind: product_definition_master
  description: A governed reusable characteristic definition used to describe, classify, configure, search, or validate Products and ProductVariants.
  ui:
    icon: package
  identity: {key: productAttributeId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: productAttributeId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the product attribute record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a product attribute store this identifier. The number or code people quote is a separate field.
  - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: Governed attribute code., businessMeaning: Stable business/integration identifier., usage: PIM schemas and APIs., relationshipContext: Unique across governed attribute namespace., requiredMeaning: Required.}}
  - {name: name, type: string, required: true, maxLength: 300, help: {summary: Human-readable attribute name., businessMeaning: Explains characteristic to users., usage: "Forms, catalog and search.", relationshipContext: Presentation metadata for stable definition., requiredMeaning: Required.}}
  - name: valueType
    type: enum
    required: true
    values: [STRING, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME, ENUM, REFERENCE]
    help: {summary: Permitted value representation., businessMeaning: Controls how values are validated/interpreted., usage: PIM validation and UI generation., relationshipContext: ENUM/REFERENCE require governed supporting semantics., valueSemantics: {STRING: Text value., INTEGER: Whole number., DECIMAL: Numeric decimal., BOOLEAN: True/false., DATE: Calendar date., DATETIME: Timestamp., ENUM: Controlled choice., REFERENCE: Reference to governed master.}, requiredMeaning: Required.}
  - {name: variantDefining, type: boolean, required: true, default: false, help: {summary: Whether attribute participates in variant uniqueness., businessMeaning: Distinguishes configuration options from descriptive attributes., usage: Variant generation and validation., relationshipContext: Variant-defining values form a unique configuration under Product., requiredMeaning: Required.}}
  invariants:
  - {id: PRODUCT-ATTRIBUTE-001, rule: code must be unique.}
  - {id: PRODUCT-ATTRIBUTE-002, rule: Attribute values must conform to valueType and governed constraints.}
  - {id: PRODUCT-ATTRIBUTE-003, rule: Changes to variant-defining semantics require impact analysis of existing ProductVariants and historical transaction evidence.}
  help:
    summary: Reusable semantic definition of a product characteristic.
    businessMeaning: ProductAttribute defines what a characteristic means; product/variant data supplies its value.
    usage: PIM, catalog, configuration, search, procurement, sales and integration.
    relationshipContext: Supports Product and ProductVariant without replacing category, brand or quality characteristics.
    lifecycle: Governed definition evolves through controlled version/change management.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PRODUCT-ATTRIBUTE}
