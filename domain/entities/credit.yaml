entity:
  name: Credit
  namespace: cedm.domain
  kind: billing_transaction
  description: A governed monetary credit reducing an amount owed or available for application to future or existing charges without itself representing cash payment.
  ui:
    icon: credit-card
  identity: {key: creditId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: creditId, type: uuid, required: true, immutable: true, help: {summary: The identity of the credit., usage: Generated on creation; applications to charges refer to it.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Whether the credit is being prepared, available to use, used up, or withdrawn.
        usage: Moved by billing staff; only an ACTIVE credit can be applied to a charge or invoice.
        valueSemantics:
          DRAFT: Being prepared by billing; it cannot yet be applied to any charge.
          ACTIVE: Issued and available to apply against what the customer owes.
          COMPLETED: Fully applied or expired, so nothing remains to use. A final state.
          CANCELLED: Withdrawn before it was used up, leaving no usable value. A final state.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer to whom the credit is owed., usage: Set when the credit is issued; it can be applied only to that customer's charges., cardinalityMeaning: At most one customer; an unassigned credit is a draft not yet attached to anyone., workflowRole: Decides whose charges the credit can reduce.}}
  invariants:
    - {id: CREDIT-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Credit Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a credit is ended"
      description: "When a credit is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CREDIT-FOLLOW-UP-{{id}}"
              name: "Follow up on credit {{id}}"
              description: "Credit {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a credit is done"
      description: "When a credit is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CREDIT-COMPLETED-{{id}}"
              name: "Confirm credit {{id}}"
              description: "Credit {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A monetary credit that reduces an amount owed or can be applied to charges, without being a cash payment.
    businessMeaning: 'Customers are sometimes owed value that is not money in the bank: a goodwill gesture, a promotion, a correction. A credit holds that value so it can be applied to what the customer owes, with a clear trail.'
    usage: Issued by billing staff or rules; applied to charges or invoices; read when a customer asks why a bill was reduced.
    relationshipContext: A credit belongs to a Customer. It does not itself change cash, accounting, tax or billing records; those follow from how it is applied.
    lifecycle: A credit is drafted, becomes active when issued, completes when it has been used up and is cancelled if withdrawn.
    example: A 20.00 service credit issued after an outage and applied automatically to the next invoice.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CREDIT}
