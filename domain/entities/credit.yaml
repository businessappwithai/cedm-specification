entity:
  name: Credit
  namespace: cedm.domain
  kind: billing_transaction
  description: An amount credited to a customer's account — for a service failure, a goodwill gesture, a promotion or an overpayment — that reduces what they owe now or on future invoices.
  ui:
    icon: badge-minus
    recordLabel: [creditNumber]
  identity: {key: creditId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: creditId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the credit record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a credit store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values: [AVAILABLE, PARTIALLY_APPLIED, FULLY_APPLIED, EXPIRED, VOIDED]
    help:
      summary: How much of the credit is left to use.
      usage: Moved on by billing as it is applied, and at expiry.
      relationshipContext: Only available and partly applied credits reduce new invoices.
      valueSemantics:
        AVAILABLE: Granted and not yet used.
        PARTIALLY_APPLIED: Partly used; the rest is still available.
        FULLY_APPLIED: Used up.
        EXPIRED: The use-by date passed with some left unused.
        VOIDED: Granted in error and withdrawn.
  - name: creditNumber
    type: string
    required: true
    unique: true
    maxLength: 40
    help:
      summary: The reference of the credit.
      usage: Assigned when the credit is granted; shown on the customer's invoices when applied.
      relationshipContext: Unique.
  - name: reason
    type: enum
    required: true
    default: GOODWILL
    values: [SLA_BREACH, GOODWILL, PROMOTION, OVERPAYMENT, BILLING_ERROR]
    help:
      summary: Why the credit was granted.
      usage: Chosen when granting; reports of credits by reason show where service fails.
      relationshipContext: SLA credits follow the agreement's formula.
      valueSemantics:
        SLA_BREACH: A service level was missed.
        GOODWILL: A gesture to keep a customer satisfied.
        PROMOTION: Part of a promotional offer.
        OVERPAYMENT: The customer paid more than they owed.
        BILLING_ERROR: A correction of an earlier billing mistake.
  - name: description
    type: string
    required: false
    maxLength: 500
    help:
      summary: What the credit is for, as the customer will see it.
      usage: Printed on the invoice where it is applied.
      relationshipContext: Should let the customer recognise it.
  - name: amount
    type: Money
    required: true
    help:
      summary: The amount credited.
      usage: Set when granting.
      relationshipContext: Positive; it reduces what the customer owes.
  - name: appliedAmount
    type: Money
    required: false
    help:
      summary: How much of the credit has been used.
      usage: Increased each time it is applied to an invoice or charge.
      relationshipContext: Not more than the amount.
  - name: grantedDate
    type: date
    required: true
    help:
      summary: The day the credit was granted.
      usage: Recorded when granting.
      relationshipContext: Not later than the expiry date.
  - name: expiryDate
    type: date
    required: false
    help:
      summary: The last day the credit can be used.
      usage: Unused credit expires after it.
      relationshipContext: Empty when it does not expire.
  relationships:
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer credited.
      usage: Chosen when granting.
      cardinalityMeaning: Every credit is for one customer.
      context: Applied only to that customer's invoices.
  - name: subscription
    target: Subscription
    cardinality: 0..1
    ownership: reference
    help:
      summary: The subscription the credit concerns, such as the one that suffered an outage.
      usage: Linked for service credits.
      cardinalityMeaning: At most one.
      context: May restrict the credit to that subscription's charges.
  - name: invoice
    target: Invoice
    cardinality: 0..1
    ownership: reference
    help:
      summary: The invoice the credit corrects or was granted against.
      usage: Linked for billing corrections.
      cardinalityMeaning: At most one.
      context: The credit is applied to later invoices, not by changing this one.
  - name: grantedBy
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who granted the credit.
      usage: Recorded when granting.
      cardinalityMeaning: One per credit.
      context: Credits above a limit need approval.
  - name: currency
    target: Currency
    cardinality: '1'
    ownership: reference
    help:
      summary: The currency of the credit.
      usage: The customer's billing currency.
      cardinalityMeaning: One per credit.
      context: Applied only to invoices in the same currency.
  invariants:
  - {id: CREDIT-001, rule: The applied amount does not exceed the credit., violatedWhen: applied_amount != null and amount != null and applied_amount > amount, message: More has been applied than the credit is worth.}
  - {id: CREDIT-002, rule: The credit does not expire before it is granted., violatedWhen: expiry_date != null and granted_date != null and expiry_date < granted_date, message: The expiry date is earlier than the grant date.}
  - {id: CREDIT-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  - {id: CREDIT-EXE-002, rule: "Applied Amount cannot be negative.", violatedWhen: "applied_amount != null and applied_amount < 0", message: "Applied Amount cannot be negative."}
  lifecycle:
    title: Credit Lifecycle
    attribute: status
    states: [AVAILABLE, PARTIALLY_APPLIED, FULLY_APPLIED, EXPIRED, VOIDED]
    initial: AVAILABLE
    terminal: [FULLY_APPLIED, EXPIRED, VOIDED]
    transitions:
    - {from: AVAILABLE, to: PARTIALLY_APPLIED, action: apply_part}
    - {from: PARTIALLY_APPLIED, to: FULLY_APPLIED, action: apply_rest}
    - {from: AVAILABLE, to: FULLY_APPLIED, action: apply_all}
    - {from: AVAILABLE, to: EXPIRED, action: expire}
    - {from: PARTIALLY_APPLIED, to: EXPIRED, action: expire}
    - {from: AVAILABLE, to: VOIDED, action: void}
  help:
    summary: Money the business owes back to a customer as a reduction of their bills.
    businessMeaning: Customers are owed credits for outages, complaints, promotions and overpayments, and those credits must be given exactly once. A credit records why it was granted, how much, until when it can be used and how much of it has been applied, so billing applies it correctly and finance can account for the liability.
    usage: Granted by billing or customer service, usually with approval above a limit; applied automatically to the customer's next charges or invoices; expired credits are released from the balance sheet.
    relationshipContext: A credit belongs to a Customer, may be granted against a Subscription or an Invoice, and is in one Currency. Applying it reduces later Charges or Invoices.
    lifecycle: Granted (available), partly applied as invoices use it, fully applied when used up, expired when its use-by date passes, or voided if granted in error.
    workflowContext: Service-level credits, complaint handling, promotional credits, billing and invoice settlement.
    example: 'Credit CR-2024-0218: 150 EUR to Contoso for a 6-hour outage on 2 April under the SLA, granted 5 April, expires 5 October, 150 EUR applied to invoice INV-2024-04-1103.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CREDIT}
