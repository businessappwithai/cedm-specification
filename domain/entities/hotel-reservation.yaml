entity:
  name: HotelReservation
  namespace: cedm.domain
  kind: hospitality_transaction
  description: A reservation for accommodation or hospitality services.
  ui:
    icon: calendar-check
  identity:
    key: hotelReservationId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: hotelReservationId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the reservation.
        usage: Generated on booking; folios and housekeeping tasks refer to it.
    - name: reservationNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The confirmation number given to the guest.
        usage: Allocated at booking; unique; quoted at check-in and in correspondence.
    - name: checkIn
      type: date
      required: true
      help:
        summary: The date the guest is due to arrive.
        usage: Entered at booking; used to plan availability and arrival lists.
    - name: checkOut
      type: date
      required: true
      help:
        summary: The date the guest is due to leave.
        usage: Entered at booking; must be later than the check-in date. It determines the number of nights charged.
    - name: status
      type: enum
      required: true
      default: REQUESTED
      values:
        - REQUESTED
        - RESERVED
        - CHECKED_IN
        - CHECKED_OUT
        - CANCELLED
        - NO_SHOW
      help:
        summary: Where the reservation stands from request to departure.
        usage: Moved by reservations and the front desk.
        valueSemantics:
          REQUESTED: Asked for but not yet confirmed.
          RESERVED: Confirmed; a room is held for the guest.
          CHECKED_IN: The guest has arrived and is staying.
          CHECKED_OUT: The guest has left and the stay is complete. A final state.
          CANCELLED: Cancelled before arrival. A final state.
          NO_SHOW: The guest did not arrive. A final state.
    - name: guestCount
      type: integer
      required: true
      minimum: 1
      help:
        summary: The number of people staying.
        usage: Entered at booking; used to choose a room of suitable capacity and to price per person.
  relationships:
    - name: hotel
      target: Hotel
      cardinality: '1'
      ownership: reference
      help:
        summary: The hotel where the stay takes place.
        usage: Chosen at booking.
        cardinalityMeaning: 'Exactly one hotel: a reservation is for a stay at a single property.'
        workflowRole: Determines rates, availability and rules.
    - name: room
      target: HotelRoom
      cardinality: 0..1
      ownership: reference
      help:
        summary: The room assigned to the stay.
        usage: Assigned at or before arrival, often as late as check-in.
        cardinalityMeaning: At most one room; many reservations are made for a room type and assigned later.
        workflowRole: Links the stay to a specific unit for housekeeping and billing.
    - name: guest
      target: Party
      cardinality: '1'
      ownership: reference
      help:
        summary: The person or organisation that is staying or paying.
        usage: Set at booking.
        cardinalityMeaning: 'Exactly one guest: every reservation has a named lead guest.'
        workflowRole: Identifies who to contact and to bill.
  invariants:
    - id: HOTEL-RESERVATION-001
      rule: checkOut must be later than checkIn.
  lifecycle:
    title: Hotel Reservation Lifecycle
    attribute: status
    states: [REQUESTED, RESERVED, CHECKED_IN, CHECKED_OUT, CANCELLED, NO_SHOW]
    initial: REQUESTED
    terminal:
      - CHECKED_OUT
      - CANCELLED
      - NO_SHOW
    transitions:
      - {from: REQUESTED, to: RESERVED, action: confirm}
      - {from: RESERVED, to: CHECKED_IN, action: check_in}
      - {from: CHECKED_IN, to: CHECKED_OUT, action: check_out}
      - {from: REQUESTED, to: CANCELLED, action: cancel}
      - {from: RESERVED, to: CANCELLED, action: cancel}
      - {from: RESERVED, to: NO_SHOW, action: mark_no_show}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a hotel reservation is put forward"
      description: "When a hotel reservation is requested, a task asks someone to decide on it."
      when: "status == \"REQUESTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "HOTEL-RESERVATION-APPROVAL-{{id}}"
              name: "Decide on hotel reservation {{reservation_number}}"
              description: "Hotel reservation {{reservation_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a hotel reservation is ended"
      description: "When a hotel reservation is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "HOTEL-RESERVATION-FOLLOW-UP-{{id}}"
              name: "Follow up on hotel reservation {{reservation_number}}"
              description: "Hotel reservation {{reservation_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A booking of accommodation or hospitality services at a hotel for a guest and a stay.
    businessMeaning: 'The reservation is the promise a hotel makes to a guest: a stay of given dates, for a number of people, at a property. Availability, revenue, check-in and billing all follow from it.'
    usage: Created when a guest or agent books; confirmed; used at check-in; completed at check-out or closed as cancelled or no-show; read by front desk, housekeeping and revenue management.
    relationshipContext: A reservation is at one Hotel, for a guest (Party), and is assigned a HotelRoom when one is allocated.
    lifecycle: A reservation is requested, confirmed as reserved, checked in when the guest arrives and checked out when they leave. Before arrival it can be cancelled, and it ends as a no-show if the guest does not turn up.
    example: Reservation 884213 for two guests, three nights from 14 June, confirmed and later checked in to room 412.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-RESERVATION
