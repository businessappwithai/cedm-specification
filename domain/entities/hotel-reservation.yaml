entity:
  name: HotelReservation
  namespace: cedm.domain
  kind: hospitality_transaction
  description: A reservation for accommodation or hospitality services.
  ui:
    icon: calendar-check
    recordLabel: [reservationNumber]
  identity:
    key: hotelReservationId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelReservationId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the hotel reservation record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a hotel reservation store this identifier. The number or code people quote is a separate field.
  - name: reservationNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The confirmation number given to the guest.
      usage: Quoted by the guest and on invoices.
      relationshipContext: Unique.
  - name: checkIn
    type: date
    required: true
    help:
      summary: The arrival date.
      usage: Decides room availability and the first night charged.
      relationshipContext: Before the departure date.
  - name: checkOut
    type: date
    required: true
    help:
      summary: The departure date.
      usage: The last night charged is the night before it.
      relationshipContext: After the arrival date.
  - name: status
    type: enum
    required: true
    default: REQUESTED
    values: [REQUESTED, RESERVED, CHECKED_IN, CHECKED_OUT, CANCELLED, NO_SHOW]
    help:
      summary: Where the reservation stands.
      usage: Moved on by reservations and front-desk staff.
      relationshipContext: Only reserved stays block a room.
      valueSemantics:
        REQUESTED: Asked for; not yet confirmed.
        RESERVED: Confirmed.
        CHECKED_IN: The guest has arrived.
        CHECKED_OUT: The guest has left.
        CANCELLED: Cancelled before arrival.
        NO_SHOW: The guest did not arrive.
  - name: guestCount
    type: integer
    required: true
    minimum: 1
    help:
      summary: How many guests will stay.
      usage: Used to choose a room and to charge per-person rates.
      relationshipContext: At least one, and within the room's capacity.
  relationships:
  - name: hotel
    target: Hotel
    cardinality: '1'
    ownership: reference
    help:
      summary: The hotel the reservation is for.
      usage: Set when booking.
      cardinalityMeaning: Each reservation is at one hotel.
      context: The hotel's rates and policies apply.
  - name: room
    target: HotelRoom
    cardinality: 0..1
    ownership: reference
    help:
      summary: The room assigned to the stay.
      usage: Assigned before or at check-in.
      cardinalityMeaning: At most one room per reservation.
      context: Must belong to the same hotel.
  - name: guest
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The guest who booked or will stay.
      usage: Set when booking.
      cardinalityMeaning: Each reservation has one main guest.
      context: Correspondence and invoices go to the guest.
  invariants:
  - id: HOTEL-RESERVATION-001
    rule: checkOut must be later than checkIn.
  - {id: HOTEL-RESERVATION-002, rule: A reservation is for at least one guest., violatedWhen: guest_count < 1, message: A reservation needs at least one guest.}
  lifecycle:
    title: Hotel Reservation Lifecycle
    attribute: status
    states: [REQUESTED, RESERVED, CHECKED_IN, CHECKED_OUT, CANCELLED, NO_SHOW]
    initial: REQUESTED
    terminal: [CHECKED_OUT, CANCELLED, NO_SHOW]
    transitions:
    - {from: REQUESTED, to: RESERVED, action: confirm}
    - {from: RESERVED, to: CHECKED_IN, action: check_in}
    - {from: CHECKED_IN, to: CHECKED_OUT, action: check_out}
    - {from: REQUESTED, to: CANCELLED, action: cancel}
    - {from: RESERVED, to: CANCELLED, action: cancel}
    - {from: RESERVED, to: NO_SHOW, action: mark_no_show}
  workflows:
  - name: ApprovalRequested
    title: "Ask for a decision when a hotel reservation is put forward"
    description: "When a hotel reservation is requested, a task asks someone to decide on it."
    when: "status == \"REQUESTED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: decide on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HOTEL-RESERVATION-APPROVAL-{{id}}"
          name: "Decide on hotel reservation {{reservation_number}}"
          description: "Hotel reservation {{reservation_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
          task_type: "APPROVAL"
          status: "CREATED"
          priority: "NORMAL"
  - name: FollowUpRequired
    title: "Follow up when a hotel reservation is ended"
    description: "When a hotel reservation is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "HOTEL-RESERVATION-FOLLOW-UP-{{id}}"
          name: "Follow up on hotel reservation {{reservation_number}}"
          description: "Hotel reservation {{reservation_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A booking of a hotel room for given dates and guests.
    relationshipContext: The entity participates in a wider business graph through relationships with Hotel, HotelRoom, Party. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Reservation agents and booking channels create reservations with dates and guest count; front-desk staff assign a room, check the guest in and out, and record no-shows.
    lifecycle: A reservation is requested, confirmed as reserved, checked in on arrival and checked out on departure; a request or confirmed reservation may be cancelled, and a confirmed one becomes a no-show when the guest does not arrive.
    example: Reservation RS-88120 at Hotel Lumière, 2 guests, 14–17 June 2024, room 412 assigned, checked in 14 June at 15:20.
    businessMeaning: Reservations fill the hotel and forecast revenue; check-in, billing and housekeeping follow from them.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-RESERVATION
