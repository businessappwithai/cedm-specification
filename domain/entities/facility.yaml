entity:
  name: Facility
  namespace: cedm.domain
  kind: facilities_entity
  description: A physical facility, building, site, or managed space used for business operations.
  ui:
    icon: building
    recordLabel: [facilityCode, name]
  identity:
    key: facilityId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: facilityId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the facility record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a facility store this identifier. The number or code people quote is a separate field.
  - name: facilityCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the facility.
      usage: Used in service requests, asset records and space plans.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the facility.
      usage: Shown wherever the facility is chosen.
      relationshipContext: Identifies it for people.
  - name: facilityType
    type: enum
    required: true
    values:
    - BUILDING
    - SITE
    - CAMPUS
    - OFFICE
    - PLANT
    - WAREHOUSE
    - OTHER
    help:
      summary: What kind of facility it is.
      usage: Decides which services and inspections apply.
      relationshipContext: Read with its size.
      valueSemantics:
        BUILDING: A single building.
        SITE: A site with several buildings.
        CAMPUS: A campus of sites.
        OFFICE: Office space.
        PLANT: A production plant.
        WAREHOUSE: A warehouse.
        OTHER: Any other facility.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - INACTIVE
    - CLOSED
    help:
      summary: Whether the facility is in use.
      usage: Moved on by facilities management.
      relationshipContext: Only active facilities take service requests.
      valueSemantics:
        PLANNED: Not yet in use.
        ACTIVE: In use.
        INACTIVE: Temporarily unused.
        CLOSED: Vacated.
  - name: grossAreaM2
    type: decimal
    required: false
    precision: 12
    scale: 2
    help:
      summary: The gross floor area, in square metres.
      usage: Used for cost allocation and space reports.
      relationshipContext: Measured to the outside walls.
  - name: capacity
    type: integer
    required: false
    help:
      summary: How many people the facility is designed for.
      usage: Used for occupancy planning.
      relationshipContext: Workstations for offices.
  - name: tenure
    type: enum
    required: true
    default: OWNED
    values: [OWNED, LEASED, SHARED]
    help:
      summary: Whether the facility is owned or leased.
      usage: Decides who maintains the structure and how it is accounted for.
      relationshipContext: Leased facilities link to their lease.
      valueSemantics:
        OWNED: Owned by the business.
        LEASED: Leased from a landlord.
        SHARED: Shared with another organization.
  relationships:
  - name: location
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the facility is.
      usage: Set when it is registered.
      cardinalityMeaning: Exactly one.
      context: Its address is the facility's address.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization that occupies or manages the facility.
      usage: Set when it is registered.
      cardinalityMeaning: At most one.
      context: Bears its costs.
  - name: assets
    target: Asset
    cardinality: 0..*
    ownership: reference
    help:
      summary: Assets located in the facility.
      usage: Listed from the facility.
      cardinalityMeaning: Any number; each asset is in one facility.
      context: The asset records its facility.
    inverseCardinality: '1'
  - name: serviceRequests
    target: ServiceRequest
    cardinality: 0..*
    ownership: reference
    help:
      summary: Service requests raised for the facility.
      usage: Listed from the facility.
      cardinalityMeaning: Any number; each request is for one facility.
      context: The request records its facility.
    inverseCardinality: '1'
  lifecycle:
    title: Facility Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, CLOSED]
    initial: PLANNED
    terminal: [CLOSED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: CLOSED, action: close}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
  invariants:
  - {id: FACILITY-EXE-001, rule: "Capacity cannot be negative.", violatedWhen: "capacity != null and capacity < 0", message: "Capacity cannot be negative."}
  help:
    summary: Represents a facilities entity called Facility within the CEDM business model.
    businessMeaning: Facility is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Location, Organization, Asset, ServiceRequest. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Facilities managers register sites and buildings with their type, size and occupancy; maintenance, service requests, assets and space planning are organised by facility.
    lifecycle: Planned before opening, active while in use, inactive when temporarily unused, and closed when vacated for good.
    example: Facility LYO-HQ 'Lyon head office', office building, 6,200 m², 420 workstations, owned by ACME France, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FACILITY
