entity:
  name: Facility
  namespace: cedm.domain
  kind: facilities_entity
  description: A physical facility, building, site, or managed space used for business operations.
  ui:
    icon: building
  identity:
    key: facilityId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: facilityId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the facility record.
        usage: Generated on registration; assets and service requests refer to it.
    - name: facilityCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code by which staff and systems name the facility, such as FRA-HQ.
        usage: Unique; assigned at registration and used on work orders and signage.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name people use for the facility.
        usage: Shown in lists, maps and service request forms.
    - name: facilityType
      type: enum
      required: true
      values:
        - BUILDING
        - SITE
        - CAMPUS
        - OFFICE
        - PLANT
        - WAREHOUSE
        - OTHER
      help:
        valueSemantics:
          BUILDING: A single constructed building, such as a head office or clinic, managed as one place.
          SITE: A site containing several buildings or outdoor areas.
          CAMPUS: A large site with many buildings under one management.
          OFFICE: A space used mainly for office work.
          PLANT: A production or processing plant.
          WAREHOUSE: A storage and distribution facility.
          OTHER: Any other managed space.
        summary: What kind of space the facility is.
        usage: Chosen at registration; drives the maintenance programme and reporting category.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - INACTIVE
        - CLOSED
      help:
        valueSemantics:
          PLANNED: Approved but not yet open.
          ACTIVE: In operation, and the only state in which service requests are accepted.
          INACTIVE: Temporarily out of use, for example during renovation.
          CLOSED: Permanently closed. A final state.
        summary: Whether the facility is in use.
        usage: Set by facilities management; service requests are accepted only for ACTIVE facilities.
  relationships:
    - name: location
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        summary: The place where the facility stands.
        usage: Set at registration; supplies address and map position.
        cardinalityMeaning: 'Exactly one location: a facility is a physical place.'
        workflowRole: Anchors the facility to an address for logistics and emergencies.
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that operates the facility.
        usage: Set at registration.
        cardinalityMeaning: At most one organisation; a facility that is shared or not yet allocated may have none.
        workflowRole: Determines who is responsible for cost and compliance.
    - name: assets
      target: Asset
      cardinality: 0..*
      ownership: reference
      help:
        summary: The assets installed or kept in the facility.
        usage: Read to see what equipment a site contains.
        cardinalityMeaning: Any number of assets.
        workflowRole: Lets maintenance plan work by site.
    - name: serviceRequests
      target: ServiceRequest
      cardinality: 0..*
      ownership: reference
      help:
        summary: The requests for service raised at the facility.
        usage: Read to see open issues and history at the site.
        cardinalityMeaning: Any number of requests over the facility's life.
        workflowRole: Shows the demand for maintenance and support at the site.
  lifecycle:
    title: Facility Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, INACTIVE, CLOSED]
    initial: PLANNED
    terminal: [CLOSED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: CLOSED, action: close}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
  help:
    summary: A physical facility, building, site or managed space used for business operations.
    businessMeaning: 'Facilities management needs a single record for each place the organisation runs: what it is, where it stands, who is responsible and what is installed in it. Maintenance, space planning and costs all hang from it.'
    usage: Registered when a site is acquired or planned; kept up to date by facilities managers; read by maintenance, operations and finance.
    relationshipContext: A facility stands at a Location, belongs to an Organization, contains Assets and receives ServiceRequests.
    lifecycle: A facility is planned, becomes active when in use, may be made inactive while closed temporarily, and is closed when the organisation stops operating it.
    example: The Frankfurt head office, an office building with twelve floors, active since 2019.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FACILITY
