entity:
  name: ProcessDefinition
  namespace: cedm.domain
  kind: workflow_definition
  description: A versioned definition of a business process — its steps, decisions, assignments and deadlines — that process instances are started from, such as "Supplier onboarding v3".
  ui:
    icon: workflow
    recordLabel: [code, definitionVersion]
  identity: {key: processDefinitionId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: processDefinitionId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of ProcessDefinition., businessMeaning: Identifies one governed ProcessDefinition record independently of mutable status., usage: "Workflow, authorization, integration and audit.", relationshipContext: Referenced by related enterprise processes., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, PUBLISHED, RETIRED]
    help:
      summary: Whether the version may be used to start instances.
      businessMeaning: Indicates current workflow/control usability.
      usage: Moved on by the process owner.
      relationshipContext: Only one version of a process should be published at a time.
      valueSemantics:
        DRAFT: Being designed; cannot start instances.
        PUBLISHED: In use for new instances.
        RETIRED: Replaced; its running instances finish on it.
  - name: code
    type: string
    required: true
    maxLength: 40
    help:
      summary: The code of the process, the same for all its versions, such as SUP-ONB.
      usage: Instances and reports refer to the process by it.
      relationshipContext: Unique together with the version.
  - name: definitionVersion
    type: integer
    required: true
    default: 1
    help:
      summary: The version number of the definition.
      usage: Increased with each published change.
      relationshipContext: Running instances keep the version they started on.
  - name: name
    type: string
    required: true
    maxLength: 150
    help:
      summary: The name of the process, such as "Supplier onboarding".
      usage: Shown when starting an instance.
      relationshipContext: The same across versions.
  - name: description
    type: text
    required: false
    help:
      summary: What the process does and when it is used.
      usage: Read by the people who start and work in the process.
      relationshipContext: Free text.
  - name: definitionFormat
    type: enum
    required: true
    default: BPMN
    values: [BPMN, STATE_MACHINE, CHECKLIST]
    help:
      summary: The notation the steps are written in.
      usage: Decides which engine runs the process.
      relationshipContext: Read with the definition content.
      valueSemantics:
        BPMN: Business Process Model and Notation.
        STATE_MACHINE: A set of states and the moves between them.
        CHECKLIST: An ordered list of steps without branching.
  - name: definitionContent
    type: text
    required: false
    help:
      summary: The process itself, in the chosen notation.
      usage: Edited by the process owner; read by the engine.
      relationshipContext: Not changed after publication.
  - name: targetDurationHours
    type: integer
    required: false
    help:
      summary: How long an instance should take, in working hours.
      usage: Instances taking longer are flagged.
      relationshipContext: Measured from start to completion.
  - name: publishedAt
    type: datetime
    required: false
    help:
      summary: When the version was published.
      usage: Recorded on publication.
      relationshipContext: Present once published.
  relationships:
  - name: businessProcess
    target: BusinessProcess
    cardinality: 0..1
    ownership: reference
    help:
      summary: The business process this definition implements.
      usage: Linked so the process landscape shows which processes are automated.
      cardinalityMeaning: One per definition.
      context: A business process may have several definitions over time.
  - name: owner
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person responsible for the process design.
      usage: Approves changes and publishes versions.
      cardinalityMeaning: One per definition.
      context: Receives reports on instance durations.
  invariants:
  - {id: PROCESS-DEFINITION-001, rule: A published version is not changed; a change is a new version.}
  - {id: PROCESS-DEFINITION-002, rule: A published or retired version records when it was published., violatedWhen: (status == "PUBLISHED" or status == "RETIRED") and published_at == null, message: Record when the version was published.}
  lifecycle:
    title: Process Definition Lifecycle
    attribute: status
    states: [DRAFT, PUBLISHED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: PUBLISHED, action: publish}
    - {from: PUBLISHED, to: RETIRED, action: retire}
    - {from: DRAFT, to: RETIRED, action: discard}
  help:
    summary: The designed sequence of steps for one business process, in one version.
    businessMeaning: A process that runs the same way every time can be measured and improved. The definition records the steps, who does each, what decides the path and how long it should take, in a version that each running instance keeps, so a change to the process never alters cases already under way.
    usage: Process owners design and publish definitions; when the process changes they publish a new version and retire the old one once its instances have finished. Instances are started from the current published version.
    relationshipContext: A definition belongs to a BusinessProcess and is owned by a person. ProcessInstances run from it; the instance keeps the version it was started from.
    lifecycle: Drafted, published for use, and retired when replaced. A published version is not changed; changes are a new version.
    workflowContext: Process design and governance; every case-handling process (onboarding, approvals, claims) runs from a definition.
    example: 'Definition SUP-ONB version 3: supplier onboarding — collect data, sanctions check, finance approval, bank-detail verification, activate; target duration 5 working days; published 1 February 2024.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PROCESS-DEFINITION}
