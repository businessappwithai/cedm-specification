entity:
  name: ProcessDefinition
  namespace: cedm.domain
  kind: workflow_definition
  description: A versioned executable-neutral definition of a business process, its activities, transitions, assignments, controls, and completion semantics.
  identity: {key: processDefinitionId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: processDefinitionId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of ProcessDefinition., businessMeaning: Identifies one governed ProcessDefinition record independently of mutable status., usage: Workflow, authorization, integration and audit., relationshipContext: Referenced by related enterprise processes., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: Governed lifecycle state of ProcessDefinition., businessMeaning: Indicates current workflow/control usability., usage: Execution and audit., relationshipContext: Terminal history is retained., valueSemantics: {PENDING: Awaiting activation or decision., ACTIVE: Currently effective or executing., COMPLETED: Successfully concluded., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships: []
  invariants:
  - {id: PROCESS-DEFINITION-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  help:
    summary: A versioned executable-neutral definition of a business process, its activities, transitions, assignments, controls, and completion semantics.
    purpose: Provide implementation-neutral workflow or authorization semantics reusable across CEDM domains.
    businessMeaning: A versioned executable-neutral definition of a business process, its activities, transitions, assignments, controls, and completion semantics.
    whenUsed: Used when enterprise work requires explicit responsibility, state, authorization, or control evidence.
    howItRelates: Connects to business objects and workflow participants without replacing their domain transaction history.
    lifecycleUsage: Progresses through governed states with immutable audit evidence for completed or cancelled work.
    commonProcesses: Workflow orchestration, approval, assignment, escalation, access governance, and audit.
    commonExamples: Cross-domain enterprise process control.
