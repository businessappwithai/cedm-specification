entity:
  name: UsageRecord
  namespace: cedm.domain
  kind: subscription_usage
  description: An immutable measured usage event or aggregate used for usage-based entitlement and billing.
  ui:
    icon: table
  identity: {key: usageRecordId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: usageRecordId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of UsageRecord., businessMeaning: Identifies one governed UsageRecord record., usage: "Enterprise processing, integration, reporting and audit.", relationshipContext: Referenced by compatible domain workflows.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help: {summary: Governed lifecycle state., businessMeaning: Indicates usability/execution state of UsageRecord., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}}
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: Customer owning or economically affected by record., businessMeaning: Supplies commercial party context., usage: Billing and entitlement., cardinalityMeaning: Optional for reusable definitions; required by applicable transaction policy., workflowRole: Financial settlement remains separate.}}
  invariants:
    - {id: USAGE-RECORD-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Usage Record Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a usage record is ended"
      description: "When a usage record is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "USAGE-RECORD-FOLLOW-UP-{{id}}"
              name: "Follow up on usage record {{id}}"
              description: "Usage record {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An immutable measured usage event or aggregate used for usage-based entitlement and billing.
    purpose: Provide canonical enterprise semantics for UsageRecord while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: An immutable measured usage event or aggregate used for usage-based entitlement and billing.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-USAGE-RECORD}
