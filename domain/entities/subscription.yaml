entity:
  name: Subscription
  namespace: cedm.domain
  kind: subscription_contract
  description: A governed customer subscription to a plan, product, service, or entitlement over a defined lifecycle.
  ui:
    icon: repeat
  identity: {key: subscriptionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: subscriptionId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the subscription, constant for its life.', usage: Generated on creation; billing and entitlements refer to it., relationshipContext: Referenced by invoices and usage records.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: "Where the customer's subscription is in its life: being set up, running, finished or cancelled."
        usage: Starts as DRAFT; account management activates it at sign-up, and billing and entitlements apply only while it is active.
        valueSemantics:
          DRAFT: The subscription is being set up and does not yet bill or grant access.
          ACTIVE: The subscription is running; charges are billed and entitlements are granted.
          COMPLETED: The subscription reached its end date or fulfilled its term. A final state.
          CANCELLED: The subscription was ended early by the customer or the business. A final state.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer who subscribes., usage: Chosen when created., cardinalityMeaning: At most one customer; empty until identified., workflowRole: Decides who is billed and served.}}
  invariants:
    - {id: SUBSCRIPTION-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Subscription Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a subscription is ended"
      description: "When a subscription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SUBSCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on subscription {{id}}"
              description: "Subscription {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A customer's subscription to a plan, product, service or entitlement over a defined life.
    businessMeaning: A subscription is the ongoing agreement to supply something for a period. It records who subscribes and its state, while billing, usage and entitlement are recorded in their own records so none is duplicated.
    usage: Created when a customer signs up; read by billing, support and account management.
    relationshipContext: A subscription belongs to a customer and follows a plan.
    lifecycle: A subscription is drafted, active while it runs, and completes at the end of its term or is cancelled. Completed and cancelled are final.
    example: A customer subscribes to the Premium plan for twelve months from 1 March.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SUBSCRIPTION}
