entity:
  name: Prescription
  namespace: cedm.domain
  kind: healthcare_transaction
  description: An authorized instruction for a patient to receive or use a medication or therapy.
  ui:
    icon: file-text
  identity:
    key: prescriptionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: prescriptionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the prescription.
        usage: Generated on creation; dispensing records refer to it.
    - name: prescriptionNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number printed on the prescription.
        usage: Allocated on signing; unique; presented at the pharmacy.
    - name: dosage
      type: string
      required: false
      maxLength: 200
      help:
        summary: How much medication is given each time, such as 500 mg.
        usage: Entered by the prescriber; checked against safe ranges.
    - name: frequency
      type: string
      required: false
      maxLength: 200
      help:
        summary: How often the dose is given, such as three times daily.
        usage: Entered by the prescriber; drives the administration schedule.
    - name: route
      type: string
      required: false
      maxLength: 100
      help:
        summary: How the medication is given, such as oral, intravenous or topical.
        usage: Chosen by the prescriber; must suit the medication's form.
    - name: startDate
      type: date
      required: false
      help:
        summary: The first day of treatment.
        usage: Set by the prescriber; defaults to today.
    - name: endDate
      type: date
      required: false
      help:
        summary: The last day of treatment.
        usage: Set by the prescriber; must not be before the start date.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - DRAFT
        - ACTIVE
        - COMPLETED
        - CANCELLED
        - DISCONTINUED
      help:
        summary: Where the prescription stands.
        usage: Moved by the prescriber and pharmacy.
        valueSemantics:
          DRAFT: Being written; not yet valid.
          ACTIVE: Signed and in force.
          COMPLETED: The course is finished. A final state.
          CANCELLED: Withdrawn before use. A final state.
          DISCONTINUED: Stopped by the prescriber during treatment. A final state.
  relationships:
    - name: patient
      target: HealthcarePatient
      cardinality: '1'
      ownership: reference
      help:
        summary: The patient who is to receive the medication.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one patient: a prescription is for a specific person.'
        workflowRole: Adds the prescription to the patient's record for interaction and allergy checks.
    - name: medication
      target: Medication
      cardinality: '1'
      ownership: reference
      help:
        summary: The medication prescribed.
        usage: Chosen from the formulary.
        cardinalityMeaning: Exactly one medication.
        workflowRole: Defines the product to be dispensed.
    - name: prescriber
      target: HealthcareProvider
      cardinality: '1'
      ownership: reference
      help:
        summary: The provider who issued the prescription.
        usage: Set when signed.
        cardinalityMeaning: Exactly one prescriber, who is responsible for the instruction.
        workflowRole: Identifies who to contact about it.
  invariants:
    - id: PRESCRIPTION-001
      rule: endDate must not precede startDate.
  lifecycle:
    title: Prescription Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED, DISCONTINUED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED, DISCONTINUED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: DRAFT, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a prescription is ended"
      description: "When a prescription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a prescription is done"
      description: "When a prescription is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-COMPLETED-{{id}}"
              name: "Confirm prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: An authorised instruction for a patient to receive or use a medication or therapy.
    businessMeaning: 'The prescription turns a clinical decision into an instruction that pharmacists and nurses can follow safely: who gets what, how much, how often and for how long.'
    usage: Written by a prescriber after assessment; dispensed and administered; read by pharmacy, nursing and the patient.
    relationshipContext: A prescription is for a HealthcarePatient, names a Medication and is issued by a HealthcareProvider.
    lifecycle: A prescription is drafted, becomes active when signed, and ends completed when the course is finished, discontinued by the prescriber, or cancelled if never used.
    example: Amoxicillin 500 mg, three times daily by mouth for seven days, prescribed after a chest infection diagnosis.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PRESCRIPTION
