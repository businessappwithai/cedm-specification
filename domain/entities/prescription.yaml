entity:
  name: Prescription
  namespace: cedm.domain
  kind: healthcare_transaction
  description: An authorized instruction for a patient to receive or use a medication or therapy.
  ui:
    icon: file-text
    recordLabel: [prescriptionNumber]
  identity:
    key: prescriptionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: prescriptionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the prescription record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a prescription store this identifier. The number or code people quote is a separate field.
  - name: prescriptionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the prescription.
      usage: Quoted by the pharmacy when dispensing.
      relationshipContext: Unique.
  - name: dosage
    type: string
    required: false
    maxLength: 200
    help:
      summary: How much to take each time, such as one capsule or 5 ml.
      usage: Printed on the label.
      relationshipContext: Within the medication's safe limits.
  - name: frequency
    type: string
    required: false
    maxLength: 200
    help:
      summary: How often to take it, such as three times a day.
      usage: Printed on the label and used for administration schedules.
      relationshipContext: As the prescriber wrote it.
  - name: route
    type: string
    required: false
    maxLength: 100
    help:
      summary: How the medication is given, such as by mouth or intravenously.
      usage: Printed on the label.
      relationshipContext: Must suit the medication's form.
  - name: startDate
    type: date
    required: false
    help:
      summary: The first day of the therapy.
      usage: Doses are scheduled from it.
      relationshipContext: Not after the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The last day of the therapy.
      usage: The prescription completes after it.
      relationshipContext: Empty for ongoing therapy.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED, DISCONTINUED]
    help:
      summary: Whether the prescription may be dispensed.
      usage: Changed by the prescriber and pharmacy.
      relationshipContext: Only active prescriptions are dispensed.
      valueSemantics:
        DRAFT: Being written; not signed.
        ACTIVE: Signed and in effect.
        COMPLETED: The therapy has ended as planned.
        CANCELLED: Withdrawn before use.
        DISCONTINUED: Stopped early by the prescriber.
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: The patient the prescription is for.
      usage: Set when prescribing.
      cardinalityMeaning: Each prescription is for one patient.
      context: Checked against the patient's allergies.
  - name: medication
    target: Medication
    cardinality: '1'
    ownership: reference
    help:
      summary: The medication prescribed.
      usage: Chosen from the medication list.
      cardinalityMeaning: Each prescription is for one medication.
      context: Only active medications may be prescribed.
  - name: prescriber
    target: HealthcareProvider
    cardinality: '1'
    ownership: reference
    help:
      summary: The provider who wrote the prescription.
      usage: Set when signing.
      cardinalityMeaning: Each prescription has one prescriber.
      context: Must be allowed to prescribe.
  invariants:
  - id: PRESCRIPTION-001
    rule: endDate must not precede startDate.
  lifecycle:
    title: Prescription Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED, DISCONTINUED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED, DISCONTINUED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: sign}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a prescription is ended"
      description: "When a prescription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a prescription is done"
      description: "When a prescription is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-COMPLETED-{{id}}"
              name: "Confirm prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Represents a healthcare transaction called Prescription within the CEDM business model.
    businessMeaning: Prescription is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcarePatient, Medication, HealthcareProvider. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Prescribers write prescriptions for their patients; pharmacists check and dispense them; nurses give doses as prescribed; prescribers stop or change therapy by discontinuing a prescription.
    lifecycle: A prescription is drafted, active once signed, and completed at the end of the therapy; a draft can be cancelled and an active prescription discontinued early.
    example: 'Prescription RX-2024-77812 for patient MRN 0048812: Amoxicillin 500 mg capsule, one capsule three times a day by mouth, 14–21 May 2024, by Dr. A. Rossi.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PRESCRIPTION
