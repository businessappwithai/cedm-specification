entity:
  name: Prescription
  namespace: cedm.domain
  kind: healthcare_transaction
  description: An authorized instruction for a patient to receive or use a medication or therapy.
  ui:
    icon: file-text
  identity:
    key: prescriptionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: prescriptionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the prescription record associated with this Prescription. The identifier connects this record to
        the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of one prescription, so every dispensing and administration of the medicine can be traced to the instruction that authorised it."
  - name: prescriptionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of prescription number for the Prescription. It is interpreted together with
        the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The prescription reference quoted by pharmacists, nurses and the prescriber, such as RX-2026-118204, printed on the prescription and dispensing labels."
  - name: dosage
    type: string
    required: false
    maxLength: 200
    help:
      summary: Captures the business meaning of dosage for the Prescription. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How much of the medicine to give each time, such as 500 mg or two tablets, which pharmacists check against safe limits before dispensing."
  - name: frequency
    type: string
    required: false
    maxLength: 200
    help:
      summary: Captures the business meaning of frequency for the Prescription. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How often the dose is to be given, such as twice daily or every eight hours, which drives the administration schedule and the quantity dispensed."
  - name: route
    type: string
    required: false
    maxLength: 100
    help:
      summary: Captures the business meaning of route for the Prescription. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "How the medicine enters the body, such as by mouth, intravenously or applied to the skin, which affects the form dispensed and how staff administer it."
  - name: startDate
    type: date
    required: false
    help:
      summary: The date on which the applicable business period, agreement, service, or lifecycle begins. Related end dates
        must follow the business chronology.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The first day the patient should receive the medicine; doses are not dispensed or administered before it."
  - name: endDate
    type: date
    required: false
    help:
      summary: The date on which the applicable business period, agreement, service, or lifecycle ends. It is interpreted
        together with the corresponding start date.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The last day of the course of treatment, after which the prescription should be completed or reviewed for renewal."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - COMPLETED
    - CANCELLED
    - DISCONTINUED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Prescription records, where
        applicable.
      relationshipContext: Its meaning is specific to Prescription; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Prescription.
        ACTIVE: Represents the active state or classification in the context of Prescription.
        COMPLETED: Represents the completed state or classification in the context of Prescription.
        CANCELLED: Represents the cancelled state or classification in the context of Prescription.
        DISCONTINUED: Represents the discontinued state or classification in the context of Prescription.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the prescription is a DRAFT not yet in force, ACTIVE and may be dispensed, COMPLETED at the end of the course, DISCONTINUED by the prescriber, or CANCELLED before taking effect."
  relationships:
  - name: patient
    target: HealthcarePatient
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Prescription to HealthcarePatient so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcarePatient records associated with a Prescription.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: medication
    target: Medication
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Prescription to Medication so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Medication records associated with a Prescription.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: prescriber
    target: HealthcareProvider
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Prescription to HealthcareProvider so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HealthcareProvider records associated with a Prescription.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: PRESCRIPTION-001
    rule: endDate must not precede startDate.
  lifecycle:
    title: Prescription Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED, DISCONTINUED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED, DISCONTINUED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: DRAFT, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a prescription is ended"
      description: "When a prescription is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-FOLLOW-UP-{{id}}"
              name: "Follow up on prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a prescription is done"
      description: "When a prescription is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRESCRIPTION-COMPLETED-{{id}}"
              name: "Confirm prescription {{prescription_number}}"
              description: "Prescription {{prescription_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: "One authorised instruction from a prescriber for a patient to take a medication or therapy at a stated dosage, frequency and route over a defined period, kept for safe treatment and dispensing."
    businessMeaning: Prescription is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Prescription records.
    relationshipContext: The entity participates in a wider business graph through relationships with HealthcarePatient, Medication,
      HealthcareProvider. These relationships provide the context needed to interpret the record rather than treating its
      fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Prescription record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
    workflowContext: "Written as a draft by the prescriber for a patient and medication, activated once signed so it can be dispensed and administered, reviewed during the course of treatment, and ended as completed when the course finishes, discontinued when the prescriber stops it early, or cancelled if it should never take effect."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-PRESCRIPTION
