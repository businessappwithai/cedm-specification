entity:
  name: ServiceRequest
  namespace: cedm.domain
  kind: service_management_entity
  description: A request for service, support, maintenance, or assistance that requires fulfillment or resolution.
  identity: {key: serviceRequestId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: serviceRequestId, type: uuid, required: true, immutable: true}
    - {name: requestNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: requestType, type: string, required: true, maxLength: 100}
    - {name: description, type: string, required: true, maxLength: 4000}
    - {name: priority, type: enum, required: true, default: NORMAL, values: [LOW, NORMAL, HIGH, CRITICAL]}
    - {name: status, type: enum, required: true, default: OPEN, values: [OPEN, TRIAGED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]}
    - {name: requestedAt, type: datetime, required: true}
    - {name: resolvedAt, type: datetime, required: false}
  relationships:
    - {name: requester, target: Party, cardinality: "1", ownership: reference}
    - {name: assignee, target: Party, cardinality: "0..1", ownership: reference}
    - {name: organization, target: Organization, cardinality: "0..1", ownership: reference}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference}
    - {name: tasks, target: Task, cardinality: "0..*", ownership: reference}
  invariants:
    - {id: SERVICE-REQUEST-001, rule: resolvedAt is required when status is RESOLVED or CLOSED.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SERVICE-REQUEST}
