entity:
  name: ServiceRequest
  namespace: cedm.domain
  kind: service_management_entity
  description: A request for service, support, maintenance, or assistance that requires fulfillment or resolution.
  ui:
    icon: table
    recordLabel: [requestNumber, requestType]
  identity:
    key: serviceRequestId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: serviceRequestId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the service request record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a service request store this identifier. The number or code people quote is a separate field.
  - name: requestNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the request.
      usage: Quoted by the requester when following up.
      relationshipContext: Unique.
  - name: requestType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The kind of service asked for.
      usage: Decides routing and the service level.
      relationshipContext: From the service catalogue.
  - name: description
    type: string
    required: true
    maxLength: 4000
    help:
      summary: What is needed or what is wrong.
      usage: Read by the person handling it.
      relationshipContext: In the requester's words.
  - name: priority
    type: enum
    required: true
    default: NORMAL
    values:
    - LOW
    - NORMAL
    - HIGH
    - CRITICAL
    help:
      summary: How urgent the request is.
      usage: Decides the order of work and the target times.
      relationshipContext: Set at triage.
      valueSemantics:
        LOW: Can wait.
        NORMAL: Ordinary.
        HIGH: Urgent for the requester.
        CRITICAL: Stops business; handled at once.
  - name: status
    type: enum
    required: true
    default: OPEN
    values:
    - OPEN
    - TRIAGED
    - ASSIGNED
    - IN_PROGRESS
    - RESOLVED
    - CLOSED
    - CANCELLED
    help:
      summary: Where the request stands.
      usage: Moved on by the service desk.
      relationshipContext: Resolved requests have a resolution time.
      valueSemantics:
        OPEN: Received.
        TRIAGED: Classified and prioritised.
        ASSIGNED: Given to a person or team.
        IN_PROGRESS: Being worked on.
        RESOLVED: Fixed or fulfilled.
        CLOSED: Confirmed by the requester.
        CANCELLED: Withdrawn.
  - name: requestedAt
    type: datetime
    required: true
    help:
      summary: When the request was raised.
      usage: Starts the service-level clock.
      relationshipContext: Set when raised.
  - name: resolvedAt
    type: datetime
    required: false
    help:
      summary: When the request was resolved.
      usage: Stops the service-level clock.
      relationshipContext: Present once resolved.
  relationships:
  - name: requester
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Who asked for the service.
      usage: Set when raised.
      cardinalityMeaning: Each request has one requester.
      context: Informed of progress.
  - name: assignee
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who handles the request.
      usage: Set when assigned.
      cardinalityMeaning: At most one assignee.
      context: Sees it in their queue.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation unit providing the service.
      usage: Set at triage.
      cardinalityMeaning: At most one unit.
      context: Its service levels apply.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the service is needed.
      usage: Used to dispatch on-site staff.
      cardinalityMeaning: At most one location.
      context: Empty for remote requests.
  - name: tasks
    target: Task
    cardinality: 0..*
    ownership: reference
    help:
      summary: Work items to fulfil the request.
      usage: Created by the assignee.
      cardinalityMeaning: Any number of tasks.
      context: All are done before resolving.
    inverseCardinality: '1'
  - {name: serviceLevelAgreement, target: ServiceLevelAgreement, cardinality: "0..1", ownership: reference, help: {summary: SLA governing request service targets., businessMeaning: Supplies response/resolution commitments., usage: "Deadline, escalation and compliance measurement.", cardinalityMeaning: Optional when no SLA applies., workflowRole: Applied SLA/version must be retained for historical measurement.}}
  invariants:
  - id: SERVICE-REQUEST-001
    rule: resolvedAt is required when status is RESOLVED or CLOSED.
  - {id: SERVICE-REQUEST-002, rule: A resolved request states when it was resolved., violatedWhen: (status == "RESOLVED" or status == "CLOSED") and resolved_at == null, message: Enter when the request was resolved.}
  lifecycle:
    title: Service Request Lifecycle
    attribute: status
    states: [OPEN, TRIAGED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    initial: OPEN
    terminal: [CLOSED, CANCELLED]
    transitions:
    - {from: OPEN, to: TRIAGED, action: triage}
    - {from: TRIAGED, to: ASSIGNED, action: assign}
    - {from: ASSIGNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: RESOLVED, action: resolve}
    - {from: RESOLVED, to: CLOSED, action: close}
    - {from: RESOLVED, to: IN_PROGRESS, action: reopen}
    - {from: OPEN, to: CANCELLED, action: cancel}
    - {from: TRIAGED, to: CANCELLED, action: cancel}
    - {from: ASSIGNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a service request is ended"
      description: "When a service request is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "SERVICE-REQUEST-FOLLOW-UP-{{id}}"
              name: "Follow up on service request {{request_number}}"
              description: "Service request {{request_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a service management entity called ServiceRequest within the CEDM business model.
    businessMeaning: ServiceRequest is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Party, Organization, Location, Task. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Requesters raise service requests through a portal, email or phone; the service desk triages and assigns them, technicians resolve them, and service levels are measured from them.
    lifecycle: A request is opened, triaged, assigned, worked on and resolved, then closed when the requester confirms; it may be cancelled before resolution.
    example: Request SR-2024-11872 'Laptop does not boot', IT hardware, high, requested by Ana Silva 14 May 09:05, assigned to desk team B, resolved 11:30.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-SERVICE-REQUEST
