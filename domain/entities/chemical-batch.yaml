entity:
  name: ChemicalBatch
  namespace: cedm.domain
  kind: process_industry_entity
  description: A traceable batch of chemical or process-industry material produced, received, or processed under controlled conditions.
  ui:
    icon: table
    recordLabel: [batchNumber]
  identity:
    key: chemicalBatchId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: chemicalBatchId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the chemical batch record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a chemical batch store this identifier. The number or code people quote is a separate field.
  - name: batchNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the batch, printed on every container from it.
      usage: Scanned in stock movements, shipments and quality records.
      relationshipContext: Unique.
  - name: manufactureDate
    type: date
    required: false
    help:
      summary: When the batch was made.
      usage: Starts its shelf life.
      relationshipContext: Not later than the expiry date.
  - name: expiryDate
    type: date
    required: false
    help:
      summary: The last day the batch may be used or shipped.
      usage: Stock past this date is blocked.
      relationshipContext: Not earlier than the manufacture date.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    help:
      summary: Whether the batch may be used.
      usage: Moved on by production and quality.
      relationshipContext: Only released, unexpired batches may be shipped or consumed.
      valueSemantics:
        PLANNED: Scheduled for production.
        QUARANTINED: Made, or recalled into quarantine, and waiting for a quality decision.
        RELEASED: Approved for use.
        REJECTED: Failed quality and must not be used.
        EXPIRED: Past its expiry date.
        CONSUMED: Used up.
  - name: quantity
    type: decimal
    required: false
    precision: 18
    scale: 4
    help:
      summary: How much of the material the batch holds.
      usage: Recorded at production.
      relationshipContext: In the product's unit of measure.
  - name: certificateNumber
    type: string
    required: false
    maxLength: 60
    help:
      summary: The number of the certificate of analysis for the batch.
      usage: Quoted to customers who need it.
      relationshipContext: Issued on release.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The material the batch is of.
      usage: Set at production.
      cardinalityMeaning: Every batch is of exactly one product.
      context: Its specification decides release.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the batch is stored.
      usage: Updated as it moves.
      cardinalityMeaning: At most one.
      context: The plant or warehouse.
  - name: qualityInspections
    target: QualityInspection
    cardinality: 0..*
    ownership: reference
    help:
      summary: The tests carried out on the batch.
      usage: Recorded by quality.
      cardinalityMeaning: Any number; each inspection is of one batch.
      context: The inspection records its batch.
    inverseCardinality: '1'
  invariants:
  - id: CHEMICAL-BATCH-001
    rule: expiryDate must not precede manufactureDate.
  - {id: CHEMICAL-BATCH-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Chemical Batch Lifecycle
    attribute: status
    states: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    initial: PLANNED
    terminal: [REJECTED, EXPIRED, CONSUMED]
    transitions:
    - {from: PLANNED, to: QUARANTINED, action: produce}
    - {from: QUARANTINED, to: RELEASED, action: release}
    - {from: QUARANTINED, to: REJECTED, action: reject}
    - {from: RELEASED, to: QUARANTINED, action: quarantine}
    - {from: RELEASED, to: CONSUMED, action: consume}
    - {from: RELEASED, to: EXPIRED, action: expire}
    - {from: QUARANTINED, to: EXPIRED, action: expire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a chemical batch is stopped"
      description: "When a chemical batch is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHEMICAL-BATCH-EXCEPTION-{{id}}"
              name: "Resolve chemical batch {{batch_number}}"
              description: "Chemical batch {{batch_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a chemical batch is ended"
      description: "When a chemical batch is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHEMICAL-BATCH-FOLLOW-UP-{{id}}"
              name: "Follow up on chemical batch {{batch_number}}"
              description: "Chemical batch {{batch_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a process industry entity called ChemicalBatch within the CEDM business model.
    businessMeaning: ChemicalBatch is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Location, QualityInspection. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Production records each batch it makes; quality tests it while it is quarantined and releases or rejects it; the warehouse ships only released, unexpired batches; recalls trace batches to customers.
    lifecycle: A planned batch is made and placed in quarantine; quality releases it for use or rejects it; a released batch is consumed in production or shipped, may be put back into quarantine if a problem appears, and expires at its expiry date if unused.
    example: Batch CB-24-0412 of ethyl acetate 99.5%, made 3 April 2024 in Plant Lyon reactor R2, released 5 April after assay 99.7%, expires 3 April 2026.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CHEMICAL-BATCH
