entity:
  name: ResearchProject
  namespace: cedm.domain
  kind: scientific_research_entity
  description: A structured scientific research initiative with defined objectives, resources, experiments, and outcomes.
  ui:
    icon: folder-kanban
  identity:
    key: researchProjectId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: researchProjectId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the project, constant for its life.
        usage: Generated on creation; protocols, studies and experiments refer to it.
        relationshipContext: Referenced by all work run under it.
    - name: projectCode
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code of the project, such as RP-014.
        usage: Unique; quoted in reports and notebooks.
        relationshipContext: Read with the title to identify the project.
    - name: title
      type: string
      required: true
      maxLength: 500
      help:
        summary: The title of the project.
        usage: Shown in lists and reports.
        relationshipContext: Read by the team and by management.
    - name: objective
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A statement of what the project sets out to find or prove.
        usage: Written when planned; reviewed when deciding to continue.
        relationshipContext: Read by anyone judging whether results meet it.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - ACTIVE
        - COMPLETED
        - SUSPENDED
        - CANCELLED
        - ARCHIVED
      help:
        summary: Where the project is.
        usage: Starts as PLANNED; moved by the project lead.
        relationshipContext: Decides whether new studies and experiments can start.
        valueSemantics:
          PLANNED: Approved to proceed but not yet started.
          ACTIVE: Work is under way.
          COMPLETED: The objective has been addressed; reporting remains.
          SUSPENDED: Paused; can be resumed.
          CANCELLED: Stopped before completion. A final state.
          ARCHIVED: Closed out and kept for record. A final state.
  relationships:
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that runs or funds the project.
        usage: Chosen when the project is set up.
        cardinalityMeaning: At most one organisation.
        context: Decides whose records and budget the work belongs to.
    - name: experiments
      target: Experiment
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: The experiments run under the project.
        usage: Read to follow the work.
        cardinalityMeaning: Any number of experiments.
        context: Experiments belong to the project.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents produced or used by the project.
        usage: Attached as work proceeds.
        cardinalityMeaning: Any number of documents.
        context: Holds reports, approvals and data sheets.
    - name: team
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The people working on the project.
        usage: Chosen when the team is formed.
        cardinalityMeaning: Any number of people.
        context: Decides who may see and record work.
    - {name: protocols, target: Protocol, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: Any number of protocols govern the project's work., summary: Governed scientific protocols owned or managed by this ResearchProject., businessMeaning: Separates project governance from reusable method definitions., usage: "Research planning, approvals and reproducibility.", workflowRole: Project lifecycle constrains new protocol execution without rewriting historical versions.}}
    - {name: studies, target: Study, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: Any number of studies are run within the project., summary: Organized Studies performed within this ResearchProject., businessMeaning: Provides investigation-level structure between project and experiments/results., usage: "Portfolio, execution and reporting.", workflowRole: Study execution and closure remain attributable to Project governance.}}

  lifecycle:
    title: Research Project Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, SUSPENDED, CANCELLED, ARCHIVED]
    initial: PLANNED
    terminal: [ARCHIVED, CANCELLED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: COMPLETED, to: ARCHIVED, action: archive}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a research project is ended"
      description: "When a research project is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RESEARCH-PROJECT-FOLLOW-UP-{{id}}"
              name: "Follow up on research project {{title}}"
              description: "Research project {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A structured scientific research initiative with defined objectives, resources, experiments and outcomes.
    businessMeaning: A research project is the top-level frame for a body of scientific work. It gathers the protocols, studies and experiments run under one objective, the team doing the work and the documents produced, so progress and results can be reviewed together.
    usage: Created by a project lead; read by scientists, management and quality.
    relationshipContext: A project may belong to an organisation, has a team, and contains protocols, studies and experiments with documents.
    lifecycle: A project is planned, becomes active, may be suspended and resumed, and completes. It is then archived, or cancelled earlier. Archived and cancelled are final.
    example: Project RP-014 investigates a new formulation for stability over twelve months, with three studies and a protocol.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RESEARCH-PROJECT
