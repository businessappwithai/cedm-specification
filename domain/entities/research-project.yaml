entity:
  name: ResearchProject
  namespace: cedm.domain
  kind: scientific_research_entity
  description: A structured scientific research initiative with defined objectives, resources, experiments, and outcomes.
  ui:
    icon: folder-kanban
    recordLabel: [projectCode, title]
  identity:
    key: researchProjectId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: researchProjectId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the research project record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a research project store this identifier. The number or code people quote is a separate field.
  - name: projectCode
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the research project.
      usage: Recorded on experiments, samples and reports.
      relationshipContext: Unique.
  - name: title
    type: string
    required: true
    maxLength: 500
    help:
      summary: What the project investigates.
      usage: Shown in portfolios and reports.
      relationshipContext: Understandable to non-specialists where possible.
  - name: objective
    type: string
    required: false
    maxLength: 4000
    help:
      summary: The scientific question or goal.
      usage: Results are judged against it.
      relationshipContext: Specific and testable.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - ACTIVE
    - COMPLETED
    - SUSPENDED
    - CANCELLED
    - ARCHIVED
    help:
      summary: Where the project stands.
      usage: Changed by the project lead.
      relationshipContext: Experiments are planned only under active projects.
      valueSemantics:
        PLANNED: Approved; not started.
        ACTIVE: Research in progress.
        COMPLETED: The objective has been answered.
        SUSPENDED: Paused.
        CANCELLED: Stopped before completion.
        ARCHIVED: Completed and filed.
  relationships:
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation running the project.
      usage: Set when planning.
      cardinalityMeaning: At most one organisation.
      context: Funds and staffs the project.
  - name: experiments
    target: Experiment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The experiments run under the project.
      usage: Planned and recorded by the team.
      cardinalityMeaning: Any number, kept with the project.
      context: Line items of the project.
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Protocols, reports and publications.
      usage: Attached by the team.
      cardinalityMeaning: Any number of documents.
      context: Kept with the project.
    inverseCardinality: 0..*
  - name: team
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The researchers working on the project.
      usage: Added as people join.
      cardinalityMeaning: Any number of people; a person may work on several projects.
      context: Team members may record experiments.
    inverseCardinality: 0..*
  lifecycle:
    title: Research Project Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, COMPLETED, SUSPENDED, CANCELLED, ARCHIVED]
    initial: PLANNED
    terminal: [ARCHIVED, CANCELLED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: COMPLETED, to: ARCHIVED, action: archive}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
    - {from: SUSPENDED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a research project is ended"
    description: "When a research project is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "RESEARCH-PROJECT-FOLLOW-UP-{{id}}"
          name: "Follow up on research project {{title}}"
          description: "Research project {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A scientific project with an objective, a team and the experiments it runs.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Experiment, Document, Party. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Principal investigators set up research projects with their objective and team, run experiments under them, and report results to funders and management; finished projects are archived with their documents.
    lifecycle: A project is planned, active while research is done, may be suspended and resumed, and is completed when its objective is answered; completed projects are archived, and a project may be cancelled before completion.
    example: Research project KX-INH-2024 'Selective inhibitors of kinase X', Acme Pharma Discovery, lead Dr. M. Weber, 46 experiments, active.
    businessMeaning: Research budgets, results and intellectual property are managed per project.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RESEARCH-PROJECT
