entity:
  name: Approval
  namespace: cedm.domain
  kind: workflow_decision
  description: A governed approval decision or approval request associated with a business object, process, task, or controlled change.
  ui:
    icon: table
  identity: {key: approvalId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: approvalId, type: uuid, required: true, immutable: true, help: {summary: The permanent system identity of the approval., usage: Generated on request; workflow steps and audit entries refer to the approval through it.}}
    - name: status
      type: enum
      required: true
      values: [PENDING, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the approval request is in its path to a decision.
        usage: Moved by the approver and the workflow; a gated step proceeds only when the approval is COMPLETED with a positive decision.
        valueSemantics:
          PENDING: Requested and waiting to be picked up.
          ACTIVE: Under review by the approver.
          COMPLETED: Decided; the decision is final evidence.
          CANCELLED: Withdrawn by the requester before a decision.
  relationships: []
  invariants:
    - {id: APPROVAL-001, rule: State changes and retries must preserve auditable history and must not duplicate downstream business effects.}
  lifecycle:
    title: Approval Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  help:
    summary: A request for, or the outcome of, an approval decision about a business object, process, task or controlled change.
    businessMeaning: Approvals are the checkpoints where a person with authority says yes or no. Recording them as data, not email, shows who approved what and when, and lets processes wait for or react to the decision.
    usage: Created when something needs sign-off, decided by the approver, and read afterwards by anyone who needs to show the control was applied.
    relationshipContext: An approval refers to the thing it approves and to the approver; workflow and access governance use it to gate steps.
    lifecycle: An approval is pending when requested, active while under review, completed once decided and cancelled if the request is withdrawn. The decision is evidence and is not rewritten.
    example: A purchase order above the buyer's limit goes to the finance director for approval before it can be sent to the supplier.
    commonProcesses: Workflow orchestration, approval, assignment, escalation, access governance, and audit.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-APPROVAL}
