entity:
  name: QualityInspection
  namespace: cedm.domain
  kind: quality_transaction
  description: A recorded inspection or test performed against a quality requirement.
  identity: {key: qualityInspectionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: qualityInspectionId, type: uuid, required: true, immutable: true}
    - {name: inspectionNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: inspectionDate, type: datetime, required: true}
    - {name: status, type: enum, required: true, default: OPEN, values: [OPEN, IN_PROGRESS, PASSED, FAILED, CONDITIONAL, CANCELLED]}
    - {name: result, type: enum, required: false, values: [PASS, FAIL, CONDITIONAL, NOT_TESTED]}
    - {name: notes, type: string, required: false, maxLength: 4000}
  relationships:
    - {name: qualityPlan, target: QualityPlan, cardinality: "0..1", ownership: reference}
    - {name: product, target: Product, cardinality: "0..1", ownership: reference}
    - {name: inspector, target: Party, cardinality: "0..1", ownership: reference}
    - {name: nonconformances, target: Nonconformance, cardinality: "0..*", ownership: reference}
  invariants:
    - {id: INSPECTION-001, rule: result must be present when status is PASSED, FAILED, or CONDITIONAL.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-QUALITY-INSPECTION}
