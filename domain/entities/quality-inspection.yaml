entity:
  name: QualityInspection
  namespace: cedm.domain
  kind: quality_transaction
  description: A recorded inspection or test performed against a quality requirement, including inspection of received goods and returned goods before release, rejection, quarantine, repair, scrap, or other controlled disposition.
  identity: {key: qualityInspectionId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: qualityInspectionId
    type: uuid
    required: true
    immutable: true
    help: {summary: Stable identity of the inspection record., businessMeaning: Identifies one inspection event independently of the item, receipt, return, result or corrective action., usage: Used for quality traceability, audit, reporting and integrations., relationshipContext: Links the inspection to source receipt/return evidence without replacing those transactions., workflowRole: Root reference through planning, execution, result and disposition., requiredMeaning: Required.}
  - name: inspectionNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help: {summary: Business-facing inspection reference., businessMeaning: Identifies the inspection in quality operations and audit., usage: Used in quality records, supplier disputes and reporting., relationshipContext: Distinct from GoodsReceipt.receiptNumber and SupplierReturn.returnNumber., workflowRole: Provides human-recognizable traceability., requiredMeaning: Required.}
  - name: inspectionDate
    type: datetime
    required: true
    help: {summary: Date and time inspection was performed or initiated., businessMeaning: Establishes quality chronology., usage: Audit, release, supplier performance and compliance., relationshipContext: May occur after receipt or return authorization and before final disposition., workflowRole: Anchors inspection evidence., requiredMeaning: Required.}
  - name: status
    type: enum
    required: true
    default: OPEN
    values: [OPEN, IN_PROGRESS, PASSED, FAILED, CONDITIONAL, CANCELLED]
    help: {summary: Lifecycle state of inspection., businessMeaning: Indicates whether inspection is pending, executing, completed with a result, or cancelled., usage: Controls release and disposition workflows., relationshipContext: Inspection status is independent of receipt/return status; downstream transactions consume the result through controlled rules., workflowRole: PASSED/FAILED/CONDITIONAL controls eligible disposition., requiredMeaning: Required.}
  - name: result
    type: enum
    required: false
    values: [PASS, FAIL, CONDITIONAL, NOT_TESTED]
    help: {summary: Outcome of inspection or test., businessMeaning: Records whether inspected material satisfies the applicable requirement., usage: Drives acceptance, rejection, quarantine, return, repair or release decisions., relationshipContext: Result must be interpreted with QualityPlan, inspection scope and disposition policy., workflowRole: Supplies evidence for controlled disposition., optionalMeaning: Optional until testing is complete.}
  - name: disposition
    type: enum
    required: false
    values: [RELEASE, ACCEPT, REJECT, QUARANTINE, RETURN_TO_SUPPLIER, REWORK, REPAIR, SCRAP, CONDITIONAL_RELEASE]
    help: {summary: Controlled operational disposition resulting from inspection., businessMeaning: Defines what happens to inspected material after quality evaluation., usage: Controls inventory availability, supplier return, repair, scrap and release processes., relationshipContext: RETURN_TO_SUPPLIER may initiate or support SupplierReturn; it does not itself reduce inventory until an attributable InventoryMovement is posted., workflowRole: Converts quality result into an authorized physical disposition., optionalMeaning: Optional until a disposition decision is made.}
  - name: notes
    type: string
    required: false
    maxLength: 4000
    help: {summary: Inspection observations and supporting context., businessMeaning: Records qualitative evidence not represented by structured results., usage: Quality review, supplier disputes and audit., relationshipContext: Complements structured measurements and Nonconformance; does not replace them., workflowRole: Supports disposition decisions., optionalMeaning: Optional.}
  relationships:
  - name: qualityPlan
    target: QualityPlan
    cardinality: 0..1
    ownership: reference
    help: {summary: Quality plan governing this inspection., businessMeaning: Identifies requirements and test procedures., usage: Determines inspection scope and acceptance criteria., workflowRole: Provides expected quality controls.}
  - name: product
    target: Product
    cardinality: 0..1
    ownership: reference
    help: {summary: Product being inspected., businessMeaning: Identifies material subject to quality evaluation., usage: Quality history, supplier performance and disposition., workflowRole: Supplies item context.}
  - name: inspector
    target: Party
    cardinality: 0..1
    ownership: reference
    help: {summary: Party performing or accountable for inspection., businessMeaning: Identifies inspector or quality authority., usage: Accountability, audit and compliance., workflowRole: Provides execution responsibility.}
  - name: goodsReceipt
    target: GoodsReceipt
    cardinality: 0..1
    ownership: reference
    help: {summary: Receipt whose material is inspected., businessMeaning: Connects quality evidence to inbound fulfillment., usage: Receiving, acceptance and supplier quality., workflowRole: Inspection can control accepted or pending receipt disposition.}
  - name: goodsReceiptLines
    target: GoodsReceiptLine
    cardinality: 0..*
    ownership: reference
    help: {summary: Receipt lines whose quantities are inspected., businessMeaning: Identifies exact received quantities subject to quality decision., usage: Supports partial inspection and line-level disposition., workflowRole: Provides quantity evidence for acceptance/rejection.}
  - name: supplierReturn
    target: SupplierReturn
    cardinality: 0..1
    ownership: reference
    help: {summary: Supplier return whose returned material is inspected before final disposition where policy requires., businessMeaning: Connects quality result to reverse-procurement execution., usage: Supplier disputes, return validation and disposition., workflowRole: Inspection can establish whether returned material is eligible for completion or exception handling.}
  - name: supplierReturnLines
    target: SupplierReturnLine
    cardinality: 0..*
    ownership: reference
    help: {summary: Supplier return lines within the inspection scope., businessMeaning: Identifies exact returned quantities evaluated for quality or supplier acceptance., usage: Return execution and exception management., workflowRole: Quality outcome may control completion/dispute state.}
  - name: nonconformances
    target: Nonconformance
    cardinality: 0..*
    ownership: reference
    help: {summary: Quality issues identified by the inspection., businessMeaning: Captures deviations requiring containment or corrective action., usage: Supplier quality, CAPA and audit., workflowRole: Failed or conditional results may create nonconformance records.}
  invariants:
  - {id: INSPECTION-001, rule: result must be present when status is PASSED, FAILED or CONDITIONAL.}
  - {id: INSPECTION-002, rule: A disposition requires a completed result unless an explicitly authorized inspection-exception workflow applies.}
  - {id: INSPECTION-003, rule: ACCEPT or RELEASE requires result PASS or an explicitly governed conditional-release authorization.}
  - {id: INSPECTION-004, rule: REJECT, QUARANTINE, REWORK, REPAIR or SCRAP must have supporting inspection evidence and, where required, a Nonconformance.}
  - {id: INSPECTION-005, rule: RETURN_TO_SUPPLIER disposition must reference eligible receipt/return evidence and cannot itself create an inventory reduction.}
  - {id: INSPECTION-006, rule: GoodsReceiptLine accepted/rejected/pending quantities must not be destructively rewritten by a later inspection result; corrections use controlled disposition events.}
  - {id: INSPECTION-007, rule: SupplierReturn completion may require successful inspection/disposition when return policy requires inspection of returned material.}
  - {id: INSPECTION-008, rule: Inspection records become immutable historical evidence after completion except through controlled correction/reinspection workflows.}
  - {id: INSPECTION-009, rule: A completed inspection that verifies a CorrectiveAction must retain attributable CorrectiveActionVerification evidence; verification does not itself alter inventory or financial balances.}
  help:
    summary: Represents a quality inspection and its controlled result/disposition across inbound receiving and supplier-return workflows.
    businessMeaning: QualityInspection provides evidence for deciding whether material is accepted, rejected, quarantined, repaired, scrapped, released or returned. It does not itself perform inventory or financial changes.
    usage: Receiving quality, supplier quality, returns, quarantine, nonconformance, corrective action, compliance and audit.
    relationshipContext: GoodsReceipt/GoodsReceiptLine establish inbound evidence; SupplierReturn/SupplierReturnLine establish reverse-procurement evidence; InventoryMovement records physical stock consequence; SupplierCreditNote records financial consequence; Nonconformance records deviations; CorrectiveActionVerification records effectiveness evidence where corrective actions are evaluated through inspection.
    workflowContext: GoodsReceipt → inspection → pass/fail/conditional → disposition → accepted inventory or quarantine/rejection/return. For supplier returns, SupplierReturn → inspection where required → disposition/acceptance → attributable InventoryMovement → SupplierCreditNote/exception completion. For corrective actions, implementation → follow-up inspection/evidence → CorrectiveActionVerification → action completion or reopening.
    lifecycle: Open → in progress → passed/failed/conditional → dispositioned, with cancellation or controlled reinspection.
    changePropagation: Changes to receipt, supplier return, product, quality plan or corrective-action evidence affecting an open inspection trigger revalidation. Completed inspection history is not silently rewritten; reinspection or correction creates explicit evidence.
    example: A received batch fails inspection, creating a Nonconformance and a corrective action. Subsequent lots are inspected after the supplier implements the action; the results provide evidence for CorrectiveActionVerification, which determines whether the corrective action is effective.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-QUALITY-INSPECTION}
