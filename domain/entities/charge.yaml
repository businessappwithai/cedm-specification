entity:
  name: Charge
  namespace: cedm.domain
  kind: billing_transaction
  description: A governed billable monetary amount created from subscription, usage, service, product, fee, or adjustment rules before settlement.
  ui:
    icon: file-text
  identity: {key: chargeId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: chargeId, type: uuid, required: true, immutable: true, help: {summary: The identity of the charge., usage: Generated on creation; invoice lines and adjustments refer to the charge through it.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Where the charge stands before it is billed.
        usage: Moved by the billing run and by billing staff; only ACTIVE charges are picked up by invoicing.
        valueSemantics:
          DRAFT: Generated but not yet checked; excluded from invoicing.
          ACTIVE: Confirmed and waiting to be invoiced.
          COMPLETED: Invoiced; the charge has done its job.
          CANCELLED: Withdrawn and will not be billed.
  relationships:
    - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: The customer who is billed for the charge., usage: Set when the charge is generated; invoices are assembled per customer., cardinalityMeaning: At most one customer; a charge for an internal cost centre may have none., workflowRole: Decides which invoice the charge lands on and whose credit exposure it affects.}}
  invariants:
    - {id: CHARGE-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Charge Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a charge is ended"
      description: "When a charge is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHARGE-FOLLOW-UP-{{id}}"
              name: "Follow up on charge {{id}}"
              description: "Charge {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a charge is done"
      description: "When a charge is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "CHARGE-COMPLETED-{{id}}"
              name: "Confirm charge {{id}}"
              description: "Charge {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A billable amount produced from a subscription, usage, service, product, fee or adjustment rule, before it is settled.
    businessMeaning: A charge is the line between something the customer received and something they will be invoiced for. Holding it as a record lets billing check, adjust or cancel amounts before they become part of an invoice.
    usage: Generated by billing runs and manual adjustments; reviewed before invoicing; read when a customer queries what they were billed for.
    relationshipContext: A charge belongs to the Customer it is billed to. It never replaces the invoice, payment or ledger entries that follow from it.
    lifecycle: A charge is drafted, becomes active when ready to bill, completes when it has been invoiced and cancelled if it should not be billed. It does not rewrite cash, accounting or tax records.
    example: A monthly platform fee of 49.00 for March, generated by the billing cycle for a subscriber account.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CHARGE}
