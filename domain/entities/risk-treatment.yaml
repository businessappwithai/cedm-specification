entity:
  name: RiskTreatment
  namespace: cedm.domain
  kind: risk_management_entity
  description: An action taken on a risk — to reduce, avoid, transfer or accept it — with its owner, due date, cost, the risk level it should bring the risk to, and its progress.
  ui:
    icon: shield-plus
    recordLabel: [riskTreatmentCode, title]
  identity:
    key: riskTreatmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: riskTreatmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the risk treatment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a risk treatment store this identifier. The number or code people quote is a separate field.
  - name: riskTreatmentCode
    type: string
    required: true
    unique: true
    maxLength: 120
    help:
      summary: The reference of the treatment.
      usage: Assigned when it is planned.
      relationshipContext: Unique.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    help:
      summary: Where the treatment stands.
      usage: Moved on by the owner.
      relationshipContext: A completed treatment leads to reassessing the risk.
      valueSemantics:
        PLANNED: Agreed, not started.
        IN_PROGRESS: Actions under way.
        COMPLETED: Actions done.
        CANCELLED: No longer pursued.
  - name: title
    type: string
    required: true
    maxLength: 200
    help:
      summary: What will be done, in one line.
      usage: Shown in risk reports.
      relationshipContext: Identifies the treatment for people.
  - name: strategy
    type: enum
    required: true
    default: REDUCE
    values: [REDUCE, AVOID, TRANSFER, ACCEPT]
    help:
      summary: The kind of response.
      usage: Chosen when planning.
      relationshipContext: Accepting a risk needs approval at the right level.
      valueSemantics:
        REDUCE: Lower the likelihood or impact, usually through controls.
        AVOID: Stop the activity that creates the risk.
        TRANSFER: Pass the risk to another party, such as an insurer.
        ACCEPT: Bear the risk knowingly.
  - name: actionPlan
    type: text
    required: false
    help:
      summary: The actions that make up the treatment.
      usage: Written by the owner; progress is reported against it.
      relationshipContext: Specific enough to judge when it is done.
  - name: dueDate
    type: date
    required: false
    help:
      summary: When the treatment should be complete.
      usage: Overdue treatments are reported.
      relationshipContext: Agreed with the risk owner.
  - name: estimatedCost
    type: Money
    required: false
    help:
      summary: What the treatment is expected to cost.
      usage: Weighed against the reduction in risk.
      relationshipContext: In the company currency.
  - name: targetRating
    type: enum
    required: false
    values: [LOW, MEDIUM, HIGH]
    help:
      summary: The residual rating the treatment should bring the risk to.
      usage: Compared with the reassessment after completion.
      relationshipContext: From the same rating scale as risk assessments.
      valueSemantics:
        LOW: Accepted; monitored routinely.
        MEDIUM: Accepted with monitoring by the owner.
        HIGH: Still needs treatment and management attention.
  - name: completedDate
    type: date
    required: false
    help:
      summary: When the treatment was completed.
      usage: Recorded by the owner.
      relationshipContext: Present once completed.
  relationships:
  - name: risk
    target: Risk
    cardinality: '1'
    ownership: reference
    help:
      summary: The risk treated.
      usage: Chosen when planning the treatment.
      cardinalityMeaning: Every treatment is of exactly one risk.
      context: Listed among the risk's treatments.
  - name: owner
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who is responsible for carrying the treatment out.
      usage: Agreed when planning it.
      cardinalityMeaning: One per treatment.
      context: Reports progress in risk reviews.
  - name: control
    target: Control
    cardinality: 0..1
    ownership: reference
    help:
      summary: The control the treatment introduces or strengthens.
      usage: Linked for reduce treatments that work through a control.
      cardinalityMeaning: At most one.
      context: The control's testing shows whether the treatment worked.
  invariants:
  - {id: RISK-TREATMENT-001, rule: A completed treatment records when it was completed., violatedWhen: status == "COMPLETED" and completed_date == null, message: Record when the treatment was completed.}
  - {id: RISK-TREATMENT-EXE-001, rule: "Estimated Cost cannot be negative.", violatedWhen: "estimated_cost != null and estimated_cost < 0", message: "Estimated Cost cannot be negative."}
  lifecycle:
    title: Risk Treatment Lifecycle
    attribute: status
    states: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a risk treatment is ended"
      description: "When a risk treatment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RISK-TREATMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on risk treatment {{title}}"
              description: "Risk treatment {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: What is being done about a risk, by whom and by when.
    businessMeaning: Identifying risks is useless unless something is done about those outside appetite. A treatment records the chosen response — reduce, avoid, transfer or accept — the actions, who owns them, when they are due, what they cost and the risk level they are meant to achieve, so management can follow them to completion and check they worked.
    usage: Risk owners plan treatments for risks rated above appetite; progress is reported in risk reviews; completed treatments lead to reassessment of the risk.
    relationshipContext: A treatment belongs to one Risk and is listed among its treatments. It may introduce or strengthen a Control.
    lifecycle: Planned, in progress, and completed; one overtaken by events is cancelled. Treatments past their due date are reported as overdue.
    workflowContext: Risk response planning, risk reviews, control improvement.
    example: "Treatment RT-2024-011 for risk R-031 'Single-source supplier for motors': reduce — qualify a second supplier; owner the category manager; due 30 September; cost 25,000 EUR; target residual rating medium."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RISK-TREATMENT
