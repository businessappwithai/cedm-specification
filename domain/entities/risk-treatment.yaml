entity:
  name: RiskTreatment
  namespace: cedm.domain
  kind: risk_management_entity
  description: A governed treatment or response planned and executed to modify, accept, transfer, avoid, or monitor a Risk.
  ui:
    icon: alert-triangle
  identity:
    key: riskTreatmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: riskTreatmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the treatment, constant for its life.
        usage: Generated on creation; reviews refer to it.
        relationshipContext: Connects this record to its governing Risk context and downstream evidence.
    - name: riskTreatmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: The code of the treatment, such as RT-021-1.
        usage: Unique; quoted in risk reviews and audit.
        relationshipContext: Read with the risk code.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: How far the planned action on the risk has progressed.
        usage: Starts as DRAFT and is moved by the treatment owner; only approved, active treatments are counted when residual risk is assessed.
        valueSemantics:
          DRAFT: Proposed and not yet approved by the risk owner.
          ACTIVE: Approved and the work is being carried out.
          COMPLETED: The action has been done and its effect can be assessed. A final state.
          CANCELLED: No longer needed or abandoned before completion. A final state.
        relationshipContext: Status changes can affect related Risk workflows but never erase historical evidence.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: A one-line statement of the action that will be taken to respond to the risk.
        usage: Shown in risk reports and treatment lists so managers can scan what is planned.
        relationshipContext: Identifies the treatment for people, beside its code.
    - name: strategy
      type: enum
      required: true
      default: REDUCE
      values:
        - REDUCE
        - AVOID
        - TRANSFER
        - ACCEPT
      help:
        summary: The broad approach chosen for dealing with the risk.
        usage: Chosen when the treatment is planned and used to group treatments in risk reports.
        relationshipContext: Accepting a risk needs approval at the right level.
        valueSemantics:
          REDUCE: Lower the likelihood or impact, usually through controls.
          AVOID: Stop the activity that creates the risk.
          TRANSFER: Pass the risk to another party, such as an insurer.
          ACCEPT: Bear the risk knowingly.
    - name: actionPlan
      type: text
      required: false
      help:
        summary: The actions that make up the treatment.
        usage: Written by the owner; progress is reported against it.
        relationshipContext: Specific enough to judge when it is done.
    - name: dueDate
      type: date
      required: false
      help:
        summary: The date by which the agreed action should be finished.
        usage: Agreed with the risk owner when planning; treatments past this date are reported as overdue.
        relationshipContext: Not earlier than the day the treatment was planned.
    - name: estimatedCost
      type: Money
      required: false
      help:
        summary: The money the organisation expects to spend carrying out the treatment.
        usage: Weighed against the reduction in risk to decide whether the treatment is worth doing.
        relationshipContext: In the company currency.
    - name: targetRating
      type: enum
      required: false
      values:
        - LOW
        - MEDIUM
        - HIGH
      help:
        valueSemantics:
          LOW: Accepted, with routine monitoring only.
          MEDIUM: Accepted with monitoring by the owner.
          HIGH: Still needs treatment and management attention.
        summary: The residual rating the treatment should bring the risk to.
        usage: Compared with the reassessment after completion.
        relationshipContext: From the same rating scale as risk assessments.
    - name: completedDate
      type: date
      required: false
      help:
        summary: The day the treatment was actually finished.
        usage: Recorded by the owner when the work is done, and compared with the due date.
        relationshipContext: Present once completed.
  relationships:
    - name: context
      target: Risk
      cardinality: '1'
      ownership: reference
      help:
        summary: The risk the treatment responds to.
        usage: Chosen when the treatment is created.
        cardinalityMeaning: Exactly one risk; a treatment for two risks is recorded twice.
        context: Keeps the response attached to the risk it addresses.
    - name: risk
      target: Risk
      cardinality: "1"
      ownership: reference
      help:
        summary: The risk treated.
        usage: Chosen when planning the treatment.
        cardinalityMeaning: Every treatment is of exactly one risk.
        context: Listed among the risk's treatments.
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: Who is responsible for carrying the treatment out.
        usage: Agreed when planning it.
        cardinalityMeaning: One per treatment.
        context: Reports progress in risk reviews.
    - name: control
      target: Control
      cardinality: 0..1
      ownership: reference
      help:
        summary: The control the treatment introduces or strengthens.
        usage: Linked for reduce treatments that work through a control.
        cardinalityMeaning: At most one.
        context: The control's testing shows whether the treatment worked.
  invariants:
    - id: RISK-TREATMENT-001
      rule: The governing Risk relationship is required and must reference a valid record.
    - id: RISK-TREATMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: RISK-TREATMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
    - {id: RISK-TREATMENT-EXE-001, rule: "Estimated Cost cannot be negative.", violatedWhen: "estimated_cost != null and estimated_cost < 0", message: "Estimated Cost cannot be negative."}
  lifecycle:
    title: Risk Treatment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a risk treatment is ended"
      description: "When a risk treatment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RISK-TREATMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on risk treatment {{id}}"
              description: "Risk treatment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An action planned and carried out to reduce, accept, transfer, avoid or monitor a risk.
    businessMeaning: A treatment is how the organisation responds to a risk it has assessed. Recording it with an owner and a status shows that each risk has an answer, what that answer is and whether it has been done.
    usage: Raised by the risk owner; carried out by the named people; read by governance and audit.
    relationshipContext: A treatment belongs to exactly one risk and goes with it.
    lifecycle: A treatment is drafted, active while the work is done and completed when finished. It may be cancelled if no longer needed. Completed and cancelled are final.
    example: To treat the supplier concentration risk, qualify a second source by 30 June.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RISK-TREATMENT
