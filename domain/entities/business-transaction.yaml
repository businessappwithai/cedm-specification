entity:
  name: BusinessTransaction
  namespace: cedm.domain
  kind: core_business_transaction
  description: A recorded business event or transaction that changes, commits, or represents a business state or obligation.
  ui:
    icon: file-text
  identity:
    key: transactionId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: transactionId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the transaction.
        usage: Generated on creation; documents, postings and reversals refer to the transaction through it.
    - name: transactionNumber
      type: string
      required: true
      maxLength: 100
      help:
        summary: The number under which the transaction is known to users and partners.
        usage: Allocated from a number series for its type; unique within the owning context and transaction type, and quoted on documents.
    - name: transactionType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of transaction, such as SALE, PURCHASE, TRANSFER or ADJUSTMENT.
        usage: Chosen when the transaction is created; decides numbering, approval rules and how posting treats the amount.
    - name: transactionDate
      type: datetime
      required: true
      help:
        summary: The business date and time of the transaction.
        usage: Entered or defaulted to now; used for period assignment, reporting and the order of events.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - OPEN
        - APPROVED
        - POSTED
        - COMPLETED
        - CANCELLED
        - REVERSED
      help:
        summary: How far the transaction has progressed from draft to completion.
        usage: Moved by the business process as steps are performed; posted transactions are no longer changed.
        valueSemantics:
          DRAFT: Being entered; nothing is committed.
          OPEN: Submitted and awaiting approval.
          APPROVED: Authorised but not yet posted.
          POSTED: Recorded in the books; it can now only be reversed, not edited.
          COMPLETED: Fully performed and closed out.
          CANCELLED: Withdrawn before being posted; no effect on the books.
          REVERSED: Posted and then undone by a reversing transaction; the original stays on record.
    - name: currencyId
      type: reference
      target: Currency
      required: false
      help:
        summary: The currency in which the transaction's amounts are expressed.
        usage: Set when the transaction is created; the total and any line amounts are in this currency.
    - name: totalAmount
      type: decimal
      required: false
      precision: 20
      scale: 4
      help:
        summary: The total value of the transaction in its currency.
        usage: Calculated from its lines or entered; non-negative unless the transaction type explicitly allows signed amounts.
    - name: referenceNumber
      type: string
      required: false
      maxLength: 200
      help:
        summary: An external reference for the transaction, such as a customer's purchase order number.
        usage: Entered to link the transaction to a partner's document; used for search and reconciliation.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the transaction record was created.
        usage: Set by the system and never edited; part of the audit trail.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the transaction record was last changed.
        usage: Set by the system on every change; used to detect recent activity and in synchronisation.
  relationships:
    - name: organization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation on whose behalf the transaction is made.
        usage: Set when the transaction is created; scopes numbering, approvals and ledger postings.
        cardinalityMeaning: At most one organisation; when none is given the transaction belongs to the default business context.
        workflowRole: Determines whose books and permissions apply.
    - name: parties
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The parties involved, such as customer, supplier or counterparty.
        usage: Added as the transaction is entered; read to show who the transaction concerns.
        cardinalityMeaning: Any number, including none for an internal transaction.
        workflowRole: Gives each party a view of the transactions they take part in.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      help:
        summary: The products, goods or services the transaction concerns.
        usage: Added from the catalogue as the transaction is entered.
        cardinalityMeaning: Any number; some transactions, such as payments, involve no products.
        workflowRole: Connects the transaction to what was bought, sold or moved.
    - name: document
      target: Document
      cardinality: 0..1
      ownership: reference
      help:
        summary: The document that evidences the transaction, such as an order form or invoice.
        usage: Attached when the paper or electronic evidence exists.
        cardinalityMeaning: At most one primary document.
        workflowRole: Gives auditors the source evidence.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place at which the transaction occurred or applies.
        usage: Set when location matters for tax, stock or reporting.
        cardinalityMeaning: At most one location.
        workflowRole: Drives location-specific rules such as tax and inventory.
  invariants:
    - id: TRANSACTION-001
      rule: transactionNumber must be unique within the owning ERP/business context and transactionType.
    - id: TRANSACTION-002
      rule: POSTED transactions must not be mutated except through an explicit reversal or correction process.
    - id: TRANSACTION-003
      rule: totalAmount must be non-negative unless the transaction type explicitly permits signed amounts.
    - {id: BUSINESS-TRANSACTION-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Business Transaction Lifecycle
    attribute: status
    states: [DRAFT, OPEN, APPROVED, POSTED, COMPLETED, CANCELLED, REVERSED]
    initial: DRAFT
    terminal:
      - CANCELLED
      - REVERSED
    transitions:
      - {from: DRAFT, to: OPEN, action: open}
      - {from: OPEN, to: APPROVED, action: approve}
      - {from: APPROVED, to: POSTED, action: post}
      - {from: POSTED, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: OPEN, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: POSTED, to: REVERSED, action: reverse}
      - {from: COMPLETED, to: REVERSED, action: reverse}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a business transaction is ended"
      description: "When a business transaction is cancelled or reversed, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "BUSINESS-TRANSACTION-FOLLOW-UP-{{id}}"
              name: "Follow up on business transaction {{transaction_number}}"
              description: "Business transaction {{transaction_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a business transaction is done"
      description: "When a business transaction is completed or posted, a task asks someone to confirm the outcome."
      when: "(status == \"COMPLETED\" or status == \"POSTED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "BUSINESS-TRANSACTION-COMPLETED-{{id}}"
              name: "Confirm business transaction {{transaction_number}}"
              description: "Business transaction {{transaction_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A recorded business transaction that commits, changes or represents a business state or obligation, in a form common to every domain.
    businessMeaning: 'Many different activities, such as sales, purchases, transfers and adjustments, share the same bones: a number, a date, an amount, the parties and products involved, and a status. This record carries those common facts so they can be reported, audited and reversed uniformly.'
    usage: Created when a business transaction is entered or generated by a process; moved through approval and posting; read for history, exposure and reporting.
    relationshipContext: A transaction belongs to an Organization, involves Parties and Products, may be evidenced by a Document and may take place at a Location; its amounts are in one Currency.
    lifecycle: 'A transaction is drafted, opened, approved and posted, and finally completed. It can be cancelled before it is posted. Once posted it is never edited: an error is corrected by reversing it and entering a new one.'
    example: Transaction SO-20413, a sale of 40 units to a retailer, approved on Monday, posted to the ledger on Tuesday and completed when delivery was confirmed.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BUSINESS-TRANSACTION
