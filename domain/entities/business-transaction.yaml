entity:
  name: BusinessTransaction
  namespace: cedm.domain
  kind: core_business_transaction
  description: A recorded business event or transaction that changes, commits, or represents a business state or obligation.
  ui:
    icon: file-text
    recordLabel: [transactionNumber]
  identity:
    key: transactionId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: transactionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the business transaction record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a business transaction store this identifier. The number or code people quote is a separate field.
  - name: transactionNumber
    type: string
    required: true
    maxLength: 100
    help:
      summary: The reference of the transaction.
      usage: Quoted on documents and in reports.
      relationshipContext: Unique within its transaction type.
  - name: transactionType
    type: string
    required: true
    maxLength: 100
    help:
      summary: What kind of transaction it is, such as "Internal recharge" or "Booking".
      usage: Decides which rules and approvals apply.
      relationshipContext: From the business's list of transaction types.
  - name: transactionDate
    type: datetime
    required: true
    help:
      summary: When the transaction took place.
      usage: Decides the period it belongs to.
      relationshipContext: Not in the future for posted transactions.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - OPEN
    - APPROVED
    - POSTED
    - COMPLETED
    - CANCELLED
    - REVERSED
    help:
      summary: Where the transaction stands.
      usage: Moved on by approval and posting.
      relationshipContext: Posted transactions are corrected only by reversal.
      valueSemantics:
        DRAFT: Being prepared.
        OPEN: Submitted for processing.
        APPROVED: Approved; ready to post.
        POSTED: Recorded in the books.
        COMPLETED: All follow-up work done.
        CANCELLED: Withdrawn before posting.
        REVERSED: Undone by an opposite transaction.
  - name: currencyId
    type: reference
    target: Currency
    required: false
    help:
      summary: The currency of the transaction's amounts.
      usage: Set when the transaction is created.
      relationshipContext: Converted to the company currency on posting.
  - name: totalAmount
    type: decimal
    required: false
    precision: 20
    scale: 4
    help:
      summary: The total value of the transaction.
      usage: Summed from its detail or entered.
      relationshipContext: Not negative unless the type allows it.
  - name: referenceNumber
    type: string
    required: false
    maxLength: 200
    help:
      summary: An outside reference, such as the counterparty's document number.
      usage: Quoted when talking to the counterparty.
      relationshipContext: Optional.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BusinessTransaction records, where applicable.
      relationshipContext: Its meaning is specific to BusinessTransaction; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording the latest modification of the record. It supports synchronization, audit, and change detection.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BusinessTransaction records, where applicable.
      relationshipContext: Its meaning is specific to BusinessTransaction; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  relationships:
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The company the transaction belongs to.
      usage: Set when the transaction is created.
      cardinalityMeaning: At most one.
      context: It is posted in this company's books.
  - name: parties
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties involved in the transaction.
      usage: Added when the transaction is recorded.
      cardinalityMeaning: Many parties per transaction; a party takes part in many transactions.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    help:
      summary: The products the transaction concerns.
      usage: Added when the transaction is recorded.
      cardinalityMeaning: Many products per transaction; a product appears in many transactions.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: document
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: The document that evidences the transaction.
      usage: Linked when one exists.
      cardinalityMeaning: At most one.
      context: The document is the authoritative record.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Where the transaction took place.
      usage: Set when relevant.
      cardinalityMeaning: At most one.
      context: Used in reports by site.
  invariants:
  - id: TRANSACTION-001
    rule: transactionNumber must be unique within the owning ERP/business context and transactionType.
  - id: TRANSACTION-002
    rule: POSTED transactions must not be mutated except through an explicit reversal or correction process.
  - id: TRANSACTION-003
    rule: totalAmount must be non-negative unless the transaction type explicitly permits signed amounts.
  - {id: BUSINESS-TRANSACTION-EXE-001, rule: "Total Amount cannot be negative.", violatedWhen: "total_amount != null and total_amount < 0", message: "Total Amount cannot be negative."}
  lifecycle:
    title: Business Transaction Lifecycle
    attribute: status
    states: [DRAFT, OPEN, APPROVED, POSTED, COMPLETED, CANCELLED, REVERSED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED, REVERSED]
    transitions:
    - {from: DRAFT, to: OPEN, action: open}
    - {from: OPEN, to: APPROVED, action: approve}
    - {from: APPROVED, to: POSTED, action: post}
    - {from: POSTED, to: COMPLETED, action: complete}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: OPEN, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: POSTED, to: CANCELLED, action: cancel}
    - {from: POSTED, to: REVERSED, action: reverse}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a business transaction is ended"
    description: "When a business transaction is cancelled or reversed, a task asks someone to settle what depended on it."
    when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "BUSINESS-TRANSACTION-FOLLOW-UP-{{id}}"
          name: "Follow up on business transaction {{transaction_number}}"
          description: "Business transaction {{transaction_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a business transaction is done"
    description: "When a business transaction is completed or posted, a task asks someone to confirm the outcome."
    when: "(status == \"COMPLETED\" or status == \"POSTED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "BUSINESS-TRANSACTION-COMPLETED-{{id}}"
          name: "Confirm business transaction {{transaction_number}}"
          description: "Business transaction {{transaction_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents a core business transaction called BusinessTransaction within the CEDM business model.
    businessMeaning: BusinessTransaction is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Product, Document, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Raised by the business's processes for transactions that have no more specific record, and used as a common index of all business events across domains — so reports and audits can list everything that happened to a party, product or location in one place.
    lifecycle: Drafted, opened for processing, approved, posted to the books, and completed. A posted transaction is never edited; it is reversed by an opposite one. It may be cancelled before posting.
    example: Transaction BT-2024-118220, type 'Internal recharge', 4 June 2024, 12,400 EUR from IT to Plant Lyon, approved by the controller, posted 30 June.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BUSINESS-TRANSACTION
