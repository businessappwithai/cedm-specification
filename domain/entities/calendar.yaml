entity:
  name: Calendar
  namespace: cedm.domain
  kind: reference_data
  description: A working calendar — which days of the week are worked, which dates are holidays or closures, and in which time zone — used to compute due dates, lead times and delivery promises.
  ui:
    icon: calendar
    recordLabel: [code, name]
  identity: {key: calendarId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: calendarId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the calendar record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a calendar store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the calendar, such as FR or FR-LYON-PLANT.
      usage: Chosen when it is created; sites, countries and processes refer to it.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the calendar.
      usage: Shown wherever a calendar is chosen.
      relationshipContext: Identifies it for people.
  - name: workingDays
    type: string
    required: true
    maxLength: 50
    default: MON-FRI
    help:
      summary: The days of the normal working week, such as MON-FRI or MON-SAT.
      usage: Days outside it are non-working unless an exception says otherwise.
      relationshipContext: Exceptions override it for particular dates.
  - name: timeZone
    type: timezone
    required: false
    help:
      summary: The time zone of the calendar, such as Europe/Paris.
      usage: Decides when a day starts and ends for deadlines.
      relationshipContext: An IANA time-zone name.
  - name: validFrom
    type: date
    required: false
    help:
      summary: The first day the calendar applies.
      usage: Set when it is created.
      relationshipContext: Not later than the valid-to date.
  - name: validTo
    type: date
    required: false
    help:
      summary: The last day the calendar applies.
      usage: Set when it is replaced.
      relationshipContext: Empty while in use.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE]
    help:
      summary: Whether the calendar is in use.
      usage: Made inactive when replaced.
      relationshipContext: Inactive calendars are not offered.
      valueSemantics:
        ACTIVE: In use.
        INACTIVE: No longer used.
  relationships:
  - name: country
    target: Country
    cardinality: 0..1
    ownership: reference
    help:
      summary: The country whose public holidays the calendar holds.
      usage: Set for country calendars.
      cardinalityMeaning: At most one.
      context: Site calendars usually take their country's calendar as base.
  - name: baseCalendar
    target: Calendar
    cardinality: 0..1
    ownership: reference
    help:
      summary: The calendar whose exceptions this one also follows.
      usage: Set so a site calendar inherits the country's holidays.
      cardinalityMeaning: At most one base.
      context: Cannot be itself.
  - name: exceptions
    target: CalendarException
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The holidays, closures and extra working days of the calendar.
      usage: Added each year.
      cardinalityMeaning: Any number of exceptions.
      context: Each exception belongs to one calendar.
  invariants:
  - {id: CALENDAR-001, rule: 'A calendar cannot be based on itself, directly or through other calendars.'}
  - {id: CALENDAR-EXE-001, rule: "Valid To must not be earlier than valid from.", violatedWhen: "valid_from != null and valid_to != null and valid_to < valid_from", message: "Valid To cannot be earlier than valid from."}
  lifecycle:
    title: Calendar Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE]
    initial: ACTIVE
    terminal: []
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
  help:
    summary: The working days and holidays a country, site or team follows.
    businessMeaning: '"Ten working days" means different dates in different places. A calendar defines the normal working week and lists the exceptions — public holidays, plant shutdowns, extra Saturdays — so that due dates, delivery promises and service-level deadlines count the right days for the place they apply to."'
    usage: Administrators maintain a calendar per country or site each year, adding the holidays and closures; processes that count working days use the calendar of the site or country concerned.
    relationshipContext: A calendar may be for a Country (public holidays) or for an Organization's site; its exceptions are CalendarExceptions. A calendar can inherit the holidays of a base calendar, such as a plant calendar based on its country's.
    lifecycle: Active while in use; inactive once replaced.
    workflowContext: Due-date calculation, delivery promising, service-level clocks, shift and production planning.
    example: 'Calendar FR-LYON-PLANT: Monday–Friday, Europe/Paris, based on calendar FR (French public holidays), plus plant shutdown 5–16 August 2024.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-CALENDAR}
