entity:
  name: StateProvince
  namespace: cedm.domain
  kind: reference_data
  description: "A first-level division of a country — a state, province, region, territory or equivalent — from the ISO 3166-2 registry."
  ui:
    icon: map
  referenceData: reference-data/state-province.yaml
  identity: {key: stateProvinceId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: stateProvinceId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the state province record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a state province store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 10
    help:
      summary: The ISO 3166-2 code, such as US-CA or FR-ARA.
      usage: Stored on addresses that name the region.
      relationshipContext: Unique; begins with the country code.
  - name: name
    type: string
    required: true
    maxLength: 200
    help:
      summary: The official name of the region.
      usage: Shown in address forms.
      relationshipContext: From the standard.
  - name: subdivisionType
    type: string
    maxLength: 100
    required: false
    help:
      summary: What the country calls this level, such as State, Province or Region.
      usage: Lets forms label the field correctly for each country.
      relationshipContext: From the standard.
  relationships:
  - name: country
    target: Country
    cardinality: "1"
    ownership: reference
    help:
      summary: The country the region belongs to.
      usage: Taken from the standard.
      cardinalityMeaning: Every region belongs to exactly one country.
      context: Address forms list the regions of the chosen country.
  - name: cities
    target: City
    cardinality: "0..*"
    ownership: reference
    help:
      summary: The cities in the region.
      usage: Listed from the region.
      cardinalityMeaning: A region has any number of cities; each city is in one region.
      context: The city records its region.
  invariants:
  - {id: STATE-PROVINCE-001, rule: "A state or province belongs to exactly one country, and its code begins with that country's code."}
  help:
    summary: A state, province or region of a country, from ISO 3166-2.
    commonExamples: "A shipping address in a named city, state and country."
    businessMeaning: Addresses, taxes and regulations often depend on the region within a country. Keeping the official list of first-level divisions lets addresses name a region unambiguously and lets region-based rules be applied consistently.
    usage: The list comes from the ISO standard and is not edited by users; addresses choose their region from the country's list.
    relationshipContext: A region belongs to one Country and contains Cities. Addresses name their region.
    workflowContext: Address entry and validation, sales-tax determination, territory assignment.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-STATE-PROVINCE}
