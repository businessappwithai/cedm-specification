entity:
  name: ManufacturingWorkOrder
  namespace: cedm.domain
  kind: manufacturing_transaction
  description: A governed production order authorizing manufacture, assembly, processing, or transformation of a Product using controlled material and process definitions.
  ui:
    icon: shopping-cart
  identity: {key: manufacturingWorkOrderId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: manufacturingWorkOrderId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the manufacturing work order record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a manufacturing work order store this identifier. The number or code people quote is a separate field.
  - {name: orderNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: Human-facing production-order reference., businessMeaning: Operational identifier used across planning and shop-floor execution., usage: "Scheduling, material staging, production, quality, costing, and audit.", relationshipContext: Distinct from inventory transaction references.}}
  - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Authorized target output quantity., businessMeaning: Defines planned production magnitude., usage: "Material planning, capacity, completion and variance.", relationshipContext: Interpreted with output Product and UOM policy.}}
  - {name: plannedStart, type: datetime, required: false, help: {summary: Planned production start., businessMeaning: Scheduling expectation rather than execution evidence., usage: Capacity and material planning., relationshipContext: Actual events are recorded separately., optionalMeaning: Optional until scheduled.}}
  - {name: plannedEnd, type: datetime, required: false, help: {summary: Planned production completion., businessMeaning: Scheduling target for output availability., usage: "Capacity, promise and planning.", relationshipContext: Must not precede plannedStart., optionalMeaning: Optional until scheduled.}}
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED]
    help: {summary: Manufacturing order lifecycle state., businessMeaning: Controls authorization and execution eligibility., usage: "Planning, shop-floor control, inventory and costing.", relationshipContext: Posted execution evidence is not reversed by changing header status., valueSemantics: {PLANNED: Being planned and not executable., RELEASED: Authorized for governed execution., IN_PROGRESS: Execution has begun., COMPLETED: Production execution is materially complete pending closure where applicable., CLOSED: Reconciled and administratively closed., CANCELLED: Terminated before remaining execution.}}
  relationships:
  - {name: product, target: Product, cardinality: "1", ownership: reference, help: {summary: Product authorized as manufacturing output., businessMeaning: Defines what the work order produces., usage: "Planning, output receipt and genealogy.", cardinalityMeaning: Exactly one output Product., workflowRole: ProductionReceipt Product must reconcile.}}
  - {name: location, target: Location, cardinality: "0..1", ownership: reference, help: {summary: Primary production location., businessMeaning: Places execution within the operating network., usage: "Scheduling, staging and reporting.", cardinalityMeaning: Optional for distributed/virtual production., workflowRole: Constrains material and resource execution where applicable.}}
  - {name: project, target: Project, cardinality: 0..1, ownership: reference, help: {summary: Project funded or served by the production order., businessMeaning: Provides project cost/demand attribution., usage: Project manufacturing and costing., cardinalityMeaning: Optional outside project production., workflowRole: Execution costs may flow to project accounting.}}
  - {name: billOfMaterial, target: BillOfMaterial, cardinality: "0..1", ownership: reference, help: {summary: Effective material structure governing planned component demand., businessMeaning: Defines expected inputs., usage: "Material planning, issue validation, variance and genealogy.", cardinalityMeaning: Optional for processes without formal BOM., workflowRole: RELEASED work preserves the effective BOM version.}}
  - {name: routing, target: Routing, cardinality: "0..1", ownership: reference, help: {summary: Effective process definition governing production execution., businessMeaning: Defines ordered operations and resource expectations., usage: "Scheduling, execution, costing and audit.", cardinalityMeaning: Optional for simple production without formal routing., workflowRole: RELEASED work preserves the effective routing version.}}
  - {name: materialIssues, target: MaterialIssue, cardinality: "0..*", ownership: reference, help: {summary: Component-consumption transactions attributable to this order., businessMeaning: Records actual inputs separately from planned BOM demand., usage: "Inventory, costing, genealogy and variance.", cardinalityMeaning: Zero or many issues., workflowRole: Posted issues reduce inventory through InventoryMovement.}}
  - {name: productionReceipts, target: ProductionReceipt, cardinality: "0..*", ownership: reference, help: {summary: Accepted output receipts attributable to this order., businessMeaning: Records actual produced quantity entering controlled inventory., usage: "Completion, inventory, costing, genealogy and quality.", cardinalityMeaning: Partial production may create many receipts., workflowRole: Posted receipts increase inventory through InventoryMovement.}}
  - {name: scrapTransactions, target: Scrap, cardinality: "0..*", ownership: reference, help: {summary: Governed rejected or lost production quantities., businessMeaning: Separates scrap from accepted output and unexplained variance., usage: "Yield, costing, inventory, quality and continuous improvement.", cardinalityMeaning: Zero or many scrap events., workflowRole: Inventory-affecting scrap must reconcile to attributable InventoryMovement.}}
  invariants:
  - {id: MFG-WO-001, rule: plannedEnd must not precede plannedStart.}
  - {id: MFG-WO-002, rule: quantity must be greater than zero.}
  - {id: MFG-WO-003, rule: RELEASED work must preserve the effective BillOfMaterial and Routing versions used for execution and audit.}
  - {id: MFG-WO-004, rule: "MaterialIssue, ProductionReceipt and inventory-affecting Scrap postings must reconcile to this work order and be idempotent."}
  - {id: MFG-WO-005, rule: "COMPLETED or CLOSED requires governed reconciliation of planned quantity, accepted output, scrap, material consumption, required operations and quality gates."}
  - {id: MANUFACTURING-WORK-ORDER-EXE-001, rule: "Planned End must not be earlier than planned start.", violatedWhen: "planned_start != null and planned_end != null and planned_end < planned_start", message: "Planned End cannot be earlier than planned start."}
  - {id: MANUFACTURING-WORK-ORDER-EXE-002, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Manufacturing Work Order Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED]
    initial: PLANNED
    terminal: [CLOSED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RELEASED, action: release}
    - {from: RELEASED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: COMPLETED, to: CLOSED, action: close}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a manufacturing work order is ended"
    description: "When a manufacturing work order is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "MANUFACTURING-WORK-ORDER-FOLLOW-UP-{{id}}"
          name: "Follow up on manufacturing work order {{order_number}}"
          description: "Manufacturing work order {{order_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a manufacturing work order is done"
    description: "When a manufacturing work order is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "MANUFACTURING-WORK-ORDER-COMPLETED-{{id}}"
          name: "Confirm manufacturing work order {{order_number}}"
          description: "Manufacturing work order {{order_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Canonical CEDM production-order transaction.
    businessMeaning: ManufacturingWorkOrder authorizes production; BOM defines material expectations; Routing defines process expectations; execution transactions preserve actual material, output and scrap evidence.
    usage: MRP, scheduling, shop-floor execution, inventory, costing, quality, genealogy and project manufacturing.
    relationshipContext: Product is output; BOM and Routing are controlled definitions; MaterialIssue consumes inputs; ProductionReceipt accepts outputs; Scrap explains governed losses.
    lifecycle: Planned → released → in progress → completed → closed, with controlled cancellation.
    changePropagation: Release freezes effective definitions; execution updates inventory and genealogy; corrections use compensating evidence rather than rewriting posted history.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-MANUFACTURING-WORK-ORDER}
