entity:
  name: Payment
  namespace: cedm.domain
  kind: financial_transaction
  description: A financial settlement event in which money is received or disbursed to satisfy, partially satisfy, or advance one or more financial obligations.
  identity: {key: paymentId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: paymentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The immutable system identity of the payment transaction.
        usage: Used for bank reconciliation, payment allocation, accounting, audit, integration, and traceability.
        relationshipContext: It identifies the payment event independently of the payer, payee, invoices, bank instrument, or settlement status.
        requiredMeaning: Required because every financial movement must be uniquely traceable.
    - name: paymentNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The business-facing reference used to identify the payment transaction.
        usage: Used in remittance advice, bank reconciliation, accounting documents, customer or supplier communication, and payment inquiries.
        relationshipContext: It is distinct from paymentId and should remain stable when the payment progresses through posting or clearing.
        requiredMeaning: Required for operational and financial traceability.
    - name: paymentDate
      type: datetime
      required: true
      help:
        summary: The date and time at which the payment transaction is recognized as occurring for business processing.
        usage: Used for accounting periods, cash reporting, reconciliation, aging, settlement analysis, and bank matching.
        relationshipContext: It is the payment event date and should not be confused with invoiceDate, posting date, value date, or bank clearing date when those are separately modeled.
        requiredMeaning: Required because financial settlement requires a defined transaction time.
    - name: direction
      type: enum
      required: true
      values: [RECEIPT, DISBURSEMENT]
      help:
        summary: Identifies whether the organization receives or pays money in the payment transaction.
        usage: Determines cash-flow classification, accounting treatment, payer/payee interpretation, and reconciliation behavior.
        relationshipContext: Direction determines how payer and payee should be interpreted relative to the organization performing the accounting.
        valueSemantics:
          RECEIPT: Money is received by the organization or accounting entity from another party.
          DISBURSEMENT: Money is paid by the organization or accounting entity to another party.
        requiredMeaning: Required because the same monetary event cannot be interpreted correctly without knowing its direction.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, APPROVED, POSTED, CLEARED, VOID, REVERSED]
      help:
        summary: The accounting and settlement lifecycle state of the payment.
        usage: Controls authorization, posting, bank reconciliation, reversal, and reporting behavior.
        relationshipContext: Payment status describes the payment event itself; Invoice status describes the underlying claim and should not be inferred from payment status alone.
        valueSemantics:
          DRAFT: Payment details are being prepared and no final financial posting has occurred.
          APPROVED: The payment has passed the required authorization controls and is ready for posting or execution.
          POSTED: The payment has been recognized in the relevant accounting records.
          CLEARED: The payment has successfully cleared through the relevant financial settlement mechanism.
          VOID: The payment has been invalidated before it should affect the financial position according to accounting policy.
          REVERSED: A previously recognized payment has been counteracted by an authorized reversal transaction.
        requiredMeaning: Required because financial systems must distinguish planned, posted, settled, and invalidated movements.
    - name: amount
      type: decimal
      required: true
      precision: 20
      scale: 4
      help:
        summary: The monetary value transferred or recorded by the payment transaction.
        usage: Used for cash position, settlement, invoice allocation, accounting, reconciliation, and financial reporting.
        relationshipContext: The amount is the value of the payment event, not necessarily the amount of any single Invoice; one payment may settle multiple invoices and one invoice may receive multiple payments.
        requiredMeaning: Required because a payment without a monetary amount has no settlement meaning.
    - name: currencyId
      type: reference
      target: Currency
      required: true
      help:
        summary: Identifies the currency in which the payment amount is denominated.
        usage: Used for accounting, bank reconciliation, currency conversion, payment processing, and invoice settlement.
        relationshipContext: The currency must be considered when allocating the payment against invoices and when accounting for foreign-exchange differences.
        requiredMeaning: Required because the amount cannot be interpreted financially without its currency.
    - name: paymentMethod
      type: enum
      required: true
      values: [CASH, BANK_TRANSFER, CARD, CHEQUE, DIRECT_DEBIT, OTHER]
      help:
        summary: Identifies the mechanism through which the payment is physically or electronically settled.
        usage: Drives payment execution, reconciliation, clearing, instrument tracking, and treasury reporting.
        relationshipContext: Payment method describes how money moved; it does not identify the financial obligation being settled.
        valueSemantics:
          CASH: Physical currency is exchanged directly.
          BANK_TRANSFER: Funds are transferred through a banking or electronic transfer mechanism.
          CARD: Settlement occurs through a payment-card network or acquiring arrangement.
          CHEQUE: Settlement is initiated using a cheque instrument and may remain uncleared until processed.
          DIRECT_DEBIT: Funds are collected under an authorized debit arrangement initiated by the recipient.
          OTHER: A recognized payment mechanism exists that is outside the explicitly modeled methods.
        requiredMeaning: Required because settlement and reconciliation depend on the payment mechanism.
  relationships:
    - name: payer
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the party from whom money is provided for a payment receipt or to whom a payment may be attributed under a disbursement context.
        usage: Used for customer receipts, supplier refunds, third-party payments, compliance, reconciliation, and audit.
        cardinalityMeaning: Zero or one payer may be recorded when the originating party is unknown, aggregated, or represented outside the payment record.
        context: Payer is a Party rather than a duplicated customer or supplier record; the party's applicable role determines the business context.
    - name: payee
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the party receiving or designated to receive the payment.
        usage: Used for supplier payments, customer refunds, employee payments, tax payments, and financial reconciliation.
        cardinalityMeaning: Zero or one payee may be recorded when settlement routing is represented externally or at an aggregated level.
        context: Payee is a Party and may simultaneously have Customer, Supplier, Employee, or other roles in the wider CEDM model.
    - name: invoices
      target: Invoice
      cardinality: 0..*
      ownership: reference
      help:
        summary: Associates the payment with one or more invoices whose financial claims are being settled.
        usage: Used for accounts-receivable allocation, accounts-payable settlement, customer statements, supplier statements, and reconciliation.
        cardinalityMeaning: Zero or many invoices may be linked because a payment can be unapplied, advance payment, or allocated across multiple invoices.
        context: The relationship identifies settlement context but does not by itself determine allocation amounts; a detailed payment-allocation model may be required when one payment is split across invoices.
  invariants:
    - {id: PAYMENT-001, rule: amount must be greater than zero.}
    - {id: PAYMENT-002, rule: a REVERSED payment must identify the original payment or an explicit reversal relationship.}
    - {id: PAYMENT-003, rule: a CLEARED payment must have passed the applicable settlement or reconciliation control.}
  help:
    summary: Represents the movement or recognition of money used to settle financial obligations.
    businessMeaning: Payment is the settlement event, while Invoice is the claim being settled. Keeping these concepts separate allows partial payments, consolidated payments, advances, refunds, reversals, and multi-invoice settlement to be represented correctly.
    usage: Used by accounts receivable, accounts payable, treasury, banking integrations, cash management, reconciliation, accounting, collections, and supplier payment processes.
    relationshipContext: Payment connects Party participants, Currency, payment method, and optionally one or more Invoice claims. The amount belongs to the payment event; allocation to individual invoices should be represented explicitly when required for accurate reconciliation.
    lifecycle: A draft payment is prepared, approval authorizes it, posting recognizes it financially, clearing confirms settlement through the relevant mechanism, and void or reversal corrects an invalid or subsequently counteracted payment. These states must not be used to infer whether every associated invoice is fully paid.
    example: A company transfers 10,000 USD to a supplier to settle three outstanding invoices. One Payment records the transfer, its currency and method, and the supplier as payee. Allocation records determine how the 10,000 USD is distributed across the three Invoice balances.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PAYMENT}
