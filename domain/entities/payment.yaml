# CEDM Domain Entity: Payment
entity:
  name: Payment
  namespace: cedm.domain
  kind: financial_transaction
  description: A receipt or disbursement that settles, partially settles, or advances a financial obligation.
  identity: {key: paymentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: paymentId, type: uuid, required: true, immutable: true}
    - {name: paymentNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: paymentDate, type: datetime, required: true}
    - {name: direction, type: enum, required: true, values: [RECEIPT, DISBURSEMENT]}
    - {name: status, type: enum, required: true, default: DRAFT, values: [DRAFT, APPROVED, POSTED, CLEARED, VOID, REVERSED]}
    - {name: amount, type: decimal, required: true, precision: 20, scale: 4}
    - {name: currencyId, type: reference, target: Currency, required: true}
    - {name: paymentMethod, type: enum, required: true, values: [CASH, BANK_TRANSFER, CARD, CHEQUE, DIRECT_DEBIT, OTHER]}
  relationships:
    - {name: payer, target: Party, cardinality: "0..1", ownership: reference}
    - {name: payee, target: Party, cardinality: "0..1", ownership: reference}
    - {name: invoices, target: Invoice, cardinality: "0..*", ownership: reference}
  invariants:
    - {id: PAYMENT-001, rule: amount must be greater than zero.}
    - {id: PAYMENT-002, rule: a REVERSED payment must reference an original payment or reversal relationship.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PAYMENT}
