entity:
  name: Payment
  namespace: cedm.domain
  kind: financial_settlement_transaction
  description: A financial settlement event in which money is received or disbursed, with explicit monetary denomination, execution method, external clearing evidence, allocation to claims, accounting recognition, and controlled customer or supplier credit settlement linkage kept as separate business facts.
  ui:
    icon: credit-card
  identity: {key: paymentId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: paymentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the payment, separate from the bank's reference.
        usage: Generated on creation; allocations, ledger entries and bank matches refer to it.
        businessMeaning: "Identifies the financial movement independently of its business reference, allocations, bank evidence, accounting entries or credit settlement purpose."
        relationshipContext: Identity remains stable when allocations are reversed or a refund/settlement is associated with a credit note.
        workflowRole: "Root reference across preparation, authorization, posting, clearing and reversal."
    - name: paymentNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The number under which the payment is recorded and quoted.
        usage: Allocated from a number series; unique; shown on remittance advices and receipts.
        businessMeaning: "Reference communicated in remittance, statements, bank reconciliation and payment inquiries."
        relationshipContext: Distinct from paymentId and bank transaction identifiers.
        workflowRole: Correlates internal payment evidence with operational and external references.
    - name: paymentDate
      type: datetime
      required: true
      help: {summary: Timestamp at which the payment event is recognized by the business process., businessMeaning: Establishes internal settlement chronology., usage: "Accounting periods, cash reporting, reconciliation and settlement analysis.", relationshipContext: "Distinct from bank value date, clearing date, posting date, allocation date and credit-note date.", workflowRole: Provides event time for internal payment processing.}
    - name: direction
      type: enum
      required: true
      values:
        - RECEIPT
        - DISBURSEMENT
      help:
        summary: Whether money is coming in or going out.
        usage: Set when the payment is created; decides whose account is debited and credited.
        valueSemantics:
          RECEIPT: Money received from a payer.
          DISBURSEMENT: Money paid out to a payee.
        businessMeaning: Establishes cash-flow direction and payer/payee interpretation.
        relationshipContext: Customer refund and supplier-credit refund/settlement payments are DISBURSEMENT events and never rewrite original receipt payments.
        workflowRole: Determines cash-flow and settlement path.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - APPROVED
        - POSTED
        - CLEARED
        - VOID
        - REVERSED
      help:
        summary: How far the payment has progressed from preparation to clearing.
        usage: Moved by treasury and the bank reconciliation process.
        valueSemantics:
          DRAFT: Being prepared; no financial effect.
          APPROVED: Authorised but not yet recorded in the books.
          POSTED: Recorded in the ledger but not yet confirmed by the bank.
          CLEARED: Confirmed by bank evidence. A final state.
          VOID: Cancelled and of no effect. A final state.
          REVERSED: Cancelled after posting by a compensating entry. A final state.
        businessMeaning: Indicates authorization, internal recognition, external clearing, invalidation or reversal.
        relationshipContext: Independent of Invoice, CreditNote, SupplierCreditNote and BankTransaction statuses.
        workflowRole: APPROVED authorizes processing; POSTED recognizes internally; CLEARED confirms external evidence; VOID/REVERSED handle correction.
    - name: amount
      type: Money
      required: true
      help: {summary: Total monetary value of the payment event., businessMeaning: "Represents money received or disbursed, not the amount allocated to one claim or credit.", usage: "Cash position, allocation validation, accounting and reconciliation.", relationshipContext: "PaymentAllocation distributes receipt payments; a credit-settlement payment settles an explicit customer or supplier credit obligation.", workflowRole: Provides source monetary amount.}
    - name: currencyId
      type: reference
      target: Currency
      required: true
      immutableAfterPosting: true
      help:
        summary: The currency in which the payment amount is denominated, such as EUR or USD.
        usage: Chosen when the payment is created; used to pick exchange rates, validate allocations and reconcile to the bank account.
        businessMeaning: Defines interpretation of payment amount.
        relationshipContext: May differ from invoice or credit currency only with explicit ExchangeRate evidence.
        workflowRole: Establishes source currency.
    - name: paymentMethod
      type: enum
      required: true
      values:
        - CASH
        - BANK_TRANSFER
        - CARD
        - CHEQUE
        - DIRECT_DEBIT
        - OTHER
      help:
        summary: Describes how the money is physically moved, such as by bank transfer, card, cheque or cash.
        usage: Chosen when the payment is created; decides how it is processed, which fees apply and how it is reconciled.
        valueSemantics:
          CASH: Money is handed over in notes and coins and recorded against a cash box or till.
          BANK_TRANSFER: Funds move between bank accounts by credit transfer and are matched to a bank statement line.
          CARD: Payment is taken or made on a debit or credit card, normally through a processor that charges fees.
          CHEQUE: Payment is made by a paper cheque that is issued or banked and clears after a delay.
          DIRECT_DEBIT: Funds are collected from the payer's bank account under a standing mandate the payer has authorised.
          OTHER: Payment uses a method not listed here, with the detail held in the external reference.
        businessMeaning: Describes how money moves rather than which obligation it settles.
        relationshipContext: Refund or supplier-credit settlement method must satisfy applicable policy.
        workflowRole: Determines expected settlement evidence.
    - name: valueDate
      type: date
      required: false
      help: {summary: Economic effective date of funds under settlement convention., businessMeaning: Distinguishes economic cash availability from internal creation time., usage: "Cash forecasting, interest, reconciliation and accounting analysis.", relationshipContext: May differ from paymentDate and bank clearing timestamp., workflowRole: Provides settlement timing context.}
    - name: externalReference
      type: string
      required: false
      maxLength: 250
      help: {summary: "External remittance, bank, processor or instrument reference.", businessMeaning: Connects internal payment evidence to external settlement identifier., usage: "Bank reconciliation, remittance matching, gateway reconciliation and audit.", relationshipContext: Does not replace allocations or credit identities., workflowRole: Helps resolve external evidence.}
  relationships:
    - name: payer
      target: Party
      cardinality: 0..1
      ownership: reference
      help: {summary: Party providing money for a receipt or associated with a disbursement., businessMeaning: Identifies source-side party., usage: "Customer receipts, refunds, supplier settlements and audit.", cardinalityMeaning: Optional for aggregated/external settlement., workflowRole: Supplies party context.}
    - name: payee
      target: Party
      cardinality: 0..1
      ownership: reference
      help: {summary: Party receiving or designated to receive payment., businessMeaning: Identifies target-side party., usage: "Supplier payments, customer refunds, taxes and reconciliation.", cardinalityMeaning: Optional when routing is external., workflowRole: Supplies disbursement context.}
    - name: allocations
      target: PaymentAllocation
      cardinality: 0..*
      ownership: aggregate
      help: {summary: Explicit applications of this payment to financial claims., businessMeaning: Explains distribution of receipt payment among claims., usage: "Partial settlement, multi-invoice settlement, advances, overpayments, reversals and reallocation.", cardinalityMeaning: A payment may remain unapplied or be allocated across many claims., workflowRole: "Active allocations determine claim settlement; Payment.amount remains total event value."}
    - name: bankAccount
      target: BankAccount
      cardinality: 0..1
      ownership: reference
      help: {summary: Bank account through which payment is expected to be received or disbursed., businessMeaning: Connects payment to internal financial account., usage: "Treasury, cash management, execution and reconciliation.", cardinalityMeaning: Optional for cash or externally managed methods., workflowRole: Provides account context.}
    - name: bankTransactions
      target: BankTransaction
      cardinality: 0..*
      ownership: reference
      help: {summary: External bank transaction evidence associated with payment., businessMeaning: Represents financial-institution evidence rather than the internal Payment itself., usage: "Reconciliation, clearing, statements and investigation.", cardinalityMeaning: One Payment may correspond to multiple bank transactions., workflowRole: Reconciled evidence supports CLEARED status.}
    - name: journalEntries
      target: JournalEntry
      cardinality: 0..*
      ownership: reference
      help: {summary: Accounting recognition generated from payment., businessMeaning: Represents accounting consequences rather than cash movement or bank evidence., usage: "General ledger, settlement, fees, FX differences and reversal.", cardinalityMeaning: A payment may generate multiple entries., workflowRole: JournalEntry posting represents accounting recognition independently of bank clearing.}
    - name: creditNotes
      target: CreditNote
      cardinality: 0..*
      ownership: reference
      help: {summary: Customer credit notes for which this payment acts as refund settlement., businessMeaning: Links a DISBURSEMENT payment to financial adjustments it settles., usage: "Refund execution, reconciliation, statements and audit.", cardinalityMeaning: One payment may settle multiple credit-note refund obligations where policy permits., workflowRole: CreditNote.amountRefunded changes only through explicit refund workflow.}
    - name: supplierCreditNotes
      target: SupplierCreditNote
      cardinality: 0..*
      ownership: reference
      help: {summary: Supplier credit notes for which this payment represents an authorized supplier refund or other cash settlement of remaining credit., businessMeaning: Distinguishes cash returned by a supplier from non-cash application of SupplierCreditNote against payable invoices., usage: "Supplier settlement, refund reconciliation, treasury, statements and audit.", cardinalityMeaning: One payment may settle multiple supplier-credit refund obligations where policy permits., workflowRole: "A supplier-credit refund must be a RECEIPT to the organization and changes supplier-credit cash-settlement projections only through an explicit workflow; ordinary SupplierCreditNote application remains non-cash."}
    - {name: insuranceSettlements, target: Settlement, cardinality: "0..*", ownership: reference, help: {summary: Insurance claim settlements executed through this Payment., businessMeaning: Connects cash movement to governed claim-liability discharge., usage: "Claims payment, accounting reconciliation and audit.", cardinalityMeaning: Zero or many Settlements may be represented by a Payment under batching policy., workflowRole: "Payment amount, currency and beneficiary must reconcile to executed settlements."}}

    - {name: fuelTransactions, target: FuelTransaction, cardinality: "0..*", ownership: reference, help: {summary: Fleet fuel transactions settled through this Payment., businessMeaning: Connects cash movement to vehicle consumption evidence., usage: "Fleet-card reconciliation, accounting and audit.", cardinalityMeaning: Zero or many transactions under batching policy., workflowRole: Amount and currency must reconcile to linked fuel transactions.}}

  invariants:
    - {id: PAYMENT-001, rule: amount must be greater than zero.}
    - {id: PAYMENT-002, rule: Sum of active PaymentAllocation paymentAmount values must not exceed Payment.amount except under explicitly authorized over-allocation policy.}
    - {id: PAYMENT-003, rule: Cross-currency allocation or credit settlement must use approved ExchangeRate and preserve target amount and rounding evidence.}
    - {id: PAYMENT-004, rule: CLEARED requires reconciled external settlement evidence appropriate to payment method.}
    - {id: PAYMENT-005, rule: REVERSED payment preserves original identity and identifies authorized reversal relationship.}
    - {id: PAYMENT-006, rule: Reversing a Payment must not silently mutate historical PaymentAllocation or credit-settlement evidence; affected records require explicit reversal handling.}
    - {id: PAYMENT-007, rule: "Payment status must not directly set Invoice, CreditNote or SupplierCreditNote status; claim and credit settlement are determined from their respective evidence."}
    - {id: PAYMENT-008, rule: JournalEntry posting is not evidence that bank has cleared the Payment.}
    - {id: PAYMENT-009, rule: "Historical Payment amount, currency, date and method remain stable after posting except through authorized correction/reversal."}
    - {id: PAYMENT-010, rule: Payment linked to CreditNote as refund must be DISBURSEMENT and must not be reused as evidence for original customer receipt.}
    - {id: PAYMENT-011, rule: Payment linked to SupplierCreditNote as supplier refund must be RECEIPT to the organization and must not be treated as a SupplierCreditNoteApplication.}
    - {id: PAYMENT-012, rule: "SupplierCreditNote cash settlement and SupplierCreditNoteApplication are mutually distinct effects: one records money received from supplier, the other records non-cash reduction of payable exposure."}
    - {id: PAYMENT-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  lifecycle:
    title: Payment Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, POSTED, CLEARED, VOID, REVERSED]
    initial: DRAFT
    terminal: [CLEARED, VOID, REVERSED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: POSTED, action: post}
      - {from: POSTED, to: CLEARED, action: mark_cleared}
      - {from: DRAFT, to: VOID, action: void}
      - {from: APPROVED, to: VOID, action: void}
      - {from: POSTED, to: VOID, action: void}
      - {from: POSTED, to: REVERSED, action: reverse}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a payment is ended"
      description: "When a payment is void or reversed, a task asks someone to settle what depended on it."
      when: "(status == \"VOID\" or status == \"REVERSED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PAYMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on payment {{payment_number}}"
              description: "Payment {{payment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a payment is done"
      description: "When a payment is posted, a task asks someone to confirm the outcome."
      when: "status == \"POSTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PAYMENT-COMPLETED-{{id}}"
              name: "Confirm payment {{payment_number}}"
              description: "Payment {{payment_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Represents movement or recognition of money while keeping payment execution, claim settlement, bank evidence, accounting recognition, customer refunds and supplier-credit refunds as separate connected facts.
    businessMeaning: Payment is the settlement event. Invoice is the claim. PaymentAllocation applies receipt payments to claims. CreditNote is a customer financial adjustment. SupplierCreditNote is a supplier payable adjustment. A refund or settlement Payment is separate cash evidence.
    usage: Accounts receivable, accounts payable, treasury, banking integrations, cash management, reconciliation, collections, supplier payments, customer refunds and supplier-credit refunds.
    relationshipContext: Currency defines denomination. PaymentAllocation connects receipt Payments to claims. CreditNote connects customer refunds. SupplierCreditNote connects supplier-credit cash settlements when a supplier returns funds. BankTransaction confirms external settlement. JournalEntry records accounting consequences.
    workflowContext: "Receipt Payment → approval → posting → allocation → bank evidence → cleared. Customer credit: CreditNote posted → application or refund due → DISBURSEMENT Payment → bank reconciliation. Supplier credit: SupplierCreditNote posted → application against payable or supplier refund due → RECEIPT Payment from supplier → bank reconciliation. Original payment and credit histories remain immutable."
    lifecycle: Draft → approved → posted → cleared, with controlled void and reversal paths. Payment, Invoice, CreditNote, SupplierCreditNote, BankTransaction and JournalEntry retain independent lifecycle states because they represent different business facts.
    changePropagation: Changes to CreditNote or SupplierCreditNote settlement obligations require validation of linked payment eligibility. Payment reversal requires corresponding reversal of affected refund/settlement projections and accounting evidence; it must never rewrite the originating credit note.
    example: A supplier has a EUR 300 unapplied SupplierCreditNote. The supplier refunds EUR 300 rather than applying it to another invoice. A new RECEIPT Payment for EUR 300 is linked to the SupplierCreditNote and reconciled to bank evidence. The original supplier credit remains unchanged except for its controlled cash-settlement projection.
specification:
  version: 0.3.0
  status: draft
  identifier: CEDM-ENTITY-PAYMENT
