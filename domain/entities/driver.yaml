entity:
  name: Driver
  namespace: cedm.domain
  kind: transportation_driver_role
  description: A governed transportation role held by a Person who is authorized to operate Vehicles under applicable licensing, qualification, assignment and safety rules.
  ui: {icon: contact}
  identity: {key: driverId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: driverId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the Driver role., businessMeaning: Identifies one transportation operating role independently of Person identity., usage: "Fleet operations, dispatch, compliance, fuel and audit.", relationshipContext: Person supplies common identity while Driver supplies operating authorization context., requiredMeaning: Required.}}
    - {name: driverCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing driver reference., businessMeaning: Operational identifier for dispatch and integration., usage: "Search, scheduling, fuel and reporting.", relationshipContext: Distinct from license number and Person identifiers., requiredMeaning: Required.}}
    - {name: licenseNumber, type: string, required: false, maxLength: 160, help: {summary: Driver license or permit reference where applicable., businessMeaning: Supports operating eligibility and compliance., usage: "Fleet compliance, dispatch and audit.", relationshipContext: Jurisdiction/class/expiry may require additional governed attributes or documents., optionalMeaning: Optional where driving authorization is managed externally or not license-based.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
      help: {summary: Lifecycle state controlling ordinary driver assignment., businessMeaning: "Separates setup, active eligibility, temporary restriction, inactivity and retirement.", usage: "Dispatch, safety and compliance.", relationshipContext: Historical trips and fuel transactions retain Driver attribution., valueSemantics: {DRAFT: Role is being prepared., ACTIVE: Eligible for governed assignment., SUSPENDED: Temporarily restricted., INACTIVE: Not currently available., RETIRED: Closed to new assignment.}, requiredMeaning: Required.}
  relationships:
    - {name: person, target: Person, cardinality: "1", ownership: reference, help: {summary: Person holding the Driver role., businessMeaning: Reuses common identity without duplicating Person data., usage: "Dispatch, contact and audit.", cardinalityMeaning: Exactly one Person., workflowRole: Identity changes do not rewrite historical Driver evidence.}}
    - {name: vehicles, target: Vehicle, cardinality: "0..*", ownership: reference, help: {summary: Vehicles currently or historically associated with the Driver under assignment policy., businessMeaning: Supports fleet responsibility and utilization context., usage: "Dispatch, compliance and reporting.", cardinalityMeaning: Zero or many Vehicles., workflowRole: Vehicle/Driver eligibility must be validated at assignment time.}}
    - {name: fuelTransactions, target: FuelTransaction, cardinality: "0..*", ownership: reference, help: {summary: Fuel transactions attributed to this Driver., businessMeaning: Preserves who performed or authorized fuel activity., usage: "Fleet cost, fraud control and audit.", cardinalityMeaning: Zero or many transactions., workflowRole: Driver must be eligible at transaction time where policy requires.}}
  invariants:
    - {id: DRIVER-001, rule: "ACTIVE Driver must satisfy applicable licensing, qualification and safety eligibility policy."}
    - {id: DRIVER-002, rule: "Historical route, vehicle and fuel evidence must not be rewritten because Driver status later changes."}
  lifecycle:
    title: Driver Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents an authorized vehicle-operating role without duplicating Person identity.
    businessMeaning: Driver supplies fleet-operating eligibility and attribution; Person remains the shared identity.
    usage: Fleet management, dispatch, transportation, fuel management, compliance and audit.
    relationshipContext: Person is mandatory; Vehicles define assignments and FuelTransactions preserve operating-cost evidence.
    lifecycle: Driver becomes active, may suspend or become inactive, and retires while historical operations remain attributable.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-DRIVER}
