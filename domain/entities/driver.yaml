entity:
  name: Driver
  namespace: cedm.domain
  kind: transportation_driver_role
  description: A governed transportation role held by a Person who is authorized to operate Vehicles under applicable licensing, qualification, assignment and safety rules.
  ui: {icon: contact}
  identity: {key: driverId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: driverId, type: uuid, required: true, immutable: true, help: {summary: "The identity of the driver role, independent of the person's other roles.", businessMeaning: Identifies one transportation operating role independently of Person identity., usage: "Fleet operations, dispatch, compliance, fuel and audit.", relationshipContext: Person supplies common identity while Driver supplies operating authorization context.}}
    - {name: driverCode, type: string, required: true, unique: true, maxLength: 120, help: {summary: The driver's code in dispatch and fleet systems., businessMeaning: Operational identifier for dispatch and integration., usage: "Search, scheduling, fuel and reporting.", relationshipContext: Distinct from license number and Person identifiers.}}
    - {name: licenseNumber, type: string, required: false, maxLength: 160, help: {summary: The number of the driving licence that authorises the person to drive., usage: Entered from the licence document; checked against expiry and class., businessMeaning: Supports operating eligibility and compliance., relationshipContext: Jurisdiction/class/expiry may require additional governed attributes or documents.}}
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
      help:
        valueSemantics:
          DRAFT: Being onboarded; not yet cleared to drive.
          ACTIVE: Authorised and available for assignment.
          SUSPENDED: Temporarily barred, for example after an incident or lapsed qualification.
          INACTIVE: Not currently driving but may return.
          RETIRED: No longer a driver; kept for history.
        summary: Lifecycle state controlling ordinary driver assignment.
        businessMeaning: "Separates setup, active eligibility, temporary restriction, inactivity and retirement."
        usage: "Dispatch, safety and compliance."
        relationshipContext: Historical trips and fuel transactions retain Driver attribution.
  relationships:
    - {name: person, target: Person, cardinality: "1", ownership: reference, help: {summary: The person who holds the driver role., cardinalityMeaning: 'Exactly one person: the role is held by a specific individual.', businessMeaning: Reuses common identity without duplicating Person data., usage: "Dispatch, contact and audit.", workflowRole: Identity changes do not rewrite historical Driver evidence.}}
    - {name: vehicles, target: Vehicle, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: 'Any number of vehicles, over time or in parallel as assignments change.', summary: Vehicles currently or historically associated with the Driver under assignment policy., businessMeaning: Supports fleet responsibility and utilization context., usage: "Dispatch, compliance and reporting.", workflowRole: Vehicle/Driver eligibility must be validated at assignment time.}}
    - {name: fuelTransactions, target: FuelTransaction, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of fuel purchases made by the driver., summary: Fuel transactions attributed to this Driver., businessMeaning: Preserves who performed or authorized fuel activity., usage: "Fleet cost, fraud control and audit.", workflowRole: Driver must be eligible at transaction time where policy requires.}}
  invariants:
    - {id: DRIVER-001, rule: "ACTIVE Driver must satisfy applicable licensing, qualification and safety eligibility policy."}
    - {id: DRIVER-002, rule: "Historical route, vehicle and fuel evidence must not be rewritten because Driver status later changes."}
  lifecycle:
    title: Driver Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: Represents an authorized vehicle-operating role without duplicating Person identity.
    businessMeaning: Driver supplies fleet-operating eligibility and attribution; Person remains the shared identity.
    usage: Fleet management, dispatch, transportation, fuel management, compliance and audit.
    relationshipContext: Person is mandatory; Vehicles define assignments and FuelTransactions preserve operating-cost evidence.
    lifecycle: Driver becomes active, may suspend or become inactive, and retires while historical operations remain attributable.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-DRIVER}
