entity:
  name: InventoryMovement
  namespace: cedm.domain
  kind: inventory_transaction
  description: A traceable inventory event that changes, relocates, reserves, releases, receives, issues, returns, or corrects the quantity or availability of a Product at one or more InventoryLocations.
  identity:
    key: inventoryMovementId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: inventoryMovementId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The immutable identity of the inventory event.
      usage: Used for stock-ledger traceability, audit, reconciliation, integration, and investigation.
      relationshipContext: Identifies the event independently of Product, location, quantity, and originating transaction.
      workflowRole: Every posted receipt, issue, transfer, return, adjustment, reservation, and release uses this identity for audit and downstream balance reconciliation.
      requiredMeaning: Required because inventory history must be individually traceable.
  - name: movementNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The human-facing reference assigned to the inventory movement.
      usage: Used by warehouse operators, inventory controllers, auditors, and integrations.
      relationshipContext: It is distinct from Product identity and source transaction numbers.
      workflowRole: Used to trace a physical or logical stock change from execution through reconciliation.
      requiredMeaning: Required for operational and audit traceability.
  - name: movementType
    type: enum
    required: true
    values: [RECEIPT, ISSUE, TRANSFER, ADJUSTMENT, RETURN, RESERVATION, RELEASE]
    help:
      summary: Identifies the inventory operation and state transition caused by the event.
      usage: Determines how on-hand, reserved, available, and location balances change.
      relationshipContext: Movement type describes the inventory effect; relatedTransaction explains the broader business reason.
      workflowRole: Maps business workflow outcomes to the inventory ledger.
      valueSemantics:
        RECEIPT: Accepted inbound quantity becomes inventory at a target location after receiving controls.
        ISSUE: Quantity leaves available inventory for shipment, consumption, maintenance, production, or another authorized outbound use.
        TRANSFER: Quantity moves from one inventory location to another while remaining under inventory control.
        ADJUSTMENT: Recorded quantity is corrected through an approved reconciliation or investigation.
        RETURN: Previously issued or sold quantity returns to controlled inventory after authorization.
        RESERVATION: Quantity is committed to demand without physical movement; normally increases reserved and reduces available.
        RELEASE: A previous reservation is removed; normally reduces reserved and restores available.
      requiredMeaning: Required because inventory accounting depends on event semantics.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: The quantity affected by the inventory event.
      usage: Drives balance changes and allocation calculations.
      relationshipContext: Must be interpreted with Product, UnitOfMeasure, movementType, and source/target locations.
      workflowRole: For receipt/issue/transfer/return it changes physical quantity; for reservation/release it changes commitment state without physical movement.
      requiredMeaning: Required for every inventory event.
  - name: movementDate
    type: datetime
    required: true
    help:
      summary: The timestamp at which the inventory event is recognized for operational or accounting purposes.
      usage: Used for stock history, period-end balances, aging, reporting, audit, and reconciliation.
      relationshipContext: It is distinct from the source order date and record creation timestamp.
      workflowRole: Establishes the chronological point at which the inventory state transition is effective.
      requiredMeaning: Required for chronological inventory history.
  - name: reason
    type: string
    required: false
    maxLength: 500
    help:
      summary: The business explanation for the movement, particularly for adjustments, returns, exceptions, and controlled releases.
      usage: Supports audit, investigation, root-cause analysis, approval, and reporting.
      relationshipContext: Reason supplements movementType; it does not replace standardized classification.
      workflowRole: Especially important when no external transaction fully explains the event.
      optionalMeaning: Optional for routine movements with complete source context.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: Identifies the Product whose inventory state is affected.
      usage: Connects the event to product master data, units, specifications, and policies.
      cardinalityMeaning: Exactly one Product is affected by each movement.
      workflowRole: Receiving, issuing, transfer, return, and maintenance-consumption workflows use Product to identify the stock item.
  - name: sourceLocation
    target: InventoryLocation
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the location from which inventory is removed or transferred.
      usage: Used for transfer, issue, return-to-supplier, picking, and source reconciliation.
      cardinalityMeaning: Optional for inbound receipts originating outside the managed inventory network.
      workflowRole: Required when the movement physically or logically removes stock from an internal location.
  - name: targetLocation
    target: InventoryLocation
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the location into which inventory is received or transferred.
      usage: Used for receipts, put-away, transfers, returns, staging, and destination reconciliation.
      cardinalityMeaning: Optional for issues or movements leaving the managed inventory network.
      workflowRole: Required when the event creates or increases stock at an internal location.
  - name: party
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Identifies the party associated with the inventory event when ownership, custody, supplier, customer, or other responsibility matters.
      usage: Supports supplier receipts, customer returns, consignment, custody, and audit.
      cardinalityMeaning: Optional for internal movements.
      workflowRole: Connects inventory events to the business party when a workflow crosses organizational or commercial boundaries.
  - name: relatedTransaction
    target: BusinessTransaction
    cardinality: 0..1
    ownership: reference
    help:
      summary: Links the inventory event to the business transaction that caused or justified the stock change.
      usage: Provides traceability from stock movement back to purchasing, sales, maintenance, shipment, return, production, or adjustment processes.
      cardinalityMeaning: Optional for physical counts and internally generated reconciliation events.
      workflowRole: Provides the bridge between operational business workflows and the inventory ledger.
  invariants:
  - id: INVENTORY-MOVEMENT-001
    rule: quantity must be greater than zero.
  - id: INVENTORY-MOVEMENT-002
    rule: TRANSFER requires sourceLocation and targetLocation, and they must differ.
  - id: INVENTORY-MOVEMENT-003
    rule: RECEIPT requires targetLocation when inventory is location-managed.
  - id: INVENTORY-MOVEMENT-004
    rule: ISSUE requires sufficient available quantity unless an authorized negative-inventory policy applies.
  - id: INVENTORY-MOVEMENT-005
    rule: RELEASE must correspond to an existing reservation according to the applicable allocation policy.
  - id: INVENTORY-MOVEMENT-006
    rule: A posted inventory movement is immutable historical evidence; correction uses an authorized subsequent adjustment or reversal event.
  help:
    summary: Represents one auditable change to inventory state rather than the inventory balance itself.
    businessMeaning: InventoryMovement is the event ledger from which InventoryBalance is maintained. It records what changed, why, when, and where, while the originating workflow explains the business purpose.
    usage: Used by receiving, warehouse execution, procurement, order fulfillment, maintenance, returns, stock counting, planning, reconciliation, and analytics.
    relationshipContext: Product identifies what is stocked. InventoryLocation identifies where. InventoryBalance is current state. InventoryMovement is historical event evidence. PurchaseOrder/GoodsReceipt, SalesOrder/Shipment, MaintenanceWorkOrder, and other BusinessTransactions provide workflow context.
    workflowContext: Procurement normally produces GoodsReceipt → RECEIPT movement → InventoryBalance increase. Fulfillment produces reservation → RELEASE/ISSUE or shipment-related movement. Maintenance produces reservation → pick/ISSUE → consumption. Transfers create source reduction and target increase. Adjustments reconcile physical count differences.
    lifecycle: A movement is prepared, validated, posted, and then retained as immutable history. If an error is discovered, a compensating event or controlled reversal preserves the audit trail rather than rewriting the original event.
    example: Twenty spare parts accepted on a GoodsReceipt create a RECEIPT movement into RECEIVING-01. Put-away creates a TRANSFER to RACK-A-03-02. A maintenance work order reserves three, then an ISSUE movement removes three for consumption. The balance reflects these events while the movement history preserves the complete chronology.
specification:
  version: 0.2.0
  status: draft
  identifier: CEDM-ENTITY-INVENTORY-MOVEMENT
