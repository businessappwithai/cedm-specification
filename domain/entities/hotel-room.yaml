entity:
  name: HotelRoom
  namespace: cedm.domain
  kind: hospitality_asset
  description: An individual accommodation unit within a hotel.
  ui:
    icon: bed
  identity:
    key: hotelRoomId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelRoomId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the hotel room record associated with this HotelRoom. The identifier connects this record to the
        corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets reservations, housekeeping tasks and billing refer to exactly this room within the hotel."
  - name: roomNumber
    type: string
    required: true
    maxLength: 50
    help:
      summary: Captures the business meaning of room number for the HotelRoom. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The number on the door that guests, front desk and housekeeping use to find the room."
  - name: roomType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of room type for the HotelRoom. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The category of room, such as double, twin or suite, that guests book and that sets the rate charged."
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values:
    - AVAILABLE
    - OCCUPIED
    - RESERVED
    - CLEANING
    - OUT_OF_SERVICE
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        AVAILABLE: Represents the available state or classification in the context of HotelRoom.
        OCCUPIED: Represents the occupied state or classification in the context of HotelRoom.
        RESERVED: Represents the reserved state or classification in the context of HotelRoom.
        CLEANING: Represents the cleaning state or classification in the context of HotelRoom.
        OUT_OF_SERVICE: Represents the out of service state or classification in the context of HotelRoom.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells front desk whether the room can be sold right now or is occupied, reserved, being cleaned or out of service."
  - name: capacity
    type: integer
    required: true
    minimum: 1
    help:
      summary: Captures the business meaning of capacity for the HotelRoom. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The most guests the room can accommodate, which limits which bookings it can be assigned to."
  relationships:
  - name: hotel
    target: Hotel
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects HotelRoom to Hotel so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Hotel records associated with a HotelRoom.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: reservations
    target: HotelReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects HotelRoom to HotelReservation so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HotelReservation records associated with a HotelRoom.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Hotel Room Lifecycle
    attribute: status
    states: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
    initial: AVAILABLE
    transitions:
      - {from: AVAILABLE, to: OCCUPIED, action: mark_occupied}
      - {from: OCCUPIED, to: RESERVED, action: reserve}
      - {from: OCCUPIED, to: CLEANING, action: mark_cleaning}
      - {from: CLEANING, to: OCCUPIED, action: finish_cleaning}
      - {from: RESERVED, to: CLEANING, action: mark_cleaning}
      - {from: CLEANING, to: RESERVED, action: finish_cleaning}
      - {from: OCCUPIED, to: OUT_OF_SERVICE, action: mark_out_of_service}
      - {from: OUT_OF_SERVICE, to: OCCUPIED, action: return_to_service}
      - {from: RESERVED, to: OUT_OF_SERVICE, action: mark_out_of_service}
      - {from: OUT_OF_SERVICE, to: RESERVED, action: return_to_service}
  help:
    summary: "One bookable room in a hotel, with its room number, room type, how many guests it sleeps and whether it is currently free, occupied, being cleaned or out of service."
    businessMeaning: HotelRoom is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate HotelRoom records.
    relationshipContext: The entity participates in a wider business graph through relationships with Hotel, HotelReservation.
      These relationships provide the context needed to interpret the record rather than treating its fields as isolated database
      columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical HotelRoom record represents one identifiable business occurrence or master-data object that can be
      referenced by related CEDM processes.
    workflowContext: "Hotel management sets up each room once; reservations then assign guests to it, front desk marks it occupied at check-in, housekeeping moves it through cleaning after check-out, and maintenance takes it out of service and returns it when repaired."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-ROOM
