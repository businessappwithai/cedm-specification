entity:
  name: HotelRoom
  namespace: cedm.domain
  kind: hospitality_asset
  description: An individual accommodation unit within a hotel.
  ui:
    icon: bed
    recordLabel: [roomNumber, roomType]
  identity:
    key: hotelRoomId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelRoomId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the hotel room record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a hotel room store this identifier. The number or code people quote is a separate field.
  - name: roomNumber
    type: string
    required: true
    maxLength: 50
    help:
      summary: The number on the room door.
      usage: Used by guests and staff.
      relationshipContext: Unique within its hotel.
  - name: roomType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The category of room, such as single, double or suite.
      usage: Decides the rate and which reservations it can serve.
      relationshipContext: From the hotel's room types.
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values:
    - AVAILABLE
    - OCCUPIED
    - RESERVED
    - CLEANING
    - OUT_OF_SERVICE
    help:
      summary: The room's current housekeeping and occupancy state.
      usage: Updated by front desk and housekeeping.
      relationshipContext: Only available rooms are assigned to arrivals.
      valueSemantics:
        AVAILABLE: Clean and free.
        OCCUPIED: A guest is staying.
        RESERVED: Held for an arriving guest.
        CLEANING: Being cleaned after a stay.
        OUT_OF_SERVICE: Not usable, for repairs or other reasons.
  - name: capacity
    type: integer
    required: true
    minimum: 1
    help:
      summary: How many guests the room sleeps.
      usage: Checked against the reservation's guest count.
      relationshipContext: At least one.
  relationships:
  - name: hotel
    target: Hotel
    cardinality: '1'
    ownership: reference
    help:
      summary: The hotel the room is in.
      usage: Set when the room is registered.
      cardinalityMeaning: Each room is in one hotel.
      context: Room numbers are unique within it.
  - name: reservations
    target: HotelReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Reservations assigned to the room.
      usage: Shown in the room's booking calendar.
      cardinalityMeaning: Any number over time.
      context: Two reservations for one room must not overlap.
  lifecycle:
    title: Hotel Room Lifecycle
    attribute: status
    states: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
    initial: AVAILABLE
    terminal: []
    transitions:
    - {from: AVAILABLE, to: RESERVED, action: reserve}
    - {from: RESERVED, to: AVAILABLE, action: release}
    - {from: RESERVED, to: OCCUPIED, action: check_in}
    - {from: AVAILABLE, to: OCCUPIED, action: check_in}
    - {from: OCCUPIED, to: CLEANING, action: check_out}
    - {from: CLEANING, to: AVAILABLE, action: mark_clean}
    - {from: AVAILABLE, to: OUT_OF_SERVICE, action: take_out_of_service}
    - {from: CLEANING, to: OUT_OF_SERVICE, action: take_out_of_service}
    - {from: OUT_OF_SERVICE, to: AVAILABLE, action: return_to_service}
  help:
    summary: A room in a hotel that can be booked, with its type and capacity.
    relationshipContext: The entity participates in a wider business graph through relationships with Hotel, HotelReservation. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Front-desk and housekeeping staff see each room's state at a glance, assign rooms to reservations, mark them for cleaning after departure and take them out of service for repairs.
    lifecycle: A room is available, reserved for an arriving guest, occupied during a stay, then cleaned and made available again; it can be taken out of service and put back.
    example: Room 412, Hotel Lumière, deluxe double, capacity 2, being cleaned after check-out.
    businessMeaning: Room status decides which rooms can be sold and which need cleaning or repair.
  invariants:
  - {id: HOTEL-ROOM-001, rule: A room sleeps at least one guest., violatedWhen: capacity < 1, message: Capacity must be at least one.}
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-ROOM
