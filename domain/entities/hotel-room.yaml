entity:
  name: HotelRoom
  namespace: cedm.domain
  kind: hospitality_asset
  description: An individual accommodation unit within a hotel.
  ui:
    icon: bed
  identity:
    key: hotelRoomId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: hotelRoomId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the hotel room record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a hotel room store this identifier. The number or code people quote is a separate field.
  - name: roomNumber
    type: string
    required: true
    maxLength: 50
    help:
      summary: Captures the business meaning of room number for the HotelRoom. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: roomType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of room type for the HotelRoom. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values:
    - AVAILABLE
    - OCCUPIED
    - RESERVED
    - CLEANING
    - OUT_OF_SERVICE
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        AVAILABLE: Represents the available state or classification in the context of HotelRoom.
        OCCUPIED: Represents the occupied state or classification in the context of HotelRoom.
        RESERVED: Represents the reserved state or classification in the context of HotelRoom.
        CLEANING: Represents the cleaning state or classification in the context of HotelRoom.
        OUT_OF_SERVICE: Represents the out of service state or classification in the context of HotelRoom.
  - name: capacity
    type: integer
    required: true
    minimum: 1
    help:
      summary: Captures the business meaning of capacity for the HotelRoom. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating HotelRoom records, where applicable.
      relationshipContext: Its meaning is specific to HotelRoom; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  relationships:
  - name: hotel
    target: Hotel
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects HotelRoom to Hotel so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Hotel records associated with a HotelRoom.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: reservations
    target: HotelReservation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects HotelRoom to HotelReservation so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about HotelReservation records associated with a HotelRoom.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  lifecycle:
    title: Hotel Room Lifecycle
    attribute: status
    states: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]
    initial: AVAILABLE
    transitions:
    - {from: AVAILABLE, to: OCCUPIED, action: mark_occupied}
    - {from: OCCUPIED, to: RESERVED, action: reserve}
    - {from: OCCUPIED, to: CLEANING, action: mark_cleaning}
    - {from: CLEANING, to: OCCUPIED, action: finish_cleaning}
    - {from: RESERVED, to: CLEANING, action: mark_cleaning}
    - {from: CLEANING, to: RESERVED, action: finish_cleaning}
    - {from: OCCUPIED, to: OUT_OF_SERVICE, action: mark_out_of_service}
    - {from: OUT_OF_SERVICE, to: OCCUPIED, action: return_to_service}
    - {from: RESERVED, to: OUT_OF_SERVICE, action: mark_out_of_service}
    - {from: OUT_OF_SERVICE, to: RESERVED, action: return_to_service}
  help:
    summary: Represents a hospitality asset called HotelRoom within the CEDM business model.
    businessMeaning: HotelRoom is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate HotelRoom records.
    relationshipContext: The entity participates in a wider business graph through relationships with Hotel, HotelReservation. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical HotelRoom record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-HOTEL-ROOM
