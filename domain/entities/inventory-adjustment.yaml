entity:
  name: InventoryAdjustment
  namespace: cedm.domain
  kind: inventory_control_transaction
  description: A governed authorization to correct an evidenced inventory discrepancy, with actual quantity correction represented by attributable InventoryMovement adjustment events.
  ui:
    icon: boxes
  identity: {key: inventoryAdjustmentId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: inventoryAdjustmentId, type: uuid, required: true, immutable: true, help: {summary: The identity of the adjustment., usage: Generated on creation; the resulting movement refers to it., businessMeaning: Identifies one approved stock correction independently of ledger posting., relationshipContext: Groups adjustment evidence and movement.}}
    - {name: adjustmentNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: The document number of the adjustment., usage: Allocated from a number series; unique; used on approvals and audit reports., businessMeaning: Operational/audit identifier., relationshipContext: Distinct from movement number.}}
    - {name: quantityDelta, type: decimal, required: true, precision: 20, scale: 6, help: {summary: 'The change to the recorded quantity: positive to add stock, negative to remove it.', usage: Entered or derived from a count; posted as a movement when approved., businessMeaning: Positive increases and negative decreases the evidenced stock position., relationshipContext: Must be supported by reason and evidence.}}
    - {name: reasonCode, type: string, required: true, maxLength: 100, help: {summary: 'The reason for the correction, such as counting variance, damage or theft.', usage: Chosen from the organisation's list; reports analyse shrinkage by reason., businessMeaning: Explains why ledger stock differs from evidenced reality., relationshipContext: Must not be used to conceal ordinary receipts/issues.}}
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The product whose recorded quantity is corrected., usage: Set when the adjustment is created., cardinalityMeaning: 'Exactly one product: stock is corrected product by product.', workflowRole: Determines which stock balance is changed., businessMeaning: Identifies affected inventory item.}}
    - {name: inventoryLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: The stock location where the quantity is corrected., usage: Set when the adjustment is created., cardinalityMeaning: 'Exactly one location: the quantity belongs to a specific place.', workflowRole: Determines which location's balance is changed., businessMeaning: Defines physical/accountable stock context.}}
    - {name: inventoryCount, target: InventoryCount, cardinality: 0..1, ownership: reference, help: {summary: The count that revealed the discrepancy., usage: Linked where the adjustment follows from a physical count., cardinalityMeaning: At most one count; some adjustments arise from damage reports or investigations., workflowRole: Provides the evidence for the correction., businessMeaning: Connects observed discrepancy to adjustment.}}
    - {name: inventoryMovement, target: InventoryMovement, cardinality: '1', ownership: reference, help: {summary: The stock movement that carries out the correction., usage: Created when the adjustment is posted; read to trace the stock change to its authorisation., cardinalityMeaning: 'Exactly one movement: each approved adjustment is posted as a single movement.', workflowRole: Keeps the stock ledger complete and the adjustment accountable., businessMeaning: Implements approved quantity delta.}}
  invariants:
    - {id: INVENTORY-ADJUSTMENT-001, rule: quantityDelta must not be zero.}
    - {id: INVENTORY-ADJUSTMENT-002, rule: Every executed adjustment requires approved evidence and exactly one attributable inventory posting.}
    - {id: INVENTORY-ADJUSTMENT-003, rule: "Adjustment must not substitute for known receipt, issue, transfer, return or production transactions."}
    - {id: INVENTORY-ADJUSTMENT-004, rule: Posted correction is immutable; subsequent correction uses compensating adjustment.}
  help:
    summary: An authorised correction of an evidenced stock discrepancy, whose quantity change is carried out by a stock movement.
    businessMeaning: 'Stock records and shelves drift apart. An adjustment is the controlled way of putting them back in line: it states why, by how much and who approved it, and the actual change is posted as a movement so the stock ledger stays a complete history.'
    usage: Created after a count or investigation shows a discrepancy; approved; posted; read by warehouse management, finance and auditors.
    relationshipContext: An adjustment concerns one Product at one InventoryLocation, may arise from an InventoryCount, and results in an InventoryMovement.
    example: A count finds 38 units where the system shows 40; an adjustment of minus 2 with reason "counting variance" is approved and posted.
    lifecycle: Proposed → approved → posted → immutable historical evidence.
    changePropagation: Posting updates balances and variance analytics; corrections compensate rather than rewrite.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INVENTORY-ADJUSTMENT}
