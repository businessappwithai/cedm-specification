entity:
  name: Aircraft
  namespace: cedm.domain
  kind: aerospace_asset
  description: A powered or unpowered aircraft managed as an operational asset.
  ui:
    icon: database
  identity:
    key: aircraftId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aircraftId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the aircraft record associated with this Aircraft. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent internal handle for this aircraft, which stays the same even if the aircraft is re-registered, so work orders and history stay attached to the right airframe."
  - name: registrationNumber
    type: string
    required: true
    unique: true
    maxLength: 50
    help:
      summary: Captures the business meaning of registration number for the Aircraft. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The tail number issued by the aviation authority; operations, flight planning and regulators use it to identify the aircraft in day-to-day work and official records."
  - name: aircraftType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of aircraft type for the Aircraft. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The make and model of the aircraft, which decides which crews are qualified to fly it, which maintenance programme applies and which spare parts fit it."
  - name: serialNumber
    type: string
    required: false
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of serial number for the Aircraft. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The manufacturer's serial number of the airframe, which identifies the physical aircraft for warranty, airworthiness directives and ownership records regardless of its current registration."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - MAINTENANCE
    - GROUNDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Aircraft.
        ACTIVE: Represents the active state or classification in the context of Aircraft.
        MAINTENANCE: Represents the maintenance state or classification in the context of Aircraft.
        GROUNDED: Represents the grounded state or classification in the context of Aircraft.
        RETIRED: Represents the retired state or classification in the context of Aircraft.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells planners whether the aircraft can be scheduled: only ACTIVE aircraft fly, MAINTENANCE and GROUNDED aircraft are unavailable, PLANNED ones are not yet in service and RETIRED ones have left the fleet."
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Aircraft to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Aircraft to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: maintenanceWorkOrders
    target: MaintenanceWorkOrder
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Aircraft to MaintenanceWorkOrder so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MaintenanceWorkOrder records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Aircraft Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, GROUNDED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: GROUNDED, action: mark_grounded}
      - {from: GROUNDED, to: ACTIVE, action: return_to_service}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: MAINTENANCE, to: RETIRED, action: retire}
      - {from: GROUNDED, to: RETIRED, action: retire}
  help:
    summary: "One aircraft the organization operates or manages, tracked by registration, type and serial number so its availability, location and maintenance history can be controlled across its service life."
    businessMeaning: Aircraft is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Aircraft records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Location,
      MaintenanceWorkOrder. These relationships provide the context needed to interpret the record rather than treating its
      fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Aircraft record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Fleet planning registers the aircraft as PLANNED, operations activates it for service, maintenance planning moves it into MAINTENANCE and raises maintenance work orders, airworthiness control grounds it when it cannot fly, and fleet management finally retires it while keeping its history for audit."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AIRCRAFT
