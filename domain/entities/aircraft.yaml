entity:
  name: Aircraft
  namespace: cedm.domain
  kind: aerospace_asset
  description: A powered or unpowered aircraft managed as an operational asset.
  ui:
    icon: database
  identity:
    key: aircraftId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: aircraftId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the aircraft record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a aircraft store this identifier. The number or code people quote is a separate field.
  - name: registrationNumber
    type: string
    required: true
    unique: true
    maxLength: 50
    help:
      summary: Captures the business meaning of registration number for the Aircraft. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: aircraftType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of aircraft type for the Aircraft. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: serialNumber
    type: string
    required: false
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of serial number for the Aircraft. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PLANNED
    - ACTIVE
    - MAINTENANCE
    - GROUNDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Aircraft records, where applicable.
      relationshipContext: Its meaning is specific to Aircraft; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PLANNED: Represents the planned state or classification in the context of Aircraft.
        ACTIVE: Represents the active state or classification in the context of Aircraft.
        MAINTENANCE: Represents the maintenance state or classification in the context of Aircraft.
        GROUNDED: Represents the grounded state or classification in the context of Aircraft.
        RETIRED: Represents the retired state or classification in the context of Aircraft.
  relationships:
  - name: organization
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Aircraft to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Aircraft to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: maintenanceWorkOrders
    target: MaintenanceWorkOrder
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Aircraft to MaintenanceWorkOrder so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about MaintenanceWorkOrder records associated with a Aircraft.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    inverseCardinality: '1'
  lifecycle:
    title: Aircraft Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, GROUNDED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
    - {from: PLANNED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
    - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
    - {from: ACTIVE, to: GROUNDED, action: mark_grounded}
    - {from: GROUNDED, to: ACTIVE, action: return_to_service}
    - {from: PLANNED, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: MAINTENANCE, to: RETIRED, action: retire}
    - {from: GROUNDED, to: RETIRED, action: retire}
  help:
    summary: Represents a aerospace asset called Aircraft within the CEDM business model.
    businessMeaning: Aircraft is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Aircraft records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Location, MaintenanceWorkOrder. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Aircraft record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
