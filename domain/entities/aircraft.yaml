entity:
  name: Aircraft
  namespace: cedm.domain
  kind: aerospace_asset
  description: A powered or unpowered aircraft managed as an operational asset.
  ui:
    icon: database
  identity:
    key: aircraftId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: aircraftId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent system identity of the aircraft record.
        usage: Generated on creation; flights and work orders refer to the aircraft through it, so a re-registration does not break history.
    - name: registrationNumber
      type: string
      required: true
      unique: true
      maxLength: 50
      help:
        summary: The national registration (tail number) painted on the aircraft and listed in the aviation register.
        usage: Entered from registration documents; unique across the fleet and used by crews, air traffic and authorities to name the aircraft. It can change if the aircraft is re-registered.
    - name: aircraftType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The make and model of the aircraft, such as Airbus A320-214 or Cessna 172S.
        usage: Chosen from type data when the aircraft is added; decides crew qualifications, maintenance programmes and performance limits that apply.
    - name: serialNumber
      type: string
      required: false
      unique: true
      maxLength: 100
      help:
        summary: The manufacturer's serial number, which stays with the airframe for life.
        usage: Entered from the build documents; unlike the registration it never changes, so it is the safe way to trace an airframe across owners and registers.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - PLANNED
        - ACTIVE
        - MAINTENANCE
        - GROUNDED
        - RETIRED
      help:
        summary: Whether the aircraft is available to fly.
        usage: Updated by operations and maintenance control; scheduling may assign only ACTIVE aircraft.
        valueSemantics:
          PLANNED: Expected to join the fleet but not yet delivered or accepted.
          ACTIVE: In service and available for scheduling.
          MAINTENANCE: Out of service for scheduled or unscheduled maintenance.
          GROUNDED: Not permitted to fly pending an airworthiness issue, inspection or regulatory decision.
          RETIRED: Permanently removed from the fleet; the record is kept for history.
  relationships:
    - name: organization
      target: Organization
      cardinality: '1'
      ownership: reference
      help:
        summary: The organisation that operates this aircraft.
        usage: Set when the aircraft is added; determines whose fleet, rules and reporting the aircraft falls under.
        cardinalityMeaning: Exactly one operator at a time; every aircraft must belong to an organisation.
        workflowRole: Establishes accountability for airworthiness and scheduling.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Where the aircraft is currently based or parked.
        usage: Updated as the aircraft moves between airports and hangars; used for dispatch and maintenance planning.
        cardinalityMeaning: At most one current location, and empty while the position is unknown.
        workflowRole: Planners use it to decide which work can be done where.
    - name: maintenanceWorkOrders
      target: MaintenanceWorkOrder
      cardinality: 0..*
      ownership: reference
      help:
        summary: The maintenance work orders raised for this aircraft.
        usage: Read to see what is open, what is done and what is due; each order is created from this aircraft's maintenance programme or from a defect.
        cardinalityMeaning: Any number over the aircraft's life.
        workflowRole: Open work orders gate return to service.
  lifecycle:
    title: Aircraft Lifecycle
    attribute: status
    states: [PLANNED, ACTIVE, MAINTENANCE, GROUNDED, RETIRED]
    initial: PLANNED
    terminal: [RETIRED]
    transitions:
      - {from: PLANNED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: MAINTENANCE, action: mark_maintenance}
      - {from: MAINTENANCE, to: ACTIVE, action: return_to_service}
      - {from: ACTIVE, to: GROUNDED, action: mark_grounded}
      - {from: GROUNDED, to: ACTIVE, action: return_to_service}
      - {from: PLANNED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: MAINTENANCE, to: RETIRED, action: retire}
      - {from: GROUNDED, to: RETIRED, action: retire}
  help:
    summary: An aircraft, powered or unpowered, managed as an operational asset with its own registration, type, status and maintenance history.
    businessMeaning: For an operator, each aircraft is a high-value asset that must be airworthy, scheduled and maintained. This record is the aircraft's identity in the system, to which flights, maintenance and compliance evidence are attached.
    usage: Created when an aircraft is acquired or planned into the fleet; read by scheduling, maintenance planning and compliance, and updated as the aircraft changes status.
    relationshipContext: An aircraft belongs to an operating Organization, may be located at a Location, and is the subject of MaintenanceWorkOrders; together they show who is responsible, where it is and what work it needs.
    lifecycle: An aircraft is planned, becomes active in service, goes into maintenance or is grounded when it cannot fly, returns to service when released, and is retired when it leaves the fleet.
    example: Registration G-ABCD, an Airbus A320 serial 5421, is active with a Frankfurt-based airline and is in a scheduled C-check at its maintenance base.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-AIRCRAFT
