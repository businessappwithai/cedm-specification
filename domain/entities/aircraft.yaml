entity:
  name: Aircraft
  namespace: cedm.domain
  kind: aerospace_asset
  description: A powered or unpowered aircraft managed as an operational asset.
  identity: {key: aircraftId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: aircraftId, type: uuid, required: true, immutable: true}
    - {name: registrationNumber, type: string, required: true, unique: true, maxLength: 50}
    - {name: aircraftType, type: string, required: true, maxLength: 100}
    - {name: serialNumber, type: string, required: false, unique: true, maxLength: 100}
    - {name: status, type: enum, required: true, default: ACTIVE, values: [PLANNED, ACTIVE, MAINTENANCE, GROUNDED, RETIRED]}
  relationships:
    - {name: organization, target: Organization, cardinality: "1", ownership: reference}
    - {name: location, target: Location, cardinality: "0..1", ownership: reference}
    - {name: maintenanceWorkOrders, target: MaintenanceWorkOrder, cardinality: "0..*", ownership: reference}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-AIRCRAFT}
