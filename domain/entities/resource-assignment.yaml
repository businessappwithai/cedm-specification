entity:
  name: ResourceAssignment
  namespace: cedm.domain
  kind: project_transaction
  description: A governed assignment of a person, role, or resource to a Project with defined responsibility and allocation.
  ui:
    icon: file-text
  identity:
    key: resourceAssignmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: resourceAssignmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: Stable identity of the ResourceAssignment record.
        businessMeaning: Identifies one governed ResourceAssignment independently of related records and later lifecycle changes.
        usage: Referencing, workflow execution, reporting, audit, and integration.
        relationshipContext: Connects this record to its governing Project context and downstream evidence.
    - name: resourceAssignmentCode
      type: string
      required: true
      unique: true
      maxLength: 120
      help:
        summary: Human-readable business reference for the ResourceAssignment.
        businessMeaning: Provides an operational identifier for searching, documents, reports, and integrations.
        usage: Creation, review, search, workflow, reporting, and audit.
        relationshipContext: Distinct from the immutable UUID identity and scoped to the governed business context.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help:
        summary: Lifecycle state of the ResourceAssignment.
        businessMeaning: Controls whether the record is being prepared, operationally active, historically complete, or cancelled.
        usage: Workflow gating, governance, reporting, and audit.
        relationshipContext: Status changes can affect related Project workflows but never erase historical evidence.
        valueSemantics:
          DRAFT: Record is being prepared and is not yet normally effective.
          ACTIVE: Record is effective for its governed business purpose.
          COMPLETED: Governed work or assessment is complete and retained as historical evidence.
          CANCELLED: Record was cancelled through controlled workflow and remains auditable.
  relationships:
    - name: context
      target: Project
      cardinality: '1'
      ownership: reference
      help:
        summary: Governing Project associated with this ResourceAssignment.
        businessMeaning: Supplies the business context needed to interpret and validate the record.
        usage: Workflow navigation, validation, traceability, reporting, and audit.
        cardinalityMeaning: Every ResourceAssignment belongs to exactly one governing Project in this baseline model.
        context: Changes to the governing record require revalidation of open dependent records while completed evidence remains historical.
  invariants:
    - id: RESOURCE-ASSIGNMENT-001
      rule: The governing Project relationship is required and must reference a valid record.
    - id: RESOURCE-ASSIGNMENT-002
      rule: Completed records must not be destructively rewritten; corrections require controlled amendment, replacement, reversal, or follow-up evidence appropriate to the domain.
    - id: RESOURCE-ASSIGNMENT-003
      rule: Creation and lifecycle transitions must be idempotent and auditable.
  lifecycle:
    title: Resource Assignment Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a resource assignment is ended"
      description: "When a resource assignment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RESOURCE-ASSIGNMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on resource assignment {{id}}"
              description: "Resource assignment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a resource assignment is done"
      description: "When a resource assignment is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RESOURCE-ASSIGNMENT-COMPLETED-{{id}}"
              name: "Confirm resource assignment {{id}}"
              description: "Resource assignment {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Represents ResourceAssignment as a first-class governed CEDM business concept.
    businessMeaning: A governed assignment of a person, role, or resource to a Project with defined responsibility and allocation.
    usage: Domain workflows, validation, reporting, audit, integration, and cross-entity traceability.
    relationshipContext: Project supplies the primary governing context; dependent workflows consume this record without silently mutating historical evidence.
    lifecycle: Draft → active → completed, with controlled cancellation and correction paths.
    changePropagation: Material changes revalidate open dependent workflows and preserve completed historical evidence.
    example: A ResourceAssignment is created for a valid Project, progresses through its governed lifecycle, and remains traceable after completion.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-RESOURCE-ASSIGNMENT
