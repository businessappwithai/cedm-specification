entity:
  name: SparePart
  namespace: cedm.domain
  kind: maintenance_material_master
  description: A governed maintenance material designation identifying a Product that is eligible to be planned, reserved, issued, consumed, returned, or replaced as part of asset and equipment maintenance.
  ui:
    icon: database
  identity: {key: sparePartId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: sparePartId, type: uuid, required: true, immutable: true, help: {summary: Stable spare-part identity., businessMeaning: Identifies one governed maintenance-material designation., usage: "Maintenance planning, inventory, procurement and costing.", relationshipContext: References canonical Product rather than duplicating product master data., requiredMeaning: Required.}}
  - {name: criticality, type: enum, required: true, values: [LOW, MEDIUM, HIGH, CRITICAL], help: {summary: Maintenance availability criticality., businessMeaning: Indicates operational consequence of part unavailability., usage: "Stocking, replenishment and maintenance planning.", relationshipContext: Does not replace product or asset criticality., valueSemantics: {LOW: Limited operational consequence., MEDIUM: Material but manageable consequence., HIGH: Significant availability consequence., CRITICAL: Severe operational/safety/service consequence requiring strict control.}, requiredMeaning: Required.}}
  relationships:
  - {name: product, target: Product, cardinality: "1", ownership: reference, help: {summary: Canonical Product used as spare part., businessMeaning: "Supplies item identity, UOM and inventory semantics.", usage: "Procurement, stock and maintenance issue.", cardinalityMeaning: Exactly one Product., workflowRole: SparePart is a role/designation and must not duplicate Product.}}
  - {name: equipment, target: Equipment, cardinality: 0..*, ownership: reference, help: {summary: Equipment for which this part is approved or applicable., businessMeaning: Captures maintenance applicability., usage: Planning and work-order material selection., cardinalityMeaning: Zero or many Equipment records., workflowRole: Applicability guides planning but actual consumption requires inventory evidence.}, inverseCardinality: 0..*}
  - {name: maintenanceWorkOrders, target: MaintenanceWorkOrder, cardinality: "0..*", ownership: reference, help: {summary: Maintenance work using or planning this part., businessMeaning: Connects material demand to maintenance execution., usage: "Reservation, issue, return and costing.", cardinalityMeaning: Zero or many work orders., workflowRole: Physical consumption must reconcile through InventoryMovement.}, inverseCardinality: 0..*}
  invariants:
  - {id: SPARE-PART-001, rule: SparePart must reference exactly one canonical Product and must not duplicate product identity or inventory balance.}
  - {id: SPARE-PART-002, rule: Planned or actual maintenance consumption must not directly alter stock; stock effects require governed InventoryMovement.}
  help:
    summary: Maintenance-specific role for an inventory Product used to repair or service assets and equipment.
    purpose: Connect maintenance planning and execution to canonical product and inventory semantics without creating a second material master.
    businessMeaning: A SparePart states that a Product is approved or expected for maintenance use.
    whenUsed: Used for preventive/corrective maintenance planning, work-order materials, critical-spares stocking, procurement and maintenance costing.
    howItRelates: Product provides material identity; Equipment provides applicability; MaintenanceWorkOrder provides demand/execution; InventoryMovement provides physical stock truth.
    lifecycleUsage: Approved for maintenance use, maintained for applicability and criticality, then retired without rewriting historical work orders.
    commonProcesses: Maintenance planning, spare-parts management, reservation, issue, return, replenishment and reliability analysis.
    commonExamples: Bearings, filters, seals, replacement motors and repair kits.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SPARE-PART}
