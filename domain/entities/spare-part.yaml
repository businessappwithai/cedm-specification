entity:
  name: SparePart
  namespace: cedm.domain
  kind: maintenance_material_master
  description: A governed maintenance material designation identifying a Product that is eligible to be planned, reserved, issued, consumed, returned, or replaced as part of asset and equipment maintenance.
  ui:
    icon: database
  identity: {key: sparePartId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: sparePartId, type: uuid, required: true, immutable: true, help: {summary: 'The stable identity of the spare-part designation, kept even if the underlying product is renamed.', usage: 'Generated on creation; work orders, reservations and equipment applicability lists refer to it rather than to the product directly.', businessMeaning: Identifies one governed maintenance-material designation., relationshipContext: References canonical Product rather than duplicating product master data.}}
    - {name: criticality, type: enum, required: true, values: [LOW, MEDIUM, HIGH, CRITICAL], help: {summary: How seriously maintenance and operations suffer if this part is not available when needed., usage: 'Set by maintenance planners per part; higher criticality justifies safety stock and faster replenishment, and it does not replace asset criticality.', valueSemantics: {LOW: Unavailability causes little disruption; the part can be ordered when needed., MEDIUM: Unavailability delays maintenance but operations can continue for a while., HIGH: 'Unavailability seriously disrupts maintenance or output, so stock is normally held on site.', CRITICAL: 'Unavailability stops production or creates a safety risk, so stock must always be held.'}, businessMeaning: Indicates operational consequence of part unavailability., relationshipContext: Does not replace product or asset criticality.}}
  relationships:
    - {name: product, target: Product, cardinality: "1", ownership: reference, help: {cardinalityMeaning: Each spare part designation is for exactly one product., summary: Canonical Product used as spare part., businessMeaning: "Supplies item identity, UOM and inventory semantics.", usage: "Procurement, stock and maintenance issue.", workflowRole: SparePart is a role/designation and must not duplicate Product.}}
    - {name: equipment, target: Equipment, cardinality: 0..*, ownership: reference, help: {cardinalityMeaning: Any number of equipment items use the part., summary: Equipment for which this part is approved or applicable., businessMeaning: Captures maintenance applicability., usage: Planning and work-order material selection., workflowRole: Applicability guides planning but actual consumption requires inventory evidence.}}
    - {name: maintenanceWorkOrders, target: MaintenanceWorkOrder, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of maintenance work orders may use the part., summary: Maintenance work using or planning this part., businessMeaning: Connects material demand to maintenance execution., usage: "Reservation, issue, return and costing.", workflowRole: Physical consumption must reconcile through InventoryMovement.}}
  invariants:
    - {id: SPARE-PART-001, rule: SparePart must reference exactly one canonical Product and must not duplicate product identity or inventory balance.}
    - {id: SPARE-PART-002, rule: Planned or actual maintenance consumption must not directly alter stock; stock effects require governed InventoryMovement.}
  help:
    usage: Maintained by maintenance planners and read by storekeepers and buyers when selecting parts for a work order or deciding what to stock.
    summary: Maintenance-specific role for an inventory Product used to repair or service assets and equipment.
    purpose: Connect maintenance planning and execution to canonical product and inventory semantics without creating a second material master.
    businessMeaning: A SparePart states that a Product is approved or expected for maintenance use.
    whenUsed: Used for preventive/corrective maintenance planning, work-order materials, critical-spares stocking, procurement and maintenance costing.
    howItRelates: Product provides material identity; Equipment provides applicability; MaintenanceWorkOrder provides demand/execution; InventoryMovement provides physical stock truth.
    lifecycleUsage: Approved for maintenance use, maintained for applicability and criticality, then retired without rewriting historical work orders.
    commonProcesses: Maintenance planning, spare-parts management, reservation, issue, return, replenishment and reliability analysis.
    commonExamples: Bearings, filters, seals, replacement motors and repair kits.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-SPARE-PART}
