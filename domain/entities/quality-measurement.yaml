entity:
  name: QualityMeasurement
  namespace: cedm.domain
  kind: quality_measurement_evidence
  description: A structured quantitative or categorical observation captured during a QualityInspection against a governed QualityPlanCharacteristic, preserving the observed value, unit, applicable criteria, method, and result as auditable evidence.
  ui:
    icon: badge-check
  identity: {key: qualityMeasurementId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: qualityMeasurementId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The permanent, system-generated identity of this single quality observation.
        usage: Generated on creation and never changed; traceability, audits, analytics and integrations refer to the measurement through it.
        businessMeaning: Identifies one observation independently of its inspection and characteristic.
        relationshipContext: Distinct from QualityInspection and the measured Product.
        workflowRole: Stable reference from capture through review.
    - name: measurementNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The human-facing reference that identifies this one measurement within inspection records.
        usage: Assigned when the measurement is captured and unique; used by reviewers, auditors and integrations to cite it.
        businessMeaning: Provides an operational identifier for one observation.
        relationshipContext: Distinct from the parent inspection number.
        workflowRole: Supports individual observation traceability.
    - name: characteristicCode
      type: string
      required: true
      maxLength: 100
      help: {summary: Snapshot of the quality characteristic business code evaluated by this observation., businessMeaning: Preserves the human-readable characteristic identifier applicable when evidence was captured., usage: "Audit, reporting, exports and legacy integration.", relationshipContext: Must correspond to the linked QualityCharacteristic through QualityPlanCharacteristic and must not be treated as the authoritative configuration key., workflowRole: Provides readable historical context while the relationship graph supplies authoritative semantics.}
    - name: measuredValue
      type: decimal
      required: false
      precision: 30
      scale: 12
      help:
        summary: The numeric value actually observed during the inspection, such as a weight or temperature.
        usage: Entered for numeric characteristics together with the unit; compared with the limits to give the result, and exclusive with measured text.
        businessMeaning: Records the factual quantitative observation before evaluation.
        relationshipContext: Requires a compatible unit for dimensional characteristics.
        workflowRole: Supplies evidence used against configured acceptance criteria.
    - name: measuredText
      type: string
      required: false
      maxLength: 1000
      help:
        summary: The categorical or textual observation made, such as a colour grade or appearance remark.
        usage: Entered for characteristics that are not numeric; used in evaluation where a number does not apply, and exclusive with measured value.
        businessMeaning: "Records observations such as color, grade, appearance or classification."
        relationshipContext: Used instead of measuredValue for categorical characteristics.
        workflowRole: Supplies structured qualitative evidence.
    - name: unitOfMeasure
      type: reference
      target: UnitOfMeasure
      required: false
      help:
        summary: The unit, such as kilograms or degrees Celsius, in which the numeric measured value is expressed.
        usage: Chosen with a numeric value; used to compare against limits, convert between units and report consistently.
        businessMeaning: Defines the dimensional interpretation of measuredValue.
        relationshipContext: Must be compatible with the linked QualityPlanCharacteristic and QualityCharacteristic.
        workflowRole: Makes numeric observations semantically comparable.
    - name: lowerLimit
      type: decimal
      required: false
      precision: 30
      scale: 12
      help: {summary: Snapshot of the lower acceptance boundary applicable when the measurement was evaluated., businessMeaning: Preserves the criterion used to evaluate the historical observation., usage: "Audit, reproducibility and review.", relationshipContext: Normally copied from QualityPlanCharacteristic rather than independently defining a new requirement., workflowRole: Makes the evaluation auditable even if the plan later changes.}
    - name: upperLimit
      type: decimal
      required: false
      precision: 30
      scale: 12
      help: {summary: Snapshot of the upper acceptance boundary applicable when the measurement was evaluated., businessMeaning: Preserves the criterion used to evaluate the historical observation., usage: "Audit, reproducibility and review.", relationshipContext: Normally copied from QualityPlanCharacteristic rather than independently defining a new requirement., workflowRole: Makes the evaluation auditable even if the plan later changes.}
    - name: result
      type: enum
      required: true
      values:
        - PASS
        - FAIL
        - CONDITIONAL
        - NOT_EVALUATED
      help:
        summary: The verdict on this measurement when compared with its governing acceptance criterion.
        usage: Set when the value is evaluated; inspections use it to complete, raise nonconformances and feed quality analytics.
        valueSemantics:
          PASS: The measured value is within its limits.
          FAIL: The measured value is outside its limits.
          CONDITIONAL: Within tolerance only under a stated condition.
          NOT_EVALUATED: No verdict has been given yet because it was not compared with a criterion.
        businessMeaning: States whether the individual observation satisfies the applicable requirement.
        relationshipContext: Contributes evidence to QualityInspection.result but does not replace it.
        workflowRole: Supplies structured evidence for the overall inspection decision.
    - name: measuredAt
      type: datetime
      required: true
      help:
        summary: The date and time at which the observation was actually taken.
        usage: Captured with the measurement; supports sampling traceability, compliance checks and audit of when results were obtained.
        businessMeaning: Establishes chronology of the measured fact.
        relationshipContext: Distinct from QualityInspection.inspectionDate.
        workflowRole: Preserves temporal measurement evidence.
    - name: method
      type: string
      required: false
      maxLength: 500
      help:
        summary: The method or procedure used to obtain the observation, such as a named test standard or instrument routine.
        usage: Entered by the inspector; lets others reproduce the test and lets laboratory audits confirm the right method was used.
        businessMeaning: Identifies how the measurement or test was performed.
        relationshipContext: Should align with the linked QualityPlanCharacteristic method where applicable.
        workflowRole: Establishes how evidence was produced.
    - name: notes
      type: string
      required: false
      maxLength: 2000
      help:
        summary: Supporting context for this observation, such as sample condition or instrument remarks.
        usage: Free text entered by the inspector; read during review and audit to explain unusual values.
        businessMeaning: Captures anomalies or conditions not represented structurally.
        relationshipContext: Complements measured values and result without replacing them.
        workflowRole: Provides supporting evidence.
  relationships:
    - {name: qualityInspection, target: QualityInspection, cardinality: '1', ownership: reference, help: {summary: Inspection during which the measurement was captured., businessMeaning: Provides the governing inspection context., usage: Quality traceability and aggregate evaluation., workflowRole: Parent inspection controls measurement lifecycle.}}
    - {name: inspectionSample, target: InspectionSample, cardinality: "0..1", ownership: reference, help: {summary: Exact governed inspection sample from which this observation was produced when sample-specific testing applies., businessMeaning: Preserves provenance from SamplingPlan and SamplingRule execution through selected material to the resulting observation., usage: "Sample-level traceability, laboratory chain of custody, acceptance sampling, audit, and reproducibility.", cardinalityMeaning: A measurement references zero or one InspectionSample because non-sampled or population-level observations may not have a sample record., workflowRole: "When populated, the sample must belong to the same QualityInspection and the measurement must satisfy the characteristic controls applicable to that sample."}}
    - {name: testMethod, target: TestMethod, cardinality: "0..1", ownership: reference, help: {summary: Governed test procedure used to produce this observation., businessMeaning: Identifies the authoritative reusable method applied during measurement., usage: "Reproducibility, compliance, laboratory audit, and analytics.", cardinalityMeaning: Optional when no reusable controlled method applies., workflowRole: Must agree with the governing QualityPlanCharacteristic method configuration when that configuration requires a TestMethod.}}
    - {name: qualityPlanCharacteristic, target: QualityPlanCharacteristic, cardinality: "0..1", ownership: reference, help: {summary: Plan-specific requirement used to interpret and evaluate this measurement., businessMeaning: "Identifies the exact configured characteristic, limits, method, unit, and requiredness governing the observation.", usage: "Requirement traceability, acceptance evaluation, audit, and completion gating.", workflowRole: Supplies authoritative evaluation context for the measurement.}}
    - {name: qualityCharacteristic, target: QualityCharacteristic, cardinality: "0..1", ownership: reference, help: {summary: Reusable quality property observed by this measurement., businessMeaning: Identifies the semantic property independently of a particular plan., usage: "Traceability, analytics, reuse, and audit.", relationshipContext: Should agree with the QualityCharacteristic reached through qualityPlanCharacteristic when both are populated., workflowRole: Provides reusable semantic context.}}
    - {name: qualityPlan, target: QualityPlan, cardinality: "0..1", ownership: reference, help: {summary: Quality plan under which the measurement was evaluated., businessMeaning: Preserves the plan context for the observation., usage: "Audit, reporting, requirement traceability, and historical reconstruction.", workflowRole: Identifies the governing plan when a direct plan relationship is needed for integration or historical evidence.}}
    - {name: product, target: Product, cardinality: 0..1, ownership: reference, help: {summary: Product associated with the observation., businessMeaning: Identifies the item whose characteristic was measured., usage: Product quality history and supplier analysis., workflowRole: Supplies item context when not inherited from the inspection.}}
  invariants:
    - {id: QUALITY-MEASUREMENT-001, rule: qualityInspection is required for every QualityMeasurement.}
    - {id: QUALITY-MEASUREMENT-002, rule: "When qualityPlanCharacteristic is present, its qualityPlan and qualityCharacteristic must agree with the measurement's corresponding plan and characteristic references."}
    - {id: QUALITY-MEASUREMENT-012, rule: "When inspectionSample is present, it must belong to the same qualityInspection as the measurement and its sampling context must be compatible with the governing QualityPlanCharacteristic."}
    - {id: QUALITY-MEASUREMENT-013, rule: "When the governing QualityPlanCharacteristic requires sampling, sample-specific measurement evidence must reference the applicable InspectionSample unless an explicitly authorized exception defines a different evidence model."}
    - {id: QUALITY-MEASUREMENT-003, rule: Exactly one of measuredValue or measuredText must be supplied according to the authoritative QualityCharacteristic dataType.}
    - {id: QUALITY-MEASUREMENT-004, rule: A numeric measuredValue requires a dimensionally compatible UnitOfMeasure unless the characteristic is explicitly unitless.}
    - {id: QUALITY-MEASUREMENT-005, rule: lowerLimit must not exceed upperLimit when both are present.}
    - {id: QUALITY-MEASUREMENT-006, rule: PASS requires the observed value or category to satisfy the governing criterion; FAIL requires evidence that it does not; CONDITIONAL requires an authorized conditional criterion.}
    - {id: QUALITY-MEASUREMENT-007, rule: "QualityMeasurement records evidence and must not itself change inventory, financial balances, QualityInspection status, or disposition."}
    - {id: QUALITY-MEASUREMENT-008, rule: "A failed measurement may support Nonconformance creation or update, while the measurement remains immutable historical evidence after inspection completion."}
    - {id: QUALITY-MEASUREMENT-009, rule: "Changes to QualityPlanCharacteristic, QualityCharacteristic, Product or UnitOfMeasure affecting an open measurement trigger revalidation; completed evidence is corrected through explicit amendment or remeasurement."}
    - {id: QUALITY-MEASUREMENT-010, rule: Measurement capture and evaluation must be idempotent and must not create duplicate observations on retry.}
    - {id: QUALITY-MEASUREMENT-011, rule: "Historical lowerLimit, upperLimit, characteristicCode, and method snapshots must not be silently rewritten when the governing QualityPlanCharacteristic changes."}
  help:
    summary: Structured auditable evidence for one quality characteristic observed during a QualityInspection.
    businessMeaning: QualityMeasurement separates the factual observation from the inspection-level conclusion while retaining the exact plan configuration used for evaluation.
    usage: Incoming inspection, supplier quality, laboratory testing, dimensional checks, sampling, process quality, compliance, nonconformance and corrective-action verification.
    relationshipContext: QualityInspection is the execution context; InspectionSample supplies exact sample provenance when sampling applies; QualityPlanCharacteristic supplies authoritative plan-specific requirements; QualityCharacteristic supplies reusable meaning; QualityPlan supplies the parent definition; Product identifies material; UnitOfMeasure supplies dimensional semantics; Nonconformance may consume failed evidence.
    workflowContext: QualityPlan → QualityPlanCharacteristic → SamplingPlan/SamplingRule where required → QualityInspection → InspectionSample where required → measurement capture → validate characteristic/unit/method → evaluate against configured criteria → measurement result → aggregate inspection result → Nonconformance/disposition where required.
    lifecycle: Captured → evaluated → retained as completed inspection evidence; corrections use explicit amendment or remeasurement.
    changePropagation: Changes to governing plan characteristics, reusable characteristics, product or unit definitions affect open measurements and trigger revalidation. Completed measurements retain the configuration snapshots applicable when captured.
    example: A receiving plan configures WEIGHT at 9.8–10.2 KG. A QualityMeasurement records 10.35 KG, links to the governing QualityPlanCharacteristic and QualityCharacteristic, snapshots the applicable limits, and evaluates to FAIL.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-QUALITY-MEASUREMENT}
