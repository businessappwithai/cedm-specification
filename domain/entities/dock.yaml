entity:
  name: Dock
  namespace: cedm.domain
  kind: warehouse_resource_master
  description: A governed warehouse door, bay, or loading position used for inbound receiving, outbound shipping, transfer, and staging execution.
  ui:
    icon: database
    recordLabel: [dockCode]
  identity: {key: dockId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: dockId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the dock record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a dock store this identifier. The number or code people quote is a separate field.
  - name: dockCode
    type: string
    required: true
    maxLength: 100
    help:
      summary: The code of the dock door, such as D07.
      businessMeaning: Human/scanner identifier for the physical position.
      usage: Painted on the door and used in dock schedules and on loading lists.
      relationshipContext: Unique within its warehouse.
  - name: dockType
    type: enum
    required: true
    values: [INBOUND, OUTBOUND, BIDIRECTIONAL, CROSS_DOCK]
    help:
      summary: Which way goods move through the dock.
      businessMeaning: Controls eligible receiving/shipping work.
      usage: Decides whether inbound deliveries or outbound loads can be scheduled at it.
      relationshipContext: Cross-dock doors handle both, for goods that pass straight through.
      valueSemantics:
        INBOUND: Used for receiving deliveries.
        OUTBOUND: Used for loading shipments.
        BIDIRECTIONAL: Used for both receiving and loading.
        CROSS_DOCK: Used for goods passing straight from inbound to outbound.
  - name: name
    type: string
    required: false
    maxLength: 100
    help:
      summary: A descriptive name, such as "North yard door 7".
      usage: Shown in dock schedules.
      relationshipContext: Optional; the code identifies the door.
  - name: maxVehicleLengthM
    type: decimal
    required: false
    precision: 5
    scale: 2
    help:
      summary: The longest vehicle the dock can take, in metres.
      usage: Checked when a vehicle is scheduled at the dock.
      relationshipContext: Read with the leveller and height.
  - name: hasLeveller
    type: boolean
    required: true
    default: true
    help:
      summary: Whether the dock has a dock leveller for loading at truck height.
      usage: Vehicles without a tail lift need one.
      relationshipContext: Read when assigning vehicles.
  - name: isTemperatureControlled
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the dock is sealed and temperature-controlled for chilled or frozen goods.
      usage: Cold-chain loads are scheduled only at such docks.
      relationshipContext: Read with the warehouse zone it serves.
  - name: status
    type: enum
    required: true
    default: AVAILABLE
    values: [AVAILABLE, OUT_OF_SERVICE]
    help:
      summary: Whether the dock can be used.
      usage: Changed when the dock is out of service.
      relationshipContext: Unavailable docks are not offered in scheduling.
      valueSemantics:
        AVAILABLE: In service.
        OUT_OF_SERVICE: Not usable, such as during repair.
  relationships:
  - name: warehouse
    target: Warehouse
    cardinality: '1'
    ownership: reference
    help:
      summary: The warehouse the dock belongs to.
      businessMeaning: Supplies facility context.
      workflowRole: Warehouse status constrains dock use.
      usage: Set when the dock is created.
      cardinalityMeaning: Every dock belongs to exactly one warehouse.
      context: Dock schedules are kept per warehouse.
  - name: stagingLocation
    target: InventoryLocation
    cardinality: 0..1
    ownership: reference
    help:
      summary: The floor area where goods for the dock are staged.
      businessMeaning: Connects loading resource to stock-control location.
      workflowRole: Physical stock changes still require InventoryMovement.
      usage: Pickers bring outbound goods here; receivers put inbound goods down here.
      cardinalityMeaning: At most one staging location.
      context: An inventory location in the same warehouse.
  invariants:
  - {id: DOCK-001, rule: dockCode must be unique within Warehouse.}
  - {id: DOCK-002, rule: Shipment direction must be compatible with dockType unless explicitly excepted.}
  lifecycle:
    title: Dock Lifecycle
    attribute: status
    states: [AVAILABLE, OUT_OF_SERVICE]
    initial: AVAILABLE
    terminal: []
    transitions:
    - {from: AVAILABLE, to: OUT_OF_SERVICE, action: take_out_of_service}
    - {from: OUT_OF_SERVICE, to: AVAILABLE, action: return_to_service}
  help:
    summary: Warehouse loading/receiving execution resource.
    businessMeaning: Dock is a physical process resource, not an inventory location unless separately represented by stagingLocation.
    usage: Inbound, outbound, cross-dock, appointment, staging and loading workflows.
    relationshipContext: Warehouse owns operational context; InventoryLocation supplies stock-control context; Shipment supplies transport work.
    lifecycle: Configured → active/restricted → retired with historical execution retained.
    example: Dock D-07 'North door 7', loading dock, 16.5 m maximum vehicle length, leveller, not temperature controlled, active.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-DOCK}
