entity:
  name: Dock
  namespace: cedm.domain
  kind: warehouse_resource_master
  description: A governed warehouse door, bay, or loading position used for inbound receiving, outbound shipping, transfer, and staging execution.
  ui:
    icon: database
  identity: {key: dockId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: dockId, type: uuid, required: true, immutable: true, help: {summary: 'The identity of the dock, independent of its door number.', usage: Generated on creation; appointments and gate events refer to it., businessMeaning: Identifies one loading/receiving resource., relationshipContext: Belongs to one Warehouse.}}
    - {name: dockCode, type: string, required: true, maxLength: 100, help: {summary: 'The number or code of the door, as painted at the warehouse.', usage: Unique within the warehouse; used by drivers and loaders., businessMeaning: Human/scanner identifier for the physical position., relationshipContext: Unique within Warehouse.}}
    - name: dockType
      type: enum
      required: true
      values: [INBOUND, OUTBOUND, BIDIRECTIONAL, CROSS_DOCK]
      help:
        summary: What traffic the dock handles.
        usage: Set by the warehouse manager; scheduling offers only docks suited to the movement.
        valueSemantics:
          INBOUND: Receiving goods from suppliers or transfers.
          OUTBOUND: Shipping goods to customers or other sites.
          BIDIRECTIONAL: Used for both receiving and shipping, as needed.
          CROSS_DOCK: Goods move straight from inbound to outbound without being stored.
        businessMeaning: Controls eligible receiving/shipping work.
        relationshipContext: Warehouse policy may add constraints.
    - name: name
      type: string
      required: false
      maxLength: 100
      help:
        summary: A descriptive name for the dock, such as "North yard door 7".
        usage: Shown in dock schedules and to drivers directed to the door.
        relationshipContext: Optional, since the code already identifies the door.
    - name: maxVehicleLengthM
      type: decimal
      required: false
      precision: 5
      scale: 2
      help:
        summary: The longest vehicle the dock can take, in metres.
        usage: Checked when a vehicle is scheduled at the dock.
        relationshipContext: Read with the leveller and height.
    - name: hasLeveller
      type: boolean
      required: true
      default: true
      help:
        summary: Whether the dock has a dock leveller for loading at truck height.
        usage: Vehicles without a tail lift need one.
        relationshipContext: Read when assigning vehicles.
    - name: isTemperatureControlled
      type: boolean
      required: true
      default: false
      help:
        summary: Whether the dock is sealed and temperature-controlled for chilled or frozen goods.
        usage: Cold-chain loads are scheduled only at such docks.
        relationshipContext: Read with the warehouse zone it serves.
    - name: status
      type: enum
      required: true
      default: AVAILABLE
      values:
        - AVAILABLE
        - OUT_OF_SERVICE
      help:
        valueSemantics:
          AVAILABLE: In service and offered when appointments and loads are scheduled.
          OUT_OF_SERVICE: Not usable, for example during repair, and left out of scheduling.
        summary: Whether the dock can be used.
        usage: Changed when the dock is out of service.
        relationshipContext: Unavailable docks are not offered in scheduling.
  relationships:
    - {name: warehouse, target: Warehouse, cardinality: '1', ownership: reference, help: {summary: The warehouse the dock belongs to., usage: Set when the dock is created., cardinalityMeaning: 'Exactly one warehouse: a dock is a physical door of a single building.', workflowRole: Places the dock in the site's capacity., businessMeaning: Supplies facility context.}}
    - {name: stagingLocation, target: InventoryLocation, cardinality: 0..1, ownership: reference, help: {summary: The area in which goods wait next to the dock., usage: Chosen to link dock activity with inventory location records., cardinalityMeaning: At most one staging location; some docks load directly from trailers., workflowRole: Lets receiving and picking hand goods over at a known spot., businessMeaning: Connects loading resource to stock-control location.}}
  invariants:
    - {id: DOCK-001, rule: dockCode must be unique within Warehouse.}
    - {id: DOCK-002, rule: Shipment direction must be compatible with dockType unless explicitly excepted.}
  help:
    summary: A warehouse door, bay or loading position used for receiving, shipping, transfer and staging of goods.
    businessMeaning: Trucks queue at docks, and a warehouse is only as fast as its docks. Each dock is a resource that is scheduled, assigned to a purpose and tied to the area where goods are staged.
    usage: Defined by warehouse managers; booked by carrier appointments; read by yard and dock schedulers.
    relationshipContext: A dock belongs to a Warehouse and may name a staging InventoryLocation where goods wait before loading or after unloading.
    lifecycle: Docks are in service or out of service according to maintenance; the dock code is stable.
    example: Dock D-07, a bidirectional door used for outbound parcels in the morning and returns in the afternoon.
  lifecycle:
    title: Dock Lifecycle
    attribute: status
    states:
      - AVAILABLE
      - OUT_OF_SERVICE
    initial: AVAILABLE
    terminal: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        action: take_out_of_service
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        action: return_to_service
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-DOCK}
