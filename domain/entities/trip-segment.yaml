entity:
  name: TripSegment
  namespace: cedm.domain
  kind: travel_entity
  description: A leg of a trip between an origin and destination using a transport or travel service.
  ui:
    icon: table
    recordLabel: [sequence, mode]
  identity:
    key: tripSegmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tripSegmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the trip segment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a trip segment store this identifier. The number or code people quote is a separate field.
  - name: sequence
    type: integer
    required: true
    minimum: 1
    help:
      summary: The position of the segment in the trip.
      usage: Orders the itinerary.
      relationshipContext: Unique within the trip.
  - name: mode
    type: enum
    required: true
    values:
    - AIR
    - RAIL
    - ROAD
    - SEA
    - BUS
    - WALK
    - OTHER
    help:
      summary: How the traveller moves on this leg.
      usage: Decides the booking channel and emissions factor.
      relationshipContext: Chosen when planning.
      valueSemantics:
        AIR: By plane.
        RAIL: By train.
        ROAD: By car or taxi.
        SEA: By ship or ferry.
        BUS: By bus or coach.
        WALK: On foot.
        OTHER: Any other way.
  - name: departureAt
    type: datetime
    required: true
    help:
      summary: When the segment departs.
      usage: Shown on the itinerary.
      relationshipContext: Not after arrival.
  - name: arrivalAt
    type: datetime
    required: false
    help:
      summary: When the segment arrives.
      usage: Shown on the itinerary.
      relationshipContext: Not before departure.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - BOOKED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the segment stands.
      usage: Updated from bookings and travel.
      relationshipContext: Cancelled segments stay on the itinerary history.
      valueSemantics:
        PLANNED: Proposed.
        BOOKED: Reserved.
        IN_PROGRESS: Being travelled.
        COMPLETED: Travelled.
        CANCELLED: Not travelled.
  relationships:
  - name: trip
    target: Trip
    cardinality: '1'
    ownership: reference
    help:
      summary: The trip the segment belongs to.
      usage: Set when the segment is planned.
      cardinalityMeaning: Each segment belongs to one trip.
      context: Listed on the itinerary.
  - name: origin
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the segment starts.
      usage: Set when planning.
      cardinalityMeaning: Each segment starts at one place.
      context: Usually the previous segment's destination.
  - name: destination
    target: Location
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the segment ends.
      usage: Set when planning.
      cardinalityMeaning: Each segment ends at one place.
      context: Different from the origin.
  - name: vehicle
    target: Vehicle
    cardinality: 0..1
    ownership: reference
    help:
      summary: The vehicle used, for company-operated transport.
      usage: Set when a company vehicle is assigned.
      cardinalityMeaning: At most one vehicle.
      context: Empty for public transport.
  invariants:
  - id: TRIP-SEGMENT-001
    rule: arrivalAt must not precede departureAt.
  lifecycle:
    title: Trip Segment Lifecycle
    attribute: status
    states: [PLANNED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: BOOKED, action: book}
    - {from: BOOKED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: BOOKED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a trip segment is ended"
    description: "When a trip segment is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "TRIP-SEGMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on trip segment {{id}}"
          description: "Trip segment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: One leg of a trip, such as a flight or train journey.
    relationshipContext: The entity participates in a wider business graph through relationships with Trip, Location, Location, Vehicle. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Travellers and the travel desk plan each leg of a trip with its mode, times and route; carriers' changes update it and the traveller's itinerary is built from the segments in order.
    lifecycle: A segment is planned, booked, in progress while travelling, then completed; it can be cancelled before it ends.
    example: 'Segment 1 of trip TR-2024-0412: air, Milan Linate 10 June 07:05 to Munich 08:20, booked.'
    businessMeaning: Segments make up the itinerary and are booked and changed individually.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRIP-SEGMENT
