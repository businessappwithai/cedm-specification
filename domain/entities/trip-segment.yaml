entity:
  name: TripSegment
  namespace: cedm.domain
  kind: travel_entity
  description: A leg of a trip between an origin and destination using a transport or travel service.
  ui:
    icon: table
  identity:
    key: tripSegmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: tripSegmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the segment, constant for its life.
        usage: Generated on creation.
        relationshipContext: Referenced by bookings of the leg.
    - name: sequence
      type: integer
      required: true
      minimum: 1
      help:
        summary: The position of the leg in the journey.
        usage: Entered in order; the trip follows the sequence.
        relationshipContext: Read with the trip.
    - name: mode
      type: enum
      required: true
      values:
        - AIR
        - RAIL
        - ROAD
        - SEA
        - BUS
        - WALK
        - OTHER
      help:
        summary: How the leg is travelled.
        usage: Chosen when the leg is planned.
        relationshipContext: Decides what must be booked.
        valueSemantics:
          AIR: By aircraft.
          RAIL: By train.
          ROAD: By car or other road vehicle.
          SEA: By ship or ferry.
          BUS: By bus or coach.
          WALK: On foot.
          OTHER: By another means.
    - name: departureAt
      type: datetime
      required: true
      help:
        usage: Entered from the booking; arrivals are measured from it.
        relationshipContext: Not later than arrival.
        summary: Records when the departure event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: arrivalAt
      type: datetime
      required: false
      help:
        usage: Entered from the booking and updated on arrival; must not be before departure.
        relationshipContext: Gives the leg's duration.
        summary: Records when the arrival event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - BOOKED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      help:
        summary: Where the leg is.
        usage: Starts as PLANNED.
        valueSemantics:
          PLANNED: Intended; nothing is booked.
          BOOKED: Travel is booked.
          IN_PROGRESS: Under way.
          COMPLETED: Arrived. A final state.
          CANCELLED: Called off. A final state.
  relationships:
    - name: trip
      target: Trip
      cardinality: '1'
      ownership: reference
      help:
        summary: The trip the leg belongs to.
        usage: Set when the segment is added.
        cardinalityMeaning: Exactly one trip; a leg cannot stand alone.
        context: Places the leg in the journey.
    - name: origin
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A leg starts at one location; a journey with a change is two legs.
        summary: The place the leg starts from.
        usage: Chosen when planned.
        context: Where the traveller begins this leg.
    - name: destination
      target: Location
      cardinality: '1'
      ownership: reference
      help:
        cardinalityMeaning: A leg ends at one location; the next leg starts where this one arrives.
        summary: The place the leg ends at.
        usage: Chosen when planned.
        context: Where the traveller arrives.
    - name: vehicle
      target: Vehicle
      cardinality: 0..1
      ownership: reference
      help:
        summary: The vehicle used for the leg, if known.
        usage: Chosen for owned or hired vehicles.
        cardinalityMeaning: At most one vehicle.
        context: Links the leg to the vehicle record.
  invariants:
    - id: TRIP-SEGMENT-001
      rule: arrivalAt must not precede departureAt.
  lifecycle:
    title: Trip Segment Lifecycle
    attribute: status
    states: [PLANNED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: BOOKED, action: book}
      - {from: BOOKED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: BOOKED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a trip segment is ended"
      description: "When a trip segment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "TRIP-SEGMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on trip segment {{id}}"
              description: "Trip segment {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: One leg of a trip between an origin and a destination by a mode of transport.
    businessMeaning: Segments give the route its detail, so each flight, train or drive can be booked, timed and followed separately, and delays can be seen on the leg where they happened.
    usage: Added by the traveller or arranger; read by travel support and the traveller.
    relationshipContext: A segment belongs to one trip, runs between two locations and may use a vehicle.
    lifecycle: A segment is planned, booked, in progress while travelling and completed on arrival. It may be cancelled. Completed and cancelled are final.
    example: The second leg of trip TR-2026-077 is a flight from Manchester to Frankfurt departing 07:10.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRIP-SEGMENT
