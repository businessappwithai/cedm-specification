entity:
  name: Policy
  namespace: cedm.domain
  kind: governance_entity
  description: A formally defined rule, principle, or requirement governing business behavior or decision-making.
  ui:
    icon: shield
    recordLabel: [code, name]
  identity:
    key: policyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: policyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the policy record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a policy store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the policy.
      usage: Cited in procedures, controls and audits.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The title of the policy.
      usage: Shown in the policy library.
      relationshipContext: Names the subject governed.
  - name: description
    type: string
    required: false
    maxLength: 5000
    help:
      summary: What the policy requires, in brief.
      usage: Shown in the policy library; the full text is in the document.
      relationshipContext: A summary, not the policy itself.
  - name: policyType
    type: string
    required: true
    maxLength: 100
    help:
      summary: The area the policy governs, such as finance, security or HR.
      usage: Groups policies in the library and decides who reviews them.
      relationshipContext: From the organisation's policy areas.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the policy is in force.
      usage: Moved on by the policy owner.
      relationshipContext: Only an approved policy becomes active.
      valueSemantics:
        DRAFT: Being written.
        APPROVED: Approved; not yet in force.
        ACTIVE: In force.
        SUSPENDED: Temporarily not in force.
        RETIRED: Withdrawn or replaced.
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: The day the policy takes effect.
      usage: Behaviour from this day is judged against it.
      relationshipContext: Not after the end date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day the policy applies.
      usage: Set when a policy is withdrawn or replaced.
      relationshipContext: Empty while in force.
  - name: policyVersion
    type: string
    required: true
    default: '1.0'
    help:
      summary: The version of the policy text.
      usage: Shown with the policy; a new version replaces the previous one.
      relationshipContext: Increases with each approved change.
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organisation unit responsible for the policy.
      usage: Set when drafting.
      cardinalityMeaning: At most one owner.
      context: Reviews and answers for the policy.
  - name: controls
    target: Control
    cardinality: 0..*
    ownership: reference
    help:
      summary: Controls that enforce or check the policy.
      usage: Linked by risk and compliance staff.
      cardinalityMeaning: Any number of controls.
      context: Audits test the controls against the policy.
  - name: document
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: The document holding the full policy text.
      usage: Attached when drafting.
      cardinalityMeaning: At most one document.
      context: The authoritative text.
  invariants:
  - {id: POLICY-001, rule: A policy ends on or after the day it takes effect., violatedWhen: effective_from != null and effective_to != null and effective_to < effective_from, message: The end date cannot be before the effective date.}
  lifecycle:
    title: Policy Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: reinstate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
    - {from: APPROVED, to: RETIRED, action: retire}
    - {from: DRAFT, to: RETIRED, action: retire}
  help:
    summary: A written rule or principle the organisation commits to follow, such as a travel, privacy or credit policy.
    businessMeaning: Policy is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Control, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Policy owners draft and approve policies, publish the active version, link the controls that enforce them, and review them periodically; staff consult them to know what is allowed.
    lifecycle: A policy is drafted, approved, then active from its effective date; it may be suspended and reinstated, and is retired when replaced or withdrawn.
    example: Policy FIN-007 'Travel and expenses', finance policy, version 3.1, owner Group Finance, active from 1 January 2024.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-POLICY
