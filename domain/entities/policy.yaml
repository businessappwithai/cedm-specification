entity:
  name: Policy
  namespace: cedm.domain
  kind: governance_entity
  description: A formally defined rule, principle, or requirement governing business behavior or decision-making.
  ui:
    icon: shield
  identity:
    key: policyId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: policyId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the policy record associated with this Policy. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The permanent identity of this policy version, so controls, attestations and audits refer to exactly the rules that applied."
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference used to cite the policy in procedures, training and audit reports, such as FIN-POL-007."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The title staff know the policy by, such as Expense Reimbursement Policy, shown in policy libraries and acknowledgements."
  - name: description
    type: string
    required: false
    maxLength: 5000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "A plain summary of what the policy requires and whom it applies to, so readers can tell whether it concerns them."
  - name: policyType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of policy type for the Policy. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The area the policy governs, such as financial, security, HR or compliance, which decides who owns it and how it is reviewed."
  - name: version
    type: string
    required: true
    default: '1.0'
    maxLength: 30
    help:
      summary: Captures the business meaning of version for the Policy. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which revision of the policy this is, so people know whether they are reading and attesting to the current wording."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - APPROVED
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Policy.
        APPROVED: Represents the approved state or classification in the context of Policy.
        ACTIVE: Represents the active state or classification in the context of Policy.
        SUSPENDED: Represents the suspended state or classification in the context of Policy.
        RETIRED: Represents the retired state or classification in the context of Policy.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Whether the policy is a draft, approved, in force, suspended or retired, which decides whether people are bound by it today."
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective from for the Policy. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The date from which the policy applies; behaviour before that date is judged under the previous version."
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: Captures the business meaning of effective to for the Policy. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Policy records, where applicable.
      relationshipContext: Its meaning is specific to Policy; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The date after which the policy no longer applies, typically when a replacement takes effect."
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Policy to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Policy.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: controls
    target: Control
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Policy to Control so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Control records associated with a Policy.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: document
    target: Document
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Policy to Document so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Document records associated with a Policy.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: POLICY-001
    rule: effectiveTo must not precede effectiveFrom.
  - id: POLICY-002
    rule: only an APPROVED policy version may become ACTIVE.
  - {id: POLICY-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Policy Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: APPROVED, action: approve}
      - {from: APPROVED, to: ACTIVE, action: activate}
      - {from: APPROVED, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: APPROVED, action: resume}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: APPROVED, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: "One formally approved rule or principle governing how the business behaves or decides, such as a credit, travel or data retention policy, kept with its version and effective dates."
    businessMeaning: Policy is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Policy records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Control,
      Document. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Policy record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Drafted by the policy owner, approved by the responsible authority, made active from its effective date, suspended or reinstated as needed, and retired when superseded; controls and documents refer to the active version when people are assessed against it."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-POLICY
