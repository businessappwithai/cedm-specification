entity:
  name: Shipment
  namespace: cedm.domain
  kind: logistics_transaction
  description: A planned or executed logistics movement coordinating transportation of goods, assets, or containers from an origin to a destination under a defined fulfillment context. Shipment execution is distinct from inventory ledger posting, commercial fulfillment and financial settlement.
  identity: {key: shipmentId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: shipmentId, type: uuid, required: true, immutable: true}
  - {name: shipmentNumber, type: string, required: true, unique: true, maxLength: 100}
  - {name: shipmentType, type: enum, required: true, values: [INBOUND, OUTBOUND, TRANSFER, RETURN]}
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, BOOKED, IN_TRANSIT, DELIVERED, CANCELLED, EXCEPTION]
    help:
      summary: Operational execution state of the shipment.
      usage: Controls booking, dispatch, tracking, delivery, exception and cancellation actions.
      relationshipContext: Status is not inventory status and does not itself prove customer acceptance or invoice payment.
      workflowRole: Drives permitted logistics transitions and downstream fulfillment/movement workflows.
  - {name: plannedDate, type: date, required: false}
  - {name: actualDate, type: date, required: false}
  - {name: trackingReference, type: string, required: false, maxLength: 200}
  relationships:
  - name: origin
    target: Location
    cardinality: 0..1
    ownership: reference
  - name: destination
    target: Location
    cardinality: 0..1
    ownership: reference
  - name: carrier
    target: Party
    cardinality: 0..1
    ownership: reference
  - name: containers
    target: Container
    cardinality: 0..*
    ownership: reference
  - name: salesOrder
    target: SalesOrder
    cardinality: 0..1
    ownership: reference
  - name: purchaseOrder
    target: PurchaseOrder
    cardinality: 0..1
    ownership: reference
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
  invariants:
  - {id: SHIPMENT-001, rule: DELIVERED shipments must have actualDate.}
  - {id: SHIPMENT-002, rule: IN_TRANSIT shipments must have an origin or externally managed origin reference.}
  - {id: SHIPMENT-003, rule: CANCELLED shipments must not become IN_TRANSIT or DELIVERED without authorized reinstatement.}
  - {id: SHIPMENT-004, rule: Shipment completion must not directly mutate inventory state without corresponding authorized InventoryMovement evidence.}
  - {id: SHIPMENT-005, rule: An OUTBOUND shipment linked to a SalesOrder must have validated allocation/fulfillment eligibility before dispatch; shipment status alone cannot create customer fulfillment quantities.}
  - {id: SHIPMENT-006, rule: An INBOUND shipment arrival does not create accepted inventory; accepted stock requires GoodsReceiptLine disposition and InventoryMovement posting.}
  - {id: SHIPMENT-007, rule: A TRANSFER shipment must have validated source and destination locations and corresponding transfer inventory movements according to inventory policy.}
  - {id: SHIPMENT-008, rule: A RETURN shipment must reference an authorized return/receiving workflow before returned goods increase available inventory.}
  - {id: SHIPMENT-009, rule: Dispatch or delivery events that affect inventory or SalesOrderLine fulfillment must be idempotent and traceable to the originating shipment execution event.}
  - {id: SHIPMENT-010, rule: Cancelling or reversing a shipment with posted inventory or fulfillment effects requires compensating InventoryMovement and fulfillment reversal/reconciliation workflows; status change alone is insufficient.}
  - {id: SHIPMENT-011, rule: Changes to SalesOrder, PurchaseOrder, Product, UnitOfMeasure, InventoryLocation, Carrier or container eligibility that affect an open shipment must trigger controlled revalidation before dispatch or delivery progression.}
  - {id: SHIPMENT-012, rule: DELIVERED is transport evidence and must not directly set Invoice status to paid or settled.}
  help:
    summary: Represents physical logistics execution bridging commercial fulfillment and transport while keeping inventory and financial state under their authoritative workflows.
    businessMeaning: Shipment answers how goods are physically moved. It is not itself the inventory ledger, SalesOrder fulfillment ledger, GoodsReceipt acceptance, or financial settlement.
    usage: Transportation, warehouse operations, procurement, order fulfillment, carrier management, customs, customer service and container logistics.
    relationshipContext: SalesOrder supplies outbound demand, PurchaseOrder supplies inbound procurement context, Container supplies equipment, Location supplies endpoints, InventoryMovement supplies stock consequences, GoodsReceipt supplies inbound acceptance, and Invoice supplies financial claim.
    workflowContext: Outbound: confirmed SalesOrder → allocation/reservation → pick/issue → Shipment booked → dispatch → transport → delivery evidence → SalesOrder fulfillment update. Inbound: PurchaseOrder → expected shipment → arrival → GoodsReceipt → acceptance → InventoryMovement. Transfer: source allocation → dispatch issue → transit → destination receipt. Return: authorized return → transport → receipt/inspection → disposition → inventory movement.
    lifecycle: Planned → booked → in transit → delivered, with cancellation and exception paths. Delivery evidence contributes to fulfillment but never bypasses authoritative inventory or financial workflows.
    propagation: Shipment status changes invoke dependent workflow transitions; master-data changes affecting an open shipment require revalidation; posted downstream effects require compensating events for reversal.
    concurrency: Dispatch, delivery and inventory posting require idempotency keys and concurrency control to prevent duplicate issue/receipt/fulfillment effects.
    example: Twelve units are reserved for an outbound SalesOrder. Dispatch creates one authoritative inventory issue event for the shipped quantity and updates fulfillment through the controlled workflow. A retry cannot issue the same quantity twice. Delivery confirms transport completion but does not itself settle the invoice.
specification: {version: 0.3.0, status: draft, identifier: CEDM-ENTITY-SHIPMENT}
