entity:
  name: Workflow
  namespace: cedm.domain
  kind: process_definition_entity
  description: A machine-executable or human-executable orchestration definition for coordinating business activities and decisions.
  ui:
    icon: settings
    recordLabel: [code, name]
  identity:
    key: workflowId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: workflowId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the workflow record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a workflow store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    unique: true
    help:
      summary: The code of the workflow.
      usage: Used by systems that start it.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the workflow.
      usage: Shown in workflow lists and task headers.
      relationshipContext: Names the process.
  - name: executionType
    type: enum
    required: true
    values:
    - HUMAN
    - AUTOMATED
    - HYBRID
    help:
      summary: Who performs the workflow's steps.
      usage: Decides whether tasks are created for people.
      relationshipContext: Chosen when designing.
      valueSemantics:
        HUMAN: People perform the steps.
        AUTOMATED: Systems perform the steps.
        HYBRID: People and systems both perform steps.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the workflow can be started.
      usage: Changed by administrators.
      relationshipContext: Only active workflows start new instances.
      valueSemantics:
        DRAFT: Being designed.
        ACTIVE: Can be started.
        SUSPENDED: Temporarily cannot be started.
        RETIRED: No longer used.
  - name: definitionFormat
    type: enum
    required: false
    values:
    - CEDM
    - BPMN
    - STATE_MACHINE
    - OTHER
    help:
      summary: The notation the definition is written in.
      usage: Decides which engine runs it.
      relationshipContext: The definition must be valid for it.
      valueSemantics:
        CEDM: The CEDM workflow notation.
        BPMN: Business Process Model and Notation.
        STATE_MACHINE: A state machine.
        OTHER: Any other notation.
  - name: definition
    type: object
    required: false
    description: Structured workflow definition interpreted by a workflow engine.
    help:
      summary: The executable definition of the workflow.
      usage: Read by the workflow engine.
      relationshipContext: Must be valid before activation.
  - name: definitionVersion
    type: string
    required: true
    default: '1.0'
    help:
      summary: The version of the workflow definition.
      usage: Running instances keep the version they started with.
      relationshipContext: A new version is a new definition; an active one is never changed.
  relationships:
  - name: businessProcess
    target: BusinessProcess
    cardinality: 0..1
    ownership: reference
    help:
      summary: The business process the workflow implements.
      usage: Linked by the process owner.
      cardinalityMeaning: At most one process.
      context: Documents the purpose of the workflow.
  - name: tasks
    target: Task
    cardinality: 0..*
    ownership: reference
    help:
      summary: Tasks the workflow has created.
      usage: Listed for monitoring.
      cardinalityMeaning: Any number of tasks.
      context: Each task comes from at most one workflow.
  invariants:
  - id: WORKFLOW-001
    rule: A workflow cannot be ACTIVE unless its definition is valid for the declared definitionFormat.
  - id: WORKFLOW-002
    rule: A workflow version is immutable once activated; a new version requires a new workflow definition or version.
  lifecycle:
    title: Workflow Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Represents a process definition entity called Workflow within the CEDM business model.
    businessMeaning: Workflow is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with BusinessProcess, Task. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Process owners define workflows that coordinate people and systems through the steps of a business process; the workflow engine runs them and creates tasks; administrators activate, suspend and retire versions.
    lifecycle: A workflow is drafted, activated once its definition is valid, may be suspended and resumed, and is retired when replaced by a new version or no longer needed.
    example: Workflow INV-APPROVAL 'Supplier invoice approval', definition version 2.1, hybrid, BPMN, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-WORKFLOW
