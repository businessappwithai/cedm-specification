entity:
  name: Workflow
  namespace: cedm.domain
  kind: process_definition_entity
  description: A machine-executable or human-executable orchestration definition for coordinating business activities and decisions.
  ui:
    icon: settings
  identity:
    key: workflowId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: workflowId
      type: uuid
      required: true
      immutable: true
      help:
        summary: Identifies the workflow record associated with this Workflow. The identifier connects this record to the corresponding CEDM entity so related processes can resolve the correct business object.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: code
      type: string
      required: true
      maxLength: 100
      unique: true
      help:
        summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The human-readable name used by people, reports, searches, and related business processes.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: workflowVersion
      type: string
      required: true
      default: '1.0'
      maxLength: 30
      help:
        summary: Captures the business meaning of version for the Workflow. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
    - name: executionType
      type: enum
      required: true
      values:
        - HUMAN
        - AUTOMATED
        - HYBRID
      help:
        summary: Captures the business meaning of execution type for the Workflow. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          HUMAN: Represents the human state or classification in the context of Workflow.
          AUTOMATED: Represents the automated state or classification in the context of Workflow.
          HYBRID: Represents the hybrid state or classification in the context of Workflow.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          DRAFT: Represents the draft state or classification in the context of Workflow.
          ACTIVE: Represents the active state or classification in the context of Workflow.
          SUSPENDED: Represents the suspended state or classification in the context of Workflow.
          RETIRED: Represents the retired state or classification in the context of Workflow.
    - name: definitionFormat
      type: enum
      required: false
      values:
        - CEDM
        - BPMN
        - STATE_MACHINE
        - OTHER
      help:
        summary: Captures the business meaning of definition format for the Workflow. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
        valueSemantics:
          CEDM: Represents the cedm state or classification in the context of Workflow.
          BPMN: Represents the bpmn state or classification in the context of Workflow.
          STATE_MACHINE: Represents the state machine state or classification in the context of Workflow.
          OTHER: Represents the other state or classification in the context of Workflow.
    - name: definition
      type: object
      required: false
      description: Structured workflow definition interpreted by a workflow engine.
      help:
        summary: Captures the business meaning of definition for the Workflow. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
        usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Workflow records, where applicable.
        relationshipContext: Its meaning is specific to Workflow; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
  relationships:
    - name: businessProcess
      target: BusinessProcess
      cardinality: 0..1
      ownership: reference
      help:
        summary: Connects Workflow to BusinessProcess so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about BusinessProcess records associated with a Workflow.
        cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
    - name: tasks
      target: Task
      cardinality: 0..*
      ownership: aggregate
      help:
        summary: Connects Workflow to Task so related business context can be navigated and enforced.
        usage: Used when processes need to find or reason about Task records associated with a Workflow.
        cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
        context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  invariants:
    - id: WORKFLOW-001
      rule: A workflow cannot be ACTIVE unless its definition is valid for the declared definitionFormat.
    - id: WORKFLOW-002
      rule: A workflow version is immutable once activated; a new version requires a new workflow definition or version.
  lifecycle:
    title: Workflow Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: Represents a process definition entity called Workflow within the CEDM business model.
    businessMeaning: Workflow is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Workflow records.
    relationshipContext: The entity participates in a wider business graph through relationships with BusinessProcess, Task. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Workflow record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
