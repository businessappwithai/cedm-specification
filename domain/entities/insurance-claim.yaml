entity:
  name: InsuranceClaim
  namespace: cedm.domain
  kind: insurance_transaction
  description: A request for payment or service under an insurance policy following a covered event.
  ui:
    icon: file-warning
  identity:
    key: insuranceClaimId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: insuranceClaimId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the insurance claim record associated with this InsuranceClaim. The identifier connects this record
        to the corresponding CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: claimNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of claim number for the InsuranceClaim. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: lossDate
    type: date
    required: false
    help:
      summary: Records the business date associated with the loss. It is used in chronology, eligibility, scheduling, reporting,
        and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: reportedAt
    type: datetime
    required: true
    help:
      summary: Records when the reported event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  - name: claimedAmount
    type: money
    required: false
    help:
      summary: Captures the business meaning of claimed amount for the InsuranceClaim. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: approvedAmount
    type: money
    required: false
    help:
      summary: Captures the business meaning of approved amount for the InsuranceClaim. It is interpreted together with the
        entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: status
    type: enum
    required: true
    default: REPORTED
    values:
    - REPORTED
    - UNDER_REVIEW
    - APPROVED
    - PARTIALLY_APPROVED
    - DENIED
    - SETTLED
    - CLOSED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating InsuranceClaim records, where
        applicable.
      relationshipContext: Its meaning is specific to InsuranceClaim; it must be interpreted with the entity's relationships,
        lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        REPORTED: Represents the reported state or classification in the context of InsuranceClaim.
        UNDER_REVIEW: Represents the under review state or classification in the context of InsuranceClaim.
        APPROVED: Represents the approved state or classification in the context of InsuranceClaim.
        PARTIALLY_APPROVED: Represents the partially approved state or classification in the context of InsuranceClaim.
        DENIED: Represents the denied state or classification in the context of InsuranceClaim.
        SETTLED: Represents the settled state or classification in the context of InsuranceClaim.
        CLOSED: Represents the closed state or classification in the context of InsuranceClaim.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
  relationships:
  - name: policy
    target: InsurancePolicy
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects InsuranceClaim to InsurancePolicy so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about InsurancePolicy records associated with a InsuranceClaim.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: claimant
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects InsuranceClaim to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a InsuranceClaim.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: incident
    target: BusinessTransaction
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects InsuranceClaim to BusinessTransaction so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about BusinessTransaction records associated with a InsuranceClaim.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - {name: insuredParty, target: InsuredParty, cardinality: "0..1", ownership: reference, help: {summary: Insured-party relationship whose coverage is invoked by this Claim., businessMeaning: Preserves policy-specific eligibility context beyond generic claimant identity., usage: "Coverage validation, claims history and audit.", cardinalityMeaning: Optional where claimant or policy-wide coverage is sufficient., workflowRole: InsuredParty must belong to the Claim policy and be eligible at loss time.}}
  - {name: claimLines, target: ClaimLine, cardinality: "0..*", ownership: aggregate, help: {summary: Line-level benefits, losses or expenses adjudicated within this Claim., businessMeaning: Allows distinct Coverage, amounts and decisions under one claim aggregate., usage: "Claims adjudication, reserves and reporting.", cardinalityMeaning: Zero or many ClaimLines., workflowRole: Header claim outcome must reconcile with line-level decisions.}}
  - {name: settlements, target: Settlement, cardinality: "0..*", ownership: reference, help: {summary: Settlement transactions discharging approved liability on this Claim., businessMeaning: Separates claim adjudication from payment or other liability discharge., usage: "Claims finance, payment and audit.", cardinalityMeaning: Zero or many Settlements., workflowRole: Executed settlement totals must reconcile to approved liability and line allocations.}}

  invariants:
  - id: INSURANCE-CLAIM-001
    rule: approvedAmount cannot exceed claimedAmount when both are supplied.
  - {id: INSURANCE-CLAIM-EXE-001, rule: "Claimed Amount cannot be negative.", violatedWhen: "claimed_amount != null and claimed_amount < 0", message: "Claimed Amount cannot be negative."}
  - {id: INSURANCE-CLAIM-EXE-002, rule: "Approved Amount cannot be negative.", violatedWhen: "approved_amount != null and approved_amount < 0", message: "Approved Amount cannot be negative."}
  lifecycle:
    title: Insurance Claim Lifecycle
    attribute: status
    states: [REPORTED, UNDER_REVIEW, APPROVED, PARTIALLY_APPROVED, DENIED, SETTLED, CLOSED]
    initial: REPORTED
    terminal: [CLOSED, DENIED]
    transitions:
      - {from: REPORTED, to: UNDER_REVIEW, action: review}
      - {from: UNDER_REVIEW, to: APPROVED, action: approve}
      - {from: APPROVED, to: PARTIALLY_APPROVED, action: mark_partially_approved}
      - {from: PARTIALLY_APPROVED, to: SETTLED, action: settle}
      - {from: SETTLED, to: CLOSED, action: close}
      - {from: REPORTED, to: DENIED, action: deny}
      - {from: UNDER_REVIEW, to: DENIED, action: deny}
      - {from: APPROVED, to: DENIED, action: deny}
      - {from: PARTIALLY_APPROVED, to: DENIED, action: deny}
  workflows:
    - name: ApprovalRequested
      title: "Ask for a decision when a insurance claim is put forward"
      description: "When a insurance claim is under review, a task asks someone to decide on it."
      when: "status == \"UNDER_REVIEW\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: decide on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INSURANCE-CLAIM-APPROVAL-{{id}}"
              name: "Decide on insurance claim {{claim_number}}"
              description: "Insurance claim {{claim_number}} is now {{status}}. Approve it, return it for change or reject it; the move you make is recorded on the record."
              task_type: "APPROVAL"
              status: "CREATED"
              priority: "NORMAL"
    - name: FollowUpRequired
      title: "Follow up when a insurance claim is ended"
      description: "When a insurance claim is denied, a task asks someone to settle what depended on it."
      when: "status == \"DENIED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INSURANCE-CLAIM-FOLLOW-UP-{{id}}"
              name: "Follow up on insurance claim {{claim_number}}"
              description: "Insurance claim {{claim_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a insurance transaction called InsuranceClaim within the CEDM business model.
    businessMeaning: InsuranceClaim is a business concept with its own identity and lifecycle. It captures information that
      must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate InsuranceClaim records.
    relationshipContext: The entity participates in a wider business graph through relationships with InsurancePolicy, Party,
      BusinessTransaction. These relationships provide the context needed to interpret the record rather than treating its
      fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical InsuranceClaim record represents one identifiable business occurrence or master-data object that can
      be referenced by related CEDM processes.
