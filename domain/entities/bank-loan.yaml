entity:
  name: BankLoan
  namespace: cedm.domain
  kind: banking_entity
  description: A credit facility under which a financial institution advances funds to a borrower subject to repayment terms.
  ui:
    icon: banknote
    recordLabel: [loanNumber]
  identity:
    key: loanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: loanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the bank loan record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a bank loan store this identifier. The number or code people quote is a separate field.
  - name: loanNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the loan, as on the loan agreement.
      usage: Quoted on statements, payments and covenant reports.
      relationshipContext: Unique.
  - name: principalAmount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: The amount lent.
      usage: Taken from the agreement; interest and repayments are computed from it.
      relationshipContext: In the loan's currency; greater than zero.
  - name: interestRate
    type: decimal
    required: true
    precision: 10
    scale: 6
    help:
      summary: The annual interest rate, in percent.
      usage: Used to compute interest each period.
      relationshipContext: For a floating rate, the rate currently in force.
  - name: startDate
    type: date
    required: true
    help:
      summary: The day the loan was drawn.
      usage: Interest runs from it.
      relationshipContext: Earlier than the maturity date.
  - name: maturityDate
    type: date
    required: true
    help:
      summary: The day the loan must be fully repaid.
      usage: Drives debt maturity reports and refinancing plans.
      relationshipContext: Later than the start date.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - APPLICATION
    - APPROVED
    - ACTIVE
    - DELINQUENT
    - PAID_OFF
    - DEFAULTED
    - CANCELLED
    help:
      summary: Where the loan is in its life.
      usage: Moved on by approval, drawdown, repayment and default.
      relationshipContext: Delinquent loans are escalated to the lender's collections or our treasury.
      valueSemantics:
        APPLICATION: Requested; not yet approved.
        APPROVED: Approved; funds not yet drawn.
        ACTIVE: Drawn and being repaid as agreed.
        DELINQUENT: A repayment is overdue.
        PAID_OFF: Repaid in full.
        DEFAULTED: Not repaid; the lender has enforced its rights.
        CANCELLED: Withdrawn before drawdown.
  - name: interestType
    type: enum
    required: true
    default: FIXED
    values: [FIXED, FLOATING]
    help:
      summary: Whether the rate is fixed or follows a reference rate.
      usage: Decides whether interest must be reset periodically.
      relationshipContext: Floating loans state their reference rate and margin.
      valueSemantics:
        FIXED: The rate stays the same for the term.
        FLOATING: The rate follows a reference rate plus a margin.
  - name: repaymentFrequency
    type: enum
    required: true
    default: MONTHLY
    values: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL, BULLET]
    help:
      summary: How often repayments are due.
      usage: Builds the repayment schedule.
      relationshipContext: Bullet loans repay at maturity.
      valueSemantics:
        MONTHLY: Every month.
        QUARTERLY: Every quarter.
        SEMI_ANNUAL: Every six months.
        ANNUAL: Every year.
        BULLET: All at maturity.
  - name: outstandingPrincipal
    type: Money
    required: false
    help:
      summary: How much principal remains to be repaid.
      usage: Updated with each repayment; shown in debt reports.
      relationshipContext: Not more than the principal.
  - name: covenants
    type: text
    required: false
    help:
      summary: The financial and other conditions the borrower must keep.
      usage: Monitored by treasury; a breach can make the loan repayable.
      relationshipContext: Taken from the agreement.
  relationships:
  - name: borrower
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Who borrowed the money.
      usage: Set when the loan is recorded.
      cardinalityMeaning: Every loan has exactly one borrower.
      context: A group company when we borrow; a customer when we lend.
  - name: lender
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: The bank or institution that lent the money.
      usage: Set when the loan is recorded.
      cardinalityMeaning: Every loan has exactly one lender.
      context: Syndicated loans name the agent bank.
  - name: currency
    target: Currency
    cardinality: '1'
    ownership: reference
    help:
      summary: The currency of the loan.
      usage: Set from the agreement.
      cardinalityMeaning: Every loan is in exactly one currency.
      context: Principal, interest and repayments are in it.
  invariants:
  - id: BANK-LOAN-001
    rule: maturityDate must be later than startDate.
  - id: BANK-LOAN-002
    rule: principalAmount must be greater than zero.
  - {id: BANK-LOAN-EXE-001, rule: "Principal Amount cannot be negative.", violatedWhen: "principal_amount != null and principal_amount < 0", message: "Principal Amount cannot be negative."}
  lifecycle:
    title: Bank Loan Lifecycle
    attribute: status
    states: [APPLICATION, APPROVED, ACTIVE, DELINQUENT, PAID_OFF, DEFAULTED, CANCELLED]
    initial: APPLICATION
    terminal: [PAID_OFF, DEFAULTED, CANCELLED]
    transitions:
    - {from: APPLICATION, to: APPROVED, action: approve}
    - {from: APPLICATION, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: ACTIVE, action: draw}
    - {from: APPROVED, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: DELINQUENT, action: mark_delinquent}
    - {from: DELINQUENT, to: ACTIVE, action: cure}
    - {from: ACTIVE, to: PAID_OFF, action: pay_off}
    - {from: DELINQUENT, to: PAID_OFF, action: pay_off}
    - {from: DELINQUENT, to: DEFAULTED, action: default}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a bank loan is ended"
    description: "When a bank loan is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "BANK-LOAN-FOLLOW-UP-{{id}}"
          name: "Follow up on bank loan {{loan_number}}"
          description: "Bank loan {{loan_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A loan a bank has granted or is considering, with its amount, rate, term and repayment status.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Currency. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Treasury records each loan when it is approved, follows drawdowns, interest and repayments, monitors covenants and maturities, and reports debt by lender and currency. Lending institutions use the same record for loans they grant.
    lifecycle: An application becomes an approved loan, then active once funds are drawn. It is delinquent while a repayment is overdue and returns to active once paid up; it ends paid off, defaulted after a failure to pay that the lender enforces, or cancelled before drawdown.
    example: 'Loan LN-2023-004: 500,000 EUR term loan from Bank A to ACME France, 5.25% fixed, drawn 1 June 2023, repaid in 20 quarterly instalments, maturity 1 June 2028, active.'
    businessMeaning: Loans are the bank's main source of interest income and credit risk; tracking them decides what the borrower owes, what the bank provisions and what regulators see.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BANK-LOAN
