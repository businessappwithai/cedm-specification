entity:
  name: BankLoan
  namespace: cedm.domain
  kind: banking_entity
  description: A credit facility under which a financial institution advances funds to a borrower subject to repayment terms.
  ui:
    icon: banknote
  identity:
    key: loanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: loanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the loan record associated with this BankLoan. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Ties every repayment, interest accrual and statement to this one facility, even if the lender reissues the loan number."
  - name: loanNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of loan number for the BankLoan. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference the lender uses on statements and correspondence; treasury quotes it when reconciling repayments and talking to the bank."
  - name: principalAmount
    type: decimal
    required: true
    precision: 20
    scale: 4
    help:
      summary: Captures the business meaning of principal amount for the BankLoan. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The amount originally borrowed, in the loan currency; interest is charged on it and the repayment schedule is built to return it in full by maturity."
  - name: interestRate
    type: decimal
    required: true
    precision: 10
    scale: 6
    help:
      summary: Captures the business meaning of interest rate for the BankLoan. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The annual rate the lender charges on the outstanding balance; it drives interest expense, cash flow forecasts and comparisons with other financing options."
  - name: startDate
    type: date
    required: true
    help:
      summary: The date on which the applicable business period, agreement, service, or lifecycle begins. Related end dates
        must follow the business chronology.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The date funds are drawn and interest begins to accrue; repayment schedules count from it."
  - name: maturityDate
    type: date
    required: true
    help:
      summary: Records the business date associated with the maturity. It is used in chronology, eligibility, scheduling,
        reporting, and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The date by which the loan must be repaid in full; treasury plans refinancing or final repayment around it and it decides whether the debt is reported as current or long-term."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - APPLICATION
    - APPROVED
    - ACTIVE
    - DELINQUENT
    - PAID_OFF
    - DEFAULTED
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating BankLoan records, where applicable.
      relationshipContext: Its meaning is specific to BankLoan; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        APPLICATION: Represents the application state or classification in the context of BankLoan.
        APPROVED: Represents the approved state or classification in the context of BankLoan.
        ACTIVE: Represents the active state or classification in the context of BankLoan.
        DELINQUENT: Represents the delinquent state or classification in the context of BankLoan.
        PAID_OFF: Represents the paid off state or classification in the context of BankLoan.
        DEFAULTED: Represents the defaulted state or classification in the context of BankLoan.
        CANCELLED: Represents the cancelled state or classification in the context of BankLoan.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells treasury and risk whether the loan is still an application, approved, active and performing, delinquent on payments, paid off, defaulted, or cancelled, which decides whether repayments are expected and whether escalation is needed."
  relationships:
  - name: borrower
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects BankLoan to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a BankLoan.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: lender
    target: Organization
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects BankLoan to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a BankLoan.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: currency
    target: Currency
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects BankLoan to Currency so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Currency records associated with a BankLoan.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: BANK-LOAN-001
    rule: maturityDate must be later than startDate.
  - id: BANK-LOAN-002
    rule: principalAmount must be greater than zero.
  - {id: BANK-LOAN-EXE-001, rule: "Principal Amount cannot be negative.", violatedWhen: "principal_amount != null and principal_amount < 0", message: "Principal Amount cannot be negative."}
  lifecycle:
    title: Bank Loan Lifecycle
    attribute: status
    states: [APPLICATION, APPROVED, ACTIVE, DELINQUENT, PAID_OFF, DEFAULTED, CANCELLED]
    initial: APPLICATION
    terminal: [CANCELLED]
    transitions:
      - {from: APPLICATION, to: APPROVED, action: approve}
      - {from: APPROVED, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: DELINQUENT, action: mark_delinquent}
      - {from: DELINQUENT, to: PAID_OFF, action: mark_paid_off}
      - {from: PAID_OFF, to: DEFAULTED, action: mark_defaulted}
      - {from: APPLICATION, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
      - {from: DELINQUENT, to: CANCELLED, action: cancel}
      - {from: PAID_OFF, to: CANCELLED, action: cancel}
      - {from: DEFAULTED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a bank loan is ended"
      description: "When a bank loan is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "BANK-LOAN-FOLLOW-UP-{{id}}"
              name: "Follow up on bank loan {{loan_number}}"
              description: "Bank loan {{loan_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One bank loan is a credit facility under which a lender advances money to a borrower, recording the principal, interest rate, term and repayment standing the business must track."
    businessMeaning: BankLoan is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate BankLoan records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization,
      Currency. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical BankLoan record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "The loan starts as an application, is approved by the lender and becomes active when funds are drawn; treasury monitors repayments and flags it delinquent when payments are missed, records it as paid off once the balance is cleared, and accounting and reporting read it for interest accruals, debt schedules and covenant checks."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BANK-LOAN
