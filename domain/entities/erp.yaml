entity:
  name: ERP
  namespace: cedm.domain
  kind: root_business_entity
  description: An ERP represents an enterprise business application context that manages shared master data, organizational structures, business processes, transactions, documents, workflows, and operational resources.
  ui:
    icon: table
    recordLabel: [code, name]
  identity:
    key: erpId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: erpId
    type: uuid
    required: true
    immutable: true
    description: Globally unique identifier for the ERP instance.
    help:
      summary: The permanent system identifier of the erp record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a erp store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 50
    description: Stable business code used to identify the ERP instance.
    help:
      summary: The code of the ERP context, such as ACME-PROD.
      usage: Used by integrations to say which system data comes from.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 200
    description: Human-readable name of the ERP instance.
    help:
      summary: The name of the context.
      usage: Shown in administration screens.
      relationshipContext: Identifies it for people.
  - name: description
    type: string
    required: false
    maxLength: 2000
    description: Business description of the ERP instance.
    help:
      summary: What the context covers.
      usage: Read by administrators and integrators.
      relationshipContext: Free text.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    description: Lifecycle state of the ERP instance.
    help:
      summary: Whether the context is live.
      usage: Moved on by the system owner.
      relationshipContext: Only active contexts accept transactions.
      valueSemantics:
        DRAFT: Being implemented.
        ACTIVE: Live.
        SUSPENDED: Frozen, for example during a migration.
        RETIRED: Replaced.
  - name: baseCurrencyId
    type: reference
    target: Currency
    required: false
    description: Default accounting currency for the ERP context.
    help:
      summary: The currency the context reports in by default.
      usage: Used where a company does not state its own.
      relationshipContext: Usually the group's reporting currency.
  - name: timezone
    type: timezone
    required: false
    description: Default timezone for date/time interpretation.
    help:
      summary: The default time zone, such as Europe/Paris.
      usage: Used to show times where a site does not state its own.
      relationshipContext: An IANA time-zone name.
  - name: locale
    type: locale
    required: false
    description: Default locale for presentation and localization.
    help:
      summary: The default language and formatting, such as fr-FR.
      usage: Used for documents and screens where a user does not state their own.
      relationshipContext: A BCP 47 tag.
  - name: createdAt
    type: datetime
    required: true
    immutable: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating ERP records, where applicable.
      relationshipContext: Its meaning is specific to ERP; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: createdBy
    type: reference
    target: Party
    required: false
    immutable: true
    systemManaged: true
    help:
      summary: The party or user responsible for creating the record. It links the record to its audit actor and should not normally be supplied as ordinary business data.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating ERP records, where applicable.
      relationshipContext: This field connects ERP to Party. The reference establishes business context between the two entities and lets processes navigate from this record to the related Party.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording the latest modification of the record. It supports synchronization, audit, and change detection.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating ERP records, where applicable.
      relationshipContext: Its meaning is specific to ERP; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: updatedBy
    type: reference
    target: Party
    required: false
    systemManaged: true
    help:
      summary: The party or user responsible for the latest modification. It provides the audit link for the most recent change.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating ERP records, where applicable.
      relationshipContext: This field connects ERP to Party. The reference establishes business context between the two entities and lets processes navigate from this record to the related Party.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
  relationships:
  - name: organizations
    target: Organization
    cardinality: 0..*
    ownership: reference
    description: Legal, operational, or organizational units belonging to the ERP context.
    help:
      summary: The organizations the context manages.
      usage: Added during implementation.
      cardinalityMeaning: A context manages many organizations; an organization may appear in more than one context during a migration.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: parties
    target: Party
    cardinality: 0..*
    ownership: reference
    description: Parties participating in business activities managed by the ERP.
    help:
      summary: Parties managed in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: locations
    target: Location
    cardinality: 0..*
    ownership: reference
    description: Physical or logical locations known to the ERP.
    help:
      summary: Locations managed in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: products
    target: Product
    cardinality: 0..*
    ownership: reference
    description: Products and services managed by the ERP.
    help:
      summary: Products managed in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: businessProcesses
    target: BusinessProcess
    cardinality: 0..*
    ownership: reference
    description: Business processes configured or executed in the ERP.
    help:
      summary: Business processes run in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: workflows
    target: Workflow
    cardinality: 0..*
    ownership: reference
    description: Workflow definitions available to the ERP.
    help:
      summary: Workflows run in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    description: Documents managed within the ERP context.
    help:
      summary: Documents managed in the context.
      usage: Listed from the context.
      cardinalityMeaning: Many-to-many.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  invariants:
  - id: ERP-001
    rule: code must be unique within the ERP namespace.
  - id: ERP-002
    rule: status RETIRED is terminal unless an explicit reactivation policy exists.
  - id: ERP-003
    rule: erpId cannot change after creation.
  lifecycle:
    states:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    transitions:
    - from: DRAFT
      to: ACTIVE
    - from: ACTIVE
      to: SUSPENDED
    - from: SUSPENDED
      to: ACTIVE
    - from: ACTIVE
      to: RETIRED
    - from: SUSPENDED
      to: RETIRED
  audit:
    enabled: true
    trackCreatedBy: true
    trackCreatedAt: true
    trackUpdatedBy: true
    trackUpdatedAt: true
  tags:
  - enterprise
  - erp
  - root
  - master-data
  - business-application
  help:
    summary: Represents a root business entity called ERP within the CEDM business model.
    businessMeaning: ERP is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Location, Product, BusinessProcess, Workflow, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Defined once per business system context — the company's ERP instance — to record its base currency, time zone and locale, and to group the organizations, processes and master data it manages. Integrations and reports name the context they belong to.
    lifecycle: Drafted during implementation, active once live, suspended during a migration freeze, and retired when replaced.
    example: ERP context ACME-PROD 'ACME production ERP', base currency EUR, Europe/Paris, fr-FR, managing ACME France SAS and ACME Iberia SL, live since January 2021.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ERP
