entity:
  name: ERP
  namespace: cedm.domain
  kind: root_business_entity
  description: An ERP represents an enterprise business application context that manages shared master data, organizational structures, business processes, transactions, documents, workflows, and operational resources.
  ui:
    icon: table
  identity:
    key: erpId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: erpId
      type: uuid
      required: true
      immutable: true
      description: Globally unique identifier for the ERP instance.
      help:
        summary: The identity of the installation, fixed for its whole life.
        usage: Generated at setup; scoped records carry it so data from different installations never mixes.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 50
      description: Stable business code used to identify the ERP instance.
      help:
        summary: The short unique code of the installation, such as ACME-PROD.
        usage: Chosen at setup; used in integrations and environment names, so it should not change.
    - name: name
      type: string
      required: true
      maxLength: 200
      description: Human-readable name of the ERP instance.
      help:
        summary: The name of the installation as users see it.
        usage: Shown in the application header and on reports.
    - name: description
      type: string
      required: false
      maxLength: 2000
      description: Business description of the ERP instance.
      help:
        summary: A description of what the installation covers and who it is for.
        usage: Written by the administrator; helps new users tell environments apart.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      description: Lifecycle state of the ERP instance.
      help:
        summary: Whether the installation is being set up, live, paused or closed.
        usage: Moved by administrators; only ACTIVE installations accept business transactions.
        valueSemantics:
          DRAFT: Being configured; not yet live.
          ACTIVE: Live and in use.
          SUSPENDED: Paused, for example during a migration; no new business activity.
          RETIRED: Closed down; kept for history.
    - name: baseCurrencyId
      type: reference
      target: Currency
      required: false
      description: Default accounting currency for the ERP context.
      help:
        summary: The currency in which the installation reports consolidated figures.
        usage: Chosen at setup; other currencies are converted to it for group reporting.
    - name: timezone
      type: timezone
      required: false
      description: Default timezone for date/time interpretation.
      help:
        summary: The default time zone for displaying and interpreting dates and times.
        usage: Chosen at setup; users and organisations may override it.
    - name: locale
      type: locale
      required: false
      description: Default locale for presentation and localization.
      help:
        summary: The default language and regional formatting for the installation.
        usage: Chosen at setup; controls number, date and currency formats where a user has no preference.
    - name: createdAt
      type: datetime
      required: true
      immutable: true
      systemManaged: true
      help:
        summary: When the installation record was created.
        usage: Set by the system and never edited.
    - name: createdBy
      type: reference
      target: Party
      required: false
      immutable: true
      systemManaged: true
      help:
        summary: The party that created the installation record.
        usage: Set by the system from the signed-in user.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the installation record last changed.
        usage: Set by the system on every change.
    - name: updatedBy
      type: reference
      target: Party
      required: false
      systemManaged: true
      help:
        summary: The party that last changed the installation record.
        usage: Set by the system from the signed-in user.
  relationships:
    - name: organizations
      target: Organization
      cardinality: 1..*
      ownership: reference
      description: Legal, operational, or organizational units belonging to the ERP context.
      help:
        summary: The organisations, such as legal entities and units, managed in this installation.
        usage: Added as organisations are created; read to scope users, data and reports.
        cardinalityMeaning: 'At least one organisation: an installation with none manages nothing.'
        workflowRole: Every transaction and master record is ultimately owned by one of these organisations.
    - name: parties
      target: Party
      cardinality: 0..*
      ownership: reference
      description: Parties participating in business activities managed by the ERP.
      help:
        summary: The customers, suppliers, people and other parties known to the installation.
        usage: Shared across organisations so a party is recorded once.
        cardinalityMeaning: Any number, growing as the business trades.
        workflowRole: Lets several organisations deal with the same party without duplicating it.
    - name: locations
      target: Location
      cardinality: 0..*
      ownership: reference
      description: Physical or logical locations known to the ERP.
      help:
        summary: The sites, buildings and places known to the installation.
        usage: Shared master data used by addresses, inventory and logistics.
        cardinalityMeaning: Any number.
        workflowRole: Gives every organisation the same set of places to refer to.
    - name: products
      target: Product
      cardinality: 0..*
      ownership: reference
      description: Products and services managed by the ERP.
      help:
        summary: The products and services in the shared catalogue.
        usage: Shared master data used by sales, purchasing and inventory.
        cardinalityMeaning: Any number.
        workflowRole: Keeps one catalogue for the whole installation.
    - name: businessProcesses
      target: BusinessProcess
      cardinality: 0..*
      ownership: reference
      description: Business processes configured or executed in the ERP.
      help:
        summary: The business processes defined for the installation.
        usage: Maintained by process owners; referenced by workflows and tasks.
        cardinalityMeaning: Any number.
        workflowRole: Provide the agreed way of working that workflows automate.
    - name: workflows
      target: Workflow
      cardinality: 0..*
      ownership: reference
      description: Workflow definitions available to the ERP.
      help:
        summary: The workflows that run in the installation.
        usage: Created by administrators and process owners to automate processes.
        cardinalityMeaning: Any number.
        workflowRole: Carry out the installation's processes automatically.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      description: Documents managed within the ERP context.
      help:
        summary: The documents held in the installation.
        usage: Created as business activity is evidenced; searched and retrieved by users.
        cardinalityMeaning: Any number.
        workflowRole: Form the written record of what the installation did.
  invariants:
    - id: ERP-001
      rule: code must be unique within the ERP namespace.
    - id: ERP-002
      rule: status RETIRED is terminal unless an explicit reactivation policy exists.
    - id: ERP-003
      rule: erpId cannot change after creation.
  lifecycle:
    states:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - RETIRED
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
    initial: DRAFT
    terminal:
      - RETIRED
    attribute: status
  audit:
    enabled: true
    trackCreatedBy: true
    trackCreatedAt: true
    trackUpdatedBy: true
    trackUpdatedAt: true
  tags:
    - enterprise
    - erp
    - root
    - master-data
    - business-application
  help:
    summary: The root record of an enterprise application context, naming the installation and the defaults for everything managed inside it.
    businessMeaning: An ERP installation needs one place that says what it is, which currency it reports in and which time zone and language apply. Every organisation, party, product and process belongs to that context, so this record is where scoping starts.
    usage: Created once when an installation is set up; read as the context for every other record and changed rarely, by administrators.
    relationshipContext: The context aggregates its Organizations and holds the shared Parties, Locations, Products, Business Processes, Workflows and Documents that those organisations use.
    lifecycle: A context is drafted while being configured, becomes active when it goes live, may be suspended, and is retired when it is closed down. Reactivation after retirement needs an explicit policy.
    example: 'The Acme Group installation: euro reporting currency, Central European time, English locale, containing six legal entities.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ERP
