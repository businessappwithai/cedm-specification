# CEDM Domain Entity: ERP
# Canonical domain specification. Entity definitions are intentionally
# implementation-neutral and may be mapped to SQL, CDS, JSON Schema,
# OpenAPI, GraphQL, or application-specific persistence models.

entity:
  name: ERP
  namespace: cedm.domain
  kind: root_business_entity
  description: >-
    An ERP represents an enterprise business application context that manages
    shared master data, organizational structures, business processes,
    transactions, documents, workflows, and operational resources.

  identity:
    key: erpId
    type: uuid
    generated: true
    immutable: true

  attributes:
    - name: erpId
      type: uuid
      required: true
      immutable: true
      description: Globally unique identifier for the ERP instance.

    - name: code
      type: string
      required: true
      unique: true
      maxLength: 50
      description: Stable business code used to identify the ERP instance.

    - name: name
      type: string
      required: true
      maxLength: 200
      description: Human-readable name of the ERP instance.

    - name: description
      type: string
      required: false
      maxLength: 2000
      description: Business description of the ERP instance.

    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      description: Lifecycle state of the ERP instance.

    - name: baseCurrency
      type: currency_code
      required: false
      description: Default accounting currency for the ERP context.

    - name: timezone
      type: timezone
      required: false
      description: Default timezone for date/time interpretation.

    - name: locale
      type: locale
      required: false
      description: Default locale for presentation and localization.

    - name: createdAt
      type: datetime
      required: true
      immutable: true
      systemManaged: true

    - name: createdBy
      type: reference
      target: Party
      required: false
      immutable: true
      systemManaged: true

    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true

    - name: updatedBy
      type: reference
      target: Party
      required: false
      systemManaged: true

  relationships:
    - name: organizations
      target: Organization
      cardinality: "1..*"
      ownership: aggregate
      description: Legal, operational, or organizational units belonging to the ERP context.

    - name: parties
      target: Party
      cardinality: "0..*"
      ownership: reference
      description: Parties participating in business activities managed by the ERP.

    - name: locations
      target: Location
      cardinality: "0..*"
      ownership: reference
      description: Physical or logical locations known to the ERP.

    - name: products
      target: Product
      cardinality: "0..*"
      ownership: reference
      description: Products and services managed by the ERP.

    - name: businessProcesses
      target: BusinessProcess
      cardinality: "0..*"
      ownership: reference
      description: Business processes configured or executed in the ERP.

    - name: workflows
      target: Workflow
      cardinality: "0..*"
      ownership: reference
      description: Workflow definitions available to the ERP.

    - name: documents
      target: Document
      cardinality: "0..*"
      ownership: reference
      description: Documents managed within the ERP context.

  invariants:
    - id: ERP-001
      rule: code must be unique within the ERP namespace.

    - id: ERP-002
      rule: status RETIRED is terminal unless an explicit reactivation policy exists.

    - id: ERP-003
      rule: erpId cannot change after creation.

  lifecycle:
    states:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - RETIRED
    transitions:
      - from: DRAFT
        to: ACTIVE
      - from: ACTIVE
        to: SUSPENDED
      - from: SUSPENDED
        to: ACTIVE
      - from: ACTIVE
        to: RETIRED
      - from: SUSPENDED
        to: RETIRED

  audit:
    enabled: true
    trackCreatedBy: true
    trackCreatedAt: true
    trackUpdatedBy: true
    trackUpdatedAt: true

  tags:
    - enterprise
    - erp
    - root
    - master-data
    - business-application

specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ERP
