entity:
  name: MaterialIssue
  namespace: cedm.domain
  kind: manufacturing_material_transaction
  description: An auditable authorization and execution record for component material consumed or staged to a ManufacturingWorkOrder, with physical stock effect represented by attributable InventoryMovement.
  ui:
    icon: file-text
  identity: {key: materialIssueId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: materialIssueId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the material issue record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a material issue store this identifier. The number or code people quote is a separate field.
  - name: issueNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the issue.
      businessMeaning: Operational traceability identifier.
      usage: Printed on the issue slip.
      relationshipContext: Unique.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How much material was issued.
      businessMeaning: Amount authorized for production consumption.
      usage: Entered or scanned at issue.
      relationshipContext: In the product's stock unit.
  - name: issuedAt
    type: datetime
    required: true
    help:
      summary: When the material was issued.
      businessMeaning: Establishes production consumption chronology.
      usage: Recorded at issue; cost is booked to the order from this time.
      relationshipContext: Not in the future.
  - name: issueType
    type: enum
    required: true
    default: ISSUE
    values: [ISSUE, RETURN]
    help:
      summary: Whether material goes to the order or comes back from it.
      usage: Returns reverse earlier issues.
      relationshipContext: Return quantities are entered as positive with this type.
      valueSemantics:
        ISSUE: Material issued to the order.
        RETURN: Unused material returned from the order.
  - name: costAmount
    type: Money
    required: false
    help:
      summary: The cost of the material issued.
      usage: Booked to the production order.
      relationshipContext: At the product's current cost.
  relationships:
  - name: workOrder
    target: ManufacturingWorkOrder
    cardinality: '1'
    ownership: reference
    help:
      summary: The production order the material is for.
      businessMeaning: Identifies authorized manufacturing demand.
      workflowRole: Must be released/in progress according to policy.
      usage: Chosen at issue.
      cardinalityMeaning: Exactly one.
      context: The order's actual material cost is summed from its issues.
  - name: bomComponent
    target: BOMComponent
    cardinality: 0..1
    ownership: reference
    help:
      summary: The bill-of-materials line the issue fulfils.
      businessMeaning: Connects actual issue to standard material demand.
      workflowRole: Quantity/product normally reconcile with effective BOM.
      usage: Set when issuing against the order's component list.
      cardinalityMeaning: At most one.
      context: Lets planned and actual usage be compared.
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The material issued.
      businessMeaning: Identifies consumed item.
      workflowRole: Must match BOM component or approved substitution.
      usage: Chosen or scanned at issue.
      cardinalityMeaning: Exactly one.
      context: Its stock decreases.
  - name: lot
    target: Lot
    cardinality: 0..1
    ownership: reference
    help:
      summary: The lot issued, for lot-tracked materials.
      businessMeaning: Preserves input batch genealogy.
      workflowRole: Lot must be eligible and available.
      usage: Scanned at issue.
      cardinalityMeaning: At most one.
      context: Traceability from finished goods back to material lots relies on it.
  - name: serialNumbers
    target: SerialNumber
    cardinality: "0..*"
    ownership: reference
    help:
      summary: The serial numbers issued.
      businessMeaning: Preserves unit-level input genealogy.
      workflowRole: Serial units must be eligible at issue location.
      usage: Scanned at issue.
      cardinalityMeaning: Any number.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: inventoryMovement
    target: InventoryMovement
    cardinality: '1'
    ownership: reference
    help:
      summary: The stock movement that records the issue.
      businessMeaning: InventoryMovement remains authoritative stock ledger.
      workflowRole: Posting must be idempotent and reconcile quantity/product/lot/serial.
      usage: Created at issue.
      cardinalityMeaning: Exactly one.
      context: Updates the stock balance.
  invariants:
  - {id: MATERIAL-ISSUE-001, rule: quantity must be greater than zero.}
  - {id: MATERIAL-ISSUE-002, rule: Executed material issue must have exactly one attributable posted inventory effect and retries must not duplicate consumption.}
  - {id: MATERIAL-ISSUE-003, rule: Lot and serial identities must belong to the issued Product and be eligible at the source location.}
  - {id: MATERIAL-ISSUE-004, rule: Posted consumption is immutable; correction uses reversal or compensating issue/return.}
  - {id: MATERIAL-ISSUE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: Production material-consumption transaction with full inventory and genealogy provenance.
    businessMeaning: MaterialIssue explains why material was consumed; InventoryMovement records the physical stock consequence.
    usage: Shop-floor staging/consumption, inventory, costing, genealogy, recall, and variance analysis.
    relationshipContext: ManufacturingWorkOrder authorizes demand, BOMComponent supplies standard requirement, Lot/SerialNumber preserve provenance.
    lifecycle: Prepared → validated → issued/posted → immutable history; corrections compensate.
    changePropagation: Issue posting updates inventory projections and manufacturing material reconciliation and contributes input genealogy for produced output.
    example: 'Issue MI-24-8821: 500 battery packs BP-18V to work order MO-24-3310, issued 3 June 2024 06:15, cost 11,250 EUR.'
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-MATERIAL-ISSUE}
