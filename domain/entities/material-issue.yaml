entity:
  name: MaterialIssue
  namespace: cedm.domain
  kind: manufacturing_material_transaction
  description: An auditable authorization and execution record for component material consumed or staged to a ManufacturingWorkOrder, with physical stock effect represented by attributable InventoryMovement.
  ui:
    icon: file-text
  identity: {key: materialIssueId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: materialIssueId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of material issue., businessMeaning: Identifies one governed production-consumption transaction., usage: "Inventory, manufacturing genealogy, costing, and audit.", relationshipContext: Links work order/BOM demand to stock movement., requiredMeaning: Required.}}
  - {name: issueNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: Human-facing issue reference., businessMeaning: Operational traceability identifier., usage: "Shop floor, warehouse, and audit.", relationshipContext: Distinct from inventory movement number., requiredMeaning: Required.}}
  - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Component quantity issued., businessMeaning: Amount authorized for production consumption., usage: "Material reconciliation, variance, and costing.", relationshipContext: Interpreted with component Product/UOM/lot/serial., requiredMeaning: Required.}}
  - {name: issuedAt, type: datetime, required: true, help: {summary: Effective material issue time., businessMeaning: Establishes production consumption chronology., usage: "Inventory, genealogy, costing, and audit.", relationshipContext: Must align with attributable movement., requiredMeaning: Required.}}
  relationships:
  - {name: workOrder, target: ManufacturingWorkOrder, cardinality: '1', ownership: reference, help: {summary: Production order consuming material., businessMeaning: Identifies authorized manufacturing demand., usage: Material reconciliation and genealogy., cardinalityMeaning: Exactly one work order., workflowRole: Must be released/in progress according to policy.}}
  - {name: bomComponent, target: BOMComponent, cardinality: 0..1, ownership: reference, help: {summary: Planned BOM requirement being consumed., businessMeaning: Connects actual issue to standard material demand., usage: Variance and genealogy., cardinalityMeaning: Optional for authorized unplanned material., workflowRole: Quantity/product normally reconcile with effective BOM.}}
  - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Component material issued., businessMeaning: Identifies consumed item., usage: Inventory and costing., cardinalityMeaning: Exactly one Product., workflowRole: Must match BOM component or approved substitution.}}
  - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {summary: Consumed component lot., businessMeaning: Preserves input batch genealogy., usage: Traceability and recall., cardinalityMeaning: Required when product is lot-controlled., workflowRole: Lot must be eligible and available.}}
  - {name: serialNumbers, target: SerialNumber, cardinality: "0..*", ownership: reference, help: {summary: Serialized component units consumed., businessMeaning: Preserves unit-level input genealogy., usage: "Traceability, service, and recall.", cardinalityMeaning: Required according to serialization policy., workflowRole: Serial units must be eligible at issue location.}, inverseCardinality: 0..*}
  - {name: inventoryMovement, target: InventoryMovement, cardinality: '1', ownership: reference, help: {summary: Posted stock event implementing physical issue., businessMeaning: InventoryMovement remains authoritative stock ledger., usage: Reconciliation and audit., cardinalityMeaning: Exactly one attributable posting for executed issue., workflowRole: Posting must be idempotent and reconcile quantity/product/lot/serial.}}
  invariants:
  - {id: MATERIAL-ISSUE-001, rule: quantity must be greater than zero.}
  - {id: MATERIAL-ISSUE-002, rule: Executed material issue must have exactly one attributable posted inventory effect and retries must not duplicate consumption.}
  - {id: MATERIAL-ISSUE-003, rule: Lot and serial identities must belong to the issued Product and be eligible at the source location.}
  - {id: MATERIAL-ISSUE-004, rule: Posted consumption is immutable; correction uses reversal or compensating issue/return.}
  - {id: MATERIAL-ISSUE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: Production material-consumption transaction with full inventory and genealogy provenance.
    businessMeaning: MaterialIssue explains why material was consumed; InventoryMovement records the physical stock consequence.
    usage: Shop-floor staging/consumption, inventory, costing, genealogy, recall, and variance analysis.
    relationshipContext: ManufacturingWorkOrder authorizes demand, BOMComponent supplies standard requirement, Lot/SerialNumber preserve provenance.
    lifecycle: Prepared → validated → issued/posted → immutable history; corrections compensate.
    changePropagation: Issue posting updates inventory projections and manufacturing material reconciliation and contributes input genealogy for produced output.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-MATERIAL-ISSUE}
