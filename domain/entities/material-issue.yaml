entity:
  name: MaterialIssue
  namespace: cedm.domain
  kind: manufacturing_material_transaction
  description: An auditable authorization and execution record for component material consumed or staged to a ManufacturingWorkOrder, with physical stock effect represented by attributable InventoryMovement.
  ui:
    icon: file-text
  identity: {key: materialIssueId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: materialIssueId, type: uuid, required: true, immutable: true, help: {summary: The identity of the material issue., usage: Generated on creation; the stock movement and the work order's cost refer to it., businessMeaning: Identifies one governed production-consumption transaction., relationshipContext: Links work order/BOM demand to stock movement.}}
    - {name: issueNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: 'The document number of the issue, printed on the pick list.', usage: Allocated from a number series; unique; used by storekeepers and in audits., businessMeaning: Operational traceability identifier., relationshipContext: Distinct from inventory movement number.}}
    - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: The quantity of the component issued to the work order., usage: Entered at issue; the stock movement posts the same quantity and the work order's consumed quantity increases by it., businessMeaning: Amount authorized for production consumption., relationshipContext: Interpreted with component Product/UOM/lot/serial.}}
    - {name: issuedAt, type: datetime, required: true, help: {summary: When the material left the store for production., usage: Set at issue; the consumption is costed as of this time., businessMeaning: Establishes production consumption chronology., relationshipContext: Must align with attributable movement.}}
  relationships:
    - {name: workOrder, target: ManufacturingWorkOrder, cardinality: '1', ownership: reference, help: {summary: The manufacturing work order that receives the material., usage: Chosen when the issue is made., cardinalityMeaning: 'Exactly one work order: material is issued to one production job at a time.', workflowRole: Adds the material to the job's actual consumption and cost., businessMeaning: Identifies authorized manufacturing demand.}}
    - {name: bomComponent, target: BOMComponent, cardinality: 0..1, ownership: reference, help: {summary: The bill-of-material line that the issue satisfies., usage: Linked where the issue follows the bill; left empty for substitutions or extras., cardinalityMeaning: At most one component line., workflowRole: Lets production compare actual to planned consumption., businessMeaning: Connects actual issue to standard material demand.}}
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: The component product that is issued., usage: Chosen when the issue is made., cardinalityMeaning: 'Exactly one product: each issue supplies a single item.', workflowRole: Determines which stock is reduced., businessMeaning: Identifies consumed item.}}
    - {name: lot, target: Lot, cardinality: 0..1, ownership: reference, help: {summary: The lot that the material is taken from., usage: Chosen for lot-controlled components., cardinalityMeaning: At most one lot., workflowRole: Provides traceability from the finished goods back to the material lot., businessMeaning: Preserves input batch genealogy.}}
    - {name: serialNumbers, target: SerialNumber, cardinality: "0..*", ownership: reference, help: {summary: The serialised units issued., usage: Entered for serialised components., cardinalityMeaning: 'Any number of serial numbers, one for each unit issued.', workflowRole: Gives unit-level traceability into the finished product., businessMeaning: Preserves unit-level input genealogy.}}
    - {name: inventoryMovement, target: InventoryMovement, cardinality: '1', ownership: reference, help: {summary: The stock movement that carried out the issue., usage: Created when the issue is posted; read to trace the stock effect., cardinalityMeaning: 'Exactly one movement: each posted issue is one stock transaction.', workflowRole: Keeps the stock ledger and the work order consistent., businessMeaning: InventoryMovement remains authoritative stock ledger.}}
  invariants:
    - {id: MATERIAL-ISSUE-001, rule: quantity must be greater than zero.}
    - {id: MATERIAL-ISSUE-002, rule: Executed material issue must have exactly one attributable posted inventory effect and retries must not duplicate consumption.}
    - {id: MATERIAL-ISSUE-003, rule: Lot and serial identities must belong to the issued Product and be eligible at the source location.}
    - {id: MATERIAL-ISSUE-004, rule: Posted consumption is immutable; correction uses reversal or compensating issue/return.}
    - {id: MATERIAL-ISSUE-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  help:
    summary: A record that component material was issued, or staged, to a manufacturing work order, with the stock effect carried out by a stock movement.
    businessMeaning: Production consumes material, and the books must show exactly which material went to which job. The issue states what was supplied to the work order, from which lot, and ties it to the stock movement that reduced inventory.
    usage: Created when a storekeeper issues components to a job; read by production control, costing and traceability.
    relationshipContext: An issue is for one ManufacturingWorkOrder and one Product, may follow a BOMComponent line, may name a Lot or SerialNumbers, and is posted through an InventoryMovement.
    example: 40 steel brackets from lot L240318 issued to work order MO-5512 for the bracket assembly.
    lifecycle: Prepared → validated → issued/posted → immutable history; corrections compensate.
    changePropagation: Issue posting updates inventory projections and manufacturing material reconciliation and contributes input genealogy for produced output.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-MATERIAL-ISSUE}
