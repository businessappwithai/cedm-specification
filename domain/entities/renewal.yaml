entity:
  name: Renewal
  namespace: cedm.domain
  kind: subscription_lifecycle
  description: The renewal of a customer's subscription for a further term — automatic or by quote — with the old and new terms, price change, and the outcome, from which renewal rates and churn are measured.
  ui:
    icon: repeat
    recordLabel: [renewalNumber]
  identity: {key: renewalId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: renewalId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the renewal record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a renewal store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: UPCOMING
    values: [UPCOMING, QUOTED, RENEWED, CHURNED]
    help:
      summary: Where the renewal stands.
      usage: Moved on by the account manager.
      relationshipContext: Renewals still upcoming close to the term end are escalated.
      valueSemantics:
        UPCOMING: The term end is approaching; not yet worked.
        QUOTED: A renewal offer has been made.
        RENEWED: The customer renewed.
        CHURNED: The customer did not renew.
  - name: renewalNumber
    type: string
    required: true
    unique: true
    maxLength: 40
    help:
      summary: The reference of the renewal.
      usage: Assigned when the renewal is created.
      relationshipContext: Unique.
  - name: currentTermEnd
    type: date
    required: true
    help:
      summary: The last day of the subscription's current term.
      usage: Copied from the subscription; the renewal must be decided before it.
      relationshipContext: The new term starts the day after.
  - name: newTermStart
    type: date
    required: false
    help:
      summary: The first day of the renewed term.
      usage: Set when the renewal is confirmed.
      relationshipContext: Usually the day after the current term end.
  - name: newTermEnd
    type: date
    required: false
    help:
      summary: The last day of the renewed term.
      usage: Set when the renewal is confirmed.
      relationshipContext: Not earlier than the new term start.
  - name: currentValue
    type: Money
    required: false
    help:
      summary: The recurring value of the subscription in its current term.
      usage: Copied from the subscription; the basis for retention figures.
      relationshipContext: Annualised for comparison.
  - name: renewalValue
    type: Money
    required: false
    help:
      summary: The recurring value offered or agreed for the new term.
      usage: Entered with the quote; compared with the current value for expansion or contraction.
      relationshipContext: In the subscription's currency.
  - name: isAutomatic
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the subscription renews automatically.
      usage: Taken from the subscription terms.
      relationshipContext: Automatic renewals still appear here so they can be reviewed.
  - name: churnReason
    type: string
    required: false
    maxLength: 300
    help:
      summary: Why the customer did not renew.
      usage: Recorded when the renewal is lost; churn analysis groups by it.
      relationshipContext: Present only on churned renewals.
  relationships:
  - name: customer
    target: Customer
    cardinality: 0..1
    ownership: reference
    help:
      summary: The customer whose subscription is renewing.
      usage: Copied from the subscription.
      cardinalityMeaning: One per renewal.
      context: The account manager of the customer works the renewal.
  - name: subscription
    target: Subscription
    cardinality: 0..1
    ownership: reference
    help:
      summary: The subscription being renewed.
      usage: Set when the renewal is created.
      cardinalityMeaning: One per renewal.
      context: The subscription's term follows the confirmed renewal.
  - name: newPlan
    target: SubscriptionPlan
    cardinality: 0..1
    ownership: reference
    help:
      summary: The plan for the new term, when it changes.
      usage: Set when the customer upgrades or downgrades on renewal.
      cardinalityMeaning: At most one.
      context: Empty when the plan stays the same.
  invariants:
  - {id: RENEWAL-001, rule: The new term does not end before it starts., violatedWhen: new_term_end != null and new_term_start != null and new_term_end < new_term_start, message: The new term ends before it starts.}
  - {id: RENEWAL-002, rule: A churned renewal records why., violatedWhen: status == "CHURNED" and churn_reason == null, message: Give the reason the customer did not renew.}
  lifecycle:
    title: Renewal Lifecycle
    attribute: status
    states: [UPCOMING, QUOTED, RENEWED, CHURNED]
    initial: UPCOMING
    terminal: [RENEWED, CHURNED]
    transitions:
    - {from: UPCOMING, to: QUOTED, action: quote}
    - {from: QUOTED, to: RENEWED, action: renew}
    - {from: UPCOMING, to: RENEWED, action: renew}
    - {from: QUOTED, to: CHURNED, action: churn}
    - {from: UPCOMING, to: CHURNED, action: churn}
  help:
    summary: One subscription coming up for a new term, and whether the customer stayed.
    businessMeaning: Recurring revenue depends on customers renewing. Each renewal records the term ending, the term offered, the price change and the outcome, so account managers can work upcoming renewals in time and the business can measure gross and net retention.
    usage: Created ahead of each subscription term end; account managers contact the customer, quote the renewal, and record the outcome. Renewal forecasts and churn reports read open and closed renewals.
    relationshipContext: A renewal is for one Subscription of one Customer, on a SubscriptionPlan that may differ from the current one when the customer upgrades or downgrades on renewal.
    lifecycle: Upcoming until worked, then quoted, then renewed or churned. An automatic renewal goes straight to renewed unless the customer cancels.
    workflowContext: Renewal management, customer success, revenue forecasting, churn analysis.
    example: Renewal RN-2024-0412 of subscription SUB-4471 (Contoso), term ending 31 March 2024; quoted 'Pro, annual', 12 users at 529 EUR/user/year (+5%); renewed 22 March for 1 April 2024 – 31 March 2025.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-RENEWAL}
