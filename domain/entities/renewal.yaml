entity:
  name: Renewal
  namespace: cedm.domain
  kind: subscription_lifecycle
  description: A governed subscription or service continuation event extending commercial entitlement into a subsequent term.
  ui:
    icon: table
  identity: {key: renewalId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: renewalId, type: uuid, required: true, immutable: true, help: {summary: "The permanent reference linking this renewal to the customer and the term it extends.", businessMeaning: Identifies one governed Renewal record., usage: "Enterprise processing, integration, reporting and audit.", relationshipContext: Referenced by compatible domain workflows., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    help: {summary: "Shows whether the renewal is being prepared, in effect, completed or cancelled before taking effect.", businessMeaning: Indicates usability/execution state of Renewal., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}, requiredMeaning: Required.}
  relationships:
  - {name: customer, target: Customer, cardinality: 0..1, ownership: reference, help: {summary: Customer owning or economically affected by record., businessMeaning: Supplies commercial party context., usage: Billing and entitlement., cardinalityMeaning: Optional for reusable definitions; required by applicable transaction policy., workflowRole: Financial settlement remains separate.}}
  invariants:
  - {id: RENEWAL-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Renewal Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a renewal is ended"
      description: "When a renewal is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "RENEWAL-FOLLOW-UP-{{id}}"
              name: "Follow up on renewal {{id}}"
              description: "Renewal {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One renewal of a customer's subscription or service agreement into a new term, such as a yearly software licence renewal, kept so continuation, pricing and entitlement for the next term are tracked."
    purpose: Provide canonical enterprise semantics for Renewal while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: A governed subscription or service continuation event extending commercial entitlement into a subsequent term.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-RENEWAL}
