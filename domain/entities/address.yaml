entity:
  name: Address
  namespace: cedm.domain
  kind: reusable_master_entity
  description: A structured postal, physical, billing, shipping, registered, or other address that may be associated with a Party or Location and may be captured as transaction-time address evidence.
  ui:
    icon: map-pin
  identity: {key: addressId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: addressId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the address record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a address store this identifier. The number or code people quote is a separate field.
  - name: addressType
    type: enum
    required: true
    values: [RESIDENTIAL, BUSINESS, BILLING, SHIPPING, REGISTERED, POSTAL, OTHER]
    help:
      summary: What the address is used for.
      usage: Chosen when the address is entered; processes pick addresses by type.
      relationshipContext: A party may have one primary address of each type.
      valueSemantics:
        RESIDENTIAL: Where a person lives.
        BUSINESS: Where an organization operates.
        BILLING: Where invoices and statements are sent.
        SHIPPING: Where goods are delivered.
        REGISTERED: The registered office of a legal entity.
        POSTAL: A mailing address, such as a PO box.
        OTHER: Any other use.
  - name: line1
    type: string
    required: true
    maxLength: 200
    help:
      summary: The first line of the street address — street and number, or PO box.
      usage: Printed first on labels and documents.
      relationshipContext: Required for every address.
  - name: line2
    type: string
    required: false
    maxLength: 200
    help:
      summary: A second address line, such as a building, floor or suite.
      usage: Printed after the first line when present.
      relationshipContext: Printed between the first line and the city when present.
  - name: line3
    type: string
    required: false
    maxLength: 200
    help:
      summary: A third address line, for countries or sites that need one.
      usage: Printed after the second line when present.
      relationshipContext: Printed after the second line when present; most countries need only two lines.
  - name: cityName
    type: string
    required: false
    maxLength: 150
    help:
      summary: The city as written, when it is not in the city list.
      usage: Used on labels when no city record is linked.
      relationshipContext: Either a city from the list or this name must be given.
  - name: postalCode
    type: string
    required: false
    maxLength: 30
    help:
      summary: The postal or ZIP code.
      usage: Printed on labels; used for routing and some tax rules.
      relationshipContext: Format depends on the country.
  - name: latitude
    type: decimal
    required: false
    precision: 10
    scale: 7
    help:
      summary: The latitude of the address, in decimal degrees.
      usage: Set by geocoding; used for routing and maps.
      relationshipContext: Between -90 and 90.
  - name: longitude
    type: decimal
    required: false
    precision: 10
    scale: 7
    help:
      summary: The longitude of the address, in decimal degrees.
      usage: Set by geocoding; used for routing and maps.
      relationshipContext: Between -180 and 180.
  - name: isPrimary
    type: boolean
    required: true
    default: false
    help:
      summary: Whether this is the party's or location's main address of its type.
      usage: Used as the default when a document needs an address of this type.
      relationshipContext: At most one primary address per type for each party or location.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [ACTIVE, INACTIVE, RETIRED]
    help:
      summary: Whether the address may be used.
      usage: Changed when a party moves or an address becomes invalid.
      relationshipContext: Inactive and retired addresses are not offered for new documents.
      valueSemantics:
        ACTIVE: In use.
        INACTIVE: Temporarily not used.
        RETIRED: No longer valid; kept for history.
  relationships:
  - name: country
    target: Country
    cardinality: '1'
    ownership: reference
    help:
      summary: The country the address is in.
      usage: Chosen from the list of countries; the states and cities offered are narrowed by it.
      context: Every address names its country, which settles the format, tax and trade rules that apply to it.
      cardinalityMeaning: Every address is in exactly one country.
  - name: stateProvince
    target: StateProvince
    cardinality: 0..1
    ownership: reference
    narrowedBy: [country]
    help:
      summary: The state, province or equivalent division the address is in.
      usage: Chosen after the country, from the divisions of that country.
      cardinalityMeaning: At most one; some countries have no divisions in the list.
      context: Must be a division of the address's own country.
  - name: city
    target: City
    cardinality: 0..1
    ownership: reference
    narrowedBy: [stateProvince, country]
    help:
      summary: The city the address is in, chosen from the list.
      usage: Chosen after the state or province, from the cities of that division or country; use the city name field when the city is not listed.
      cardinalityMeaning: At most one.
      context: Must be a city of the address's own country, and of its state or province where one is stated.
  - name: party
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Party that maintains or uses this reusable address.
      workflowRole: Provides party master-data context for address selection.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Location associated with this address.
      workflowRole: Provides physical/place context for operational and geographic processes.
  invariants:
  - id: ADDRESS-001
    rule: An address names its country.
  - id: ADDRESS-EXE-001
    rule: An address states its city, from the list or by name.
    violatedWhen: city_id == null and city_name == null
    message: Choose the city, or give its name when it is not in the list.
  - id: ADDRESS-002
    rule: latitude must be between -90 and 90 when supplied.
  - id: ADDRESS-003
    rule: longitude must be between -180 and 180 when supplied.
  - id: ADDRESS-004
    rule: An Address may be associated with a Party, a Location, both, or neither while being prepared, but an orphan reusable address must not be selected as an effective operational address.
  - id: ADDRESS-005
    rule: Changing or retiring an Address must not rewrite historical transaction address evidence; transactions requiring legal or operational reproducibility must retain a snapshot or equivalent effective-dated reference.
  - id: ADDRESS-006
    rule: At most one active primary Address of the same applicable addressType may exist for the same Party or Location under the configured scope.
  - id: ADDRESS-007
    rule: Address status changes that make an address unusable must trigger validation of dependent master-data references before the address becomes unavailable for new transactions.
  lifecycle:
    title: Address Lifecycle
    attribute: status
    states: [ACTIVE, INACTIVE, RETIRED]
    initial: ACTIVE
    terminal: [RETIRED]
    transitions:
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A postal or physical address, in a structured form that can be validated, printed and mapped.
    businessMeaning: Addresses decide where goods go, where invoices are sent, which taxes apply and where a company is registered. Keeping them structured — lines, city, region, postal code, country, coordinates — lets them be validated, formatted for each country, geocoded for routing and reused by every party and site that needs them.
    usage: Entered when a party or location is created and maintained as people move; chosen on orders and invoices as the billing or delivery address; copied onto transactions so a later change does not alter documents already issued.
    relationshipContext: An address belongs to a Party or a Location (or both, for a party's site). It names its Country and, where known, its StateProvince and City from the reference lists.
    lifecycle: Active while it may be used; inactive when temporarily not used; retired when no longer valid. Transactions keep the address as it was when they were issued.
    workflowContext: Party onboarding, order entry, invoicing, delivery routing, tax determination, address validation.
    example: 'Business address of Northwind Distribution: Industriestraße 12, Halle 3, 70565 Stuttgart, Baden-Württemberg, Germany; 48.7253 N, 9.1121 E; primary.'
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-ADDRESS}
