# CEDM Domain Entity: Address
entity:
  name: Address
  namespace: cedm.domain
  kind: value_master_entity
  description: A structured postal, physical, billing, shipping, or other contact address associated with a party or location.

  identity:
    key: addressId
    type: uuid
    generated: true
    immutable: true

  attributes:
    - name: addressId
      type: uuid
      required: true
      immutable: true

    - name: addressType
      type: enum
      required: true
      values:
        - RESIDENTIAL
        - BUSINESS
        - BILLING
        - SHIPPING
        - REGISTERED
        - POSTAL
        - OTHER

    - name: line1
      type: string
      required: true
      maxLength: 200

    - name: line2
      type: string
      required: false
      maxLength: 200

    - name: line3
      type: string
      required: false
      maxLength: 200

    - name: city
      type: string
      required: true
      maxLength: 150

    - name: stateOrProvince
      type: string
      required: false
      maxLength: 150

    - name: postalCode
      type: string
      required: false
      maxLength: 30

    - name: countryCode
      type: country_code
      required: true

    - name: latitude
      type: decimal
      required: false
      precision: 10
      scale: 7

    - name: longitude
      type: decimal
      required: false
      precision: 10
      scale: 7

    - name: isPrimary
      type: boolean
      required: true
      default: false

    - name: status
      type: enum
      required: true
      default: ACTIVE
      values:
        - ACTIVE
        - INACTIVE
        - RETIRED

  relationships:
    - name: party
      target: Party
      cardinality: "0..1"
      ownership: reference

    - name: location
      target: Location
      cardinality: "0..1"
      ownership: reference

  invariants:
    - id: ADDRESS-001
      rule: countryCode is required.

    - id: ADDRESS-002
      rule: latitude must be between -90 and 90 when supplied.

    - id: ADDRESS-003
      rule: longitude must be between -180 and 180 when supplied.

specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ADDRESS
