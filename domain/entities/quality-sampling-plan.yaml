entity:
  name: QualitySamplingPlan
  namespace: cedm.domain
  kind: quality_sampling_definition
  description: A governed sampling definition that determines how inspection units are selected and how many observations are required for a quality inspection.
  identity:
    key: qualitySamplingPlanId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: qualitySamplingPlanId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Stable identity of the sampling definition.
      businessMeaning: Identifies one governed method for selecting inspection samples.
      usage: Sampling configuration, inspection execution, audit, reporting, and integration.
      relationshipContext: Links sampling rules to a QualityPlan and optionally to specific plan characteristics.
      requiredMeaning: Required for stable traceability.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Business code identifying the sampling plan.
      businessMeaning: Provides a human-readable reference for the sampling method.
      usage: Plan selection, inspection instructions, reporting, and integration.
      relationshipContext: Identifies the sampling definition independently of the QualityPlan execution transaction.
      requiredMeaning: Required for operational identification.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: Human-readable name of the sampling definition.
      businessMeaning: Explains the purpose and method of the sampling rule.
      usage: Authoring, selection, inspection execution, reporting, and audit.
      relationshipContext: Describes how the applicable QualityPlan population is sampled.
      requiredMeaning: Required for understandable governance.
  - name: method
    type: enum
    required: true
    values: [100_PERCENT, FIXED_COUNT, PERCENTAGE, LOT_SIZE_TABLE, STATISTICAL, RANDOM, SYSTEMATIC, OTHER]
    help:
      summary: Method used to determine the inspection sample.
      businessMeaning: Defines the governing sampling approach rather than merely recording a sample count.
      usage: Sampling execution, audit, reproducibility, and compliance.
      relationshipContext: Works with sampleSize, percentage, lot-size rules, and acceptance criteria as applicable.
      requiredMeaning: Required because sample selection must have explicit semantics.
  - name: sampleSize
    type: integer
    required: false
    help:
      summary: Fixed number of units or observations to select when the method requires a fixed count.
      businessMeaning: Defines the required sample quantity for fixed-count sampling.
      usage: Inspection execution and completion gating.
      relationshipContext: Applies according to method and must not exceed the eligible population unless an authorized exception applies.
      optionalMeaning: Optional for methods deriving sample size from percentage, lot-size tables, or statistical rules.
  - name: samplePercentage
    type: decimal
    required: false
    precision: 9
    scale: 4
    help:
      summary: Percentage of an eligible population to inspect when percentage sampling is used.
      businessMeaning: Defines the proportion of the population subject to inspection.
      usage: Sample calculation, execution, and audit.
      relationshipContext: Applies when method is PERCENTAGE and is evaluated against the eligible population.
      optionalMeaning: Optional for non-percentage methods.
  - name: acceptanceNumber
    type: integer
    required: false
    help:
      summary: Maximum number of failing sample results permitted before the sampled lot is rejected under the configured rule.
      businessMeaning: Defines an acceptance threshold for attribute-based sampling.
      usage: Aggregate sample evaluation and inspection result determination.
      relationshipContext: Applies only where the sampling method defines an acceptance/rejection decision from sample failures.
      optionalMeaning: Optional where the inspection uses continuous measurements or another decision method.
  - name: rejectionNumber
    type: integer
    required: false
    help:
      summary: Number of failing sample results at which the sampled population is rejected.
      businessMeaning: Defines the rejection threshold for the sampling decision.
      usage: Automated evaluation, inspection completion, and audit.
      relationshipContext: Must be consistent with acceptanceNumber and the governing sampling methodology.
      optionalMeaning: Optional where rejection is not defined by a discrete failure count.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    help:
      summary: Lifecycle state of the sampling definition.
      businessMeaning: Controls whether the sampling definition may govern new inspection execution.
      usage: Governance, plan selection, audit, and retirement.
      relationshipContext: Status affects QualityPlan configurations and open inspection execution but does not rewrite historical samples.
      requiredMeaning: Required for lifecycle control.
  relationships:
  - name: qualityPlan
    target: QualityPlan
    cardinality: 1
    ownership: reference
    help:
      summary: QualityPlan governed by this sampling definition.
      businessMeaning: Identifies the inspection plan whose eligible population is sampled.
      usage: Plan authoring, execution, traceability, and impact analysis.
      cardinalityMeaning: Each sampling definition belongs to exactly one QualityPlan in this model.
      context: Sampling is a control within the quality plan, not a replacement for inspection requirements.
  - name: characteristics
    target: QualityPlanCharacteristic
    cardinality: 0..*
    ownership: reference
    help:
      summary: Plan characteristics to which this sampling definition applies.
      businessMeaning: Limits or associates sampling with selected quality requirements.
      usage: Measurement planning, inspection forms, and execution.
      cardinalityMeaning: A sampling definition may apply to zero or many characteristics.
      context: When empty, sampling may govern the inspection population broadly; when populated, it scopes sampling to specified characteristics.
  - name: inspections
    target: QualityInspection
    cardinality: 0..*
    ownership: reference
    help:
      summary: Inspections executed using this sampling definition.
      businessMeaning: Provides evidence of how the sampling rule was applied operationally.
      usage: Traceability, audit, effectiveness analysis, and reporting.
      cardinalityMeaning: A sampling definition may govern zero or many inspections.
      context: Historical inspections retain the sampling configuration applicable at execution time.
  invariants:
  - id: QUALITY-SAMPLING-001
    rule: method must determine which sampling parameters are valid and required.
  - id: QUALITY-SAMPLING-002
    rule: sampleSize must be positive when method is FIXED_COUNT.
  - id: QUALITY-SAMPLING-003
    rule: samplePercentage must be greater than 0 and no greater than 100 when method is PERCENTAGE.
  - id: QUALITY-SAMPLING-004
    rule: acceptanceNumber and rejectionNumber, when used, must be nonnegative and logically consistent with the governing sampling methodology.
  - id: QUALITY-SAMPLING-005
    rule: Calculated sample size must not exceed the eligible population without an explicit authorized exception.
  - id: QUALITY-SAMPLING-006
    rule: A sampling definition used by completed inspections must not be changed in a way that silently changes historical sample interpretation; use controlled versioning or replacement.
  - id: QUALITY-SAMPLING-007
    rule: Changes to an active sampling definition must trigger impact analysis across QualityPlan, QualityPlanCharacteristic, open QualityInspection, QualityMeasurement, and downstream disposition/nonconformance workflows.
  - id: QUALITY-SAMPLING-008
    rule: Sampling selection and application must be reproducible and idempotent for a given inspection and sampling execution context.
  help:
    summary: Defines the governed method by which a quality inspection population is sampled.
    businessMeaning: QualitySamplingPlan makes sampling a first-class quality control rather than an implicit number on an inspection. It defines how many units or observations are selected and, where applicable, how sampled failures affect acceptance.
    usage: Incoming inspection, supplier quality, process inspection, laboratory testing, statistical quality control, compliance, and audit.
    relationshipContext: QualityPlan owns the quality context; QualityPlanCharacteristic identifies applicable requirements; QualitySamplingPlan defines sample selection; QualityInspection records execution; QualityMeasurement records observations and results; Nonconformance and disposition consume failed outcomes.
    workflowContext: Define sampling method → associate with QualityPlan/characteristics → create QualityInspection → determine eligible population → select sample reproducibly → capture QualityMeasurements → evaluate acceptance/rejection thresholds → finalize inspection → disposition or Nonconformance where required.
    lifecycle: Draft → active → suspended/retired under controlled governance. Historical inspection execution retains the applicable sampling configuration.
    changePropagation: Sampling changes affect inspection execution, required measurement counts, aggregate result determination, supplier performance evidence, nonconformance, disposition, and audit. Completed inspection history must remain unchanged.
    example: A receiving plan uses a FIXED_COUNT sampling definition requiring 5 units from each eligible lot. The inspection records the sampling configuration and five corresponding QualityMeasurements before finalizing the quality result.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-QUALITY-SAMPLING-PLAN
