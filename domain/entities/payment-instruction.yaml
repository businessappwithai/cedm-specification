entity:
  name: PaymentInstruction
  namespace: cedm.domain
  kind: treasury_instruction
  description: An instruction to a bank to make a payment — amount, value date, payee account, reference — prepared from approved invoices or a payment run, approved, transmitted and confirmed by the bank.
  ui:
    icon: banknote
    recordLabel: [instructionNumber]
  identity: {key: paymentInstructionId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: paymentInstructionId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the payment instruction record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a payment instruction store this identifier. The number or code people quote is a separate field.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, APPROVED, SENT, EXECUTED, REJECTED, CANCELLED]
    help:
      summary: Where the instruction stands.
      businessMeaning: Indicates usability/execution state of PaymentInstruction.
      usage: Moved on by approval, transmission and the bank's reports.
      relationshipContext: Only approved instructions may be sent.
      valueSemantics:
        DRAFT: Prepared, waiting for approval.
        APPROVED: Approved for release.
        SENT: Transmitted to the bank.
        EXECUTED: Paid by the bank.
        REJECTED: Refused by the bank.
        CANCELLED: Withdrawn before it was sent.
  - name: instructionNumber
    type: string
    required: true
    unique: true
    maxLength: 40
    help:
      summary: The reference of the instruction.
      usage: Assigned when it is created; carried in the payment file.
      relationshipContext: Unique; the bank refuses duplicates.
  - name: amount
    type: Money
    required: true
    help:
      summary: The amount to pay.
      usage: Taken from the invoices or entered by hand.
      relationshipContext: In the paying account's currency unless a foreign payment is ordered.
  - name: valueDate
    type: date
    required: true
    help:
      summary: The day the payee should receive the money.
      usage: Set by the payment run from due dates.
      relationshipContext: Must be a business day for the currency.
  - name: payeeName
    type: string
    required: true
    maxLength: 200
    help:
      summary: The name of the payee as it is sent to the bank.
      usage: Copied from the payee's record.
      relationshipContext: Some banks check it against the account holder.
  - name: payeeAccount
    type: string
    required: true
    maxLength: 60
    help:
      summary: The payee's account number or IBAN.
      usage: Copied from the payee's verified bank details.
      relationshipContext: A change of details must be verified before use.
  - name: payeeBankCode
    type: string
    required: false
    maxLength: 20
    help:
      summary: The payee bank's identifier, such as a BIC or routing number.
      usage: Copied from the payee's bank details.
      relationshipContext: Required for some payment methods.
  - name: paymentMethod
    type: enum
    required: true
    default: CREDIT_TRANSFER
    values: [CREDIT_TRANSFER, URGENT_TRANSFER, CROSS_BORDER, CHEQUE, DIRECT_DEBIT]
    help:
      summary: How the bank is to pay.
      usage: Decides the file format and the fee.
      relationshipContext: Urgent and cross-border payments cost more.
      valueSemantics:
        CREDIT_TRANSFER: A standard bank transfer.
        URGENT_TRANSFER: A same-day high-value transfer.
        CROSS_BORDER: An international transfer.
        CHEQUE: A cheque issued by the bank.
        DIRECT_DEBIT: A debit collected from the payer's account.
  - name: remittanceReference
    type: string
    required: false
    maxLength: 140
    help:
      summary: The reference the payee sees on their statement, such as the invoice numbers paid.
      usage: Lets the payee match the payment.
      relationshipContext: Length limited by the payment scheme.
  - name: approvedAt
    type: datetime
    required: false
    help:
      summary: When the instruction was approved for release.
      usage: Recorded on the final approval.
      relationshipContext: Required before sending.
  - name: sentAt
    type: datetime
    required: false
    help:
      summary: When the instruction was transmitted to the bank.
      usage: Recorded by the bank interface.
      relationshipContext: Present once sent.
  - name: bankStatusMessage
    type: string
    required: false
    maxLength: 500
    help:
      summary: What the bank reported about the instruction.
      usage: Recorded from the bank's status report.
      relationshipContext: Explains rejections.
  relationships:
  - name: bankAccount
    target: BankAccount
    cardinality: '1'
    ownership: reference
    help:
      summary: The company account the payment is made from.
      businessMeaning: Supplies treasury settlement account.
      workflowRole: Instruction does not itself prove bank settlement.
      usage: Chosen by the payment run or by hand.
      cardinalityMeaning: One account per instruction.
      context: Must have enough funds on the value date.
  - name: payment
    target: Payment
    cardinality: 0..1
    ownership: reference
    help:
      summary: The payment the instruction resulted in.
      businessMeaning: Connects intent to settlement transaction.
      workflowRole: Retries must not create duplicate Payment.
      usage: Linked once the bank executes it.
      cardinalityMeaning: At most one.
      context: The payment is allocated to the invoices it settles.
  - name: payee
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The party paid.
      usage: Chosen when the instruction is created.
      cardinalityMeaning: One per instruction.
      context: Their verified bank details are used.
  - name: approvedBy
    target: Person
    cardinality: 0..1
    ownership: reference
    help:
      summary: Who gave the final approval.
      usage: Recorded on approval.
      cardinalityMeaning: One per instruction; dual approval records the second approver here.
      context: Must hold payment authority for the amount.
  invariants:
  - {id: PAYMENT-INSTRUCTION-001, rule: An instruction sent to the bank is not changed; a correction is a cancellation request and a new instruction.}
  - {id: PAYMENT-INSTRUCTION-002, rule: A sent instruction records when it was approved., violatedWhen: (status == "SENT" or status == "EXECUTED") and approved_at == null, message: The instruction must be approved before it is sent.}
  - {id: PAYMENT-INSTRUCTION-EXE-001, rule: "Amount cannot be negative.", violatedWhen: "amount != null and amount < 0", message: "Amount cannot be negative."}
  - {id: PAYMENT-INSTRUCTION-EXE-002, rule: "A payment instruction that is approved states when (approved at).", violatedWhen: "status == \"APPROVED\" and approved_at == null", message: "Record approved at when the payment instruction is approved."}
  lifecycle:
    title: Payment Instruction Lifecycle
    attribute: status
    states: [DRAFT, APPROVED, SENT, EXECUTED, REJECTED, CANCELLED]
    initial: DRAFT
    terminal: [EXECUTED, REJECTED, CANCELLED]
    transitions:
    - {from: DRAFT, to: APPROVED, action: approve}
    - {from: APPROVED, to: SENT, action: send}
    - {from: SENT, to: EXECUTED, action: execute}
    - {from: SENT, to: REJECTED, action: reject}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a payment instruction is ended"
    description: "When a payment instruction is rejected or cancelled, a task asks someone to settle what depended on it."
    when: "(status == \"REJECTED\" or status == \"CANCELLED\") and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PAYMENT-INSTRUCTION-FOLLOW-UP-{{id}}"
          name: "Follow up on payment instruction {{instruction_number}}"
          description: "Payment instruction {{instruction_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: An order to the bank to pay someone, from preparation to the bank's confirmation.
    businessMeaning: Money leaves the company through instructions to its banks. Each instruction says exactly what to pay, to whom, from which account, on which day and with what reference, and must be approved before it is sent. Keeping instructions separate from the payments they produce lets treasury control release, detect duplicates, and match the bank's acknowledgement.
    usage: Created by payment runs or by hand, approved under the payment authority rules (often by two people), transmitted to the bank, and confirmed or rejected by the bank's status report.
    relationshipContext: An instruction is paid from one of the company's BankAccounts to a payee Party, and results in a Payment once executed.
    lifecycle: Draft, then approved, then sent to the bank; executed once the bank confirms, or rejected by the bank. An instruction can be cancelled before it is sent.
    workflowContext: Supplier payment runs, payroll payments, treasury transfers, bank connectivity.
    example: "Instruction PI-24-03-0412: pay 18,400.00 EUR to Contoso GmbH, IBAN DE89 3704 0044 0532 0130 00, reference 'INV 55120', from account EUR-OP-01, value date 28 March; approved by two signatories; sent 27 March; executed 28 March."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PAYMENT-INSTRUCTION}
