entity:
  name: PaymentInstruction
  namespace: cedm.domain
  kind: treasury_instruction
  description: A governed instruction authorizing or requesting a future payment through a bank or payment channel, separate from the resulting Payment and BankTransaction evidence.
  ui:
    icon: credit-card
  identity: {key: paymentInstructionId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: paymentInstructionId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of PaymentInstruction., businessMeaning: Identifies one governed PaymentInstruction record., usage: "Enterprise processing, integration, reporting and audit.", relationshipContext: Referenced by compatible domain workflows.}}
    - name: status
      type: enum
      required: true
      values: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
      help: {summary: Governed lifecycle state., businessMeaning: Indicates usability/execution state of PaymentInstruction., usage: Workflow and controls., relationshipContext: Historical terminal evidence is retained., valueSemantics: {DRAFT: Being prepared., ACTIVE: Effective or executing., COMPLETED: Concluded successfully., CANCELLED: Terminated without normal completion.}}
  relationships:
    - {name: bankAccount, target: BankAccount, cardinality: '1', ownership: reference, help: {summary: Bank account from/to which payment is instructed., businessMeaning: Supplies treasury settlement account., usage: Payment execution., cardinalityMeaning: Exactly one BankAccount., workflowRole: Instruction does not itself prove bank settlement.}}
    - {name: payment, target: Payment, cardinality: 0..1, ownership: reference, help: {summary: Payment resulting from executed instruction., businessMeaning: Connects intent to settlement transaction., usage: Treasury reconciliation., cardinalityMeaning: Optional until execution., workflowRole: Retries must not create duplicate Payment.}}
  invariants:
    - {id: PAYMENT-INSTRUCTION-001, rule: "This record must not silently duplicate or rewrite authoritative cash, accounting, tax, usage, entitlement, or billing evidence in another CEDM entity."}
  lifecycle:
    title: Payment Instruction Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    initial: DRAFT
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a payment instruction is ended"
      description: "When a payment instruction is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PAYMENT-INSTRUCTION-FOLLOW-UP-{{id}}"
              name: "Follow up on payment instruction {{id}}"
              description: "Payment instruction {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A governed instruction authorizing or requesting a future payment through a bank or payment channel, separate from the resulting Payment and BankTransaction evidence.
    purpose: Provide canonical enterprise semantics for PaymentInstruction while keeping planning, operational, financial and evidential responsibilities separated.
    businessMeaning: A governed instruction authorizing or requesting a future payment through a bank or payment channel, separate from the resulting Payment and BankTransaction evidence.
    whenUsed: Used by applicable finance, treasury, tax, subscription, billing, reporting and integration workflows.
    howItRelates: References canonical parties and transactions; downstream accounting and cash effects remain explicit through JournalEntry, Payment and BankTransaction where applicable.
    lifecycleUsage: Created under governed workflow, progressed through explicit states, and retained historically after completion/cancellation.
    commonProcesses: Financial control, tax, billing, subscription management, settlement, reconciliation and audit.
    commonExamples: Enterprise finance and recurring-revenue operations.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PAYMENT-INSTRUCTION}
