entity:
  name: Job
  namespace: cedm.domain
  kind: workforce_master
  description: A governed reusable definition of work responsibilities, qualifications, classification, and organizational role characteristics that may be instantiated by Positions and occupied through Employment.
  ui:
    icon: briefcase
  identity: {key: jobId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: jobId, type: uuid, required: true, immutable: true, help: {summary: "The internal key that positions use to point at this job definition.", businessMeaning: Identifies reusable work definition., usage: "Workforce planning, recruiting, position and compensation processes.", relationshipContext: Positions may reference Job., requiredMeaning: Required.}}
  - {name: code, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The short job code HR uses in grading tables, job postings and reports.", businessMeaning: Human/integration classification identifier., usage: HCM and reporting., relationshipContext: Independent of employee/position identity., requiredMeaning: Required.}}
  - {name: title, type: string, required: true, maxLength: 300, help: {summary: "The job title people see on postings, contracts and organization charts.", businessMeaning: Names the reusable work role., usage: Organization design and HR., relationshipContext: Position may have contextual display title., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    values: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    help: {summary: "Shows whether the job is still a draft, active for use, temporarily inactive, or retired.", businessMeaning: Controls future position assignment., usage: HCM governance., relationshipContext: Historical employment remains valid., valueSemantics: {DRAFT: Being designed., ACTIVE: Available., INACTIVE: Temporarily unavailable., RETIRED: Closed to new use.}, requiredMeaning: Required.}
  relationships:
  - {name: positions, target: Position, cardinality: 0..*, ownership: reference, help: {summary: Organizational positions based on job definition., businessMeaning: Instantiates reusable work definition in organization structure., usage: Workforce planning., cardinalityMeaning: Zero or many Positions., workflowRole: Job lifecycle affects new position use but not historical employment.}}
  invariants:
  - {id: JOB-001, rule: RETIRED Job cannot be newly assigned to a Position without governed reinstatement/migration.}
  - {id: JOB-002, rule: Job definition changes must not rewrite historical Employment terms.}
  lifecycle:
    title: Job Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help: {summary: "A standard job definition, such as Accountant or Warehouse Operative, describing duties, qualifications and grading that individual positions are created from and people are hired into.", businessMeaning: "Job defines what work is; Position defines an organizational seat; Employment connects a person/employee to governed work arrangements.", usage: "Workforce planning, recruiting, position management and compensation.", relationshipContext: "Position instantiates Job; Employment remains transaction/relationship evidence.", workflowContext: "HR drafts the job when a new kind of role is designed, activates it once grading and requirements are agreed, positions are then created from it and filled through hiring, and it is deactivated or retired when the organization stops using that role.", lifecycle: "A job starts as draft, becomes active when approved for use, can be made inactive and reactivated as needs change, and is retired from draft, active or inactive when it will no longer be used; retired jobs are kept for history.", example: "Job FIN-ACC-02 Senior Accountant, active, with three positions created from it in the finance department."}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-JOB}
