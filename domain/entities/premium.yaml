entity:
  name: Premium
  namespace: cedm.domain
  kind: insurance_premium_transaction
  description: A governed monetary premium obligation or installment assessed under an InsurancePolicy, distinct from the Invoice that may formalize the receivable and Payment that settles it.
  ui: {icon: banknote}
  identity: {key: premiumId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: premiumId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of the premium obligation., businessMeaning: Identifies one policy premium assessment or installment independently of billing and payment records., usage: "Policy billing, collections, accounting and audit.", relationshipContext: InsurancePolicy defines why the premium is owed., requiredMeaning: Required.}}
    - {name: premiumNumber, type: string, required: true, unique: true, maxLength: 120, help: {summary: Human-facing premium obligation reference., businessMeaning: Operational identifier for policy billing and reconciliation., usage: "Search, billing and integration.", relationshipContext: Distinct from policy and invoice numbers., requiredMeaning: Required.}}
    - {name: amount, type: decimal, required: true, precision: 20, scale: 4, help: {summary: Monetary amount of the premium obligation., businessMeaning: Premium value due under policy terms., usage: "Billing, collections and reporting.", relationshipContext: Currency relationship defines denomination., requiredMeaning: Required.}}
    - {name: dueDate, type: date, required: false, help: {summary: Date premium payment is expected., businessMeaning: Supports policy billing and delinquency decisions., usage: "Collections, reminders and policy servicing.", relationshipContext: Invoice payment terms may become authoritative after formal billing., optionalMeaning: Optional before installment schedule is finalized.}}
    - name: status
      type: enum
      required: true
      default: DRAFT
      values: [DRAFT, DUE, INVOICED, PAID, WAIVED, CANCELLED]
      help: {summary: Lifecycle state of the premium obligation., businessMeaning: "Distinguishes preparation, due, billed, settled, waived and cancelled states.", usage: "Policy billing, servicing and audit.", relationshipContext: PAID must reconcile to financial settlement evidence., valueSemantics: {DRAFT: Premium is being prepared., DUE: Premium obligation is active., INVOICED: Premium has been represented in a financial claim., PAID: Obligation is settled., WAIVED: Premium was formally waived., CANCELLED: Obligation was cancelled.}, requiredMeaning: Required.}
  relationships:
    - {name: policy, target: InsurancePolicy, cardinality: "1", ownership: reference, help: {summary: InsurancePolicy giving rise to this Premium., businessMeaning: Supplies contractual basis and coverage period., usage: "Policy billing and reconciliation.", cardinalityMeaning: Exactly one InsurancePolicy., workflowRole: Premium must be compatible with policy terms.}}
    - {name: insuredParty, target: InsuredParty, cardinality: "0..1", ownership: reference, help: {summary: Insured party specifically associated with this premium when member-level pricing applies., businessMeaning: Supports member-specific pricing without making all premiums party-specific., usage: "Group/health billing and reporting.", cardinalityMeaning: Optional for policy-level premiums., workflowRole: InsuredParty must belong to the same Policy.}}
    - {name: currency, target: Currency, cardinality: "1", ownership: reference, help: {summary: Currency of the premium amount., businessMeaning: Makes monetary obligation unambiguous., usage: "Billing, accounting and reporting.", cardinalityMeaning: Exactly one Currency., workflowRole: Historical premium currency does not change after assessment.}}
    - {name: invoice, target: Invoice, cardinality: "0..1", ownership: reference, help: {summary: Financial claim representing this premium., businessMeaning: Separates insurance premium assessment from accounts-receivable evidence., usage: "Billing, collection and accounting reconciliation.", cardinalityMeaning: Optional before invoicing or when aggregated billing applies., workflowRole: INVOICED and PAID states must reconcile to financial evidence under policy.}}
  invariants:
    - {id: PREMIUM-001, rule: amount must not be negative.}
    - {id: PREMIUM-002, rule: InsuredParty must belong to the same InsurancePolicy when supplied.}
    - {id: PREMIUM-003, rule: PAID status must reconcile to settled financial evidence under the billing policy.}
    - {id: PREMIUM-004, rule: Historical billed premium evidence is not destructively rewritten; waivers and corrections remain explicit.}
  lifecycle:
    title: Premium Lifecycle
    attribute: status
    states: [DRAFT, DUE, INVOICED, PAID, WAIVED, CANCELLED]
    initial: DRAFT
    terminal: [PAID, WAIVED, CANCELLED]
    transitions:
      - {from: DRAFT, to: DUE, action: assess}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: DUE, to: INVOICED, action: invoice}
      - {from: DUE, to: WAIVED, action: waive}
      - {from: DUE, to: CANCELLED, action: cancel}
      - {from: INVOICED, to: PAID, action: mark_paid}
      - {from: INVOICED, to: WAIVED, action: waive}
  help:
    summary: Represents a policy premium obligation while keeping receivable and payment evidence in finance entities.
    businessMeaning: Premium explains the insurance charge; Invoice formalizes a financial claim; Payment settles it.
    usage: Insurance billing, collections, policy servicing, accounting and audit.
    relationshipContext: Policy is mandatory, optional InsuredParty supports member-level pricing, Currency defines value and Invoice provides receivable evidence.
    lifecycle: Premium is prepared, becomes due, may be invoiced, then ends paid, waived or cancelled.
    example: A quarterly policy premium becomes due, is invoiced, and is later marked paid after the invoice settlement is reconciled.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PREMIUM}
