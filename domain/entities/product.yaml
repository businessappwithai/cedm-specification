entity:
  name: Product
  namespace: cedm.domain
  kind: core_master_entity
  description: A canonical business offering or managed item that can be purchased, sold, stocked, consumed, delivered, subscribed to, or otherwise referenced by commercial and operational processes.
  ui:
    icon: package
  identity: {key: productId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: productId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the product record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a product store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The product's internal code.
      usage: Used on orders, invoices and stock records.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the product.
      usage: Shown in catalogues, orders and invoices.
      relationshipContext: As customers and staff know it.
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: A description of the product.
      usage: Shown in catalogues and on quotations.
      relationshipContext: Plain language, without prices.
  - name: productType
    type: enum
    required: true
    values: [GOOD, MATERIAL, SERVICE, SUBSCRIPTION, ASSET, BUNDLE, OTHER]
    help:
      summary: What kind of offering the product is.
      usage: Decides whether it is stocked, delivered, subscribed to or capitalised.
      relationshipContext: Chosen when the product is created.
      valueSemantics:
        GOOD: A physical item sold.
        MATERIAL: A raw material or component used in production.
        SERVICE: Work performed for the customer.
        SUBSCRIPTION: A recurring service billed by period.
        ASSET: An item kept and depreciated by the organisation.
        BUNDLE: A set of products sold together.
        OTHER: Any other kind.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
    help:
      summary: Whether the product can be used in new transactions.
      usage: Changed by product management.
      relationshipContext: Only active products are sold or bought.
      valueSemantics:
        DRAFT: Being set up.
        ACTIVE: Available.
        DISCONTINUED: No longer sold; existing stock and commitments run out.
        BLOCKED: Temporarily not to be used, for example during a recall.
        RETIRED: Withdrawn for good.
  - name: sku
    type: string
    required: false
    maxLength: 100
    help:
      summary: The stock-keeping unit code used in sales channels and warehouses.
      usage: Scanned and printed on labels.
      relationshipContext: Usually unique per variant.
  - name: unitOfMeasure
    type: reference
    target: UnitOfMeasure
    required: false
    help:
      summary: The unit the product is counted in.
      usage: Default unit on orders and stock records.
      relationshipContext: Other units need a conversion.
  - name: standardPrice
    type: money
    required: false
    help:
      summary: The list price of the product.
      usage: Default price on quotations and orders.
      relationshipContext: Not negative; agreed prices override it.
  - name: taxCategory
    type: string
    required: false
    maxLength: 100
    help:
      summary: The tax category the product falls in.
      usage: Decides the tax rate applied on sales and purchases.
      relationshipContext: From the tax rules of the selling country.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The created at of the product: a point in time the business records on it.'
      usage: Entered or maintained when a product is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the product's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: 'Required: a product cannot be understood without its created at.'
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: 'The updated at of the product: a point in time the business records on it.'
      usage: Entered or maintained when a product is created or changed; shown on its form and available to search and reports.
      relationshipContext: Read together with the product's other fields and its relationships; it is not meaningful on its own.
      requiredMeaning: 'Required: a product cannot be understood without its updated at.'
  relationships:
  - name: category
    target: ProductCategory
    cardinality: 0..1
    ownership: reference
    help:
      summary: The category the product is classified in.
      cardinalityMeaning: A product has at most one product category in this role.
      usage: Used to browse the catalogue and for reports.
      context: Only active categories are assigned.
  - name: suppliers
    target: Supplier
    cardinality: 0..*
    ownership: reference
    help:
      summary: Suppliers who can supply the product.
      cardinalityMeaning: A product has any number of supplier in this role.
      usage: Proposed when purchasing.
      context: Many suppliers per product; a supplier supplies many products.
  - name: locations
    target: Location
    cardinality: 0..*
    ownership: reference
    help:
      summary: Locations where the product is stocked or sold.
      cardinalityMeaning: A product has any number of location in this role.
      usage: Used for availability and assortment.
      context: Many locations per product.
    inverseCardinality: 0..*
  - name: salesOrderLines
    target: SalesOrderLine
    cardinality: 0..*
    ownership: reference
    help:
      summary: Sales order lines for the product.
      cardinalityMeaning: A product has any number of sales order line in this role.
      usage: Listed for sales history.
      context: Each line is for one product.
  - name: purchaseOrderLines
    target: PurchaseOrderLine
    cardinality: 0..*
    ownership: reference
    help:
      summary: Purchase order lines for the product.
      cardinalityMeaning: A product has any number of purchase order line in this role.
      usage: Listed for purchase history.
      context: Each line is for one product.
  - name: inventoryBalances
    target: InventoryBalance
    cardinality: 0..*
    ownership: reference
    help:
      summary: Stock of the product by location.
      cardinalityMeaning: A product has any number of inventory balance in this role.
      usage: Shown as availability.
      context: One balance per location.
  - name: inventoryMovements
    target: InventoryMovement
    cardinality: 0..*
    ownership: reference
    help:
      summary: Stock movements of the product.
      cardinalityMeaning: A product has any number of inventory movement in this role.
      usage: Listed for stock history.
      context: Each movement is of one product.
  - name: invoiceLines
    target: InvoiceLine
    cardinality: 0..*
    ownership: reference
    help:
      summary: Invoice lines that bill the product.
      cardinalityMeaning: A product has any number of invoice line in this role.
      usage: Listed for billing history.
      context: Each line bills one product.
  - name: lots
    target: Lot
    cardinality: 0..*
    ownership: reference
    help: {summary: Traceable batches associated with the Product., businessMeaning: Provides batch genealogy for produced or received quantities., usage: "Inventory, quality, expiry, and recall.", cardinalityMeaning: Many lots may exist over product lifetime., workflowRole: Lot status constrains future inventory use without changing Product identity.}
  - name: serialNumbers
    target: SerialNumber
    cardinality: 0..*
    ownership: reference
    help: {summary: Individually traceable units of the Product., businessMeaning: Provides unit-level identity and custody history., usage: "Inventory, logistics, service, warranty, returns, and assets.", cardinalityMeaning: Many serialized units may exist., workflowRole: Serial lifecycle constrains unit eligibility independently of product master status.}
  - name: brand
    target: Brand
    cardinality: 0..1
    ownership: reference
    help: {summary: Commercial/manufacturer brand of Product., businessMeaning: Supplies market identity independently of category., usage: "PIM, catalog, sales, sourcing and reporting.", cardinalityMeaning: Optional for unbranded products., workflowRole: Brand lifecycle affects future catalog/master eligibility without rewriting historical transactions.}
  - name: variants
    target: ProductVariant
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: Governed configurations belonging to this product family.
      businessMeaning: "Represents specific option combinations such as size, color, grade or pack."
      usage: "Catalog, commerce, inventory and manufacturing."
      workflowRole: Parent Product restrictions propagate to variants.
      cardinalityMeaning: Any number of variants, kept with the product.
  - name: attributes
    target: ProductAttribute
    cardinality: "0..*"
    ownership: reference
    help:
      summary: Governed characteristic definitions applicable to Product.
      businessMeaning: Defines descriptive/configuration semantics.
      usage: "PIM, search and variant configuration."
      workflowRole: Variant-defining attributes constrain ProductVariant uniqueness.
      cardinalityMeaning: Any number of attribute values.
    inverseCardinality: '1'
  - {name: packagingConfigurations, target: Packaging, cardinality: "0..*", ownership: aggregate, help: {summary: Governed pack configurations for Product., businessMeaning: Defines quantity/containment options for commercial and logistics use., usage: "Procurement, sales, WMS and shipping.", cardinalityMeaning: Zero or many configurations., workflowRole: Conversion changes require open-work impact analysis.}}
  - {name: lifecycleHistory, target: ProductLifecycle, cardinality: 0..*, ownership: aggregate, help: {summary: Effective-dated lifecycle transition history., businessMeaning: Preserves why/when Product eligibility changed., usage: Governance and audit., cardinalityMeaning: Zero or many lifecycle events., workflowRole: Current status must reconcile to effective history.}}
  invariants:
  - id: PRODUCT-001
    rule: code must be unique within its ERP context.
  - id: PRODUCT-002
    rule: DISCONTINUED, BLOCKED, or RETIRED products cannot be newly introduced into incompatible transactions without an explicit exception or lifecycle transition.
  - id: PRODUCT-003
    rule: A Product status change must trigger dependency validation across active SalesOrderLine, PurchaseOrderLine, inventory, fulfillment, and billing workflows before future use is restricted.
  - id: PRODUCT-004
    rule: Product master changes must not rewrite historical transaction descriptions, units, prices, tax determinations, quantities, or other evidence required to reproduce completed transactions.
  - id: PRODUCT-005
    rule: Any transaction quantity referencing a Product must use a compatible UnitOfMeasure or an approved conversion rule.
  - id: PRODUCT-006
    rule: Changing the default UnitOfMeasure must trigger validation of open transaction lines and inventory processes; it must not silently reinterpret existing quantities.
  - id: PRODUCT-007
    rule: Changing taxCategory must trigger re-evaluation of applicable future tax determination but must not rewrite issued InvoiceLine tax evidence.
  - id: PRODUCT-008
    rule: Changing standardPrice must not overwrite negotiated, contracted, quoted, or already-captured transaction prices.
  - id: PRODUCT-009
    rule: Retiring a Product must validate open commitments and dependent inventory before retirement becomes effective; existing obligations require their own controlled continuation, substitution, cancellation, or exception workflow.
  - {id: PRODUCT-EXE-001, rule: "Standard Price cannot be negative.", violatedWhen: "standard_price != null and standard_price < 0", message: "Standard Price cannot be negative."}
  lifecycle:
    title: Product Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
    initial: DRAFT
    terminal: [DISCONTINUED, RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: BLOCKED, action: block}
    - {from: BLOCKED, to: ACTIVE, action: unblock}
    - {from: DRAFT, to: DISCONTINUED, action: discontinue}
    - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
    - {from: BLOCKED, to: DISCONTINUED, action: discontinue}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: BLOCKED, to: RETIRED, action: retire}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a product is stopped"
    description: "When a product is blocked, a high-priority task asks someone to resolve it."
    when: "status == \"BLOCKED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PRODUCT-EXCEPTION-{{id}}"
          name: "Resolve product {{name}}"
          description: "Product {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  help:
    summary: Canonical product master with mandatory downstream dependency propagation and transaction-time preservation rules.
    businessMeaning: Product defines what is offered or managed; transaction entities define occurrences. Master changes affect future eligibility and dependent open workflows, not completed historical facts.
    usage: Central to catalog, pricing, sales, procurement, inventory, manufacturing, logistics, fulfillment, invoicing, tax, service, subscriptions, and analytics.
    relationshipContext: Product connects to ProductCategory, Supplier, UnitOfMeasure, Location, demand, procurement, inventory state/events, and billing. Transaction entities own their occurrence-specific facts.
    workflowContext: Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements.
    lifecycle: Draft → active → discontinued/blocked → retired. Lifecycle transitions require dependent-workflow validation and preserve historical references.
    changePropagation:
      status: [SalesOrderLine eligibility, PurchaseOrderLine eligibility, inventory operations, fulfillment eligibility, future InvoiceLine creation]
      unitOfMeasure: [open order quantities, receipt quantities, inventory operations, conversion rules]
      taxCategory: [future TaxRule determination, future InvoiceLine calculation]
      standardPrice: [future default pricing only]
      category: [catalog, assortment, reporting, policy eligibility]
      supplierRelationship: [future sourcing and PurchaseOrder eligibility]
      locationRelationship: [future operational availability and inventory configuration]
    example: If a Product is blocked, the system validates open SalesOrders and PurchaseOrders, prevents new incompatible use, and identifies dependent inventory/fulfillment workflows. Existing invoices and inventory movements remain unchanged. If its tax category changes, future tax determination uses the new category while issued invoices retain their historical tax evidence.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PRODUCT}
