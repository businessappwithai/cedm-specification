entity:
  name: Product
  namespace: cedm.domain
  kind: core_master_entity
  description: A canonical business offering or managed item that can be purchased, sold, stocked, consumed, delivered, subscribed to, or otherwise referenced by commercial and operational processes.
  ui:
    icon: package
  identity: {key: productId, type: uuid, generated: true, immutable: true}
  attributes:
    - name: productId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the product, which never changes even when its code or name does.
        usage: Generated on creation; order lines, stock and invoices refer to it.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The code by which staff and systems name the product.
        usage: Unique; assigned by product management and used in orders, price lists and integrations.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The name of the product as shown to users and customers.
        usage: Shown in catalogues, on documents and in search results.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A longer description of what the product is.
        usage: Written by product management; used on websites, quotes and datasheets.
    - name: productType
      type: enum
      required: true
      values: [GOOD, MATERIAL, SERVICE, SUBSCRIPTION, ASSET, BUNDLE, OTHER]
      help:
        summary: What kind of offering the product is, which decides how it is bought, stocked and delivered.
        usage: Chosen on creation; stock rules apply only to physical types.
        valueSemantics:
          GOOD: A finished physical item that is bought or sold and held in stock.
          MATERIAL: A raw material or component consumed in production.
          SERVICE: Work performed for a customer, not held in stock.
          SUBSCRIPTION: A recurring entitlement billed on a schedule.
          ASSET: A durable item the business keeps and depreciates.
          BUNDLE: A package of other products sold together.
          OTHER: Anything else that is traded.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
      help:
        summary: Whether the product can currently be traded.
        usage: Set by product management; new orders are accepted only for ACTIVE products.
        valueSemantics:
          DRAFT: Being set up; not yet tradable.
          ACTIVE: Available for ordinary trading.
          DISCONTINUED: Being phased out; existing stock may be sold but it is not reordered. A final state.
          BLOCKED: Temporarily barred from trading, for example during a quality or compliance issue.
          RETIRED: Removed from the catalogue; kept for history. A final state.
    - name: sku
      type: string
      required: false
      maxLength: 100
      help:
        summary: The stock-keeping unit code used in warehouses and on retail systems.
        usage: Assigned at creation; printed on labels and scanned during handling.
    - name: unitOfMeasure
      type: reference
      target: UnitOfMeasure
      required: false
      help:
        summary: The base unit in which the product is counted, such as each or kilogram.
        usage: Chosen on creation; stock and order quantities are converted to it.
    - name: standardPrice
      type: money
      required: false
      help:
        summary: The standard selling price of the product.
        usage: Set by pricing; quotes and orders start from it before discounts.
    - name: taxCategory
      type: string
      required: false
      maxLength: 100
      help:
        summary: The tax category that decides how the product is taxed.
        usage: Chosen on creation; tax rules look it up when documents are priced.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the product record was created.
        usage: Set by the system.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the product record was last changed.
        usage: Set by the system.
  relationships:
    - name: category
      target: ProductCategory
      cardinality: 0..1
      ownership: reference
      help:
        summary: The category the product is classified in.
        usage: Chosen on creation; used for assortment and reporting.
        cardinalityMeaning: At most one category; uncategorised products are allowed while being set up.
        workflowRole: Places the product in the catalogue hierarchy.
    - name: suppliers
      target: Supplier
      cardinality: 0..*
      ownership: reference
      help:
        summary: The suppliers from which the product can be bought.
        usage: Linked as sources are approved.
        cardinalityMeaning: Any number of suppliers.
        workflowRole: Defines the sourcing options for purchasing.
    - name: locations
      target: Location
      cardinality: 0..*
      ownership: reference
      help:
        summary: The locations where the product is held or sold.
        usage: Linked as the product is stocked.
        cardinalityMeaning: Any number of locations.
        workflowRole: Defines where stock may exist.
    - name: salesOrderLines
      target: SalesOrderLine
      cardinality: 0..*
      ownership: reference
      help:
        summary: The sales order lines that sell the product.
        usage: Read for sales history.
        cardinalityMeaning: Any number, growing as the product sells.
        workflowRole: Show demand for the product.
    - name: purchaseOrderLines
      target: PurchaseOrderLine
      cardinality: 0..*
      ownership: reference
      help:
        summary: The purchase order lines that buy the product.
        usage: Read for purchasing history.
        cardinalityMeaning: Any number.
        workflowRole: Show supply commitments.
    - name: inventoryBalances
      target: InventoryBalance
      cardinality: 0..*
      ownership: reference
      help:
        summary: The stock balances held of the product.
        usage: Read for stock levels.
        cardinalityMeaning: Any number, one for each location holding it.
        workflowRole: Show how much is available where.
    - name: inventoryMovements
      target: InventoryMovement
      cardinality: 0..*
      ownership: reference
      help:
        summary: The stock movements of the product.
        usage: Read for stock history.
        cardinalityMeaning: Any number over the product's life.
        workflowRole: Explain how stock reached its level.
    - name: invoiceLines
      target: InvoiceLine
      cardinality: 0..*
      ownership: reference
      help:
        summary: The invoice lines that bill the product.
        usage: Read for revenue and cost analysis.
        cardinalityMeaning: Any number.
        workflowRole: Connect the product to money.
    - name: lots
      target: Lot
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of lots, for lot-controlled products.
        summary: Traceable batches associated with the Product.
        businessMeaning: Provides batch genealogy for produced or received quantities.
        usage: "Inventory, quality, expiry, and recall."
        workflowRole: Lot status constrains future inventory use without changing Product identity.
    - name: serialNumbers
      target: SerialNumber
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of serial numbers, for serialised products.
        summary: Individually traceable units of the Product.
        businessMeaning: Provides unit-level identity and custody history.
        usage: "Inventory, logistics, service, warranty, returns, and assets."
        workflowRole: Serial lifecycle constrains unit eligibility independently of product master status.
    - name: brand
      target: Brand
      cardinality: 0..1
      ownership: reference
      help:
        cardinalityMeaning: At most one brand under which the product is marketed.
        summary: Commercial/manufacturer brand of Product.
        businessMeaning: Supplies market identity independently of category.
        usage: "PIM, catalog, sales, sourcing and reporting."
        workflowRole: Brand lifecycle affects future catalog/master eligibility without rewriting historical transactions.
    - name: variants
      target: ProductVariant
      cardinality: 0..*
      ownership: aggregate
      help:
        cardinalityMeaning: Any number of variants, such as sizes and colours.
        summary: Governed configurations belonging to this product family.
        businessMeaning: "Represents specific option combinations such as size, color, grade or pack."
        usage: "Catalog, commerce, inventory and manufacturing."
        workflowRole: Parent Product restrictions propagate to variants.
    - {name: attributes, target: ProductAttribute, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of descriptive attributes., summary: Governed characteristic definitions applicable to Product., businessMeaning: Defines descriptive/configuration semantics., usage: "PIM, search and variant configuration.", workflowRole: Variant-defining attributes constrain ProductVariant uniqueness.}}
    - {name: packagingConfigurations, target: Packaging, cardinality: "0..*", ownership: aggregate, help: {cardinalityMeaning: Any number of packaging configurations., summary: Governed pack configurations for Product., businessMeaning: Defines quantity/containment options for commercial and logistics use., usage: "Procurement, sales, WMS and shipping.", workflowRole: Conversion changes require open-work impact analysis.}}
    - {name: lifecycleHistory, target: ProductLifecycle, cardinality: 0..*, ownership: aggregate, help: {cardinalityMeaning: 'Any number of lifecycle records, one for each status change.', summary: Effective-dated lifecycle transition history., businessMeaning: Preserves why/when Product eligibility changed., usage: Governance and audit., workflowRole: Current status must reconcile to effective history.}}
    - name: inventoryItems
      target: InventoryItem
      cardinality: 0..*
      ownership: reference
      help:
        cardinalityMeaning: Any number of inventory profiles, one for each organisation that stocks the product.
        summary: Inventory-control profiles governing this Product.
        businessMeaning: Keeps reusable product identity separate from organization-specific stocking policy.
        usage: Inventory setup, warehouse operations, replenishment, manufacturing and reporting.
        workflowRole: Product lifecycle changes require validation of active inventory profiles without rewriting historical stock evidence.
    - {name: serviceOrders, target: ServiceOrder, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of service orders that concern the product., summary: Service execution orders associated with this Product or service definition., businessMeaning: Connects standardized offering/equipment context to service history., usage: "Service catalog, field service, billing and analytics.", workflowRole: Product lifecycle affects future eligibility without rewriting completed service.}}
    - {name: entitlements, target: Entitlement, cardinality: "0..*", ownership: reference, help: {cardinalityMeaning: Any number of entitlements to service for the product., summary: Entitlements whose coverage is scoped to this Product., businessMeaning: Expresses product-level service rights outside the product master itself., usage: "Coverage validation and service authorization.", workflowRole: Applied service must remain within covered scope.}}

  invariants:
    - id: PRODUCT-001
      rule: code must be unique within its ERP context.
    - id: PRODUCT-002
      rule: DISCONTINUED, BLOCKED, or RETIRED products cannot be newly introduced into incompatible transactions without an explicit exception or lifecycle transition.
    - id: PRODUCT-003
      rule: A Product status change must trigger dependency validation across active SalesOrderLine, PurchaseOrderLine, inventory, fulfillment, and billing workflows before future use is restricted.
    - id: PRODUCT-004
      rule: Product master changes must not rewrite historical transaction descriptions, units, prices, tax determinations, quantities, or other evidence required to reproduce completed transactions.
    - id: PRODUCT-005
      rule: Any transaction quantity referencing a Product must use a compatible UnitOfMeasure or an approved conversion rule.
    - id: PRODUCT-006
      rule: Changing the default UnitOfMeasure must trigger validation of open transaction lines and inventory processes; it must not silently reinterpret existing quantities.
    - id: PRODUCT-007
      rule: Changing taxCategory must trigger re-evaluation of applicable future tax determination but must not rewrite issued InvoiceLine tax evidence.
    - id: PRODUCT-008
      rule: Changing standardPrice must not overwrite negotiated, contracted, quoted, or already-captured transaction prices.
    - id: PRODUCT-009
      rule: Retiring a Product must validate open commitments and dependent inventory before retirement becomes effective; existing obligations require their own controlled continuation, substitution, cancellation, or exception workflow.
    - {id: PRODUCT-EXE-001, rule: "Standard Price cannot be negative.", violatedWhen: "standard_price != null and standard_price < 0", message: "Standard Price cannot be negative."}
  lifecycle:
    title: Product Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, DISCONTINUED, BLOCKED, RETIRED]
    initial: DRAFT
    terminal: [DISCONTINUED, RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: BLOCKED, action: block}
      - {from: BLOCKED, to: ACTIVE, action: unblock}
      - {from: DRAFT, to: DISCONTINUED, action: discontinue}
      - {from: ACTIVE, to: DISCONTINUED, action: discontinue}
      - {from: BLOCKED, to: DISCONTINUED, action: discontinue}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: BLOCKED, to: RETIRED, action: retire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a product is stopped"
      description: "When a product is blocked, a high-priority task asks someone to resolve it."
      when: "status == \"BLOCKED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PRODUCT-EXCEPTION-{{id}}"
              name: "Resolve product {{name}}"
              description: "Product {{name}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
  help:
    summary: A canonical business offering or managed item that can be bought, sold, stocked, consumed, delivered or subscribed to, and that other processes refer to.
    businessMeaning: Product is the shared definition of what the business deals in. Sales, purchasing, stock, manufacturing and finance all refer to the same product record, so a price, a stock level and an invoice line are about the same thing.
    usage: Created by product management when an item enters the catalogue; maintained over its life; referenced on almost every order, movement and invoice line.
    relationshipContext: A product belongs to a ProductCategory and Brand, is supplied by Suppliers, is stored at Locations, has variants, attributes, packaging and a lifecycle history, and appears on order, stock and invoice lines.
    lifecycle: A product is drafted, becomes active when approved for trade, can be blocked while an issue is resolved, and ends discontinued or retired. History and past documents keep their reference.
    example: Item A-200, "Cordless drill 18V", a finished good in the Power Tools category, sold in cartons of four.
    workflowContext: Product create/update → validate category/unit/tax/location/supplier dependencies → propagate eligibility changes to open SalesOrderLine/PurchaseOrderLine and inventory workflows → resolve exceptions → permit future transactions. Product changes never silently recalculate issued documents or historical movements.
    changePropagation:
      status: [SalesOrderLine eligibility, PurchaseOrderLine eligibility, inventory operations, fulfillment eligibility, future InvoiceLine creation]
      unitOfMeasure: [open order quantities, receipt quantities, inventory operations, conversion rules]
      taxCategory: [future TaxRule determination, future InvoiceLine calculation]
      standardPrice: [future default pricing only]
      category: [catalog, assortment, reporting, policy eligibility]
      supplierRelationship: [future sourcing and PurchaseOrder eligibility]
      locationRelationship: [future operational availability and inventory configuration]
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PRODUCT}
