entity:
  name: Finding
  namespace: cedm.domain
  kind: governance_finding
  description: A governed observation of a control, audit, compliance, quality, or risk deficiency requiring disposition or remediation.
  ui:
    icon: table
  identity: {key: findingId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: findingId, type: uuid, required: true, immutable: true, help: {summary: The identity of the finding., usage: Generated when raised.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: When the finding was raised., usage: Set at issue.}}
  relationships:
    - {name: control, target: Control, cardinality: 0..1, ownership: reference, help: {summary: The control the finding is about., usage: Set where a specific control failed., cardinalityMeaning: At most one control., workflowRole: Links the deficiency to the control to be fixed., businessMeaning: Identifies deficient or tested control.}}
    - {name: risk, target: Risk, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: 'At most one risk, the exposure that the finding relates to.', summary: Risk informed by finding., businessMeaning: Connects evidence to risk governance., usage: Risk assessment and treatment., workflowRole: May trigger reassessment/treatment.}}
  invariants:
    - {id: FINDING-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An observation of a deficiency in a control, audit, compliance, quality or risk area that needs a decision or remediation.
    businessMeaning: Audits are only useful if what they find is followed up. A finding states the problem, how serious it is and what has to be done, so it can be tracked to closure.
    usage: Raised by auditors or reviewers; assigned for remediation; reviewed until closed.
    relationshipContext: A finding may concern a Control or a Risk.
    lifecycle: Finalised evidence is not silently rewritten; corrections or supersession are explicit.
    example: Finding that bank reconciliations were reviewed late in three of twelve months.
    whenUsed: Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable.
    commonProcesses: Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FINDING}
