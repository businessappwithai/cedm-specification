entity:
  name: Finding
  namespace: cedm.domain
  kind: governance_finding
  description: A governed observation of a control, audit, compliance, quality, or risk deficiency requiring disposition or remediation.
  ui:
    icon: table
  identity: {key: findingId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: findingId, type: uuid, required: true, immutable: true, help: {summary: 'The permanent identity of the finding, kept even when its wording or status is later revised.', usage: 'Generated when the finding is raised; remediation tasks, reviews and audit reports refer to it by this value.'}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: The moment from which the finding stands as an issued observation about the control or risk., usage: Set at issue by the auditor or reviewer; ageing of open findings and remediation deadlines are measured from it.}}
    - name: findingNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The reference by which the finding is cited in the audit report and in follow-up with management.
        usage: Unique; assigned when the auditor raises the finding and then used in tracking lists and committee reports.
        relationshipContext: Unique.
    - name: title
      type: string
      required: true
      maxLength: 200
      help:
        summary: A one-line statement of the weakness found, readable without opening the full finding.
        usage: Written by the auditor and shown in finding lists, dashboards and the issued report, so it should name the control or process affected.
        relationshipContext: Identifies the finding for people.
    - name: condition
      type: text
      required: true
      help:
        summary: The facts of what the auditor found, including what was observed and the evidence behind it.
        usage: Written by the auditor and agreed with management for accuracy before the report is issued; it should describe the situation, not the cause.
        relationshipContext: Agreed with management before the report is issued.
    - name: rootCause
      type: text
      required: false
      help:
        summary: The underlying reason the weakness arose, as agreed with management after analysis.
        usage: The agreed action should address this cause; without it, fixes tend to treat only the symptoms and the same finding returns.
        relationshipContext: Without it, fixes tend to address symptoms.
    - name: severity
      type: enum
      required: true
      default: MEDIUM
      values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      help:
        summary: How serious the weakness is, rated by the auditor against the organisation's risk scale.
        usage: Chosen when the finding is raised; it sets the due date for remediation, decides who is told, and feeds the audit's overall opinion.
        valueSemantics:
          LOW: A minor weakness where an improvement is recommended but no urgent action is needed.
          MEDIUM: A weakness to correct within the normal planning cycle.
          HIGH: A significant weakness to correct promptly.
          CRITICAL: A serious failure needing immediate action and senior attention.
        relationshipContext: Supports the audit's overall opinion.
    - name: agreedAction
      type: text
      required: false
      help:
        summary: The corrective action that management committed to take in response to the finding.
        usage: Written with the action owner after the finding is raised; the owner reports progress against it and the auditor later checks that it worked.
        relationshipContext: The owner reports against it.
    - name: dueDate
      type: date
      required: false
      help:
        summary: When the action is to be completed.
        usage: Agreed with management; overdue findings are escalated.
        relationshipContext: Set by severity.
    - name: remediatedDate
      type: date
      required: false
      help:
        summary: The date the action owner reported that the agreed action had been completed.
        usage: Recorded by the owner; it starts the auditor's verification, which follows before the finding can be closed.
        relationshipContext: Verification follows.
    - name: verifiedDate
      type: date
      required: false
      help:
        summary: The date the auditor confirmed that the fix is in place and actually works.
        usage: Recorded on verification and required to close the finding. It cannot be earlier than the remediated date.
        relationshipContext: Not before the remediated date.
    - name: status
      type: enum
      required: true
      default: OPEN
      values:
        - OPEN
        - IN_REMEDIATION
        - REMEDIATED
        - CLOSED
        - RISK_ACCEPTED
      help:
        summary: Shows where the finding is in its life, from being raised through remediation to closure.
        usage: Moved on by the action owner as work progresses, while only the auditor can close a finding after verifying the fix.
        valueSemantics:
          OPEN: Raised, but management has not yet agreed an action.
          IN_REMEDIATION: An action has been agreed and is under way.
          REMEDIATED: The owner reports the action complete and awaits verification.
          CLOSED: Verified by the auditor, so nothing more is required.
          RISK_ACCEPTED: Management decided not to act, with the approval required to carry the risk.
        relationshipContext: Only the auditor closes a finding.
  relationships:
    - {name: control, target: Control, cardinality: 0..1, ownership: reference, help: {summary: The control the finding is about., usage: Set where a specific control failed., cardinalityMeaning: At most one control., workflowRole: Links the deficiency to the control to be fixed., businessMeaning: Identifies deficient or tested control.}}
    - {name: risk, target: Risk, cardinality: 0..1, ownership: reference, help: {cardinalityMeaning: 'At most one risk, the exposure that the finding relates to.', summary: Risk informed by finding., businessMeaning: Connects evidence to risk governance., usage: Risk assessment and treatment., workflowRole: May trigger reassessment/treatment.}}
    - name: auditCase
      target: AuditCase
      cardinality: 0..1
      ownership: reference
      help:
        summary: The audit that raised the finding.
        usage: Set when the finding is raised.
        cardinalityMeaning: One per finding.
        context: The audit report lists its findings.
    - name: complianceRequirement
      target: ComplianceRequirement
      cardinality: 0..1
      ownership: reference
      help:
        summary: The requirement not met, for compliance findings.
        usage: Linked for regulatory and certification audits.
        cardinalityMeaning: At most one.
        context: Makes the finding a nonconformity against the requirement.
    - name: owner
      target: Person
      cardinality: 0..1
      ownership: reference
      help:
        summary: The manager responsible for the action.
        usage: Agreed with management.
        cardinalityMeaning: One per finding.
        context: Reports progress until closure.
  invariants:
    - {id: FINDING-001, rule: Finalized historical evidence must not be silently rewritten; corrections or supersession require explicit governed records.}
  help:
    summary: An observation of a deficiency in a control, audit, compliance, quality or risk area that needs a decision or remediation.
    businessMeaning: Audits are only useful if what they find is followed up. A finding states the problem, how serious it is and what has to be done, so it can be tracked to closure.
    usage: Raised by auditors or reviewers; assigned for remediation; reviewed until closed.
    relationshipContext: A finding may concern a Control or a Risk.
    lifecycle: Finalised evidence is not silently rewritten; corrections or supersession are explicit.
    example: Finding that bank reconciliations were reviewed late in three of twelve months.
    whenUsed: Used in contracts, documents, governance, compliance, risk, legal, service, finance, or audit workflows where applicable.
    commonProcesses: Contract management, document control, audit, compliance assessment, risk governance, approval, and remediation.
  lifecycle:
    title: Finding Lifecycle
    attribute: status
    states:
      - OPEN
      - IN_REMEDIATION
      - REMEDIATED
      - CLOSED
      - RISK_ACCEPTED
    initial: OPEN
    terminal:
      - CLOSED
      - RISK_ACCEPTED
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        action: agree_action
      - from: IN_REMEDIATION
        to: REMEDIATED
        action: remediate
      - from: REMEDIATED
        to: CLOSED
        action: verify
      - from: REMEDIATED
        to: IN_REMEDIATION
        action: reject_fix
      - from: OPEN
        to: RISK_ACCEPTED
        action: accept_risk
      - from: IN_REMEDIATION
        to: RISK_ACCEPTED
        action: accept_risk
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FINDING}
