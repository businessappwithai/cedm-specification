  attributes:
    - {name: findingId, type: uuid, required: true, immutable: true, help: {summary: Stable identity of Finding., businessMeaning: Identifies one governed record independently of mutable labels or state., usage: "Governance, workflow, integration and audit.", relationshipContext: Referenced by related enterprise records.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: Time at which this record becomes effective or evidentially applicable., businessMeaning: Establishes temporal business meaning., usage: "Lifecycle, audit and reporting.", relationshipContext: Does not rewrite earlier effective evidence.}}
  relationships:
    - {name: control, target: Control, cardinality: 0..1, ownership: reference, help: {summary: Control associated with finding., businessMeaning: Identifies deficient or tested control., usage: Audit and remediation., cardinalityMeaning: Optional for findings not control-specific., workflowRole: Finding resolution does not erase original evidence.}}
    - {name: risk, target: Risk, cardinality: 0..1, ownership: reference, help: {summary: Risk informed by finding., businessMeaning: Connects evidence to risk governance., usage: Risk assessment and treatment., cardinalityMeaning: Optional., workflowRole: May trigger reassessment/treatment.}}
