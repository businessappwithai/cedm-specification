entity:
  name: Container
  namespace: cedm.domain
  kind: logistics_asset
  description: A reusable intermodal freight container identified and managed as a physical equipment asset across terminals, depots, vessels, rail, road, and customer or carrier operations.
  identity:
    key: containerId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: containerId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The CEDM internal identity of the physical container asset.
        businessMeaning: Identifies one persistent container record regardless of where the container is located, who operates it, or which shipment currently uses it.
        usage: Used as the stable technical-to-business key by yard, depot, movement, repair, inventory, shipment, interchange, and reporting processes. It must not change when the container moves or changes operational status.
        relationshipContext: Other entities such as ContainerMovement, YardSlot, RepairEstimate, Shipment, and Location reference this identity to maintain the container's continuous history.
        requiredMeaning: Required because every operational event must be attributable to one unambiguous physical container.
    - name: containerNumber
      type: string
      required: true
      unique: true
      maxLength: 20
      help:
        summary: The externally recognizable container identification number painted or affixed to the equipment.
        businessMeaning: Represents the operational identity used by carriers, terminals, depots, customs, shipping documents, interchange messages, and gate operations to recognize the physical equipment.
        usage: Used for gate transactions, vessel and rail planning, yard searches, interchange records, shipment instructions, EDI messages, and customer-facing documents. It should be validated against the applicable container-numbering convention when an ISO identifier is required.
        relationshipContext: It is the human and industry-facing identifier of the same physical asset represented internally by containerId; movements and location records should preserve both identities.
        requiredMeaning: Required because operational actors normally identify equipment by its container number rather than by an internal UUID.
    - name: isoCode
      type: string
      required: false
      maxLength: 10
      help:
        summary: The standardized ISO equipment code describing the container's type and principal physical characteristics.
        businessMeaning: Provides a standardized classification such as equipment family, length/height characteristics, and special equipment characteristics used for planning and interchange.
        usage: Used by vessel stowage, transport planning, depot handling, equipment matching, EDI, interchange, and capacity calculations. It should be interpreted according to the applicable ISO container identification convention.
        relationshipContext: The code complements containerNumber and helps determine whether a container is compatible with a shipment, slot, handling operation, or transport plan.
        optionalMeaning: Optional only while standardized equipment classification is unavailable; operational processes that require equipment compatibility should not proceed without it.
    - name: sizeCode
      type: string
      required: false
      maxLength: 20
      help:
        summary: The operational size classification of the container, typically used to distinguish equipment dimensions such as 20-foot and 40-foot classes.
        businessMeaning: Describes the size category used for capacity planning, yard slot allocation, transport pricing, handling, and TEU calculations.
        usage: Used by yard planning, vessel and truck planning, equipment inventory, pricing, and reporting. It should remain consistent with the physical equipment and its standardized equipment classification.
        relationshipContext: Size affects where equipment can be stored, which transport resources can carry it, and how capacity metrics such as TEU are calculated.
        optionalMeaning: Optional when size can be derived from another authoritative equipment classification; it should not be populated inconsistently with isoCode.
    - name: containerType
      type: string
      required: false
      maxLength: 50
      help:
        summary: The operational equipment type of the container, such as dry van, refrigerated, tank, open-top, or other specialized equipment.
        businessMeaning: Identifies the functional equipment category and the handling, power, inspection, or safety requirements associated with it.
        usage: Used by equipment planning, yard operations, reefer monitoring, dangerous-goods handling, maintenance, and shipment compatibility rules.
        relationshipContext: Container type determines which processes and resources can safely handle the equipment and may constrain valid yard slots, transport modes, and service requirements.
        optionalMeaning: Optional when the equipment type is fully represented by a controlled equipment master; otherwise it is important for operational planning.
    - name: tareWeight
      type: decimal
      required: false
      precision: 14
      scale: 3
      help:
        summary: The empty weight of the container without cargo.
        businessMeaning: Represents the equipment's own mass and is required to calculate gross weight when cargo weight is known.
        usage: Used for transport weight calculations, vessel and road compliance, weighing, loading decisions, and interchange or regulatory documentation. The unit of measure must be defined by the surrounding equipment specification or measurement model.
        relationshipContext: Combined with cargo weight, it contributes to gross weight and therefore can affect transport restrictions and capacity decisions.
        optionalMeaning: Optional only when an authoritative equipment specification or weighing source can provide the value when needed.
    - name: maxGrossWeight
      type: decimal
      required: false
      precision: 14
      scale: 3
      help:
        summary: The maximum permissible gross weight of the container and its cargo under the applicable equipment specification and operating rules.
        businessMeaning: Defines an upper equipment limit used to determine whether a loaded container can be safely and legally handled or transported.
        usage: Used by booking, stuffing, weighing, road and rail planning, vessel planning, yard handling, and compliance checks.
        relationshipContext: It must be evaluated together with tareWeight, cargo weight, transport-mode limits, and applicable regulatory or carrier constraints.
        optionalMeaning: Optional only when the authoritative equipment specification is maintained elsewhere and can be resolved at the point of validation.
    - name: manufactureDate
      type: date
      required: false
      help:
        summary: The date on which the physical container equipment was manufactured.
        businessMeaning: Establishes the age of the equipment and supports inspection, maintenance, leasing, depreciation, resale, and retirement decisions.
        usage: Used by equipment lifecycle, repair estimation, maintenance, asset accounting, and compliance processes where equipment age is relevant.
        relationshipContext: Often interpreted with repair history, depreciation, purchase records, lease terms, and retirement criteria.
        optionalMeaning: Optional when the equipment provenance is incomplete, but its absence limits age-dependent decisions and analytics.
    - name: status
      type: enum
      required: true
      default: ACTIVE
      values: [ACTIVE, IN_REPAIR, DAMAGED, SOLD, SCRAPPED, LOST, RETIRED]
      help:
        summary: The current business lifecycle state of the container equipment.
        businessMeaning: Determines whether the equipment is available for operational use, undergoing repair, unavailable because of damage, or removed from the usable fleet.
        usage: Drives equipment availability, yard planning, repair workflows, sale or scrap disposition, and operational reporting. Status changes should occur through controlled business processes rather than arbitrary field edits.
        relationshipContext: A non-operational status can affect whether the container may be assigned to a YardSlot, Shipment, movement, or new work order.
        valueSemantics:
          ACTIVE: Equipment is available for normal operational assignment subject to other constraints.
          IN_REPAIR: Equipment is under a repair or maintenance process and should normally not be assigned to ordinary transport operations.
          DAMAGED: Equipment is known to have damage that may prevent normal use pending assessment or repair.
          SOLD: Ownership or commercial disposition has been transferred through a sale process and the equipment should no longer be treated as available inventory unless explicitly returned.
          SCRAPPED: Equipment has been designated for disposal and should not be assigned to operational movements.
          LOST: Equipment cannot currently be located and requires exception, investigation, or recovery handling.
          RETIRED: Equipment has been permanently removed from normal operational service without necessarily being sold or scrapped.
        requiredMeaning: Required because equipment availability and downstream operational decisions depend on an explicit lifecycle state.
    - name: inventoryStatus
      type: string
      required: false
      maxLength: 50
      help:
        summary: The operational inventory classification of the container within the owning equipment or depot inventory process.
        businessMeaning: Describes how the equipment is treated from an inventory perspective, which may differ from its physical or repair status.
        usage: Used for equipment inventory, depot availability, ownership or lease reporting, and disposition processes.
        relationshipContext: Should be interpreted alongside status, owner, lease or commercial records, and physical location; it is not a replacement for the equipment lifecycle status.
        optionalMeaning: Optional when inventory classification is maintained by a separate inventory subsystem.
  relationships:
    - name: owner
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the party that owns or is commercially responsible for the container equipment.
        usage: Used for equipment ownership, leasing, billing, maintenance responsibility, sale, and asset reporting.
        cardinalityMeaning: At most one owner may be associated with a container at a given point in this model; absence means ownership is not represented here.
        context: Ownership is distinct from the party currently using, transporting, storing, leasing, or physically holding the equipment.
    - name: currentLocation
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the current physical or operational location of the container.
        usage: Used for equipment visibility, inventory, routing, pickup planning, customer service, and exception management.
        cardinalityMeaning: A container has at most one current location in the model at a point in time; movement history is represented separately by ContainerMovement.
        context: currentLocation is the present-state shortcut and should remain consistent with the latest authoritative movement or location event.
    - name: currentSlot
      target: YardSlot
      cardinality: 0..1
      ownership: reference
      help:
        summary: Identifies the precise yard slot currently assigned to the container when it is physically stacked in a modeled yard.
        usage: Used by yard planning, crane or handling instructions, inventory visibility, searches, and movement optimization.
        cardinalityMeaning: A container can occupy zero or one active slot at a time; zero means it is not currently positioned in a modeled yard slot.
        context: currentSlot is more precise than currentLocation and should normally be populated only when the container is physically located in the referenced slot.
    - name: repairEstimates
      target: RepairEstimate
      cardinality: 0..*
      ownership: reference
      help:
        summary: Links the container to its repair estimate history and active repair assessments.
        usage: Used to determine damage scope, repair cost, disposition, authorization, and repair performance.
        cardinalityMeaning: A container may have many estimates over its lifecycle because estimates can be revised, reopened, or created for different repair events.
        context: RepairEstimate records explain repair decisions; they do not replace the container's physical lifecycle or movement history.
    - name: movements
      target: ContainerMovement
      cardinality: 0..*
      ownership: reference
      help:
        summary: Links the container to its chronological movement history between locations, yard positions, gates, and transport operations.
        usage: Used for traceability, yard optimization, dwell analysis, operational costing, and reconstructing where the equipment has been.
        cardinalityMeaning: A container may have many movements over its lifecycle.
        context: The movement history is event-like and should be treated as the source of operational chronology; currentLocation and currentSlot represent the current derived state.
  invariants:
    - id: CONTAINER-001
      rule: containerNumber must follow the applicable ISO 6346 identification convention when an ISO identifier is assigned.
    - id: CONTAINER-002
      rule: A container can occupy at most one active yard slot at a time.
    - id: CONTAINER-003
      rule: currentSlot may be populated only when the referenced slot is capable of holding the container and is not simultaneously assigned to another container.
  help:
    summary: Represents a reusable intermodal freight container as a continuously identifiable physical logistics asset.
    businessMeaning: Container is the core equipment object connecting transport, terminal, depot, yard, maintenance, inventory, leasing, ownership, and commercial processes. Its identity persists as it moves through locations and operational states.
    usage: Used as the equipment anchor for gate events, yard positioning, container movements, shipment assignments, interchange, inspection, repair, disposition, inventory, and asset reporting.
    relationshipContext: Container connects the physical asset to Party ownership, Location visibility, YardSlot positioning, ContainerMovement history, and RepairEstimate decisions. These relationships distinguish the asset itself from events and transactions involving it.
    lifecycle: Equipment normally progresses through operational availability, damage or repair, commercial disposition, and retirement states. A status transition should be justified by the corresponding operational, maintenance, sale, scrap, loss, or retirement process.
    example: A 40-foot dry container arrives at a depot, is assigned to a yard slot, later moves to a repair area, receives a repair estimate, returns to active inventory, and is eventually dispatched to a customer or another terminal while retaining the same container identity.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTAINER
