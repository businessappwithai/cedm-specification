entity:
  name: Trip
  namespace: cedm.domain
  kind: travel_entity
  description: A planned or completed journey involving one or more travelers, locations, bookings, or transport segments.
  ui:
    icon: table
    recordLabel: [tripNumber, name]
  identity:
    key: tripId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: tripId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the trip record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a trip store this identifier. The number or code people quote is a separate field.
  - name: tripNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the trip.
      usage: Quoted on bookings and expense claims.
      relationshipContext: Unique.
  - name: name
    type: string
    required: false
    maxLength: 300
    help:
      summary: The purpose of the trip, in a few words.
      usage: Shown in travel lists and approvals.
      relationshipContext: Names the destination or purpose.
  - name: startDate
    type: date
    required: true
    help:
      summary: The day the trip starts.
      usage: Used for approvals, bookings and allowances.
      relationshipContext: Not after the end.
  - name: endDate
    type: date
    required: false
    help:
      summary: The day the trip ends.
      usage: Used for allowances and reporting.
      relationshipContext: Not before the start.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - BOOKED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    help:
      summary: Where the trip stands.
      usage: Moved on by the traveller or travel desk.
      relationshipContext: Only completed trips are settled.
      valueSemantics:
        PLANNED: Being prepared.
        BOOKED: Travel and accommodation reserved.
        IN_PROGRESS: Under way.
        COMPLETED: Finished.
        CANCELLED: Called off.
  relationships:
  - name: traveler
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The people travelling.
      cardinalityMeaning: The declared cardinality 1..* expresses how many related records may participate in the relationship.
      usage: Added when planning.
      context: At least one traveller; a person may make many trips.
    inverseCardinality: 0..*
  - name: segments
    target: TripSegment
    cardinality: 0..*
    ownership: aggregate
    help:
      summary: The legs of the trip.
      usage: Planned and booked in order.
      cardinalityMeaning: Any number, kept with the trip.
      context: Line items of the trip.
  - name: bookings
    target: BusinessTransaction
    cardinality: 0..*
    ownership: reference
    help:
      summary: Reservations made for the trip.
      usage: Linked as bookings are made.
      cardinalityMeaning: Any number of bookings.
      context: Costs come from them.
    inverseCardinality: 0..*
  invariants:
  - id: TRIP-001
    rule: endDate must not precede startDate.
  - {id: TRIP-002, rule: A trip has at least one traveller.}
  lifecycle:
    title: Trip Lifecycle
    attribute: status
    states: [PLANNED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: BOOKED, action: book}
    - {from: BOOKED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: BOOKED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a trip is ended"
    description: "When a trip is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "TRIP-FOLLOW-UP-{{id}}"
          name: "Follow up on trip {{name}}"
          description: "Trip {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: A journey by one or more travellers, made of segments and bookings.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, TripSegment, BusinessTransaction. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Travellers and travel managers plan trips, book their segments and accommodation, follow them while under way, and close them for expense settlement and travel reporting.
    lifecycle: A trip is planned, booked once its segments are reserved, in progress while travelling, and completed on return; it can be cancelled before it ends.
    example: Trip TR-2024-0412 'Customer visits in Munich', Lisa Weber, 10–12 June 2024, two flights and one hotel, booked.
    businessMeaning: Travel approvals, costs and duty of care are managed per trip.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-TRIP
