entity:
  name: Enrollment
  namespace: cedm.domain
  kind: education_transaction
  description: A student's formal registration in an educational program or course.
  ui:
    icon: file-text
  identity:
    key: enrollmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: enrollmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the enrollment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a enrollment store this identifier. The number or code people quote is a separate field.
  - name: enrollmentNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: Captures the business meaning of enrollment number for the Enrollment. It is interpreted together with the entity's other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Enrollment records, where applicable.
      relationshipContext: Its meaning is specific to Enrollment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: enrolledAt
    type: datetime
    required: true
    help:
      summary: Records when the enrolled event occurred. It establishes chronology, supports auditability, and helps coordinate related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Enrollment records, where applicable.
      relationshipContext: Its meaning is specific to Enrollment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - COMPLETED
    - WITHDRAWN
    - CANCELLED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Enrollment records, where applicable.
      relationshipContext: Its meaning is specific to Enrollment; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      valueSemantics:
        PENDING: Represents the pending state or classification in the context of Enrollment.
        ACTIVE: Represents the active state or classification in the context of Enrollment.
        COMPLETED: Represents the completed state or classification in the context of Enrollment.
        WITHDRAWN: Represents the withdrawn state or classification in the context of Enrollment.
        CANCELLED: Represents the cancelled state or classification in the context of Enrollment.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  relationships:
  - name: student
    target: EducationStudent
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Enrollment to EducationStudent so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about EducationStudent records associated with a Enrollment.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  - name: program
    target: EducationProgram
    cardinality: '1'
    ownership: reference
    help:
      summary: Connects Enrollment to EducationProgram so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about EducationProgram records associated with a Enrollment.
      cardinalityMeaning: The declared cardinality 1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities, ownership, conditions, and invariants.
  invariants:
  - id: ENROLLMENT-001
    rule: a COMPLETED enrollment must have completion evidence or outcome where required by the program.
  lifecycle:
    title: Enrollment Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, WITHDRAWN, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, WITHDRAWN, CANCELLED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: PENDING, to: WITHDRAWN, action: withdraw}
    - {from: ACTIVE, to: WITHDRAWN, action: withdraw}
    - {from: PENDING, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when an enrollment is ended"
    description: "When an enrollment is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "ENROLLMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on enrollment {{enrollment_number}}"
          description: "Enrollment {{enrollment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when an enrollment is done"
    description: "When an enrollment is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "ENROLLMENT-COMPLETED-{{id}}"
          name: "Confirm enrollment {{enrollment_number}}"
          description: "Enrollment {{enrollment_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Represents an education transaction called Enrollment within the CEDM business model.
    businessMeaning: Enrollment is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find, change, or relate Enrollment records.
    relationshipContext: The entity participates in a wider business graph through relationships with EducationStudent, EducationProgram. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must preserve the declared business meaning and relationships.
    example: A typical Enrollment record represents one identifiable business occurrence or master-data object that can be referenced by related CEDM processes.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENROLLMENT
