entity:
  name: Enrollment
  namespace: cedm.domain
  kind: education_transaction
  description: A student's formal registration in an educational program or course.
  ui:
    icon: file-text
  identity:
    key: enrollmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: enrollmentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the enrollment record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a enrollment store this identifier. The number or code people quote is a separate field.
  - name: enrollmentNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The reference of the enrolment.
      usage: Printed on student documents and invoices.
      relationshipContext: Unique.
  - name: enrolledAt
    type: datetime
    required: true
    help:
      summary: When the student enrolled.
      usage: Recorded on confirmation; fees and attendance start from it.
      relationshipContext: Not later than the completion date.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - PENDING
    - ACTIVE
    - COMPLETED
    - WITHDRAWN
    - CANCELLED
    help:
      summary: Where the enrolment stands.
      usage: Moved on by the registrar.
      relationshipContext: Only active enrolments are billed and attend.
      valueSemantics:
        PENDING: Offered, waiting for confirmation.
        ACTIVE: The student is studying.
        COMPLETED: The programme is finished.
        WITHDRAWN: The student left before finishing.
        CANCELLED: Created in error.
  - name: studyMode
    type: enum
    required: true
    default: FULL_TIME
    values: [FULL_TIME, PART_TIME, DISTANCE]
    help:
      summary: How the student studies.
      usage: Decides fees, load and expected duration.
      relationshipContext: May change during the programme.
      valueSemantics:
        FULL_TIME: A full study load.
        PART_TIME: A reduced study load.
        DISTANCE: Studying remotely.
  - name: expectedCompletionDate
    type: date
    required: false
    help:
      summary: When the student is expected to finish.
      usage: Used for planning and progression reports.
      relationshipContext: Depends on the programme length and study mode.
  - name: completionDate
    type: date
    required: false
    help:
      summary: When the student finished or left.
      usage: Recorded when the enrolment ends.
      relationshipContext: Present once completed or withdrawn.
  - name: withdrawalReason
    type: string
    required: false
    maxLength: 300
    help:
      summary: Why the student withdrew.
      usage: Recorded when withdrawing; used in retention analysis.
      relationshipContext: Present only on withdrawals.
  relationships:
  - name: student
    target: EducationStudent
    cardinality: '1'
    ownership: reference
    help:
      summary: The student enrolled.
      usage: Chosen when enrolling.
      cardinalityMeaning: Every enrolment is of exactly one student.
      context: A student may hold several enrolments over time.
  - name: program
    target: EducationProgram
    cardinality: '1'
    ownership: reference
    help:
      summary: The programme the student is enrolled on.
      usage: Chosen when enrolling.
      cardinalityMeaning: Every enrolment is on exactly one programme.
      context: Its rules decide fees and duration.
  invariants:
  - {id: ENROLLMENT-001, rule: A withdrawal states its reason and date., violatedWhen: status == "WITHDRAWN" and (withdrawal_reason == null or completion_date == null), message: Give the withdrawal date and reason.}
  - {id: ENROLLMENT-EXE-001, rule: "An enrollment that is withdrawn states withdrawal reason.", violatedWhen: "status == \"WITHDRAWN\" and withdrawal_reason == null", message: "Give the withdrawal reason before the enrollment is withdrawn."}
  - {id: ENROLLMENT-EXE-002, rule: "An enrollment that is completed states when (completion date).", violatedWhen: "status == \"COMPLETED\" and completion_date == null", message: "Record completion date when the enrollment is completed."}
  lifecycle:
    title: Enrollment Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, WITHDRAWN, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, WITHDRAWN, CANCELLED]
    transitions:
    - {from: PENDING, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: COMPLETED, action: complete}
    - {from: PENDING, to: WITHDRAWN, action: withdraw}
    - {from: ACTIVE, to: WITHDRAWN, action: withdraw}
    - {from: PENDING, to: CANCELLED, action: cancel}
    - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when an enrollment is ended"
    description: "When an enrollment is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "ENROLLMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on enrollment {{enrollment_number}}"
          description: "Enrollment {{enrollment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when an enrollment is done"
    description: "When an enrollment is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "ENROLLMENT-COMPLETED-{{id}}"
          name: "Confirm enrollment {{enrollment_number}}"
          description: "Enrollment {{enrollment_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: A student's registration on a programme or course, from admission to completion.
    relationshipContext: The entity participates in a wider business graph through relationships with EducationStudent, EducationProgram. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    businessMeaning: An enrolment is the student's contract with the institution for one programme. It records when they enrolled, how they study, their progress and how it ended, and is what fees, attendance, grades and awards are recorded against.
    usage: Registrars create enrolments when students accept their place; academic staff record progress; finance bills fees against them; graduation and withdrawal close them.
    lifecycle: Pending until confirmed, active while the student studies, and completed on finishing the programme; a student may withdraw, and an enrolment created in error is cancelled.
    example: 'Enrolment EN-2024-00871: Amina Diallo on the BSc Computer Science, full-time, enrolled 16 September 2024, expected to finish June 2027.'
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENROLLMENT
