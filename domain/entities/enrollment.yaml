entity:
  name: Enrollment
  namespace: cedm.domain
  kind: education_transaction
  description: A student's formal registration in an educational program or course.
  ui:
    icon: file-text
  identity:
    key: enrollmentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: enrollmentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the enrolment.
        usage: Generated on creation; grades and fees refer to it.
    - name: enrollmentNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference number of the enrolment, quoted in correspondence.
        usage: Allocated at registration; unique.
    - name: enrolledAt
      type: datetime
      required: true
      help:
        summary: The date and time the registration was made.
        usage: Set when the student registers; used to order registrations and apply deadlines.
    - name: status
      type: enum
      required: true
      default: PENDING
      values:
        - PENDING
        - ACTIVE
        - COMPLETED
        - WITHDRAWN
        - CANCELLED
      help:
        summary: Whether the registration is confirmed and where it ends.
        usage: Moved by the registrar.
        valueSemantics:
          PENDING: Requested and awaiting confirmation, for example of prerequisites or payment.
          ACTIVE: Confirmed; the student is studying.
          COMPLETED: Finished successfully. A final state.
          WITHDRAWN: The student left before completing. A final state.
          CANCELLED: Withdrawn before it began. A final state.
  relationships:
    - name: student
      target: EducationStudent
      cardinality: '1'
      ownership: reference
      help:
        summary: The student who is enrolled.
        usage: Set at registration.
        cardinalityMeaning: Exactly one student, because an enrolment is a particular learner's registration.
        workflowRole: Attaches the study record to the learner.
    - name: program
      target: EducationProgram
      cardinality: '1'
      ownership: reference
      help:
        summary: The program in which the student is enrolled.
        usage: Chosen at registration.
        cardinalityMeaning: 'Exactly one program: the enrolment is a registration for a particular course of study.'
        workflowRole: Determines the requirements for completion.
    - {name: course, target: EducationCourse, cardinality: "0..1", ownership: reference, help: {summary: 'The course, when the enrolment is for a single course.', usage: Set when a student registers for a course directly., cardinalityMeaning: At most one course., workflowRole: Narrows the enrolment from a whole program to one course., businessMeaning: Adds curriculum participation context alongside program enrollment.}}
    - {name: class, target: Class, cardinality: "0..1", ownership: reference, help: {summary: 'The scheduled class, when the student is placed in a particular offering.', usage: Set when a place is allocated., cardinalityMeaning: At most one class., workflowRole: Places the student in a timetable., businessMeaning: Establishes delivery-instance membership for attendance and assessment.}}
    - {name: grades, target: Grade, cardinality: "0..*", ownership: reference, help: {summary: The grades earned under the enrolment., usage: Read to produce transcripts., cardinalityMeaning: 'Any number, one per assessed item.', workflowRole: Accumulate towards completion., businessMeaning: Connects academic results to registration context.}}
    - {name: fees, target: Fee, cardinality: "0..*", ownership: reference, help: {summary: The fees charged for the enrolment., usage: Read by finance., cardinalityMeaning: 'Any number, such as tuition and lab fees.', workflowRole: Billing follows enrolment., businessMeaning: Connects program/course participation to student charges.}}

  invariants:
    - id: ENROLLMENT-001
      rule: a COMPLETED enrollment must have completion evidence or outcome where required by the program.
  lifecycle:
    title: Enrollment Lifecycle
    attribute: status
    states: [PENDING, ACTIVE, COMPLETED, WITHDRAWN, CANCELLED]
    initial: PENDING
    terminal: [COMPLETED, WITHDRAWN, CANCELLED]
    transitions:
      - {from: PENDING, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: COMPLETED, action: complete}
      - {from: PENDING, to: WITHDRAWN, action: withdraw}
      - {from: ACTIVE, to: WITHDRAWN, action: withdraw}
      - {from: PENDING, to: CANCELLED, action: cancel}
      - {from: ACTIVE, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a enrollment is ended"
      description: "When a enrollment is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ENROLLMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on enrollment {{enrollment_number}}"
              description: "Enrollment {{enrollment_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a enrollment is done"
      description: "When a enrollment is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "ENROLLMENT-COMPLETED-{{id}}"
              name: "Confirm enrollment {{enrollment_number}}"
              description: "Enrollment {{enrollment_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: A student's formal registration in an educational program or course.
    businessMeaning: Enrolment is the moment a learner becomes part of a program. Fees, attendance, grades and eligibility to graduate all hang from it.
    usage: Created at registration; confirmed; completed or withdrawn; read by the registrar, teachers and finance.
    relationshipContext: An enrolment links an EducationStudent to an EducationProgram, and may be for a particular EducationCourse and Class. Grades and fees attach to it.
    lifecycle: An enrolment is pending until confirmed, active while the student studies, and ends completed, withdrawn or cancelled. A completed enrolment needs completion evidence where the program requires it.
    example: Enrolment of student 20260417 in the engineering program, confirmed on 1 September.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-ENROLLMENT
