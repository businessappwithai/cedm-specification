entity:
  name: Document
  namespace: cedm.domain
  kind: core_business_entity
  description: A business document that records, communicates, supports, or evidences business information or activity.
  ui:
    icon: file-text
  identity:
    key: documentId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: documentId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the document record.
        usage: Generated on creation; attachments, versions and references use it.
    - name: documentNumber
      type: string
      required: true
      maxLength: 100
      help:
        summary: The number printed on the document.
        usage: Allocated from a number series; unique within the owner's context and document type.
    - name: documentType
      type: string
      required: true
      maxLength: 100
      help:
        summary: The kind of document, such as purchase order, contract or invoice.
        usage: Chosen at creation; decides numbering, templates and retention.
    - name: documentDate
      type: date
      required: true
      help:
        summary: The date shown on the document.
        usage: Entered or defaulted to today; used in reports.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ISSUED
        - APPROVED
        - CANCELLED
        - ARCHIVED
      help:
        summary: Where the document stands from draft to archive.
        usage: Moved by the author and approvers.
        valueSemantics:
          DRAFT: Being written; not yet issued.
          ISSUED: Released to its audience.
          APPROVED: Accepted by the authorised approver.
          CANCELLED: Withdrawn; kept for history.
          ARCHIVED: No longer active; retained for the required period.
    - name: title
      type: string
      required: false
      maxLength: 500
      help:
        summary: The heading of the document.
        usage: Shown in lists and search results.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A summary of what the document says or is for.
        usage: Written by the author; helps people find it.
    - name: documentVersion
      type: integer
      required: true
      default: 1
      minimum: 1
      help:
        summary: The revision number of the document, starting at 1.
        usage: Incremented each time a new revision is issued; at least 1.
    - name: issuedAt
      type: datetime
      required: false
      help:
        summary: When the document was issued.
        usage: Set on issue; before this it is a draft.
    - name: createdAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the document record was created.
        usage: Set by the system; part of the audit trail.
    - name: updatedAt
      type: datetime
      required: true
      systemManaged: true
      help:
        summary: When the document record last changed.
        usage: Set by the system on each change.
  relationships:
    - name: owner
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The organisation that owns the document.
        usage: Set at creation; controls who may change it.
        cardinalityMeaning: At most one owner.
        workflowRole: Decides responsibility for the content.
    - name: parties
      target: Party
      cardinality: 0..*
      ownership: reference
      help:
        summary: The parties the document concerns.
        usage: Added as relevant, such as sender and recipient.
        cardinalityMeaning: Any number.
        workflowRole: Lets a party find the documents that concern them.
    - name: location
      target: Location
      cardinality: 0..1
      ownership: reference
      help:
        summary: The place the document relates to.
        usage: Set where location matters, for example a site report.
        cardinalityMeaning: At most one location.
        workflowRole: Ties the document to a physical place.
  invariants:
    - id: DOCUMENT-001
      rule: documentVersion must be greater than or equal to 1.
    - id: DOCUMENT-002
      rule: documentNumber must be unique within the owning business context and document type.
  audit:
    enabled: true
  lifecycle:
    title: Document Lifecycle
    attribute: status
    states: [DRAFT, ISSUED, APPROVED, CANCELLED, ARCHIVED]
    initial: DRAFT
    terminal: [ARCHIVED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ISSUED, action: issue}
      - {from: ISSUED, to: APPROVED, action: approve}
      - {from: APPROVED, to: ARCHIVED, action: archive}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ISSUED, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a document is ended"
      description: "When a document is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "DOCUMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on document {{title}}"
              description: "Document {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A business document that records, communicates, supports or evidences business information or activity.
    businessMeaning: 'Business runs on documents: orders, invoices, letters, reports. A document record gives each one an identity, status and version, so what was issued and when can always be shown.'
    usage: Created when a document is drafted or received; moved through issue and approval; read whenever someone needs the evidence.
    relationshipContext: A document is owned by an Organization, concerns Parties and may relate to a Location.
    lifecycle: A document is drafted, issued, approved, and archived at the end of its useful life; it can be cancelled before it is final.
    example: Purchase order PO-20413, issued on 3 March and approved by the purchasing manager.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DOCUMENT
