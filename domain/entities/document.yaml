entity:
  name: Document
  namespace: cedm.domain
  kind: core_business_entity
  description: A business document that records, communicates, supports, or evidences business information or activity.
  ui:
    icon: file-text
  identity:
    key: documentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: documentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the document record associated with this Document. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets transactions, parties and audits link to exactly this document and version, even when several documents share a title."
  - name: documentNumber
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of document number for the Document. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference printed on the document that recipients quote back when querying or citing it."
  - name: documentType
    type: string
    required: true
    maxLength: 100
    help:
      summary: Captures the business meaning of document type for the Document. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The kind of document, such as certificate, report or letter, which decides how it is filed, who must approve it and how long it is kept."
  - name: documentDate
    type: date
    required: true
    help:
      summary: Records the business date associated with the document. It is used in chronology, eligibility, scheduling,
        reporting, and related business rules.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The date the document speaks for, as printed on it; people rely on it to know which period or event the document evidences."
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ISSUED
    - APPROVED
    - CANCELLED
    - ARCHIVED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Document.
        ISSUED: Represents the issued state or classification in the context of Document.
        APPROVED: Represents the approved state or classification in the context of Document.
        CANCELLED: Represents the cancelled state or classification in the context of Document.
        ARCHIVED: Represents the archived state or classification in the context of Document.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Tells users whether the document is still a draft, has been issued, has been approved, was cancelled, or has been archived, and therefore whether it can still be changed or relied upon."
  - name: title
    type: string
    required: false
    maxLength: 500
    help:
      summary: Captures the business meaning of title for the Document. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The heading people recognise the document by when searching or reviewing a list, such as Annual Safety Inspection Report."
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "A short explanation of what the document covers and why it exists, so a reader can judge its relevance without opening it."
  - name: version
    type: integer
    required: true
    default: 1
    minimum: 1
    help:
      summary: Captures the business meaning of version for the Document. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which revision this is; readers check it to be sure they are working from the latest approved wording."
  - name: issuedAt
    type: datetime
    required: false
    help:
      summary: Records when the issued event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "When the document was formally released to its recipients; deadlines and validity periods often count from this moment."
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and
        operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the document record was first started, useful for tracking how long drafts take to issue."
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording the latest modification of the record. It supports synchronization,
        audit, and change detection.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the document was last changed, helping reviewers notice recent edits before relying on it."
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Document to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Document.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: parties
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Document to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Document.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Document to Location so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Location records associated with a Document.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: DOCUMENT-001
    rule: version must be greater than or equal to 1.
  - id: DOCUMENT-002
    rule: documentNumber must be unique within the owning business context and document type.
  audit:
    enabled: true
  lifecycle:
    title: Document Lifecycle
    attribute: status
    states: [DRAFT, ISSUED, APPROVED, CANCELLED, ARCHIVED]
    initial: DRAFT
    terminal: [ARCHIVED, CANCELLED]
    transitions:
      - {from: DRAFT, to: ISSUED, action: issue}
      - {from: ISSUED, to: APPROVED, action: approve}
      - {from: APPROVED, to: ARCHIVED, action: archive}
      - {from: DRAFT, to: CANCELLED, action: cancel}
      - {from: ISSUED, to: CANCELLED, action: cancel}
      - {from: APPROVED, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a document is ended"
      description: "When a document is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "DOCUMENT-FOLLOW-UP-{{id}}"
              name: "Follow up on document {{title}}"
              description: "Document {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: "One document is a business record such as a letter, certificate, report or form that communicates or evidences something the business did, with its own number, version and issue status."
    businessMeaning: Document is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Document records.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party,
      Location. These relationships provide the context needed to interpret the record rather than treating its fields as
      isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Document record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "A document is created as a draft, issued to the parties it concerns, and approved where sign-off is required; it is then kept as evidence and archived at the end of its retention use, or cancelled if it is withdrawn before approval. Other processes attach it to parties, locations and transactions as supporting evidence."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DOCUMENT
