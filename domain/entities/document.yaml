entity:
  name: Document
  namespace: cedm.domain
  kind: core_business_entity
  description: A business document that records, communicates, supports, or evidences business information or activity.
  ui:
    icon: file-text
    recordLabel: [documentNumber, title]
  identity:
    key: documentId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: documentId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the document record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a document store this identifier. The number or code people quote is a separate field.
  - name: documentNumber
    type: string
    required: true
    maxLength: 100
    help:
      summary: The number of the document.
      usage: Quoted wherever the document is referred to.
      relationshipContext: Unique within its document type.
  - name: documentType
    type: string
    required: true
    maxLength: 100
    help:
      summary: What kind of document it is, such as specification, letter or certificate.
      usage: Decides its template, approvals and retention.
      relationshipContext: Read with its classification.
  - name: documentDate
    type: date
    required: true
    help:
      summary: The date the document bears.
      usage: Used for filing and retention.
      relationshipContext: Not necessarily when it was created in the system.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ISSUED
    - APPROVED
    - CANCELLED
    - ARCHIVED
    help:
      summary: Where the document is in its life.
      usage: Moved on by its author and approvers.
      relationshipContext: Only approved documents count as authoritative.
      valueSemantics:
        DRAFT: Being written.
        ISSUED: Issued for use or review.
        APPROVED: Approved and authoritative.
        CANCELLED: Withdrawn.
        ARCHIVED: Kept for history.
  - name: title
    type: string
    required: false
    maxLength: 500
    help:
      summary: The title of the document.
      usage: Shown in lists and searches.
      relationshipContext: Identifies the document for people.
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: What the document is about.
      usage: Helps people find the right document.
      relationshipContext: Free text.
  - name: issuedAt
    type: datetime
    required: false
    help:
      summary: When the document was issued.
      usage: Recorded on issue.
      relationshipContext: Present once issued.
  - name: createdAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording when the record was created. It supports auditability, chronology, and operational reporting.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: updatedAt
    type: datetime
    required: true
    systemManaged: true
    help:
      summary: The system-managed timestamp recording the latest modification of the record. It supports synchronization, audit, and change detection.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Document records, where applicable.
      relationshipContext: Its meaning is specific to Document; it must be interpreted with the entity's relationships, lifecycle, and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without this value.
  - name: revisionNumber
    type: integer
    required: true
    default: 1
    help:
      summary: The revision of the document — 1 for the first issue.
      usage: Increased with each new version.
      relationshipContext: Each revision's content is kept as a document version.
  relationships:
  - name: owner
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization that owns the document.
      usage: Set when it is created.
      cardinalityMeaning: At most one.
      context: Its staff may change it.
  - name: parties
    target: Party
    cardinality: 0..*
    ownership: reference
    help:
      summary: The parties the document concerns.
      usage: Added when relevant.
      cardinalityMeaning: Many parties per document; a party appears in many documents.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  - name: location
    target: Location
    cardinality: 0..1
    ownership: reference
    help:
      summary: The site the document concerns.
      usage: Set when relevant.
      cardinalityMeaning: At most one.
      context: Used in site document lists.
  invariants:
  - id: DOCUMENT-001
    rule: version must be greater than or equal to 1.
  - id: DOCUMENT-002
    rule: documentNumber must be unique within the owning business context and document type.
  audit:
    enabled: true
  lifecycle:
    title: Document Lifecycle
    attribute: status
    states: [DRAFT, ISSUED, APPROVED, CANCELLED, ARCHIVED]
    initial: DRAFT
    terminal: [ARCHIVED, CANCELLED]
    transitions:
    - {from: DRAFT, to: ISSUED, action: issue}
    - {from: ISSUED, to: APPROVED, action: approve}
    - {from: APPROVED, to: ARCHIVED, action: archive}
    - {from: DRAFT, to: CANCELLED, action: cancel}
    - {from: ISSUED, to: CANCELLED, action: cancel}
    - {from: APPROVED, to: CANCELLED, action: cancel}
  workflows:
  - name: FollowUpRequired
    title: "Follow up when a document is ended"
    description: "When a document is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "DOCUMENT-FOLLOW-UP-{{id}}"
          name: "Follow up on document {{title}}"
          description: "Document {{title}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  help:
    summary: Represents a core business entity called Document within the CEDM business model.
    businessMeaning: Document is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Party, Location. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: People create documents in the business's processes — letters, specifications, certificates, reports — classify them, issue them and file them; other records link to the documents that evidence them; retention rules decide how long they are kept.
    lifecycle: Drafted, issued, approved where approval is required, and archived when no longer in active use. A document can be cancelled before approval. Content changes are new document versions.
    example: Document DOC-2024-01882 'Specification — bearing housing H-40', specification, dated 4 March 2024, version 3, approved, owner Product Engineering.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-DOCUMENT
