entity:
  name: Control
  namespace: cedm.domain
  kind: governance_entity
  description: A policy, procedure, mechanism, or activity designed to prevent, detect, or reduce a business risk.
  ui:
    icon: sliders-horizontal
    recordLabel: [code, name]
  identity:
    key: controlId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: controlId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the control record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a control store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the control, such as P2P-07.
      usage: Used in risk-control matrices and audit reports.
      relationshipContext: Unique.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the control, such as "Three-way match before payment".
      usage: Shown in risk and audit reports.
      relationshipContext: Identifies the control for people.
  - name: description
    type: string
    required: true
    maxLength: 4000
    help:
      summary: What the control does, who does it and what evidence it leaves.
      usage: Read by the owner who operates it and the auditor who tests it.
      relationshipContext: Specific enough that two people would operate it the same way.
  - name: controlType
    type: enum
    required: true
    values:
    - PREVENTIVE
    - DETECTIVE
    - CORRECTIVE
    - DIRECTIVE
    help:
      summary: How the control works against its risk.
      usage: Chosen when the control is designed.
      relationshipContext: A strong control set mixes preventive and detective controls.
      valueSemantics:
        PREVENTIVE: Stops the problem from happening, such as an approval before payment.
        DETECTIVE: Finds the problem after it happened, such as a reconciliation.
        CORRECTIVE: Puts things right once a problem is found.
        DIRECTIVE: Tells people what to do, such as a policy or procedure.
  - name: frequency
    type: enum
    required: true
    values:
    - CONTINUOUS
    - DAILY
    - WEEKLY
    - MONTHLY
    - QUARTERLY
    - ANNUAL
    - EVENT_DRIVEN
    - AD_HOC
    help:
      summary: How often the control is performed.
      usage: Decides how many occurrences an auditor samples.
      relationshipContext: Event-driven controls run each time the event occurs.
      valueSemantics:
        CONTINUOUS: All the time, usually automated.
        DAILY: Every day.
        WEEKLY: Every week.
        MONTHLY: Every month.
        QUARTERLY: Every quarter.
        ANNUAL: Once a year.
        EVENT_DRIVEN: Each time a triggering event occurs, such as a new supplier.
        AD_HOC: When someone decides it is needed.
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: Whether the control is in operation.
      usage: Moved on by the control owner.
      relationshipContext: Only active controls are tested.
      valueSemantics:
        DRAFT: Being designed.
        ACTIVE: In operation.
        INACTIVE: Temporarily not operated.
        RETIRED: No longer used.
  - name: automation
    type: enum
    required: true
    default: MANUAL
    values: [MANUAL, SEMI_AUTOMATED, AUTOMATED]
    help:
      summary: Whether a person or the system performs the control.
      usage: Automated controls are tested differently from manual ones.
      relationshipContext: Semi-automated controls have a manual review of system output.
      valueSemantics:
        MANUAL: Performed by a person.
        SEMI_AUTOMATED: The system prepares; a person reviews.
        AUTOMATED: Performed by the system.
  - name: isKeyControl
    type: boolean
    required: true
    default: false
    help:
      summary: Whether the control is relied on for financial reporting or a critical risk.
      usage: Key controls are tested every year.
      relationshipContext: Read with the risks it addresses.
  - name: effectiveness
    type: enum
    required: true
    default: NOT_TESTED
    values: [NOT_TESTED, EFFECTIVE, PARTIALLY_EFFECTIVE, INEFFECTIVE]
    help:
      summary: The result of the latest test.
      usage: Updated by the tester; ineffective controls lead to findings.
      relationshipContext: Read with the last test date.
      valueSemantics:
        NOT_TESTED: Not yet tested.
        EFFECTIVE: Designed and operating as intended.
        PARTIALLY_EFFECTIVE: Works with weaknesses.
        INEFFECTIVE: Does not achieve its purpose.
  - name: lastTestedDate
    type: date
    required: false
    help:
      summary: When the control was last tested.
      usage: Testing plans prioritise controls not tested recently.
      relationshipContext: Empty until the first test.
  relationships:
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person who performs or answers for the control.
      usage: Assigned when the control is designed.
      cardinalityMeaning: At most one.
      context: Receives test results and findings.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The part of the organization where the control operates.
      usage: Set when the control is designed.
      cardinalityMeaning: At most one.
      context: Used in reports by unit.
  - name: risks
    target: Risk
    cardinality: 0..*
    ownership: reference
    help:
      summary: The risks the control addresses.
      usage: Mapped in the risk-control matrix.
      cardinalityMeaning: A control addresses many risks; a risk has many controls.
      context: A many-to-many relation.
  - name: policies
    target: Policy
    cardinality: 0..*
    ownership: reference
    help:
      summary: The policies the control implements.
      usage: Mapped by compliance.
      cardinalityMeaning: A control implements many policies; a policy has many controls.
      context: A many-to-many relation.
  lifecycle:
    title: Control Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: INACTIVE, action: deactivate}
    - {from: INACTIVE, to: ACTIVE, action: reactivate}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: A specific check or safeguard that keeps a risk in bounds, such as an approval, a reconciliation or an access restriction.
    businessMeaning: Control is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization, Risk, Policy. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Risk and compliance teams define controls, assign owners and map them to the risks and policies they address; owners operate them; internal audit tests them and rates their effectiveness; failed controls lead to findings and corrective action.
    lifecycle: Drafted while designed, active while operated, inactive when paused, and retired when no longer needed. A retired control keeps its test history.
    example: "Control P2P-07 'Three-way match before payment': preventive, continuous and automated, owner the AP manager, addresses risk R-012 'Payment of goods not received', key control, tested effective 30 June 2024."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTROL
