entity:
  name: Control
  namespace: cedm.domain
  kind: governance_entity
  description: A policy, procedure, mechanism, or activity designed to prevent, detect, or reduce a business risk.
  ui:
    icon: sliders-horizontal
  identity:
    key: controlId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: controlId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the control record associated with this Control. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Keeps risk assessments, policy mappings and audit test results attached to the same control even when its name or wording is revised."
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: A human-readable business code used to identify or reference the record in operational processes and integrations.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "The reference auditors and control owners use in risk registers, test plans and findings, such as FIN-AP-03, so everyone discusses the same safeguard."
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The human-readable name used by people, reports, searches, and related business processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "A short statement of what the control does, such as 'Dual approval for payments over 10,000', that owners and auditors recognise in registers and reports."
  - name: description
    type: string
    required: true
    maxLength: 4000
    help:
      summary: A business description that explains the purpose, scope, or meaning of the record to users and downstream processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Explains how the control is performed, by whom and with what evidence, so a new owner can operate it and an auditor can test it consistently."
  - name: controlType
    type: enum
    required: true
    values:
    - PREVENTIVE
    - DETECTIVE
    - CORRECTIVE
    - DIRECTIVE
    help:
      summary: Captures the business meaning of control type for the Control. It is interpreted together with the entity's
        other attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        PREVENTIVE: Represents the preventive state or classification in the context of Control.
        DETECTIVE: Represents the detective state or classification in the context of Control.
        CORRECTIVE: Represents the corrective state or classification in the context of Control.
        DIRECTIVE: Represents the directive state or classification in the context of Control.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Says how the control reduces risk: preventive controls stop a problem before it happens, detective ones find it afterwards, corrective ones fix it, and directive ones guide behaviour through rules or instructions; auditors weigh coverage by this mix."
  - name: frequency
    type: enum
    required: true
    values:
    - CONTINUOUS
    - DAILY
    - WEEKLY
    - MONTHLY
    - QUARTERLY
    - ANNUAL
    - EVENT_DRIVEN
    - AD_HOC
    help:
      summary: Captures the business meaning of frequency for the Control. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        CONTINUOUS: Represents the continuous state or classification in the context of Control.
        DAILY: Represents the daily state or classification in the context of Control.
        WEEKLY: Represents the weekly state or classification in the context of Control.
        MONTHLY: Represents the monthly state or classification in the context of Control.
        QUARTERLY: Represents the quarterly state or classification in the context of Control.
        ANNUAL: Represents the annual state or classification in the context of Control.
        EVENT_DRIVEN: Represents the event driven state or classification in the context of Control.
        AD_HOC: Represents the ad hoc state or classification in the context of Control.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "States how often the control must be performed, from continuous system checks to daily, monthly, annual, event-driven or ad hoc execution, which drives owner reminders and how many samples an auditor tests."
  - name: status
    type: enum
    required: true
    default: ACTIVE
    values:
    - DRAFT
    - ACTIVE
    - INACTIVE
    - RETIRED
    help:
      summary: The lifecycle state of the record. It controls which business actions are normally permitted and how the record
        is treated by related processes.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Control records, where applicable.
      relationshipContext: Its meaning is specific to Control; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      valueSemantics:
        DRAFT: Represents the draft state or classification in the context of Control.
        ACTIVE: Represents the active state or classification in the context of Control.
        INACTIVE: Represents the inactive state or classification in the context of Control.
        RETIRED: Represents the retired state or classification in the context of Control.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Shows whether the control is still being designed, is operating and relied on, is temporarily switched off, or has been retired; only active controls count as mitigating a risk."
  relationships:
  - name: owner
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Control to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Control.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: organization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Control to Organization so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Organization records associated with a Control.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: risks
    target: Risk
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Control to Risk so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Risk records associated with a Control.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  - name: policies
    target: Policy
    cardinality: 0..*
    ownership: reference
    help:
      summary: Connects Control to Policy so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Policy records associated with a Control.
      cardinalityMeaning: The declared cardinality 0..* expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  lifecycle:
    title: Control Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, INACTIVE, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: INACTIVE, action: deactivate}
      - {from: INACTIVE, to: ACTIVE, action: reactivate}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: INACTIVE, to: RETIRED, action: retire}
  help:
    summary: "A safeguard the organisation operates to prevent, detect or correct a business risk, such as a dual approval on payments or a monthly bank reconciliation, kept so owners, testers and auditors know what is in place."
    businessMeaning: Control is a business concept with its own identity and lifecycle. It captures information that must
      remain understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Control records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party, Organization,
      Risk, Policy. These relationships provide the context needed to interpret the record rather than treating its fields
      as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Control record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "Risk or compliance teams draft the control and link it to the risks it mitigates and the policies that require it, the control owner activates it and performs it at its stated frequency, auditors test it, it may be deactivated temporarily and reactivated, and it is retired when the risk or process no longer exists."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-CONTROL
