entity:
  name: FoodBatch
  namespace: cedm.domain
  kind: food_industry_entity
  description: A traceable batch of food or beverage product produced or received under controlled conditions.
  ui:
    icon: table
    recordLabel: [batchNumber]
  identity:
    key: foodBatchId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: foodBatchId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the food batch record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a food batch store this identifier. The number or code people quote is a separate field.
  - name: batchNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number printed on the packs of the batch.
      usage: Used for traceability, labels and recalls.
      relationshipContext: Unique.
  - name: productionDate
    type: date
    required: false
    help:
      summary: The day the batch was produced or packed.
      usage: Printed on labels; starts shelf-life calculations.
      relationshipContext: Not after the expiry date.
  - name: expiryDate
    type: date
    required: false
    help:
      summary: The use-by or best-before date of the batch.
      usage: Drives stock rotation and expiry of the batch.
      relationshipContext: Not before the production date.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    help:
      summary: Whether the batch can be used or sold.
      usage: Set by quality staff after inspection.
      relationshipContext: Only released batches are shipped or consumed.
      valueSemantics:
        PLANNED: Scheduled for production; not made yet.
        QUARANTINED: Made or received and held pending inspection.
        RELEASED: Passed inspection; may be used or sold.
        REJECTED: Failed inspection; to be destroyed or returned.
        EXPIRED: Past its expiry date.
        CONSUMED: Fully used or sold.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product the batch is made of.
      usage: Set when the batch is registered.
      cardinalityMeaning: Exactly one product per batch.
      context: The product's specification applies to the batch.
  - name: supplier
    target: Supplier
    cardinality: 0..1
    ownership: reference
    help:
      summary: The supplier the batch was bought from, for received batches.
      usage: Set for purchased batches; empty for own production.
      cardinalityMeaning: At most one supplier.
      context: Supplier claims and recalls trace through it.
  - name: qualityInspections
    target: QualityInspection
    cardinality: 0..*
    ownership: reference
    help:
      summary: Inspections performed on the batch.
      usage: Linked when an inspection is recorded.
      cardinalityMeaning: Any number of inspections per batch.
      context: A batch is released only after a passed inspection.
    inverseCardinality: '1'
  invariants:
  - id: FOOD-BATCH-001
    rule: expiryDate must not precede productionDate.
  lifecycle:
    title: Food Batch Lifecycle
    attribute: status
    states: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    initial: PLANNED
    terminal: [REJECTED, EXPIRED, CONSUMED]
    transitions:
    - {from: PLANNED, to: QUARANTINED, action: produce}
    - {from: QUARANTINED, to: RELEASED, action: release}
    - {from: QUARANTINED, to: REJECTED, action: reject}
    - {from: RELEASED, to: QUARANTINED, action: hold}
    - {from: RELEASED, to: CONSUMED, action: consume}
    - {from: RELEASED, to: EXPIRED, action: expire}
    - {from: QUARANTINED, to: EXPIRED, action: expire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a food batch is stopped"
      description: "When a food batch is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FOOD-BATCH-EXCEPTION-{{id}}"
              name: "Resolve food batch {{batch_number}}"
              description: "Food batch {{batch_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a food batch is ended"
      description: "When a food batch is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FOOD-BATCH-FOLLOW-UP-{{id}}"
              name: "Follow up on food batch {{batch_number}}"
              description: "Food batch {{batch_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a food industry entity called FoodBatch within the CEDM business model.
    businessMeaning: FoodBatch is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Product, Supplier, QualityInspection. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Quality and production staff register each batch made or received, hold it in quarantine until inspection, release it for use or sale, and trace it forward and back when a recall is needed.
    lifecycle: A batch is planned when production is scheduled, quarantined once it exists, then released after inspection or rejected; a released batch is consumed, expires, or is put back on hold.
    example: Batch YG-240312-02 of 'Greek yoghurt 500 g', produced 12 March 2024, expires 2 April 2024; released after micro test QI-8812.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FOOD-BATCH
