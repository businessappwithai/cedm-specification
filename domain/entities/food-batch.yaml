entity:
  name: FoodBatch
  namespace: cedm.domain
  kind: food_industry_entity
  description: A traceable batch of food or beverage product produced or received under controlled conditions.
  identity: {key: foodBatchId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: foodBatchId, type: uuid, required: true, immutable: true}
    - {name: batchNumber, type: string, required: true, unique: true, maxLength: 100}
    - {name: productionDate, type: date, required: false}
    - {name: expiryDate, type: date, required: false}
    - {name: status, type: enum, required: true, default: QUARANTINED, values: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]}
  relationships:
    - {name: product, target: Product, cardinality: "1", ownership: reference}
    - {name: supplier, target: Supplier, cardinality: "0..1", ownership: reference}
    - {name: qualityInspections, target: QualityInspection, cardinality: "0..*", ownership: reference}
  invariants:
    - {id: FOOD-BATCH-001, rule: expiryDate must not precede productionDate.}
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-FOOD-BATCH}
