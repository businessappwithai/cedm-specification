entity:
  name: FoodBatch
  namespace: cedm.domain
  kind: food_industry_entity
  description: A traceable batch of food or beverage product produced or received under controlled conditions.
  ui:
    icon: table
  identity:
    key: foodBatchId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: foodBatchId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the batch record.
        usage: Generated on creation; inspections and stock movements refer to it.
    - name: batchNumber
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The lot number on the packaging.
        usage: Allocated at production or receipt; unique, and the key for traceability and recall.
    - name: productionDate
      type: date
      required: false
      help:
        summary: The date the batch was produced.
        usage: Entered at production; the start of shelf life.
    - name: expiryDate
      type: date
      required: false
      help:
        summary: The date after which the batch must not be sold or used.
        usage: Set from the product's shelf life; must not be before the production date.
    - name: status
      type: enum
      required: true
      default: PLANNED
      values:
        - PLANNED
        - QUARANTINED
        - RELEASED
        - REJECTED
        - EXPIRED
        - CONSUMED
      help:
        summary: Whether the batch may be used or sold.
        usage: Set by quality; only RELEASED batches may be shipped.
        valueSemantics:
          PLANNED: Scheduled but not yet produced or received.
          QUARANTINED: Held until quality checks pass.
          RELEASED: Passed checks and available.
          REJECTED: Failed checks; must not be used. A final state.
          EXPIRED: Past its expiry date. A final state.
          CONSUMED: Used up. A final state.
  relationships:
    - name: product
      target: Product
      cardinality: '1'
      ownership: reference
      help:
        summary: The product that the batch is of.
        usage: Set at creation.
        cardinalityMeaning: 'Exactly one product: a batch is a lot of a particular item.'
        workflowRole: Gives the batch its specification and shelf life.
    - name: supplier
      target: Supplier
      cardinality: 0..1
      ownership: reference
      help:
        summary: The supplier that provided the batch, when it was bought in.
        usage: Set at receipt; used for supplier quality tracking.
        cardinalityMeaning: At most one supplier; own-produced batches have none.
        workflowRole: Allows a problem to be traced back to its source.
    - name: qualityInspections
      target: QualityInspection
      cardinality: 0..*
      ownership: reference
      help:
        summary: The inspections carried out on the batch.
        usage: Read when deciding release.
        cardinalityMeaning: Any number of inspections.
        workflowRole: Release depends on passing them.
  invariants:
    - id: FOOD-BATCH-001
      rule: expiryDate must not precede productionDate.
  lifecycle:
    title: Food Batch Lifecycle
    attribute: status
    states: [PLANNED, QUARANTINED, RELEASED, REJECTED, EXPIRED, CONSUMED]
    initial: PLANNED
    terminal:
      - CONSUMED
      - REJECTED
      - EXPIRED
    transitions:
      - {from: PLANNED, to: QUARANTINED, action: receive}
      - {from: QUARANTINED, to: RELEASED, action: release}
      - {from: QUARANTINED, to: REJECTED, action: reject}
      - {from: QUARANTINED, to: EXPIRED, action: expire}
      - {from: RELEASED, to: QUARANTINED, action: quarantine}
      - {from: RELEASED, to: CONSUMED, action: consume}
      - {from: RELEASED, to: EXPIRED, action: expire}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a food batch is stopped"
      description: "When a food batch is quarantined, a high-priority task asks someone to resolve it."
      when: "status == \"QUARANTINED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FOOD-BATCH-EXCEPTION-{{id}}"
              name: "Resolve food batch {{batch_number}}"
              description: "Food batch {{batch_number}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a food batch is ended"
      description: "When a food batch is rejected, a task asks someone to settle what depended on it."
      when: "status == \"REJECTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "FOOD-BATCH-FOLLOW-UP-{{id}}"
              name: "Follow up on food batch {{batch_number}}"
              description: "Food batch {{batch_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: A traceable batch of food or beverage product that was produced or received under controlled conditions.
    businessMeaning: Food safety depends on tracing. If a problem is found, the batch record shows what was in it, where it came from, how it was checked and where it went, so a recall can be limited to what is affected.
    usage: Created at production or receipt; held in quarantine until checks pass; released and consumed; read by quality and recall teams.
    relationshipContext: A batch is of one Product, may come from a Supplier, and is judged through QualityInspections.
    lifecycle: A batch is planned, held in quarantine on arrival, released when checks pass, and ends consumed, rejected or expired. A released batch can be quarantined again if a concern arises.
    example: Batch L240318 of oat drink, produced on 18 March, held for microbiological tests and released two days later.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-FOOD-BATCH
