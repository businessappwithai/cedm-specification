entity:
  name: BusinessProcess
  namespace: cedm.domain
  kind: process_definition_entity
  description: A defined sequence of business activities, decisions, events, and outcomes that accomplishes a business objective.
  ui:
    icon: settings
    recordLabel: [code, name]
  identity:
    key: businessProcessId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: businessProcessId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the business process record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a business process store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The code of the process, such as P2P-01.
      usage: Used in the process map and wherever the process is referred to.
      relationshipContext: Unique together with the version.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: The name of the process, such as "Procure to pay".
      usage: Shown in the process map.
      relationshipContext: Identifies the process for people.
  - name: description
    type: string
    required: false
    maxLength: 4000
    help:
      summary: What the process achieves, where it starts and where it ends.
      usage: Read by everyone working in the process.
      relationshipContext: Detailed steps are in its workflows.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - RETIRED
    help:
      summary: Whether the process is in force.
      usage: Moved on by the process owner.
      relationshipContext: Only active processes are followed.
      valueSemantics:
        DRAFT: Being designed.
        ACTIVE: In force.
        SUSPENDED: Temporarily not followed.
        RETIRED: Replaced or no longer used.
  - name: effectiveFrom
    type: date
    required: false
    help:
      summary: The first day the process applies.
      usage: Set when it is approved.
      relationshipContext: Not later than the effective-to date.
  - name: effectiveTo
    type: date
    required: false
    help:
      summary: The last day the process applies.
      usage: Set when it is replaced.
      relationshipContext: Empty while in force.
  - name: processVersion
    type: string
    required: true
    maxLength: 20
    default: 1
    help:
      summary: The version of the process definition.
      usage: Increased when the process changes.
      relationshipContext: Only one version is active at a time.
  relationships:
  - name: ownerOrganization
    target: Organization
    cardinality: 0..1
    ownership: reference
    help:
      summary: The organization that owns the process.
      usage: Set when the process is defined.
      cardinalityMeaning: At most one.
      context: Its head is accountable for the process.
  - name: workflows
    target: Workflow
    cardinality: 0..*
    ownership: reference
    help:
      summary: The workflows that automate parts of the process.
      usage: Linked as they are built.
      cardinalityMeaning: Any number; a workflow belongs to one process.
      context: The workflow records its process.
  - name: tasks
    target: Task
    cardinality: 0..*
    ownership: reference
    help:
      summary: Tasks raised while the process runs.
      usage: Linked by the workflows.
      cardinalityMeaning: Any number; each task belongs to one process.
      context: The task records its process.
    inverseCardinality: '1'
  - name: documents
    target: Document
    cardinality: 0..*
    ownership: reference
    help:
      summary: Procedures, forms and other documents describing the process.
      usage: Linked by the process owner.
      cardinalityMeaning: Many documents per process; a document may describe several processes.
      context: A many-to-many relation.
    inverseCardinality: 0..*
  invariants:
  - id: PROCESS-001
    rule: effectiveTo must not be earlier than effectiveFrom.
  - id: PROCESS-002
    rule: Only one active version may be effective for a given process code and effective period unless explicitly configured for parallel versions.
  - {id: BUSINESS-PROCESS-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Business Process Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: DRAFT, to: RETIRED, action: retire}
    - {from: ACTIVE, to: RETIRED, action: retire}
    - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A documented way the organisation gets something done, such as order to cash or hire to retire, with its steps and owner.
    relationshipContext: The entity participates in a wider business graph through relationships with Organization, Workflow, Task, Document. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Process owners document the business's processes, their owners and their effective periods; workflows, tasks and documents are linked to the process they belong to; process reviews and audits start from it.
    lifecycle: Drafted while being designed, active while in force, suspended while it is paused, and retired when replaced; only one version of a process is active at a time.
    example: Process P2P-01 'Procure to pay', version 3, owner the procurement director, active from 1 January 2024; workflows for requisition approval and invoice matching.
    businessMeaning: Naming processes and their owners lets the organisation improve them, automate them with workflows, and show auditors how work is controlled.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BUSINESS-PROCESS
