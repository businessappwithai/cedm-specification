entity:
  name: BusinessProcess
  namespace: cedm.domain
  kind: process_definition_entity
  description: A defined sequence of business activities, decisions, events, and outcomes that accomplishes a business objective.
  ui:
    icon: settings
  identity:
    key: businessProcessId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: businessProcessId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the process, constant across its versions' editing.
    - name: code
      type: string
      required: true
      unique: true
      maxLength: 100
      help:
        summary: The reference by which the process is named in documents and discussions, for example P2P-001.
    - name: name
      type: string
      required: true
      maxLength: 300
      help:
        summary: The title of the process, such as Procure to Pay.
    - name: description
      type: string
      required: false
      maxLength: 4000
      help:
        summary: A narrative of what the process achieves, where it starts and ends and who takes part.
    - name: processVersion
      type: string
      required: true
      default: '1.0'
      maxLength: 30
      help:
        summary: The revision of the process definition, so a change to how work is done is traceable.
        usage: Incremented by the process owner when the steps change; runs of the process record the version they followed.
    - name: status
      type: enum
      required: true
      default: DRAFT
      values:
        - DRAFT
        - ACTIVE
        - SUSPENDED
        - RETIRED
      help:
        valueSemantics:
          DRAFT: Being designed; not yet in use.
          ACTIVE: Approved and in use.
          SUSPENDED: Temporarily withdrawn, for example while being reworked; not used for new runs.
          RETIRED: Permanently replaced or discontinued; kept for history.
    - name: effectiveFrom
      type: date
      required: false
      help:
        summary: The first date on which this version of the process applies.
    - name: effectiveTo
      type: date
      required: false
      help:
        summary: The last date on which this version of the process applies.
        usage: Set when a successor takes over; must not precede the effective-from date.
  relationships:
    - name: ownerOrganization
      target: Organization
      cardinality: 0..1
      ownership: reference
      help:
        summary: The part of the organisation accountable for the process.
        cardinalityMeaning: At most one owner; a process without an owner is a gap to resolve.
    - name: workflows
      target: Workflow
      cardinality: 0..*
      ownership: reference
      help:
        summary: The workflows that automate or carry out the process.
        cardinalityMeaning: Any number, as one process can be realised by several workflows.
    - name: tasks
      target: Task
      cardinality: 0..*
      ownership: reference
      help:
        summary: The tasks that make up the process's work.
        cardinalityMeaning: Any number, accumulating as the process is run.
    - name: documents
      target: Document
      cardinality: 0..*
      ownership: reference
      help:
        summary: The documents that describe or support the process, such as procedures and forms.
        cardinalityMeaning: Any number.
  invariants:
    - id: PROCESS-001
      rule: effectiveTo must not be earlier than effectiveFrom.
    - id: PROCESS-002
      rule: Only one active version may be effective for a given process code and effective period unless explicitly configured for parallel versions.
    - {id: BUSINESS-PROCESS-EXE-001, rule: "Effective To must not be earlier than effective from.", violatedWhen: "effective_from != null and effective_to != null and effective_to < effective_from", message: "Effective To cannot be earlier than effective from."}
  lifecycle:
    title: Business Process Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, RETIRED]
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT, to: ACTIVE, action: activate}
      - {from: ACTIVE, to: SUSPENDED, action: suspend}
      - {from: SUSPENDED, to: ACTIVE, action: resume}
      - {from: DRAFT, to: RETIRED, action: retire}
      - {from: ACTIVE, to: RETIRED, action: retire}
      - {from: SUSPENDED, to: RETIRED, action: retire}
  help:
    summary: A defined sequence of activities, decisions and events that together achieve a business objective.
    businessMeaning: Naming and versioning a process gives the organisation one agreed description of how a piece of work is done, so teams, systems and auditors refer to the same thing and changes are controlled.
    usage: Defined by process owners; linked to the workflows, tasks and documents that carry it out; read by managers, analysts and auditors.
    relationshipContext: A process is owned by an Organization and realised by Workflows, Tasks and supporting Documents.
    lifecycle: A process is drafted, becomes active when approved for use, may be suspended for rework, and is retired when replaced. Only one version is normally effective for a given period.
    example: The order-to-cash process, version 3.0, owned by Finance and effective from 1 January.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-BUSINESS-PROCESS
