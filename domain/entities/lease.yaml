entity:
  name: Lease
  namespace: cedm.domain
  kind: real_estate_commercial_entity
  description: A contractual arrangement granting a party rights to use a property or asset for a defined period and consideration.
  ui:
    icon: key-round
    recordLabel: [leaseNumber]
  identity:
    key: leaseId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: leaseId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the lease record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a lease store this identifier. The number or code people quote is a separate field.
  - name: leaseNumber
    type: string
    required: true
    unique: true
    maxLength: 100
    help:
      summary: The number of the lease.
      usage: Quoted on invoices and correspondence.
      relationshipContext: Unique.
  - name: leaseType
    type: enum
    required: true
    values:
    - OPERATING
    - FINANCE
    - COMMERCIAL
    - RESIDENTIAL
    - EQUIPMENT
    - OTHER
    help:
      summary: The kind of lease.
      usage: Decides how the lease is accounted for and which terms apply.
      relationshipContext: Chosen when drafting.
      valueSemantics:
        OPERATING: Use without transfer of ownership risks, for accounting.
        FINANCE: Transfers most ownership risks, for accounting.
        COMMERCIAL: A lease of business premises.
        RESIDENTIAL: A lease of a home.
        EQUIPMENT: A lease of machinery or vehicles.
        OTHER: Any other kind.
  - name: startDate
    type: date
    required: true
    help:
      summary: The first day of the lease.
      usage: Rent is due from it.
      relationshipContext: Not after the end date.
  - name: endDate
    type: date
    required: false
    help:
      summary: The last day of the lease.
      usage: Drives expiry and renewal reminders.
      relationshipContext: Empty for open-ended leases.
  - name: status
    type: enum
    required: true
    default: DRAFT
    values:
    - DRAFT
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    - TERMINATED
    - CANCELLED
    help:
      summary: Where the lease stands.
      usage: Changed by the property manager.
      relationshipContext: Only active leases are invoiced.
      valueSemantics:
        DRAFT: Being negotiated.
        ACTIVE: Signed and running.
        SUSPENDED: Temporarily not in effect.
        EXPIRED: Reached its end date.
        TERMINATED: Ended early by a party.
        CANCELLED: Abandoned before it started.
  - name: periodicAmount
    type: money
    required: false
    help:
      summary: The rent or instalment due each period.
      usage: Invoiced or paid each period.
      relationshipContext: Not negative.
  relationships:
  - name: property
    target: Property
    cardinality: 0..1
    ownership: reference
    help:
      summary: The property leased, when the lease is of real estate.
      usage: Set when drafting.
      cardinalityMeaning: At most one property.
      context: Empty for equipment leases.
  - name: lessor
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The party granting the use.
      usage: Set when drafting.
      cardinalityMeaning: Each lease has one lessor.
      context: Receives the rent.
  - name: lessee
    target: Party
    cardinality: '1'
    ownership: reference
    help:
      summary: The party granted the use.
      usage: Set when drafting.
      cardinalityMeaning: Each lease has one lessee.
      context: Pays the rent.
  - name: contract
    target: Contract
    cardinality: 0..1
    ownership: reference
    help:
      summary: The signed contract behind the lease.
      usage: Linked once signed.
      cardinalityMeaning: At most one contract.
      context: The contract's terms govern the lease.
  invariants:
  - id: LEASE-001
    rule: endDate must not precede startDate.
  - {id: LEASE-EXE-001, rule: "Periodic Amount cannot be negative.", violatedWhen: "periodic_amount != null and periodic_amount < 0", message: "Periodic Amount cannot be negative."}
  lifecycle:
    title: Lease Lifecycle
    attribute: status
    states: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED, CANCELLED]
    initial: DRAFT
    terminal: [EXPIRED, TERMINATED, CANCELLED]
    transitions:
    - {from: DRAFT, to: ACTIVE, action: activate}
    - {from: ACTIVE, to: SUSPENDED, action: suspend}
    - {from: SUSPENDED, to: ACTIVE, action: resume}
    - {from: ACTIVE, to: EXPIRED, action: expire}
    - {from: SUSPENDED, to: EXPIRED, action: expire}
    - {from: ACTIVE, to: TERMINATED, action: terminate}
    - {from: SUSPENDED, to: TERMINATED, action: terminate}
    - {from: DRAFT, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a lease is ended"
      description: "When a lease is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "LEASE-FOLLOW-UP-{{id}}"
              name: "Follow up on lease {{lease_number}}"
              description: "Lease {{lease_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a real estate commercial entity called Lease within the CEDM business model.
    businessMeaning: Lease is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Property, Party, Party, Contract. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Property and asset managers record leases with their parties, term and rent; finance invoices or pays the periodic amount and accounts for the lease; managers track expiries and renewals.
    lifecycle: A lease is drafted, active once signed and started, may be suspended and resumed, and ends when it expires at the end of its term or is terminated early; a draft may be cancelled.
    example: Lease LS-2024-014, commercial lease of unit 3B at Via Roma 12 from Immobiliare Sud to Caffè Nero Srl, 1 May 2024–30 April 2030, 3,800 EUR a month, active.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-LEASE
