entity:
  name: Milestone
  namespace: cedm.domain
  kind: project_management_entity
  description: A significant planned achievement or checkpoint within a project or process.
  ui:
    icon: table
    recordLabel: [code, name]
  identity:
    key: milestoneId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: milestoneId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the milestone record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a milestone store this identifier. The number or code people quote is a separate field.
  - name: code
    type: string
    required: true
    maxLength: 100
    help:
      summary: The short code of the milestone within its project.
      usage: Used in plans and status reports.
      relationshipContext: Unique within the project.
  - name: name
    type: string
    required: true
    maxLength: 300
    help:
      summary: What is achieved at the milestone.
      usage: Shown on timelines and reports.
      relationshipContext: Stated as an outcome.
  - name: targetDate
    type: date
    required: true
    help:
      summary: The date the milestone should be reached.
      usage: Progress is reported against it.
      relationshipContext: Changes are recorded in the project's history.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values:
    - PLANNED
    - AT_RISK
    - ACHIEVED
    - MISSED
    - CANCELLED
    help:
      summary: Whether the milestone is on track, reached or missed.
      usage: Updated by the project manager.
      relationshipContext: Achieved and missed milestones are final.
      valueSemantics:
        PLANNED: On track.
        AT_RISK: The target date is threatened.
        ACHIEVED: Reached.
        MISSED: Not reached by its date.
        CANCELLED: No longer relevant.
  relationships:
  - name: project
    target: Project
    cardinality: '1'
    ownership: reference
    help:
      summary: The project the milestone belongs to.
      usage: Set when the milestone is created.
      cardinalityMeaning: Each milestone belongs to one project.
      context: Shown on the project's timeline.
  - name: tasks
    target: ProjectTask
    cardinality: 0..*
    ownership: reference
    help:
      summary: The tasks that must finish to reach the milestone.
      usage: Linked when planning.
      cardinalityMeaning: Any number of tasks.
      context: Late tasks put the milestone at risk.
  lifecycle:
    title: Milestone Lifecycle
    attribute: status
    states: [PLANNED, AT_RISK, ACHIEVED, MISSED, CANCELLED]
    initial: PLANNED
    terminal: [ACHIEVED, MISSED, CANCELLED]
    transitions:
    - {from: PLANNED, to: AT_RISK, action: flag_at_risk}
    - {from: AT_RISK, to: PLANNED, action: recover}
    - {from: PLANNED, to: ACHIEVED, action: achieve}
    - {from: AT_RISK, to: ACHIEVED, action: achieve}
    - {from: PLANNED, to: MISSED, action: miss}
    - {from: AT_RISK, to: MISSED, action: miss}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: AT_RISK, to: CANCELLED, action: cancel}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a milestone is ended"
      description: "When a milestone is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "MILESTONE-FOLLOW-UP-{{id}}"
              name: "Follow up on milestone {{name}}"
              description: "Milestone {{name}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: Represents a project management entity called Milestone within the CEDM business model.
    businessMeaning: Milestone is a business concept with its own identity and lifecycle. It captures information that must remain understandable independently of a database, API, or user interface.
    relationshipContext: The entity participates in a wider business graph through relationships with Project, ProjectTask. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Project managers set milestones with target dates, link the tasks that lead to them, flag those at risk, and report which were achieved or missed to sponsors.
    lifecycle: A milestone is planned, flagged at risk when its date is threatened and back to planned when recovered, and ends achieved, missed, or cancelled.
    example: Milestone M3 'Go-live of the new warehouse system', project WMS-2024, target 30 September 2024, at risk.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-MILESTONE
