entity:
  name: Putaway
  namespace: cedm.domain
  kind: warehouse_execution_transaction
  description: A governed warehouse task directing received or staged inventory to an eligible storage location, with physical relocation represented by InventoryTransfer and InventoryMovement.
  ui:
    icon: file-text
  identity: {key: putawayId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: putawayId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the putaway record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a putaway store this identifier. The number or code people quote is a separate field.
  - name: quantity
    type: decimal
    required: true
    precision: 20
    scale: 6
    help:
      summary: How many units are to be put away.
      businessMeaning: Defines task execution quantity.
      usage: Set from the receipt or transfer.
      relationshipContext: In the product's stock unit.
  - name: status
    type: enum
    required: true
    default: PLANNED
    values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED, EXCEPTION]
    help:
      summary: Where the putaway task stands.
      businessMeaning: Controls executable storage work.
      usage: Moved on by release and by the operator.
      relationshipContext: Stock becomes available in the target location on completion.
      valueSemantics:
        PLANNED: Created, not yet released.
        RELEASED: Released to operators.
        IN_PROGRESS: Being moved.
        COMPLETED: Confirmed in the target location.
        CANCELLED: No longer needed.
        EXCEPTION: Stopped by a problem, such as a full location.
  - name: putawayNumber
    type: string
    required: true
    unique: true
    maxLength: 40
    help:
      summary: The reference of the putaway task.
      usage: Shown on the operator's device.
      relationshipContext: Unique.
  - name: completedAt
    type: datetime
    required: false
    help:
      summary: When the goods were confirmed in their storage location.
      usage: Recorded by the operator's device.
      relationshipContext: Present once completed.
  relationships:
  - name: product
    target: Product
    cardinality: '1'
    ownership: reference
    help:
      summary: The product put away.
      businessMeaning: Identifies handled inventory.
      workflowRole: Must match transfer.
      usage: Set from the receipt.
      cardinalityMeaning: Every putaway moves exactly one product.
      context: Its storage conditions limit the target locations.
  - name: sourceLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: Where the goods are taken from, usually the receiving area.
      businessMeaning: Current controlled position.
      workflowRole: Must contain eligible stock.
      usage: Set from the receipt.
      cardinalityMeaning: Exactly one.
      context: Goods leave this location on completion.
  - name: targetLocation
    target: InventoryLocation
    cardinality: '1'
    ownership: reference
    help:
      summary: The storage location the goods go to.
      businessMeaning: Selected eligible storage position.
      workflowRole: Zone/location constraints must be satisfied.
      usage: Chosen by the putaway rules.
      cardinalityMeaning: Exactly one.
      context: Must be able to hold the product and quantity.
  - name: handlingUnit
    target: HandlingUnit
    cardinality: 0..1
    ownership: reference
    help:
      summary: The pallet or carton moved.
      businessMeaning: Supports scan-based execution.
      workflowRole: Handling-unit location must reconcile.
      usage: Scanned by the operator.
      cardinalityMeaning: At most one.
      context: Moving a unit moves everything on it.
  - name: inventoryTransfer
    target: InventoryTransfer
    cardinality: '1'
    ownership: reference
    help:
      summary: The stock transfer the putaway carries out.
      businessMeaning: Separates warehouse task from stock ledger.
      workflowRole: Completed task must reconcile to posted movement.
      usage: Created with the putaway.
      cardinalityMeaning: Every putaway carries out exactly one transfer.
      context: The transfer records the stock movement.
  invariants:
  - {id: PUTAWAY-001, rule: A completed putaway records when it finished., violatedWhen: status == "COMPLETED" and completed_at == null, message: Record when the putaway was completed.}
  - {id: PUTAWAY-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Putaway Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED, EXCEPTION]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
    - {from: PLANNED, to: RELEASED, action: release}
    - {from: RELEASED, to: IN_PROGRESS, action: start}
    - {from: IN_PROGRESS, to: COMPLETED, action: complete}
    - {from: RELEASED, to: EXCEPTION, action: mark_exception}
    - {from: EXCEPTION, to: RELEASED, action: resolve_exception}
    - {from: IN_PROGRESS, to: EXCEPTION, action: mark_exception}
    - {from: EXCEPTION, to: IN_PROGRESS, action: resolve_exception}
    - {from: PLANNED, to: CANCELLED, action: cancel}
    - {from: RELEASED, to: CANCELLED, action: cancel}
    - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
    - {from: EXCEPTION, to: CANCELLED, action: cancel}
  workflows:
  - name: ExceptionRaised
    title: "Raise a task when a putaway is stopped"
    description: "When a putaway is exception, a high-priority task asks someone to resolve it."
    when: "status == \"EXCEPTION\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: resolve"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PUTAWAY-EXCEPTION-{{id}}"
          name: "Resolve putaway {{id}}"
          description: "Putaway {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
          task_type: "USER"
          status: "CREATED"
          priority: "HIGH"
  - name: FollowUpRequired
    title: "Follow up when a putaway is ended"
    description: "When a putaway is cancelled, a task asks someone to settle what depended on it."
    when: "status == \"CANCELLED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: follow up on"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PUTAWAY-FOLLOW-UP-{{id}}"
          name: "Follow up on putaway {{id}}"
          description: "Putaway {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
          task_type: "USER"
          status: "CREATED"
          priority: "NORMAL"
  - name: CompletionConfirmed
    title: "Confirm when a putaway is done"
    description: "When a putaway is completed, a task asks someone to confirm the outcome."
    when: "status == \"COMPLETED\" and status != _previous_status"
    steps:
    - id: S1
      type: CreateEntity
      label: "Raise a task: confirm"
      properties:
        entity: Task
        as: taskId
        fields:
          code: "PUTAWAY-COMPLETED-{{id}}"
          name: "Confirm putaway {{id}}"
          description: "Putaway {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
          task_type: "USER"
          status: "CREATED"
          priority: "LOW"
  help:
    summary: Directed inbound/staging-to-storage warehouse task.
    businessMeaning: Putaway says where stock should be stored; InventoryTransfer/InventoryMovement prove physical relocation.
    usage: Receiving, cross-dock exceptions, replenishment and storage optimization.
    relationshipContext: InventoryLocation/Zone define eligibility; HandlingUnit supports physical execution.
    lifecycle: Planned → released → in progress → completed, cancelled or exception.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PUTAWAY}
