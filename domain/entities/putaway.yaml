entity:
  name: Putaway
  namespace: cedm.domain
  kind: warehouse_execution_transaction
  description: A governed warehouse task directing received or staged inventory to an eligible storage location, with physical relocation represented by InventoryTransfer and InventoryMovement.
  ui:
    icon: file-text
  identity: {key: putawayId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: putawayId, type: uuid, required: true, immutable: true, help: {summary: Stable putaway-task identity., businessMeaning: Identifies one directed storage action., usage: Receiving and WMS execution., relationshipContext: Connects source staging to target storage.}}
    - {name: quantity, type: decimal, required: true, precision: 20, scale: 6, help: {summary: Quantity directed for storage., businessMeaning: Defines task execution quantity., usage: Putaway confirmation and variance., relationshipContext: Must reconcile with transfer/movement.}}
    - name: status
      type: enum
      required: true
      default: PLANNED
      values: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED, EXCEPTION]
      help: {summary: Putaway task state., businessMeaning: Controls executable storage work., usage: WMS orchestration., relationshipContext: Completion alone does not alter stock without inventory posting., valueSemantics: {PLANNED: Proposed., RELEASED: Authorized., IN_PROGRESS: Being executed., COMPLETED: Confirmed and reconciled., CANCELLED: Terminated., EXCEPTION: Requires resolution.}}
  relationships:
    - {name: product, target: Product, cardinality: '1', ownership: reference, help: {summary: Product being stored., businessMeaning: Identifies handled inventory., usage: Location eligibility., cardinalityMeaning: Exactly one Product., workflowRole: Must match transfer.}}
    - {name: sourceLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: Receiving/staging origin., businessMeaning: Current controlled position., usage: Execution., cardinalityMeaning: Exactly one source., workflowRole: Must contain eligible stock.}}
    - {name: targetLocation, target: InventoryLocation, cardinality: '1', ownership: reference, help: {summary: Directed storage destination., businessMeaning: Selected eligible storage position., usage: Putaway optimization., cardinalityMeaning: Exactly one target., workflowRole: Zone/location constraints must be satisfied.}}
    - {name: handlingUnit, target: HandlingUnit, cardinality: 0..1, ownership: reference, help: {summary: Physical pallet/carton/tote moved as unit., businessMeaning: Supports scan-based execution., usage: WMS mobility., cardinalityMeaning: Optional for loose stock., workflowRole: Handling-unit location must reconcile.}}
    - {name: inventoryTransfer, target: InventoryTransfer, cardinality: '1', ownership: reference, help: {summary: Inventory relocation authorization/execution associated with putaway., businessMeaning: Separates warehouse task from stock ledger., usage: Reconciliation., cardinalityMeaning: Exactly one governed transfer., workflowRole: Completed task must reconcile to posted movement.}}
  invariants:
    - {id: PUTAWAY-001, rule: quantity must be greater than zero and source/target must differ.}
    - {id: PUTAWAY-002, rule: "Target must satisfy WarehouseZone, product, quality, capacity and handling constraints."}
    - {id: PUTAWAY-003, rule: COMPLETED requires attributable transfer/movement evidence and retries must be idempotent.}
    - {id: PUTAWAY-EXE-001, rule: "Quantity cannot be negative.", violatedWhen: "quantity != null and quantity < 0", message: "Quantity cannot be negative."}
  lifecycle:
    title: Putaway Lifecycle
    attribute: status
    states: [PLANNED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED, EXCEPTION]
    initial: PLANNED
    terminal: [COMPLETED, CANCELLED]
    transitions:
      - {from: PLANNED, to: RELEASED, action: release}
      - {from: RELEASED, to: IN_PROGRESS, action: start}
      - {from: IN_PROGRESS, to: COMPLETED, action: complete}
      - {from: RELEASED, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: RELEASED, action: resolve_exception}
      - {from: IN_PROGRESS, to: EXCEPTION, action: mark_exception}
      - {from: EXCEPTION, to: IN_PROGRESS, action: resolve_exception}
      - {from: PLANNED, to: CANCELLED, action: cancel}
      - {from: RELEASED, to: CANCELLED, action: cancel}
      - {from: IN_PROGRESS, to: CANCELLED, action: cancel}
      - {from: EXCEPTION, to: CANCELLED, action: cancel}
  workflows:
    - name: ExceptionRaised
      title: "Raise a task when a putaway is stopped"
      description: "When a putaway is exception, a high-priority task asks someone to resolve it."
      when: "status == \"EXCEPTION\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: resolve"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PUTAWAY-EXCEPTION-{{id}}"
              name: "Resolve putaway {{id}}"
              description: "Putaway {{id}} is now {{status}}. Find out why it stopped and move it on or close it."
              task_type: "USER"
              status: "CREATED"
              priority: "HIGH"
    - name: FollowUpRequired
      title: "Follow up when a putaway is ended"
      description: "When a putaway is cancelled, a task asks someone to settle what depended on it."
      when: "status == \"CANCELLED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PUTAWAY-FOLLOW-UP-{{id}}"
              name: "Follow up on putaway {{id}}"
              description: "Putaway {{id}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a putaway is done"
      description: "When a putaway is completed, a task asks someone to confirm the outcome."
      when: "status == \"COMPLETED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PUTAWAY-COMPLETED-{{id}}"
              name: "Confirm putaway {{id}}"
              description: "Putaway {{id}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: Directed inbound/staging-to-storage warehouse task.
    businessMeaning: Putaway says where stock should be stored; InventoryTransfer/InventoryMovement prove physical relocation.
    usage: Receiving, cross-dock exceptions, replenishment and storage optimization.
    relationshipContext: InventoryLocation/Zone define eligibility; HandlingUnit supports physical execution.
    lifecycle: Planned → released → in progress → completed, cancelled or exception.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PUTAWAY}
