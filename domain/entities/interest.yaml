entity:
  name: Interest
  namespace: cedm.domain
  kind: financial_accrual
  description: A governed interest accrual or charge calculated for an eligible financial balance, rate basis, and period.
  ui:
    icon: table
  identity: {key: interestId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: interestId, type: uuid, required: true, immutable: true, help: {summary: The identity of the interest record., usage: Generated by the interest run; postings and statements refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: The date and time as of which the interest was calculated., usage: 'Set by the run, normally the end of the accrual period; it decides the period the interest belongs to.'}}
    - name: calculationNumber
      type: string
      required: true
      unique: true
      maxLength: 40
      help:
        summary: The reference of the calculation.
        usage: Assigned when it is calculated; quoted on statements and postings.
        relationshipContext: Unique.
    - name: interestType
      type: enum
      required: true
      default: LOAN
      values:
        - LOAN
        - DEPOSIT
        - LATE_PAYMENT
        - CREDIT_LINE
        - INTERCOMPANY
      help:
        summary: What the interest is on.
        usage: Set by the run or person that calculates it; it decides whether the interest is income or expense.
        relationshipContext: Read with the balance it refers to.
        valueSemantics:
          LOAN: Interest the company pays on borrowing.
          DEPOSIT: Interest the company earns on money placed with a bank.
          LATE_PAYMENT: Interest charged to a customer who paid late.
          CREDIT_LINE: Interest on a drawn credit facility.
          INTERCOMPANY: Interest between group companies.
    - name: balance
      type: Money
      required: true
      help:
        summary: The balance the interest is computed on.
        usage: Taken from the loan, deposit or invoice for the period.
        relationshipContext: In the calculation's currency.
    - name: ratePercent
      type: decimal
      required: true
      precision: 9
      scale: 5
      help:
        summary: The annual rate applied, in percent.
        usage: Taken from the agreement or the late-payment policy.
        relationshipContext: For a floating rate, the rate in force for the period.
    - name: dayCountBasis
      type: enum
      required: true
      default: ACT_360
      values:
        - ACT_360
        - ACT_365
        - THIRTY_360
      help:
        summary: The convention for counting days when working out interest for the period.
        usage: Taken from the agreement; the same rate gives a different amount under each convention.
        valueSemantics:
          ACT_360: Actual days elapsed divided by 360.
          ACT_365: Actual days elapsed divided by 365.
          THIRTY_360: Each month counted as 30 days, divided by 360.
        relationshipContext: Changes the amount for the same rate.
    - name: periodStart
      type: date
      required: true
      help:
        summary: The first day of the period interest is computed for.
        usage: Set by the run.
        relationshipContext: Not later than the period end.
    - name: periodEnd
      type: date
      required: true
      help:
        summary: The last day of the period for which interest is calculated.
        usage: Set by the interest run; periods for the same balance must not overlap.
        relationshipContext: Periods for the same balance do not overlap.
    - name: days
      type: integer
      required: false
      help:
        summary: How many days the interest is computed for under the day-count basis.
        usage: Computed from the period.
        relationshipContext: Shown so the amount can be checked.
    - name: interestAmount
      type: Money
      required: true
      help:
        summary: The interest due for the period.
        usage: Computed as balance × rate × days ÷ basis; posted to the accounts.
        relationshipContext: Rounded to the currency's smallest unit.
    - name: postedAt
      type: datetime
      required: false
      help:
        summary: The date and time the interest was booked to the accounts.
        usage: Recorded when finance posts the calculation; empty while the interest is only calculated.
        relationshipContext: Present once posted.
    - name: status
      type: enum
      required: true
      default: CALCULATED
      values:
        - CALCULATED
        - POSTED
        - CANCELLED
        - REVERSED
      help:
        summary: Shows whether the calculated interest has been booked to the accounts.
        usage: Moved on by finance when it posts, cancels or reverses a calculation.
        relationshipContext: Only posted interest appears in the accounts.
        valueSemantics:
          CALCULATED: Worked out and waiting to be checked and posted.
          POSTED: Booked to the accounts.
          CANCELLED: Found wrong before posting and replaced by a new calculation.
          REVERSED: Posted, then undone by an opposite entry.
  relationships:
    - name: loan
      target: BankLoan
      cardinality: 0..1
      ownership: reference
      help:
        summary: The loan the interest is on.
        usage: Set for loan interest.
        cardinalityMeaning: At most one per calculation.
        context: The loan's statement lists its interest.
    - name: deposit
      target: Deposit
      cardinality: 0..1
      ownership: reference
      help:
        summary: The deposit the interest is on.
        usage: Set for deposit interest.
        cardinalityMeaning: At most one per calculation.
        context: Compared with the bank's interest credit.
    - name: invoice
      target: Invoice
      cardinality: 0..1
      ownership: reference
      help:
        summary: The invoice charged late-payment interest.
        usage: Set for late-payment interest.
        cardinalityMeaning: At most one per calculation.
        context: Charged to the invoice's customer.
    - name: currency
      target: Currency
      cardinality: "1"
      ownership: reference
      help:
        summary: The currency of the balance and the interest.
        usage: Taken from the balance.
        cardinalityMeaning: One per calculation.
        context: Balance and amount share it.
  invariants:
    - {id: INTEREST-001, rule: Finalized lifecycle or financial evidence must be corrected by explicit compensating or superseding records rather than silent history rewrite.}
    - {id: INTEREST-EXE-001, rule: "Period End must not be earlier than period start.", violatedWhen: "period_start != null and period_end != null and period_end < period_start", message: "Period End cannot be earlier than period start."}
    - {id: INTEREST-EXE-002, rule: "Rate Percent is a percentage between 0 and 100.", violatedWhen: "rate_percent != null and (rate_percent < 0 or rate_percent > 100)", message: "Rate Percent must be between 0 and 100."}
    - {id: INTEREST-EXE-003, rule: "A interest that is posted states when (posted at).", violatedWhen: "status == \"POSTED\" and posted_at == null", message: "Record posted at when the interest is posted."}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a interest is ended"
      description: "When a interest is cancelled or reversed, a task asks someone to settle what depended on it."
      when: "(status == \"CANCELLED\" or status == \"REVERSED\") and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "INTEREST-FOLLOW-UP-{{id}}"
              name: "Follow up on interest {{calculation_number}}"
              description: "Interest {{calculation_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
  help:
    summary: An interest accrual or charge calculated for an eligible balance, on a rate basis, for a period.
    businessMeaning: Interest turns time and balance into money. Recording each calculation, with its inputs and period, lets finance explain what was charged or earned and recompute it if the basis is challenged.
    usage: Produced by interest runs on loans, deposits and receivables; posted to the ledger; read by finance and customers.
    relationshipContext: Interest refers to the balance and rate it was computed from and to the ledger entries that record it.
    lifecycle: Finalised financial evidence is corrected by compensating or superseding records and never overwritten.
    example: Interest of 41.67 accrued for March on a 10,000 deposit at a 5% annual rate.
    commonExamples: Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
  lifecycle:
    title: Interest Lifecycle
    attribute: status
    states:
      - CALCULATED
      - POSTED
      - CANCELLED
      - REVERSED
    initial: CALCULATED
    terminal:
      - CANCELLED
      - REVERSED
    transitions:
      - from: CALCULATED
        to: POSTED
        action: post
      - from: CALCULATED
        to: CANCELLED
        action: cancel
      - from: POSTED
        to: REVERSED
        action: reverse
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INTEREST}
