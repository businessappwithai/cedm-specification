entity:
  name: Interest
  namespace: cedm.domain
  kind: financial_accrual
  description: A governed interest accrual or charge calculated for an eligible financial balance, rate basis, and period.
  ui:
    icon: table
  identity: {key: interestId, type: uuid, generated: true, immutable: true}
  attributes:
    - {name: interestId, type: uuid, required: true, immutable: true, help: {summary: The identity of the interest record., usage: Generated by the interest run; postings and statements refer to it.}}
    - {name: effectiveAt, type: datetime, required: false, help: {summary: The date and time as of which the interest was calculated., usage: 'Set by the run, normally the end of the accrual period; it decides the period the interest belongs to.'}}
  relationships: []
  invariants:
    - {id: INTEREST-001, rule: Finalized lifecycle or financial evidence must be corrected by explicit compensating or superseding records rather than silent history rewrite.}
  help:
    summary: An interest accrual or charge calculated for an eligible balance, on a rate basis, for a period.
    businessMeaning: Interest turns time and balance into money. Recording each calculation, with its inputs and period, lets finance explain what was charged or earned and recompute it if the basis is challenged.
    usage: Produced by interest runs on loans, deposits and receivables; posted to the ledger; read by finance and customers.
    relationshipContext: Interest refers to the balance and rate it was computed from and to the ledger entries that record it.
    lifecycle: Finalised financial evidence is corrected by compensating or superseding records and never overwritten.
    example: Interest of 41.67 accrued for March on a 10,000 deposit at a 5% annual rate.
    commonExamples: Enterprise fixed assets, equipment reliability, bank close, FX, deposits, interest, and secured lending.
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-INTEREST}
