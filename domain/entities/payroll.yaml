entity:
  name: Payroll
  namespace: cedm.domain
  kind: human_capital_transaction
  description: A governed payroll run or employee payroll result that converts approved employment, attendance, leave, compensation, and statutory inputs into auditable gross-to-net obligations without treating payment as the payroll calculation itself.
  ui:
    icon: file-text
  identity: {key: payrollId, type: uuid, generated: true, immutable: true}
  attributes:
  - {name: payrollId, type: uuid, required: true, immutable: true, help: {summary: "Uniquely identifies this payroll result so payments and journal entries can be traced to it.", businessMeaning: Identifies one governed payroll calculation independently of employee and payment., usage: "Payroll processing, finance, audit, and integration.", relationshipContext: Root identity for payroll evidence., requiredMeaning: Required.}}
  - {name: payrollNumber, type: string, required: true, unique: true, maxLength: 100, help: {summary: "The reference number payroll staff and employees use to find this pay calculation and its payslip.", businessMeaning: Identifies the payroll calculation or result operationally., usage: "Review, payslip correlation, finance, and audit.", relationshipContext: Distinct from Payment and JournalEntry references., requiredMeaning: Required.}}
  - {name: periodStart, type: date, required: true, help: {summary: "The first day of the pay period whose work, leave and pay this payroll covers.", businessMeaning: Defines the first date whose approved employment inputs belong to the calculation., usage: "Eligibility, attendance, leave, compensation, and reporting.", relationshipContext: Must not follow periodEnd., requiredMeaning: Required.}}
  - {name: periodEnd, type: date, required: true, help: {summary: "The last day of the pay period covered; it cannot fall before the period start.", businessMeaning: Defines the final date included in the calculation., usage: Payroll cutoff and reconciliation., relationshipContext: Must be on or after periodStart., requiredMeaning: Required.}}
  - {name: grossAmount, type: Money, required: true, help: {summary: "The total earnings for the period before any taxes or other deductions are taken off.", businessMeaning: Records total earnings recognized by the payroll calculation., usage: "Payroll review, finance, and reporting.", relationshipContext: Must reconcile with governed earning inputs., requiredMeaning: Required.}}
  - {name: netAmount, type: Money, required: true, help: {summary: "What the employee actually receives after taxes, contributions and other deductions are taken off.", businessMeaning: Establishes the payroll settlement obligation before Payment execution., usage: Payroll approval and payment instruction., relationshipContext: Payment settles this obligation but is separate evidence., requiredMeaning: Required.}}
  - name: status
    type: enum
    required: true
    default: DRAFT
    values: [DRAFT, CALCULATED, APPROVED, POSTED, PAID, REVERSED]
    help: {summary: "Shows how far the payroll has progressed: draft, calculated, approved, posted, paid, or reversed after posting.", businessMeaning: "Controls calculation, approval, accounting, settlement, and reversal.", usage: Payroll workflow and audit., relationshipContext: "PAID requires settlement evidence; POSTED requires accounting evidence.", valueSemantics: {DRAFT: Inputs are being prepared., CALCULATED: Gross-to-net calculation completed., APPROVED: Authorized for posting/settlement., POSTED: Accounting impact recorded., PAID: Settlement completed., REVERSED: Prior effects corrected through controlled reversal.}, requiredMeaning: Required.}
  relationships:
  - {name: employee, target: Employee, cardinality: "1", ownership: reference, help: {summary: Employee whose compensation is calculated., businessMeaning: Supplies employment identity and eligibility context., usage: "Payroll, reporting, and audit.", cardinalityMeaning: Exactly one employee owns this payroll result., workflowRole: Employment must be eligible for the period.}}
  - {name: employment, target: Employment, cardinality: '1', ownership: reference, help: {summary: Employment relationship governing the payroll result., businessMeaning: Supplies organizational and contractual employment context., usage: Eligibility and compensation interpretation., cardinalityMeaning: Exactly one applicable employment is required., workflowRole: Must overlap the payroll period.}}
  - {name: payments, target: Payment, cardinality: 0..*, ownership: reference, help: {summary: Settlement transactions paying the approved net obligation., businessMeaning: Separates payroll calculation from actual cash settlement., usage: Reconciliation and audit., cardinalityMeaning: Zero or many payments support partial/retry/reversal patterns., workflowRole: PAID requires reconciled settlement.}}
  - {name: journalEntries, target: JournalEntry, cardinality: 0..*, ownership: reference, help: {summary: Accounting entries generated from approved payroll., businessMeaning: Records ledger consequences separately from calculation., usage: Financial accounting and reconciliation., cardinalityMeaning: Zero or many controlled entries may exist., workflowRole: POSTED requires balanced attributable accounting evidence.}}
  - name: compensationTerms
    target: Compensation
    cardinality: 0..*
    ownership: reference
    help:
      summary: Effective compensation terms consumed or reconciled by this Payroll result.
      businessMeaning: Preserves the remuneration basis used for calculation without copying mutable HR policy into payroll history.
      usage: Payroll calculation audit, reconciliation and dispute analysis.
      cardinalityMeaning: Zero or many terms may apply when a payroll period crosses an effective-date change.
      workflowRole: Only compensation effective for the covered period may contribute to calculation.
  - name: attendanceRecords
    target: Attendance
    cardinality: 0..*
    ownership: reference
    help:
      summary: Approved attendance evidence consumed by this Payroll result.
      businessMeaning: Connects financial calculation to actual work or absence facts.
      usage: Payroll calculation, overtime, absence treatment and audit.
      cardinalityMeaning: Zero or many attendance records may contribute to the period.
      workflowRole: Payroll processing must preserve which approved evidence was consumed.
  - name: leaveRequests
    target: LeaveRequest
    cardinality: 0..*
    ownership: reference
    help:
      summary: Approved leave authorizations relevant to this Payroll result.
      businessMeaning: Provides policy authorization for paid or unpaid absence treatment.
      usage: Payroll calculation, reconciliation and audit.
      cardinalityMeaning: Zero or many leave requests may affect a payroll period.
      workflowRole: Leave effects must reconcile with actual attendance evidence and applicable policy.

  invariants:
  - {id: PAYROLL-001, rule: periodStart must not be after periodEnd and employment must be eligible for the applicable period.}
  - {id: PAYROLL-002, rule: "grossAmount and netAmount must be reproducible from governed earning, deduction, attendance, leave, compensation, and statutory inputs applicable to the period."}
  - {id: PAYROLL-003, rule: Payroll calculation does not itself move cash; settlement requires attributable Payment evidence.}
  - {id: PAYROLL-004, rule: POSTED payroll requires balanced attributable JournalEntry evidence and PAID requires reconciled Payment evidence.}
  - {id: PAYROLL-005, rule: Corrections after posting or payment use controlled reversal/recalculation evidence and do not destructively rewrite historical payroll.}
  - {id: PAYROLL-EXE-001, rule: "Period End must not be earlier than period start.", violatedWhen: "period_start != null and period_end != null and period_end < period_start", message: "Period End cannot be earlier than period start."}
  - {id: PAYROLL-EXE-002, rule: "Gross Amount cannot be negative.", violatedWhen: "gross_amount != null and gross_amount < 0", message: "Gross Amount cannot be negative."}
  lifecycle:
    title: Payroll Lifecycle
    attribute: status
    states: [DRAFT, CALCULATED, APPROVED, POSTED, PAID, REVERSED]
    initial: DRAFT
    terminal: [PAID, REVERSED]
    transitions:
      - {from: DRAFT, to: CALCULATED, action: mark_calculated}
      - {from: CALCULATED, to: APPROVED, action: approve}
      - {from: APPROVED, to: POSTED, action: post}
      - {from: POSTED, to: PAID, action: pay}
      - {from: POSTED, to: REVERSED, action: reverse}
  workflows:
    - name: FollowUpRequired
      title: "Follow up when a payroll is ended"
      description: "When a payroll is reversed, a task asks someone to settle what depended on it."
      when: "status == \"REVERSED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: follow up on"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PAYROLL-FOLLOW-UP-{{id}}"
              name: "Follow up on payroll {{payroll_number}}"
              description: "Payroll {{payroll_number}} is now {{status}}. Check the records that depended on it and tell the people affected."
              task_type: "USER"
              status: "CREATED"
              priority: "NORMAL"
    - name: CompletionConfirmed
      title: "Confirm when a payroll is done"
      description: "When a payroll is posted, a task asks someone to confirm the outcome."
      when: "status == \"POSTED\" and status != _previous_status"
      steps:
        - id: S1
          type: CreateEntity
          label: "Raise a task: confirm"
          properties:
            entity: Task
            as: taskId
            fields:
              code: "PAYROLL-COMPLETED-{{id}}"
              name: "Confirm payroll {{payroll_number}}"
              description: "Payroll {{payroll_number}} is now {{status}}. Check the outcome is what was agreed and close any open items."
              task_type: "USER"
              status: "CREATED"
              priority: "LOW"
  help:
    summary: "One payroll calculation for an employee and pay period, turning approved hours, leave, pay terms and statutory rules into gross pay, deductions and net pay, kept as auditable evidence of what is owed."
    businessMeaning: Payroll calculates employee compensation obligations; JournalEntry records accounting; Payment records settlement.
    usage: Human capital management, payroll operations, finance, compliance, employee service, and audit.
    relationshipContext: Employee and Employment provide eligibility; attendance and leave may supply time inputs; JournalEntry and Payment record separate downstream effects.
    lifecycle: Draft → calculated → approved → posted → paid, with controlled reversal.
    changePropagation: Changes to open-period employment/time/compensation inputs trigger recalculation; posted or paid history is corrected through controlled reversal.
    example: "Payroll PR-2026-09-0457 for employee Sam Patel, 1 to 30 September 2026, gross 4,200.00, net 3,118.40, posted and awaiting payment."
    workflowContext: "A payroll is drafted for the period, calculated from attendance, leave and compensation inputs, approved by payroll or HR, posted to the accounts, and then paid through payment runs; a posted payroll found to be wrong is reversed rather than edited, which raises a follow-up task."
specification: {version: 0.1.0, status: draft, identifier: CEDM-ENTITY-PAYROLL}
