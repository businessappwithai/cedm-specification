entity:
  name: Event
  namespace: cedm.domain
  kind: cross_domain_event
  description: A significant occurrence that can trigger business processing, notifications, workflows, integrations, or audit activity.
  ui:
    icon: activity
  identity:
    key: eventId
    type: uuid
    generated: true
    immutable: true
  attributes:
    - name: eventId
      type: uuid
      required: true
      immutable: true
      help:
        summary: The identity of the event.
        usage: Generated when published; consumers use it to avoid processing twice.
    - name: eventType
      type: string
      required: true
      maxLength: 200
      help:
        summary: The name of the kind of event, such as order.created.
        usage: Set by the publisher; consumers subscribe to types.
    - name: occurredAt
      type: datetime
      required: true
      help:
        summary: When the event happened.
        usage: Set by the publisher; events are ordered by it.
    - name: source
      type: string
      required: true
      maxLength: 300
      help:
        summary: The system or component that published the event.
        usage: Set by the publisher; used to trace where an event came from.
    - name: payload
      type: object
      required: false
      help:
        summary: The data describing the occurrence.
        usage: Structured content defined by the event type; read by consumers.
    - name: correlationId
      type: uuid
      required: false
      help:
        summary: An identifier shared by all events belonging to the same business flow.
        usage: Set by the originator and passed on; used to follow a flow end to end.
    - name: causationId
      type: uuid
      required: false
      help:
        summary: The identifier of the event or request that directly caused this one.
        usage: Set by the publisher; used to trace cause and effect.
  relationships:
    - name: actor
      target: Party
      cardinality: 0..1
      ownership: reference
      help:
        summary: The party that performed the action that produced the event.
        usage: Set where a person or system user is responsible.
        cardinalityMeaning: At most one actor; system-generated events may have none.
        workflowRole: Gives events accountability for audit.
  invariants:
    - id: EVENT-001
      rule: eventType and source are required for every event.
    - id: EVENT-002
      rule: an event is immutable after publication.
  help:
    summary: A significant occurrence that can trigger processing, notification, workflow, integration or audit.
    businessMeaning: Systems react to things that happen. An event states what happened, when, where it came from and who caused it, so other parts of the system can respond without being tightly coupled.
    usage: Published by the system or integrations when something noteworthy happens; consumed by workflows, notifications and audit.
    relationshipContext: An event may be caused by a Party (the actor); correlation and causation identifiers link related events.
    lifecycle: An event is immutable once published.
    example: Event "invoice.posted" from the billing service, caused by user finance.ops, correlated with the month-end run.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EVENT
