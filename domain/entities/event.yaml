entity:
  name: Event
  namespace: cedm.domain
  kind: cross_domain_event
  description: A significant occurrence that can trigger business processing, notifications, workflows, integrations, or audit activity.
  ui:
    icon: activity
    recordLabel: [eventType, occurredAt]
  identity:
    key: eventId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: eventId
    type: uuid
    required: true
    immutable: true
    help:
      summary: The permanent system identifier of the event record.
      usage: Assigned by the application when the record is created and never changed; integrations and links use it to find the record.
      relationshipContext: Other records that refer to a event store this identifier. The number or code people quote is a separate field.
  - name: eventType
    type: string
    required: true
    maxLength: 200
    help:
      summary: What happened, such as "TemperatureExceeded" or "UserLockedOut".
      usage: Subscribers choose events by type.
      relationshipContext: One name per kind of occurrence.
  - name: occurredAt
    type: datetime
    required: true
    help:
      summary: When it happened.
      usage: Events are processed and listed in this order.
      relationshipContext: Not the time it was received.
  - name: source
    type: string
    required: true
    maxLength: 300
    help:
      summary: Where the event came from, such as a system, device or service name.
      usage: Lets operators trace the event to its origin.
      relationshipContext: Set by the raising system.
  - name: payload
    type: object
    required: false
    help:
      summary: The details of the event, as structured data.
      usage: Read by whatever processes the event.
      relationshipContext: Its shape depends on the event type.
  - name: correlationId
    type: uuid
    required: false
    help:
      summary: An identifier shared by events that belong to one business case.
      usage: Lets the events of one case be followed together.
      relationshipContext: Set by the raising system.
  - name: causationId
    type: uuid
    required: false
    help:
      summary: The identifier of the event that caused this one.
      usage: Lets chains of events be traced back to their start.
      relationshipContext: Empty for events that start a chain.
  relationships:
  - name: actor
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: The person or organization whose action raised the event.
      usage: Set when the event comes from a user's action.
      cardinalityMeaning: At most one.
      context: Empty for events raised by systems or devices.
  invariants:
  - {id: EVENT-001, rule: Events are append-only; they are never changed.}
  help:
    summary: Something that happened that other processes need to react to, such as an order shipped or a threshold crossed.
    relationshipContext: The entity participates in a wider business graph through relationships with Party. These relationships provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    usage: Raised by applications and devices when something significant happens — a sensor threshold, a system alert, a user action — and consumed by workflows, notifications and integrations; kept for audit and analysis.
    lifecycle: An event is recorded once and never changed; what is done about it is recorded by the processes it starts.
    example: Event 'TemperatureExceeded' from sensor COLD-1-T03 at 02:14:07, payload 9.6 °C (limit 8 °C), correlation COLD-1, raised a cold-chain incident.
    businessMeaning: Events trigger workflows, notifications and integrations, and form an audit trail of what happened when.
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EVENT
