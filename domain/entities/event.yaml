entity:
  name: Event
  namespace: cedm.domain
  kind: cross_domain_event
  description: A significant occurrence that can trigger business processing, notifications, workflows, integrations, or audit
    activity.
  ui:
    icon: activity
  identity:
    key: eventId
    type: uuid
    generated: true
    immutable: true
  attributes:
  - name: eventId
    type: uuid
    required: true
    immutable: true
    help:
      summary: Identifies the event record associated with this Event. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Lets each occurrence be processed and referenced exactly once, so a notification or integration does not act on the same happening twice."
  - name: eventType
    type: string
    required: true
    maxLength: 200
    help:
      summary: Captures the business meaning of event type for the Event. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Names what happened, such as order placed or payment failed, which decides which workflows and notifications respond to it."
  - name: occurredAt
    type: datetime
    required: true
    help:
      summary: Records when the occurred event occurred. It establishes chronology, supports auditability, and helps coordinate
        related lifecycle and process activities.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "When the occurrence actually took place, used to put events in order and to judge whether reactions were timely."
  - name: source
    type: string
    required: true
    maxLength: 300
    help:
      summary: Captures the business meaning of source for the Event. It is interpreted together with the entity's other attributes
        and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      requiredMeaning: Required because the business model cannot reliably interpret the record for its declared purpose without
        this value.
      businessMeaning: "Which application, system or channel reported the occurrence, helping staff know where to look when investigating it."
  - name: payload
    type: object
    required: false
    help:
      summary: Captures the business meaning of payload for the Event. It is interpreted together with the entity's other
        attributes and relationships to support the processes that manage this record.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "The details carried with the occurrence, such as the order amount or customer, that the processes reacting to it need to do their work."
  - name: correlationId
    type: uuid
    required: false
    help:
      summary: Identifies the correlation record associated with this Event. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Groups all events that belong to the same business conversation or transaction, so the full chain can be followed end to end."
  - name: causationId
    type: uuid
    required: false
    help:
      summary: Identifies the causation record associated with this Event. The identifier connects this record to the corresponding
        CEDM entity so related processes can resolve the correct business object.
      usage: Used when creating, reviewing, searching, validating, reporting on, or integrating Event records, where applicable.
      relationshipContext: Its meaning is specific to Event; it must be interpreted with the entity's relationships, lifecycle,
        and business rules rather than as an isolated technical value.
      optionalMeaning: Optional because the business concept can remain valid when this value is not yet known or is not applicable.
      businessMeaning: "Points to the earlier event that directly led to this one, showing cause and effect when tracing a problem."
  relationships:
  - name: actor
    target: Party
    cardinality: 0..1
    ownership: reference
    help:
      summary: Connects Event to Party so related business context can be navigated and enforced.
      usage: Used when processes need to find or reason about Party records associated with a Event.
      cardinalityMeaning: The declared cardinality 0..1 expresses how many related records may participate in the relationship.
      context: The relationship is part of the CEDM semantic graph and is interpreted together with source and target entities,
        ownership, conditions, and invariants.
  invariants:
  - id: EVENT-001
    rule: eventType and source are required for every event.
  - id: EVENT-002
    rule: an event is immutable after publication.
  help:
    summary: "A record that something significant happened, such as an order being placed or a payment failing, kept so workflows, notifications, integrations and auditors can react to and trace it."
    businessMeaning: Event is a business concept with its own identity and lifecycle. It captures information that must remain
      understandable independently of a database, API, or user interface.
    usage: Used by business processes, transactions, forms, reports, integrations, and domain capabilities that create, find,
      change, or relate Event records.
    relationshipContext: The entity participates in a wider business graph through relationships with Party. These relationships
      provide the context needed to interpret the record rather than treating its fields as isolated database columns.
    lifecycle: The entity lifecycle is governed by its status, invariants, and related business processes. State changes must
      preserve the declared business meaning and relationships.
    example: A typical Event record represents one identifiable business occurrence or master-data object that can be referenced
      by related CEDM processes.
    workflowContext: "An event is recorded the moment a business action occurs in the application or an outside system; it is then picked up by workflows, notifications and integrations that react to it, and later read by auditors and support staff tracing what happened and why."
specification:
  version: 0.1.0
  status: draft
  identifier: CEDM-ENTITY-EVENT
