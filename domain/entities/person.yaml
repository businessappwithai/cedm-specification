entity:
  name: Person
  namespace: cedm.domain
  kind: party_specialization
  extends: Party
  description: A natural person participating in business activities as a specialization of Party. Person supplies intrinsic individual identity; business participation is represented through PartyRole and specialized roles.
  ui:
    icon: user
  identity: {key: personId, type: uuid, generated: true, immutable: true}
  attributes:
  - name: personId
    type: uuid
    required: true
    immutable: true
    help: {summary: "The permanent reference to this individual's personal details, shared by every role they hold.", usage: individual identity processes, relationshipContext: Party.partyId remains canonical, workflowRole: identifies person-specific record, requiredMeaning: required for specialization traceability., businessMeaning: "Lets employee, customer, contact and patient records all point to one individual, so personal details are corrected in one place and the person's history is never split across duplicates."}
  - name: partyId
    type: reference
    target: Party
    required: true
    unique: true
    immutable: true
    help:
      summary: Canonical Party identity represented by this Person specialization.
      usage: Connects person-specific data to common Party identity and all PartyRoles.
      relationshipContext: Exactly one Person specialization may represent a Party classified as PERSON.
      workflowRole: Ensures transactions and roles use one stable person identity.
      requiredMeaning: Required to prevent duplicate identity.
      businessMeaning: "Connects the person to their party record, which carries addresses, contact methods and the business roles they play; each party can have only one person record."
  - name: title
    type: string
    required: false
    maxLength: 50
    help: {summary: "The courtesy or professional title used when addressing the person, such as Dr or Ms.", usage: documents and presentation, relationshipContext: presentation attribute, workflowRole: supports person display, optionalMeaning: optional., businessMeaning: "Used in letter salutations, envelopes and formal communication so the person is addressed correctly and respectfully."}
  - name: givenName
    type: string
    required: true
    maxLength: 150
    help: {summary: "The person's first or given name as it appears on their official documents.", usage: identity and documents, relationshipContext: intrinsic person identity, workflowRole: identification, requiredMeaning: required., businessMeaning: "Required with the family name to identify the person on contracts, payslips, invoices and identity checks, and to tell apart people with the same surname."}
  - name: middleName
    type: string
    required: false
    maxLength: 150
    help: {summary: "Any middle name or names the person has, when they choose to provide them.", usage: identity and documents, relationshipContext: intrinsic person identity, workflowRole: identification, optionalMeaning: optional., businessMeaning: "Helps distinguish people with the same first and last names and is needed where legal documents, travel bookings or background checks require the full name."}
  - name: familyName
    type: string
    required: true
    maxLength: 150
    help: {summary: "The person's surname or family name as it appears on their official documents.", usage: identity and documents, relationshipContext: intrinsic person identity, workflowRole: identification, requiredMeaning: required., businessMeaning: "Required with the given name; it is the main name used to sort and search people and must match identity documents for payroll, contracts and compliance checks."}
  - name: preferredName
    type: string
    required: false
    maxLength: 150
    help: {summary: "The name the person likes to be called, which may differ from their legal name.", usage: communication and UI, relationshipContext: presentation not canonical identity, workflowRole: human interaction, optionalMeaning: optional., businessMeaning: "Shown in greetings, directories and everyday communication so staff address the person as they wish, while legal documents keep using the official name."}
  - name: dateOfBirth
    type: date
    required: false
    help: {summary: "The person's date of birth, used to confirm identity and calculate their age.", usage: processes requiring verified individual identity, relationshipContext: sensitive person attribute subject to access policy, workflowRole: eligibility/verification where applicable, optionalMeaning: optional., businessMeaning: "Used to confirm identity, check age rules such as minimum working age or patient dosing, and distinguish people who share a name."}
  - name: gender
    type: enum
    required: false
    values:
    - FEMALE
    - MALE
    - NON_BINARY
    - OTHER
    - UNSPECIFIED
    help:
      summary: Gender classification where required by the business process
      usage: permitted business processes only
      relationshipContext: person attribute and not role
      workflowRole: process-specific
      optionalMeaning: optional.
      valueSemantics:
        FEMALE: The gender of the person is female; set it when that is what the business means for this record.
        MALE: The gender of the person is male; set it when that is what the business means for this record.
        NON_BINARY: The gender of the person is non binary; set it when that is what the business means for this record.
        OTHER: The gender of the person is other; set it when that is what the business means for this record.
        UNSPECIFIED: The gender of the person is unspecified; set it when that is what the business means for this record.
      businessMeaning: "Recorded only where a process genuinely needs it, such as clinical care, statutory reporting or forms of address; the person can choose non-binary, other or unspecified."
  - name: nationalityId
    type: reference
    target: Country
    required: false
    help: {summary: "The country whose citizenship the person holds, used for travel, work and compliance checks.", usage: "Chosen from the list of countries; used by identity and compliance processes.", relationshipContext: "Not Party identity; process-specific.", optionalMeaning: "Optional.", businessMeaning: "Drives right-to-work and visa checks, sanctions screening, tax and regulatory reporting, and travel documentation for the person."}
  relationships:
  - name: party
    target: Party
    cardinality: '1'
    ownership: reference
    inverse: person
    help:
      summary: Canonical Party represented by this Person specialization.
      usage: Navigates to common party identity and PartyRoles.
      cardinalityMeaning: Exactly one Party.
      workflowRole: Connects intrinsic person identity to business participation.
  - name: employerOrganizations
    target: Organization
    cardinality: 0..*
    ownership: reference
    help:
      summary: Organizations associated with the person as employers or organizational contexts.
      usage: Supports employment and organizational relationships.
      cardinalityMeaning: Zero or many.
      workflowRole: Provides context for employment/worker workflows; it does not itself establish an Employee role.
  invariants:
  - {id: PERSON-001, rule: partyType must equal PERSON for the referenced Party.}
  - {id: PERSON-002, rule: givenName and familyName must be present.}
  - {id: PERSON-003, rule: One Party cannot have multiple Person specializations.}
  - {id: PERSON-004, rule: Person status/attributes must not be used as a substitute for PartyRole eligibility.}
  - {id: PERSON-005, rule: Changes to Person identity attributes must preserve historical transaction snapshots or references according to the transaction's audit policy.}
  audit: {enabled: true}
  tags: [person, party, specialization, identity]
  help:
    summary: "An individual human being known to the business, holding their name, birth date and nationality once, so the same person can act as customer, employee, contact or patient without duplicate records."
    businessMeaning: Party identifies the individual; Person supplies intrinsic individual details; PartyRole determines how the person participates.
    usage: Used for customers, employees, agents, owners, contractors, and other roles without duplicating individual identity.
    relationshipContext: Party → Person establishes intrinsic identity; Party → PartyRole establishes business participation; Organization links provide employment or other organizational context.
    workflowContext: Create/maintain Party → create Person specialization → establish PartyRole → apply role-specific qualification/authorization → execute transactions. Ending one role does not end the person or other roles.
    lifecycle: Person specialization follows Party identity while role eligibility remains independently controlled by PartyRole.
    example: One individual may be both an Employee and Customer. The same Party and Person specialization is reused while separate PartyRoles govern employment and customer processes.
specification: {version: 0.2.0, status: draft, identifier: CEDM-ENTITY-PERSON}
