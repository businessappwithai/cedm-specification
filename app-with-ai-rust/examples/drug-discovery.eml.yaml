stateMachines:
  # ---- Section 5: Workflow — experiment lifecycle (state machine) -------------
  - name: ExperimentLifecycle
    title: Experiment Lifecycle
    entity: Experiment
    states: [draft, submitted, in_review, approved, in_progress, completed, on_hold, cancelled]
    initial: draft
    final: [completed, cancelled]
    transitions:
      - from: draft
        to: submitted
        trigger: submit
      - from: submitted
        to: in_review
        trigger: assign_reviewer
      - from: submitted
        to: draft
        trigger: return_to_draft
      - from: in_review
        to: approved
        trigger: approve
      - from: in_review
        to: draft
        trigger: reject
      - from: approved
        to: in_progress
        trigger: start
      - from: in_progress
        to: completed
        trigger: complete
      - from: in_progress
        to: on_hold
        trigger: pause
      - from: on_hold
        to: in_progress
        trigger: resume
      - from: in_progress
        to: cancelled
        trigger: cancel
      - from: approved
        to: cancelled
        trigger: cancel
  # ---- Section 6: Workflow — CAPA lifecycle (state machine) ------------------
  - name: CapaLifecycle
    title: CAPA Lifecycle
    entity: CAPA
    states: [open, in_progress, pending_verification, closed, cancelled]
    initial: open
    final: [closed, cancelled]
    transitions:
      - from: open
        to: in_progress
        trigger: assign
      - from: in_progress
        to: pending_verification
        trigger: submit_for_review
      - from: pending_verification
        to: closed
        trigger: verify_effective
      - from: pending_verification
        to: in_progress
        trigger: reopen
      - from: in_progress
        to: cancelled
        trigger: cancel
sagas:
  # ## Critical deviation escalation (saga)

  # A deviation that turns out to be critical does not just change status: it has
  # to open a CAPA, put a resolution date on it, and escalate the deviation itself.
  # That is three tables in one process, which is what `kind: saga` is for — and
  # what a hook cannot express, because a hook fires on one entity.
  - name: CriticalDeviationEscalation
    title: Critical Deviation Escalation
    entity: DeviationReport
    trigger: rule
    steps:
      - id: B
        type: Formula
        label: Stage base days
        properties:
          target: baseDays
          operation: set
          value: "3"
      - id: B2
        type: Decision
        label: Classify by severity
        properties:
          publish: baseDays
          decisionTable: "{\"hitPolicy\":\"first\",\"inputs\":[{\"id\":\"i1\",\"name\":\"Severity\",\"field\":\"severity\"}],\"outputs\":[{\"id\":\"o1\",\"name\":\"Base days\",\"field\":\"baseDays\"}],\"rules\":[{\"_id\":\"critical\",\"i1\":\"'critical'\",\"o1\":\"1\"},{\"_id\":\"major\",\"i1\":\"'major'\",\"o1\":\"2\"}]}"
      - id: C
        type: Formula
        label: Compute resolution days
        properties:
          target: resolutionDays
          source: baseDays
          operation: multiply
          operand: "7"
      - id: D
        type: CreateEntity
        label: Open a CAPA
        properties:
          entity: bus_capa
          as: newCapaId
          fields: '{"title":"CAPA for deviation {{id}}","status":"open","root_cause_category":"under-review","deviation_report_id":"{{id}}","remediation_owner_id":"{{reported_by_id}}","required_resolution_date":"2026-12-31"}'
      - id: E
        type: UpdateEntity
        label: Escalate the deviation
        properties:
          field: status
          value: escalated
