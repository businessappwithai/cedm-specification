    event: customValidate
    handler: validateSmilesFormat
    fields: [smiles]
  - entity: Compound
    event: beforeCreate
    handler: generateInchiKey
    fields: [inchi_key]
  - entity: Compound
    event: beforeCreate
    handler: computeMolecularWeight
    fields: [molecular_weight]
  - entity: Compound
    event: afterCreate
    handler: indexForSearch
  - entity: Compound
    event: afterCreate
    handler: notifyRegistrationTeam
  - entity: Experiment
    event: beforeUpdate
    handler: snapshotPreviousState
  - entity: Experiment
    event: customValidate
    handler: enforceGmpFields
  - entity: Experiment
    event: afterUpdate
    handler: emitWorkflowEvent
  - entity: Experiment
    event: afterUpdate
    handler: generateCryptographicSignature
  - entity: DeviationReport
    event: beforeCreate
    handler: timestampAnomaly
    fields: [anomaly_timestamp]
  - entity: DeviationReport
    event: customValidate
    handler: requireDescription
    fields: [anomaly_description]
  - entity: DeviationReport
    event: afterCreate
    handler: triggerCapaIfCritical
  - entity: DeviationReport
    event: afterCreate
    handler: notifyQualityTeam
hookFlows:
  # ---- Section 7: Workflow — compound registration hooks ---------------------
  - name: CompoundRegistration
    title: Compound Registration
    entity: Compound
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate SMILES
      - id: C
        event: customValidate
        handler: validateSmilesFormat
      - id: D
        event: beforeCreate
        handler: generateInchiKey
      - id: E
        event: beforeCreate
        handler: computeMolecularWeight
      - id: F
        label: Process Compound
      - id: G
        event: afterCreate
        handler: indexForSearch
      - id: H
        event: afterCreate
        handler: notifyRegistrationTeam
      - id: I
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
      - from: H
        to: I
  # ---- Section 8: Workflow — experiment audit trail hooks --------------------
  - name: ExperimentAuditTrail
    title: Experiment Audit Trail
    entity: Experiment
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate Request
      - id: C
        event: beforeUpdate
        handler: snapshotPreviousState
      - id: D
        event: customValidate
        handler: enforceGmpFields
      - id: E
        label: Process Experiment
      - id: F
        event: afterUpdate
        handler: emitWorkflowEvent
      - id: G
        event: afterUpdate
        handler: generateCryptographicSignature
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
  # ---- Section 9: Workflow — deviation report hooks -------------------------
  - name: DeviationReportHooks
    title: Deviation Report Hooks
    entity: DeviationReport
    nodes:
      - id: A
        label: Client Request
      - id: B
        label: Validate
      - id: C
        event: beforeCreate
        handler: timestampAnomaly
      - id: D
        event: customValidate
        handler: requireDescription
      - id: E
        label: Process Deviation
      - id: F
        event: afterCreate
        handler: triggerCapaIfCritical
      - id: G
        event: afterCreate
        handler: notifyQualityTeam
      - id: H
        label: Response
    edges:
      - from: A
        to: B
      - from: B
        to: C
      - from: C
        to: D
      - from: D
        to: E
      - from: E
        to: F
      - from: F
        to: G
      - from: G
        to: H
