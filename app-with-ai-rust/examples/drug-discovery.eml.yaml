# ============================================================================
# Drug Discovery Experiment Operations Platform
# Complete model: entities · business rules · workflows
# Every construct is drawn by the model viewer from this document.

# Entities: Compound, CompoundAlias, Experiment, ExperimentMetadata,
#           User, Team, Sample, ChemicalInventory, Instrument, InstrumentBooking,
#           Vendor, VendorRequest, WorkflowEvent, DeviationReport, CAPA,
#           StabilityTest, StabilityPull

# Generate: bun run generate:tanstack -- -i examples/drug-discovery.eml.yaml \
#            -o generated-projects/drug-discovery-clone -n drug-discovery-clone
# ============================================================================

# ---- Section 1: ERD --------------------------------------------------------

eml: "1.0"
name: Drug Discovery Core
version: 1.0.0
enums:
  # ---- Enumerations ----------------------------------------------------------
  - name: CompoundRegistrationStatus
    values: [draft, pending_review, approved, rejected, withdrawn]
  - name: CompoundClass
    values: [small_molecule, biologic, peptide, nucleotide, natural_product]
  - name: CompoundAliasType
    values: [iupac, common_name, tradename, cas_number, cas_name, inchi]
  - name: ExperimentStatus
    values: [draft, submitted, in_review, approved, in_progress, completed, cancelled, on_hold]
  - name: ExperimentFormType
    values: [protocol, result, amendment, deviation_note]
  - name: SampleStatus
    values: [available, reserved, consumed, exhausted, disposed]
  - name: SamplePhysicalState
    values: [solid, liquid, solution, suspension, lyophilized]
  - name: ChemicalStatus
    values: [in_stock, low_stock, ordered, out_of_stock, quarantined, disposed]
  - name: HazardClass
    values: [flammable, toxic, corrosive, oxidizer, carcinogen, none]
  - name: InstrumentType
    values: [hplc, mass_spectrometer, nmr, microscope, centrifuge, flow_cytometer]
  - name: CalibrationStatus
    values: [calibrated, due_soon, overdue, under_maintenance, decommissioned]
  - name: BookingStatus
    values: [pending, confirmed, in_use, completed, cancelled]
  - name: VendorType
    values: [cro, supplier, testing_lab, logistics, consultant]
  - name: SlaTier
    values: [standard, priority, enterprise]
  - name: VendorRequestStatus
    values: [draft, submitted, under_review, approved, in_progress, delivered, cancelled]
  - name: DeviationSeverity
    values: [minor, major, critical, catastrophic]
  - name: DeviationStatus
    values: [open, under_investigation, resolved, closed]
  - name: CapaStatus
    values: [open, in_progress, pending_verification, closed, cancelled]
  - name: CapaRootCauseCategory
    values: [equipment_failure, process_deviation, human_error, environmental, supplier_issue, unknown]
  - name: StabilityTestStatus
    values: [planned, in_progress, completed, aborted]
  - name: StabilityPullStatus
    values: [scheduled, completed, missed, cancelled]
  - name: UserRole
    values: [lab_manager, researcher, quality_assurance, compliance_officer, technician, administrator]
categories:
  # ---- Entity categories ------------------------------------------------------
  # Group entities into dashboard sections. Rendered one block per category,
  # ordered alphabetically by name.
  - name: Compound Registry
    description: Compound structures, identifiers and aliases
    icon: FlaskConical
    color: "#6366f1"
    entities: [Compound, CompoundAlias]
  - name: Experiments
    description: Experiment planning, execution and captured results
    icon: Microscope
    color: "#0ea5e9"
    entities: [Experiment, ExperimentMetadata, WorkflowEvent]
  - name: Inventory and Samples
    description: Physical samples and chemical stock on hand
    icon: Boxes
    color: "#14b8a6"
    entities: [Sample, ChemicalInventory]
  - name: Instruments
    description: Laboratory instruments and their bookings
    icon: Cpu
    color: "#f59e0b"
    entities: [Instrument, InstrumentBooking]
  - name: Quality and Compliance
    description: Deviations, corrective actions and stability programmes
    icon: ShieldCheck
    color: "#ef4444"
    entities: [DeviationReport, CAPA, StabilityTest, StabilityPull]
  - name: Suppliers
    description: Vendors and outsourced work requests
    icon: Truck
    color: "#8b5cf6"
    entities: [Vendor, VendorRequest]
  - name: People and Teams
    description: Users, teams and organisational structure
    icon: Users
    color: "#64748b"
    default: true
    entities: [User, Team]
entities:
  # What each entity is drawn with on the dashboard, in its window heading and
  # in the navigation. lucide names (https://lucide.dev/icons); note
  # `flask-conical` — lucide has no `flask`, which is the documented trap.
  - name: Compound
    icon: flask-conical
    attributes:
      - name: id
        type: string
        pk: true
      - name: smiles
        type: string
        unique: true
      - name: molecular_weight
        type: decimal
        optional: true
      - name: inchi_key
        type: string
        optional: true
      - name: formula
        type: string
        optional: true
      - name: compound_class
        type: string
        optional: true
        enum: CompoundClass
      - name: registration_status
        type: string
        enum: CompoundRegistrationStatus
      - name: registered_by_id
        type: string
        fk: true
    indexes:
      - columns: [smiles]
        unique: true
  - name: CompoundAlias
    attributes:
      - name: id
        type: string
        pk: true
      - name: compound_id
        type: string
        fk: true
      - name: alias_name
        type: string
      - name: alias_type
        type: string
        enum: CompoundAliasType
  - name: Experiment
