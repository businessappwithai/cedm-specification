# EML — Generate & Publish
#
# Point this at a model published online (`*.eml.yaml` or `*.cedm.yaml`) and a
# target GitHub repository. It validates the model, generates the application
# with the `eml` CLI and publishes the generated source to the target
# repository.
#
#   tanstack-astryx-loco  the full application: a Loco.rs backend crate, a
#                         TanStack Start + Astryx front end, both test suites,
#                         Dockerfiles and docker-compose
#   node-rest             a dependency-free node:http application over a JSON
#                         datastore (with --docker, a Dockerfile and compose)
#
# Required secret:
#   EML_PUBLISH_TOKEN  A GitHub Personal Access Token with `repo` and `workflow`
#                      scopes (workflow scope is needed to push the generated
#                      .github/workflows into the target repository).
name: EML — Generate & Publish

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "URL of the model to generate from (*.eml.yaml or *.cedm.yaml)"
        required: true
      target_repo:
        description: "Target repository to publish to (owner/repo or repo)"
        required: true
      app_name:
        description: "Application name"
        required: false
        default: "eml-app"
      stack:
        description: "Target stack"
        type: choice
        options:
          - tanstack-astryx-loco
          - node-rest
        default: tanstack-astryx-loco
      visibility:
        description: "Visibility of the created target repository"
        type: choice
        options:
          - private
          - public
        default: private

permissions:
  contents: read

jobs:
  generate-and-publish:
    name: Generate from ${{ inputs.model_url }} → ${{ inputs.target_repo }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the model
        env:
          MODEL_URL: ${{ inputs.model_url }}
        run: |
          case "$MODEL_URL" in
            *.cedm.yaml) file=model.cedm.yaml ;;
            *.eml.yaml)  file=model.eml.yaml ;;
            *) echo "::error::The model must be a *.eml.yaml or *.cedm.yaml document."; exit 1 ;;
          esac
          curl -fSL "$MODEL_URL" -o "$file"
          echo "MODEL_FILE=$file" >> "$GITHUB_ENV"
          echo "----- $file -----"
          head -n 40 "$file"

      - name: Validate the model
        run: bun language/cli/eml.ts validate -i "$MODEL_FILE"

      # The Loco target is generated from templates alone: `loco new` would only
      # add the framework's own CI workflow and rustfmt config, and installing
      # its CLI here is a compile measured in minutes.
      - name: Generate and publish the application
        env:
          EML_PUBLISH_TOKEN: ${{ secrets.EML_PUBLISH_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          STACK: ${{ inputs.stack }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          if [ -z "${EML_PUBLISH_TOKEN}" ]; then
            echo "::error::EML_PUBLISH_TOKEN secret is not set (needs repo + workflow scopes)."
            exit 1
          fi
          extra=()
          [ "$STACK" = "tanstack-astryx-loco" ] && extra+=(--skip-cli-scaffold)
          bun language/cli/eml.ts generate \
            -i "$MODEL_FILE" \
            -o generated-app \
            --name "$APP_NAME" \
            --stack "$STACK" \
            --docker \
            --force \
            "${extra[@]}" \
            --github "$TARGET_REPO" \
            --github-token "${EML_PUBLISH_TOKEN}" \
            ${{ inputs.visibility == 'public' && '--public' || '--private' }}

      - name: Summary
        if: always()
        env:
          MODEL_URL: ${{ inputs.model_url }}
        run: |
          {
            echo "### EML generation"
            echo "- Model: $MODEL_URL"
            echo "- Stack: ${{ inputs.stack }}"
            echo "- Target repo: ${{ inputs.target_repo }} (${{ inputs.visibility }})"
          } >> "$GITHUB_STEP_SUMMARY"
